                - { id: "wrong1", text: "sí, pero de niño no estudio mucho" }
                - { id: "wrong2", text: "sí, pero de niño no estudié mucho" }
              correctOptionId: "right"
              audioText: "sí, pero de niño no estudiaba mucho"
            replyGloss: "Yes, but as a child I didn't study a lot."
            explanation: "«de niño» calls for the imperfect: «estudiaba», not «estudio» (that stays in today) or «estudié» (a one-time preterite — this lesson keeps to present vs. imperfect only)."
