      - kind: speakLit
        id: l3-sp-win
        es: "somos amigos y vivimos juntos"
        en: "We are friends and we live together"
        atoms: ["somos", "amigo", "vivimos", "juntos"]


  # ── L4 · «Ustedes» — ustedes, restaurante. The you-all pronoun, which
  #    takes the ellos ending (pin E3: «vosotros» is never printed).
  #    Debuts: «restaurante» on l4-im-restaurante (imageMcq, first
  #    exposure); «ustedes» on the card, cashed on the speakLit after.
  - n: 4
    template: free
    title: "Ustedes"
    description: "Talking TO a group. Spanish gives the group its own word — and lets it borrow the ending you learned two lessons ago."
    steps:
      - kind: map
        id: l4-map-ustedescomen
        tokens: ["ustedes", "comen", "en", "el", "restaurante"]
        pairs:
          - { en: "you all", tokenIndex: 0 }
          - { en: "eat", tokenIndex: 1 }
          - { en: "in", tokenIndex: 2 }
          - { en: "the", tokenIndex: 3 }
          - { en: "restaurant", tokenIndex: 4 }
        audioText: "ustedes comen en el restaurante"
        revealNote: "«comen» — the they ending from lesson two. But the word in front is new: «ustedes», you all. When you talk TO a group, the verb takes exactly the ending it takes for they. And «el restaurante» is a word you can read already."
        tokenGenders: { 3: "m", 4: "m" }
      - kind: imageMcq
        id: l4-im-restaurante
        target: { surface: "el restaurante", meaningEn: "the restaurant", emoji: "🍴" }
        distractors:
          - { surface: "la tienda", emoji: "🏪" }
          - { surface: "el mercado", emoji: "🛒" }
          - { surface: "la escuela", emoji: "🏫" }
      - kind: info
        id: l4-info-ustedes
        title: "You all — «ustedes»"
        body: "«tú» is one person in front of you. For a group in front of you, the word is «ustedes», and the verb takes the -n ending — the same one «ellos» takes: «¿ustedes hablan español?» — do you all speak Spanish?; «ustedes son mis amigos» — you all are my friends; «ustedes comen en el restaurante» — you all eat at the restaurant. So -n does two jobs: they, and you all. The pronoun is what tells them apart, which is why «ustedes» is usually said out loud."
      - kind: speakLit
        id: l4-sp-ustedeshablan
        es: "¿ustedes hablan español?"
        en: "Do you all speak Spanish?"
        atoms: ["ustedes", "hablan", "español"]
      - kind: buildLit
        id: l4-b-ustedescomenenelrestaurante
        es: "ustedes comen en el restaurante"
        en: "You all eat at the restaurant"
        atoms: ["ustedes", "comen", "restaurante"]
        tiles: ["comemos", "come"]
      - kind: clozeLit
        id: l4-c-ustedesviven
        es: "ustedes viven aquí"
        en: "You all live here"
        blank: "viven"
        options: ["viven", "vivimos", "vives"]
        atoms: ["ustedes", "viven", "aquí"]
        why: "«ustedes» takes the -n ending: «viven». «vivimos» is we, «vives» is one you."
      - kind: listenCompLit
        id: l4-lc-ustedessonestudiantes
        es: "¿ustedes son estudiantes?"
        en: "Are you all students?"
        atoms: ["ustedes", "son", "estudiante"]
        distractorsEn:
          - "Are you a student?"
          - "Are they students?"
          - "Are you all teachers?"
      - kind: buildLit
        id: l4-b-ustedessonmisamigos
        es: "ustedes son mis amigos"
        en: "You all are my friends"
        atoms: ["ustedes", "son", "amigo"]
        tiles: ["somos", "eres"]
      - kind: mcq
        id: l4-q-ustedeshablan
        prompt: "Which one means 'you all speak'?"
        correct: "ustedes hablan"
        distractors: ["ustedes hablamos", "ustedes hablas", "ustedes habla"]
        atoms: ["ustedes", "hablan"]
        why: "«ustedes» borrows the they ending: «hablan». -mos is we, -as is one you, -a is he or she."
      - kind: audioWimcq
        id: l4-ear-restaurante
        target: { surface: "el restaurante", emoji: "🍴" }
        distractors:
          - { surface: "el mercado", emoji: "🛒" }
          - { surface: "la tienda", emoji: "🏪" }
      # Printed non-recall at m15 (Ana hace la tarea).
      - kind: speakLit
        id: l4-sp-recall-anahacelatarea
        es: "Ana hace la tarea"
        en: "Ana does the homework"
        atoms: []
        cue: recall
      - kind: agreementLit
        id: l4-agr-ustedesnosotros
        en: "You all eat here and we eat at the restaurant"
        audioText: "ustedes comen aquí y nosotros comemos en el restaurante"
        atoms: ["ustedes", "comen", "aquí", "nosotros", "comemos", "restaurante"]
        segments:
          - { text: "ustedes " }
          - { blank: { id: "p1", answer: "comen", options: ["comen", "comemos"] } }
          - { text: " aquí y nosotros " }
          - { blank: { id: "p2", answer: "comemos", options: ["comemos", "comen"] } }
          - { text: " en el restaurante" }
      - kind: listenBuildLit
        id: l4-lb-ustedesvivenenespana
        es: "ustedes viven en España"
        en: "You all live in Spain"
        atoms: ["ustedes", "viven", "España"]
        tiles: ["vivimos", "vive"]
      - kind: textMcq
        id: l4-tm-ustedes
        target: "ustedes"
        distractors: ["nosotros", "ellos", "ellas"]
      - kind: speakLit
        id: l4-sp-ustedesynosotros
        es: "ustedes comen en el restaurante y nosotros comemos en casa"
        en: "You all eat at the restaurant and we eat at home"
        atoms: ["ustedes", "comen", "restaurante", "nosotros", "comemos", "casa"]
      - kind: sim
        id: l4-sim-maria-restaurante
        scene: { emoji: "🍴", title: "María at the restaurant door", setting: "María works the door at the restaurant. You, Luis, Ana and Diego have just walked in." }
        turns:
          - id: t1
            npc: { speaker: "María", es: "¿Ustedes comen aquí hoy?", audioText: "¿ustedes comen aquí hoy?", gloss: "Are you all eating here today?" }
            goal: "Say yes, you all eat here."
            reply:
              mode: build
              tiles: ["sí", "comemos", "aquí", "comen", "come"]
              answer: "sí comemos aquí"
            replyGloss: "Yes, we eat here."
            explanation: "María said «ustedes» to the group; the group answers as a we: «comemos». «comen» would be about some other table."
          - id: t2
            npc: { speaker: "María", es: "¿Son estudiantes?", audioText: "¿son estudiantes?", gloss: "Are you students?" }
            goal: "Say yes, you are students."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, somos estudiantes" }
                - { id: "wrong1", text: "sí, son estudiantes" }
                - { id: "wrong2", text: "sí, soy estudiantes" }
              correctOptionId: "right"
              audioText: "sí, somos estudiantes"
            replyGloss: "Yes, we are students."
            explanation: "«son» was María talking to the group; the group answers «somos»."
          - id: t3
            npc: { speaker: "María", es: "¿Y ellos? ¿Hablan español?", audioText: "¿y ellos? ¿hablan español?", gloss: "And them? Do they speak Spanish?" }
            goal: "Say yes, they speak Spanish."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, hablan español" }
                - { id: "wrong1", text: "sí, hablamos español" }
                - { id: "wrong2", text: "sí, habla español" }
              correctOptionId: "right"
              audioText: "sí, hablan español"
            replyGloss: "Yes, they speak Spanish."
            explanation: "Ana and Diego are a they: «hablan». «hablamos» would be you and Luis; «habla» is one person."
      - kind: matchLit
        id: l4-match
        pairs:
          - { source: "ustedes", target: "you all" }
          - { source: "ustedes hablan", target: "you all speak" }
          - { source: "ustedes son", target: "you all are" }
          - { source: "el restaurante", target: "the restaurant" }
          - { source: "comemos", target: "we eat" }
          - { source: "nosotros", target: "we" }
          - { source: "juntos", target: "together" }
      - kind: speakLit
        id: l4-sp-win
        es: "ustedes son mis amigos y comemos juntos"
        en: "You all are my friends and we eat together"
        atoms: ["ustedes", "son", "amigo", "comemos", "juntos"]


  # ── L5 · «Tenemos, tienen» — tenemos, tienen. tener's plural is regular;
  #    the g of «tengo» is yo-only. Both forms debut on the card and are
  #    cashed on the speakLit / buildLit after it. «hambre» / «sed» are
  #    owned by m7's phrases («tengo hambre», «tengo sed») at word level.
  #    ⚠️ NO «vamos» / «van» (L6), NO «estamos» / «están» (L7).
  - n: 5
    template: free
    title: "Tenemos, tienen"
    description: "The verb with the odd «tengo» turns out to be perfectly ordinary in the plural — and now a whole group can be hungry."
    steps:
      - kind: map
        id: l5-map-tenemoshambre
        tokens: ["nosotros", "tenemos", "hambre"]
        pairs:
          - { en: "we", tokenIndex: 0 }
          - { en: "have", tokenIndex: 1 }
          - { en: "hunger", tokenIndex: 2 }
        audioText: "nosotros tenemos hambre"
        revealNote: "«tengo hambre» has meant I'm hungry since module seven. For we: «tenemos hambre». No g anywhere — the g was a yo-only thing. -mos on the -e- of «tener», exactly like «comemos»."
      - kind: info
        id: l5-info-tenemos
        title: "«tener» in the plural — no surprises"
        body: "«tengo», «tienes», «tiene» — the yo form had that strange g, and the other two changed their e into ie. The plural forgets both tricks: «tenemos», we have; «tienen», they have, you all have. «tenemos los boletos» — we have the tickets. «ellos tienen sed» — they are thirsty. «¿ustedes tienen dinero?» — do you all have money? Same two endings as every verb this module: -mos and -n."
      - kind: speakLit
        id: l5-sp-tenemoshambre
        es: "tenemos hambre"
        en: "We are hungry"
        atoms: ["tenemos"]
      - kind: buildLit
        id: l5-b-tenemoslosboletos
        es: "tenemos los boletos"
        en: "We have the tickets"
        atoms: ["tenemos", "boleto"]
        tiles: ["tengo", "tienen"]
      - kind: clozeLit
        id: l5-c-ellostienensed
        es: "ellos tienen sed"
        en: "They are thirsty"
        blank: "tienen"
        options: ["tienen", "tenemos", "tiene"]
        atoms: ["ellos", "tienen"]
        why: "«ellos» — they — so the -n: «tienen». «tenemos» is we, «tiene» is one person."
      - kind: listenCompLit
        id: l5-lc-ustedestienendinero
        es: "¿ustedes tienen dinero?"
        en: "Do you all have money?"
        atoms: ["ustedes", "tienen", "dinero"]
        distractorsEn:
          - "Do you have money?"
          - "Do they have money?"
          - "Do you all have the tickets?"
      - kind: buildLit
        id: l5-b-misamigostienenunperro
        es: "mis amigos tienen un perro"
        en: "My friends have a dog"
        atoms: ["tienen", "perro"]
        tiles: ["tenemos", "tiene"]
      - kind: mcq
        id: l5-q-tenemos
        prompt: "Which one means 'we have'?"
        correct: "tenemos"
        distractors: ["tienen", "tengo", "tiene"]
        atoms: ["tenemos"]
        why: "-mos is we: «tenemos». «tienen» is they, «tengo» is I, «tiene» is he or she."
      - kind: audioWimcq
        id: l5-ear-boleto
        target: { surface: "el boleto", emoji: "🎟️" }
        distractors:
          - { surface: "el regalo", emoji: "🎁" }
          - { surface: "el dinero", emoji: "💰" }
      # Printed non-recall at m14 (quiero un café).
      - kind: speakLit
        id: l5-sp-recall-quierouncafe
        es: "quiero un café"
        en: "I want a coffee"
        atoms: []
        cue: recall
      - kind: agreementLit
        id: l5-agr-tenemostienen
        en: "We have the tickets and they have the money"
        audioText: "tenemos los boletos y ellos tienen el dinero"
        atoms: ["tenemos", "boleto", "ellos", "tienen", "dinero"]
        segments:
          - { blank: { id: "p1", answer: "tenemos", options: ["tenemos", "tienen"] } }
          - { text: " los boletos y ellos " }
          - { blank: { id: "p2", answer: "tienen", options: ["tienen", "tenemos"] } }
          - { text: " el dinero" }
      - kind: listenBuildLit
        id: l5-lb-tenemosunacasagrande
        es: "nosotros tenemos una casa grande"
        en: "We have a big house"
        atoms: ["nosotros", "tenemos", "casa", "grande"]
        tiles: ["tengo", "tienen"]
      - kind: textMcq
        id: l5-tm-tienen
        target: "tienen"
        distractors: ["tenemos", "tiene", "tienes"]
      - kind: speakLit
        id: l5-sp-hambreysed
        es: "tenemos hambre y ellos tienen sed"
        en: "We are hungry and they are thirsty"
        atoms: ["tenemos", "ellos", "tienen"]
      - kind: sim
        id: l5-sim-diego-boletos
        scene: { emoji: "🎟️", title: "Diego counts the tickets", setting: "Four of you at the cinema door, and Diego is checking who has what." }
        turns:
          - id: t1
            npc: { speaker: "Diego", es: "¿Ustedes tienen los boletos?", audioText: "¿ustedes tienen los boletos?", gloss: "Do you all have the tickets?" }
            goal: "Say yes, you have the tickets."
            reply:
              mode: build
              tiles: ["sí", "tenemos", "los", "boletos", "tienen", "tengo"]
              answer: "sí tenemos los boletos"
            replyGloss: "Yes, we have the tickets."
            explanation: "Diego asked the group with «tienen»; the group answers «tenemos». «tengo» would be you alone."
          - id: t2
            npc: { speaker: "Diego", es: "Ana y Sofía no tienen dinero.", audioText: "ana y sofía no tienen dinero", gloss: "Ana and Sofía don't have money." }
            goal: "Say you two have money."
            reply:
              mode: choice
              options:
                - { id: "right", text: "nosotros tenemos dinero" }
                - { id: "wrong1", text: "nosotros tienen dinero" }
                - { id: "wrong2", text: "nosotros tiene dinero" }
              correctOptionId: "right"
              audioText: "nosotros tenemos dinero"
            replyGloss: "We have money."
            explanation: "«nosotros» goes with -mos: «tenemos». The other two hang a they or a he ending on a we."
          - id: t3
            npc: { speaker: "Diego", es: "¿Tienen hambre?", audioText: "¿tienen hambre?", gloss: "Are you all hungry?" }
            goal: "Say yes, you are all hungry."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, tenemos hambre" }
                - { id: "wrong1", text: "sí, tienen hambre" }
                - { id: "wrong2", text: "sí, tengo hambres" }
              correctOptionId: "right"
              audioText: "sí, tenemos hambre"
            replyGloss: "Yes, we are hungry."
            explanation: "The group answers as a we: «tenemos hambre». «tienen» is Diego's word for you, not yours."
      - kind: matchLit
        id: l5-match
        pairs:
          - { source: "tenemos", target: "we have" }
          - { source: "tienen", target: "they have, you all have" }
          - { source: "tenemos hambre", target: "we are hungry" }
          - { source: "tienen sed", target: "they are thirsty" }
          - { source: "el boleto", target: "the ticket" }
          - { source: "el dinero", target: "the money" }
          - { source: "somos", target: "we are" }
      - kind: speakLit
        id: l5-sp-win
        es: "tenemos los boletos y tenemos hambre"
        en: "We have the tickets and we are hungry"
        atoms: ["tenemos", "boleto"]


  # ── L6 · «Vamos, van» — vamos, van. ir's plural, and «¡vamos!» as
  #    "let's go". Both debut on the card, cashed on the speakLit after.
  #    ⚠️ «va» (he/she goes) was never registered (m9 taught voy / vas
  #    only) and is NOT printed in any billed slot. NO estamos / están (L7).
  - n: 6
    template: free
    title: "Vamos, van"
    description: "«voy», «vas» — and now the two forms that get a whole group out of the house. One of them is also the word for 'let's go'."
    steps:
      - kind: map
        id: l6-map-vamosalcine
        tokens: ["nosotros", "vamos", "al", "cine"]
        pairs:
          - { en: "we", tokenIndex: 0 }
          - { en: "go", tokenIndex: 1 }
          - { en: "to the", tokenIndex: 2 }
          - { en: "cinema", tokenIndex: 3 }
        audioText: "nosotros vamos al cine"
        revealNote: "«voy al cine» — I go to the cinema. For we: «vamos». Short, and it ends in the -mos you have been hearing all module. «al» is still «a» + «el», one word."
      - kind: info
        id: l6-info-vamos
        title: "«ir» in the plural — and «¡vamos!»"
        body: "«voy», «vas» — I go, you go. The plural: «vamos», we go; «van», they go, you all go. «vamos al cine» — we go to the cinema. «ellos van a la playa» — they go to the beach. «¿ustedes van al mercado?» — are you all going to the market? And «vamos» on its own is what Spanish says for 'let's go' — «¡vamos!» — the we form doing the inviting."
      - kind: speakLit
        id: l6-sp-vamosalcine
        es: "vamos al cine"
        en: "We go to the cinema"
        atoms: ["vamos", "al", "cine"]
      - kind: buildLit
        id: l6-b-ellosvanalaplaya
        es: "ellos van a la playa"
        en: "They go to the beach"
        atoms: ["ellos", "van", "a", "playa"]
        tiles: ["vamos", "voy"]
      - kind: clozeLit
        id: l6-c-ustedesvanalmercado
        es: "ustedes van al mercado"
        en: "You all go to the market"
        blank: "van"
        options: ["van", "vamos", "vas"]
        atoms: ["ustedes", "van", "mercado"]
        why: "«ustedes» takes the -n: «van». «vamos» is we, «vas» is one you."
      - kind: listenCompLit
        id: l6-lc-vamosalrestaurantejuntos
        es: "vamos al restaurante juntos"
        en: "We go to the restaurant together."
        atoms: ["vamos", "restaurante", "juntos"]
        distractorsEn:
