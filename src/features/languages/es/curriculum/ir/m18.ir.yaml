module: m18
title: "Nosotros y ellos — the rest of the table"
frame: none
throughModule: m17
expectedLessonCount: 10
checkpoint: 8

# ES m18 — the plural persons: nosotros / ellos, ellas / ustedes.
#
#     hablo   hablas   habla   │  hablamos   hablan
#     como    comes    come    │  comemos    comen
#     vivo    vives    vive    │  vivimos    viven
#     tengo   tienes   tiene   │  tenemos    tienen
#     voy     vas      va(*)   │  vamos      van
#     soy     eres     es      │  somos      son
#     estoy(*) estás(*) está   │  estamos    están
#
# Seventeen modules of Spanish and the learner has only ever said I, you,
# he and she. This module closes the present tense: TWO endings, -mos for
# "we" and -n for "they / you all", hung on the vowel each verb already
# showed in its singular (-a- for -ar, -e- for -er, -i-/-e- for -ir). It is
# the A1 breather the handoff asked for — no new grammar machine, the m10 /
# m11 machine run to the end of the table — and it is the last A1 module:
# m19 opens A2 with the preterite.
#
# ── THE FUNCTION-WORD HOLE, FOUR TIMES OVER ──────────────────────────────
# nosotros, ellos, ellas, ustedes, somos, son, estamos, están ALL sit in
# ES_FUNCTION_WORDS, so every shared gate licenses them with zero exposure
# (the m12 «son» hole: verified — «son» has been printed in shipped lessons
# without ever being taught). m18 REGISTERS every one of them as an atom,
# exactly as m2 registered soy / eres / es and m4 registered está, so inv
# 33 (debut on an intro-capable step) and the atom-usage pin bite. Each
# pronoun debuts on its lesson's info card and is cashed on a printed
# speakLit or buildLit right after.
#
# ── THE VERB TABLE MAKES EVERY PLURAL FORM "PRIOR" ───────────────────────
# ES_VERB_ENTRIES carries hablar / comer / vivir / ser / estar / ir / tener /
# querer / poder / hacer with introducedAtModule < 18, so the provenance
# gate treats «hablamos», «queremos», «podemos», «hacemos» … as already
# taught. They are NOT. m18 registers the twelve forms it actually teaches;
# «queremos / quieren / podemos / pueden / hacemos / hacen / necesitamos» (see
# transfer) are BANNED in every answer position — m18.test.ts pins it. Verbs
# outside the table (trabajar, estudiar, comprar, necesitar, buscar …) have
# NO plural form registered and none is ever printed in a billed slot; the
# generalisation is shown on cards in words, never as a «guillemet» span.
#
# ── (*) CELLS THE COURSE NEVER TAUGHT ────────────────────────────────────
# «va» (m9 registered voy / vas only), «estoy», «estás» are not atoms and
# stay out of every billed slot. «ella va» is not written here.
#
# ── ustedes IS THE ONLY "you all" (pin E3) ───────────────────────────────
# LatAm-neutral: «ustedes» takes the ellos ending. «vosotros» is never
# printed. «nosotras» is real and is not taught (one form per card).
#
# ── hacer / tener RULING (B112) ──────────────────────────────────────────
# tenemos / tienen are TAUGHT here (L5). hago / haces / hace stay the only
# hacer forms; hacemos / hacen remain banned.
#
# ── TRANSFER CELL (L8 only): «necesitamos» ───────────────────────────────
# «necesitar» was taught in the singular at m16. The checkpoint hands the
# learner "we need — necesitar" and asks for the -mos form cold: a buildLit
# whose bank holds «necesito» and «necesitan» as foils. Registered so the
# gate can track it; NEVER appears in L1–L7 or L9–L10.
#
# ── EMOJI ────────────────────────────────────────────────────────────────
# restaurante 🍴 (u1f37d, vendored). Pronouns and verb forms carry none.
# ─────────────────────────────────────────────────────────────────────────
newAtoms:
  # the four plural persons
  - { surface: "nosotros", meaningEn: "we", partOfSpeech: "pronoun", kind: "vocab", hint: "no-SO-tros — the verb ends in -mos" }
  - { surface: "ellos", meaningEn: "they (a group with at least one he)", partOfSpeech: "pronoun", kind: "vocab", hint: "EH-yos — «él» with an -os" }
  - { surface: "ellas", meaningEn: "they (a group of shes)", partOfSpeech: "pronoun", kind: "vocab", hint: "EH-yas — «ella» with an -s" }
  - { surface: "ustedes", meaningEn: "you all", partOfSpeech: "pronoun", kind: "vocab", hint: "oos-TEH-des — takes the same ending as «ellos»" }
  # -mos: we
  - { surface: "hablamos", meaningEn: "we speak", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "comemos", meaningEn: "we eat", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "vivimos", meaningEn: "we live", partOfSpeech: "verb", kind: "vocab" }
  # -n: they / you all
  - { surface: "hablan", meaningEn: "they speak, you all speak", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "comen", meaningEn: "they eat, you all eat", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "viven", meaningEn: "they live, you all live", partOfSpeech: "verb", kind: "vocab" }
  # ser
  - { surface: "somos", meaningEn: "we are (ser)", partOfSpeech: "verb", kind: "vocab", hint: "SO-mos — «soy» grown up" }
  - { surface: "son", meaningEn: "they are, you all are (ser)", partOfSpeech: "verb", kind: "vocab", hint: "one syllable — «ellos son mis amigos»" }
  - { surface: "juntos", meaningEn: "together", partOfSpeech: "adverb", kind: "vocab", hint: "HOON-tos" }
  - { surface: "restaurante", meaningEn: "restaurant", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "🍴", hint: "res-tau-RAN-teh — the same word, Spanish vowels" }
  # tener
  - { surface: "tenemos", meaningEn: "we have", partOfSpeech: "verb", kind: "vocab", hint: "regular in the plural — the g of «tengo» is yo-only" }
  - { surface: "tienen", meaningEn: "they have, you all have", partOfSpeech: "verb", kind: "vocab" }
  # ir
  - { surface: "vamos", meaningEn: "we go", partOfSpeech: "verb", kind: "vocab", hint: "VA-mos — also 'let's go', on its own" }
  - { surface: "van", meaningEn: "they go, you all go", partOfSpeech: "verb", kind: "vocab" }
  # estar
  - { surface: "estamos", meaningEn: "we are (estar — where, how)", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "están", meaningEn: "they are, you all are (estar — where, how)", partOfSpeech: "verb", kind: "vocab", hint: "es-TAN — the accent keeps the stress on the end" }
  # ── TRANSFER CELL (L8 only) — glossed in the prompt, met cold.
  - { surface: "necesitamos", meaningEn: "we need", partOfSpeech: "verb", kind: "vocab" }

lessons:
  # ── L1 · «Nosotros hablamos» — nosotros, hablamos, comemos, vivimos. ONE
  #    claim: -mos is "we", hung on the vowel the verb already showed you.
  #    «nosotros» debuts on the card (guillemets billed), cashed on the
  #    printed speakLit right after; the map before it bills nothing.
  #    ⚠️ NO «hablan» / «comen» / «viven» / «ellos» / «ustedes» ANYWHERE
  #    in a billed slot — L2 / L4 property. NO «tenemos» / «vamos» / «somos».
  - n: 1
    template: free
    title: "Nosotros hablamos"
    description: "Seventeen modules of I, you, he and she. Today the verb learns to say 'we' — one ending, and you already know the vowel that goes in front of it."
    steps:
      - kind: map
        id: l1-map-nosotroshablamos
        tokens: ["nosotros", "hablamos", "español"]
        pairs:
          - { en: "we", tokenIndex: 0 }
          - { en: "speak", tokenIndex: 1 }
          - { en: "Spanish", tokenIndex: 2 }
        audioText: "nosotros hablamos español"
        revealNote: "«hablo» is I speak. Look at the ending here: «hablamos». The -a- is the one «hablar» always had; the new piece is -mos, and -mos means we. The word in front, «nosotros», is the we itself — and you will often drop it, because -mos already says it."
      - kind: info
        id: l1-info-nosotros
        title: "We — one ending for the whole group"
        body: "Every verb you know ends in -o when it is you. For we, the ending is -mos, and it sits on the verb's own vowel: «hablar» → «hablamos», we speak; «comer» → «comemos», we eat; «vivir» → «vivimos», we live. The word for we is «nosotros» — «nosotros hablamos español». You can leave it off, the way you leave off «yo»: «hablamos español» says the same thing. That is the whole lesson: -mos, on the vowel the verb already showed you."
      - kind: speakLit
        id: l1-sp-nosotroshablamos
        es: "nosotros hablamos español"
        en: "We speak Spanish"
        atoms: ["nosotros", "hablamos", "español"]
      - kind: buildLit
        id: l1-b-hablamosencasa
        also: ["en casa hablamos español"]
        es: "hablamos español en casa"
        en: "We speak Spanish at home"
        atoms: ["hablamos", "español", "casa"]
        tiles: ["hablo", "habla"]
      - kind: clozeLit
        id: l1-c-nosotroscomemos
        es: "nosotros comemos pizza"
        en: "We eat pizza"
        blank: "comemos"
        options: ["comemos", "como", "come"]
        atoms: ["nosotros", "comemos", "pizza"]
        why: "«nosotros» is we, so the -mos ending on the -e- of «comer»: «comemos». «como» is I, «come» is he or she."
      - kind: listenCompLit
        id: l1-lc-vivimosenmexico
        es: "vivimos en México"
        en: "We live in Mexico."
        atoms: ["vivimos", "México"]
        distractorsEn:
          - "I live in Mexico."
          - "We live in Spain."
          - "She lives in Mexico."
      - kind: buildLit
        id: l1-b-nosotrosvivimosaqui
        es: "nosotros vivimos aquí"
        en: "We live here"
        atoms: ["nosotros", "vivimos", "aquí"]
        tiles: ["vivo", "vives"]
      - kind: mcq
        id: l1-q-comemos
        prompt: "Which one means 'we eat'?"
        correct: "comemos"
        distractors: ["como", "comes", "come"]
        atoms: ["comemos"]
        why: "-mos is we: «comemos». The others are I, you, and he or she."
      - kind: audioWimcq
        id: l1-ear-pizza
        target: { surface: "la pizza", emoji: "🍕" }
        distractors:
          - { surface: "el pan", emoji: "🍞" }
          - { surface: "la carne", emoji: "🥩" }
      # Printed non-recall at m15 (hago la tarea todos los días).
      - kind: speakLit
        id: l1-sp-recall-hagolatarea
        es: "hago la tarea todos los días"
        en: "I do the homework every day"
        atoms: []
        cue: recall
      - kind: agreementLit
        id: l1-agr-yonosotros
        en: "I speak Spanish and at home we speak Spanish"
        audioText: "hablo español y en casa hablamos español"
        atoms: ["hablo", "hablamos", "español", "casa"]
        segments:
          - { blank: { id: "p1", answer: "hablo", options: ["hablo", "hablamos"] } }
          - { text: " español y en casa " }
          - { blank: { id: "p2", answer: "hablamos", options: ["hablamos", "hablo"] } }
          - { text: " español" }
      - kind: listenBuildLit
        id: l1-lb-comemospanycarne
        es: "comemos pan y carne"
        en: "We eat bread and meat"
        atoms: ["comemos", "pan", "carne"]
        tiles: ["como", "comes"]
      - kind: textMcq
        id: l1-tm-vivimos
        target: "vivimos"
        distractors: ["vivo", "vives", "vive"]
      - kind: speakLit
        id: l1-sp-comemosencasa
        es: "nosotros comemos en casa todos los días"
        en: "We eat at home every day"
        atoms: ["nosotros", "comemos", "casa", "todos los días"]
      - kind: sim
        id: l1-sim-ana-encasa
        scene: { emoji: "🏠", title: "Ana asks about your house", setting: "Ana knows you live with your brother Luis and wants to know how the two of you do things." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "Yo hablo español en casa. ¿Y tú y Luis?", audioText: "yo hablo español en casa. ¿y tú y luis?", gloss: "I speak Spanish at home. And you and Luis?" }
            goal: "Say you two speak Spanish at home."
            reply:
              mode: build
              tiles: ["hablamos", "español", "en", "casa", "hablo", "habla"]
              answer: "hablamos español en casa"
              alsoAccepted: ["en casa hablamos español"]
            replyGloss: "We speak Spanish at home."
            explanation: "You and Luis are a we, so -mos: «hablamos». «hablo» would leave Luis out; «habla» is one other person."
          - id: t2
            npc: { speaker: "Ana", es: "Yo como pizza los sábados.", audioText: "yo como pizza los sábados", gloss: "I eat pizza on Saturdays." }
            goal: "Say you two eat pizza too."
            reply:
              mode: choice
              options:
                - { id: "right", text: "comemos pizza también" }
                - { id: "wrong1", text: "como pizza también" }
                - { id: "wrong2", text: "come pizza también" }
              correctOptionId: "right"
              audioText: "comemos pizza también"
            replyGloss: "We eat pizza too."
            explanation: "We — -mos on the -e- of «comer»: «comemos»."
          - id: t3
            npc: { speaker: "Ana", es: "Yo vivo aquí, en México.", audioText: "yo vivo aquí, en méxico", gloss: "I live here, in Mexico." }
            goal: "Say you two live here too."
            reply:
              mode: choice
              options:
                - { id: "right", text: "vivimos aquí también" }
                - { id: "wrong1", text: "vivo aquí también" }
                - { id: "wrong2", text: "vive aquí también" }
              correctOptionId: "right"
              audioText: "vivimos aquí también"
            replyGloss: "We live here too."
            explanation: "-mos on the -i- of «vivir»: «vivimos». «vivo» is you alone."
      - kind: matchLit
        id: l1-match
        pairs:
          - { source: "nosotros", target: "we" }
          - { source: "hablamos", target: "we speak" }
          - { source: "comemos", target: "we eat" }
          - { source: "vivimos", target: "we live" }
          - { source: "español", target: "Spanish" }
          - { source: "en casa", target: "at home" }
          - { source: "la pizza", target: "the pizza" }
      - kind: speakLit
        id: l1-sp-win
        es: "nosotros vivimos aquí y hablamos español"
        en: "We live here and we speak Spanish"
        atoms: ["nosotros", "vivimos", "aquí", "hablamos", "español"]


  # ── L2 · «Ellos hablan» — ellos, ellas, hablan, comen, viven. The other
  #    plural ending, -n, and the two words for they. «ellos» / «ellas»
  #    debut on the card, cashed on the speakLit after it.
  #    ⚠️ NO «ustedes» (L4), NO «son» / «somos» (L3). «amigos» folds to
  #    «amigo» (m15) through the plural canon.
  - n: 2
    template: free
    title: "Ellos hablan"
    description: "The last ending in the table: -n, for they. Two words for they, because Spanish cares whether the group has a he in it."
    steps:
      - kind: map
        id: l2-map-elloshablan
        tokens: ["ellos", "hablan", "español"]
        pairs:
          - { en: "they", tokenIndex: 0 }
          - { en: "speak", tokenIndex: 1 }
          - { en: "Spanish", tokenIndex: 2 }
        audioText: "ellos hablan español"
        revealNote: "«habla» is he speaks, she speaks. Add one letter — «hablan» — and it is they speak. The -n is the whole difference. «ellos» is «él» with an -os: a group with a he in it."
      - kind: info
        id: l2-info-ellos
        title: "They — add an -n"
        body: "Take the he-or-she form and put -n on the end: «habla» → «hablan», they speak; «come» → «comen», they eat; «vive» → «viven», they live. That is the last ending in the table. Two words for they: «ellos» for a group with at least one he in it — «Diego y Ana», «mis amigos» — and «ellas» when everyone in it is a she — «Ana y Sofía». Both take the same -n: «ellos hablan», «ellas hablan». And as with «nosotros», you can drop the word: «hablan español» already says they."
      - kind: speakLit
        id: l2-sp-elloshablan
        es: "ellos hablan español"
        en: "They speak Spanish"
        atoms: ["ellos", "hablan", "español"]
      - kind: buildLit
        id: l2-b-anaysofiaviven
        es: "Ana y Sofía viven en México"
        en: "Ana and Sofía live in Mexico"
        atoms: ["viven", "México"]
        tiles: ["vive", "vivimos"]
      - kind: clozeLit
        id: l2-c-elloscomen
        es: "ellos comen pizza"
        en: "They eat pizza"
        blank: "comen"
        options: ["comen", "come", "comemos"]
        atoms: ["ellos", "comen", "pizza"]
        why: "«ellos» is they, so the -n: «comen». «come» is one person, «comemos» is we."
      - kind: listenCompLit
        id: l2-lc-misamigoshablanmucho
        es: "mis amigos hablan mucho"
        en: "My friends talk a lot."
        atoms: ["hablan", "mucho"]
        distractorsEn:
          - "My friend talks a lot."
          - "My friends eat a lot."
          - "We talk a lot."
      - kind: buildLit
        id: l2-b-ellashablanencasa
        also: ["en casa ellas hablan español"]
        es: "ellas hablan español en casa"
        en: "They speak Spanish at home"
        atoms: ["ellas", "hablan", "español", "casa"]
        tiles: ["hablamos", "habla"]
      - kind: mcq
        id: l2-q-comen
        prompt: "Which one means 'they eat'?"
        correct: "comen"
        distractors: ["come", "comemos", "comes"]
        atoms: ["comen"]
        why: "-n on the he-or-she form: «comen». «come» is one person, «comemos» is we, «comes» is you."
      - kind: audioWimcq
        id: l2-ear-amigo
        target: { surface: "el amigo", emoji: "🧑‍🤝‍🧑" }
        distractors:
          - { surface: "el hermano", emoji: "👦" }
          - { surface: "la maestra", emoji: "👩‍🏫" }
      # Printed non-recall at m15 (vengo a la fiesta).
      - kind: speakLit
        id: l2-sp-recall-vengoalafiesta
        es: "vengo a la fiesta"
        en: "I'm coming to the party"
        atoms: []
        cue: recall
      - kind: agreementLit
        id: l2-agr-nosotrosellos
        en: "We live here and they live in Spain"
        audioText: "vivimos aquí y ellos viven en España"
        atoms: ["vivimos", "aquí", "ellos", "viven", "España"]
        segments:
          - { blank: { id: "p1", answer: "vivimos", options: ["vivimos", "viven"] } }
          - { text: " aquí y ellos " }
          - { blank: { id: "p2", answer: "viven", options: ["viven", "vivimos"] } }
          - { text: " en España" }
      - kind: listenBuildLit
        id: l2-lb-elloscomenencasa
        es: "ellos comen en casa"
        en: "They eat at home"
        atoms: ["ellos", "comen", "casa"]
        tiles: ["comemos", "come"]
      - kind: textMcq
        id: l2-tm-viven
        target: "viven"
        distractors: ["vive", "vivimos", "vivo"]
      - kind: speakLit
        id: l2-sp-misamigosviven
        es: "mis amigos viven aquí y hablan español"
        en: "My friends live here and speak Spanish"
        atoms: ["viven", "aquí", "hablan", "español"]
      - kind: sim
        id: l2-sim-diego-amigas
        scene: { emoji: "☕", title: "Diego watches Ana and Sofía", setting: "Diego is at the next table, and Ana and Sofía have not stopped talking for an hour." }
        turns:
          - id: t1
            npc: { speaker: "Diego", es: "Ana y Sofía hablan mucho, ¿no?", audioText: "ana y sofía hablan mucho, ¿no?", gloss: "Ana and Sofía talk a lot, don't they?" }
            goal: "Say yes, they talk a lot."
            reply:
              mode: build
              tiles: ["sí", "ellas", "hablan", "mucho", "ellos", "habla"]
              answer: "sí ellas hablan mucho"
              alsoAccepted: ["sí hablan mucho"]
            replyGloss: "Yes, they talk a lot."
            explanation: "Two shes, so «ellas» — and the -n: «hablan». «ellos» would put a he in the group; «habla» is one person."
          - id: t2
            npc: { speaker: "Diego", es: "¿Y dónde viven?", audioText: "¿y dónde viven?", gloss: "And where do they live?" }
            goal: "Say they live here."
            reply:
              mode: choice
              options:
                - { id: "right", text: "viven aquí" }
                - { id: "wrong1", text: "vive aquí" }
                - { id: "wrong2", text: "vivimos aquí" }
              correctOptionId: "right"
              audioText: "viven aquí"
            replyGloss: "They live here."
            explanation: "They: -n. «vive» is one of them; «vivimos» would include you."
          - id: t3
            npc: { speaker: "Diego", es: "¿Comen pizza?", audioText: "¿comen pizza?", gloss: "Do they eat pizza?" }
            goal: "Say yes, they eat pizza every day."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, comen pizza todos los días" }
                - { id: "wrong1", text: "sí, come pizza todos los días" }
                - { id: "wrong2", text: "sí, comemos pizza todos los días" }
              correctOptionId: "right"
              audioText: "sí, comen pizza todos los días"
            replyGloss: "Yes, they eat pizza every day."
            explanation: "«comen» — the -n is the two of them."
      - kind: matchLit
        id: l2-match
        pairs:
          - { source: "ellos", target: "they (with a he in the group)" }
          - { source: "ellas", target: "they (all shes)" }
          - { source: "hablan", target: "they speak" }
          - { source: "comen", target: "they eat" }
          - { source: "viven", target: "they live" }
          - { source: "hablamos", target: "we speak" }
          - { source: "mucho", target: "a lot" }
      - kind: speakLit
        id: l2-sp-win
        es: "ellos viven aquí y hablan español"
        en: "They live here and they speak Spanish"
        atoms: ["ellos", "viven", "aquí", "hablan", "español"]


  # ── L3 · «Somos amigos» — somos, son, juntos. ser's plural, and the
  #    course's oldest hole closed: «son» has been licensed as a function
  #    word since m2 and printed in shipped lessons without ever being
  #    taught. It debuts HERE, on the card, cashed on the speakLit after.
  #    ⚠️ NO «ustedes» (L4). «amigos» / «estudiantes» / «maestros» /
  #    «hermanos» fold to their singulars through the plural canon.
  - n: 3
    template: free
    title: "Somos amigos"
    description: "«soy», «eres», «es» — you have used them since module two. Here are the two that were missing, and a word for doing things together."
    steps:
      - kind: map
        id: l3-map-nosotrossomos
        tokens: ["nosotros", "somos", "estudiantes"]
        pairs:
          - { en: "we", tokenIndex: 0 }
          - { en: "are", tokenIndex: 1 }
          - { en: "students", tokenIndex: 2 }
        audioText: "nosotros somos estudiantes"
        revealNote: "«soy» is I am. For we, «ser» does not use -mos on a vowel — it has its own word, «somos». Short, and it still ends in -mos, so you can hear the we in it."
      - kind: info
        id: l3-info-somosson
        title: "The two forms of «ser» you were missing"
        body: "«soy», «eres», «es» — I am, you are, he or she is. The table finishes with two more: «somos», we are, and «son», they are. «somos estudiantes» — we are students. «ellos son mis amigos» — they are my friends. «Ana y Sofía son de México» — they are from Mexico. You have actually heard «son» before, in phrases like «son las diez»; now it is yours to use. And one word that loves to follow a we: «juntos», together — «vivimos juntos», we live together."
      - kind: speakLit
        id: l3-sp-somosamigos
        es: "somos amigos"
        en: "We are friends"
        atoms: ["somos", "amigo"]
      - kind: buildLit
        id: l3-b-ellossonmisamigos
        es: "ellos son mis amigos"
        en: "They are my friends"
        atoms: ["ellos", "son", "amigo"]
        tiles: ["somos", "es"]
      - kind: clozeLit
        id: l3-c-anaydiegoson
        es: "Ana y Diego son estudiantes"
        en: "Ana and Diego are students"
        blank: "son"
        options: ["son", "somos", "es"]
        atoms: ["son", "estudiante"]
        why: "Two people who are not you: they — «son». «somos» would include you; «es» is one person."
      - kind: listenCompLit
        id: l3-lc-vivimosjuntos
        es: "vivimos juntos en México"
        en: "We live together in Mexico."
        atoms: ["vivimos", "juntos", "México"]
        distractorsEn:
          - "They live together in Mexico."
          - "We live together in Spain."
          - "We work together in Mexico."
      - kind: buildLit
        id: l3-b-somosamigosyvivimosjuntos
        es: "somos amigos y vivimos juntos"
        en: "We are friends and we live together"
        atoms: ["somos", "amigo", "vivimos", "juntos"]
        tiles: ["son", "viven"]
      - kind: mcq
        id: l3-q-somos
        prompt: "Which one means 'we are'?"
        correct: "somos"
        distractors: ["son", "soy", "es"]
        atoms: ["somos"]
        why: "«somos» — the we form of «ser». «son» is they, «soy» is I, «es» is he or she."
      - kind: audioWimcq
        id: l3-ear-estudiante
        target: { surface: "el estudiante", emoji: "🧑‍🎓" }
        distractors:
          - { surface: "el maestro", emoji: "👨‍🏫" }
          - { surface: "el amigo", emoji: "🧑‍🤝‍🧑" }
      # Printed non-recall at m15 (yo tengo hambre y mi hermano tiene sed).
      - kind: speakLit
        id: l3-sp-recall-tengohambre
        es: "yo tengo hambre y mi hermano tiene sed"
        en: "I'm hungry and my brother is thirsty"
        atoms: []
        cue: recall
      - kind: agreementLit
        id: l3-agr-somosson
        en: "We are students and they are teachers"
        audioText: "somos estudiantes y ellos son maestros"
        atoms: ["somos", "estudiante", "ellos", "son", "maestro"]
        segments:
          - { blank: { id: "p1", answer: "somos", options: ["somos", "son"] } }
          - { text: " estudiantes y ellos " }
          - { blank: { id: "p2", answer: "son", options: ["son", "somos"] } }
          - { text: " maestros" }
      - kind: listenBuildLit
        id: l3-lb-ellassondeespana
        es: "ellas son de España"
        en: "They are from Spain"
        atoms: ["ellas", "son", "España"]
        tiles: ["somos", "es"]
      - kind: textMcq
        id: l3-tm-somos
        target: "somos"
        distractors: ["son", "soy", "eres"]
      - kind: speakLit
        id: l3-sp-misamigosson
        es: "mis amigos son de México y viven aquí"
        en: "My friends are from Mexico and live here"
        atoms: ["son", "México", "viven", "aquí"]
      - kind: sim
        id: l3-sim-sofia-hermanos
        scene: { emoji: "🧑‍🤝‍🧑", title: "Sofía gets the family wrong", setting: "Sofía has just met Luis and is trying to work out who is who." }
        turns:
          - id: t1
            npc: { speaker: "Sofía", es: "¿Tú y Luis son amigos?", audioText: "¿tú y luis son amigos?", gloss: "Are you and Luis friends?" }
            goal: "Say no, you two are brothers."
            reply:
              mode: build
              tiles: ["no", "somos", "hermanos", "son", "amigos"]
              answer: "no somos hermanos"
            replyGloss: "No, we are brothers."
            explanation: "You and Luis are a we: «somos». «son» would be about two other people."
          - id: t2
            npc: { speaker: "Sofía", es: "¿Y viven juntos?", audioText: "¿y viven juntos?", gloss: "And do you live together?" }
            goal: "Say yes, you live together."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, vivimos juntos" }
                - { id: "wrong1", text: "sí, viven juntos" }
                - { id: "wrong2", text: "sí, vivo juntos" }
              correctOptionId: "right"
              audioText: "sí, vivimos juntos"
            replyGloss: "Yes, we live together."
            explanation: "Sofía asked with «viven» — you and Luis; you answer as a we: «vivimos juntos»."
          - id: t3
            npc: { speaker: "Sofía", es: "Ana y Diego son amigos, ¿no?", audioText: "ana y diego son amigos, ¿no?", gloss: "Ana and Diego are friends, aren't they?" }
            goal: "Say yes, they are friends."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, son amigos" }
                - { id: "wrong1", text: "sí, somos amigos" }
                - { id: "wrong2", text: "sí, es amigos" }
              correctOptionId: "right"
              audioText: "sí, son amigos"
            replyGloss: "Yes, they are friends."
            explanation: "Two people who are not you: «son». «somos» would make you one of them."
      - kind: matchLit
        id: l3-match
        pairs:
