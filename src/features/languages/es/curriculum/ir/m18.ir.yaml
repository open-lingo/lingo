          - "We go to the cinema together."
          - "We eat at the restaurant together."
      - kind: buildLit
        id: l6-b-misamigosvanalaescuela
        es: "mis amigos van a la escuela"
        en: "My friends go to school"
        atoms: ["van", "a", "escuela"]
        tiles: ["vamos", "vas"]
      - kind: mcq
        id: l6-q-vamos
        prompt: "Which one means 'we go'?"
        correct: "vamos"
        distractors: ["van", "voy", "vas"]
        atoms: ["vamos"]
        why: "«vamos» — the we form of «ir». «van» is they, «voy» is I, «vas» is you."
      - kind: audioWimcq
        id: l6-ear-cine
        target: { surface: "el cine", emoji: "🎬" }
        distractors:
          - { surface: "la playa", emoji: "🏖️" }
          - { surface: "el parque", emoji: "🌳" }
      # Printed non-recall at m14 (Ana quiere un café).
      - kind: speakLit
        id: l6-sp-recall-anaquiereuncafe
        es: "Ana quiere un café"
        en: "Ana wants a coffee"
        atoms: []
        cue: recall
      - kind: agreementLit
        id: l6-agr-vamosvan
        en: "We go to the cinema and they go to the beach"
        audioText: "vamos al cine y ellos van a la playa"
        atoms: ["vamos", "cine", "ellos", "van", "playa"]
        segments:
          - { blank: { id: "p1", answer: "vamos", options: ["vamos", "van"] } }
          - { text: " al cine y ellos " }
          - { blank: { id: "p2", answer: "van", options: ["van", "vamos"] } }
          - { text: " a la playa" }
      - kind: listenBuildLit
        id: l6-lb-vamosalparquehoy
        es: "nosotros vamos al parque hoy"
        en: "We go to the park today"
        atoms: ["nosotros", "vamos", "parque", "hoy"]
        tiles: ["van", "voy"]
