  # la chaqueta — jacket. Regular feminine noun; this module's own
  # «comprarla» recombination target alongside «bufanda».
  - { surface: "chaqueta", meaningEn: "jacket", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "🧥", hint: "la chaqueta — regular feminine. «necesito una chaqueta nueva» (m16's «necesito» + m6's «nueva»)." }
