lessons:
  # ── L1 · «Tengo un pantalón azul» — «pantalón» debuts. Singular in
  #    Spanish even though English "pants" is always plural — this is
  #    the one usage note this lesson carries (info card, ≤3 lines).
  #    PRIOR context only: «tengo» (m5), «un»/«una» (m3), size/color
  #    adjectives (m6), «hermana»/«camisa» (m8/m12) for recombination.
  #    No «unos»/«unas» anywhere (hard ban) — singular framing only.
  #    No recall — first lesson of the module.
  - n: 1
    template: free
    title: "Tengo un pantalón azul"
    description: "A new round of clothing words. First up: «pantalón» — always singular in Spanish, even though English says \"pants\". «tengo un pantalón azul» — «tengo» (m5) plus this module's own «pantalón»."
    steps:
      - kind: map
        id: l1-map-tengounpantalon
        tokens: ["tengo", "un", "pantalón", "azul"]
        pairs:
          - { en: "I have", tokenIndex: 0 }
          - { en: "a", tokenIndex: 1 }
          - { en: "pair of pants", tokenIndex: 2 }
          - { en: "blue", tokenIndex: 3 }
        audioText: "tengo un pantalón azul"
        revealNote: "«pantalón» — singular, unlike English \"pants\" (always plural). One pair = «un pantalón»."
      - kind: imageMcq
        id: l1-im-pantalon
        target: { surface: "pantalón", meaningEn: "pants, trousers", emoji: "👖" }
        distractors:
          - { surface: "camisa", emoji: "👕" }
          - { surface: "zapato", emoji: "👞" }
          - { surface: "sombrero", emoji: "👒" }
      - kind: info
        id: l1-info-pantalonsingular
        title: "Pantalón — always singular"
        body: "«pantalón» — always singular in Spanish, even though English says \"pants\" (plural). «tengo un pantalón azul» — I have blue pants, one word, one article."
      - kind: speakLit
        id: l1-sp-tengounpantalonnuevo
        es: "tengo un pantalón nuevo"
        en: "I have new pants"
        atoms: ["tengo", "pantalón", "nuevo"]
      - kind: buildLit
        id: l1-b-tengounpantalonnuevo
        es: "tengo un pantalón nuevo"
        en: "I have new pants"
        atoms: ["tengo", "pantalón", "nuevo"]
        tiles: ["tienes", "una"]
      - kind: clozeLit
        id: l1-c-pantalonnuevo
        es: "tengo un pantalón nuevo"
        en: "I have new pants"
        blank: "un"
        options: ["un", "una"]
        atoms: ["tengo", "pantalón", "nuevo"]
        why: "«pantalón» is masculine, so «un», not «una»."
      - kind: listenCompLit
        id: l1-lc-pantalonviejo
        es: "tengo un pantalón viejo"
        en: "I have old pants."
