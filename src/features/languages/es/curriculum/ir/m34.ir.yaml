# ── REJECTED ALTERNATIVE 4: school/office supplies beyond m5/m11
#    (bolígrafo, cuaderno) ────────────────────────────────────────────────
# `libro`/`mesa`/`silla`/`lápiz`/`mochila`/`papel` are ALL already PRIOR —
# only `bolígrafo`/`cuaderno` are grep-verified virgin, again just TWO
