# ES m34 — errands around town: el banco, la farmacia, el hospital, el
# correo, el supermercado. Fifteenth A2 module.
#
#     el banco   🏦   la farmacia   💊
#     el hospital 🏥   el correo     📮
#     el supermercado 🏬
#
# ONE idea, the whole module: FIVE new imageable "places you have to go"
# nouns, zero new verb morphology, zero new grammar. Every sentence frame
# this module needs is already registered — «voy»/«vas»/«a»/«al» (m9, the
# ORIGINAL places-in-town motion frame this module is a direct sequel to),
# «necesito»/«necesitas»/«necesita» (m16), «ir» (m28, the bare infinitive
# that lets «necesito»/«tengo que» reach a destination — «necesito IR al
# banco», not «necesito el banco»), «tengo que» + the full bare-`tener`
# paradigm (m33, THIS COURSE'S OWN IMMEDIATELY-PRIOR MODULE — the freshest
# possible recombination target, unavailable to m33's own L10 because these
# nouns didn't exist yet), the fused clitics «comprarlo»/«comprarla»/
# «comprarlos» (m29, for a shopping-list object bought AT the new
# «supermercado», not the destination noun itself — see the dedicated
# section below), and «duele»/«duelen» + m30's body nouns (m31, a dedicated
# L9 pain-frame lesson exactly mirroring m32's own L9 shape). This is the
# fourth lexicon-break module since m19 (after m27's weather, m30's body,
# m32's clothing round two) and a direct sequel to m9's own original
# places-in-town debut (parque/tienda/escuela/cine/playa/mercado/trabajo/
# autobús) — same domain, a genuinely fresh subset, now with an
# obligation-and-need recombination story m9 itself couldn't have built
# (m16/m28/m29/m30/m31/m33 didn't exist yet).
#
# ── WHY THIS MODULE, NOW (decision, 2026-09-10) ───────────────────────────
# Four lines of evidence:
#   1. **Rhythm calls for a break, and m33 is exactly one grammar beat past
#      the last one.** m30 (break, body) → m31 (grammar, one beat, riding
#      m30's own nouns) → m32 (break, clothing round two) → m33 (grammar,
#      one beat, «tengo que») — the identical "one grammar beat, then a
#      break" cadence m32's own header used to justify its own placement
#      after m31, now applied forward: the break due after m33 is on
#      schedule, not overdue.
#   2. **Six honest domains were weighed against the actual registry, not
#      assumed from a candidate list's framing.** `grep -o 'surface:
#      "[^"]*"' curriculum/m{1..33}.ts | sort -u | grep -iE "<word>"` was
#      run against every candidate the task named (house/rooms, kitchen/
#      tableware, transport, places in town, school/office, nature/
#      outdoors) before picking one. Two disqualify most of their own
#      domain outright, not merely weaker — see REJECTED ALTERNATIVES
#      below. "Places in town" itself is NOT a fresh domain in the
#      aggregate (`cine`/`mercado`/`playa`/`tienda`/`trabajo`/`autobús`/
#      `escuela`/`parque` all PRIOR since m9, confirmed again here, matching
#      m32-header's own prior finding) — but the ERRANDS/SERVICES subset
#      the task's own example sentence pointed at (`banco`, `farmacia`,
#      `hospital`) was never actually checked by that finding and is
#      grep-verified fully virgin, alongside `correo` and `supermercado`.
#   3. **Highest recombination value of any candidate against the FOUR most
#      recent modules' own frames, verified hook by hook, not asserted —
#      and uniquely, a live hook into m33 itself, the freshest content this
#      course has.** `necesito` + `ir` (m16+m28) and `tengo que` + `ir`
#      (m33+m28) both give this module's five destination nouns a genuine
#      "obligation to go somewhere" frame no other candidate domain shares
#      with THREE prior grammar modules at once (m16, m28, m33). `duele`/
#      `duelen` + m30's body nouns (m31) gives farmacia/hospital a second,
#      independent, and thematically NATURAL recombination axis no other
#      candidate had this cleanly: "me duele la mano, tengo que ir al
#      hospital" is a real sentence an actual learner would say, not a
#      forced pairing. `voy`/`vas`/`a`/`al` (m9) gives every noun its own
#      simplest possible frame with zero new grammar. `comprarlo`/
#      `comprarla`/`comprarlos` (m29) reaches this module once, cleanly,
#      through `supermercado` as a shopping DESTINATION for an ALREADY-
#      PRIOR object noun (e.g. `leche`, m11) — "necesito leche, voy al
#      supermercado a comprarla" — not by fusing a clitic onto the
#      destination noun itself (you cannot "comprarlo" a hospital). No
#      other candidate domain considered reaches four independent PRIOR
#      recombination hooks, and none reaches m33 AT ALL (m33 is one module
#      old; only a module built immediately after it can recombine against
#      it fresh).
#   4. **Verified data floor, both directions, and a rare zero-vendoring
#      module (checked, not assumed).** `grep -o 'surface: "[^"]*"'
#      curriculum/m{1..33}.ts | sort -u | grep -iE
#      "^banco$|^farmacia$|^hospital$|^correo$|^supermercado$"` returns
#      zero hits for all five. All 5 target emoji (🏦💊🏥📮🏬) are grep-
#      verified zero prior hits against every `emoji:` field in m1–m33
#      (checked individually, including the two near-misses that matter:
#      `mercado`'s own 🛒, m9 — `supermercado` deliberately targets 🏬
#      instead, see below — and `estudiar`'s own 📚, m10 — `biblioteca`
#      was considered and dropped for exactly this collision, see REJECTED
#      WITHIN-DOMAIN below). Vendoring status checked file by file:
#      `ls src/pub/noto-emoji/svg/ | grep -iE
#      "^emoji_u(1f3e6|1f48a|1f3e5|1f4ee|1f3ec)"` returns all FIVE files
#      already on disk (`emoji_u1f3e6.svg` 🏦, `emoji_u1f48a.svg` 💊,
#      `emoji_u1f3e5.svg` 🏥, `emoji_u1f4ee.svg` 📮, `emoji_u1f3ec.svg` 🏬)
#      — ZERO vendoring work this module, breaking m32's own one-vendoring-
#      task precedent in the other direction (m30/m31 had zero, m32 had
#      one, this module has zero again). Named explicitly, not assumed
#      from m30/m31's streak.
#
# ── REJECTED WITHIN-DOMAIN: «biblioteca» (library) — the same emoji-
#    collision trap m27/m30/m32 each already warned a future author
#    against, now actually live for THIS domain ───────────────────────────
# «biblioteca» is grep-verified fully unregistered and a natural sixth
# "place in town" atom. Excluded deliberately: its only clean single-
# referent emoji, 📚 (stack of books), is ALREADY «estudiar»'s (m10,
# confirmed by reading `curriculum/m10.ts:31` — «estudiar» registers 📚 as
# its own atom emoji). Reaching for it collides silently with a PRIOR
# atom's image — the identical mistake m27's ☀️/🌞 trap, m30's own
# REJECTED ALTERNATIVE 2 note, and m32's own «vestido»/👗 rejection all
# warned a future author against. This module is that future author for
# ITS OWN domain; the trap is named and paid down, not repeated.
#
# ── REJECTED WITHIN-DOMAIN: «oficina» (office) — real, virgin, but
#    redundant against a PRIOR atom's own semantic territory ─────────────
# `oficina` is grep-verified fully unregistered and has a clean, unspent
# emoji (🏢, verified zero collision). Rejected anyway: `trabajo` (m9,
# 💼) already covers "the place I have to go for work" in every sentence
# this course has built so far ("voy al trabajo," "tengo que ir al
# trabajo" both already fully legal PRIOR recombination with zero new
# vocabulary) — adding `oficina` as a SEPARATE atom would teach a second
# word for a concept `trabajo` already owns at this course's level, a
# near-synonym distinction (workplace-in-general vs. a specific office
# building) too fine-grained for an A2 "obligation to go somewhere"
# lexicon break. Left open as real future content for a module that
# actually needs the office/workplace distinction (e.g. a jobs/professions
# module), not this one's job.
#
# ── REJECTED ALTERNATIVE 1: kitchen/tableware (plato, vaso, cuchara,
#    tenedor, cuchillo, taza, olla, sartén, servilleta) ───────────────────
# Genuinely, completely virgin — `grep -o 'surface: "[^"]*"'
# curriculum/m{1..33}.ts | sort -u | grep -iE
# "plato|vaso|cuchara|tenedor|cuchillo|taza|olla|sartén|servilleta"`
# returns zero hits for all nine, the cleanest data floor of any candidate
# considered. Rejected for m34 specifically on recombination grounds, not
# viability: `tengo`/`necesito` give a bare-possession frame ("tengo un
# plato"), but there is no clean tie to `voy a` + infinitivo (you don't
# "go to" a fork), no tie to `duele`/`duelen` (a plate does not hurt), and
# only a forced tie to `comprarlo`-family ("voy a comprarlo" needs a
# SHOPPING DESTINATION noun to anchor the sentence, which this domain does
# not supply on its own — it's a domain of objects, not places, and this
# module specifically wanted a "somewhere to go" frame to ride m33's
# obligation grammar while it's freshest). Errands/places reaches m16,
# m28, m29 (indirectly, via `supermercado` as destination), m31, AND m33
# — kitchen/tableware reaches only m16 directly. Left open as a strong,
# well-scoped future break (a "setting the table" dialogue_sim writes
# itself once this module exists).
#
# ── REJECTED ALTERNATIVE 2: transport (tren, coche, bicicleta, avión,
#    barco, taxi, metro) ──────────────────────────────────────────────────
# Also genuinely virgin (`autobús`/`carro` are the only PRIOR transport
# words, m9/elsewhere; `tren`/`coche`/`bicicleta`/`avión`/`barco`/`taxi`/
# `metro` are grep-verified zero hits). Rejected for m34 on two grounds:
# (1) the natural verb this domain wants — "tomar el tren," "tomar el
# autobús" — needs `tomar` (to take/catch), grep-verified NOT PRIOR
# anywhere in m1–m33, a second new idea (a verb) competing with the
# module's own "zero new grammar, ride PRIOR frames only" discipline the
# task itself asked for; without `tomar`, the domain is stuck reusing
# `voy en tren` (go BY train), a valid but noticeably thinner sentence
# variety than "voy al banco"/"necesito ir a la farmacia." (2) weaker
# recombination: no tie to `tengo que` + `ir` beyond the same thin `voy
# en` frame, no tie to `duele`/`duelen`, no tie to `comprarlo`-family
# (buying a mode of transport is not this course's beginner shopping
# frame). Left open as real future content, cleanest once paired with a
# `tomar` debut of its own.
#
# ── REJECTED ALTERNATIVE 3: house/rooms beyond m3/m4 (dormitorio, sala) ──
# `cocina`/`baño` are BOTH already PRIOR (confirmed again here, matching
# the task's own framing question) — only `dormitorio`/`sala`/`habitación`
# are grep-verified virgin, TWO usable atoms at most (a third, `armario`,
