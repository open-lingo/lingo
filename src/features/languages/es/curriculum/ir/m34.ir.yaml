#
# ── REJECTED ALTERNATIVE 5: nature/outdoors (árbol, flor, sol, luna,
#    estrella, montaña, río, lago, bosque, cielo) ─────────────────────────
# Fully virgin (`grep -o 'surface: "[^"]*"' curriculum/m{1..33}.ts | sort
# -u | grep -iE "árbol|flor|sol|luna|estrella|montaña|río|lago|bosque|
# cielo"` returns zero hits for all ten — even `sol`, despite m27's own
# weather module using the PHRASE "hace sol," never registers `sol` as its
# own standalone atom, confirmed by direct read of `curriculum/m27.ts`).
# Rejected for m34 because it shares NONE of errands/places' recombination
# hooks: no `voy a`/`necesito ir a`/`tengo que ir a` obligation tie (you
# don't have an obligation to go look at a tree), no `duele`/`duelen` tie,
