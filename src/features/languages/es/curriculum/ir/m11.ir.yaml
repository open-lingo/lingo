      # ── TRANSFER TEST — the one step the module is built to earn ────────
      #   Everything above is a pick between forms already drilled. This is
      #   the machine run on a verb whose cells the learner has NEVER seen.
      #   «recibir» is a free cognate on purpose: the whole cognitive load
      #   lands on the ENDING, which is the thing being tested. Its four
      #   cells are registered for THIS BEAT ONLY and appear nowhere else in
      #   m11 — not in a matchLit, not in a tile bank, not in a later lesson.
      #   The shape is forced, not chosen:
      #     - speakLit + buildLit are the intro-capable step types that fit;
      #       a textMcq debut fails the provenance gate (multiple_choice is
      #       not in ES_INTRO_TYPES), so the four cells could not debut there.
      #     - the buildLit's tile bank holds ALL THREE singular cells, so the
      #       answer cannot be found by shape — «recibo» has to be reasoned.
      #     - a cue:"recall" speakLit is ILLEGAL here: the course-wide recall
      #       law licenses recall only for a phrase an earlier SPEAKING step
      #       already printed, and nothing has ever printed «recibir».
      #   WHY NOT escribir/leer/correr: this module's own pin keeps those
      #   three infinitive-only, and that pin is right — a conjugated cell of
      #   a verb the module never drills is an untaught form appearing
      #   nowhere else. Hence a twenty-first atom rather than a cheaper reuse.
      #   Placement: between cp-tm-1 (textMcq) and cp-ear-3 (audioWimcq), so
      #   neither transfer step touches a step of its own kind, and — both
      #   being generation steps — the pair BREAKS selection runs rather than
      #   building one.
