module: m6
title: "Describe it — the words that flip to match"
frame: none
throughModule: m5
expectedLessonCount: 10
checkpoint: 8

# ES m6 — «Describe it»: adjective agreement, the -o/-a flip, invariant
# adjectives, and post-noun word order. Third §13-doctrine IR module
# (m3/m4 are the exemplars); first module to ship agreementLit and
# genderSort.
#
# SPINE PROVENANCE: atom inventory + arc PINNED by
# docs/es-m4-m10-wave-2026-08-24.md ("m6 — Describe it"). The doc names
# 15 atoms and labels the count "(16)" — grande, pequeño, bonito, nuevo,
# viejo, bueno, malo, muy, pero, rojo, azul, verde, negro, blanco, carro.
# This IR registers exactly those 15 named atoms and no others; the count
# label is a documentation miscount (flagged, not silently "fixed" by
# inventing a 16th word against "nothing added... against that spec").
#
# DOCTRINE NOTES:
#   - Adjectives register MASCULINE ONLY (grande, pequeño, bonito, nuevo,
#     viejo, bueno, malo, rojo, azul, verde, negro, blanco) — the gender
#     canon derives the feminine surfaces (pequeña, bonita, nueva, vieja,
#     buena, mala, roja, negra, blanca) used freely across this module's
#     sentences/clozes/builds/agreementLit blanks. meaningEn carries an
#     "(m)" suffix on every FLIP-class adjective (pequeño/bonito/nuevo/
#     viejo/bueno/malo/rojo/negro/blanco) and no suffix on the three true
#     INVARIANTS (grande, azul, verde — no -o to flip), mirroring the
#     archived July m4 registry convention.
#   - THE CONTRAST: bonito is the flagship flip (L3's dedicated lesson,
#     both genders drilled via agreementLit + alternating clozes).
#     grande/azul/verde are explicitly, repeatedly trialed as "don't add
#     -a" traps (L7 dedicated invariant-trap trio; a 4th retest in L8).
#   - Word order: adjectives sit AFTER the noun («el carro rojo»). L4
#     teaches this with a CROSSING word_map (English "the RED CAR" vs
#     Spanish token order car-then-red), then transfers the order to a
#     DIFFERENT noun («el libro verde») in a build two steps later —
#     never the same noun at i+2 (the m3 confirmation-walk law).
#   - Non-imageable adjectives (grande, pequeño, bonito, nuevo, viejo,
#     bueno, malo) and the particles (muy, pero) debut by MAP ELIMINATION
#     inside a full «es + adjective» sentence — the m4 convention for
#     words with no honest single emoji, extended here because an
#     adjective only means anything inside a sentence anyway. Colors
#     (rojo, azul, verde, negro, blanco) debut by imageMcq using honest
#     swatch emoji (🔴🔵🟢⚫⚪ — the wave doc's own "ARE honest art" call);
#     carro debuts by imageMcq (🚗, an ordinary imageable noun, m4-style).
#   - Tints: every word_map's tokenGenders tints the whole AGREEMENT
#     CHAIN (article + noun + a flip-class adjective) in the noun's hue;
#     the three invariants (grande/azul/verde) are left OUT of
#     tokenGenders on maps that carry them, because untinted IS the
#     lesson (13.4).
#   - «muy» never stacks (stated explicitly in L2's card; the placement
#     bank's pl-4 distractor is literally "es muy muy bonito"). «pero»
#     joins at most two clauses/adjectives per sentence — every «pero»
#     sentence in this module has exactly one. ser stays implicit: every
#     description uses «es» (m2's atom); no estar+adjective anywhere.
#   - Two rule-card safety fixes applied against the "first trial reuses
#     the card's own printed sentence" defect: L1's callback card and
#     L4's order card both state their rule WITHOUT printing a complete
#     example sentence (L1 stays abstract; L4 names the concept and
#     defers the concrete "el carro rojo" to the map two steps later).
#     L3's card prints the bare word-pair «bonito → bonita», never a full
#     sentence, so the map right after it is the first FULL sentence.
#   - Cast: Ana, Diego, Sofía, María (bus) all reprise their m3-m5 roles;
#     Carmen stays offstage (m7 debut). The describing game (L6) is m3's
#     naming game, level 2: «¿qué es? — es una carro... es pequeño... es
#     rojo». L9's summit gives María a carro and cashes «el carro es de
#     María» (the m3/m4 "es de + name" possession pattern). Learner = Sam.
#   - genderSort ships ONCE (L7, well under the ≤2 cap): a warm-up sort of
#     six already-taught bare nouns onto el/la, including m4's two liars
#     (agua, foto) with their notes — a callback that sets up L7's
#     invariant-adjective trio right after.
#
# VOICING LEDGER (printed speak/map → licenses later cue:"recall"):
#   la casa es grande L1 · muy bonito L3 · el carro rojo L4 ·
#   es viejo pero bueno L5 · el carro es de María L9
#   m6-internal recalls drawn from the above: el carro rojo (L8, L10),
#   es viejo pero bueno (L8), muy bonito (L8)
#   cross-module (licensed by m1/m3/m4/m5 printed voicings): el gato (L1),
#   el agua (L2), ¿qué es? (L3), la cocina (L4), es un lápiz (L5),
#   hay dos libros (L6), el papel (L7), mi familia (L9)
newAtoms:
  - { surface: "grande", meaningEn: "big", partOfSpeech: "adjective", kind: "vocab" }
  - { surface: "pequeño", meaningEn: "small (m)", partOfSpeech: "adjective", kind: "vocab", hint: "ñ sounds like ny: peh-KEH-nyo" }
  - { surface: "bonito", meaningEn: "pretty (m)", partOfSpeech: "adjective", kind: "vocab" }
  - { surface: "nuevo", meaningEn: "new (m)", partOfSpeech: "adjective", kind: "vocab" }
  - { surface: "viejo", meaningEn: "old (m)", partOfSpeech: "adjective", kind: "vocab" }
  - { surface: "bueno", meaningEn: "good (m)", partOfSpeech: "adjective", kind: "vocab" }
  - { surface: "malo", meaningEn: "bad (m)", partOfSpeech: "adjective", kind: "vocab" }
  - { surface: "muy", meaningEn: "very", partOfSpeech: "particle", kind: "particle" }
  - { surface: "pero", meaningEn: "but", partOfSpeech: "particle", kind: "particle" }
  - { surface: "rojo", meaningEn: "red (m)", partOfSpeech: "adjective", kind: "vocab", emoji: "🔴" }
  - { surface: "azul", meaningEn: "blue", partOfSpeech: "adjective", kind: "vocab", emoji: "🔵" }
  - { surface: "verde", meaningEn: "green", partOfSpeech: "adjective", kind: "vocab", emoji: "🟢" }
  - { surface: "negro", meaningEn: "black (m)", partOfSpeech: "adjective", kind: "vocab", emoji: "⚫" }
  - { surface: "blanco", meaningEn: "white (m)", partOfSpeech: "adjective", kind: "vocab", emoji: "⚪" }
  - { surface: "carro", meaningEn: "car", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "🚗" }

lessons:
  # ── L1 · the callback card + grande/pequeño debuts. ──────────────────
  - n: 1
    template: free
    title: "Big or small — say it"
    description: "La-words glow pink, el-words glow blue — here's what describing words do about it. Say something's big or small."
    steps:
      - kind: info
        id: info-callback
        title: "Pink and blue, at work"
        body: "Since m3, la-words glow pink and el-words glow blue. Now you'll meet describing words: some flip an ending to match the word they describe, others never change at all. Today: «es» + a describing word — «es» says what something IS; «está» from m4 keeps its job of saying WHERE it is."
      - kind: map
        id: map-casagrande
        tokens: ["la", "casa", "es", "grande"]
        pairs:
          - { en: "the", tokenIndex: 0 }
          - { en: "house", tokenIndex: 1 }
          - { en: "is", tokenIndex: 2 }
          - { en: "big", tokenIndex: 3 }
        audioText: "la casa es grande"
        revealNote: "la, casa, es are all yours — grande is the only new one, and now you can say something's big."
        tokenGenders: { 0: "f", 1: "f" }
      - kind: speakLit
        id: sp-esgrande
        es: "es grande"
        en: "it's big"
        atoms: ["es", "grande"]
      - kind: map
        id: map-perropequeno
        tokens: ["el", "perro", "es", "pequeño"]
        pairs:
          - { en: "the", tokenIndex: 0 }
          - { en: "dog", tokenIndex: 1 }
          - { en: "is", tokenIndex: 2 }
          - { en: "small", tokenIndex: 3 }
        audioText: "el perro es pequeño"
        revealNote: "perro is yours from m5 — pequeño is new: the opposite of grande."
        tokenGenders: { 0: "m", 1: "m", 3: "m" }
      - kind: speakLit
        id: sp-espequeno
        es: "es pequeño"
        en: "it's small"
        atoms: ["es", "pequeño"]
      - kind: clozeLit
        id: c-grandepequeno1
        es: "la mesa es grande"
        en: "the table is big"
        blank: "grande"
        options: ["grande", "pequeño"]
        atoms: ["la", "mesa", "es", "grande"]
        why: "grande and pequeño are opposites — 'big' is what you need here."
      - kind: buildLit
        id: b-cuartopequeno
        es: "el cuarto es pequeño"
        en: "the room is small"
        atoms: ["el", "cuarto", "es", "pequeño"]
        tiles: ["la", "grande"]
      - kind: audioWimcq
        id: ear-review-perrogato
        target: { surface: "el perro", emoji: "🐶" }
        distractors:
          - { surface: "el gato", emoji: "🐱" }
          - { surface: "una llave", emoji: "🔑" }
      - kind: listenCompLit
        id: lc-perrogrande
        es: "el perro es grande"
        en: "The dog is big."
        atoms: ["el", "perro", "es", "grande"]
        distractorsEn:
          - "The dog is small."
          - "The cat is big."
          - "There's a big dog."
      - kind: speakLit
        id: sp-recall-tengounperro
        es: "tengo un perro"
        en: "I have a dog"
        atoms: []
        cue: recall
      - kind: clozeLit
        id: c-grandepequeno2
        es: "el gato es pequeño"
        en: "the cat is small"
        blank: "pequeño"
        options: ["pequeño", "grande"]
        atoms: ["el", "gato", "es", "pequeño"]
        why: "pequeño is the opposite of grande — 'small' is what you need here."
      - kind: buildLit
        id: b-librogrande
        es: "el libro es grande"
        en: "the book is big"
        atoms: ["el", "libro", "es", "grande"]
        tiles: ["la", "pequeño"]
      - kind: matchLit
        id: match
        pairs:
          - { source: "grande", target: "big" }
          - { source: "pequeño", target: "small" }
          - { source: "el perro", target: "the dog" }
          - { source: "el gato", target: "the cat" }
          - { source: "la mesa", target: "the table" }
          - { source: "gracias", target: "thank you" }
      - kind: sim
        id: sim-anasizes
        scene: { emoji: "🏠", title: "Ana's new place", setting: "Ana shows you a photo of her house." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¡Mi casa! ¿Grande o pequeña?", audioText: "¡mi casa! ¿grande o pequeña?", gloss: "My house! Big or small?" }
            goal: "Say it's big."
            reply:
              mode: choice
              options:
                - { id: "right", text: "es grande" }
                - { id: "wrong1", text: "es pequeña" }
                - { id: "wrong2", text: "es un gato" }
              correctOptionId: "right"
              audioText: "es grande"
            replyGloss: "It's big."
      - kind: speakLit
        id: sp-win
        es: "el libro es pequeño"
        en: "the book is small"
        atoms: ["el", "libro", "es", "pequeño"]

  # ── L2 · colors I (rojo, azul, negro) interleaved with muy. ──────────
  - n: 2
    template: free
    title: "Three colors — and very"
    description: "muy turns anything up — and three new colors to turn up."
    steps:
      - kind: info
        id: info-muy
        title: "Turn it up"
        body: "«muy» means 'very' — put it right before a describing word to boost it: muy grande = very big. Just one «muy» per word — «muy muy» isn't a thing in Spanish."
      - kind: map
        id: map-muygrande
        tokens: ["la", "casa", "es", "muy", "grande"]
        pairs:
          - { en: "the", tokenIndex: 0 }
          - { en: "house", tokenIndex: 1 }
          - { en: "is", tokenIndex: 2 }
          - { en: "very", tokenIndex: 3 }
          - { en: "big", tokenIndex: 4 }
        audioText: "la casa es muy grande"
        revealNote: "la, casa, es, grande are all yours — muy is the new piece, and it just means 'very.'"
        tokenGenders: { 0: "f", 1: "f" }
      - kind: speakLit
        id: sp-muygrande
        es: "muy grande"
        en: "very big"
        atoms: ["muy", "grande"]
      - kind: imageMcq
        id: d-rojo
        target: { surface: "rojo", meaningEn: "red", emoji: "🔴" }
        distractors:
          - { surface: "la cama", emoji: "🛏️" }
          - { surface: "el gato", emoji: "🐱" }
          - { surface: "una llave", emoji: "🔑" }
      - kind: speakLit
        id: sp-rojo
        es: "rojo"
        en: "red"
        atoms: ["rojo"]
      - kind: imageMcq
        id: d-azul
        target: { surface: "azul", meaningEn: "blue", emoji: "🔵" }
        distractors:
          - { surface: "rojo", emoji: "🔴" }
          - { surface: "el gato", emoji: "🐱" }
          - { surface: "la cama", emoji: "🛏️" }
      - kind: clozeLit
        id: c-rojoazul
        es: "el libro es azul"
        en: "the book is blue"
        blank: "azul"
        options: ["azul", "rojo"]
        atoms: ["el", "libro", "es", "azul"]
        why: "You're told it's blue, not red — azul."
      - kind: buildLit
        id: b-librorojo
        es: "el libro es rojo"
        en: "the book is red"
        atoms: ["el", "libro", "es", "rojo"]
        tiles: ["la", "azul"]
      - kind: imageMcq
        id: d-negro
        target: { surface: "negro", meaningEn: "black", emoji: "⚫" }
        distractors:
          - { surface: "rojo", emoji: "🔴" }
          - { surface: "azul", emoji: "🔵" }
          - { surface: "el gato", emoji: "🐱" }
      - kind: speakLit
        id: sp-negro
        es: "negro"
        en: "black"
        atoms: ["negro"]
      - kind: audioWimcq
        id: ear-rojonegro
        target: { surface: "rojo", emoji: "🔴" }
        distractors:
          - { surface: "negro", emoji: "⚫" }
          - { surface: "azul", emoji: "🔵" }
      - kind: clozeLit
        id: c-muypequeno
        es: "el gato es muy pequeño"
        en: "the cat is very small"
        blank: "muy"
        options: ["muy", "negro"]
        atoms: ["el", "gato", "es", "muy", "pequeño"]
        why: "negro describes color, not size — you need the booster «muy» here."
      - kind: buildLit
        id: b-perronegro
        es: "el perro es negro"
        en: "the dog is black"
        atoms: ["el", "perro", "es", "negro"]
        tiles: ["la", "rojo"]
      - kind: listenCompLit
        id: lc-casaazul
        es: "la casa es azul"
        en: "The house is blue."
        atoms: ["la", "casa", "es", "azul"]
        distractorsEn:
          - "The house is red."
          - "The book is blue."
          - "There's a blue house."
      - kind: speakLit
        id: sp-recall-elagua
        es: "el agua"
        en: "the water"
        atoms: []
        cue: recall
      - kind: audioWimcq
        id: ear-review-cocina
        target: { surface: "la cocina", emoji: "🍳" }
        distractors:
          - { surface: "el baño", emoji: "🚽" }
          - { surface: "la cama", emoji: "🛏️" }
      - kind: matchLit
        id: match
        pairs:
          - { source: "rojo", target: "red" }
          - { source: "azul", target: "blue" }
          - { source: "negro", target: "black" }
          - { source: "muy", target: "very" }
          - { source: "el perro", target: "the dog" }
          - { source: "la cocina", target: "the kitchen" }
      - kind: sim
        id: sim-anacolors
        scene: { emoji: "🖍️", title: "Ana picks a color", setting: "Ana holds up two markers." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Es rojo o azul?", audioText: "¿es rojo o azul?", gloss: "Is it red or blue?" }
            goal: "Say — it's red."
            reply:
              mode: choice
              options:
                - { id: "right", text: "es rojo" }
                - { id: "wrong1", text: "es azul" }
                - { id: "wrong2", text: "es negro" }
              correctOptionId: "right"
              audioText: "es rojo"
            replyGloss: "It's red."
          - id: t2
            npc: { speaker: "Ana", es: "¡Perfecto! ¿Y tu perro — grande o pequeño?", audioText: "¡perfecto! ¿y tu perro, grande o pequeño?", gloss: "Perfect! And your dog — big or small?" }
            goal: "Say he's small."
            reply:
              mode: build
              tiles: ["es", "pequeño", "grande"]
              answer: "es pequeño"
            replyGloss: "He's small."
      - kind: speakLit
        id: sp-win
        es: "la casa es azul y muy grande"
        en: "the house is blue and very big"
        atoms: ["la", "casa", "es", "azul", "y", "muy", "grande"]

  # ── L3 · the flip — bonito/bonita + agreement clozes. ────────────────
  - n: 3
    template: free
    title: "Watch it flip"
    description: "bonito becomes bonita after a la-word — the whole agreement rule, in one word."
    steps:
      - kind: info
        id: info-flip
        title: "The flip"
        body: "Some describing words flip their last letter: bonito → bonita after a la-word — the same -o/-a switch maestro/maestra made back in m2. A word with no -o at the end (like grande) has nothing to flip, so it never changes."
      - kind: map
        id: map-perrobonito
        tokens: ["el", "perro", "es", "bonito"]
        pairs:
          - { en: "the", tokenIndex: 0 }
          - { en: "dog", tokenIndex: 1 }
          - { en: "is", tokenIndex: 2 }
          - { en: "pretty", tokenIndex: 3 }
        audioText: "el perro es bonito"
        revealNote: "el, perro, es are yours — bonito is new, and you'll see it change in a moment."
        tokenGenders: { 0: "m", 1: "m", 3: "m" }
      - kind: speakLit
        id: sp-bonito
        es: "bonito"
        en: "pretty"
        atoms: ["bonito"]
      - kind: map
        id: map-casabonita
        tokens: ["la", "casa", "es", "bonita"]
        pairs:
          - { en: "the", tokenIndex: 0 }
          - { en: "house", tokenIndex: 1 }
          - { en: "is", tokenIndex: 2 }
          - { en: "pretty", tokenIndex: 3 }
        audioText: "la casa es bonita"
        revealNote: "Same word, new ending — la casa flips bonito to bonita. That's the whole rule."
        tokenGenders: { 0: "f", 1: "f", 3: "f" }
      - kind: speakLit
        id: sp-muybonito
        es: "muy bonito"
        en: "very pretty"
        atoms: ["muy", "bonito"]
      - kind: agreementLit
        id: agr-casabonita
        segments:
          - { blank: { id: "art", answer: "la", options: ["la", "el"] } }
          - { text: " casa es bonit" }
          - { blank: { id: "adj", answer: "a", options: ["a", "o"] } }
        en: "the house is pretty"
        audioText: "la casa es bonita"
        atoms: ["la", "casa", "es", "bonito"]
      - kind: clozeLit
        id: c-bonitomasc
        es: "el libro es bonito"
        en: "the book is pretty"
        blank: "bonito"
        options: ["bonito", "bonita"]
        atoms: ["el", "libro", "es", "bonito"]
        why: "libro is an el-word — bonito stays as is."
      - kind: buildLit
        id: b-mesabonita
        es: "la mesa es bonita"
        en: "the table is pretty"
        atoms: ["la", "mesa", "es", "bonito"]
        tiles: ["el", "bonito"]
      - kind: clozeLit
        id: c-bonitofem
        es: "la llave es bonita"
        en: "the key is pretty"
        blank: "bonita"
        options: ["bonita", "bonito"]
        atoms: ["la", "llave", "es", "bonito"]
        why: "llave is a la-word — you've known that since m3 — so bonita matches."
      - kind: audioWimcq
        id: ear-review-llave
        target: { surface: "una llave", emoji: "🔑" }
        distractors:
          - { surface: "el libro", emoji: "📖" }
          - { surface: "la puerta", emoji: "🚪" }
      - kind: agreementLit
        id: agr-gatobonito
        segments:
          - { blank: { id: "art", answer: "el", options: ["el", "la"] } }
          - { text: " gato es bonit" }
          - { blank: { id: "adj", answer: "o", options: ["o", "a"] } }
        en: "the cat is pretty"
        audioText: "el gato es bonito"
        atoms: ["el", "gato", "es", "bonito"]
      - kind: buildLit
        id: b-ventanabonita
        es: "la ventana es bonita"
        en: "the window is pretty"
        atoms: ["la", "ventana", "es", "bonito"]
        tiles: ["el", "bonito"]
      - kind: listenCompLit
        id: lc-cocinabonita
        es: "la cocina es bonita"
        en: "The kitchen is pretty."
        atoms: ["la", "cocina", "es", "bonito"]
        distractorsEn:
          - "The kitchen is big."
          - "The bathroom is pretty."
          - "There's a pretty kitchen."
      - kind: speakLit
        id: sp-recall-quees
        es: "¿qué es?"
        en: "what is it?"
        atoms: []
        cue: recall
      - kind: textMcq
        id: tm-bonito
        target: "bonito"
        distractors: ["bonita", "grande", "pequeño"]
      - kind: matchLit
        id: match
        pairs:
          - { source: "bonito", target: "pretty" }
          - { source: "muy bonito", target: "very pretty" }
          - { source: "grande", target: "big" }
          - { source: "rojo", target: "red" }
          - { source: "la ventana", target: "the window" }
          - { source: "buenas tardes", target: "good afternoon" }
      - kind: sim
        id: sim-sofia-bonita
        scene: { emoji: "🏡", title: "Sofía's house", setting: "Sofía shows off her house." }
        turns:
          - id: t1
            npc: { speaker: "Sofía", es: "Mi casa es bonita.", audioText: "mi casa es bonita.", gloss: "My house is pretty." }
            goal: "Agree — say yes, very pretty."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, es muy bonita" }
                - { id: "wrong1", text: "no, es grande" }
                - { id: "wrong2", text: "es azul" }
              correctOptionId: "right"
              audioText: "sí, es muy bonita"
            replyGloss: "Yes, very pretty."
          - id: t2
