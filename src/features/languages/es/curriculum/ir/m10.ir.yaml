module: m10
title: "The verb machine — one swap, a hundred verbs"
frame: none
throughModule: m9
expectedLessonCount: 10
checkpoint: 8

# ES m10 — «The verb machine»: the course's FIRST true conjugation-paradigm
# module. hablar/trabajar/estudiar run the -o/-as/-a machine; escuchar/
# bailar/cantar stay infinitive-only; siempre/nunca discriminate; the
# module closes on María's language exchange. Fifth §13-doctrine IR module
# (m4/m5/m7 are the freshest siblings; m3 the original exemplar). m8/m9 are
# authored in parallel — this file relies on THEIR pinned atom lists +
# REQUIRED voicings (docs/es-m4-m10-wave-2026-08-24.md, "m8 — La semana" /
# "m9 — Vamos") as taught/licensed, per throughModule: m9.
#
# SPINE PROVENANCE: atom inventory + arc PINNED by
# docs/es-m4-m10-wave-2026-08-24.md ("m10 — the -ar machine"). 20 registered
# atoms: hablar, trabajar, estudiar, hablo, hablas, habla, trabajas, trabaja,
# estudio, estudias, estudia, escuchar, bailar, cantar, siempre, nunca,
# todos los días, español, un poco, música. Nothing added, dropped or
# renamed against that spec, with ONE deliberate correction (flagged by the
# spec's own "?"): the REQUIRED-voicing candidate «escucho música» is
# DROPPED — «escuchar» is explicitly infinitive-only, never conjugated in
# this module, so «escucho» would be an untaught conjugated form appearing
# nowhere else. «quiero escuchar música» carries the same music beat
# without breaking that rule (the m7 «un té con leche» precedent: the spec
# names its own uncertain line with "?", the dispatch resolves it in the
# direction the hard rules force).
#
# ⚠️ TRABAJO COLLISION: «trabajo» is ALREADY a registered atom — m9's noun
# ("work"). FIRST-WRITE-WINS means it is NOT in this file's newAtoms; every
# sentence that needs "I work" uses the surface «trabajo» un-registered,
# exercised only through use (L3's info card states the pun explicitly:
# "«trabajo» is already yours as a noun — now it's also 'I work.' Same
# word, new job."). trabajas/trabaja ARE new atoms here, registered
# normally.
#
# DOCTRINE NOTES:
#   - THE MACHINE CARD (L1, once): hablar → hablo (I) / hablas (you) /
#     habla (he/she) is shown as a three-row table exactly once, in L1's
#     info card. No later card repeats it — every subsequent lesson is
#     USE. The word "conjugation" never appears in any learner-facing
#     text. Judgment call: the L1 card previews «habla» (L2's own atom) as
#     the table's third row before habla has its own debut step — the
#     table is instructional prose, not an exercised sentence, so it does
#     not trip the comprehensibility gate (no `atoms:` list claims habla
#     before L2); this is the module's central pedagogical device (see the
#     whole machine before drilling each gear) and mirrors how m6's
#     agreement callback card previews a pattern before its own drills.
#   - Atom allocation across lessons (20 total, trabajo excluded):
#     L1 hablar/hablo/hablas (3) · L2 habla/español/música (3) ·
#     L3 trabajar/trabajas/trabaja (3) · L4 estudiar/estudio/estudias/
#     estudia/siempre/nunca (6) · L5 escuchar/bailar/cantar (3) ·
#     L6 todos los días/un poco (2). L7–L10 are zero-new. Total 3+3+3+6+3+2
#     = 20.
#   - Person build-out DELIBERATELY differs by verb, mirroring the arc's
#     own escalating scaffold: hablar gets three separate map-elimination
#     debuts spread across L1–L2 (fully worked, the "watch me do it"
#     verb); trabajar gets three separate map debuts too, but all in one
#     lesson (L3, the first full single-lesson transfer, with the pun card
#     line making the transfer explicit: "same machine, new verb");
#     estudiar gets the SAME map-per-form treatment (comprehensibility
#     still requires an intro-before-review step for every atom) but
#     lighter surrounding scaffolding and denser cloze/production
#     immediately after — this is "the TEST of the module" the spec names
#     (can the learner run the machine on a verb met only as -ar?),
#     operationalized as less hand-holding around the third verb's debuts
#     rather than skipping intro steps outright (skipping them would
#     violate intro-before-review, which is machine-enforced elsewhere in
#     the course). Flagged as a judgment call.
#   - Every hablar/trabajar/estudiar form debuts through a REAL sentence,
#     never a bare conjugation list: «hablo ahora» (m9's «ahora»), «trabajo
#     en la escuela» (the exact line the hard rules name — doubles as the
#     pun-card's worked example), «Ana estudia en casa» (bare «casa» after
#     «en», echoing m9's own «voy a casa» article-drop exception, not a
#     new one).
#   - hablo/hablas/habla three-way lane: every clozeLit is 2-option (the
#     clozeLit factory enforces this — the blank must be one literal word
#     of the sentence), so the "3-way" lane is built as a ROTATING cycle of
#     2-option pairs (hablo↔hablas, hablas↔habla, habla↔hablo) repeated
#     across L1/L2/L7/L8/L9/L10 until every slot has appeared correct
#     roughly equally. Tally (correct-option counts): hablo 4 (L1, L7,
#     L8×2 via cp-lc-1's audio-comp + cp-cloze equivalents, L10) · hablas 3
#     (L2, L7, L9) · habla 4 (L2, L7, L8×2, L9-adjacent via cloze) — see
#     the per-lesson step list below for exact ids; balance is close, not
#     exact, per the spec's own "near-balanced" wording (m7's own
#     quiero/quieres tally was 3:3, this module's third slot makes exact
#     parity across three cells harder and the dispatch did not force it
#     artificially with a filler cloze).
#   - siempre/nunca: both live throughout — L4 debuts both (siempre via
#     «siempre estudio», nunca via «nunca trabajo», m9's own trabajo
#     un-conjugated form cashed a second way); clozes recur L4×2, L7, L8,
#     L9, each a FRESH sentence (no byte-identical repeats); an ear lane
#     (audioWimcq, honest non-punny icons 🔁/🚫) runs once in L4.
#   - «todos los días» pays off m8's whole week atoms; its debut sits
#     inside a self-cueing sim (L6, `debut: true`), the SAME mechanism m7
#     used for «tengo hambre»/«tengo sed» — a multi-word phrase atom is
#     awkward to map-eliminate word-by-word (its constituent words are not
#     independently "taught" the way a single new word inside an otherwise-
#     known sentence would be), so the NPC's own line carries the first
#     printed exposure and the learner's reply is the first production.
#     «un poco» debuts via map instead (tokenized as ONE unit — «un poco»
#     — rather than split into «un»/«poco», since «poco» alone is not an
#     atom; only the phrase is registered).
#   - Multi-word phrase atoms (todos los días, un poco) are NEVER blanked
#     in a clozeLit (the factory requires the blank be a single literal
#     word of the sentence) — every check on those two atoms runs through
#     textMcq, listenCompLit, buildLit or a sim turn instead.
#   - quiero + infinitive beat (L5, one card line only, per the hard rule):
#     «quiero bailar» — the m7 payoff, and the module's own note that
#     infinitives are usable words WITHOUT the machine. escuchar/bailar/
#     cantar are infinitive-only for the module's entire run — no step
#     anywhere conjugates them (checked by hand across every lesson); the
#     nearest brush with temptation (a sim NPC asking "do you sing too?")
#     is phrased «¿quieres cantar también?», never «¿cantas?».
#   - L1 also gives «hablar» itself a light bare-word touch (a speakLit
#     right after the machine card, and «quiero hablar» as an early build)
#     — a small preview of the "infinitives don't need the machine" idea
#     that L5's card states explicitly; this is USE without explanation,
#     so it does not spend the "one card line" budget.
#   - español drops its article after hablar/estudiar («habla español»,
#     never «habla el español») — stated once, in L2's map revealNote, the
#     m9 «voy a casa» pattern applied to a second exception.
#   - español's emoji is the Spanish flag (🇪🇸) — a meaning-based metonym
#     for the language (common convention, not a sound-pun); flagged as a
#     judgment call since the course's usual honesty bar is "depicts the
#     referent," and a flag depicts a country standing in for a language.
#   - m5 payoff (L6): «mi madre trabaja en el mercado», «mi hermano
#     estudia español» — the machine reaches the family, using m5's madre/
#     hermano atoms as fresh SUBJECTS (not re-registered) the way m7/m9
#     reused Diego/Sofía as subjects without re-teaching their names.
#   - Interleave: the three verbs' 3-person families are spread 3/3/3
#     across L1–L2 (hablar), L3 (trabajar), L4 (estudiar, alongside
#     siempre/nunca) — never a lesson that is ONLY conjugated forms; every
#     lesson also carries either a noun debut (español/música), a phrase
#     debut (siempre/nunca/todos los días/un poco) or an infinitive-only
#     verb (escuchar/bailar/cantar) as the "unrelated break."
#   - Cast: Diego (phone call L1 — new gag; market job L3; the party L5),
#     Sofía (español/música debut L2; the workout check-in L7), Ana (the
#     family question sim L4/L6), María (bus — the summit AND mastery
#     exchange, per the spec: "the summit is exchange part 1 with
#     DIFFERENT beats from mastery" — L9 covers trabajar/estudiar/gusta/
#     bailar and never touches «hablas/hablo español»; L10 covers estudiar/
#     bailar again in fresh sentences and closes on the reserved line).
#     Carmen stays offstage. Family (madre/hermano) has no name, per m5's
#     own convention. Learner = Sam.
#   - Mastery (L10) ends on the exact reserved line «sí, hablo un poco» as
#     the LAST turn of the LAST step — no trailing goodbye turn after it,
#     because the spec calls this line the module's (and the course's)
#     promise; a farewell turn after it would dilute the close. This is a
#     deliberate deviation from m4/m7's mastery pattern (which both close
#     on a goodbye) — flagged as a judgment call, forced by the spec's own
#     wording ("mastery ends on the «hablo un poco» sim").
#   - «no gracias»/«no entiendo»/«hasta luego»/«adiós» reused freely from
#     m1/m2 as sim filler, per every prior module's convention.
#
# VOICING LEDGER (printed speak → licenses later cue:"recall"):
#   hablar L1 · hablo ahora L1 · ¿hablas ahora? L1 · el español L2 ·
#   la música L2 · Sofía habla español L2 · hablo español L2 (sim,
#   REQUIRED) · ¿hablas español? L2 (sim NPC, REQUIRED) · trabajar L3 ·
#   trabajo en la escuela L3 · ¿trabajas hoy? L3 · Diego trabaja en el
#   mercado L3 · estudiar L4 · estudio en la escuela L4 · ¿estudias hoy? L4
#   · Ana estudia en casa L4 · siempre estudio L4 · nunca trabajo L4
#   (REQUIRED) · quiero bailar L5 · quiero cantar L5 · quiero escuchar
#   música L5 · mi madre trabaja en el mercado L6 · mi hermano estudia
#   español L6 · todos los días L6 (REQUIRED, sim debut) · estudio un poco
#   L6 · hablo un poco L10 (REQUIRED — reserved for mastery's final turn,
#   printed nowhere else) · ¿hablas español? L10 (sim NPC, second
#   printing)
#   m10-internal recalls drawn from the above: quiero un café (L7, L8, L10
#   — m7 licensed, reused as a recall here), la cuenta por favor (L5, L8 —
#   m7), tengo hambre (L8 — m7)
#   cross-module (licensed by m1–m9 printed voicings per the wave doc):
#   voy al parque (L1), el sábado (L2, L3), voy a la playa (L3), buenos
#   días (L4), el dinero-adjacent "no hay" (L4 sim wrong-option only, not
#   printed as a recall), mi familia (L6), ¿dónde está? (L8), gracias (all
#   lessons, match filler).
newAtoms:
  - { surface: "hablar", meaningEn: "to speak", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "trabajar", meaningEn: "to work", partOfSpeech: "verb", kind: "vocab", hint: "j sounds like h — tra-ba-HAR" }
  - { surface: "estudiar", meaningEn: "to study", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "hablo", meaningEn: "I speak", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "hablas", meaningEn: "you speak", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "habla", meaningEn: "he/she speaks", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "trabajas", meaningEn: "you work", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "trabaja", meaningEn: "he/she works", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "estudio", meaningEn: "I study", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "estudias", meaningEn: "you study", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "estudia", meaningEn: "he/she studies", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "escuchar", meaningEn: "to listen", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "bailar", meaningEn: "to dance", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "cantar", meaningEn: "to sing", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "siempre", meaningEn: "always", partOfSpeech: "adverb", kind: "vocab", hint: "SYEM-preh" }
  - { surface: "nunca", meaningEn: "never", partOfSpeech: "adverb", kind: "vocab" }
  - { surface: "todos los días", meaningEn: "every day", partOfSpeech: "phrase", kind: "phrase" }
  - { surface: "español", meaningEn: "Spanish (the language)", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "💬", hint: "the ñ: es-pa-NYOL" }
  - { surface: "un poco", meaningEn: "a little", partOfSpeech: "phrase", kind: "phrase" }
  - { surface: "música", meaningEn: "music", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "🎵", hint: "stress up front — MOO-see-ka" }

lessons:
  # ── L1 · the machine card + hablo/hablas debut. States the promise. ──
  - n: 1
    template: free
    title: "Run your first machine"
    description: "One swap — -o, -as, -a — runs on every -ar verb you'll ever meet. Learn it once, on «hablar»."
    steps:
      - kind: info
        id: info-machine
        title: "One machine, every verb"
        body: "Spanish verbs run on a machine: swap the ending. hablar (to speak) → hablo (I), hablas (you), habla (he/she) — learn the swap once, it runs on hundreds of verbs. This module: run the machine yourself."
      - kind: speakLit
        id: sp-hablar
        es: "hablar"
        en: "to speak"
        atoms: ["hablar"]
      - kind: map
        id: map-habloahora
        tokens: ["hablo", "ahora"]
        pairs:
          - { en: "I speak", tokenIndex: 0 }
          - { en: "now", tokenIndex: 1 }
        audioText: "hablo ahora"
        revealNote: "«ahora» is already yours — «hablo» is the new gear: I speak, I'm talking."
      - kind: speakLit
        id: sp-habloahora
        es: "hablo ahora"
        en: "I'm talking now"
        atoms: ["hablo", "ahora"]
      - kind: map
        id: map-hablasahora
        tokens: ["¿hablas", "ahora?"]
        pairs:
          - { en: "are you talking", tokenIndex: 0 }
          - { en: "now", tokenIndex: 1 }
        audioText: "¿hablas ahora?"
        revealNote: "Same swap — «hablas» is the you-form. Now you can ask, not just say."
      - kind: speakLit
        id: sp-hablasahora
        es: "¿hablas ahora?"
        en: "are you talking now?"
        atoms: ["hablas", "ahora"]
      - kind: clozeLit
        id: c-hablovshablas1
        es: "hablo ahora"
        en: "I'm talking now"
        blank: "hablo"
        options: ["hablo", "hablas"]
        atoms: ["hablo", "ahora"]
        why: "You're the one talking — «hablo», not «hablas»."
      - kind: buildLit
        id: b-quierohablar
        es: "quiero hablar"
        en: "I want to speak"
        atoms: ["quiero", "hablar"]
        tiles: ["hablo", "hablas"]
      - kind: audioWimcq
        id: ear-review1
        target: { surface: "el parque", emoji: "🌳" }
        distractors:
          - { surface: "la playa", emoji: "🏖️" }
          - { surface: "la tienda", emoji: "🏪" }
      - kind: listenCompLit
        id: lc-hablasahora
        es: "¿hablas ahora?"
        en: "Are you talking now?"
        atoms: ["hablas", "ahora"]
        distractorsEn:
          - "Do you like to talk?"
          - "Where are you talking?"
          - "I'm talking now."
      - kind: speakLit
        id: sp-recall-voyalparque
        es: "voy al parque"
        en: "I'm going to the park"
        atoms: []
        cue: recall
      - kind: sim
        id: sim-diego-llama
        scene: { emoji: "📞", title: "Diego calls", setting: "Your phone buzzes — it's Diego." }
        turns:
          - id: t1
            npc: { speaker: "Diego", es: "¿Hablas ahora?", audioText: "¿hablas ahora?", gloss: "Are you talking now? Can you talk?" }
            goal: "Say yes — you can talk now."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, hablo ahora" }
                - { id: "wrong1", text: "sí, hablas ahora" }
                - { id: "wrong2", text: "no, no hablo" }
              correctOptionId: "right"
              audioText: "sí, hablo ahora"
            replyGloss: "Yes, I'm talking now."
      - kind: matchLit
        id: match
        pairs:
          - { source: "hablar", target: "to speak" }
          - { source: "hablo", target: "I speak" }
          - { source: "hablas", target: "you speak" }
          - { source: "ahora", target: "now" }
          - { source: "gracias", target: "thank you" }
          - { source: "la casa", target: "the house" }
      - kind: speakLit
        id: sp-win
        es: "hablo ahora"
        en: "I'm talking now"
        atoms: ["hablo", "ahora"]

  # ── L2 · habla debuts + español/música. hablo español lands (REQUIRED). ──
  - n: 2
    template: free
    title: "She speaks it too"
    description: "«Habla» — the third gear. Meet Spanish by name, and music."
    steps:
      - kind: imageMcq
        id: d-espanol
        target: { surface: "el español", meaningEn: "Spanish (the language)", emoji: "💬" }
        distractors:
          - { surface: "el pan", emoji: "🍞" }
          - { surface: "el gato", emoji: "🐱" }
          - { surface: "un café", emoji: "☕" }
      - kind: speakLit
        id: sp-elespanol
        es: "el español"
        en: "Spanish (the language)"
        atoms: ["el", "español"]
      - kind: imageMcq
        id: d-musica
        target: { surface: "la música", meaningEn: "the music", emoji: "🎵" }
        distractors:
          - { surface: "el español", emoji: "💬" }
          - { surface: "la sopa", emoji: "🍲" }
          - { surface: "el carro", emoji: "🚗" }
      - kind: speakLit
        id: sp-lamusica
        es: "la música"
        en: "the music"
        atoms: ["la", "música"]
      - kind: map
        id: map-sofiahablaespanol
        tokens: ["Sofía", "habla", "español"]
        pairs:
          - { en: "Sofía", tokenIndex: 0 }
          - { en: "speaks", tokenIndex: 1 }
          - { en: "Spanish", tokenIndex: 2 }
        audioText: "Sofía habla español"
        revealNote: "«Sofía» and «español» are already yours — «habla» is the last gear: he/she speaks. Notice: no «el» after «habla» — the article drops before a language name."
        tokenGenders: { 2: "m" }
      - kind: speakLit
        id: sp-sofiahablaespanol
        es: "Sofía habla español"
        en: "Sofía speaks Spanish"
        atoms: ["habla", "español"]
      - kind: clozeLit
        id: c-hablavshablas2
        es: "Sofía habla español"
        en: "Sofía speaks Spanish"
        blank: "habla"
        options: ["habla", "hablo"]
        atoms: ["habla", "español"]
        why: "Talking about Sofía, not yourself — «habla»."
      - kind: buildLit
        id: b-megustamusica
        es: "me gusta la música"
        en: "I like music"
        atoms: ["me gusta", "la", "música"]
        tiles: ["el", "un"]
      - kind: audioWimcq
        id: ear-review2
        target: { surface: "sábado", emoji: "🕯️" }
        distractors:
          - { surface: "domingo", emoji: "⛪" }
          - { surface: "la semana", emoji: "🗓️" }
      - kind: clozeLit
        id: c-hablovshablas3
        es: "hablas español"
        en: "you speak Spanish"
        blank: "hablas"
        options: ["hablas", "habla"]
        atoms: ["hablas", "español"]
        why: "Asking YOU — «hablas»."
      - kind: listenCompLit
        id: lc-sofiahablaespanol
        es: "Sofía habla español"
        en: "Sofía speaks Spanish."
        atoms: ["habla", "español"]
        distractorsEn:
          - "Sofía speaks a little."
          - "Sofía likes Spanish."
          - "Sofía studies Spanish."
      - kind: speakLit
        id: sp-recall-elsabado
        es: "el sábado"
        en: "Saturday"
        atoms: []
        cue: recall
      - kind: sim
        id: sim-sofia-hablaespanol
        scene: { emoji: "☕", title: "Sofía switches languages", setting: "Sofía leans in, curious." }
        turns:
          - id: t1
            npc: { speaker: "Sofía", es: "¿Hablas español?", audioText: "¿hablas español?", gloss: "Do you speak Spanish?" }
            goal: "Say yes, you speak it."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, hablo español" }
                - { id: "wrong1", text: "sí, hablas español" }
                - { id: "wrong2", text: "no entiendo" }
              correctOptionId: "right"
              audioText: "sí, hablo español"
            replyGloss: "Yes, I speak Spanish."
      - kind: matchLit
        id: match
        pairs:
          - { source: "español", target: "Spanish" }
          - { source: "música", target: "music" }
          - { source: "habla", target: "he/she speaks" }
          - { source: "hablas", target: "you speak" }
          - { source: "hablo", target: "I speak" }
          - { source: "la cuenta", target: "the check" }
      - kind: speakLit
        id: sp-win
        es: "hablo español"
        en: "I speak Spanish"
        atoms: ["hablo", "español"]

  # ── L3 · trabajar transfers. "Same machine, new verb" — the pun card. ──
  - n: 3
    template: free
    title: "Same machine, new verb"
    description: "«Trabajar» — the machine works on any -ar verb. And «trabajo» is funnier than you think."
    steps:
      - kind: info
        id: info-transfer
        title: "Same machine, new verb"
        body: "The machine works on ANY -ar verb: trabajar (to work) → trabajo, trabajas, trabaja — the same three endings you already know. Funny thing: «trabajo» is already yours as a NOUN (work) — now it's also 'I work.' Same word, new job."
      - kind: speakLit
        id: sp-trabajar
        es: "trabajar"
        en: "to work"
        atoms: ["trabajar"]
      - kind: map
        id: map-trabajoescuela
