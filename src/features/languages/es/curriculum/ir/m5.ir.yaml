        atoms: ["tu", "papá", "bueno"]
      - kind: imageMcq
        id: mcq-abuela
        target: { surface: "abuela", meaningEn: "grandmother", emoji: "👵" }
        distractors:
          - { surface: "madre", emoji: "👩" }
          - { surface: "niña", emoji: "👧" }
          - { surface: "esposa", emoji: "👰" }
