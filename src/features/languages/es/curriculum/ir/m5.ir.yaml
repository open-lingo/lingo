module: m5
title: "Mi familia — have, and belong"
frame: none
throughModule: m4
expectedLessonCount: 10
checkpoint: 8

# ES m5 — «Mi familia»: tener's three formulas, mi/tu, and the family.
# Third §13-doctrine IR module (m4 is the freshest exemplar; m3 the original).
#
# SPINE PROVENANCE: atom inventory + arc PINNED by
# docs/es-m4-m10-wave-2026-08-24.md ("m5 — Mi familia"). 16 atoms: tengo,
# tienes, tiene, mi, tu, familia, madre, padre, hermano, hermana, abuelo,
# abuela, perro, gato, años, ¿cuántos?. Nothing added, dropped or renamed
# against that spec.
#
# DOCTRINE NOTES:
#   - tener is FORMULAS only — tengo/tienes/tiene are taught and drilled as
#     three separate atoms; no paradigm table, no word "conjugation"
#     anywhere in a card or explanation.
#   - Debut mechanism, per §13.2/§13.5 (max ONE new word per map/sentence):
#     perro🐶, gato🐱, hermano👦, hermana👧, abuelo👴, abuela👵 debut via
#     imageMcq with a definite-article surface (el perro, la hermana…).
#     tengo, mi, tienes, madre, padre, tu, tiene, años, ¿cuántos?, familia
#     have no honest single-frame emoji (or, for familia, only a WEAK
#     composite one) — every one of them debuts via word_map elimination,
#     always sequenced so its map's other content words are already taught
#     (a pet or sibling word debuted one step earlier, or a m1–m4 licensed
#     word). familia's map doubles as the foto payoff: «la foto de mi
#     familia» — m4's foto, cashed here.
#   - Person build-out, so no map ever carries two new formulas at once:
#     L1 is the "I" cluster (tengo + mi, alongside the perro/gato debuts);
#     L2 is the "you" cluster (tienes + tu, alongside madre/padre); L3
#     completes the set with the "he/she" cluster (tiene, alongside
#     hermano/hermana). Spec pins tu only implicitly ("mi/tu alternate" as
#     a lane) — debuting it in L2 next to tienes (both second-person) is
#     this dispatch's judgment call, flagged in the report.
#   - «mi madre es Ana» (L2) is the pinned identity chunk — m2's «es» + a
#     name, never «se llama» (unlicensed). «tengo … años» / «¿cuántos años
#     tienes?» (L4) spend ocho, diez, cinco, nueve, siete, seis, cuatro —
#     six different m1 numbers, well past the three-number floor.
#   - Plural family nouns (hermanos, abuelas as a group, etc.) are AVOIDED
#     module-wide: only the singular surfaces are registered atoms, and
#     m4's plural machinery (los/las) is out of scope here, so every
#     multi-relative beat uses "un/una X y un/una Y" instead of a bare
#     plural. «están» stays unspent for the same reason it was banned in
#     m4 — never taught, so never used.
#   - Interleave: family nouns split across L1 (0 — pets only, the
#     opening break), L2 (madre, padre — 2), L3 (hermano, hermana — 2),
#     L4 (abuelo, abuela — 2), L5 (familia — 1, the closing beat), with
#     perro/gato reprised as the breaks in L1, L6 and L9. No lesson is
#     ONLY relatives — every family lesson also carries a formula/particle
#     debut or a numbers beat. This is denser at the front than the
#     spec's "3/3/2" phrasing suggests; the per-lesson arc in the spec
#     (madre/padre in L2, hermano/hermana in L3, abuelos in L4, familia in
#     L5) is followed literally, and the 3/3/2 cadence is read as the
#     general interleave LAW rather than a literal atom count this
#     module's smaller 6-noun family satisfies exactly — flagged in the
#     report as a judgment call.
#   - Discrimination lanes (§13.9 law 4, alternating, both halves live):
#     tengo/tienes/tiene cross-tested throughout — cloze-correct tally
#     tengo:3 tienes:3 tiene:8 (tiene leads because most family sentences
#     are third-person, itself the hardest slot to get right; tengo/tienes
#     are kept directly balanced at 3:3 per the spec's named lane); mi/tu
#     clozes 4:3; hermano/hermana BY EAR (audioWimcq, 5 hermano-target :
#     4 hermana-target); abuelo/abuela BY EAR (3 abuelo-target : 4
#     abuela-target).
#   - Cast: Ana (now cast as the learner's mother for the one pinned «mi
#     madre es Ana» line — a deliberate one-line identity chunk, not a
#     recurring role change), Diego (meets the dog in L9 — new gag),
#     Sofía (asks about the photo, L5/L6), María (asks about the photo
#     again, L10 mastery — same beat, different asker, per m4's own
#     "María visits" pattern). Carmen stays offstage (m7). Learner = Sam.
#   - Every cloze is a fresh sentence; the checkpoint and mastery lessons
#     retest via new noun/number combinations, never a verbatim repeat of
#     an earlier lesson's cloze.
#
# VOICING LEDGER (printed speak → licenses later cue:"recall"):
#   tengo un perro L1 · el gato L1 · mi madre L2 · tengo ocho años L4 ·
#   ¿cuántos años tienes? L4 · mi familia L5
#   m5-internal recalls drawn from the above: ¿cuántos años tienes? (L10),
#   mi familia (L9), el gato (L8, cp-sp-2)
#   cross-module (licensed by m1/m2/m3/m4 printed voicings): una llave
#   (L1), ¿qué es? (L2, L4), gracias (L4, L7), buenas tardes (L6), el
#   baño (L7), la llave es de Ana (L5), mucho gusto (L9)
newAtoms:
  - { surface: "tengo", meaningEn: "I have", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "tienes", meaningEn: "you have", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "tiene", meaningEn: "he/she has", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "mi", meaningEn: "my", partOfSpeech: "particle", kind: "particle" }
  - { surface: "tu", meaningEn: "your", partOfSpeech: "particle", kind: "particle", hint: "no accent — tú with the accent is 'you'" }
  - { surface: "familia", meaningEn: "family", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "👨‍👩‍👧‍👦" }
  - { surface: "madre", meaningEn: "mother", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "👩‍👧" }
  - { surface: "padre", meaningEn: "father", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "👨‍👦" }
  - { surface: "hermano", meaningEn: "brother", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "👦" }
  - { surface: "hermana", meaningEn: "sister", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "👧" }
  - { surface: "abuelo", meaningEn: "grandfather", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "👴" }
  - { surface: "abuela", meaningEn: "grandmother", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "👵" }
  - { surface: "perro", meaningEn: "dog", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "🐶" }
  - { surface: "gato", meaningEn: "cat", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "🐱" }
  - { surface: "años", meaningEn: "years", partOfSpeech: "noun", kind: "vocab", gender: "m" }
  - { surface: "¿cuántos?", meaningEn: "how many?", partOfSpeech: "phrase", kind: "phrase", hint: "KWAN-tos" }

lessons:
  # ── L1 · tengo/mi + perro/gato debuts. States the module promise. ────
  - n: 1
    template: free
    title: "Say what's yours"
    description: "«tengo» says you HAVE something, «mi» says it's YOURS. Meet your first two pets, and start talking about your people."
    steps:
      - kind: info
        id: info-tengomi
        title: "Having, and belonging"
        body: "«tengo» = I have — «tengo un perro». «mi» = my — «mi perro». This module: talk about what — and who — is yours."
      - kind: imageMcq
        id: d-perro
        target: { surface: "el perro", meaningEn: "the dog", emoji: "🐶" }
        distractors:
          - { surface: "una llave", emoji: "🔑" }
          - { surface: "el celular", emoji: "📱" }
          - { surface: "la puerta", emoji: "🚪" }
      - kind: speakLit
        id: sp-elperro
        es: "el perro"
        en: "the dog"
        atoms: ["el", "perro"]
      - kind: map
        id: map-tengounperro
        tokens: ["tengo", "un", "perro"]
        pairs:
          - { en: "I have", tokenIndex: 0 }
          - { en: "a", tokenIndex: 1 }
          - { en: "dog", tokenIndex: 2 }
        audioText: "tengo un perro"
        revealNote: "«un» and «perro» are already yours — «tengo» is the new one, and now you can say you HAVE something."
        tokenGenders: { 1: "m", 2: "m" }
      - kind: speakLit
        id: sp-tengounperro
        es: "tengo un perro"
        en: "I have a dog"
        atoms: ["tengo", "un", "perro"]
      - kind: imageMcq
        id: d-gato
        target: { surface: "el gato", meaningEn: "the cat", emoji: "🐱" }
        distractors:
          - { surface: "el perro", emoji: "🐶" }
          - { surface: "el celular", emoji: "📱" }
          - { surface: "una llave", emoji: "🔑" }
      - kind: speakLit
        id: sp-elgato
        es: "el gato"
        en: "the cat"
        atoms: ["el", "gato"]
      - kind: map
        id: map-migato
        tokens: ["mi", "gato"]
        pairs:
          - { en: "my", tokenIndex: 0 }
          - { en: "cat", tokenIndex: 1 }
        audioText: "mi gato"
        revealNote: "«gato» you just met — «mi» means 'my', and it doesn't change for a boy word or a girl word (you'll notice that later)."
        tokenGenders: { 1: "m" }
      - kind: speakLit
        id: sp-migato
        es: "mi gato"
        en: "my cat"
        atoms: ["mi", "gato"]
      - kind: clozeLit
        id: c-tengohay1
        es: "tengo un gato"
        en: "I have a cat"
        blank: "tengo"
        options: ["tengo", "hay"]
        atoms: ["tengo", "un", "gato"]
        why: "«hay» would just say a cat exists somewhere — you're claiming it as YOURS, so «tengo»."
      - kind: buildLit
        id: b-tengoperroygato
        es: "tengo un perro y un gato"
        en: "I have a dog and a cat"
        atoms: ["tengo", "un", "perro", "y", "gato"]
        tiles: ["mi", "tiene"]
      - kind: audioWimcq
        id: ear-perrogato
        target: { surface: "el perro", emoji: "🐶" }
        distractors:
          - { surface: "el gato", emoji: "🐱" }
          - { surface: "una llave", emoji: "🔑" }
      - kind: listenCompLit
        id: lc-tengoperro
        es: "tengo un perro"
        en: "I have a dog."
        atoms: ["tengo", "un", "perro"]
        distractorsEn:
          - "I have a cat."
          - "There's a dog."
          - "The dog is here."
      - kind: speakLit
        id: sp-recall-unallave
        es: "una llave"
        en: "a key"
        atoms: []
        cue: recall
      - kind: sim
        id: sim-anaperro
        scene: { emoji: "🐶", title: "Ana's question", setting: "Ana points at your pets." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¡Hola! ¿Qué es?", audioText: "¡hola! ¿qué es?", gloss: "Hi! What is it?" }
            goal: "Name it — a dog."
            reply:
              mode: choice
              options:
                - { id: "right", text: "es un perro" }
                - { id: "wrong1", text: "es un gato" }
                - { id: "wrong2", text: "hay un perro" }
              correctOptionId: "right"
              audioText: "es un perro"
            replyGloss: "It's a dog."
            explanation: "She's asking WHAT it is — «es», not «hay» (that would just claim one exists) and not «tengo» (that's a different question)."
          - id: t2
            npc: { speaker: "Ana", es: "¿Y el gato?", audioText: "¿y el gato?", gloss: "And the cat?" }
            goal: "Say you have one too."
            reply:
              mode: build
              tiles: ["tengo", "un", "gato", "mi", "es"]
              answer: "tengo un gato"
              alsoAccepted: ["un gato", "mi gato"]
            replyGloss: "I have a cat."
      - kind: matchLit
        id: match
        pairs:
          - { source: "el perro", target: "the dog" }
          - { source: "el gato", target: "the cat" }
          - { source: "tengo", target: "I have" }
          - { source: "mi", target: "my" }
          - { source: "una llave", target: "a key" }
          - { source: "gracias", target: "thank you" }
      - kind: speakLit
        id: sp-win
        es: "tengo un perro y un gato"
        en: "I have a dog and a cat"
        atoms: ["tengo", "un", "perro", "y", "gato"]

  # ── L2 · tienes/tu + madre/padre debuts. ──────────────────────────────
  - n: 2
    template: free
    title: "Yours, and theirs"
    description: "«tienes» asks what YOU have, «tu» hands it back — and you meet your mother and father."
    steps:
      - kind: map
        id: map-mimadre
        tokens: ["mi", "madre", "es", "maestra"]
        pairs:
          - { en: "my", tokenIndex: 0 }
          - { en: "mother", tokenIndex: 1 }
          - { en: "is", tokenIndex: 2 }
          - { en: "a teacher", tokenIndex: 3 }
        audioText: "mi madre es maestra"
        revealNote: "«mi», «es» and «maestra» (from m2!) are already yours — «madre» is the only new word. Spanish skips the 'a': es maestra."
        tokenGenders: { 1: "f", 3: "f" }
      - kind: speakLit
        id: sp-mimadre
        es: "mi madre"
        en: "my mother"
        atoms: ["mi", "madre"]
      - kind: map
        id: map-mipadre
        tokens: ["mi", "padre", "está", "aquí"]
        pairs:
          - { en: "my", tokenIndex: 0 }
          - { en: "father", tokenIndex: 1 }
          - { en: "is", tokenIndex: 2 }
          - { en: "here", tokenIndex: 3 }
        audioText: "mi padre está aquí"
        revealNote: "«mi», «está» and «aquí» are already yours — «padre» is the only stranger."
        tokenGenders: { 1: "m" }
      - kind: speakLit
        id: sp-mipadre
        es: "mi padre"
        en: "my father"
        atoms: ["mi", "padre"]
      - kind: map
        id: map-tienesperro
        tokens: ["¿tienes", "un", "perro?"]
        pairs:
          - { en: "do you have", tokenIndex: 0 }
          - { en: "a", tokenIndex: 1 }
          - { en: "dog", tokenIndex: 2 }
        audioText: "¿tienes un perro?"
        revealNote: "«un» and «perro» are already yours — «tienes» asks whether YOU have something."
        tokenGenders: { 1: "m", 2: "m" }
      - kind: speakLit
        id: sp-tienesperro
        es: "¿tienes un perro?"
        en: "do you have a dog?"
        atoms: ["tienes", "un", "perro"]
      - kind: clozeLit
        id: c-tengotienes1
        es: "tienes un gato"
        en: "you have a cat"
        blank: "tienes"
        options: ["tienes", "tengo"]
        atoms: ["tienes", "un", "gato"]
        why: "You're talking about the OTHER person — «tienes», not «tengo» (that's about yourself)."
      - kind: map
        id: map-tuperro
        tokens: ["¿es", "tu", "perro?"]
        pairs:
          - { en: "is it", tokenIndex: 0 }
          - { en: "your", tokenIndex: 1 }
          - { en: "dog", tokenIndex: 2 }
        audioText: "¿es tu perro?"
        revealNote: "«es» and «perro» are already yours — «tu» means 'your' (no accent — «tú» with the accent is 'you', which you already know)."
        tokenGenders: { 2: "m" }
      - kind: speakLit
        id: sp-tuperro
        es: "tu perro"
        en: "your dog"
        atoms: ["tu", "perro"]
      - kind: clozeLit
        id: c-mitu1
        es: "tu gato"
        en: "your cat"
        blank: "tu"
        options: ["tu", "mi"]
        atoms: ["tu", "gato"]
        why: "You're talking about the OTHER person's cat — «tu», not «mi»."
      - kind: buildLit
        id: b-tuperroesta
        es: "tu perro está aquí"
        en: "Your dog is here"
        atoms: ["tu", "perro", "está", "aquí"]
        tiles: ["mi", "allí"]
      - kind: audioWimcq
        id: ear-review-mascotas
        target: { surface: "el gato", emoji: "🐱" }
        distractors:
          - { surface: "el perro", emoji: "🐶" }
          - { surface: "una llave", emoji: "🔑" }
      - kind: listenCompLit
        id: lc-tumadre
        es: "tu madre está aquí"
        en: "Your mother's here."
        atoms: ["tu", "madre", "está", "aquí"]
        distractorsEn:
          - "Your father's here."
          - "Your mother's there."
          - "There's a mother here."
      - kind: speakLit
        id: sp-recall-quees1
        es: "¿qué es?"
        en: "what is it?"
        atoms: []
        cue: recall
      - kind: sim
        id: sim-diegofoto
        scene: { emoji: "👨‍👩‍👧", title: "Diego asks", setting: "Diego points at a photo on your phone." }
        turns:
          - id: t1
            npc: { speaker: "Diego", es: "¿Es tu madre?", audioText: "¿es tu madre?", gloss: "Is that your mother?" }
            goal: "Say yes — it's your mother."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, es mi madre" }
                - { id: "wrong1", text: "sí, es mi padre" }
                - { id: "wrong2", text: "no, es tu madre" }
              correctOptionId: "right"
              audioText: "sí, es mi madre"
            replyGloss: "Yes, it's my mother."
            explanation: "«mi» keeps her yours — «tu» would hand her back to Diego."
          - id: t2
            npc: { speaker: "Diego", es: "¿Tienes un perro?", audioText: "¿tienes un perro?", gloss: "Do you have a dog?" }
            goal: "Yes — you do."
            reply:
              mode: build
              tiles: ["tengo", "un", "perro", "sí", "no"]
              answer: "sí tengo un perro"
              alsoAccepted: ["tengo un perro", "sí"]
            replyGloss: "Yes, I have a dog."
      - kind: matchLit
        id: match
        pairs:
          - { source: "mi madre", target: "my mother" }
          - { source: "mi padre", target: "my father" }
          - { source: "tienes", target: "you have" }
          - { source: "tu", target: "your" }
          - { source: "una llave", target: "a key" }
          - { source: "gracias", target: "thank you" }
      - kind: speakLit
        id: sp-win
        es: "mi madre"
        en: "my mother"
        atoms: ["mi", "madre"]

  # ── L3 · hermano/hermana + tiene + the ear lane. ──────────────────────
  - n: 3
    template: free
    title: "Same word, different ending"
    description: "Brother, sister — one ending flips to the other. Learn «tiene», the last of the three, and tell them apart by ear."
    steps:
      - kind: imageMcq
        id: d-hermano
        target: { surface: "el hermano", meaningEn: "the brother", emoji: "👦" }
        distractors:
          - { surface: "la cama", emoji: "🛏️" }
          - { surface: "el gato", emoji: "🐱" }
          - { surface: "una llave", emoji: "🔑" }
      - kind: speakLit
        id: sp-elhermano
        es: "el hermano"
        en: "the brother"
        atoms: ["el", "hermano"]
      - kind: imageMcq
        id: d-hermana
        target: { surface: "la hermana", meaningEn: "the sister", emoji: "👧" }
        distractors:
          - { surface: "el hermano", emoji: "👦" }
          - { surface: "el gato", emoji: "🐱" }
          - { surface: "la cama", emoji: "🛏️" }
      - kind: speakLit
        id: sp-lahermana
        es: "la hermana"
        en: "the sister"
        atoms: ["la", "hermana"]
      - kind: audioWimcq
        id: ear-hermano1
        target: { surface: "el hermano", emoji: "👦" }
        distractors:
          - { surface: "la hermana", emoji: "👧" }
          - { surface: "el perro", emoji: "🐶" }
      - kind: clozeLit
        id: c-mitu2
        es: "mi hermano"
        en: "my brother"
        blank: "mi"
        options: ["mi", "tu"]
        atoms: ["mi", "hermano"]
        why: "You're talking about YOUR brother — «mi»."
      - kind: audioWimcq
        id: ear-hermana1
        target: { surface: "la hermana", emoji: "👧" }
        distractors:
          - { surface: "el hermano", emoji: "👦" }
          - { surface: "el gato", emoji: "🐱" }
      - kind: map
        id: map-hermanotiene
        tokens: ["mi", "hermano", "tiene", "un", "gato"]
        pairs:
          - { en: "my", tokenIndex: 0 }
          - { en: "brother", tokenIndex: 1 }
          - { en: "has", tokenIndex: 2 }
          - { en: "a", tokenIndex: 3 }
          - { en: "cat", tokenIndex: 4 }
        audioText: "mi hermano tiene un gato"
        revealNote: "«mi», «hermano», «un» and «gato» are already yours — «tiene» is the new one: what HE or SHE has."
        tokenGenders: { 1: "m", 3: "m", 4: "m" }
      - kind: speakLit
        id: sp-tiene
        es: "mi hermano tiene un gato"
        en: "my brother has a cat"
        atoms: ["mi", "hermano", "tiene", "un", "gato"]
      - kind: clozeLit
        id: c-tengotienetiene1
        es: "mi hermana tiene un perro"
        en: "my sister has a dog"
        blank: "tiene"
        options: ["tiene", "tengo"]
        atoms: ["mi", "hermana", "tiene", "un", "perro"]
        why: "You're talking about HER — «tiene», not «tengo» (that's you)."
      - kind: buildLit
        id: b-tuhermano
        es: "¿tienes un hermano?"
        en: "Do you have a brother?"
        atoms: ["tienes", "un", "hermano"]
        tiles: ["mi", "tu"]
      - kind: audioWimcq
        id: ear-hermano2
        target: { surface: "el hermano", emoji: "👦" }
        distractors:
          - { surface: "la hermana", emoji: "👧" }
          - { surface: "la cocina", emoji: "🍳" }
      - kind: listenCompLit
        id: lc-hermana1
        es: "tengo una hermana"
        en: "I have a sister."
        atoms: ["tengo", "una", "hermana"]
        distractorsEn:
          - "I have a brother."
          - "There's a sister."
          - "Do you have a sister?"
      - kind: speakLit
        id: sp-recall-elagua
        es: "el agua"
        en: "the water"
        atoms: []
        cue: recall
