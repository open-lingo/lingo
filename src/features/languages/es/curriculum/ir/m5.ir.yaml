  # ── L7 · La familia de Ana ─────────────────────────────────────────────────
  - n: 7
    template: free
    title: "La familia de Ana"
    description: "Whose is it? Possession with de — and two more people."
    steps:
      - kind: info
        id: info-familia
        title: "La familia"
        body: "Across Latin America, family is the center of gravity — Sunday lunch at the grandparents' house routinely gathers three generations, and 'familia' stretches to cousins, in-laws, and lifelong friends. Ask about someone's family early; it's warm, not nosy."
        variant: "culture"
      - kind: imageMcq
        id: mcq-esposo
        target: { surface: "esposo", meaningEn: "husband", emoji: "🤵" }
        distractors:
          - { surface: "esposa", emoji: "👰" }
          - { surface: "abuelo", emoji: "👴" }
          - { surface: "padre", emoji: "👨" }
      - kind: speakLit
        id: speak-esposo-simpatico
        es: "mi esposo es muy simpático"
        en: "my husband is very nice"
        atoms: ["esposo", "simpático"]
      - kind: info
        id: info-de
        title: "De — whose is it?"
        body: "To say something belongs to someone, link them with «de»: «la casa de mi abuela» — my grandmother's house, literally 'the house of my grandmother.' Spanish has no apostrophe-s; «de» plus the owner does that job every time."
      - kind: imageMcq
        id: mcq-esposa
        target: { surface: "esposa", meaningEn: "wife", emoji: "👰" }
        distractors:
          - { surface: "esposo", emoji: "🤵" }
          - { surface: "abuela", emoji: "👵" }
          - { surface: "madre", emoji: "👩" }
      - kind: buildLit
        id: build-esposo-de-ana
        es: "el esposo de Ana es alto"
        en: "Ana's husband is tall"
        tiles: ["bajo"]
        atoms: ["esposo", "de", "alto"]
      - kind: textMcq
        id: tmcq-esposa
        target: "esposa"
        distractors: ["esposo", "hermana", "hija"]
      - kind: phrase
        id: p-tambien
        meaning: "also"
        text: "también"
      - kind: listenCompLit
        id: lc-esposa-inteligente
        es: "mi esposa es muy inteligente"
        en: "my wife is very intelligent"
        distractorsEn: ["my wife is very old", "my husband is very intelligent", "my wife is not intelligent"]
        atoms: ["esposa", "inteligente"]
      - kind: speakLit
        id: speak-tambien
        es: "tengo un hermano y también una hermana"
        en: "I have a brother and also a sister"
        atoms: ["tengo", "también", "hermano", "hermana"]
      - kind: buildLit
        id: build-hija-de-hermana
        es: "la hija de mi hermana es alta"
        en: "My sister's daughter is tall"
        tiles: ["bajo"]
        atoms: ["hija", "de", "hermana", "alto"]
      - kind: textMcq
        id: tmcq-tambien
        target: "también"
        distractors: ["muy", "pero", "y"]
      - kind: selfExplain
        id: self-explain-de
        anchorLabel: "You wrote: el esposo de Ana es alto"
        anchorAudioText: "el esposo de Ana es alto"
        question: "Why de instead of an apostrophe-s?"
        rule: "Spanish has no apostrophe-s — de + owner always shows possession: el esposo de Ana = 'Ana's husband.'"
        surface: "de is only used when the owner's name is unknown."
        distractor: "de is optional here — Ana esposo would also work."
        ruleExplanation: "English 's becomes de + owner in Spanish, and the word order flips: [thing] de [owner] — el esposo de Ana, never Ana's esposo."
      - kind: translateLit
        id: tr-llave-amigo
        es: "la llave de mi amigo es roja"
        en: "My friend's key is red"
        atoms: ["llave", "amigo", "rojo", "de"]
      - kind: buildLit
        id: build-esposo-perro-bueno
        es: "mi esposo tiene un perro bueno"
        en: "My husband has a good dog"
        tiles: ["malo"]
        atoms: ["esposo", "tiene", "perro", "bueno"]
      - kind: dialogueLit
        id: dialogue-hermana
        lines:
          - { speaker: "Ana", text: "¿Quién es ella, Luis?" }
          - { speaker: "Luis", text: "Es mi hermana. Tiene diez años." }
          - { speaker: "Ana", text: "¡Tu hermana es muy alta!" }
        questions:
          - id: "q1"
            prompt: "Who is the girl?"
            correctText: "Luis's sister"
            distractors: ["Luis's daughter", "Ana's sister", "Luis's grandmother"]
          - id: "q2"
            prompt: "How old is she?"
            correctText: "ten years old"
            distractors: ["eight years old", "nine years old", "two years old"]
        atoms: ["quién", "hermana", "tiene", "años", "tu", "alto"]
      - kind: reviewMatch
        id: rev
      - kind: speakLit
        id: speak-close
        es: "la esposa de mi hermano es muy simpática"
        en: "my brother's wife is very nice"
        atoms: ["esposa", "de", "hermano", "simpático"]
      - kind: info
        id: info-win
        title: "It's all yours to say"
        body: "You can now say whose it is, and add 'me too' to any conversation."
        variant: "win"

  # ── L8 · Mastery test ───────────────────────────────────────────────────────
  - n: 8
    template: free
    title: "M5 Mastery Test"
    description: "Family, mi/tu/su, tener, possession with de, and age."
    steps:
      - kind: mcq
        id: q-tengo-hermanos
        prompt: "'I have two brothers.' — which is correct?"
        correct: "tengo dos hermanos"
        distractors: ["tienes dos hermanos", "tengo dos hermanas", "tiene dos hermanos"]
        why: "tengo is the yo-form; hermanos (m) matches 'brothers.'"
        atoms: ["tengo", "hermano"]
      - kind: buildLit
        id: build-casa-papa
        es: "la casa de mi papá es grande"
        en: "My dad's house is big"
        tiles: ["pequeña"]
        atoms: ["casa", "de", "papá", "grande"]
      - kind: mcq
        id: q-su-hijo
        prompt: "'Her son is very tall.' — which is correct?"
        correct: "su hijo es muy alto"
        distractors: ["su hija es muy alta", "mi hijo es muy alto", "tu hijo es muy bajo"]
        why: "su covers 'her'; hijo (m) matches 'son.'"
        atoms: ["su", "hijo", "alto"]
      - kind: clozeLit
        id: c-mi-hermana
        es: "ella es mi hermana"
        en: "she is my sister"
        blank: "mi"
        options: ["mi", "tu", "su", "la"]
        why: "The speaker owns her — first person."
        atoms: ["mi", "hermana"]
      - kind: translateLit
        id: tr-nueve-anos
        es: "tengo nueve años"
        en: "I am nine years old"
        atoms: ["tengo", "años"]
      - kind: mcq
        id: q-tambien
        prompt: "Mi papá es doctor. Mi mamá ___ es doctora."
        correct: "también"
        distractors: ["muy", "pero", "y"]
        why: "también adds 'too' to a parallel fact."
        atoms: ["también"]
      - kind: listenCompLit
        id: lc-cuantos
        es: "¿cuántos años tienes?"
        en: "How old are you?"
        distractorsEn: ["How many sisters do you have?", "Who is your dad?", "What's your name?"]
        atoms: ["¿cuántos años tienes?"]
      - kind: listenBuildLit
        id: lb-madre-carro
        es: "mi madre tiene un carro rojo"
        en: "Tap what you hear"
        tiles: ["negro"]
        atoms: ["madre", "tiene", "carro", "rojo"]
      - kind: textMcq
        id: tmcq-nina
        # Third niña retrieval this module — distractors vary from L5/L6.
        target: "niña"
        distractors: ["niño", "hermana", "mamá"]
      - kind: buildLit
        id: build-esposo-perro
        es: "mi esposo tiene un perro simpático"
        en: "My husband has a nice dog"
        tiles: ["malo"]
        atoms: ["esposo", "tiene", "perro", "simpático"]
      - kind: speakLit
        id: speak-quien-papa
        es: "¿quién es tu papá?"
        en: "Who is your dad?"
        atoms: ["quién", "tu", "papá"]
      - kind: mcq
        id: q-carro-grande
        prompt: "'The red car is very big.' — which is correct?"
        correct: "el carro rojo es muy grande"
        distractors: ["el carro roja es muy grande", "el carro rojo es muy grandes", "la carro rojo es muy grande"]
        why: "carro is masculine singular; rojo and grande must match."
        atoms: ["carro", "rojo", "muy", "grande"]
      - kind: clozeLit
        id: c-tiene-hija
        es: "ella tiene una hija"
        en: "she has a daughter"
        blank: "tiene"
        options: ["tiene", "tienes", "tengo", "tener"]
        why: "ella ('she') needs the he/she form."
        atoms: ["tiene", "hija"]

