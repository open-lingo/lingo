        id: lc-nino-alto-simpatico
        es: "el niño es alto y simpático"
        en: "the boy is tall and nice"
        distractorsEn: ["the girl is tall and nice", "the boy is short and nice", "the boy is tall and old"]
        atoms: ["niño", "alto", "simpático"]
      - kind: reviewMatch
        id: rev
      - kind: listenCompLit
        id: lc-gato-bonito
        es: "el gato negro es muy bonito"
        en: "the black cat is very pretty"
        distractorsEn: ["the black dog is very pretty", "the white cat is very pretty", "the black cat is very big"]
        atoms: ["gato", "negro", "bonito"]
      - kind: speakLit
        id: speak-close
        es: "mi papá tiene un perro grande"
        en: "my dad has a big dog"
        atoms: ["papá", "tiene", "perro", "grande"]
      - kind: info
        id: info-win
        title: "You're listening in"
        body: "You can now follow a conversation about someone's family, just by listening."
