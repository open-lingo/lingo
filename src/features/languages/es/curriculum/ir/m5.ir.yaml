  # ── L5 · ¿Cuántos años tienes? ─────────────────────────────────────────────
  - n: 5
    template: free
    title: "¿Cuántos años tienes?"
    description: "In Spanish you don't turn an age — you have it."
    steps:
      - kind: info
        id: info-age
        title: "Age works with tener"
        body: "Spanish doesn't say you ARE some age — you HAVE it: you say «tengo diez años», literally 'I have ten years.' One is «un año» (mind the ñ — AH-nyo). Ask someone's age with «¿cuántos años tienes?», literally 'how many years do you have?'"
      - kind: phrase
        id: p-cuantos
        meaning: "how old are you?"
        text: "¿cuántos años tienes?"
      - kind: imageMcq
        id: mcq-nino
        target: { surface: "niño", meaningEn: "boy", emoji: "👦" }
        distractors:
          - { surface: "niña", emoji: "👧" }
          - { surface: "abuelo", emoji: "👴" }
          - { surface: "madre", emoji: "👩" }
      - kind: speakLit
        id: speak-cuantos
        es: "¿cuántos años tienes?"
        en: "How old are you?"
        atoms: ["¿cuántos años tienes?"]
      - kind: buildLit
        id: build-nino-diez-anos
        es: "el niño tiene diez años"
        en: "The boy is ten years old"
        tiles: ["nueve"]
        atoms: ["niño", "tiene", "años"]
      - kind: textMcq
        id: tmcq-nino
        target: "niño"
        distractors: ["niña", "hermano", "abuelo"]
      - kind: imageMcq
        id: mcq-nina
        target: { surface: "niña", meaningEn: "girl", emoji: "👧" }
        distractors:
          - { surface: "niño", emoji: "👦" }
          - { surface: "abuela", emoji: "👵" }
          - { surface: "madre", emoji: "👩" }
      - kind: buildLit
        id: build-nina-siete-anos
        es: "la niña tiene siete años"
        en: "The girl is seven years old"
        tiles: ["ocho"]
        atoms: ["niña", "tiene", "años"]
      - kind: textMcq
        id: tmcq-nina
        target: "niña"
        distractors: ["niño", "hija", "abuela"]
      - kind: speakLit
        id: speak-hermano-diez-anos
        es: "mi hermano tiene diez años"
        en: "my brother is ten years old"
        atoms: ["hermano", "tiene", "años"]
      - kind: listenCompLit
        id: lc-nino-cinco-anos
        es: "el niño tiene cinco años"
        en: "the boy is five years old"
        distractorsEn: ["the girl is five years old", "the boy is six years old", "the boy has a sister"]
        atoms: ["niño", "tiene", "años"]
      - kind: buildLit
        id: build-ocho-anos
        es: "tengo ocho años"
        en: "I'm eight years old"
        tiles: ["siete"]
        atoms: ["tengo", "años"]
      - kind: clozeLit
        id: c-anos
        es: "tengo diez años"
        en: "I'm ten years old"
        blank: "años"
        options: ["años", "año", "niños", "días"]
        why: "Ten of them, so the plural form."
        atoms: ["tengo", "años"]
      - kind: listenBuildLit
        id: lb-hija-seis-anos
        es: "mi hija tiene seis años"
        en: "Tap what you hear"
        tiles: ["siete"]
        atoms: ["hija", "tiene", "años"]
      - kind: selfExplain
        id: self-explain-age
        anchorLabel: "You wrote: tengo ocho años"
        anchorAudioText: "tengo ocho años"
        question: "Why tengo (have) instead of soy (am) for age?"
        rule: "Spanish expresses age as something you HAVE, not something you ARE — tengo ocho años literally means 'I have eight years.'"
        surface: "tengo is used because años is a noun, and soy only works with adjectives."
        distractor: "tengo is used for temporary ages, soy for permanent ones."
        ruleExplanation: "Age, like hunger or heat, is a 'have' expression in Spanish: tener + number + años. English says 'I am 8'; Spanish says 'I have 8 years.'"
      - kind: speakLit
        id: speak-su-hija-anos
        es: "su hija tiene diez años"
        en: "his daughter is ten years old"
        atoms: ["su", "hija", "tiene", "años"]
      - kind: mcq
        id: q-anos-verbo
        prompt: "Mi hermana ___ ocho años."
        correct: "tiene"
        distractors: ["tienes", "tengo", "tener"]
        why: "hermana ('she') needs the he/she form."
        atoms: ["hermana", "tiene", "años"]
      - kind: reviewMatch
        id: rev
      - kind: buildLit
        id: build-review-inteligente
        es: "ella es muy inteligente"
        en: "She is very intelligent"
        tiles: ["interesante"]
        atoms: ["ella", "inteligente"]
      - kind: translateLit
        id: tr-anos
        es: "tengo nueve años"
        en: "I am nine years old"
        atoms: ["tengo", "años"]
      - kind: info
        id: info-win
        title: "Ages, unlocked"
        body: "You can now ask and tell anyone's age — no more, no less."
        variant: "win"

  # ── L6 · Escucha — ¿quién es? ──────────────────────────────────────────────
  - n: 6
    template: free
    title: "Escucha — ¿quién es?"
    description: "Who's who — full-sentence ear training."
    steps:
      - kind: phrase
        id: p-quien
        meaning: "who"
        text: "quién"
      - kind: listenCompLit
        id: lc-quien-nina
        es: "¿quién es la niña?"
        en: "Who is the girl?"
        distractorsEn: ["Who is the boy?", "How old is the girl?", "Where is the girl?"]
        atoms: ["quién", "niña"]
      - kind: speakLit
        id: speak-quien-papa
        es: "¿quién es tu papá?"
        en: "Who is your dad?"
        atoms: ["quién", "tu", "papá"]
      - kind: listenBuildLit
        id: lb-abuelo-carro
        es: "mi abuelo tiene un carro nuevo"
        en: "Tap what you hear"
        tiles: ["viejo"]
        atoms: ["abuelo", "tiene", "carro", "nuevo"]
      - kind: listenCompLit
        id: lc-familia-grande
        es: "tengo una familia muy grande"
        en: "I have a very big family"
        distractorsEn: ["I have a very small family", "you have a very big family", "I have a very big house"]
        atoms: ["tengo", "familia", "grande"]
      - kind: buildLit
        id: build-hermano-simpatico
        es: "tu hermano es muy simpático"
        en: "Your brother is very nice"
        tiles: ["malo"]
        atoms: ["tu", "hermano", "simpático"]
      - kind: textMcq
        id: tmcq-quien
        target: "quién"
        distractors: ["qué", "cómo", "dónde"]
      - kind: translateLit
        id: tr-hijo-anos
        es: "mi hijo tiene ocho años"
        en: "My son is eight years old"
        atoms: ["hijo", "tiene", "años"]
      - kind: listenCompLit
        id: lc-abuelo-quien
        es: "¿quién es el abuelo?"
        en: "Who is the grandfather?"
        distractorsEn: ["Who is the grandmother?", "How old is the grandfather?", "Where is the grandfather?"]
        atoms: ["quién", "abuelo"]
      - kind: listenBuildLit
        id: lb-nina-gato
        es: "la niña tiene un gato negro"
        en: "Tap what you hear"
        tiles: ["blanco"]
        atoms: ["niña", "tiene", "gato", "negro"]
      - kind: speakLit
        id: speak-quien-abuela
        es: "¿quién es tu abuela?"
        en: "Who is your grandmother?"
        atoms: ["quién", "tu", "abuela"]
      - kind: listenCompLit
        id: lc-familia-mexico
        es: "su familia es de México"
        en: "his family is from Mexico"
        distractorsEn: ["my family is from Mexico", "his family is from Spain", "his family is big"]
        atoms: ["su", "familia", "de"]
      - kind: speakLit
        id: speak-quien-ella
        es: "¿quién es ella?"
        en: "Who is she?"
        atoms: ["quién", "ella"]
      - kind: buildLit
        id: build-nino-perro-negro
        es: "el niño tiene un perro negro"
        en: "The boy has a black dog"
        tiles: ["blanco"]
        atoms: ["niño", "tiene", "perro", "negro"]
      - kind: textMcq
        id: tmcq-nina-review
        # Distractor set differs from L5's tmcq-nina on purpose — three
        # identical retrievals across L5/L6/L8 would be pattern-memorizable.
        target: "niña"
        distractors: ["niño", "abuela", "esposa"]
