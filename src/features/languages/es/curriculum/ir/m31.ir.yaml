        correct: "duele"
        distractors: ["duelo", "duelen", "dueles"]
        atoms: ["duele"]
        why: "One last time: «duele» agrees with what's hurting, never with the person. There is no «yo duelo»."
      - kind: speakLit
        id: l10-sp-recall-l7win
