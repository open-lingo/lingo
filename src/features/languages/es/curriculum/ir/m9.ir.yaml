module: m9
title: "Vamos — say where you're going"
frame: none
throughModule: m8
expectedLessonCount: 10
checkpoint: 8

# ES m9 — «Vamos»: voy/vas, the al contraction, ¿adónde? vs m4's dónde,
# and eight places to head to. Seventh §13-doctrine IR module (m3 is the
# exemplar; m4/m7 the freshest siblings). Authored in parallel with m8 —
# every m8 atom and REQUIRED voicing used here (hoy, mañana, el sábado,
# días) is treated as taught/licensed per m8's spec section in the wave
# doc, throughModule: m8.
#
# SPINE PROVENANCE: atom inventory + arc PINNED by
# docs/es-m4-m10-wave-2026-08-24.md ("m9 — Vamos"). ATOM-COUNT NOTE: the
# wave doc's header says "Atoms (15)" but its own comma list names
# exactly 14 surfaces (voy, vas, a, al, ¿adónde?, parque, tienda,
# escuela, cine, playa, mercado, trabajo, autobús, ahora) — «casa» is
# explicitly called out as REUSED, not new. Registering a 15th,
# unnamed atom would be inventing content the spec never named, so this
# IR registers exactly the 14 named surfaces and flags the count
# mismatch here rather than silently resolving it either way. Nothing
# else added, dropped or renamed against the spec.
#
# ⚠️ m10 NOTE: «trabajo» is registered HERE as the noun ("work", 💼).
# m10's spec conjugates «trabajar» → trabajo/trabajas/trabaja as verb
# forms; per FIRST-WRITE-WINS, m10 must NOT re-register the surface
# «trabajo» — it authors the verb form via exercised surfaces only,
# same as the m2 soy/eres precedent the wave doc names.
#
# DOCTRINE NOTES:
#   - Contrast card (L2): «al» = a + el, ALWAYS — «voy al parque», never
#     «voy a el parque» (m3's articles finally contract). La-words stay
#     two words: «voy a la playa» stays «a la», never contracts. One
#     rule, two kinds of words — the THE lane of the module.
#   - «¿adónde?» (L3) gets its own one-line card against m4's «¿dónde?»:
#     dónde asks WHERE something IS; adónde asks WHERE you're GOING —
#     literally "to where". Both stay live as an alternating
#     discrimination lane (textMcq, not clozeLit — a cloze can't cleanly
#     blank «¿dónde»/«¿adónde» since the leading ¿ glues to the word as
#     one token; textMcq sidesteps that cleanly, same mechanism m4/m7
#     use for isolated-word discrimination).
#   - «voy a casa» (L5): the article DROPS entirely — not «a la casa»,
#     not «al casa». One card line, then trials. «casa» itself is
#     reused from m1, not re-registered.
#   - «cine» gets the m3 llave / m4 foto / m7 leche secret-side
#     treatment: no telltale ending, learned WITH its article, one card
#     + one dedicated gender cloze (L2).
#   - JUDGMENT CALL — café avoided as a destination: the spec flagged
#     «voy al café de Carmen» as risky (café-the-place vs café-the-drink
#     collision) and offered "one honest card line if you use it, or
#     avoid." This IR avoids it — the m7 payoff is delivered instead via
#     «voy al trabajo pero quiero un café» (L4) and a bare cue:recall of
#     «quiero un café» (L9), both using café correctly as the drink,
#     never as a place.
#   - Places INTERLEAVE — never a place-list lesson. Even L4, which by
#     the pinned arc introduces three nouns (tienda/escuela/trabajo),
#     breaks each debut with a discrimination/review beat before the
#     next debut (imageMcq → cloze → ear-lane → imageMcq → build →
#     cross-module review → imageMcq → speak → …), never two debuts back
#     to back. Every place debuts articled via imageMcq (all eight have
#     honest emoji).
#   - Lanes (§13.9 law 4, alternating, both halves live — final tallies
#     in the ledger below): voy/vas discrimination clozes; al/a-la
#     clozes (THE lane, the module's densest); dónde/adónde textMcq;
#     cine/tienda by EAR (audioWimcq — the spec's own suggested honest
#     pair, since parque/playa don't discriminate well by ear).
#   - Days from m8 pay off repeatedly, not just once: «el sábado voy a
#     la playa» opens the L9 summit map; hoy/mañana/sábado all get
#     productive (not just recall) reuse across L6/L7/L9 planning beats.
#     m7 pays off via café-as-drink (above) and a «tengo hambre» sim
#     beat in the L9 summit (Diego).
#   - Cast: Ana + Diego own the L9 summit (pinned: the beach plan);
#     María owns L10 mastery, a separate «¿adónde vas?» street
#     encounter — different setting, different beats, different NPCs
#     from the summit (twin-sim class avoided). Sofía appears in L1/L6
#     as a supporting voice. Learner = Sam.
#   - Nouns wear their article on every surface («la playa», never bare
#     «playa»); atoms stay bare with `gender` (m3 registry convention).
#   - No byte-identical clozeLit `es` strings repeat anywhere in the
#     module (checked by hand against every prior lesson while
#     authoring); near-neighbors (e.g. «voy al parque» / «voy al parque
#     hoy») are transfers, well-spaced across lessons.
#
# VOICING LEDGER (printed speak → licenses later cue:"recall"):
#   voy a la playa L1 · el cine L2 · voy al parque L2 ·
#   ¿adónde vas? L3 · voy a casa L5 · ahora L5
#   m9-internal recalls drawn from the above: voy a la playa (L8 cp),
#   ¿dónde está? recalled FROM m4 not m9 (see below) — m9's own
#   voicings are otherwise reused as live production (builds/clozes/
#   sims), not recalled, since the module is still teaching them.
#   cross-module (licensed by m1–m8 printed voicings, per the wave doc):
#   tengo hambre (L1, L9 sim), el agua (L2), la cuenta por favor (L3),
#   el carro rojo (L4), muy bonito (L5), el sábado (L6, m8), hoy (L6/L7/
#   L9, m8), mañana (L7, m8), el gato (L7), mi familia (L8 cp),
#   ¿dónde está? (L8 cp, L10), quiero un café (L9, m7 — drink, not
#   place), hasta luego / adiós (L9, L10, m1/m2), buenos días (L6 ear).
newAtoms:
  - { surface: "voy", meaningEn: "I'm going / I go", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "vas", meaningEn: "you're going / you go", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "a", meaningEn: "to", partOfSpeech: "particle", kind: "particle" }
  - { surface: "al", meaningEn: "to the (el-words)", partOfSpeech: "particle", kind: "particle", hint: "a + el, always — never say «a el»" }
  - { surface: "adónde", meaningEn: "where to?", partOfSpeech: "adverb", kind: "vocab", hint: "a-DON-deh — always means TO where, not just where" }
  - { surface: "parque", meaningEn: "park", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "🌳" }
  - { surface: "tienda", meaningEn: "store", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "🏪" }
  - { surface: "escuela", meaningEn: "school", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "🏫" }
  - { surface: "cine", meaningEn: "movie theater", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "🎬", hint: "no telltale ending — a secret-side word, like leche: SEE-neh" }
  - { surface: "playa", meaningEn: "beach", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "🏖️" }
  - { surface: "mercado", meaningEn: "market", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "🛒" }
  - { surface: "trabajo", meaningEn: "work", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "💼" }
  - { surface: "autobús", meaningEn: "bus", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "🚌", hint: "ow-toh-BOOS" }
  - { surface: "ahora", meaningEn: "now", partOfSpeech: "adverb", kind: "vocab" }

lessons:
  # ── L1 · voy + parque/playa debuts. States the module promise. ───────
  - n: 1
    template: free
    title: "Say where you're headed"
    description: "«Voy» — I'm going. Learn it, and never stand around not knowing where you're off to."
    steps:
      - kind: info
        id: info-voy
        title: "I'm going…"
        body: "«voy» — I'm going, I go. «voy a» + a place — «a» means to. «voy a la playa» — I'm going to the beach. This module: say where you're headed, wherever that is."
      - kind: imageMcq
        id: d-playa
        target: { surface: "la playa", meaningEn: "the beach", emoji: "🏖️" }
        distractors:
          - { surface: "la puerta", emoji: "🚪" }
          - { surface: "el libro", emoji: "📖" }
          - { surface: "la cama", emoji: "🛏️" }
      - kind: speakLit
        id: sp-laplaya
        es: "la playa"
        en: "the beach"
        atoms: ["la", "playa"]
      - kind: map
        id: map-voyalaplaya
        tokens: ["voy", "a", "la", "playa"]
        pairs:
          - { en: "I'm going", tokenIndex: 0 }
          - { en: "to", tokenIndex: 1 }
          - { en: "the", tokenIndex: 2 }
          - { en: "beach", tokenIndex: 3 }
        audioText: "voy a la playa"
        revealNote: "«la» and «playa» are already yours — «voy» and «a» are the new pieces: I'm going, to."
        tokenGenders: { 2: "f", 3: "f" }
      - kind: speakLit
        id: sp-voyalaplaya
        es: "voy a la playa"
        en: "I'm going to the beach"
        atoms: ["voy", "a", "la", "playa"]
      - kind: imageMcq
        id: d-parque
        target: { surface: "el parque", meaningEn: "the park", emoji: "🌳" }
        distractors:
          - { surface: "una llave", emoji: "🔑" }
          - { surface: "el libro", emoji: "📖" }
          - { surface: "la playa", emoji: "🏖️" }
      - kind: speakLit
        id: sp-elparque
        es: "el parque"
        en: "the park"
        atoms: ["el", "parque"]
      - kind: clozeLit
        id: c-parqueesta
        es: "el parque está aquí"
        en: "the park is here"
        blank: "está"
        options: ["está", "es"]
        atoms: ["el", "parque", "está", "aquí"]
        why: "You're saying WHERE it is — «está», not «es»."
      - kind: audioWimcq
        id: ear-review1
        target: { surface: "el gato", emoji: "🐱" }
        distractors:
          - { surface: "el carro", emoji: "🚗" }
          - { surface: "la casa", emoji: "🏠" }
      - kind: buildLit
        id: b-hayunparque
        es: "hay un parque aquí"
        en: "There's a park here"
        atoms: ["hay", "un", "parque", "aquí"]
        tiles: ["el", "la"]
      - kind: listenCompLit
        id: lc-voyalaplaya
        es: "voy a la playa"
        en: "I'm going to the beach."
        atoms: ["voy", "a", "la", "playa"]
        distractorsEn:
          - "I'm at the beach."
          - "There's a beach."
          - "I like the beach."
      - kind: speakLit
        id: sp-recall-tengohambre
        es: "tengo hambre"
        en: "I'm hungry"
        atoms: []
        cue: recall
      - kind: sim
        id: sim-sofia-playa
        scene: { emoji: "🏖️", title: "Sofía's heading out", setting: "Sofía packs a beach bag by the door." }
        turns:
          - id: t1
            npc: { speaker: "Sofía", es: "¡Hasta luego! Voy a la playa.", audioText: "¡hasta luego! voy a la playa.", gloss: "Bye! I'm going to the beach." }
            goal: "Say you're headed there too."
            reply:
              mode: choice
              options:
                - { id: "right", text: "voy a la playa" }
                - { id: "wrong1", text: "está en la playa" }
                - { id: "wrong2", text: "hay una playa" }
              correctOptionId: "right"
              audioText: "voy a la playa"
            replyGloss: "I'm going to the beach too."
      - kind: matchLit
        id: match
        pairs:
          - { source: "voy", target: "I'm going / I go" }
          - { source: "la playa", target: "the beach" }
          - { source: "el parque", target: "the park" }
          - { source: "a", target: "to" }
          - { source: "hay", target: "there is / there are" }
          - { source: "gracias", target: "thank you" }
      - kind: speakLit
        id: sp-win
        es: "hoy voy a la playa"
        en: "today I'm going to the beach"
        atoms: ["hoy", "voy", "a", "la", "playa"]

  # ── L2 · the al contraction + cine/mercado. THE lane opens. ──────────
  - n: 2
    template: free
    title: "The el-words shrink"
    description: "«Al» — a + el, squeezed into one word. El-words contract; la-words don't."
    steps:
      - kind: info
        id: info-al
        title: "a + el = al"
        body: "«al» is a + el squeezed into one word — el-words ALWAYS contract: «voy al parque», never «voy a el parque». La-words stay two words: «voy a la playa» stays «a la». One rule, two kinds of words."
      - kind: imageMcq
        id: d-cine
        target: { surface: "el cine", meaningEn: "the movie theater", emoji: "🎬" }
        distractors:
          - { surface: "el parque", emoji: "🌳" }
          - { surface: "la playa", emoji: "🏖️" }
          - { surface: "el libro", emoji: "📖" }
      - kind: speakLit
        id: sp-elcine
        es: "el cine"
        en: "the movie theater"
        atoms: ["el", "cine"]
      - kind: clozeLit
        id: c-cinesecret
        es: "el cine está aquí"
        en: "the movie theater is here"
        blank: "el"
        options: ["el", "la"]
        atoms: ["el", "cine", "está", "aquí"]
        why: "cine keeps its side secret — no telltale ending. Like leche: you learn it as «el cine», the word carries its side with it."
      - kind: map
        id: map-voyalcine
        tokens: ["voy", "al", "cine"]
        pairs:
          - { en: "I'm going", tokenIndex: 0 }
          - { en: "to the", tokenIndex: 1 }
          - { en: "movies", tokenIndex: 2 }
        audioText: "voy al cine"
        revealNote: "«voy» is already yours — «al» squeezes a + el into one word, and «cine» you just met."
        tokenGenders: { 1: "m", 2: "m" }
      - kind: speakLit
        id: sp-voyalcine
        es: "voy al cine"
        en: "I'm going to the movies"
        atoms: ["voy", "al", "cine"]
      - kind: imageMcq
        id: d-mercado
        target: { surface: "el mercado", meaningEn: "the market", emoji: "🛒" }
        distractors:
          - { surface: "el cine", emoji: "🎬" }
          - { surface: "la playa", emoji: "🏖️" }
          - { surface: "el parque", emoji: "🌳" }
      - kind: speakLit
        id: sp-elmercado
        es: "el mercado"
        en: "the market"
        atoms: ["el", "mercado"]
      - kind: clozeLit
        id: c-alvscine
        es: "voy al cine"
        en: "I'm going to the movies"
        blank: "al"
        options: ["al", "a"]
        atoms: ["voy", "al", "cine"]
        why: "cine is an el-word — el-words contract: «al», not bare «a»."
      - kind: buildLit
        id: b-voyalmercado
        es: "voy al mercado"
        en: "I'm going to the market"
        atoms: ["voy", "al", "mercado"]
        tiles: ["a", "la"]
      - kind: clozeLit
        id: c-alvsala
        es: "voy a la playa"
        en: "I'm going to the beach"
        blank: "a"
        options: ["a", "al"]
        atoms: ["voy", "a", "la", "playa"]
        why: "playa is a la-word — la-words stay two words: «a la», never «al la»."
      - kind: audioWimcq
        id: ear-review2
        target: { surface: "la casa", emoji: "🏠" }
        distractors:
          - { surface: "el libro", emoji: "📖" }
          - { surface: "la puerta", emoji: "🚪" }
      - kind: speakLit
        id: sp-voyalparque
        es: "voy al parque"
        en: "I'm going to the park"
        atoms: ["voy", "al", "parque"]
      - kind: listenCompLit
        id: lc-voyalmercado
        es: "voy al mercado"
        en: "I'm going to the market."
        atoms: ["voy", "al", "mercado"]
        distractorsEn:
          - "I'm at the market."
          - "There's a market."
          - "I'm going to the park."
      - kind: speakLit
        id: sp-recall-elagua
        es: "el agua"
        en: "the water"
        atoms: []
        cue: recall
      - kind: sim
        id: sim-diego-cine
        scene: { emoji: "🎬", title: "Diego's plan", setting: "Diego checks his phone, grinning." }
        turns:
          - id: t1
            npc: { speaker: "Diego", es: "¡Hola! Voy al mercado.", audioText: "¡hola! voy al mercado.", gloss: "Hi! I'm going to the market." }
            goal: "Say you're headed to the movies."
            reply:
              mode: choice
              options:
                - { id: "right", text: "voy al cine" }
                - { id: "wrong1", text: "está en el cine" }
                - { id: "wrong2", text: "hay un cine" }
              correctOptionId: "right"
              audioText: "voy al cine"
            replyGloss: "I'm going to the movies."
            explanation: "«está» would locate it, «hay» would just claim it exists — you're saying where YOU'RE headed, so «voy»."
      - kind: matchLit
        id: match
        pairs:
          - { source: "el cine", target: "the movie theater" }
          - { source: "el mercado", target: "the market" }
          - { source: "al", target: "to the" }
          - { source: "voy", target: "I'm going" }
          - { source: "la playa", target: "the beach" }
          - { source: "gracias", target: "thank you" }
      - kind: speakLit
        id: sp-win
        es: "voy al mercado"
        en: "I'm going to the market"
        atoms: ["voy", "al", "mercado"]

  # ── L3 · vas + ¿adónde? — asking someone else. ───────────────────────
  - n: 3
    template: free
    title: "Now ask them"
    description: "«¿Adónde vas?» — where are you headed? Not m4's «¿dónde?» — this one asks TO where."
    steps:
      - kind: info
        id: info-adonde
        title: "Ask where someone's headed"
        body: "«vas» — you're going, you go. «¿adónde?» asks WHERE TO — different from m4's «¿dónde?», which asks where something simply IS. «¿adónde vas?» — where are you headed?"
      - kind: map
        id: map-adondevas
        tokens: ["¿adónde", "vas?"]
        pairs:
          - { en: "where to", tokenIndex: 0 }
          - { en: "are you going", tokenIndex: 1 }
        audioText: "¿adónde vas?"
        revealNote: "«vas» is the you-form of «voy» — «adónde» just asks where to."
      - kind: speakLit
        id: sp-adondevas
        es: "¿adónde vas?"
        en: "where are you headed?"
        atoms: ["adónde", "vas"]
      - kind: textMcq
        id: tm-dondevsadonde1
        target: "dónde"
        distractors: ["adónde", "aquí", "vas"]
        prompt: "«¿___ está el parque?» — you're asking WHERE it is, not where you're headed."
      - kind: buildLit
        id: b-vasalparque
        es: "¿vas al parque?"
        en: "are you going to the park?"
        atoms: ["vas", "al", "parque"]
        tiles: ["voy", "a"]
      - kind: clozeLit
        id: c-voyvsvas1
        es: "voy al mercado"
        en: "I'm going to the market"
        blank: "voy"
        options: ["voy", "vas"]
        atoms: ["voy", "al", "mercado"]
        why: "You're talking about YOURSELF — «voy», not «vas»."
      - kind: audioWimcq
        id: ear-review3
        target: { surface: "la cama", emoji: "🛏️" }
        distractors:
          - { surface: "el baño", emoji: "🚽" }
          - { surface: "la puerta", emoji: "🚪" }
      - kind: clozeLit
        id: c-voyvsvas2
        es: "vas al cine"
        en: "you're going to the movies"
        blank: "vas"
        options: ["vas", "voy"]
        atoms: ["vas", "al", "cine"]
        why: "Asking someone else — «vas»."
      - kind: buildLit
        id: b-adondevashoy
        es: "¿adónde vas hoy?"
        en: "where are you headed today?"
        atoms: ["adónde", "vas", "hoy"]
        tiles: ["dónde", "voy"]
      - kind: speakLit
        id: sp-recall-cuentaporfavor
        es: "la cuenta por favor"
        en: "the check, please"
        atoms: []
        cue: recall
      - kind: listenCompLit
        id: lc-vasalmercado
        es: "¿vas al mercado?"
        en: "Are you going to the market?"
        atoms: ["vas", "al", "mercado"]
        distractorsEn:
          - "Where are you headed?"
          - "I'm going to the market."
          - "Is there a market?"
      - kind: sim
        id: sim-ana-adondevas
        scene: { emoji: "❓", title: "Ana's curious", setting: "Ana catches you leaving the house." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¡Hola! ¿Adónde vas?", audioText: "¡hola! ¿adónde vas?", gloss: "Hi! Where are you headed?" }
            goal: "Say you're going to the park."
            reply:
              mode: choice
              options:
                - { id: "right", text: "voy al parque" }
                - { id: "wrong1", text: "vas al parque" }
                - { id: "wrong2", text: "está en el parque" }
              correctOptionId: "right"
              audioText: "voy al parque"
            replyGloss: "I'm going to the park."
      - kind: matchLit
        id: match
        pairs:
          - { source: "vas", target: "you're going" }
          - { source: "¿adónde?", target: "where to?" }
          - { source: "voy", target: "I'm going" }
          - { source: "el cine", target: "the movie theater" }
          - { source: "gracias", target: "thank you" }
          - { source: "la playa", target: "the beach" }
      - kind: speakLit
        id: sp-win
        es: "¿adónde vas?"
        en: "where are you headed?"
        atoms: ["adónde", "vas"]

  # ── L4 · tienda/escuela/trabajo interleaved. Places never block. ─────
  - n: 4
    template: free
    title: "Everywhere you need to go"
    description: "Three more places — the store, school, work — each with a break before the next."
    steps:
      - kind: imageMcq
        id: d-tienda
        target: { surface: "la tienda", meaningEn: "the store", emoji: "🏪" }
        distractors:
          - { surface: "el mercado", emoji: "🛒" }
          - { surface: "el cine", emoji: "🎬" }
          - { surface: "la playa", emoji: "🏖️" }
      - kind: speakLit
        id: sp-latienda
        es: "la tienda"
        en: "the store"
        atoms: ["la", "tienda"]
      - kind: audioWimcq
        id: ear-cinetienda1
        target: { surface: "la tienda", emoji: "🏪" }
