        en: "I have to work, but my friends have to buy gloves"
        atoms: ["yo", "tengo que", "trabajar", "mi", "amigo", "tienen", "comprar", "guantes"]

  # ── L9 · «Puedo trabajar, pero no tengo que trabajar hoy» — the
  #    dedicated contrast lesson, same infinitive host, different
  #    meaning: «puedo» (can, ability, m14) vs «tengo que» (must,
  #    obligation, m33). Carries the module's second and final info card
  #    (see m33-header.yaml usage-note budget — L1 and L9 only). Also the
  #    negation case: «no tengo que» = don't have to, not the reverse.
  #    Reaches m29's fused clitic family («comprarla»). ≥1 recall (L2's
  #    win line).
  - n: 9
    template: free
    title: "Puedo trabajar, pero no tengo que trabajar hoy"
    description: "«puedo» (can, ability, m14) vs «tengo que» (must, obligation, m33) — same infinitive, different meaning. And negating «tengo que»: «no tengo que» = don't have to, not the reverse."
    steps:
      - kind: map
        id: l9-map-puedotrabajarnotengoque
        tokens: ["puedo", "trabajar,", "pero", "no", "tengo que", "trabajar", "hoy"]
        pairs:
          - { en: "I can", tokenIndex: 0 }
          - { en: "work,", tokenIndex: 1 }
          - { en: "but", tokenIndex: 2 }
          - { en: "not", tokenIndex: 3 }
          - { en: "I have to", tokenIndex: 4 }
          - { en: "work", tokenIndex: 5 }
          - { en: "today", tokenIndex: 6 }
        audioText: "puedo trabajar, pero no tengo que trabajar hoy"
        revealNote: "«puedo» = can (ability, m14). «tengo que» = have to (obligation, m33). Negating it — «no tengo que» — means 'I don't have to,' not 'I have to not.'"
      - kind: info
        id: l9-info-puedovstengoque
        title: "Puedo vs. tengo que"
        body: "«puedo trabajar» = I CAN work (ability, m14). «tengo que trabajar» = I HAVE TO work (obligation, m33). Same infinitive, different meaning — and «no tengo que» means \"I don't have to,\" not the reverse."
      - kind: speakLit
        id: l9-sp-recall
        es: "¿tienes que estudiar hoy?"
        en: "Do you have to study today?"
        cue: recall
        atoms: ["tienes", "estudiar", "hoy"]
      - kind: buildLit
        id: l9-b-puedocomprarchaquetanotengoquecomprarla
        es: "puedo comprar una chaqueta, pero no tengo que comprarla hoy"
        en: "I can buy a jacket, but I don't have to buy it today"
        atoms: ["puedo", "comprar", "chaqueta", "pero", "no", "tengo que", "comprarla", "hoy"]
        tiles: ["quiero", "voy"]
      - kind: clozeLit
        id: l9-c-puedetrabajarnotienequetrabajar
        es: "puede trabajar, pero no tiene que trabajar hoy"
        en: "She can work, but she doesn't have to work today"
        blank: "puede"
        options: ["puede", "puedo"]
        atoms: ["puede", "trabajar", "no", "tiene"]
        why: "«puede»/«tiene» — talking about someone else, not «puedo»/«tengo» (yourself)."
      - kind: listenCompLit
        id: l9-lc-puedonadarnotengoquenadar
        es: "puedo nadar, pero no tengo que nadar hoy"
        en: "I can swim, but I don't have to swim today."
        atoms: ["puedo", "nadar", "no", "tengo que"]
        distractorsEn:
          - "I want to swim, but I don't have to swim today."
          - "I can swim, but I have to swim today."
          - "I can't swim, but I don't have to swim today."
      - kind: mcq
        id: l9-q-puedotrabajarnotengoquetrabajarhoy
        prompt: "Which one means 'I can work'?"
        correct: "puedo trabajar"
        distractors: ["tengo que trabajar", "quiero trabajar", "puedo que trabajar"]
        atoms: ["puedo", "trabajar"]
        why: "«puedo» = can; «tengo que» = must — very different meanings. «quiero» ≠ «puedo» — want isn't can. And «puedo» never takes a «que» linker."
      - kind: buildLit
        id: l9-b-hermanapuedeestudiarnotiene
        es: "mi hermana puede estudiar, pero no tiene que estudiar hoy"
        en: "My sister can study, but she doesn't have to study today"
        atoms: ["mi", "hermana", "puede", "estudiar", "no", "tiene"]
        tiles: ["puedo", "tengo"]
      - kind: audioWimcq
        id: l9-ear-chaqueta
        target: { surface: "chaqueta", emoji: "🧥" }
        distractors:
          - { surface: "pantalón", emoji: "👖" }
          - { surface: "calcetines", emoji: "🧦" }
      - kind: agreementLit
        id: l9-agr-puedochaquetanuevanotengopantalonnuevo
        en: "I can buy a new jacket, but I don't have to buy new pants"
        audioText: "puedo comprar una chaqueta nueva, pero no tengo que comprar un pantalón nuevo"
        atoms: ["puedo", "comprar", "chaqueta", "nuevo", "no", "tengo que", "pantalón"]
        segments:
          - { text: "puedo comprar una chaqueta " }
          - { blank: { id: "p1", answer: "nueva", options: ["nueva", "nuevo"] } }
          - { text: ", pero no tengo que comprar un pantalón " }
          - { blank: { id: "p2", answer: "nuevo", options: ["nuevo", "nueva"] } }
      - kind: listenBuildLit
        id: l9-lb-puedesnadarnotienesquenadar
        es: "puedes nadar, pero no tienes que nadar mañana"
        en: "You can swim, but you don't have to swim tomorrow"
        atoms: ["puedes", "nadar", "no", "tienes", "mañana"]
        tiles: ["puedo", "tengo"]
      - kind: textMcq
        id: l9-tm-puedo
        target: "puedo"
        distractors: ["pueblo", "puente", "suelo"]
      - kind: sim
        id: l9-sim-ana-plan
        scene: { emoji: "💪", title: "Ana asks about your plans", setting: "Ana wonders what you're doing this weekend." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Puedes trabajar mañana?", audioText: "¿puedes trabajar mañana?", gloss: "Can you work tomorrow?" }
            goal: "Say you can, but don't have to."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, puedo, pero no tengo que" }
                - { id: "wrong1", text: "sí, tengo, pero no puedo que" }
                - { id: "wrong2", text: "sí, puedo, pero no tengo trabajar" }
              correctOptionId: "right"
              audioText: "sí, puedo, pero no tengo que"
            replyGloss: "Yes, I can, but I don't have to."
            explanation: "«puedo» = can; «tengo que» = must — very different meanings, and never drop «que»."
          - id: t2
            npc: { speaker: "Ana", es: "¿Y tu hermana? ¿Tiene que trabajar ella?", audioText: "¿y tu hermana? ¿tiene que trabajar ella?", gloss: "And your sister? Does she have to work?" }
            goal: "Say no, she can, but doesn't have to."
            reply:
              mode: build
              tiles: ["no", "no", "puede", "pero", "tiene", "que", "trabajar", "puedo", "tengo"]
              answer: "puede pero no tiene que trabajar"
            replyGloss: "No, she can, but she doesn't have to work."
            explanation: "«puede»/«tiene» — about her, not yourself. No leading «no» — a bare «no puede» would read as 'she can't,' the opposite meaning; the negation belongs on «tiene que», never on «puede»."
      - kind: matchLit
        id: l9-match
        pairs:
          - { source: "puedo", target: "I can" }
          - { source: "tengo que", target: "I have to" }
          - { source: "no", target: "not" }
          - { source: "trabajar", target: "work" }
          - { source: "comprarla", target: "to buy it" }
          - { source: "hoy", target: "today" }
      - kind: speakLit
        id: l9-sp-win
        es: "puedo trabajar, pero no tengo que trabajar hoy"
        en: "I can work, but I don't have to work today"
        atoms: ["puedo", "trabajar", "pero", "no", "tengo que", "hoy"]

  # ── L10 · Mastery — all graded, no map/info (mirrors m32-L10's own
  #    mastery shape: no trailing speakLit-win after sim). Recombines every
  #    strand of the module (tengo/tiene/tenemos, dropped-«que» avoided
  #    throughout) plus m30's «duele»/«duelen», m29's fused clitics
  #    («comprarlo»/«comprarla»), m16's «necesito», and m32's clothing
  #    nouns. Two recalls (L9 and L3, different lessons, neither recalled
  #    together before). NOTE ON THE BRIEF'S TARGET SENTENCE: the brief's
  #    win line ("Me duele la mano, pero tengo que comprarlo — necesito una
  #    chaqueta nueva.") pairs the masculine clitic «comprarlo» with the
  #    feminine antecedent «chaqueta» — a gender-agreement bug. Corrected
  #    to «comprarla» (step 2, the closest analog to a "win" line this
  #    mastery lesson carries, since mastery lessons end on sim with no
  #    trailing speakLit — see m32-L10 precedent). «comprarlo» is still
  #    used elsewhere in this lesson (steps 3, 10) with a masculine referent
  #    in context, so the module still exercises both fused-clitic genders.
  #    LAST step is the sim — no matchLit/speakLit after it.
  - n: 10
    template: free
    title: "Mastery: me duele la mano, pero tengo que..."
    description: "Every strand, one last time — obligation across all persons, pain (m30/m31), fused clitics (m29), and clothing (m32), all in one pass."
    steps:
      - kind: speakLit
        id: l10-sp-recall-l9win
        es: "puedo trabajar, pero no tengo que trabajar hoy"
        en: "I can work, but I don't have to work today"
        atoms: []
        cue: recall
      - kind: buildLit
        id: l10-b-meduelelamanotengoquecomprarla
        es: "me duele la mano, pero tengo que comprarla — necesito una chaqueta nueva"
        en: "My hand hurts, but I have to buy it — I need a new jacket"
        atoms: ["me", "duele", "mano", "pero", "tengo que", "comprarla", "necesito", "chaqueta"]
        tiles: ["duelen", "tiene"]
      - kind: clozeLit
        id: l10-c-tienequecomprarlopantalon
        es: "tiene que comprarlo mañana, el pantalón nuevo"
        en: "He has to buy it tomorrow, the new pants"
        blank: "comprarlo"
        options: ["comprarlo", "comprarla"]
        atoms: ["tiene", "comprarlo", "mañana", "pantalón", "nuevo"]
        why: "«el pantalón» is masculine, so «comprarlo», not «comprarla»."
      - kind: listenCompLit
        id: l10-lc-tengoquecomprarguantesduelen
        es: "tengo que comprar guantes porque me duelen las manos"
        en: "I have to buy gloves because my hands hurt."
        atoms: ["tengo que", "comprar", "guantes", "porque", "me", "duelen", "mano"]
        distractorsEn:
          - "I want to buy gloves because my hands hurt."
          - "I have to buy gloves because my hand hurts."
          - "My hands hurt."
      - kind: mcq
        id: l10-q-pantalonchaquetanecesito
        prompt: "Which one means 'I have to buy new pants, and I also need a jacket'?"
        correct: "tengo que comprar un pantalón nuevo, y también necesito una chaqueta"
        distractors: ["tengo comprar un pantalón nuevo, y también necesito una chaqueta", "tengo que comprar un pantalón nueva, y también necesito una chaqueta", "tengo que comprar un pantalón nuevo, y también necesita una chaqueta"]
        atoms: ["tengo que", "comprar", "pantalón", "nuevo", "también", "necesito", "chaqueta"]
        why: "Never drop «que»; «pantalón» is masculine so «nuevo», not «nueva»; and «necesito», not «necesita» — it's about you."
      - kind: speakLit
        id: l10-sp-recall-l3win
        es: "Ana tiene que trabajar mañana"
        en: "Ana has to work tomorrow"
        atoms: []
        cue: recall
      - kind: buildLit
        id: l10-b-meduelenmanoscomprarguantes
        es: "me duelen las manos, tengo que comprar guantes nuevos"
        en: "My hands hurt, I have to buy new gloves"
        atoms: ["me", "duelen", "mano", "tengo que", "comprar", "guantes", "nuevo"]
        tiles: ["duele", "tiene"]
      - kind: audioWimcq
        id: l10-ear-mano
        target: { surface: "mano", emoji: "✋" }
        distractors:
          - { surface: "pie", emoji: "🦶" }
          - { surface: "brazo", emoji: "💪" }
      - kind: agreementLit
        id: l10-agr-chaquetapantalonamigo
        en: "I have to buy a new jacket, but my friend needs new pants"
        audioText: "tengo que comprar una chaqueta nueva, pero mi amigo necesita un pantalón nuevo"
        atoms: ["tengo que", "comprar", "chaqueta", "nuevo", "amigo", "necesita", "pantalón"]
        segments:
          - { text: "tengo que comprar una chaqueta " }
          - { blank: { id: "p1", answer: "nueva", options: ["nueva", "nuevo"] } }
          - { text: ", pero mi amigo necesita un pantalón " }
          - { blank: { id: "p2", answer: "nuevo", options: ["nuevo", "nueva"] } }
      - kind: listenBuildLit
        id: l10-lb-meduelelamanocomprarlomanana
        es: "me duele la mano, pero tengo que comprarlo mañana"
        en: "My hand hurts, but I have to buy it tomorrow"
        atoms: ["me", "duele", "mano", "pero", "tengo que", "comprarlo", "mañana"]
        tiles: ["duelen", "tiene"]
      - kind: textMcq
        id: l10-tm-necesito
        target: "necesito"
        distractors: ["negocio", "nervioso", "necesita"]
      - kind: matchLit
        id: l10-match
        pairs:
          - { source: "duele", target: "hurts (one thing)" }
          - { source: "duelen", target: "hurt (more than one)" }
          - { source: "mano", target: "hand" }
          - { source: "tengo que", target: "I have to" }
          - { source: "comprarlo", target: "to buy it" }
          - { source: "necesito", target: "I need" }
      - kind: sim
        id: l10-sim-mastery
        scene: { emoji: "🛍️", title: "One last errand", setting: "Ana checks on you before the weekend." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Te duele la mano?", audioText: "¿te duele la mano?", gloss: "Does your hand hurt?" }
            goal: "Say your hand hurts."
            reply:
              mode: choice
              options:
                - { id: "right", text: "me duele la mano" }
                - { id: "wrong1", text: "me duelen la mano" }
                - { id: "wrong2", text: "tengo duele la mano" }
              correctOptionId: "right"
              audioText: "me duele la mano"
            replyGloss: "My hand hurts."
            explanation: "«mano» is singular, so «duele», not «duelen» — and never «tengo duele», mixing two different verbs."
          - id: t2
            npc: { speaker: "Ana", es: "¿Vas a comprar una chaqueta hoy?", audioText: "¿vas a comprar una chaqueta hoy?", gloss: "Are you going to buy a jacket today?" }
            goal: "Say you have to buy a jacket."
            reply:
              mode: build
              tiles: ["tengo", "que", "comprar", "una", "chaqueta", "nueva", "quiero", "voy"]
              answer: "tengo que comprar una chaqueta nueva"
            replyGloss: "I have to buy a new jacket."
            explanation: "«chaqueta» is feminine, so «una»/«nueva» — and never drop «que» between «tengo» and the infinitive."

