        atoms: ["no", "puedo", "ir", "tengo que", "comprar", "pantalón", "nuevo", "mi", "amigo", "tiene", "camisa"]
        segments:
          - { text: "no puedo ir, tengo que comprar un pantalón " }
          - { blank: { id: "p1", answer: "nuevo", options: ["nuevo", "nueva"] } }
          - { text: ", y mi amigo tiene una camisa " }
          - { blank: { id: "p2", answer: "nueva", options: ["nueva", "nuevo"] } }
      - kind: listenBuildLit
        id: l7-lb-nopuedesirtienesqueestudiar
        es: "no puedes ir, tienes que estudiar"
        en: "You can't go, you have to study"
        atoms: ["no", "puedes", "ir", "tienes", "estudiar"]
        tiles: ["puedo", "tengo"]
      - kind: textMcq
        id: l7-tm-camisa
        target: "camisa"
        distractors: ["camisón", "cortina", "comisa"]
      - kind: sim
        id: l7-sim-diego-fiesta
        scene: { emoji: "🎉", title: "Diego invites you to a party", setting: "Diego calls about tomorrow." }
        turns:
          - id: t1
            npc: { speaker: "Diego", es: "¿Quieres ir a una fiesta mañana?", audioText: "¿quieres ir a una fiesta mañana?", gloss: "Do you want to go to a party tomorrow?" }
            goal: "Decline — say you have to work."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no puedo, tengo que trabajar" }
                - { id: "wrong1", text: "no puedo, tengo trabajar" }
                - { id: "wrong2", text: "no quiero, tengo que trabajar" }
              correctOptionId: "right"
              audioText: "no puedo, tengo que trabajar"
            replyGloss: "I can't, I have to work."
            explanation: "«no puedo» declines, «tengo que» gives the reason — never drop «que»."
          - id: t2
            npc: { speaker: "Diego", es: "¿Y tu hermana? ¿Puede ir ella?", audioText: "¿y tu hermana? ¿puede ir ella?", gloss: "And your sister? Can she go?" }
            goal: "Say no, she has to study too."
            reply:
              mode: build
              tiles: ["no", "puede", "tiene", "que", "estudiar", "también", "puedo", "tengo"]
              answer: "tiene que estudiar también"
            replyGloss: "No, she has to study too."
            explanation: "«tiene» — talking about your sister (él/ella), not «tengo» (yourself). No leading «no» needed — the reason alone declines."
      - kind: matchLit
        id: l7-match
        pairs:
          - { source: "puedo", target: "I can" }
          - { source: "tengo que", target: "I have to" }
          - { source: "ir", target: "to go" }
          - { source: "trabajar", target: "work" }
          - { source: "fiesta", target: "party" }
          - { source: "mañana", target: "tomorrow" }
      - kind: speakLit
        id: l7-sp-win
        es: "no puedo, tengo que trabajar"
        en: "I can't, I have to work"
        atoms: ["no", "puedo", "tengo que", "trabajar"]

