  # ── L9 · Consolidation — every connective and both tenses side by side,
  #    ZERO new atoms. Last teaching lesson before the mastery sim; free-mix
  #    review that stacks all four connectives against the imperfect/
  #    preterite split one more time. ≥1 recall (table floor).
  - n: 9
    template: free
    title: "Todo junto"
    description: "One last pass: cuando, mientras, de repente, entonces, fue, era, iba — all four connectives, both tenses, side by side."
    steps:
      - kind: map
        id: l9-map-ibaescuelavisamhablesofia
        tokens: ["cuando", "iba", "a", "la", "escuela,", "vi", "a", "Sam,", "y", "hablé", "con", "Sofía"]
        pairs:
          - { en: "when", tokenIndex: 0 }
          - { en: "I was going", tokenIndex: 1 }
          - { en: "to", tokenIndex: 2 }
          - { en: "the", tokenIndex: 3 }
          - { en: "school,", tokenIndex: 4 }
          - { en: "I saw", tokenIndex: 5 }
          - { en: "", tokenIndex: 6 }
          - { en: "Sam,", tokenIndex: 7 }
          - { en: "and", tokenIndex: 8 }
          - { en: "I talked", tokenIndex: 9 }
          - { en: "with", tokenIndex: 10 }
          - { en: "Sofía", tokenIndex: 11 }
        audioText: "cuando iba a la escuela, vi a Sam, y hablé con Sofía"
        revealNote: "«iba» paints the ongoing scene; «vi» and «hablé» are the two bounded events that happened inside it."
      - kind: info
        id: l9-info-todojunto
        title: "All four, one more time"
        body: "«cuando»/«mientras» open a scene; «de repente» flags a surprise inside it; «entonces» chains what happened next. The imperfect always paints the scene; the preterite always reports the bounded thing. «Cuando iba a la escuela, vi a Sam, y hablé con Sofía» — one scene, two events."
      - kind: speakLit
        id: l9-sp-ibaescuelavisamhablesofia
        es: "cuando iba a la escuela, vi a Sam, y hablé con Sofía"
        en: "When I was going to school, I saw Sam, and I talked with Sofía"
        atoms: ["cuando", "iba", "vi", "hablé", "escuela"]
      - kind: buildLit
        id: l9-b-mientrasveiamosderepentevinoanaentonceshablamos
        es: "mientras veíamos la película, de repente vino Ana, entonces hablamos"
        en: "While we were watching the movie, suddenly Ana came, so we talked"
        atoms: ["mientras", "veíamos", "de repente", "vino", "entonces", "hablamos", "película"]
        tiles: ["veían", "viene"]
      - kind: speakLit
        id: l9-sp-erabuenocuandoibaescuela
        es: "era muy bueno cuando iba a la escuela"
        en: "I was very good when I was going to school"
        atoms: ["cuando", "era", "iba", "bueno", "escuela"]
      - kind: clozeLit
        id: l9-c-todosfuerontiendaentonceshable
        es: "todos fueron a la tienda, entonces hablé con ellos"
        en: "Everyone went to the store, so I talked with them"
        blank: "entonces"
        options: ["entonces", "cuando", "mientras"]
        atoms: ["entonces", "fueron", "hablé", "todos", "tienda"]
        why: "«entonces» chains the two finished events — their trip, then your talk. «cuando»/«mientras» would open a scene instead, changing the shape."
      - kind: listenCompLit
        id: l9-lc-cuandoveiamosderepentevinoluis
        es: "cuando veíamos la película, de repente vino Luis"
        en: "When we were watching the movie, suddenly Luis came."
        atoms: ["cuando", "veíamos", "de repente", "vino", "película"]
        distractorsEn:
          - "When we watch the movie, suddenly Luis comes."
          - "When we were watching the movie, then Luis came."
          - "When we were watching the movie, suddenly Luis left."
      - kind: mcq
        id: l9-q-fourconnectivesreview
        prompt: "Which one flags a surprise interruption?"
        correct: "de repente"
        distractors: ["entonces", "cuando", "mientras"]
        atoms: ["de repente"]
        why: "«de repente» flags the surprise interruption. «entonces» would chain a next step; «cuando»/«mientras» would open a scene, not flag a surprise."
      - kind: listenBuildLit
        id: l9-lb-todosibanplayacuandofuivi
        es: "todos iban a la playa cuando fui también"
        en: "Everyone was going to the beach when I went too"
        atoms: ["cuando", "iban", "fui", "todos", "playa"]
        tiles: ["fueron", "iba"]
      - kind: agreementLit
        id: l9-agr-hablabamosentoncesfuimos
        en: "We were talking, so then we went to the party"
        audioText: "hablábamos, entonces fuimos a la fiesta"
        atoms: ["entonces", "hablábamos", "fuimos"]
        segments:
          - { blank: { id: "p1", answer: "hablábamos", options: ["hablábamos", "hablamos"] } }
          - { text: ", entonces " }
          - { blank: { id: "p2", answer: "fuimos", options: ["fuimos", "íbamos"] } }
          - { text: " a la fiesta" }
      - kind: audioWimcq
        id: l9-ear-cine
        target: { surface: "el cine", emoji: "🎬" }
        distractors:
          - { surface: "la escuela", emoji: "🏫" }
          - { surface: "el mercado", emoji: "🛒" }
      - kind: textMcq
        id: l9-tm-mientras
        target: "mientras"
        distractors: ["cuando", "entonces", "de repente"]
      - kind: speakLit
        id: l9-sp-recall-nomientoncesnofuimos
        es: "no vino Ana, entonces no fuimos a la fiesta"
        en: "Ana didn't come, so we didn't go to the party"
        atoms: []
        cue: recall
      - kind: sim
        id: l9-sim-carmen-todojunto
        scene: { emoji: "🧩", title: "Carmen wants the full story", setting: "Carmen is piecing together everything that happened that day." }
        turns:
          - id: t1
            npc: { speaker: "Carmen", es: "¿Adónde ibas cuando viste a Sam?", audioText: "¿adónde ibas cuando viste a sam?", gloss: "Where were you going when you saw Sam?" }
            goal: "Say you were going to school."
            reply:
              mode: build
              tiles: ["iba", "a", "la", "escuela", "voy", "fui"]
              answer: "iba a la escuela"
            replyGloss: "I was going to school."
            explanation: "«iba» — the ongoing scene his sighting landed inside. «voy» slips into now; «fui» would make the going one bounded trip."
          - id: t2
            npc: { speaker: "Carmen", es: "¿Y entonces hablaste con Sofía?", audioText: "¿y entonces hablaste con sofía?", gloss: "And then did you talk with Sofía?" }
            goal: "Say yes, then you talked with her."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, entonces hablé con ella" }
                - { id: "wrong1", text: "sí, entonces hablaba con ella" }
                - { id: "wrong2", text: "sí, mientras hablé con ella" }
              correctOptionId: "right"
              audioText: "sí, entonces hablé con ella"
            replyGloss: "Yes, then I talked with her."
            explanation: "«entonces hablé» — the next bounded event, chained. «hablaba» would make it an ongoing scene; «mientras» would claim simultaneity instead of sequence."
          - id: t3
            npc: { speaker: "Carmen", es: "Mientras hablabas con Ana, ¿vinieron todos a la fiesta después?", audioText: "mientras hablabas con ana, ¿vinieron todos a la fiesta después?", gloss: "While you were talking with Ana, did everyone come to the party afterward?" }
            goal: "Say yes, suddenly everyone came."
            reply:
              mode: build
              tiles: ["sí,", "de", "repente", "vinieron", "todos", "viene", "vino"]
              answer: "sí, de repente vinieron todos"
            replyGloss: "Yes, suddenly everyone came."
            explanation: "«todos» keeps the they-ending: «vinieron», the one bounded arrival, with «de repente» flagging the surprise."
      - kind: matchLit
        id: l9-match
        pairs:
          - { source: "cuando", target: "when" }
          - { source: "mientras", target: "while" }
          - { source: "de repente", target: "suddenly" }
          - { source: "entonces", target: "then, so" }
          - { source: "iba", target: "was going, the ongoing scene" }
          - { source: "vi", target: "I saw, one bounded event" }
      - kind: speakLit
        id: l9-sp-win
        es: "cuando iba a la escuela, vi a Sam, y hablé con Sofía"
        en: "When I was going to school, I saw Sam, and I talked with Sofía"
        atoms: ["cuando", "iba", "vi", "hablé", "escuela"]

  # ── L10 · MASTERY — zero new atoms, zero info cards, every step graded.
  #    Longest sim in the module (Ana asks the whole group to narrate a
  #    memory, 5 turns) — the module's law that the mastery lesson must END
  #    on the sim (§13.9 law 7, confirmed generic/code-enforced via
  #    doctrinePins.ts — this is a deliberate departure from the brief's
  #    general "every lesson ends sim → matchLit → -sp-win speakLit" wording,
  #    which m22/m21's own L10s also depart from) means the verbatim closing
  #    win line is delivered as the sim's final (5th) turn reply, not a
  #    separate speakLit step; matchLit sits just before the sim instead of
  #    after it. ≥2 recalls (L9, L1 — full-circle back to the very first
  #    win). Context: «de niños» (plural), «juntos», «siempre», all already
  #    demonstrated safe in earlier m23/m22 lessons. Every sim turn from L6
  #    on (this included) carries ≥1 imperfect and ≥1 preterite form across
  #    NPC lines + reply tiles/options combined.
  - n: 10
    template: free
    title: "De niños, íbamos juntos"
    description: "Everything from this module, one last time, fully graded — all four connectives, fue/era/iba, and «todos», all working together."
    steps:
      - kind: buildLit
        id: l10-b-deninosibamosescuelacuandovino
        es: "de niños, íbamos a la escuela juntos, cuando vino Sofía"
        en: "As children, we used to go to school together, when Sofía came"
        atoms: ["de niño", "íbamos", "cuando", "vino", "escuela", "juntos"]
        tiles: ["iban", "viene"]
      - kind: listenBuildLit
        id: l10-lb-mientrasibamosderepentevinodiego
        es: "mientras íbamos a la escuela, de repente vino Diego"
        en: "While we were going to school, suddenly Diego came"
        atoms: ["mientras", "íbamos", "de repente", "vino", "escuela"]
        tiles: ["iban", "viene"]
      - kind: clozeLit
        id: l10-c-entoncestodosfueronparque
        es: "entonces todos fueron al parque"
        en: "So everyone went to the park"
        blank: "fueron"
        options: ["fueron", "iban"]
        atoms: ["entonces", "fueron", "todos", "parque"]
        why: "«entonces» chains the next bounded event, and «todos» keeps the they-ending: «fueron». «iban» would make it a repeated habit, not the one trip."
      - kind: mcq
        id: l10-q-todosending
        prompt: "'Everyone came suddenly' — which one?"
        correct: "de repente vinieron todos"
        distractors: ["de repente venían todos", "entonces vinieron todos", "de repente vino todos"]
        atoms: ["de repente", "vinieron", "todos"]
        why: "«de repente» flags the surprise, and «todos» takes the they-ending: «vinieron». «venían» would make it repeated; «entonces» would chain a next step, not a surprise; «vino» drops the they-agreement."
      - kind: agreementLit
        id: l10-agr-ibamoscuandofuimos
        en: "We were going to the beach when we went to the park"
        audioText: "íbamos a la playa cuando fuimos al parque"
        atoms: ["cuando", "íbamos", "fuimos"]
        segments:
          - { blank: { id: "p1", answer: "íbamos", options: ["íbamos", "fuimos"] } }
          - { text: " a la playa cuando " }
          - { blank: { id: "p2", answer: "fuimos", options: ["fuimos", "íbamos"] } }
          - { text: " al parque" }
      # Printed non-recall at L9 (es-m23-9-l9-sp-win).
      - kind: speakLit
        id: l10-sp-recall-ibaescuelavisamhablesofia
        es: "cuando iba a la escuela, vi a Sam, y hablé con Sofía"
        en: "When I was going to school, I saw Sam, and I talked with Sofía"
        atoms: []
        cue: recall
      - kind: textMcq
        id: l10-tm-fueron
        target: "fueron"
        distractors: ["iban", "fuimos", "van"]
      - kind: audioWimcq
        id: l10-ear-parque
        target: { surface: "el parque", emoji: "🌳" }
        distractors:
          - { surface: "la escuela", emoji: "🏫" }
          - { surface: "el cine", emoji: "🎬" }
      - kind: buildLit
        id: l10-b-fiestafuebuenacuandotodosveian
        es: "la fiesta fue muy buena, cuando todos veían la película"
        en: "The party was very good, when everyone was watching the movie"
        atoms: ["cuando", "fue", "veían", "fiesta", "bueno", "todos", "película"]
        tiles: ["era", "vieron"]
      - kind: listenBuildLit
        id: l10-lb-derepentevinoluisentonceshablamos
        es: "de repente vino Luis, entonces hablamos mucho"
        en: "Suddenly Luis came, so we talked a lot"
        atoms: ["de repente", "vino", "entonces", "hablamos", "mucho"]
        tiles: ["viene", "hablábamos"]
      - kind: clozeLit
        id: l10-c-eramosninoscuandoibamos
        es: "éramos niños cuando íbamos a la escuela juntos"
        en: "We were children when we used to go to school together"
        blank: "éramos"
        options: ["éramos", "eran"]
        atoms: ["cuando", "éramos", "íbamos", "escuela", "juntos"]
        why: "We, the group, the ongoing scene: «éramos» — the accented nosotros ser form. «eran» would leave you out."
      - kind: mcq
        id: l10-q-vinieron
        prompt: "Which one means 'they came' — the group?"
        correct: "vinieron"
        distractors: ["venían", "vino", "vienen"]
        atoms: ["vinieron"]
        why: "«vinieron» — the they-preterite, one bounded arrival. «venían» would make it repeated; «vino» drops the they-agreement; «vienen» slips into now."
      # Printed non-recall at L1 (es-m23-1-l1-sp-win).
      - kind: speakLit
        id: l10-sp-recall-cuandoerafuimexico
        es: "cuando era niño, fui a méxico"
        en: "When I was a child, I went to Mexico"
        atoms: []
        cue: recall
      - kind: textMcq
        id: l10-tm-ibamos
        target: "íbamos"
        distractors: ["iban", "fuimos", "vamos"]
      - kind: matchLit
        id: l10-match
        pairs:
          - { source: "cuando", target: "when" }
          - { source: "mientras", target: "while" }
          - { source: "de repente", target: "suddenly" }
          - { source: "entonces", target: "then, so" }
          - { source: "íbamos", target: "we used to go" }
          - { source: "de niños", target: "as children" }
      - kind: sim
        id: l10-sim-ana-grupo
        scene: { emoji: "👨‍👩‍👧‍👦", title: "Ana asks for the whole memory", setting: "Ana wants to hear the whole group's memory, start to finish, in one telling." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Iban todos a la escuela juntos?", audioText: "¿iban todos a la escuela juntos?", gloss: "Did everyone use to go to school together?" }
            goal: "Say yes, you were all going together."
            reply:
              mode: build
              tiles: ["sí,", "íbamos", "juntos", "iban", "fuimos"]
              answer: "sí, íbamos juntos"
            replyGloss: "Yes, we were going together."
            explanation: "The whole group, you included: «íbamos» — the accented nosotros form. «iban» would leave you out; «fuimos» would make it one bounded trip, not the ongoing habit."
          - id: t2
            npc: { speaker: "Ana", es: "¿Y qué pasó un día, de repente?", audioText: "¿y qué pasó un día, de repente?", gloss: "And what happened one day, suddenly?" }
            goal: "Say Sofía came suddenly, while you talked."
            reply:
              mode: build
              tiles: ["de", "repente,", "vino", "Sofía", "mientras", "hablábamos", "viene"]
              answer: "de repente, vino Sofía mientras hablábamos"
            replyGloss: "Suddenly, Sofía came while we were talking."
            explanation: "«de repente» flags the surprise break-in; «vino» is the one bounded event landing inside «hablábamos», the ongoing scene. «viene» slips into now."
          - id: t3
            npc: { speaker: "Ana", es: "¿Entonces qué hicieron todos?", audioText: "¿entonces qué hicieron todos?", gloss: "So what did everyone do then?" }
            goal: "Say then everyone went to the park."
            reply:
              mode: choice
              options:
                - { id: "right", text: "entonces fueron todos al parque" }
                - { id: "wrong1", text: "entonces iban todos al parque" }
                - { id: "wrong2", text: "mientras fueron todos al parque" }
              correctOptionId: "right"
              audioText: "entonces fueron todos al parque"
            replyGloss: "Then everyone went to the park."
            explanation: "«entonces» chains the next bounded event, and «todos» keeps the they-ending: «fueron», the one trip. «iban» would make it repeated; «mientras» would claim simultaneity, not sequence."
          - id: t4
            npc: { speaker: "Ana", es: "¿Hablaban ustedes mientras iban a la escuela?", audioText: "¿hablaban ustedes mientras iban a la escuela?", gloss: "Were you all talking while you were going to school?" }
            goal: "Say yes, you were always talking a lot."
            reply:
              mode: build
              tiles: ["sí,", "siempre", "hablábamos", "mucho", "hablaban", "hablamos"]
              answer: "sí, siempre hablábamos mucho"
            replyGloss: "Yes, we were always talking a lot."
            explanation: "You and the group, the ongoing scene: «hablábamos» — the accented nosotros imperfect. «hablaban» would leave you out; «hablamos» would collapse into the ambiguous preterite/present surface."
          - id: t5
            npc: { speaker: "Ana", es: "Cuéntamelo todo, de principio a fin.", audioText: "cuéntamelo todo, de principio a fin.", gloss: "Tell me the whole thing, start to finish." }
            goal: "Narrate the whole memory, start to finish."
            reply:
              mode: build
              tiles: ["de", "niños,", "íbamos", "a", "la", "escuela", "juntos", "cuando,", "de", "repente,", "vino", "Sofía,", "y", "entonces", "todos", "fueron", "al", "parque", "iban", "vino"]
              answer: "de niños, íbamos a la escuela juntos cuando, de repente, vino Sofía, y entonces todos fueron al parque"
            replyGloss: "As children, we used to go to school together when, suddenly, Sofía came, and then everyone went to the park."
            explanation: "The whole module in one line: «íbamos» paints the ongoing scene; «vino» is the one surprise event inside it; «fueron», with «todos», is what happened next. Every connective, both tenses, doing their own job."

