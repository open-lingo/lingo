module: m23
title: "Cuando, mientras, de repente"
frame: none
throughModule: m22
expectedLessonCount: 10
checkpoint: 8

# ES m23 — preterite vs imperfect, in the SAME sentence. Fifth A2 module;
# the contrast m21's header and m22's header both pointed at and both
# deliberately declined to teach.
#
# ONE idea, the whole module: two pasts can share a sentence because they do
# different JOBS. The imperfect (m22: hablaba/tenía/era/iba/veía) paints the
# ongoing scene — what was already true or already happening. The preterite
# (m19–m21: hablé…hablaron, fui…fueron, hice…hicieron, etc.) reports the
# thing that happened INSIDE that scene — one bounded event. «cuando»,
# «mientras», «de repente», «entonces» are the four words that let a learner
# SAY which job each clause is doing, instead of guessing from word order.
#
# ── WHY THIS MODULE, NOW (decision, 2026-09-10) ───────────────────────────
# `docs/es-ir-sources/es-m22-brief.md` named this module directly and drew
# the line: "the preterite-vs-imperfect contrast is m23's job, not this
# module's [m22's]." That line is now cashed. Evidence:
#   1. CLAUDE.md: "every new word or structure is introduced before it's
#      tested." m22 built a clean, confident imperfect (all five families,
#      all persons, the yo=él collision explicitly taught). m19–m21 built a
#      clean, confident preterite (all persons, nine regular verbs, six
#      irregulars). Both halves of the contrast are now PRIOR — nothing
#      this module teaches is untested raw material, which is the exact
#      precondition m22's header set for opening this module.
#   2. This module's new content is ENTIRELY the four connectives — it adds
#      no new verb morphology. That keeps it a single new idea (which
#      clause is which job), not a second one stacked on top of a first
#      (the "hollow card" failure mode m22's header also named).
#
# ── NO NEW VERB PARADIGMS — REUSE ONLY (hard rule) ─────────────────────────
# Every verb form in this module must already be a PRIOR atom from m18
# (present), m19–m21 (preterite), or m22 (imperfect). Do not conjugate a
# verb into a tense/person it has never been registered in. In particular:
#   - The imperfect side of every contrast sentence is restricted to the
#     FIVE verbs m22 gave an imperfect to: hablar, tener, ser, ir, ver.
#     There is no «estaba», «hacía», «vivía», «trabajaba», «quería», «podía»,
#     «comía», «salía», «cocinaba», «escribía», «compraba», «estudiaba»,
#     «venía» — none of these are registered atoms, in this module or any
#     earlier one. (m22-header.yaml's own "what this module does NOT teach"
#     section bans manufacturing them — that ban is still live here.)
#   - The preterite side may use ANY PRIOR preterite form (all of m19's 26,
#     m20's 21, m21's 21) at any person — this side is NOT restricted to
#     five verbs, and drafting agents should use that breadth for variety
#     across ten lessons rather than leaning on the same two or three verbs.
#   - No progressive (pin E7 / m22's restated ban) — still true here; a
#     background clause is simple imperfect, never «estaba + -ndo».
#
# ── THE REAL COLLISION THIS MODULE TEACHES: fue vs era, fue vs iba ────────
# «fue» (PRIOR, m20) glosses as both "was" (ser) and "went" (ir) — the
# learner already owns that dual reading. This module adds the THIRD and
# FOURTH readings of the same territory: «era» also glosses "was" (ser,
# imperfect) and «iba» also glosses "went" (ir, imperfect, "used to go" /
# "was going"). Four surfaces, two English glosses, one real distinction:
# fue = a bounded, one-time state or trip; era/iba = the ongoing backdrop.
# This is NOT a rule to state once in an info card and move on — it is
# dense enough to earn its own dedicated lesson (L6, "Fue o era") built as
# minimal pairs, the same way m22 gave the yo=él collision its own weight
# in L1 rather than a footnote. A build/cloze/MCQ that asks the learner to
# choose fue-vs-era or fue-vs-iba from context is this module's signature
# exercise — use it generously from L6 on.
#
# ── THE FOUR NEW ATOMS AND THE JOB EACH ONE MARKS ─────────────────────────
#   cuando   — "when": introduces the clause holding the PRETERITE event;
#              the OTHER clause (imperfect) is the scene it lands in.
#              Lowercase, unaccented — NOT the same word as PRIOR «¿cuándo?»
#              (m8, accented, question-only). Never drop the accent on the
#              question form; never add one to this conjunction.
#   mientras — "while": frames SIMULTANEITY. Most often imperfect-imperfect
#              ("mientras hablábamos, ella escribía" — not usable here,
#              escribía isn't PRIOR imperfect; use two of the five licensed
#              verbs) or imperfect + a preterite event landing inside it
#              ("mientras hablábamos, vino Diego").
#   de repente — "suddenly": marks the preterite clause as an INTERRUPTION,
#              not just an event — sharpens the contrast for a learner who
#              might otherwise read two clauses as merely sequential.
#   entonces — "then, so": chains what happens NEXT — most natural
#              preterite-to-preterite ("de repente vino Diego, entonces
#              fuimos al parque"), the module's one deliberate example that
#              the contrast isn't always imperfect-vs-preterite; sometimes
#              it's preterite-vs-preterite in sequence, and «entonces» is
#              how a learner marks that instead.
# All four are invariable (no conjugation, no gender/number agreement) —
# no new inflection to teach alongside them, which is exactly why they are
# the right size of new content for a module whose real job is combining
# things the learner already owns.
#
# ── PRIOR ADVERBS NOT REGISTERED HERE, ALREADY OWNED: «ya», «todavía» ─────
# grep-verified (`grep -o 'surface: "[^"]*"' src/features/languages/es/
# curriculum/m{1..22}.ts | sort -u`): «ya» (already, m16) and «todavía»
# (still/yet, m16) are both PRIOR — do NOT re-register them. Both are legal
# in this module (frequency/state adverbs, not deictic time points), but
# they are not this module's content and don't need debut treatment.
#
# ── «de niño/a/s» (PRIOR, m22) — frames the IMPERFECT clause only ─────────
# Same marker/tense-agreement discipline as m21/m22: «de niño» sits in the
# imperfect clause of a mixed sentence, never labels the preterite clause
# directly. In a mixed sentence it is legal ("de niño, iba a la escuela
# cuando..."), just always attached to the imperfect side.
#
# ── «todos» (PRIOR, m21) — unchanged rule, now cuts both ways ─────────────
# Still 3rd-person-plural agreement only. With the imperfect side that means
# eran/iban/hablaban/tenían/veían (never éramos/íbamos/…); with the
# preterite side it means the m21 ustedes/ellos forms (fueron, hicieron,
# tuvieron, vinieron, vieron, hablaron, comieron, vivieron, estudiaron,
# compraron, trabajaron, escribieron), never a nosotros form on either side.
#
# ── WATCH: hablamos (PRIOR, m21, ambiguous) is now a THIRD sibling of
# hablábamos (PRIOR, m22, unambiguous imperfect) ───────────────────────────
# The hablar family now has three past-adjacent surfaces in scope: hablé
# (unambiguous preterite), hablamos (present OR preterite — m21's dual
# reading, resolved only by a marker), and hablábamos (unambiguous
# imperfect). A contrast sentence that wants «hablamos» to read as
# preterite still needs a disambiguating marker in the same clause per
# m21's rule — that rule doesn't relax just because the clause sits next to
# an obviously-imperfect one. If the ambiguity would confuse the contrast
# itself, prefer «hablé/habló/hablaron» (unambiguous) or «hablábamos»
# (unambiguous) over «hablamos» in these lessons.
#
# ── NO NEW EMOJI, NO NEW NOUN THIS MODULE ──────────────────────────────────
# Same precedent as m19/m21/m22 (pure-grammar modules ship zero). All four
# new atoms are invariable connectives; narrative color comes from PRIOR
# nouns-with-emoji (la escuela 🏫, el parque 🌳, la playa 🏖️, el cine 🎬,
# la fiesta 🎉, el mercado 🛒, la tienda 🏪, casa 🏠, el trabajo 💼, el
# museo 🏛️) and the fixed cast, not from new vocabulary.
# ─────────────────────────────────────────────────────────────────────────
newAtoms:
  - { surface: "cuando", meaningEn: "when", partOfSpeech: "conjunction", kind: "vocab", hint: "KWAHN-doh — no accent. Not the same word as the question «¿cuándo?» (with an accent) — this one only ever introduces a clause, never asks a question." }
  - { surface: "mientras", meaningEn: "while", partOfSpeech: "conjunction", kind: "vocab", hint: "mee-EN-trahs — marks two things happening at the same time" }
  - { surface: "de repente", meaningEn: "suddenly", partOfSpeech: "adverb", kind: "vocab", hint: "deh reh-PEN-teh — flags the clause where something just happened, breaking into an ongoing scene" }
  - { surface: "entonces", meaningEn: "then, so", partOfSpeech: "adverb", kind: "vocab", hint: "en-TOHN-sehs — chains what happened next" }

lessons:
  # ── L1 · «Cuando era niño» — «cuando» debuts, the module's title word and
  #    its first new atom. NO accent (never confuse with PRIOR m8 «¿cuándo?»,
  #    the question form). Also carries the module's ONE general rule card:
  #    two pasts share a sentence because they do different jobs — imperfect
  #    paints the ongoing scene, preterite reports the one bounded thing that
  #    happened inside it. «cuando» can introduce either clause (both
  #    patterns are taught here: cuando+imperfect scene as a life-stage
  #    frame — the win line itself — and cuando+preterite event landing in
  #    an imperfect scene, the pattern later lessons lean on more). ZERO new
  #    verb morphology: era/fui/iba/vino/vi/hablaba/hablábamos/fueron/hablaban
  #    are all PRIOR (m19–m22). No recall (nothing earlier to recall).
  - n: 1
    template: free
    title: "Cuando era niño"
    description: "Two pasts can share a sentence — «cuando» (when) is the first word that connects them. One clause paints the ongoing scene; the other reports the one thing that happened."
    steps:
      - kind: map
        id: l1-map-cuandoerafuimexico
        tokens: ["cuando", "era", "niño,", "fui", "a", "méxico"]
        pairs:
          - { en: "when", tokenIndex: 0 }
          - { en: "I was", tokenIndex: 1 }
          - { en: "a child,", tokenIndex: 2 }
          - { en: "I went", tokenIndex: 3 }
          - { en: "to", tokenIndex: 4 }
          - { en: "Mexico", tokenIndex: 5 }
        audioText: "cuando era niño, fui a méxico"
        revealNote: "«cuando» — when — is new: it connects two pasts that do different jobs. «era» paints the ongoing scene (I was a child); «fui» reports the one thing that happened (I went)."
      - kind: info
        id: l1-info-cuandodospasados
        title: "Cuando — two pasts, two jobs"
        body: "Two pasts, two jobs: the ongoing one is imperfect — the scene; the one thing that happened in it is preterite — the event. «cuando» (when, no accent) is the word that connects them — never confuse it with the question «¿cuándo?». «Cuando era niño, fui a México» — era sets the scene, fui is what happened."
      - kind: speakLit
        id: l1-sp-cuandoerafuimexico
        es: "cuando era niño, fui a méxico"
        en: "When I was a child, I went to Mexico"
        atoms: ["cuando", "era", "fui"]
      - kind: buildLit
        id: l1-b-cuandovinodiegohablabamos
        es: "cuando vino Diego, hablábamos en el parque"
        en: "When Diego came, we were talking in the park"
        atoms: ["cuando", "vino", "hablábamos", "parque"]
        tiles: ["viene", "vinieron"]
      - kind: speakLit
        id: l1-sp-cuandoibaescuelavisam
        es: "cuando iba a la escuela, vi a Sam"
        en: "When I was going to school, I saw Sam"
        atoms: ["cuando", "iba", "vi", "escuela"]
      - kind: clozeLit
        id: l1-c-cuandovinodiegohablaba
        es: "cuando vino Diego, yo hablaba con Ana"
        en: "When Diego came, I was talking with Ana"
        blank: "cuando"
        options: ["cuando", "¿cuándo?"]
        atoms: ["cuando", "vino", "hablaba"]
        why: "«cuando» (no accent) just connects — it isn't asking anything. «¿cuándo?» only ever asks a question."
      - kind: listenCompLit
        id: l1-lc-cuandoerabuenoescuela
        es: "cuando yo era niño, era muy bueno en la escuela"
        en: "When I was a child, I was very good at school."
        atoms: ["cuando", "era", "bueno", "escuela"]
        distractorsEn:
          - "When I am a child, I am very good at school."
          - "When he was a child, he was very good at school."
          - "When I was a child, I was very good at home."
      - kind: mcq
        id: l1-q-cuandovscuestion
        prompt: "Which one means 'when' as a connector — never a question?"
        correct: "cuando"
        distractors: ["¿cuándo?", "mientras", "entonces"]
        atoms: ["cuando"]
        why: "«cuando» (no accent) connects two clauses. «¿cuándo?» (accented) only ever asks. «mientras»/«entonces» are this module's other connectives — different jobs."
      - kind: listenBuildLit
        id: l1-lb-cuandotodosfueronhablaban
        es: "cuando todos fueron al mercado, hablaban de la fiesta"
        en: "When everyone went to the market, they were talking about the party"
        atoms: ["cuando", "fueron", "hablaban", "todos"]
        tiles: ["van", "habla"]
      - kind: agreementLit
        id: l1-agr-cuandoibaiban
        en: "When I used to go to the park, they used to go too"
        audioText: "cuando yo iba al parque, ellos iban también"
        atoms: ["cuando", "iba", "iban"]
        segments:
          - { text: "cuando yo " }
          - { blank: { id: "p1", answer: "iba", options: ["iba", "iban"] } }
          - { text: " al parque, ellos " }
          - { blank: { id: "p2", answer: "iban", options: ["iban", "iba"] } }
          - { text: " también" }
      - kind: audioWimcq
        id: l1-ear-mercado
        target: { surface: "el mercado", emoji: "🛒" }
        distractors:
          - { surface: "la playa", emoji: "🏖️" }
          - { surface: "la escuela", emoji: "🏫" }
      - kind: textMcq
        id: l1-tm-cuando
        target: "cuando"
        distractors: ["¿cuándo?", "mientras", "entonces"]
      - kind: sim
        id: l1-sim-ana-cuando
        scene: { emoji: "🕰️", title: "Ana asks about back then", setting: "Ana wants to hear what happened when you were growing up." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Adónde ibas cuando eras niño?", audioText: "¿adónde ibas cuando eras niño?", gloss: "Where were you going when you were a child?" }
            goal: "Say you went to Mexico as a child."
            reply:
              mode: build
              tiles: ["cuando", "era", "niño,", "fui", "a", "méxico", "soy", "iba"]
              answer: "cuando era niño, fui a méxico"
            replyGloss: "When I was a child, I went to Mexico."
            explanation: "«era» sets the scene — a child, ongoing; «fui» is the one trip that happened. «soy» would slip into now; «iba» would make the trip repeated, not a one-time event."
          - id: t2
            npc: { speaker: "Ana", es: "¿Y Diego? ¿Vino cuando hablabas con él?", audioText: "¿y diego? ¿vino cuando hablabas con él?", gloss: "And Diego? Did he come while you were talking with him?" }
            goal: "Say yes, he came when you were talking."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, vino cuando yo hablaba" }
                - { id: "wrong1", text: "sí, viene cuando yo hablaba" }
                - { id: "wrong2", text: "sí, vino cuando yo hablo" }
              correctOptionId: "right"
              audioText: "sí, vino cuando yo hablaba"
            replyGloss: "Yes, he came when I was talking."
            explanation: "«vino» is the one thing that happened, inside the ongoing scene «hablaba». «viene» and «hablo» both slip into now."
          - id: t3
            npc: { speaker: "Ana", es: "¿Fueron todos a la playa alguna vez?", audioText: "¿fueron todos a la playa alguna vez?", gloss: "Did everyone go to the beach once?" }
            goal: "Say yes, you were going to the park."
            reply:
              mode: build
              tiles: ["sí,", "cuando", "fueron,", "yo", "iba", "al", "parque", "fue", "iban"]
              answer: "sí, cuando fueron, yo iba al parque"
            replyGloss: "Yes, when they went, I was going to the park."
            explanation: "«todos» takes the they-ending: «fueron», the one bounded trip. Your own «iba» is the ongoing habit it lands inside."
      - kind: matchLit
        id: l1-match
        pairs:
          - { source: "cuando", target: "when" }
          - { source: "era", target: "I/he/she/you was, the scene" }
          - { source: "fui", target: "I went/was, the event" }
          - { source: "iba", target: "I/he/she/you used to go" }
          - { source: "vino", target: "he/she/you came" }
          - { source: "el mercado", target: "the market" }
      - kind: speakLit
        id: l1-sp-win
        es: "cuando era niño, fui a méxico"
        en: "When I was a child, I went to Mexico"
        atoms: ["cuando", "era", "fui"]

  # ── L2 · «Mientras hablábamos» — «mientras» debuts: while, frames
  #    SIMULTANEITY. Two shapes taught: imperfect-imperfect (two ongoing
  #    scenes at once, «mientras yo hablaba, tú veías la película») and
  #    imperfect + a preterite event landing inside it (the win line,
  #    «mientras hablábamos, vino Diego» — same shape as L1's core pattern).
  #    ZERO new verb morphology. No recall required this lesson (table).
  - n: 2
    template: free
    title: "Mientras hablábamos"
    description: "«mientras» — while — is the second connective: it frames two things happening at once, whether that's two ongoing scenes together, or one event breaking into an ongoing scene."
    steps:
      - kind: map
        id: l2-map-mientrashablabamosvinodiego
        tokens: ["mientras", "hablábamos,", "vino", "Diego"]
        pairs:
          - { en: "while", tokenIndex: 0 }
          - { en: "we were talking,", tokenIndex: 1 }
          - { en: "came", tokenIndex: 2 }
          - { en: "Diego", tokenIndex: 3 }
        audioText: "mientras hablábamos, vino Diego"
        revealNote: "«mientras» — while — is new: it frames two things at once. «hablábamos» is the ongoing scene; «vino» is the one thing that broke into it."
      - kind: info
        id: l2-info-mientrasalavez
        title: "Mientras — while, at the same time"
        body: "«mientras» means while — it frames two things happening at once. Most often it joins two ongoing scenes, both imperfect: «mientras yo hablaba, tú veías la película». Or it frames one event landing inside an ongoing scene: «mientras hablábamos, vino Diego» — hablábamos is the scene, vino is what happened."
      - kind: speakLit
        id: l2-sp-mientrashablabamosvinodiego
        es: "mientras hablábamos, vino Diego"
        en: "While we were talking, Diego came"
        atoms: ["mientras", "hablábamos", "vino"]
      - kind: buildLit
        id: l2-b-mientrashablabaveias
        es: "mientras yo hablaba, tú veías la película"
        en: "While I was talking, you were watching the movie"
        atoms: ["mientras", "hablaba", "veías", "película"]
        tiles: ["hablo", "ves"]
      - kind: speakLit
        id: l2-sp-mientrasibaescuelavisofia
        es: "mientras iba a la escuela, vi a Sofía"
        en: "While I was going to school, I saw Sofía"
        atoms: ["mientras", "iba", "vi", "escuela"]
      - kind: clozeLit
        id: l2-c-mientrastodoshablabanvinosam
        es: "mientras todos hablaban, Sam vino a la fiesta"
        en: "While everyone was talking, Sam came to the party"
        blank: "mientras"
        options: ["mientras", "cuando"]
        atoms: ["mientras", "hablaban", "vino", "todos"]
        why: "«mientras» frames the talking and Sam's arrival as happening at once. «cuando» is a plainer «when», losing the at-the-same-time flavor."
      - kind: listenCompLit
        id: l2-lc-mientrasveiamoshablosofia
        es: "mientras veíamos la película, Sofía habló con Ana"
        en: "While we were watching the movie, Sofía talked with Ana."
        atoms: ["mientras", "veíamos", "habló", "película"]
        distractorsEn:
          - "While we watch the movie, Sofía talks with Ana."
          - "While they were watching the movie, Sofía talked with Ana."
          - "While we were watching the movie, Sofía talked with Diego."
      - kind: mcq
        id: l2-q-mientrasvscuandoentonces
        prompt: "Which one means 'while' — two things at once?"
        correct: "mientras"
        distractors: ["cuando", "entonces", "¿cuándo?"]
        atoms: ["mientras"]
        why: "«mientras» frames simultaneity. «cuando» is a plainer «when»; «entonces» chains what happens next; «¿cuándo?» only ever asks."
      - kind: listenBuildLit
        id: l2-lb-mientrastodosveianvinocarmen
        es: "mientras todos veían la película, vino Carmen"
        en: "While everyone was watching the movie, Carmen came"
        atoms: ["mientras", "veían", "vino", "todos", "película"]
        tiles: ["ven", "vienen"]
      - kind: agreementLit
        id: l2-agr-mientrashablabaveia
        en: "While I was talking, he was watching too"
        audioText: "mientras yo hablaba, él veía también"
        atoms: ["mientras", "hablaba", "veía"]
        segments:
          - { text: "mientras yo " }
          - { blank: { id: "p1", answer: "hablaba", options: ["hablaba", "hablo"] } }
          - { text: ", él " }
          - { blank: { id: "p2", answer: "veía", options: ["veía", "ve"] } }
          - { text: " también" }
      - kind: audioWimcq
        id: l2-ear-fiesta
        target: { surface: "la fiesta", emoji: "🎉" }
        distractors:
          - { surface: "el cine", emoji: "🎬" }
          - { surface: "el parque", emoji: "🌳" }
      - kind: textMcq
        id: l2-tm-mientras
        target: "mientras"
        distractors: ["cuando", "entonces", "¿cuándo?"]
      - kind: sim
        id: l2-sim-ana-mientras
        scene: { emoji: "🗣️", title: "Ana asks what happened", setting: "Ana wants to know what was going on while everyone was talking." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Qué pasó mientras hablaban ustedes?", audioText: "¿qué pasó mientras hablaban ustedes?", gloss: "What happened while you all were talking?" }
            goal: "Say Diego came while you talked."
            reply:
              mode: build
              tiles: ["mientras", "hablábamos,", "vino", "Diego", "viene", "hablamos"]
              answer: "mientras hablábamos, vino Diego"
            replyGloss: "While we were talking, Diego came."
            explanation: "«hablábamos» is the ongoing scene; «vino» is the one thing that broke into it. «viene» would slip into now."
          - id: t2
            npc: { speaker: "Ana", es: "¿Veían la película mientras yo hablaba?", audioText: "¿veían la película mientras yo hablaba?", gloss: "Were you watching the movie while I was talking?" }
            goal: "Say yes, you were watching it."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, veíamos mientras hablabas" }
                - { id: "wrong1", text: "sí, veíamos mientras hablas" }
                - { id: "wrong2", text: "sí, vimos mientras hablabas" }
              correctOptionId: "right"
              audioText: "sí, veíamos mientras hablabas"
            replyGloss: "Yes, we were watching while you were talking."
            explanation: "Both ongoing at once: «veíamos»/«hablabas», both imperfect. «hablas» slips into now; «vimos» would make the watching one bounded event, not the scene."
          - id: t3
            npc: { speaker: "Ana", es: "¿Y Sofía? ¿Vino ella también mientras hablaban?", audioText: "¿y sofía? ¿vino ella también mientras hablaban?", gloss: "And Sofía? Did she also come while you all were talking?" }
            goal: "Say yes, she came while you talked."
            reply:
              mode: build
              tiles: ["sí,", "vino", "mientras", "hablábamos", "viene", "habló"]
              answer: "sí, vino mientras hablábamos"
