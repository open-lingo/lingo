module: m19
title: "Ayer hablé — the past, regular"
frame: none
throughModule: m18
expectedLessonCount: 10
checkpoint: 8

# ES m19 — the regular preterite. THE FIRST A2 MODULE.
#
#     -ar: hablé      hablaste     habló        -er/-ir: comí     comiste    comió
#          compré     compraste    compró                viví     —          vivió
#          trabajé    —            trabajó               salí     saliste    salió
#          estudié    —            estudió               escribí  —          escribió
#
# ONE machine, the whole module: a finished action gets a new set of
# endings on the same stem the learner has used since m10. -ar takes
# -é / -aste / -ó; -er and -ir share one table, -í / -iste / -ió. The
# STRESS moves to the ending, and the written accent on «hablé» / «habló»
# / «comí» / «comió» is not decoration: it is the only thing that keeps
# «hablo» (I speak, now) apart from «habló» (he spoke). L5 is that
# minimal pair and nothing else.
#
# ── PERSONS ──────────────────────────────────────────────────────────────
# yo / tú / él-ella only, as the whole course has done for every new form.
# The plural preterite (-amos / -aron / -imos / -ieron) is NOT taught here
# and is banned in every answer position — «hablamos» is deliberately
# ambiguous between present and preterite and m18 just spent it as a
# present. m20 may open the plural past.
#
# ── ONLY REGULAR VERBS ───────────────────────────────────────────────────
# ser / ir / tener / estar / hacer / ver / venir have irregular preterites;
# they are m20's and are banned here in every slot, even unbilled ones:
# no «fui», «hice», «tuve», «estuve», «vi», «vine», not even in an NPC line.
# NPCs ask with «¿y tú?», «¿y ayer?», «¿compraste …?» — regular verbs only.
#
# ── PIN E12: EVERY CELL COMES FROM conjugationTables.ts ───────────────────
# hablar / comer / vivir were seeded with their preterite; trabajar /
# estudiar / comprar / escribir / salir were ADDED to ES_VERB_ENTRIES on
# 2026-09-09 for this module. m19.test.ts derives the legal preterite
# surfaces from that file and fails on any form the table does not carry.
# The bar guard deliberately does NOT expand preterite cells into PRIOR, so
# each registered form is a real debut (intro-capable step).
#
# ── TIME MARKERS ─────────────────────────────────────────────────────────
# «ayer» (L1), «anoche» (L3), «la semana pasada» (L4), «el fin de semana»
# (L6). Each is a phrase / adverb atom; «pasada» and «fin» are owned by
# their phrases at word level. «hoy» / «mañana» / «todos los días» stay
# PRESENT markers and are never put in a preterite sentence, so the
# contrast on L5 is honest: marker + accent decide the tense together.
#
# ── GLOSSES (pin E7) ─────────────────────────────────────────────────────
# Preterite glosses as English simple past — "I spoke", "she bought" —
# never "have spoken", never "was speaking" (that is the imperfect, not
# taught). Present stays simple present.
#
# ── hacer / tener RULING (B112) ──────────────────────────────────────────
# hago / haces / hace and tengo / tienes / tiene / tenemos / tienen are the
# only forms of those verbs that may appear, and only in the PRESENT.
#
# ── TRANSFER CELL (L8 only): «cociné» ────────────────────────────────────
# «cocinar» (m13) handed over cold as "I cooked — cocinar"; a buildLit whose
# bank holds «cocinar» and «comí» as foils (both registered — «cocino» is
# not an atom and may not be a tile). Appears in exactly one step.
#
# ── EMOJI ────────────────────────────────────────────────────────────────
# None new. Every audioWimcq targets a prior noun.
# ─────────────────────────────────────────────────────────────────────────
newAtoms:
  # time markers
  - { surface: "ayer", meaningEn: "yesterday", partOfSpeech: "adverb", kind: "vocab", hint: "a-YER" }
  - { surface: "anoche", meaningEn: "last night", partOfSpeech: "adverb", kind: "vocab", hint: "a-NO-cheh — «noche» with an a in front" }
  - { surface: "la semana pasada", meaningEn: "last week", partOfSpeech: "phrase", kind: "phrase", hint: "pa-SA-da — the week that passed" }
  - { surface: "el fin de semana", meaningEn: "the weekend", partOfSpeech: "phrase", kind: "phrase", hint: "feen — the end of the week" }
  # -ar preterite: hablar (all three), comprar (all three), trabajar, estudiar (yo / él)
  - { surface: "hablé", meaningEn: "I spoke", partOfSpeech: "verb", kind: "vocab", hint: "the accent puts the stress on the end: ha-BLEH" }
  - { surface: "hablaste", meaningEn: "you spoke", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "habló", meaningEn: "he/she spoke", partOfSpeech: "verb", kind: "vocab", hint: "ha-BLO — not «hablo» (I speak)" }
  - { surface: "compré", meaningEn: "I bought", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "compraste", meaningEn: "you bought", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "compró", meaningEn: "he/she bought", partOfSpeech: "verb", kind: "vocab", hint: "com-PRO — not «compro» (I buy)" }
  - { surface: "trabajé", meaningEn: "I worked", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "trabajaste", meaningEn: "you worked", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "trabajó", meaningEn: "he/she worked", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "estudié", meaningEn: "I studied", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "estudió", meaningEn: "he/she studied", partOfSpeech: "verb", kind: "vocab" }
  # -er / -ir preterite (one shared table): comer (all three), vivir, salir, escribir
  - { surface: "comí", meaningEn: "I ate", partOfSpeech: "verb", kind: "vocab", hint: "co-MEE" }
  - { surface: "comiste", meaningEn: "you ate", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "comió", meaningEn: "he/she ate", partOfSpeech: "verb", kind: "vocab", hint: "co-MYO" }
  - { surface: "viví", meaningEn: "I lived", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "vivió", meaningEn: "he/she lived", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "salí", meaningEn: "I went out", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "saliste", meaningEn: "you went out", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "salió", meaningEn: "he/she went out", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "escribí", meaningEn: "I wrote", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "escribió", meaningEn: "he/she wrote", partOfSpeech: "verb", kind: "vocab" }
  # ── TRANSFER CELL (L8 only) — glossed in the prompt, met cold.
  - { surface: "cociné", meaningEn: "I cooked", partOfSpeech: "verb", kind: "vocab" }

lessons:
  # ── L1 · «Ayer hablé» — ayer, hablé, hablaste, habló. The -ar preterite
  #    in the three singular persons, and the first past-tense sentence of
  #    the course. Every form debuts on a printed, intro-capable step after
  #    the card. The stress moves to the end: the card says so, the
  #    speakLits make the learner hear it.
  #    ⚠️ NO other verb's preterite here (L2+). NO «hoy» in a past sentence.
  #    ⚠️ inv 24: «ayer hablé con Ana» appears ≤3 times (map, speak, sim).
  - n: 1
    template: free
    title: "Ayer hablé"
    description: "Eighteen modules in the present. This is the first sentence about yesterday — and the stress moves to the end of the verb to say so."
    steps:
      - kind: map
        id: l1-map-ayerhable
        tokens: ["ayer", "hablé", "con", "Ana"]
        pairs:
          - { en: "yesterday", tokenIndex: 0 }
          - { en: "I spoke", tokenIndex: 1 }
          - { en: "with", tokenIndex: 2 }
          - { en: "Ana", tokenIndex: 3 }
        audioText: "ayer hablé con Ana"
        revealNote: "«hablo» is I speak. «hablé» — one letter changed, an accent added — is I spoke. Listen to where the voice lands: on the end. That accent is the past tense. «ayer» is yesterday, and it tells you which ending to expect before the verb even arrives."
      - kind: info
        id: l1-info-preterito
        title: "The past, for -ar verbs"
        body: "A thing that happened and is over gets its own endings. For -ar verbs: «hablé», I spoke; «hablaste», you spoke; «habló», he spoke, she spoke. Look at the accents on «hablé» and «habló»: they move the stress to the last syllable, and that is what tells the ear this is the past. «hablo» — stress on the a — is I speak, now. «habló» — stress on the o — is he spoke, then. Same stem you have used since module ten; only the ending changes. And a word that goes with it: «ayer», yesterday. «ayer hablé con Ana» — yesterday I spoke with Ana."
      - kind: speakLit
        id: l1-sp-hable
        es: "ayer hablé con Ana"
        en: "Yesterday I spoke with Ana"
        atoms: ["ayer", "hablé"]
      - kind: buildLit
        id: l1-b-anahabloconmimadre
        also: ["ayer Ana habló con mi madre"]
        es: "Ana habló con mi madre ayer"
        en: "Ana spoke with my mother yesterday"
        atoms: ["habló", "madre", "ayer"]
        tiles: ["hablé", "habla"]
      - kind: speakLit
        id: l1-sp-hablaste
        es: "hablaste con Diego ayer"
        en: "You spoke with Diego yesterday"
        atoms: ["hablaste", "ayer"]
      - kind: clozeLit
        id: l1-c-diegohablo
        es: "Diego habló con mi hermano"
        en: "Diego spoke with my brother"
        blank: "habló"
        options: ["habló", "hablé", "hablaste"]
        atoms: ["habló", "hermano"]
        why: "Diego did the speaking, so the he-or-she ending of the past: «habló», stress on the o. «hablé» is I, «hablaste» is you."
      - kind: listenCompLit
        id: l1-lc-ayerhableconmiabuela
        es: "ayer hablé con mi abuela"
        en: "Yesterday I spoke with my grandmother."
        atoms: ["ayer", "hablé", "abuela"]
        distractorsEn:
          - "Yesterday she spoke with my grandmother."
          - "Today I speak with my grandmother."
          - "Yesterday I spoke with my mother."
      - kind: buildLit
        id: l1-b-hablasteconelmaestro
        also: ["ayer hablaste con el maestro"]
        es: "hablaste con el maestro ayer"
        en: "You spoke with the teacher yesterday"
        atoms: ["hablaste", "maestro", "ayer"]
        tiles: ["hablé", "hablas"]
      # THE ACCENT BEAT: «hablo» (now) is the ghost; it lives in a
      # distractor slot. Correct option is two tokens.
      - kind: mcq
        id: l1-q-hablo
        prompt: "Which one means 'she spoke'?"
        correct: "ella habló"
        distractors: ["ella hablo", "ella hablé", "ella habla"]
        atoms: ["habló"]
        why: "«habló», with the accent — the stress on the end says past. «hablo» without it is I speak; «habla» is she speaks, now."
      - kind: audioWimcq
        id: l1-ear-abuela
        target: { surface: "la abuela", emoji: "👵" }
        distractors:
          - { surface: "la madre", emoji: "👩‍👧" }
          - { surface: "la hermana", emoji: "👧" }
      # Printed non-recall at m18 (es-m18-1-l1-sp-win).
      - kind: speakLit
        id: l1-sp-recall-vivimosaqui
        es: "nosotros vivimos aquí y hablamos español"
        en: "We live here and we speak Spanish"
        atoms: []
        cue: recall
      - kind: agreementLit
        id: l1-agr-hableyhablo
        en: "I spoke with Ana and Ana spoke with Diego"
        audioText: "hablé con Ana y Ana habló con Diego"
        atoms: ["hablé", "habló"]
        segments:
          - { blank: { id: "p1", answer: "hablé", options: ["hablé", "habló"] } }
          - { text: " con Ana y Ana " }
          - { blank: { id: "p2", answer: "habló", options: ["habló", "hablé"] } }
          - { text: " con Diego" }
      - kind: listenBuildLit
        id: l1-lb-ayerhableespanol
        es: "ayer hablé español en la escuela"
        en: "Yesterday I spoke Spanish at school"
        atoms: ["ayer", "hablé", "español", "escuela"]
        tiles: ["hablo", "habló"]
      - kind: textMcq
        id: l1-tm-hable
        target: "hablé"
        distractors: ["hablo", "habló", "hablaste"]
      - kind: speakLit
        id: l1-sp-anahablo
        es: "Ana habló con mi hermana ayer"
        en: "Ana spoke with my sister yesterday"
        atoms: ["habló", "hermana", "ayer"]
      - kind: sim
        id: l1-sim-diego-ayer
        scene: { emoji: "📱", title: "Diego wants to know about yesterday", setting: "Diego missed everything yesterday and is asking who talked to whom." }
        turns:
          - id: t1
            npc: { speaker: "Diego", es: "¿Hablaste con Ana ayer?", audioText: "¿hablaste con ana ayer?", gloss: "Did you speak with Ana yesterday?" }
            goal: "Say yes, you spoke with Ana."
            reply:
              mode: build
              tiles: ["sí", "hablé", "con", "Ana", "hablo", "habló"]
              answer: "sí hablé con Ana"
            replyGloss: "Yes, I spoke with Ana."
            explanation: "Diego asked with «hablaste»; you answer about yourself in the past: «hablé». «hablo» would be now; «habló» is somebody else."
          - id: t2
            npc: { speaker: "Diego", es: "¿Y Ana habló con Sofía?", audioText: "¿y ana habló con sofía?", gloss: "And did Ana speak with Sofía?" }
            goal: "Say yes, she spoke with Sofía."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, habló con Sofía" }
                - { id: "wrong1", text: "sí, hablé con Sofía" }
                - { id: "wrong2", text: "sí, habla con Sofía" }
              correctOptionId: "right"
              audioText: "sí, habló con Sofía"
            replyGloss: "Yes, she spoke with Sofía."
            explanation: "Ana, in the past: «habló». «hablé» is you; «habla» is now."
          - id: t3
            npc: { speaker: "Diego", es: "¿Hablaste con mi hermano también?", audioText: "¿hablaste con mi hermano también?", gloss: "Did you speak with my brother too?" }
            goal: "Say no, you didn't speak with him."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no, no hablé con tu hermano" }
                - { id: "wrong1", text: "no, no hablo con tu hermano" }
                - { id: "wrong2", text: "no, no habló con tu hermano" }
              correctOptionId: "right"
              audioText: "no, no hablé con tu hermano"
            replyGloss: "No, I didn't speak with your brother."
            explanation: "«no» in front, then the past-tense «hablé». «hablo» slips back into the present; «habló» hands it to somebody else."
      - kind: matchLit
        id: l1-match
        pairs:
          - { source: "ayer", target: "yesterday" }
          - { source: "hablé", target: "I spoke" }
          - { source: "hablaste", target: "you spoke" }
          - { source: "habló", target: "he or she spoke" }
          - { source: "hablo", target: "I speak (now)" }
          - { source: "con", target: "with" }
          - { source: "la abuela", target: "the grandmother" }
      - kind: speakLit
        id: l1-sp-win
        es: "ayer hablé con Ana y Ana habló con Diego"
        en: "Yesterday I spoke with Ana and Ana spoke with Diego"
        atoms: ["ayer", "hablé", "habló"]


  # ── L2 · «Compré, trabajé» — compré, compraste, compró, trabajé,
  #    trabajaste, trabajó. The same -ar machine on two more verbs, and
  #    the second minimal pair: «compro» (now) vs «compró» (then).
  #    ⚠️ NO -er / -ir preterite (L3+). NO «anoche» (L3).
  - n: 2
    template: free
    title: "Compré, trabajé"
    description: "Same endings, two more verbs — buying and working, yesterday. And the accent keeps doing its job: «compro» is now, «compró» is then."
    steps:
      - kind: map
        id: l2-map-comprelacamisa
        tokens: ["ayer", "compré", "la", "camisa"]
        pairs:
          - { en: "yesterday", tokenIndex: 0 }
          - { en: "I bought", tokenIndex: 1 }
          - { en: "the", tokenIndex: 2 }
          - { en: "shirt", tokenIndex: 3 }
        audioText: "ayer compré la camisa"
        revealNote: "«compro» is I buy, from module sixteen. «compré» — accent, stress on the end — is I bought. Every -ar verb takes the endings «hablar» showed you: -é, -aste, -ó."
        tokenGenders: { 2: "f", 3: "f" }
      - kind: speakLit
        id: l2-sp-compre
        es: "ayer compré la camisa"
        en: "Yesterday I bought the shirt"
        atoms: ["ayer", "compré", "camisa"]
      - kind: buildLit
        id: l2-b-diegocomprounregalo
        es: "Diego compró un regalo ayer"
        en: "Diego bought a gift yesterday"
        atoms: ["compró", "regalo", "ayer"]
        tiles: ["compro", "compré"]
      - kind: info
        id: l2-info-mismamaquina
        title: "One machine, every -ar verb"
        body: "What «hablar» did, every -ar verb does. «comprar»: «compré», I bought; «compraste», you bought; «compró», he or she bought. «trabajar»: «trabajé», I worked; «trabajaste», you worked; «trabajó», he or she worked. The accent is still the whole story: «compro» is I buy, now; «compró» is he bought, then. Say them out loud and put the weight where the accent is."
      - kind: speakLit
        id: l2-sp-trabajoycompro
        es: "Diego trabajó y compró un carro"
        en: "Diego worked and bought a car"
        atoms: ["trabajó", "compró", "carro"]
      - kind: clozeLit
        id: l2-c-anatrabajo
        es: "Ana trabajó el sábado"
        en: "Ana worked on Saturday"
        blank: "trabajó"
        options: ["trabajó", "trabajo"]
        atoms: ["trabajó", "sábado"]
        why: "Ana did the working, so «trabajó» — the he-or-she ending, stress on the o."
      - kind: speakLit
        id: l2-sp-trabaje
        es: "trabajé mucho ayer"
        en: "I worked a lot yesterday"
        atoms: ["trabajé", "mucho", "ayer"]
      - kind: listenCompLit
        id: l2-lc-compraste
        es: "¿compraste el regalo ayer?"
        en: "Did you buy the gift yesterday?"
        atoms: ["compraste", "regalo", "ayer"]
        distractorsEn:
          - "Did you buy the gift today?"
          - "Did she buy the gift yesterday?"
          - "Did you buy the shirt yesterday?"
      - kind: buildLit
        id: l2-b-trabajastemuchoayer
        also: ["ayer trabajaste mucho"]
        es: "trabajaste mucho ayer"
        en: "You worked a lot yesterday"
        atoms: ["trabajaste", "mucho", "ayer"]
        tiles: ["trabajé", "trabajas"]
      - kind: mcq
        id: l2-q-compro
        prompt: "Which one means 'he bought'?"
        correct: "él compró"
        distractors: ["él compro", "él compré", "él compra"]
        atoms: ["compró"]
        why: "«compró» — the accent moves the stress to the end: past. «compro» is I buy; «compra» is he buys, now."
      - kind: audioWimcq
        id: l2-ear-camisa
        target: { surface: "la camisa", emoji: "👕" }
        distractors:
          - { surface: "la falda", emoji: "👗" }
          - { surface: "el zapato", emoji: "👟" }
      # Printed non-recall at m16 (es-m16-3: tengo el mensaje, pero el regalo, lo necesito hoy).
      - kind: speakLit
        id: l2-sp-recall-tengoelmensaje
        es: "tengo el mensaje, pero el regalo, lo necesito hoy"
        en: "I have the message, but the gift — I need it today"
        atoms: []
        cue: recall
      - kind: agreementLit
        id: l2-agr-compreycompro
        en: "I bought the shirt and Ana bought the skirt"
        audioText: "compré la camisa y Ana compró la falda"
        atoms: ["compré", "camisa", "compró", "falda"]
        segments:
          - { blank: { id: "p1", answer: "compré", options: ["compré", "compró"] } }
          - { text: " la camisa y Ana " }
          - { blank: { id: "p2", answer: "compró", options: ["compró", "compré"] } }
          - { text: " la falda" }
      - kind: listenBuildLit
        id: l2-lb-trabajeenlatienda
        es: "ayer trabajé en la tienda"
        en: "Yesterday I worked at the shop"
        atoms: ["ayer", "trabajé", "tienda"]
        tiles: ["trabajo", "trabajó"]
      - kind: textMcq
        id: l2-tm-compro
        target: "compró"
        distractors: ["compro", "compré", "compraste"]
      - kind: sim
        id: l2-sim-ana-compras
        scene: { emoji: "🛒", title: "Ana checks the shopping", setting: "The party is tomorrow. Ana wants to know what got bought and who did the work." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Compraste la pizza?", audioText: "¿compraste la pizza?", gloss: "Did you buy the pizza?" }
            goal: "Say yes, you bought the pizza yesterday."
            reply:
              mode: build
              tiles: ["sí", "compré", "la", "pizza", "ayer", "compro", "compró"]
              answer: "sí compré la pizza ayer"
              alsoAccepted: ["sí ayer compré la pizza"]
            replyGloss: "Yes, I bought the pizza yesterday."
            explanation: "Ana asked with «compraste»; you answer «compré». «compro» is now; «compró» is somebody else."
          - id: t2
            npc: { speaker: "Ana", es: "¿Y Diego? ¿Trabajó ayer?", audioText: "¿y diego? ¿trabajó ayer?", gloss: "And Diego? Did he work yesterday?" }
            goal: "Say yes, he worked a lot."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, trabajó mucho" }
                - { id: "wrong1", text: "sí, trabajé mucho" }
                - { id: "wrong2", text: "sí, trabaja mucho" }
              correctOptionId: "right"
              audioText: "sí, trabajó mucho"
            replyGloss: "Yes, he worked a lot."
            explanation: "Diego, yesterday: «trabajó». «trabajé» is you; «trabaja» is now."
          - id: t3
            npc: { speaker: "Ana", es: "¿Compraste el regalo también?", audioText: "¿compraste el regalo también?", gloss: "Did you buy the gift too?" }
            goal: "Say no, Sofía bought the gift."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no, Sofía compró el regalo" }
                - { id: "wrong1", text: "no, Sofía compré el regalo" }
                - { id: "wrong2", text: "no, Sofía compro el regalo" }
              correctOptionId: "right"
              audioText: "no, sofía compró el regalo"
            replyGloss: "No, Sofía bought the gift."
            explanation: "Sofía, in the past: «compró». Without the accent it would be I buy, now."
      - kind: matchLit
        id: l2-match
        pairs:
          - { source: "compré", target: "I bought" }
          - { source: "compraste", target: "you bought" }
          - { source: "compró", target: "he or she bought" }
          - { source: "trabajé", target: "I worked" }
          - { source: "trabajó", target: "he or she worked" }
          - { source: "compro", target: "I buy (now)" }
          - { source: "la tienda", target: "the shop" }
      - kind: speakLit
        id: l2-sp-win
        es: "ayer trabajé y compré un regalo"
        en: "Yesterday I worked and bought a gift"
        atoms: ["ayer", "trabajé", "compré", "regalo"]


  # ── L3 · «Anoche comí» — anoche, comí, comiste, comió. The -er preterite:
  #    -í / -iste / -ió. «anoche» debuts with it. Every form debuts on a
  #    printed intro-capable step after the card.
  #    ⚠️ NO -ir verb yet (L4). «pollo» / «sopa» / «queso» are m7 carriers.
  - n: 3
    template: free
    title: "Anoche comí"
    description: "The other table. -er verbs take -í, -iste, -ió — and «anoche», last night, tells you it is coming."
    steps:
      - kind: map
        id: l3-map-anochecomi
        tokens: ["anoche", "comí", "pizza"]
        pairs:
          - { en: "last night", tokenIndex: 0 }
          - { en: "I ate", tokenIndex: 1 }
          - { en: "pizza", tokenIndex: 2 }
        audioText: "anoche comí pizza"
        revealNote: "«como» is I eat. «comí» — accent on the í, stress on the end — is I ate. A different vowel from «hablé», because «comer» is an -er verb, but the same idea: the weight goes to the last syllable and the thing is over. «anoche» is last night."
      - kind: info
        id: l3-info-er
        title: "The past, for -er verbs"
        body: "-ar verbs took -é, -aste, -ó. -er verbs take -í, -iste, -ió: «comí», I ate; «comiste», you ate; «comió», he ate, she ate. Same stress on the end, same accent doing the work: «comió» is then, «come» is now. And a second marker to go with «ayer»: «anoche», last night. «anoche comí pizza» — last night I ate pizza."
      - kind: speakLit
        id: l3-sp-comi
        es: "anoche comí pizza"
        en: "Last night I ate pizza"
        atoms: ["anoche", "comí", "pizza"]
      - kind: buildLit
        id: l3-b-anacomiopollo
        also: ["anoche Ana comió pollo"]
        es: "Ana comió pollo anoche"
        en: "Ana ate chicken last night"
        atoms: ["comió", "pollo", "anoche"]
        tiles: ["comí", "come"]
      - kind: speakLit
        id: l3-sp-comiste
        es: "comiste mucho anoche"
        en: "You ate a lot last night"
        atoms: ["comiste", "mucho", "anoche"]
      - kind: clozeLit
        id: l3-c-diegocomio
        es: "Diego comió en el restaurante"
        en: "Diego ate at the restaurant"
        blank: "comió"
        options: ["comió", "comí", "comiste"]
        atoms: ["comió", "restaurante"]
        why: "Diego did the eating: «comió», the he-or-she ending with the stress on the end. «comí» is I, «comiste» is you."
      - kind: listenCompLit
        id: l3-lc-anochecomiencasa
        es: "anoche comí en casa con mi familia"
        en: "Last night I ate at home with my family."
        atoms: ["anoche", "comí", "casa", "familia"]
        distractorsEn:
          - "Last night she ate at home with my family."
          - "Today I eat at home with my family."
          - "Last night I ate at the restaurant with my family."
      - kind: buildLit
        id: l3-b-comistepanyqueso
        es: "comiste pan y queso"
        en: "You ate bread and cheese"
        atoms: ["comiste", "pan", "queso"]
        tiles: ["comí", "comes"]
      - kind: mcq
        id: l3-q-comio
        prompt: "Which one means 'she ate'?"
        correct: "ella comió"
        distractors: ["ella come", "ella comí", "ella comiste"]
        atoms: ["comió"]
        why: "«comió» — past, he or she. «come» is now; «comí» is I; «comiste» is you."
      - kind: audioWimcq
        id: l3-ear-pollo
        target: { surface: "el pollo", emoji: "🍗" }
        distractors:
          - { surface: "la carne", emoji: "🥩" }
          - { surface: "la sopa", emoji: "🍲" }
      # Printed non-recall at m18 (es-m18-3-l3-sp-win).
      - kind: speakLit
        id: l3-sp-recall-somosamigos
        es: "somos amigos y vivimos juntos"
