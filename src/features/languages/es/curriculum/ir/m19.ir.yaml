  # ── L6 · «El fin de semana» — «el fin de semana», escribí, escribió.
  #    The fourth time marker, one more -ir verb, and a recap of every
  #    marker so far. «escribiste» is NOT registered and is never printed.
  - n: 6
    template: free
    title: "El fin de semana"
    description: "The weekend — Spanish says 'the end of the week', and drops it in front of a past verb the way it dropped «ayer»."
    steps:
      - kind: map
        id: l6-map-elfindesemanaescribi
        tokens: ["el", "fin", "de", "semana", "escribí", "un", "mensaje"]
        pairs:
          - { en: "the", tokenIndex: 0 }
          - { en: "end", tokenIndex: 1 }
          - { en: "of", tokenIndex: 2 }
          - { en: "week", tokenIndex: 3 }
          - { en: "I wrote", tokenIndex: 4 }
          - { en: "a", tokenIndex: 5 }
          - { en: "message", tokenIndex: 6 }
        audioText: "el fin de semana escribí un mensaje"
        revealNote: "«el fin de semana» — the end of the week: the weekend. In front of a past verb it means last weekend. «escribí» — I wrote — is «escribir» on the -er/-ir table you already own."
        tokenGenders: { 0: "m", 1: "m", 5: "m", 6: "m" }
      - kind: info
        id: l6-info-findesemana
        title: "Four ways to say when"
        body: "«ayer» — yesterday. «anoche» — last night. «la semana pasada» — last week. And «el fin de semana» — the weekend; with a past verb it reads as last weekend: «el fin de semana escribí un mensaje». One more -ir verb on the table you know: «escribí», I wrote; «escribió», he or she wrote. Any of the four markers can go first or last: «escribí un mensaje el fin de semana» says the same thing."
      - kind: speakLit
        id: l6-sp-escribi
        es: "el fin de semana escribí un mensaje"
        en: "On the weekend I wrote a message"
        atoms: ["el fin de semana", "escribí", "mensaje"]
      - kind: buildLit
        id: l6-b-anaescribiounmensaje
        also: ["ayer Ana escribió un mensaje"]
        es: "Ana escribió un mensaje ayer"
        en: "Ana wrote a message yesterday"
        atoms: ["escribió", "mensaje", "ayer"]
        tiles: ["escribí", "escribe"]
      - kind: clozeLit
        id: l6-c-mihermanoescribio
        es: "mi hermano escribió la tarea anoche"
        en: "My brother wrote the homework last night"
        blank: "escribió"
        options: ["escribió", "escribí", "escribe"]
        atoms: ["hermano", "escribió", "tarea", "anoche"]
        why: "Your brother, last night: «escribió». «escribí» is I; «escribe» is now."
      - kind: listenCompLit
        id: l6-lc-elfindesemanasali
        es: "el fin de semana salí con mis amigos"
        en: "On the weekend I went out with my friends."
        atoms: ["el fin de semana", "salí", "amigo"]
        distractorsEn:
          - "Last night I went out with my friends."
          - "On the weekend she went out with my friends."
          - "On the weekend I ate with my friends."
      - kind: buildLit
        id: l6-b-escribiunmensajeaana
        also: ["el fin de semana escribí un mensaje a Ana"]
        es: "escribí un mensaje a Ana el fin de semana"
        en: "I wrote a message to Ana on the weekend"
        atoms: ["escribí", "mensaje", "el fin de semana"]
        tiles: ["escribió", "escribo"]
      - kind: mcq
        id: l6-q-escribio
        prompt: "Which one means 'she wrote'?"
        correct: "ella escribió"
        distractors: ["ella escribe", "ella escribí", "ella escribo"]
        atoms: ["escribió"]
        why: "«escribió» — past, he or she. «escribe» is now; the other two are I."
      - kind: audioWimcq
        id: l6-ear-mensaje
        target: { surface: "el mensaje", emoji: "✉️" }
        distractors:
          - { surface: "la tarea", emoji: "📝" }
          - { surface: "el libro", emoji: "📖" }
      # Printed non-recall at m17 (es-m17-4-l4-sp-win).
      - kind: speakLit
        id: l6-sp-recall-melavolosdientes
        es: "me lavo los dientes y me ducho temprano"
        en: "I brush my teeth and I shower early"
        atoms: []
        cue: recall
      - kind: agreementLit
        id: l6-agr-escribiescribio
        en: "On the weekend I wrote a message and Diego wrote the homework"
        audioText: "el fin de semana escribí un mensaje y Diego escribió la tarea"
        atoms: ["el fin de semana", "escribí", "mensaje", "escribió", "tarea"]
        segments:
          - { text: "el fin de semana " }
          - { blank: { id: "p1", answer: "escribí", options: ["escribí", "escribió"] } }
          - { text: " un mensaje y Diego " }
          - { blank: { id: "p2", answer: "escribió", options: ["escribió", "escribí"] } }
          - { text: " la tarea" }
      - kind: listenBuildLit
        id: l6-lb-elfindesemanacomi
        es: "el fin de semana comí con mi familia"
        en: "On the weekend I ate with my family"
        atoms: ["el fin de semana", "comí", "familia"]
        tiles: ["comió", "como"]
      - kind: textMcq
        id: l6-tm-escribio
        target: "escribió"
        distractors: ["escribe", "escribí", "escribo"]
      - kind: speakLit
        id: l6-sp-escribiestudieysali
        es: "el fin de semana escribí, estudié y salí"
        en: "On the weekend I wrote, studied and went out"
        atoms: ["el fin de semana", "escribí", "estudié", "salí"]
      - kind: sim
        id: l6-sim-ana-findesemana
        scene: { emoji: "✉️", title: "Ana and the weekend", setting: "Monday. Ana wants to know what happened while she was away." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Saliste el fin de semana?", audioText: "¿saliste el fin de semana?", gloss: "Did you go out on the weekend?" }
            goal: "Say yes, you went out with Diego."
            reply:
              mode: build
              tiles: ["sí", "salí", "con", "Diego", "salió", "salgo"]
              answer: "sí salí con Diego"
            replyGloss: "Yes, I went out with Diego."
            explanation: "«saliste» in the question, «salí» in the answer."
          - id: t2
            npc: { speaker: "Ana", es: "¿Y el mensaje?", audioText: "¿y el mensaje?", gloss: "And the message?" }
            goal: "Say you wrote it on the weekend."
            reply:
              mode: choice
              options:
                - { id: "right", text: "lo escribí el fin de semana" }
                - { id: "wrong1", text: "lo escribo el fin de semana" }
                - { id: "wrong2", text: "lo escribió el fin de semana" }
              correctOptionId: "right"
              audioText: "lo escribí el fin de semana"
            replyGloss: "I wrote it on the weekend."
            explanation: "«lo» stands in for the message, and «escribí» puts the writing in the past. «escribo» is now; «escribió» is somebody else."
          - id: t3
            npc: { speaker: "Ana", es: "Diego no escribió la tarea.", audioText: "diego no escribió la tarea", gloss: "Diego didn't write the homework." }
            goal: "Say you wrote the homework last night."
            reply:
              mode: choice
              options:
                - { id: "right", text: "anoche escribí la tarea" }
                - { id: "wrong1", text: "anoche escribe la tarea" }
                - { id: "wrong2", text: "anoche escribió la tarea" }
              correctOptionId: "right"
              audioText: "anoche escribí la tarea"
            replyGloss: "Last night I wrote the homework."
            explanation: "«anoche» and I: «escribí»."
      - kind: matchLit
        id: l6-match
        pairs:
          - { source: "el fin de semana", target: "the weekend" }
          - { source: "escribí", target: "I wrote" }
          - { source: "escribió", target: "he or she wrote" }
          - { source: "ayer", target: "yesterday" }
          - { source: "anoche", target: "last night" }
          - { source: "la semana pasada", target: "last week" }
          - { source: "el mensaje", target: "the message" }
      - kind: speakLit
        id: l6-sp-win
        es: "el fin de semana escribí un mensaje y salí con Ana"
        en: "On the weekend I wrote a message and went out with Ana"
        atoms: ["el fin de semana", "escribí", "mensaje", "salí"]


  # ── L7 · «¿Y tú?» — ZERO new atoms. Questions and «no» in the past,
  #    every verb of the module mixed, dialogue-heavy. The tú cells that
  #    carry the questions are the registered ones: hablaste, compraste,
  #    trabajaste, comiste, saliste. No unregistered tú cell is printed.
  - n: 7
    template: free
    title: "¿Y tú?"
    description: "Asking about somebody's yesterday, and saying what you did not do. Every verb of the module, in questions and answers."
    steps:
      - kind: map
        id: l7-map-nocompreelregalo
        tokens: ["no", "compré", "el", "regalo", "ayer"]
        pairs:
          - { en: "not", tokenIndex: 0 }
          - { en: "I bought", tokenIndex: 1 }
          - { en: "the", tokenIndex: 2 }
          - { en: "gift", tokenIndex: 3 }
          - { en: "yesterday", tokenIndex: 4 }
        audioText: "no compré el regalo ayer"
        revealNote: "«no» goes where it always goes — in front of the verb — and the past-tense ending stays: «no compré». Nothing else changes."
        tokenGenders: { 2: "m", 3: "m" }
      - kind: info
        id: l7-info-preguntas
        title: "Asking about yesterday"
        body: "A question in the past is the you-form with a question mark: «¿compraste el regalo?» — did you buy the gift?; «¿saliste anoche?» — did you go out last night?; «¿comiste?» — did you eat? And the answer that says no: «no, no compré el regalo» — «no» in front of the verb, the ending untouched. The first «no» answers, the second one belongs to the verb."
      - kind: speakLit
        id: l7-sp-compraste
        es: "¿compraste el regalo?"
        en: "Did you buy the gift?"
        atoms: ["compraste", "regalo"]
      - kind: buildLit
        id: l7-b-nocompreelregalo
        also: ["ayer no compré el regalo"]
        es: "no compré el regalo ayer"
        en: "I didn't buy the gift yesterday"
        atoms: ["compré", "regalo", "ayer"]
        tiles: ["compro", "compró"]
      - kind: listenCompLit
        id: l7-lc-comisteenelrestaurante
        es: "¿comiste en el restaurante anoche?"
        en: "Did you eat at the restaurant last night?"
        atoms: ["comiste", "restaurante", "anoche"]
        distractorsEn:
          - "Did you eat at home last night?"
          - "Did she eat at the restaurant last night?"
          - "Do you eat at the restaurant every night?"
      - kind: buildLit
        id: l7-b-nosalilasemanapasada
        also: ["la semana pasada no salí"]
        es: "no salí la semana pasada"
        en: "I didn't go out last week"
        atoms: ["salí", "la semana pasada"]
        tiles: ["salió", "salgo"]
      - kind: clozeLit
        id: l7-c-diegonohablo
        es: "Diego no habló con Ana ayer"
        en: "Diego didn't speak with Ana yesterday"
        blank: "habló"
        options: ["habló", "hablo"]
        atoms: ["habló", "ayer"]
        why: "Diego, yesterday: «habló». The «no» in front does not change the ending."
      - kind: mcq
        id: l7-q-trabajaste
        prompt: "Which one means 'you worked'?"
        correct: "trabajaste"
        distractors: ["trabajé", "trabajó", "trabajas"]
        atoms: ["trabajaste"]
        why: "-aste is the you ending of the past: «trabajaste». «trabajas» is you, now."
      - kind: audioWimcq
        id: l7-ear-regalo
        target: { surface: "el regalo", emoji: "🎁" }
        distractors:
          - { surface: "el boleto", emoji: "🎟️" }
          - { surface: "la mochila", emoji: "🎒" }
      # Printed non-recall at L1 (es-m19-1-l1-sp-win).
      - kind: speakLit
        id: l7-sp-recall-ayerhable
        es: "ayer hablé con Ana y Ana habló con Diego"
        en: "Yesterday I spoke with Ana and Ana spoke with Diego"
        atoms: []
        cue: recall
      - kind: agreementLit
        id: l7-agr-trabajetrabajo
        en: "Yesterday I worked, but Diego didn't work"
        audioText: "ayer trabajé, pero Diego no trabajó"
        atoms: ["ayer", "trabajé", "trabajó"]
        segments:
          - { text: "ayer " }
          - { blank: { id: "p1", answer: "trabajé", options: ["trabajé", "trabajó"] } }
          - { text: ", pero Diego no " }
          - { blank: { id: "p2", answer: "trabajó", options: ["trabajó", "trabajé"] } }
      - kind: listenBuildLit
        id: l7-lb-hablasteconDiego
        es: "¿hablaste con Diego anoche?"
        en: "Did you speak with Diego last night?"
        atoms: ["hablaste", "anoche"]
        tiles: ["hablé", "habló"]
      - kind: textMcq
        id: l7-tm-comiste
        target: "comiste"
        distractors: ["comí", "comió", "comes"]
      - kind: speakLit
        id: l7-sp-nocomipizza
        es: "no comí pizza anoche, comí pollo"
        en: "I didn't eat pizza last night, I ate chicken"
        atoms: ["comí", "pizza", "anoche", "pollo"]
      - kind: buildLit
        id: l7-b-anaescribiopero
        es: "Ana escribió la tarea, pero no estudió"
        en: "Ana wrote the homework, but she didn't study"
        atoms: ["escribió", "tarea", "estudió"]
        tiles: ["escribí", "estudié"]
      - kind: sim
        id: l7-sim-carmen-anoche
        scene: { emoji: "👵", title: "Carmen wants a full report", setting: "Your grandmother Carmen has three questions and expects three honest answers." }
        turns:
          - id: t1
            npc: { speaker: "Carmen", es: "¿Comiste bien anoche?", audioText: "¿comiste bien anoche?", gloss: "Did you eat well last night?" }
            goal: "Say yes, you ate very well."
            reply:
              mode: build
              tiles: ["sí", "comí", "muy", "bien", "como", "comió"]
              answer: "sí comí muy bien"
              alsoAccepted: ["sí comí bien"]
            replyGloss: "Yes, I ate very well."
            explanation: "«comiste» in the question, «comí» in the answer."
          - id: t2
            npc: { speaker: "Carmen", es: "¿Y la tarea?", audioText: "¿y la tarea?", gloss: "And the homework?" }
            goal: "Say you didn't write the homework."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no escribí la tarea" }
                - { id: "wrong1", text: "no escribo la tarea" }
                - { id: "wrong2", text: "no escribió la tarea" }
              correctOptionId: "right"
              audioText: "no escribí la tarea"
            replyGloss: "I didn't write the homework."
            explanation: "«no» in front, the past ending kept: «no escribí»."
          - id: t3
            npc: { speaker: "Carmen", es: "¿Saliste con Ana?", audioText: "¿saliste con ana?", gloss: "Did you go out with Ana?" }
            goal: "Say no, you didn't go out, you worked."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no, no salí, trabajé" }
                - { id: "wrong1", text: "no, no salgo, trabajo" }
                - { id: "wrong2", text: "no, no salió, trabajó" }
              correctOptionId: "right"
              audioText: "no, no salí, trabajé"
            replyGloss: "No, I didn't go out, I worked."
            explanation: "Both verbs about you, both in the past: «salí», «trabajé»."
      - kind: matchLit
        id: l7-match
        pairs:
          - { source: "¿compraste el regalo?", target: "did you buy the gift?" }
          - { source: "no compré", target: "I didn't buy" }
          - { source: "¿saliste anoche?", target: "did you go out last night?" }
          - { source: "no salí", target: "I didn't go out" }
          - { source: "trabajaste", target: "you worked" }
          - { source: "comiste", target: "you ate" }
          - { source: "hablaste", target: "you spoke" }
      - kind: speakLit
        id: l7-sp-win
        es: "anoche no salí, comí en casa y escribí la tarea"
        en: "Last night I didn't go out, I ate at home and wrote the homework"
        atoms: ["anoche", "salí", "comí", "casa", "escribí", "tarea"]


