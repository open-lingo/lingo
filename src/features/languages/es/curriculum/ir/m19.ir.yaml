        id: l3-agr-comiycomio
        en: "I ate pizza and Ana ate soup"
        audioText: "comí pizza y Ana comió sopa"
        atoms: ["comí", "pizza", "comió", "sopa"]
        segments:
          - { blank: { id: "p1", answer: "comí", options: ["comí", "comió"] } }
          - { text: " pizza y Ana " }
          - { blank: { id: "p2", answer: "comió", options: ["comió", "comí"] } }
          - { text: " sopa" }
      - kind: listenBuildLit
        id: l3-lb-anochecomisopa
        es: "anoche comí sopa"
        en: "Last night I ate soup"
        atoms: ["anoche", "comí", "sopa"]
        tiles: ["como", "comió"]
      - kind: textMcq
        id: l3-tm-comio
        target: "comió"
        distractors: ["come", "comí", "comiste"]
      - kind: speakLit
        id: l3-sp-comiyhable
        es: "anoche comí pizza y hablé con Ana"
        en: "Last night I ate pizza and spoke with Ana"
        atoms: ["anoche", "comí", "pizza", "hablé"]
      - kind: sim
        id: l3-sim-sofia-anoche
        scene: { emoji: "🍕", title: "Sofía asks about last night", setting: "Sofía missed dinner and wants every detail." }
        turns:
          - id: t1
