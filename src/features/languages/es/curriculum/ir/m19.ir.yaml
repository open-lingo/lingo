  # ── L4 · «Viví, salí» — viví, vivió, salí, saliste, salió, «la semana
  #    pasada». -ir borrows the -er table wholesale. «vivir» registers yo /
  #    él; «salir» all three (its tú cell carries the questions).
  #    ⚠️ «viviste» is NOT registered and is never printed.
  - n: 4
    template: free
    title: "Viví, salí"
    description: "-ir verbs borrow the -er table wholesale, so there is nothing new to learn — just two verbs to run it on, and a way to say 'last week'."
    steps:
      - kind: map
        id: l4-map-lasemanapasadasali
        tokens: ["la", "semana", "pasada", "salí", "con", "Ana"]
        pairs:
          - { en: "the", tokenIndex: 0 }
          - { en: "week", tokenIndex: 1 }
          - { en: "past", tokenIndex: 2 }
          - { en: "I went out", tokenIndex: 3 }
          - { en: "with", tokenIndex: 4 }
          - { en: "Ana", tokenIndex: 5 }
        audioText: "la semana pasada salí con Ana"
        revealNote: "«la semana pasada» — the week that passed: last week. «salí» — I went out, from «salir». An -ir verb, and it takes exactly the endings «comer» took: -í, -iste, -ió."
        tokenGenders: { 0: "f", 1: "f", 2: "f" }
      - kind: info
        id: l4-info-ir
        title: "-ir borrows the -er table"
        body: "«vivir», «salir», «escribir» — every -ir verb takes the endings you learned for «comer»: «viví», I lived; «vivió», he or she lived; «salí», I went out; «saliste», you went out; «salió», he or she went out. Nothing new to memorise. And a third time marker: «la semana pasada», last week — «la semana pasada salí con Ana»."
      - kind: speakLit
        id: l4-sp-sali
        es: "la semana pasada salí con Ana"
        en: "Last week I went out with Ana"
        atoms: ["la semana pasada", "salí"]
      - kind: buildLit
        id: l4-b-diegosalioanoche
        es: "Diego salió anoche"
        en: "Diego went out last night"
        atoms: ["salió", "anoche"]
        tiles: ["salí", "sale"]
