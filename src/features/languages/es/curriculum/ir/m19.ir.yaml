            explanation: "«ayer» pulls the verb into the past: «estudié». «estudio» would keep it today."
          - id: t2
            npc: { speaker: "Sofía", es: "¿Y Diego estudió?", audioText: "¿y diego estudió?", gloss: "And did Diego study?" }
            goal: "Say yes, he studied last night."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, estudió anoche" }
                - { id: "wrong1", text: "sí, estudia anoche" }
                - { id: "wrong2", text: "sí, estudié anoche" }
              correctOptionId: "right"
              audioText: "sí, estudió anoche"
            replyGloss: "Yes, he studied last night."
            explanation: "«anoche» and Diego: «estudió». «estudia» is now; «estudié» is you."
          - id: t3
            npc: { speaker: "Sofía", es: "¿Hablaste con el maestro?", audioText: "¿hablaste con el maestro?", gloss: "Did you speak with the teacher?" }
            goal: "Say yes, you spoke with him yesterday."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, hablé con el maestro ayer" }
                - { id: "wrong1", text: "sí, hablo con el maestro ayer" }
                - { id: "wrong2", text: "sí, habló con el maestro ayer" }
              correctOptionId: "right"
              audioText: "sí, hablé con el maestro ayer"
            replyGloss: "Yes, I spoke with the teacher yesterday."
            explanation: "«ayer» plus I: «hablé». «hablo ayer» contradicts itself; «habló» is somebody else."
      - kind: matchLit
        id: l5-match
        pairs:
          - { source: "hablo", target: "I speak (now)" }
          - { source: "habló", target: "he or she spoke (then)" }
          - { source: "compro", target: "I buy (now)" }
          - { source: "compró", target: "he or she bought (then)" }
          - { source: "estudié", target: "I studied" }
          - { source: "estudió", target: "he or she studied" }
          - { source: "hoy", target: "today" }
      - kind: speakLit
        id: l5-sp-win
