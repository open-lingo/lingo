        scene: { emoji: "🌳", title: "Diego wants the weekend news", setting: "Diego stayed home on Saturday and wants to know who went where." }
        turns:
          - id: t1
            npc: { speaker: "Diego", es: "¿Saliste el sábado?", audioText: "¿saliste el sábado?", gloss: "Did you go out on Saturday?" }
