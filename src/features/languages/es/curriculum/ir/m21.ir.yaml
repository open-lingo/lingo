                - { id: "wrong1", text: "sí, lo vieron en el parque" }
                - { id: "wrong2", text: "sí, lo vio en el parque" }
              correctOptionId: "right"
              audioText: "sí, lo vimos en el parque"
            replyGloss: "Yes, we saw him at the park."
            explanation: "About the group, in the past: «vimos». «lo» stands for Diego."
      - kind: matchLit
        id: l9-match
        pairs:
          - { source: "hoy vamos", target: "today we go" }
          - { source: "ayer fuimos", target: "yesterday we went" }
          - { source: "tuvimos trabajo", target: "we had work" }
          - { source: "vimos el parque", target: "we saw the park" }
          - { source: "todos comieron", target: "everyone ate" }
          - { source: "trabajaron", target: "they worked" }
          - { source: "escribieron", target: "they wrote" }
      - kind: speakLit
        id: l9-sp-win
        es: "hoy vamos al cine, pero ayer fuimos al museo"
