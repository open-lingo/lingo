        blank: "escribieron"
        options: ["escribieron", "escribió"]
        atoms: ["escribí", "mensaje", "anoche", "escribieron"]
        why: "The first clause is just me: «escribí». The second is them: «escribieron»."
      - kind: textMcq
        id: l9-tm-trabajaron
        target: "trabajaron"
        distractors: ["trabajé", "trabajaste", "trabajó"]
      - kind: buildLit
        id: l9-b-trabajevstrabajaron
        es: "trabajé mucho, pero ellos trabajaron más"
        en: "I worked a lot, but they worked more"
        atoms: ["trabajé", "trabajaron"]
        tiles: ["trabaja", "trabajas"]
      - kind: mcq
        id: l9-q-hablamosayer
        prompt: "Which one means 'we talked' (yesterday)?"
        correct: "ayer hablamos"
        distractors: ["hoy hablamos", "mañana hablamos", "ellos hablan"]
        atoms: ["hablamos"]
        why: "«hablamos» looks the same now or then — «ayer» tips it into the past."
      - kind: listenBuildLit
        id: l9-lb-vivimoshoyvsmespasado
        es: "hoy vivimos en casa de mi abuela, pero el mes pasado vivimos en México"
        en: "Today we live at my grandmother's house, but last month we lived in Mexico"
        atoms: ["vivimos", "casa", "abuela", "el mes pasado", "México"]
        tiles: ["viven", "vivieron"]
      - kind: sim
        id: l9-sim-ana-hoyantes
        scene: { emoji: "📅", title: "Ana wants the whole story", setting: "Ana missed the whole week and wants to know what happened, and what's different today." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Qué hicieron ustedes la semana pasada?", audioText: "¿qué hicieron ustedes la semana pasada?", gloss: "What did you all do last week?" }
            goal: "Say you went to the museum and worked."
            reply:
              mode: build
              tiles: ["fuimos", "al", "museo", "y", "trabajé", "trabajó", "vamos"]
              answer: "fuimos al museo y trabajé"
            replyGloss: "We went to the museum and I worked."
            explanation: "«fuimos» about the group, but «trabajé» goes back to just you — the group's past of trabajar isn't taught yet, so keep it singular."
          - id: t2
            npc: { speaker: "Ana", es: "¿Y hoy? ¿Tienen trabajo?", audioText: "¿y hoy? ¿tienen trabajo?", gloss: "And today? Do you all have work?" }
            goal: "Say no, today you all don't have work."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no, hoy no tenemos trabajo" }
                - { id: "wrong1", text: "no, ayer no tuvimos trabajo" }
                - { id: "wrong2", text: "no, hoy no tuvimos trabajo" }
              correctOptionId: "right"
              audioText: "no, hoy no tenemos trabajo"
            replyGloss: "No, today we don't have work."
            explanation: "«hoy» wants now: «tenemos», not «tuvimos»."
          - id: t3
            npc: { speaker: "Ana", es: "¿Vieron ustedes a Diego ayer?", audioText: "¿vieron ustedes a diego ayer?", gloss: "Did you all see Diego yesterday?" }
            goal: "Say yes, you saw him at the park."
