  # ── L6 · «Todos fueron» — six new atoms in one lesson: «todos» (a new
  #    quantifier that takes 3rd-person-plural agreement, just like «ellos»)
  #    plus the ustedes/ellos preterite of ir/ser (fueron), -ar (hablaron),
  #    -er (comieron), -ir (vivieron) — all unambiguous new surfaces — and
  #    «comimos», the -er nosotros preterite (unlike «hablamos»/«vivimos»,
  #    this one genuinely differs from the present «comemos»).
  #    ⚠️ «todos» NEVER pairs with «fuimos»/«comimos» — always the -ieron/
  #    -aron ending, like «ellos».
  - n: 6
    template: free
    title: "Todos fueron"
    description: "«todos» — everyone, all of them — takes the same ending as «ellos», never «nosotros»: «todos fueron», never «todos fuimos». And «comimos», we ate, is a genuinely new word — unlike «hablamos»/«vivimos», it doesn't double as the present."
