module: m21
title: "Fuimos, fueron — the past, plural"
frame: none
throughModule: m20
expectedLessonCount: 10
checkpoint: 8

# ES m21 — the plural preterite. Third A2 module; closes the paradigm.
#
#     ir/ser: fuimos    fueron       hacer:  hicimos    hicieron
#     tener:  tuvimos   tuvieron     estar:  estuvimos  estuvieron
#     ver:    vimos     vieron       venir:  vinimos    vinieron
#     -ar:    hablamos* hablaron     -er:    comimos    comieron
#     -ir:    vivimos*  vivieron
#
#     (* = the exact same surface as the present tense. m19 said so and
#     held the line: "«hablamos» is deliberately ambiguous between present
#     and preterite and m18 just spent it as a present. m20 may open the
#     plural past." — m19-header.yaml. m20 opened the irregular singular
#     instead; this module is the plural past m19 was pointing at.)
#
# ONE idea, the whole module: the learner already has yo/tú/él for every
# verb (m19 regular, m20 irregular) and already has nosotros/ustedes/ellos
# as SUBJECTS and PRESENT-tense speakers (m18, "Nosotros hablamos"). This
# module is not a new tense and not new people — it is handing the past
# tense to the two persons the learner has been using in the present the
# whole time. Nothing here is drilled that was not already half-taught.
#
# ── WHY THIS MODULE, NOT THE IMPERFECT (decision, 2026-09-10) ────────────
# The backlog line at docs/handoff-2026-09-09-es-m20-done-ko-next.md:76
# left "m21+ unplanned (A2 continues: plural preterite, or imperfect)" as
# an open choice. Resolved: plural preterite. Evidence, not preference —
#   1. m19-header.yaml already named this module ("m20 may open the plural
#      past") and explicitly reserved «hablamos» for it — the course's own
#      prior authoring intended this to come before anything else.
#   2. m20.test.ts's own bespoke pin is titled "singular persons only: no
#      plural preterite, no vosotros" — m20 deliberately fenced plural
#      preterite OFF, not out.
#   3. The paradigm is half-built: every verb the learner has met has a
#      past tense for yo/tú/él only. nosotros/ustedes/ellos have been
#      PRESENT-only since m18. CLAUDE.md's contract is "every new word or
#      structure is introduced before it's tested" — teaching a SECOND
#      past tense (imperfect) while the FIRST one (preterite) is still
#      missing two of five persons violates that before it teaches
#      anything new about aspect. Finish the shape already in progress.
#   4. Machinery is not the constraint either way: `conjugationTables.ts`
#      already carries preterite.nosotros / preterite.ustedes for every
#      verb this module needs (grep-verified below) AND imperfect for the
#      ten A1 verbs (pin E12, es-authoring-invariants-pinned.md §1) — so
#      "which data exists" does not decide this; "what the learner can
#      already reason about" does, and that is the plural preterite.
#   Imperfect (with a preterite-vs-imperfect contrast module after it) is
#   the natural m22+, once this module closes the preterite paradigm.
#
# ── PERSONS ──────────────────────────────────────────────────────────────
# nosotros AND ustedes/ellos, past tense, for the verbs already met in
# m18/m19/m20. yo/tú/él forms are PRIOR (m19/m20) and get re-spent, never
# re-taught. vosotros is NEVER drilled (LatAm-neutral course, m18's own
# rule carries).
#
# ── «hablamos» / «vivimos» — REUSED SURFACE, NOT A NEW ATOM ──────────────
# -ar and -ir verbs have IDENTICAL nosotros forms in the present and the
# preterite. «hablamos» and «vivimos» are already registered atoms
# (m18, present "we speak" / "we live") — do NOT re-register them; the
# surface-dedupe in courseAtoms.ts would reject a second atom on the same
# surface anyway. Debut their PAST reading explicitly in L2 (info card +
# speakLit), the same way m20 drilled «fue» both ways — this is the
# module's own version of that ambiguity, and the gate for it is a bespoke
# m21.test.ts pin (see brief), not the newAtoms list.
#
# ── -er IS DIFFERENT ───────────────────────────────────────────────────
# «comimos» (we ate) is NOT «comemos» (we eat) — -er verbs' nosotros
# preterite is a genuinely new surface, unlike -ar/-ir. It is a normal new
# atom, no ambiguity to teach.
#
# ── ustedes/ellos IS ALWAYS A NEW SURFACE ─────────────────────────────────
# -aron/-ieron never collides with a present form (present is -an/-en), so
# every ustedes/ellos preterite atom this module registers is unambiguous,
# glossed the m18 way: "they/you-all ___" (see m18's «son»).
#
# ── PIN E12: EVERY CELL COMES FROM conjugationTables.ts ───────────────────
# preterite.nosotros / preterite.ustedes already exist in ES_VERB_ENTRIES
# for every verb this module touches (hablar, comer, vivir, ser, estar,
# ir, tener, hacer, ver, venir, estudiar, comprar, trabajar, escribir) —
# nothing new to add to the table this time. Derive every cell from it;
# never hand-write a form.
#
# ── hacer/tener RULING, EXTENDED (B112) ───────────────────────────────────
# Still true and now ALSO covers the plural present: «hacemos», «hacen»,
# «queremos», «quieren», «podemos», «pueden», «trabajamos», «trabajan»,
# «estudiamos», «estudian», «compramos», «compran», «escribimos» (present
# reading), «escriben», «salimos», «salen», «cocinamos», «cocinan»,
# «vemos», «ven», «venimos», «vienen» are NOT PRIOR — none of these verbs'
# nosotros/ustedes PRESENT forms were ever registered as atoms (grep-
# verified: only hablar/comer/vivir/ser/estar/ir/tener have m18 nosotros/
# ustedes present atoms). They stay banned in every slot, present or past
# reading, exactly like m19/m20's bans. Only the 21 atoms below (plus the
# reused «hablamos»/«vivimos») carry a new PAST reading this module.
#
# ── «todos» ─────────────────────────────────────────────────────────────
# New quantifier, debuts L6. Takes 3rd-person-plural agreement like any
# other "todos" subject — «todos fueron», never «todos fuimos». Pairs with
# ustedes/ellos forms, not nosotros.
#
# ── NO IMPERFECT, NO PROGRESSIVE (pins E7) ────────────────────────────────
# Still simple past only. The imperfect is the NEXT module's job, not this
# one's — see the decision note above.
#
# ── NO NEW EMOJI THIS MODULE ──────────────────────────────────────────────
# No new imageable noun; «todos» is abstract. m19 shipped with zero new
# emoji too (pure verb-focus module) — precedent, not a gap. audioWimcq
# still drills PRIOR nouns with their existing emoji as usual.
# ─────────────────────────────────────────────────────────────────────────
newAtoms:
  # ir/ser — plural past
  - { surface: "fuimos", meaningEn: "we went / we were", partOfSpeech: "verb", kind: "vocab", hint: "FWEE-mos — same word for went and was, just like «fui»" }
  - { surface: "fueron", meaningEn: "they went / they were, you all went / were", partOfSpeech: "verb", kind: "vocab", hint: "FWEH-ron — «fue» with -ron" }
  # hacer
  - { surface: "hicimos", meaningEn: "we did / we made", partOfSpeech: "verb", kind: "vocab", hint: "ee-SEE-mos" }
  - { surface: "hicieron", meaningEn: "they did / made, you all did / made", partOfSpeech: "verb", kind: "vocab", hint: "ee-see-EH-ron" }
  # tener / estar
  - { surface: "tuvimos", meaningEn: "we had", partOfSpeech: "verb", kind: "vocab", hint: "too-BEE-mos" }
  - { surface: "tuvieron", meaningEn: "they had, you all had", partOfSpeech: "verb", kind: "vocab", hint: "too-BYEH-ron" }
  - { surface: "estuvimos", meaningEn: "we were (somewhere)", partOfSpeech: "verb", kind: "vocab", hint: "es-too-BEE-mos" }
  - { surface: "estuvieron", meaningEn: "they were, you all were (somewhere)", partOfSpeech: "verb", kind: "vocab", hint: "es-too-BYEH-ron" }
  # ver / venir
  - { surface: "vimos", meaningEn: "we saw", partOfSpeech: "verb", kind: "vocab", hint: "BEE-mos" }
  - { surface: "vieron", meaningEn: "they saw, you all saw", partOfSpeech: "verb", kind: "vocab", hint: "BYEH-ron" }
  - { surface: "vinimos", meaningEn: "we came", partOfSpeech: "verb", kind: "vocab", hint: "bee-NEE-mos" }
  - { surface: "vinieron", meaningEn: "they came, you all came", partOfSpeech: "verb", kind: "vocab", hint: "bee-NYEH-ron" }
  # regular -ar / -er / -ir, ustedes-ellos (always new) and the -er nosotros form (new; -ar/-ir nosotros are the reused «hablamos»/«vivimos», not registered here)
  - { surface: "hablaron", meaningEn: "they spoke, you all spoke", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "comimos", meaningEn: "we ate", partOfSpeech: "verb", kind: "vocab", hint: "unlike «hablamos»/«vivimos», this does NOT double as the present — «comemos» is the present, a different word" }
  - { surface: "comieron", meaningEn: "they ate, you all ate", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "vivieron", meaningEn: "they lived, you all lived", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "estudiaron", meaningEn: "they studied, you all studied", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "compraron", meaningEn: "they bought, you all bought", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "trabajaron", meaningEn: "they worked, you all worked", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "escribieron", meaningEn: "they wrote, you all wrote", partOfSpeech: "verb", kind: "vocab" }
  # quantifier
  - { surface: "todos", meaningEn: "everyone / all of them", partOfSpeech: "pronoun", kind: "vocab", hint: "TOH-dos — takes the same verb ending as «ellos»" }

lessons:
  # ── L1 · «Fuimos juntos» — fuimos, the plural past of «ir», WENT only.
  #    No accent — same story as «fui»: the stress already sits on the stem.
  #    A place always follows, with «a» or «al». ⚠️ NO ser reading here (L2).
  #    NO other new verb.
  - n: 1
    template: free
    title: "Fuimos juntos"
    description: "You already know «fui» — I went. Now the same past, for «we»: «fuimos». One new word, one job: saying where you all went."
    steps:
      - kind: map
        id: l1-map-ayerfuimos
        tokens: ["ayer", "fuimos", "juntos", "al", "museo"]
        pairs:
          - { en: "yesterday", tokenIndex: 0 }
          - { en: "we went", tokenIndex: 1 }
          - { en: "together", tokenIndex: 2 }
          - { en: "to the", tokenIndex: 3 }
          - { en: "museum", tokenIndex: 4 }
        audioText: "ayer fuimos juntos al museo"
        revealNote: "«vamos» is we go, now — you have used it since module eighteen. «fuimos» is the past: we went. No accent, same shape as «fui», just the we-ending on it."
      - kind: info
        id: l1-info-fuimos
        title: "Fuimos — the past of ir, for we"
        body: "«vamos» is we go, now. «fuimos» is we went — no accent anywhere, the same irregular stem as «fui» with the we-ending on it. A place follows, with «a» or «al»: «fuimos al museo», «fuimos al parque». One word does the job that «fui» did for just you."
      - kind: speakLit
        id: l1-sp-fuimos
        es: "fuimos al museo ayer"
        en: "We went to the museum yesterday"
        atoms: ["fuimos", "el museo", "ayer"]
      - kind: clozeLit
        id: l1-c-fuimosplaya
        es: "fuimos a la playa juntos"
        en: "We went to the beach together"
        blank: "fuimos"
        options: ["fuimos", "fui", "vamos"]
        atoms: ["fuimos", "playa", "juntos"]
        why: "More than one person went, together — «fuimos». «fui» would be just you; «vamos» slips back into now."
      - kind: listenCompLit
        id: l1-lc-fuimosmercado
        es: "fuimos al mercado ayer"
        en: "We went to the market yesterday."
        atoms: ["fuimos", "mercado", "ayer"]
        distractorsEn:
          - "We go to the market every day."
          - "They went to the market yesterday."
          - "I went to the market yesterday."
      - kind: mcq
        id: l1-q-fuimos
        prompt: "Which one means 'we went'?"
        correct: "fuimos"
        distractors: ["fui", "vamos", "van"]
        atoms: ["fuimos"]
        why: "«fuimos» — the we-ending on the past of ir. «fui» is just you talking about yourself; «vamos»/«van» slip back into now."
      - kind: buildLit
        id: l1-b-fuimosjuntosparque
        es: "fuimos juntos al parque ayer"
        en: "We went to the park together yesterday"
        atoms: ["fuimos", "juntos", "parque", "ayer"]
        tiles: ["fui", "vamos"]
      - kind: audioWimcq
        id: l1-ear-parque
        target: { surface: "el parque", emoji: "🌳" }
        distractors:
          - { surface: "el museo", emoji: "🏛️" }
          - { surface: "la playa", emoji: "🏖️" }
      - kind: agreementLit
        id: l1-agr-fuiyfuimos
        en: "I went to the museum and we went to the park"
        audioText: "fui al museo y fuimos al parque"
        atoms: ["fui", "el museo", "fuimos", "parque"]
        segments:
          - { blank: { id: "p1", answer: "fui", options: ["fui", "fuimos"] } }
          - { text: " al museo y " }
          - { blank: { id: "p2", answer: "fuimos", options: ["fuimos", "fui"] } }
          - { text: " al parque" }
      - kind: listenBuildLit
        id: l1-lb-fuimosjuntosfiesta
        es: "fuimos juntos a la fiesta"
        en: "We went to the party together"
        atoms: ["fuimos", "juntos", "fiesta"]
        tiles: ["fue", "vamos"]
      - kind: textMcq
        id: l1-tm-fuimos
        target: "fuimos"
        distractors: ["fui", "vamos", "van"]
      - kind: speakLit
        id: l1-sp-fuimosconDiego
        es: "fuimos al museo con Diego"
        en: "We went to the museum with Diego"
        atoms: ["fuimos", "el museo"]
      - kind: sim
        id: l1-sim-ana-museo
        scene: { emoji: "🏛️", title: "Ana asks about the museum", setting: "Ana wants to know who went where yesterday." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Fuiste al museo con Diego ayer?", audioText: "¿fuiste al museo con diego ayer?", gloss: "Did you go to the museum with Diego yesterday?" }
            goal: "Say yes, you both went together."
            reply:
              mode: build
              tiles: ["sí", "fuimos", "juntos", "fui", "vamos"]
              answer: "sí fuimos juntos"
            replyGloss: "Yes, we went together."
            explanation: "Ana asked about you and Diego; the answer covers both of you at once: «fuimos». «fui» would be only you."
          - id: t2
            npc: { speaker: "Ana", es: "¿Fue bueno el museo?", audioText: "¿fue bueno el museo?", gloss: "Was the museum good?" }
            goal: "Say yes, it was very good."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, fue muy bueno" }
                - { id: "wrong1", text: "sí, fui muy bueno" }
                - { id: "wrong2", text: "sí, fuiste muy bueno" }
              correctOptionId: "right"
              audioText: "sí, fue muy bueno"
            replyGloss: "Yes, it was very good."
            explanation: "«el museo» — he or she in grammar terms: «fue». «fui» would be I; «fuiste» would be you."
          - id: t3
            npc: { speaker: "Ana", es: "Diego no fue al parque.", audioText: "diego no fue al parque.", gloss: "Diego didn't go to the park." }
            goal: "Say no, you went without Diego."
            reply:
              mode: build
              tiles: ["no", "fuimos", "sin", "Diego", "fui", "fue"]
              answer: "no fuimos sin Diego"
            replyGloss: "No, we went without Diego."
            explanation: "Still the group answering about itself: «fuimos». «fui» would be only you; «fue» would hand it to Diego."
      - kind: matchLit
        id: l1-match
        pairs:
          - { source: "ayer", target: "yesterday" }
          - { source: "fuimos", target: "we went" }
          - { source: "fui", target: "I went" }
          - { source: "vamos", target: "we go" }
          - { source: "juntos", target: "together" }
          - { source: "el museo", target: "the museum" }
          - { source: "el parque", target: "the park" }
      - kind: speakLit
        id: l1-sp-win
        es: "ayer fuimos juntos al museo"
        en: "Yesterday we went to the museum together"
        atoms: ["ayer", "fuimos", "juntos", "el museo"]

  # ── L2 · «Fuimos, hablamos» — no new atoms. Two jobs: (1) re-spend
  #    «fuimos» BOTH ways (went — a place follows; was — an adjective/noun
  #    follows), exactly like m20 did for «fue»; (2) debut the PAST reading
  #    of «hablamos»/«vivimos» — PRIOR m18 present-tense atoms, relicensed
  #    here. Same surface, present or past; only the marker tells you which.
  - n: 2
    template: free
    title: "Fuimos, hablamos"
    description: "«fuimos» does the same double duty as «fui» — went, or was. And two words you already know, «hablamos» and «vivimos», turn out to have a past job too: the exact same word, then instead of now."
    steps:
      - kind: map
        id: l2-map-fiestafuehablamos
        tokens: ["la", "fiesta", "fue", "muy", "buena", "y", "hablamos", "mucho"]
        pairs:
          - { en: "the", tokenIndex: 0 }
          - { en: "party", tokenIndex: 1 }
          - { en: "was", tokenIndex: 2 }
          - { en: "very", tokenIndex: 3 }
          - { en: "good", tokenIndex: 4 }
          - { en: "and", tokenIndex: 5 }
          - { en: "we talked", tokenIndex: 6 }
          - { en: "a lot", tokenIndex: 7 }
        audioText: "la fiesta fue muy buena y hablamos mucho"
        revealNote: "«fue» again with no place after it — was, just like «la película fue muy buena». And «hablamos» here isn't now, it's then: we talked. Same word you've used since module eighteen — the story around it says which."
      - kind: info
        id: l2-info-hablamosvivimos
        title: "Hablamos, vivimos — now, or then?"
        body: "«hablamos» is both we speak (now) and we spoke (then) — the exact same word, no accent to tell them apart. «vivimos» works the same way: we live, or we lived. Looking at the word alone never tells you which. The marker does: «hoy hablamos» is now; «anoche hablamos» is then. Trust the marker, not the word."
      - kind: speakLit
        id: l2-sp-fuimosbuenos
        es: "fuimos muy buenos en la fiesta"
        en: "We were very good at the party"
        atoms: ["fuimos", "fiesta"]
      - kind: buildLit
        id: l2-b-vivimosabuela
        es: "la semana pasada vivimos en casa de mi abuela"
        en: "Last week we lived at my grandmother's house"
        atoms: ["vivimos", "abuela", "la semana pasada"]
        tiles: ["viven", "vivo"]
      - kind: listenBuildLit
        id: l2-lb-hablamosanoche
        es: "anoche hablamos mucho"
        en: "Last night we talked a lot"
        atoms: ["hablamos", "anoche"]
        tiles: ["hablan", "hablas"]
      - kind: listenCompLit
        id: l2-lc-hablamosabuela
        es: "hablamos con la abuela anoche"
        en: "We talked to grandma last night."
        atoms: ["hablamos", "abuela", "anoche"]
        distractorsEn:
          - "We talk to grandma every day."
          - "They talked to grandma last night."
          - "We talked to grandma today."
      - kind: buildLit
        id: l2-b-fuimosalparque
        es: "fuimos al parque juntos ayer"
        en: "We went to the park together yesterday"
        atoms: ["fuimos", "parque", "juntos", "ayer"]
        tiles: ["fue", "vamos"]
      - kind: textMcq
        id: l2-tm-vivimosanoche
        target: "vivimos"
        distractors: ["viven", "vivo", "vive"]
      - kind: audioWimcq
        id: l2-ear-abuela
        target: { surface: "abuela", emoji: "👵" }
        distractors:
          - { surface: "casa", emoji: "🏠" }
          - { surface: "fiesta", emoji: "🎉" }
      - kind: agreementLit
        id: l2-agr-fuimoshablamos
        en: "We went to the party and we talked a lot"
        audioText: "fuimos a la fiesta y hablamos mucho"
        atoms: ["fuimos", "fiesta", "hablamos", "mucho"]
        segments:
          - { blank: { id: "p1", answer: "fuimos", options: ["fuimos", "fue"] } }
          - { text: " a la fiesta y " }
          - { blank: { id: "p2", answer: "hablamos", options: ["hablamos", "hablan"] } }
          - { text: " mucho" }
      - kind: listenBuildLit
        id: l2-lb-vivimosaqui
        es: "la semana pasada vivimos aquí"
        en: "Last week we lived here"
        atoms: ["vivimos", "la semana pasada", "aquí"]
        tiles: ["viven", "vivo"]
      - kind: textMcq
        id: l2-tm-hablamos
        target: "hablamos"
        distractors: ["hablan", "hablas", "hablo"]
      - kind: speakLit
        id: l2-sp-fuimosamigos
        es: "fuimos amigos en la escuela"
        en: "We were friends at school"
        atoms: ["fuimos", "escuela"]
      - kind: sim
        id: l2-sim-ana-fiesta
        scene: { emoji: "🎉", title: "Ana asks about the party", setting: "Ana wants to know how the party was, and whether you talked to grandma." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Cómo fue la fiesta?", audioText: "¿cómo fue la fiesta?", gloss: "How was the party?" }
            goal: "Say it was very good."
            reply:
              mode: build
              tiles: ["fue", "muy", "buena", "fuimos", "fui"]
              answer: "fue muy buena"
            replyGloss: "It was very good."
            explanation: "No place follows «fue» here, so it means was — the party, «buena» in the feminine. «fuimos» would be we; «fui» would be I."
          - id: t2
            npc: { speaker: "Ana", es: "¿Hablaste con tu abuela anoche?", audioText: "¿hablaste con tu abuela anoche?", gloss: "Did you talk to your grandma last night?" }
            goal: "Say yes, you all talked a lot."
            reply:
              mode: build
              tiles: ["sí", "hablamos", "mucho", "hablan", "hablo"]
              answer: "sí hablamos mucho"
            replyGloss: "Yes, we talked a lot."
            explanation: "Ana asked about just you; answering for the group uses «hablamos» — her own marker «anoche» already set the past, so «hablamos» here means we talked, not we talk."
          - id: t3
            npc: { speaker: "Ana", es: "Mi abuela vivió en México.", audioText: "mi abuela vivió en méxico.", gloss: "My grandmother lived in Mexico." }
            goal: "Say you all lived there too, last week."
            reply:
              mode: build
              tiles: ["también", "vivimos", "en", "México", "la", "semana", "pasada", "viven", "vivo"]
              answer: "también vivimos en México la semana pasada"
            replyGloss: "We also lived in Mexico last week."
            explanation: "«la semana pasada» is the marker that makes «vivimos» mean we lived, not we live."
      - kind: matchLit
        id: l2-match
        pairs:
          - { source: "fuimos", target: "we went / we were" }
          - { source: "hablamos", target: "we talk / we talked" }
          - { source: "vivimos", target: "we live / we lived" }
          - { source: "fue", target: "he or she went / was" }
          - { source: "anoche", target: "last night" }
          - { source: "la semana pasada", target: "last week" }
          - { source: "fiesta", target: "the party" }
      - kind: speakLit
        id: l2-sp-win
        es: "la fiesta fue muy buena y hablamos mucho"
        en: "The party was very good and we talked a lot"
