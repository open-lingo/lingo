module: m4
title: "¿Dónde está? — find anything, anywhere in the house"
frame: none
throughModule: m3
expectedLessonCount: 10
checkpoint: 8

# ES m4 — «¿Dónde está?»: existence vs location, rooms, plurals, two
# honest exceptions. Second §13-doctrine IR module (m3 is the exemplar).
#
# SPINE PROVENANCE: atom inventory + arc PINNED by
# docs/es-m4-m10-wave-2026-08-24.md ("m4 — ¿Dónde está?"). 12 atoms:
# está, dónde, allí, los, las, mesa, cama, baño, cocina, agua, cuarto,
# foto. Nothing added, dropped or renamed against that spec.
#
# DOCTRINE NOTES:
#   - Contrast card (L1): «hay» says something EXISTS; «está» says WHERE
#     it is. «hay una llave» / «la llave está en la mesa». Every sim in
#     the module re-tests this as a three-way trap (es = identity, hay =
#     existence, está = location) — the same distractor shape recurs by
#     design, not by accident.
#   - «están» is BANNED module-wide — plurals ride «hay» (+ a number or
#     un/una), never a plural + estar construction. Consequence: los/las
#     are taught and drilled as bare definite noun phrases (el libro →
#     los libros) and as hay-adjacent counting nouns, but the module
#     never asks "where ARE the things" — only "where IS the thing"
#     (singular) or "how many things exist" (hay + plural). This
#     boundary is stated explicitly in the L4 sim's explanation line.
#   - The plural rule (-s + los/las) is STATED in L4 as the callback m3
#     promised: m3 noticed «hay dos libros» silently; this module says
#     why. ocho/nueve/diez (m1 atoms, never spent since m1) finally do
#     real work, always inside «hay + number + noun» sentences.
#   - Two honest exceptions get their own card + cash beat: «el agua»
#     (feminine noun, but singular pairs with EL — the a-a collision
#     card, L5) and «la foto» (-o ending, but a la-word — short for
#     «fotografía», L5). No adjectives exist yet, so both exceptions
#     stay inside «X está en Y» / «es de Z» sentences — never a
#     description.
#   - mesa and cuarto have no honest emoji. Both debut by MAP
#     ELIMINATION (one new word against an otherwise-fully-taught
#     sentence) — never imageMcq, never a pretest. cama/baño/cocina/
#     agua/foto debut by imageMcq (all have honest art).
#   - Nouns wear their article on every surface («la mesa», never bare
#     «mesa»); atoms stay bare with `gender` (m3 registry convention).
#   - Discrimination lanes (§13.9 law 4, alternating, both halves live):
#     está/es clozes (7 está-correct : 5 es-correct across the module),
#     aquí/allí by EAR (2 aquí-target : 3 allí-target), los/las clozes
#     (4 los-correct : 6 las-correct, +1 los via textMcq in L10 to hold
#     the checkpoint-lesson cloze-share ceiling — noted at that step).
#   - Cast: Ana (loses things — the m3 gag continues into her own
#     rooms), Diego (the m3 wallet gag's owner, now his date-night
#     panic), Sofía, María (all established); Carmen not yet on stage
#     (m7). Learner = Sam. Titles are promises; L1 states the module
#     promise; mastery ends on Diego's phone call.
#
# VOICING LEDGER (printed speak → licenses later cue:"recall"):
#   ¿dónde está? L1 · está en la mesa L1 · la cocina L2 · allí L3 ·
#   el agua L5 · la foto L5
#   m4-internal recalls drawn from the above: ¿dónde está? (L8, L10),
#   el agua (L8), está en la mesa (L8)
#   POST-SIM-WALK FIX ROUND (2026-08-25, see es-m4-FINDINGS): +printed
#   «¿dónde está el celular?» (L6); los/las now PRODUCED (possession
#   builds L4/L6); hay/está gets its own cloze lane (L6 hay, L7 está);
#   cp retests el-agua's article + swaps a free m1 ear for a soy check;
#   L10's call differs from L9's date (cuarto + agua-existence beats).
#   cross-module (licensed by m1/m3 printed voicings): una llave (L2),
#   ¿qué es? (L3), hay dos libros (L4), el dinero (L5),
#   hay una silla aquí (L6), la puerta (L7), la casa (L9)
newAtoms:
  - { surface: "está", meaningEn: "is (somewhere)", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "dónde", meaningEn: "where", partOfSpeech: "adverb", kind: "vocab", hint: "DON-deh" }
  - { surface: "mesa", meaningEn: "table", partOfSpeech: "noun", kind: "vocab", gender: "f" }
  - { surface: "cama", meaningEn: "bed", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "🛏️" }
  - { surface: "baño", meaningEn: "bathroom", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "🚽", hint: "ny sound from ñ: BA-nyo" }
  - { surface: "cocina", meaningEn: "kitchen", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "🍳", hint: "soft c, like cero: ko-SEE-na" }
  - { surface: "cuarto", meaningEn: "room", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "🛋️" }
  - { surface: "allí", meaningEn: "there", partOfSpeech: "adverb", kind: "vocab", hint: "ll sounds like y, just like llave: a-YEE" }
  - { surface: "los", meaningEn: "the (el-words, plural)", partOfSpeech: "particle", kind: "particle" }
  - { surface: "las", meaningEn: "the (la-words, plural)", partOfSpeech: "particle", kind: "particle" }
  - { surface: "agua", meaningEn: "water", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "💧", hint: "feminine word — but singular pairs with EL: el agua" }
  - { surface: "foto", meaningEn: "photo", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "📷", hint: "ends in -o but it's a la-word — short for fotografía" }

lessons:
  # ── L1 · hay vs está + mesa/cama debuts. States the module promise. ──
  - n: 1
    template: free
    title: "Say where it is"
    description: "«hay» says something exists — «está» says exactly where it is. Learn both, and find anything."
    steps:
      - kind: info
        id: info-hayesta
        title: "Two different questions"
        body: "«hay» says something EXISTS — «hay una llave». «está» says WHERE — «la llave está aquí», «está en la casa» («en» stretches from in to on: one word). And m2's «es» still NAMES things: «es un lápiz», «la llave es de Ana» — Ana's. Three jobs, three words. This module: find anything in the house, and say exactly where it is."
      - kind: map
        id: map-llaveaqui
        tokens: ["la", "llave", "está", "aquí"]
        pairs:
          - { en: "the", tokenIndex: 0 }
          - { en: "key", tokenIndex: 1 }
          - { en: "is", tokenIndex: 2 }
          - { en: "here", tokenIndex: 3 }
        audioText: "la llave está aquí"
        revealNote: "«la», «llave», «aquí» are all yours from m3 — «está» is the new one, and now you have it too."
        tokenGenders: { 0: "f", 1: "f" }
      - kind: clozeLit
        id: c-estaes1
        es: "la llave está aquí"
        en: "the key is here"
        blank: "está"
        options: ["está", "es"]
        atoms: ["la", "llave", "está", "aquí"]
        why: "«es» would tell you WHAT it is; you already know what it is — you need WHERE, so «está»."
      - kind: map
        id: map-dondellave
        tokens: ["¿dónde", "está", "la", "llave?"]
        pairs:
          - { en: "where", tokenIndex: 0 }
          - { en: "is", tokenIndex: 1 }
          - { en: "the", tokenIndex: 2 }
          - { en: "key", tokenIndex: 3 }
        audioText: "¿dónde está la llave?"
        revealNote: "Same «está» you just met — «dónde» just asks the question first."
        tokenGenders: { 2: "f", 3: "f" }
      - kind: speakLit
        id: sp-dondeesta
        es: "¿dónde está?"
        en: "where is it?"
        atoms: ["dónde", "está"]
      - kind: imageMcq
        id: d-cama
        target: { surface: "la cama", meaningEn: "the bed", emoji: "🛏️" }
        distractors:
          - { surface: "una llave", emoji: "🔑" }
          - { surface: "el celular", emoji: "📱" }
          - { surface: "la puerta", emoji: "🚪" }
      - kind: speakLit
        id: sp-lacama
        es: "la cama"
        en: "the bed"
        atoms: ["la", "cama"]
      - kind: map
        id: map-llavemesa
        tokens: ["la", "llave", "está", "en", "la", "mesa"]
        pairs:
          - { en: "the", tokenIndex: 0 }
          - { en: "key", tokenIndex: 1 }
          - { en: "is", tokenIndex: 2 }
          - { en: "on", tokenIndex: 3 }
          - { en: "the", tokenIndex: 4 }
          - { en: "table", tokenIndex: 5 }
        audioText: "la llave está en la mesa"
        revealNote: "la, llave, está, en are all yours — mesa is the only stranger, and the ending gives it away: -a, so la mesa, just like casa."
        tokenGenders: { 0: "f", 1: "f", 4: "f", 5: "f" }
      - kind: speakLit
        id: sp-estaenlamesa
        es: "está en la mesa"
        en: "it's on the table"
        atoms: ["está", "en", "la", "mesa"]
      - kind: buildLit
        id: b-camaaqui
        es: "la cama está aquí"
        en: "The bed is here"
        atoms: ["la", "cama", "está", "aquí"]
        tiles: ["el", "mesa"]
      - kind: audioWimcq
        id: ear-review1
        target: { surface: "una llave", emoji: "🔑" }
        distractors:
          - { surface: "el libro", emoji: "📖" }
          - { surface: "la puerta", emoji: "🚪" }
      - kind: listenCompLit
        id: lc-dondellave
        es: "¿dónde está la llave?"
        en: "Where's the key?"
        atoms: ["dónde", "está", "la", "llave"]
        distractorsEn:
          - "What is it?"
          - "Where's the house?"
          - "Is there a key?"
      - kind: clozeLit
        id: c-estaes2
        es: "es un lápiz"
        en: "it's a pencil"
        blank: "es"
        options: ["es", "está"]
        atoms: ["es", "un", "lápiz"]
        why: "«¿qué es?» asks WHAT — «es» answers that. «está» would ask WHERE, and that's not the question here."
      - kind: sim
        id: sim-lapiz-mesa
        scene: { emoji: "✏️", title: "Diego's desk", setting: "Diego taps the table, looking for his pencil." }
        turns:
          - id: t1
            npc: { speaker: "Diego", es: "¿Dónde está el lápiz?", audioText: "¿dónde está el lápiz?", gloss: "Where's the pencil?" }
            goal: "Tell him — it's on the table."
            reply:
              mode: choice
              options:
                - { id: "right", text: "está en la mesa" }
                - { id: "wrong1", text: "es un lápiz" }
                - { id: "wrong2", text: "hay un lápiz" }
              correctOptionId: "right"
              audioText: "está en la mesa"
            replyGloss: "It's on the table."
            explanation: "«es» would name it, «hay» would just claim it exists — you were asked WHERE, so «está» wins."
      - kind: matchLit
        id: match
        pairs:
          - { source: "la mesa", target: "the table" }
          - { source: "la cama", target: "the bed" }
          - { source: "está", target: "is (somewhere)" }
          - { source: "dónde", target: "where" }
          - { source: "una llave", target: "a key" }
          - { source: "gracias", target: "thank you" }
      - kind: speakLit
        id: sp-win
        es: "la llave está en la mesa"
        en: "the key's on the table"
        atoms: ["la", "llave", "está", "en", "la", "mesa"]

  # ── L2 · rooms (baño/cocina/cuarto) — Ana loses her keys AGAIN. ──────
  - n: 2
    template: free
    title: "Every room has a name"
    description: "Rooms get their own words — and Ana loses her keys again."
    steps:
      - kind: imageMcq
        id: d-bano
        target: { surface: "el baño", meaningEn: "the bathroom", emoji: "🚽" }
        distractors:
          - { surface: "la cama", emoji: "🛏️" }
          - { surface: "una llave", emoji: "🔑" }
          - { surface: "el celular", emoji: "📱" }
      - kind: speakLit
        id: sp-elbano
        es: "el baño"
        en: "the bathroom"
        atoms: ["el", "baño"]
      - kind: imageMcq
        id: d-cocina
        target: { surface: "la cocina", meaningEn: "the kitchen", emoji: "🍳" }
        distractors:
          - { surface: "el baño", emoji: "🚽" }
          - { surface: "una llave", emoji: "🔑" }
          - { surface: "la puerta", emoji: "🚪" }
      - kind: speakLit
        id: sp-lacocina
        es: "la cocina"
        en: "the kitchen"
        atoms: ["la", "cocina"]
      - kind: clozeLit
        id: c-lacocina
        es: "la cocina está aquí"
        en: "the kitchen is here"
        blank: "la"
        options: ["la", "el"]
        atoms: ["la", "cocina", "está", "aquí"]
        why: "cocina ends in -a: la."
      - kind: map
        id: map-cuarto
        tokens: ["hay", "un", "cuarto", "aquí"]
        pairs:
          - { en: "there is", tokenIndex: 0 }
          - { en: "a", tokenIndex: 1 }
          - { en: "room", tokenIndex: 2 }
          - { en: "here", tokenIndex: 3 }
        audioText: "hay un cuarto aquí"
        revealNote: "hay, un, aquí — all yours. cuarto is the only new face: a room in general (baño and cocina are specific ones)."
        tokenGenders: { 1: "m", 2: "m" }
      - kind: buildLit
        id: b-hayunacocina
        also: ["aquí hay una cocina"]
        es: "hay una cocina aquí"
        en: "There's a kitchen here"
        atoms: ["hay", "una", "cocina", "aquí"]
        tiles: ["el", "la"]
      - kind: audioWimcq
        id: ear-banococina
        target: { surface: "el baño", emoji: "🚽" }
        distractors:
          - { surface: "la cocina", emoji: "🍳" }
          - { surface: "una llave", emoji: "🔑" }
      - kind: clozeLit
        id: c-estaes-bano
        es: "el baño está aquí"
        en: "the bathroom is here"
        blank: "está"
        options: ["está", "es"]
        atoms: ["el", "baño", "está", "aquí"]
        why: "«es» would name the room; you already see it — you need WHERE, so «está»."
      - kind: listenCompLit
        id: lc-cuarto
        es: "hay un cuarto aquí"
        en: "There's a room here."
        atoms: ["hay", "un", "cuarto", "aquí"]
        distractorsEn:
          - "There's a kitchen here."
          - "There's a bathroom here."
          - "There are two rooms here."
      - kind: speakLit
        id: sp-recall-unallave
        es: "una llave"
        en: "a key"
        atoms: []
        cue: recall
      - kind: sim
        id: sim-anakeys2
        scene: { emoji: "🔑", title: "Ana again", setting: "Ana pats her pockets by the bathroom door." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¡Ay! ¿Dónde está la llave?", audioText: "¡ay! ¿dónde está la llave?", gloss: "Argh! Where's the key?" }
            goal: "Take a guess — the bathroom."
            reply:
              mode: choice
              options:
                - { id: "right", text: "está en el baño" }
                - { id: "wrong1", text: "es un baño" }
                - { id: "wrong2", text: "hay un baño" }
              correctOptionId: "right"
              audioText: "está en el baño"
            replyGloss: "It's in the bathroom."
            explanation: "«es» would name the room, «hay» would just say a bathroom exists — you're pointing at WHERE, so «está» wins again."
          - id: t2
            npc: { speaker: "Ana", es: "¡Gracias! ¿Y el celular?", audioText: "¡gracias! ¿y el celular?", gloss: "Thanks! And the phone?" }
            goal: "It's in the kitchen."
            reply:
              mode: build
              tiles: ["está", "en", "la", "cocina", "es", "hay"]
              answer: "está en la cocina"
              alsoAccepted: ["en la cocina"]
            replyGloss: "It's in the kitchen."
      - kind: matchLit
        id: match
        pairs:
          - { source: "el baño", target: "the bathroom" }
          - { source: "la cocina", target: "the kitchen" }
          - { source: "un cuarto", target: "a room" }
          - { source: "está", target: "is (somewhere)" }
          - { source: "una llave", target: "a key" }
          - { source: "gracias", target: "thank you" }
      - kind: speakLit
        id: sp-win
        es: "está en la cocina"
        en: "it's in the kitchen"
        atoms: ["está", "en", "la", "cocina"]

  # ── L3 · aquí vs allí — the second "here". ───────────────────────────
  - n: 3
    template: free
    title: "Here — or over there"
    description: "«allí» is aquí's far partner — tell them apart by ear."
    steps:
      - kind: info
        id: info-aquiuallí
        title: "Two heres"
        body: "«aquí» — right here. «allí» — over there, farther off (ll sounds like y, just like llave: a-YEE). Same «está» question, two different answers."
      - kind: map
        id: map-allidebut
        tokens: ["la", "llave", "está", "allí"]
        pairs:
          - { en: "the", tokenIndex: 0 }
          - { en: "key", tokenIndex: 1 }
          - { en: "is", tokenIndex: 2 }
          - { en: "there", tokenIndex: 3 }
        audioText: "la llave está allí"
        revealNote: "Just like the card said — same «está», new place word."
        tokenGenders: { 0: "f", 1: "f" }
      - kind: speakLit
        id: sp-alli
        es: "allí"
        en: "there"
        atoms: ["allí"]
      - kind: audioWimcq
        id: ear-aquiualli1
        target: { surface: "aquí", emoji: "📍" }
        distractors:
          - { surface: "allí", emoji: "👉" }
          - { surface: "hay", emoji: "🫴" }
      - kind: clozeLit
        id: c-estaes3
        es: "la puerta está allí"
        en: "the door is there"
        blank: "está"
        options: ["está", "es"]
        atoms: ["la", "puerta", "está", "allí"]
        why: "You're pointing at WHERE the door is — «está», not «es»."
      - kind: buildLit
        id: b-camaalli
        es: "la cama está allí"
        en: "The bed is there"
        atoms: ["la", "cama", "está", "allí"]
        tiles: ["el", "aquí"]
      - kind: audioWimcq
        id: ear-aquiualli2
        target: { surface: "allí", emoji: "👉" }
        distractors:
          - { surface: "aquí", emoji: "📍" }
          - { surface: "la cocina", emoji: "🍳" }
      - kind: listenCompLit
        id: lc-mesaalli
        es: "la mesa está allí"
        en: "The table's over there."
        atoms: ["la", "mesa", "está", "allí"]
        distractorsEn:
          - "The table's here."
          - "The bed's over there."
          - "There's a table there."
      - kind: speakLit
        id: sp-recall-quees
        es: "¿qué es?"
        en: "what is it?"
        atoms: []
        cue: recall
      - kind: sim
        id: sim-sofia-alli
        scene: { emoji: "👉", title: "Sofía points", setting: "Sofía points across the room." }
        turns:
          - id: t1
            npc: { speaker: "Sofía", es: "¿Está aquí o allí?", audioText: "¿está aquí o allí?", gloss: "Is it here or there?" }
            goal: "Say — it's over there."
            reply:
              mode: choice
              options:
                - { id: "right", text: "está allí" }
                - { id: "wrong1", text: "está aquí" }
                - { id: "wrong2", text: "es allí" }
              correctOptionId: "right"
              audioText: "está allí"
            replyGloss: "It's over there."
            explanation: "aquí/allí is about distance, not identity — «es» never plays here."
      - kind: matchLit
        id: match
        pairs:
          - { source: "allí", target: "there" }
          - { source: "aquí", target: "here" }
          - { source: "una llave", target: "a key" }
          - { source: "el baño", target: "the bathroom" }
          - { source: "está", target: "is (somewhere)" }
          - { source: "buenos días", target: "good morning" }
      - kind: speakLit
        id: sp-win
        es: "la llave está allí"
        en: "the key's over there"
        atoms: ["la", "llave", "está", "allí"]

  # ── L4 · one becomes many — los/las + the plural rule + big numbers. ─
  - n: 4
    template: free
    title: "One becomes many"
    description: "El libro becomes los libros — the -s you noticed in m3 finally gets its rule, and ocho/nueve/diez go to work."
    steps:
      - kind: info
        id: info-plural
        title: "One becomes many"
        body: "Add -s, and the article grows with it: el libro → los libros, la llave → las llaves. You noticed the -s back in m3's «hay dos libros» — now you know why: los and las ride along."
      - kind: clozeLit
        id: c-loscuartos
        es: "los cuartos"
        en: "the rooms"
        blank: "los"
        options: ["los", "las"]
        atoms: ["los", "cuarto"]
      - kind: speakLit
        id: sp-loslibros
        es: "los libros"
        en: "the books"
        atoms: ["los", "libro"]
      - kind: clozeLit
        id: c-lascamas4
        es: "las camas"
        en: "the beds"
        blank: "las"
        options: ["las", "los"]
        atoms: ["las", "cama"]
      - kind: speakLit
        id: sp-lasllaves
        es: "las llaves"
        en: "the keys"
        atoms: ["las", "llave"]
      - kind: buildLit
        id: b-hayochollaves
        es: "hay ocho llaves"
        en: "There are eight keys"
        atoms: ["hay", "ocho", "llave"]
        tiles: ["nueve", "diez"]
      - kind: audioWimcq
        id: ear-numeros1
        target: { surface: "nueve", emoji: "9️⃣" }
        distractors:
          - { surface: "ocho", emoji: "8️⃣" }
          - { surface: "diez", emoji: "🔟" }
      - kind: listenBuildLit
        id: lb-nuevellaves
        es: "hay nueve llaves en la casa"
        en: "There are nine keys in the house"
        atoms: ["hay", "nueve", "llave", "en", "la", "casa"]
        tiles: ["ocho", "diez"]
      - kind: buildLit
        id: b-loslibrosana
        es: "los libros de Ana"
        en: "Ana's books"
        atoms: ["los", "libro", "de"]
        tiles: ["las", "el"]
      - kind: speakLit
        id: sp-recall-haydoslibros
        es: "hay dos libros"
        en: "there are two books"
        atoms: []
        cue: recall
      - kind: sim
        id: sim-diezllaves
        scene: { emoji: "🧮", title: "Ana counts them all", setting: "Ana lines up every key she owns on the table." }
        turns:
