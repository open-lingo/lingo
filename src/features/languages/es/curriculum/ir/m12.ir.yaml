        es: "no quiero comprar esos zapatos"
        en: "I don't want to buy those shoes"
        atoms: ["no", "quiero", "comprar", "esos", "zapato"]
        tiles: ["esas", "cuestan"]
      - kind: clozeLit
        id: l10-c-3
        es: "esos zapatos son caros"
        en: "those shoes are expensive"
        blank: "esos"
        options: ["esos", "esas"]
        atoms: ["esos", "zapato", "caro"]
        why: "Over there, more than one, and «zapatos» are el-words — «esos». The judgement counts them too: «caros»."
      - kind: matchLit
        id: l10-match
        pairs:
          - { source: "este zapato", target: "this shoe" }
          - { source: "esas faldas", target: "those skirts" }
          - { source: "cuánto", target: "how much" }
          - { source: "cuestan", target: "they cost" }
          - { source: "barato", target: "cheap" }
          - { source: "comprar", target: "to buy" }
          - { source: "el mercado", target: "the market" }
      # ── THE PAYOFF ─────────────────────────────────────────────────────
      #   The full transaction, in the order a real one happens: point (t1),
      #   ask the price (t2), react to it (t3), decline the expensive thing
      #   (t4), buy the cheap one (t5). t1–t4 run the PLURAL chain end to
      #   end — «estos zapatos» → «cuestan» → «son caros» → «cuestan quince»
      #   — because that is the agreement the module is actually for; t5
      #   drops to the singular so the last thing the learner says is the
      #   module's whole thesis in one word. Sofía is holding the skirt, so
      #   for her it is «esta falda»; from where you stand it is «esa
      #   falda». Same skirt, different distance.
      #
      #   NB: `esSurfaces` returns NOTHING for dialogue_sim, so this step is
      #   invisible to the provenance and production gates. Every surface it
      #   uses — «son», the plural judgements, «esa/esta» — is carried by a
      #   graded step above it (l10-b-2, l10-c-3, l10-lb-1, l10-b-3).
      #   Nothing follows it; the module ends there.
      - kind: sim
        id: l10-sim-compra
        scene: { emoji: "🛒", title: "One thing, one price", setting: "Sofía has the shoes out on the table and the skirts on the rack behind her. You have fifteen in your pocket." }
        turns:
          - id: t1
            npc: { speaker: "Sofía", es: "¡Hola, Sam! ¿Qué quieres?", audioText: "¡hola, Sam! ¿qué quieres?", gloss: "Hi Sam! What would you like?" }
            goal: "Point at the shoes on the table."
            reply:
              mode: build
              tiles: ["quiero", "comprar", "estos", "zapatos", "este", "esa"]
              answer: "quiero comprar estos zapatos"
              alsoAccepted: ["quiero estos zapatos"]
            replyGloss: "I want to buy these shoes."
          - id: t2
            npc: { speaker: "Sofía", es: "Son muy bonitos.", audioText: "son muy bonitos.", gloss: "They're very nice." }
            goal: "Ask how much they cost."
            reply:
              mode: choice
              options:
                - { id: "right", text: "¿cuánto cuestan?" }
                - { id: "wrong1", text: "¿cuánto cuesta?" }
                - { id: "wrong2", text: "¿dónde está?" }
              correctOptionId: "right"
              audioText: "¿cuánto cuestan?"
            replyGloss: "How much are they?"
            explanation: "Two shoes, so the price verb counts them: «cuestan»."
          - id: t3
            npc: { speaker: "Sofía", es: "Quince.", audioText: "quince.", gloss: "Fifteen." }
            goal: "Say they are expensive."
            reply:
              mode: choice
              options:
                - { id: "right", text: "son muy caros" }
                - { id: "wrong1", text: "son muy caras" }
                - { id: "wrong2", text: "es muy caro" }
              correctOptionId: "right"
              audioText: "son muy caros"
            replyGloss: "They're very expensive."
            explanation: "More than one thing, so «son», not «es» — and «zapatos» are el-words, so «caros». The whole line counts."
          - id: t4
            npc: { speaker: "Sofía", es: "¿Quieres comprar esos zapatos?", audioText: "¿quieres comprar esos zapatos?", gloss: "Do you want to buy those shoes?" }
            goal: "Say no — they cost too much."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no, cuestan quince" }
                - { id: "wrong1", text: "no, cuesta quince" }
                - { id: "wrong2", text: "sí, quiero comprar esos zapatos" }
              correctOptionId: "right"
              audioText: "no, cuestan quince"
            replyGloss: "No — they're fifteen."
            explanation: "Sofía is looking at the shoes in front of YOU, so for her they are «esos zapatos». The shoes have not moved; the speaker has."
          - id: t5
            npc: { speaker: "Sofía", es: "Esta falda cuesta diez.", audioText: "esta falda cuesta diez.", gloss: "This skirt is ten." }
            goal: "Buy that skirt."
            reply:
              mode: build
              tiles: ["quiero", "comprar", "esa", "falda", "esta", "camisa", "esos"]
              answer: "quiero comprar esa falda"
              alsoAccepted: ["quiero esa falda"]
            replyGloss: "I want to buy that skirt."
            explanation: "Sofía is holding it, so she says «esta falda». You are across the table, so you say «esa falda». Same skirt, different distance — that is the whole module, and you just spent it on something."

