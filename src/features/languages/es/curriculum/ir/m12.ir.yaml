        atoms: ["estos", "zapato", "cuestan", "doce"]
        why: "Shoes come in pairs, and the price verb counts them: «cuestan»."
      - kind: buildLit
        id: l10-b-1
        es: "esa camisa roja es muy cara"
        en: "that red shirt is very expensive"
        atoms: ["esa", "camisa", "rojo", "es", "muy", "caro"]
        tiles: ["ese", "barata"]
      # ── review tail 1 — m9's shop, the place all of this happens ────────
      - kind: audioWimcq
        id: l10-ear-1
        target: { surface: "la tienda", emoji: "🏪" }
        distractors:
          - { surface: "el mercado", emoji: "🛒" }
          - { surface: "la escuela", emoji: "🏫" }
      - kind: listenBuildLit
        id: l10-lb-1
        es: "¿cuánto cuesta esa falda?"
        en: "how much does that skirt cost?"
        atoms: ["cuánto", "cuesta", "esa", "falda"]
        tiles: ["cuestan", "esas"]
      - kind: clozeLit
        id: l10-c-2
        es: "quiero comprar ese zapato"
        en: "I want to buy that shoe"
        blank: "ese"
        options: ["ese", "esa"]
        atoms: ["quiero", "comprar", "ese", "zapato"]
        why: "«zapato» is an el-word, so the far pointer is «ese»."
      # ── review tail 2 — m3's money, cued cold (m3 L5 printed it) ────────
      - kind: speakLit
        id: l10-sp-recall-1
        es: "el dinero"
        en: "the money"
        atoms: []
        cue: recall
      - kind: textMcq
        id: l10-tm-1
        target: "cuánto"
        distractors: ["cuesta", "cuestan", "comprar"]
      - kind: buildLit
        id: l10-b-2
        es: "esas camisas son caras"
        en: "those shirts are expensive"
        atoms: ["esas", "camisa", "caro"]
        tiles: ["esos", "baratas"]
      # ── review tail 3 — m3 again, by ear only ───────────────────────────
      - kind: audioWimcq
        id: l10-ear-2
        target: { surface: "el libro", emoji: "📖" }
        distractors:
          - { surface: "el papel", emoji: "📄" }
          - { surface: "la pluma", emoji: "🖊️" }
      - kind: listenCompLit
        id: l10-lc-1
        es: "esos zapatos cuestan quince, pero esta falda cuesta diez"
        en: "those shoes cost fifteen, but this skirt costs ten."
        atoms: ["esos", "zapato", "cuestan", "quince", "pero", "esta", "falda", "cuesta", "diez"]
        distractorsEn:
          - "These shoes cost ten, but that skirt costs fifteen."
          - "Those shoes cost fifteen, and this skirt costs fifteen too."
          - "That shirt costs fifteen, but this skirt costs ten."
      # ── review tail 4 — m11's question, cued cold (m11 L5 printed it) ───
      - kind: speakLit
        id: l10-sp-recall-2
        es: "¿vives aquí?"
        en: "do you live here?"
        atoms: []
