module: m8
title: "La semana — days & when"
frame: none
throughModule: m7
expectedLessonCount: 10
checkpoint: 8

# ES m8 — «La semana»: the seven days, hoy/mañana, ¿cuándo?, the el-as-"on"
# trick, the día exception, and once–quince (with the dos/doce, tres/trece
# ear confusion as the module's signature discrimination). Fifth §13-
# doctrine IR module (m3 is the exemplar; m4/m7 the freshest siblings).
#
# SPINE PROVENANCE: atom inventory + arc PINNED by
# docs/es-m4-m10-wave-2026-08-24.md ("m8 — La semana"). 17 atoms: lunes,
# martes, miércoles, jueves, viernes, sábado, domingo, semana, hoy,
# mañana, ¿cuándo?, día, once, doce, trece, catorce, quince. Nothing
# added, dropped or renamed against that spec.
#
# DOCTRINE NOTES:
#   - Atom allocation across lessons (17 total, none repeated): L1 hoy +
#     lunes/martes/miércoles (4) · L2 ¿cuándo? + jueves/viernes (3) · L3
#     sábado/domingo/semana (3) · L4 once/doce/trece/catorce/quince (5) ·
#     L5 mañana/día (2). L6–L10 are zero-new (matches the m4/m7 shape:
#     every new atom lands by L5, L6 is already integration).
#   - Days interleave 3/2/2 across L1–L3 (lunes/martes/miércoles ·
#     jueves/viernes · sábado/domingo), never a lesson that is only days
#     — each of L1–L3 also carries hoy/¿cuándo?/semana or a numbers-
#     review break, and L2 explicitly breaks with an m1-numbers ear step
#     (the "numbers break" the spec names).
#   - «el lunes» = "on Monday" gets ONE card line (L2's contrast card) and
#     then its own alternating discrimination lane module-wide: el (=on,
#     no verb) vs es (=identity, "today IS Monday") clozes, both halves
#     live, tallied below. Day names are bare nouns everywhere — no
#     article surfaces except this el-as-"on" construction; they are
#     masculine and never capitalized in any surface, card, or gloss.
#   - día is the -a-but-el exception, debuted in L5 by MAP ELIMINATION
#     («es un día bonito» — bonito m6-licensed, adjective-after-noun
#     m6-licensed word order) with an explicit «buenos días» callback
#     (m1's own printed voicing was hiding the exception the whole
#     time). Its discrimination is secret-side el/la trials (never an
#     ear lane — día has no honest emoji and isn't part of the
#     day-family ear confusion).
#   - mañana debuts in L5 teaching "tomorrow"; the card notes in ONE line
#     that it also means "morning" and that «buenos días» stays the
#     dedicated morning greeting — the morning sense is never tested.
#     hoy/mañana run as an alternating, both-halves-live lane from L5
#     on (cloze + audioWimcq + one build), continuing through cp/summit/
#     mastery.
#   - THE EAR LANE (L4, the module's signature beat): once/doce/trece/
#     catorce/quince debut ONE AT A TIME via counting maps («hay X
#     nombre»-shaped sentences, the m4 hay+number+noun pattern, m1's
#     one-new-word-per-map counting convention) — never imageMcq, so no
#     digit emoji ever front-loads a debut (the m1 confirmation-walk
#     fix this module inherits: "a digit emoji is a perfect printed
#     translation"). Digit emoji appear ONLY inside audio-prompted MCQs
#     (word_image_mcq in audio mode): the existing single-keycap emoji
#     for dos (2️⃣) and tres (3️⃣, both m1) sit against COMPOSITE two-
#     keycap emoji built the same way for the new teens — once 1️⃣1️⃣,
#     doce 1️⃣2️⃣, trece 1️⃣3️⃣, catorce 1️⃣4️⃣, quince 1️⃣5️⃣ — so the ear,
#     not the printed digit, is what the learner is trained on. Note for
#     registration: `registerEsDoctrinePins`'s digit allowlist is
#     `["0️⃣"…"9️⃣","🔟"]`; extend it with the five composite strings
#     above for m8, or its "digit options demand audio mode" check will
#     silently no-op on every m8 teen (they're already audio-prompted by
#     construction — the allowlist just won't SEE it without the fix).
#   - dos/doce and tres/trece are the module's THE discrimination lanes,
#     run as paired audioWimcq steps with both halves live (a doce-
#     correct step pairs dos+tres as distractors so the same two ear
#     confusions train together; a dos-correct step pairs doce+trece).
#     Tallied below; the lane continues through L6–L10 review.
#   - Days have no honest single-frame emoji (calendar art can't
#     distinguish "Tuesday" from "Thursday" any more than a plain box
#     can), so no day ever gets an imageMcq debut — every day debuts by
#     MAP ELIMINATION (one new day per map, echoing m4's mesa/cuarto
#     treatment) or, for jueves, a self-cueing micro-sim (¿cuándo?
#     itself creates the reply slot). The audioWimcq ear-lane art is
#     honest-by-association, never a sound-pun: lunes 🌛 (Spanish's own
#     "day of the moon" etymology — the same root English "Monday"
#     shares, not an English pun), martes ⚔️ (day of Mars), miércoles
#     🪽 (day of Mercury, winged messenger), jueves ⚡ (day of Jupiter),
#     viernes 💘 (day of Venus), sábado 🕯️ (sabbath/rest), domingo ⛪
#     (the Lord's day) — decorative support only: the printed Spanish
#     word is always visible on the option card regardless of audio
#     mode, so no answer ever depends on reading these icons correctly.
#     hoy 📌 / mañana ⏭️ follow the same convention (a pin on "now", a
#     skip-forward to "next"), chosen to avoid colliding with 📍 (aquí,
#     m4) and ☀️ (buenas tardes, m7).
#   - Planning payoff (L9 summit): «el sábado quiero un café» is the
#     module's own required line, and — following the m7 «la cuenta,
#     por favor» precedent (held back for ITS summit) — this exact
#     sentence is never printed before L9. Every earlier el-day beat
#     uses a different verb/noun so the summit's own build-mode
#     production is the learner's first time producing it. The summit
#     scene puts Sofía outside Carmen's café (m7 cast/stage); L10's
#     mastery differs beat-by-beat (María, by text, a different day —
#     domingo not sábado — a different food, per the m4/m5 twin-sim
#     class fix).
#   - Ages postscript: exactly ONE beat (L6) uses a plausible age over
#     ten — «mi hermano tiene trece años» (m5's hermano/tiene/años +
#     m8's trece) — never a grandparent given a child's age.
#   - Nouns wear their article on every surface («la semana», never bare
#     «semana»); atoms stay bare with `gender` (m3 registry convention).
#     Day names are the one noun class that mostly appears BARE (no
#     article) outside the el-as-"on" construction — that bareness is
#     itself the L1/L2 teaching point, not an omission.
#   - Cast: Sam (learner), Ana, Diego, Sofía, María, Carmen (m7's café
#     owner, back on stage for the summit). NPC lines are natural
#     Spanish throughout; no line anywhere uses «con» (still not in any
#     inventory through m8).
#   - Discrimination lanes (§13.9 law 4, alternating, both halves live —
#     tallies below are machine-counted from the final IR, not estimated):
#     el/es (day-naming vs "on"-day) clozes: 5 el-correct : 4 es-correct
#     across the module; days by EAR — martes/jueves (2 martes-correct :
#     2 jueves-correct) and sábado/domingo (2 sábado-correct : 2 domingo-
#     correct); hoy/mañana by EAR (3 hoy-correct : 3 mañana-correct,
#     plus 2 more cloze/build instances splitting the same way); dos/doce
#     by EAR (3 doce-correct : 2 dos-correct, tres riding along as an
#     extra distractor); tres/trece by EAR (3 trece-correct : 2
#     tres-correct, doce/catorce riding along); día's el/la secret-side
#     (4 el-correct trials, no la-correct trial exists — la is only ever
#     the trap, matching foto's
#     m4 treatment where the exception itself has no "other side" to
#     balance).
#
# VOICING LEDGER (printed speak → licenses later cue:"recall"):
#   hoy es lunes L1 · ¿cuándo? L2 · la semana L3 · el sábado L3 ·
#   quince L4 · mañana L5
#   m8-internal recalls drawn from the above: ¿cuándo? (L10), la semana
#   (L9 lc, L10 lb — printed content reused, not cue:recall since it's a
#   fresh listen/build context, not a bare speaking step), el sábado
#   (echoed inside L9's build, not a recall speak)
#   cross-module (licensed by m1–m7 printed voicings, per the wave doc):
#   buenos días (L1, L5 callback), ¿cómo estás? (L2), la cocina (L2),
#   mi familia (L3), el agua (L4), muy bonito (L5), el carro rojo (L6,
#   L9), ¿dónde está? (L8), mi familia (L8), la cuenta por favor (L8),
#   quiero un café / tengo hambre / tengo sed (throughout, m7 payoff
#   verbs carrying every planning beat).
newAtoms:
  - { surface: "lunes", meaningEn: "Monday", partOfSpeech: "noun", kind: "vocab", gender: "m" }
  - { surface: "martes", meaningEn: "Tuesday", partOfSpeech: "noun", kind: "vocab", gender: "m" }
  - { surface: "miércoles", meaningEn: "Wednesday", partOfSpeech: "noun", kind: "vocab", gender: "m", hint: "MYER-ko-les" }
  - { surface: "jueves", meaningEn: "Thursday", partOfSpeech: "noun", kind: "vocab", gender: "m", hint: "j sounds like h: HWEH-ves" }
  - { surface: "viernes", meaningEn: "Friday", partOfSpeech: "noun", kind: "vocab", gender: "m" }
  - { surface: "sábado", meaningEn: "Saturday", partOfSpeech: "noun", kind: "vocab", gender: "m" }
  - { surface: "domingo", meaningEn: "Sunday", partOfSpeech: "noun", kind: "vocab", gender: "m" }
  - { surface: "semana", meaningEn: "week", partOfSpeech: "noun", kind: "vocab", gender: "f" }
  - { surface: "hoy", meaningEn: "today", partOfSpeech: "adverb", kind: "vocab" }
  - { surface: "mañana", meaningEn: "tomorrow", partOfSpeech: "adverb", kind: "vocab", hint: "also means 'morning' — but buenos días stays the greeting" }
  - { surface: "¿cuándo?", meaningEn: "when?", partOfSpeech: "phrase", kind: "phrase", hint: "KWAN-do" }
  - { surface: "día", meaningEn: "day", partOfSpeech: "noun", kind: "vocab", gender: "m", hint: "ends in -a but takes EL — same exception hiding inside buenos días" }
  - { surface: "once", meaningEn: "eleven", partOfSpeech: "noun", kind: "vocab" }
  - { surface: "doce", meaningEn: "twelve", partOfSpeech: "noun", kind: "vocab" }
  - { surface: "trece", meaningEn: "thirteen", partOfSpeech: "noun", kind: "vocab" }
  - { surface: "catorce", meaningEn: "fourteen", partOfSpeech: "noun", kind: "vocab" }
  - { surface: "quince", meaningEn: "fifteen", partOfSpeech: "noun", kind: "vocab" }

lessons:
  # ── L1 · hoy + lunes/martes/miércoles debut. States the promise. ─────
  - n: 1
    template: free
    title: "The week begins"
    description: "«Hoy» — today. Learn the first three days, and say what day it is."
    steps:
      - kind: info
        id: info-hoydias
        title: "Say what day it is"
        body: "«hoy» — today. «hoy es lunes» — today is Monday. Three to start: lunes, martes, miércoles — Monday, Tuesday, Wednesday. Always lowercase in Spanish, and always masculine. This module: name any day, and say when things happen."
      - kind: audioWimcq
        id: ear-lunes
        target: { surface: "lunes", emoji: "🌛" }
        distractors:
          - { surface: "martes", emoji: "⚔️" }
          - { surface: "miércoles", emoji: "🪽" }
      - kind: map
        id: map-hoyeslunes
        tokens: ["hoy", "es", "lunes"]
        pairs:
          - { en: "today", tokenIndex: 0 }
          - { en: "is", tokenIndex: 1 }
          - { en: "Monday", tokenIndex: 2 }
        audioText: "hoy es lunes"
        revealNote: "«es» is yours from m2 — «hoy» and «lunes» are the new pair: today IS Monday."
        tokenGenders: { 2: "m" }
      - kind: speakLit
        id: sp-hoyeslunes
        es: "hoy es lunes"
        en: "today is Monday"
        atoms: ["hoy", "es", "lunes"]
      - kind: buildLit
        id: b-hoyesmartes
        es: "hoy es martes"
        en: "today is Tuesday"
        atoms: ["hoy", "es", "martes"]
        tiles: ["lunes", "está"]
      - kind: audioWimcq
        id: ear-martes
        target: { surface: "martes", emoji: "⚔️" }
        distractors:
          - { surface: "lunes", emoji: "🌛" }
          - { surface: "miércoles", emoji: "🪽" }
      - kind: speakLit
        id: sp-miercoles
        es: "miércoles"
        en: "Wednesday"
        atoms: ["miércoles"]
      - kind: clozeLit
        id: c-esesta1
        es: "hoy es miércoles"
        en: "today is Wednesday"
        blank: "es"
        options: ["es", "está"]
        atoms: ["hoy", "es", "miércoles"]
        why: "Naming what day it is is identity — «es», not «está»."
      - kind: audioWimcq
        id: ear-miercoles
        target: { surface: "miércoles", emoji: "🪽" }
        distractors:
          - { surface: "lunes", emoji: "🌛" }
          - { surface: "martes", emoji: "⚔️" }
      - kind: listenCompLit
        id: lc-hoymartes
        es: "hoy es martes"
        en: "Today is Tuesday."
        atoms: ["hoy", "es", "martes"]
        distractorsEn:
          - "Today is Monday."
          - "Today is Wednesday."
          - "Tomorrow is Tuesday."
      - kind: speakLit
        id: sp-recall-buenosdias
        es: "buenos días"
        en: "good morning"
        atoms: []
        cue: recall
      - kind: sim
        id: sim-ana-quedia
        scene: { emoji: "📅", title: "Ana isn't sure", setting: "It's Tuesday morning. Ana's checking her calendar." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Hoy es lunes?", audioText: "¿hoy es lunes?", gloss: "Is today Monday?" }
            goal: "Correct her — it's Tuesday."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no, es martes" }
                - { id: "wrong1", text: "sí, es lunes" }
                - { id: "wrong2", text: "es miércoles" }
              correctOptionId: "right"
              audioText: "no, es martes"
            replyGloss: "No, it's Tuesday."
      - kind: matchLit
        id: match
        pairs:
          - { source: "lunes", target: "Monday" }
          - { source: "martes", target: "Tuesday" }
          - { source: "miércoles", target: "Wednesday" }
          - { source: "hoy", target: "today" }
          - { source: "es", target: "is" }
          - { source: "gracias", target: "thank you" }
      - kind: speakLit
        id: sp-win
        es: "hoy es martes"
        en: "today is Tuesday"
        atoms: ["hoy", "es", "martes"]

  # ── L2 · ¿cuándo? debut + jueves/viernes + numbers break. ────────────
  - n: 2
    template: free
    title: "When is it?"
    description: "«¿Cuándo?» — when? Answer with el: «el lunes» — on Monday."
    steps:
      - kind: info
        id: info-cuandoel
        title: "Asking when — and answering 'on'"
        body: "«¿cuándo?» — when? Answer it with el + the day: «el lunes» — on Monday. Spanish drops any separate word for 'on' — the el does that work by itself. Two new days land here too: jueves — Thursday, viernes — Friday."
      - kind: map
        id: map-cuandoquieres
        tokens: ["¿cuándo", "quieres", "un", "café?"]
        pairs:
          - { en: "when", tokenIndex: 0 }
          - { en: "do you want", tokenIndex: 1 }
          - { en: "a", tokenIndex: 2 }
          - { en: "coffee", tokenIndex: 3 }
        audioText: "¿cuándo quieres un café?"
        revealNote: "quieres, un, café are all yours from m7 — ¿cuándo? is the only new one: when?"
        tokenGenders: { 2: "m", 3: "m" }
      - kind: speakLit
        id: sp-cuando
        es: "¿cuándo?"
        en: "when?"
        atoms: ["¿cuándo?"]
      - kind: clozeLit
        id: c-elvses1
        es: "el lunes quiero un café"
        en: "on Monday I want a coffee"
        blank: "el"
        options: ["el", "es"]
        atoms: ["el", "lunes", "quiero", "un", "café"]
        why: "ON Monday — el, not the identity verb es."
      - kind: sim
        id: sim-diego-cuandojueves
        scene: { emoji: "☕", title: "Diego wants to know", setting: "Diego's making a list of who wants coffee, and when." }
        turns:
          - id: t1
            npc: { speaker: "Diego", es: "¿Cuándo quieres café?", audioText: "¿cuándo quieres café?", gloss: "When do you want coffee?" }
            goal: "Say Thursday."
            debut: true
            reply:
              mode: choice
              options:
                - { id: "right", text: "el jueves" }
                - { id: "wrong1", text: "el lunes" }
                - { id: "wrong2", text: "es jueves" }
              correctOptionId: "right"
              audioText: "el jueves"
            replyGloss: "On Thursday."
      - kind: map
        id: map-viernes
        tokens: ["el", "viernes", "quiero", "un", "té"]
        pairs:
          - { en: "on", tokenIndex: 0 }
          - { en: "Friday", tokenIndex: 1 }
          - { en: "I want", tokenIndex: 2 }
          - { en: "a", tokenIndex: 3 }
          - { en: "tea", tokenIndex: 4 }
        audioText: "el viernes quiero un té"
        revealNote: "el, quiero, un, té are all yours — viernes is the only stranger."
        tokenGenders: { 0: "m", 1: "m", 3: "m", 4: "m" }
      - kind: audioWimcq
        id: ear-juevesviernes1
        target: { surface: "jueves", emoji: "⚡" }
        distractors:
          - { surface: "viernes", emoji: "💘" }
          - { surface: "martes", emoji: "⚔️" }
      - kind: speakLit
        id: sp-elviernes
        es: "el viernes"
        en: "on Friday"
        atoms: ["el", "viernes"]
      - kind: audioWimcq
        id: ear-juevesviernes2
        target: { surface: "viernes", emoji: "💘" }
        distractors:
          - { surface: "jueves", emoji: "⚡" }
          - { surface: "miércoles", emoji: "🪽" }
      - kind: clozeLit
        id: c-elvses2
        es: "hoy es jueves"
        en: "today is Thursday"
        blank: "es"
        options: ["es", "el"]
        atoms: ["hoy", "es", "jueves"]
        why: "Naming the day itself — «es», not the on-day «el»."
      - kind: audioWimcq
        id: ear-numbersbreak
        target: { surface: "siete", emoji: "7️⃣" }
        distractors:
          - { surface: "seis", emoji: "6️⃣" }
          - { surface: "ocho", emoji: "8️⃣" }
      - kind: speakLit
        id: sp-recall-lacocina
        es: "la cocina"
        en: "the kitchen"
        atoms: []
        cue: recall
      - kind: sim
        id: sim-sofia-cuandoviernes
        scene: { emoji: "☕", title: "Sofía checks in", setting: "Sofía's planning her own week too." }
        turns:
          - id: t1
            npc: { speaker: "Sofía", es: "¿Cuándo quieres café?", audioText: "¿cuándo quieres café?", gloss: "When do you want coffee?" }
            goal: "Say Friday."
            reply:
              mode: choice
              options:
                - { id: "right", text: "el viernes" }
                - { id: "wrong1", text: "el jueves" }
                - { id: "wrong2", text: "es viernes" }
              correctOptionId: "right"
              audioText: "el viernes"
            replyGloss: "On Friday."
          - id: t2
            npc: { speaker: "Sofía", es: "¡Genial! Hasta luego.", audioText: "¡genial! hasta luego.", gloss: "Great! See you later." }
            goal: "Say goodbye back."
            reply:
              mode: choice
              options:
                - { id: "right", text: "hasta luego" }
                - { id: "also", text: "adiós" }
                - { id: "wrong1", text: "buenos días" }
              correctOptionId: "right"
              alsoCorrectOptionIds: ["also"]
              audioText: "hasta luego"
            replyGloss: "See you later."
      - kind: matchLit
        id: match
        pairs:
          - { source: "¿cuándo?", target: "when?" }
          - { source: "jueves", target: "Thursday" }
          - { source: "viernes", target: "Friday" }
          - { source: "el lunes", target: "on Monday" }
          - { source: "hoy", target: "today" }
          - { source: "gracias", target: "thank you" }
      - kind: speakLit
        id: sp-win
        es: "el jueves quiero un café"
        en: "on Thursday I want a coffee"
        atoms: ["el", "jueves", "quiero", "un", "café"]

  # ── L3 · the weekend — sábado/domingo + semana. ──────────────────────
  - n: 3
    template: free
    title: "The weekend arrives"
    description: "«La semana» — the week. And the two days everyone waits for."
    steps:
      - kind: info
        id: info-semana
        title: "The week, and the weekend"
        body: "«la semana» — the week. Two more days: sábado, domingo — Saturday, Sunday. The weekend everyone's waiting for."
      - kind: map
        id: map-sabado
        tokens: ["el", "sábado", "tengo hambre"]
        pairs:
          - { en: "on", tokenIndex: 0 }
          - { en: "Saturday", tokenIndex: 1 }
          - { en: "I'm hungry", tokenIndex: 2 }
        audioText: "el sábado tengo hambre"
        revealNote: "el, tengo hambre are yours from m5/m7 — sábado is the only stranger."
        tokenGenders: { 0: "m", 1: "m" }
      - kind: speakLit
        id: sp-elsabado
        es: "el sábado"
        en: "on Saturday"
        atoms: ["el", "sábado"]
      - kind: map
        id: map-domingo
        tokens: ["hoy", "es", "domingo"]
        pairs:
          - { en: "today", tokenIndex: 0 }
          - { en: "is", tokenIndex: 1 }
          - { en: "Sunday", tokenIndex: 2 }
        audioText: "hoy es domingo"
        revealNote: "hoy, es are yours — domingo is the new one."
        tokenGenders: { 2: "m" }
      - kind: audioWimcq
        id: ear-sabadodomingo1
        target: { surface: "sábado", emoji: "🕯️" }
        distractors:
          - { surface: "domingo", emoji: "⛪" }
          - { surface: "viernes", emoji: "💘" }
      - kind: speakLit
        id: sp-lasemana
        es: "la semana"
        en: "the week"
        atoms: ["la", "semana"]
      - kind: clozeLit
        id: c-lasemana
        es: "la semana está aquí"
        en: "the week is here"
        blank: "la"
        options: ["la", "el"]
        atoms: ["la", "semana", "está", "aquí"]
        why: "semana ends in -a: la."
      - kind: audioWimcq
        id: ear-sabadodomingo2
        target: { surface: "domingo", emoji: "⛪" }
        distractors:
          - { surface: "sábado", emoji: "🕯️" }
          - { surface: "jueves", emoji: "⚡" }
      - kind: buildLit
