        audioText: "me acuesto tarde"
        revealNote: "«acostarse» is to go to bed, and its o does what «dormir» did in «duermo»: it opens into ue when the stress lands on it. «me acuesto» — I go to bed. The pointer is the same «me» you put on every verb this module."
