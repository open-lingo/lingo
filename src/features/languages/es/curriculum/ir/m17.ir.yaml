        id: l7-info-dosverbos
        title: "Two verbs, one pointer — in front of the first"
        body: "«me quiero levantar» — I want to get up. Two verbs: «quiero» carries the person, its -o says I; «levantar» is bare, the plain name of the action. The pointer goes with the verb that carries the person, so it stands in front of «quiero». That is exactly what «lo» did in «lo quiero ver». Same for showering: «me quiero duchar», and with «no» outside: «no me quiero duchar». The bare verb never takes a pointer of its own here, and the pointer never sits between the two verbs."
      - kind: clozeLit
        id: l7-c-anasequierelevantar
        es: "Ana se quiere levantar tarde"
        en: "Ana wants to get up late"
        blank: "se"
        options: ["se", "me", "te"]
        atoms: ["quiere", "levantar", "tarde"]
        why: "Ana is a she, so «se» — and it goes in front of «quiere», the verb that says who wants. «levantar» stays bare."
      - kind: buildLit
        id: l7-b-mequieroducharahora
        also: ["ahora me quiero duchar"]
        es: "me quiero duchar ahora"
        en: "I want to shower now"
        atoms: ["quiero", "duchar", "ahora"]
        tiles: ["ducho", "se"]
      - kind: listenCompLit
        id: l7-lc-nomequieroducharhoy
        es: "no me quiero duchar hoy"
        en: "I don't want to shower today."
        atoms: ["quiero", "duchar", "hoy"]
        distractorsEn:
          - "I want to shower today."
          - "I don't want to get up today."
          - "She doesn't want to shower today."
      # The ghosts: pointer between the verbs, pointer after, person carried
      # twice. Distractor slots only; correct option is three tokens.
      - kind: mcq
        id: l7-q-mequierolevantar
        prompt: "Which one means 'I want to get up'?"
        correct: "me quiero levantar"
        distractors: ["quiero me levantar", "me quiero levanto", "me levantar quiero"]
        atoms: ["quiero", "levantar"]
        why: "Pointer, then the verb that carries the person, then the bare verb: «me quiero levantar». «quiero me» puts the pointer between the verbs; «me quiero levanto» carries the person twice; the last one scrambles the order."
