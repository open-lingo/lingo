module: m17
title: "Me levanto — the verb that points back at you"
frame: none
throughModule: m16
expectedLessonCount: 10
checkpoint: 8

# ES m17 — reflexive verbs: the daily routine.
#
#     me levanto      te levantas      se levanta
#     me ducho        te duchas        se ducha
#     me despierto    (e→ie, m14)      se despierta
#     me acuesto      (o→ue, m14)      se acuesta
#
# ONE rule, the whole module: some verbs carry a small word that points
# BACK at the person doing them — «me» for I, «te» for you, «se» for he or
# she — and that word goes IN FRONT of the verb, exactly where «lo» stood
# in m16. «levanto» alone is "I lift (something)"; «me levanto» is "I get
# up". The learner has owned «me» and «te» since m13 («me gusta», «te
# gusta») and «me llamo» / «te llamas» since m2, so the only NEW word in
# the family is «se», and the new CLAIM is that the pointer changes with
# the person: «me» ↔ -o, «te» ↔ -as, «se» ↔ -a.
#
# PLACEMENT carries over from m16 unchanged and is re-spent in L7: with a
# verb + infinitive the pointer goes in front of the CONJUGATED verb —
# «me quiero levantar», «no me quiero duchar». NOTHING in this module
# attaches a pronoun to an infinitive («levantarme», «ducharte»). The
# dictionary forms «levantarse» / «ducharse» / «despertarse» / «acostarse»
# / «lavarse» are registered atoms and are printed ONLY as the NAME of the
# verb — on a card, a speakLit, an imageMcq, a textMcq target, a match
# source — never inside a sentence. Inside a sentence the bare verb is
# «levantar» / «duchar» (registered separately, L7). m17.test.ts pins it.
#
# ── «se» IS REGISTERED (unlike m16's «lo») ────────────────────────────────
# «se» sits in ES_FUNCTION_WORDS, so the shared gates would license it with
# zero exposure — the m12 «son» hole, the m16 «lo» hole. m13 solved the
# same problem for «me / te / le» by registering them as particle atoms,
# which makes inv 33 (debut on an intro-capable step) and the atom-usage
# pin bite. m17 does the same for «se». Consequence for clozes: a blank
# answered by «se» is an m17 atom (any option count); a blank answered by
# «me» or «te» resolves to m13 under pin E2 and survives ONLY as a
# two-option trial whose other option is ALSO a registered surface
# ([me, te], [te, se], [me, se] — all three are atoms now).
#
# ── STEM CHANGES ARE m14's, RE-SPENT ─────────────────────────────────────
# «despertarse» (e→ie) and «acostarse» (o→ue) are registered in all three
# singular cells; the tú cells «despiertas» / «acuestas» exist so the NPCs
# can ASK («¿te acuestas tarde?») and each debuts on a printed speakLit
# question before any NPC uses it. Every plural person is banned in every
# answer position (m17.test.ts).
#
# ── hacer / tener RULING (B112) carries: hago / haces / hace, tengo / tienes / tiene only.
#
# ── FORM DISCIPLINE ──────────────────────────────────────────────────────
# Present indicative only. yo / tú / él-ella only. No nosotros, no ustedes,
# no preterite, no progressive, no imperative. «lavarse» registers yo and
# él/ella (lavo / lava) — «lavas» is not registered and is never printed.
#
# ── TRANSFER CELL (L8 only): «peino» ─────────────────────────────────────
# One unseen verb form, met cold in the checkpoint and glossed in the
# English prompt only: "I comb my hair — peinarse" → «me peino». The
# learner has to supply the pointer the gloss does not print. Registered
# so the gate can track it; NEVER appears in L1–L7 or L9–L10.
#
# ── EMOJI ────────────────────────────────────────────────────────────────
# ducharse 🚿 · dientes 🦷 · levantarse 🧍 · acostarse 😴 · despertarse ⏰.
# The three routine verbs also carry generated custom art under
# src/pub/lingo-art/vocab/es/ (keyed es:levantarse etc. in notoEmoji.ts);
# the emoji is the fallback the integrity gate reads. None of the five is
# bound to another word (🛏️ is «cama», 🌅 is «buenos días»).
# ─────────────────────────────────────────────────────────────────────────
newAtoms:
  # the pointer for he / she — the one new word of the family
  - { surface: "se", meaningEn: "himself, herself (the pointer for he or she)", partOfSpeech: "particle", kind: "particle", hint: "one syllable, no accent — «se levanta»" }
  # levantarse — regular -ar, all three singular cells
  - { surface: "levantarse", meaningEn: "to get up", partOfSpeech: "verb", kind: "vocab", emoji: "🧍", hint: "leh-van-TAR-seh — the «se» on the end is the pointer, waiting to move in front" }
  - { surface: "levanto", meaningEn: "I get up (with «me»)", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "levantas", meaningEn: "you get up (with «te»)", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "levanta", meaningEn: "he/she gets up (with «se»)", partOfSpeech: "verb", kind: "vocab" }
  # ducharse — regular -ar, all three singular cells
  - { surface: "ducharse", meaningEn: "to shower", partOfSpeech: "verb", kind: "vocab", emoji: "🚿", hint: "doo-CHAR-seh" }
  - { surface: "ducho", meaningEn: "I shower (with «me»)", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "duchas", meaningEn: "you shower (with «te»)", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "ducha", meaningEn: "he/she showers (with «se»)", partOfSpeech: "verb", kind: "vocab" }
  # the first reflexive the learner ever met, now in the third person
  - { surface: "se llama", meaningEn: "his/her name is (he/she calls himself/herself)", partOfSpeech: "phrase", kind: "phrase", hint: "«¿cómo se llama?» — what is his or her name?" }
  # lavarse — yo and él/ella; the reflexive that takes an object
  - { surface: "lavarse", meaningEn: "to wash (oneself)", partOfSpeech: "verb", kind: "vocab", hint: "la-VAR-seh — «me lavo los dientes»: the pointer says whose teeth" }
  - { surface: "lavo", meaningEn: "I wash (with «me»: I wash myself)", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "lava", meaningEn: "he/she washes (with «se»)", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "dientes", meaningEn: "teeth", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "🦷", hint: "DYEN-tes — always «los dientes» here" }
  # despertarse — e→ie (m14's machine), yo and él/ella only
  - { surface: "despertarse", meaningEn: "to wake up", partOfSpeech: "verb", kind: "vocab", emoji: "⏰", hint: "des-per-TAR-seh — e→ie when the stress lands on it: «me despierto»" }
  - { surface: "despierto", meaningEn: "I wake up (with «me»)", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "despiertas", meaningEn: "you wake up (with «te»)", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "despierta", meaningEn: "he/she wakes up (with «se»)", partOfSpeech: "verb", kind: "vocab" }
  # acostarse — o→ue (m14's machine), yo and él/ella only
  - { surface: "acostarse", meaningEn: "to go to bed", partOfSpeech: "verb", kind: "vocab", emoji: "😴", hint: "a-kos-TAR-seh — o→ue: «me acuesto»" }
  - { surface: "acuesto", meaningEn: "I go to bed (with «me»)", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "acuestas", meaningEn: "you go to bed (with «te»)", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "acuesta", meaningEn: "he/she goes to bed (with «se»)", partOfSpeech: "verb", kind: "vocab" }
  # ── L7: the bare verb after «quiero» / «puedo». The registered dictionary
  # form is «levantarse», so the bare «levantar» a learner must produce in
  # «me quiero levantar» is a SEPARATE surface — untracked unless registered
  # (the provenance lexicon folds plurals and -o/-a adjectives, never
  # reflexive infinitives). Two are registered; the others (acostar, duchar's
  # siblings) are never printed in a billed slot.
  - { surface: "levantar", meaningEn: "to get up — the bare verb after «quiero»: «me quiero levantar»", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "duchar", meaningEn: "to shower — the bare verb after «quiero»: «me quiero duchar»", partOfSpeech: "verb", kind: "vocab" }
  # ── TRANSFER CELL (L8 only) — glossed in the prompt, met cold.
  - { surface: "peino", meaningEn: "I comb (my hair)", partOfSpeech: "verb", kind: "vocab" }

lessons:
  # ── L1 · «Me levanto» — «se» debuts (info card → printed speakLit), then
  #    levantarse / levanto / levantas / levanta. The map previews the
  #    sentence (maps bill nothing); the imageMcq is the true first
  #    exposure of «levantarse» (inv 44). «se» is a REGISTERED particle
  #    atom, so inv 33 holds its debut order by machine: the card names it,
  #    the speakLit «Ana se levanta temprano» is the first billed use.
  #    NOT HERE: ducharse (L2), «se llama» (L3), any other m17 verb.
  #    Selection runs peak at 2; one card; cloze share 1/18.
  - n: 1
    template: free
    title: "Me levanto"
    description: "Some verbs carry a small word that points back at the person doing them. You already own two of the three pointers — this lesson hands you the third."
    steps:
      - kind: map
        id: l1-map-melevanto
        tokens: ["me", "levanto", "temprano"]
        pairs:
          - { en: "myself", tokenIndex: 0 }
          - { en: "I get up", tokenIndex: 1 }
          - { en: "early", tokenIndex: 2 }
        audioText: "me levanto temprano"
        revealNote: "«levanto» on its own means I lift — a box, a hand. Put «me» in front and the lifting points back at you: you lift yourself, you get up. That little «me» is the one from «me gusta» and «me llamo», doing a job you have not seen it do yet. Watch where it sits: in front of the verb, exactly where «lo» sat last module."
      - kind: imageMcq
        id: l1-im-levantarse
        target: { surface: "levantarse", meaningEn: "to get up", emoji: "🧍" }
        distractors:
          - { surface: "bailar", emoji: "💃" }
          - { surface: "cantar", emoji: "🎤" }
          - { surface: "escuchar", emoji: "👂" }
      - kind: speakLit
        id: l1-sp-levantarse
        es: "levantarse"
        en: "to get up"
        atoms: ["levantarse"]
      - kind: buildLit
        id: l1-b-melevantotemprano
        also: ["temprano me levanto"]
        es: "me levanto temprano"
        en: "I get up early"
        atoms: ["levanto", "temprano"]
        tiles: ["se", "levanta"]
      # The lesson's one card, and the debut of «se».
      - kind: info
        id: l1-info-se
        title: "The verb that points back at you"
        body: "«me levanto» — I get up. The «me» is a pointer: it says the getting-up lands on the same person who does it. You have used it since «me llamo». Now the rule the whole module runs on: the pointer changes with the person, and it always matches the ending. «me levanto» — I; «te levantas» — you; and for he or she, a word you have not met: «se». «Ana se levanta» — Ana gets up. Three pointers, three endings, always in front of the verb: «me» with -o, «te» with -as, «se» with -a. Mix them and it is not Spanish: «se levanto» says nothing."
      # THE FIRST CONTACT with «se» — printed, spoken, intro-capable.
      - kind: speakLit
        id: l1-sp-anaselevanta
        es: "Ana se levanta temprano"
        en: "Ana gets up early"
        atoms: ["levanta", "temprano"]
      - kind: clozeLit
        id: l1-c-selevantatarde
        es: "Diego se levanta tarde"
        en: "Diego gets up late"
        blank: "se"
        options: ["se", "me", "te"]
        atoms: ["levanta", "tarde"]
        why: "Diego is the one getting up, and Diego is a he — so the pointer is «se», matching the -a on «levanta». «me» would make it you; «te» would make it the person you are talking to."
      - kind: listenCompLit
        id: l1-lc-televantasmuytemprano
        es: "te levantas muy temprano"
        en: "You get up very early."
        atoms: ["levantas", "temprano"]
        distractorsEn:
          - "I get up very early."
          - "You get up very late."
          - "She gets up very early."
      - kind: buildLit
        id: l1-b-televantastardehoy
        also: ["hoy te levantas tarde"]
        es: "te levantas tarde hoy"
        en: "You get up late today"
        atoms: ["levantas", "tarde", "hoy"]
        tiles: ["me", "levanto"]
      # THE PLACEMENT BEAT. «levanto me» is English order; «se levanto» is a
      # mismatched pointer; bare «levanto» is lifting something. All three
      # live in distractor slots, which esSurfaces never reads.
      - kind: mcq
        id: l1-q-melevanto
        prompt: "'I get up.' Which one is the Spanish?"
        correct: "me levanto"
        distractors: ["levanto me", "se levanto", "levanto"]
        atoms: ["levanto"]
        why: "«me levanto». The pointer goes in FRONT of the verb, and it matches the -o: «me». «se levanto» pairs a he-or-she pointer with an I ending. Bare «levanto» is lifting something else."
      - kind: audioWimcq
        id: l1-ear-levantarse
        target: { surface: "levantarse", emoji: "🧍" }
        distractors:
          - { surface: "bailar", emoji: "💃" }
          - { surface: "cantar", emoji: "🎤" }
      # Printed non-recall at m14 (duermo tarde).
      - kind: speakLit
        id: l1-sp-recall-duermotarde
        es: "duermo tarde"
        en: "I sleep late"
        atoms: []
        cue: recall
      # Both pointers live in one sentence (§13.9 law 4): the person is
      # printed next to each blank, so the choice is honest.
      - kind: agreementLit
        id: l1-agr-yoana
        en: "I get up early and Ana gets up late"
        audioText: "me levanto temprano y Ana se levanta tarde"
        atoms: ["levanto", "temprano", "levanta", "tarde"]
        segments:
          - { blank: { id: "p1", answer: "me", options: ["me", "se"] } }
          - { text: " levanto temprano y Ana " }
          - { blank: { id: "p2", answer: "se", options: ["se", "me"] } }
          - { text: " levanta tarde" }
      - kind: listenBuildLit
        id: l1-lb-melevantotarde
        es: "me levanto tarde"
        en: "I get up late"
        atoms: ["levanto", "tarde"]
        tiles: ["te", "levantas"]
      - kind: textMcq
        id: l1-tm-levanto
        target: "levanto"
        distractors: ["levantas", "levanta", "levantarse"]
      - kind: sim
        id: l1-sim-ana-sabado
        scene: { emoji: "🌅", title: "Ana on a Saturday morning", setting: "Ana has called early, and she wants to know whether you are up." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Te levantas temprano?", audioText: "¿te levantas temprano?", gloss: "Do you get up early?" }
            goal: "Say yes — you get up early."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, me levanto temprano" }
                - { id: "wrong1", text: "sí, te levanto temprano" }
                - { id: "wrong2", text: "sí, levanto temprano" }
              correctOptionId: "right"
              audioText: "sí, me levanto temprano"
            replyGloss: "Yes, I get up early."
            explanation: "Ana asked with «te levantas»; you answer about yourself, so the pointer flips to «me» and the ending to -o. Bare «levanto» lifts something, it does not get up."
          - id: t2
            npc: { speaker: "Ana", es: "Diego se levanta tarde.", audioText: "diego se levanta tarde", gloss: "Diego gets up late." }
            goal: "Say you get up late too."
            reply:
              mode: build
              tiles: ["me", "levanto", "tarde", "también", "se", "levanta"]
              answer: "me levanto tarde también"
              alsoAccepted: ["también me levanto tarde"]
            replyGloss: "I get up late too."
            explanation: "Ana said it about Diego with «se levanta»; you say it about yourself with «me levanto». Same verb, the pointer and the ending move together."
          - id: t3
            npc: { speaker: "Ana", es: "¿Y hoy?", audioText: "¿y hoy?", gloss: "And today?" }
            goal: "Say today you get up late."
            reply:
              mode: choice
              options:
                - { id: "right", text: "hoy me levanto tarde" }
                - { id: "wrong1", text: "hoy se levanto tarde" }
                - { id: "wrong2", text: "hoy levanto tarde" }
              correctOptionId: "right"
              audioText: "hoy me levanto tarde"
            replyGloss: "Today I get up late."
            explanation: "«hoy» can sit up front; the pointer still goes right before the verb. «se levanto» mixes a he-or-she pointer with an I ending — never."
      - kind: matchLit
        id: l1-match
        pairs:
          - { source: "levantarse", target: "to get up" }
          - { source: "me levanto", target: "I get up" }
          - { source: "te levantas", target: "you get up" }
          - { source: "se levanta", target: "he or she gets up" }
          - { source: "se", target: "the pointer for he or she" }
          - { source: "temprano", target: "early" }
          - { source: "tarde", target: "late" }
      - kind: speakLit
        id: l1-sp-win
        es: "me levanto temprano, pero Ana se levanta tarde"
        en: "I get up early, but Ana gets up late"
        atoms: ["levanto", "temprano", "levanta", "tarde"]


  # ── L2 · «Me ducho» — ducharse / ducho / duchas / ducha. The claim: the
  #    pointer and the ending are ONE choice — «me» goes with -o, «te» with
  #    -as, «se» with -a — and it works on a second verb exactly as on the
  #    first. Debut: l2-im-ducharse (imageMcq, first exposure).
  #    NOT HERE: «se llama» (L3), lavarse (L4), the stem-changers (L5/L6).
  - n: 2
    template: free
    title: "Me ducho"
    description: "A second verb that points back at you. The pointer and the ending are one decision, not two — and now you make it twice."
    steps:
      - kind: map
        id: l2-map-diegoseducha
        tokens: ["Diego", "se", "ducha", "temprano"]
        pairs:
          - { en: "Diego", tokenIndex: 0 }
          - { en: "himself", tokenIndex: 1 }
          - { en: "showers", tokenIndex: 2 }
          - { en: "early", tokenIndex: 3 }
        audioText: "Diego se ducha temprano"
        revealNote: "A new verb, and you can already read the shape: «se» in front, -a on the end, a he doing it. «ducharse» is to shower, and it points back at the person like «levantarse» does. Say it about yourself and both pieces change at once: «me ducho»."
      - kind: imageMcq
        id: l2-im-ducharse
        target: { surface: "ducharse", meaningEn: "to shower", emoji: "🚿" }
        distractors:
          - { surface: "levantarse", emoji: "🧍" }
          - { surface: "bailar", emoji: "💃" }
          - { surface: "cantar", emoji: "🎤" }
      - kind: speakLit
        id: l2-sp-ducharse
        es: "ducharse"
        en: "to shower"
        atoms: ["ducharse"]
      - kind: buildLit
        id: l2-b-meduchotemprano
        also: ["temprano me ducho"]
        es: "me ducho temprano"
        en: "I shower early"
        atoms: ["ducho", "temprano"]
        tiles: ["se", "ducha"]
      - kind: info
        id: l2-info-tres
        title: "Three pointers, three endings — one choice"
        body: "«me ducho», «te duchas», «se ducha». Look at the pairs: «me» always travels with -o, «te» with -as, «se» with -a. They are not two decisions, they are one — pick the person and both pieces follow. That is why «se ducho» and «me duchas» are not Spanish: each one changes the person halfway through the sentence. And the order never moves: pointer first, then the verb. «Diego se ducha temprano» — the pointer sits between the name and the verb, exactly where «lo» sat in «Diego lo tiene»."
      - kind: clozeLit
        id: l2-c-teduchastarde
        es: "tú te duchas tarde"
        en: "You shower late"
        blank: "duchas"
        options: ["duchas", "ducho", "ducha"]
        atoms: ["duchas", "tarde"]
        why: "«te» is already in the sentence, so the ending has to be the one that travels with it: -as. «ducho» belongs with «me», «ducha» with «se»."
      - kind: listenCompLit
        id: l2-lc-anaselevantayseducha
        es: "Ana se levanta y se ducha temprano"
        en: "Ana gets up and showers early."
        atoms: ["levanta", "ducha", "temprano"]
        distractorsEn:
          - "Ana gets up and showers late."
          - "I get up and shower early."
          - "Ana gets up and eats early."
      - kind: buildLit
        id: l2-b-teduchashoy
        also: ["hoy te duchas"]
        es: "te duchas hoy"
        en: "You shower today"
        atoms: ["duchas", "hoy"]
        tiles: ["me", "ducho"]
      - kind: mcq
        id: l2-q-seduchatarde
        prompt: "'She showers late.' Which one is the Spanish?"
        correct: "se ducha tarde"
        distractors: ["se ducho tarde", "me ducha tarde", "ducha se tarde"]
        atoms: ["ducha", "tarde"]
        why: "She — so «se», and the ending that travels with «se» is -a: «se ducha». «se ducho» and «me ducha» each break the pair; «ducha se» puts the pointer after the verb, where Spanish never puts it."
      - kind: audioWimcq
        id: l2-ear-ducharse
        target: { surface: "ducharse", emoji: "🚿" }
        distractors:
          - { surface: "levantarse", emoji: "🧍" }
          - { surface: "escuchar", emoji: "👂" }
      # Printed non-recall at m14 (no puedo dormir temprano).
      - kind: speakLit
        id: l2-sp-recall-nopuedodormir
        es: "no puedo dormir temprano"
        en: "I can't sleep early"
        atoms: []
        cue: recall
      - kind: agreementLit
        id: l2-agr-yotu
        en: "I shower and you shower"
        audioText: "me ducho y tú te duchas"
        atoms: ["ducho", "duchas"]
        segments:
          - { blank: { id: "p1", answer: "me", options: ["me", "se"] } }
          - { text: " ducho y tú " }
          - { blank: { id: "p2", answer: "te", options: ["te", "se"] } }
          - { text: " duchas" }
      - kind: listenBuildLit
        id: l2-lb-diegoseduchatarde
        es: "Diego se ducha tarde"
        en: "Diego showers late"
        atoms: ["ducha", "tarde"]
        tiles: ["me", "ducho"]
      - kind: textMcq
        id: l2-tm-ducha
        target: "ducha"
        distractors: ["ducho", "duchas", "ducharse"]
      - kind: speakLit
        id: l2-sp-melevantoymeducho
        es: "me levanto y me ducho"
        en: "I get up and I shower"
        atoms: ["levanto", "ducho"]
      - kind: sim
        id: l2-sim-diego-manana
        scene: { emoji: "🚿", title: "Diego compares mornings", setting: "Diego is convinced nobody in the house gets up as early as he does." }
        turns:
          - id: t1
            npc: { speaker: "Diego", es: "Sam, ¿te duchas temprano?", audioText: "sam, ¿te duchas temprano?", gloss: "Sam, do you shower early?" }
            goal: "Say yes — you shower early."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, me ducho temprano" }
                - { id: "wrong1", text: "sí, me duchas temprano" }
                - { id: "wrong2", text: "sí, se ducho temprano" }
              correctOptionId: "right"
              audioText: "sí, me ducho temprano"
            replyGloss: "Yes, I shower early."
            explanation: "About yourself: «me» and -o together. The two wrong ones each change the person halfway through."
          - id: t2
            npc: { speaker: "Diego", es: "Ana se ducha tarde.", audioText: "ana se ducha tarde", gloss: "Ana showers late." }
            goal: "Say you shower early."
            reply:
              mode: build
              tiles: ["me", "ducho", "temprano", "se", "ducha"]
              answer: "me ducho temprano"
              alsoAccepted: ["temprano me ducho"]
            replyGloss: "I shower early."
            explanation: "Diego talked about Ana with «se ducha»; you talk about yourself with «me ducho». The bank also holds Ana's pair — leave it there."
          - id: t3
            npc: { speaker: "Diego", es: "¿Y te levantas temprano también?", audioText: "¿y te levantas temprano también?", gloss: "And do you get up early too?" }
            goal: "Say yes — you get up early too."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, me levanto temprano también" }
                - { id: "wrong1", text: "sí, se levanta temprano también" }
                - { id: "wrong2", text: "sí, levanto temprano también" }
              correctOptionId: "right"
              audioText: "sí, me levanto temprano también"
            replyGloss: "Yes, I get up early too."
            explanation: "Last lesson's verb, this lesson's rule: «me» with -o. «se levanta» would be about somebody else; bare «levanto» lifts things."
      - kind: matchLit
        id: l2-match
        pairs:
          - { source: "ducharse", target: "to shower" }
          - { source: "me ducho", target: "I shower" }
          - { source: "te duchas", target: "you shower" }
          - { source: "se ducha", target: "he or she showers" }
          - { source: "me levanto", target: "I get up" }
          - { source: "temprano", target: "early" }
          - { source: "hoy", target: "today" }
      - kind: speakLit
        id: l2-sp-win
        es: "me ducho temprano, pero Diego se ducha tarde"
        en: "I shower early, but Diego showers late"
        atoms: ["ducho", "temprano", "ducha", "tarde"]


  # ── L3 · «¿Cómo se llama?» — ONE new atom, the phrase «se llama». The
  #    lesson re-reads «me llamo» / «te llamas» (m2) as the first pointer
  #    verb the learner ever met, and hands over the third person so a name
  #    can be asked ABOUT somebody. Debut: l3-sp-comosellama (speakLit,
  #    intro-capable) — the map before it bills nothing.
  #    «llama» alone is registered only through the phrase; it is never
  #    printed without «se» in front. NOT HERE: lavarse (L4), stem-changers.
  - n: 3
    template: free
    title: "¿Cómo se llama?"
    description: "You have been using a pointer verb since your very first module — «me llamo». Now you can ask about somebody else's name."
    steps:
      - kind: map
        id: l3-map-mihermanosellama
        tokens: ["mi", "hermano", "se", "llama", "Luis"]
        pairs:
          - { en: "my", tokenIndex: 0 }
          - { en: "brother", tokenIndex: 1 }
          - { en: "himself", tokenIndex: 2 }
          - { en: "calls", tokenIndex: 3 }
          - { en: "Luis", tokenIndex: 4 }
        audioText: "mi hermano se llama Luis"
        revealNote: "Read it the Spanish way: my brother calls himself Luis. That is what «me llamo» has meant all along — I call myself. The verb points back at the person, and for a he or a she the pointer is the one you met two lessons ago: «se»."
      - kind: speakLit
        id: l3-sp-comosellama
        es: "¿cómo se llama?"
        en: "What is his name?"
        atoms: ["se llama"]
      - kind: buildLit
        id: l3-b-mihermanosellamaluis
        es: "mi hermano se llama Luis"
        en: "My brother's name is Luis"
        atoms: ["hermano", "se llama"]
        tiles: ["me", "llamo"]
      - kind: info
        id: l3-info-primerpuntero
        title: "The first pointer you ever learned"
        body: "«me llamo Sam» — you said it in module two, and it means I call myself Sam. «te llamas» — you call yourself. The same three pointers, the same three endings you have been using on «levantarse» and «ducharse»: «me llamo», «te llamas», «se llama». So a third person's name is «se llama»: «mi hermano se llama Luis» — my brother is called Luis. And to ask about somebody: «¿cómo se llama?» — how does he or she call himself, herself? — what is his name, what is her name. «¿cómo te llamas?» asks the person in front of you; «¿cómo se llama?» asks about somebody else."
      - kind: clozeLit
        id: l3-c-mihermanasellama
        es: "mi hermana se llama Sofía"
        en: "My sister's name is Sofía"
        blank: "se"
        options: ["se", "me", "te"]
        atoms: ["hermana", "se llama"]
        why: "Your sister is a she, so the pointer is «se», and it travels with «llama». «me llamo» would be your own name; «te llamas» is the person you are talking to."
      - kind: listenCompLit
        id: l3-lc-comosellamatuhermano
        es: "¿cómo se llama tu hermano?"
        en: "What is your brother's name?"
        atoms: ["se llama", "hermano"]
        distractorsEn:
          - "What is your name?"
          - "What is your sister's name?"
          - "Where is your brother?"
      - kind: buildLit
        id: l3-b-miabuelasellamacarmen
        es: "mi abuela se llama Carmen"
        en: "My grandmother's name is Carmen"
        atoms: ["abuela", "se llama"]
        tiles: ["te", "llamas"]
      - kind: mcq
        id: l3-q-comosellama
        prompt: "Which one means 'her name is'?"
        correct: "se llama"
        distractors: ["te llamas", "me llamo", "llama"]
        atoms: ["se llama"]
        why: "About somebody else — a she — so «se llama». «te llamas» is the person you are talking to, «me llamo» is your own name, and «llama» without a pointer is not a name at all."
      - kind: audioWimcq
        id: l3-ear-hermano
        target: { surface: "el hermano", emoji: "👦" }
        distractors:
          - { surface: "la hermana", emoji: "👧" }
          - { surface: "el abuelo", emoji: "👴" }
      # Printed non-recall at m13 (me gusta mucho el helado).
      - kind: speakLit
        id: l3-sp-recall-megustaelhelado
        es: "me gusta mucho el helado"
        en: "I really like ice cream"
        atoms: []
        cue: recall
      - kind: agreementLit
        id: l3-agr-samana
        en: "My name is Sam and my sister's name is Ana"
        audioText: "me llamo Sam y mi hermana se llama Ana"
        atoms: ["me llamo", "hermana", "se llama"]
        segments:
          - { blank: { id: "p1", answer: "me", options: ["me", "se"] } }
          - { text: " llamo Sam y mi hermana " }
          - { blank: { id: "p2", answer: "se", options: ["se", "me"] } }
          - { text: " llama Ana" }
      - kind: listenBuildLit
        id: l3-lb-sellamadiego
        es: "se llama Diego"
        en: "His name is Diego"
        atoms: ["se llama"]
        tiles: ["me", "llamo"]
      - kind: textMcq
        id: l3-tm-levantas
        target: "levantas"
        distractors: ["levanto", "levanta", "duchas"]
      - kind: speakLit
        id: l3-sp-luisselevantatarde
        es: "mi hermano se llama Luis y se levanta tarde"
        en: "My brother's name is Luis and he gets up late"
        atoms: ["hermano", "se llama", "levanta", "tarde"]
      - kind: sim
        id: l3-sim-sofia-familia
        scene: { emoji: "👨‍👩‍👧‍👦", title: "Sofía asks about your family", setting: "Sofía has seen a photo on your phone and wants names for the faces." }
        turns:
          - id: t1
            npc: { speaker: "Sofía", es: "¿Cómo se llama tu hermano?", audioText: "¿cómo se llama tu hermano?", gloss: "What is your brother's name?" }
            goal: "Say his name is Luis."
            reply:
              mode: build
              tiles: ["se", "llama", "Luis", "me", "llamo"]
              answer: "se llama Luis"
            replyGloss: "His name is Luis."
            explanation: "About your brother, so «se llama». «me llamo» would hand him your own name."
          - id: t2
            npc: { speaker: "Sofía", es: "Yo me llamo Sofía. ¿Y tú?", audioText: "yo me llamo sofía. ¿y tú?", gloss: "My name is Sofía. And you?" }
            goal: "Say your name is Sam."
            reply:
              mode: choice
              options:
                - { id: "right", text: "me llamo Sam" }
                - { id: "wrong1", text: "se llama Sam" }
                - { id: "wrong2", text: "te llamas Sam" }
              correctOptionId: "right"
              audioText: "me llamo Sam"
            replyGloss: "My name is Sam."
            explanation: "Your own name — the pointer that points at you: «me llamo». «se llama Sam» would be about somebody else called Sam."
          - id: t3
            npc: { speaker: "Sofía", es: "¿Y tu abuela? ¿Cómo se llama?", audioText: "¿y tu abuela? ¿cómo se llama?", gloss: "And your grandmother? What is her name?" }
            goal: "Say her name is Carmen."
            reply:
              mode: choice
              options:
                - { id: "right", text: "se llama Carmen" }
                - { id: "wrong1", text: "me llamo Carmen" }
                - { id: "wrong2", text: "te llamas Carmen" }
              correctOptionId: "right"
              audioText: "se llama Carmen"
            replyGloss: "Her name is Carmen."
            explanation: "A she who is not you and not Sofía: «se llama». The other two would name yourself or Sofía."
      - kind: matchLit
        id: l3-match
        pairs:
          - { source: "se llama", target: "his or her name is" }
          - { source: "me llamo", target: "my name is" }
          - { source: "te llamas", target: "your name is" }
          - { source: "¿cómo se llama?", target: "what is his or her name?" }
          - { source: "el hermano", target: "the brother" }
          - { source: "la abuela", target: "the grandmother" }
          - { source: "la hermana", target: "the sister" }
      - kind: speakLit
        id: l3-sp-win
        es: "me llamo Sam y mi hermano se llama Luis"
        en: "My name is Sam and my brother's name is Luis"
        atoms: ["me llamo", "hermano", "se llama"]


  # ── L4 · «Me lavo los dientes» — lavarse / lavo / lava / dientes. The
  #    claim: a pointer verb can take an object, and the pointer is what
  #    says whose («me lavo los dientes» — never «mis dientes»); take the
  #    pointer away and you are washing something else («lavo el carro»).
  #    Debut: l4-im-dientes (imageMcq). «lavas» is NOT registered and is
  #    never printed, not even by an NPC. NOT HERE: the stem-changers.
  - n: 4
    template: free
    title: "Me lavo los dientes"
    description: "A pointer verb with something after it. Spanish says 'I wash myself the teeth' — and the pointer, not a 'my', is what says whose teeth."
    steps:
      - kind: map
        id: l4-map-melavolosdientes
        tokens: ["me", "lavo", "los", "dientes"]
        pairs:
          - { en: "myself", tokenIndex: 0 }
          - { en: "I wash", tokenIndex: 1 }
          - { en: "the", tokenIndex: 2 }
          - { en: "teeth", tokenIndex: 3 }
        audioText: "me lavo los dientes"
        revealNote: "No word for 'my' anywhere — and none is needed. «me» already says the washing lands on you, so «los dientes» can only be yours. That is how Spanish handles teeth, hands, hair: pointer plus «the», never «my»."
        tokenGenders: { 2: "m", 3: "m" }
      - kind: imageMcq
        id: l4-im-dientes
        target: { surface: "los dientes", meaningEn: "the teeth", emoji: "🦷" }
        distractors:
          - { surface: "la cama", emoji: "🛏️" }
          - { surface: "el agua", emoji: "💧" }
          - { surface: "la llave", emoji: "🔑" }
      - kind: speakLit
        id: l4-sp-lavarse
        es: "lavarse"
        en: "to wash oneself"
        atoms: ["lavarse"]
      - kind: buildLit
        id: l4-b-melavolosdientes
        es: "me lavo los dientes"
        en: "I brush my teeth"
        atoms: ["lavo", "dientes"]
        tiles: ["se", "mis"]
      - kind: info
        id: l4-info-dequien
        title: "Whose teeth? The pointer says."
        body: "«me lavo los dientes» — word for word, I wash myself the teeth. English says 'I brush my teeth'; Spanish never puts a 'my' there, because «me» has already said whose they are. «Ana se lava los dientes» — Ana washes herself the teeth: hers. Now take the pointer away: «lavo el carro» — I wash the car. No pointer, because the washing lands on the car, not on you. That is the whole difference between «lavo» and «me lavo»: the pointer says the action comes back to the person doing it."
      - kind: clozeLit
        id: l4-c-anaselava
        es: "Ana se lava los dientes"
        en: "Ana brushes her teeth"
        blank: "lava"
        options: ["lava", "lavo"]
        atoms: ["lava", "dientes"]
        why: "«se» is in the sentence, so the ending that travels with it: -a. «lavo» belongs with «me»."
      - kind: listenCompLit
        id: l4-lc-melavotemprano
        es: "me lavo los dientes temprano"
        en: "I brush my teeth early."
        atoms: ["lavo", "dientes", "temprano"]
        distractorsEn:
          - "I brush my teeth late."
          - "She brushes her teeth early."
          - "I wash the car early."
      - kind: buildLit
        id: l4-b-diegoselava
        es: "Diego se lava los dientes"
        en: "Diego brushes his teeth"
        atoms: ["lava", "dientes"]
        tiles: ["me", "lavo"]
      # THE CONTRAST BEAT: no pointer when the washing lands elsewhere. The
      # correct option is three tokens (inv 28).
      - kind: mcq
        id: l4-q-lavoelcarro
        prompt: "Which one means 'I wash the car'?"
        correct: "lavo el carro"
        distractors: ["me lavo el carro", "se lava el carro", "lavo me el carro"]
        atoms: ["lavo", "carro"]
        why: "The washing lands on the car, not on you — so no pointer: «lavo el carro». «me lavo el carro» would say you wash yourself with a car in the way; «se lava» is somebody else."
      - kind: audioWimcq
        id: l4-ear-dientes
        target: { surface: "los dientes", emoji: "🦷" }
        distractors:
          - { surface: "la cama", emoji: "🛏️" }
          - { surface: "el agua", emoji: "💧" }
      # Printed non-recall at m14 (el perro duerme en la cama).
      - kind: speakLit
        id: l4-sp-recall-elperroduerme
        es: "el perro duerme en la cama"
        en: "The dog sleeps on the bed"
        atoms: []
        cue: recall
      - kind: agreementLit
        id: l4-agr-yoana
        en: "I brush my teeth and Ana brushes her teeth"
        audioText: "me lavo los dientes y Ana se lava los dientes"
        atoms: ["lavo", "lava", "dientes"]
        segments:
          - { blank: { id: "p1", answer: "me", options: ["me", "se"] } }
          - { text: " lavo los dientes y Ana " }
          - { blank: { id: "p2", answer: "se", options: ["se", "me"] } }
          - { text: " lava los dientes" }
      - kind: listenBuildLit
        id: l4-lb-melavotarde
        es: "me lavo los dientes tarde"
        en: "I brush my teeth late"
        atoms: ["lavo", "dientes", "tarde"]
        tiles: ["se", "lava"]
      - kind: textMcq
        id: l4-tm-lavo
        target: "lavo"
        distractors: ["lava", "lavarse", "levanto"]
      - kind: speakLit
        id: l4-sp-rutina
        es: "me levanto, me ducho y me lavo los dientes"
        en: "I get up, I shower and I brush my teeth"
        atoms: ["levanto", "ducho", "lavo", "dientes"]
      - kind: sim
        id: l4-sim-maria-bano
        scene: { emoji: "🦷", title: "María and the bathroom queue", setting: "One bathroom, three people, and María is keeping track of who is doing what." }
        turns:
          - id: t1
            npc: { speaker: "María", es: "Yo me lavo los dientes ahora. ¿Y tú?", audioText: "yo me lavo los dientes ahora. ¿y tú?", gloss: "I'm brushing my teeth now. And you?" }
            goal: "Say you brush your teeth too."
            reply:
              mode: build
              tiles: ["me", "lavo", "los", "dientes", "también", "se", "lava"]
              answer: "me lavo los dientes también"
              alsoAccepted: ["también me lavo los dientes"]
            replyGloss: "I brush my teeth too."
            explanation: "About yourself: «me lavo». The bank also holds «se lava» — that pair belongs to somebody else."
          - id: t2
            npc: { speaker: "María", es: "¿Diego se lava los dientes?", audioText: "¿diego se lava los dientes?", gloss: "Does Diego brush his teeth?" }
            goal: "Say yes — he brushes his teeth early."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, se lava los dientes temprano" }
                - { id: "wrong1", text: "sí, me lavo los dientes temprano" }
                - { id: "wrong2", text: "sí, se lavo los dientes temprano" }
              correctOptionId: "right"
              audioText: "sí, se lava los dientes temprano"
            replyGloss: "Yes, he brushes his teeth early."
            explanation: "Diego — a he — so «se lava». «me lavo» would be you; «se lavo» mixes the pointer and the ending."
          - id: t3
            npc: { speaker: "María", es: "¿Y el carro?", audioText: "¿y el carro?", gloss: "And the car?" }
            goal: "Say you wash the car today."
            reply:
              mode: choice
              options:
                - { id: "right", text: "lavo el carro hoy" }
                - { id: "wrong1", text: "me lavo el carro hoy" }
                - { id: "wrong2", text: "se lava el carro hoy" }
              correctOptionId: "right"
              audioText: "lavo el carro hoy"
            replyGloss: "I wash the car today."
            explanation: "The washing lands on the car, so there is no pointer: «lavo el carro». Add «me» and you are washing yourself."
      - kind: matchLit
        id: l4-match
        pairs:
          - { source: "lavarse", target: "to wash oneself" }
          - { source: "me lavo los dientes", target: "I brush my teeth" }
          - { source: "se lava", target: "he or she washes (himself, herself)" }
          - { source: "los dientes", target: "the teeth" }
          - { source: "lavo el carro", target: "I wash the car" }
          - { source: "me ducho", target: "I shower" }
          - { source: "me levanto", target: "I get up" }
      - kind: speakLit
        id: l4-sp-win
        es: "me lavo los dientes y me ducho temprano"
        en: "I brush my teeth and I shower early"
        atoms: ["lavo", "dientes", "ducho", "temprano"]


  # ── L5 · «Me despierto temprano» — despertarse / despierto / despierta.
  #    Two claims: m14's e→ie change happens INSIDE a pointer verb (the
  #    infinitive keeps its e), and «no» goes in front of the pointer —
  #    «no me despierto», the m16 «no lo veo» shape. Debut:
  #    l5-im-despertarse (imageMcq); «despiertas» on l5-sp-tedespiertas.
  #    NOT HERE: acostarse.
  - n: 5
    template: free
    title: "Me despierto temprano"
    description: "A pointer verb whose middle changes shape — you did this in module fourteen — and the word «no» finds its place in front of the pointer."
    steps:
      - kind: map
        id: l5-map-medespierto
        tokens: ["me", "despierto", "temprano"]
        pairs:
          - { en: "myself", tokenIndex: 0 }
          - { en: "I wake up", tokenIndex: 1 }
          - { en: "early", tokenIndex: 2 }
        audioText: "me despierto temprano"
        revealNote: "The verb is «despertarse», to wake up — and look at its middle: the e has turned into ie, «despierto». You watched «empezar» become «empieza» and «entender» become «entiendo» in module fourteen. Same machine, now with a pointer in front."
      - kind: imageMcq
        id: l5-im-despertarse
        target: { surface: "despertarse", meaningEn: "to wake up", emoji: "⏰" }
        distractors:
          - { surface: "ducharse", emoji: "🚿" }
          - { surface: "levantarse", emoji: "🧍" }
          - { surface: "bailar", emoji: "💃" }
      - kind: speakLit
        id: l5-sp-despertarse
        es: "despertarse"
        en: "to wake up"
        atoms: ["despertarse"]
      - kind: buildLit
        id: l5-b-medespiertotemprano
        also: ["temprano me despierto"]
        es: "me despierto temprano"
        en: "I wake up early"
        atoms: ["despierto", "temprano"]
        tiles: ["se", "despierta"]
      - kind: info
        id: l5-info-eie
        title: "The e that becomes ie — and where «no» goes"
        body: "«despertarse» keeps its e while it is the name of the verb. The moment you use it for a person, the stressed e opens into ie: «me despierto», «se despierta». Exactly what «empezar» did in «empieza». Now the second thing this lesson adds. To say you do NOT wake up early, «no» goes in front of the whole pair — «no me despierto temprano» — the same slot it took in «no lo veo». Never between the pointer and the verb: «me no despierto» is not Spanish."
      # «despiertas» debuts here, printed and spoken, so Carmen may ask with
      # it later and the sims may use it.
      - kind: speakLit
        id: l5-sp-tedespiertas
        es: "¿te despiertas temprano?"
        en: "Do you wake up early?"
        atoms: ["despiertas", "temprano"]
      - kind: clozeLit
        id: l5-c-anasedespierta
        es: "Ana se despierta tarde"
        en: "Ana wakes up late"
        blank: "despierta"
        options: ["despierta", "despierto", "despertarse"]
        atoms: ["despierta", "tarde"]
        why: "«se» is in the sentence, so the ending is -a: «despierta». «despierto» travels with «me», and «despertarse» is the name of the verb, not something a person does."
      - kind: listenCompLit
        id: l5-lc-nomedespierto
        es: "no me despierto temprano"
        en: "I don't wake up early."
        atoms: ["despierto", "temprano"]
        distractorsEn:
          - "I wake up early."
          - "I don't get up early."
          - "She doesn't wake up early."
      - kind: buildLit
        id: l5-b-diegonosedespierta
        es: "Diego no se despierta temprano"
        en: "Diego doesn't wake up early"
        atoms: ["despierta", "temprano"]
        tiles: ["me", "despierto"]
      # THE «no» BEAT. The ghosts («me no despierto», «no despierto me») live
      # only in distractor slots. Correct option is three tokens (inv 28).
      - kind: mcq
        id: l5-q-nomedespierto
        prompt: "Which one means 'I don't wake up'?"
        correct: "no me despierto"
        distractors: ["me no despierto", "no despierto me", "no se despierto"]
        atoms: ["despierto"]
        why: "«no», then the pointer, then the verb — «no me despierto». «no» never splits the pair, and the pointer never trails the verb."
      - kind: audioWimcq
        id: l5-ear-despertarse
        target: { surface: "despertarse", emoji: "⏰" }
        distractors:
          - { surface: "ducharse", emoji: "🚿" }
