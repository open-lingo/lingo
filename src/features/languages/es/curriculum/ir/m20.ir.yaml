module: m20
title: "Fui, hice, tuve — the past, irregular"
frame: none
throughModule: m19
expectedLessonCount: 10
checkpoint: 8

# ES m20 — the irregular preterite. Second A2 module.
#
#     ir / ser:  fui      fuiste     fue        hacer:  hice    hiciste    hizo
#     tener:     tuve     tuviste    tuvo       estar:  estuve  estuviste  estuvo
#     ver:       vi       viste      vio        venir:  vine    (viniste)  vino
#
# ONE idea, the whole module: a handful of the most-used verbs do not take
# m19's endings. Each has its own past stem, and NONE of these forms carries
# a written accent — «fui», «vi», «vio», «hizo» are stressed on the stem,
# which is exactly why «fui» is not «*fuí». The tú ending -iste (fuiste,
# hiciste, tuviste, estuviste, viste) is the one thread that survives from
# m19, and L8 cashes it: «viniste» is handed over cold and is derivable.
#
# ── ser AND ir SHARE A PAST ──────────────────────────────────────────────
# «fui / fuiste / fue» is both "I went" and "I was". The marker + the
# complement decide: «fui al museo» = went (a place follows, with «a»);
# «fue muy bueno», «fue mi profesor» = was (an adjective / noun follows).
# L1 teaches «fui» as ir only; L2 opens the ser reading and drills the
# ambiguity BOTH ways in answer positions. Never gloss «fue» as one only.
#
# ── PERSONS ──────────────────────────────────────────────────────────────
# yo / tú / él-ella only, like m19. Plural preterites (fuimos, fueron,
# hicimos, hicieron, tuvimos, tuvieron, estuvimos, estuvieron, vimos,
# vieron, vinimos, vinieron) are NOT taught and are banned in every slot,
# even unbilled NPC lines.
#
# ── PIN E12: EVERY CELL COMES FROM conjugationTables.ts ───────────────────
# ser / ir / tener / estar / hacer already carried their preterite; ver and
# venir were ADDED to ES_VERB_ENTRIES on 2026-09-09 for this module. That
# also makes every PRESENT form of ver / venir PRIOR: only veo / ve / vengo
# / viene were ever taught (m15, m16) — ves, vemos, ven, vienes, venimos,
# vienen are banned in every answer position and every printed slot.
#
# ── m19 REGULARS ARE PRIOR AND GET RE-SPENT ──────────────────────────────
# hablé / compré / comí / salí / trabajó … (all 26 m19 atoms) are PRIOR
# here. L6, L7, L9 mix them with the irregulars so the learner has to
# choose the machine, not just the ending. «ayer», «anoche», «la semana
# pasada», «el fin de semana» are PRIOR markers; «el mes pasado» debuts L6.
#
# ── NO IMPERFECT, NO PROGRESSIVE (pins E7) ───────────────────────────────
# Glosses are English simple past: "I went", "she had", "he saw". Never
# "was going", "used to", "have gone". Present stays simple present.
#
# ── hacer / tener RULING (B112) ──────────────────────────────────────────
# Present: only hago / haces / hace, tengo / tienes / tiene / tenemos /
# tienen. Past: only the cells registered below.
#
# ── TRANSFER CELL (L8 only): «viniste» ───────────────────────────────────
# Glossed cold in the prompt ("you came — venir"); derivable from «vine» /
# «vino» + the -iste thread. A buildLit whose bank holds «vine» and «vino»
# as foils. Appears in exactly one step.
#
# ── EMOJI ────────────────────────────────────────────────────────────────
# «el museo» 🏛️ (L1) and «el viaje» 🧳 (L5) debut on imageMcq (inv 44:
# first exposure only). Both Noto SVGs are vendored and unbound.
# ─────────────────────────────────────────────────────────────────────────
newAtoms:
  # ir / ser — one past
  - { surface: "fui", meaningEn: "I went / I was", partOfSpeech: "verb", kind: "vocab", hint: "FWEE — no accent; ir and ser share this past" }
  - { surface: "fuiste", meaningEn: "you went / you were", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "fue", meaningEn: "he/she went / it was", partOfSpeech: "verb", kind: "vocab", hint: "FWEH — a place after it: went; a noun or adjective after it: was" }
  # hacer
  - { surface: "hice", meaningEn: "I did / I made", partOfSpeech: "verb", kind: "vocab", hint: "EE-seh — stress on the stem, no accent" }
  - { surface: "hiciste", meaningEn: "you did / you made", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "hizo", meaningEn: "he/she did / made", partOfSpeech: "verb", kind: "vocab", hint: "EE-so — the c becomes z before o" }
  # tener / estar — the -uve twins
  - { surface: "tuve", meaningEn: "I had", partOfSpeech: "verb", kind: "vocab", hint: "TOO-beh" }
  - { surface: "tuviste", meaningEn: "you had", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "tuvo", meaningEn: "he/she had", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "estuve", meaningEn: "I was (somewhere)", partOfSpeech: "verb", kind: "vocab", hint: "es-TOO-beh — «tuve» with es- in front" }
  - { surface: "estuviste", meaningEn: "you were (somewhere)", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "estuvo", meaningEn: "he/she was (somewhere)", partOfSpeech: "verb", kind: "vocab" }
  # ver
  - { surface: "vi", meaningEn: "I saw", partOfSpeech: "verb", kind: "vocab", hint: "BEE — one syllable, no accent" }
  - { surface: "viste", meaningEn: "you saw", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "vio", meaningEn: "he/she saw", partOfSpeech: "verb", kind: "vocab", hint: "BYO — one syllable, no accent" }
  # venir
  - { surface: "vine", meaningEn: "I came", partOfSpeech: "verb", kind: "vocab", hint: "BEE-neh" }
  - { surface: "vino", meaningEn: "he/she came", partOfSpeech: "verb", kind: "vocab", hint: "BEE-no — yes, it also means wine; the sentence decides" }
  # marker + nouns
  - { surface: "el mes pasado", meaningEn: "last month", partOfSpeech: "phrase", kind: "phrase", hint: "mess pa-SA-do — the month that passed" }
  - { surface: "el museo", meaningEn: "the museum", partOfSpeech: "noun", kind: "vocab", emoji: "🏛️", hint: "moo-SEH-o" }
  - { surface: "el viaje", meaningEn: "the trip", partOfSpeech: "noun", kind: "vocab", emoji: "🧳", hint: "BYA-heh — the j is a breathy h" }
  # ── TRANSFER CELL (L8 only) — glossed in the prompt, met cold.
  - { surface: "viniste", meaningEn: "you came", partOfSpeech: "verb", kind: "vocab" }

lessons:
  # ── L1 · «Ayer fui» — fui, fuiste, fue, the irregular past of «ir», WENT
  #    only. No accent anywhere — the stress already sits on the stem, which
  #    is the whole story: «fui» is not «*fuí». A place always follows, with
  #    «a» or «al». «el museo» debuts on imageMcq (inv 44: first exposure).
  #    ⚠️ NO ser reading here (L2). NO other new verb.
  - n: 1
    template: free
    title: "Ayer fui"
    description: "«ir» throws out every ending you know and hands you a brand-new past. This lesson teaches it doing one job only: saying where you went."
    steps:
      - kind: map
        id: l1-map-ayerfui
        tokens: ["ayer", "fui", "al", "museo"]
        pairs:
          - { en: "yesterday", tokenIndex: 0 }
          - { en: "I went", tokenIndex: 1 }
          - { en: "to the", tokenIndex: 2 }
          - { en: "museum", tokenIndex: 3 }
        audioText: "ayer fui al museo"
        revealNote: "«voy» is I go, now — you have used it since module ten. «fui» is a completely different word for I went, then: one syllable, no accent, the stress already sitting where it needs to. «al» is «a» plus «el» — to the. «el museo» is new: the museum."
      - kind: imageMcq
        id: l1-im-museo
        target: { surface: "el museo", meaningEn: "the museum", emoji: "🏛️" }
        distractors:
          - { surface: "el parque", emoji: "🌳" }
          - { surface: "el cine", emoji: "🎬" }
          - { surface: "la escuela", emoji: "🏫" }
      - kind: speakLit
        id: l1-sp-fui
        es: "fui al museo ayer"
        en: "I went to the museum yesterday"
        atoms: ["fui", "el museo", "ayer"]
      - kind: info
        id: l1-info-preteritoir
        title: "Fui, fuiste, fue — the past of ir"
        body: "A handful of very common verbs throw out the -é/-aste/-ó endings completely and use their own past instead. «ir», to go: «fui», I went; «fuiste», you went; «fue», he or she went. No accent anywhere — say them with the stress already on the one syllable: «fui», «fuiste», «fue». A place follows, with «a» or «al»: «fui al museo», «fuiste al mercado», «fue al parque»."
      - kind: speakLit
        id: l1-sp-fuiste
        es: "fuiste al mercado ayer"
        en: "You went to the market yesterday"
        atoms: ["fuiste", "mercado", "ayer"]
      - kind: buildLit
        id: l1-b-anafuealparque
        es: "Ana fue al parque ayer"
        en: "Ana went to the park yesterday"
        atoms: ["fue", "parque", "ayer"]
        tiles: ["fui", "va"]
      - kind: clozeLit
        id: l1-c-fuialaplaya
        es: "fui a la playa con mi hermano"
        en: "I went to the beach with my brother"
        blank: "fui"
        options: ["fui", "fuiste", "fue"]
        atoms: ["fui", "playa", "hermano"]
        why: "You are the one who went, so «fui» — no accent, no ending like the -ar verbs. «fuiste» would be you; «fue» would be someone else."
      - kind: listenCompLit
        id: l1-lc-fuistealescuela
        es: "fuiste a la escuela ayer"
        en: "You went to school yesterday."
        atoms: ["fuiste", "escuela", "ayer"]
        distractorsEn:
          - "You went to the store yesterday."
          - "She went to school yesterday."
          - "You go to school today."
      - kind: buildLit
        id: l1-b-fuialcineycondiego
        also: ["con Diego fui al cine"]
        es: "fui al cine con Diego"
        en: "I went to the movies with Diego"
        atoms: ["fui", "cine"]
        tiles: ["fue", "voy"]
      - kind: mcq
        id: l1-q-ellafue
        prompt: "Which one means 'she went'?"
        correct: "ella fue"
        distractors: ["ella fui", "ella va", "ella fuiste"]
        atoms: ["fue"]
        why: "«fue» is he or she — someone else went. «fui» is I; «fuiste» is you; «va» slips back into now."
      - kind: audioWimcq
        id: l1-ear-hermano
        target: { surface: "el hermano", emoji: "👦" }
        distractors:
          - { surface: "la hermana", emoji: "👧" }
          - { surface: "el amigo", emoji: "🧑‍🤝‍🧑" }
      - kind: agreementLit
        id: l1-agr-fuiyfuiste
        en: "I went to the museum and you went to the market"
        audioText: "fui al museo y fuiste al mercado"
        atoms: ["fui", "el museo", "fuiste", "mercado"]
        segments:
          - { blank: { id: "p1", answer: "fui", options: ["fui", "fuiste"] } }
          - { text: " al museo y " }
          - { blank: { id: "p2", answer: "fuiste", options: ["fuiste", "fui"] } }
          - { text: " al mercado" }
      - kind: listenBuildLit
        id: l1-lb-fuistealmuseo
        es: "fuiste al museo ayer"
        en: "You went to the museum yesterday"
        atoms: ["fuiste", "el museo", "ayer"]
        tiles: ["fue", "vas"]
      - kind: textMcq
        id: l1-tm-fue
        target: "fue"
        distractors: ["fui", "fuiste", "va"]
      - kind: speakLit
        id: l1-sp-fuialmuseoconamigo
        es: "fui al museo con mi amigo"
        en: "I went to the museum with my friend"
        atoms: ["fui", "el museo", "amigo"]
      - kind: sim
        id: l1-sim-anaaskspast
        scene: { emoji: "🏛️", title: "Ana asks about yesterday", setting: "Ana wants to know where everyone went yesterday." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Fuiste al museo ayer?", audioText: "¿fuiste al museo ayer?", gloss: "Did you go to the museum yesterday?" }
            goal: "Say yes, you went to the museum."
            reply:
              mode: build
              tiles: ["sí", "fui", "al", "museo", "fue", "voy"]
              answer: "sí fui al museo"
            replyGloss: "Yes, I went to the museum."
            explanation: "Ana asked with «fuiste»; you answer about yourself: «fui». «fue» would be someone else; «voy» would be now."
          - id: t2
            npc: { speaker: "Ana", es: "¿Y Diego? ¿Fue al parque?", audioText: "¿y diego? ¿fue al parque?", gloss: "And Diego? Did he go to the park?" }
            goal: "Say yes, he went to the park."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, él fue al parque" }
                - { id: "wrong1", text: "sí, él fui al parque" }
                - { id: "wrong2", text: "sí, él va al parque" }
              correctOptionId: "right"
              audioText: "sí, él fue al parque"
            replyGloss: "Yes, he went to the park."
            explanation: "Diego, in the past: «fue». «fui» is you talking about yourself; «va» slips into now."
          - id: t3
            npc: { speaker: "Ana", es: "¿Fuiste al cine también?", audioText: "¿fuiste al cine también?", gloss: "Did you go to the movies too?" }
            goal: "Say no, you went to the market."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no, fui al mercado" }
                - { id: "wrong1", text: "no, fuiste al mercado" }
                - { id: "wrong2", text: "no, fue al mercado" }
              correctOptionId: "right"
              audioText: "no, fui al mercado"
            replyGloss: "No, I went to the market."
            explanation: "Answering about yourself again: «fui». «fuiste» would ask Ana back; «fue» hands it to someone else."
      - kind: matchLit
        id: l1-match
        pairs:
          - { source: "ayer", target: "yesterday" }
          - { source: "fui", target: "I went" }
          - { source: "fuiste", target: "you went" }
          - { source: "fue", target: "he or she went" }
          - { source: "el museo", target: "the museum" }
          - { source: "el mercado", target: "the market" }
          - { source: "el parque", target: "the park" }
      - kind: speakLit
        id: l1-sp-win
        es: "ayer fui al museo con Ana"
        en: "Yesterday I went to the museum with Ana"
        atoms: ["ayer", "fui", "el museo"]

  # ── L2 · «Fue muy bueno» — no new atoms; opens the ser reading of
  #    fui/fuiste/fue (WAS) and re-spends all three in answer positions
  #    BOTH ways: went (a place, «a»/«al») and was (an adjective or noun).
  #    ⚠️ Never gloss «fue» as only one. NO new verb, no new noun.
  - n: 2
    template: free
    title: "Fue muy bueno"
    description: "Same three words as last lesson — but with nothing about a place after them, «fui», «fuiste», «fue» do a second job: they're also the past of «ser», to be."
    steps:
      - kind: map
        id: l2-map-lapeliculafuebuena
        tokens: ["la", "película", "fue", "muy", "buena"]
        pairs:
          - { en: "the", tokenIndex: 0 }
          - { en: "movie", tokenIndex: 1 }
          - { en: "was", tokenIndex: 2 }
          - { en: "very", tokenIndex: 3 }
          - { en: "good", tokenIndex: 4 }
        audioText: "la película fue muy buena"
        revealNote: "«fue» again — but this time no place follows it. An adjective does: «buena». That is the other job «fue» does: it is also the past of «ser», to be. «la película fue muy buena» — the movie was very good."
      - kind: info
        id: l2-info-serpasado
        title: "Fue — went, or was"
        body: "«fui», «fuiste», «fue» do double duty: they are also the past of «ser», to be. The marker gives it away. A place after them, with «a» or «al», means went: «fui al museo». An adjective or a noun after them means was: «fue muy buena», «fui estudiante», «fuiste muy bueno». Same three words, same no-accent stems — only what follows tells you which."
      - kind: speakLit
        id: l2-sp-fuemuybueno
        es: "la película fue muy buena"
        en: "The movie was very good"
        atoms: ["fue", "película"]
      - kind: buildLit
        id: l2-b-fuiestudiante
        es: "fui estudiante en la escuela"
        en: "I was a student at the school"
        atoms: ["fui", "estudiante", "escuela"]
        tiles: ["fue", "soy"]
      - kind: clozeLit
        id: l2-c-fuistemuybueno
        es: "fuiste muy bueno con mi hermano"
        en: "You were very good to my brother"
        blank: "fuiste"
        options: ["fuiste", "fue", "fui"]
        atoms: ["fuiste", "hermano"]
        why: "You are the one being described, so «fuiste» — you were. «fue» would be someone else; «fui» would be you talking about yourself."
      - kind: listenCompLit
        id: l2-lc-fuimimaestro
        es: "fue mi maestro"
        en: "He was my teacher."
        atoms: ["fue", "maestro"]
        distractorsEn:
          - "He is my teacher."
          - "She was my teacher."
          - "He was my friend."
      - kind: buildLit
        id: l2-b-fuialparqueconsofia
        es: "fui al parque con Sofía"
        en: "I went to the park with Sofía"
        atoms: ["fui", "parque"]
        tiles: ["fue", "voy"]
      - kind: mcq
        id: l2-q-tufuiste
        prompt: "Which one means 'you went'?"
        correct: "tú fuiste"
        distractors: ["tú fue", "tú fui", "tú vas"]
        atoms: ["fuiste"]
        why: "«fuiste» — you, in the past. «fue» is someone else; «fui» is you talking about yourself; «vas» slips into now."
      - kind: audioWimcq
        id: l2-ear-carro
        target: { surface: "el carro", emoji: "🚗" }
        distractors:
          - { surface: "el regalo", emoji: "🎁" }
          - { surface: "la camisa", emoji: "👕" }
      - kind: agreementLit
        id: l2-agr-fuiyfuistewas
        en: "I was your friend and you were my friend"
        audioText: "fui tu amigo y tú fuiste mi amigo"
        atoms: ["fui", "amigo", "fuiste"]
        segments:
          - { blank: { id: "p1", answer: "fui", options: ["fui", "fuiste"] } }
          - { text: " tu amigo y tú " }
          - { blank: { id: "p2", answer: "fuiste", options: ["fuiste", "fui"] } }
          - { text: " mi amigo" }
      - kind: listenBuildLit
        id: l2-lb-fuemuygrande
        es: "la fiesta fue muy grande"
        en: "The party was very big"
        atoms: ["fue", "fiesta"]
        tiles: ["fui", "es"]
      - kind: textMcq
        id: l2-tm-fue
        target: "fue"
        distractors: ["fui", "fuiste", "va"]
      - kind: speakLit
        id: l2-sp-fuistealmercado
        es: "fuiste al mercado ayer"
        en: "You went to the market yesterday"
        atoms: ["fuiste", "mercado", "ayer"]
      - kind: sim
        id: l2-sim-anaasksmovie
        scene: { emoji: "🎬", title: "Ana asks about the weekend", setting: "Ana wants to know how the movie was, and who went where." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Cómo fue la película?", audioText: "¿cómo fue la película?", gloss: "How was the movie?" }
            goal: "Say it was very good."
            reply:
              mode: build
              tiles: ["fue", "muy", "buena", "fui", "bueno"]
              answer: "fue muy buena"
            replyGloss: "It was very good."
            explanation: "No place follows «fue» here, so it means was — the movie, «buena» in the feminine. «fui» would be I."
          - id: t2
            npc: { speaker: "Ana", es: "¿Fuiste al cine también?", audioText: "¿fuiste al cine también?", gloss: "Did you go to the movies too?" }
            goal: "Say yes, you went with Diego."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, fui con Diego" }
                - { id: "wrong1", text: "sí, fue con Diego" }
                - { id: "wrong2", text: "sí, fuiste con Diego" }
              correctOptionId: "right"
              audioText: "sí, fui con Diego"
            replyGloss: "Yes, I went with Diego."
            explanation: "Answering about yourself: «fui». «fue» would be someone else; «fuiste» would ask Ana back."
          - id: t3
            npc: { speaker: "Ana", es: "¿Y tu maestro? ¿Fue bueno?", audioText: "¿y tu maestro? ¿fue bueno?", gloss: "And your teacher? Was he good?" }
            goal: "Say yes, he was very good."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, fue muy bueno" }
                - { id: "wrong1", text: "sí, fui muy bueno" }
                - { id: "wrong2", text: "sí, fuiste muy bueno" }
              correctOptionId: "right"
              audioText: "sí, fue muy bueno"
            replyGloss: "Yes, he was very good."
            explanation: "The teacher, in the past: «fue». «fui» would be I; «fuiste» would be you."
      - kind: matchLit
        id: l2-match
        pairs:
          - { source: "fui", target: "I went / I was" }
          - { source: "fuiste", target: "you went / you were" }
          - { source: "fue", target: "he or she went / was" }
          - { source: "la película", target: "the movie" }
          - { source: "bueno", target: "good" }
          - { source: "el maestro", target: "the teacher" }
          - { source: "la fiesta", target: "the party" }
      - kind: speakLit
        id: l2-sp-win
        es: "la película fue muy buena"
        en: "The movie was very good"
        atoms: ["fue", "película"]

  # ── L3 · «¿Qué hiciste?» — hice, hiciste, hizo. The past, for hacer: «hago»
  #    (now) skips its usual ending in the past — a fresh stem, no accent, and
  #    the c softens to z before o. The module's given win line for this
  #    lesson is «anoche hice pizza»; every other sentence in the lesson
  #    stays inside the confirmed PRIOR list, so «pizza» (PRIOR) closes it
  #    once, at the very end, and is not credited as an exercised atom.
  - n: 3
    template: free
    title: "¿Qué hiciste?"
    description: "«hacer» skips its usual ending in the past: hice, hiciste, hizo — a new stem, no accent, and the c turns to z before o."
    steps:
      - kind: map
        id: l3-map-anochehicelatarea
        tokens: ["anoche", "hice", "la", "tarea"]
        pairs:
          - { en: "last night", tokenIndex: 0 }
          - { en: "I did", tokenIndex: 1 }
          - { en: "the", tokenIndex: 2 }
          - { en: "homework", tokenIndex: 3 }
        audioText: "anoche hice la tarea"
        revealNote: "«hago» is I do, now. «hice» — no accent, the stress already sits on the stem — is I did or I made. «anoche» tells you it's coming."
      - kind: info
        id: l3-info-hacer
        title: "The past, for hacer"
        body: "«hago» is I do, now. In the past: «hice», I did or I made; «hiciste», you did; «hizo», he did, she did — no accent anywhere, the stem already carries the weight. And the c of «hacer» turns to z before o: «hace» now, «hizo» then. «anoche hice la tarea» — last night I did the homework."
