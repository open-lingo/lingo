          - { source: "el viaje", target: "the trip" }
          - { source: "el parque", target: "the park" }
      - kind: speakLit
        id: l5-sp-win
        es: "vi a Diego en el parque"
        en: "I saw Diego in the park"
        atoms: ["vi", "parque"]

  # ── L6 · «El mes pasado» — «el mes pasado» debuts, the fifth time
  #    marker. No new verb forms: every sentence mixes an m19 regular
  #    preterite (PRIOR since m19) with an m20 irregular (PRIOR since
  #    L1–L5 of this module), so the learner has to pick the right
  #    machine for the verb, not just toggle an accent. «viniste» stays
  #    unprinted.
  - n: 6
    template: free
    title: "El mes pasado"
    description: "One more marker for when — and this time nothing new to learn about the verbs. Every sentence makes you choose: is this word's past regular, or does it have its own machine?"
    steps:
      - kind: map
        id: l6-map-elmespasado
        tokens: ["el", "mes", "pasado", "fui", "a", "México"]
        pairs:
          - { en: "the", tokenIndex: 0 }
          - { en: "month", tokenIndex: 1 }
          - { en: "past", tokenIndex: 2 }
          - { en: "I went", tokenIndex: 3 }
          - { en: "to", tokenIndex: 4 }
          - { en: "Mexico", tokenIndex: 5 }
        audioText: "el mes pasado fui a México"
        revealNote: "«el mes pasado» — the month that passed: last month. It works exactly like «la semana pasada» and «el fin de semana» — always in front of a past verb."
        tokenGenders: { 0: "m", 1: "m", 2: "m" }
      - kind: info
        id: l6-info-elmespasado
        title: "One more way to say when"
        body: "«el mes pasado» — last month — joins «ayer», «anoche», «la semana pasada» and «el fin de semana» on the list of words that call for the past. This marker doesn't care which machine the verb uses: a regular one from thirty lessons ago, or one of this module's irregulars. «el mes pasado fui a México» — «fui», not «voy», because the marker says then. The marker decides the tense; the verb's own memory decides the form."
      - kind: speakLit
        id: l6-sp-mespasado
        es: "el mes pasado tuve una fiesta"
        en: "Last month I had a party"
        atoms: ["el mes pasado", "tuve", "fiesta"]
      - kind: buildLit
        id: l6-b-trabajemucho
        es: "el mes pasado trabajé mucho"
        en: "Last month I worked a lot"
        atoms: ["el mes pasado", "trabajé"]
        tiles: ["trabajo", "trabajó"]
      - kind: clozeLit
        id: l6-c-diegotuvo
        es: "el mes pasado Diego tuvo mucho trabajo"
        en: "Last month Diego had a lot of work"
        blank: "tuvo"
        options: ["tuvo", "trabajó", "tiene"]
        atoms: ["el mes pasado", "tuvo", "trabajo"]
        why: "Diego HAD work — «tener», not «trabajar» — so «tuvo», the irregular past. «trabajó» is a different verb, he worked; «tiene» is now."
      - kind: listenCompLit
        id: l6-lc-escribi
        es: "el mes pasado escribí un mensaje a mi hermano"
        en: "Last month I wrote a message to my brother."
        atoms: ["el mes pasado", "escribí", "mensaje", "hermano"]
        distractorsEn:
          - "Last month I wrote a message to my sister."
          - "Last night I wrote a message to my brother."
          - "Last month she wrote a message to my brother."
      - kind: buildLit
        id: l6-b-viamigos
        es: "el mes pasado vi a mis amigos en la playa"
        en: "Last month I saw my friends at the beach"
        atoms: ["el mes pasado", "vi", "amigo", "playa"]
        tiles: ["vio", "viste"]
      - kind: mcq
        id: l6-q-fue
        prompt: "Last month Ana went to the party — which verb?"
        correct: "fue"
        distractors: ["fui", "va", "estuvo"]
        atoms: ["fue", "fiesta"]
        why: "«fue» — went, a place after it with «a» — is he or she, past. «fui» is I; «va» is now; «estuvo» would mean she WAS at the party, not that she went."
      - kind: audioWimcq
        id: l6-ear-playa
        target: { surface: "la playa", emoji: "🏖️" }
        distractors:
          - { surface: "el parque", emoji: "🌳" }
          - { surface: "el mercado", emoji: "🛒" }
      # Printed non-recall at m20 L3 (es-m20-3-l3-sp-win).
      - kind: speakLit
        id: l6-sp-recall-hice
        es: "anoche hice pizza"
        en: "Last night I made pizza"
        atoms: []
        cue: recall
      - kind: agreementLit
        id: l6-agr-fuihice
        en: "Last month I went to the market and I did the homework"
        audioText: "el mes pasado fui al mercado e hice la tarea"
        atoms: ["el mes pasado", "fui", "mercado", "hice", "tarea"]
        segments:
          - { text: "el mes pasado " }
          - { blank: { id: "p1", answer: "fui", options: ["fui", "voy"] } }
          - { text: " al mercado e " }
          - { blank: { id: "p2", answer: "hice", options: ["hice", "hago"] } }
          - { text: " la tarea" }
      - kind: listenBuildLit
        id: l6-lb-estuveplaya
        es: "el mes pasado estuve en la playa"
        en: "Last month I was at the beach"
        atoms: ["el mes pasado", "estuve", "playa"]
        tiles: ["estuvo", "estoy"]
      - kind: textMcq
        id: l6-tm-tuvo
        target: "tuvo"
        distractors: ["tiene", "tuve", "trabajó"]
      - kind: speakLit
        id: l6-sp-vinofiesta
        es: "el mes pasado Diego vino a la fiesta y comió pizza"
        en: "Last month Diego came to the party and ate pizza"
        atoms: ["el mes pasado", "vino", "fiesta", "comió", "pizza"]
      - kind: sim
        id: l6-sim-carmen-mespasado
        scene: { emoji: "🗓️", title: "Carmen and last month", setting: "Carmen wants the whole story of last month, in order." }
        turns:
          - id: t1
            npc: { speaker: "Carmen", es: "¿Qué hiciste el mes pasado?", audioText: "¿qué hiciste el mes pasado?", gloss: "What did you do last month?" }
            goal: "Say you went to Mexico."
            reply:
              mode: build
              tiles: ["el", "mes", "pasado", "fui", "a", "México", "fue", "voy"]
              answer: "el mes pasado fui a México"
            replyGloss: "Last month I went to Mexico."
            explanation: "«hiciste» asks in general; «fui» answers with the specific verb — went, not did."
          - id: t2
            npc: { speaker: "Carmen", es: "¿Y saliste con tus amigos?", audioText: "¿y saliste con tus amigos?", gloss: "And did you go out with your friends?" }
            goal: "Say no, you had a lot of work."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no, tuve mucho trabajo" }
                - { id: "wrong1", text: "no, tengo mucho trabajo" }
                - { id: "wrong2", text: "no, tuvo mucho trabajo" }
              correctOptionId: "right"
              audioText: "no, tuve mucho trabajo"
            replyGloss: "No, I had a lot of work."
            explanation: "About yourself, in the past: «tuve». «tengo» is now; «tuvo» is somebody else."
          - id: t3
            npc: { speaker: "Carmen", es: "Diego trabajó todo el mes.", audioText: "diego trabajó todo el mes", gloss: "Diego worked the whole month." }
            goal: "Say you worked, but went to the museum."
            reply:
              mode: choice
              options:
                - { id: "right", text: "yo también trabajé, pero fui al museo" }
                - { id: "wrong1", text: "yo también trabajé, pero voy al museo" }
                - { id: "wrong2", text: "yo también trabajo, pero fui al museo" }
              correctOptionId: "right"
              audioText: "yo también trabajé, pero fui al museo"
            replyGloss: "I worked too, but I went to the museum."
            explanation: "Both halves need the past: «trabajé» ... «fui». «voy» breaks the second half's tense; «trabajo» breaks the first's."
      - kind: matchLit
        id: l6-match
        pairs:
          - { source: "el mes pasado", target: "last month" }
          - { source: "fui", target: "I went" }
          - { source: "tuve", target: "I had" }
          - { source: "hice", target: "I did / I made" }
          - { source: "vi", target: "I saw" }
          - { source: "vino", target: "he or she came" }
          - { source: "trabajé", target: "I worked" }
      - kind: speakLit
        id: l6-sp-win
        es: "el mes pasado fui a México"
        en: "Last month I went to Mexico"
        atoms: ["el mes pasado", "fui", "México"]

  # ── L7 · «¿Fuiste? No fui» — ZERO new atoms. Questions and negation
  #    across every family of the module: ir/ser, hacer, tener, ver, venir.
  #    Every form used here was debuted by L1–L6 and is PRIOR within the
  #    module; each form spent as a cloze answer is still spoken (speakLit)
  #    earlier in THIS lesson first. «viniste» (L8's transfer cell) never
  #    appears here.
  - n: 7
    template: free
    title: "¿Fuiste? No fui"
    description: "Asking what somebody did, and saying what you did not do — every irregular family of the module, in questions and «no»."
    steps:
      - kind: map
        id: l7-map-novi
        tokens: ["no", "vi", "la", "película", "ayer"]
        pairs:
          - { en: "not", tokenIndex: 0 }
          - { en: "I saw", tokenIndex: 1 }
          - { en: "the", tokenIndex: 2 }
          - { en: "movie", tokenIndex: 3 }
          - { en: "yesterday", tokenIndex: 4 }
        audioText: "no vi la película ayer"
        revealNote: "«no» goes where it always goes — in front of the verb — and «vi» doesn't change at all. Same rule as every other past tense you've met."
        tokenGenders: { 2: "f", 3: "f" }
      - kind: info
        id: l7-info-preguntasnegacion
        title: "Asking about yesterday, and saying no"
        body: "A question in the past just puts «¿…?» around the form you already know: «¿fuiste al museo?» — did you go to the museum?; «¿qué hiciste anoche?» — what did you do last night?; «¿tuviste mucho trabajo?» — did you have a lot of work?; «¿viste la película?» — did you see the movie? And «no» does what it always does — it sits in front of the verb, and the ending never changes: «no fui», «no hice», «no tuve», «no vi», «no vine»."
      - kind: speakLit
        id: l7-sp-fuistemuseo
        es: "¿fuiste al museo el fin de semana?"
        en: "Did you go to the museum this weekend?"
        atoms: ["fuiste", "el museo", "el fin de semana"]
      - kind: buildLit
        id: l7-b-nofuifiesta
        es: "no fui a la fiesta"
        en: "I didn't go to the party"
        atoms: ["fui", "fiesta"]
        tiles: ["voy", "va"]
      - kind: listenCompLit
        id: l7-lc-quehiciste
        es: "¿qué hiciste anoche?"
        en: "What did you do last night?"
        atoms: ["hiciste", "anoche"]
        distractorsEn:
          - "What did you do today?"
          - "What did she do last night?"
          - "What do you do every night?"
      - kind: buildLit
        id: l7-b-nohicetarea
        es: "no hice la tarea"
        en: "I didn't do the homework"
        atoms: ["hice", "tarea"]
        tiles: ["hago", "hizo"]
      - kind: speakLit
        id: l7-sp-tuvetrabajo
        es: "tuve mucho trabajo la semana pasada"
        en: "I had a lot of work last week"
        atoms: ["tuve", "trabajo", "la semana pasada"]
      - kind: clozeLit
        id: l7-c-notuve
        es: "el fin de semana no tuve mucho trabajo"
        en: "On the weekend I didn't have much work"
        blank: "tuve"
        options: ["tuve", "tengo", "tuvo"]
        atoms: ["el fin de semana", "tuve", "trabajo"]
        why: "«no» in front, the past kept: «tuve»."
      - kind: mcq
        id: l7-q-tuviste
        prompt: "Which one means 'you had'?"
        correct: "tuviste"
        distractors: ["tuve", "tuvo", "tienes"]
        atoms: ["tuviste"]
        why: "-iste is you, in the past: «tuviste»."
      - kind: audioWimcq
        id: l7-ear-fiesta
        target: { surface: "la fiesta", emoji: "🎉" }
        distractors:
          - { surface: "la escuela", emoji: "🏫" }
          - { surface: "la tienda", emoji: "🏪" }
      # Printed non-recall at L1 (es-m20-1-l1-sp-win).
      - kind: speakLit
        id: l7-sp-recall-ayerfuimuseo
        es: "ayer fui al museo con Ana"
        en: "Yesterday I went to the museum with Ana"
        atoms: []
        cue: recall
      - kind: agreementLit
        id: l7-agr-vistevio
        en: "You saw the movie, and Diego saw it too"
        audioText: "tú viste la película, y Diego también la vio"
        atoms: ["viste", "película", "vio"]
        segments:
          - { text: "tú " }
          - { blank: { id: "p1", answer: "viste", options: ["viste", "vio"] } }
          - { text: " la película, y Diego también la " }
          - { blank: { id: "p2", answer: "vio", options: ["vio", "viste"] } }
      - kind: listenBuildLit
        id: l7-lb-vimercado
        es: "vi a Sofía en el mercado"
        en: "I saw Sofía at the market"
        atoms: ["vi", "mercado"]
        tiles: ["veo", "vio"]
      - kind: textMcq
        id: l7-tm-vine
        target: "vine"
        distractors: ["vengo", "vino", "viene"]
      - kind: speakLit
        id: l7-sp-novine
        es: "no vine a la fiesta anoche"
        en: "I didn't come to the party last night"
        atoms: ["vine", "fiesta", "anoche"]
      - kind: buildLit
        id: l7-b-diegofuemuseo
        es: "Diego no fue al museo, tuvo mucho trabajo"
        en: "Diego didn't go to the museum, he had a lot of work"
        atoms: ["fue", "el museo", "tuvo", "trabajo"]
        tiles: ["fui", "tuve"]
      - kind: sim
        id: l7-sim-diego-fiesta
        scene: { emoji: "🎉", title: "Diego's party, the morning after", setting: "Diego's party was last night and he wants the full report." }
        turns:
          - id: t1
            npc: { speaker: "Diego", es: "¿Fuiste a la fiesta anoche?", audioText: "¿fuiste a la fiesta anoche?", gloss: "Did you go to the party last night?" }
            goal: "Say no, you didn't go, you had work."
            reply:
              mode: build
              tiles: ["no", "fui", "y", "tuve", "trabajo", "voy", "tuvo"]
              answer: "no fui y tuve trabajo"
            replyGloss: "No, I didn't go and I had work."
            explanation: "«no» in front, the past kept: «no fui». Same pattern for the next clause: «tuve»."
          - id: t2
            npc: { speaker: "Diego", es: "¿Vio Sofía a Ana allí?", audioText: "¿vio sofía a ana allí?", gloss: "Did Sofía see Ana there?" }
            goal: "Say no, Sofía didn't see her."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no, Sofía no vio a Ana" }
                - { id: "wrong1", text: "no, Sofía no vi a Ana" }
                - { id: "wrong2", text: "no, Sofía no ve a Ana" }
              correctOptionId: "right"
              audioText: "no, sofía no vio a ana"
            replyGloss: "No, Sofía didn't see her."
            explanation: "Sofía, in the past: «vio». Not «vi» (that's you), not «ve» (that's now)."
          - id: t3
            npc: { speaker: "Diego", es: "Ana no vino a la fiesta.", audioText: "ana no vino a la fiesta.", gloss: "Ana didn't come to the party." }
            goal: "Say no, you didn't come, you had work."
            reply:
              mode: build
              tiles: ["no", "vine", "y", "tuve", "trabajo", "vengo", "vino"]
              answer: "no vine y tuve trabajo"
            replyGloss: "No, I didn't come and I had work."
            explanation: "«vine» is the same shape as «vi» — no accent, stress on the stem."
      - kind: matchLit
        id: l7-match
        pairs:
          - { source: "¿fuiste al museo?", target: "did you go to the museum?" }
          - { source: "no fui", target: "I didn't go" }
          - { source: "¿qué hiciste?", target: "what did you do?" }
          - { source: "no hice", target: "I didn't do" }
          - { source: "¿tuviste trabajo?", target: "did you have work?" }
          - { source: "no tuve", target: "I didn't have" }
          - { source: "no vine", target: "I didn't come" }
      - kind: speakLit
        id: l7-sp-win
        es: "no fui a la fiesta anoche"
        en: "I didn't go to the party last night"
        atoms: ["fui", "fiesta", "anoche"]

  # ── L8 · CHECKPOINT — graded only. Every one of the 20 taught irregular-
  #    preterite atoms (fui/fuiste/fue, hice/hiciste/hizo, tuve/tuviste/tuvo,
  #    estuve/estuviste/estuvo, vi/viste/vio, vine/vino, el mes pasado, el
  #    museo, el viaje) earns an answer position — ten paired build/listen-
  #    build sentences (cp-build-1 … cp-lb-4), each carrying two forms via
  #    «y», cover all 20 in ten steps. «fue» is cashed BOTH ways
  #    (cp-build-2 = went, cp-build-3 = was).
  #    ── TRANSFER: cp-transfer-viniste — «venir» handed over cold as "you
  #    came ... — venir"; the bank holds «vine» and «vino» as foils (both
  #    registered). Exactly one step.
  #    Cloze share 1/20; recalls 2 (L1 win, L6 win); closes sim → match → win.
  - n: 8
    template: free
    title: "L8 ✓ Checkpoint · Fui, hice, tuve"
    description: "Every irregular past, both readings of «fue», and one verb you have never conjugated."
    steps:
      - kind: buildLit
        id: cp-build-1
        es: "ayer fui al parque y vi a Sofía"
        en: "Yesterday I went to the park and saw Sofía"
        atoms: ["ayer", "fui", "parque", "vi"]
        tiles: ["fue", "vio"]
      - kind: listenBuildLit
        id: cp-lb-1
        es: "¿fuiste al cine y viste la película?"
        en: "Did you go to the movies and see the movie?"
        atoms: ["fuiste", "viste", "película"]
        tiles: ["fue", "vio"]
      - kind: buildLit
        id: cp-build-2
        es: "Diego fue al mercado y vio a Carmen"
        en: "Diego went to the market and saw Carmen"
        atoms: ["fue", "vio"]
        tiles: ["fui", "vi"]
      - kind: audioWimcq
        id: cp-ear-1
        target: { surface: "la fiesta", emoji: "🎉" }
        distractors:
          - { surface: "el regalo", emoji: "🎁" }
          - { surface: "el mensaje", emoji: "✉️" }
      - kind: buildLit
        id: cp-build-3
        es: "el viaje fue muy bueno"
        en: "The trip was very good"
        atoms: ["el viaje", "fue"]
        tiles: ["fui", "fuiste"]
      - kind: listenBuildLit
        id: cp-lb-2
        es: "anoche hice la tarea y tuve mucho trabajo"
        en: "Last night I did the homework and had a lot of work"
        atoms: ["anoche", "hice", "tarea", "tuve", "trabajo"]
        tiles: ["hizo", "tuvo"]
      - kind: buildLit
        id: cp-build-4
        es: "¿hiciste la tarea y tuviste una fiesta?"
        en: "Did you do the homework and have a party?"
        atoms: ["hiciste", "tarea", "tuviste", "fiesta"]
        tiles: ["hizo", "tuvo"]
      - kind: listenBuildLit
        id: cp-lb-3
        es: "Ana hizo la tarea y tuvo una fiesta"
        en: "Ana did the homework and had a party"
        atoms: ["hizo", "tarea", "tuvo", "fiesta"]
        tiles: ["hice", "tuve"]
      # Printed non-recall at L1 (es-m20-1-l1-sp-win).
      - kind: speakLit
        id: cp-sp-recall-1
        es: "ayer fui al museo con Ana"
        en: "Yesterday I went to the museum with Ana"
        atoms: []
        cue: recall
      - kind: buildLit
        id: cp-build-5
        es: "estuve en el museo y vine temprano"
        en: "I was at the museum and came back early"
        atoms: ["estuve", "el museo", "vine"]
        tiles: ["estuvo", "vino"]
      - kind: listenBuildLit
        id: cp-lb-4
        es: "estuviste en la fiesta y vino Sam"
        en: "You were at the party and Sam came"
        atoms: ["estuviste", "fiesta", "vino"]
        tiles: ["estuvo", "viene"]
      - kind: mcq
        id: cp-q-1
        prompt: "Which one means 'you saw'?"
        correct: "viste"
        distractors: ["vi", "vio", "veo"]
        atoms: ["viste"]
        why: "-iste is the you-ending of the past."
      - kind: buildLit
        id: cp-build-6
        es: "el mes pasado Diego estuvo en México"
        en: "Last month Diego was in Mexico"
        atoms: ["el mes pasado", "estuvo"]
        tiles: ["estuve", "estuviste"]
      - kind: clozeLit
        id: cp-cloze-1
        es: "Diego estuvo en la fiesta anoche"
        en: "Diego was at the party last night"
        blank: "estuvo"
        options: ["estuvo", "está"]
        atoms: ["estuvo"]
        why: "Diego, in the past: «estuvo»."
      - kind: listenCompLit
        id: cp-lc-1
        es: "Carmen vio a Ana en el museo"
        en: "Carmen saw Ana at the museum."
        atoms: ["vio", "el museo"]
        distractorsEn:
          - "Carmen sees Ana at the museum."
          - "Carmen saw Ana at the park."
          - "Diego saw Ana at the museum."
      # Printed non-recall at L6 (es-m20-6-l6-sp-win).
      - kind: speakLit
        id: cp-sp-recall-2
        es: "el mes pasado fui a México"
        en: "Last month I went to Mexico"
        atoms: []
        cue: recall
      # ── THE TRANSFER: a verb form the module never conjugated, glossed cold.
      - kind: buildLit
        id: cp-transfer-viniste
        es: "viniste a la fiesta ayer"
        en: "You came to the party yesterday — venir"
        atoms: ["viniste"]
        tiles: ["vine", "vino"]
      - kind: sim
        id: cp-sim-ana
        scene: { emoji: "✅", title: "One more check-in", setting: "Sunday night. Last questions before the week starts again." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Fuiste a la fiesta ayer?", audioText: "¿fuiste a la fiesta ayer?", gloss: "Did you go to the party yesterday?" }
            goal: "Say yes, and you saw Sam there."
            reply:
              mode: build
              tiles: ["sí", "fui", "y", "vi", "a", "Sam", "fue", "vio"]
              answer: "sí fui y vi a Sam"
            replyGloss: "Yes, and I saw Sam."
            explanation: "«fui» and «vi» — both about you, in the past."
          - id: t2
            npc: { speaker: "Ana", es: "¿Tuviste un viaje muy bueno?", audioText: "¿tuviste un viaje muy bueno?", gloss: "Did you have a very good trip?" }
            goal: "Say yes, you had a very good trip."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, tuve un viaje muy bueno" }
                - { id: "wrong1", text: "sí, tengo un viaje muy bueno" }
                - { id: "wrong2", text: "sí, tuvo un viaje muy bueno" }
              correctOptionId: "right"
              audioText: "sí, tuve un viaje muy bueno"
            replyGloss: "Yes, I had a very good trip."
            explanation: "«tuve» — you, in the past."
      - kind: matchLit
        id: cp-match
        pairs:
          - { source: "fui", target: "I went" }
          - { source: "hice", target: "I did / made" }
          - { source: "tuve", target: "I had" }
          - { source: "estuvo", target: "he or she was (somewhere)" }
          - { source: "vi", target: "I saw" }
          - { source: "vino", target: "he or she came" }
          - { source: "el museo", target: "the museum" }
      - kind: speakLit
        id: cp-sp-final
        es: "¿qué hiciste el fin de semana?"
        en: "What did you do on the weekend?"
        atoms: ["hiciste", "el fin de semana"]

  # ── L9 · «Hoy y ayer» — ZERO new atoms. Consolidation: all six irregular
  #    families (ir/ser, hacer, tener, estar, ver, venir) side by side with
  #    the m19 regulars, plus the now-vs-then hinge «hoy … pero ayer …».
  #    One info card explains the hinge; every clause keeps its own marker
  #    and tense (rule: hoy/mañana never with a preterite). Both cloze
  #    answers are spoken earlier in this lesson first. Two recalls (L2,
  #    L5). Ends sim → match → sp-win, like every other lesson.
  - n: 9
    template: free
    title: "Hoy y ayer"
    description: "Today against yesterday — every irregular the module taught, next to the regulars from m19, in one hinge: «pero»."
    steps:
      - kind: map
        id: l9-map-hoyestudioayer
        tokens: ["hoy", "estudio", "pero", "ayer", "trabajé"]
        pairs:
          - { en: "today", tokenIndex: 0 }
          - { en: "I study", tokenIndex: 1 }
          - { en: "but", tokenIndex: 2 }
          - { en: "yesterday", tokenIndex: 3 }
          - { en: "I worked", tokenIndex: 4 }
        audioText: "hoy estudio, pero ayer trabajé"
        revealNote: "«hoy» keeps the everyday form; «pero ayer» switches to the past. Same idea, one word decides which."
      - kind: info
        id: l9-info-hoyperoayer
        title: "Today, but yesterday"
        body: "«hoy» and «mañana» want the everyday form: «hoy estudio», «mañana trabajo». «pero ayer», «anoche», «la semana pasada» switch to the past — and that past can be a regular ending like «trabajé», or one of this module's own shapes: «fui», «hice», «tuve», «vi», «vine». «pero» is the hinge: one clause now, one clause then."
      - kind: speakLit
        id: l9-sp-fuimuseoayer
        es: "ayer fui al museo, pero hoy estudio"
        en: "Yesterday I went to the museum, but today I study"
        atoms: ["fui", "el museo", "hoy", "estudio"]
      - kind: buildLit
        id: l9-b-anacomprovshice
        es: "Ana compró el regalo, pero yo hice la tarea"
        en: "Ana bought the gift, but I did the homework"
        atoms: ["compró", "regalo", "hice", "tarea"]
        tiles: ["compra", "hago"]
      - kind: clozeLit
        id: l9-c-fuiespana
        es: "el mes pasado fui a España con mi familia"
        en: "Last month I went to Spain with my family"
        blank: "fui"
        options: ["fui", "voy", "fue"]
        atoms: ["el mes pasado", "fui", "España", "familia"]
        why: "«el mes pasado» + I: «fui»."
      - kind: mcq
        id: l9-q-hiciste
        prompt: "Which one means 'you did'?"
        correct: "hiciste"
        distractors: ["hice", "hizo", "haces"]
        atoms: ["hiciste"]
        why: "-iste is you, in the past: «hiciste»."
      - kind: audioWimcq
        id: l9-ear-carro
        target: { surface: "el carro", emoji: "🚗" }
        distractors:
          - { surface: "la tienda", emoji: "🏪" }
          - { surface: "el mercado", emoji: "🛒" }
      # Printed non-recall at L2 (es-m20-2-l2-sp-win).
      - kind: speakLit
        id: l9-sp-recall-peliculafue
        es: "la película fue muy buena"
        en: "The movie was very good"
        atoms: []
        cue: recall
      - kind: listenCompLit
        id: l9-lc-tuvoperohoy
        es: "Sofía tuvo mucho trabajo la semana pasada, pero hoy no trabaja"
        en: "Sofía had a lot of work last week, but today she doesn't work"
        atoms: ["tuvo", "trabajo", "la semana pasada", "hoy", "trabaja"]
        distractorsEn:
          - "Sofía has a lot of work this week, but yesterday she didn't work."
          - "Sofía had a lot of work last week, and today she works too."
          - "Diego had a lot of work last week, but today he doesn't work."
      - kind: buildLit
        id: l9-b-viplayavio
        es: "vi a Sofía en la playa, y ella vio a Diego"
        en: "I saw Sofía at the beach, and she saw Diego"
        atoms: ["vi", "playa", "vio"]
        tiles: ["veo", "ve"]
      - kind: speakLit
        id: l9-sp-vinofiesta
        es: "Diego vino a la fiesta, pero Ana no vino"
        en: "Diego came to the party, but Ana didn't come"
        atoms: ["vino", "fiesta"]
      - kind: clozeLit
        id: l9-c-vinoanoche
        es: "anoche Diego vino a la fiesta"
        en: "Last night Diego came to the party"
        blank: "vino"
        options: ["vino", "vine", "viene"]
        atoms: ["anoche", "vino", "fiesta"]
        why: "Diego, then: «vino»."
      - kind: textMcq
        id: l9-tm-viste
        target: "viste"
        distractors: ["vi", "vio", "veo"]
      - kind: listenBuildLit
        id: l9-lb-hableycocine
        es: "hablé con mi abuela y cociné pollo"
        en: "I spoke with my grandmother and cooked chicken"
        atoms: ["hablé", "abuela", "cociné", "pollo"]
        tiles: ["hablo", "cocino"]
      # Printed non-recall at L5 (es-m20-5-l5-sp-win).
      - kind: speakLit
        id: l9-sp-recall-viparque
        es: "vi a Diego en el parque"
        en: "I saw Diego at the park"
        atoms: []
        cue: recall
      - kind: agreementLit
        id: l9-agr-tuvetuvo
        en: "On the weekend I had a lot of work, but Diego didn't have work"
        audioText: "el fin de semana tuve mucho trabajo, pero Diego no tuvo trabajo"
        atoms: ["el fin de semana", "tuve", "trabajo", "tuvo"]
        segments:
          - { text: "el fin de semana " }
          - { blank: { id: "p1", answer: "tuve", options: ["tuve", "tuvo"] } }
          - { text: " mucho trabajo, pero Diego no " }
          - { blank: { id: "p2", answer: "tuvo", options: ["tuvo", "tuve"] } }
      - kind: mcq
        id: l9-q-estuviste
        prompt: "Which one means 'you were (somewhere)'?"
        correct: "estuviste"
        distractors: ["estuve", "estuvo", "estás"]
        atoms: ["estuviste"]
        why: "es- + tuviste: «estuviste»."
      - kind: sim
        id: l9-sim-ana-hoyantes
        scene: { emoji: "📅", title: "Ana wants the whole story", setting: "Ana missed the whole week and wants to know what happened, and what's different today." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Qué hiciste la semana pasada?", audioText: "¿qué hiciste la semana pasada?", gloss: "What did you do last week?" }
            goal: "Say you went to the museum and worked."
            reply:
              mode: build
              tiles: ["fui", "al", "museo", "y", "trabajé", "voy", "trabajo"]
              answer: "fui al museo y trabajé"
            replyGloss: "I went to the museum and worked."
            explanation: "Two pasts, joined by «y»: «fui», «trabajé»."
          - id: t2
            npc: { speaker: "Ana", es: "¿Y hoy? ¿Tienes trabajo?", audioText: "¿y hoy? ¿tienes trabajo?", gloss: "And today? Do you have work?" }
            goal: "Say no, today you don't have work."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no, hoy no tengo trabajo" }
                - { id: "wrong1", text: "no, ayer no tuve trabajo" }
                - { id: "wrong2", text: "no, hoy no tuve trabajo" }
              correctOptionId: "right"
              audioText: "no, hoy no tengo trabajo"
            replyGloss: "No, today I don't have work."
            explanation: "«hoy» wants now: «tengo», not «tuve»."
          - id: t3
            npc: { speaker: "Ana", es: "¿Viste a Diego ayer?", audioText: "¿viste a diego ayer?", gloss: "Did you see Diego yesterday?" }
            goal: "Say yes, you saw him at the park."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, lo vi en el parque" }
                - { id: "wrong1", text: "sí, lo vio en el parque" }
                - { id: "wrong2", text: "sí, lo veo en el parque" }
              correctOptionId: "right"
              audioText: "sí, lo vi en el parque"
            replyGloss: "Yes, I saw him at the park."
            explanation: "About you, in the past: «vi». «lo» stands for Diego."
      - kind: matchLit
        id: l9-match
        pairs:
          - { source: "hoy estudio", target: "today I study" }
          - { source: "ayer fui", target: "yesterday I went" }
          - { source: "tuve trabajo", target: "I had work" }
          - { source: "vi a Sofía", target: "I saw Sofía" }
          - { source: "Diego vino", target: "Diego came" }
          - { source: "hiciste", target: "you did" }
          - { source: "estuviste", target: "you were (somewhere)" }
      - kind: speakLit
        id: l9-sp-win
        es: "hoy estudio, pero ayer fui al cine"
        en: "Today I study, but yesterday I went to the movies"
        atoms: ["hoy", "estudio", "fui", "cine"]

  # ── L10 · MASTERY — every step graded, zero cards, zero maps, zero new
  #    atoms. Every one of the 17 irregular preterite forms is re-spent (nine
  #    paired build/listen-build sentences, m-b-fuivi … m-b-estuvovino, each
  #    carrying two forms via «y»/«e»), the m19 regulars ride along (m-c-hable,
  #    m-tm-trabajo, m-b-compreyvi), and the closing sim — the module's
  #    longest — has Ana pull the whole weekend out of Sam one verb at a time.
  #    Cloze 1/20 (mastery cap ⅓); recalls 3 (L4 win, L7 win, L2 win).
  - n: 10
    template: free
    title: "Todo el fin de semana"
    description: "Ana wants the whole weekend, verb by verb — and by now none of it is new."
    steps:
      - kind: clozeLit
        id: m-c-hable
        es: "ayer hablé con mi abuela"
        en: "Yesterday I spoke with my grandmother"
        blank: "hablé"
        options: ["hablé", "hablo"]
        atoms: ["ayer", "hablé", "abuela"]
        why: "«ayer» says then: «hablé»."
      - kind: buildLit
        id: m-b-fuivi
        es: "ayer fui al parque y vi a Diego"
        en: "Yesterday I went to the park and saw Diego"
        atoms: ["ayer", "fui", "parque", "vi"]
        tiles: ["fue", "vio"]
      - kind: audioWimcq
        id: m-ear-regalo
        target: { surface: "el regalo", emoji: "🎁" }
        distractors:
          - { surface: "el mensaje", emoji: "✉️" }
          - { surface: "la tarea", emoji: "📝" }
      - kind: listenBuildLit
        id: m-lb-hicetuve
        es: "anoche hice la tarea y tuve mucho trabajo"
        en: "Last night I did the homework and had a lot of work"
        atoms: ["anoche", "hice", "tarea", "tuve", "trabajo"]
        tiles: ["hizo", "tuvo"]
      - kind: textMcq
        id: m-tm-trabajo
        target: "trabajó"
        distractors: ["trabajo", "trabajé", "trabajaste"]
      - kind: buildLit
        id: m-b-estuvevine
        es: "la semana pasada estuve en la playa y vine temprano"
        en: "Last week I was at the beach and came back early"
        atoms: ["la semana pasada", "estuve", "playa", "vine"]
        tiles: ["estuvo", "vino"]
      # Printed non-recall at L4 (es-m20-4-l4-sp-win).
      - kind: speakLit
        id: m-sp-recall-tuve
        es: "ayer tuve mucho trabajo"
        en: "Yesterday I had a lot of work"
        atoms: []
        cue: recall
      - kind: listenBuildLit
        id: m-lb-fuisteviste
        es: "¿fuiste al cine y viste la película?"
        en: "Did you go to the movies and see the movie?"
        atoms: ["fuiste", "viste", "película"]
        tiles: ["fue", "vio"]
      - kind: listenCompLit
        id: m-lc-hoyvoyperofui
        es: "hoy voy al parque, pero ayer fui al museo"
        en: "Today I'm going to the park, but yesterday I went to the museum."
        atoms: ["hoy", "ayer", "fui", "el museo"]
        distractorsEn:
          - "Today I go to the museum, but yesterday I went to the park."
          - "Today I'm going to the park, but yesterday she went to the museum."
          - "Every day I go to the museum."
      - kind: buildLit
        id: m-b-hicistetuviste
        es: "¿hiciste la tarea y tuviste una fiesta?"
        en: "Did you do the homework and have a party?"
        atoms: ["hiciste", "tarea", "tuviste", "fiesta"]
        tiles: ["hizo", "tuvo"]
      # Printed non-recall at L7 (es-m20-7-l7-sp-win).
      - kind: speakLit
        id: m-sp-recall-nofui
        es: "no fui a la fiesta anoche"
        en: "I didn't go to the party last night"
        atoms: []
        cue: recall
      - kind: listenBuildLit
        id: m-lb-estuvistevino
        es: "estuviste en el museo y Sofía vino también"
        en: "You were at the museum and Sofía came too"
        atoms: ["estuviste", "el museo", "vino"]
        tiles: ["estuvo", "viene"]
      - kind: buildLit
        id: m-b-compreyvi
        es: "compré un regalo y vi a Ana en la tienda"
        en: "I bought a gift and saw Ana at the store"
        atoms: ["compré", "regalo", "vi", "tienda"]
        tiles: ["compró", "vio"]
      # Printed non-recall at L2 (es-m20-2-l2-sp-win).
      - kind: speakLit
        id: m-sp-recall-peliculafue
        es: "la película fue muy buena"
        en: "The movie was very good"
        atoms: []
        cue: recall
      - kind: buildLit
        id: m-b-fuehizo
        es: "Diego fue al mercado e hizo la tarea"
        en: "Diego went to the market and did the homework"
        atoms: ["fue", "hizo", "tarea"]
        tiles: ["fui", "hice"]
      - kind: listenBuildLit
        id: m-lb-tuvovio
        es: "Ana tuvo una fiesta y vio a Carmen"
        en: "Ana had a party and saw Carmen"
        atoms: ["tuvo", "fiesta", "vio"]
        tiles: ["tuve", "vi"]
      - kind: buildLit
        id: m-b-estuvovino
        es: "Diego estuvo en la fiesta y vino temprano"
        en: "Diego was at the party and came early"
        atoms: ["estuvo", "fiesta", "vino"]
        tiles: ["estuve", "vine"]
      - kind: matchLit
        id: m-match
        pairs:
          - { source: "fui", target: "I went" }
          - { source: "hiciste", target: "you did / made" }
          - { source: "tuvo", target: "he or she had" }
          - { source: "estuve", target: "I was (somewhere)" }
          - { source: "viste", target: "you saw" }
          - { source: "vino", target: "he or she came" }
          - { source: "fue", target: "he or she went / was" }
      - kind: speakLit
        id: m-sp-final
        es: "fui, hice, tuve y vi el fin de semana"
        en: "I went, I did, I had and I saw on the weekend"
        atoms: ["fui", "hice", "tuve", "vi", "el fin de semana"]
      - kind: sim
        id: m-sim-ana-semana
        scene: { emoji: "📆", title: "Ana asks about your weekend", setting: "Monday morning. Ana wants the whole weekend — every place, every verb, in order." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿qué hiciste el fin de semana?", audioText: "¿qué hiciste el fin de semana?", gloss: "What did you do on the weekend?" }
            goal: "Say you went to the museum."
            reply:
              mode: build
              tiles: ["fui", "al", "museo", "voy", "fue"]
              answer: "fui al museo"
            replyGloss: "I went to the museum."
            explanation: "«fui» + «al museo»: went."
          - id: t2
            npc: { speaker: "Ana", es: "¿Y viste a un amigo?", audioText: "¿y viste a un amigo?", gloss: "And did you see a friend?" }
            goal: "Say yes, you saw Diego there."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, vi a Diego" }
                - { id: "wrong1", text: "sí, veo a Diego" }
                - { id: "wrong2", text: "sí, vio a Diego" }
              correctOptionId: "right"
              audioText: "sí, vi a diego"
            replyGloss: "Yes, I saw Diego."
            explanation: "«vi» — you, in the past."
          - id: t3
            npc: { speaker: "Ana", es: "¿Y qué hiciste anoche?", audioText: "¿y qué hiciste anoche?", gloss: "And what did you do last night?" }
            goal: "Say yes, you did the homework."
            reply:
              mode: build
              tiles: ["sí", "hice", "la", "tarea", "hago", "hizo"]
              answer: "sí hice la tarea"
            replyGloss: "Yes, I did the homework."
            explanation: "«hice» — you, in the past."
          - id: t4
            npc: { speaker: "Ana", es: "¿Tuviste mucho trabajo?", audioText: "¿tuviste mucho trabajo?", gloss: "Did you have a lot of work?" }
            goal: "Say yes, you had a lot."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, tuve mucho" }
                - { id: "wrong1", text: "sí, tengo mucho" }
                - { id: "wrong2", text: "sí, tuvo mucho" }
              correctOptionId: "right"
              audioText: "sí, tuve mucho"
            replyGloss: "Yes, I had a lot."
            explanation: "«tuve» — you, in the past."
          - id: t5
            npc: { speaker: "Ana", es: "¿Estuviste en la playa?", audioText: "¿estuviste en la playa?", gloss: "Were you at the beach?" }
            goal: "Say yes, and you came back early."
            reply:
              mode: build
              tiles: ["sí", "estuve", "y", "vine", "temprano", "está", "viene"]
              answer: "sí estuve y vine temprano"
            replyGloss: "Yes, and I came back early."
            explanation: "«estuve» for where, «vine» for coming back."
          - id: t6
            npc: { speaker: "Ana", es: "¿Fue buena la fiesta de Ana?", audioText: "¿fue buena la fiesta de ana?", gloss: "Was Ana's party good?" }
            goal: "Say yes, it was very good."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, fue muy buena" }
                - { id: "wrong1", text: "sí, es muy buena" }
                - { id: "wrong2", text: "sí, fui muy buena" }
              correctOptionId: "right"
              audioText: "sí, fue muy buena"
            replyGloss: "Yes, it was very good."
            explanation: "«fue» + an adjective, no place: was."
          - id: t7
            npc: { speaker: "Ana", es: "¿Vino Diego también?", audioText: "¿vino diego también?", gloss: "Did Diego come too?" }
            goal: "Say yes, and he saw Sofía."
            reply:
              mode: build
              tiles: ["sí", "vino", "y", "vio", "a", "Sofía", "viene", "ve"]
              answer: "sí vino y vio a Sofía"
            replyGloss: "Yes, and he saw Sofía."
            explanation: "«vino» and «vio» — both Diego, both past."

placement:
