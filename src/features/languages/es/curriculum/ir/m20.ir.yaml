  # ── L5 · «Vi, vine» — vi, viste, vio (ver), vine, vino (venir), el viaje
  #    🧳. Two more verbs that skip the -í/-iste/-ió table. «vino» also
  #    means wine — the card says so and every printed sentence puts a
  #    person or place after it so context always decides. «viniste» is
  #    NOT registered and is never printed (L8 transfer cell only).
  - n: 5
    template: free
    title: "Vi, vine"
    description: "Two more verbs, two more shortcuts. «ver» and «venir» skip the regular past the same way «ir» and «hacer» already did — and one of them shares its name with a drink."
    steps:
      - kind: map
        id: l5-map-vinealafiesta
        tokens: ["vine", "a", "la", "fiesta", "anoche"]
        pairs:
          - { en: "I came", tokenIndex: 0 }
          - { en: "to", tokenIndex: 1 }
          - { en: "the", tokenIndex: 2 }
          - { en: "party", tokenIndex: 3 }
          - { en: "last night", tokenIndex: 4 }
        audioText: "vine a la fiesta anoche"
        revealNote: "«vine» — I came — another one-syllable stem with no accent, like «fui» and «hice». «venir» does not take the regular ending either."
        tokenGenders: { 2: "f", 3: "f" }
      - kind: imageMcq
        id: l5-im-viaje
        target: { surface: "el viaje", meaningEn: "the trip", emoji: "🧳" }
