      - kind: info
        id: l5-info-veryvenir
        title: "Vi, vine — two more irregular pasts"
        body: "«ver» (to see) and «venir» (to come) skip the -í/-iste/-ió endings too, just like «ir», «ser», «hacer», «tener» and «estar» already did. ver: «vi», I saw; «viste», you saw; «vio», he or she saw — each one syllable, no accent. venir: «vine», I came; «vino», he or she came. «vino» is also the word for wine, but right after a person it can only mean came: «Diego vino a la fiesta» — Diego came to the party. The sentence always tells you which."
