            reply:
              mode: build
              tiles: ["no", "estaba", "nublado", "hacía"]
              answer: "no estaba nublado"
            replyGloss: "No, it was cloudy."
            explanation: "«estaba nublado» — the imperfect (m24), an ongoing scene, not one event."
          - id: t2
            npc: { speaker: "Ana", es: "¿Estaba nublado ayer?", audioText: "¿estaba nublado ayer?", gloss: "Was it cloudy yesterday?" }
            goal: "Say yes, that's why we didn't go."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, por eso no fuimos" }
                - { id: "wrong1", text: "sí, porque no fuimos" }
                - { id: "wrong2", text: "sí, está nublado, por eso no fuimos" }
              correctOptionId: "right"
              audioText: "sí, por eso no fuimos"
            replyGloss: "Yes, that's why we didn't go."
            explanation: "The reason («estaba nublado») already came first, so «por eso» (PRIOR, m25) follows it — «porque» would need to come before the reason instead."
