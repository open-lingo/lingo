          - { source: "por eso", target: "that's why" }
          - { source: "cuando", target: "when" }
          - { source: "ayer", target: "yesterday" }
          - { source: "fuimos", target: "we went" }
      - kind: speakLit
        id: l6-sp-win
        es: "estaba nublado, por eso no fuimos a la playa"
        en: "It was cloudy, that's why we didn't go to the beach"
        atoms: ["estaba", "nublado", "por eso", "no", "fuimos", "playa"]

