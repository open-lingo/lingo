        atoms: ["quiero", "levantarme", "quieres", "duchar"]
        segments:
          - { text: "yo " }
          - { blank: { id: "p1", answer: "quiero", options: ["quiero", "quieres"] } }
          - { text: " levantarme, y tú te " }
          - { blank: { id: "p2", answer: "quieres", options: ["quieres", "quiero"] } }
          - { text: " duchar" }
      - kind: listenBuildLit
        id: l4-lb-puedolevantarmetemprano
        es: "puedo levantarme temprano también"
        en: "I can get myself up early too"
        atoms: ["puedo", "levantarme", "temprano", "también"]
        tiles: ["puede", "puedes"]
      - kind: textMcq
        id: l4-tm-levantarme
