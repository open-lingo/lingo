  # ── L2 · «¿Puedes comprarla?» — second position extended to tú, «la»,
  #    against «poder» (m14) instead of «querer» (m7/m14) — the rule
  #    generalizes to a second host verb immediately. ≥1 recall of L1's
  #    own win line. New atom this lesson: none new (this module's other
  #    6 atoms were already registered in the header; this lesson simply
  #    reuses «comprarlo»/introduces its feminine sibling «comprarla»
  #    from the header list, first PRINTED here). Third-position foil
  #    («puedes la comprar») appears as a textMcq distractor and a sim
  #    wrong-choice option only.
  - n: 2
    template: free
    title: "¿Puedes comprarla?"
    description: "The same second position works with «poder» (m14), not just «querer». Any conjugated verb followed by a bare infinitive gives the pronoun the same two homes."
    steps:
      - kind: map
        id: l2-map-puedescomprarla
        tokens: ["¿puedes", "comprarla?"]
        pairs:
          - { en: "can you", tokenIndex: 0 }
          - { en: "buy it (her)", tokenIndex: 1 }
        audioText: "¿puedes comprarla?"
        revealNote: "«comprarla» — «comprar» (m12) plus «la» (m16), fused onto the end. Same fusion as L1's «comprarlo», but «la» because the thing is feminine."
      # Printed non-recall at L1 (es-m29-1-l1-sp-win).
      - kind: speakLit
        id: l2-sp-recall-l1win
        es: "quiero comprarlo mañana"
        en: "I want to buy it tomorrow"
