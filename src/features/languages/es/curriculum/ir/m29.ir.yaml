        correct: "no quiero levantarme"
        distractors: ["no me quiero levantarme", "no quiero me levantar", "no quiere levantarme"]
        atoms: ["quiero", "levantarme"]
        why: "«levantarme» — the pointer fused onto the infinitive, said once. «no me quiero levantarme» doubles it; «no quiero me levantar» puts the pointer between the two verbs — never legal."
      - kind: buildLit
        id: l4-b-nomequieroducharhoy
        also: ["hoy no me quiero duchar"]
        es: "no me quiero duchar hoy"
        en: "I don't want to shower today"
        atoms: ["quiero", "duchar", "me", "hoy"]
        tiles: ["ducho", "se"]
      - kind: audioWimcq
