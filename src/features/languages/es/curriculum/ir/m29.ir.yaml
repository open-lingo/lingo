        atoms: ["puede", "comprarla", "también"]
        distractorsEn:
          - "Sofía can't buy it."
          - "Sofía could buy it."
          - "Sofía can also see it."
      - kind: mcq
        id: l2-q-comprarla
        prompt: "Which one means 'Can you buy it?'"
        correct: "¿puedes comprarla?"
        distractors: ["¿puedes la comprar?", "¿puedo comprarla?", "¿puedes comprarlo?"]
        atoms: ["puedes", "comprarla"]
        why: "«comprarla» — the pointer fused onto the infinitive. «puedes la comprar» puts the pointer between the two verbs — never legal. «puedo» is the wrong person; «comprarlo» the wrong gender."
