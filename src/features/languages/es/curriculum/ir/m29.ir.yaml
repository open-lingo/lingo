              tiles: ["sí", "puedo", "comprarla", "mañana", "comprarlo"]
              answer: "sí puedo comprarla mañana"
            replyGloss: "Yes, I can buy it tomorrow."
            explanation: "«comprarla» — «comprar» plus «la» fused onto the end, matching Diego's own «la». «comprarlo» would be the wrong gender."
          - id: t2
            npc: { speaker: "Diego", es: "¿Y la quieres ver también?", audioText: "¿y la quieres ver también?", gloss: "And do you want to see it too?" }
            goal: "Say yes, you want to see it too."
