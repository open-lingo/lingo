        turns:
          - id: t1
            npc: { speaker: "Diego", es: "¿Te levantas temprano mañana?", audioText: "¿te levantas temprano mañana?", gloss: "Do you get up early tomorrow?" }
            goal: "Say no, you don't want to get up."
            reply:
              mode: build
