            explanation: "Same fusion, negated: «no» sits outside the pair, the way it always has, and «comprarla» stays fused."
      - kind: matchLit
        id: l2-match
        pairs:
          - { source: "comprarla", target: "to buy it (her)" }
          - { source: "ver", target: "to see" }
          - { source: "la", target: "it, her (direct object, before the verb)" }
          - { source: "puedes", target: "you can" }
          - { source: "puede", target: "he/she/you (formal) can" }
          - { source: "también", target: "also, too" }
      - kind: speakLit
        id: l2-sp-win
        es: "¿puedes comprarla mañana?"
        en: "Can you buy it tomorrow?"
        atoms: ["puedes", "comprarla", "mañana"]

