  # ── L4 · «No quiero levantarme» — the rule crosses families: reflexive
  #    «me» (m13/m17) fused onto the BARE m17-L7 «levantar» (never the
  #    «-se» dictionary card), against «querer». Pairs directly with
  #    m17-L7's own bare-verb teaching. ≥1 recall of L3's own win line.
  #    New atom this lesson: «levantarme» (header list, first PRINTED
  #    here). ⚠️ m17-L7's own header note: only «levantar» and «duchar»
  #    are registered BARE infinitives — «lavar»/«acostar»/«despertar»/
  #    «peinar» are NOT, so this lesson does not touch them, and the only
  #    fused surface printed anywhere below is «levantarme» itself (the
  #    one atom the header registered) — never «levantarte», which is
  #    not a registered surface. «duchar» appears only in its PRIOR
  #    pre-verbal shape («me quiero duchar»), recapping m17, not fused.
  #    Third-position foil («quiero me levantar») appears as an mcq
  #    distractor and a sim wrong-choice option only.
  - n: 4
    template: free
    title: "No quiero levantarme"
    description: "The same rule crosses families: «me» (m13/m17) fuses onto a bare infinitive exactly the way «lo»/«la»/«los»/«las» did."
    steps:
      - kind: map
        id: l4-map-noquierolevantarme
        tokens: ["no", "quiero", "levantarme"]
        pairs:
          - { en: "I don't want", tokenIndex: 1 }
          - { en: "to get myself up", tokenIndex: 2 }
        audioText: "no quiero levantarme"
        revealNote: "«levantarme» — the bare «levantar» (m17 L7) plus «me» (m13/m17), fused onto the end. «me quiero levantar» and «quiero levantarme» mean exactly the same thing."
      # Printed non-recall at L3 (es-m29-3-l3-sp-win).
      - kind: speakLit
        id: l4-sp-recall-l3win
        es: "Ana puede comprarlos hoy"
