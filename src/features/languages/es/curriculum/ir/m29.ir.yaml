        atoms: ["me", "levanto", "hoy"]
        tiles: ["te", "se"]
      - kind: clozeLit
        id: l4-c-melevantotemprano
        es: "me levanto temprano"
        en: "I get up early"
        blank: "me"
        options: ["me", "te"]
        atoms: ["levanto", "temprano"]
        why: "«yo» is the subject, so «me» — right in front of «levanto», the pre-verbal position PRIOR since m17. «te» would be about «tú» instead."
      - kind: listenCompLit
        id: l4-lc-quierolevantarme
