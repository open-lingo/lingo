  # ── L6 · listening focus + hasta luego / mucho gusto / o ───────────────────
  - n: 6
    template: free
    title: "Escucha — train your ear"
    description: "Two social phrases, the word for 'or', and a lesson that leads with your ears."
    steps:
      - kind: info
        id: info-escucha
        title: "Lead with your ears"
        body: "Two phrases finish your social kit: «hasta luego» (see you later — silent h again: AS-ta LWE-go) and «mucho gusto» (nice to meet you). And one more connector: «o» means 'or' — cuatro o cinco, four or five. This lesson leads with listening: trust the five vowels and the sound comes apart cleanly."
      - kind: phrase
        id: p-hastaluego
        meaning: "see you later"
        text: "hasta luego"
      - kind: imageMcq
        id: img-muchogusto
        target: { surface: "mucho gusto", meaningEn: "nice to meet you", emoji: "🤝" }
        distractors:
          - { surface: "hasta luego", emoji: "🚪" }
          - { surface: "hola", emoji: "🙋" }
          - { surface: "buenos días", emoji: "🌅" }
      - kind: listenCompLit
        id: lc-hastaluego
        es: "hasta luego"
        en: "See you later"
        distractorsEn: ["Nice to meet you", "Good morning", "Goodbye"]
        atoms: ["hasta luego"]
      - kind: speakLit
        id: speak-muchogusto
        es: "mucho gusto"
        en: "nice to meet you"
        atoms: ["mucho gusto"]
      - kind: listenBuildLit
        id: lb-buenosdias
        es: "buenos días"
        en: "good morning"
        tiles: ["buenas", "tardes"]
        atoms: ["buenos días"]
      - kind: buildLit
        id: b-muchogusto
        es: "mucho gusto"
        en: "Nice to meet you"
        tiles: ["hasta"]
        atoms: ["mucho gusto"]
      - kind: listenCompLit
        id: lc-buenasnoches
        es: "buenas noches"
        en: "Good night"
        distractorsEn: ["Good afternoon", "Good morning", "See you later"]
        atoms: ["buenas noches"]
      - kind: speakLit
        id: speak-hastaluego
        es: "hasta luego"
        en: "see you later"
        atoms: ["hasta luego"]
      - kind: clozeLit
        id: c-cuatroocinco
        es: "cuatro o cinco"
        en: "four or five"
        blank: "o"
        options: ["o", "y", "sí", "no"]
        why: "«o» offers a choice — four OR five. «y» would add them together instead."
        atoms: ["o", "cuatro", "cinco"]
      - kind: listenBuildLit
        id: lb-buenasnoches
        es: "buenas noches"
        en: "good night"
        tiles: ["buenos", "días"]
        atoms: ["buenas noches"]
      - kind: buildLit
        id: b-cuatroocinco
        es: "cuatro o cinco"
        en: "Four or five"
        tiles: ["y"]
        atoms: ["cuatro", "o", "cinco"]
      - kind: listenCompLit
        id: lc-muchogusto
        es: "mucho gusto"
        en: "Nice to meet you"
        distractorsEn: ["See you later", "Please", "Thank you"]
        atoms: ["mucho gusto"]
      - kind: translateLit
        id: tr-hastaluego
        es: "hasta luego"
        en: "See you later"
        atoms: ["hasta luego"]
      - kind: textMcq
        id: q-o
        target: "o"
