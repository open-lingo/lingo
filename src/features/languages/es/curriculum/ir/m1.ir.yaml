  # ── L7 · integration — a first conversation ────────────────────────────────
  - n: 7
    template: free
    title: "En la calle — a first conversation"
    description: "Every line of this dialogue is made of words you already own."
    steps:
      - kind: info
        id: info-dialogo
        title: "You can already have this conversation"
        body: "Ana and Luis meet on the street, greet, and part. Every single word is yours already. Listen first — don't read along. Then prove it: build, say, and answer with the same words."
      - kind: dialogueLit
        id: dialogue-calle
        lines:
          - { speaker: "Ana", text: "¡Hola! ¡Buenos días!" }
          - { speaker: "Luis", text: "¡Hola! Mucho gusto." }
          - { speaker: "Ana", text: "Mucho gusto. ¡Adiós!" }
          - { speaker: "Luis", text: "¡Adiós! ¡Hasta luego!" }
        questions:
          - id: "q1"
            prompt: "What does Ana say first?"
            correctText: "Hello! Good morning!"
            distractors: ["Goodbye! See you later!", "Nice to meet you!", "Thank you! Please!"]
          - id: "q2"
            prompt: "How does Luis respond when he's introduced?"
            correctText: "Nice to meet you."
            distractors: ["Good night.", "Excuse me.", "Yes."]
        atoms: ["hola", "buenos días", "mucho gusto", "adiós", "hasta luego"]
      - kind: buildLit
        id: b-holabuenosdias
        es: "hola buenos días"
        en: "Hello, good morning"
        tiles: ["buenas"]
        atoms: ["hola", "buenos días"]
