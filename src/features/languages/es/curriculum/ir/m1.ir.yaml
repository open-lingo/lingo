# The placement facts are unchanged from the pre-gate m1 — they were already
# module-true. The one reshape: the old pt-es-m1-4 was a hand-built y-cloze;
# the IR placement bank is sentenceMcq-shaped, so the same y-vs-o fact rides
# a picker now.
placement:
  screener:
    - id: "pt-es-screen-m1"
      prompt: "'Thank you' — which is correct?"
      correct: "gracias"
      distractors: ["hola", "adiós", "por favor"]
  byModule:
    - id: "pt-es-m1-1"
      prompt: "'Hello' — which is correct?"
      correct: "hola"
      distractors: ["adiós", "gracias", "perdón"]
    - id: "pt-es-m1-2"
      prompt: "It's late at night. Which greeting fits?"
      correct: "buenas noches"
      distractors: ["buenos días", "buenas tardes", "hasta luego"]
    - id: "pt-es-m1-3"
      prompt: "'Seven' — which is correct?"
      correct: "siete"
      distractors: ["seis", "nueve", "cinco"]
    - id: "pt-es-m1-4"
      prompt: "'four and five' — pick the Spanish."
      correct: "cuatro y cinco"
      distractors: ["cuatro o cinco", "cuatro no cinco", "cuatro sí cinco"]
