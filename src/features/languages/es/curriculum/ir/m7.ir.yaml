module: m7
title: "El café — want it, like it, pay for it"
frame: none
throughModule: m6
expectedLessonCount: 10
checkpoint: 8

# ES m7 — «El café»: quiero vs me gusta, hambre/sed, foods and drinks,
# and the arc's biggest payoff — Diego finally has money. Fourth §13-
# doctrine IR module (m3 is the exemplar; m4 the freshest sibling).
#
# SPINE PROVENANCE: atom inventory + arc PINNED by
# docs/es-m4-m10-wave-2026-08-24.md ("m7 — El café"). 16 atoms: quiero,
# quieres, me gusta, te gusta, café, té, leche, pan, queso, pollo,
# manzana, sopa, cuenta, rico, tengo hambre, tengo sed. Nothing added,
# dropped or renamed against that spec — including the spec's own
# correction: «un té con leche» is DROPPED (con is not in this
# inventory; every sentence in this module avoids «con» entirely).
#
# DOCTRINE NOTES:
#   - Contrast card (L2): «quiero un café» — want it now, indefinite
#     (un). «me gusta el café» — like it in general, definite (el). One
#     card line states the article flip; me gusta/te gusta stay
#     FORMULAS — the card says the grammar behind «gusta» comes later
#     and no other step ever explains it. quiero/quieres and quiero/me
#     gusta are both trained as alternating, both-live discrimination
#     lanes across the module (tally in the ledger below).
#   - Atom allocation across lessons (16 total, none repeated):
#     L1 quiero/café/té (3) · L2 me gusta/te gusta/leche/pan (4) ·
#     L3 quieres (1) · L4 tengo hambre/tengo sed/sopa/pollo (4) ·
#     L5 queso/manzana/rico (3) · L6 cuenta (1). L7–L10 are zero-new.
#   - te gusta is registered in L2 alongside me gusta (taught as the
#     mirror formula) but its own printed voicing is light — it is
#     exercised mainly through Sofía/Carmen asking «¿te gusta…?» in
#     later sims, which is honest (a formula the learner HEARS before
#     they ever need to say it back in te-form).
#   - leche gets the m3 llave/m4 foto secret-side treatment: no
#     telltale ending, learned WITH its article, one card + one
#     dedicated gender cloze a few steps later (L2).
#   - rico is a chunk-only word: it appears ONLY as «¡qué rico!», never
#     inflected, never in any other construction, module-wide — checked
#     by hand across every lesson below.
#   - tengo hambre / tengo sed debut together in ONE self-cueing micro-
#     sim (L4): Diego's stomach growls, he asks «¿Tienes hambre?» (m5's
#     «tienes» creates the slot), then «¿Tienes sed también?» creates
#     the second slot. Both turns marked as single-correct debuts. The
#     ear lane (audioWimcq, honest non-punny emoji: 🍽️ hambre / 🥤 sed —
#     deliberately NOT 💧, which m4 already owns for «agua») runs
#     alongside a text-cloze lane (blank the object word inside the
#     fixed phrase: "tengo ___" → hambre/sed, both live).
#   - Foods interleave, following the arc's own lesson-by-lesson split
#     rather than a rigid 3/3 count: café/té (L1) + leche/pan (L2) are
#     the drinks-and-bread wave; sopa/pollo (L4) and queso/manzana (L5)
#     are the two food waves, each broken up by a sim or an off-topic
#     tail — no lesson is ever a bare food list.
#   - THE PAYOFF (L6): Diego finally has money — «¡hay dinero!» directly
#     echoes m3's negative «no hay dinero» from the empty-wallet gag.
#     He pays and says the module's own required line himself
#     («la cuenta, por favor»), modeling it before the learner ever
#     produces it — the learner's own first PRODUCTION of that exact
#     line is deliberately held for L9's summit, per the brief ("la
#     cuenta por favor is the summit's closing move").
#   - Carmen (m2 cast — Sofía's friend, met at the café in m2) owns the
#     café; Ana, Diego, Sofía, María are the rest of the fixed cast.
#     Learner = Sam. NPC lines are natural Spanish throughout; no line
#     anywhere in this module uses «con» (not in the inventory).
#   - Nouns wear their article on every surface («la cuenta», never bare
#     «cuenta»); atoms stay bare with `gender` (m3 registry convention).
#   - Offer sims (L3, L6, L7, L9, L10) use both-correct consolidation
#     where the turn is a genuine open choice (both drinks equally
#     fine, or a real yes/no); DEBUT turns (L4's hambre/sed) keep
#     exactly one right reply per §13.6 rule 4.
#   - Discrimination lanes (§13.9 law 4, alternating, both halves live):
#     quiero/me-gusta clozes (3 quiero-correct : 2 me-gusta-correct);
#     quiero/quieres clozes (3 quiero-correct : 3 quieres-correct);
#     hambre/sed by EAR (audioWimcq, 2 each) and by text-cloze (1 each);
#     pero/y clozes reviewing m6's «pero» against m1's «y» (2 steps).
#
# VOICING LEDGER (printed speak → licenses later cue:"recall"):
#   quiero un café L1 · un té L1 · el pan L2 · me gusta el café L2 ·
#   la leche L2 · tengo hambre L4 (via sim + cloze + win) ·
#   tengo sed L4 · ¡qué rico! L5 · la cuenta, por favor L6
#   m7-internal recalls drawn from the above: quiero un café (L8, L10),
#   me gusta el café (multiple), la cuenta por favor (L8 cp, L9 build,
#   L10 build), tengo hambre / tengo sed (L7, L8, L9, L10)
#   cross-module (licensed by m1–m6 printed voicings, per the wave doc):
#   buenos días (L1), ¿cómo estás? (L2), una llave / un lápiz / una
#   pluma (L2), el dinero / el papel / el celular (L1), hay una silla
#   aquí (L7), ¿dónde está? (L3 map echo, L8, L10), está en la mesa
#   (L3), mi familia (L4), el gato (L6, L9), muy bonito (L5), el carro
#   rojo (L6, L9), la casa / el libro (L9).
newAtoms:
  - { surface: "quiero", meaningEn: "I want", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "quieres", meaningEn: "you want", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "me gusta", meaningEn: "I like it", partOfSpeech: "phrase", kind: "phrase" }
  - { surface: "te gusta", meaningEn: "you like it", partOfSpeech: "phrase", kind: "phrase" }
  - { surface: "café", meaningEn: "coffee", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "☕" }
  - { surface: "té", meaningEn: "tea", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "🍵", hint: "one syllable, teh — the accent keeps it apart from «te» in «te gusta»" }
  - { surface: "leche", meaningEn: "milk", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "🥛", hint: "no telltale ending — a secret-side word, like llave: LEH-cheh" }
  - { surface: "pan", meaningEn: "bread", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "🍞" }
  - { surface: "queso", meaningEn: "cheese", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "🧀", hint: "qu is a plain k, like aquí: KEH-so" }
  - { surface: "pollo", meaningEn: "chicken", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "🍗", hint: "ll sounds like y — same as llamo: PO-yo" }
  - { surface: "manzana", meaningEn: "apple", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "🍎" }
  - { surface: "sopa", meaningEn: "soup", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "🍲" }
  - { surface: "cuenta", meaningEn: "check (bill)", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "🧾" }
  - { surface: "rico", meaningEn: "tasty", partOfSpeech: "adjective", kind: "vocab" }
  - { surface: "tengo hambre", meaningEn: "I'm hungry", partOfSpeech: "phrase", kind: "phrase" }
  - { surface: "tengo sed", meaningEn: "I'm thirsty", partOfSpeech: "phrase", kind: "phrase" }

lessons:
  # ── L1 · quiero + café/té debut. States the module promise. ──────────
  - n: 1
    template: free
    title: "Order like a local"
    description: "«Quiero» — I want. Say it, and Carmen brings it."
    steps:
      - kind: info
        id: info-quiero
        title: "Say what you want"
        body: "«quiero» — I want. «quiero un café» — I want a coffee. This module: order for real, chat a little, and — finally — pay, at Carmen's café."
      - kind: imageMcq
        id: d-cafe
        target: { surface: "un café", meaningEn: "a coffee", emoji: "☕" }
        distractors:
          - { surface: "una llave", emoji: "🔑" }
          - { surface: "el agua", emoji: "💧" }
          - { surface: "la puerta", emoji: "🚪" }
      - kind: map
        id: map-quierocafe
        tokens: ["quiero", "un", "café"]
        pairs:
          - { en: "I want", tokenIndex: 0 }
          - { en: "a", tokenIndex: 1 }
          - { en: "coffee", tokenIndex: 2 }
        audioText: "quiero un café"
        revealNote: "«un» is yours from m3 — «quiero» is the only new one: I want."
        tokenGenders: { 1: "m", 2: "m" }
      - kind: speakLit
        id: sp-quierocafe
        es: "quiero un café"
        en: "I want a coffee"
        atoms: ["quiero", "un", "café"]
      - kind: imageMcq
        id: d-te
        target: { surface: "un té", meaningEn: "a tea", emoji: "🍵" }
        distractors:
          - { surface: "un café", emoji: "☕" }
          - { surface: "una llave", emoji: "🔑" }
          - { surface: "el libro", emoji: "📖" }
      - kind: speakLit
        id: sp-unte
        es: "un té"
        en: "a tea"
        atoms: ["un", "té"]
      - kind: buildLit
        id: b-quierote
        es: "quiero un té"
        en: "I want a tea"
        atoms: ["quiero", "un", "té"]
        tiles: ["el", "café"]
      - kind: clozeLit
        id: c-unte
        es: "quiero un café"
        en: "I want a coffee"
        blank: "un"
        options: ["un", "el"]
        atoms: ["quiero", "un", "café"]
        why: "You're ordering ONE, right now — that's «un», not «el»."
      - kind: audioWimcq
        id: ear-review1
        target: { surface: "el dinero", emoji: "💰" }
        distractors:
          - { surface: "el papel", emoji: "📄" }
          - { surface: "el celular", emoji: "📱" }
      - kind: listenCompLit
        id: lc-quierote
        es: "quiero un té"
        en: "I want a tea."
        atoms: ["quiero", "un", "té"]
        distractorsEn:
          - "I have a tea."
          - "There's a tea."
          - "I want a coffee."
      - kind: speakLit
        id: sp-recall-buenosdias
        es: "buenos días"
        en: "good morning"
        atoms: []
        cue: recall
      - kind: sim
        id: sim-carmen-debut
        scene: { emoji: "☕", title: "Carmen's café", setting: "Carmen wipes the counter, pen ready." }
        turns:
          - id: t1
            npc: { speaker: "Carmen", es: "¡Hola! ¿Café o té?", audioText: "¡hola! ¿café o té?", gloss: "Hi! Coffee or tea?" }
            goal: "Order a coffee."
            reply:
              mode: choice
              options:
                - { id: "right", text: "quiero un café" }
                - { id: "wrong1", text: "es un café" }
                - { id: "wrong2", text: "hay un café" }
              correctOptionId: "right"
              audioText: "quiero un café"
            replyGloss: "I want a coffee."
            explanation: "«es» would name it, «hay» would just claim it exists — she asked what you WANT, so «quiero»."
      - kind: matchLit
        id: match
        pairs:
          - { source: "un café", target: "a coffee" }
          - { source: "un té", target: "a tea" }
          - { source: "quiero", target: "I want" }
          - { source: "hola", target: "hello" }
          - { source: "gracias", target: "thank you" }
          - { source: "la casa", target: "the house" }
      - kind: speakLit
        id: sp-win
        es: "quiero un café"
        en: "I want a coffee"
        atoms: ["quiero", "un", "café"]

  # ── L2 · me gusta vs quiero — the article flip. leche/pan debut. ─────
  - n: 2
    template: free
    title: "Want it now, like it always"
    description: "«Me gusta» — I like it, in general. And why it says «el café»."
    steps:
      - kind: info
        id: info-contrast
        title: "Two ways to want something"
        body: "«quiero un café» — I want A coffee: one, right now. «me gusta el café» — I like coffee in general; «me gusta» always keeps the el/la, even where English drops 'the.' «quiero» takes el/la too when you mean a specific one: «quiero el café» — I want THAT coffee, the one right there. The grammar behind «gusta» comes later; for now it's a formula."
      - kind: imageMcq
        id: d-leche
        target: { surface: "la leche", meaningEn: "the milk", emoji: "🥛" }
        distractors:
          - { surface: "un café", emoji: "☕" }
          - { surface: "un té", emoji: "🍵" }
          - { surface: "el agua", emoji: "💧" }
      - kind: speakLit
        id: sp-laleche
        es: "la leche"
        en: "the milk"
        atoms: ["la", "leche"]
      - kind: imageMcq
        id: d-pan
        target: { surface: "el pan", meaningEn: "the bread", emoji: "🍞" }
        distractors:
          - { surface: "la leche", emoji: "🥛" }
          - { surface: "un café", emoji: "☕" }
          - { surface: "un té", emoji: "🍵" }
      - kind: speakLit
        id: sp-elpan
        es: "el pan"
        en: "the bread"
        atoms: ["el", "pan"]
      - kind: clozeLit
        id: c-lechesecret
        es: "la leche está en la cocina"
        en: "the milk is in the kitchen"
        blank: "la"
        options: ["la", "el"]
        atoms: ["la", "leche", "está", "en", "la", "cocina"]
        why: "leche keeps its side secret — no telltale ending. That's why you learn it as «la leche»: the word carries its side with it."
      - kind: map
        id: map-megustacafe
        tokens: ["me gusta", "el", "café"]
        pairs:
          - { en: "I like", tokenIndex: 0 }
          - { en: "the", tokenIndex: 1 }
          - { en: "coffee", tokenIndex: 2 }
        audioText: "me gusta el café"
        revealNote: "«el» and «café» are already yours — «me gusta» is the new formula: I like it. Notice: el, not un — liking is general, not a single order."
        tokenGenders: { 1: "m", 2: "m" }
      - kind: speakLit
        id: sp-megustacafe
        es: "me gusta el café"
        en: "I like coffee"
        atoms: ["me gusta", "el", "café"]
      - kind: clozeLit
        id: c-quierote2
        es: "quiero un té"
        en: "I want a tea"
        blank: "quiero"
        options: ["quiero", "me gusta"]
        atoms: ["quiero", "un", "té"]
        why: "You're ordering ONE, right now — «quiero», not the general «me gusta»."
      - kind: buildLit
        id: b-megustapan
        es: "me gusta el pan"
        en: "I like bread"
        atoms: ["me gusta", "el", "pan"]
        tiles: ["un", "la"]
      - kind: clozeLit
        id: c-megustaleche
        es: "me gusta la leche"
        en: "I like milk"
        blank: "gusta"
        options: ["gusta", "quiero"]
        atoms: ["me gusta", "la", "leche"]
        why: "General preference, not a single order — «me gusta», not «quiero»."
      - kind: audioWimcq
        id: ear-review2
        target: { surface: "una llave", emoji: "🔑" }
        distractors:
          - { surface: "un lápiz", emoji: "✏️" }
          - { surface: "una pluma", emoji: "🖊️" }
      - kind: speakLit
        id: sp-recall-comoestas
        es: "¿cómo estás?"
        en: "how are you?"
        atoms: []
        cue: recall
      - kind: listenCompLit
        id: lc-megustate
        es: "me gusta el té"
        en: "I like tea."
        atoms: ["me gusta", "el", "té"]
        distractorsEn:
          - "I want tea."
          - "I have tea."
          - "I like coffee."
      - kind: sim
        id: sim-carmen-cafeote
        scene: { emoji: "☕", title: "Café or tea?", setting: "Carmen taps her pen, waiting." }
        turns:
          - id: t1
            npc: { speaker: "Carmen", es: "¿Quieres café o té?", audioText: "¿quieres café o té?", gloss: "Do you want coffee or tea?" }
            goal: "Order a coffee — right now."
            reply:
              mode: choice
              options:
                - { id: "right", text: "quiero un café" }
                - { id: "wrong1", text: "me gusta el café" }
                - { id: "wrong2", text: "es un café" }
              correctOptionId: "right"
              audioText: "quiero un café"
            replyGloss: "I want a coffee."
            explanation: "She asked what you want RIGHT NOW — «quiero», not the general «me gusta»."
      - kind: matchLit
        id: match
        pairs:
          - { source: "me gusta", target: "I like it" }
          - { source: "quiero", target: "I want" }
          - { source: "la leche", target: "the milk" }
          - { source: "el pan", target: "the bread" }
          - { source: "un café", target: "a coffee" }
          - { source: "gracias", target: "thank you" }
      - kind: speakLit
        id: sp-win
        es: "me gusta el café"
        en: "I like coffee"
        atoms: ["me gusta", "el", "café"]

  # ── L3 · quieres — asking someone else. Offer-sim consolidation. ─────
  - n: 3
    template: free
    title: "Would you like...?"
    description: "«Quieres» flips the question around — answer either way, both are right."
    steps:
      - kind: info
        id: info-quieres
        title: "Now flip it around"
        body: "«quiero» flips to «quieres» to ask someone else: «¿quieres un café?» — do you want a coffee? «me gusta» flips the same way: «¿te gusta?» — do you like it? Answer either way: «sí, quiero» or «no, gracias»."
      - kind: map
        id: map-quierescafe
        tokens: ["¿quieres", "un", "café?"]
        pairs:
          - { en: "do you want", tokenIndex: 0 }
          - { en: "a", tokenIndex: 1 }
          - { en: "coffee", tokenIndex: 2 }
        audioText: "¿quieres un café?"
        revealNote: "«un» and «café» are yours — «quieres» just flips «quiero» into a question, and you already know both halves."
        tokenGenders: { 1: "m", 2: "m" }
      - kind: speakLit
        id: sp-quierescafe
        es: "¿quieres un café?"
        en: "do you want a coffee?"
        atoms: ["quieres", "un", "café"]
      - kind: clozeLit
        id: c-quierovsquieres1
        es: "quiero un té"
        en: "I want a tea"
        blank: "quiero"
        options: ["quiero", "quieres"]
        atoms: ["quiero", "un", "té"]
        why: "You're the one wanting it — «quiero», not the question form «quieres»."
      - kind: buildLit
        id: b-quierestepan
        es: "¿quieres un té?"
        en: "do you want a tea?"
        atoms: ["quieres", "un", "té"]
        tiles: ["quiero", "el"]
      - kind: clozeLit
        id: c-quierovsquieres2
        es: "quieres pan"
        en: "you want bread"
        blank: "quieres"
        options: ["quieres", "quiero"]
        atoms: ["quieres", "pan"]
        why: "Asking someone else — «quieres». (With food, Spanish often skips the article: «quieres pan» — do you want some bread.)"
      - kind: speakLit
        id: sp-tegusta
        es: "¿te gusta el café?"
        en: "do you like the coffee?"
        atoms: ["te gusta", "el", "café"]
      - kind: buildLit
        id: b-tegustapan
        es: "¿te gusta el pan?"
        en: "do you like the bread?"
        atoms: ["te gusta", "el", "pan"]
        tiles: ["me", "quiero"]
      - kind: audioWimcq
        id: ear-review3
        target: { surface: "la ventana", emoji: "🪟" }
        distractors:
          - { surface: "la puerta", emoji: "🚪" }
          - { surface: "la cama", emoji: "🛏️" }
      - kind: listenCompLit
        id: lc-quiereslecte
        es: "¿quieres leche?"
        en: "Do you want milk?"
        atoms: ["quieres", "leche"]
        distractorsEn:
          - "I want milk."
          - "Do you like milk?"
          - "Is there milk?"
      - kind: speakLit
        id: sp-recall-estaenlamesa
        es: "está en la mesa"
        en: "it's on the table"
        atoms: []
        cue: recall
      - kind: sim
        id: sim-carmen-offer
        scene: { emoji: "🍞", title: "Carmen offers bread", setting: "Carmen holds up a basket of bread." }
        turns:
          - id: t1
            npc: { speaker: "Carmen", es: "¿Quieres pan?", audioText: "¿quieres pan?", gloss: "Do you want bread?" }
            goal: "Answer for yourself — up to you."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, quiero" }
                - { id: "also", text: "no, gracias" }
                - { id: "wrong1", text: "es un pan" }
              correctOptionId: "right"
              alsoCorrectOptionIds: ["also"]
              audioText: "sí, quiero"
            replyGloss: "Yes, I want some."
      - kind: buildLit
        id: b-quieropan
        es: "quiero pan"
        en: "I want bread"
        atoms: ["quiero", "pan"]
        tiles: ["un", "el"]
      - kind: sim
        id: sim-diego-cafeote
        scene: { emoji: "☕", title: "Diego asks too", setting: "Diego leans over from the next table." }
        turns:
          - id: t1
            npc: { speaker: "Diego", es: "¿Quieres café o té?", audioText: "¿quieres café o té?", gloss: "Do you want coffee or tea?" }
            goal: "Say you'd rather have tea."
            reply:
              mode: choice
              options:
                - { id: "right", text: "quiero un té" }
                - { id: "wrong1", text: "quieres un té" }
                - { id: "wrong2", text: "me gusta el café" }
              correctOptionId: "right"
              audioText: "quiero un té"
            replyGloss: "I want a tea."
            explanation: "You're the one answering — «quiero», not «quieres». And he asked what you want NOW, not what you generally like."
      - kind: matchLit
        id: match
        pairs:
          - { source: "quieres", target: "you want" }
          - { source: "sí, quiero", target: "yes, I want it" }
          - { source: "no, gracias", target: "no, thank you" }
          - { source: "un café", target: "a coffee" }
          - { source: "el pan", target: "the bread" }
          - { source: "la leche", target: "the milk" }
      - kind: speakLit
        id: sp-win
        es: "¿quieres un café?"
        en: "do you want a coffee?"
        atoms: ["quieres", "un", "café"]

  # ── L4 · tengo hambre / tengo sed debut + sopa/pollo. ────────────────
  - n: 4
    template: free
    title: "Hungry? Thirsty?"
