# — the new registration lives entirely in `courseAtoms.ts` (via
# `ES_M37_ATOMS`), the same mechanism m33 used for `tengo que`. Do not
# confuse "legal in an NPC line for scope purposes" (already true, unaffected
# by this module) with "creditable via `atoms:`/`exercisedAtomSurfaces`"
# (newly true for the exact string `"hay que"`, as of this module).
#
# ── SIM NPC-LINE PROVENANCE: LIVE AND UNFORGIVING, m29+ HAS ZERO LEGACY
#    ALLOWANCE, RECONFIRMED THROUGH m36 ────────────────────────────────────
# `esSimNpcProvenance.test.ts`'s `KNOWN_LEGACY` allowlist tail is confirmed
