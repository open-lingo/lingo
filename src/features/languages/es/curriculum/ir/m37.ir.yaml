  #    mucho (m7), hoy/mañana (m8), pero (m6/18), también (m11), puedo
  #    (m14), ir/al (m28/m2), necesito (m16), boleto (m16), banco/farmacia/
  #    hospital (m34), estación (m36). No recall — first lesson. Sim t2's
