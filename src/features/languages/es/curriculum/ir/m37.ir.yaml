#
# ── ACCENT: DEEP OFFICIAL-NOTICE INDIGO/NAVY, VERIFIED UNUSED, DISTINCT
#    FROM EVERY PRIOR PAIR ─────────────────────────────────────────────────
# Checked every `accent:` pair in `curriculum/index.ts` (grep-verified, all
# 35 existing pairs read in full, both hex values individually): zero hits
