  # ── L5 · «hay» (m3, there is/are) vs «hay que» (obligation) — the
  #    central credit-trap this module exists to defuse. Same word, two
  #    jobs: «hay» alone + a noun = existence; «hay» + «que» + infinitive
  #    = obligation. Dedicated info card (2nd and last of the module).
  #    Zero new atoms. One recall (L4 win line). PRIOR: hay/un/una (m3),
  #    farmacia/banco/hospital (m34), estación (m36), boleto (m16),
  #    cerca/lejos (m35).
  - n: 5
    template: free
    title: "Hay — dos trabajos"
    description: "«hay» does two jobs. «hay un banco» — there's a bank. «hay que ir» — one has to go. Same word, different partner."
    steps:
      - kind: map
        id: l5-map-hayunbanco
        tokens: ["hay", "un banco"]
