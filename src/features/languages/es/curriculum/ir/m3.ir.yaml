  # ── L5 · en + aquí. Wallet scene re-staged; the ambiguous m2 check
  #    replaced with a single-answer no-entiendo revival. ───────────────
  - n: 5
    template: free
    title: "Put things in their place"
    description: "«en» and «aquí» pin your things to places — and dinero shows up."
    steps:
      - kind: info
        id: info-enaqui
        title: "Two little place words"
        body: "«en» — in, on, at (one word, all three). «aquí» — here (qu is a plain k: a-KEE). «hay una llave aquí» — there's a key here."
      - kind: map
        id: map-sillaaqui
        tokens: ["hay", "una", "silla", "aquí"]
        pairs:
          - { en: "there is", tokenIndex: 0 }
          - { en: "a", tokenIndex: 1 }
          - { en: "chair", tokenIndex: 2 }
          - { en: "here", tokenIndex: 3 }
        audioText: "hay una silla aquí"
        tokenGenders: { 1: "f", 2: "f" }
      - kind: audioWimcq
        id: ear-aqui
        target: { surface: "aquí", emoji: "📍" }
        distractors:
          - { surface: "hay", emoji: "🫴" }
          - { surface: "y", emoji: "➕" }
      - kind: clozeLit
        id: c-enlacasa
        es: "hay dos sillas en la casa"
        en: "there are two chairs in the house"
        blank: "en"
        options: ["en", "de"]
        atoms: ["hay", "dos", "silla", "en", "la", "casa"]
        why: "«de» is of/from (m2); «en» is where something sits."
      - kind: imageMcq
        id: d-dinero
        target: { surface: "el dinero", meaningEn: "the money", emoji: "💰" }
        distractors:
          - { surface: "el papel", emoji: "📄" }
          - { surface: "la llave", emoji: "🔑" }
          - { surface: "el celular", emoji: "📱" }
      - kind: buildLit
        id: b-sillaaqui
        es: "hay una silla aquí"
        en: "There's a chair here"
        atoms: ["hay", "una", "silla", "aquí"]
        tiles: ["en", "un"]
      - kind: sim
        id: sim-nodinero
        scene: { emoji: "💸", title: "The empty wallet", setting: "At the counter, Diego pats every pocket, then looks at you. Yours are empty too." }
        turns:
