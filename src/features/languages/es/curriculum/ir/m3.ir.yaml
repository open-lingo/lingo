module: m3
title: "Things pick a side — el, la, and your first nouns"
frame: none
throughModule: m2
expectedLessonCount: 10
checkpoint: 8

# ES m3 — «El mundo pica un lado»: articles, first nouns, hay.
#
# The FIRST §13-doctrine module authored through the IR (2026-08-24) — the
# exemplar for m4+ dispatches. Frameless (phrase-module mode): every sentence
# is carried literally; no local model, no drafted pool.
#
# SPINE PROVENANCE: word list from _archive/m3.ts (the July module), trimmed
# 27 → 19 atoms per the §13.9 density finding (fewer items, more retrievals):
#   - dropped: mesa/computadora/cosa/mano (no honest emoji → no image debut),
#     teléfono (celular is the word people actually say — one object, one word),
#     agua (the «el agua» exception deserves its own beat AFTER the rule is
#     solid — m4 debt), los/las + plurals-as-rule (m4: this module NOTICES
#     plurals inside counting sentences, never states the rule),
#     día (m1's «buenos días» owns that story), mochila (density).
#   - added: «¿qué es?» — the module's conversational promise (point at
#     anything and ask). hay/en/aquí carried from the July spine.
# DOCTRINE NOTES:
#   - §13.4 callback: m1/m2 absorbed gender (maestro/maestra, señor/señora,
#     «un café»). THIS module states the rule — as a callback, L1.
#     (Guide §13.4 wrote "es: m4" against the July spine; the article module
#     is m3 in the restarted spine — guide updated this session.)
#   - Articles ride every noun surface («la casa», never bare «casa») in
#     cards, maps, builds and audio. ATOMS stay bare (registry/tooling
#     convention; el/la/un/una are their own atoms) — the articled display
#     is the step surface, not the atom.
#   - Counting sentences use plural forms («hay dos libros») — noticed in a
#     win explanation, never taught. The barGuards noun-plural canon
#     attributes «libros» to «libro» (it has awaited this module since the
#     July wave).
#   - Discrimination lanes (§13.9 law 4, both halves live, alternating):
#     el/la and un/una. Phonetics are ALL callbacks (silent h from hola,
#     ll=y from llamo, z=s from diez, qu=k new) and each cashes ≤2 steps.
#   - dinero is hay/el-only — «un dinero» is not Spanish, so no un/una
#     trial ever touches it (inventory rule, not a filter).
#   - Cast: Ana, Diego, Sofía, María (established); learner = Sam.
#
# VOICING LEDGER (printed speak → licenses later cue:"recall"):
#   la casa L1 · el libro L1 · una llave L2 · ¿qué es? L3 · es un lápiz L3
#   hay dos libros L4 · hay una silla aquí L5 · el dinero L5
#   recalls drawn here: la casa (L4), una llave (L6), el libro (L7),
#   ¿qué es? (L8), hay dos libros (L9 via cp? no — L8 build re-derives)
#   cross-module (licensed by m1/m2 printed voicings): bien gracias,
#   ¿cómo estás?, me llamo, buenos días, no gracias, hasta luego.
newAtoms:
  - { surface: "el", meaningEn: "the (with el-words)", partOfSpeech: "particle", kind: "particle", hint: "no accent — él with the accent is 'he'" }
  - { surface: "la", meaningEn: "the (with la-words)", partOfSpeech: "particle", kind: "particle" }
  - { surface: "un", meaningEn: "a / an (with el-words)", partOfSpeech: "particle", kind: "particle" }
  - { surface: "una", meaningEn: "a / an (with la-words)", partOfSpeech: "particle", kind: "particle" }
  - { surface: "hay", meaningEn: "there is / there are", partOfSpeech: "verb", kind: "vocab", hint: "silent h — sounds like English 'eye'" }
  - { surface: "en", meaningEn: "in / on / at", partOfSpeech: "particle", kind: "particle" }
  - { surface: "aquí", meaningEn: "here", partOfSpeech: "adverb", kind: "vocab", hint: "qu is a plain k: a-KEE" }
  - { surface: "¿qué es?", meaningEn: "what is it?", partOfSpeech: "phrase", kind: "phrase", hint: "keh ESS — point and ask" }
  - { surface: "casa", meaningEn: "house", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "🏠" }
  - { surface: "puerta", meaningEn: "door", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "🚪" }
  - { surface: "silla", meaningEn: "chair", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "🪑", hint: "ll sounds like y — same as llamo: SEE-ya" }
  - { surface: "ventana", meaningEn: "window", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "🪟" }
  - { surface: "llave", meaningEn: "key", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "🔑", hint: "ll sounds like y — you know it from llamo: YA-veh" }
  - { surface: "pluma", meaningEn: "pen", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "🖊️" }
  - { surface: "libro", meaningEn: "book", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "📖" }
  - { surface: "lápiz", meaningEn: "pencil", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "✏️", hint: "z sounds like s — same as diez: LA-pees" }
  - { surface: "papel", meaningEn: "paper", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "📄", hint: "stress the end: pa-PEL" }
  - { surface: "celular", meaningEn: "phone", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "📱", hint: "soft c, like cero: seh-loo-LAR" }
  - { surface: "dinero", meaningEn: "money", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "💰" }

lessons:
  # ── L1 · el/la. Rebuilt after the 4-walk sim pass (see
  #    docs/learner-sim/es-m3-FINDINGS.md): honest card (no maestro pair-flip
  #    analogy, endings-usually + secret-side stated), tint legend at the
  #    first map reveal, clozes spaced away from their debuts, the 🚪
  #    hasta-luego distractor evicted, puerta gets a printed voicing. ──
  - n: 1
    template: free
    title: "Everything picks a side"
    description: "la-words and el-words — the one habit that makes every Spanish noun stick."
    steps:
      - kind: info
        id: info-callback
        title: "The two sides"
        body: "In m2, señora took -a and maestro took -o. Every noun — even a house — picks a side like that and never changes it: LA casa, EL libro. The ending usually tells you; a few words keep their side secret, so learn each word WITH its la or el. In the word maps, la-words glow pink (f) and el-words blue (m) — it's about the WORD, not the person. This module: name what's around you, ask what anything is, and count what you see."
      - kind: imageMcq
        id: d-casa
        target: { surface: "la casa", meaningEn: "the house", emoji: "🏠" }
        distractors:
          - { surface: "la señora", emoji: "👩" }
          - { surface: "el maestro", emoji: "👨‍🏫" }
          - { surface: "la estudiante", emoji: "🎓" }
      - kind: map
        id: map-casaana
        tokens: ["la", "casa", "es", "de", "Ana"]
        pairs:
          - { en: "the", tokenIndex: 0 }
          - { en: "house", tokenIndex: 1 }
          - { en: "is", tokenIndex: 2 }
          - { en: "of", tokenIndex: 3 }
          - { en: "Ana", tokenIndex: 4 }
        audioText: "la casa es de Ana"
        revealNote: "'The house is of Ana' — that's how Spanish says Ana's house, with the same «de» as «soy de México». And the colors: la-words glow pink, el-words blue — it's about the WORD, not the person. Ana stays plain."
        tokenGenders: { 0: "f", 1: "f" }
      - kind: imageMcq
        id: d-libro
        target: { surface: "el libro", meaningEn: "the book", emoji: "📖" }
        distractors:
          - { surface: "la casa", emoji: "🏠" }
          - { surface: "el señor", emoji: "👨" }
          - { surface: "la maestra", emoji: "👩‍🏫" }
      - kind: speakLit
        id: sp-ellibro
        es: "el libro"
        en: "the book"
        atoms: ["el", "libro"]
      - kind: clozeLit
        id: c-lacasa
        es: "la casa"
        en: "the house"
        blank: "la"
        options: ["la", "el"]
        atoms: ["la", "casa"]
        why: "casa ends in -a — the ending points at la."
      - kind: audioWimcq
        id: ear-muchogusto
        target: { surface: "mucho gusto", emoji: "🤝" }
        distractors:
          - { surface: "gracias", emoji: "🙏" }
          - { surface: "buenos días", emoji: "🌅" }
      - kind: speakLit
        id: sp-biengracias
        es: "bien gracias"
        en: "fine, thanks"
        atoms: []
        cue: recall
      - kind: imageMcq
        id: d-puerta
        target: { surface: "la puerta", meaningEn: "the door", emoji: "🚪" }
        distractors:
          - { surface: "la casa", emoji: "🏠" }
          - { surface: "el libro", emoji: "📖" }
          - { surface: "el señor", emoji: "👨" }
      - kind: clozeLit
        id: c-ellibro
        es: "el libro"
        en: "the book"
        blank: "el"
        options: ["el", "la"]
        atoms: ["el", "libro"]
        why: "libro ends in -o — the ending points at el."
      - kind: speakLit
        id: sp-lapuerta
        es: "la puerta"
        en: "the door"
        atoms: ["la", "puerta"]
      - kind: audioWimcq
        id: ear-casa
        target: { surface: "la casa", emoji: "🏠" }
        distractors:
          - { surface: "el libro", emoji: "📖" }
          - { surface: "la maestra", emoji: "👩‍🏫" }
      - kind: clozeLit
        id: c-lapuerta
        es: "la puerta"
        en: "the door"
        blank: "la"
        options: ["el", "la"]
        atoms: ["la", "puerta"]
      - kind: matchLit
        id: match
        pairs:
          - { source: "la casa", target: "the house" }
          - { source: "el libro", target: "the book" }
          - { source: "la puerta", target: "the door" }
          - { source: "la maestra", target: "teacher (f)" }
          - { source: "el señor", target: "Mr. / sir" }
          - { source: "mucho gusto", target: "nice to meet you" }
      - kind: speakLit
        id: sp-lacasa
        es: "la casa"
        en: "the house"
        atoms: ["la", "casa"]

  # ── L2 · un/una — same sides, second pair. ──────────────────────────
  - n: 2
    template: free
    title: "Never learn a side twice"
    description: "un and una ride the same sides as el and la — one rule buys you both pairs."
    steps:
      - kind: info
        id: info-ununa
        title: "'A' picks the same side"
        body: "UNA llave, UN celular. If it's a la-word it's an una-word; el-words take un. One rule, both pairs — you never learn a word's side twice."
      - kind: imageMcq
        id: d-llave
        target: { surface: "una llave", meaningEn: "a key", emoji: "🔑" }
        distractors:
          - { surface: "la puerta", emoji: "🚪" }
          - { surface: "el libro", emoji: "📖" }
          - { surface: "la casa", emoji: "🏠" }
      - kind: map
        id: map-esunallave
        tokens: ["es", "una", "llave"]
        pairs:
          - { en: "it is", tokenIndex: 0 }
          - { en: "a", tokenIndex: 1 }
          - { en: "key", tokenIndex: 2 }
        audioText: "es una llave"
        revealNote: "«es» from m2 was 'he/she is' — it's also plain 'it is.' Three words and you can identify anything."
        tokenGenders: { 1: "f", 2: "f" }
      - kind: imageMcq
        id: d-celular
        target: { surface: "un celular", meaningEn: "a phone", emoji: "📱" }
        distractors:
          - { surface: "una llave", emoji: "🔑" }
          - { surface: "la puerta", emoji: "🚪" }
          - { surface: "el libro", emoji: "📖" }
      - kind: clozeLit
        id: c-lallave
        es: "la llave"
        en: "the key"
        blank: "la"
        options: ["la", "el"]
        atoms: ["la", "llave"]
        why: "llave keeps its side secret — no -a, no -o. That's why you learned it as «una llave»: the word carries its side with it."
      - kind: speakLit
        id: sp-unallave
        es: "una llave"
        en: "a key"
        atoms: ["una", "llave"]
      - kind: imageMcq
        id: d-silla
        target: { surface: "una silla", meaningEn: "a chair", emoji: "🪑" }
        distractors:
          - { surface: "un celular", emoji: "📱" }
          - { surface: "una llave", emoji: "🔑" }
          - { surface: "la puerta", emoji: "🚪" }
      - kind: clozeLit
        id: c-uncelular
        es: "un celular"
        en: "a phone"
        blank: "un"
        options: ["un", "una"]
        atoms: ["un", "celular"]
        why: "celular is an el-word, so 'a' is un."
      - kind: buildLit
        id: b-esunallave
        es: "es una llave"
        en: "It's a key"
        atoms: ["es", "una", "llave"]
        tiles: ["un", "el"]
      - kind: audioWimcq
        id: ear-llave
        target: { surface: "una llave", emoji: "🔑" }
        distractors:
          - { surface: "la casa", emoji: "🏠" }
          - { surface: "una silla", emoji: "🪑" }
      - kind: clozeLit
        id: c-unasilla
        es: "una silla"
        en: "a chair"
        blank: "una"
        options: ["una", "un"]
        atoms: ["una", "silla"]
      - kind: audioWimcq
        id: ear-buenosdias
        target: { surface: "buenos días", emoji: "🌅" }
        distractors:
          - { surface: "buenas noches", emoji: "🌙" }
          - { surface: "buenas tardes", emoji: "☀️" }
      - kind: matchLit
        id: match
        pairs:
          - { source: "una llave", target: "a key" }
          - { source: "un celular", target: "a phone" }
          - { source: "una silla", target: "a chair" }
          - { source: "la casa", target: "the house" }
          - { source: "bien", target: "well / fine" }
          - { source: "adiós", target: "goodbye" }
      - kind: speakLit
        id: sp-comoestas
        es: "¿cómo estás?"
        en: "how are you?"
        atoms: []
        cue: recall

  # ── L3 · ¿qué es? — the naming game. lápiz debuts image-first; the
  #    2-chip map was replaced with a listening beat (sim pass). ────────
  - n: 3
    template: free
    title: "Point and ask"
    description: "«¿Qué es?» — the question that names the world. Ask it, answer it."
    steps:
      - kind: info
        id: info-quees
        title: "The question that teaches you Spanish"
        body: "«¿Qué es?» — what is it? Point at anything, ask, and the answer comes back «es un…» or «es una…». It's how you'll learn words forever."
      - kind: imageMcq
        id: d-lapiz
        target: { surface: "un lápiz", meaningEn: "a pencil", emoji: "✏️" }
        distractors:
          - { surface: "una silla", emoji: "🪑" }
          - { surface: "la puerta", emoji: "🚪" }
          - { surface: "un celular", emoji: "📱" }
      - kind: listenCompLit
        id: lc-quees
        es: "¿qué es?"
        en: "What is it?"
        atoms: ["¿qué es?"]
        distractorsEn:
          - "How are you?"
          - "What's your name?"
          - "Is there a key?"
      - kind: speakLit
        id: sp-quees
        es: "¿qué es?"
        en: "what is it?"
        atoms: ["¿qué es?"]
      - kind: clozeLit
        id: c-unlapiz
        es: "un lápiz"
        en: "a pencil"
        blank: "un"
        options: ["un", "una"]
        atoms: ["un", "lápiz"]
        why: "The -z end sounds like s, same as diez: LA-pees. Another secret-side word — it rides with un."
      - kind: sim
        id: sim-quees-lapiz
        scene: { emoji: "✏️", title: "Diego's desk", setting: "Diego holds something up, testing you." }
        turns:
          - id: t1
            npc: { speaker: "Diego", es: "¿Qué es?", audioText: "¿qué es?", gloss: "What is it?" }
            goal: "Tell him."
            reply:
              mode: choice
              options:
                - { id: "right", text: "es un lápiz" }
                - { id: "wrongart", text: "es una lápiz" }
                - { id: "known", text: "es una silla" }
              correctOptionId: "right"
              audioText: "es un lápiz"
            replyGloss: "It's a pencil."
            explanation: "«una lápiz» mixes the sides — lápiz is an el-word, so 'a' is un. The picture rules out the chair; the article is the real test."
      - kind: imageMcq
        id: d-pluma
        target: { surface: "una pluma", meaningEn: "a pen", emoji: "🖊️" }
        distractors:
          - { surface: "un lápiz", emoji: "✏️" }
          - { surface: "un celular", emoji: "📱" }
          - { surface: "una llave", emoji: "🔑" }
      - kind: speakLit
        id: sp-unapluma
        es: "una pluma"
        en: "a pen"
        atoms: ["una", "pluma"]
      - kind: sim
        id: sim-quees-pluma
        scene: { emoji: "🖊️", title: "Sofía's turn", setting: "Now Sofía plays the game." }
        turns:
          - id: t1
            npc: { speaker: "Sofía", es: "¿Y qué es?", audioText: "¿y qué es?", gloss: "And what is it?" }
            goal: "It's a pen — tell her."
            reply:
              mode: build
              tiles: ["es", "una", "pluma", "un", "lápiz"]
              answer: "es una pluma"
            replyGloss: "It's a pen."
            explanation: "pluma ends in -a: una pluma. The game works both ways — before this module is out, YOU ask."
      - kind: clozeLit
        id: c-soyde
        es: "yo soy de Estados Unidos"
        en: "I am from the United States"
        blank: "soy"
        options: ["soy", "eres"]
        atoms: ["soy"]
        why: "m2 warm-up — yo goes with soy."
      - kind: speakLit
        id: sp-esunlapiz
        es: "es un lápiz"
        en: "it's a pencil"
        atoms: ["es", "un", "lápiz"]
      - kind: audioWimcq
        id: ear-pluma
        target: { surface: "una pluma", emoji: "🖊️" }
        distractors:
          - { surface: "un lápiz", emoji: "✏️" }
          - { surface: "una puerta", emoji: "🚪" }
      - kind: matchLit
        id: match
        pairs:
          - { source: "¿qué es?", target: "what is it?" }
          - { source: "un lápiz", target: "a pencil" }
          - { source: "una pluma", target: "a pen" }
          - { source: "una silla", target: "a chair" }
          - { source: "me llamo", target: "my name is" }
          - { source: "no entiendo", target: "I don't understand" }
      - kind: speakLit
        id: sp-mellamo
        es: "me llamo"
        en: "my name is…"
        atoms: []
        cue: recall

  # ── L4 · hay — and the numbers get their job. Plural -s stated on the
  #    card; «en» scrubbed from this lesson (taught in L5). ─────────────
  - n: 4
    template: free
    title: "Say what you see"
    description: "«hay» says what exists — and suddenly your numbers count real things."
    steps:
      - kind: info
        id: info-hay
        title: "One word says 'there is' AND 'there are'"
        body: "«hay» (sounds like English 'eye' — silent h, like hola): there is, there are, one word for both. «hay una silla» — there's a chair. Counting more than one? The noun grows an -s, just like English: «hay dos libros»."
      - kind: map
        id: map-haysilla
        tokens: ["hay", "una", "silla"]
        pairs:
          - { en: "there is", tokenIndex: 0 }
          - { en: "a", tokenIndex: 1 }
          - { en: "chair", tokenIndex: 2 }
        audioText: "hay una silla"
        tokenGenders: { 1: "f", 2: "f" }
      - kind: imageMcq
        id: d-ventana
        target: { surface: "la ventana", meaningEn: "the window", emoji: "🪟" }
        distractors:
          - { surface: "la puerta", emoji: "🚪" }
          - { surface: "la casa", emoji: "🏠" }
          - { surface: "una silla", emoji: "🪑" }
      - kind: speakLit
        id: sp-laventana
        es: "la ventana"
        en: "the window"
        atoms: ["la", "ventana"]
      - kind: map
        id: map-haydoslibros
        tokens: ["hay", "dos", "libros"]
        pairs:
          - { en: "there are", tokenIndex: 0 }
          - { en: "two", tokenIndex: 1 }
          - { en: "books", tokenIndex: 2 }
        audioText: "hay dos libros"
        revealNote: "dos libroS — the -s the card promised, and the blue says libros stays an el-word even when counted. Your m1 numbers finally have things to count."
        tokenGenders: { 2: "m" }
      - kind: textMcq
        id: tm-hay
        target: "hay"
        distractors: ["es", "y", "de"]
      - kind: sim
        id: sim-haytresllaves
        scene: { emoji: "🗝️", title: "Ana counts", setting: "Ana sorts a drawer and holds up keys." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Hay dos llaves?", audioText: "¿hay dos llaves?", gloss: "Are there two keys?" }
            goal: "You count three."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no — hay tres llaves" }
                - { id: "two", text: "sí — hay dos llaves" }
                - { id: "greet", text: "buenas tardes" }
              correctOptionId: "right"
              audioText: "no, hay tres llaves"
            replyGloss: "No — there are three keys."
            explanation: "«hay» asks AND answers: her question and your correction are the same word."
      - kind: buildLit
        id: b-haydoslibros
        es: "hay dos libros"
        en: "There are two books"
        atoms: ["hay", "dos", "libro"]
        tiles: ["un", "tres"]
      - kind: clozeLit
        id: c-hayventana
        es: "hay una ventana y dos sillas"
        en: "there's a window and two chairs"
        blank: "una"
        options: ["una", "un"]
        atoms: ["hay", "una", "ventana", "y", "dos", "silla"]
        why: "ventana ends in -a: una. And there's the counting -s again — dos sillaS."
      - kind: speakLit
        id: sp-lacasa-recall
        es: "la casa"
        en: "the house"
        atoms: ["la", "casa"]
        cue: recall
      - kind: audioWimcq
        id: ear-senora
        target: { surface: "señora", emoji: "👩" }
        distractors:
          - { surface: "señor", emoji: "👨" }
          - { surface: "maestra", emoji: "👩‍🏫" }
      - kind: matchLit
        id: match
        pairs:
          - { source: "hay", target: "there is / there are" }
          - { source: "la ventana", target: "the window" }
