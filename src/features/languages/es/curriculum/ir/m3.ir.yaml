            npc: { speaker: "Diego", es: "¡Ay! ¿Hay dinero aquí?", audioText: "¡ay! ¿hay dinero aquí?", gloss: "Oh no! Is there any money here?" }
            goal: "Check your pockets — nothing."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no — no hay dinero" }
                - { id: "yes", text: "sí — hay dinero aquí" }
                - { id: "greet", text: "mucho gusto" }
              correctOptionId: "right"
              audioText: "no, no hay dinero"
            replyGloss: "No — there's no money."
            explanation: "«no hay» — there isn't. Your m1 «no» does the flip, no new grammar. (Coffee's on Diego next time.)"
      - kind: speakLit
        id: sp-eldinero
