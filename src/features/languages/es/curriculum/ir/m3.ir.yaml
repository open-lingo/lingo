  # ── L6 · «no hay» gets its card, then the lost-keys rescue cashes it. ─
  - n: 6
    template: free
    title: "Find the keys"
    description: "Ana lost her keys — and you learn how to say something ISN'T there."
    steps:
      - kind: info
        id: info-nohay
        title: "Saying no to hay"
        body: "«no hay» — there isn't, there aren't. And the little word drops out: «no hay dinero», «no hay llave». Nothing to point at, so no un/una. Watch Ana find out the hard way."
      - kind: imageMcq
        id: d-papel
        target: { surface: "el papel", meaningEn: "the paper", emoji: "📄" }
        distractors:
          - { surface: "el libro", emoji: "📖" }
          - { surface: "la pluma", emoji: "🖊️" }
          - { surface: "el dinero", emoji: "💰" }
      - kind: sim
        id: sim-keys
        scene: { emoji: "🔍", title: "Ana's keys", setting: "Ana turns the room over. You spot something under a paper on the table." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¡Ay! ¿Hay una llave aquí?", audioText: "¡ay! ¿hay una llave aquí?", gloss: "Argh! Is there a key here?" }
            goal: "You see it — tell her."
            reply:
              mode: build
              tiles: ["sí", "hay", "una", "llave", "aquí", "no", "el"]
              answer: "sí hay una llave aquí"
              alsoAccepted: ["hay una llave aquí", "sí hay una llave"]
            replyGloss: "Yes — there's a key here."
          - id: t2
            npc: { speaker: "Ana", es: "¡Gracias! ¿Y el celular?", audioText: "¡gracias! ¿y el celular?", gloss: "Thank you! And the phone?" }
            goal: "It's not here."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no — no hay celular aquí" }
                - { id: "wrong", text: "hay un celular aquí" }
                - { id: "offtopic", text: "es una pluma" }
              correctOptionId: "right"
              audioText: "no, no hay celular aquí"
            replyGloss: "There's no phone here."
            explanation: "The card's rule, live: after «no hay» the un drops out — «no hay celular», like «no hay dinero» at the café."
      - kind: clozeLit
        id: c-elpapel
        es: "el papel"
        en: "the sheet of paper"
        blank: "el"
        options: ["el", "la"]
        atoms: ["el", "papel"]
        why: "No -o, no -a — papel keeps its side secret, like llave on the other side. It rides with el."
      - kind: audioWimcq
        id: ear-papel
        target: { surface: "el papel", emoji: "📄" }
        distractors:
          - { surface: "la pluma", emoji: "🖊️" }
          - { surface: "el lápiz", emoji: "✏️" }
      - kind: speakLit
        id: sp-elpapel
        es: "el papel"
        en: "the paper"
        atoms: ["el", "papel"]
      - kind: map
        id: map-llaveenpapel
        tokens: ["la", "llave", "es", "de", "Ana"]
        pairs:
          - { en: "the", tokenIndex: 0 }
          - { en: "key", tokenIndex: 1 }
          - { en: "is", tokenIndex: 2 }
          - { en: "of", tokenIndex: 3 }
          - { en: "Ana", tokenIndex: 4 }
        audioText: "la llave es de Ana"
        revealNote: "Same shape as «la casa es de Ana» in lesson 1 — swap the noun, the sentence still works. That's the whole trick."
        tokenGenders: { 0: "f", 1: "f" }
      - kind: speakLit
        id: sp-unallave-recall
        es: "una llave"
        en: "a key"
        atoms: ["una", "llave"]
        cue: recall
      - kind: audioWimcq
        id: ear-cinco
        target: { surface: "cinco", emoji: "5️⃣" }
        distractors:
          - { surface: "seis", emoji: "6️⃣" }
          - { surface: "siete", emoji: "7️⃣" }
      - kind: buildLit
        id: b-sillademaria
        es: "la silla es de María"
        en: "The chair is María's"
        atoms: ["la", "silla", "es", "de"]
        tiles: ["una", "en"]
      - kind: matchLit
        id: match
        pairs:
          - { source: "el papel", target: "the paper" }
          - { source: "la llave", target: "the key" }
          - { source: "el celular", target: "the phone" }
          - { source: "aquí", target: "here" }
          - { source: "gracias", target: "thank you" }
          - { source: "por favor", target: "please" }
      - kind: speakLit
        id: sp-keys-win
        es: "hay una llave aquí"
        en: "there's a key here"
        atoms: ["hay", "una", "llave", "aquí"]

