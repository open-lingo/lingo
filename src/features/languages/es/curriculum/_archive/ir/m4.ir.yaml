    steps:
      - kind: info
        id: info-cognates
        title: "Cognates — free vocabulary"
        body: "Spanish and English share thousands of look-alike words. English words ending in -ent and -ing often have Spanish twins ending in -ente or -ante: intelligent → inteligente, interesting → interesante — and you already know «estudiante». Just pronounce them the Spanish way: pure vowels, stress on the second-to-last syllable."
      - kind: buildLit
        id: build-libro-interesante
        es: "el libro es interesante"
        en: "The book is interesting"
        atoms: ["libro", "interesante"]
      - kind: imageMcq
        id: mcq-inteligente
        target: { surface: "inteligente", meaningEn: "intelligent", emoji: "🧠" }
        distractors:
          - { surface: "bueno", emoji: "👍" }
          - { surface: "malo", emoji: "👎" }
          - { surface: "grande", emoji: "🐘" }
      - kind: speakLit
        id: speak-amiga-inteligente
        es: "mi amiga es inteligente"
        en: "my friend is intelligent"
        atoms: ["amiga", "inteligente"]
      - kind: textMcq
        id: tmcq-interesante
        target: "interesante"
        distractors: ["inteligente", "difícil", "fácil"]
      - kind: imageMcq
        id: mcq-simpatico
        target: { surface: "simpático", meaningEn: "nice / friendly", emoji: "😊" }
        distractors:
          - { surface: "bueno", emoji: "👍" }
          - { surface: "malo", emoji: "👎" }
          - { surface: "inteligente", emoji: "🧠" }
      - kind: buildLit
        id: build-maestro-simpatico
        es: "el maestro es muy simpático"
        en: "The teacher is very friendly"
        atoms: ["maestro", "muy", "simpático"]
      - kind: listenCompLit
        id: lc-libro-muy-interesante
        es: "el libro es muy interesante"
        en: "the book is very interesting"
        distractorsEn: ["the book is very difficult", "the book is very easy", "the house is very interesting"]
        atoms: ["libro", "muy", "interesante"]
      - kind: speakLit
        id: speak-inteligente-simpatico
        es: "él es muy inteligente y simpático"
        en: "he is very intelligent and friendly"
        atoms: ["muy", "inteligente", "simpático"]
      - kind: selfExplain
        id: self-explain-e-plural
        anchorLabel: "You wrote: es muy inteligente"
        anchorAudioText: "es muy inteligente"
        question: "If you were describing two intelligent people (ellos son ___), what would change?"
        rule: "Only the ending -s is added for plural: inteligente → inteligentes. The word never splits by gender."
        surface: "It would become inteligento for a group of people."
        distractor: "It stays exactly 'inteligente' even for plural, since -e adjectives never change at all."
        ruleExplanation: "-e adjectives are gender-invariant but still mark plural: interesante→interesantes, inteligente→inteligentes. Gender never changes; number still does."
      - kind: buildLit
        id: build-simpatica
        es: "ella es muy simpática"
        en: "She is very friendly"
        tiles: ["simpático"]
        atoms: ["simpático", "muy"]
      - kind: textMcq
        id: tmcq-simpatico
        target: "simpático"
        distractors: ["interesante", "inteligente", "bueno"]
      - kind: listenBuildLit
        id: lb-libro-espanol-interesante
        es: "el libro de español es interesante"
