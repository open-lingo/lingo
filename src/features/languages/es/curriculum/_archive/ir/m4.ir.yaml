  # ── L5 · opiniones — muy bueno, pero… ─────────────────────────────────────────
  - n: 5
    template: free
    title: "Opiniones — muy bueno, pero…"
    description: "Rate things, turn it up with muy, contrast with pero."
    steps:
      - kind: info
        id: info-muy-pero
        title: "Turning it up, talking it down"
        body: "Drop «muy» in front of any describing word to intensify it: muy grande (very big), muy bonita (very pretty). To contrast two ideas, join them with «pero»: la casa es bonita, pero es pequeña — the house is pretty, but it's small."
      - kind: imageMcq
        id: mcq-bueno
        target: { surface: "bueno", meaningEn: "good", emoji: "👍" }
        distractors:
          - { surface: "malo", emoji: "👎" }
          - { surface: "grande", emoji: "🐘" }
          - { surface: "pequeño", emoji: "🤏" }
      - kind: speakLit
        id: speak-libro-bueno
        es: "el libro es bueno"
        en: "the book is good"
        atoms: ["libro", "bueno"]
      - kind: imageMcq
        id: mcq-malo
        target: { surface: "malo", meaningEn: "bad", emoji: "👎" }
        distractors:
          - { surface: "bueno", emoji: "👍" }
          - { surface: "grande", emoji: "🐘" }
          - { surface: "pequeño", emoji: "🤏" }
      - kind: buildLit
        id: build-carro-malo
        es: "el carro es malo"
        en: "the car is bad"
        tiles: ["bueno"]
        atoms: ["carro", "malo"]
      - kind: textMcq
        id: tmcq-malo
        target: "malo"
        distractors: ["bueno", "feo", "difícil"]
      - kind: buildLit
        id: build-alto-muy
        es: "él es muy alto"
        en: "He is very tall"
        tiles: ["bajo"]
        atoms: ["muy", "alto"]
      - kind: clozeLit
        id: c-muy
        es: "el perro es muy bonito"
        en: "the dog is very pretty"
        blank: "muy"
        options: ["muy", "pero", "y", "o"]
        why: "muy intensifies the adjective that follows."
        atoms: ["muy", "perro", "bonito"]
      - kind: speakLit
        id: speak-gato-muy-bonito
        es: "el gato es muy bonito"
        en: "the cat is very pretty"
        atoms: ["muy", "gato", "bonito"]
      - kind: translateLit
        id: tr-carro-pero-viejo
        es: "el carro es bonito, pero viejo"
        en: "The car is pretty, but old"
        atoms: ["carro", "bonito", "pero", "viejo"]
      - kind: clozeLit
        id: c-pero
        es: "la casa es bonita, pero pequeña"
        en: "the house is pretty, but it's small"
        blank: "pero"
        options: ["pero", "muy", "y", "o"]
        why: "pero signals a contrast between two ideas."
        atoms: ["pero", "casa", "bonito", "pequeño"]
      - kind: speakLit
        id: speak-silla-pero-baja
        es: "la silla es bonita, pero baja"
        en: "the chair is pretty, but low"
        atoms: ["silla", "bonito", "pero", "bajo"]
      - kind: selfExplain
        id: self-explain-muy-pero
        anchorLabel: "You wrote: la casa es bonita, pero pequeña"
        anchorAudioText: "la casa es bonita, pero pequeña"
        question: "What job does pero do in this sentence?"
        rule: "pero joins two ideas that contrast — it signals 'but' between them."
        surface: "pero just means 'and' with extra emphasis."
        distractor: "pero can only connect two single adjectives, never two full clauses."
        ruleExplanation: "pero links a contrast: something true, followed by an exception or opposite (bonita, pero pequeña). muy, by contrast, only intensifies a single adjective — it can't join clauses."
      - kind: listenCompLit
        id: lc-bueno-malo
        es: "el libro no es bueno, es malo"
        en: "the book isn't good, it's bad"
        distractorsEn: ["the book is very good", "the book is very old", "the book isn't new, it's old"]
        atoms: ["libro", "bueno", "malo"]
      - kind: buildLit
        id: build-perro-muy-bueno
        es: "mi perro es muy bueno"
        en: "My dog is very good"
        atoms: ["perro", "muy", "bueno"]
      - kind: reviewMatch
        id: rev
      - kind: listenCompLit
        id: lc-gato-pero-feo
        es: "el gato es bueno, pero feo"
        en: "the cat is good, but ugly"
        distractorsEn: ["the cat is bad, but pretty", "the cat is very good", "the dog is good, but ugly"]
        atoms: ["gato", "bueno", "pero", "feo"]
      - kind: translateLit
        id: tr-carro-muy-grande
        es: "el carro es muy grande"
        en: "The car is very big"
        atoms: ["carro", "muy", "grande"]
      - kind: textMcq
        id: tmcq-pero
        target: "pero"
        distractors: ["muy", "y", "o"]
      - kind: info
        id: info-win
        title: "You can give real opinions"
        body: "muy to turn it up, pero to turn it around — now you can say what's good, bad, and everything in between, with contrast."
        variant: "win"

