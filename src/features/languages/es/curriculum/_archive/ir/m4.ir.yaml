          - { speaker: "Luis", text: "Es interesante, no es difícil." }
        questions:
          - id: "q1"
            prompt: "How is Luis's teacher?"
            correctText: "Intelligent and friendly"
            distractors: ["Old and boring", "Bad and difficult", "Tall and short"]
          - id: "q2"
            prompt: "How is the book?"
            correctText: "Interesting, not difficult"
            distractors: ["Easy, not interesting", "New, not old", "Big, not small"]
        atoms: ["maestro", "inteligente", "simpático", "libro", "interesante", "difícil"]
      - kind: speakLit
        id: speak-close
        es: "mi maestra es simpática y mi libro es interesante"
        en: "my teacher is friendly and my book is interesting"
        atoms: ["maestra", "simpático", "libro", "interesante"]
      - kind: reviewMatch
        id: rev
      - kind: buildLit
        id: build-estudiante-inteligente
        es: "el estudiante inteligente"
        en: "The intelligent student"
        atoms: ["estudiante", "inteligente"]
      - kind: translateLit
        id: tr-amiga-inteligente
