      - { kind: sentence, ja: "としょかんは ごじまでだから よじまでに いく。", en: "The library is open until five, so I'll get there by four", exercises: [made-ni, made-until, kara-because], mode: build }
      - { kind: sentence, ja: "ごじまでに うちに かえる。", en: "Say to a friend: I'll be home by five", exercises: [made-ni], mode: translate }
      - { kind: particle-cloze, stem: "ごじ", tail: " うちに かえる。", answer: "までに", options: ["までに", "まで", "から"], en: "I'll be home by five", explanation: "かえる happens ONCE, so it takes the deadline particle までに. まで would stretch the going-home over every minute until five, and から would start it at five instead." }
      - { kind: listening-comp, audio: "ろくじまで きっさてんで まつ。", answer: "I'll wait at the coffee shop until six", distractors: ["I'll get to the coffee shop by six", "I'll wait at the coffee shop from six", "I'll wait at the station until six"], exercises: [made-until, de-action] }
