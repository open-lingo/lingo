      - { kind: sentence, ja: "ちかてつで だいがくへ いく。", en: "I head to the university by subway", exercises: [de-action, e-direction], mode: build }
      - { kind: sentence, ja: "きょうは びょういんへ いく。", en: "Say to a friend: I'm heading to the hospital today", exercises: [e-direction], mode: translate }
      - { kind: listening-comp, audio: "ミカは きっさてんに いくけど ケンは うちに かえる。", answer: "Mika is going to the coffee shop, but Ken is going home", distractors: ["Mika is going home, but Ken is going to the coffee shop", "Mika and Ken are both going home", "Mika is going to the library, but Ken is going home"], exercises: [ni-location, kedo] }
      - { kind: sentence, ja: "やまへ いくから くつを かう。", en: "I'm heading to the mountains, so I'll buy shoes", exercises: [e-direction, kara-because, wo-object], mode: build }
      - kind: dialogue
        lines:
          - { speaker: "Tanaka", ja: "あしたは がっこうへ きますか。", en: "Are you coming to school tomorrow?" }
          - { speaker: "Mika", ja: "いきます。でんしゃで いきます。", en: "I am. I'm going by train." }
        questions:
          - { q: "How is Mika getting to school?", options: ["By train", "By bus", "On foot", "By bike"], answer: "By train" }
    reviewPool: [がっこう, としょかん, びょういん, でんしゃ, バス, ちかてつ, あるく, かえる, へ, えき]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m19-neo-4
    role: teaching
    title: "「たべに いく」 — going in order to do something"
    focus: "The purpose comes first: ます-stem + に いく, and the dictionary form never goes there"
    introduces: []
    beats:
      - { kind: rule, grammarPointId: ni-iku }
      - { kind: sentence, ja: "ごはんを たべに いく。", en: "I'm going out to eat", exercises: [ni-iku, wo-object], mode: build }
      - { kind: sentence, ja: "ミカは ちゃを のみに きっさてんに いく。", en: "Mika is going to the coffee shop to drink tea", exercises: [ni-iku, wo-object, ni-location], mode: build }
      - { kind: sentence, ja: "えいがを みに いく。", en: "I'm going to watch a movie", exercises: [ni-iku, wo-object], mode: build }
      - { kind: sentence, ja: "トムは ともだちと かいものに いく。", en: "Tom is going shopping with a friend", exercises: [ni-iku, to-and], mode: listening }
