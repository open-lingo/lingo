      - { kind: sentence, ja: "あしたまでに きっぷを かう。", en: "I'll buy the ticket by tomorrow", exercises: [made-ni, wo-object], mode: build }
      - { kind: sentence, ja: "ろくじまで きっさてんで まつ。", en: "I'll wait at the coffee shop until six", exercises: [made-until, de-action], mode: listening }
      - { kind: sentence, ja: "はちじ じゅっぷんまでに えきに いく。", en: "I'll get to the station by 8:10", exercises: [made-ni, counter-fun, ni-location], mode: build }
