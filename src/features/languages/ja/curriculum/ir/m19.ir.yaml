module: m19
title: "Getting around: motion particles"
register: plain
priorNeoModules: [m3, m4, m5, m6, m7, m8, m9, m10, m11, m12, m13, m14, m15, m16, m17, m18]

priorGrammarPoints: [wa-topic, wo-object, ni-time, mo-also, to-and,
                     koko-soko-asoko, spatial-relations, nai-existence, arimasu, imasu,
                     ga-existence, no-possession, kore-sore-are-dore, kono-sono-ano-dono,
                     dare, masu-negative, masu-past, masu-past-negative, desu-past,
                     dictionary-form, ta-form, nai-form, desu-copula, ka-question,
