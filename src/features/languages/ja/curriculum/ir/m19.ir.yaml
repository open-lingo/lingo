  - id: m19-neo-9
    role: teaching
    title: "「えきは どこですか」 — asking a stranger"
    focus: "The one place plain form is socially wrong: すみません, です / ます, and か on every question"
    introduces: [どこですか]
    beats:
      - { kind: rule, grammarPointId: masu-present }
      # 「どこですか」 is a registered survival PHRASE, so a build step would tile
      # it whole and the learner would never place the か. Typed instead; the
      # cloze below drills the あそこ / あそこです / あそこですか ladder, which is
      # the same contrast on a surface that decomposes.
      - { kind: sentence, ja: "すみません えきは どこですか。", en: "Say politely: Excuse me, where is the station", exercises: [masu-present, location-qa, ka-question], mode: translate }
      - { kind: sentence, ja: "びょういんは あそこですか。", en: "Say politely: Is the hospital over there", exercises: [masu-present, koko-soko-asoko, ka-question], mode: build }
      - { kind: sentence, ja: "バスで がっこうに いきますか。", en: "Say politely: Do you go to school by bus", exercises: [masu-present, de-action, ni-location], mode: build }
      - { kind: sentence, ja: "でんしゃは なんじに きますか。", en: "Say politely: What time does the train come", exercises: [masu-present, location-qa, ni-time], mode: listening }
      - { kind: sentence, ja: "ちかてつで だいがくに いきますか。", en: "Say politely: Do you go to the university by subway", exercises: [masu-present, de-action, ni-location], mode: build }
      - { kind: sentence, ja: "としょかんは なんじからですか。", en: "Say politely: What time is the library open from", exercises: [masu-present, kara-time, ka-question], mode: build }
      - { kind: sentence, ja: "えきまで じゅっぷんですか。", en: "Say politely: Is it ten minutes to the station", exercises: [masu-present, counter-fun, made-until], mode: build }
      - { kind: sentence, ja: "えきは どこ？", en: "Say to a friend: Where is the station", exercises: [masu-present, location-qa], mode: build }
      - { kind: particle-cloze, stem: "びょういんは ", tail: "。", answer: "あそこですか", options: ["あそこですか", "あそこです", "あそこ"], en: "Say politely: Is the hospital over there?", explanation: "a polite QUESTION needs both halves — です for the register and か to make it a question. あそこです is a polite statement, and あそこ on its own is what you say to a friend." }
      - { kind: listening-comp, audio: "バスで びょういんに いきますか。", answer: "Do you go to the hospital by bus?", distractors: ["Do you go to the library by bus?", "Do you go to the hospital by train?", "Does the bus go to the hospital?"], exercises: [masu-present, de-action] }
      - { kind: listening-comp, audio: "でんしゃは なんじに きますか。", answer: "What time does the train come?", distractors: ["What time does the bus come?", "Does the train come at nine?", "How many minutes until the train comes?"], exercises: [masu-present, ni-time] }
      - kind: dialogue
        lines:
          - { speaker: "Tom", ja: "すみません びょういんは どこですか。", en: "Excuse me, where is the hospital?" }
