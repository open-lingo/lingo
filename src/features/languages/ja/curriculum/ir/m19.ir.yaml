      - { kind: sentence, ja: "でんしゃは あさ ごじから あるから だいじょうぶだ。", en: "There are trains from five in the morning, so it's fine", exercises: [kara-time, arimasu, kara-because], mode: build }
      - { kind: sentence, ja: "くじから はたらく。", en: "Say to a friend: I work from nine", exercises: [kara-time], mode: translate }
      - { kind: particle-cloze, stem: "みせは ", tail: "から ろくじまでだ。", answer: "くじ", options: ["くじ", "はちじ", "じゅうじ"], en: "The shop is open from nine to six", explanation: "nine o'clock is くじ — this hour keeps the short reading and is never kyuuji. はちじ is eight and じゅうじ is ten." }
      - { kind: listening-comp, audio: "じゅうじ ごふんから じゅぎょうが ある。", answer: "There's a class from 10:05", distractors: ["There's a class from 10:10", "There's a class until 10:05", "There's a class from 5:10"], exercises: [kara-time, counter-fun] }
      - { kind: listening-comp, audio: "としょかんは じゅうじから ごご ごじまでだ。", answer: "The library is open from ten to five in the afternoon", distractors: ["The library is open from five to ten in the afternoon", "The library is open until ten in the morning", "The shop is open from ten to five in the afternoon"], exercises: [kara-time, made-until] }
