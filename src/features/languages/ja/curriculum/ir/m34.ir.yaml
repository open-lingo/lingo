      - { kind: kanji, kana: かいしゃ, kanji: 会社, distractors: ["かいしゃく", "かいしゅ", "がいしゃ"], exercises: [you-to-omou] }
      - { kind: challenge, ja: "らいねん にほんで しごとを さがそうとおもう。", en: "Next year I think I'll look for a job in Japan", combines: [you-to-omou, de-action, wo-object], mode: build }
