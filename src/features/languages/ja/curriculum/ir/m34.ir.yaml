  - id: m34-neo-6
    role: teaching
    title: "「やめることにした」 — deciding, hands on the wheel"
    focus: "Wrap the action in こと and する it — the decision has an owner, and it is you"
    introduces: [やめる, やめよう, ちょきん]
    beats:
      - { kind: rule, grammarPointId: koto-ni-suru }
      - { kind: sentence, ja: "かいしゃを やめる。", en: "I quit the company", exercises: [wo-object], mode: build }
