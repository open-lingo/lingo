notes: |
  m34 · n4-05 — VOLITIONAL (docs/spine-n4.md §m34). The payoff module after the
  transitivity wall: every piece here attaches to something already owned
  (ましょう m24, とおもう m18, こと m15, つもり m23, なる m12), so the only
  genuinely new thing on screen is the volitional's own conjugation.

  THE MODULE'S THESIS, stated once and drilled everywhere: the volitional is
  the BASE, and ましょう — which the learner has produced since m24 — is its
  polite derivative. This is the course's standing "polite is a layer" claim
  (m7) applied to a form the learner already owns BACKWARDS. のもう is not a
  new casual version of のみましょう; のみましょう was のもう wearing the
  ます layer all along. The reveal is the highest-value beat in the module —
  same class of move as m37's planned ば-unfreezing.

  WHAT IS TAUGHT:
  1. Plain volitional by class (L1 u-verbs: のもう/いこう/かおう; L2 ru +
     irregulars: たべよう/しよう/こよう) — with the transform-card ramp and
     rule table per the standing formation rule.
  2. ましょう re-framed as derived (L1, second card).
  3. 「いこう？」 as the casual invitation + the register ladder against
     ませんか/ましょうか (L3) — pairwise with m24's set, never a bare list.
  4. 〜(よ)うとおもう intent (L5) — embeds in m18's とおもう unchanged.
  5. ことにする "I decide to" (L6) vs ことになる "it gets decided" (L7) —
     the volition/no-volition pair, riding こと (m15) and なる (m27's
     ku-ni-naru sibling). PAIRWISE across two lessons, contrast on L7.
  6. 〜(よ)うとする "attempt" as RECOGNITION (L9), with the explicit contrast
     the spine names: てみる is do-and-find-out (you did it); ようとする is
     the attempt itself (you may never have got there). Learners collapse
     these; the contrast beat exists because of that.

  DIALOGUE_SIM DEBUT (Spencer 2026-08-24: "get some good use of the dialogue
  conversation sim step"). m34 is the JA course's first module with the new
  `kind: sim` beat (emitter landed 2026-08-24), and it is placed where the
  grammar itself is conversational: an invitation only exists as a TURN in a
  conversation. Two sims, register-paired on the module's own thesis:
    - L3: Saturday plans with Ken — casual volitional invitations, build
      replies (えいがを みよう).
    - L10: after class with Tanaka — the SAME suggestion move in polite dress
      (がんばります / しましょう), so the ましょう-is-derived claim gets a
      lived register contrast, not just a rule card.

  m33 RE-CEMENT OBLIGATION (Spencer 2026-08-19, ratchet in m33-neo.test.ts):
  all six glance verbs appear in sentence examples here —
  はじまる (L1 えいがが はじまる まえに), はじめる (L2 しゅくだいを
  はじめよう), でる (L2 うちを でよう), だす (L1 てがみを だそう),
  おちる / おとす (L9 かばんから さいふが おちた / さいふを おとした —
  the attempt lesson, where losing things is the natural content).

  VOCAB ALLOCATION (spine must/prefer, measured against the m34 context
  pack): new nouns ゆめ・よてい・しょうらい・けっこん・そつぎょう・
  もくひょう・ちょきん; new verbs さがす (RE-STAMP — atom `sagasu` exists
  future-stamped with 🔍)・やめる・がんばる. はたらく is spine-"must" but
  ALREADY TAUGHT — it is a carrier here (はたらこう), not a new atom.
  ひっこす/きぼう/にゅうしゃ (spine prefer) are CUT for room; sidequest set
  untouched. Image debuts: もくひょう 🎯 (bullseye = target/goal, honest;
  なか's blocked note confirms the bullseye reads as "target"), さがす 🔍,
  けっこん 💒 (VENDOR emoji_u1f492.svg — not yet in src/pub/noto-emoji/svg).

  TOKENIZER HAZARDS (m33-prep §3 recurrences): every volitional surface used
  in a sentence is registered as a `verb-form` newAtom with `derivedFrom` —
  the tokenizer cannot see のもう inside のむ. Same for polite がんばります
  (sim L10) and た-forms of module verbs actually used (おとした). Commas
  are not tokenizer boundaries; keep the m33 discipline on comma-adjacent
  words.
grammarPoints:
  # RULE-CARD VOCABULARY NOTE (m33's discipline, kept): no card below names
  # もくひょう, さがす or けっこん — the module's three image debuts — before
  # their lesson's picture MCQ. Cards argue from コーヒー, えいが and しごと,
  # owned for twenty modules.

  - id: volitional
    variant: shape-u
    rule: "This is the form ましょう has been hiding. A u-verb turns its last sound from the u-row to the o-row and takes う: のむ→のもう, いく→いこう, かう→かおう, けす→けそう. The meaning is your own will, thrown forward: 「コーヒーを のもう」 is \"let's have a coffee\" with somebody, or \"right — I'll have a coffee\" alone to yourself. Nothing else in the sentence changes: whatever it had — a を, a に, a から — stays exactly where it was. Only the verb's ending moves, and it moves the same way every time."
    conjugation: { form: volitional, classes: [u] }
    examples:
      - { ja: "コーヒーを のもう。", en: "Let's have a coffee." }
      - { ja: "としょかんに いこう。", en: "Let's go to the library." }
      - { ja: "あたらしい かばんを かおう。", en: "I'll buy a new bag." }
      - { ja: "でんきを けそう。", en: "Let's turn off the light." }
    antiPattern: { ja: "コーヒーを のむう。", why: "the volitional is not う stuck on the dictionary form — the last sound itself moves to the o-row first: のむ → のも + う. のもう." }

  - id: volitional
    variant: mashou-is-polite
    rule: "Now the reveal. You have said のみましょう since module 24 — and のみましょう is just のもう wearing the polite layer. Same word, same will, dressed up. This is the course's oldest claim about Japanese — politeness is a LAYER over the real sentence, not a different language — landing on a form you learned backwards. You met the polite version first; here is the base it was built on. So nothing new to memorise: everywhere you would say のみましょう to your teacher, you say のもう to a friend. The pair 「のもう / のみましょう」 works exactly like 「のむ / のみます」."
    examples:
      - { ja: "いっしょに たべよう。", en: "Let's eat together." }
      - { ja: "いっしょに たべましょう。", en: "Let's eat together. (polite)" }
      - { ja: "えきまで あるこう。", en: "Let's walk to the station." }
    antiPattern: { ja: "いっしょに たべますよう。", why: "the polite suggestion is not ます with よう stacked on top — the layers FUSE: ましょう is the volitional's polite form entire. いっしょに たべましょう。" }

  - id: volitional
    variant: ru-irregular
    rule: "The ru-verbs do what ru-verbs always do: drop る, take よう. たべる→たべよう, みる→みよう, でる→でよう. And the two irregulars are two words to know, not a rule: する→しよう, くる→こよう. That closes the whole system — every verb you own can now carry your will. Notice the shape against the u-verbs: のもう ends in おう, たべよう ends in よう. If you hear 〜よう, you are looking at a ru-verb or an irregular; 〜おう and it was a u-verb."
    conjugation: { form: volitional, classes: [ru, irregular] }
    examples:
      - { ja: "ばんごはんを たべよう。", en: "Let's eat dinner." }
      - { ja: "しゅくだいを はじめよう。", en: "Let's start the homework." }
      - { ja: "あした また こよう。", en: "Let's come again tomorrow." }
      - { ja: "そろそろ しよう。", en: "Let's do it, it's about time." }
    antiPattern: { ja: "ばんごはんを たべろう。", why: "たべる is a ru-verb — it drops る and takes よう, not the u-verb's おう: たべよう. たべろう treats it as a u-verb ending in べる." }

  - id: volitional
    variant: invitation
    rule: "Said flat, 「いこう」 is let's-go. Said with a question's rise — 「いこう？」 — it is an INVITATION, the plainest one Japanese has. You have owned the polite rungs of this ladder since module 24: いきませんか asks \"won't you go?\", いきましょうか offers \"shall we?\". 「いこう？」 is the same move with the layers off, and it is what friends actually say. Pick by audience, exactly as always: to Ken, いこう？ To たなかせんせい, いきませんか. The move never changes; the dress does."
    examples:
      - { ja: "いっしょに えいがを みよう？", en: "Want to watch a film together?" }
      - { ja: "こうえんに いこう？", en: "Shall we go to the park?" }
      - { ja: "いっしょに いきませんか。", en: "Won't you come along? (polite)" }
    antiPattern: { ja: "せんせい、いっしょに いこう？", why: "the bare volitional invitation is friend-register — inviting your teacher takes the polite rung of the same ladder: いきませんか." }

  - id: you-to-omou
    rule: "Put とおもう behind a volitional and you get intent held in the mind: 「しごとを さがそうとおもう」 — I think I'll look for a job. You have quoted thoughts with とおもう since module 18; this is the same machine with a volitional inside the quote. The difference from つもり (module 23) is temperature: つもり is a settled plan you could put on a calendar; 〜ようとおもう is the will still forming — \"I'm thinking I'll…\". That is why it pairs so naturally with しょうらい and ゆめ: futures are exactly the things we hold at arm's length."
    examples:
      - { ja: "しごとを さがそうとおもう。", en: "I think I'll look for a job." }
      - { ja: "らいげつから まいにち あるこうとおもう。", en: "I think I'll walk every day from next month." }
      - { ja: "しょうらい にほんで はたらこうとおもう。", en: "I think I'll work in Japan in the future." }
    antiPattern: { ja: "しごとを さがすとおもう。", why: "with the dictionary form inside, とおもう reports a guess about the world — \"I think (someone) will look for a job\". Your own intent puts the VOLITIONAL in the quote: さがそうとおもう." }

  - id: koto-ni-suru
    rule: "「〜ことにする」 is deciding, with your hands on the wheel. Take the whole action as a こと — a thing, module 15's nominalizer — and する it: 「かいしゃを やめることにした」, I decided to quit the company. する is the tell that YOU pushed: the decision has an owner, and it is the speaker. Present tense decides now (ことにする); past tense reports the decision already made (ことにした), which is how it usually appears — we mostly tell people about decisions after making them."
    examples:
      - { ja: "まいにち れんしゅうすることにする。", en: "I've decided to practise every day." }
      - { ja: "かいしゃを やめることにした。", en: "I decided to quit the company." }
      - { ja: "ちょきんを はじめることにした。", en: "I decided to start saving." }
    antiPattern: { ja: "まいにち れんしゅうするにする。", why: "する needs a THING to decide on, and a bare verb is not a thing yet — こと does that job first: れんしゅうすることにする." }

  - id: koto-ni-naru
    rule: "Same shape, different engine: 「〜ことになる」 is the decision arriving from outside. なる is the verb of the world changing by itself — you have had it since module 27's くなる/になる — so 「けっこんすることになった」 says the marriage got decided, without pointing at who decided. Japanese reaches for this constantly, and not only for modesty: transfers, schedules, plans made by families and companies genuinely are decided around us. する-version: I own it. なる-version: it landed on me. The particle-perfect minimal pair with ことにする is the whole lesson."
    examples:
      - { ja: "らいげつ けっこんすることになった。", en: "It's been decided we're getting married next month." }
      - { ja: "アメリカで はたらくことになった。", en: "It's been settled that I'll be working in America." }
      - { ja: "らいねん そつぎょうすることになる。", en: "It'll turn out that I graduate next year." }
    antiPattern: { ja: "わたしが きめるから、けっこんすることになった。", why: "ことになる deliberately leaves the decider out — but this sentence's から-clause just named one: わたしが きめる. Once a decider is on the page, the wrap-up has to agree with it: けっこんすることにした、not ことになった。" }

  - id: you-to-suru
    rule: "「〜ようとする」 is the attempt itself — will meeting the world, with no promise the world gave way. 「ドアを あけようとした」: I went to open the door. Maybe it opened; usually the sentence continues with what got in the way — けど、あかなかった. Keep it apart from module 30's てみる, because English \"try\" flattens them into one word: あけてみた means you DID open it, to find out what would happen; あけようとした means you may never have got it open at all. Do-and-see versus almost-did. You need only recognise this one for now — production comes later in the tier."
    examples:
      - { ja: "ドアを あけようとした。", en: "I tried to open the door." }
      - { ja: "あけようとしたけど、あかなかった。", en: "I tried to open it, but it wouldn't open." }
      - { ja: "でんわを かけようとした とき、ともだちが きた。", en: "Just as I was about to make a call, my friend came." }
    antiPattern: { ja: "ドアを あけるとした。", why: "the attempt puts the VOLITIONAL in front of とする — the dictionary form belongs to guesses (あけるとおもう), not attempts: あけようとした." }

newAtoms:
  # ══ Nouns. All blocked except もくひょう/けっこん (the image debuts) — the
  #    rest are abstractions a picture cannot name honestly (ゆめ would draw
  #    a sleeping face → "sleep"; よてい a calendar → "calendar").
  - { kana: ゆめ, romaji: yume, gloss: "a dream — asleep, or for the future", shortGloss: "dream", imageable: false, kind: vocab }
  - { kana: よてい, romaji: yotei, gloss: "a plan, a schedule", shortGloss: "plan", imageable: false, kind: vocab }
  - { kana: しょうらい, romaji: shourai, gloss: "the future (someone's own)", shortGloss: "the future", imageable: false, kind: vocab }
  - { kana: けっこん, romaji: kekkon, gloss: "marriage, getting married", shortGloss: "marriage", imageable: false, kind: vocab }
  - { kana: そつぎょう, romaji: sotsugyou, gloss: "graduation", shortGloss: "graduation", imageable: false, kind: vocab }
  - { kana: もくひょう, romaji: mokuhyou, gloss: "a goal, a target", shortGloss: "goal", imageable: true, kind: vocab }
  - { kana: ちょきん, romaji: chokin, gloss: "savings, saving money", shortGloss: "savings", imageable: false, kind: vocab }
  # ══ Verbs. さがす RE-STAMPS the existing future-stamped atom `sagasu` (🔍,
  #    imageable — the magnifying glass IS searching). やめる/がんばる have no
  #    honest picture (a 💪 reads "strong", not "keep at it").
  - { kana: さがす, romaji: sagasu, gloss: "to look for, to search for", shortGloss: "look for", imageable: true, kind: verb, verbClass: u }
  - { kana: やめる, romaji: yameru, gloss: "to quit, to stop doing", shortGloss: "quit", imageable: false, kind: verb, verbClass: ru }
  - { kana: がんばる, romaji: ganbaru, gloss: "to do one's best, to keep at it", shortGloss: "do one's best", imageable: false, kind: verb, verbClass: u }
  # ══ Volitional surfaces actually used in sentences — the tokenizer cannot
  #    find のもう inside のむ (m33-prep §3). One atom per surface, derivedFrom
  #    carries the ramp. EXPANSION AGENT: add/remove entries here so this list
  #    EXACTLY matches the volitional surfaces your beats use — no unused
  #    atoms, no unregistered surfaces.
  - { kana: のもう, romaji: nomou, gloss: "let's drink (volitional of のむ)", shortGloss: "let's drink", imageable: false, kind: verb-form, derivedFrom: のむ, verbClass: u }
  - { kana: いこう, romaji: ikou, gloss: "let's go (volitional of いく)", shortGloss: "let's travel", imageable: false, kind: verb-form, derivedFrom: いく, verbClass: u }
  - { kana: かおう, romaji: kaou, gloss: "let's buy (volitional of かう)", shortGloss: "let's buy", imageable: false, kind: verb-form, derivedFrom: かう, verbClass: u }
  - { kana: けそう, romaji: kesou, gloss: "let's turn off (volitional of けす)", shortGloss: "let's turn off", imageable: false, kind: verb-form, derivedFrom: けす, verbClass: u }
  - { kana: だそう, romaji: dasou, gloss: "let's send out (volitional of だす)", shortGloss: "let's put out", imageable: false, kind: verb-form, derivedFrom: だす, verbClass: u }
  - { kana: あるこう, romaji: arukou, gloss: "let's walk (volitional of あるく)", shortGloss: "let's walk", imageable: false, kind: verb-form, derivedFrom: あるく, verbClass: u }
  - { kana: はたらこう, romaji: hatarakou, gloss: "let's work / I'll work (volitional of はたらく)", shortGloss: "let's work", imageable: false, kind: verb-form, derivedFrom: はたらく, verbClass: u }
  - { kana: がんばろう, romaji: ganbarou, gloss: "let's do our best (volitional of がんばる)", shortGloss: "let's do our best", imageable: false, kind: verb-form, derivedFrom: がんばる, verbClass: u }
  - { kana: さがそう, romaji: sagasou, gloss: "let's look for it (volitional of さがす)", shortGloss: "let's look", imageable: false, kind: verb-form, derivedFrom: さがす, verbClass: u }
  - { kana: たべよう, romaji: tabeyou, gloss: "let's eat (volitional of たべる)", shortGloss: "let's eat", imageable: false, kind: verb-form, derivedFrom: たべる, verbClass: ru }
  - { kana: みよう, romaji: miyou, gloss: "let's watch (volitional of みる)", shortGloss: "let's watch", imageable: false, kind: verb-form, derivedFrom: みる, verbClass: ru }
  - { kana: でよう, romaji: deyou, gloss: "let's leave (volitional of でる)", shortGloss: "let's leave", imageable: false, kind: verb-form, derivedFrom: でる, verbClass: ru }
  - { kana: はじめよう, romaji: hajimeyou, gloss: "let's start it (volitional of はじめる)", shortGloss: "let's start", imageable: false, kind: verb-form, derivedFrom: はじめる, verbClass: ru }
  - { kana: やめよう, romaji: yameyou, gloss: "let's quit (volitional of やめる)", shortGloss: "let's quit", imageable: false, kind: verb-form, derivedFrom: やめる, verbClass: ru }
  - { kana: しよう, romaji: shiyou, gloss: "let's do it (volitional of する)", shortGloss: "let's make", imageable: false, kind: verb-form, derivedFrom: する, verbClass: irregular }
  - { kana: こよう, romaji: koyou, gloss: "let's come (volitional of くる)", shortGloss: "let's come", imageable: false, kind: verb-form, derivedFrom: くる, verbClass: irregular }
  - { kana: あそぼう, romaji: asobou, gloss: "let's hang out (volitional of あそぶ)", shortGloss: "let's play", imageable: false, kind: verb-form, derivedFrom: あそぶ, verbClass: u }
  # ══ Time/discourse words the module's own sentences need. All three had
  #    future-stamped registry rows the sentences were silently leaning on
  #    (fromModuleDrift caught it) — m34 teaches them instead: らいねん
  #    completes the taught きょねん/ことし year set, また rides the L2 rule
  #    example, らいしゅう parallels taught せんしゅう.
  - { kana: また, romaji: mata, gloss: "again, once more", shortGloss: "again", imageable: false, kind: vocab }
  - { kana: らいねん, romaji: rainen, gloss: "next year", shortGloss: "next year", imageable: false, kind: vocab }
  - { kana: らいしゅう, romaji: raishuu, gloss: "next week", shortGloss: "next week", imageable: false, kind: vocab }
  # ══ Non-volitional forms sentences need (register ONLY what beats use).
  - { kana: がんばります, romaji: ganbarimasu, gloss: "I'll do my best (polite)", shortGloss: "I'll do my best", imageable: false, kind: verb-form, derivedFrom: がんばる, verbClass: u }
  - { kana: おとした, romaji: otoshita, gloss: "dropped it (おとす, past)", shortGloss: "drop (past)", imageable: false, kind: verb-form, derivedFrom: おとす, verbClass: u }
  - { kana: おちた, romaji: ochita, gloss: "fell (おちる, past)", shortGloss: "fell (fall)", imageable: false, kind: verb-form, derivedFrom: おちる, verbClass: ru }
  # ══ TOKENIZER-HAZARD compounds (m33-prep §3 recurrence): the longest-match
  # tokenizer sees the whole course's vocabulary, not just what's taught by
  # m34 — にし (west, a FUTURE atom) swallows に+した and strands た; とし
  # (year) does the same to と+した. Registering the whole tail fixes every
  # ことにした / -ようとした surface in one place, and だったら (m32's tara on
  # the copula) was never registered anywhere upstream.
  - { kana: にした, romaji: nishita, gloss: "decided to (こと に する, past)", shortGloss: "decided to", imageable: false, kind: verb-form }
  - { kana: とした, romaji: toshita, gloss: "tried to (ようとする, past)", shortGloss: "tried to", imageable: false, kind: verb-form }
  - { kana: だったら, romaji: dattara, gloss: "if it is / if it was (copula, conditional)", shortGloss: "if it is", imageable: false, kind: verb-form }
  - { kana: つかわない, romaji: tsukawanai, gloss: "won't use, won't spend (つかう, negative)", shortGloss: "won't use", imageable: false, kind: verb-form, derivedFrom: つかう, verbClass: u }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m34-neo-1
    role: teaching
    title: "「のもう」 — the will behind ましょう"
    focus: "A u-verb's last sound slides to the o-row and takes う — and のみましょう turns out to have been のもう in polite dress all along"
    introduces: [のもう, いこう, かおう, けそう, だそう]
    beats:
      - { kind: rule, grammarPointId: volitional, variant: shape-u }
      - { kind: sentence, ja: "コーヒーを のもう。", en: "Let's have a coffee", exercises: [volitional, wo-object], mode: build }
      - { kind: particle-cloze, stem: "コーヒーを ", tail: "。", answer: "のもう", options: ["のもう", "のむう", "のみよう"], en: "Let's have a coffee", explanation: "the u-verb's last sound moves to the o-row and takes う: のむ → のもう. のむう bolts う onto the dictionary form without the slide; のみよう borrows the ru-verb's よう on the wrong stem." }
      - { kind: sentence, ja: "としょかんに いこう。", en: "Let's go to the library", exercises: [volitional, ni-location], mode: build }
