  - id: m34-neo-2
    role: teaching
    title: "「たべよう・しよう・こよう」 — the ru-verbs and the two you memorise"
    focus: "Drop る, add よう; する and くる are two words, not a rule — and now every verb you own can carry your will"
    introduces: [たべよう, みよう, でよう, はじめよう, しよう, こよう, また, らいしゅう]
    beats:
      - { kind: rule, grammarPointId: volitional, variant: ru-irregular }
      - { kind: sentence, ja: "ばんごはんを たべよう。", en: "Let's eat dinner", exercises: [volitional, wo-object], mode: build }
      - { kind: sentence, ja: "しゅくだいを はじめよう。", en: "Let's start the homework", exercises: [volitional, jidoushi-tadoushi], mode: build }
      - { kind: sentence, ja: "はやく うちを でよう。", en: "Let's leave the house early", exercises: [volitional, wo-object], mode: build }
      - { kind: sentence, ja: "あした また こよう。", en: "Let's come again tomorrow", exercises: [volitional], mode: listening }
      - { kind: particle-cloze, stem: "ばんごはんを ", tail: "。", answer: "たべよう", options: ["たべよう", "たべろう", "たべる"], en: "Let's eat dinner", explanation: "たべる drops る and takes よう — たべよう. たべろう treats it like a u-verb ending in べる and moves the wrong sound. たべる is only the dictionary form, with no will in it at all." }
      - { kind: sentence, ja: "へやの まどを あける。", en: "I open the room's window", exercises: [jidoushi-tadoushi, no-possession], mode: build }
      - { kind: sentence, ja: "りょうりを しよう。", en: "Let's cook", exercises: [volitional, wo-object], mode: build }
      - { kind: particle-cloze, stem: "りょうりを ", tail: "。", answer: "しよう", options: ["しよう", "すろう", "します"], en: "Let's cook", explanation: "する is irregular — its volitional しよう is a word to know, not a rule to apply. すろう wrongly treats する like a u-verb ending in す. します is the polite present, and it doesn't suggest anything." }
      - { kind: listening-comp, audio: "らいしゅう また こよう。", answer: "Let's come again next week", distractors: ["I came again last week", "Let's go there next week", "I won't come next week"], q: "What does this mean?", explanation: "こよう is くる's volitional — する and くる are the two irregulars, memorised as words rather than derived by rule." }
      - { kind: kanji, kana: まど, kanji: 窓, distractors: ["まと", "とう", "そう"], exercises: [jidoushi-tadoushi] }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "しゅくだいを はじめよう。", en: "Let's start the homework." }
          - { speaker: "Mika", ja: "その まえに、ばんごはんを たべよう。", en: "Before that, let's eat dinner." }
          - { speaker: "Ken", ja: "いいね。テレビを みよう。", en: "Sounds good. Let's watch TV." }
        questions:
          - { q: "What does Mika suggest doing before the homework?", options: ["Eating dinner", "Watching TV", "Buying a drink", "Coming back tomorrow"], answer: "Eating dinner" }
      - { kind: challenge, ja: "じかんが あるから、テレビを みて、りょうりを しよう。", en: "I've got time, so I'll watch TV and then cook", combines: [volitional, kara-because, te-form, wo-object], mode: build }
    reviewPool: [ばんごはん, しゅくだい, うち, あした, テレビ, へや, まど, りょうり]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m34-neo-3
    role: teaching
    title: "「いこう？」 — the plainest invitation there is"
    focus: "Flat, いこう is let's-go; risen, いこう？ invites — and ませんか/ましょうか are the same move up the register ladder you have owned since m24"
    introduces: [あそぼう]
    beats:
      - { kind: rule, grammarPointId: volitional, variant: invitation }
      - { kind: sentence, ja: "いっしょに えいがを みよう？", en: "Want to watch a film together?", exercises: [volitional, wo-object], mode: build }
      - { kind: sentence, ja: "こうえんで あそぼう？", en: "Want to hang out at the park?", exercises: [volitional, de-action], mode: build }
      - { kind: sentence, ja: "としょかんに いこう？", en: "Want to go to the library?", exercises: [volitional, ni-location], mode: build }
      - { kind: sentence, ja: "コーヒーを のもう？", en: "Want to have a coffee?", exercises: [volitional, wo-object], mode: build }
      - { kind: particle-cloze, stem: "せんせいに、いっしょに ", tail: "。", answer: "いきませんか", options: ["いきませんか", "いこう？", "いきます"], en: "Say to your teacher: Won't you come along?", explanation: "いこう？ is the bare invitation, friend-register. To your teacher, the same invitation climbs the ladder to いきませんか. いきます is only a statement — it doesn't invite anybody." }
      - { kind: sentence, ja: "ぷりんを たべよう？", en: "Want to eat pudding?", exercises: [volitional, wo-object], mode: listening }
      - { kind: listening-comp, audio: "いっしょに としょかんに いこう？", answer: "A friend, not a teacher", distractors: ["A teacher, not a friend", "Either — register doesn't show here", "A shop clerk you don't know"], q: "Who is this line addressed to?", explanation: "いこう？ is the bare volitional rising into a question — friend-register. A teacher would hear いきませんか instead." }
      - kind: sim
        scene: { emoji: "🎬", title: "Saturday plans", setting: "Ken wants to do something this weekend." }
        turns:
          - npc: { speaker: "Ken", ja: "どようびは ひま？", en: "Are you free on Saturday?" }
            goal: "You are — tell him, the way a friend would."
            reply: { mode: choice, options: ["うん、ひま。", "ううん、いそがしい。", "はい。"], answer: "うん、ひま。", alsoCorrect: ["はい。"] }
            replyGloss: "Yeah, I'm free."
            explanation: "To Ken, plain うん、ひま is the natural register — a bare はい works too, but with a friend the fuller casual answer is what actually gets said. ううん、いそがしい declines the whole Saturday."
          - npc: { speaker: "Ken", ja: "なにを する？", en: "What shall we do?" }
            goal: "Suggest watching a film together."
            reply: { mode: build, tiles: ["えいが", "を", "みよう", "たべよう", "いこう"], answer: "えいがを みよう。" }
            replyGloss: "Let's watch a film."
            explanation: "The suggestion lands on the volitional — みよう carries the let's. たべよう and いこう are real volitionals too, but they suggest the wrong activity."
          - npc: { speaker: "Ken", ja: "いいね。どこで みる？", en: "Nice. Where shall we watch it?" }
            goal: "Suggest your place."
            reply: { mode: build, tiles: ["うち", "で", "みよう", "に", "いえ"], answer: "うちで みよう。" }
            replyGloss: "Let's watch at my place."
            explanation: "Watching happens AT a place, so うち takes で. うちに would point motion toward home instead of naming where the action happens."
      - { kind: challenge, ja: "あした ひまだったら、いっしょに こうえんに いこう？", en: "If you're free tomorrow, want to go to the park together?", combines: [volitional, tara, ni-location], mode: build }
    reviewPool: [えいが, こうえん, どようび, ひま, うち, いっしょ, テレビ, おんがく]

