  - id: m34-neo-10
    role: teaching
    title: "「がんばろう」 — goals, and the polite room"
    focus: "もくひょう gets a bullseye, がんばる gets its volitional — and the same suggestion machine runs in polite dress when the audience calls for it"
    introduces: [もくひょう, がんばる, がんばろう, がんばります]
    beats:
      - { kind: sentence, ja: "ことしの もくひょうが ある。", en: "I have a goal this year", exercises: [no-possession, ga-existence], mode: build }
      - { kind: sentence, ja: "まいにち がんばる。", en: "I do my best every day", exercises: [dictionary-form], mode: build }
      - { kind: sentence, ja: "もくひょうが あるから、がんばろう。", en: "There's a goal, so let's do our best", exercises: [volitional, kara-because, ga-existence], mode: build }
      - { kind: sentence, ja: "まいにち あるくことにする。", en: "I've decided to walk every day", exercises: [koto-ni-suru], mode: build }
      - { kind: sentence, ja: "ちょきんすることにした。", en: "I decided to start saving", exercises: [koto-ni-suru], mode: build }
      - { kind: particle-cloze, stem: "ミカに「", tail: "」と いう。", answer: "がんばろう", options: ["がんばろう", "がんばります", "がんばる"], en: "Say to Mika: Let's do our best", explanation: "がんばろう is the bare will — right for a friend like Mika. がんばります is the same promise in polite dress, for せんせい. がんばる is only the bare dictionary form, with no suggestion in it at all." }
      - { kind: kanji, kana: まいにち, kanji: 毎日, distractors: ["まいび", "まえにち", "まいにつ"], exercises: [volitional] }
      # がんばります gets a REAL intro-capable exposure before the Tanaka sim
      # uses it as a reply tile (teach-first, inv 33 — a conversation is never
      # a first exposure, and cloze OPTIONS are scrubbed from the exposure scan).
      - { kind: listening-comp, audio: "らいげつも がんばります。", answer: "I'll do my best next month too", distractors: ["I did my best last month", "I won't do my best next month", "I'm doing my best today"], q: "What does this mean?", explanation: "がんばります is がんばる in polite dress — the promise of effort, aimed at someone you keep the layers on for.", exercises: [volitional] }
      - { kind: listening-comp, audio: "ちょきんすることにしたから、がんばろう。", answer: "I decided to start saving, so let's do our best", distractors: ["I decided to start saving, so I'll stop", "It's been decided that I'm saving", "I think I'll start saving"], exercises: [koto-ni-suru, kara-because] }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "ことしの もくひょうは？", en: "What's your goal this year?" }
          - { speaker: "Tom", ja: "ちょきんすることにした。ケンは？", en: "I decided to start saving. What about you, Ken?" }
          - { speaker: "Ken", ja: "だいがくを そつぎょうすることになった。がんばろう！", en: "It's been decided that I'm graduating from university. Let's do our best!" }
        questions:
          - { q: "What did Ken say has been decided?", options: ["He's graduating from university", "He's getting married", "He's quitting his job", "He's moving to America"], answer: "He's graduating from university" }
      - kind: sim
        scene: { emoji: "📚", title: "After class", setting: "Tanaka-sensei is talking with you about next month's classes." }
        turns:
          - npc: { speaker: "Tanaka", ja: "らいげつの じゅぎょうは むずかしいですよ。", en: "Next month's classes are difficult, you know." }
            goal: "Tell your teacher you'll do your best."
            reply: { mode: build, tiles: ["がんばります", "がんばろう", "です", "は"], answer: "がんばります。" }
            replyGloss: "I'll do my best."
            explanation: "To your teacher, the effort-promise wears its polite dress: がんばります. がんばろう is the same word with the layers off — right for Ken, not for せんせい."
          - npc: { speaker: "Tanaka", ja: "まいにち れんしゅうを しましょうか。", en: "Shall we practise every day?" }
            goal: "Agree — let's do that, politely."
            reply: { mode: choice, options: ["はい、しましょう。", "うん、しよう。", "いいえ、しません。"], answer: "はい、しましょう。" }
            replyGloss: "Yes, let's."
            explanation: "しましょう is しよう in polite dress — the register ladder from L1, lived. うん、しよう would be the friend-register half aimed at a teacher; しません declines outright."
      - { kind: challenge, ja: "ことしの もくひょうは むずかしいけど、まいにち れんしゅうして がんばろう。", en: "This year's goal is difficult, but let's practise every day and keep at it", combines: [volitional, kedo, te-form, wa-topic], mode: build }
    reviewPool: [もくひょう, れんしゅう, まいにち, じゅぎょう, ことし, ちょきん, ゆめ]

