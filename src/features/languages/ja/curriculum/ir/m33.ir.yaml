      - { kind: sentence, ja: "でんきが きえる。", en: "The light goes out", exercises: [jidoushi-tadoushi, ga-existence], mode: build }
      - { kind: particle-cloze, stem: "テレビを ", tail: "。", answer: "けす", options: ["けす", "きえる", "とめる"], en: "I turn the television off", explanation: "を says somebody is doing it, so the verb has to be the を-half, けす. きえる is the same event with nobody named, and it takes が. とめる takes を too — the English says turn off, not stop." }
      - { kind: sentence, ja: "テレビを けす。", en: "I turn the television off", exercises: [jidoushi-tadoushi, wo-object], mode: build }
      - { kind: listening-comp, audio: "でんきが きえる。", answer: "The light goes out", distractors: ["I turn the light off", "The light comes on", "Please turn the light off"], exercises: [jidoushi-tadoushi] }
      - { kind: sentence, ja: "きょうしつの でんきが きえる。", en: "The classroom light goes out", exercises: [jidoushi-tadoushi, no-possession], mode: build }
      - { kind: particle-cloze, stem: "でんきが ", tail: "。", answer: "きえる", options: ["きえる", "けす", "しまる"], en: "The light goes out", explanation: "が is the tell: nothing is being done to でんき, so the verb has to be the が-half, きえる. けす needs somebody doing it, and that comes with を." }
      - { kind: sentence, ja: "でんきを けして ください。", en: "Please turn the light off", exercises: [te-kudasai, wo-object], mode: build }
      - { kind: kanji, kana: おと, kanji: 音, distractors: ["おど", "おん", "ね"], exercises: [jidoushi-tadoushi] }
      - { kind: sentence, ja: "おとを けす。", en: "I turn the sound off", exercises: [jidoushi-tadoushi, wo-object], mode: build }
      - { kind: listening-comp, audio: "テレビを けして ください。", answer: "Please turn the television off", distractors: ["Please turn the television on", "The television goes off", "I turn the television off"], exercises: [te-kudasai, jidoushi-tadoushi] }
      - { kind: sentence, ja: "ミカが きょうしつの でんきを けす。", en: "Mika turns the classroom light off", exercises: [jidoushi-tadoushi, wo-object, no-possession], mode: build }
      - { kind: particle-cloze, stem: "きょうしつの でんきを ", tail: "。", answer: "けす", options: ["けす", "きえる", "しめる"], en: "I turn the classroom light off", explanation: "を says somebody is doing it, so the verb has to be the を-half, けす. きえる is the same event with nobody named, and it takes が." }
      - { kind: sentence, ja: "テレビが うるさいから、おとを けす。", en: "The television is noisy, so I'll turn the sound off", exercises: [kara-because, wo-object, i-adj-present], mode: listening }
      - { kind: sentence, ja: "ボタンを おすと、でんきが きえる。", en: "If you press the button, the light goes out", exercises: [to-conditional, jidoushi-tadoushi], mode: translate }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "でんきを けす？", en: "Shall I turn the light off?" }
          - { speaker: "Tom", ja: "うん。テレビも けして。", en: "Yeah. Turn the TV off too." }
          - { speaker: "Mika", ja: "でんきが きえる。しずかだね。", en: "The light's going out. It's quiet, isn't it." }
