  - id: m33-neo-9
    role: teaching
    title: "「ドアが あいている」 — the state a change left behind"
    focus: "m14's unfinished half: 自動詞 + ている is not an action in progress, it is how the thing is NOW"
    introduces: [あいて, しまって, はいって, きえて]
    beats:
      # NO new verbs. Six pairs are already on the table and the lesson's
      # whole content is what ている does to the が-half of them. ている is not
      # registered as an atom (m14's standing decision) — the four te-forms
      # are, because they do not tokenize on their own.
      - { kind: rule, grammarPointId: te-iru-resultative, variant: state }
      - { kind: sentence, ja: "ドアが あいている。", en: "The door is open", exercises: [te-iru-resultative, te-iru], mode: build }
      - { kind: sentence, ja: "まどが しまっている。", en: "The window is shut", exercises: [te-iru-resultative, te-iru], mode: build }
      - { kind: listening-comp, audio: "ドアが あいている。", answer: "The door is open", distractors: ["The door opens", "I am opening the door", "I open the door"], exercises: [te-iru-resultative] }
      - { kind: sentence, ja: "みせが しまっている。", en: "The shop is closed", exercises: [te-iru-resultative, te-iru], mode: build }
      - { kind: particle-cloze, stem: "まどが ", tail: "いる。", answer: "あいて", options: ["あいて", "あけて", "しまって"], en: "The window is open", explanation: "ている does not change which particle the verb takes. が says the window came open with nobody named, so the が-half is what goes inside ている: あいて いる. あけて いる would be somebody in the middle of opening it. しまって いる would also follow が — the English says open, not closed." }
      - { kind: sentence, ja: "ドアが あいているから、さむい。", en: "The door is open, so it's cold", exercises: [te-iru-resultative, kara-because], mode: build }
      - { kind: sentence, ja: "かばんに かぎが はいっている。", en: "The key is in the bag", exercises: [te-iru-resultative, ni-location], mode: listening }
      - { kind: kanji, kana: いえ, kanji: 家, distractors: ["いへ", "うち", "か"], exercises: [te-iru-resultative] }
      - { kind: listening-comp, audio: "みせが しまっている。", answer: "The shop is closed", distractors: ["The shop closes", "The shop is closing now", "I close the shop"], exercises: [te-iru-resultative] }
      - { kind: sentence, ja: "きょうしつの でんきが きえている。", en: "The classroom light is off", exercises: [te-iru-resultative, no-possession], mode: build }
      - { kind: sentence, ja: "ひきだしが あいている。", en: "The drawer is open", exercises: [te-iru-resultative, te-iru], mode: build }
      - { kind: particle-cloze, stem: "でんきが ", tail: "いる。", answer: "きえて", options: ["きえて", "けして", "しまって"], en: "The light is off", explanation: "きえる is the が-half and stays the が-half inside ている. けして いる would be somebody standing there switching it off; きえて いる is simply how the light is now." }
      - { kind: sentence, ja: "ミカは いえに はいっている。", en: "Mika is inside the house", exercises: [te-iru-resultative, ni-location, wa-topic], mode: build }
      - { kind: sentence, ja: "テレビが きえているから、しずかだ。", en: "The television is off, so it's quiet", exercises: [te-iru-resultative, kara-because], mode: build }
      - { kind: listening-comp, audio: "かばんに かぎが はいっている。", answer: "The key is in the bag", distractors: ["I put the key in the bag", "The key goes in the bag", "The bag is in the drawer"], exercises: [te-iru-resultative, ni-location] }
      - { kind: sentence, ja: "エレベーターの ドアが あいている。", en: "The lift doors are open", exercises: [te-iru-resultative, no-possession], mode: translate }
      - kind: dialogue
        lines:
          - { speaker: "Tom", ja: "さむいね。", en: "It's cold, isn't it." }
          - { speaker: "Mika", ja: "ドアが あいている。", en: "The door's open." }
          - { speaker: "Tom", ja: "まども あいている。", en: "The window's open too." }
          - { speaker: "Mika", ja: "さむいから、しめて。", en: "It's cold, so shut them." }
        questions:
          - { q: "What does Mika's first line tell you?", options: ["That the door is open now", "That somebody is opening the door right now", "That Mika opened the door", "That the door will open"], answer: "That the door is open now" }
      - { kind: challenge, ja: "きょうしつに はいったら、まどが あいている。", en: "When I get into the classroom, the window is open", combines: [tara, te-iru-resultative, jidoushi-tadoushi, ni-location], mode: build }
    reviewPool: [ドア, まど, みせ, ひきだし, でんき, テレビ, かばん, かぎ, いえ, エレベーター]

