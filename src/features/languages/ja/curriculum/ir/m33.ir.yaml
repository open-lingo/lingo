      - { kind: sentence, ja: "たなかさんが かいぎの じかんを きめる。", en: "Mr Tanaka decides the time of the meeting", exercises: [jidoushi-tadoushi, wo-object], mode: build }
      - { kind: sentence, ja: "エレベーターの ドアが あく。", en: "The lift doors open", exercises: [jidoushi-tadoushi, no-possession], mode: listening }
