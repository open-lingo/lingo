  - id: m33-neo-11
    role: teaching
    title: "「でんしゃが でる」「さいふが おちる」 — the last two, at a glance"
    focus: "Two pairs met together at recognition weight; the rule is doing the work by now, and m34 gives them their second rep"
    introduces: [でる, だす, だして, おちる, おとす]
    beats:
      # BLOCK C, LESSON 2 OF 2. Two pairs in one lesson is deliberate and is
      # the whole point of a glance: the learner is not being taught anything
      # new, only shown two more places the same rule lands. No rule card —
      # L10's `glance` card already named all three pairs.
      - { kind: sentence, ja: "でんしゃが でる。", en: "The train leaves", exercises: [jidoushi-tadoushi, ga-existence], mode: build }
      - { kind: sentence, ja: "かばんから ほんを だす。", en: "I take a book out of my bag", exercises: [jidoushi-tadoushi, kara-origin], mode: build }
      - { kind: particle-cloze, stem: "でんしゃが ", tail: "。", answer: "でる", options: ["でる", "だす", "はいる"], en: "The train leaves", explanation: "が is the tell: nothing is being done to でんしゃ, so the verb has to be the が-half, でる. だす needs somebody doing it, and that comes with を. はいる would also follow が — the English says leaves, not comes in." }
      - { kind: sentence, ja: "さいふが おちる。", en: "The wallet falls", exercises: [jidoushi-tadoushi, ga-existence], mode: build }
      - { kind: listening-comp, audio: "かばんから ほんを だす。", answer: "I take a book out of my bag", distractors: ["A book comes out of my bag", "I put a book in my bag", "The book is in my bag"], exercises: [jidoushi-tadoushi, kara-origin] }
      - { kind: sentence, ja: "かぎを おとす。", en: "I drop the key", exercises: [jidoushi-tadoushi, wo-object], mode: build }
      - { kind: particle-cloze, stem: "さいふを ", tail: "。", answer: "おとす", options: ["おとす", "おちる", "だす"], en: "I drop my wallet", explanation: "を says somebody is doing it, so the verb has to be the を-half, おとす. おちる is the same event with nobody named, and it takes が. だす takes を too — the English says drop, not take out." }
      - { kind: sentence, ja: "ひきだしから てがみを だす。", en: "I take a letter out of the drawer", exercises: [jidoushi-tadoushi, kara-origin], mode: build }
      - { kind: kanji, kana: てがみ, kanji: 手紙, distractors: ["てかみ", "てし", "しゅし"], exercises: [jidoushi-tadoushi] }
      - { kind: sentence, ja: "でんしゃは じゅうじに でる。", en: "The train leaves at ten", exercises: [jidoushi-tadoushi, ni-time, wa-topic], mode: listening }
      - { kind: listening-comp, audio: "さいふが おちる。", answer: "The wallet falls", distractors: ["I drop my wallet", "The wallet is in the bag", "I take my wallet out"], exercises: [jidoushi-tadoushi] }
      - { kind: sentence, ja: "かばんから さいふを だして ください。", en: "Please take your wallet out of your bag", exercises: [te-kudasai, kara-origin], mode: build }
      - { kind: sentence, ja: "ミカが きょうしつを でる。", en: "Mika leaves the classroom", exercises: [jidoushi-tadoushi, wo-object], mode: build }
      - { kind: particle-cloze, stem: "ほんが ", tail: "。", answer: "おちる", options: ["おちる", "おとす", "でる"], en: "The book falls", explanation: "が is the tell: nothing is being done to ほん, so the verb has to be the が-half, おちる. おとす needs somebody doing it, and that comes with を. でる would also follow が — the English says falls, not comes out." }
      - { kind: sentence, ja: "つくえから ほんが おちる。", en: "The book falls off the desk", exercises: [jidoushi-tadoushi, kara-origin], mode: build }
      - { kind: sentence, ja: "えきで でんしゃが とまる。", en: "The train stops at the station", exercises: [de-action, jidoushi-tadoushi], mode: translate, alsoAccept: ["でんしゃは えきに とまる。"] }
      - kind: dialogue
        lines:
          - { speaker: "Tom", ja: "さいふが ない。", en: "My wallet's gone." }
          - { speaker: "Mika", ja: "ひきだしを あける？", en: "Shall I open the drawer?" }
          - { speaker: "Tom", ja: "うん。", en: "Yeah." }
          - { speaker: "Mika", ja: "さいふが はいっている。", en: "Your wallet's in there." }
        questions:
          - { q: "Where is the wallet?", options: ["In the drawer", "On the train", "In the bag", "Mika does not say"], answer: "In the drawer" }
      - { kind: challenge, ja: "でんしゃが でる まえに、かばんから きっぷを だして ください。", en: "Before the train leaves, please take your ticket out of your bag", combines: [mae-ni, te-kudasai, jidoushi-tadoushi, kara-origin], mode: build }
    reviewPool: [でんしゃ, さいふ, かばん, ほん, てがみ, ひきだし, かぎ, つくえ, きょうしつ, えき]

