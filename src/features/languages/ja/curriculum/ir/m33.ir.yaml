  - id: m33-neo-6
    role: teaching
    title: "「じかんが きまる」と「じかんを きめる」 — settled, by nobody in particular"
    focus: "The が-verb as the way Japanese says a thing happened without naming who did it — the instinct behind the passive, met early and cheaply"
    introduces: [きまる, かいぎ, テスト]
    beats:
      # かいぎ is the image debut and the rule card does not name it. The card
      # argues from じかん and りょこう, both long owned.
      - { kind: rule, grammarPointId: jidoushi-tadoushi, variant: decision }
      - { kind: sentence, ja: "じかんが きまる。", en: "The time is settled", exercises: [jidoushi-tadoushi, ga-existence], mode: build }
      - { kind: sentence, ja: "じかんを きめる。", en: "I decide the time", exercises: [jidoushi-tadoushi, wo-object], mode: build }
      - { kind: particle-cloze, stem: "りょこうが ", tail: "。", answer: "きまる", options: ["きまる", "きめる", "おわる"], en: "The trip is settled", explanation: "が is the tell: nothing is being done to りょこう, so the verb has to be the が-half, きまる. きめる needs somebody doing it, and that comes with を. おわる would also follow が — the English says settled, not over." }
      - { kind: sentence, ja: "かいぎの じかんが きまる。", en: "The time of the meeting is settled", exercises: [jidoushi-tadoushi, no-possession], mode: build }
      - { kind: listening-comp, audio: "じかんが きまる。", answer: "The time is settled", distractors: ["I decide the time", "I ask the time", "The time is late"], exercises: [jidoushi-tadoushi] }
      - { kind: sentence, ja: "ミカが みせを きめる。", en: "Mika decides on the shop", exercises: [jidoushi-tadoushi, wo-object], mode: build }
      - { kind: particle-cloze, stem: "かいぎの じかんを ", tail: "。", answer: "きめる", options: ["きめる", "きまる", "とめる"], en: "I decide the time of the meeting", explanation: "を says somebody is doing it, so the verb has to be the を-half, きめる. きまる is the same event with nobody named, and it takes が." }
      - { kind: sentence, ja: "あした テストの じかんが きまる。", en: "The time of the test will be settled tomorrow", exercises: [jidoushi-tadoushi, no-possession], mode: listening }
      - { kind: kanji, kana: かいしゃ, kanji: 会社, distractors: ["かいしゃく", "かいしゅ", "がいしゃ"], exercises: [jidoushi-tadoushi] }
      - { kind: sentence, ja: "かいしゃで かいぎの じかんを きめる。", en: "We decide the time of the meeting at the company", exercises: [jidoushi-tadoushi, wo-object, de-action], mode: build }
      - { kind: listening-comp, audio: "ミカが みせを きめる。", answer: "Mika decides on the shop", distractors: ["The shop is decided", "Mika closes the shop", "Mika asks about the shop"], exercises: [jidoushi-tadoushi, wo-object] }
      - { kind: sentence, ja: "ともだちが りょこうを きめる。", en: "My friend decides on the trip", exercises: [jidoushi-tadoushi, wo-object], mode: build }
      - { kind: sentence, ja: "かいぎは さんじに おわる。", en: "The meeting finishes at three", exercises: [ni-time, wa-topic], mode: build }
      - { kind: particle-cloze, stem: "りょこうを ", tail: "。", answer: "きめる", options: ["きめる", "きまる", "きく"], en: "I decide on the trip", explanation: "を says somebody is doing it, so the verb has to be the を-half, きめる. きまる is the same event with nobody named, and it takes が." }
      - { kind: sentence, ja: "たなかさんが かいぎの じかんを きめる。", en: "Mr Tanaka decides the time of the meeting", exercises: [jidoushi-tadoushi, wo-object], mode: translate }
      - kind: dialogue
        lines:
          - { speaker: "Tanaka", ja: "かいぎの じかんは きまる？", en: "Is the meeting time getting settled?" }
          - { speaker: "Mika", ja: "うん、あした きまる。", en: "Yeah, it'll be settled tomorrow." }
          - { speaker: "Tanaka", ja: "だれが きめる？", en: "Who decides?" }
          - { speaker: "Mika", ja: "たなかさんが きめる。", en: "You do." }
        questions:
          - { q: "Why does Tanaka switch from きまる to きめる?", options: ["Because the question is now about WHO does it", "Because きまる is past tense", "Because the meeting changed", "Because きめる is politer"], answer: "Because the question is now about WHO does it" }
      - { kind: challenge, ja: "あした かいぎの じかんが きまるから、でんわを して ください。", en: "The meeting time will be settled tomorrow, so please call", combines: [kara-because, te-kudasai, jidoushi-tadoushi, no-possession], mode: build }
    reviewPool: [かいぎ, じかん, りょこう, テスト, かいしゃ, みせ, きめる, たなか, あした, ともだち]

