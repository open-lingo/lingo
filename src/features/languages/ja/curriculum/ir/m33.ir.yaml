      - { kind: sentence, ja: "たなかさんが かいぎを はじめる。", en: "Mr Tanaka starts the meeting", exercises: [jidoushi-tadoushi, wo-object], mode: build }
      - { kind: particle-cloze, stem: "じゅぎょうを ", tail: "。", answer: "はじめる", options: ["はじめる", "はじまる", "きめる"], en: "I start the class", explanation: "を says somebody is doing it, so the verb has to be the を-half, はじめる. はじまる is the same event with nobody named, and it takes が." }
