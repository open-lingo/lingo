notes: |
  m33 = n4-04, the FOURTH module of the N4 tier. `docs/spine-n4.md` §`n4-04`
  is the source of truth, and this module deviates from it in three recorded
  places (pair set, vocabulary count, and one dropped word) — see DEVIATIONS.

  THE PAYLOAD — three facts, nine pairs, and a particle that does the work.

  1. **Every Japanese verb is one or the other.** A verb either describes
     something happening (自動詞) or somebody doing it (他動詞). There is no
     third box, and no verb sits in both.
  2. **A "pair" is TWO DIFFERENT VERBS, not a conjugation.** This is the one
     the learner has to be told outright, because あく and あける look like
     inflections of each other and are not. Nothing is derived from anything;
     they are two entries in the dictionary that happen to be about the same
     event seen from two sides.
  3. **The PARTICLE is the tell, and it is mechanical.** 自動詞 takes が,
     他動詞 takes を. ドアが あく / ドアを あける. That is the whole diagnostic,
     and it is why the module is drillable at all: the learner is never asked
     to feel a difference, only to read one off the sentence.

  SHAPE — 14 lessons = 10 teaching + 3 review + 1 challenge, reviews at
  4/8/12, a nine-pair diagnostic at L13 and the challenge LAST (inv 25). The
  extra teaching lesson over m32's 13 is the resultative (L9), which the spine
  asks for as a beat and which is really a second grammar point riding a
  module that already has one — it earns its own slot rather than being
  crammed into a pair lesson. NO katakana rows (that programme ended at m11),
  NO `kind: register` beats (m10 + m29 only), NO scene (see DEVIATIONS).

  THE PAIR SET, AND WHY IT IS SPLIT IN THREE (Spencer 2026-08-19).
  The spine names six pairs. Spencer's instruction was to teach as many as sit
  comfortably, split well, and give the last three a lighter pass that the NEXT
  module re-cements in sentence examples. So: NINE pairs, in three blocks.

  | block | lessons | pairs | anchor already taught |
  |---|---|---|---|
  | A — the rule | L1–L3 (R at L4) | あく/あける · しまる/しめる · はいる/いれる | あける m14 · しめる m14 · はいる m16 |
  | B — the drill | L5–L7 (R at L8) | とまる/とめる · きまる/きめる · きえる/けす | とまる m32 · きめる m30 · — |
  | — the payoff | L9 | (no new pair) 自動詞 + ている = resultative | m14's unfinished half |
  | C — the glance | L10–L11 (R at L12) | はじまる/はじめる · でる/だす · おちる/おとす | — |
  | the assessment | L13 | all nine, mixed, no new words | |

  Blocks A and B are TAUGHT: rule card, both particles drilled, resultative,
  review. Block C is GLANCED — each pair gets one lesson at recognition weight
  (a rule card that names all three at once, builds, one listening comp, no
  new resultative work) and is then RE-CEMENTED IN m34's sentence examples,
  which is where Spencer wants the second rep to land. m34 is the volitional
  module and is by design a breather with no heavy new machinery, so it has
  the budget: 「えいがが はじまる まえに、でんきを けそう」 costs m34 nothing and
  buys block C its spacing.

  Five of the nine pairs arrive with a half the learner already owns, which is
  the point of choosing them: the new word is HALF a pair, not a whole one, and
  the lesson can spend its attention on the particle instead of on vocabulary.
  That is also why the module ships ~23 new atoms against the spine's 32 — the
  spine's own risk note says the fix for this module is FEWER things, not more
  explanation, and the carrier nouns it lists (でんき, かぎ, きょうしつ, おと,
  まど, ドア, くるま, でんしゃ) are already taught, so the budget did not need
  spending twice.

  DEVIATIONS + DECISIONS, per the RUN-PLAN "decide and document" rule:

  - **TWO INVENTED GRAMMAR-POINT IDS — `jidoushi-tadoushi` and
    `te-iru-resultative` — BECAUSE THE N4 TIER STILL HAS NO REGISTRY.** m30,
    m31 and m32 each recorded this as an outstanding tier prerequisite and it
    has still not landed; `n5-grammar-points.json` holds 103 points and not one
    is an N4 item. `te-iru-resultative` is deliberately NOT named `te-iru`:
    `te-iru` is a shipped N5 point (m14) and a learner meeting both ids in one
    deck would be told the resultative and the progressive are the same rule,
    which is the exact confusion m14 spent a module separating.

  - **つく / つける IS DROPPED, and this upholds m32's ruling rather than
    overriding it.** The spine's `must` list names the pair. m32 recorded that
    it teaches つく as 着く ("to arrive", 🛬, m23) and that m33 should therefore
    not build on it. That reasoning survives inspection: 点く is a different
    verb wearing the same kana, and introducing a homograph split inside the
    tier's highest-attrition module is carrying two axes at once. The
    consequence is that m33 can turn a light OFF (でんきを けす) and watch one go
    out (でんきが きえる) but cannot turn one on. That is an accepted hole, not
    an oversight: it is one verb, it is recorded here, and it belongs in a
    module that can afford to separate 着く from 点く.

  - **エアコン AND スイッチ ARE DROPPED from the spine's `prefer` list.** Both
    exist only to serve つく/つける. With that pair gone they are two katakana
    nouns with no grammar attached, in a module whose stated failure mode is
    carrying too much. でんき and テレビ carry the same sentences and are owned.

  - **きゅうに STAYS DROPPED.** m32 dropped it because the course teaches きゅう
    as 九 ("nine", m9) and 「きゅうに とまる」 reads as "stops at nine o'clock" to
    a learner whose only きゅう is the numeral. Nothing about m33 changes that.

  - **きまる / きめる IS ADOPTED IN PLACE OF A SPINE PAIR, and it pays a debt.**
    きめる is taught at m30 and is one of the 25 atoms in the whole course that
    are graded exactly ONCE — a shape D2 blocks from writing to FSRS, so it
    reaches the deck by D4 seeding and is never asked again in authored
    content. A later module drilling it is precisely what turns that from debt
    into coverage, and きまる/きめる is a genuine, high-frequency pair whose
    transitive half costs nothing. m30's other three once-graded words
    (しらべる, つづける, おくる) ride this module's review pools for the same
    reason.

  - **NO SCENE, and the reason is specific.** m33 looks like it wants one, and
    the shape it wants is real: the same object, drawn twice, once with an
    agent arrow and を and once without and が. None of the five shipped scene
    kinds draws that. `transfer` is the near miss and it is a trap — it is
    hardwired to two PEOPLE either side of an うち/そと boundary, and reusing it
    would tell the learner that transitivity is about something moving between
    two parties, which is the wrong fact and an expensive one to unlearn
    before m40's passive. Recorded as a genuine scene candidate ("agent
    frame"), not built here.

  - **EVERY PAIR VERB IS `imageable: false`, ON PURPOSE.** A `word_image_mcq`
    asks "which word is this picture?", and no picture distinguishes あく from
    あける: they describe the same visible event and differ only in whether a
    person is behind it. Shipping an image debut for either half would teach
    that the two are interchangeable — the single error this module exists to
    prevent. The image budget therefore goes where images are honest: the three
    new carrier nouns, each of which is a THING the pairs happen to —
    エレベーター 🛗, ひきだし 🗄️, かいぎ 📋. Three image debuts. Inv 44 sets no
    minimum for the type, precisely because its count is a function of what the
    module introduces, and this module's new words are overwhelmingly verbs
    whose pictures would lie.

    エレベーター is not a new word to the atom table — it carries a
    `courseAtoms` row tagged m16 and appears in NO lesson in any module. It is
    one of the ~116 orphans R16 covers, and teaching it here discharges one of
    them rather than adding to the pile. 「エレベーターの ドアが あく」 is also
    the single most everyday あく sentence in the language.

  - **`particle_cloze` IS THE MODULE'S SIGNATURE STEP AND THAT IS LEGAL.**
    Inv 5 allows it in the lesson that introduces the point and in same-module
    reviews. が-or-を IS the point here, so the cloze is not a cheap tap — it is
    the assessment the spine asks for ("given a sentence, which verb? given a
    verb, which particle?"). Per inv 5 it still THINS OUT: heavy in L1–L2,
    present in the block B lessons, and by block C the diagnostic is carried by
    builds where the learner produces the particle instead of picking it.

  - **NO NEGATIVES, NO PAST FORMS, AND NO たら OF THE MODULE'S OWN VERBS.**
    Carried straight from m32's hazard list: an unregistered inflection of a
    brand-new verb does not tokenize (おして → お + して), and しまった collides
    with てしまう besides. Every module-new verb appears in dictionary form, or
    in a て-form that is registered here as its own atom. Older verbs conjugate
    freely.


grammarPoints:
  # NOTE ON RULE-CARD VOCABULARY (inherited from m32, and it bites harder here).
  # A `kind: rule` beat compiles to a PINNED step, so any word a card names has
  # already "appeared" before that lesson's picture MCQ can run — which breaks
  # the image-debut invariant for that word (inv 30). Every card below is
  # therefore written against words already met AT THE LESSON IT SITS IN, and
  # in particular no card names エレベーター, ひきだし or かいぎ, the module's
  # three image debuts. The constraint is easy to satisfy here because the
  # cards argue from ドア and まど, which the learner has owned since m8.

  - id: jidoushi-tadoushi
    variant: shape
    rule: "Japanese verbs come in two kinds. Some describe something HAPPENING — the door opens. Others describe somebody DOING it — I open the door. English uses \"open\" for both; Japanese uses two verbs. あく is the door opening, あける is you opening it. They are not two forms of one word — they are separate entries about the same event from two sides, the way English has \"rise\" and \"raise\". And the particle in front always tells you which: the happening verb takes が, the doing verb takes を. ドアが あく。 ドアを あける。"
    examples:
      - { ja: "ドアが あく。", en: "The door opens." }
      - { ja: "ドアを あける。", en: "I open the door." }
      - { ja: "まどが あく。", en: "The window opens." }
      - { ja: "まどを あける。", en: "I open the window." }
      - { ja: "ミカが ドアを あける。", en: "Mika opens the door." }
    antiPattern: { ja: "ドアを あく。", why: "あく is the door opening by itself, so nobody is doing anything to it and を has no job — が is the only particle it takes: ドアが あく。" }

  - id: jidoushi-tadoushi
    variant: diagnostic
    rule: "The second pair, same shape: しまる is the door closing, しめる is you closing it. There is nothing to memorise about which is which — you read it off the sentence. Find the noun in front of the verb and look at its particle. が means it happened. を means somebody did it. It works in both directions: given 「まどが しまる」 you know nobody closed it, and to say \"I closed the window\" you know you need を, and therefore しめる. Learners who struggle with pairs are trying to FEEL the difference. Do not feel it. Read the particle."
    examples:
      - { ja: "ドアが しまる。", en: "The door closes." }
      - { ja: "ドアを しめる。", en: "I close the door." }
      - { ja: "まどが しまる。", en: "The window closes." }
      - { ja: "まどを しめる。", en: "I close the window." }
      - { ja: "ミカが まどを しめる。", en: "Mika closes the window." }
    antiPattern: { ja: "まどが しめる。", why: "しめる needs somebody doing the closing, and が says nobody is — either say 「まどが しまる」 (it closes) or 「まどを しめる」 (I close it)." }

  - id: jidoushi-tadoushi
    variant: containers
    rule: "The third pair, and the last one you get half of free. はいる you have had since module 16 — 「へやに はいる」, I go into the room. いれる is the other side of it, putting a thing in: 「かばんに ほんを いれる」. Watch what the particles do. With はいる the thing that moves takes が, and where it goes takes に. With いれる the thing that moves takes を, because somebody is moving it, and where it goes still takes に. The に never changes. Only the が/を slot does, and it changes because a doer arrived."
    examples:
      - { ja: "かばんに ほんを いれる。", en: "I put a book in my bag." }
      - { ja: "へやに はいる。", en: "I go into the room." }
      - { ja: "かばんに かぎが はいる。", en: "The key goes in the bag." }
      - { ja: "ミカが かばんに さいふを いれる。", en: "Mika puts her wallet in her bag." }
      - { ja: "へやに おおきい つくえが はいる。", en: "A big desk goes in the room." }
    antiPattern: { ja: "かばんに ほんが いれる。", why: "いれる needs somebody doing the putting, and が does not supply one — the book being put takes を: かばんに ほんを いれる。" }

  - id: te-iru-resultative
    variant: state
    rule: "Here is the payoff — the piece module 14 could not finish. ている has two readings: an action still running (たべている, is eating) and a state left behind by a change (しっている, knows). Module 14 could not say WHICH verbs do which, because the answer is what you just learned. A 自動詞 + ている is almost always the second kind: the change already happened, and you are describing how the thing is NOW. 「ドアが あいている」 is not a door in the act of opening — it is a door that is open. Same with 「まどが しまっている」: the window is shut."
    examples:
      - { ja: "ドアが あいている。", en: "The door is open." }
      - { ja: "まどが しまっている。", en: "The window is shut." }
      - { ja: "ドアが あいて いるから、さむい。", en: "The door is open, so it's cold." }
      - { ja: "きょうしつの まどが あいている。", en: "The classroom window is open." }
      - { ja: "みせが しまっている。", en: "The shop is closed." }
    antiPattern: { ja: "ドアを あけている。", why: "that IS good Japanese, but it means somebody is in the middle of opening the door — the を-verb keeps its doer. For the STATE of a door that is already open you need the が-verb: ドアが あいている。" }

  - id: jidoushi-tadoushi
    variant: movement
    rule: "Two pairs about stopping, both half-owned already. とまる you met last module — 「でんしゃが とまる」, the train comes to a halt. Its partner とめる is what a driver does: 「くるまを とめる」, I stop the car. Same が/を tell, no new machinery. Worth noticing: the pair is asymmetric in real life. Trains stop by themselves constantly and cars almost never do, so とまる turns up with trains and machines, とめる with cars and people. That is not a rule to learn — it falls out of what the verbs mean."
    examples:
      - { ja: "でんしゃが とまる。", en: "The train stops." }
      - { ja: "くるまを とめる。", en: "I stop the car." }
      - { ja: "きかいが とまる。", en: "The machine stops." }
      - { ja: "みせの まえに くるまを とめる。", en: "I park the car in front of the shop." }
      - { ja: "バスが えきに とまる。", en: "The bus stops at the station." }
    antiPattern: { ja: "でんしゃを とまる。", why: "とまる is the train stopping on its own, so it takes が — 「でんしゃが とまる」. を would need a doer, and for that you want とめる, which is what the driver does." }

  - id: jidoushi-tadoushi
    variant: decision
    rule: "きめる you have owned since module 30: I decide. Its partner きまる has no clean English word — it means the thing got decided, without saying by whom. 「じかんが きまる」 is \"the time is settled\". Japanese reaches for this constantly where English would use a passive, and it is your first look at a habit that runs through the language: when who-did-it is not the point, Japanese puts no doer in the sentence at all. It just uses the が-verb."
    examples:
      - { ja: "じかんが きまる。", en: "The time is settled." }
      - { ja: "じかんを きめる。", en: "I decide the time." }
      - { ja: "りょこうが きまる。", en: "The trip is settled." }
      - { ja: "ミカが みせを きめる。", en: "Mika decides on the restaurant." }
      - { ja: "あした テストの じかんが きまる。", en: "The time of the test will be settled tomorrow." }
    antiPattern: { ja: "じかんを きまる。", why: "きまる is the time settling with nobody named, so it takes が — if you want to say YOU settled it, the verb is きめる: じかんを きめる。" }

  - id: jidoushi-tadoushi
    variant: switches
    rule: "The last taught pair, and the first where BOTH halves are new — the honest test of whether the rule has landed, because there is no familiar half to lean on. けす is what you do: 「でんきを けす」, turn the light off. きえる is what happens: 「でんきが きえる」, the light goes out. English changes the whole phrase — \"turn off\" versus \"go out\" — and Japanese changes only the verb and the particle. けす also covers a screen and a sound, so 「テレビを けす」 and 「おとを けす」 are both ordinary."
    examples:
      - { ja: "でんきを けす。", en: "I turn the light off." }
      - { ja: "でんきが きえる。", en: "The light goes out." }
      - { ja: "テレビを けす。", en: "I turn the television off." }
      - { ja: "きょうしつの でんきが きえる。", en: "The classroom light goes out." }
      - { ja: "ミカが テレビを けす。", en: "Mika turns the television off." }
    antiPattern: { ja: "でんきを きえる。", why: "きえる is the light going out on its own and takes が. If somebody is switching it off, the verb is けす: でんきを けす。" }

  - id: jidoushi-tadoushi
    variant: glance
    rule: "Three more pairs, and this time you are not being taught a rule — you already have it. You are being shown where else it turns up. はじまる / はじめる: it starts / I start it. でる / だす: it comes out / I take it out. おちる / おとす: it falls / I drop it. Read each against its particle and every one behaves exactly like あく / あける. That is the point of meeting them together and quickly: nine pairs in, the pattern should be doing the work, not your memory. You will use all three again next module."
    examples:
      - { ja: "えいがが はじまる。", en: "The film starts." }
      - { ja: "えいがを はじめる。", en: "I start the film." }
      - { ja: "でんしゃが でる。", en: "The train leaves." }
      - { ja: "かばんから ほんを だす。", en: "I take a book out of my bag." }
      - { ja: "さいふが おちる。", en: "The wallet falls." }
    antiPattern: { ja: "えいがを はじまる。", why: "はじまる is the film starting on its own — が. The を-verb is はじめる, which needs somebody to start it: えいがを はじめる。" }

newAtoms:
  # ══ R1 landing 2026-08-20: テスト is graded here but was never introduced
  #    anywhere (こうえん class). imageable:false — しゅくだい owns 📝.
  - { kana: テスト, romaji: tesuto, gloss: "test, exam", shortGloss: "test", imageable: false, kind: vocab }
  # ══ L1. One new verb, one new noun. あく is `imageable: false` for the
  #    reason in the notes: あく and あける are the same picture, and an image
  #    MCQ that could not tell them apart would teach the one error this
  #    module exists to prevent. エレベーター carries the lesson's image debut
  #    — it is a THING, so a picture can name it honestly, and its doors are
  #    the most everyday あく in the language.
  - { kana: あく, romaji: "aku", gloss: "to open (of itself), to come open", shortGloss: "open (it does)", imageable: false, kind: verb, verbClass: u }
  - { kana: エレベーター, romaji: "erebeetaa", gloss: "a lift, an elevator", shortGloss: "lift", imageable: true, kind: vocab }
  # ══ L2. ONE new word in the whole lesson, on purpose. L2's job is the
  #    diagnostic — read the particle, both directions — and a lesson that
  #    also taught five words would not have the room to drill it.
  - { kana: しまる, romaji: "shimaru", gloss: "to close (of itself), to shut", shortGloss: "close (it does)", imageable: false, kind: verb, verbClass: u }
  # ══ L3. The third anchored pair; はいる has been owned since m16, so only
  #    the transitive half is new. ひきだし is chosen for reach rather than for
  #    this lesson alone: a drawer opens, shuts, has things put into it and
  #    taken out of it, so one noun carries four of the nine pairs.
  - { kana: いれる, romaji: "ireru", gloss: "to put in, to insert", shortGloss: "put in", imageable: false, kind: verb, verbClass: ru }
  - { kana: いれて, romaji: "irete", gloss: "put in, and… (put in, te-form)", shortGloss: "put in (te)", imageable: false, kind: verb-form, derivedFrom: いれる, verbClass: ru }
  - { kana: ひきだし, romaji: "hikidashi", gloss: "a drawer", shortGloss: "drawer", imageable: true, kind: vocab }
  # ══ L5. とまる is m32's; only the transitive half is new here.
  - { kana: とめる, romaji: "tomeru", gloss: "to stop (something), to park", shortGloss: "stop (something)", imageable: false, kind: verb, verbClass: ru }
  - { kana: とめて, romaji: "tomete", gloss: "stop it, and… (stop something, te-form)", shortGloss: "stop it (te)", imageable: false, kind: verb-form, derivedFrom: とめる, verbClass: ru }
  # ══ L6. きめる is m30's — and one of the 25 atoms in the course graded
  #    exactly once, which this lesson repays. かいぎ is the last image debut.
  - { kana: きまる, romaji: "kimaru", gloss: "to be decided, to be settled", shortGloss: "be settled", imageable: false, kind: verb, verbClass: u }
  - { kana: かいぎ, romaji: "kaigi", gloss: "a meeting", shortGloss: "meeting", imageable: true, kind: vocab }
  # ══ L7. The only pair in the taught set where BOTH halves are new, which is
  #    why it is placed last in block B — by then the rule is carrying itself
  #    and there is no familiar half to lean on, which is the honest test.
  - { kana: けす, romaji: "kesu", gloss: "to turn off, to switch off", shortGloss: "turn off", imageable: false, kind: verb, verbClass: u }
  - { kana: きえる, romaji: "kieru", gloss: "to go out, to go off (of a light)", shortGloss: "go out", imageable: false, kind: verb, verbClass: ru }
  - { kana: けして, romaji: "keshite", gloss: "turn off, and… (turn off, te-form)", shortGloss: "turn off (te)", imageable: false, kind: verb-form, derivedFrom: けす, verbClass: u }
  # ══ L9. The resultative, and it introduces no VERBS at all — six pairs are
  #    already on the table and the lesson's whole content is what ている does
  #    to the が-half of them. ている is NOT registered as an atom (m14's
  #    standing decision — 「あいている」 tokenizes to て-form + いる and both
  #    halves are owned), so what the lesson needs is the four te-forms, which
  #    do not tokenize on their own.
  - { kana: あいて, romaji: "aite", gloss: "is open, and… (come open, te-form)", shortGloss: "open (te)", imageable: false, kind: verb-form, derivedFrom: あく, verbClass: u }
  - { kana: しまって, romaji: "shimatte", gloss: "is shut, and… (close, te-form)", shortGloss: "close (te)", imageable: false, kind: verb-form, derivedFrom: しまる, verbClass: u }
  - { kana: はいって, romaji: "haitte", gloss: "is in, and… (enter, te-form)", shortGloss: "enter (te)", imageable: false, kind: verb-form, derivedFrom: はいる, verbClass: u }
  - { kana: きえて, romaji: "kiete", gloss: "goes out, and… (go out, te-form)", shortGloss: "go out (te)", imageable: false, kind: verb-form, derivedFrom: きえる, verbClass: ru }
  # ══ L10-L11. THE GLANCE BLOCK. Six verbs across two lessons at recognition
  #    weight, re-cemented in m34's sentence examples (Spencer 2026-08-19).
  #    NO new nouns at all: every carrier (えいが, じゅぎょう, かいぎ, でんしゃ,
  #    かばん, てがみ, さいふ, かぎ) is already owned, so the whole of block C's
  #    budget is the six verbs and nothing else.
  - { kana: はじまる, romaji: "hajimaru", gloss: "to begin, to start (of itself)", shortGloss: "start (it does)", imageable: false, kind: verb, verbClass: u }
  - { kana: はじめる, romaji: "hajimeru", gloss: "to begin something, to start something", shortGloss: "start (something)", imageable: false, kind: verb, verbClass: ru }
  - { kana: でる, romaji: "deru", gloss: "to come out, to leave", shortGloss: "come out", imageable: false, kind: verb, verbClass: ru }
  - { kana: だす, romaji: "dasu", gloss: "to take out, to put out", shortGloss: "take out", imageable: false, kind: verb, verbClass: u }
  - { kana: だして, romaji: "dashite", gloss: "take out, and… (take out, te-form)", shortGloss: "take out (te)", imageable: false, kind: verb-form, derivedFrom: だす, verbClass: u }
  - { kana: おちる, romaji: "ochiru", gloss: "to fall, to drop (of itself)", shortGloss: "fall", imageable: false, kind: verb, verbClass: ru }
  - { kana: おとす, romaji: "otosu", gloss: "to drop something, to let something fall", shortGloss: "drop (something)", imageable: false, kind: verb, verbClass: u }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m33-neo-1
    role: teaching
    title: "「ドアが あく」と「ドアを あける」 — two verbs, one door"
    focus: "A pair is TWO DIFFERENT VERBS, not a conjugation — and the particle in front tells you which one you are looking at"
    introduces: [あく, エレベーター]
    beats:
      # あける has been owned since m14, so the lesson opens with a sentence
      # the learner can already read and adds exactly one word to it. The
      # whole first block alternates が-sentence / を-sentence deliberately:
      # the contrast is the content, so it is never more than one beat away.
      - { kind: rule, grammarPointId: jidoushi-tadoushi, variant: shape }
      - { kind: sentence, ja: "ドアが あく。", en: "The door opens", exercises: [jidoushi-tadoushi, ga-existence], mode: build }
      - { kind: particle-cloze, stem: "ドアが ", tail: "。", answer: "あく", options: ["あく", "あける", "しめる"], en: "The door opens", explanation: "が is the tell: nothing is being done to ドア, so the verb has to be the が-half, あく. あける needs somebody doing it, and that comes with を." }
      - { kind: sentence, ja: "ドアを あける。", en: "I open the door", exercises: [jidoushi-tadoushi, wo-object], mode: build }
      - { kind: sentence, ja: "まどが あく。", en: "The window opens", exercises: [jidoushi-tadoushi, ga-existence], mode: listening }
      - { kind: particle-cloze, stem: "まどを ", tail: "。", answer: "あける", options: ["あける", "あく", "しめる"], en: "I open the window", explanation: "を says somebody is doing it, so the verb has to be the を-half, あける. あく is the same event with nobody named, and it takes が. しめる takes を too — the English says open, not close." }
      - { kind: sentence, ja: "ミカが まどを あける。", en: "Mika opens the window", exercises: [jidoushi-tadoushi, wo-object, ga-existence], mode: build }
      - { kind: listening-comp, audio: "ドアが あく。", answer: "The door opens", distractors: ["I open the door", "The door is open", "Please open the door"], exercises: [jidoushi-tadoushi] }
      - { kind: sentence, ja: "エレベーターの ドアが あく。", en: "The lift doors open", exercises: [jidoushi-tadoushi, no-possession], mode: build }
      - { kind: kanji, kana: まど, kanji: 窓, distractors: ["まと", "とう", "そう"], exercises: [jidoushi-tadoushi] }
      - { kind: sentence, ja: "あついから、まどを あける。", en: "It's hot, so I'll open the window", exercises: [kara-because, wo-object, i-adj-present], mode: build }
      - { kind: sentence, ja: "エレベーターの ドアを あける。", en: "I open the lift doors", exercises: [jidoushi-tadoushi, wo-object, no-possession], mode: build }
      - { kind: particle-cloze, stem: "エレベーターの ドアが ", tail: "。", answer: "あく", options: ["あく", "あける", "はいる"], en: "The lift doors open", explanation: "が is the tell: nothing is being done to ドア, so the verb has to be the が-half, あく. あける needs somebody doing it, and that comes with を." }
      - { kind: listening-comp, audio: "ミカが まどを あける。", answer: "Mika opens the window", distractors: ["The window opens", "Mika closes the window", "Mika's window is open"], exercises: [jidoushi-tadoushi, wo-object] }
      - { kind: sentence, ja: "せんせいが きょうしつの ドアを あける。", en: "The teacher opens the classroom door", exercises: [jidoushi-tadoushi, wo-object, no-possession], mode: build }
      - { kind: sentence, ja: "かぎが あく。", en: "The lock comes open", exercises: [jidoushi-tadoushi, ga-existence], mode: translate }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "あついね。", en: "It's hot, isn't it." }
          - { speaker: "Tom", ja: "まどを あける？", en: "Shall I open the window?" }
          - { speaker: "Mika", ja: "うん。エレベーターの ドアが あく。", en: "Yeah. The lift doors are opening." }
        questions:
          - { q: "Who is doing the opening in Tom's line?", options: ["Tom — あける takes a doer", "The window — it opens itself", "Mika", "Nobody; it is a question about the weather"], answer: "Tom — あける takes a doer" }
      - { kind: challenge, ja: "きょうしつに はいったら、まどを あける。", en: "When I get into the classroom, I'll open the window", combines: [tara, ni-location, wo-object, jidoushi-tadoushi], mode: build }
    reviewPool: [ドア, まど, かぎ, きょうしつ, せんせい, あける, はいる, あつい, エレベーター, あく]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m33-neo-2
    role: teaching
    title: "「まどが しまる」と「まどを しめる」 — read the particle, both ways"
    focus: "The diagnostic itself: from a sentence to the verb, and from the meaning you want to the particle you need"
    introduces: [しまる]
    beats:
      # ONE new word all lesson. The budget goes on the diagnostic instead,
      # which is what the spine asks this module to assess.
      - { kind: rule, grammarPointId: jidoushi-tadoushi, variant: diagnostic }
      - { kind: sentence, ja: "ドアが しまる。", en: "The door closes", exercises: [jidoushi-tadoushi, ga-existence], mode: build }
      - { kind: particle-cloze, stem: "まどが ", tail: "。", answer: "しまる", options: ["しまる", "しめる", "あく"], en: "The window closes", explanation: "が is the tell: nothing is being done to まど, so the verb has to be the が-half, しまる. しめる needs somebody doing it, and that comes with を. あく would also follow が — the English says closes, not opens." }
      - { kind: sentence, ja: "まどを しめる。", en: "I close the window", exercises: [jidoushi-tadoushi, wo-object], mode: build }
      - { kind: listening-comp, audio: "ドアが しまる。", answer: "The door closes", distractors: ["I close the door", "The door opens", "The door is closed"], exercises: [jidoushi-tadoushi] }
      - { kind: sentence, ja: "みせが しまる。", en: "The shop closes", exercises: [jidoushi-tadoushi, ga-existence], mode: build }
      - { kind: sentence, ja: "たなかさんが みせを しめる。", en: "Mr Tanaka closes the shop", exercises: [jidoushi-tadoushi, wo-object], mode: build }
      - { kind: particle-cloze, stem: "みせを ", tail: "。", answer: "しめる", options: ["しめる", "しまる", "あける"], en: "I close the shop", explanation: "を says somebody is doing it, so the verb has to be the を-half, しめる. しまる is the same event with nobody named, and it takes が. あける takes を too — the English says close, not open." }
      - { kind: kanji, kana: みせ, kanji: 店, distractors: ["みぜ", "てん", "しょう"], exercises: [jidoushi-tadoushi] }
      - { kind: sentence, ja: "さむいから、まどを しめる。", en: "It's cold, so I'll close the window", exercises: [kara-because, wo-object, i-adj-present], mode: build }
      - { kind: sentence, ja: "エレベーターの ドアが しまる。", en: "The lift doors close", exercises: [jidoushi-tadoushi, no-possession], mode: listening }
      - { kind: listening-comp, audio: "たなかさんが みせを しめる。", answer: "Mr Tanaka closes the shop", distractors: ["The shop closes", "Mr Tanaka opens the shop", "Mr Tanaka's shop is closed"], exercises: [jidoushi-tadoushi, wo-object] }
      - { kind: sentence, ja: "まどを しめて ください。", en: "Please close the window", exercises: [te-kudasai, wo-object], mode: build }
      - { kind: particle-cloze, stem: "ドアが ", tail: "。", answer: "しまる", options: ["しまる", "しめる", "あける"], en: "The door closes", explanation: "が is the tell: nothing is being done to ドア, so the verb has to be the が-half, しまる. しめる needs somebody doing it, and that comes with を." }
      - { kind: sentence, ja: "みせは ろくじに しまる。", en: "The shop closes at six", exercises: [jidoushi-tadoushi, ni-time, wa-topic], mode: build }
      - { kind: sentence, ja: "ミカが まどを しめる。", en: "Mika closes the window", exercises: [jidoushi-tadoushi, wo-object], mode: translate }
      - kind: dialogue
        lines:
          - { speaker: "Tanaka", ja: "みせは なんじに しまる？", en: "What time does the shop close?" }
          - { speaker: "Mika", ja: "ろくじ。", en: "Six." }
          - { speaker: "Tanaka", ja: "ごじに ドアを しめる。", en: "I'll shut the door at five." }
        questions:
          - { q: "Which of Tanaka's two sentences has a person doing something?", options: ["The second — しめる takes a doer, and it is Tanaka", "The first — しまる takes a doer", "Both of them", "Neither of them"], answer: "The second — しめる takes a doer, and it is Tanaka" }
      - { kind: challenge, ja: "さむいから、きょうしつの まどを しめて ください。", en: "It's cold, so please close the classroom window", combines: [kara-because, te-kudasai, no-possession, wo-object], mode: build }
    reviewPool: [みせ, ドア, まど, しめる, きょうしつ, さむい, ろくじ, たなか, エレベーター, しまる]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m33-neo-3
    role: teaching
    title: "「へやに はいる」と「かばんに ほんを いれる」 — the doer arrives"
    focus: "The last anchored pair, and the first time the が/を swap is visible as ONE slot changing while everything else holds still"
    introduces: [いれる, いれて, ひきだし]
    beats:
      # ひきだし is the image debut and it is deliberately NOT named by the
      # rule card (which compiles to a pinned step), so its MCQ is still its
      # first-ever appearance. The card argues from へや and かばん instead.
      - { kind: rule, grammarPointId: jidoushi-tadoushi, variant: containers }
      - { kind: sentence, ja: "へやに はいる。", en: "I go into the room", exercises: [jidoushi-tadoushi, ni-location], mode: build }
      - { kind: sentence, ja: "かばんに ほんを いれる。", en: "I put a book in my bag", exercises: [jidoushi-tadoushi, wo-object, ni-location], mode: build }
      - { kind: particle-cloze, stem: "かばんに ほんを ", tail: "。", answer: "いれる", options: ["いれる", "はいる", "あける"], en: "I put a book in my bag", explanation: "を says somebody is doing it, so the verb has to be the を-half, いれる. はいる is the same event with nobody named, and it takes が." }
      - { kind: sentence, ja: "ひきだしに かぎを いれる。", en: "I put the key in the drawer", exercises: [jidoushi-tadoushi, wo-object, ni-location], mode: build }
      - { kind: listening-comp, audio: "かばんに ほんを いれる。", answer: "I put a book in my bag", distractors: ["A book goes in my bag", "I take a book out of my bag", "There's a book in my bag"], exercises: [jidoushi-tadoushi, ni-location] }
      - { kind: sentence, ja: "ひきだしが あく。", en: "The drawer opens", exercises: [jidoushi-tadoushi, ga-existence], mode: build }
      - { kind: particle-cloze, stem: "へやに ", tail: "。", answer: "はいる", options: ["はいる", "いれる", "しまる"], en: "I go into the room", explanation: "nothing in this sentence is marked を, so nothing is being put anywhere — the thing that moves is the subject, and that is はいる. いれる needs somebody doing the putting, and it would put を on what gets put in. The に never changes between the two." }
      - { kind: sentence, ja: "ミカが ひきだしに さいふを いれる。", en: "Mika puts her wallet in the drawer", exercises: [jidoushi-tadoushi, wo-object, ni-location], mode: build }
      - { kind: kanji, kana: きょうしつ, kanji: 教室, distractors: ["きょうしっ", "こうしつ", "きょうし"], exercises: [ni-location] }
      - { kind: sentence, ja: "かばんに かさを いれて ください。", en: "Please put the umbrella in the bag", exercises: [te-kudasai, wo-object, ni-location], mode: build }
      - { kind: sentence, ja: "きょうしつに はいる。", en: "I go into the classroom", exercises: [jidoushi-tadoushi, ni-location], mode: listening }
      - { kind: listening-comp, audio: "ひきだしに かぎを いれる。", answer: "I put the key in the drawer", distractors: ["The key is in the drawer", "I put the key in my bag", "I open the drawer with the key"], exercises: [jidoushi-tadoushi, ni-location] }
      - { kind: sentence, ja: "ひきだしを あける。", en: "I open the drawer", exercises: [jidoushi-tadoushi, wo-object], mode: build }
      - { kind: particle-cloze, stem: "ひきだしに さいふを ", tail: "。", answer: "いれる", options: ["いれる", "はいる", "しめる"], en: "I put my wallet in the drawer", explanation: "を says somebody is doing it, so the verb has to be the を-half, いれる. はいる is the same event with nobody named, and it takes が." }
      - { kind: sentence, ja: "つくえの ひきだしに ほんを いれる。", en: "I put a book in the desk drawer", exercises: [jidoushi-tadoushi, wo-object, no-possession], mode: translate }
      - kind: dialogue
        lines:
          - { speaker: "Tom", ja: "かぎは どこ？", en: "Where's the key?" }
          - { speaker: "Mika", ja: "つくえの ひきだしに いれる。", en: "I'll put it in the desk drawer." }
          - { speaker: "Tom", ja: "その ひきだしが あく？", en: "Does that drawer open?" }
          - { speaker: "Mika", ja: "うん、あく。", en: "Yes, it opens." }
        questions:
          - { q: "Where does Mika say the key goes?", options: ["In the desk drawer", "In her bag", "In the classroom", "She does not say"], answer: "In the desk drawer" }
      - { kind: challenge, ja: "へやに はいったら、かばんを つくえに おく。", en: "When I get into the room, I'll put my bag on the desk", combines: [tara, ni-location, wo-object], mode: build }
    reviewPool: [かばん, ひきだし, かぎ, さいふ, へや, つくえ, ほん, かさ, はいる, いれる]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m33-neo-review-1
    role: review
    title: "Review — three pairs, one question"
    focus: "Block A drilled as a single decision: is there somebody in this sentence or not?"
    introduces: []
    beats:
      # Sits after あく/あける, しまる/しめる and はいる/いれる, so it reviews
      # three instances of ONE rule rather than three rules. The resultative
      # is deliberately absent — it is L9, and previewing it here would blur
      # the が/を question this review exists to sharpen.
      - { kind: sentence, ja: "ドアが あく。", en: "The door opens", exercises: [jidoushi-tadoushi, ga-existence], mode: build }
      - { kind: sentence, ja: "たなかさんが みせを しめる。", en: "Mr Tanaka closes the shop", exercises: [jidoushi-tadoushi, wo-object], mode: build }
      - { kind: particle-cloze, stem: "まどを ", tail: "。", answer: "あける", options: ["あける", "あく", "しめる"], en: "I open the window", explanation: "を says somebody is doing it, so the verb has to be the を-half, あける. あく is the same event with nobody named, and it takes が. しめる takes を too — the English says open, not close." }
      - { kind: sentence, ja: "ひきだしに かぎを いれる。", en: "I put the key in the drawer", exercises: [jidoushi-tadoushi, ni-location], mode: build }
      - { kind: listening-comp, audio: "みせが しまる。", answer: "The shop closes", distractors: ["I close the shop", "The shop opens", "Mr Tanaka closes the shop"], exercises: [jidoushi-tadoushi] }
      - { kind: sentence, ja: "あついから、きょうしつの まどを あける。", en: "It's hot, so I'll open the classroom window", exercises: [kara-because, wo-object, no-possession], mode: build }
      - { kind: particle-cloze, stem: "エレベーターの ドアが ", tail: "。", answer: "しまる", options: ["しまる", "しめる", "あく"], en: "The lift doors close", explanation: "が is the tell: nothing is being done to ドア, so the verb has to be the が-half, しまる. しめる needs somebody doing it, and that comes with を. あく would also follow が — the English says close, not open." }
      - { kind: sentence, ja: "ミカが へやに はいる。", en: "Mika goes into the room", exercises: [jidoushi-tadoushi, ni-location], mode: build }
      - { kind: sentence, ja: "かばんに かさを いれる。", en: "I put the umbrella in my bag", exercises: [jidoushi-tadoushi, wo-object, ni-location], mode: listening }
      - { kind: listening-comp, audio: "せんせいが きょうしつの ドアを あける。", answer: "The teacher opens the classroom door", distractors: ["The classroom door opens", "The teacher closes the classroom door", "The teacher goes into the classroom"], exercises: [jidoushi-tadoushi, wo-object] }
      - { kind: sentence, ja: "みせは ろくじに しまる。", en: "The shop closes at six", exercises: [jidoushi-tadoushi, ni-time, wa-topic], mode: build }
      - { kind: sentence, ja: "さむいから、まどを しめて ください。", en: "It's cold, so please close the window", exercises: [kara-because, te-kudasai], mode: translate }
      - { kind: challenge, ja: "きょうしつに はいったら、まどを あけて ドアを しめる。", en: "When I get into the classroom, I'll open the window and close the door", combines: [tara, te-form, wo-object, jidoushi-tadoushi], mode: build }
    reviewPool: [ドア, まど, みせ, ひきだし, かばん, かぎ, へや, エレベーター, きょうしつ, さいふ]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m33-neo-5
    role: teaching
    title: "「でんしゃが とまる」と「くるまを とめる」 — who stopped it"
    focus: "The pair whose two halves live in different places in real life — trains stop, drivers park"
    introduces: [とめる, とめて]
    beats:
      - { kind: rule, grammarPointId: jidoushi-tadoushi, variant: movement }
      - { kind: sentence, ja: "でんしゃが とまる。", en: "The train stops", exercises: [jidoushi-tadoushi, ga-existence], mode: build }
      - { kind: sentence, ja: "くるまを とめる。", en: "I stop the car", exercises: [jidoushi-tadoushi, wo-object], mode: build }
      - { kind: particle-cloze, stem: "きかいが ", tail: "。", answer: "とまる", options: ["とまる", "とめる", "うごく"], en: "The machine stops", explanation: "が is the tell: nothing is being done to きかい, so the verb has to be the が-half, とまる. とめる needs somebody doing it, and that comes with を. うごく would also follow が — the English says stops, not runs." }
      - { kind: sentence, ja: "バスが えきに とまる。", en: "The bus stops at the station", exercises: [jidoushi-tadoushi, ni-location], mode: build }
      - { kind: listening-comp, audio: "くるまを とめる。", answer: "I stop the car", distractors: ["The car stops", "I park at the station", "The car is stopped"], exercises: [jidoushi-tadoushi] }
      - { kind: sentence, ja: "みせの まえに くるまを とめる。", en: "I park the car in front of the shop", exercises: [jidoushi-tadoushi, wo-object, ni-location], mode: build }
      - { kind: particle-cloze, stem: "くるまを ", tail: "。", answer: "とめる", options: ["とめる", "とまる", "おす"], en: "I stop the car", explanation: "を says somebody is doing it, so the verb has to be the を-half, とめる. とまる is the same event with nobody named, and it takes が. おす takes を too — the English says stop, not push." }
      - { kind: sentence, ja: "ここに くるまを とめて ください。", en: "Please park the car here", exercises: [te-kudasai, wo-object, koko-soko-asoko], mode: build }
      - { kind: kanji, kana: でんしゃ, kanji: 電車, distractors: ["てんしゃ", "でんしゃく", "でんき"], exercises: [jidoushi-tadoushi] }
      - { kind: sentence, ja: "でんしゃは えきに とまる。", en: "The train stops at the station", exercises: [jidoushi-tadoushi, wa-topic, ni-location], mode: listening }
