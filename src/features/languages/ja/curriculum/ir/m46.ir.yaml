      - { kind: sentence, ja: "いったばかりだ。", en: "I just went (there).", exercises: [ta-bakari-vs-ta-tokoro, ta-form], mode: build }
      - { kind: sentence, ja: "たべた ところだ。", en: "I just finished eating.", exercises: [tokoro-da-aspect, ta-form], mode: listening }
      - { kind: particle-cloze, stem: "かった", tail: "だ。", answer: "ばかり", options: ["ばかり", "ところ", "だけ"], en: "I just bought it (emphasizing how recent it was).", explanation: "ばかり foregrounds RECENCY — 'barely any time has passed.' ところ would shift the emphasis to sequence-position instead, and だけ drops the 'just now' sense entirely, leaving only a neutral 'bought only it.'" }
      - { kind: listening-comp, audio: "ひさしぶり！", answer: "It's been a while!", distractors: ["Good morning!", "See you later!", "Congratulations!"], q: "What does this mean?" }
