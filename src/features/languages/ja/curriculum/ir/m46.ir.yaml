  - id: m46-neo-7
    role: teaching
    title: "「かったばかりだ」vs「たべた ところだ」— たばかり vs たところ, ひさしぶり"
    focus: "Pairwise discrimination: たばかり (ばかり on た-form, foregrounds RECENCY) vs たところ (ところだ's た-tense from L4, foregrounds sequence-position). Vocab: ひさしぶり ('long time no see')."
    introduces: [ひさしぶり]
    beats:
      - { kind: rule, grammarPointId: ta-bakari-vs-ta-tokoro }
