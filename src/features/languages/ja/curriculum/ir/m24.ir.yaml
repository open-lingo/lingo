notes: |
  m24 = spine tile s21, "Can & let's: potential, ましょう, 〜ない？". The
  milestone line on the tile is "closes the old course's potential-form gap":
  the archived course taught できる and nothing else, so a learner could say
  they were able to DO things and never able to drink, swim, read or come.

  THE WHOLE POINT — the potential is a FORM, not a word. Four formation rules
  cover every verb in Japanese and the module teaches all four, in the order
  that makes each one cheap:

  1. **う-verbs move to the え row and add る.** のむ → のめる, いく → いける,
     およぐ → およげる, あるく → あるける, はなす → はなせる. It is the same
     stem-row machinery m7 used for ます (い row) and m6 for ない (あ row), so
     the learner is placing a THIRD row on a chart they already own rather
     than memorising a list.
  2. **る-verbs drop る and add られる.** たべる → たべられる, みる → みられる.
     Draft-2 of the spine records the precision fix this module obeys: ichidan
     potential is られる-ATTACHMENT, not an e-stem — the stem-grid story covers
     う-verbs and る-verbs get their own one-liner.
  3. **くる → こられる, and する has no potential at all** — it uses できる,
     which is also the noun-taking 「りょうりが できる」.
  4. **Every result is itself a る-verb**, which is why L5's negative is m6's
     ない-form re-taught rather than a new point: のめる → のめない,
     たべられる → たべられない, できる → できない.

  The particle flip rides along: 「おさけを のむ」 but 「おさけが のめる」. It is
  taught as the が the learner already owns from 「かぎが ある」 — the potential
  is not about doing anything, it says the thing is POSSIBLE, and が marks the
  thing whose possibility is under discussion.

  **ら抜きことば is RECOGNITION, exactly as the spine words it.** たべれる /
  みれる are registered atoms and appear in the L2 rule card (labelled), two
  listening-comprehension beats and one dialogue line — and in ZERO production
  targets anywhere in the module. The audit note the spine cites is real (the
  ら-dropped form is the majority form in spoken corpora), so hiding it would
  leave the learner unable to parse ordinary speech; producing it would have
  them marked wrong by half of Japan. Understand the short one, say the long
  one. Machine-checked in `m24-neo.test.ts`.

  **見える/聞こえる is the nuance beat (L6), and it is a contrast with the
  potential rather than a vocabulary pair.** みられる says the OPPORTUNITY
  exists ("they show films at the library"); みえる says the thing is VISIBLE
  and nobody chose anything. Both take が; only one is a potential form.

  **ましょう / ませんか / 〜ない？ are ONE speech act in three registers**, which
  is the spine's own framing ("one speech act, both registers"), so ませんか and
  the casual 〜ない？ share a lesson (L11) rather than being split — splitting
  them would teach half a contrast twice, the argument m14/m15 used for
  てから/まえに. The ladder the learner leaves with: 「たべない？」 to a friend,
  「たべませんか」 to anyone else, 「たべましょう」 once it is settled.

  Shape: 13 lessons = 9 teaching + 3 review + 1 challenge, reviews at the
  first/middle/last thirds, challenge lesson LAST (inv 25). NO katakana rows
  (the programme ended at m11). NO `kind: register` beats — that machinery is
  m10 + m29 only (registerScaffoldIsolation), and this module's register work
  is done with ordinary prompt cues ("Say politely:" / "Say to a friend:") per
  inv 8. NO kanji beats — kanji-set-3 is m28's ledger row, not m24's.

  DEVIATIONS + DECISIONS, documented per the RUN-PLAN "decide and document" rule:

  - **NO SPINE DEVIATION.** spinePlan s21 asks for the full potential system
    including ら抜き recognition, the 見える/聞こえる nuance, and ましょう /
    ませんか / casual 〜ない？. All of it ships. The ledger row —
    `mashou` `masenka` `no-ga-jouzu` `no-ga-heta` — is unchanged and every one
    of the four carries its own rule card.
  - **FOUR GRAMMAR-POINT IDS ARE IR-LOCAL, and this is a registry HOLE rather
    than an invented vocabulary.** `n5-grammar-points.json` holds 103 points
    and NONE of them is the potential form — because the potential is
    nominally N4 grammar that the dict-form-first rewrite pulled forward, which
    `docs/spine-n4.md` §1.1 states in so many words ("potential form (full
    system, incl. ら抜き recognition) | Owned by m24"). Inv 42 forbids inventing
    an id where the registry HAS one; it cannot require an id that does not
    exist. `potential-form`, `potential-rareru`, `dekiru` and `mieru-kikoeru`
    are therefore declared in this IR's `grammarPoints[]`, the same move m11
    made for `itsu-when` (also absent from the registry, also shipped clean).
    The registry was deliberately NOT edited: adding a shipped point with no
    authored pool would force a new entry into `POOL_GAP_EXEMPTIONS`, a list
    whose own comment says it must shrink and never grow silently, and that is
    a tooling decision this module has no business making on its own.
  - **ONE POINT IS RE-TAUGHT rather than re-assigned.** `nai-form` (m6) returns
    in L5, because a potential verb is a る-verb whatever its base was and its
    negative is m6's rule applied to a new stem — のめる → のめない is exactly
    たべる → たべない. That is the module's own argument for why the potential
    is worth learning as a FORM, so re-teaching the point is the content, not
    filler. No ledger row moves.
  - **THREE POTENTIAL FORMS ARE BANNED BECAUSE THEIR KANA ARE ALREADY TAKEN,
    and each was measured against courseAtoms rather than assumed:**
      かう → **かえる** is 帰る "to go back" (an m14 row) — a bare かえる tile
        would credit the wrong verb and nothing would error;
      かく → **かける** is 掛ける "to call by phone" (an m14 row);
      つく → **つける** is 付ける "to turn on" (a row exists).
    Those three verbs never appear in the potential anywhere in this module.
    **いける is SAFE despite いけ 池 "pond" and いけません** — the tokenizer is
    longest-match, so いける (3) beats いけ (2) at the same index and いけません
    (5) still beats both where it occurs. Verified by dumping the compiled
    `tiles`, not by reading the code.
  - **SIX VERBS ARE BANNED FROM ましょう FOR THE SAME REASON, one layer down.**
    ましょう is registered as a SUFFIX (see below), so 「たべましょう」 tiles as
    たべ + ましょう — the ます-stem tile m19's 〜に いく already ships. That is
    only safe when the stem is not itself a registered noun, and six of them
    are: する→**し** is 四 "four", くる→**き** is 木 "tree", かう→**かい** is
    貝 "shell", まつ→**まち** is 町 "town", つく→**つき** is 月 "moon", and
    はなす→**はなし** is 話 "talk". 「しましょう」 is too useful to lose, so it
    is registered WHOLE (5 chars, so longest-match beats し); the other five
    verbs simply never take ましょう here. The safe stems this module actually
    uses — たべ・のみ・いき・きき・あそび・およぎ・あるき・み — were each checked
    against the whole atom registry. Machine-checked in `m24-neo.test.ts`.
  - **ましょう IS A BOUND SUFFIX and inv 41 is the reason it got checked before
    it got registered.** ZERO live Japanese surfaces contain the string: m30's
    only hit is inside an ENGLISH option ("She uses ましょう instead."),
    `jaSurfaceForms.ts` GENERATES the form for flashcard credit rather than
    storing it, and the TTS manifest hits are cache keys from the archived
    old course. Registering the suffix buys every taught verb's volitional at
    once and shows the ます→ましょう swap in the tile bank, instead of hiding it
    inside one whole-word atom per verb.
  - **SEVENTEEN NEW courseAtoms ROWS, every one checked for zero prior
    occurrences.** のめる いける およげる はなせる あるける たべられる みられる
    こられる たべれる みれる のめない たべられない できない みえる きこえる
    ましょう しましょう. No lexicon in this repo can spell a potential form —
    `ChainForm` has no `potential` cell, so `getRealFormLexicon()` and the
    compiler's `STEMS` are both blind to のめる — which is why these are whole
    atoms rather than derived forms, the same call m11 made for the plain past
    and m14 for the て-form. FOUR MORE atoms are declared in this IR only,
    because rows already exist under stale old-course tags: できる (m23 tag),
    いっしょ (m23), じょうず (m9), へた (m9) and もの (m5).
  - **NO ATOM DEBUTS ON A PICTURE, and the registry is why.** Every potential
    form is an inflection with no referent a picture could name. The four
    imageable-looking candidates all fail the m19/m20/m21 tests:
    **じょうず 👌 is だいじょうぶ's emoji too** and だいじょうぶ is a MET word, so
    the debut MCQ would draw its distractors from a pool containing a word the
    picture names equally well; **へた 👎 and いっしょ 👫 are each named by their
    own rule card**, and a `kind: rule` beat compiles to a PINNED step ahead of
    the interleaved middle, so the card would steal the debut (the m20/m21
    rule, and m22's いたい/ねつ precedent); **もの has no referent at all.** The
    module therefore ships zero `word_image_mcq` steps, which inv 44 explicitly
    permits — the count is fixed by how many imageable words a module
    introduces, and this one introduces none.
  - **もの IS HERE ON PURPOSE.** `exposure-audit` reports exactly ONE
    under-exposed CEJC top-150 word in the whole course — もの (#56, ×2, and
    both of those are inside かいもの) — and inv 27 says such a word goes into
    the next module's carriers. 「たべられない ものが ある」 is where it earns its
    place: a whole potential clause modifying a noun, which is m15's relative
    clause doing a job m15 never asked of it.
  - **CARRIER ROTATION (inv 27).** The 15 worst over-exposed carriers measured
    this cycle — みせ ×259, ともだち ×243, ほん ×274, いる ×292, ごはん ×223,
    ください ×257, みず ×163, きのう ×201, あたらしい ×130, えき ×135,
    かった ×232, うみ ×226, いたい ×165, でんしゃ ×103, ちゃ ×210 — appear
    NOWHERE in this module. An ability module's natural stock carries the
    sentences instead: おさけ, コーヒー, ぎゅうにゅう, すし, パン, りょうり,
    たまご, とりにく, えいが, おんがく, うた, しゃしん, カメラ, じてんしゃ,
    くるま, ひこうき, ふね, バス, ちかてつ, くうこう, ホテル, やま, かわ, いけ,
    そら, ほし, さくら, まど, でんわ, けいたい, としょかん, きっさてん, だいがく,
    かいしゃ, びょういん, はたち, さんぽ, かいもの, もの.
  - **Words the context pack lists as known but the compiler does not.** The
    pack is built from `courseAtoms` attribution and overstates. Verified
    against `priorVocab` (the compiler's truth) and either AVOIDED or
    INTRODUCED here rather than assumed: へた, じょうず, いっしょ, もの, できる
    (all introduced), and えいご, はなし, にく, こうえん, へや, プール, ノート,
    ちかく, そば, ゆっくりと, あい, せっけん, ぴあの, ぱん, ぺん, どあ, あおい,
    しょうゆ, なく, おもい, いりぐち, ちがいます, へん, あまい, うるさい,
    あかい, しります, いつつ, よっつ, かく, よむ, とる, うたう, おぼえる, でる,
    たつ, みがく, なる (all avoided — no neo module teaches them).
  - **Cloze frames carry no character names and never end in bare だ** (m21/m22
    findings): a particle_cloze is harvested into the grammar-review deck,
    whose comprehensibility gate resolves every word through `courseAtoms` —
    ミカ / トム / ケン / たなか have no rows — and strips only atoms and
    `TAUGHT_ENDINGS`, which does not include だ. Every frame here picks among
    CONTENT words (potential forms, dictionary forms, ない-forms, な-adjectives,
    polite forms) because m24 introduces no particle at all, so a true
    particle_cloze would be a REVIEW use of the type and inv 5 bans it.
  - **Clause boundaries are SPACES, never 、** — `moduleCompiler.clean()` strips
    、 with nothing in its place, so an authored comma compiles to a run-on
    build target AND a run-on TTS key.
  - **Gloss discipline (inv 17).** No potential surface is ever glossed with an
    English progressive: 「のめる」 is "I can drink", never "I'm able to be
    drinking". いく / くる / かえる keep the motion-futurate "-ing" where a
    futurate is meant. Every みる is "watch" / "look at", never "read"
    (`verbGlossFidelity`).
  - **L7 calls Tom good at cooking and L9 has Tom deny it — that is the card,
    not a contradiction.** The `no-ga-heta` card says へた "is how a Japanese
    speaker deflects a compliment", and L9's dialogue is that exact beat: ミカ
    praises (「トムは りょうりを するのが じょうずだ」), トム deflects (「ううん。
    ぼくは へただ」). Both halves are true of the same person in Japanese, which
    is the point of teaching the pair together.
  - **じょうず is about OTHER people and へた is about yourself.** That is a
    culture rule, not a grammar rule, and it is stated in the two cards'
    prose. No sentence in this module has the speaker call themselves じょうず,
    and the softer way to say someone else is not good — あまり じょうずじゃない
    — is taught in L9, which is finally a negative for あまり to sit in front of.

  ONE RULE CARD PER LESSON (m14's layout law): every teaching lesson carries
  exactly one, because two `kind: rule` beats compile to two PINNED, ADJACENT
  grammar_rule steps and fail the adjacency bar.

  NO CONJUGATION RAMPS. `conjugation:` on a grammar point compiles to
  `conjugationTransform`, whose `form` must be a `ChainForm` — and there is no
  `potential` cell in that type. Adding one is an engine change with a
  course-wide blast radius (`transformDrillDistractors`, the trainer registry,
  the FSRS form ladder), which is exactly the class of tooling work m12 and m13
  deferred rather than half-landed. The module drills the derivation with
  particle_cloze form-pickers and builds instead, and the ramp can be added
  later without touching this content.

  CONNECTIVES + COMPLEXITY (inv 13): a bare ability sentence is three tiles
  long — 「おさけが のめる」 — which is precisely the flat texture GATE 7 exists
  to stop. Nearly every production beat therefore hangs a second clause on
  から / けど / とき / てから, which is also how ability is actually spoken: you
  say what you can do in order to say what you are going to do about it.

grammarPoints:
  - id: potential-form
    rule: "Japanese has a form that means CAN, and for an う-verb you build it the same way you have built everything else: move the last kana along the chart and add an ending. ます took the い row (のむ → のみます). ない took the あ row (のむ → のまない). The potential takes the え row and adds る. のむ ends in む, so slide to め: のめる, I can drink. いく → いける. およぐ → およげる. あるく → あるける. あそぶ → あそべる. はなす → はなせる. One rule, every う-verb, no exceptions worth worrying about. There is a second half nobody warns you about, and it matters more than the ending. The thing you can do stops being を and becomes が. 「おさけを のむ」 is I drink sake; 「おさけが のめる」 is I can drink sake. The reason is worth one sentence: のめる is not really about doing anything — it says the drinking is POSSIBLE — and が is the particle that has marked the thing under discussion since 「かぎが ある」 in module 6. Same が, same job. And the form you end up with is itself a る-verb, which is going to make the negative free."
    examples:
      - { ja: "はたちだから おさけが のめる。", en: "I'm twenty, so I can drink sake." }
      - { ja: "げんきだから かわで およげる。", en: "I'm well, so I can swim in the river." }
      - { ja: "じかんが あるから きっさてんに いける。", en: "I have time, so I can go to the coffee shop." }
      - { ja: "あさは コーヒーが のめるけど ばんは ぎゅうにゅうを のむ。", en: "I can drink coffee in the morning, but at night I drink milk." }
      - { ja: "じてんしゃが ないけど がっこうまで いける。", en: "I have no bicycle, but I can get as far as school." }
    antiPattern: { ja: "はたちだから おさけが のむれる。", why: "the potential of のむ moves む to め and adds る — のめる, never のむれる: はたちだから おさけが のめる。" }

  - id: potential-rareru
    rule: "る-verbs are easier than う-verbs and the irregulars are shorter than the list makes them look. For a る-verb you do not touch the stem at all: drop る, add られる. たべる → たべられる. みる → みられる. おしえる → おしえられる. That is the whole rule — it is attachment, not a row on the chart. くる is the one that changes shape: こられる. And する has no potential form at all, which is the next lesson's word. が does exactly what it did with う-verbs: 「すしが たべられる」. Now the part you will hear long before you are ready for it. In ordinary speech people drop the ら and say 「たべれる」, 「みれる」. It is called ら抜きことば — ら-dropped words — and it is everywhere, on television, in shops, from your friends. So you need to UNDERSTAND it from today. You do not need to say it. Speak たべられる and you are correct with every person in Japan; speak たべれる and some of them will hear a mistake. Recognise the short one, produce the long one, and you never have to think about it again."
    examples:
      - { ja: "きっさてんで すしが たべられる。", en: "You can eat sushi at the coffee shop." }
      - { ja: "としょかんで えいがが みられるから よく いく。", en: "You can watch films at the library, so I go often." }
      - { ja: "ひまだから あした ミカも こられる。", en: "Mika's free, so she can come tomorrow too." }
      - { ja: "すしが たべれる。", en: "I can eat sushi. — the casual ら-dropped form; recognise it, but say たべられる" }
      - { ja: "えいがが みれる。", en: "I can watch a film. — the casual ら-dropped form; recognise it, but say みられる" }
    antiPattern: { ja: "きっさてんで すしが たべるられる。", why: "a る-verb DROPS る before られる — たべられる, never たべるられる: きっさてんで すしが たべられる。" }

  - id: dekiru
    rule: "する is the one verb with no potential form, and the reason is that Japanese already had a word for the job: できる. It is not built from anything. You learn it once and you own the whole する family with it — 「さんぽが できる」, 「かいものが できる」, 「りょこうが できる」. Which shows you the bigger half. できる takes a NOUN in front of it with が, and that noun does not have to be a する-word at all: 「にほんの りょうりが できる」 means I can cook Japanese food, with no verb anywhere in the sentence. English needs a different verb for each of those — cook, shop, travel — and Japanese needs one word and a noun. できる is also a る-verb, like every potential form, so it behaves itself everywhere else. And が is not optional here in the way it sometimes is elsewhere: できる has never taken を in its life."
    examples:
      - { ja: "にほんの りょうりが できる。", en: "I can cook Japanese food." }
      - { ja: "げんきだから あした さんぽが できる。", en: "I'm well, so I can go for a walk tomorrow." }
      - { ja: "あさは じかんが あるから かいものが できる。", en: "I have time in the morning, so I can do the shopping." }
      - { ja: "なつやすみに りょこうが できるから きっぷを かう。", en: "I can travel in the summer holidays, so I'm buying a ticket." }
      - { ja: "ひまな とき うちで りょうりが できる。", en: "When I'm free, I can cook at home." }
    antiPattern: { ja: "にほんの りょうりが すれる。", why: "する has no regular potential — the word is できる: にほんの りょうりが できる。" }

  - id: nai-form
    rule: "Here is the payoff for the line you have heard three times now: every potential form is a る-verb. のめる, いける, たべられる, できる — all of them end in る and all of them behave like たべる from this moment on. So the negative is module 6's rule, unchanged, applied to a new stem. Drop る, add ない. のめる → のめない. およげる → およげない. たべられる → たべられない. できる → できない. Nothing new to learn, which is the whole argument for treating the potential as a FORM rather than a pile of words. Keep が: 「おさけが のめない」, I can't drink. You will use these more than the positives, because half of what anyone says about ability is what they cannot do. Two things worth adding while you are here. ぜんぜん means not at all and it only ever appears in front of a negative, so 「ぜんぜん りょうりが できない」 is I can't cook a thing. And もの means thing, so 「たべられない ものが ある」 — there are things I can't eat — puts a whole potential clause in front of a noun, which is module 15's relative clause doing a job module 15 never asked of it."
    examples:
      - { ja: "おさけが のめないから ぎゅうにゅうを のむ。", en: "I can't drink sake, so I'll have milk." }
      - { ja: "たまごが たべられないから とりにくを かう。", en: "I can't eat eggs, so I'll buy chicken." }
      - { ja: "ぜんぜん りょうりが できない。", en: "I can't cook at all." }
      - { ja: "たべられない ものが あるけど すしは だいじょうぶだ。", en: "There are things I can't eat, but sushi is fine." }
      - { ja: "ねつが あるから きょうは さんぽが できない。", en: "I have a fever, so I can't go for a walk today." }
    antiPattern: { ja: "おさけが のめるないから ぎゅうにゅうを のむ。", why: "ない REPLACES the final る, it never follows it — のめない: おさけが のめないから ぎゅうにゅうを のむ。" }

  - id: mieru-kikoeru
    rule: "みられる and みえる are both about seeing and they are not the same sentence. みられる is the potential you built two lessons ago: it says the OPPORTUNITY exists. 「としょかんで えいがが みられる」 — you can watch films at the library, because they have them and you are allowed in. Somebody arranged that. みえる is not about you at all. It says the thing is VISIBLE, and whether anyone is looking is beside the point: 「まどから やまが みえる」, you can see the mountain from the window, which is a fact about the window. Ears divide the same way. きける is I get to listen; きこえる is it reaches my ear. 「こえが きこえる」 means a voice arrives, not that you chose to hear it. Both take が and both are る-verbs, so nothing else changes. And the test is one question: did a person decide? If yes, it is the potential. If the world is simply like that, it is みえる or きこえる."
    examples:
      - { ja: "まどから やまが みえる。", en: "You can see the mountain from the window." }
      - { ja: "ばんは そらに ほしが みえる。", en: "You can see stars in the sky at night." }
      - { ja: "きっさてんで おんがくが きこえるから すきだ。", en: "You can hear music at the coffee shop, so I like it." }
      - { ja: "かわが みえるから この ホテルが すきだ。", en: "I like this hotel because you can see the river." }
      - { ja: "きっさてんの まどから さくらが みえるから よく いく。", en: "You can see cherry blossom from the coffee shop window, so I go often." }
    antiPattern: { ja: "まどから やまを みえる。", why: "みえる is never about what you DO to something — the visible thing takes が: まどから やまが みえる。" }

  - id: no-ga-jouzu
    rule: "じょうず means skilled, and it is a な-adjective, so it finishes with だ the way げんきだ does. To say what someone is good AT, take the verb, turn it into a thing with の, and mark that thing with が: 「およぐのが じょうずだ」, good at swimming. That の is module 13's の — the one that turned たべる into something you could like — and here it turns a verb into something you can be good at. The frame is 〜のが じょうずだ and it does not vary. A noun can sit there instead with no の at all: 「うたが じょうずだ」, good at singing. Now the rule that matters more than the grammar. じょうず is what you say about OTHER people. Calling yourself じょうず lands as boasting in a way the English good at simply does not, so Japanese speakers use it generously about their friends and stay quiet about themselves. Say it about other people as often as you can — it is one of the kindest words in the language — and use the next lesson's word about yourself."
    examples:
      - { ja: "ミカは およぐのが じょうずだから よく かわに いく。", en: "Mika is good at swimming, so she often goes to the river." }
      - { ja: "トムは りょうりを するのが じょうずだから いつも おいしい。", en: "Tom is good at cooking, so it's always delicious." }
      - { ja: "たなかせんせいは はなすのが じょうずだ。", en: "Tanaka is good at speaking." }
      - { ja: "あねは うたが じょうずだけど ぼくは ばんに きく。", en: "My older sister is good at singing, but I only listen in the evening." }
      - { ja: "ケンは じてんしゃに のるのが じょうずだ。", en: "Ken is good at riding a bicycle." }
    antiPattern: { ja: "ミカは およぐが じょうずだから よく かわに いく。", why: "が cannot sit straight on a verb — の turns およぐ into a thing first: ミカは およぐのが じょうずだから よく かわに いく。" }

  - id: no-ga-heta
    rule: "へた is the opposite word and it is the one you use about yourself. Same frame exactly — 〜のが へただ — and the same な-adjective ending: 「あるくのが へただ」. Where じょうず is for other people, へた is for you, and it is not the confession English makes it sound like: 「ぼくは りょうりを するのが へただ」 is modest, ordinary and completely unremarkable to say. It is also how a Japanese speaker deflects a compliment, so you will hear it constantly right after somebody has praised something. Two more things. First, へた says a skill is not there yet; it is not a judgement about a person. Second, if you want to say someone ELSE is not good at something, へた is too blunt and the polite move is a negative instead: 「あまり じょうずじゃない」, not very good. あまり has been sitting in your vocabulary since module 9 waiting for a negative to stand in front of, and this is it."
    examples:
      - { ja: "ぼくは りょうりを するのが へただから きっさてんに いく。", en: "I'm bad at cooking, so I go to the coffee shop." }
      - { ja: "ぼくは じてんしゃに のるのが へただから だいがくまで あるく。", en: "I'm bad at riding a bicycle, so I walk to university." }
      - { ja: "ぼくは うたが へただけど たのしいから うたを きく。", en: "I'm bad at singing, but it's fun, so I listen to songs." }
      - { ja: "ケンは およぐのが あまり じょうずじゃない。", en: "Ken isn't very good at swimming." }
      - { ja: "あねは およぐのが あまり じょうずじゃないけど かわが すきだ。", en: "My older sister isn't very good at swimming, but she likes the river." }
    antiPattern: { ja: "ぼくは りょうりを するのが へたいから きっさてんに いく。", why: "へた is a な-adjective and finishes with だ, never い: ぼくは りょうりを するのが へただから きっさてんに いく。" }

  - id: mashou
    rule: "ましょう is let's. Take the ます-form, take ます off, put ましょう in its place: たべます → たべましょう, いきます → いきましょう, のみます → のみましょう, ききます → ききましょう. する is irregular here as everywhere and becomes しましょう. Two things about it are worth knowing before you use it. It is POLITE — ましょう is built on the ます layer, so it belongs with a teacher, in a shop, with a group you have only just met. And it is CONFIDENT: ましょう assumes everyone already agrees. 「いっしょに たべましょう」 is let's eat together, said as a decision that has gone your way rather than a question. いっしょに means together and sits at the front of the sentence, in front of the object and everything else. So use ましょう when the plan is obvious and welcome — the bill has arrived, the lesson has finished, everybody is hungry. When you are not sure the other person wants to, ましょう is too strong, and the next lesson has the word for that."
    examples:
      - { ja: "いっしょに たべましょう。", en: "Let's eat together." }
      - { ja: "きっさてんで コーヒーを のみましょう。", en: "Let's drink coffee at the coffee shop." }
      - { ja: "あした いっしょに としょかんに いきましょう。", en: "Let's go to the library together tomorrow." }
      - { ja: "じかんが あるから かいものを しましょう。", en: "We have time, so let's do the shopping." }
      - { ja: "げんきだから かわで およぎましょう。", en: "We're well, so let's swim in the river." }
    antiPattern: { ja: "いっしょに たべるましょう。", why: "ましょう replaces ます on the ます-form, never the dictionary form: いっしょに たべましょう。" }

  - id: masenka
    rule: "ませんか is the same invitation with the door left open. It is literally the polite negative plus か — won't you eat? — and that negative is doing real work: by asking whether you will NOT, it makes saying no easy, which is exactly why it is the polite way to invite somebody who might not want to come. Put the two side by side. 「いっしょに たべませんか」 offers. 「いっしょに たべましょう」 decides. Offer first; decide once they have said yes. Now the casual twin, which you will use far more than either. Drop the polite layer entirely, use the ない-form, and let your voice rise: 「いっしょに たべない？」 — wanna eat? That is the plain-form invitation and it is what friends actually say to each other. So there are three rungs and one meaning: 「たべない？」 to a friend, 「たべませんか」 to anybody else, 「たべましょう」 once it is settled. Nothing else moves — いっしょに still sits at the front, the object still takes を, and the verb is the only thing that changes register."
    examples:
      - { ja: "いっしょに たべませんか。", en: "Won't you eat with me?" }
      - { ja: "あした えいがを みませんか。", en: "Won't you watch a film tomorrow?" }
      - { ja: "いっしょに たべない？", en: "Wanna eat together? — to a friend" }
      - { ja: "あした きっさてんに いきませんか。", en: "Won't you go to the coffee shop tomorrow?" }
      - { ja: "あした うちに こない？", en: "Wanna come over tomorrow? — to a friend" }
    antiPattern: { ja: "いっしょに たべるませんか。", why: "ません attaches to the ます-form, never the dictionary form: いっしょに たべませんか。" }

newAtoms:
  # ══ L1. The three う-verb potentials the module opens on. Every one is a NEW
  #    courseAtoms row (no lexicon here can spell a potential — `ChainForm` has
  #    no `potential` cell) and every one was checked against the whole live
  #    corpus for zero prior occurrences before registration. All are
  #    `imageable: false`: an inflection has no referent a picture could name,
  #    and 🥤 / 🚶 / 🏊 belong to のむ / いく / およぐ already.
  - { kana: のめる, romaji: nomeru, gloss: "can drink (potential of のむ)", shortGloss: "can drink", imageable: false, kind: verb }
  - { kana: いける, romaji: ikeru, gloss: "can go (potential of いく)", shortGloss: "can go", imageable: false, kind: verb }
  - { kana: およげる, romaji: oyogeru, gloss: "can swim (potential of およぐ)", shortGloss: "can swim", imageable: false, kind: verb }
  # ══ L2. The る-verb + irregular potentials, and the ら抜き pair. たべれる and
  #    みれる are RECOGNITION ONLY — they debut on the L2 rule card (labelled in
  #    the English) and appear only in listening comprehension and dialogue,
  #    never in a build, translate or speaking target anywhere in the course.
  - { kana: たべられる, romaji: taberareru, gloss: "can eat (potential of たべる)", shortGloss: "can eat", imageable: false, kind: verb }
  - { kana: みられる, romaji: mirareru, gloss: "can watch (potential of みる)", shortGloss: "can watch", imageable: false, kind: verb }
  - { kana: こられる, romaji: korareru, gloss: "can come (potential of くる)", shortGloss: "can come", imageable: false, kind: verb }
  - { kana: たべれる, romaji: tabereru, gloss: "can eat (casual ら-dropped form)", shortGloss: "can eat (casual)", imageable: false, kind: verb }
  - { kana: みれる, romaji: mireru, gloss: "can watch (casual ら-dropped form)", shortGloss: "can watch (casual)", imageable: false, kind: verb }
  # ══ L3. する's suppletive potential. できる already has a courseAtoms row
  #    under a stale old-course m23 tag and is in NO neo module's priorVocab,
  #    so it is declared here for provenance — the m15-m23 move.
  - { kana: できる, romaji: dekiru, gloss: "can do it, to be able to", shortGloss: "can do", imageable: false, kind: verb }
  # ══ L5. The negative potential — m6's ない-form on a new stem. もの is the
  #    ONE under-exposed CEJC top-150 word in the whole course (#56, ×2, both
  #    inside かいもの) and inv 27 puts it here; it already has a courseAtoms
  #    row, so this declaration is provenance only.
  - { kana: のめない, romaji: nomenai, gloss: "can't drink (negative potential of のむ)", shortGloss: "can't drink", imageable: false, kind: verb }
  - { kana: たべられない, romaji: taberarenai, gloss: "can't eat (negative potential of たべる)", shortGloss: "can't eat", imageable: false, kind: verb }
  - { kana: できない, romaji: dekinai, gloss: "can't do it, isn't possible", shortGloss: "can't do", imageable: false, kind: verb }
  - { kana: もの, romaji: mono, gloss: "a thing", shortGloss: "thing", imageable: false, kind: vocab }
  # ══ L6. Spontaneous perception — NOT the potential, which is the whole point
  #    of the card. 👁️ is みる's and め's; 👂 is みみ's and きく's.
  - { kana: みえる, romaji: mieru, gloss: "to be visible, to be in sight", shortGloss: "is visible", imageable: false, kind: verb }
  - { kana: きこえる, romaji: kikoeru, gloss: "to be audible, to reach the ear", shortGloss: "is audible", imageable: false, kind: verb }
  # ══ L7. Good at. じょうず has a row with 👌 — which is ALSO だいじょうぶ's, a
  #    MET word, so the debut MCQ would draw a distractor the picture names
  #    just as well (the m19 ruling). `imageable: false`.
  - { kana: じょうず, romaji: jouzu, gloss: "skillful, good at", shortGloss: "good at", imageable: false, kind: vocab }
  - { kana: はなせる, romaji: hanaseru, gloss: "can speak (potential of はなす)", shortGloss: "can speak", imageable: false, kind: verb }
  # ══ L9. Bad at. へた's 👎 is unique among MET words, but the `no-ga-heta`
  #    card must name へた and a `kind: rule` beat compiles to a PINNED step
  #    ahead of the interleaved middle, so the card would steal the debut
  #    (m20/m21 rule, m22's いたい precedent). `imageable: false`.
  - { kana: へた, romaji: heta, gloss: "unskillful, bad at", shortGloss: "bad at", imageable: false, kind: vocab }
  - { kana: あるける, romaji: arukeru, gloss: "can walk (potential of あるく)", shortGloss: "can walk", imageable: false, kind: verb }
  # ══ L10. ましょう is a BOUND SUFFIX (inv 41) — checked against the whole live
  #    corpus first, ZERO Japanese surfaces contain it. しましょう is registered
  #    WHOLE because する's ます-stem し is 四 "four": a bare し tile would credit
  #    the number. いっしょ's 👫 is ともだち's, a met word — `imageable: false`.
  - { kana: ましょう, romaji: mashou, gloss: "let's ~ (polite suggestion, on the ます-stem)", shortGloss: "let's ~", imageable: false, kind: vocab }
  - { kana: しましょう, romaji: shimashou, gloss: "let's do it (polite suggestion)", shortGloss: "let's do", imageable: false, kind: vocab }
  - { kana: いっしょ, romaji: issho, gloss: "together", shortGloss: "together", imageable: false, kind: vocab }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m24-neo-1
    role: teaching
    title: "「おさけが のめる」 — the え row and る"
    focus: "う-verb potential: slide to the え row, add る, and を becomes が"
    introduces: [のめる, いける, およげる]
    beats:
      - { kind: rule, grammarPointId: potential-form }
      - { kind: sentence, ja: "はたちだから おさけが のめる。", en: "I'm twenty, so I can drink sake", exercises: [potential-form, kara-because, counter-sai], mode: build }
      - { kind: sentence, ja: "げんきだから かわで およげる。", en: "I'm well, so I can swim in the river", exercises: [potential-form, kara-because, de-action], mode: build }
      - { kind: sentence, ja: "じかんが あるから きっさてんに いける。", en: "I have time, so I can go to the coffee shop", exercises: [potential-form, ga-existence, kara-because, ni-location], mode: build }
      - { kind: sentence, ja: "あさは コーヒーが のめるけど ばんは ぎゅうにゅうを のむ。", en: "I can drink coffee in the morning, but at night I drink milk", exercises: [potential-form, wa-topic, kedo, wo-object], mode: build }
      - { kind: sentence, ja: "ミカは あした くうこうに いける。", en: "Mika can go to the airport tomorrow", exercises: [potential-form, wa-topic, ni-location], mode: listening }
      - { kind: sentence, ja: "ケンは じてんしゃで だいがくに いける。", en: "Ken can get to university by bicycle", exercises: [potential-form, de-action, ni-location, wa-topic], mode: build }
      - { kind: sentence, ja: "じてんしゃが ないけど がっこうまで いける。", en: "I have no bicycle, but I can get as far as school", exercises: [potential-form, nai-existence, kedo, made-until], mode: build }
      - { kind: sentence, ja: "おさけが のめる。", en: "Say to a friend: I can drink sake", exercises: [potential-form], mode: translate }
      - { kind: particle-cloze, stem: "じかんが あるから きっさてんに ", tail: "。", answer: "いける", options: ["いける", "いく", "いった"], en: "I have time, so I can go to the coffee shop", explanation: "いく moves to the え row and adds る — いける, I can go. いく is the plain dictionary form and いった is the past." }
      - { kind: listening-comp, audio: "トムは かわで およげる。", answer: "Tom can swim in the river", distractors: ["Tom can't swim in the river", "Tom swam in the river", "Tom wants to swim in the river"], exercises: [potential-form, wa-topic] }
      - { kind: listening-comp, audio: "ミカは はたちだから おさけが のめる。", answer: "Mika is twenty, so she can drink sake", distractors: ["Mika is twenty, so she drinks sake every night", "Mika isn't twenty, so she can't drink sake", "Mika is twenty, and she has drunk sake before"], exercises: [potential-form, kara-because] }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "おさけが のめる？", en: "Can you drink sake?" }
          - { speaker: "Tom", ja: "うん。はたちだから のめる。", en: "Yeah. I'm twenty, so I can." }
        questions:
          - { q: "Why can Tom drink sake?", options: ["He is twenty", "He is a student", "He is Japanese", "He is at a coffee shop"], answer: "He is twenty" }
      - { kind: challenge, ja: "はたちだから おさけが のめるけど あさは コーヒーを のむ。", en: "I'm twenty, so I can drink sake, but in the morning I drink coffee", combines: [potential-form, kara-because, kedo, wa-topic, wo-object], mode: build }
    reviewPool: [おさけ, コーヒー, ぎゅうにゅう, きっさてん, だいがく, じてんしゃ, くうこう, かわ, はたち, じかん]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m24-neo-2
    role: teaching
    title: "「すしが たべられる」 — られる, and the ら people drop"
    focus: "る-verbs attach られる; くる → こられる; ら抜き is heard, not spoken"
    introduces: [たべられる, みられる, こられる, たべれる, みれる]
    beats:
      - { kind: rule, grammarPointId: potential-rareru }
      - { kind: sentence, ja: "きっさてんで すしが たべられる。", en: "You can eat sushi at the coffee shop", exercises: [potential-rareru, de-action], mode: build }
      - { kind: sentence, ja: "としょかんで えいがが みられるから よく いく。", en: "You can watch films at the library, so I go often", exercises: [potential-rareru, de-action, kara-because, frequency-adverbs], mode: build }
      - { kind: sentence, ja: "ひまだから あした ミカも こられる。", en: "Mika is free, so she can come tomorrow too", exercises: [potential-rareru, na-adj-present, kara-because, mo-also], mode: build }
      - { kind: sentence, ja: "なつやすみだから ケンも うちに こられる。", en: "It's the summer holidays, so Ken can come over too", exercises: [potential-rareru, kara-because, mo-also, ni-location], mode: build }
      - { kind: sentence, ja: "ばんに えいがが みられる。", en: "I can watch a film in the evening", exercises: [potential-rareru, ni-time], mode: listening }
      - { kind: sentence, ja: "ホテルで にほんの りょうりが たべられる。", en: "You can eat Japanese food at the hotel", exercises: [potential-rareru, de-action, no-possession], mode: build }
      - { kind: sentence, ja: "あした こられるけど ばんは いそがしい。", en: "I can come tomorrow, but I'm busy in the evening", exercises: [potential-rareru, kedo, wa-topic, i-adj-present], mode: build }
      - { kind: sentence, ja: "すしが たべられる。", en: "Say to a friend: I can eat sushi", exercises: [potential-rareru], mode: translate }
      - { kind: particle-cloze, stem: "としょかんで えいがが ", tail: "から よく いく。", answer: "みられる", options: ["みられる", "みる", "みた"], en: "You can watch films at the library, so I go often", explanation: "みる is a る-verb, so it drops る and adds られる — みられる. みる is the dictionary form and みた is the past." }
      - { kind: listening-comp, audio: "ケンは すしが たべれる。", answer: "Ken can eat sushi — said the casual ら-dropped way", distractors: ["Ken can't eat sushi", "Ken ate sushi", "Ken wants to eat sushi"], exercises: [potential-rareru, wa-topic] }
      - { kind: listening-comp, audio: "あした えいがが みれる。", answer: "I can watch a film tomorrow — said the casual ら-dropped way", distractors: ["I watched a film yesterday", "I can't watch a film tomorrow", "I want to watch a film tomorrow"], exercises: [potential-rareru] }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "すしが たべられる？", en: "Can you eat sushi?" }
          - { speaker: "Tom", ja: "うん、たべれる。ホテルで たべた。", en: "Yeah, I can. I had some at the hotel." }
        questions:
          - { q: "Where did Tom eat sushi?", options: ["At the hotel", "At the library", "At the coffee shop", "He has never eaten it"], answer: "At the hotel" }
      - { kind: challenge, ja: "ホテルで にほんの りょうりが たべられるけど ちょっと たかい。", en: "You can eat Japanese food at the hotel, but it's a bit expensive", combines: [potential-rareru, de-action, no-possession, kedo, i-adj-present], mode: build }
    reviewPool: [のめる, いける, およげる, すし, えいが, としょかん, ホテル, りょうり, なつやすみ, うち]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m24-neo-3
    role: teaching
    title: "「りょうりが できる」 — the verb that replaces する"
    focus: "する has no potential — できる does the job, and it takes a NOUN"
    introduces: [できる]
    beats:
      - { kind: rule, grammarPointId: dekiru }
      - { kind: sentence, ja: "にほんの りょうりが できる。", en: "I can cook Japanese food", exercises: [dekiru, no-possession], mode: build }
      - { kind: sentence, ja: "げんきだから あした さんぽが できる。", en: "I'm well, so I can go for a walk tomorrow", exercises: [dekiru, na-adj-present, kara-because], mode: build }
      - { kind: sentence, ja: "あさは じかんが あるから かいものが できる。", en: "I have time in the morning, so I can do the shopping", exercises: [dekiru, wa-topic, ga-existence, kara-because], mode: build }
      - { kind: sentence, ja: "なつやすみに りょこうが できるから きっぷを かう。", en: "I can travel in the summer holidays, so I'm buying a ticket", exercises: [dekiru, ni-time, kara-because, wo-object], mode: build }
      - { kind: sentence, ja: "ひまな とき うちで りょうりが できる。", en: "When I'm free, I can cook at home", exercises: [dekiru, toki, de-action], mode: listening }
