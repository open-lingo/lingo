notes: |
  m45 · n4-16 — CAUSATIVE させる (docs/spine-n4.md §n4-16,
  docs/ja-m45-brief-2026-09-10.md). Ships 12 lessons (inv 25: 8 teaching +
  3 review + 1 challenge, challenge last, reviews at positions 4/8/11 —
  matching m40-m44's own placement). Lesson ids follow m43's own
  non-skipping convention (1,2,3,review-1,4,5,6,review-2,7,8,review-3,
  challenge), not m40/m41's skip-4/skip-8 convention — both are attested
  precedents, this module picked the cleaner one.

  ENGINEERING PRE-WORK (done and verified green before any lesson content
  was written, per inv 49 — a conjugation_transform step must never drill
  a form with no ruleset):
  - `causative` added to TRANSFORM_RULESETS (transformRulesets.ts) —
    godan naiStem+せる (よむ→よませる canonical), ichidan +させる
    (たべる→たべさせる canonical), する→させる, くる→こさせる — mirroring
    passive's (m40) table shape exactly. RULESET_ALTERNATES.causative
    added too (よむ→かう, たべる→みる leak-masking alternates), matching
    passive's full-coverage choice. transformRulesets.test.ts green.
  - KEY FINDING (generalizes m40's own practice, resolves an open question
    the brief flagged): the tokenizer/ramp auto-generator (moduleCompiler.ts
    ~1150-1300) NEVER auto-derives a full conjugated surface from
    VERB_ENTRIES — only masu-STEMS are auto-derived (for constructions like
    〜に いく). This means EVERY causative-conjugated kana surface actually
    used in a sentence/dialogue/challenge beat needs a hand-registered
    `kind: verb-form` newAtom with `derivedFrom`+`verbClass`, REGARDLESS of
    whether the base verb (よむ/たべる/する/くる/あるく/かえる — all
    VERB_ENTRIES members) is "safe." VERB_ENTRIES membership only affects
    the ruleset-table auto-fill and masu-STEM tokenizer entries, never
    full-form sentence-content registration.

  DECISIONS INFERRED (no user turn to ask; reasoned from the brief + spine
  + doctrine, recorded here per "never park a question"):
  1. **まかせる kept 100% dictionary-form, zero causative inflections** —
     the brief's own "awkward as a causative host, likely skip" guidance.
     It appears only as plain vocab (L4), entrusting-something-to-someone,
     not conjugated into the causative itself.
  2. **そだてる gets exactly ONE hand-registered causative surface**
     (そだてさせる, L6) for the MAKE-vs-LET "deepen" lesson, per the
     brief's own recommendation — used to generalize MAKE-vs-LET from
     PARTICLE choice (L4, intransitive あるく: を vs に) to
     CONTEXT/ADVERB choice (L6, transitive そだてる: に is fixed since
     を is already taken by the direct object いぬ; むりやり's presence
     or absence carries the MADE-vs-LET reading instead). This is
     linguistically accurate (transitive causatives can't reassign を to
     the causee) and pedagogically distinct from L4's mechanism, not a
     repeat.
  3. **ゆるす gets one hand-registered NAI-FORM** (ゆるさない, L7) — not
     a causative form at all, needed for the natural idiom きそくは
     それを ゆるさない ("the rules don't allow that"), tying きそく+ゆるす
     together. Counted toward the brief's "2-4 extra newAtoms for these
     three risk verbs" budget (used: 2 — そだてさせる, ゆるさない — plus
     まかせる needing zero).
  4. **させていただく forward-flags to m50/n4-21** — CONFIRMED (not just
     matched to the brief's provisional guess) via direct docs/spine-n4.md
     read: m50/n4-21's own header is "Keigo II — 謙譲語 +
     〜させていただく (+ causative-passive)" and its body states
     "〜させていただく = causative (m45) + humble receiving (m35)."
     L8 here is therefore strictly RECOGNITION ONLY — させていただく never
     appears in a `sentence`/build/particle-cloze/challenge beat, only in
     the grammarPoint's own rule prose (unregistered, mirrors passive-form's
     かう→かわれる prose-only precedent) and one comprehension-only
     listening-comp beat. させて (L7's own te-form of する's causative) and
     いただく (already known, m31, recognition-only there too) are both
     independently registered, so a recognition-only exposure sentence is
     safe without adding any new atom for the fused phrase itself.
  5. **NEVER させられる/よまれさせる/any causative+passive stack anywhere
     in this module** — that is m50's exclusive job (causative-passive).
     Checked every authored sentence by hand for this.
  6. **そうじする cash-in (courseAtoms.ts) kept OUT of `newAtoms` below**,
     appearing only in L3's `introduces` + its own sentence text — mirrors
     the m43 ぜったい / m44 どうしたの precedent exactly (a cashed-in atom
     is already a registered lemma; only the lesson-scoping array needs
     it). そうじする's own causative form (そうじさせる) was deliberately
     NOT authored — L3 keeps そうじする in a single plain vocab-priming
     sentence, and the irregular-causative ramp uses bare させる (from
     する) via しゅくだいを させる instead, avoiding an extra fused-verb
     causative registration for no pedagogical gain.
  7. **はやく (adverbial form of the already-known い-adjective はやい,
     m13) needed its own `adj-form` newAtom** — the same STEMS-only-does-
     masu-stems gap applies to い-adjective く-forms, not just verb
     conjugations; caught while drafting L7's かえらせて ください sentence.
  8. Two carrier atoms used purely in sentence/reviewPool text, never
     re-declared in `newAtoms` and never in any lesson's `introduces`:
     しゅくだい (m32) and こまる (m35, but only via its own new past-tense
     surface こまった — see L2 below, mirrors m40's こたえた precedent for
     an already-known lemma's not-yet-registered past tense).
  9. Two brief inconsistencies noted for the record, neither blocking:
     the brief's worked-example chip once named のむ where the spine and
     the shipped transformRulesets.ts both consistently use よむ as the
     godan canonical — よむ was followed throughout. The brief also
     asserted "よむ taught m1"; courseAtoms.ts / conjugationTables.ts
     confirm よむ's actual `introducedAtModule` is m7 — immaterial either
     way since m7 « m45, but corrected for the record.
grammarPoints:
  - id: causative-form
    variant: godan
    conjugation: { form: causative, classes: [u] }
    rule: "The causative makes/lets someone else do something. For a godan (u-verb), bend the dictionary form's final -u sound back to its -a partner — the same naiStem you already use for ない and volitional — then add せる: よむ → よま + せる = よませる, 'make/let (someone) read.' かく → かかせる, はなす → はなさせる, かえる → かえらせる — every godan verb follows this one move. The MEANING (make vs let) is never in the verb itself — it rides the particle marking the person caused to act, covered next lesson."
    examples:
      - { ja: "よむ → よませる", en: "to read → to make/let (someone) read" }
      - { ja: "かく → かかせる", en: "to write → to make/let (someone) write" }
      - { ja: "はなす → はなさせる", en: "to speak → to make/let (someone) speak" }
      - { ja: "かえる → かえらせる", en: "to return → to make/let (someone) return" }
    antiPattern: { ja: "よむせる", why: "せる only glues onto a verb stem that already ends in -a — an u-verb has to bend FIRST: よむ → よま, then + せる. よませる, never よむせる." }
  - id: causative-form
    variant: ichidan-irregular
    conjugation: { form: causative, classes: [ru, irregular] }
    rule: "An ichidan (ru-verb) does what it always does — drop る, add the ending whole: たべる → たべ + させる = たべさせる, 'make/let (someone) eat.' みる → みさせる follows the same move. The two irregulars are two words to memorize outright: する → させる, くる → こさせる. Notice godan せる and ichidan させる are close cousins — both are 'the verb, plus something-seru' — but only ichidan (and both irregulars) get the extra さ."
    examples:
      - { ja: "たべる → たべさせる", en: "to eat → to make/let (someone) eat" }
      - { ja: "みる → みさせる", en: "to watch/see → to make/let (someone) watch" }
      - { ja: "する → させる", en: "to do → to make/let (someone) do" }
      - { ja: "くる → こさせる", en: "to come → to make/let (someone) come" }
    antiPattern: { ja: "たべせる", why: "an ichidan verb needs the FULL させる ending, not just せる — たべ+させる. Dropping the さ is a godan move borrowed onto the wrong class." }
  - id: causative-make-vs-let
    variant: intransitive
    rule: "The causative verb never tells you MAKE vs LET by itself — the PARTICLE marking the person caused to act does, and for an intransitive verb (jidoushi — you already own this family from m33/m41) you get a real choice: を marks them as being MADE/FORCED, に marks them as being LET/PERMITTED. こどもを あるかせた, 'made the child walk' (forced) — こどもに あるかせた, 'let the child walk' (permitted) — same verb あるかせた, opposite reading, only the particle moves. This works because あるく never had its own を to begin with (it's intransitive), so を is free to be repurposed as the forced-causee marker."
    examples:
      - { ja: "おやは こどもを あるかせた。", en: "The parent made the child walk." }
      - { ja: "おやは こどもに あるかせた。", en: "The parent let the child walk." }
      - { ja: "せんせいは がくせいを あるかせた。", en: "The teacher made the student walk." }
    antiPattern: { ja: "おやは むりやり こどもに あるかせた。", why: "むりやり ('forcibly') signals that the child was MADE to walk — but に marks the causee as being LET, not forced, and those two signals contradict each other. The forced reading needs を instead: おやは むりやり こどもを あるかせた。" }
  - id: causative-make-vs-let
    variant: transitive
    rule: "A TRANSITIVE verb (tadoushi) already owns を for its own direct object, so the causee can only take に — こどもに やさいを たべさせる, 'made/let the child eat vegetables,' never こどもを やさいを (two を in one clause is never legal). With を unavailable, MAKE vs LET has to be read from CONTEXT and adverbs instead of the particle: むりやり ('forcibly') signals the MADE reading unambiguously — おやは こどもに むりやり いぬを そだてさせる, 'forcibly made the child raise the dog.' Drop むりやり and the same そだてさせる leans toward the neutral/LET reading instead."
    examples:
      - { ja: "おやは こどもに むりやり いぬを そだてさせる。", en: "The parent forcibly makes the child raise the dog." }
      - { ja: "おやは こどもに いぬを そだてさせる。", en: "The parent lets the child raise the dog." }
      - { ja: "おやは こどもに むりやり やさいを たべさせる。", en: "The parent forcibly makes the child eat vegetables." }
    antiPattern: { ja: "おやは こどもを いぬを そだてさせる。", why: "a transitive verb's causee can never take を — いぬ already has it. The causee always takes に with a transitive causative: こどもに いぬを そだてさせる。" }
  - id: causative-request
    rule: "Two everyday requests both ride the causative's て-form. させて ください asks permission to do something YOURSELF — しゅくだいを させて ください, 'please let me do the homework.' させて もらう describes RECEIVING that permission, riding the favor-ladder (m35) you already own — せんせいに しゅくだいを させて もらう, 'I get to do the homework (thanks to the teacher letting me).' Both are humble, self-directed requests — never confuse them with ordering someone ELSE to do something, which stays plain させる with no て-chain."
    examples:
      - { ja: "しゅくだいを させて ください。", en: "Please let me do the homework." }
      - { ja: "かえらせて ください。", en: "Please let me go home." }
      - { ja: "せんせいに しゅくだいを させて もらう。", en: "I get to do the homework (with the teacher's permission)." }
    antiPattern: { ja: "しゅくだいを させて くれる。", why: "させて くれる would mean someone ELSE offered without being asked — a different rung of the same favor-ladder. Asking permission for yourself needs させて ください (the request) or させて もらう (describing that you received it), never くれる." }
  - id: causative-politeness-recognition
    rule: "One more shape to RECOGNIZE, not produce yet: させて いただく. It is させて もらう's own ultra-polite twin, built from causative-te plus the humble receiving verb いただく you already met (m31, recognition only there too) — しゅくだいを させて いただく, 'I humbly get to do the homework.' You will hear this constantly in formal Japanese (especially from someone about to do something, asking implicit permission first), but production — and its trickier cousin, the causative-PASSIVE させられる — waits until n4-21, where humble language gets its own full module."
    examples:
      - { ja: "しゅくだいを させて いただく。", en: "I humbly get to do the homework." }
      - { ja: "しつもんを させて いただいた。", en: "I humbly got to ask a question." }
    antiPattern: { ja: "しゅくだいを させられる。", why: "させられる is the CAUSATIVE-PASSIVE — 'I am made to do the homework' (unwillingly) — a completely different, much later shape (n4-21). させて いただく is a humble, WILLING request-and-receive; never confuse the two just because both start with させ." }

