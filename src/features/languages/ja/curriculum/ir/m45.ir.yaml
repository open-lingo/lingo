  - id: m45-neo-5
    role: teaching
    title: "「せんせいに しかられた」— passive comes back, spiral"
    focus: "Backward spiral: passive (m40) reviewed side-by-side with causative — same -られる/-せる suffix family, opposite direction, never stacked on one verb"
    introduces: []
    beats:
      - { kind: sentence, ja: "がくせいは せんせいに ほめられた。", en: "The student was praised by the teacher.", exercises: [passive-rareru], mode: build }
      - { kind: sentence, ja: "おやは こどもに ほんを よませる。", en: "The parent makes/lets the child read a book.", exercises: [causative-form], mode: build }
      - { kind: sentence, ja: "がくせいは せんせいに しかられた。", en: "The student was scolded by the teacher.", exercises: [passive-rareru], mode: build }
      - { kind: sentence, ja: "おやは こどもに しゅくだいを させる。", en: "The parent makes the child do homework.", exercises: [causative-form], mode: build }
      - { kind: sentence, ja: "せんせいは がくせいに がっこうに こさせる。", en: "The teacher makes the student come to school.", exercises: [causative-form], mode: listening }
      - { kind: particle-cloze, stem: "がくせいは せんせい", tail: " しかられた。", answer: "に", options: ["に", "を", "によって"], en: "The student was scolded by the teacher.", explanation: "The passive agent — who did the scolding — takes に, exactly like the causer's target does with causative. を would make the teacher the one being scolded; によって is reserved for the more formal creation/authorship pattern (m40), not an everyday action like scolding." }
      - { kind: listening-comp, audio: "こどもは せんせいに ほめられた。", answer: "The child was praised by the teacher.", distractors: ["The child praised the teacher.", "The teacher was scolded by the child.", "The child scolded the teacher."], q: "What does this mean?" }
