lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m45-neo-1
    role: teaching
    title: "「おやは こどもに ほんを よませる」— させる, the godan causative"
    focus: "Core formation: a godan verb bends to its a-row and adds せる — the causative makes/lets someone else act"
    introduces: [おや, よませる]
    beats:
      - { kind: rule, grammarPointId: causative-form, variant: godan }
      - { kind: sentence, ja: "おやは こどもに ほんを よませる。", en: "The parent makes/lets the child read a book.", exercises: [causative-form], mode: build }
