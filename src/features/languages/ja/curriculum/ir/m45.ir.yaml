  - id: m45-neo-4
    role: teaching
    title: "「こどもを あるかせた」「こどもに あるかせた」— MAKE vs LET, intransitive"
    focus: "The causative verb never says make-vs-let by itself — for an intransitive verb, the particle on the causee does: を forces, に permits"
    introduces: [まかせる, せわ, あるかせた]
    beats:
      - { kind: rule, grammarPointId: causative-make-vs-let, variant: intransitive }
      - { kind: sentence, ja: "おやは こどもに しゅくだいを まかせる。", en: "The parent entrusts the homework to the child.", exercises: [], mode: build }
      - { kind: sentence, ja: "おやは いぬの せわを こどもに まかせる。", en: "The parent entrusts the dog's care to the child.", exercises: [no-possession], mode: build }
      - { kind: sentence, ja: "おやは こどもを あるかせた。", en: "The parent made the child walk.", exercises: [causative-make-vs-let], mode: build }
      - { kind: sentence, ja: "おやは こどもに あるかせた。", en: "The parent let the child walk.", exercises: [causative-make-vs-let], mode: build }
      - { kind: sentence, ja: "せんせいは がくせいを あるかせた。", en: "The teacher made the student walk.", exercises: [causative-make-vs-let], mode: listening }
      - { kind: particle-cloze, stem: "せんせいは がくせいを ある", tail: "。", answer: "かせた", options: ["かせた", "いた", "かせる"], en: "The teacher made the student walk (past).", explanation: "あるく is a godan verb — bend to the a-row first (ある→あるか), add せた for past causative. あるいた is just plain past 'walked,' not causative at all." }
      - { kind: listening-comp, audio: "おやは こどもに あるかせた。", answer: "The parent let the child walk.", distractors: ["The parent made the child walk.", "The parent forbade the child from walking.", "The child made the parent walk."], q: "What does this mean?" }
      - { kind: listening-comp, audio: "おやは いぬの せわを こどもに まかせる。", answer: "The parent entrusts the dog's care to the child.", distractors: ["The parent takes care of the dog themselves.", "The child refuses to take care of the dog.", "The dog takes care of the child."], q: "What does this mean?" }
      - { kind: kanji, kana: せわ, kanji: 世話, distractors: ["せかい", "せんせい", "せなか"], exercises: [] }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "いぬの せわは だれが する？", en: "Who takes care of the dog?" }
          - { speaker: "Ken", ja: "こどもに まかせるよ。", en: "I leave it to the child." }
          - { speaker: "Mika", ja: "いいね。", en: "Nice." }
        questions:
          - { q: "Who takes care of the dog?", options: ["The child", "Ken", "Mika", "Nobody"], answer: "The child" }
      - kind: sim
        scene: { emoji: "🚶", title: "あるかせる？あるかせない？", setting: "Deciding whether to make or let the child walk to school." }
        turns:
          - npc: { speaker: "Mika", ja: "がっこうまで あるかせる？", en: "Will you make/let (them) walk to school?" }
            goal: "Say you'll make the child walk (force it)."
            reply: { mode: build, tiles: ["こどもを", "こどもに", "あるかせる", "。"], answer: "こどもを あるかせる。" }
            replyGloss: "I'll make the child walk."
            explanation: "を marks the causee as FORCED — こどもを あるかせる is 'make the child walk,' not 'let.'"
          - npc: { speaker: "Mika", ja: "きょうは むずかしいね。", en: "Today's hard, huh." }
            goal: "Say you'll let the child walk instead (permit)."
            reply: { mode: build, tiles: ["こどもを", "こどもに", "あるかせる", "。"], answer: "こどもに あるかせる。" }
            replyGloss: "I'll let the child walk."
            explanation: "に marks the causee as PERMITTED — こどもに あるかせる is 'let the child walk,' the opposite reading from を with the exact same verb."
      - { kind: challenge, ja: "せんせいも がくせいを あるかせた。", en: "The teacher, too, made the student walk.", combines: [causative-make-vs-let, mo-also, ta-form], mode: build }
    reviewPool: [こども, いぬ, しゅくだい, がっこう, だれ]

