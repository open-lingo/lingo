      - { kind: challenge, ja: "せんせいに しかられたから、おやは こどもに しゅくだいを させる。", en: "Since (the child) was scolded by the teacher, the parent makes the child do homework.", combines: [passive-rareru, causative-form, kara-because], mode: build }
    reviewPool: [せんせい, がくせい, しゅくだい, だいじょうぶ]

