lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m36-neo-1
    role: teaching
    title: "「おいしそう」 — what the eye reports"
    focus: "Cut the adjective's い, add そう — how it LOOKS before you know; いい→よさそう while the rule is fresh"
    introduces: [おいしそう, たかそう, おもしろそう, よさそう, やわらかい, かたい, やわらかそう, かたそう]
    beats:
      - { kind: rule, grammarPointId: sou-appearance, variant: adjective }
      - { kind: sentence, ja: "この りょうりは おいしそう。", en: "This dish looks tasty", exercises: [sou-appearance, kono-sono-ano-dono, wa-topic], mode: build }
      - { kind: sentence, ja: "その とけいは たかそう。", en: "That watch looks expensive", exercises: [sou-appearance, wa-topic], mode: build }
      - { kind: particle-cloze, stem: "その ケーキは ", tail: "。", answer: "おいしそう", options: ["おいしそう", "おいしい", "たかそう"], en: "That cake looks tasty", explanation: "そう reports what the EYE says, before the first bite — おいしそう. Plain おいしい claims you've already tasted it. たかそう comments on price, not taste at all." }
      - { kind: sentence, ja: "この パンは やわらかい。", en: "This bread is soft", exercises: [i-adj-present, kono-sono-ano-dono], mode: build }
      - { kind: listening-comp, audio: "この にくは かたい。", answer: "This meat is tough", distractors: ["This meat is soft", "This meat is delicious", "This meat is small"], q: "What does this mean?", explanation: "かたい describes the meat itself, tongue-tested — hard to bite or bend." }
      - { kind: sentence, ja: "この パンは やわらかそう。", en: "This bread looks soft", exercises: [sou-appearance], mode: build }
      - { kind: sentence, ja: "この にくは かたそう。", en: "This meat looks tough", exercises: [sou-appearance], mode: build }
      - { kind: sentence, ja: "きょうは てんきが よさそう。", en: "The weather looks good today", exercises: [sou-appearance, ga-existence], mode: build }
      - { kind: kanji, kana: りょうり, kanji: 料理, distractors: ["りょうい", "りゅうり", "りょうりつ"], exercises: [sou-appearance] }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "この みせの りょうり、おいしそうだね。", en: "This shop's food looks tasty, doesn't it." }
          - { speaker: "Tom", ja: "うん。あの とけいも たかそう。", en: "Yeah. That watch looks expensive too." }
          - { speaker: "Mika", ja: "この ほんは おもしろそう。", en: "This book looks interesting." }
        questions:
          - { q: "What does Tom say looks expensive?", options: ["A watch", "A book", "The food", "A bag"], answer: "A watch" }
      - { kind: challenge, ja: "この パンは やわらかそうだから、たべたい。", en: "This bread looks soft, so I want to eat it", combines: [sou-appearance, kara-because, v-tai], mode: build }
    reviewPool: [りょうり, とけい, ほん, パン, にく, ケーキ, てんき, えいが]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m36-neo-2
    role: teaching
    title: "「ふりそう」 — an event leaning forward"
    focus: "On verbs そう rides the ます-stem: about to happen — and the negatives ふらなさそう/ふりそうにない while it's fresh"
    introduces: [ふりそう, おちそう, はじまりそう, ふりそうにない, ふらなさそう, なさそう]
    beats:
      - { kind: rule, grammarPointId: sou-appearance, variant: verb }
      - { kind: sentence, ja: "あめが ふりそう。", en: "It looks like rain", exercises: [sou-appearance, ga-existence], mode: build }
      - { kind: sentence, ja: "かばんから さいふが おちそう。", en: "Your wallet looks about to fall out of your bag", exercises: [sou-appearance, ga-existence], mode: build }
