notes: |
  m36 · n4-07 — LOOKS LIKE / ATTACHMENT SITE (docs/spine-n4.md §m36). The
  spine's framing is the design: **an ATTACHMENT-SITE module.** Everything on
  screen hangs off the i-stem / adjective-stem the learner has owned since
  m7, so the load is semantic rather than morphological — which is the right
  shape for a module that must carry five items:

  1. **Stem/adj-stem + そう = "looks like" (L1 adjectives, L2 verbs).**
     おいしそう, たかそう; ふりそう, おちそう. ATTACHES TO THE STEM — the
     only tell that will later separate it from hearsay そうだ (n4-13, six
     modules out; the separation is DELIBERATE, never mention hearsay here).
  2. **The irregulars while the rule is fresh (L1/L2):** いい→よさそう,
     ない→なさそう; negatives 〜なさそう and 〜そうにない.
  3. **〜がる / 〜たがる (L5)** — third-person desire. This REPAIRS the N5
     binding constraint: "he wants" was BANNED in N5 because it needs たがる;
     this is the payoff. おとうとは いきたがっている。 Also plain がる on
     emotion adjectives (こわがる, はずかしがる) in L9.
  4. **〜やすい / 〜にくい (L6)** — stem + i-adjective, the same attachment
     site as たい (m13); the result CONJUGATES as an i-adjective.
  5. **〜ながら (L7)** — simultaneous action, also i-stem, so it belongs to
     this site and not to the timing module. Secondary-action rule: the
     ながら-clause is the background, the main clause is the point.
  6. **〜すぎる (m27) DEEPEN (L7/L9)** — same slot, harder spends
     (たべすぎた, しずかすぎる).

  DIALOGUE_SIM ×2:
    - L3, dinner at Mika's — REACTING is what そう is for: dishes arrive,
      the learner produces おいしそう！/ かたそう…; register-true friend
      scene.
    - L10, the sky over the park — Ken sees ふりそうな sky; the learner
      reads the look of things and pivots plans with m34's volitional
      (うちで えいがを みよう) — the module's appearance-grammar driving a
      real decision, and a deliberate m34 spiral.

  VOCAB (spine must/prefer vs docs/context/m36-context.md): おもい・つかれる・
  だいじょうぶ are ALREADY TAUGHT (carriers). New i-adjs かなしい・さびしい・
  かるい・やわらかい・かたい・こわい・はずかしい・ねむい; verbs ふとる(u)・
  やせる(ru); な-adjs あんぜん・きけん・べんり・ふべん. CUT: じょうぶ (room;
  べんり/ふべん carry the な-adj slot). Image debuts (vendoring checked at
  wiring): ねむい 😪, かなしい 😢, こわい 😱(?), きけん ⚠️(?) — wiring stage
  verifies each glyph is vendored + honest, blocks otherwise per precedent.

  ATTACHMENT SURFACES ARE ATOMS (the m33-prep tokenizer law, and this module
  is made of them): おいしそう does NOT tokenize (おいしい loses its い), so
  EVERY 〜そう/〜やすい/〜にくい/〜ながら/〜がる/〜たがる surface a beat uses
  is registered below as `adj-form`/`verb-form` with `derivedFrom`. EXPANSION
  AGENT: keep the ledger EXACTLY matching beat usage, as in m34/m35.

grammarPoints:
  # RULE-CARD VOCABULARY NOTE: no card names a module image-debut word before
  # its lesson; cards argue from りょうり/あめ/えいが/しゅくだい, owned for
  # tens of modules.

  - id: sou-appearance
    variant: adjective
    rule: "Take an adjective, cut its tail, add そう — and you are reporting how something LOOKS before you have tried it. おいしい → おいしそう: it looks tasty, says the eye, not the tongue. たかい → たかそう, looks expensive. The い goes; そう sits on the bare stem. Two irregulars, learned now while the rule is fresh: いい becomes よさそう (looks good), and ない becomes なさそう (looks like there isn't). What you get behaves like a な-adjective: おいしそうな りょうり, a tasty-looking dish. The whole point of the form is the gap between looks and knowledge — you say おいしそう BEFORE the first bite; after it, you just say おいしい."
    examples:
      - { ja: "この りょうりは おいしそう。", en: "This dish looks tasty." }
      - { ja: "その とけいは たかそう。", en: "That watch looks expensive." }
      - { ja: "この ほんは おもしろそう。", en: "This book looks interesting." }
      - { ja: "きょうは てんきが よさそう。", en: "The weather looks good today." }
    antiPattern: { ja: "この りょうりは おいしいそう。", why: "そう sits on the STEM — the い has to go: おいしそう. (Keeping the い builds a different word you will meet much later; for now it is simply not the looks-like form.)" }

  - id: sou-appearance
    variant: verb
    rule: "On a verb, そう takes the ます-stem — the same stem you have used since module 7 — and means it looks about to happen: ふる → ふりそう, looks like rain. おちる → おちそう, about to fall. The feel is an event leaning forward; you say it while there is still time to grab the cup. Negatives go two ways and both are worth having: あめは ふらなさそう (it doesn't look like rain) and あめは ふりそうにない (there's no sign of it raining) — the second is the stronger, flatter denial. Both are recognition-first here; production comes with use."
    examples:
      - { ja: "あめが ふりそう。", en: "It looks like rain." }
      - { ja: "かばんから さいふが おちそう。", en: "Your wallet looks about to fall out of your bag." }
      - { ja: "えいがが はじまりそう。", en: "The film looks about to start." }
      - { ja: "あめは ふりそうにない。", en: "There's no sign of rain." }
    antiPattern: { ja: "あめが ふるそう。", why: "the looks-like そう rides the ます-stem: ふり + そう. On the dictionary form it stops being about looks at all — ふりそう is what the sky shows you." }

  - id: garu-tagaru
    rule: "Japanese is honest about other minds: you know what YOU want, but you can only READ what others want. That is why 「おとうとは いきたい」 sounds off — たい is first-person interior. For third person, がる turns the feeling into visible behavior: いきたい → いきたがる, \"he's acting like he wants to go.\" Almost always in ている, because the behavior is ongoing: おとうとは こうえんに いきたがっている。 The same がる works straight on emotion adjectives — こわい → こわがる (to act scared), はずかしい → はずかしがる (to act embarrassed). Cut the い, add がる, and the private feeling becomes the public verb of showing it. This closes a door N5 deliberately left shut: now you can finally say what somebody ELSE wants."
    examples:
      - { ja: "おとうとは こうえんに いきたがっている。", en: "My little brother wants to go to the park." }
      - { ja: "いもうとは あたらしい くつを かいたがっている。", en: "My little sister wants to buy new shoes." }
      - { ja: "ねこは そとに でたがっている。", en: "The cat wants to go outside." }
    antiPattern: { ja: "おとうとは こうえんに いきたい。", why: "たい is first-person interior — you can't feel your brother's wanting from the inside. What you CAN see is the wanting-behavior: いきたがっている。" }

  - id: yasui-nikui
    rule: "Stem + やすい: easy to. Stem + にくい: hard to. The same attachment site as たい (module 13) — よむ → よみやすい (easy to read), わかる → わかりにくい (hard to follow). And here is the payoff of building adjectives out of adjectives: the result IS an i-adjective, so everything you know about i-adjectives applies unchanged — よみやすかった, わかりにくくない, たべやすくて。 It is judgment about the THING, not about you: この じしょは つかいやすい praises the dictionary, not your skill. Pick the stem, pick the half, and the language does the rest with machinery you have owned for twenty modules."
    examples:
      - { ja: "この じしょは つかいやすい。", en: "This dictionary is easy to use." }
      - { ja: "この ことばは おぼえにくい。", en: "This word is hard to memorise." }
      - { ja: "ミカの せつめいは わかりやすい。", en: "Mika's explanations are easy to follow." }
      - { ja: "この みちは あるきやすかった。", en: "This road was easy to walk." }
    antiPattern: { ja: "この じしょは つかうやすい。", why: "やすい rides the ます-stem, exactly like たい: つかい + やすい. The dictionary form never takes the attachment." }

  - id: nagara
    rule: "Stem + ながら: doing one thing WHILE doing another. おんがくを ききながら しゅくだいを する — homework, with music behind it. Same attachment site again: the ます-stem, nothing new to learn about the shape. One rule of meaning that English hides: the ながら-half is the BACKGROUND, and the sentence's real point comes second. 「たべながら テレビを みる」 is watching TV (main), over food (background); flip the halves and you flip what matters. Both actions belong to the same person — ながら never joins two different people's doings."
    examples:
      - { ja: "おんがくを ききながら しゅくだいを する。", en: "I do my homework while listening to music." }
      - { ja: "テレビを みながら ごはんを たべる。", en: "I eat dinner while watching TV." }
      - { ja: "あるきながら はなす。", en: "We talk while walking." }
    antiPattern: { ja: "おんがくを きくながら しゅくだいを する。", why: "ながら rides the ます-stem like every attachment in this module: きき + ながら. The dictionary form doesn't take it." }

