  #    〜やすい/〜にくい:
  - { kana: つかいやすい, romaji: tsukaiyasui, gloss: "easy to use", shortGloss: "easy to use", imageable: false, kind: adj-form, derivedFrom: つかう }
  - { kana: よみやすい, romaji: yomiyasui, gloss: "easy to read", shortGloss: "easy to read", imageable: false, kind: adj-form, derivedFrom: よむ }
