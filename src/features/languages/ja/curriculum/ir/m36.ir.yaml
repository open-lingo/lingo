module: m36
title: "Looks like: 〜そう(appearance), 〜がる, 〜やすい/にくい, 〜ながら"
register: plain
priorNeoModules: [m3, m4, m5, m6, m7, m8, m9, m10, m11, m12, m13, m14, m15, m16, m17, m18, m19, m20, m21, m22, m23, m24, m25, m26, m27, m28, m29, m30, m31, m32, m33, m34, m35]
priorGrammarPoints: [ka-question, no-possession, wa-topic, wo-object, ga-existence,
  ni-location, ni-time, de-action, mo-also, kara-because, node-because, kedo,
  made-until, mae-ni, te-form, te-kudasai, te-iru, te-kara, te-miru, te-oku,
  ta-form, nai-form, nai-existence, dictionary-form, masu-present, masu-negative,
  masu-past, desu-copula, i-adj-present, i-adj-negative, i-adj-past,
  na-adj-present, na-adj-negative, v-tai, suki-kirai-no, to-omoimasu, toki,
  tsumori-desu, mashou, masenka, potential-form, dekiru, deshou, kana-wondering,
  n-desu, sugiru, ku-ni-naru, hou-ga-ii, yo-emphasis, ne-agreement,
  register-audience, chotto-softener, ageru, kureru, morau, ni-recipient, tara,
  jidoushi-tadoushi, te-iru-resultative, volitional, you-to-omou, koto-ni-suru,
