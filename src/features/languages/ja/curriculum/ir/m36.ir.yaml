  # ══ Attachment surfaces the beats use — the tokenizer cannot split them
  #    (おいしい loses its い inside おいしそう). EXPANSION AGENT: this list
  #    must EXACTLY match usage — add what you use, delete what you don't.
  #    〜そう on adjectives (adj-form, derivedFrom the adjective):
