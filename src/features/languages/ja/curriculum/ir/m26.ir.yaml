notes: |
  m26 = spine tile n14, "Comparisons II: いちばん + なかで". The tile's own two
  lines: "なかで…がいちばん superlatives (いちばん #158)" and "Comparison review
  against n09 with all-new sentences (spiral rule)". n09 is m20, which shipped
  のほうが…より and deliberately withheld いちばん — the s20 split — so this
  module is the DEEPEN beat of the same spiral and owes the superlative half.

  **DO NOT READ THE ARCHIVED m26.** The old-course m26 was a "problems"
  module; anything about m26 in `docs/lesson-authoring-guide.md`,
  `docs/info-step-audit-2026-07-16.md` or `docs/kanji-furigana-plan-2026-07-16.md`
  describes that archived content, and so did `COMPLEXITY_FLOORS.m26`
  (recalibrated below — the third cycle running to hit this).

  THE WHOLE POINT — a superlative in Japanese is a COMPARISON WITH THE FIELD
  NAMED, and it is built from four things the learner already owns.

  1. **なか is m6's ordinary noun "inside".** It takes の in front of it like
     any other noun — exactly as ほう did at m20 — and で behind it: 「たべものの
     なかで」 is "inside the set of foods", i.e. "of all foods". Nothing here is
     a fixed phrase to memorise; it is の + a noun + で, three particles-and-a-
     noun the learner has had since m6.
  2. **The winner takes が.** Picking one item out of a named set is が's oldest
     job (m6), and it is the same が that sat behind ほう at m20. は would make
     the winner the TOPIC, which says something else.
  3. **いちばん is an ADVERB and it never touches the predicate.** It sits
     directly in front of the adjective — or the verb — and changes nothing:
     たかい is still たかい, しずかだ still needs its だ, はたらく still takes no
     だ. This is m20's "nothing inflects" promise, kept a second time, and it is
     the single most reassuring fact in the module.
  4. **Two things take ほうが…より; three or more take なかで…いちばん.** The two
     frames NEVER stack (L5's antiPattern), and knowing which one you are in is
     the whole decision the learner has to make.

  **ほど IS DEFERRED TO m37 AND APPEARS NOWHERE.** spine-n4 §1.1 files the
  comparison family as "m20 / m26 · ほど joins at m37", and m37's own tile gets
  ほど's atom row. 〜ほど〜ない is the NEGATIVE comparison and its whole
  pedagogic value there is that it is the minimal pair of a form the learner
  already owns — which is only available if it is still new. Pre-empting it
  here would spend m37's contrast material. Machine-checked in
  `m26-neo.test.ts`.

  Shape: 13 lessons = 9 teaching + 3 review + 1 challenge, reviews at the
  first/middle/last thirds, challenge lesson LAST (inv 25). NO katakana rows
  (the programme ended at m11). NO `kind: register` beats — that machinery is
  m10 + m29 only (registerScaffoldIsolation); L11's polite production is an
  ordinary lesson with explicit "Say politely:" cues, which is what inv 8 asks
  for and what inv 48 then grades. NO kanji beats — kanji-set-3 is m28's row.

  DEVIATIONS + DECISIONS, documented per the RUN-PLAN "decide and document" rule:

  - **NO SPINE DEVIATION.** Both halves of tile n14 ship: なかで…がいちばん
    superlatives (L1-L3, L6, L7, L9-L11) and the n09 comparison review with
    ALL-NEW sentences (L5, whose card is `yori-comparison` re-taught and whose
    every surface is new — machine-checked against m20's compiled surfaces in
    `m26-neo.test.ts`).
  - **THE LEDGER ROW IS ONE ID — `ichiban-superlative` — and it is cleared on
    L1's rule card.** RUN-PLAN-n4's coverage table, row 26, owes exactly that.
  - **EIGHT POINTS ARE RE-TAUGHT rather than re-assigned, and ZERO ids are
    invented.** The row owes one id across nine teaching lessons, and inv 42
    forbids inventing an id where the registry has one — so unlike m24 (four
    potential-system ids) and m25 (six conjecture rungs), this module declares
    no IR-local point at all. `dare` (m4 — a question word takes が inside the
    superlative frame, which is m20's どっちが argument extended from two things
    to a whole set), `no-ga-suki` (m13 — 「〜のが いちばん すきだ」, the
    superlative over ACTIVITIES rather than nouns), `yori-comparison` (m20 —
    the spine's own ⟳ spiral beat), `to-and` (m8 — と ties a list of ANY length,
    and どっち is for two while どれ is for three or more), `na-adj-present`
    (m12 — な-adjectives keep だ under いちばん, where "nothing inflects" earns
    its keep a second time), `mo-also` (m3 — 「AもBも〜けど Cが いちばん〜」, the
    concede-then-choose move), `dictionary-form` (m7 — いちばん scaling a VERB,
    which is also where inv 31's だ-drop is restated), and `masu-present` (m7 —
    the polite superlative question, this module's register home). No ledger row
    moves: a re-teach is not a re-assignment (the m16 ruling, and m20 made
    exactly this call for six points).
  - **TEN ATOMS ARE DECLARED, ZERO NEW `courseAtoms` ROWS, AND THEREFORE NO
    TOKENIZER RISK AT ALL.** いちばん, くだもの, やさい, にく, さかな, どうぶつ,
    ぞう, おもい, ことば and えいご every one already carries a courseAtoms row
    under a stale old-course m22/m8/m9/future tag, and not one of them is in any
    neo module's `priorVocab` — they are declared here for PROVENANCE, the
    m15-m25 move. `courseAtoms.ts` is untouched, so the whole-course tokenizer
    is byte-identical and the m16-ので regression class cannot arise. (m25's own
    guard lists いちばん among the words "taught by no module before m25"; that
    is the same finding from the other side.)
  - **いちばん IS `imageable: false` BECAUSE L1's RULE CARD MUST NAME IT.** 🥇 is
    an honest glyph for it and the registry carries one, but a `kind: rule` beat
    compiles to a PINNED step ahead of the interleaved middle, so the card would
    steal the debut before the picture could be shown (the m14 trap, restated by
    m20 and m25). A module cannot teach its headline grammar point without
    saying the word on the card, so the picture is what gives way. **ぞう and
    えいご are `imageable: false` for the other two documented reasons**: ぞう has
    no emoji in the registry at all, and えいご's 🇺🇸 is アメリカ's glyph — a MET
    word — so a debut MCQ would draw a distractor the picture names at least as
    well as the answer (the m19/m24 ruling). The seven that DO debut on a
    picture each own their glyph inside this module's usable pool: くだもの 🍎,
    やさい 🥕, にく 🥩 (とりにく is 🍗 and is not met), さかな 🐟, どうぶつ 🐾,
    おもい 🏋️, ことば 🔤.
  - **THE RULE CARD OF A LESSON THAT DEBUTS AN IMAGEABLE WORD NEVER NAMES IT.**
    L2's `dare` card runs on たべもの / かぞく / にほん / seasons while くだもの and
    やさい appear only in beats; L3's `no-ga-suki` card avoids にく and さかな;
    L5's avoids どうぶつ; L6's avoids おもい; L9's avoids ことば.
  - **はやい IS BANNED, and so is あまい.** m20's course-wide ruling stands:
    `JA_PRIMARY_ATOM_BY_KANA` resolves the bare kana はやい to `hayai-early`
    (早い "early", ⏰) rather than `hayai` (速い "quick", 💨), so a comparison
    glossed "fastest" would credit SRS to the wrong sense — the はな/鼻 class.
    A superlative module wants 「いちばん はやい」 badly and does not get it;
    ちかい / とおい / やすい / たかい / おもい carry the physical comparisons
    instead. あまい, ながい, みじかい, かるい, せまい and やさしい are all in
    `courseAtoms` and NONE is in `priorVocab`, so none of them can be used
    without a registration this module has no reason to make.
  - **THE TOKENIZATION WAS DUMPED BEFORE A SINGLE SENTENCE WAS AUTHORED, not
    assumed.** 「たべものの なかで すしが いちばん おいしい」 segments as
    たべもの · の · なか · で · すし · が · いちばん · おいしい, and
    「コーヒーより ちゃの ほうが すきだ」 as コーヒー · より · ちゃ · の · ほう ·
    が · すき · だ — WITH OR WITHOUT the space in 「ちゃのほうが」, because the
    tokenizer is longest-match-first and ほう can only win at an index nothing
    longer covers. 「およぐのが」 is およぐ · の · が. Two probes came back BAD and
    were struck from the plan before drafting: **「クラス」 has no atom row**
    (「クラスで」 emits クラス as an unknown fragment and would trip
    `unbuildable`), and **おちゃ is not a word here** — the atom is ちゃ, so
    「おちゃの ほうが」 would tile a bare お. Every carrier below was checked
    token-exactly against the computed `priorVocab`, not against the context
    pack.
  - **NO BOUND ENDER, AND NOTHING NEW FOR THE `BOUND` LIST.** いちばん is a free
    adverb, not a bound ender — 「いちばん！」 is a complete utterance — but it is
    kept out of every `reviewPool` anyway, because a pool entry feeds the filler
    rotation's bare-word `speaking` slot and "Say: the most" is a word card for
    something this module only ever teaches in a frame. It keeps its SRS credit
    from the sixty-odd sentences that carry it. `moduleCompiler`'s BOUND list is
    unchanged: this module registers no bound form.
  - **NO PARTICLE_CLOZE ON A PARTICLE.** m26 introduces no particle, so a true
    particle cloze would be a REVIEW use of the type and inv 5 bans it (m25's
    ruling, unchanged). Every cloze here picks among CONTENT words — nouns,
    adjectives, verbs, question words and predicate FORMS (しずかだ / しずか /
    しずかじゃない, やすいですか / やすいです / やすい) — and every option is a
    taught atom or a taught atom plus a taught ending (inv 40). Frames carry no
    character name and never end on a bare だ (the m21/m22 findings): a cloze is
    harvested into the grammar-review deck, whose comprehensibility gate
    resolves every word through `courseAtoms`, and ミカ / トム / ケン / たなか
    have no rows.
  - **EVERY CLOZE HAS A DETERMINATE ANSWER.** A superlative frame invites the
    lazy cloze 「かぞくの なかで ＿が いちばん いそがしい」 with ちち / はは / あね
    as options, where all three are equally true — three drafts of that shape
    were written and deleted. Each surviving cloze is anchored by something in
    the frame itself (a place for どこ, a reason clause for はたらく, けど +
    おいしい for すきだ).
  - **Clause boundaries are SPACES, never 、** — `moduleCompiler.clean()` strips
    、 with nothing in its place, so an authored comma compiles to a run-on
    build target AND a run-on TTS key.
  - **Gloss discipline (inv 17 + the m23 はいる incident).** いちばん is "the
    most" / "the ~est" / "…the most of all", never "very" (that is とても /
    たいへん, a different claim). 「〜の なかで」 is "of all ~" / "among ~", never
    "inside ~" when a set is being named. すき under いちばん glosses "likes ~
    the most" or "~ is my favourite", never "loves". Plain non-past verbs gloss
    habitual or intent — 「ちちが いちばん はたらく」 is "my father works the
    most", not "is working the most" — and only いく / くる / かえる keep the
    futurate "-ing".
  - **CARRIER ROTATION (inv 27).** The 2026-07-27 exposure audit's fifteen worst
    over-exposed carriers — みせ, ともだち, ほん, いる, ごはん, ください, みず,
    きのう, あたらしい, えき, かった, うみ, いたい, でんしゃ, きっさてん — carry
    NO sentence in this module, and でんしゃ is the painful one: it is m20's
    headline comparison carrier and a comparison module reaches for it by
    reflex. ちかてつ / バス / じてんしゃ / ひこうき / ふね / くるま carry the
    transport comparisons instead. **Five of the context pack's reinforcement
    targets are spent by being REGISTERED** — さかな, ぞう, ことば, えいご and
    おもい — which is the only way to spend them: they were unusable precisely
    because no neo module had taught them.
  - **Words the context pack lists as known but the compiler does not.** The
    pack is derived from `courseAtoms` attribution and OVERSTATES; `priorVocab`
    is the truth. Verified token-exactly and either REGISTERED here or AVOIDED:
    いちばん, くだもの, やさい, にく, さかな, どうぶつ, ぞう, おもい, ことば, えいご
    (all registered), and こうえん, へや, そと, まち, ちかく, そば, はなし,
    ノート, プール, タクシー, とり, ドア, ペン, かみ, つくえ, おかね, くに,
    やさしい, ながい, みじかい, おそい, かるい, つよい, よわい, ひろい, せまい,
    あまい, からい, せいと, さいふ, いりぐち, まいばん, まいあさ, ぷりん, あおい,
    しょうゆ, なく, あい, えび, すむ, よむ, かく, うたう, とる, いろ, たくさん,
    でも, また, よっつ (all avoided). Nineteen of the pack's twenty-four
    "reinforcement targets" are in that avoided list, which is why the five that
    could be spent were spent by registration instead.
  - **CONNECTIVES + COMPLEXITY (inv 13).** A superlative names a SET, a winner
    and a predicate by construction, so its floor length is high before any
    connective is added; most production beats then hang a reason or a
    concession on m16's から / けど, which is also how a preference is actually
    stated ("it's the cheapest, so I'll buy it"). `COMPLEXITY_FLOORS.m26` was
    measured on the ARCHIVED problems module and is recalibrated in
    `moduleContentLints.ts` — RAISED, never lowered, per that block's own rule.
  - **Persona canon.** No 「NAMEは NOUNだ」 assertion appears anywhere: the
    module compares things and properties, never roles. Where a person is the
    winner of a set it is by a property (「かぞくの なかで ちちが いちばん
    はたらく」), which asserts no canon fact. たなか is the teacher and appears
    only in L11's polite classroom dialogue, answering a student in polite form.

  WHAT THE GATES CAUGHT, and what changed because of it (none of it a guard
  weakening):

  - **A NAMED FIELD OF EXACTLY TWO NEVER TAKES いちばん.** Four beats shipped in
    the first draft as 「なつと ふゆの なかで ふゆが いちばん さむい」 and
    「にくと さかなの なかで さかなが いちばん おいしい」 — which is precisely the
    frame L5 and L6 tell the learner NOT to use, since two things are the
    ほうが…より shape and どっち's shape. All four were rewritten to three-item
    fields, and `m26-neo.test.ts` now carries the crisp half of the rule as a
    guard: どっち and いちばん may never share a sentence. Two GROUPS
    (「くだものと やさいの なかで」) are deliberately fine — a category is not an
    item, and the field there is many things.
  - **The どっち guard's non-vacuity floor was UNMET and the CONTENT was fixed,
    not the floor.** Only two どっち surfaces existed, both incidental; a module
    whose L6 card teaches どっち-versus-どれ ought to PRODUCE the two-item
    question, so L6 gained 「ふねと ひこうきと どっちが たかい？」 as a build.
  - **An authored listening-comp must not duplicate a build sentence's audio in
    the same lesson** (`reviewFillerVariety`): the filler generates its own LC
    from the lesson's sentences, so four authored LCs collided with one. Each
    was rewritten to a sentence that appears nowhere else in its lesson.
  - **Three `reviewPool` orderings were changed for the length-cue ratchet.**
    `translationMcq` draws distractors within a mora of the target, and the
    seeded pick handed 3-kana distractors to a 2-kana target three times —
    which pushed the course-wide "correct answer is uniquely shortest" ratio
    from .024 to exactly .030 and failed a `< 0.03` ratchet. Reordering L5's,
    review-2's and L11's pools moved the filler's target word; the ratio is
    back to .024 and no m26 item is in the residue. The ratchet was not
    touched.
  - **L6's challenge beat was re-combined.** Its first shape repeated
    `[ichiban-superlative + kara-because + to-and + wo-object]` from a beat five
    steps earlier, which the compiler's `challenge-not-novel` diagnostic reads
    as longer-but-familiar (inv 26). It now runs on `kedo` + `i-adj-present`.
  - **ONE GUARD IN THIS MODULE'S OWN TEST WAS NARROWED, with evidence.** The
    inv-27 fatigue scan originally read every `jaSurfaces` string and fired on
    「ください」 at `ja-m26-neo-3-debut-0` — a `word_image_mcq` whose options the
    COMPILER picks out of `emojiPool`. That is neither authored nor a carrier,
    so the scan was narrowed to multi-token SENTENCES plus every `reviewPool`
    (a pool entry is an authorial choice and would otherwise have stopped being
    checked). The genuine hit in the same run — うみ, one of the fourteen
    fatigued carriers, in six beats — was fixed in the CONTENT: いけ carries the
    three-place lists and かわ carries the swimming.
  - **まいにち was cut from two dialogues.** It has a courseAtoms row and the
    context pack lists it as known, but it is in no neo module's `priorVocab`,
    so teach-first read it as a bare debut inside a dialogue. よく replaced it.

  ONE RULE CARD PER LESSON (m14's layout law): every teaching lesson carries
  exactly one, because two `kind: rule` beats compile to two PINNED, ADJACENT
  grammar_rule steps and fail the adjacency bar.

  NO CONJUGATION RAMPS. Nothing this module teaches conjugates — いちばん is an
  adverb, なか is a noun and で / が / の are particles the learner owns — so no
  `conjugation:` block is declared and no `verbClass` is set on any atom.

grammarPoints:
  - id: ichiban-superlative
    rule: "To say something is the MOST, Japanese names the field it is the most of and then points at the winner. 「たべものの なかで すしが いちばん おいしい」 — of all foods, sushi is the most delicious. Three pieces, and you already own all three. なか is the ordinary noun 'inside' from module 6, so it takes の in front of it exactly as ほう did last module, and で behind it: 「たべものの なかで」 is 'inside the set of foods'. The winner takes が, because picking one thing out of a group is what が has always done — は would make the winner the TOPIC, which is a different sentence. And いちばん is an adverb meaning 'number one', which sits directly in front of the adjective. Here is the good news, and it is the same good news as last module: いちばん does not touch the predicate. たかい stays たかい. There is no ending to add, nothing to conjugate, and no word for 'most' hiding inside the adjective. Say the group, say the winner, say いちばん, say the adjective. The field can be a plain noun (かぞくの なかで), a list you name out loud (はると なつと あきと ふゆの なかで), or a set you are pointing at (この みっつの なかで)."
    examples:
      - { ja: "たべものの なかで すしが いちばん おいしい。", en: "Of all foods, sushi is the most delicious." }
      - { ja: "のみものの なかで ちゃが いちばん やすい。", en: "Of the drinks, tea is the cheapest." }
      - { ja: "かぞくの なかで ちちが いちばん いそがしい。", en: "In my family, my father is the busiest." }
      - { ja: "はると なつと あきと ふゆの なかで ふゆが いちばん さむい。", en: "Of spring, summer, autumn and winter, winter is the coldest." }
      - { ja: "この みっつの なかで これが いちばん たかい。", en: "Of these three, this one is the most expensive." }
    antiPattern: { ja: "たべものの なかで すしが おいしい いちばん。", why: "いちばん goes in FRONT of the word it scales, never after it — it is an adverb, not an ending: たべものの なかで すしが いちばん おいしい。" }

  - id: dare
    rule: "To ASK which one tops a group, put a question word where the winner would have gone and leave everything else exactly as it was. 「かぞくの なかで だれが いちばん いそがしい？」 — who is the busiest in your family? The question word takes が and never は, for the reason module 20 gave for どっち: a question word cannot be what a sentence is ABOUT, because you do not yet know what it is. Pick the question word by what kind of thing you are asking after. なに for a thing, だれ for a person, どこ for a place, いつ for a time, and どれ when the options have already been named out loud. That last one is worth watching: どれ picks from a set in front of you, so 「この みっつの なかで どれが いちばん たかい？」 works, while なに asks with nothing named at all. The answer comes back in the ordinary frame with が on the winner, and it needs no なかで at all, because the question already named the field: 「ももが いちばん たかい」."
    examples:
      - { ja: "たべものの なかで なにが いちばん おいしい？", en: "Of all foods, what's the most delicious?" }
      - { ja: "かぞくの なかで だれが いちばん いそがしい？", en: "Who's the busiest in your family?" }
      - { ja: "にほんの なかで どこが いちばん さむい？", en: "Where's the coldest place in Japan?" }
      - { ja: "はると なつと あきと ふゆの なかで いつが いちばん すずしい？", en: "Of spring, summer, autumn and winter, which one is the coolest?" }
      - { ja: "この みっつの なかで どれが いちばん やすい？", en: "Of these three, which is the cheapest?" }
    antiPattern: { ja: "かぞくの なかで だれは いちばん いそがしい？", why: "a question word can never be the topic of a sentence, so だれ always takes が: かぞくの なかで だれが いちばん いそがしい？" }

  - id: no-ga-suki
    rule: "The winner of a group does not have to be a thing — it can be something you DO, and module 13 already gave you the way to say so. Put の straight after a plain verb and the verb becomes a thing: およぐ becomes およぐの, the swimming of it. Then it takes が like anything else, and いちばん goes in front of the adjective exactly as before: 「およぐのが いちばん すきだ」 — swimming is what I like most. The verb stays in plain form, because の is doing all the nominalising, and everything you hang off the verb comes along with it: 「かわで およぐのが いちばん たのしい」, 「えいがを みるのが いちばん すきだ」. すき is a な-adjective rather than a verb, which is why what you like is marked が and never を, and why it keeps its だ at the end. きらい behaves identically. Two habits worth building here. First, this is the most natural way to answer 「なにが いちばん すき？」 when the honest answer is an activity. Second, たのしい and おもしろい take the same frame, so you can say a thing is the most FUN to do without ever saying you like it."
    examples:
      - { ja: "なつやすみに およぐのが いちばん すきだ。", en: "Swimming is what I like most in the summer holidays." }
      - { ja: "えいがを みるのが いちばん たのしい。", en: "Watching films is the most fun." }
      - { ja: "かぞくと りょこうを するのが いちばん たのしい。", en: "Travelling with my family is the most fun." }
      - { ja: "じてんしゃに のるのが いちばん おもしろい。", en: "Riding a bike is the most interesting." }
      - { ja: "にほんの りょうりを たべるのが いちばん すきだ。", en: "Eating Japanese food is what I like most." }
    antiPattern: { ja: "なつやすみに およぐが いちばん すきだ。", why: "a verb cannot be marked が on its own — の turns it into a thing first: なつやすみに およぐのが いちばん すきだ。" }

  - id: yori-comparison
    rule: "You now have two comparison frames and the only thing to get right is which one you are in. TWO things take last module's frame: the winner marked ほうが, the loser marked より, and nothing else. 「バスより ちかてつの ほうが やすい」 — the underground is cheaper than the bus. THREE OR MORE take this module's: the field named with なかで, the winner marked が, and いちばん in front of the adjective. 「ちかてつと バスと じてんしゃの なかで じてんしゃが いちばん やすい」. Everything else is shared. Neither frame touches the adjective, both put the winner before the predicate, and both let you drop whatever the listener already knows — 「バスより やすい」 is a whole answer to a question about the underground, and 「じてんしゃが いちばん やすい」 is a whole answer once the three have been named. The one thing you must not do is stack them. ほうが has already picked the winner of a pair, so there is nothing left for いちばん to top, and 「ほうが いちばん」 is not a sentence anybody says. Pick your frame by counting the things on the table: two, or more than two."
    examples:
      - { ja: "バスより ちかてつの ほうが やすい。", en: "The underground is cheaper than the bus." }
      - { ja: "ちかてつと バスと じてんしゃの なかで じてんしゃが いちばん やすい。", en: "Of the underground, the bus and the bike, the bike is the cheapest." }
      - { ja: "ちゃより コーヒーの ほうが たかい。", en: "Coffee is more expensive than tea." }
      - { ja: "のみものの なかで コーヒーが いちばん たかい。", en: "Of the drinks, coffee is the most expensive." }
      - { ja: "ふゆより はるの ほうが あたたかい。", en: "Spring is milder than winter." }
    antiPattern: { ja: "バスより ちかてつの ほうが いちばん やすい。", why: "ほうが has already picked the winner of a PAIR, so there is nothing left for いちばん to top — the two frames never stack: バスより ちかてつの ほうが やすい。" }

  - id: to-and
    rule: "When the field is not a ready-made word like たべもの, name it out loud with と. 「かばんと くつと ふくの なかで どれが いちばん たかい？」 — of the bag, the shoes and the clothes, which is the most expensive? と is module 8's と and it is doing module 8's job: it ties a CLOSED list, so the listener knows those are all the options there are. Put it between every pair of items and let the last item run straight into の なかで. There is no limit of two here — と will tie three, four, or as many as you can say in one breath. What DOES depend on the count is the question word. どっち asks about exactly two and cannot stretch: 「ちゃと コーヒーと どっちが やすい？」. The moment a third item joins the list, the question word becomes どれ. Their polite twins behave the same way, どちら for two and どれ for more. And the answer to either one comes back with が on the winner: 「くつが いちばん たかい」."
    examples:
      - { ja: "かばんと くつと ふくの なかで どれが いちばん たかい？", en: "Of the bag, the shoes and the clothes, which is the most expensive?" }
      - { ja: "ちゃと コーヒーと どっちが やすい？", en: "Which is cheaper, tea or coffee?" }
      - { ja: "やまと かわと いけの なかで どれが いちばん とおい？", en: "Of the mountains, the river and the pond, which is the furthest?" }
      - { ja: "じしょと てがみと しゃしんの なかで どれが いちばん ふるい？", en: "Of the dictionary, the letter and the photo, which is the oldest?" }
      - { ja: "この みっつの なかで どれが いちばん おおきい？", en: "Of these three, which is the biggest?" }
    antiPattern: { ja: "かばんと くつと ふくの なかで どっちが いちばん たかい？", why: "どっち asks about exactly TWO things — with three on the table the question word is どれ: かばんと くつと ふくの なかで どれが いちばん たかい？" }

  - id: na-adj-present
    rule: "な-adjectives go into the superlative frame with nothing removed and nothing added, and they keep their だ. 「がっこうの なかで としょかんが いちばん しずかだ」 — of everywhere in the school, the library is the quietest. This is module 12's rule and module 20's promise meeting each other: a な-adjective is not a verb and cannot finish a sentence on its own, so it needs だ; and いちばん is an adverb, so it cannot supply one. しずか is a quality, しずかだ is a statement, and いちばん しずかだ is a statement about the top of a group. Nothing about the frame changes that in either direction. The words worth practising here are the ones English hears as verbs but Japanese treats as な-adjectives: すき and きらい, which take が on the thing liked, and じょうず and へた, which do the same. 「のみものの なかで ちゃが いちばん すきだ」 is 'tea is my favourite drink' — literally, of the drinks, tea is the most likeable. And the negative behaves exactly as module 12 left it: しずかじゃない."
    examples:
      - { ja: "がっこうの なかで としょかんが いちばん しずかだ。", en: "Of everywhere in the school, the library is the quietest." }
      - { ja: "にほんの なかで さくらが いちばん ゆうめいだ。", en: "In Japan, the cherry blossom is the most famous." }
      - { ja: "きょうだいの なかで いもうとが いちばん げんきだ。", en: "Of my siblings, my younger sister is the liveliest." }
      - { ja: "のみものの なかで ちゃが いちばん すきだ。", en: "Tea is my favourite drink." }
      - { ja: "この みっつの なかで これが いちばん きれいだ。", en: "Of these three, this one is the prettiest." }
    antiPattern: { ja: "がっこうの なかで としょかんが いちばん しずか。", why: "a な-adjective cannot finish a sentence on its own — it needs だ, and いちばん does not supply one: がっこうの なかで としょかんが いちばん しずかだ。" }

  - id: mo-also
    rule: "Real preferences are polite about the things they did not pick, and Japanese has a tidy shape for that. Put も on every member of the field to concede that all of them are true, then hang the choice off the end with けど. 「にくも さかなも おいしいけど さかなが いちばん すきだ」 — meat and fish are both delicious, but fish is what I like most. も is module 3's 'too', and repeating it is what turns two separate 'too's into 'both'. The move matters more than the grammar does: saying flatly that one thing is the best implies the others are not, and conceding first takes that sting out. It also works with the field already named — 「どれも たかいけど これが いちばん たかい」, they are all expensive but this is the most expensive — where どれも means 'all of them' and needs no list in front of it. Name the field with a noun and 〜の なかで does the same job: 「ことばの なかで えいごが いちばん むずかしい」 — of all the languages, えいご, the English language, is the hardest. Two things to watch. も REPLACES は and が rather than stacking with them, so it is 「にくも」 and never 「にくがも」. And すき still takes が on the thing liked, however many も have come before it."
    examples:
      - { ja: "にくも さかなも おいしいけど さかなが いちばん すきだ。", en: "Meat and fish are both delicious, but fish is what I like most." }
      - { ja: "どれも たかいけど この とけいが いちばん たかい。", en: "They're all expensive, but this watch is the most expensive." }
      - { ja: "はるも あきも すずしいけど あきが いちばん すずしい。", en: "Spring and autumn are both cool, but autumn is the coolest." }
      - { ja: "ちかてつも バスも やすいけど じてんしゃが いちばん やすい。", en: "The underground and the bus are both cheap, but the bike is the cheapest." }
      - { ja: "いぬも ねこも すきだけど ねこが いちばん すきだ。", en: "I like both dogs and cats, but cats are what I like most." }
    antiPattern: { ja: "にくも さかなも おいしいけど さかなを いちばん すきだ。", why: "すき is an adjective, not a verb — the thing you like is marked が, never を: にくも さかなも おいしいけど さかなが いちばん すきだ。" }

  - id: dictionary-form
    rule: "いちばん scales a VERB exactly the way it scales an adjective, and this is where the frame stops being about qualities and starts being about behaviour. 「かぞくの なかで ちちが いちばん はたらく」 — of everyone in my family, my father works the most. Put いちばん directly in front of the verb and leave the verb alone. It stays in the plain dictionary form, and — the thing worth restating because English speakers reach for it — it takes NO だ. A dictionary-form verb has been a complete sentence since module 5; だ finishes NOUNS. 「はたらくだ」 is wrong here for the same reason it was wrong then, and いちばん changes nothing about it. Add よく in front of the verb when you mean 'the most often' rather than 'the most': 「いぬが いちばん よく あるく」. And note what the frame is really claiming — 「おとうとが いちばん たべる」 says he eats more than the rest, not that eating is his favourite thing. For that you want の from the earlier lesson: 「たべるのが いちばん すきだ」."
    examples:
      - { ja: "かぞくの なかで ちちが いちばん はたらく。", en: "Of everyone in my family, my father works the most." }
      - { ja: "きょうだいの なかで おとうとが いちばん たべる。", en: "Of my siblings, my younger brother eats the most." }
      - { ja: "がくせいの なかで ミカが いちばん あるく。", en: "Of the students, Mika walks the most." }
      - { ja: "かぞくの なかで ははが いちばん よく はなす。", en: "Of everyone in my family, my mother talks the most." }
      - { ja: "どうぶつの なかで いぬが いちばん よく あるく。", en: "Of the animals, dogs walk the most." }
    antiPattern: { ja: "かぞくの なかで ちちが いちばん はたらくだ。", why: "a verb is already a whole sentence and never takes だ — だ finishes NOUNS: かぞくの なかで ちちが いちばん はたらく。" }

  - id: masu-present
    rule: "The place you will actually need a superlative first is a shop, and a shop means polite. Everything about the frame stays where it is — なかで names the field, が marks the winner, いちばん sits in front of the adjective — and only the ending changes: 「どれが いちばん やすいですか。」 Two halves make that polite question work, and beginners drop one of them constantly. です carries the register, and か makes it a question. Leave か off and you have said a polite STATEMENT and left it hanging; leave です off and you have asked a friend, not a shop assistant. A casual question needs neither, because its rising contour does the work: 「どれが いちばん やすい？」 Same question, different room. The answer comes back polite too, and こちら is the polite twin of これ when you are pointing at goods: 「こちらが いちばん やすいです。」 One habit worth stealing from Japanese shoppers: 「すみません」 in front of the question is not an apology, it is how you open one."
    examples:
      - { ja: "どれが いちばん やすいですか。", en: "Which one is the cheapest?" }
      - { ja: "この みっつの なかで どれが いちばん おおきいですか。", en: "Of these three, which is the biggest?" }
      - { ja: "こちらが いちばん やすいです。", en: "This one is the cheapest." }
      - { ja: "すみません のみものの なかで なにが いちばん おいしいですか。", en: "Excuse me, of the drinks, which is the most delicious?" }
      - { ja: "どれが いちばん やすい？", en: "Which one is the cheapest? — the same question, said to a friend" }
    antiPattern: { ja: "どれが いちばん やすいです。", why: "a polite QUESTION requires か — without it the sentence is a statement, and an unfinished one: どれが いちばん やすいですか。" }

newAtoms:
  # ══ L1. The headline. `imageable: false` because L1's rule card must NAME it
  #    and a rule card compiles to a PINNED step ahead of the interleaved
  #    middle — the m14 trap, restated by m20 and m25. 🥇 is an honest glyph and
  #    the registry keeps it; the picture is simply not reachable in the one
  #    lesson that has to say the word first. Stale m22 tag, absent from every
  #    neo module's priorVocab, so this row is PROVENANCE only.
  - { kana: いちばん, romaji: ichiban, gloss: "the most, the ~est (tops a group)", shortGloss: "the most", imageable: false, kind: vocab }
  # ══ L2. The two food categories a superlative most wants to rank. 🍎 is
  #    shared with nothing MET (もも is 🍑) and 🥕 with nothing at all.
  - { kana: くだもの, romaji: kudamono, gloss: "fruit", shortGloss: "fruit", kind: vocab }
  - { kana: やさい, romaji: yasai, gloss: "vegetable", shortGloss: "vegetable", kind: vocab }
  # ══ L3. 🥩 is red meat and とりにく — the only met neighbour — is 🍗, so the
  #    debut picture names the answer better than any distractor. 🐟 is unshared.
  - { kana: にく, romaji: niku, gloss: "meat", shortGloss: "meat", kind: vocab }
  - { kana: さかな, romaji: sakana, gloss: "fish", shortGloss: "fish", kind: vocab }
  # ══ L5. The animal category and its biggest member. ぞう has NO emoji in the
  #    registry at all, so it cannot debut on a picture and says so explicitly.
  - { kana: どうぶつ, romaji: doubutsu, gloss: "animal", shortGloss: "animal", kind: vocab }
  - { kana: ぞう, romaji: zou, gloss: "elephant", shortGloss: "elephant", imageable: false, kind: vocab }
  # ══ L6. The one new comparison adjective, and a reinforcement target the
  #    context pack has been asking for since m22 (CEJC #470). 🏋️ is unshared.
  - { kana: おもい, romaji: omoi, gloss: "heavy", shortGloss: "heavy", kind: vocab }
  # ══ L9. The non-food field, so the module is not nine lessons of dinner.
  #    ことば 🔤 is unshared; えいご's 🇺🇸 is アメリカ's glyph and アメリカ is MET,
  #    so えいご is imageable: false (the m19/m24 ruling).
  - { kana: ことば, romaji: kotoba, gloss: "word, language", shortGloss: "language", kind: vocab }
  - { kana: えいご, romaji: eigo, gloss: "English language", shortGloss: "English", imageable: false, kind: vocab }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m26-neo-1
    role: teaching
    title: "「すしが いちばん おいしい」 — the top of a whole group"
    focus: "〜の なかで names the field, が marks the winner, いちばん sits in front"
    introduces: [いちばん]
    beats:
      - { kind: rule, grammarPointId: ichiban-superlative }
      - { kind: sentence, ja: "きょうだいの なかで あねが いちばん いそがしい。", en: "Of my siblings, my older sister is the busiest", exercises: [ichiban-superlative, ga-existence, no-possession], mode: build }
      - { kind: sentence, ja: "のみものの なかで ぎゅうにゅうが いちばん やすいから ぎゅうにゅうを かう。", en: "Milk is the cheapest of the drinks, so I'll buy milk", exercises: [ichiban-superlative, kara-because, wo-object], mode: build }
      - { kind: sentence, ja: "この みっつの なかで この かばんが いちばん おおきい。", en: "Of these three, this bag is the biggest", exercises: [ichiban-superlative, kono-sono-ano-dono, counter-tsu], mode: build }
      - { kind: sentence, ja: "はると なつと あきと ふゆの なかで ふゆが いちばん さむい。", en: "Of spring, summer, autumn and winter, winter is the coldest", exercises: [ichiban-superlative, to-and, ni-time], mode: build }
      - { kind: sentence, ja: "かぞくの なかで ちちが いちばん いそがしい。", en: "In my family, my father is the busiest", exercises: [ichiban-superlative, ga-existence, i-adj-present], mode: listening }
      - { kind: sentence, ja: "やまと かわと いけの なかで やまが いちばん とおいけど やまに いく。", en: "Of the mountains, the river and the pond, the mountains are the furthest, but I'm going to the mountains", exercises: [ichiban-superlative, kedo, ni-location], mode: build }
      - { kind: sentence, ja: "たべものの なかで すしが いちばん おいしいから すしを たべる。", en: "Sushi is the most delicious of all foods, so I'll eat sushi", exercises: [ichiban-superlative, kara-because, wo-object], mode: build }
      - { kind: sentence, ja: "のみものの なかで ちゃが いちばん やすい。", en: "Tea is the cheapest of the drinks", exercises: [ichiban-superlative], mode: translate }
      - { kind: particle-cloze, stem: "たべものの なかで すしが ", tail: " おいしい。", answer: "いちばん", options: ["いちばん", "ちょっと", "あまり"], en: "Of all foods, sushi is the most delicious", explanation: "いちばん says sushi tops the whole group. ちょっと would only say it is somewhat delicious, and あまり can never stand in front of a positive adjective at all." }
      - { kind: listening-comp, audio: "かぞくの なかで ははが いちばん いそがしい。", answer: "In my family, my mother is the busiest", distractors: ["In my family, my father is the busiest", "In my family, my mother is the freest", "My mother is busier than my father"], exercises: [ichiban-superlative, family-register] }
      - { kind: listening-comp, audio: "のみものの なかで ちゃが いちばん やすい。", answer: "Tea is the cheapest of the drinks", distractors: ["Tea is cheaper than coffee", "Tea is the most expensive of the drinks", "Coffee is the cheapest of the drinks"], exercises: [ichiban-superlative, ga-existence] }
      - kind: dialogue
        lines:
          - { speaker: "Tom", ja: "たべものの なかで なにが いちばん すき？", en: "Of all foods, what do you like most?" }
          - { speaker: "Mika", ja: "すし。おいしいから よく たべる。", en: "Sushi. It's delicious, so I eat it a lot." }
        questions:
          - { q: "What does Mika like most?", options: ["Sushi", "Bread", "Tea", "Rice"], answer: "Sushi" }
      - { kind: challenge, ja: "はると なつと ふゆの なかで ふゆが いちばん さむいから ふゆに やまに いかない。", en: "Of spring, summer and winter, winter is the coldest, so I don't go to the mountains in winter", combines: [ichiban-superlative, kara-because, ni-time, nai-form, ni-location], mode: build }
    reviewPool: [たべもの, のみもの, かぞく, ちち, はは, あね, ちゃ, すし, ぎゅうにゅう, ふゆ]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m26-neo-2
    role: teaching
    title: "「なにが いちばん おいしい？」 — asking which one tops the group"
    focus: "A question word stands where the winner would, and it always takes が"
    introduces: [くだもの, やさい]
    beats:
      - { kind: rule, grammarPointId: dare }
      - { kind: sentence, ja: "くだものの なかで ももが いちばん たかい。", en: "Of the fruit, peaches are the most expensive", exercises: [dare, ichiban-superlative, ga-existence], mode: build }
      - { kind: sentence, ja: "やさいの なかで きゅうりが いちばん やすい。", en: "Of the vegetables, cucumber is the cheapest", exercises: [dare, ichiban-superlative, ga-existence], mode: build }
      - { kind: sentence, ja: "くだものの なかで どれが いちばん おいしい？", en: "Of the fruit, which is the most delicious", exercises: [dare, ichiban-superlative, kore-sore-are-dore], mode: build }
      - { kind: sentence, ja: "きょうだいの なかで だれが いちばん おおきい？", en: "Of your siblings, who's the biggest", exercises: [dare, ichiban-superlative, family-register], mode: build }
      - { kind: sentence, ja: "にほんの なかで どこが いちばん さむい？", en: "Where's the coldest place in Japan", exercises: [dare, ichiban-superlative, koko-soko-asoko], mode: listening }
      - { kind: sentence, ja: "やさいの なかで なにが いちばん おいしい？", en: "Of the vegetables, which is the most delicious", exercises: [dare, ichiban-superlative], mode: build }
      - { kind: sentence, ja: "はると なつと あきと ふゆの なかで いつが いちばん すずしい？", en: "Of spring, summer, autumn and winter, which one is the coolest", exercises: [dare, ichiban-superlative, to-and, ni-time], mode: build }
      - { kind: sentence, ja: "かぞくの なかで だれが いちばん いそがしい？", en: "Who's the busiest in your family", exercises: [dare, ichiban-superlative], mode: translate }
      - { kind: particle-cloze, stem: "にほんの なかで ", tail: "が いちばん さむい？", answer: "どこ", options: ["どこ", "だれ", "いつ"], en: "Where's the coldest place in Japan?", explanation: "にほん is a place, so the question word is どこ. だれ asks after a person and いつ after a time — neither one can be a country's coldest part." }
      - { kind: listening-comp, audio: "くだものの なかで ももが いちばん おいしい。", answer: "Of the fruit, peaches are the most delicious", distractors: ["Peaches are more delicious than cucumbers", "Of the fruit, peaches are the cheapest", "Of the vegetables, cucumber is the most delicious"], exercises: [ichiban-superlative, ga-existence] }
      - { kind: listening-comp, audio: "やさいの なかで なにが いちばん やすい？", answer: "Of the vegetables, which is the cheapest?", distractors: ["Of the fruit, which is the cheapest?", "Of the vegetables, which is the most expensive?", "Which is cheaper, the vegetables or the fruit?"], exercises: [dare, ichiban-superlative] }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "くだものの なかで どれが いちばん たかい？", en: "Of the fruit, which is the most expensive?" }
