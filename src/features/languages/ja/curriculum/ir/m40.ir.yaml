notes: |
  m40 · n4-11 — PASSIVE I: DIRECT PASSIVE られる (docs/spine-n4.md §n4-11,
  docs/ja-m40-brief-2026-09-10.md). Ships 12 lessons (inv 25: 8 teaching + 3
  review + 1 challenge, challenge last).

  WHAT IS TAUGHT:
  1. **Mechanical formation (L2, id passive-form, one combined card):** godan/u
     bends the dictionary form to its a-stem and adds れる (ぬすむ →
     ぬすまれる); ichidan drops る and adds られる (ほめる → ほめられる);
     irregulars are memorized whole (する → される, くる → こられる — only
     される is ever drilled, see collision note below). Both classes ride ONE
     rule card (not two variant cards) — density cap (moduleBarGuards.ts,
     ≤2 consecutive grammar_rule steps) leaves no room for a 3rd card in the
     same lesson alongside passive-rareru's own agent-marking card.
  2. **Direct passive, person-as-subject (L2-L3, id passive-rareru):** the
     one affected by the action becomes topic, the doer takes に. Taught
     with DELIBERATE mixed valence — せんせいに ほめられた (good news) sits
     beside がくせいは せんせいに しかられた (bad news) — so the grammar
     itself is never taught as inherently negative, a common learner
     misconception this module avoids on purpose.
  3. **Possessed-object passive (L3, id possessed-object-passive):** when
     what's affected is something OWNED, the owner becomes the (often
     dropped) topic and the owned thing keeps を — どろぼうに さいふを
     ぬすまれた, not さいふは ぬすまれた. The opposite promotion English
     makes ("my wallet was stolen").
  4. **Creation/authorship passive (L5, id niyotte-creation-passive):**
     によって as the formal cousin of に for who MADE something — この
     きかいは タナカさんに よって はつめいされた — alongside agentless
     される for facts nobody needs a name attached to.
  5. **Suffering passive (L6, id suffering-passive-recognition), RECOGNITION
     ONLY:** 迷惑の受身 — intransitive verbs (ふる, はいる) turned passive
     purely to mark the speaker was inconvenienced, with no English passive
     to match (あめに ふられた = "I got rained on"). Ships via rule prose +
     listening-comp + dialogue lines ONLY — never a `mode: build`/
     `translate`/`listening` sentence, particle-cloze answer, or challenge
     `combines`/`ja`. Production is a later module's job; this module's own
     bespoke test ratchet (`m40-neo.test.ts`) enforces the boundary.

  COLLISION GUARD (brief's own ratchet): たべられる／みられる／こられる are
  byte-identical to m24's already-live POTENTIAL-form atoms (m24 teaches
  たべられる/みられる as "can eat"/"can see", not as passive). This module
  never drills any of the three as a graded answer — no `mode: build`,
  `translate`, `listening` (tile production), particle-cloze answer, or
  challenge `combines`/`ja`. たべられる appears exactly once, inside
  passive-rareru's `rule` prose (a `examples` field is teach-copy, never
  graded — see the grammar point below), to name the ambiguity honestly.
  みられる does not appear anywhere in this module's own IR at all. こられる
  appears once, in passive-form's own `rule` prose ("する → される, くる →
  こられる") — teach-copy naming the irregular pair, never a graded answer;
  its own potential-form collision isn't spelled out there the way
  たべられる's is in passive-rareru's rule (くる's passive is vanishingly rare
  in practice, so this module doesn't dwell on it). Both surfaces also occur
  in the SHARED `TRANSFORM_RULESETS.passive` legend (`transformRulesets.ts`),
  a non-graded reference table shown beside the card, identical in kind to
  m24's own potential-form legend already doing the same thing with the same
  strings.

  RAMP SCHEDULING: only ぬすむ(u)/ほめる(ru)/する(irregular) are drilled via
  the auto-ramp `conjugation_transform` mechanism (L2's rule beats), so only
  they need an earlier-lesson plain-form debut — both ぬすむ and ほめる are
  introduced in L1, strictly before L2's ramp; する is already known
  course-wide, no earlier intro needed. Every OTHER new verb this module
  teaches (しかる, たのむ, よぶ, さそう, たてる, はつめい, けんきゅう, そうさ)
  is hand-authored via `sentence`/`dialogue` beats only, never auto-ramped,
  so its plain form and passive form may debut in the SAME lesson — the
  ramp's earlier-lesson constraint does not apply to the hand-authored path.

  VOCABULARY VERIFIED AGAINST REAL priorVocab (not courseAtoms `fromModule`
  tags, which are stale by construction — confirmed 2026-09-10 by grepping
  every prior `mN.ir.yaml`'s `newAtoms`/lessons for four candidate carrier
  words: パーティー, たくさん, もんだい, つくる. None appear in ANY prior
  IR file's `newAtoms` or lesson body — despite carrying courseAtoms rows,
  none has ever actually been taught by a live lesson. All four AVOIDED in
  this module's content. Also avoided as unsafe/unverified: たいふう, じけん,
  でんきゅう, だれか, おこなう, じしん, つかまる, にげる, あんしん, たすかる,
  ゆうめい, すぐ, はなす, ぶつかる — none confirmed taught, none used.

  Two courseAtoms stub rows repointed to this module (brief §1/§2 pattern,
  same ruling as m38/m39's "future"-tagged repoints): たのむ (was
  fromModule:"future") and よぶ (was fromModule:"future") both debut for
  real in L3 (ja-m40-neo-3) — listed in `newAtoms` below only so
  priorVocab/lesson.introduces machinery sees them as this module's own; the
  courseAtoms.ts edit does the actual fromModule/introducedByLessonId flip.

grammarPoints:
  - id: passive-form
    rule: "Two shapes, one job. An u-verb (godan) rides the same stem grid you already know from ば and volitional, but lands on the A-ROW: shift the dictionary form's final -u sound back to its -a partner, add れる — ぬすむ → ぬすま + れる = ぬすまれる, かう → かわ + れる = かわれる. An ichidan (ru) verb does what it always does — drop る, add the ending whole: ほめる → ほめ + られる = ほめられる. The two irregulars are two words to memorize outright: する → される, くる → こられる. Notice ichidan られる and godan れる are close cousins — both are 'the verb, plus something-reru' — but only ichidan gets the extra ら."
    conjugation: { form: passive, classes: [u, ru, irregular] }
    examples:
      - { ja: "ぬすむ → ぬすまれる", en: "to steal → to be stolen" }
      - { ja: "かう → かわれる", en: "to buy → to be bought" }
      - { ja: "ほめる → ほめられる", en: "to praise → to be praised" }
      - { ja: "する → される", en: "to do → to be done" }
    antiPattern: { ja: "ぬすむられる", why: "られる only glues straight onto a verb that already ends in a vowel stem (ichidan) — an u-verb has to bend to its a-row FIRST: ぬすむ → ぬすま, then + れる. ぬすまれる." }
  - id: passive-rareru
    rule: "Turn the sentence around: the person something happens TO becomes the topic, marked は/が, and the person who DOES it takes に — the passive's agent marker. がくせいは せんせいに ほめられた: the student is the one it happened to; the teacher is who did it. This is not always bad news, despite what 'passive voice' might suggest — せんせいに ほめられた IS good news (I was praised), がくせいは せんせいに しかられた is bad news (was scolded) — the GRAMMAR carries no judgment either way; the verb's own meaning does all of that work. One quirk to file away: for an ichidan verb, られる is the exact same shape as the potential form (たべられる can mean 'is eaten' OR 'can eat') — context is what tells them apart, the same way English 'can' does double duty."
    examples:
      - { ja: "がくせいは せんせいに しかられた。", en: "The student was scolded by the teacher." }
      - { ja: "せんせいに ほめられた。", en: "I was praised by the teacher." }
      - { ja: "せんせいに しつもんされた。", en: "I was asked a question by the teacher." }
    antiPattern: { ja: "がくせいは せんせいを しかられた。", why: "the AGENT of a passive — the one doing it — takes に, not を: を would mark it as a direct object, as if the student did the scolding. せんせいに しかられた。" }
  - id: possessed-object-passive
    rule: "When what got affected is something you OWN, Japanese keeps that thing marked を and makes the OWNER the topic instead — the opposite of English, which promotes the owned thing to subject ('my wallet was stolen'). どろぼうに さいふを ぬすまれた literally sits as '[I], by-a-thief, wallet, was-stolen' — わたしは is usually dropped because it's obvious, but さいふ keeps を the whole time. It never becomes さいふは ぬすまれた unless you're talking about the wallet itself, not about what happened to you."
    examples:
      - { ja: "どろぼうに さいふを ぬすまれた。", en: "My wallet was stolen (by a thief)." }
      - { ja: "どろぼうに とけいを ぬすまれた。", en: "My watch was stolen (by a thief)." }
    antiPattern: { ja: "さいふが どろぼうを ぬすまれた。", why: "the owned thing keeps を; it's the OWNER who becomes the topic, not the wallet: (わたしは) どろぼうに さいふを ぬすまれた。" }
  - id: niyotte-creation-passive
    rule: "For who MADE something — an invention, a building, a discovery — the agent often takes によって instead of plain に, especially in written or explanatory Japanese: この きかいは タナカさんに よって はつめいされた, this machine was invented by Mr. Tanaka. によって sits exactly where に would, marking the agent — it's a more formal cousin, reserved for creation and authorship. Plain に still works and is what you'll hear in conversation; agentless is common too, when the maker doesn't matter: この きかいは けんきゅうされた, this machine was researched (by nobody named)."
    examples:
      - { ja: "この きかいは タナカさんに よって はつめいされた。", en: "This machine was invented by Mr. Tanaka." }
      - { ja: "この いえは ちちに よって たてられた。", en: "This house was built by my father." }
      - { ja: "この きかいは けんきゅうされた。", en: "This machine was researched." }
    antiPattern: { ja: "タナカさんは この きかいを はつめいされた。", why: "the CREATED THING is the topic of a creation-passive, not its maker — swap them: この きかいは タナカさんに よって はつめいされた。" }
  - id: suffering-passive-recognition
    rule: "Some Japanese passives have no English passive to match at all. あめに ふられた doesn't mean 'was rained' — it means something happened TO you and it was a nuisance: I got rained on. ふる (to fall, rain/snow) never takes an object in its plain form — nothing 'does' the raining to anyone — yet the passive still exists, purely to mark that the speaker was inconvenienced by it. どろぼうに はいられた works the same way: a burglar broke in (on me), and I'm the one who suffered for it. Recognize this shape for now — production comes later; for today, just hear the flavour it carries that plain sentences don't."
    examples:
      - { ja: "あめに ふられた。", en: "I got rained on (and it was a pain)." }
      - { ja: "どろぼうに はいられた。", en: "I had a burglar break in on me." }
    antiPattern: { ja: "あめが ふられた。", why: "this passive isn't about the rain — it's about the person it happened to, marked with に, same as every other passive agent: あめに ふられた。" }

newAtoms:
  # ══ L1 — new lemmas, plain-form only, no passive taught yet. ぬすむ and
  # ほめる MUST be introduced here — strictly earlier than L2, which ramps
  # their passive forms via the conjugation_transform auto-generator.
  - { kana: けいさつ, romaji: keisatsu, gloss: "police", shortGloss: "police", imageable: true, kind: vocab }
  - { kana: どろぼう, romaji: dorobou, gloss: "thief, burglar", shortGloss: "thief", imageable: true, kind: vocab }
  - { kana: きず, romaji: kizu, gloss: "a wound, an injury, a scratch", shortGloss: "a wound", imageable: true, kind: vocab }
  - { kana: しかる, romaji: shikaru, gloss: "to scold", shortGloss: "scold", imageable: true, kind: verb, verbClass: u }
  - { kana: ほめる, romaji: homeru, gloss: "to praise", shortGloss: "praise", imageable: true, kind: verb, verbClass: ru }
  - { kana: ぬすむ, romaji: nusumu, gloss: "to steal", shortGloss: "steal", imageable: true, kind: verb, verbClass: u }
  # ══ L2 — passive-form's ramp output (ぬすまれる/ほめられる/される) plus
  # しかられる (hand-authored, not ramped — しかる's plain form was already
  # met in L1, so its passive may debut here freely) and こたえた (a plain
  # past-tense surface of the already-known lemma こたえる, needed for one
  # challenge sentence and never conjugated to past anywhere before m40).
  - { kana: ぬすまれる, romaji: nusumareru, gloss: "to be stolen (passive of ぬすむ)", shortGloss: "be stolen (steal)", imageable: false, kind: verb-form, derivedFrom: ぬすむ, verbClass: u }
  - { kana: ほめられる, romaji: homerareru, gloss: "to be praised (passive of ほめる)", shortGloss: "be praised (praise)", imageable: false, kind: verb-form, derivedFrom: ほめる, verbClass: ru }
  - { kana: される, romaji: sareru, gloss: "to be done (passive of する)", shortGloss: "be done (make)", imageable: false, kind: verb-form, derivedFrom: する, verbClass: irregular }
  - { kana: しかられる, romaji: shikarareru, gloss: "to be scolded (passive of しかる)", shortGloss: "be scolded (scold)", imageable: false, kind: verb-form, derivedFrom: しかる, verbClass: u }
  - { kana: こたえた, romaji: kotaeta, gloss: "answered (past of こたえる)", shortGloss: "answered (answer)", imageable: false, kind: verb-form, derivedFrom: こたえる, verbClass: ru }
  # Past-tense passive surfaces — the tense actually drilled in every graded
  # sentence/challenge/sim beat from here on (られる/される above are the
  # dictionary-form cells the rule cards teach the MECHANICS from; られた/
  # された is what a learner actually produces). Registered alongside their
  # present-tense siblings rather than instead of them — both surfaces are
  # legitimately presented (rule prose uses the dictionary form, everything
  # graded uses past tense).
  - { kana: ぬすまれた, romaji: nusumareta, gloss: "was stolen (passive of ぬすむ)", shortGloss: "was stolen (steal)", imageable: false, kind: verb-form, derivedFrom: ぬすむ, verbClass: u }
  - { kana: ほめられた, romaji: homerareta, gloss: "was praised (passive of ほめる)", shortGloss: "was praised (praise)", imageable: false, kind: verb-form, derivedFrom: ほめる, verbClass: ru }
  - { kana: された, romaji: sareta, gloss: "was done (passive of する)", shortGloss: "was done (make)", imageable: false, kind: verb-form, derivedFrom: する, verbClass: irregular }
  - { kana: しかられた, romaji: shikarareta, gloss: "was scolded (passive of しかる)", shortGloss: "was scolded (scold)", imageable: false, kind: verb-form, derivedFrom: しかる, verbClass: u }
  # ══ L3 — たのむ/よぶ repointed from their courseAtoms "future" stub rows
  # (courseAtoms.ts edit does the actual flip); さそう is a brand-new lemma.
  # All three are hand-authored, never auto-ramped, so plain + passive debut
  # in the same lesson.
  - { kana: たのむ, romaji: tanomu, gloss: "to ask, to request", shortGloss: "ask", imageable: true, kind: verb, verbClass: u }
  - { kana: よぶ, romaji: yobu, gloss: "to call out, to call in, to invite", shortGloss: "call", imageable: true, kind: verb, verbClass: u }
  - { kana: さそう, romaji: sasou, gloss: "to invite", shortGloss: "invite", imageable: true, kind: verb, verbClass: u }
  - { kana: たのまれる, romaji: tanomareru, gloss: "to be asked (passive of たのむ)", shortGloss: "be asked (ask)", imageable: false, kind: verb-form, derivedFrom: たのむ, verbClass: u }
  - { kana: よばれる, romaji: yobareru, gloss: "to be called in (passive of よぶ)", shortGloss: "be called (call)", imageable: false, kind: verb-form, derivedFrom: よぶ, verbClass: u }
  - { kana: さそわれる, romaji: sasowareru, gloss: "to be invited (passive of さそう)", shortGloss: "be invited (invite)", imageable: false, kind: verb-form, derivedFrom: さそう, verbClass: u }
  - { kana: たのまれた, romaji: tanomareta, gloss: "was asked (passive of たのむ)", shortGloss: "was asked (ask)", imageable: false, kind: verb-form, derivedFrom: たのむ, verbClass: u }
  - { kana: よばれた, romaji: yobareta, gloss: "was called in (passive of よぶ)", shortGloss: "was called (call)", imageable: false, kind: verb-form, derivedFrom: よぶ, verbClass: u }
  - { kana: さそわれた, romaji: sasowareta, gloss: "was invited (passive of さそう)", shortGloss: "was invited (invite)", imageable: false, kind: verb-form, derivedFrom: さそう, verbClass: u }
  # ══ L5 — creation/authorship passive: two suru-noun headwords plus a new
  # ichidan lemma, all hand-authored.
  - { kana: はつめい, romaji: hatsumei, gloss: "invention, discovery", shortGloss: "invention", imageable: false, kind: vocab }
  - { kana: けんきゅう, romaji: kenkyuu, gloss: "research", shortGloss: "research", imageable: false, kind: vocab }
  - { kana: たてる, romaji: tateru, gloss: "to build", shortGloss: "build", imageable: true, kind: verb, verbClass: ru }
  - { kana: たてられる, romaji: taterareru, gloss: "to be built (passive of たてる)", shortGloss: "be built (build)", imageable: false, kind: verb-form, derivedFrom: たてる, verbClass: ru }
  - { kana: たてられた, romaji: taterareta, gloss: "was built (passive of たてる)", shortGloss: "was built (build)", imageable: false, kind: verb-form, derivedFrom: たてる, verbClass: ru }
  - { kana: はつめいされた, romaji: hatsumeisareta, gloss: "was invented (passive of はつめいする)", shortGloss: "was invented (invent)", imageable: false, kind: verb-form, derivedFrom: はつめい, verbClass: irregular }
  - { kana: けんきゅうされた, romaji: kenkyuusareta, gloss: "was researched (passive of けんきゅうする)", shortGloss: "was researched (research)", imageable: false, kind: verb-form, derivedFrom: けんきゅう, verbClass: irregular }
  - { kana: けんきゅうされて, romaji: kenkyuusarete, gloss: "researched, and (te-form of けんきゅうされる)", shortGloss: "researched (research)", imageable: false, kind: verb-form, derivedFrom: けんきゅう, verbClass: irregular }
  - { kana: はつめいされて, romaji: hatsumeisarete, gloss: "invented, and (te-form of はつめいされる)", shortGloss: "invented (invent)", imageable: false, kind: verb-form, derivedFrom: はつめい, verbClass: irregular }
  - { kana: よって, romaji: yotte, gloss: "by means of, due to (agent-marking connector in によって)", shortGloss: "by means of", imageable: false, kind: vocab }
  # ══ L6 — suffering passive, RECOGNITION ONLY (see notes above and the
  # module's bespoke test ratchet). ふる/はいる are both already-known
  # lemmas; only their passive surfaces are new.
  - { kana: ふられた, romaji: furareta, gloss: "got rained on (suffering passive of ふる)", shortGloss: "got rained on (rain)", imageable: false, kind: verb-form, derivedFrom: ふる, verbClass: u }
  - { kana: はいられた, romaji: hairareta, gloss: "had (someone) enter, to one's misfortune (suffering passive of はいる)", shortGloss: "broken in on (enter)", imageable: false, kind: verb-form, derivedFrom: はいる, verbClass: u }
  # ══ L7 — extends the けいさつ/どろぼう vocabulary family.
  - { kana: ひがい, romaji: higai, gloss: "damage, harm", shortGloss: "damage", imageable: false, kind: vocab }
  - { kana: そうさ, romaji: sousa, gloss: "(police) investigation", shortGloss: "investigation", imageable: false, kind: vocab }
  - { kana: そうさされた, romaji: sousasareta, gloss: "was investigated (passive of そうさする)", shortGloss: "investigated (investigation)", imageable: false, kind: verb-form, derivedFrom: そうさ, verbClass: irregular }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m40-neo-1
    role: teaching
    title: "「どろぼうが いる」 — the cast for this arc"
    focus: "Priming vocabulary for the passive arc — no new grammar yet, all through は/が/を you already own"
    introduces: [けいさつ, どろぼう, きず, しかる, ほめる, ぬすむ]
    beats:
      - { kind: sentence, ja: "どろぼうが いる。", en: "There is a thief.", exercises: [ga-existence], mode: build }
      - { kind: sentence, ja: "けいさつが きた。", en: "The police came.", exercises: [ta-form], mode: build }
      - { kind: sentence, ja: "きずが ある。", en: "There is a wound.", exercises: [ga-existence], mode: build }
      - { kind: sentence, ja: "せんせいは がくせいを しかる。", en: "The teacher scolds the student.", exercises: [wo-object], mode: build }
      - { kind: sentence, ja: "せんせいは がくせいを ほめる。", en: "The teacher praises the student.", exercises: [wo-object], mode: build }
      - { kind: sentence, ja: "どろぼうは かばんを ぬすむ。", en: "The thief steals the bag.", exercises: [wo-object], mode: build }
      - { kind: listening-comp, audio: "せんせいは ともだちを ほめる。", answer: "The teacher praises my friend.", distractors: ["The teacher scolds my friend.", "My friend praises the teacher.", "My friend scolds the teacher."], q: "What does this mean?" }
      - { kind: listening-comp, audio: "せんせいは ともだちを しかる。", answer: "The teacher scolds my friend.", distractors: ["The teacher praises my friend.", "My friend scolds the teacher.", "My friend praises the teacher."], q: "What does this mean?" }
      - { kind: listening-comp, audio: "どろぼうは ほんを ぬすむ。", answer: "The thief steals the book.", distractors: ["The thief hides the book.", "Someone steals the thief's book.", "The police found the book."], q: "What does this mean?" }
