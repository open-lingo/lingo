lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m38-neo-1
    role: teaching
    title: "「ぜんぶ たべてしまった」 — done, through, all of it"
    focus: "The slot from m30, second resident: しまう behind a て-form means completely — and the 60-second rehash of the schema opens the module"
    introduces: [ぜんぶ, たべてしまった, してしまった, よんでしまう]
    beats:
      # The m30 rehash lives in the rule card's own opening lines ("You have
      # had the て-form since module 8... Here is the second resident") —
      # this is a NEW grammarPointId/variant, not a repeat of an earlier m38
      # card, so no `reteach: true` beat is needed (that flag is only for a
      # SECOND showing of the same id+variant later in the module).
      - { kind: rule, grammarPointId: te-shimau, variant: completion }
      - { kind: sentence, ja: "ぜんぶ たべてしまった。", en: "I ate it all up", exercises: [te-shimau], mode: build }
      - { kind: sentence, ja: "しゅくだいを してしまった。", en: "I got my homework completely done", exercises: [te-shimau, wo-object], mode: build }
      - { kind: sentence, ja: "この ほんは きょう よんでしまう。", en: "I'll finish this book today", exercises: [te-shimau, ni-time], mode: build }
      - { kind: particle-cloze, stem: "この りょうりを ", tail: "。", answer: "たべてしまった", options: ["たべてしまった", "たべるしまった", "たべた"], en: "I ate up this dish completely", explanation: "しまう parks behind the て-form only, never the dictionary form — たべて + しまった. たべるしまった breaks that rule, exactly the module's own antiPattern. たべた is just plain past, no completion-sense at all." }
      - { kind: sentence, ja: "テストを ぜんぶ してしまった。", en: "I got the whole test completely done", exercises: [te-shimau, wo-object], mode: build }
      - { kind: listening-comp, audio: "しゅくだいを してしまった。", answer: "I got my homework completely done", distractors: ["I'm going to do my homework", "I forgot my homework", "I need to do my homework"], q: "What does this mean?", explanation: "してしまった carries COMPLETION — homework, done and put away, nothing left." }
      - { kind: kanji, kana: ほん, kanji: 本, distractors: ["ほんとう", "もと", "ぽん"], exercises: [te-shimau] }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "しゅくだいは？", en: "What about the homework?" }
