notes: |
  m38 · n4-09 — て + HELPER II (docs/spine-n4.md §m38). The second helper
  beat, eight modules after m30, per the spiral spacing rule — and it waits
  this long for a content reason: てしまう's regret reading only exists over
  past events, and its natural spends are mistakes and losses, which the
  learner could not narrate until た, なかった, から/ので were all fluent.
  Placed immediately before passive (m40) so "something bad happened to me"
  will have two grammars to reach for.

  OPENS WITH THE MANDATORY REHASH (spine: "same schema, eight modules on"):
  the m30 slot — a て-form with an ordinary verb parked behind it, meaning
  worn away — restated in 60 seconds before the first new helper. The three
  helpers here obey every rule みる/おく taught: glued to the て-form,
  carrying all the tense, kana always.

  WHAT IS TAUGHT:
  1. **〜てしまう, completion (L1):** しまう is "to put away"; behind a
     て-form its meaning wears down to COMPLETELY, THROUGH, DONE —
     ぜんぶ たべてしまった, ate it all up. Pride or plainness, no shadow.
  2. **〜てしまう, regret (L2), contrasted ON THE SAME VERB (the spine's
     own emphasis):** the identical surface reads as "went and did / it
     slipped out" when the content is a loss or a mistake — かぎを
     なくしてしまった. The TELL is the verb and its object, not the form:
     ぜんぶ たべてしまった (proud, at dinner) vs ともだちの ケーキを
     たべてしまった (sorry, someone else's cake). One beat pair carries
     this and the whole lesson orbits it.
  3. **ちゃう / じゃう as PRODUCTION (L3):** the majority casual form in
     the spoken corpora this course optimizes for (CEJC), so it is drilled
     as production, not shown as trivia: てしまう→ちゃう (たべちゃった),
     でしまう→じゃう (のんじゃった). The learner has been in plain form
     since m3; this is just its newest contraction, same as なきゃ (m28)
     and とく (m30).
  4. **〜ていく / 〜てくる in SPACE (L5/L6):** the viewpoint anchor the
     learner has owned since m19's motion particles, glued behind て:
     もっていく take (away from here), もってくる bring (toward here);
     for people, つれていく / つれてくる — the vocabulary deferred from
     m35 precisely because THIS is its natural frame. くる's irregular
     て-chain gets its own beat: きて → もってきて.
  5. **〜てくる / 〜ていく in TIME (L7) — the half textbooks under-teach,
     per the spine:** change arriving up to now (ふえてきた, it has been
     increasing) vs change heading onward (かわっていく, it will go on
     changing). Taught over ふえる/へる/かわる with weather and prices —
     things the learner can watch move.

  DIALOGUE_SIM ×2:
    - L3, the confession: you broke/lost something of Mika's — てしまった/
      ちゃった is HOW Japanese confesses, and the sim runs the speech act
      (confess, then make it right with m35's favor machinery).
    - L10, the errand: party prep with Ken — なにを もっていく？ what to
      take, what to bring back (かってくる), whom to bring along
      (つれてくる) — the trajectory system doing real logistics.

  VOCAB (spine must/prefer): おとす/こわれる? — CHECK the pack: おちる/
  おとす taught m33; こわれる/こわす were "neither taught" in m33-prep.
  New here: なくす (u, lose), こわす (u, break something), こわれる (ru,
  break of itself — the m33 doctrine's pair, taught late on purpose),
  ふえる (ru, increase), へる (u, decrease), かわる (u, change of itself —
  pairs with taught かえる? CHECK homograph かえる "go home"! かわる is
  safe, かえる collision risk in derived forms — flag for expansion),
  なれる (ru, get used to), まちがえる (ru, get wrong), もどる (u, go
  back — もどってくる), つれる (ru, take someone along — DEFERRED FROM
  m35). CUT: のこる/たりる/すすむ/とちゅう/しまう-as-vocab (the helper is
  grammar; the literal verb can wait). Sidequest untouched.

  TOKENIZER: every helper surface is ledgered (なくしてしまった cannot be
  found inside なくす) — but NOTE the m30 convention and the 2026-08-24
  build-tile guard: helpers are written CLOSED and tiles stay kana via the
  auxiliary-position suppression, which covers てしまう/ていく/てくる
  automatically (orthography-driven, no lemma list). ちゃう/じゃう
  contractions are single-token surfaces (たべちゃった) — ledger each.
  Avoid だけど everywhere (m35 だけ landmine).

grammarPoints:
  - id: te-shimau
    variant: completion
    rule: "Module 30 taught you the slot: a て-form with an ordinary verb parked behind it, its meaning worn away. Here is the second resident. しまう on its own means to put away, to stow; behind a て-form it wears down to COMPLETELY — done, through, all of it. 「ぜんぶ たべてしまった」: ate it all up, nothing left. 「しゅくだいを してしまった」: homework finished, off the desk, put away. Everything you know about the slot carries over unchanged — glued to the て-form, carries all the tense, stays in kana. What is new is only the flavor: an action taken all the way to its end."
    examples:
      - { ja: "ぜんぶ たべてしまった。", en: "I ate it all up." }
      - { ja: "しゅくだいを してしまった。", en: "I got my homework completely done." }
      - { ja: "この ほんは きょう よんでしまう。", en: "I'll finish this book today." }
    antiPattern: { ja: "ぜんぶ たべるしまった。", why: "the helper parks behind the て-form, never the dictionary form — the slot's oldest rule: たべて + しまった. たべてしまった." }

  - id: te-shimau
    variant: regret
    rule: "Now the same surface, second reading. When what got completed is a LOSS or a MISTAKE, てしまった stops sounding proud and starts sounding sorry: 「かぎを なくしてしまった」 — I went and lost the key. 「ともだちの ケーキを たべてしまった」 — I ate my friend's cake, and the form itself winces. Nothing in the grammar changed; the TELL is the content. ぜんぶ たべてしまった at your own dinner is satisfaction; the same verb pointed at somebody else's cake is a confession. Japanese leans on this constantly — てしまった is how the language says \"it slipped out, it went and happened\" — and module 40's passive will give you a second grammar for the same wince."
    examples:
      - { ja: "かぎを なくしてしまった。", en: "I went and lost the key." }
      - { ja: "ともだちの ケーキを たべてしまった。", en: "I (regrettably) ate my friend's cake." }
      - { ja: "でんしゃの なかで ねてしまった。", en: "I fell asleep on the train." }
    antiPattern: { ja: "かぎを なくしてしまいたい。", why: "the regret reading lives over things that HAPPENED — た-shaped. Wanting to lose the key on purpose (〜たい) contradicts the form's whole wince: なくしてしまった." }

  - id: chau
    rule: "What people actually say. てしまう contracts to ちゃう, でしまう contracts to じゃう, and in casual speech the contraction is the MAJORITY form — たべちゃった for たべてしまった, のんじゃった for のんでしまった, なくしちゃった for なくしてしまった. Both readings come along: completion (ぜんぶ たべちゃった) and the wince (ケーキ たべちゃった…). You have met this move twice: なければ→なきゃ (module 28), ておく→とく (module 30). Same law: the contraction is not slang bolted on, it is the spoken shape of the exact grammar you already own, and you drill it as production because that is what your friends will say and expect back."
    examples:
      - { ja: "コーヒーを のんじゃった。", en: "I drank the coffee (all of it / oops)." }
      - { ja: "ぜんぶ たべちゃった。", en: "I ate it all up." }
      - { ja: "かぎを なくしちゃった。", en: "I went and lost the key." }
    antiPattern: { ja: "コーヒーを のんちゃった。", why: "the contraction follows the て-form's own sound: のんで + しまう fuses to のんじゃう, voiced like its で. のんじゃった." }

  - id: te-iku-kuru-space
    rule: "いく and くる have anchored you in space since module 19: いく moves away from here, くる moves toward here. Park them behind a て-form and the anchor comes with them: 「かさを もっていく」 — take the umbrella (carry it AWAY with you); 「かさを もってくる」 — bring it (carry it TOWARD here). For people, Japanese uses つれる: 「いもうとを つれていく」 take my sister along, 「ともだちを つれてくる」 bring a friend. English take/bring is exactly this split, so for once your instinct maps straight on. The helper keeps every slot rule — glued, tense-carrying, kana."
    examples:
      - { ja: "かさを もっていく。", en: "I'll take an umbrella." }
      - { ja: "あした おかしを もってくる。", en: "I'll bring sweets tomorrow." }
      - { ja: "ともだちを つれてくる。", en: "I'll bring a friend along." }
    antiPattern: { ja: "ともだちを もってくる。", why: "もつ carries THINGS — people are not carried, they are led along: つれてくる. The pair does the same trajectory work, split by what travels." }

  - id: kite-chain
    rule: "One bump to smooth while the trajectory system is fresh: くる's て-form is きて — the irregular you have known since module 8 — and it keeps being きて inside every chain built on it. 「もってきて」: bring it here, please (もって + きて + the bare-て request from module 35's ladder). 「つれてきて」: bring them along. Learners who autopilot くって or こって break the only truly irregular verb in the system; say the chain out loud until きて is automatic."
    examples:
      - { ja: "みずを もってきて。", en: "Bring me some water." }
      - { ja: "あした ともだちを つれてきて。", en: "Bring your friend along tomorrow." }
    antiPattern: { ja: "みずを もってくって。", why: "くる is irregular everywhere it appears — its て-form is きて, inside chains too: もってきて." }

  - id: te-kuru-iku-time
    rule: "The half of the trajectory system textbooks skip: it works in TIME. てくる is change that has been arriving — up to now, toward the present: 「さむく なってきた」, it has been getting cold (and here we are, in it). ていく is change heading onward — from now, away into the future: 「これから さむく なっていく」, it is going to go on getting colder. Same anchor as space: くる toward here-and-now, いく away from it. Watch prices, weather, your own Japanese: ふえてきた (has been increasing), へっていく (will keep decreasing), かわっていく (will go on changing). Once you hear time flowing through いく and くる, half of written Japanese opens up."
    examples:
      - { ja: "さむく なってきた。", en: "It's been getting cold." }
      - { ja: "にほんごが じょうずに なってきた。", en: "My Japanese has been getting better." }
      - { ja: "まちは かわっていく。", en: "The town will go on changing." }
    antiPattern: { ja: "あしたから さむく なってきた。", why: "てくる runs UP TO the present — it cannot start tomorrow. Change heading onward takes ていく: あしたから さむく なっていく." }

