notes: |
  m37 · n4-08 — CONDITIONALS II: ば + なら (docs/spine-n4.md §m37). Five
  modules after conditionals I, deliberately non-adjacent: the four
  conditionals are mutually confusable the way は/が are, and the course
  already ruled on that class — PAIRWISE on introduction, N-way only on
  review (RUN-PLAN standing decision 5). Here that means: ば vs たら, then
  なら vs たら. NEVER ば vs なら, never 3- or 4-way — that beat belongs to
  the m51 capstone alone, and a test ratchet should enforce it.

  WHAT IS TAUGHT:
  1. **ば off the e-stem (L1 u-verbs, L2 ru/irregular + い-adjectives +
     ない)** — m7's stem grid pays out for the third time (potential m24,
     volitional m34, now ば). いけば / たべれば / たかければ / なければ.
     Engine support (`ba` ChainForm + IAdjForm) landed alongside this
     module; transform-card ramp + rule table per the standing formation
     rule.
  2. **THE UNFREEZE (L1, second card — the highest-value five minutes in
     the module, per the spine):** the learner has PRODUCED ば inside a
     frozen frame since m28 — なければならない / なきゃ. This module shows
     the frame was ば all along: いかなければ is いかない bent into its
     ば-form. Same class of reveal as m34's ましょう-was-volitional; the
     course's signature move, third performance.
  3. **ば's restriction (L3):** an ACTION-VERB ば-clause blocks a
     request/command/invitation main clause (×たべれば、かってください) —
     its mechanical tell, exactly as と had one (m32). STATE/adjective
     ば-clauses are exempt (てんきが よければ、いこう is fine), and the
     L5 sim deliberately lives in that exemption.
  4. **ば vs たら, PAIRWISE (L3/L5):** たら is the hub every newcomer is
     measured against — sequential, "when/once it happens"; ば is the pure
     logical if — general truths, advice, wishes. Same sentence, both
     forms, en-glosses force the choice.
  5. **なら takes the TOPIC, not the timeline (L6):** "if that's the
     case / if that's what we're talking about" — それなら, and
     にほんに いくなら、きっぷを かっておいた ほうが いい. The only
     conditional whose result can PRECEDE its condition in time.
  6. **なら vs たら, PAIRWISE (L7):** いくなら かっておく (buy BEFORE
     going — advice about the plan) vs いったら かう (buy AFTER arriving).
     The timeline direction is the tell; rides m30's ておく on the way.
  7. **〜ば〜ほど, RECOGNITION rider (L9):** やすければ やすいほど いい.
     ほど gets its atom here (N3-leaning; recognition only).

  DIALOGUE_SIM ×2:
    - L5, weekend weather with Mika: てんきが よければ、いこう — the
      state-ば exemption lived; second turn pivots on Mika's たら.
    - L10, travel advice for Tom: いくなら、ホテルを よやくした ほうが
      いい — なら advice as the natural speech act it is.

  VOCAB (spine must/prefer): れんしゅう is ALREADY TAUGHT. New: ひつよう
  (necessary), つごう (schedule-convenience), まにあう (u, make it in
  time), おくれる (ru, be late), ほど (particle, recognition). CUT from
  prefer: きそく/ばあい/じょうけん/たしかめる/ちょうど/とにかく/せっかく
  (room; the module's load is the two conditionals). VERIFY every word
  below against docs/context/m37-context.md when it is generated — this
  skeleton was drafted against pre-m36 vocabulary.

  TOKENIZER: every ば-surface used is a verb-form/adj-form ledger entry
  (いけば cannot be found inside いく). なければ may already be frozen
  debt from m28 (なきゃ/なければならない) — CHECK the registry state
  before adding a duplicate.

grammarPoints:
  - id: ba-form
    variant: shape-u
    rule: "The stem grid pays out a third time. You slid the u-row to the o-row for the volitional (のもう); now slide it to the E-ROW and add ば: いく→いけば, のむ→のめば, かう→かえば, まにあう→まにあえば. The meaning is the pure IF — a logical hinge with no story attached: いけば、わかる。 If you go, you'll understand. Nothing about when, nothing about whether it already happened — just: condition, consequence. That purity is what separates it from たら, and the next lessons drill exactly that line."
    conjugation: { form: ba, classes: [u] }
    examples:
      - { ja: "いけば、わかる。", en: "If you go, you'll understand." }
      - { ja: "いそげば、まにあう。", en: "If you hurry, you'll make it." }
      - { ja: "きけば、こたえてくれる。", en: "If you ask, they'll answer you." }
    antiPattern: { ja: "いくば、わかる。", why: "ば rides the e-stem, not the dictionary form — the last sound slides to the e-row first: いく → いけ + ば. いけば." }

  - id: ba-form
    variant: unfreeze
    rule: "Now look at something you have said for nine modules. Since module 28: いかなければ ならない — \"if not going won't do\", must go. You memorised なければ as a frozen block. Unfreeze it: なければ is just ない bent into its ば-form. ない is an i-adjective, i-adjectives make their ば with ければ — たかい→たかければ, ない→なければ. The whole apparatus of obligation you have been carrying was a plain conditional all along: いかなければ、ならない — IF I don't go, it won't do. Nothing new to learn here; something old to finally see. This is the third time the course has done this to you — ました was た wearing ます, ましょう was the volitional, and now なきゃ was ば."
    examples:
      - { ja: "たかければ、かわない。", en: "If it's expensive, I won't buy it." }
      - { ja: "やすければ、かう。", en: "If it's cheap, I'll buy it." }
      - { ja: "じかんが なければ、いかない。", en: "If there's no time, I'm not going." }
    antiPattern: { ja: "たかいければ、かわない。", why: "the い drops before ければ, exactly as it drops before くない: たかい → たか + ければ. たかければ." }

  - id: ba-form
    variant: ru-irregular
    rule: "The rest of the system, quickly, because it is the same grid: ru-verbs drop る and take れば — たべる→たべれば, みる→みれば, おくれる→おくれれば. The irregulars are two words: する→すれば, くる→くれば. Done. Every verb and every i-adjective you own can now hinge an if. Notice how close the ru-verb ば sits to the potential (たべれば / たべられる) — the e-row is doing the work in both, which is why the grid keeps paying."
    conjugation: { form: ba, classes: [ru, irregular] }
    examples:
      - { ja: "たべれば、わかる。", en: "If you eat it, you'll understand." }
      - { ja: "れんしゅうすれば、できる。", en: "If you practise, you can do it." }
      - { ja: "はやく くれば、まにあう。", en: "If you come early, you'll make it." }
    antiPattern: { ja: "たべば、わかる。", why: "たべる is a ru-verb — it keeps its stem and takes れば: たべれば. たべば amputates the れ, treating it like a u-verb." }

  - id: ba-restriction
    rule: "ば has one wall, and it is mechanical: when the ば-clause is an ACTION someone performs, the main clause cannot be a request, a command, or an invitation. ×たべれば、かってください is out — Japanese refuses \"if you eat it, please buy it\". Reach for たら there: たべたら、かってください。 But when the ば-clause is a STATE — an adjective, ある/いる, わかる — the wall vanishes: てんきが よければ、いこう is perfect. と had a mechanical tell (module 32); this is ば's. You never have to feel it: check what kind of clause sits before ば, and you know what may follow."
    examples:
      - { ja: "じかんが あれば、きてください。", en: "If you have time, please come." }
      - { ja: "てんきが よければ、いこう。", en: "If the weather's good, let's go." }
      - { ja: "やすければ、かったら どう？", en: "If it's cheap, why not buy it?" }
    antiPattern: { ja: "たべれば、かってください。", why: "an action-verb ば-clause cannot govern a request — swap the hinge to たら: たべたら、かってください。 State-ば (よければ、あれば) takes requests freely; action-ば does not." }

  - id: ba-vs-tara
    rule: "You have owned たら for five modules, so put the two side by side. たら is SEQUENTIAL — when it happens, once it happens: うちに かえったら、でんわする, when I get home. ば is LOGICAL — if-then, hung outside time: いそげば、まにあう holds whether you hurry today, tomorrow, or never. The overlap is real; both are often translatable as \"if\". The test that separates them: can you hear \"when/once\" in it? Then たら. Is it a general truth, advice, a pure hinge? ば leans that way. When both fit, both are right — this pair is about reaching for the natural one, not about avoiding an error."
    examples:
      - { ja: "うちに かえったら、でんわする。", en: "When I get home, I'll call you." }
      - { ja: "いそげば、まにあう。", en: "If you hurry, you'll make it." }
      - { ja: "れんしゅうすれば、じょうずに なる。", en: "If you practise, you get good." }
    antiPattern: { ja: "うちに かえれば、でんわする。", why: "not ungrammatical — but the sentence means \"when I get home\", a one-time sequence, and that is たら's home ground: かえったら、でんわする。 ば would frame going home as a hypothesis." }

  - id: nara
    rule: "なら is the conditional that listens. It takes what was just said — or just thought — and makes it the ground: それなら、いい。 If that's the case, fine. On a noun or a verb it means \"if it's X we're talking about\": にほんに いくなら、きっぷを かっておいた ほうが いい — if going to Japan is the plan, buy the ticket in advance. Hear what happened to time there: the buying comes BEFORE the going. なら is the only conditional that can do this, because it doesn't sequence events — it picks up a TOPIC and advises on it. That is why なら is the advice conditional: someone states a plan, なら turns it into the thing your sentence is about."
    examples:
      - { ja: "にほんに いくなら、きっぷを かっておいた ほうが いい。", en: "If you're going to Japan, you should buy the ticket in advance." }
      - { ja: "それなら、いい。", en: "If that's the case, fine." }
      - { ja: "さかなが きらいなら、にくを たべたら どう？", en: "If you don't like fish, why not have the meat?" }
    antiPattern: { ja: "にほんに いったなら、きっぷを かっておいた ほうが いい。", why: "with いった the advice comes after the trip already happened — too late to buy in advance. The plan-as-topic takes the plain form: いくなら." }

  - id: nara-vs-tara
    rule: "The sharpest pair in the module, because the SAME two clauses flip their timeline: いくなら、かっておく — if going is the plan, I'll buy it BEFORE I go. いったら、かう — once I've gone, I'll buy it THERE. たら sequences: its main clause happens after. なら topicalizes: its main clause can happen first, because it is advice about the plan, not a step after it. When you advise someone on something they just said, なら. When you narrate what follows what, たら. Read the direction of time off the pair and you will never mix them."
    examples:
      - { ja: "にほんに いくなら、かばんを かっておく。", en: "If I'm going to Japan, I'll buy a bag beforehand." }
      - { ja: "にほんに いったら、かばんを かう。", en: "When I get to Japan, I'll buy a bag there." }
      - { ja: "えいがを みるなら、この えいがが いい。", en: "If it's a film you're after, this one is good." }
    antiPattern: { ja: "にほんに いったら、かばんを かっておく。", why: "たら sequences — the buying would come after arriving, but ておく means beforehand: the two halves point in opposite directions. Advice about the plan takes なら: いくなら、かっておく." }

  - id: ba-hodo
    rule: "One shape to recognise, not yet to build: 〜ば〜ほど — the same word twice, once in ば-form, once plain, with ほど after it. やすければ やすいほど、いい: the cheaper it is, the better. れんしゅうすれば するほど、じょうずに なる: the more you practise, the better you get. ほど marks extent — \"to the degree that\" — and the doubled verb rides it into English's \"the X-er, the Y-er\". You will meet it constantly in written Japanese; for now, know it when you see it."
    examples:
      - { ja: "やすければ やすいほど、いい。", en: "The cheaper, the better." }
      - { ja: "れんしゅうすれば するほど、じょうずに なる。", en: "The more you practise, the better you get." }
    antiPattern: { ja: "やすければ たかいほど、いい。", why: "the two slots hold the SAME word — the shape is one quality dialled up, not two compared: やすければ やすいほど。" }

