lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m37-neo-1
    role: teaching
    title: "「いけば、わかる」 — the third payout of the stem grid"
    focus: "Slide the u-row to the e-row, add ば — and then unfreeze なきゃ: the obligation you memorised in m28 was a plain conditional all along"
    introduces: [まにあう, いけば, いそげば, きけば, かえば, たかければ, やすければ, なければ]
    beats:
      - { kind: rule, grammarPointId: ba-form, variant: shape-u }
      - { kind: sentence, ja: "いけば、わかる。", en: "If you go, you'll understand", exercises: [ba-form], mode: build }
      - { kind: sentence, ja: "いそげば、まにあう。", en: "If you hurry, you'll make it", exercises: [ba-form], mode: build }
      - { kind: particle-cloze, stem: "はやく ", tail: "、まにあう。", answer: "いけば", options: ["いけば", "いった", "いく"], en: "If you go quickly, you'll make it", explanation: "ば hangs a plain condition on the e-stem — いけば. いった is the finished past, already happened, no if at all. いく is just the bare dictionary form, a fact with no condition attached." }
      - { kind: rule, grammarPointId: ba-form, variant: unfreeze }
      - { kind: sentence, ja: "たかければ、かわない。", en: "If it's expensive, I won't buy it", exercises: [ba-form, i-adj-negative], mode: build }
      - { kind: sentence, ja: "じかんが なければ、いかない。", en: "If there's no time, I'm not going", exercises: [ba-form, nai-existence], mode: build }
      - { kind: listening-comp, audio: "やすければ、かう。", answer: "If it's cheap, I'll buy it", distractors: ["If it's expensive, I'll buy it", "I bought it because it was cheap", "It's cheap, so I won't buy it"], explanation: "ば hangs the general condition — やすければ, if it's cheap — with かう landing the result. Nothing here says when." }
      - { kind: sentence, ja: "きけば、こたえてくれる。", en: "If you ask, they'll answer you", exercises: [ba-form, te-kureru], mode: build }
      - { kind: kanji, kana: じかん, kanji: 時間, distractors: ["じあいだ", "ときかん", "じま"], exercises: [ba-form] }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "じかんが ないよ。", en: "There's no time." }
          - { speaker: "Tom", ja: "いそげば、まにあうよ。", en: "If we hurry, we'll make it." }
          - { speaker: "Ken", ja: "うん、いそごう。", en: "Yeah, let's hurry." }
        questions:
          - { q: "What does Tom say will happen if they hurry?", options: ["They'll make it in time", "They'll be late", "They'll miss the bus", "They'll need a taxi"], answer: "They'll make it in time" }
      - { kind: challenge, ja: "じかんが ないから、 いそげば まにあう。", en: "Since there's no time, if we hurry we'll make it", combines: [ba-form, kara-because, nai-existence], mode: build }
    reviewPool: [じかん, おかね, とけい, かばん, みせ, えき, しゅくだい, てんき]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m37-neo-2
    role: teaching
    title: "「たべれば・すれば・くれば」 — the grid closes"
    focus: "ru-verbs keep the stem and take れば; する and くる are two words — every verb and adjective you own can now hinge an if"
    introduces: [たべれば, みれば, すれば, くれば, れんしゅうすれば, よければ, あれば]
    beats:
      - { kind: rule, grammarPointId: ba-form, variant: ru-irregular }
      - { kind: sentence, ja: "れんしゅうすれば、できる。", en: "If you practise, you can do it", exercises: [ba-form, dekiru], mode: build }
      - { kind: sentence, ja: "しつもんすれば、こたえてくれる。", en: "If you ask a question, they'll answer you", exercises: [ba-form, te-kureru], mode: build }
      - { kind: particle-cloze, stem: "この ほんを ", tail: "、わかる。", answer: "みれば", options: ["みれば", "みた", "みる"], en: "If you look at this book, you'll understand", explanation: "ば hangs the general if on the ru-verb's own stem — みれば. みた is the finished past, already looked. みる is just the bare fact, no condition." }
      - { kind: sentence, ja: "じかんが あれば、きてください。", en: "If you have time, please come", exercises: [ba-form, te-kudasai], mode: build }
