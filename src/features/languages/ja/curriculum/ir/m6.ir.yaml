        en: "There's a mushroom."
        exercises: [aru-ga-existence, ga]
        mode: translate
        alsoAccept: ["きのこは ある。"]
        pitfall:
          wrong: "きのこを ある。"
          title: "ある never takes を"
          why: "ある announces that something EXISTS — the thing is the subject, marked が (きのこが ある). を marks what you act on; existing isn't an action on the mushroom."
      - { kind: sentence, ja: "ほんが ある。", en: "There's a book.", exercises: [aru-ga-existence, ga], mode: build }
