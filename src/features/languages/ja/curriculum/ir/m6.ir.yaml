      - { kind: sentence, ja: "ミカの ねこは いすの うえに いない。", en: "Mika's cat isn't on the chair.", exercises: ["no", wa, spatial-relations, ni-existence, nai-existence, iru-animacy], mode: build, alsoAccept: ["ミカの ねこが いすの うえに いない。"] }
