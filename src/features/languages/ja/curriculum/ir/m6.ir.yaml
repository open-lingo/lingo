      - { kind: sentence, ja: "せんせいは あそこに いる。", en: "The teacher is over there.", exercises: [wa, location-deixis, ni, iru-animacy], mode: build }
      # STRETCH BEAT (Spencer 2026-07-24: "more complicated ones, using at
      # least 3-4 grammar points in a way they haven't seen before"). L1-11
      # never pair a POSSESSIVE subject with a deictic place AND a negative
      # existence — each piece is taught, the combination is new.
      - { kind: sentence, ja: "ケンの くるまは あそこに ない。", en: "Ken's car isn't over there.", exercises: ["no", wa, location-deixis, ni-existence, nai-existence], mode: translate, alsoAccept: ["ケンの くるまが あそこに ない。"] }
