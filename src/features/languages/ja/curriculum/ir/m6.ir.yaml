      - { kind: sentence, ja: "ほんは いすの うえに ある。", en: "The book is on the chair.", exercises: [wa, "no", spatial-relations, ni, aru-ga-existence], mode: build }
      # STRETCH BEAT — every spatial sentence in L1-11 is INANIMATE (ある/
      # ない). This is the first spatial relation with a living subject and a
