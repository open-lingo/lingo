  - id: m6-neo-challenge
    title: "Challenge — put it all together"
    focus: "End-of-module stretch: every m6 concept combined in longer sentences (Spencer 2026-07-24: the old modules' 'final challenge' pattern, revived for the neo spine)"
    introduces: []
    beats:
      - { kind: sentence, ja: "きょうは ミカの いえで ごはんを たべない。", en: "Today I won't eat rice at Mika's house.", exercises: [wa, "no", de-action, wo, nai-ru], mode: build }
