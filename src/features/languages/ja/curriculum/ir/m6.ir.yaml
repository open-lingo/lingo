module: m6
title: "Negatives & Existence"
register: plain
priorNeoModules: [m3, m4, m5]

# Grammar points m6 EXERCISES but does not TEACH — taught in m3-m5, so they
# carry no rule/examples here. `exercises:`/`combines:` may name these; any
# id in neither this list nor grammarPoints[] is a typo (2026-07-26: the
# compiler now reads those fields, so typos surface instead of sailing
# through). NOTE: these are IR-local ids and do NOT yet match
# n5-grammar-points.json's registry ids (wa vs wa-topic, ni vs ni-location,
# …) — that reconciliation is a separate pass.
priorGrammarPoints: [wa, ga, ni, wo, "no", de, mo, dare, kore-deixis, sore-deixis]

# ─────────────────────────────────────────────────────────────────────────
# PROVENANCE / AUTHORING NOTES (free text — ignored by codegen)
# ─────────────────────────────────────────────────────────────────────────
notes: |
  PHASE-1 content IR for m6 ("Negatives & Existence"). Authored teach-first
  and sequentially: the accumulating taught-set is tracked lesson-by-lesson,
  and no surface uses a word before it is introduced.

  === What m6 introduces (per context pack) ===
  1. Plain negative ない by verb class — る-verb (L1), う-verb (L2),
     irregular する/くる (L3).
  2. ある + が (inanimate existence, X が ある) — L4.
  3. いる + animacy (animate existence; ある vs いる) — L5.
  4. Negative existence — ある→ない (IRREGULAR), いる→いない — L6.
  5. ここ/そこ/あそこ/どこ location deixis (parallels これ/それ/あれ/どれ) — L7.
  6. に = location of existence (Place に X が ある/いる) — L8.
  7. で = location of action; に/で contrast — L9.
  8. Spatial-relation nouns (Noun の うえ / Noun の なか + に) — L10 (construction
     lesson, uses the KNOWN nouns うえ/なか; introduces no new atoms).
  9. どこに …？ location Q&A pattern — L11 (integration lesson; no new atoms).
  10. L12 = mixed REVIEW, all-new surfaces, no new atoms, no new grammar.

  === Provenance decisions (READ THESE) ===
  * が, に, で are treated as NEW constructions taught fresh in m6, each via a
    rule card BEFORE first use. They appear in the pack's "known particles"
    list, but that list is auto-generated from old-course fromModule tags,
    which the pipeline does NOT trust. Crucially: m5-neo explicitly did NOT
    teach them (m5-neo L4's own comment says "に is a later module"; motion
    verbs took NO destination; the m5 grammar summary is を + SOV only, no
    が/に/で). So none has a real neo intro step yet → introduced here.
    -> COMPILER: if your neo taught-set (built from priorNeoModules intro
       steps) already contains が/に/で from a genuine prior intro step, drop
       that atom from `newAtoms` to avoid a double-provenance conflict. I have
       listed each as introduced (が=L4, に=L8, で=L9) on the assumption it is
       NOT yet in the neo taught-set.
  * m6 introduces ZERO imageable atoms. Every new atom is a negative form, an
    existence verb, a particle, or a location pointer — all abstract/blocked
    (invariant 4/6). There is therefore NO word_image_mcq debut in this module;
    all debuts are grammar_rule / build / listeningComp (invariant 33's
    intro-capable set). requireImageFirst is vacuously satisfied. Image MCQs
    still appear in the compiler's review tails over PRIOR imageable atoms
    (reviewPool words). This is expected, not a defect.
  * ここ/そこ/あそこ/どこ are BLOCKED (no image MCQ), exactly as これ/それ/あれ/どれ
    are flagged [no image MCQ] in the pack — a picture on a pointer word is a
    rubric violation.
  * ある's negative is IRREGULAR: ある→ない (an i-adjective form), never あらない.
    Taught explicitly in L6; its antiPattern (ほんが あらない。) is the genuine
    learner error. いる→いない follows the ordinary る-drop rule from L1.
  * TOKENIZER NOTE: every conjugated negative (たべない, のまない, いかない, かわない,
    わからない, しない, こない, いない) is a SINGLE atom — do not split off a ない
    suffix. The standalone existence-negative ない (L6) is its OWN distinct atom.
    Match longest surface first so たべない never tokenizes as たべ+ない.
  * CONTEXT-PACK CAVEAT honored: いくら / えん / いらっしゃいませ / です are NOT used
    anywhere in m6 (they are not reliably taught).
  * L7 uses the deictic-predicate frame "Xは <place>" (ねこは あそこ) BEFORE に
    exists — this is the exact parallel of m4's taught "Xは これ/それ/あれ"
    (casual copula-drop). Full "place に ある/いる" arrives in L8.
  * ANIMACY assignments used for existence: animals & people (ねこ いぬ ひと うま
    かめ ぶた ぞう せんせい ともだち がくせい) take いる; lifeless things — objects AND
    plants/fungi/celestial (ほん かさ かぎ くるま いす かばん ぼうし ふね
    きのこ さくら ほし そら えび りょうり) take ある.
  * BANNED CARRIERS — kana-drill spellings, NOT words (Spencer 2026-07-24):
    どあ ぱん ぺん ぴあの are hiragana spellings invented so the M2 kana drills
    had a word for ど/ぱ/ぺ/ぴ. The real words are katakana (ドア パン ペン
    ピアノ) and are not taught until katakana lands. NEVER use them as
    carriers, review-pool entries, or distractors — see
    CourseAtom.kanaDrillOnly, which now excludes them from every pool draw.
    Native substitutes used here: ぱん→きゅうり/ほん, ぴあの→ふね, ぺん→ぼうし/かさ.

  === Distractor sibling-sets (invariant 10) ===
  * Verb-form pickers (negatives): other TAUGHT negatives of the same or a
    sibling verb (cross-verb confusion) — never invented non-words. Non-word
    negatives (のむない/するない/あらない) appear ONLY as grammar antiPatterns,
    where wrong-derivation is the tested contrast.
  * Particle cloze options: sibling particles that are ALREADY TAUGHT at that
    lesson. NB the L8 に-cloze deliberately excludes で (で is not taught until
    L9); the L9/L10 clozes may use で↔に because both are then taught.
  * Location deixis: ここ/そこ/あそこ/どこ are each other's distractors (and
    contrast with the object-pointers これ/それ/あれ/どれ).

  === Reinforcement carriers used (invariant 27) ===
  Woven in as carriers/subjects: ひと きょう うえ いえ あさ うま かめ きのこ さくら
  いけ えび きゅうり ぞう ふね ぶた ぼうし なか かわ うみ えき ほし そら りょうり かさ.
  Harder to fit into negation/existence naturally and LEFT FOR THE COMPILER'S
  TAILS: からだ, あい, かぜ, あおい (adjective), ぷりん. Flag them into the m6 tails
  / next module per the exposure audit.

  === Per-lesson topic map ===
  L1 ない (る-verbs) · L2 ない (う-verbs) · L3 ない (irregular する/くる) ·
  L4 ある + が · L5 いる + animacy · L6 negative existence ない/いない ·
  L7 ここ/そこ/あそこ/どこ · L8 に (existence) · L9 で (action) + に/で contrast ·
  L10 spatial うえ/なか · L11 どこに …？ Q&A · L12 REVIEW.

# ─────────────────────────────────────────────────────────────────────────
# NEW ATOMS — nothing may appear in a surface unless it is here OR in the
# prior-neo taught-set. All imageable:false (see notes: zero imageable atoms).
# ─────────────────────────────────────────────────────────────────────────
newAtoms:
  # -- L1 : る-verb negatives --
  - { kana: たべない, romaji: tabenai, gloss: "won't eat / don't eat", imageable: false, kind: verb-form, derivedFrom: たべる, verbClass: ru }
  - { kana: みない,   romaji: minai,   gloss: "won't watch / don't watch", imageable: false, kind: verb-form, derivedFrom: みる, verbClass: ru }
  # -- L2 : う-verb negatives --
  - { kana: のまない,   romaji: nomanai,   gloss: "won't drink / don't drink", imageable: false, kind: verb-form, derivedFrom: のむ, verbClass: u }
  - { kana: いかない,   romaji: ikanai,    gloss: "won't go / isn't going", imageable: false, kind: verb-form, derivedFrom: いく, verbClass: u }
  - { kana: かわない,   romaji: kawanai,   gloss: "won't buy / don't buy", imageable: false, kind: verb-form, derivedFrom: かう, verbClass: u }
  - { kana: わからない, romaji: wakaranai, gloss: "don't understand / don't get it", shortGloss: "don't understand", imageable: false, kind: verb-form, derivedFrom: わかる, verbClass: u }
  # -- L3 : irregular negatives --
  - { kana: しない, romaji: shinai, gloss: "won't do / don't do", imageable: false, kind: verb-form, derivedFrom: する, verbClass: irregular }
  - { kana: こない, romaji: konai, gloss: "won't come / isn't coming", imageable: false, kind: verb-form, derivedFrom: くる, verbClass: irregular }
  # -- L4 : existence (inanimate) + subject が --
  - { kana: ある, romaji: aru, gloss: "there is / to exist (inanimate)", shortGloss: "there is (things)", imageable: false, kind: verb, verbClass: u }
  - { kana: が,   romaji: ga,  gloss: "subject marker (spotlights the thing that exists)", shortGloss: "subject marker", imageable: false, kind: particle }
  # -- L5 : existence (animate) --
  - { kana: いる, romaji: iru, gloss: "there is / to exist (animate)", shortGloss: "there is (living)", imageable: false, kind: verb, verbClass: ru }
  # -- L6 : negative existence --
  - { kana: ない,   romaji: nai,   gloss: "there isn't (for things)", shortGloss: "there isn't (things)", imageable: false, kind: verb-form, derivedFrom: ある, verbClass: irregular }
  - { kana: いない, romaji: inai,  gloss: "there isn't (for living things)", shortGloss: "there isn't (living)", imageable: false, kind: verb-form, derivedFrom: いる, verbClass: ru }
  # -- L7 : location deixis (blocked, like これ/それ/あれ/どれ) --
  - { kana: ここ,   romaji: koko,  gloss: "here (by me)", imageable: false, kind: vocab }
  - { kana: そこ,   romaji: soko,  gloss: "there (by you)", imageable: false, kind: vocab }
  - { kana: あそこ, romaji: asoko, gloss: "over there (away from both)", imageable: false, kind: vocab }
  - { kana: どこ,   romaji: doko,  gloss: "where?", imageable: false, kind: vocab }
  # -- L8 : location-of-existence particle --
  - { kana: に, romaji: ni, gloss: "at / in (location of existence)", shortGloss: "where it is", imageable: false, kind: particle }
  # -- L9 : location-of-action particle --
  - { kana: で, romaji: de, gloss: "at / in (location of action)", shortGloss: "where you do it", imageable: false, kind: particle }

# ─────────────────────────────────────────────────────────────────────────
# GRAMMAR POINTS
# antiPattern.ja is a FULL-SENTENCE minimal pair of examples[0].ja, one wrong
# piece, GENUINELY incorrect Japanese (invariant 12). Omitted where no natural
# learner error exists (location-deixis).
# ─────────────────────────────────────────────────────────────────────────
grammarPoints:
  - id: nai-ru
    conjugation: { form: nai, classes: [ru] }
    rule: "る-verb negative: drop る, add ない. たべる→たべない, みる→みない. A negative verb is still a whole sentence on its own — たべない = 'I won't eat' — and it never takes だ."
    examples:
      - { ja: "ごはんを たべない。", en: "I don't eat rice." }
      - { ja: "たべない。", en: "I won't eat." }
      - { ja: "しゃしんを みない。", en: "I don't look at the photo." }
    antiPattern: { ja: "ごはんを たべるない。", why: "る-verbs drop る before ない — たべる→たべない, never たべるない." }

  - id: nai-u
    conjugation: { form: nai, classes: [u] }
    rule: "う-verb negative: change the final -u kana to its あ-row partner, then add ない. のむ→のまない (む→ま), いく→いかない (く→か), わかる→わからない (る→ら). Verbs ending in う add わ: かう→かわない (never かあない)."
    examples:
      - { ja: "みずを のまない。", en: "I don't drink water." }
      - { ja: "ほんを かわない。", en: "I won't buy the book." }
      - { ja: "きょうは いかない。", en: "Today I'm not going." }
      - { ja: "わからない。", en: "I don't get it." }
    antiPattern: { ja: "みずを のむない。", why: "う-verbs don't tack ない onto the dict form — the final kana shifts to the あ-row: のむ→のまない." }

  - id: nai-irregular
    conjugation: { form: nai, classes: [irregular] }
    rule: "The two irregulars bend their stems: する→しない, くる→こない. There's no rule to derive these — learn the pair by heart, the way you met する and くる."
    examples:
      - { ja: "これを しない。", en: "I won't do this one." }
      - { ja: "しない。", en: "I won't do it." }
      - { ja: "こない。", en: "I'm not coming." }
    antiPattern: { ja: "これを するない。", why: "する is irregular — its negative is しない, not するない." }

  - id: aru-ga-existence
    rule: "ある says an inanimate thing EXISTS — 'there is'. Mark the thing whose existence you announce with が: ほんが ある = 'there's a book.' が spotlights the subject; ある closes the sentence and takes no だ."
    examples:
      - { ja: "ほんが ある。", en: "There's a book." }
      - { ja: "かさが ある。", en: "There's an umbrella." }
    antiPattern: { ja: "ほんを ある。", why: "existence isn't done TO the book — ある takes が (the thing that exists), never を." }

  - id: iru-animacy
    rule: "いる says a LIVING thing exists — animals and people. Lifeless things take ある; anything alive takes いる. ねこが いる = 'there's a cat'; ほんが ある = 'there's a book.' Both close the sentence plain, no だ."
    examples:
      - { ja: "ねこが いる。", en: "There's a cat." }
      - { ja: "ひとが いる。", en: "There's someone." }
    antiPattern: { ja: "ねこが ある。", why: "a cat is alive, so it takes いる — ある is only for lifeless things." }

  - id: nai-existence
    rule: "No such thing? ある's negative is irregular: ある→ない (not あらない). いる drops る like any る-verb: いる→いない. ほんが ない = 'there's no book'; ねこが いない = 'there's no cat.'"
    examples:
      - { ja: "ほんが ない。", en: "There's no book." }
      - { ja: "ねこが いない。", en: "There's no cat." }
    antiPattern: { ja: "ほんが あらない。", why: "ある is irregular — its negative is ない, never あらない." }

  - id: location-deixis
    rule: "Place pointers mirror これ/それ/あれ/どれ, one step out: ここ = here (by me), そこ = there (by you), あそこ = over there (away from both), どこ = where? ねこは どこ？ 'where's the cat?' → あそこ。 'over there.'"
    examples:
      - { ja: "ねこは どこ？", en: "Where's the cat?" }
      - { ja: "かぎは ここ。", en: "The key's right here." }
      - { ja: "ほんは そこ。", en: "The book's there, by you." }
    # antiPattern omitted (invariant 12): the natural confusion is これ↔ここ /
    # どれ↔どこ, but those are CORRECT Japanese with a different job (object vs
    # place) — contrast material, never a ✗. No natural single-wrong-piece error.

  - id: ni-existence
    rule: "に pins down WHERE something exists. Frame: Place + に + thing + が + ある/いる. あそこに ねこが いる = 'there's a cat over there'; ここに ほんが ある = 'there's a book here.'"
    examples:
      - { ja: "ここに ほんが ある。", en: "There's a book here." }
      - { ja: "あそこに ねこが いる。", en: "There's a cat over there." }
    antiPattern: { ja: "ここ ほんが ある。", why: "the place of existence needs に — ここに, not bare ここ." }

  - id: de-action
    rule: "で marks where an ACTION happens; に marks where something EXISTS. いえで たべる = 'I eat at home' (action); いえに ねこが いる = 'there's a cat at home' (existence). Doing → で. Being → に."
    examples:
      - { ja: "いえで たべる。", en: "I eat at home." }
      - { ja: "うみで あそぶ。", en: "I play at the sea." }
    antiPattern: { ja: "いえに たべる。", why: "eating is an ACTION, so its place takes で — に marks only where things exist." }

  - id: spatial-relations
    rule: "Stack nouns for a precise place: [noun]の うえ = on top of; [noun]の なか = inside. Add に to say where a thing exists. ほんの うえに ねこが いる = 'there's a cat on the book'; かばんの なかに かぎが ある = 'there's a key in the bag.'"
    examples:
      - { ja: "ほんの うえに ねこが いる。", en: "There's a cat on the book." }
      - { ja: "かばんの なかに かぎが ある。", en: "There's a key in the bag." }
    antiPattern: { ja: "ほん うえに ねこが いる。", why: "'the book's top' needs の — ほんの うえ, not ほん うえ." }

  - id: location-qa
    rule: "Ask where with どこ — ねこは どこに いる？ means 'where's the cat?'. Answer with a place plus に — あそこに いる means 'it's over there'. If it's not around, say ここに ない or ねこは いない."
    examples:
      - { ja: "ねこは どこに いる？", en: "Where's the cat?" }
      - { ja: "かばんの なかに ある。", en: "It's in the bag." }
      - { ja: "ここに ない。", en: "It's not here." }
    antiPattern: { ja: "ねこは どこに ある？", why: "a cat is alive → どこに いる, not ある." }

# ─────────────────────────────────────────────────────────────────────────
# LESSONS
# ─────────────────────────────────────────────────────────────────────────
lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m6-neo-1
    title: "Saying no — る-verbs"
    focus: "plain negative for る-verbs: drop る + ない (たべる→たべない, みる→みない)"
    introduces: [たべない, みない]
    beats:
      - { kind: rule, grammarPointId: nai-ru }
      - { kind: sentence, ja: "きゅうりを たべない。", en: "I won't eat the cucumber.", exercises: [nai-ru], mode: build }
      - { kind: sentence, ja: "ごはんを たべない。", en: "I don't eat rice.", exercises: [nai-ru, wo], mode: build }
      - { kind: sentence, ja: "それを みない。", en: "I don't look at that one.", exercises: [nai-ru], mode: listening }
      - { kind: sentence, ja: "しゃしんを みない。", en: "I don't look at the photo.", exercises: [nai-ru, wo], mode: translate }
      - { kind: sentence, ja: "すしを たべない。", en: "I don't eat sushi.", exercises: [nai-ru, wo], mode: build }
      - { kind: sentence, ja: "きょうは たべない。", en: "Today I won't eat.", exercises: [nai-ru, wa], mode: translate }
      - { kind: sentence, ja: "ふねを みない。", en: "I don't look at the boat.", exercises: [nai-ru, wo], mode: listening }
      - kind: dialogue
        speakers-ok: true
        lines:
          - { speaker: Mika, ja: "ごはん、たべる？", en: "Gonna eat rice?" }
          - { speaker: Tom,  ja: "たべない。", en: "I won't." }
        questions:
          - { q: "Does Tom eat the rice?", options: ["No — he won't eat", "Yes — he eats it", "He eats a little", "He drinks instead"], answer: "No — he won't eat" }
      - { kind: capstone, ja: "ミカの ごはんを たべない。", en: "I won't eat Mika's rice.",
          combines: ["no",wo, nai-ru], mode: build }
    reviewPool: [たべる, みる, たべない, みない, ごはん, しゃしん, ふね, きょう]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m6-neo-2
    title: "Saying no — う-verbs"
    focus: "plain negative for う-verbs: final -u → あ-row + ない (のむ→のまない, いく→いかない, かう→かわない, わかる→わからない)"
    introduces: [のまない, いかない, かわない, わからない]
    beats:
      - { kind: rule, grammarPointId: nai-u }
      - { kind: sentence, ja: "わたしは のまない。", en: "I won't drink.", exercises: [nai-u, wa], mode: build }
      - { kind: sentence, ja: "みずを のまない。", en: "I don't drink water.", exercises: [nai-u, wo], mode: build }
      - { kind: sentence, ja: "ミカは いかない。", en: "Mika isn't going.", exercises: [nai-u, wa], mode: listening }
      - { kind: sentence, ja: "ほんを かわない。", en: "I won't buy the book.", exercises: [nai-u, wo], mode: translate, alsoAccept: ["ほんは かわない。"] }
      - { kind: sentence, ja: "トムは わからない。", en: "Tom doesn't get it.", exercises: [nai-u, wa], mode: build }
      - kind: sentence
        ja: "それは わからない。"
        en: "I don't get that one."
        exercises: [nai-u, wa, sore-deixis]
        mode: translate
        # わかる pitfall (Spencer walk 2026-07-23): every learner reaches for
        # を ("get IT" is transitive in English) — それをわからない is wrong.
        # が is correct-but-untaught until L4, so it grades correct via
        # alsoAccept; the pitfall tip fires ONLY on actual を answers.
        alsoAccept: ["それが わからない。"]
        pitfall:
          wrong: "それを わからない。"
          title: "わかる never takes を"
          why: "わかる isn't 'to get something' — it means 'to be clear (to me)'. The thing you understand is the subject, so it takes が (or は as the topic): それが/それは わからない, never それを."
      - { kind: sentence, ja: "ぎゅうにゅうを のまない。", en: "I don't drink milk.", exercises: [nai-u, wo], mode: listening }
      - { kind: sentence, ja: "きょうは いかない。", en: "Today I'm not going.", exercises: [nai-u, wa], mode: build }
      - kind: dialogue
        speakers-ok: true
        lines:
          - { speaker: Ken,  ja: "みず、のむ？", en: "Want some water?" }
          - { speaker: Tom,  ja: "のまない。", en: "I'll pass." }
          - { speaker: Mika, ja: "わたしも のまない。", en: "Me neither." }
        questions:
          - { q: "Will Tom drink the water?", options: ["No — he won't drink", "Yes — he'll drink", "He'll drink later", "He wants tea instead"], answer: "No — he won't drink" }
          - { q: "And Mika?", options: ["She won't drink either", "She'll drink", "Only Mika drinks", "She wants water"], answer: "She won't drink either" }
      - { kind: capstone, ja: "ミカも みずを のまない。", en: "Mika won't drink water either.",
          combines: [mo, wo, nai-u], mode: build }
    reviewPool: [のむ, いく, かう, わかる, のまない, いかない, かわない, わからない, みず, ぎゅうにゅう]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m6-neo-3
    title: "Saying no — する・くる"
    focus: "the two irregular negatives (する→しない, くる→こない) + mixing all three classes"
    introduces: [しない, こない]
    beats:
      - { kind: rule, grammarPointId: nai-irregular }
      - { kind: sentence, ja: "きょう しない。", en: "Today I won't do it.", exercises: [nai-irregular], mode: build }
      - { kind: sentence, ja: "これを しない。", en: "I won't do this one.", exercises: [nai-irregular, wo, kore-deixis], mode: build }
      - { kind: sentence, ja: "ケンは こない。", en: "Ken isn't coming.", exercises: [nai-irregular, wa], mode: listening }
      - { kind: sentence, ja: "ミカは こない。", en: "Mika isn't coming.", exercises: [nai-irregular, wa], mode: translate, alsoAccept: ["ミカが こない。"] }
