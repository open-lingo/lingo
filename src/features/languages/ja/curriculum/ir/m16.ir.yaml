  - { kana: うち, romaji: uchi, gloss: "home, my place", shortGloss: "home", imageable: false, kind: vocab }
  # ══ L3
  - { kana: ので, romaji: node, gloss: "because (softer)", shortGloss: "because", imageable: false, kind: vocab }
  # ══ L4
  - { kana: けど, romaji: kedo, gloss: "but", imageable: false, kind: vocab }
  # ══ L6 — the span, the month suffix, and the module's second picture debut.
  - { kana: まで, romaji: made, gloss: "until, as far as", shortGloss: "until", imageable: false, kind: vocab }
  - { kana: がつ, romaji: gatsu, gloss: "month (in a date)", shortGloss: "month", imageable: false, kind: vocab }
  - { kana: やすみ, romaji: yasumi, gloss: "holiday, time off", shortGloss: "holiday", imageable: true, kind: vocab }
  # ══ L7 — ませんでした. ORDER MATTERS (inv 37): the ramp takes the FIRST THREE
  #    in-scope entries of this list, so the three drilled are the three the
  #    masu-past-negative card spells out, and each of their BASES (たべる /
  #    のむ / する) is taught in m5. The rest carry no verbClass at all.
  - { kana: たべませんでした, romaji: tabemasendeshita, gloss: "didn't eat (polite)", shortGloss: "didn't eat", imageable: false, kind: verb-form, derivedFrom: たべる, verbClass: ru }
  - { kana: のみませんでした, romaji: nomimasendeshita, gloss: "didn't drink (polite)", shortGloss: "didn't drink", imageable: false, kind: verb-form, derivedFrom: のむ, verbClass: u }
  - { kana: しませんでした, romaji: shimasendeshita, gloss: "didn't do (polite)", shortGloss: "didn't make/do", imageable: false, kind: verb-form, derivedFrom: する, verbClass: irregular }
  - { kana: いきませんでした, romaji: ikimasendeshita, gloss: "didn't go (polite)", shortGloss: "didn't travel/go", imageable: false, kind: verb-form, derivedFrom: いく }
  - { kana: みませんでした, romaji: mimasendeshita, gloss: "didn't watch (polite)", shortGloss: "didn't watch", imageable: false, kind: verb-form, derivedFrom: みる }
  - { kana: かいませんでした, romaji: kaimasendeshita, gloss: "didn't buy (polite)", shortGloss: "didn't buy", imageable: false, kind: verb-form, derivedFrom: かう }
  - { kana: きませんでした, romaji: kimasendeshita, gloss: "didn't come (polite)", shortGloss: "didn't come", imageable: false, kind: verb-form, derivedFrom: くる }
  #    さむかった rides L7 as a PAST reason ("I didn't go because it was cold").
  #    No verbClass, so the ませんでした ramp can never pick it up.
  - { kana: さむかった, romaji: samukatta, gloss: "was cold", imageable: false, kind: adj-form, derivedFrom: さむい }
  # ══ L8 — なかった. Same ordering rule: the first three in-scope entries ARE
  #    the ramp, and all three are spelled out on the nai-form card.
  - { kana: たべなかった, romaji: tabenakatta, gloss: "didn't eat", imageable: false, kind: verb-form, derivedFrom: たべる, verbClass: ru }
  - { kana: のまなかった, romaji: nomanakatta, gloss: "didn't drink", imageable: false, kind: verb-form, derivedFrom: のむ, verbClass: u }
  - { kana: しなかった, romaji: shinakatta, gloss: "didn't do", shortGloss: "didn't make/do", imageable: false, kind: verb-form, derivedFrom: する, verbClass: irregular }
  - { kana: いかなかった, romaji: ikanakatta, gloss: "didn't go", shortGloss: "didn't travel/go", imageable: false, kind: verb-form, derivedFrom: いく }
  - { kana: みなかった, romaji: minakatta, gloss: "didn't watch", imageable: false, kind: verb-form, derivedFrom: みる }
  - { kana: かわなかった, romaji: kawanakatta, gloss: "didn't buy", imageable: false, kind: verb-form, derivedFrom: かう }
  - { kana: こなかった, romaji: konakatta, gloss: "didn't come", imageable: false, kind: verb-form, derivedFrom: くる }
  #    ある's past negative. shortGloss deliberately reads "didn't have" so that
  #    it shares a content word with ある's registry gloss ("to be, to have …") —
  #    the gloss-mismatch diagnostic compares exactly that.
  - { kana: なかった, romaji: nakatta, gloss: "there wasn't, didn't have", shortGloss: "didn't have", imageable: false, kind: verb-form, derivedFrom: ある }
  - { kana: ぜんぜん, romaji: zenzen, gloss: "not at all (with a negative)", shortGloss: "not at all", imageable: false, kind: vocab }
  # ══ L9
  - { kana: まい, romaji: mai, gloss: "counter for flat things", shortGloss: "flat-thing counter", imageable: false, kind: vocab }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m16-neo-1
    role: teaching
    title: "いそがしいから うちに いる — the reason comes first"
    focus: "から marks the REASON, and in Japanese the reason clause comes FIRST — the opposite order to English"
    introduces: [さむい, うち]
    beats:
      - { kind: rule, grammarPointId: kara-because }
      - { kind: sentence, ja: "さむいから うちに いる。", en: "It's cold, so I'm staying home", exercises: [kara-because, ni-location], mode: build }
      - { kind: sentence, ja: "たかいから かわない。", en: "It's expensive, so I won't buy it", exercises: [kara-because, nai-form], mode: build }
      - { kind: sentence, ja: "おいしいから よく たべる。", en: "It's delicious, so I eat it often", exercises: [kara-because, i-adj-present], mode: build }
      - { kind: sentence, ja: "じかんが ないから いかない。", en: "I have no time, so I'm not going", exercises: [kara-because, nai-existence], mode: listening }
      - { kind: sentence, ja: "ミカが くるから うちに いる。", en: "Mika is coming, so I'm staying home", exercises: [kara-because, ga-existence], mode: build }
      - { kind: sentence, ja: "ゆきだから ミカは こない。", en: "It's snowing, so Mika isn't coming", exercises: [kara-because, desu-copula], mode: build }
      - { kind: sentence, ja: "にぎやかだから ここが すきだ。", en: "It's lively, so I like it here", exercises: [kara-because, na-adj-present, suki-kirai-no], mode: build }
      - { kind: sentence, ja: "いそがしいから うちに いる。", en: "Say to a friend: I'm staying home because I'm busy", exercises: [kara-because], mode: translate }
      - { kind: particle-cloze, stem: "さむい", tail: " うちに いる。", answer: "から", options: ["から", "でも", "まだ"], en: "It's cold, so I'm staying home", explanation: "から closes the reason clause and holds both halves in one sentence. でも would have to start a new sentence, and まだ means \"still\"." }
      - { kind: listening-comp, audio: "やすいから かう。", answer: "It's cheap, so I'll buy it", distractors: ["It's expensive, so I won't buy it", "I bought it because it was cheap", "It's cheap, but I won't buy it"], exercises: [kara-because, i-adj-present] }
      - { kind: listening-comp, audio: "ともだちが くるから きっさてんに いく。", answer: "A friend is coming, so I'm going to the coffee shop", distractors: ["A friend is coming, so I'm staying home", "I'm going to the coffee shop with a friend", "My friend went to the coffee shop"], exercises: [kara-because, ga-existence] }
      - kind: dialogue
        lines:
          - { speaker: "Tom", ja: "きょうは いく？", en: "Are you going today?" }
          - { speaker: "Mika", ja: "ううん、さむいから。うちで えいがを みる。", en: "Nope — because it's cold. I'll watch a movie at home." }
        questions:
          - { q: "Why isn't Mika going?", options: ["Because it's cold", "Because she's busy", "Because it's expensive", "Because she has no time"], answer: "Because it's cold" }
      - { kind: challenge, ja: "ミカが すきな みせは たかいから きょうは かいものを しない。", en: "The shop Mika likes is expensive, so I'm not shopping today", combines: [kara-because, ga-existence, na-adj-present, nai-form, i-adj-present], mode: build }
    reviewPool: [いえ, じかん, みせ, ゆき, ともだち, えいが, かいもの, ほん, ちゃ, かぜ]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m16-neo-2
    role: teaching
    title: "だれが くる？ — は と が"
    focus: "が carries NEW information and answers a question word; は marks the topic — and a reason clause takes が"
    introduces: []
    beats:
      - { kind: rule, grammarPointId: wa-topic }
      - { kind: sentence, ja: "あした だれが くる？", en: "Who's coming tomorrow?", exercises: [wa-topic, dare], mode: build }
      - { kind: sentence, ja: "ケンが くるから うちで まつ。", en: "Ken is coming, so I'll wait at home", exercises: [wa-topic, kara-because, de-action], mode: build }
      - { kind: sentence, ja: "ミカは がくせいだから いそがしい。", en: "Mika is a student, so she's busy", exercises: [wa-topic, kara-because, desu-copula], mode: build }
      - { kind: sentence, ja: "ここは とりにくが おいしい。", en: "The chicken here is delicious", exercises: [wa-topic, ga-existence, i-adj-present], mode: listening }
      - { kind: sentence, ja: "わたしは じかんが ない。", en: "I have no time", exercises: [wa-topic, nai-existence], mode: build }
      - { kind: sentence, ja: "だれが かった？", en: "Who bought it?", exercises: [wa-topic, dare, ta-form], mode: build }
      - { kind: sentence, ja: "さむいから ミカは うちに いる。", en: "It's cold, so Mika is staying home", exercises: [wa-topic, kara-because], mode: build }
      - { kind: sentence, ja: "きょうは じかんが ない。", en: "Say to a friend: I have no time today", exercises: [wa-topic, nai-existence], mode: translate }
      - { kind: particle-cloze, stem: "あした ", tail: " くる？", answer: "だれが", options: ["だれが", "だれは", "だれも"], en: "Who's coming tomorrow?", explanation: "a question word takes が — nobody can be the topic before you know who they are. だれも needs a negative after it (\"nobody is coming\")." }
      - { kind: listening-comp, audio: "ここは ちゃが おいしい。", answer: "The tea here is delicious", distractors: ["The tea here is expensive", "I like tea", "This tea is famous"], exercises: [wa-topic, ga-existence] }
      - { kind: listening-comp, audio: "だれが ほんを かった？", answer: "Who bought the book?", distractors: ["Whose book is it?", "Did you buy the book?", "Who is looking at the book?"], exercises: [wa-topic, dare] }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "あした だれが くる？", en: "Who's coming tomorrow?" }
          - { speaker: "Mika", ja: "トムが くる。トムは いそがしいから ごごに くる。", en: "Tom is. Tom is busy, so he's coming in the afternoon." }
        questions:
          - { q: "When is Tom coming?", options: ["In the afternoon", "In the morning", "At nine", "He isn't coming"], answer: "In the afternoon" }
      - { kind: challenge, ja: "ミカが すきな えいがは ゆうめいだから きっぷが たかい。", en: "The movie Mika likes is famous, so the tickets are expensive", combines: [wa-topic, ga-existence, na-adj-present, kara-because], mode: build }
    reviewPool: [さむい, うち, ひと, ともだち, えいが, きっぷ, じかん, とりにく, みせ, がくせい]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m16-neo-3
    role: teaching
    title: "しずかなので — the softer reason"
    focus: "ので is から's quieter twin — same slot, softer tone, and な (never だ) after a noun or な-adjective"
    introduces: [ので]
    beats:
      - { kind: rule, grammarPointId: node-because }
      - { kind: sentence, ja: "たかいので かわない。", en: "It's expensive, so I won't buy it", exercises: [node-because, nai-form], mode: build }
      - { kind: sentence, ja: "じかんが ないので いかない。", en: "I have no time, so I'm not going", exercises: [node-because, nai-existence], mode: build }
      - { kind: sentence, ja: "しずかなので ここが すきだ。", en: "It's quiet, so I like it here", exercises: [node-because, na-adj-present, suki-kirai-no], mode: build }
      - { kind: sentence, ja: "ゆきだから ミカは こない。", en: "It's snowing, so Mika isn't coming", exercises: [kara-because, desu-copula], mode: listening }
      - { kind: sentence, ja: "にぎやかなので ここは すきじゃない。", en: "It's noisy, so I don't like it here", exercises: [node-because, na-adj-negative], mode: build }
      - { kind: sentence, ja: "あした じゅぎょうが あるので うちに いる。", en: "I have class tomorrow, so I'm staying home", exercises: [node-because, ga-existence], mode: build }
      - { kind: sentence, ja: "いそがしいので あした いく。", en: "I'm busy, so I'll go tomorrow", exercises: [node-because, i-adj-present], mode: build }
      - { kind: sentence, ja: "さむいので うちに いる。", en: "Say to a friend: I'm staying home because it's cold", exercises: [node-because], mode: translate }
      - { kind: particle-cloze, stem: "しずか", tail: " ここが すきだ。", answer: "なので", options: ["なので", "ので", "だので"], en: "It's quiet, so I like it here", explanation: "a な-adjective takes な in front of ので — しずかなので. しずかので is missing the な, and しずかだので uses the だ that belongs to から and けど." }
      - { kind: listening-comp, audio: "いそがしいので きっさてんに いかない。", answer: "I'm busy, so I'm not going to the coffee shop", distractors: ["I'm busy, but I'm going to the coffee shop", "I'm not busy, so I'm going to the coffee shop", "I was busy, so I didn't go to the coffee shop"], exercises: [node-because, nai-form] }
      - { kind: listening-comp, audio: "にぎやかなので ここが きらいだ。", answer: "It's noisy, so I hate it here", distractors: ["It's quiet, so I like it here", "It's noisy, but I like it here", "I hate the music here"], exercises: [node-because, na-adj-present] }
      - kind: dialogue
        lines:
          - { speaker: "Tanaka", ja: "あした くる？", en: "Are you coming tomorrow?" }
          - { speaker: "Tom", ja: "じゅぎょうが あるので あさは いきません。ごごに いきます。", en: "I have class, so I won't go in the morning. I'll go in the afternoon." }
        questions:
          - { q: "When will Tom go?", options: ["In the afternoon", "In the morning", "He isn't going at all", "At nine"], answer: "In the afternoon" }
      - { kind: challenge, ja: "ミカが すきな きっさてんは しずかなので よく ちゃを のむ。", en: "The coffee shop Mika likes is quiet, so I often drink tea there", combines: [node-because, ga-existence, na-adj-present, wa-topic], mode: build }
    reviewPool: [さむい, うち, じかん, きっさてん, ほん, みせ, ゆき, ともだち, えいが, ちゃ]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m16-neo-review-1
    role: review
    title: "Review — saying why"
    focus: "から and ので side by side, with が inside the reason clause and は outside it"
    introduces: []
    beats:
      - { kind: sentence, ja: "さむいから うちに いる。", en: "It's cold, so I'm staying home", exercises: [kara-because, ni-location], mode: build }
      - { kind: sentence, ja: "たかいので かわない。", en: "It's expensive, so I won't buy it", exercises: [node-because, nai-form], mode: build }
      - { kind: sentence, ja: "ケンが くるから うちで まつ。", en: "Ken is coming, so I'll wait at home", exercises: [wa-topic, kara-because, de-action], mode: listening }
      - { kind: sentence, ja: "しずかなので ここが すきだ。", en: "It's quiet, so I like it here", exercises: [node-because, na-adj-present], mode: build }
      - { kind: sentence, ja: "ミカは がくせいだから いそがしい。", en: "Mika is a student, so she's busy", exercises: [kara-because, desu-copula], mode: build }
      - { kind: particle-cloze, stem: "しずか", tail: " ここが すきだ。", answer: "なので", options: ["なので", "だので", "ので"], en: "It's quiet, so I like it here", explanation: "な-adjectives take な in front of ので. だ belongs to から and けど, and bare ので is missing the な." }
      - { kind: sentence, ja: "ここは とりにくが おいしい。", en: "The chicken here is delicious", exercises: [wa-topic, ga-existence], mode: build }
      - { kind: listening-comp, audio: "じかんが ないので いかない。", answer: "I have no time, so I'm not going", distractors: ["I have time, so I'm going", "I'm not going because it's cold", "I have no money, so I'm not going"], exercises: [node-because, nai-existence] }
      - { kind: sentence, ja: "ゆきだから ミカは こない。", en: "It's snowing, so Mika isn't coming", exercises: [kara-because, desu-copula], mode: build }
      - { kind: sentence, ja: "いそがしいから うちに いる。", en: "Say to a friend: I'm staying home because I'm busy", exercises: [kara-because], mode: translate }
      - { kind: listening-comp, audio: "あした だれが くる？", answer: "Who's coming tomorrow?", distractors: ["Who bought it yesterday?", "Are you coming tomorrow?", "Where are you going tomorrow?"], exercises: [wa-topic, dare] }
      - { kind: sentence, ja: "あした じゅぎょうが あるので うちに いる。", en: "I have class tomorrow, so I'm staying home", exercises: [node-because, ga-existence], mode: build }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "きょう かいものに いく？", en: "Are you going shopping today?" }
          - { speaker: "Ken", ja: "ううん、さむいから うちに いる。", en: "Nope, it's cold, so I'm staying home." }
        questions:
          - { q: "What is Ken doing today?", options: ["Staying home", "Going shopping", "Going to class", "Watching a movie"], answer: "Staying home" }
    reviewPool: [さむい, うち, じかん, ともだち, えいが, きっさてん, とりにく, ゆき, みせ, ほん]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m16-neo-4
    role: teaching
    title: "たかいけど かいたい — saying but"
    focus: "けど joins two clauses the way から does, but marks a contrast; でも starts a new sentence, けど never does"
    introduces: [けど]
    beats:
      - { kind: rule, grammarPointId: kedo }
      - { kind: sentence, ja: "たかいけど かいたい。", en: "It's expensive, but I want to buy it", exercises: [kedo, v-tai], mode: build }
      - { kind: sentence, ja: "いそがしいけど いく。", en: "I'm busy, but I'll go", exercises: [kedo, i-adj-present], mode: build }
      - { kind: sentence, ja: "ゆきだけど いく。", en: "It's snowing, but I'll go", exercises: [kedo, desu-copula], mode: build }
      - { kind: sentence, ja: "じかんが ないので いかない。", en: "I have no time, so I'm not going", exercises: [node-because, nai-existence], mode: listening }
      - { kind: sentence, ja: "ここは しずかだけど すきじゃない。", en: "It's quiet here, but I don't like it", exercises: [kedo, na-adj-negative], mode: build }
      - { kind: sentence, ja: "さむいけど うみに いく。", en: "It's cold, but I'm going to the sea", exercises: [kedo, ni-location], mode: build }
      - { kind: sentence, ja: "のんだけど まだ のみたい。", en: "I drank, but I still want more", exercises: [kedo, ta-form, v-tai], mode: build }
      - { kind: sentence, ja: "たかいけど ほしい。", en: "Say to a friend: It's expensive, but I want it", exercises: [kedo, ga-hoshii], mode: translate }
      - { kind: particle-cloze, stem: "いそがしい", tail: " いく。", answer: "けど", options: ["けど", "から", "ので"], en: "I'm busy, but I'll go", explanation: "けど is the contrast — the second half goes AGAINST the first. から and ので would make being busy the REASON for going." }
      - { kind: listening-comp, audio: "やすいけど かわない。", answer: "It's cheap, but I won't buy it", distractors: ["It's cheap, so I'll buy it", "It's expensive, so I won't buy it", "It was cheap, so I bought it"], exercises: [kedo, nai-form] }
      - { kind: listening-comp, audio: "ゆきだけど えきに いく。", answer: "It's snowing, but I'm going to the station", distractors: ["It's snowing, so I'm not going to the station", "It was snowing at the station", "I go to the station when it snows"], exercises: [kedo, desu-copula] }
      - kind: dialogue
        lines:
          - { speaker: "Tom", ja: "きっぷは たかい？", en: "Is the ticket expensive?" }
          - { speaker: "Mika", ja: "たかいけど かいたい。ゆうめいな えいがだから。", en: "It's expensive, but I want to buy it. It's a famous movie." }
        questions:
          - { q: "What does Mika say about the ticket?", options: ["It's expensive, but she wants it", "It's cheap, so she'll buy it", "She already bought it", "She doesn't want it"], answer: "It's expensive, but she wants it" }
      - { kind: challenge, ja: "ミカが かった くつは たかかったけど きれいだ。", en: "The shoes Mika bought were expensive, but they're pretty", combines: [kedo, ga-existence, ta-form, i-adj-past], mode: build }
    reviewPool: [さむい, うち, ので, きっぷ, えいが, くつ, うみ, ちゃ, みせ, ともだち]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m16-neo-5
    role: teaching
    title: "にほんから くる — the other から"
    focus: "から also marks where something starts FROM; a noun in front means 'from', a whole clause means 'because'"
    introduces: []
    beats:
      - { kind: rule, grammarPointId: kara-origin }
      - { kind: sentence, ja: "トムは アメリカから くる。", en: "Tom is coming from America", exercises: [kara-origin, wa-topic], mode: build }
      - { kind: sentence, ja: "くじから はたらく。", en: "I work from nine", exercises: [kara-origin, counter-ji], mode: build }
      - { kind: sentence, ja: "にほんから ともだちが くる。", en: "A friend is coming from Japan", exercises: [kara-origin, ga-existence], mode: build }
      - { kind: sentence, ja: "あさから いそがしい。", en: "I've been busy since morning", exercises: [kara-origin, i-adj-present], mode: listening }
      - { kind: sentence, ja: "ごごから じゅぎょうが ある。", en: "I have class from the afternoon", exercises: [kara-origin, ga-existence], mode: build }
      - { kind: sentence, ja: "ごじから えいがを みる。", en: "I'll watch the movie from five", exercises: [kara-origin, wo-object], mode: build }
      - { kind: sentence, ja: "さむいから ともだちは にほんから こない。", en: "It's cold, so my friend isn't coming from Japan", exercises: [kara-origin, kara-because], mode: build }
      - { kind: sentence, ja: "あさから はたらく。", en: "Say to a friend: I work from the morning", exercises: [kara-origin], mode: translate }
      - { kind: particle-cloze, stem: "トムは アメリカ", tail: " くる。", answer: "から", options: ["から", "けど", "ので"], en: "Tom is coming from America", explanation: "after a NOUN, から means \"from\". けど and ので can only ever follow a whole clause." }
      - { kind: listening-comp, audio: "アメリカから ともだちが くる。", answer: "A friend is coming from America", distractors: ["A friend is going to America", "My friend is American", "A friend is coming from Japan"], exercises: [kara-origin, ga-existence] }
      - { kind: listening-comp, audio: "ごぜんから いそがしい。", answer: "I'm busy from the morning", distractors: ["I'm busy in the afternoon", "I was busy this morning", "I'm not busy in the morning"], exercises: [kara-origin, i-adj-present] }
      - kind: dialogue
