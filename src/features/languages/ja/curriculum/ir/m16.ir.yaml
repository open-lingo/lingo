module: m16
title: "Connecting: から/ので, ranges, なかった"
register: plain
priorNeoModules: [m3, m4, m5, m6, m7, m8, m9, m10, m11, m12, m13, m14, m15]

priorGrammarPoints: [wo-object, no-possession, ni-location, ni-time, de-action, mo-also,
                     dare, kore-sore-are-dore, koko-soko-asoko, spatial-relations, location-qa,
                     nai-existence, arimasu, imasu, ga-existence,
                     masu-present, masu-negative, masu-past, desu-copula, desu-past, ka-question,
                     dictionary-form, ta-form, te-form, te-iru, te-kara, mae-ni, toki,
                     numbers-1-10, numbers-11-99, counter-ji, counter-tsu, kudasai,
                     i-adj-present, i-adj-negative, i-adj-past, i-adj-past-negative,
                     na-adj-present, na-adj-negative, na-adj-past,
                     v-tai, ga-hoshii, suki-kirai-no, no-ga-suki, to-and, mada-mou]

notes: |
  m16 = spine tile s13. CONNECTING CLAUSES — から (because), ので (softer
  because), けど (but) — plus から's OTHER job (origin), the から…まで span, and
  the two past-negative cells that close the paradigm (ませんでした, なかった).

  THE WHOLE POINT — the reason comes FIRST in Japanese.

  1. **から attaches to the REASON, and the reason clause leads.**
     「さむいから うちに いる」 = it's cold, so I'm staying home. English puts
     the reason SECOND ("I'm staying home because it's cold"); Japanese puts it
     first and hangs から on its end. Every card in the first half says this out
     loud — it is a word-ORDER fact, not a vocabulary fact, and it is the one
     thing learners get wrong here.
  2. **から / ので / けど are ONE shape with three meanings.** All three hang on
     the END of a plain clause and join it to what follows: reason, softer
     reason, concession. Teaching them as one slot with three fillers is what
     lets L4's cloze put all three in the same frame and let the ENGLISH pick
     the winner.
  3. **The だ / な split is the trap worth an anti-pattern beat.** A noun or
     な-adjective takes だ before から and けど (ゆきだから, ゆきだけど) but な
     before ので (しずかなので). L3's antiPattern is exactly 「しずかだので」.
  4. **から also marks ORIGIN, and the test is what sits in front of it.**
     After a NOUN it is "from" (にほんから くる); after a whole CLAUSE it is
     "because" (さむいから いかない). L5 teaches the two senses as a deliberate
     contrast rather than hoping the learner notices.
  5. **ませんでした closes the ます table** (L7) and **なかった closes the plain
     one** (L8). Neither is a new formation: ません + でした is two pieces the
     learner already says, and ない → なかった is the い-adjective swap m12
     already drilled on たかい → たかかった. Both lessons carry a
     conjugation_transform ramp.
  6. **〜まい** (L9) is the flat-thing counter, and the kindest counter in the
     language — no reading ever changes.

  Shape: 13 lessons = 9 teaching + 3 review + 1 challenge, reviews at the
  first/middle/last thirds, challenge lesson LAST (inv 25). NO katakana rows
  (the programme ended at m11). NO `kind: register` beats — that machinery is
  m10 + m29 only (registerScaffoldIsolation).

  DEVIATIONS + DECISIONS, documented per the RUN-PLAN "decide and document" rule:

  - **`made-until` moves from m19's ledger row to m16's — the SPINE wins over
    the coverage table, and the table is EDITED rather than ignored.**
    spinePlan s13 lists "から…まで" in so many words; spinePlan s15 (m19) lists
    only "で means / に arrival / へ direction; までに". So the SPAN belongs
    here, beside the から this module already owns, and only までに (`made-ni`)
    stays with m19. Splitting から…まで across two modules would teach half a
    pair twice — the same argument m14/m15 used to keep まえに and てから
    together. `docs/RUN-PLAN-n4.md`'s m16 and m19 rows are edited to match.
  - **`kara-time` does NOT move.** m16 spends から on clock times (「くじから
    ごじまで はたらく」) but the card that teaches it is `kara-origin` — "から
    marks where something STARTS, a place or a time" is one fact with one rule,
    and m19 keeps the formal time-particle tile (`kara-time`, `made-ni`,
    `counter-fun`) where it sits beside に-time and へ. A second rule beat in
    the same lesson is illegal anyway (m14's layout law: two `kind: rule` beats
    compile to two PINNED, ADJACENT grammar_rule steps and fail the adjacency
    bar), so the honest choice was one card, not a split one.
  - **MONTHS ship as ONE atom, がつ, not twelve.** spinePlan s13 asks for months
    beside the span. Registering いちがつ…じゅうにがつ as twelve atoms would make
    the module a vocabulary table (and each would owe its own ≥3 occurrences),
    so がつ is registered alone and every month is built compositionally from a
    number the learner already owns + がつ — which is also the pedagogy, exactly
    as m11 taught じゅう+X. Deliberately UNUSED: にがつ and じゅうにがつ (both
    tokenize through に, the documented homograph trap — に the particle vs に
    the numeral 2 — so a month containing it mis-credits SRS silently) and
    しちがつ (しち is a courseAtom but no NEO module ever taught it; なな is what
    the learner has). いちがつ / さんがつ / ろくがつ / くがつ / じゅうがつ carry
    the teaching instead, and the card's PROSE names the しがつ/しちがつ/くがつ
    irregular readings without putting them on a graded surface.
  - **ぜんぜん lands as VOCABULARY, not as `frequency-adverbs`.** The spine wants
    ぜんぜん promoted from grammar-mention to reviewed vocabulary (CEJC #97), and
    its own GLUE-ADVERB DRIP line calls for "1-2 top-500 adverbs as vocab per
    module, never a block". `frequency-adverbs` is m22's ledger row and stays
    there; ぜんぜん arrives here as a word, on the L8 rule card, where the
    negative it requires is the lesson's whole subject. Same move m12 made with
    どう.
  - **The PARADIGM SYNTHESIS lives in L7's rule PROSE, not in a card of its
    own.** The spine asks for the full 2×2 (nonpast/past × pos/neg), plain and
    polite, shown as ONE object for the first time. ませんでした IS the last
    cell, so its card is where the table assembles; giving the synthesis a
    separate rule beat would need either a tenth teaching lesson or a second
    pinned rule step in one lesson (illegal, above). It sits in `rule:` prose
    deliberately — prose is mixed-script and invisible to the provenance guard,
    so naming たべなかった there cannot steal L8's debut.
  - **は vs が gets the owned contrast lesson the spine asks for (L2), carried by
    `wa-topic`.** The registry has no `wa-vs-ga` id and inv 42 forbids inventing
    one, so m3's `wa-topic` is re-taught in contrast position — the same ⟳ move
    m15 made with `ta-form`/`ga-existence` and m14 with `te-form`. Likewise
    `nai-form` (m6's) carries the なかった card: the registry has no id for the
    plain past negative, and なかった IS the ない form with an い-adjective
    ending swapped. No ledger row moves for either; a re-teach is not a
    re-assignment.
  - **NO は/が particle_cloze anywhere.** Two independent rules forbid it: inv 5
    (particle_cloze is an INTRODUCTION device — は is m3's, が is m4's) and
    `particleClozePlacement.test.ts` (a true all-particle cloze may not land
    beyond intro + 2). More importantly it would be pedagogically wrong: inv 35
    records that は↔が is never offered as a contrast because swapping them
    usually yields correct Japanese, so half the frames would mark a right
    answer wrong. L2 drills the pair by PRODUCTION (builds where the learner
    lays the particle down) and by question-word frames where only が is
    grammatical.
  - **さむい / やすみ / うち are declared in `newAtoms` although courseAtoms
    already has rows for them** (stale `fromModule` m8 / m10 / m6, from the old
    course). Same move m15 made with まえ and m13 with だいがく: without the
    declaration the compiler treats them as already-known and they leak in as
    words the learner is assumed to have. さむい and やすみ are imageable, so
    both debut on a `word_image_mcq`, and NEITHER is named in any rule card —
    requireImageFirst reads the RAW step JSON, rule cards are pinned first, and
    a mention there would steal the picture debut (m14 learned this the hard
    way). うち has no emoji, so the L1 rule card IS its introduction; it is here
    because it is CEJC #127 and has been seen once in the whole course (inv 27).
  - **A listening_build may never carry a module-new atom's FIRST appearance.**
    `mode: listening` compiles to `listening_build`, which has TILES (so a bare
    ので / まで / がつ / まい tile is a token-initial appearance) but is NOT
    intro-capable. `mode: translate` and dialogue lines are safe by contrast —
    neither decomposes into tiles, and no sentence here begins with one of those
    words. So in each introducing lesson the `mode: listening` beat is
    deliberately built from EARLIER material, unless the atom is already spelled
    token-initially on that lesson's pinned rule card (ぜんぜん, いかなかった).
  - **Verbs the context pack calls known but the guards do not: かく / たつ /
    うたう / なる / ふる / さく / しち.** The pack's word list is built from
    courseAtoms attribution; the taught-set the guards use comes from prior neo
    LESSONS, and `priorVocab` in the compiled JSON is the authority. Every
    surface in this file was checked against it. That is also why あそばない,
    はたらいた, まった, あった, いた, いました, さむくなかった and みせなかった
    never appear: their bases are taught but those particular cells are neither
    courseAtoms nor IR atoms of any module, so the tokenizer shatters them (the
    documented `unbuildable` class). わからなかった was dropped for a different
    reason — わかる's registry gloss is "to be understood", which shares no
    content word with "didn't understand", and the gloss-mismatch diagnostic is
    right to say so.
  - **NO この/その/あの** (m17's `kono-sono-ano-dono`) and **no きた as the past
    of くる** (きた is already an atom meaning "north" — the homograph trap m15
    documented). Where "that shop" was tempting, this module reaches for a
    relative clause (m15's machinery) or ここ/そこ.
  - **Clause boundaries are SPACES, never 、.** `moduleCompiler.clean()` strips
    、 with nothing in its place, so an authored 「さむいから、うちに いる」
    compiles to the run-on target AND the run-on TTS key. Only rule-card prose
    and dialogue lines, which render raw, keep a 、 here.
  - **Bound-suffix check (inv 41).** まい and がつ are new FREE atoms, so both
    were checked against every kana in the registry before shipping: がつ is a
    substring of nothing; まい sits inside せまい / あまい / まいにち / まいばん /
    まいあさ / まいしゅう / まいとし / まいねん / まいげつ / まいつき, and every
    one of those is itself a registered atom, so the longest-match tokenizer
    consumes them whole and まい can never be split out of one.

  ONE RULE CARD PER LESSON (m14's layout law): every teaching lesson here
  carries exactly one, because this module owes nine points across nine teaching
  lessons.

  CONJUGATION RAMPS (inv 37). Two, and only two: L7 (`masu-past-neg`) and L8
  (`nai-past`). The ramp is pinned ahead of the interleaved middle and is NOT
  intro-capable, so for each one the three forms it can emit — たべませんでした /
  のみませんでした / しませんでした, and たべなかった / のまなかった / しなかった —
  are the FIRST THREE in-scope entries of `newAtoms` in declaration order, and
  every one of them is spelled out in its own rule card's `examples:`. Every BASE
  the ramp prints (たべる, のむ, する) is taught in m5 and present in
  `priorVocab`; the m14 defect (a ramp drilling すむ, a verb taught in no module)
  cannot recur here. Every other conjugated atom carries NO `verbClass`, which is
  what keeps it out of ramp material entirely.

  CONNECTIVES + COMPLEXITY (inv 13): this module IS a connective module — から,
  ので and けど are three of the eight surfaces `isComplexSentence` counts, so
  nearly every production sentence is two clauses by construction.

  REINFORCEMENT (inv 27): うち (CEJC #127, seen ~1× in the whole course before
  now) is re-taught rather than assumed; かぜ, とりにく, しゃしん, てがみ and
  シャツ — the context pack's under-exposed targets that survive the priorVocab
  check — rotate as carriers so the module is not a wall of ほん and ごはん.

grammarPoints:
  - id: kara-because
    rule: "から means \"because\" — and the piece that catches every English speaker is WHERE it goes. The reason comes FIRST in Japanese, and から hangs on the END of it: 「いそがしいから うちに いる」 = I'm busy, so I'm staying home. English says the result first and the reason second; Japanese always says the reason first and lets から close it off. Whatever sits in front of から stays in its PLAIN form — a verb, an い-adjective, anything. A noun or a な-adjective needs だ first: 「ゆきだから いかない」."
    examples:
      - { ja: "いそがしいから うちに いる。", en: "I'm busy, so I'm staying home." }
      - { ja: "たかいから かわない。", en: "It's expensive, so I won't buy it." }
      - { ja: "おいしいから よく たべる。", en: "It's delicious, so I eat it often." }
      - { ja: "じかんが ないから いかない。", en: "I have no time, so I'm not going." }
      - { ja: "ゆきだから ミカは こない。", en: "It's snowing, so Mika isn't coming." }
    antiPattern: { ja: "いそがしいだから うちに いる。", why: "から hangs straight onto the plain form — an い-adjective never takes だ. Only a noun or a な-adjective does: いそがしいから うちに いる。" }
  - id: wa-topic
    rule: "は and が both sit behind the person or thing doing something, and they do different jobs. は marks the TOPIC — what the sentence is about, something already in play: 「ミカは がくせいだ」. が marks NEW information — the piece the listener does not have yet, and the ANSWER to a question word: 「だれが くる？」「ケンが くる。」 A question word can never take は, because nothing nobody has named yet can be the topic. There is one more place が is compulsory: inside a reason clause. は belongs to the whole sentence and a sentence gets one topic, so the clause in front of から takes が instead: 「ケンが くるから うちで まつ」."
    examples:
      - { ja: "だれが くる？", en: "Who's coming?" }
      - { ja: "ケンが くるから うちで まつ。", en: "Ken is coming, so I'll wait at home." }
      - { ja: "ミカは がくせいだから いそがしい。", en: "Mika is a student, so she's busy." }
      - { ja: "ここは とりにくが おいしい。", en: "The chicken here is delicious." }
      - { ja: "わたしは じかんが ない。", en: "I have no time." }
    antiPattern: { ja: "だれは くる？", why: "a question word never takes は — you cannot make a topic out of someone nobody has named yet: だれが くる？" }
  - id: node-because
    rule: "ので is から's quieter twin. Same job — it marks the reason, and the reason still comes first — but it SOUNDS softer and more matter-of-fact. から is you asserting the reason; ので presents it as simply how things are, which is why ので is what you reach for when you are explaining yourself to a teacher, to a shop, or to anyone you want to be careful with. It hangs on the plain form exactly like から, with one difference that catches everybody: a noun or a な-adjective takes な in front of ので, never だ. 「しずかなので ここが すきだ」, and 「ゆきなので ミカは こない」."
    examples:
      - { ja: "しずかなので ここが すきだ。", en: "It's quiet, so I like it here." }
      - { ja: "たかいので かわない。", en: "It's expensive, so I won't buy it." }
      - { ja: "じかんが ないので いかない。", en: "I have no time, so I'm not going." }
      - { ja: "ゆきなので ミカは こない。", en: "It's snowing, so Mika isn't coming." }
      - { ja: "あした じゅぎょうが あるので うちに いる。", en: "I have class tomorrow, so I'm staying home." }
    antiPattern: { ja: "しずかだので ここが すきだ。", why: "な-adjectives take な in front of ので, never だ — だ is what から and けど take: しずかなので ここが すきだ。" }
  - id: kedo
    rule: "けど is \"but\", and it is built the same way as から and ので: it hangs on the END of the first clause, on the plain form, and holds both halves in ONE sentence. 「たかいけど かいたい」 = it's expensive, but I want to buy it. You already know でも, and the difference is mechanical rather than a matter of meaning — でも STARTS a new sentence (「たかい。でも かいたい。」) while けど JOINS two clauses inside one. And けど takes だ after a noun or a な-adjective, like から and unlike ので: 「ゆきだけど いく」."
    examples:
      - { ja: "たかいけど かいたい。", en: "It's expensive, but I want to buy it." }
      - { ja: "いそがしいけど いく。", en: "I'm busy, but I'll go." }
      - { ja: "ゆきだけど いく。", en: "It's snowing, but I'll go." }
      - { ja: "のんだけど まだ のみたい。", en: "I drank, but I still want more." }
      - { ja: "ここは しずかだけど すきじゃない。", en: "It's quiet here, but I don't like it." }
    antiPattern: { ja: "たかいだけど かいたい。", why: "けど hangs straight onto the plain form — an い-adjective never takes だ. Only a noun or a な-adjective does: たかいけど かいたい。" }
  - id: kara-origin
    rule: "から has a second job, and it is the older one: it marks where something comes FROM. 「にほんから くる」 = comes from Japan. Same word, and there is one test that always tells you which から you are looking at — what sits in FRONT of it. A NOUN in front means \"from\" (「アメリカから」, a place). A whole CLAUSE in front means \"because\" (「たかいから」, a sentence). It marks the start of a TIME exactly the way it marks the start of a place: 「くじから はたらく」 = I work from nine, 「あさから いそがしい」 = I've been busy since morning."
    examples:
      - { ja: "トムは アメリカから くる。", en: "Tom is coming from America." }
      - { ja: "くじから はたらく。", en: "I work from nine." }
      - { ja: "にほんから ともだちが くる。", en: "A friend is coming from Japan." }
      - { ja: "あさから いそがしい。", en: "I've been busy since morning." }
      - { ja: "ごごから じゅぎょうが ある。", en: "I have class from the afternoon." }
    antiPattern: { ja: "トムは アメリカを くる。", why: "から marks where you come FROM — を marks a direct object, and くる has none: トムは アメリカから くる。" }
  - id: made-until
    rule: "から says where something starts; まで says where it STOPS. Put the pair together and you have a span: 「くじから ごじまで はたらく」 = I work from nine to five. It spans times, places and months alike, and まで is perfectly happy on its own with no から in front of it: 「ごじまで まつ」 = I'll wait until five. Months are a number plus がつ — いちがつ, ろくがつ, じゅうがつ. Three of them bend the number and are worth learning as their own words: April is しがつ, July is しちがつ, September is くがつ — never よんがつ, ななかがつ or きゅうがつ."
    examples:
      - { ja: "くじから ごじまで はたらく。", en: "I work from nine to five." }
      - { ja: "ごじまで まつ。", en: "I'll wait until five." }
      - { ja: "いちがつから さんがつまで さむい。", en: "It's cold from January to March." }
      - { ja: "にほんから アメリカまで いく。", en: "I'll go from Japan to America." }
      - { ja: "あさから ばんまで えいがを みた。", en: "I watched movies from morning till evening." }
    antiPattern: { ja: "くじから ごじから はたらく。", why: "the end of a span is まで, never a second から: くじから ごじまで はたらく。" }
  - id: masu-past-negative
    rule: "You already own three quarters of the ます table — たべます, たべません, たべました — and this is the last cell: \"didn't\". Take the ません you already say and add the でした you already say. たべません + でした → たべませんでした. Nothing is rebuilt and nothing is irregular; every verb does it the same way. Here is the whole thing in one place for the first time, plain on the left and polite on the right. Non-past: taberu / tabemasu. Non-past negative: tabenai / tabemasen. Past: tabeta / tabemashita. Past negative: tabenakatta / tabemasendeshita. Plain is still your default; the polite column is the register you switch into for a teacher, a shop, or a stranger."
    conjugation: { form: masu-past-neg, classes: [ru, u, irregular] }
    examples:
      - { ja: "きのう ごはんを たべませんでした。", en: "I didn't eat yesterday." }
      - { ja: "あさ ちゃを のみませんでした。", en: "I didn't drink tea in the morning." }
      - { ja: "きのうは なにも しませんでした。", en: "I didn't do anything yesterday." }
      - { ja: "ミカは きませんでした。", en: "Mika didn't come." }
      - { ja: "えいがを みませんでした。", en: "I didn't watch the movie." }
    antiPattern: { ja: "きのう ごはんを たべませんだ。", why: "ません takes the whole でした, never a bare だ: きのう ごはんを たべませんでした。" }
  - id: nai-form
    rule: "The plain \"didn't\" is the ない form with its ending swapped: ない → なかった. That is not a new rule to learn — ない conjugates like an い-adjective, and you already turn たかい into たかかった the same way. たべない → たべなかった. いかない → いかなかった. ある keeps the pair you know: ない → なかった, \"there wasn't\". The copula matches it too: じゃない → じゃなかった. Put any of them in front of から or ので and you have every excuse you will ever need. One word travels with them: ぜんぜん, \"not at all\", which only ever appears alongside a negative."
    conjugation: { form: nai-past, classes: [ru, u, irregular] }
    examples:
      - { ja: "きのう ごはんを たべなかった。", en: "I didn't eat yesterday." }
      - { ja: "あさ ちゃを のまなかった。", en: "I didn't drink tea in the morning." }
      - { ja: "きのうは なにも しなかった。", en: "I didn't do anything yesterday." }
      - { ja: "じかんが なかったから いかなかった。", en: "I had no time, so I didn't go." }
      - { ja: "ぜんぜん おもしろくなかった。", en: "It wasn't interesting at all." }
    antiPattern: { ja: "きのう ごはんを たべないかった。", why: "ない drops its い before かった, exactly like たかい → たかかった: きのう ごはんを たべなかった。" }
  - id: counter-mai
    rule: "Flat things — tickets, photographs, letters, shirts, plates — are counted with 〜まい, and it is the kindest counter in the language: no reading ever changes. ichimai, sanmai, yonmai, gomai, all the way up, exactly as you already say the numbers. It sits after the thing being counted and in front of the verb: 「きっぷを さんまい かった」 = I bought three tickets. To ask how many, なんまい: 「きっぷを なんまい かう？」"
    examples:
      - { ja: "きっぷを さんまい かった。", en: "I bought three tickets." }
      - { ja: "しゃしんを ごまい みた。", en: "I looked at five photos." }
      - { ja: "シャツを よんまい かう。", en: "I'll buy four shirts." }
      - { ja: "きっぷを なんまい かう？", en: "How many tickets are you buying?" }
      - { ja: "しゃしんを いちまい ください。", en: "One photo, please." }
    antiPattern: { ja: "きっぷを さん かった。", why: "a bare number cannot count a noun in Japanese — flat things need まい: きっぷを さんまい かった。" }

