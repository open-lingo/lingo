  # ══ L2, id sou-hearsay — the hearsay auxiliary itself, plus its two
  # domain nouns. そうです is the IR-only polite derived form, glued the
  # same free-attachment way, Tanaka-voiced recognition only.
  - { kana: そうだ, romaji: souda, gloss: "I heard that ~, it's said that ~ (hearsay)", shortGloss: "I heard that ~", imageable: false, kind: vocab }
  - { kana: そうです, romaji: soudesu, gloss: "I heard that ~ (polite, hearsay)", shortGloss: "I heard that ~ (polite)", imageable: false, kind: verb-form, derivedFrom: そうだ }
  # そうだった — past-tense hearsay report, needed verbatim (「くるそうだった」,
  # m42-neo-challenge L9): greedy tokenization otherwise strands った off of
  # the already-known そうだ (3-char prefix wins first). Mirrors そうです's
  # own derivedFrom pattern one line up.
  - { kana: そうだった, romaji: soudatta, gloss: "I heard that ~ (past tense report)", shortGloss: "heard that (past)", imageable: false, kind: verb-form, derivedFrom: そうだ }
  - { kana: ばんぐみ, romaji: bangumi, gloss: "TV program, show", shortGloss: "TV program", imageable: false, kind: vocab, pos: noun }
  - { kana: きじ, romaji: kiji, gloss: "article (news)", shortGloss: "article", imageable: false, kind: vocab, pos: noun }
  # ══ L3, id tte-quotative — cashes the p-tte stub (courseAtoms.ts edit,
  # fromModule "m18" → "m42"; no new IR atom, って is a pre-existing row).
  - { kana: うわさ, romaji: uwasa, gloss: "rumor", shortGloss: "rumor", imageable: false, kind: vocab, pos: noun }
  - { kana: きしゃ, romaji: kisha, gloss: "reporter, journalist", shortGloss: "reporter", imageable: false, kind: vocab, pos: noun }
  # ══ L5, id to-itte-ita — the fused carrier atom for 言っていた (word-
  # level ownership; never a bare いって/いった for 言う), plus its
  # polite IR-only derived past. つたえる/しらせる round out the beat.
  - { kana: いっていた, romaji: itteita, gloss: "was saying, said (that ~)", shortGloss: "was saying", imageable: false, kind: vocab }
  - { kana: いっていました, romaji: itteimashita, gloss: "was saying, said (that ~, polite)", shortGloss: "was saying (polite)", imageable: false, kind: verb-form, derivedFrom: いっていた }
  - { kana: つたえる, romaji: tsutaeru, gloss: "to convey, to tell (information) to someone", shortGloss: "to convey", imageable: false, kind: vocab, pos: verb, verbClass: ru }
  - { kana: しらせる, romaji: shiraseru, gloss: "to inform, to let (someone) know", shortGloss: "to let know", imageable: false, kind: vocab, pos: verb, verbClass: ru }
  # つたえた/しらせた — past forms used repeatedly from L5 on (「じしんを
  # つたえた」, 「しらせを しらせた」, etc.). Registered verbatim rather than
  # relying on STEMS auto-derivation, which only covers the hardcoded
  # VERB_ENTRIES/ADJ_ENTRIES tables, not IR-only verbs like these two.
  - { kana: つたえた, romaji: tsutaeta, gloss: "conveyed, told (information) — past of つたえる", shortGloss: "conveyed (convey)", imageable: false, kind: verb-form, derivedFrom: つたえる, verbClass: ru }
  - { kana: しらせた, romaji: shiraseta, gloss: "informed, let (someone) know — past of しらせる", shortGloss: "let know (past)", imageable: false, kind: verb-form, derivedFrom: しらせる, verbClass: ru }
  # ══ L6 — domain build: news/disaster reporting, no new grammar ══
  - { kana: ほうそう, romaji: housou, gloss: "broadcast", shortGloss: "broadcast", imageable: false, kind: vocab, pos: noun }
  - { kana: はっぴょう, romaji: happyou, gloss: "announcement", shortGloss: "announcement", imageable: false, kind: vocab, pos: noun }
  # ══ L7, id rashii-hearsay — らしい itself, a genuine free-attaching
  # い-adjective lemma; no derived atom needed (see notes). ひなん cut.
  - { kana: らしい, romaji: rashii, gloss: "apparently, it seems (hearsay/evidential)", shortGloss: "apparently", imageable: false, kind: vocab, pos: adjective, conjugation: { class: i-adj } }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m42-neo-1
    role: teaching
    title: "「じしんが あった」— the news and weather domain"
    focus: "Priming vocabulary for the hearsay arc — no new grammar yet, all through ga/wa/kara you already own"
    introduces: [じしん, たいふう, じこ, ニュース]
    beats:
      - { kind: sentence, ja: "ニュースで じしんが あった。", en: "There was an earthquake, on the news.", exercises: [de-action, ga-existence, ta-form], mode: build }
      - { kind: sentence, ja: "たいふうが くる。", en: "A typhoon is coming.", exercises: [dictionary-form], mode: build }
      - { kind: sentence, ja: "きのう じこが あった。", en: "There was an accident yesterday.", exercises: [ga-existence, ta-form], mode: build }
      - { kind: sentence, ja: "ニュースで じこの きじを よんだ。", en: "I read an article about the accident, in the news.", exercises: [de-action, wo-object, ta-form], mode: build }
      - { kind: sentence, ja: "たいふうは たいへんだ。", en: "A typhoon is a serious thing.", exercises: [wa-topic, na-adj-present], mode: listening }
      - { kind: particle-cloze, stem: "きのう ", tail: "が あった。", answer: "じこ", options: ["じこ", "じしん", "たいふう"], en: "There was an accident yesterday.", explanation: "'accident' is じこ. じしん is an earthquake and たいふう is a typhoon — both real news words, but neither means 'accident.'" }
      - { kind: listening-comp, audio: "ニュースで じしんが あった。", answer: "There was an earthquake, on the news.", distractors: ["There was an accident, on the news.", "A typhoon is coming, on the news.", "There is no news today."], q: "What does this mean?" }
      - { kind: listening-comp, audio: "たいふうが くる。", answer: "A typhoon is coming.", distractors: ["A typhoon came yesterday.", "There was no typhoon.", "An earthquake is coming."], q: "What does this mean?" }
      - { kind: kanji, kana: じしん, kanji: 地震, distractors: ["じかん", "じてん", "じぶん"], exercises: [ga-existence] }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "きのうの ニュース、みた？じこが あったんだって。", en: "Did you see yesterday's news? There was an accident, I heard." }
          - { speaker: "Ken", ja: "ううん、みてない。たいふうも くるって ニュースに あった。", en: "No, I didn't see it. The news said a typhoon is coming too." }
          - { speaker: "Mika", ja: "たいへんだね。", en: "That's serious." }
        questions:
          - { q: "What two things does the news mention?", options: ["An accident and a coming typhoon", "An earthquake and a party", "A typhoon and an article about Mika", "Nothing, the news was empty"], answer: "An accident and a coming typhoon" }
      - { kind: challenge, ja: "ニュースで じこの きじを よんだから、たいふうが くるのも わかった。", en: "Since I read an article about the accident in the news, I also learned a typhoon is coming.", combines: [de-action, wo-object, kara-because, mo-also], mode: build }
    reviewPool: [ニュース, テレビ, きのう, あした, がっこう]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m42-neo-2
    role: teaching
    title: "「あめが ふるそうだ」— そうだ, what you heard"
    focus: "Core construction: a full plain-form clause + そうだ reports hearsay, never a stem like m36's appearance そう"
    introduces: [そうだ, ばんぐみ, きじ]
    beats:
      - { kind: rule, grammarPointId: sou-hearsay }
      - { kind: sentence, ja: "あめが ふるそうだ。", en: "I heard it's going to rain.", exercises: [sou-hearsay], mode: build }
      - { kind: sentence, ja: "たいふうが くるそうだ。", en: "I heard a typhoon is coming.", exercises: [sou-hearsay], mode: build }
      - { kind: sentence, ja: "ばんぐみは おもしろいそうだ。", en: "I heard the show is interesting.", exercises: [sou-hearsay, wa-topic], mode: build }
      - { kind: sentence, ja: "きじに じしんが あったそうだ。", en: "I heard, from the article, there was an earthquake.", exercises: [sou-hearsay, ni-location], mode: listening }
      - { kind: particle-cloze, stem: "あめが ", tail: "。", answer: "ふるそうだ", options: ["ふるそうだ", "ふる", "ふりそう"], en: "I heard it's going to rain.", explanation: "'I heard' needs the full clause plus そうだ — ふるそうだ. Bare ふる just states the fact with no report at all, and ふりそう is a different word entirely (module 36's appearance そう, on the bare stem, about how the sky LOOKS, not what anyone said)." }
      - { kind: listening-comp, audio: "きしゃは びょうきだそうだ。", answer: "I heard the reporter is sick.", distractors: ["The reporter looks sick.", "The reporter said he is sick.", "The reporter is not sick."], q: "What does this mean?" }
      - { kind: kanji, kana: ばんぐみ, kanji: 番組, distractors: ["ばんごう", "ばんめ", "はんぶん"], exercises: [sou-hearsay] }
      - kind: dialogue
        lines:
          - { speaker: "Tanaka", ja: "あの ばんぐみは おもしろいそうですよ。", en: "I hear that show is interesting." }
          - { speaker: "Ken", ja: "わかった。みますね。", en: "I see. I'll watch it." }
          - { speaker: "Mika", ja: "きじも よんだよ。あしたも あめが ふるそうだ。", en: "I read the article too. I heard it's going to rain tomorrow as well." }
        questions:
          - { q: "What did Tanaka hear about the show?", options: ["That it's interesting", "That it's boring", "That it's cancelled", "Nobody said anything about it"], answer: "That it's interesting" }
      - { kind: challenge, ja: "きじを よんだから、あしたも たいふうが くるそうだと わかった。", en: "Since I read the article, I understood that I heard a typhoon is coming tomorrow too.", combines: [sou-hearsay, kara-because, mo-also, ta-form], mode: build }
    reviewPool: [じしん, たいふう, じこ, ニュース, おもしろい]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m42-neo-3
    role: teaching
    title: "「くるって」— って, casual reported speech"
    focus: "Cash in the p-tte stub: って closes any plain sentence, the casual shortcut for と言っていた"
    introduces: [って, うわさ, きしゃ]
    beats:
      - { kind: rule, grammarPointId: tte-quotative }
      - { kind: sentence, ja: "たなかさんが くるって。", en: "Tanaka said he's coming.", exercises: [tte-quotative], mode: build }
      - { kind: sentence, ja: "きしゃが じこが あったって。", en: "The reporter said there was an accident.", exercises: [tte-quotative], mode: build }
      - { kind: sentence, ja: "ミカは いそがしいって。", en: "Mika said she's busy.", exercises: [tte-quotative], mode: build }
      - { kind: sentence, ja: "たいふうは こないって。", en: "They said the typhoon isn't coming.", exercises: [tte-quotative, nai-form], mode: listening }
      - { kind: particle-cloze, stem: "ケンは ", tail: "って。", answer: "しらない", options: ["しらない", "しる", "しった"], en: "Ken said he doesn't know.", explanation: "って hands over a full plain clause, and 'doesn't know' is しらない, the negative dictionary form. しる is the bare affirmative and しった is the past — neither matches 'doesn't know.'" }
      - { kind: listening-comp, audio: "うわさで きいたんだけど、じしんが あったって。", answer: "I heard a rumor that there was an earthquake.", distractors: ["I read in the newspaper that there was an earthquake.", "There was no earthquake, according to the rumor.", "The reporter said a typhoon is coming."], q: "What does this mean?" }
      - { kind: kanji, kana: きしゃ, kanji: 記者, distractors: ["きじ", "きしゃく", "きせつ"], exercises: [tte-quotative] }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "うわさで きいたんだけど、たいふうが くるって。", en: "I heard a rumor — they said a typhoon is coming." }
          - { speaker: "Mika", ja: "きしゃも たいふうが くるって。じこも あったって。", en: "The reporter said a typhoon is coming too. They also said there was an accident." }
          - { speaker: "Ken", ja: "わかった。たいへんだね。", en: "I see. That's serious." }
        questions:
          - { q: "What did Ken hear a rumor about?", options: ["A typhoon coming", "A party", "A new show", "Nothing, it was silence"], answer: "A typhoon coming" }
      - { kind: challenge, ja: "うわさで きいたし、きしゃも いっていたから、じこが あったって もう わかっている。", en: "Since I heard it as a rumor and what's more the reporter said it too, I already know they said there was an accident.", combines: [tte-quotative, shi-listing, kara-because, te-iru], mode: build }
    reviewPool: [じしん, たいふう, じこ, ニュース, いそがしい]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m42-neo-review-1
    role: review
    title: "Review — そうだ and って"
    focus: "Spiral L1-L3: the domain vocabulary, hearsay そうだ, and casual quotative って — THIS MODULE ONLY"
    introduces: []
    beats:
      - { kind: sentence, ja: "あめが ふるそうだ。", en: "I heard it's going to rain.", exercises: [sou-hearsay], mode: build }
      - { kind: sentence, ja: "たいふうが くるって。", en: "They said a typhoon is coming.", exercises: [tte-quotative], mode: build }
      - { kind: particle-cloze, stem: "ばんぐみは ", tail: "。", answer: "おもしろいそうだ", options: ["おもしろいそうだ", "おもしろい", "おもしろそう"], en: "I heard the show is interesting.", explanation: "'I heard' needs the full adjective plus そうだ — おもしろいそうだ. Bare おもしろい just states an opinion with no report, and おもしろそう is module 36's DIFFERENT word (appearance そう, stem only)." }
      - { kind: sentence, ja: "きしゃが じこが あったって。", en: "The reporter said there was an accident.", exercises: [tte-quotative], mode: build }
      - { kind: sentence, ja: "きじに じしんが あったそうだ。", en: "I heard, from the article, there was an earthquake.", exercises: [sou-hearsay, ni-location], mode: listening }
      - { kind: listening-comp, audio: "うわさで きいたんだけど、たいふうが くるって。", answer: "I heard a rumor — they said a typhoon is coming.", distractors: ["A typhoon already came.", "I read it in the article, not as a rumor.", "There is no typhoon coming."], q: "What does this mean?" }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "あした あめが ふるそうだよ。", en: "I hear it's going to rain tomorrow." }
          - { speaker: "Ken", ja: "わかった。たいふうも くるって うわさで きいた。", en: "I see. I also heard a rumor that a typhoon is coming." }
          - { speaker: "Mika", ja: "たいへんだね。", en: "That's serious." }
        questions:
          - { q: "What does Mika hear about tomorrow?", options: ["That it will rain", "That there was an accident", "That the show is cancelled", "Nothing about the weather"], answer: "That it will rain" }
      - { kind: sentence, ja: "ミカは いそがしいって。", en: "Mika said she's busy.", exercises: [tte-quotative], mode: build }
    reviewPool: [じしん, たいふう, じこ, ばんぐみ, きじ, うわさ, きしゃ]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m42-neo-4
    role: teaching
    title: "「くると いっていた」— と言っていた, reported past"
    focus: "Extend module 18's と-quotation into reported PAST speech with the new fused carrier いっていた"
    introduces: [いっていた, つたえる, しらせる]
    beats:
      - { kind: rule, grammarPointId: to-itte-ita }
      - { kind: sentence, ja: "ミカは あした くると いっていた。", en: "Mika said she was coming tomorrow.", exercises: [to-itte-ita, to-omoimasu], mode: build }
      - { kind: sentence, ja: "たなかさんは たいふうが くると いっていた。", en: "Tanaka said a typhoon was coming.", exercises: [to-itte-ita], mode: build }
      - { kind: sentence, ja: "きしゃは じこが あったと いっていた。", en: "The reporter said there was an accident.", exercises: [to-itte-ita, ta-form], mode: build }
      - { kind: sentence, ja: "きしゃは わたしに じしんを つたえた。", en: "The reporter conveyed news of the earthquake to me.", exercises: [ni-recipient, wo-object, ta-form], mode: build }
      - { kind: sentence, ja: "きしゃは ニュースを つたえる。", en: "The reporter conveys the news.", exercises: [wo-object], mode: build }
      - { kind: sentence, ja: "せんせいは がくせいに じしんを しらせる。", en: "The teacher informs the students about the earthquake.", exercises: [ni-recipient, wo-object], mode: build }
      - { kind: particle-cloze, stem: "ケンは いそがしい", tail: "いっていた。", answer: "と", options: ["と", "を", "が"], en: "Ken said he was busy.", explanation: "A quoted whole sentence is handed over with と, never を or が — those mark a thing or a subject, and 'Ken is busy' is a whole clause, not either of those: いそがしいと いっていた。" }
      - { kind: listening-comp, audio: "せんせいは がくせいに じしんを しらせた。", answer: "The teacher informed the students about the earthquake.", distractors: ["The students informed the teacher.", "The teacher forgot to tell the students.", "Nobody told the students anything."], q: "What does this mean?" }
      - { kind: kanji, kana: つたえる, kanji: 伝える, distractors: ["つかれる", "つづける", "つくる"], exercises: [to-itte-ita] }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "たなかさんは なんて いっていた？", en: "What did Tanaka say?" }
          - { speaker: "Mika", ja: "たいふうが くると いっていたよ。きしゃにも しらせたって。", en: "She said a typhoon was coming. She said she informed the reporter too." }
          - { speaker: "Ken", ja: "わかった。ぼくも たなかさんに つたえるね。", en: "Got it. I'll tell Tanaka too." }
        questions:
          - { q: "What did Tanaka say, according to Mika?", options: ["That a typhoon was coming", "That there was an accident", "That the show was interesting", "Nothing, she was silent"], answer: "That a typhoon was coming" }
      - { kind: challenge, ja: "たなかさんは たいふうが くると いっていたし、きしゃにも しらせたと いっていた。", en: "Tanaka said a typhoon was coming, and what's more said she had informed the reporter too.", combines: [to-itte-ita, shi-listing, ta-form], mode: build }
    reviewPool: [じしん, たいふう, じこ, うわさ, きしゃ, ばんぐみ]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m42-neo-5
    role: teaching
    title: "「ほうそうで はっぴょうした」— domain build: news and disaster reporting"
    focus: "Recombine every hearsay marker so far over new domain vocabulary — no new grammar"
    introduces: [ほうそう, はっぴょう]
    beats:
      - { kind: sentence, ja: "ほうそうで じしんの はっぴょうが あった。", en: "There was an announcement about the earthquake, on the broadcast.", exercises: [de-action, ga-existence, ta-form], mode: build }
      - { kind: sentence, ja: "きしゃは ほうそうで じこを つたえた。", en: "The reporter conveyed news of the accident on the broadcast.", exercises: [wa-topic, de-action, wo-object, ta-form], mode: build }
      - { kind: sentence, ja: "はっぴょうで、たいふうが くるそうだ。", en: "According to the announcement, I heard a typhoon is coming.", exercises: [sou-hearsay], mode: build }
      - { kind: sentence, ja: "たなかさんは ほうそうを みたと いっていた。", en: "Tanaka said she watched the broadcast.", exercises: [to-itte-ita, ta-form], mode: listening }
      - { kind: particle-cloze, stem: "ほうそうで じしんの ", tail: "が あった。", answer: "はっぴょう", options: ["はっぴょう", "ほうそう", "きじ"], en: "There was an announcement about the earthquake, on the broadcast.", explanation: "'announcement' is はっぴょう. ほうそう is the broadcast itself (already named earlier in the sentence) and きじ is a written article, not an announcement." }
      - { kind: listening-comp, audio: "きしゃは ほうそうで じこを つたえた。", answer: "The reporter conveyed news of the accident on the broadcast.", distractors: ["The reporter caused the accident.", "The reporter said nothing about the accident.", "The reporter read about the accident in the newspaper."], q: "What does this mean?" }
      - { kind: kanji, kana: ほうそう, kanji: 放送, distractors: ["ほうこく", "ほうもん", "ほうりつ"], exercises: [de-action] }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "ほうそう みた？じしんの はっぴょうが あったって。", en: "Did you see the broadcast? They said there was an announcement about the earthquake." }
          - { speaker: "Ken", ja: "うん、きしゃが つたえたね。たいふうも くるそうだよ。", en: "Yeah, the reporter conveyed it. I heard a typhoon is coming too." }
          - { speaker: "Mika", ja: "え、じしんが あったの？", en: "Huh, there was an earthquake?" }
        questions:
          - { q: "What did the reporter convey on the broadcast?", options: ["An announcement about the earthquake", "A weather forecast only", "A story about a party", "Nothing new"], answer: "An announcement about the earthquake" }
      - { kind: challenge, ja: "ほうそうで じしんの はっぴょうが あったし、きしゃは たいふうが くるとも つたえたそうだ。", en: "There was an announcement about the earthquake on the broadcast, and I heard the reporter also conveyed that a typhoon was coming too.", combines: [de-action, shi-listing, mo-also, sou-hearsay, ta-form], mode: build }
    reviewPool: [じしん, たいふう, じこ, ばんぐみ, きじ, うわさ, きしゃ]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m42-neo-6
    role: teaching
    title: "「たいふうが くるらしい」— らしい, hearsay from indirect evidence"
    focus: "A fourth attachment slot for the same full-form pattern — らしい, more distanced than そうだ, no だ before nouns"
    introduces: [らしい]
    beats:
      - { kind: rule, grammarPointId: rashii-hearsay }
      - { kind: sentence, ja: "あの ばんぐみは おもしろいらしい。", en: "Apparently that show is interesting.", exercises: [rashii-hearsay], mode: build }
      - { kind: sentence, ja: "たいふうが くるらしい。", en: "Apparently a typhoon is coming.", exercises: [rashii-hearsay], mode: build }
      - { kind: sentence, ja: "きしゃは びょうきらしい。", en: "Apparently the reporter is sick.", exercises: [rashii-hearsay], mode: build }
      - { kind: sentence, ja: "じこが あった らしい。", en: "Apparently there was an accident.", exercises: [rashii-hearsay, ta-form], mode: listening }
      - { kind: particle-cloze, stem: "きしゃは びょうき", tail: "。", answer: "らしい", options: ["らしい", "だらしい", "そうだ"], en: "Apparently the reporter is sick.", explanation: "らしい attaches straight after a noun, with no だ — びょうきらしい. だらしい is not a real form, and そうだ WOULD need だ first (きしゃは びょうきだそうだ) — a different word with a different attachment rule." }
      - { kind: listening-comp, audio: "うわさで、ミカは いそがしいらしい。", answer: "According to the rumor, apparently Mika is busy.", distractors: ["Mika said herself that she is busy.", "According to the rumor, Mika is free.", "Nobody has heard anything about Mika."], q: "What does this mean?" }
      - { kind: kanji, kana: きじ, kanji: 記事, distractors: ["きろく", "きねん", "きぼう"], exercises: [rashii-hearsay] }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "きょう きしゃが いないね。", en: "The reporter isn't here today." }
          - { speaker: "Mika", ja: "うわさで、びょうきらしいよ。", en: "According to the rumor, apparently he's sick." }
          - { speaker: "Ken", ja: "わかった、たいへんだね。", en: "I see, that's tough." }
