grammarPoints:
  - id: sou-hearsay
    rule: "そうだ reports what you HEARD, not what you see. Take a complete plain-form sentence — dictionary-form verb, plain い-adjective, or noun/な-adjective plus だ — and add そうだ at the end: あめが ふるそうだ, 'I heard it's going to rain.' The whole clause in front of そうだ stays exactly as you would say it on its own; nothing is trimmed. That full-form attachment is the one thing that tells this apart from module 36's appearance そう (ふりそう, stem only, い/だ dropped) — a different word doing a different job, met properly much later in the course. For a noun or な-adjective, だ is required before そうだ: びょうきだそうだ (I heard he's sick), not びょうきそうだ. Politely, the ending becomes そうです — ふるそうです — and you will hear Tanaka use it; you build with the plain form."
    examples:
      - { ja: "きしゃは びょうきだそうだ。", en: "I heard the reporter is sick." }
      - { ja: "あめが ふるそうだ。", en: "I heard it's going to rain." }
      - { ja: "たいふうが くるそうだ。", en: "I heard a typhoon is coming." }
      - { ja: "ばんぐみは おもしろいそうだ。", en: "I heard the show is interesting." }
      - { ja: "じしんが あったそうだ。", en: "I heard there was an earthquake." }
    antiPattern: { ja: "びょうきそうだ。", why: "そうだ hangs on a COMPLETE clause, and a noun needs its copula だ first: びょうきだそうだ, 'I heard he's sick.' Dropping だ gives m36's appearance そう instead — 'looks sick' — a different word for a different job, met at hearsay そうだ's spot only through its full-form だ." }
  - id: tte-quotative
    rule: "って is casual spoken quoting — the everyday shortcut for と言っていた. Put a complete plain-form sentence in front of it and って hands it over exactly the way と does: たなかさんが くるって, 'Tanaka said he's coming' (compare the more formal たなかさんが くると いっていた, same meaning, module 18's と plus this module's いっていた). Reach for って with friends, drop it for teachers or strangers — that register gap is the whole reason it exists next to と. It attaches after ANY plain sentence, questions included: なんで こないって？'why did they say they're not coming?'"
    examples:
      - { ja: "たなかさんが くるって。", en: "Tanaka said he's coming." }
      - { ja: "きしゃが じこが あったって。", en: "The reporter said there was an accident." }
      - { ja: "ミカは いそがしいって。", en: "Mika said she's busy." }
      - { ja: "ケンは しらないって。", en: "Ken said he doesn't know." }
      - { ja: "たいふうは こないって。", en: "They said the typhoon isn't coming." }
    antiPattern: { ja: "たなかさんが くるとって。", why: "って already does と's job by itself — it does not stack on top of と. Drop the と: たなかさんが くるって, 'Tanaka said he's coming.'" }
  - id: to-itte-ita
    rule: "と言っていた reports what someone said, in the past, with the register-neutral と you already own from module 18 (と言う, と思う). と closes the exact plain sentence they said — 「あした いく」と いっていた, 'she said she was going tomorrow' — and いっていた (was saying, said) carries the report itself in the past. It is the formal partner to this module's own って: 「あした いく」と いっていた and あした いくって say the same thing, one careful, one casual. Politely, いっていました — Tanaka's register, not yours to build with yet."
    examples:
      - { ja: "ミカは あした くると いっていた。", en: "Mika said she was coming tomorrow." }
      - { ja: "たなかさんは たいふうが くると いっていた。", en: "Tanaka said a typhoon was coming." }
      - { ja: "きしゃは じこが あったと いっていた。", en: "The reporter said there was an accident." }
      - { ja: "ケンは いそがしいと いっていた。", en: "Ken said he was busy." }
      - { ja: "トムは しらないと いっていた。", en: "Tom said he didn't know." }
    antiPattern: { ja: "ミカは あした くるが いっていた。", why: "が marks a subject, and a whole quoted sentence is not a subject — it is handed over with と, exactly as module 18 taught: ミカは あした くると いっていた。" }
  - id: rashii-hearsay
    rule: "らしい is hearsay one step further back than そうだ — it says 'apparently,' from indirect evidence, not a direct report you can point to. It attaches to a complete plain-form clause the same way そうだ does: あの みせは おいしいらしい, 'apparently that shop is good.' For a noun or な-adjective, unlike そうだ, らしい does NOT need だ first: びょうきらしい (apparently he's sick), never びょうきだらしい. It behaves like any い-adjective after that point — らしかった for the past. Reach for らしい when you are passing along an impression, not quoting a specific source: そうだ says 'I heard X'; らしい says 'it seems X, from what's around.'"
    examples:
      - { ja: "きしゃは びょうきらしい。", en: "Apparently the reporter is sick." }
      - { ja: "あの ばんぐみは おもしろいらしい。", en: "Apparently that show is interesting." }
      - { ja: "たいふうが くるらしい。", en: "Apparently a typhoon is coming." }
      - { ja: "じこが あったらしい。", en: "Apparently there was an accident." }
      - { ja: "ミカは いそがしいらしい。", en: "Apparently Mika is busy." }
    antiPattern: { ja: "きしゃは びょうきだらしい。", why: "らしい attaches directly after a noun or な-adjective with no だ — だ belongs to そうだ's pattern, not らしい's: きしゃは びょうきらしい, 'apparently the reporter is sick.'" }
