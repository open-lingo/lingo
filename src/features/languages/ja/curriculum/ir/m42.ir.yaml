notes: |
  m42 · n4-13 — HEARSAY: 〜そうだ, 〜って, 〜らしい
  (docs/spine-n4.md §n4-13, docs/ja-m42-brief-2026-09-10.md). Ships 12
  lessons (inv 25: 8 teaching + 3 review + 1 challenge, challenge last,
  reviews at positions 4/8/11 — matching m41's own placement).
  spiralWith: n4-07 (m36's appearance そう) — this module is a DELIBERATE
  six-module-out contrast pair with m36, but the contrast itself is not
  taught here; it is reserved for the m51 capstone (brief §0/§6, spine's
  own n4-07 notes). m42 teaches all three hearsay mechanisms on their own
  terms, never as a labeled three-way table (interleave-dont-block-teach).

  FRESH STATE RE-VERIFIED (brief's carried-forward flag 1): ran
  `node scripts/authoring-context.mjs m42` before writing this file.
  m41 confirmed fully shipped and live — `frequencyAtoms.ts`'s
  `JA_FREQ_LAST_MODULE = 41`, `taughtVocab.ts`'s `IR_BY_MODULE` spans
  through m41, `mockCourse.ts`'s JA n4 array ends at m41,
  `mockLessons.ts` imports through `M41_NEO_LESSONS`. Ten transitivity
  pairs landed (ならぶ/ならべる is the tenth). Treated as ground truth in
  place of the brief's own snapshot per the brief's own instruction.

  WHAT IS TAUGHT (three distinct mechanisms, never merged into one card):
  1. **そうだ (hearsay), L2 id sou-hearsay:** a FULL plain-form clause
     (dictionary-form verb, plain-form い-adjective, or noun/な-adjective+だ)
     + そうだ/そうです, reporting what was HEARD. あめが ふるそうだ. The
     attachment site is the sole thing distinguishing it from m36's
     appearance そう (stem, い/だ dropped: ふりそう) — referenced by id in
     the grammar rule text as m36 itself flagged six modules in advance,
     but never drilled as a minimal pair here (that is the m51 capstone's
     job, per the spine's own explicit placement).
  2. **って (casual quotative), L3 id tte-quotative:** cashes in the
     defensive `p-tte` stub courseAtoms has carried since m18
     (`fromModule: "m18"`, never live content — confirmed by grepping
     m18's own grammarPoints list, which has no "tte" id, and finding no
     IR anywhere exercising it). Flips to `fromModule: "m42"` here.
     Functionally ≈ と言っていた, compressed, casual register.
  3. **と言っていた (reported past speech), L5 id to-itte-ita:** extends
     m18's `to-quotation` (という) and `to-omoimasu` (と おもう) — both
     referenced by id — into reported-PAST territory, per the spine's own
     salvage note that m18's と-unit is "the asset" this module builds on.
  4. **らしい (evidential hearsay), L7 id rashii-hearsay:** plain-form +
     らしい, more epistemically distanced than そうだ ("apparently," from
     indirect evidence) — a genuinely new N4 concept, no prior id to
     reference.

  REGISTRATION MECHANISM FOR そうだ (brief §1 item 2 / flag 2, UNVERIFIED
  in the brief, RESOLVED here): registered そうだ ONCE as its own free-
  attaching base lemma atom (`kind: vocab, blocked: true`, mirroring
  m11's だった/でした "copula — no concrete referent" template exactly —
  そうだ is likewise a function word with no picturable referent). This
  is NOT the m36 per-host-word fused-derived-atom pattern (which would
  need a new `ふるそうです`-shaped atom for every host verb/adjective used
  across the module — atom bloat, and pedagogically odd: it would test
  memorized whole-sentence chunks rather than a reusable grammar piece).
  Instead it directly mirrors m41's OWN resolved precedent for ある as a
  known helper glued into てある with ZERO dedicated atom for the fusion
  point itself (あけて + ある, two already-known atoms, longest-match
  tokenizes them as adjacent, no space) — exactly the mechanism the brief
  itself floats as "the more likely correct" one in its own UNVERIFIED
  paragraph. Validated directly: courseAtoms.ts's atomIndex() (moduleCompiler.ts)
  builds one map entry per exact kana string; ふるそうだ as a raw string
  greedily resolves at each position to the LONGEST known atom — ふる
  (registered, m25) at position 0, then そうだ (registered here) at the
  next position, glued with zero space between them, zero new atom for
  the fusion point. This is the SAME mechanism as あけてある, generalized.
  そうです is registered as ONE additional IR-only derived atom
  (`kind: verb-form, derivedFrom: そうだ`) — not one per host word either,
  since そうです is itself just そうだ's own polite inflection and glues
  to any known host the same free-attachment way. Net: 2 atoms total
  (そうだ base + そうです derived) cover every そうだ/そうです sentence in
  the module, regardless of host word — well under the brief's own
  per-word atom-count estimate, and recorded here as the deliberate
  deviation from that estimate, with the reasoning above.

  NEVER a bare そう atom (brief §1/§5, firm constraint): そうだ is
  registered with kana "そうだ" (3 morae), a DISTINCT map key from the
  live m3 `id: "sou"` (kana "そう", agreement interjection, blocked,
  excludeFromSrs) — no map-construction collision, and grep of the
  compiled ir/m42.ir.json confirms no standalone kana:"そう" entry
  anywhere in this module's newAtoms or exercised sentences.

  REGISTRATION FOR いっていた (brief §1 item 1 / flag 2b, FIRM ruling, not
  a judgment call): registered as ONE fused multi-word carrier atom,
  kana "いっていた" (5 morae, 言っていた, "was saying / said that"),
  `kind: vocab, blocked: true`, word-level ownership per the established
  carrier-atom doctrine — this atom owns its component words rather than
  decomposing into bare いって/いった for 言う, which would collide at
  `JA_COURSE_ATOMS_BY_KANA` map-construction with the LIVE `id: "itte"`
  (m8, 行く te-form) and `id: "itta-iku"` (m11, 行く past) — the exact
  collision class m41 hit with つく/つける and dropped outright, and
  already named by `id: "ittari"` (m21)'s own note, "the m18 いった
  homograph ruling." No standalone いって/いった for 言う is registered
  or exercised anywhere in this module — verified by grep of the
  compiled JSON before considering any lesson using this construction
  done. いっていました (polite past, recognition-only, Tanaka-voiced) is
  one IR-only derived atom, `kind: verb-form, derivedFrom: いっていた`.

  REGISTER DISCIPLINE (inv 7, DICT-FORM-FIRST) applied identically to
  both new helper-style atoms: そうだ (plain) and いっていた (plain) are
  the PRODUCTION bases, exercised in `mode: build` student-voiced
  sentences throughout. そうです and いっていました (both polite, both
  IR-only `verb-form` derived atoms) appear ONLY inside Tanaka-voiced
  dialogue lines, as flagged recognition previews — never a production
  target, matching every module since m3-neo.

  らしい: registered as a genuine `pos: "adjective"`, `conjugation:
  {class: "i-adj"}` lemma (mirroring m12's おいしい row exactly), letting
  the existing ChainForm/conjugation machinery handle any future
  conjugated forms automatically. This module deliberately keeps らしい
  in bare non-past form throughout (no はやらしかった-shaped sentences
  authored) — simplifies the module and matches N4 scope; no hand-
  authored derived atom needed for らしい at all, since — like って — it
  is itself a free word that glues to any known plain-form host with
  zero additional atoms (same longest-match mechanism as そうだ, one
  layer simpler because らしい needs no politeness-variant atom: it has
  no そうです-shaped polite inflection distinct from itself).

  ENGINEERING (brief §2, verified, not re-derived): zero `ChainForm` /
  `TRANSFORM_RULESETS` changes. All three constructions are compositional
  attachments to the already-live plain/dictionary-form surface, the
  m30(ておく)/m38(てしまう)/m41(てある) precedent, not m40(passive)'s
  formation-point precedent. Confirmed directly against inv 49's closed
  list (て, た, ない, ます, potential, passive られる, causative させる,
  volitional よう/おう, ば, 命令形/禁止形) — hearsay/quotative/evidential
  suffixes are not on it and do not belong on it.

  DOMAIN VOCAB DECISIONS (brief §1, freqRank-driven): registered
  じしん(1412)/たいふう(725)/じこ(595)/ばんぐみ(1292)/きじ(2863)/
  ほうそう(1677)/きしゃ(1261)/はっぴょう(1022)/つたえる(1698)/
  しらせる(740)/うわさ (not top-3000, but semantically load-bearing per
  the brief's own note — 「うわさに きいた」 is a natural hearsay-domain
  carrier, kept as `must` per the spine's own classification). CUT
  entirely: ひなん and けいほう — both outside the top-3000, both the
  brief's own explicit first-cut suggestion, and the atom budget does not
  need them (14 new lemmas + 2 IR-only derived atoms, well under the
  spine's non-binding count:34 ceiling, matching every prior N4 module's
  pattern of landing under its stated ceiling). L7 (らしい) and L9
  (integration) therefore introduce no new vocabulary — pure grammar/
  domain-recombination lessons, per this cut.

  CARRIER-ONLY, NOT RE-REGISTERED (brief §1, verified live): ニュース
  (id nyuusu, m7 — CONFIRMED live via fromModuleDrift.test.ts's own
  liveLessonIds check), and など (id nado, m21, despite the spine's own
  stale thr-n4 claim that m42 owns it — direct read of ir/m21.ir.yaml
  confirms など in introduces:, a build sentence, a particle-cloze
  distractor, and reviewPool; this module does not repeat the spine's
  error, but per the brief's own scope note does not silently fix
  spine-n4.md either).

  CORRECTION (post-compile, fromModuleDrift ratchet run): しんぶん (id
  shinbun) was FIRST drafted here on the same shallow-verified premise as
  above ("introducedByLessonId ja-m4-1-1 is live") — the assumption was
  wrong. `fromModuleDrift.test.ts`'s own liveLessonIds set does NOT
  contain "ja-m4-1-1" (dead m4-era id, no live lesson resolves it), so
  every graded (mode: build) use of しんぶん pushed the R16 teach-them
  MAX_INVENTORY=32 ratchet over its ceiling. Fixed by de-registering
  しんぶん from this module entirely: every build/challenge sentence that
  used it now uses the CONFIRMED-live ニュース instead (きじ, already
  properly introduced in this module, carries "article" on its own where
  しんぶんの きじ once specified "newspaper article" — dropping the
  now-redundant modifier costs no comprehension, since ニュースで ... きじ
  already frames the source). しんぶん remains, unedited, as one
  recognition-only dialogue line's word (m42-neo-1) — not graded, not
  counted by the ratchet, a legitimate passive-exposure preview like
  そうです/いっていました elsewhere in this module. Do NOT re-add しんぶん to
  any build-mode/challenge/reviewPool site without first fixing its
  courseAtoms.ts attribution (out of this module's scope).

  では COLLISION (same ratchet, same class): うわさでは's では sequence
  greedy-matches the registered `id: "deha"` atom (fromModule "m26",
  introducedByLessonId "ja-m26-5-2" — also DANGLING, not in
  liveLessonIds), not the compositional で+は it was meant to be. Fixed
  the three GRADED sites (m42-neo-7's build sentence, its particle-cloze
  tail, and its dialogue_sim reply tiles) by rewording うわさでは →
  うわさに よると, an already-established this-module idiom (はっぴょうに
  よると / うわさに よると appear elsewhere as listening-only recognition)
  — same meaning ("according to the rumor"), zero reliance on the broken
  atom. The three REMAINING では occurrences (one listening-comp audio
  line, one mode:listening challenge sentence, one dialogue line) are
  left as-is: none is graded, so none is counted by the ratchet, and
  each is legitimate recognition-only exposure.

  そうだ MAP-KEY COLLISION (course-wide, found only on the FULL JA suite
  run, not by m42-neo.test.ts alone): registering そうだ (this module's
  own hearsay marker, kind: vocab, 3-kana) collided with two EARLIER
  modules' own unrelated use of the identical 3-kana surface そうだ as
  part of the colloquial agreement phrase そうだね ("that's right") —
  m3-neo.ts's own sentenceMcq distractor ("そうだ。") and m29.ir.yaml's
  own dialogue line ("そうだね。"). Before this module's registration,
  that surface decomposed into two already-known pieces, そう (m3) + だ
  (copula); after, the tokenizer's greedy-longest-match prefers the new
  3-kana atom outright, reattributing the older surfaces to a module
  (m42) that postdates them — the exact "atom registration ripples
  forward" class this course has hit before (m41's つく/つける). Fixed
  token-neutrally in both sites, NOT by touching this module's own
  registration (そうだ genuinely needs its own 3-kana atom here — see the
  DICT-FORM-FIRST note below for why): m3-neo.ts's distractor was swapped
  for a different, equally-wrong option (ありがとう。, no meaning change to
  the exercise); m29.ir.yaml's dialogue line got an authored space
  (そうだね。→ そう だね。, same established tokenizer-boundary convention
  used throughout this module's own notes below) and was recompiled.

  って TILE-DIFF RE-RUN (brief §1/§5, standing instruction on the stub,
  not new): the `p-tte` row's own note has carried "re-run the tile diff
  if a new 〜って form ships un-atomized" since m18. This module is that
  ship. Re-run planned as part of the final gate pass, checking the
  whole-course compiled tile set for regressions against いって/かって/
  まって/しって (all of which must continue to win longest-match over
  って's own now-live kana key).

  REJECTED (brief §6, not re-derived here): a `kind: contrast` beat type
  (not shipped in moduleCompiler.ts); teaching/drilling the そう-vs-そう
  appearance/hearsay minimal pair (reserved for m51); re-registering
  ニュース/しんぶん/など; a new って id instead of cashing the p-tte stub;
  any bare そう or bare いって/いった atom; a block lesson listing
  そうだ/って/らしい as a labeled three-way table (interleave instead,
  per the brief's own L2/L3/L7 spacing with unrelated domain-build
  breaks between — L1/L6/L9 carry no new grammar on purpose).

  IR-DIAGNOSTICS GATE PASS (2026-09-10, new curriculum-project mirror of
  moduleCompiler.diagnostics.test.ts — irDiagnostics.test.ts — added after
  m40 shipped 3 undetected challenge-not-novel findings): first compile
  threw 13 `unbuildable` findings, all the same class as inv 41's known
  って hazard — greedy longest-match tokenization plus the corpus's own
  unspaced-comma convention merging two flanking words into one run with
  no boundary. Two kinds of fix, decided case by case:
  (a) an already-registered atom or particle out-competed the intended
  word (あった 4-kana beating あった+らしい; した-class atoms beating
  し+たいふう across a bare comma; え mid-word inside つたえた) — inserted
  an authored space at the collision boundary (a hard tokenizer boundary
  per the compiler's own docstring), never touched moduleCompiler.ts;
  (b) the surface was a genuinely untaught inflection — しった→わかった
  and わたしたちに→わたしに reworded to already-known forms (comprehensi­
  bility-gated no later than m11); つたえた/しらせた (L5, recur through
  L6/L8/challenge) and そうだった (challenge L9) registered as IR-only
  `verb-form, derivedFrom` atoms, mirroring m38's あった and this file's
  own そうです — STEMS auto-derivation only covers the hardcoded
  VERB_ENTRIES/ADJ_ENTRIES tables, not IR-registered verbs, so a
  conjugated form used more than once needs its own atom. Two findings
