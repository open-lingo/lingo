  clause sat in a beat this module's own `introduces:` declares empty
  (m42-neo-6's L7 challenge, m42-neo-challenge's L9 capstone): ないかも
  しれない (an entire untaught construction, never in `combines:`, never
  taught by a rule/sentence beat first) became ないだろう, cashing だろう
  from m25 (already prior-known, exact semantic fit for "probably");
  うちに いたほうが いい (いた, past of いる, likewise never taught) became
  うちに いったほうが いい, reusing いった (m11, already live in m28's own
  hou-ga-ii examples) — "better to go home" for "better to stay home,"
  same storm-safety beat, no atom smuggled into an `introduces: []` beat.
  Re-ran `npx vitest run --project curriculum
  src/features/languages/ja/__tests__/irDiagnostics.test.ts` after every
  fix batch; final state: 0 enforced findings for m42 (38/38 IR files
  clean, `density-short` the only populated INFORMATIONAL kind anywhere
