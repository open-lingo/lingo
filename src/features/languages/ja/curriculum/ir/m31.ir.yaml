      - { kind: sentence, ja: "こんど しんせつな いしゃに くすりを もらいたい。", en: "I want to get medicine from a kind doctor next time", exercises: [v-tai, morau, na-adj-present], mode: build }
      - { kind: sentence, ja: "その とけいは たかいけど あにの たんじょうびだから あげたい。", en: "That watch is expensive, but it's my older brother's birthday, so I want to give it to him", exercises: [v-tai, ageru, kedo, kara-because], mode: build }
      - { kind: sentence, ja: "たんじょうびに おおきい ケーキを もらいたいんです。", en: "The thing is, I want to get a big cake for my birthday", exercises: [v-tai, morau, n-desu], mode: build }
      - { kind: sentence, ja: "がくせいに ノートを あげたい。", en: "I want to give the student a notebook", exercises: [v-tai, ageru], mode: translate }
      - { kind: particle-cloze, stem: "はなが すきだから はなたばを ", tail: "。", answer: "もらいたい", options: ["もらいたい", "あげたい", "あげない"], en: "I like flowers, so I want to get a bouquet", explanation: "liking flowers is a reason to want to RECEIVE them, so the receiver's verb もらう takes 〜たい. あげたい would be wanting to hand them over, and あげない only says the giving does not happen." }
