notes: |
  m31 = n4-02, the SECOND module of the N4 tier. `docs/spine-n4.md` §2, the
  `n4-02` block, is the source of truth and this module ships every line of it:
  the three verbs as ORDINARY verbs, VIEWPOINT as the payload, に for the
  recipient, から/に for もらう's source, the ×わたしにあげる ban as the
  antiPattern, and くださる / いただく as RECOGNITION only.

  THE WHOLE POINT — the payload is not three words. It is ONE AXIS.

  1. **English has one verb where Japanese has three, and the thing that picks
     between them is not politeness, not tense and not who is talking — it is
     WHICH WAY THE OBJECT MOVES relative to the speaker.** That axis (うち /
     そと, inside / outside) has never been needed in this course until now, and
     it is needed for the rest of it.
  2. **あげる points away, くれる points at me, もらう points at me and moves the
     subject.** The first two are the same event described from opposite ends;
     the third re-topicalises it around the receiver. So the module is really
     one fact taught three ways rather than three facts.
  3. **NO て-FORMS ANYWHERE — and this is a spine instruction, not a
     simplification.** 〜てあげる / 〜てくれる / 〜てもらう are n4-06, five modules
     out. The spine splits the DIRECTION axis (here) from the SCHEMA axis (m35)
     from the REGISTER axis (m50) precisely so that no module ever teaches two
     axes at once, and this module holds that line so hard that it contains no
     て-form of ANY verb — not あげて, and not たべて either. Complexity comes
     from から / けど / とき / まえに instead, which m15/m16 already own.
     `m31-neo.test.ts` scans every compiled surface and asserts zero.
  4. **The hard ban is STRUCTURAL, not a rule to remember.** ×わたしにあげる is
     ungrammatical because あげる's arrow cannot end at the speaker, and the
     module is built so that the learner meets the ban as a shape rather than a
     footnote: L7 is the whole lesson, and the antiPattern names it.

  Shape: 13 lessons = 9 teaching + 3 review + 1 challenge, reviews at lessons
  4/8/12 (the first/middle/last thirds), challenge lesson LAST (inv 25). NO
  katakana rows (the programme ended at m11), so the compiled order IS the
  shipped order. NO `kind: register` beats — that machinery is m10 + m29 only
  (registerScaffoldIsolation), and くださる / いただく are handled as RECOGNITION
  vocabulary rather than as a register drill, exactly as the spine asks.

  DEVIATIONS + DECISIONS, documented per the RUN-PLAN "decide and document" rule:

  - **FOUR GRAMMAR-POINT IDS ARE INVENTED — `ageru`, `kureru`, `morau` and
    `ni-recipient` — BECAUSE THE N4 TIER STILL HAS NO REGISTRY.** m30 recorded
    this as a tier prerequisite and it has not landed: `n5-grammar-points.json`
    holds 103 points and not one is an N4 item. Three of the four are the
    module's payload verbs and could not be anything else. The fourth is the
    one worth arguing about, and the argument is that the RECIPIENT に is a
    genuinely different function from `ni-location`'s destination-に: 「がっこうに
    いく」 puts a place at the end of a movement, 「ともだちに あげる」 puts a
    PERSON at the end of a transfer, and filing the second under the first would
    put a lie in the learner's SRS history. **THREE of the nine cards are
    REGISTRY points re-taught inside the new frame** — `kara-origin` (m4,
    because から is the other legal source marker for もらう), `ta-form` (m11,
    because あげた / くれた / もらった is where the module becomes reportable) and
    `wa-topic` (m3, because the whole viewpoint payload cashes out as which
    participant gets to be the topic and which one disappears). No ledger row
    moves: a re-teach is not a re-assignment (the m16 ruling). **The consequence
    m30 reported is unchanged and is reported again rather than quietly
    inherited: Track B cannot schedule `ageru`, `kureru`, `morau` or
    `ni-recipient`,** because `grammarSrs` activates points from that JSON
    alone. An N4 grammar-point registry is still a tier prerequisite.
  - **THIRTY-SIX ATOMS, EXACTLY THE SPINE'S COUNT.** Twelve are the spine's own
    content allocation — five `must` (プレゼント, かりる, おれい, たんじょうび,
    おかし) and seven `prefer` (おいわい, はなたば, きねん, おみやげ, しんせつ,
    よろこぶ, うれしい). THREE of the spine's fifteen listed words are ALREADY
    TAUGHT and are therefore not re-declared: おくる is m30's, かす is m8's and
    てがみ is m4's — all three carry sentences here instead, which is what a
    `must` word is for. The payload verbs あげる / くれる / もらう make fifteen;
    the remaining twenty-one are DERIVED FORMS (past, negative, 〜たい), the four
    honorific recognition atoms, and six gift/occasion nouns the module's own
    sentences need (ケーキ, カード, おめでとう, こども, こんど, and きねん's
    partner nouns). `sidequest` (おちゅうげん / おせいぼ) is deliberately not
    spent: the spine files it as a side quest, not as module allocation.
  - **`courseAtoms.ts` IS TOUCHED, IN EXACTLY FOUR ROWS, FOR THE SAME RATCHET
    m30 HIT.** あげる, かりる and おかし each already had a row tagged
    `fromModule: "future"`, and "future" is not a real module: the
    module-fallback unlock path in `lessonAtomIndex` keys on
    `a.fromModule === moduleId`, so it could never fire for them and the learner
    would have been GRADED on all three without any of them entering the SRS
    deck. たんじょうび is the same defect wearing a better disguise — it is
    tagged `fromModule: "m19"` and attributed to an old-course m19 lesson that
    now lives only in `curriculum/_archive/`. The neo m19 does not
    teach the word and no IR module lists it, so the tag names a module that
    cannot unlock it either. **Only `fromModule` changes (plus `blocked: true`
    on three of the four, and the dead `introducedByLessonId` comes off
    たんじょうび)** — no kana, no id, so not one tokenization anywhere in the
    course moves.
  - **TWO IMAGE DEBUTS — たんじょうび 🎂 and こども 🧒.** m30 shipped zero and
    said so; this module can honestly ship two, on the CONDITION rather than a
    quota. 🎂 is carried by exactly one row in the whole registry. 🧒 is shared
    with おさななじみ alone, which is tagged `future` and is met by no module, so
    a picture MCQ still cannot offer two options with the same art (the
    m19/m24/m26 shared-glyph ruling). The other three registry rows are
    barred and now say so with `blocked: true`: **あげる 🎁 is the module's
    HEADLINE VERB and its rule card must name it** — a `kind: rule` beat
    compiles to a PINNED step ahead of the interleaved middle and would steal
    the debut (the m14 trap, restated for m21's おさけ, m22's いたい and m30's
    おく); **かりる 🤝 shares its glyph with あう (m25), かす (m8) and てつだう
    (m29), all MET**; and **おかし 🍬 shares with あまい, さとう and あめ**, of
    which あめ's kana is met. Every other new atom is a derived form, an abstract
    noun (おれい, おいわい, きねん) or an adjective, and the emoji rubric exists to
    stop art being invented for those. Inv 44 is explicit that
    `word_image_mcq` carries no usage floor, so one is legal; everything else
    debuts on a `build` beat (inv 37).
  - **THE VIEWPOINT AXIS IS ENFORCED BY THE SLOT POOLS, NOT BY PROSE.** Every
    あげる sentence in this module draws its GIVER from the speaker's side and
    its RECEIVER from outside it; every くれる and もらう sentence does the
    reverse. That is why 「あには おにいさんに きっぷを あげる」 does not appear
    anywhere: おにいさん and あに denote the SAME referent under two registers, so
    a sentence pairing them is one person giving to himself. うち / そと is about
    the referent, not the word — a distinction the registry does not make and
    the author has to.
  - **NO POLITE FORMS OF THE THREE VERBS ANYWHERE.** `register: plain`, like
    m30. あげます / くれます / もらいます are not registered and never appear;
    the challenge lesson's polite dialogue carries politeness on んです (m27's
    own lesson that politeness is carried ONCE and carried at the end), exactly
    as m30's did.
  - **くださる AND いただく ARE RECOGNITION ONLY, AND THEY ARE FENCED THE WAY
    m30 FENCED 〜とく.** Spine: "flagged as the honorific tier — RECOGNITION
    only, production at n4-21". So all four surfaces (くださる, くださった,
    いただく, いただいた) are registered WHOLE, appear ONLY on a rule card, a
    `listening-comp` and a dialogue line, are never a build or speaking target,
    and **never enter a `reviewPool`**, because the filler generator draws
    production targets from the pool (m23/m24's bound-ender finding). Registering
    them whole is not optional: a bare 「いただ」 would let 「いただいた」 tile as
    いただ · いた, and いた is あるく's neighbour in the ます-stem minefield m24
    measured.
  - **「あげたい」 AND 「もらいたい」 ARE REGISTERED WHOLE, FOR m30's みたい
    REASON.** m30 found that 「かってみたい」 tokenizes to かって · みたい and
    credits *want to watch* on a sentence about buying, because みたい is a
    registered atom. The same trap is live here: without a whole registration
    「あげたい」 would tile as あげ · たい, and 〜たい is m13's. Both are declared,
    and longest-match settles them.
  - **EVERY SURFACE WAS TOKENIZED WITH THE COMPILER'S OWN VOCABULARY BEFORE IT
    SHIPPED.** Words that are in the context pack, in `courseAtoms`, and NOT in
    this module's computed `priorVocab` were cut wholesale — the m23/m30 finding,
    measured again here. ケーキ, カード, こども and こんど all came back untaught
    and are therefore DECLARED rather than assumed; おめでとう likewise.
  - **NO PARTICLE_CLOZE ON A PARTICLE (inv 5) — WHICH IS AWKWARD HERE AND IS
    HONOURED ANYWAY.** This module DOES introduce a particle function (the
    recipient に), so a に/を cloze would be legal on the letter of inv 5 and
    would also be the single most tempting exercise in the module. It is not
    used, because the interesting choice in this module is never the particle —
    it is the VERB, and a learner who picks に correctly while picking あげる
    where くれる belongs has learned nothing the module is about. Every cloze
    here therefore picks among the THREE VERBS or their tenses, every option is
    a taught atom or one of this module's own (inv 40), no frame names a
    character (ミカ / トム / ケン / たなか have no courseAtoms rows, so a frame
    containing one lands in the grammar deck's GATE_EXEMPTIONS — m22's finding)
    and no frame ends on a bare だ (m21's finding). Clozes thin out as the module
    progresses, per inv 5.
  - **KANJI DRIPPED, NEVER WALLED (`thr-n4`).** Four `kind: kanji` beats, eight
    glyphs, scattered across four lessons, each tagged to its host lesson's own
    point and each on a word that lesson's sentences actually use: **友達 (L3),
    切符 (L6), 家族 (L9) and お金 (L11)**. All four unlock at m17–m22, so every
    glyph is past `unlock + FURIGANA_WINDOW` at m31 and READS BARE — a cold
    recognition check, not a first sighting. None of the four is one of m30's
    (辞書 / 電気 / 写真 / 自転車), and none is a word this module introduces:
    a kanji beat tests reading, never vocabulary.
  - **Clause boundaries are SPACES, never 、** — `moduleCompiler.clean()` strips
    、 with nothing in its place, so an authored comma compiles to a run-on build
    target AND a run-on TTS key.
  - **Gloss discipline (inv 17).** A plain non-past あげる / くれる / もらう
    glosses as intent or habit ("I'll give my friend a present", "my friend
    gives me sweets"), NEVER as an English progressive — GATE 8 checks it. もらう
    is glossed from the RECEIVER's side ("I get a dictionary from the teacher"),
    never flipped into "the teacher gives me", because the whole point of もらう
    is that the receiver is the topic; flipping the gloss would erase the one
    thing the sentence is teaching.
  - **CARRIER ROTATION (inv 27), WITH ONE DELIBERATE RETURN.** m30 rested みせ,
    ともだち, ほん, ごはん, いる, きのう, あたらしい, えき and かばん. Eight of the
    nine stay rested here. **ともだち comes back, on purpose:** this module needs
    a default そと-side person the way a comparison module needs two things, and
    every alternative (せんせい, いしゃ, がくせい, アメリカじん) is either an
    authority figure or a nationality, both of which distort the うち/そと line
    the module is teaching. It is rotated hard against せんせい, いしゃ, がくせい,
    アメリカじん, にほんじん and かいしゃ so that no single person word carries
    the axis. ほん, かばん and えき stay out; じしょ, ノート, てがみ, しゃしん,
    きっぷ, とけい, けいたい, かさ, くつ, ぼうし, えんぴつ, おかね and はな carry
    the object slot instead.
  - **Persona canon.** Tom = student, American, Mika's friend; Mika = student,
    Japanese; Ken = student, Japanese; Tanaka = the teacher. No 「NAMEは NOUNだ」
    assertion appears anywhere. たなか appears only where the honorific tier is
    being RECOGNISED and in the challenge lesson's polite dialogue.
  - **THE CHALLENGE LESSON WAS WRITTEN FROM SCRATCH.** Not one of its sentences
    appears anywhere else in the module. `challengeNovelty.test.ts` is the
    course-wide ratchet and m31 adds nothing to its debt list.
  - **`COMPLEXITY_FLOORS.m31` is a FIRST MEASUREMENT.** A transfer sentence
    names a giver, a receiver and a thing by construction, so it clears the
    12-character bar without any help; the floor is set three sentences below
    the measured share, per that block's own rule, and never lowered.

  ONE RULE CARD PER LESSON (m14's layout law): every teaching lesson carries
  exactly one, because two `kind: rule` beats compile to two PINNED, ADJACENT
  grammar_rule steps and fail the adjacency bar. Where the same id teaches twice
  (`ageru` at L1 and L7, `kureru` at L2 and L10) the second card carries its own
  `variant` and its own rule text — the id stays shared so the SRS history stays
  one thing, exactly as m6's three `nai-form` cards do.

grammarPoints:
  # ── L1. THE AXIS, BOTH POLES AT ONCE. Merged from what shipped as two cards
  #    (`ageru`/schema at L1, `kureru`/schema at L2) on 2026-08-15. The module's
  #    axis is DIRECTION, and a direction cannot be taught with one direction:
  #    presenting あげる alone for a whole lesson and くれる alone for the next is
  #    N-way-on-introduction, which RUN-PLAN standing decision 5 rules against
  #    ("pairwise contrast on introduction, N-way only on review" — spine-n4.md
  #    §3.1, the same ruling that puts たら+と in one module at m32 and のに
  #    against ので at m39). The `kureru` id keeps its own card at L9 (honorific)
  #    so its SRS history stays one thing.
  - id: ageru
    variant: axis
    rule: "Japanese has no single verb for give. Which one you reach for depends on WHICH WAY the thing moved past you — not on who is talking, and not on politeness. There is a circle drawn around you and the people who belong to you (うち, inside); everybody else stands そと, outside."
    # The direction, the particles, the subject and the dropped receiver are
    # all POSITIONS now — the diagram states them, so the prose above no
    # longer has to. Object is a generic parcel by construction (inv 30).
    diagram:
      kind: transfer
      insideLabel: "うち"
      outsideLabel: "そと"
      left:  { label: "わたし",   gloss: "me",        color: "#f97316", inside: true }
      right: { label: "ともだち", gloss: "my friend", color: "#14b8a6", inside: false }
      object: { label: "プレゼント", particle: "を" }
      rows:
        - verb: "あげる"
          from: left
          leftParticle: "は"
          rightParticle: "に"
          subject: left
          note: "The thing leaves the circle. I am what the sentence is about."
        - verb: "くれる"
          from: right
          rightParticle: "が"
          subject: right
          hidden: left
          note: "Same present, arrow reversed. My friend is the subject — and I drop out, because くれる can only point at me."
    examples:
      - { ja: "ともだちに プレゼントを あげる。", en: "I'll give my friend a present." }
      - { ja: "ともだちが プレゼントを くれる。", en: "My friend gives me a present." }
      - { ja: "ははは せんせいに はなを あげる。", en: "My mother gives the teacher flowers." }
      - { ja: "ちちが おおきい とけいを くれる。", en: "My father gives me a big watch." }
      - { ja: "あには がくせいに じしょを あげる。", en: "My older brother gives the student a dictionary." }
    antiPattern: { ja: "ともだちが プレゼントを あげる。", why: "あげる's arrow leaves your side and can never land back on it, so this sentence never arrives anywhere — a thing coming in from outside takes くれる: ともだちが プレゼントを くれる。" }

  # ── L7. RECIPIENT に, TAUGHT ON THE LEND/BORROW PAIR. It shipped at L3 as a
  #    third consecutive あげる lesson (Spencer 2026-08-15: "going over に here to
  #    define the receiver is already learned context from the lesson itself").
  #    Measured: L1 alone shipped TEN sentences carrying a recipient に before
  #    this card introduced it, and the card's own lesson used it in five. The
  #    POINT is real — a person at the end of a transfer is not `ni-location`'s
  #    destination — so the id stays and the SRS ledger does not move; what
  #    changes is that it is now taught where に does work the learner has not
  #    already done, on かす / かりる.
  - id: ni-recipient
    rule: "Every に you have met since module 5 has been a place — 「がっこうに いく。」 に marks where something ENDS UP, and a transfer is a journey with a person at the far end. That is why the recipient takes に whether the far end is a station or a sister. Now put it on a pair where the thing comes BACK: かす is to lend, かりる is to borrow, one loan seen from its two ends."
    diagram:
      kind: transfer
      insideLabel: "うち"
      outsideLabel: "そと"
      left:  { label: "わたし",   gloss: "me",        color: "#f97316", inside: true }
      right: { label: "ともだち", gloss: "my friend", color: "#14b8a6", inside: false }
      object: { label: "かさ", particle: "を" }
      rows:
        - verb: "かす"
          from: left
          leftParticle: "は"
          rightParticle: "に"
          subject: left
          note: "I lend. The umbrella leaves my side — and comes back later."
        - verb: "かりる"
          from: right
          leftParticle: "は"
          rightParticle: "に"
          subject: left
          note: "I borrow. Arrow reversed, but に stays put on my friend — the same particle, the far end of the same journey."
    examples:
      - { ja: "ともだちに かさを かりる。", en: "I borrow an umbrella from my friend." }
      - { ja: "いもうとに おかねを かす。", en: "I lend my little sister money." }
      - { ja: "あねは せんせいに てがみを あげる。", en: "My older sister gives the teacher a letter." }
      - { ja: "だれに おみやげを あげる？", en: "Who are you giving the souvenir to?" }
      - { ja: "おとうとに じてんしゃを かした。", en: "I lent my little brother my bicycle." }
    antiPattern: { ja: "ともだちに かさを かす。", why: "かす hands the umbrella over and かりる takes one in — if the umbrella is coming to you, the verb is かりる: ともだちに かさを かりる。" }

  - id: morau
    rule: "Third verb, and it rearranges the sentence rather than just pointing it. The subject of もらう is whoever ENDS UP HOLDING THE THING. Then the part that catches everybody: the person it came FROM also takes に. One rule, not two — に marks the OTHER PERSON in the transfer, and the verb decides which end they are standing at. English does the same trick: you give TO somebody, you hear it FROM somebody."
    # Both rows share ONE arrow direction — the picture's whole job here is to
    # show that only the subject ring moves between くれる and もらう.
    diagram:
      kind: transfer
      insideLabel: "うち"
      outsideLabel: "そと"
      left:  { label: "わたし",   gloss: "me",         color: "#f97316", inside: true }
      right: { label: "せんせい", gloss: "the teacher", color: "#60a5fa", inside: false }
      object: { label: "じしょ", particle: "を" }
      rows:
        - verb: "くれる"
          from: right
          rightParticle: "が"
          subject: right
          hidden: left
          note: "About the teacher, and what the teacher did."
        - verb: "もらう"
          from: right
          leftParticle: "は"
          rightParticle: "に"
          subject: left
          note: "SAME arrow, same event. Only the subject moved — now the sentence is about me and what I ended up with, and に marks where it came from."
    examples:
      - { ja: "せんせいに じしょを もらう。", en: "I get a dictionary from the teacher." }
      # NOT a たんじょうび example: this card is PINNED ahead of the lesson's
      # interleaved middle, so naming the word here steals its word_image_mcq
      # debut (inv 30, the m14 trap this module's own notes restate).
      - { ja: "いしゃに くすりを もらう。", en: "I get medicine from the doctor." }
      - { ja: "いしゃに くすりを もらう。", en: "I get medicine from the doctor." }
      - { ja: "あねは ともだちに おみやげを もらう。", en: "My older sister gets a souvenir from her friend." }
      - { ja: "かいしゃの ひとに おかしを もらう。", en: "I get sweets from the people at the company." }
    antiPattern: { ja: "せんせいは じしょを もらう。", why: "the subject of もらう is whoever ends up holding the thing, so this says the TEACHER is the one who got a dictionary — if you are the one who received it, you are the subject: せんせいに じしょを もらう。" }

  - id: kara-origin
    rule: "The source of a もらう can be marked に or から, and both are correct: 「ともだちに おみやげを もらう。」 「ともだちから おみやげを もらう。」 Nobody will correct either. から is module 4's word and has always meant the starting point — 「にほんから きた」 — so all that has changed is that a person is now allowed to be one. に is the tighter, more ordinary choice and what you hear most in speech; から is more explicit about the source, and it is what people reach for when the giver is an organisation. There is one case where から is the answer rather than a preference: when the source is not a person at all. 「かいしゃから きねんの とけいを もらう。」 A company is a place as much as a giver, and に there starts to read as a destination. あげる and くれる have no source slot, so から never appears with them — a から is a quiet signal that もらう is coming."
    examples:
      - { ja: "ともだちから おみやげを もらう。", en: "I get a souvenir from my friend." }
      - { ja: "かいしゃから きねんの とけいを もらう。", en: "I get a commemorative watch from the company." }
      - { ja: "せんせいから おいわいの カードを もらう。", en: "I get a congratulations card from the teacher." }
      - { ja: "がくせいから てがみを もらう。", en: "I get a letter from a student." }
      - { ja: "こんど いしゃから くすりを もらう。", en: "I'll get medicine from the doctor next time." }
    antiPattern: { ja: "ともだちから プレゼントを あげる。", why: "から marks where a thing came from and あげる has no source slot — only もらう can take a から: ともだちから プレゼントを もらう。" }

  - id: ageru
    variant: limits
    rule: "Here is the one hard ban in this module. あげる CANNOT POINT AT YOU. 「わたしに プレゼントを あげる」 is not awkward or impolite — it is broken, the way I gave me a present is broken in English, and a Japanese speaker will not work out what you meant. あげる's arrow leaves your circle, so there is nowhere for it to land if the destination is inside the circle it just left. The moment a thing is arriving at you, あげる is off the table and you pick between two verbs — and the choice is about what the sentence is ABOUT, not about the event. くれる if the giver is the news: 「ともだちが プレゼントを くれる。」 もらう if what you ended up with is the news: 「ともだちに プレゼントを もらう。」 The circle stretches too, and your family is inside it. 「ともだちが いもうとに おかしを くれる」 is fine — the sweets came in to my side even though they did not come to my hand. Say あげる there and you have pushed your own sister outside the circle."
    examples:
      - { ja: "ともだちが わたしに プレゼントを くれる。", en: "My friend gives me a present." }
      - { ja: "ともだちに プレゼントを もらう。", en: "I get a present from my friend." }
      - { ja: "せんせいが いもうとに おかしを くれる。", en: "The teacher gives my little sister sweets." }
      - { ja: "がくせいに ノートを あげる。", en: "I'll give the student a notebook." }
      - { ja: "ともだちが ケーキを くれるから うれしい。", en: "My friend is giving me a cake, so I'm happy." }
    antiPattern: { ja: "ともだちが わたしに プレゼントを あげる。", why: "あげる's arrow leaves your side and can never land back on you — a thing arriving at you takes くれる: ともだちが わたしに プレゼントを くれる。" }

  - id: ta-form
    rule: "Put the three verbs in the past and the module becomes usable, because most of what anybody says about a gift is said afterwards. The forms are module 11's. あげる and くれる are る-verbs: drop る, add た — あげた, くれた. もらう is an う-verb ending in う, so it takes かう's った row: もらった. Nothing new to memorise. What IS worth watching is that the direction does not soften in the past. 「ともだちが けいたいを くれた」 still points in at me; 「ともだちに けいたいを あげた」 still points out. English collapses both back to gave, so say the arrow to yourself before you pick the verb. 「もらった」 is the most useful of the three, because it answers the question the past tense invites: 「その とけい、いいね。」 「たんじょうびに ちちに もらった。」 Nice watch — I got it from my father for my birthday."
    examples:
      - { ja: "たんじょうびに ちちに とけいを もらった。", en: "I got a watch from my father for my birthday." }
      - { ja: "ともだちが けいたいを くれた。", en: "My friend gave me a mobile phone." }
      - { ja: "せんせいに はなたばを あげた。", en: "I gave the teacher a bouquet." }
      - { ja: "プレゼントを もらったから うれしかった。", en: "I got a present, so I was happy." }
      - { ja: "いしゃに くすりを もらったから あした がっこうに いく。", en: "I got medicine from the doctor, so I'll go to school tomorrow." }
    antiPattern: { ja: "たんじょうびに ちちに とけいを あげった。", why: "あげる is a る-verb, so its past is あげた — った belongs to う-verbs like もらう: たんじょうびに ちちに とけいを もらった。" }

  - id: kureru
    variant: honorific
    rule: "Two more words, and for now you only have to RECOGNISE them. When the giver is somebody you look up to — a teacher, a customer, somebody much older — Japanese swaps the verb rather than adding a polite ending. くれる becomes くださる, もらう becomes いただく. 「せんせいが じしょを くださった。」 The teacher was kind enough to give me a dictionary. 「せんせいに じしょを いただいた。」 I received a dictionary from the teacher. Notice the axis has not moved an inch: くださる points in at me exactly like くれる, and いただく makes the receiver the subject exactly like もらう. Respect is a layer sitting on top of direction, which is why direction comes first. Meet them now because you will hear them constantly and cannot derive them — no rule you own gets you from くれる to くださった. When you are the one speaking, keep using くれる and もらう. Nobody will think you rude."
    examples:
      - { ja: "せんせいが じしょを くださった。", en: "The teacher was kind enough to give me a dictionary." }
      - { ja: "せんせいに じしょを いただいた。", en: "I received a dictionary from the teacher." }
      - { ja: "たなかさんが おいわいの はなたばを くださる。", en: "Tanaka is kind enough to give me a congratulatory bouquet." }
      - { ja: "かいしゃから きねんの カードを いただく。", en: "I receive a commemorative card from the company." }
      - { ja: "しんせつな せんせいに ノートを もらった。", en: "I got a notebook from a kind teacher." }
    antiPattern: { ja: "ともだちが おかしを くださった。", why: "くださる is for somebody you look up to, so using it of a friend puts a stranger between you — a friend takes くれる: ともだちが おかしを くれた。" }

  # ── L11. The ninth card, and a REGISTRY re-teach like kara-origin / ta-form /
  #    wa-topic: m13's 〜たい, applied to the three verbs. It exists because the
  #    L1+L2 merge freed a card slot, and because あげたい / もらいたい were
  #    already declared atoms carrying sentences with no card of their own —
  #    the module was USING the form and never teaching it.
  - id: v-tai
    variant: transfer
    rule: "You have had 〜たい since module 13 and it works on these three verbs unchanged: drop る or う, add たい. あげたい. もらいたい. What is worth a lesson is that wanting cuts across the direction axis rather than sitting on it. 「せんせいに はなたばを あげたい。」 I want to give the teacher a bouquet — the arrow still points out, and たい only says I have not done it yet. 「たんじょうびに ケーキを もらいたい。」 I want to get a cake for my birthday — still the receiver's side, still もらう's shape. There is one gap worth knowing about now rather than being surprised by later: 〜たい is for YOUR OWN wanting. You cannot use it to say what somebody else wants, which is why every example here is about you. And くれる has no たい at all, because it would mean wanting somebody else to do something — a different form entirely, and not this module's."
    examples:
      - { ja: "せんせいに はなたばを あげたい。", en: "I want to give the teacher a bouquet." }
      - { ja: "たんじょうびに ケーキを もらいたい。", en: "I want to get a cake for my birthday." }
      - { ja: "がくせいに ノートを あげたい。", en: "I want to give the student a notebook." }
      - { ja: "はなが すきだから はなたばを もらいたい。", en: "I like flowers, so I want to get a bouquet." }
      - { ja: "ともだちに おれいの カードを あげたい。", en: "I want to give my friend a thank-you card." }
    antiPattern: { ja: "せんせいに はなたばを あげる たい。", why: "〜たい attaches to the verb stem, not to the finished dictionary form — あげる loses its る before たい: せんせいに はなたばを あげたい。" }

  - id: wa-topic
    variant: viewpoint
    rule: "Because くれる and もらう already say which way the thing moved, Japanese stops mentioning you. 「ともだちが けいたいを くれた。」 There is no わたしに in that sentence and there does not need to be — くれる cannot point anywhere else. Same with もらう: 「ちちに おかねを もらった」 has no わたしは, because the subject of もらう is the speaker unless somebody else is named. This is not an abbreviation of a longer sentence; it is the payoff for having direction built into the verb. And it works the other way round. If you DO say わたしは, you are contrasting: 「わたしは かさを もらった」 lands as I got an umbrella, whatever everyone else got — module 3's は marking a topic against a background. So when you hear くれる with no receiver, the receiver is the speaker or somebody on their side; when you hear もらう with no subject, the subject is the speaker."
    examples:
      - { ja: "ともだちが けいたいを くれた。", en: "My friend gave me a mobile phone." }
      - { ja: "ちちに おかねを もらった。", en: "I got money from my father." }
      - { ja: "わたしは かさを もらった。", en: "As for me, I got an umbrella." }
      - { ja: "いもうとが ケーキを くれたから うれしかった。", en: "My little sister gave me a cake, so I was happy." }
      - { ja: "ともだちに かさを かりた。", en: "I borrowed an umbrella from my friend." }
    antiPattern: { ja: "ともだちが わたしに けいたいを あげた。", why: "くれる is what carries a thing to your side, and it carries it without needing わたしに at all: ともだちが けいたいを くれた。" }

newAtoms:
  # そと declared 2026-08-20 (R1 landing): the L1 axis card TEACHES it in so
  # many words ("everybody else stands そと, outside") and the transfer diagram
  # labels its outside pole with it — it was never declared, so the registry
  # carried it as untaught. imageable:false — 🌳 is にわ/き's glyph and the
  # axis card names it first (m20/m21 steal) anyway.
  - { kana: そと, romaji: soto, gloss: "outside (the in-group boundary)", shortGloss: "outside", imageable: false, kind: vocab }
  # ══ L1. THE HEADLINE VERB and the module's one katakana gift noun. あげる
  #    already carries a courseAtoms row tagged `future` (🎁, "to give"), so it
  #    is in the tokenizer today and this declaration only adds provenance plus
  #    the viewpoint gloss. NO PICTURE: the `ageru` rule card has to name it, and
  #    a `kind: rule` beat compiles to a PINNED step ahead of the interleaved
  #    middle, so the card would steal the debut (the m14 trap, restated for
  #    m21's おさけ, m22's いたい and m30's おく).
  - { kana: あげる, romaji: "ageru", gloss: "to give (away from my side)", shortGloss: "give (away)", imageable: false, kind: verb, verbClass: ru }
  - { kana: プレゼント, romaji: "purezento", gloss: "a present", shortGloss: "present", imageable: false, kind: vocab }
  - { kana: こども, romaji: "kodomo", gloss: "a child", shortGloss: "child", imageable: true, kind: vocab }

  # ══ L2. THE MIRROR VERB. This comment used to justify having NO courseAtoms
  #    row — "the m11-m30 precedent for IR-local atoms". That reasoning was
  #    wrong and the row landed 2026-08-18: an IR-only atom is visible to the
  #    tokenizer and to nothing else, so くれる was taught, graded, and could
  #    never be reviewed, in the module titled あげる・くれる・もらう. See
  #    docs/issues/n4-vocab-never-reaches-srs-2026-08-18.md.
  - { kana: くれる, romaji: "kureru", gloss: "to give (in to my side)", shortGloss: "give (to me)", imageable: false, kind: verb, verbClass: ru }
  - { kana: おかし, romaji: "okashi", gloss: "sweets", shortGloss: "sweets", imageable: false, kind: vocab }
  - { kana: ケーキ, romaji: "keeki", gloss: "a cake", shortGloss: "cake", imageable: false, kind: vocab }

  # ══ L3. THE IMAGE DEBUT. 🎂 is carried by exactly one row in the registry, so
  #    a picture MCQ here cannot offer two options with the same art — the one
  #    place in this module where the shared-glyph ruling does NOT bite.
  - { kana: たんじょうび, romaji: "tanjoubi", gloss: "a birthday", shortGloss: "birthday", imageable: true, kind: vocab }
  - { kana: はなたば, romaji: "hanataba", gloss: "a bouquet", shortGloss: "bouquet", imageable: false, kind: vocab }
  - { kana: おれい, romaji: "orei", gloss: "thanks, a thank-you gift", shortGloss: "thank-you", imageable: false, kind: vocab }
  - { kana: カード, romaji: "kaado", gloss: "a card", shortGloss: "card", imageable: false, kind: vocab }

  # ══ L5. THE RECEIVER'S VERB — an う-verb, so its past rides the same った row
  #    かう does (m11), which is why no new sound change has to be taught.
  - { kana: もらう, romaji: "morau", gloss: "to get, to receive", shortGloss: "receive", imageable: false, kind: verb, verbClass: u }
  - { kana: おみやげ, romaji: "omiyage", gloss: "a souvenir", shortGloss: "souvenir", imageable: false, kind: vocab }
  - { kana: こんど, romaji: "kondo", gloss: "next time, this coming", shortGloss: "next time", imageable: false, kind: vocab }

  # ══ L6. かりる already carries a row tagged `future` (🤝, "to borrow"). NO
  #    PICTURE — 🤝 is also あう's (m25), かす's (m8) and てつだう's (m29), and all
  #    three are MET, so a picture MCQ could offer two options with the same art.
  #    かす itself is m8's and is NOT re-declared; it carries sentences instead.
  - { kana: かりる, romaji: "kariru", gloss: "to borrow", shortGloss: "borrow", imageable: false, kind: verb, verbClass: ru }
  - { kana: おいわい, romaji: "oiwai", gloss: "a celebration, a congratulatory gift", shortGloss: "celebration", imageable: false, kind: vocab }
  - { kana: きねん, romaji: "kinen", gloss: "a commemoration, a keepsake", shortGloss: "keepsake", imageable: false, kind: vocab }

  # ══ L7. THE BAN'S LESSON. うれしい is the reaction the module has been earning
  #    since L1 and it is an い-adjective, so module 12's rules apply unchanged.
  #    〜たい forms are registered WHOLE for m30's みたい reason: without them
  #    「あげたい」 would tile as あげ · たい and credit m13's 〜たい on a stem the
  #    learner never wrote.
  - { kana: うれしい, romaji: "ureshii", gloss: "happy, glad", shortGloss: "happy", imageable: false, kind: adjective }
  - { kana: あげたい, romaji: "agetai", gloss: "want to give (away)", shortGloss: "want to give", imageable: false, kind: verb-form, derivedFrom: あげる }
  - { kana: もらいたい, romaji: "moraitai", gloss: "want to get", shortGloss: "want to get", imageable: false, kind: verb-form, derivedFrom: もらう }
  - { kana: おめでとう, romaji: "omedetou", gloss: "congratulations", shortGloss: "congrats", imageable: false, kind: phrase }

  # ══ L9. THE PAST. All three ride module 11's own rules — あげる and くれる are
  #    る-verbs (drop る, add た) and もらう is an う-verb ending in う (った), so
  #    this lesson derives nothing the learner does not already own. うれしかった
  #    is module 12's い-adjective past, same story.
  - { kana: あげた, romaji: "ageta", gloss: "gave (away from my side)", shortGloss: "gave (away)", imageable: false, kind: verb-form, derivedFrom: あげる }
  - { kana: くれた, romaji: "kureta", gloss: "gave (in to my side)", shortGloss: "give me (past)", imageable: false, kind: verb-form, derivedFrom: くれる }
  - { kana: もらった, romaji: "moratta", gloss: "got, received", shortGloss: "receive (past)", imageable: false, kind: verb-form, derivedFrom: もらう }
  - { kana: うれしかった, romaji: "ureshikatta", gloss: "was happy, was glad", shortGloss: "was happy", imageable: false, kind: adjective-form, derivedFrom: うれしい }

  # ══ L10. THE HONORIFIC TIER — RECOGNITION ONLY (spine n4-02, production at
  #    n4-21). All four are registered WHOLE because a bare 「いただ」 would let
  #    「いただいた」 tile as いただ · いた, the exact ます-stem minefield m24
  #    measured. None appears in any reviewPool, because the filler generator
  #    draws production targets from the pool.
  - { kana: くださる, romaji: "kudasaru", gloss: "to give me (honorific, recognition only)", shortGloss: "give me (hon.)", imageable: false, kind: verb, verbClass: u }
  - { kana: くださった, romaji: "kudasatta", gloss: "gave me (honorific, recognition only)", shortGloss: "gave me (hon.)", imageable: false, kind: verb-form, derivedFrom: くださる }
  - { kana: いただく, romaji: "itadaku", gloss: "to receive (honorific, recognition only)", shortGloss: "receive (hon.)", imageable: false, kind: verb, verbClass: u }
  - { kana: いただいた, romaji: "itadaita", gloss: "received (honorific, recognition only)", shortGloss: "received (hon.)", imageable: false, kind: verb-form, derivedFrom: いただく }
  - { kana: しんせつ, romaji: "shinsetsu", gloss: "kind", shortGloss: "kind", imageable: false, kind: adjective }

  # ══ L11. THE DISAPPEARING SUBJECT. かりた / かした finish the borrow-lend pair
  #    the module opened at L6 — both are ordinary module 11 pasts, and かす's
  #    own lemma is m8's, so only the inflection is new. よろこぶ is the reaction
  #    verb the spine allocates; its past よろこんだ rides the godan んだ row.
  - { kana: かりた, romaji: "karita", gloss: "borrowed", shortGloss: "borrow (past)", imageable: false, kind: verb-form, derivedFrom: かりる }
  - { kana: かした, romaji: "kashita", gloss: "lent", shortGloss: "lend (past)", imageable: false, kind: verb-form, derivedFrom: かす }
  - { kana: よろこぶ, romaji: "yorokobu", gloss: "to be delighted", shortGloss: "be delighted", imageable: false, kind: verb, verbClass: u }
  - { kana: よろこんだ, romaji: "yorokonda", gloss: "was delighted", shortGloss: "was delighted", imageable: false, kind: verb-form, derivedFrom: よろこぶ }

  # ══ Negatives, spread across L7 and L11. Registered whole for the same
  #    longest-match reason as the 〜たい pair: 「もらわない」 has a stem the
  #    learner has never seen written down.
  - { kana: あげない, romaji: "agenai", gloss: "won't give (away)", shortGloss: "won't give", imageable: false, kind: verb-form, derivedFrom: あげる }
  - { kana: くれない, romaji: "kurenai", gloss: "won't give (to me)", shortGloss: "won't give me", imageable: false, kind: verb-form, derivedFrom: くれる }
  - { kana: もらわない, romaji: "morawanai", gloss: "won't get, doesn't get", shortGloss: "won't get", imageable: false, kind: verb-form, derivedFrom: もらう }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m31-neo-1
    role: teaching
    title: "「あげる」と「くれる」 — one present, two directions"
    focus: "The module's axis, both poles at once: あげる sends a thing out of your circle and くれる brings it in"
    introduces: [あげる, くれる, プレゼント, こども, はなたば, おれい, そと]
    beats:
      # あげる is planted ALONE for three beats before くれる arrives. A contrast
      # needs one pole owned first — this is the "たら is the hub" shape from
      # spine-n4.md §3.1, not a return to one-verb-per-lesson.
      - { kind: rule, grammarPointId: ageru, variant: axis }
      - { kind: sentence, ja: "ともだちに プレゼントを あげる。", en: "I'll give my friend a present", exercises: [ageru, ni-recipient, wo-object], mode: build }
      - { kind: sentence, ja: "ははは せんせいに はなを あげる。", en: "My mother gives the teacher flowers", exercises: [ageru, ni-recipient, family-register], mode: build }
      - { kind: sentence, ja: "あには がくせいに じしょを あげる。", en: "My older brother gives the student a dictionary", exercises: [ageru, ni-recipient, wo-object], mode: build }
      # THE PIVOT — deliberately the SAME present and the SAME friend as beat 2,
      # so the only thing that moved is the direction.
      - { kind: sentence, ja: "ともだちが プレゼントを くれる。", en: "My friend gives me a present", exercises: [kureru, ga-existence, wo-object], mode: build }
      - { kind: sentence, ja: "ちちが おおきい とけいを くれる。", en: "My father gives me a big watch", exercises: [kureru, ga-existence, i-adj-present], mode: build }
      - { kind: particle-cloze, stem: "ともだちが プレゼントを ", tail: "。", answer: "くれる", options: ["くれる", "あげる", "かう"], en: "My friend gives me a present", explanation: "the present is arriving at my side, and あげる can only send something away from it. かう would only mean my friend buys one." }
      - { kind: sentence, ja: "いもうとは えんぴつが すきだから あげる。", en: "My little sister likes pencils, so I'll give her one", exercises: [ageru, kara-because, suki-kirai-no], mode: build }
      - { kind: sentence, ja: "いしゃが ちちに くすりを くれる。", en: "The doctor gives my father medicine", exercises: [kureru, ni-recipient, ga-existence], mode: listening }
      - { kind: sentence, ja: "ともだちに はなたばを あげる。", en: "I'll give my friend a bouquet", exercises: [ageru, ni-recipient, wo-object], mode: build }
      - { kind: sentence, ja: "あねが おとうとに かさを くれる。", en: "My older sister gives my little brother an umbrella", exercises: [kureru, ni-recipient, family-register], mode: translate }
      - { kind: sentence, ja: "こどもは アメリカじんに しゃしんを あげる。", en: "The child gives the American a photograph", exercises: [ageru, ni-recipient, wa-topic], mode: listening }
      - { kind: sentence, ja: "せんせいに おれいの てがみを あげる。", en: "I'll give the teacher a thank-you letter", exercises: [ageru, no-possession, ni-recipient], mode: build }
      - { kind: sentence, ja: "ともだちが プレゼントを くれる。", en: "My friend gives me a present", exercises: [kureru, ga-existence], mode: translate, alsoAccept: ["ともだちが わたしに プレゼントを くれる。"] }
      - { kind: particle-cloze, stem: "ははは せんせいに はなを ", tail: "。", answer: "あげる", options: ["あげる", "くれる", "かう"], en: "My mother gives the teacher flowers", explanation: "the flowers leave my mother's side, and my mother is inside my circle while the teacher is outside it — so the arrow points out and あげる is the verb. くれる would have to bring them back in." }
