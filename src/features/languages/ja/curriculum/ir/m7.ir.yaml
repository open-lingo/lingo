    role: teaching
    title: "Asking politely — か"
    focus: "polite questions REQUIRE か; plain questions just rise in pitch"
    introduces: []
    beats:
      - { kind: rule, grammarPointId: ka-question }
      - { kind: sentence, ja: "たべますか。", en: "Say politely: Will you eat?", exercises: [ka-question, masu-present], mode: build }
      - { kind: sentence, ja: "いきますか。", en: "Say politely: Are you going?", exercises: [ka-question, masu-present], mode: build }
      - { kind: sentence, ja: "みずを のみますか。", en: "Say politely: Will you drink water?", exercises: [ka-question, masu-present, wo], mode: translate }
      - { kind: sentence, ja: "たなかさんは せんせいですか。", en: "Say politely: Is Tanaka a teacher?", exercises: [ka-question, desu-copula, wa], mode: build }
      - { kind: sentence, ja: "これは かぎですか。", en: "Say politely: Is this a key?", exercises: [ka-question, desu-copula, kore-deixis], mode: listening }
      - { kind: sentence, ja: "なにを たべますか。", en: "Say politely: What will you eat?", exercises: [ka-question, masu-present, wo], mode: translate }
      - { kind: sentence, ja: "どこに いきますか。", en: "Say politely: Where are you going?", exercises: [ka-question, masu-present, location-qa], mode: build }
      - { kind: sentence, ja: "うたを ききますか。", en: "Say politely: Will you listen to a song", exercises: [ka-question, masu-present, wo], mode: build }
      - kind: dialogue
        lines:
          - { speaker: "たなか", ja: "どこに いきますか。", en: "Where are you going?" }
          - { speaker: "トム", ja: "うみに いきます。", en: "I'm going to the sea." }
        questions:
          - { q: "Where is Tom going?", options: ["The sea", "The mountain", "The river", "Home"], answer: "The sea" }
      - { kind: challenge, ja: "たなかさんは きょう かいしゃに いきますか。", en: "Say politely: Is Tanaka going to the company today?", combines: [wa, ni, ka-question, masu-present], mode: build }
    reviewPool: [たべる, いく, きく, みず, うた, かぎ, せんせい, きょう]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m7-neo-6
    role: teaching
    title: "Who are you talking to?"
    focus: "the SAME thought in two skins — audience picks the form, every sentence"
    introduces: [ええ]
    beats:
      - { kind: rule, grammarPointId: register-audience }
      - { kind: sentence, ja: "たべる。", en: "Say to a friend: I'll eat", exercises: [register-audience], mode: build }
      - { kind: sentence, ja: "たべます。", en: "Say to a teacher: I'll eat", exercises: [register-audience, masu-present], mode: build }
