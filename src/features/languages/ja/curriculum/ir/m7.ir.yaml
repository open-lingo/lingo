lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m7-neo-1
    role: teaching
    title: "Talking up — ます"
    focus: "ます as a POLITE SKIN on a verb you already know; meaning unchanged, audience changed"
    introduces: [たべます, のみます, はい]
    beats:
      - { kind: rule, grammarPointId: masu-present }
      - { kind: sentence, ja: "たべます。", en: "Say politely: I eat", exercises: [masu-present], mode: build }
      - { kind: sentence, ja: "のみます。", en: "Say politely: I drink", exercises: [masu-present], mode: build }
      - { kind: sentence, ja: "みずを のみます。", en: "Say politely: I drink water", exercises: [masu-present, wo], mode: translate, alsoAccept: ["みずを のむ。"] }
      - { kind: sentence, ja: "りょうりを たべます。", en: "Say politely: I eat the food", exercises: [masu-present, wo], mode: build }
      - { kind: sentence, ja: "ぎゅうにゅうを のみます。", en: "Say politely: I drink milk", exercises: [masu-present, wo], mode: listening }
      - { kind: sentence, ja: "たなかさんは たべます。", en: "Say politely: Tanaka eats", exercises: [masu-present, wa], mode: build }
      - { kind: sentence, ja: "ともだちと たべます。", en: "Say politely: I eat with a friend", exercises: [masu-present], mode: translate }
      - { kind: sentence, ja: "きょうは たべます。", en: "Say politely: Today I'll eat", exercises: [masu-present, wa], mode: build }
      - { kind: sentence, ja: "はい、たべます。", en: "Say politely: Yes, I'll eat", exercises: [masu-present], mode: build }
      - kind: dialogue
        lines:
          - { speaker: "たなか", ja: "みずを のみますか。", en: "Will you drink water?" }
          - { speaker: "トム", ja: "のみます。", en: "I'll drink." }
        questions:
          - { q: "What does Tom say he'll do?", options: ["Drink", "Eat", "Go", "Nothing"], answer: "Drink" }
      - { kind: challenge, ja: "たなかさんは みずを のみます。", en: "Say politely: Tanaka drinks water", combines: [wa, wo, masu-present], mode: build }
    reviewPool: [たべる, のむ, みず, ぎゅうにゅう, りょうり, きょう, ひと, ほん]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m7-neo-2
    role: teaching
    title: "Every verb, politely — the three classes"
    focus: "ます across る-verbs, う-verbs and the two irregulars; the stem is the whole trick"
    introduces: [みます, いきます, します, きます, かいます]
    beats:
      - { kind: rule, grammarPointId: masu-present }
      - { kind: sentence, ja: "みます。", en: "Say politely: I watch", exercises: [masu-present], mode: build }
      - { kind: sentence, ja: "いきます。", en: "Say politely: I go", exercises: [masu-present], mode: build }
      - { kind: sentence, ja: "します。", en: "Say politely: I do it", exercises: [masu-present], mode: build }
      - { kind: sentence, ja: "きます。", en: "Say politely: I'm coming", exercises: [masu-present], mode: build }
      - { kind: sentence, ja: "うみに いきます。", en: "Say politely: I'm going to the sea", exercises: [masu-present, ni], mode: translate, alsoAccept: ["うみに いく。"] }
      - { kind: sentence, ja: "しゃしんを みます。", en: "Say politely: I look at the photo", exercises: [masu-present, wo], mode: listening }
      - { kind: sentence, ja: "さんぽを します。", en: "Say politely: I take a walk", exercises: [masu-present, wo], mode: translate }
      - { kind: sentence, ja: "ともだちが きます。", en: "Say politely: A friend is coming", exercises: [masu-present, ga], mode: translate }
      - { kind: sentence, ja: "やまに いきます。", en: "Say politely: I'm going to the mountain", exercises: [masu-present, ni], mode: listening }
      - { kind: sentence, ja: "ほんを かいます。", en: "Say politely: I buy a book", exercises: [masu-present, wo], mode: build }
      - { kind: challenge, ja: "きょう ともだちが いえに きます。", en: "Say politely: A friend is coming to the house today", combines: [masu-present, ga, ni], mode: build }
    reviewPool: [みる, いく, する, くる, うみ, やま, しゃしん, ともだち, いえ]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m7-neo-3
    role: teaching
    title: "Politely saying no — ません"
    focus: "ません as the polite twin of plain ない; same stem, swapped tail"
    introduces: []
    beats:
      - { kind: rule, grammarPointId: masu-negative }
      - { kind: sentence, ja: "のみません。", en: "Say politely: I don't drink", exercises: [masu-negative], mode: build }
      - { kind: sentence, ja: "たべません。", en: "Say politely: I don't eat", exercises: [masu-negative], mode: build }
      - { kind: sentence, ja: "きょうは いきません。", en: "Say politely: I'm not going today", exercises: [masu-negative, wa], mode: build, alsoAccept: ["きょうは いかない。"] }
      - { kind: sentence, ja: "しゃしんを みません。", en: "Say politely: I don't look at the photo", exercises: [masu-negative, wo], mode: build }
      - { kind: sentence, ja: "ぎゅうにゅうを のみません。", en: "Say politely: I don't drink milk", exercises: [masu-negative, wo], mode: listening }
      - { kind: sentence, ja: "たなかさんは きません。", en: "Say politely: Tanaka isn't coming", exercises: [masu-negative, wa], mode: build }
      - { kind: particle-cloze, stem: "みずを ", tail: "。", answer: "のみません", options: ["のみません", "のみます", "たべません"], en: "I don't drink water. (polite)", explanation: "ません is the polite negative — の-み-ません, same stem as のみます." }
      - { kind: sentence, ja: "さんぽを しません。", en: "Say politely: I don't take walks", exercises: [masu-negative, wo], mode: build }
      - kind: dialogue
        lines:
          - { speaker: "たなか", ja: "ぎゅうにゅうを のみますか。", en: "Do you drink milk?" }
          - { speaker: "ミカ", ja: "いいえ、のみません。", en: "No, I don't." }
        questions:
          - { q: "Does Mika drink milk?", options: ["No", "Yes", "Sometimes", "She didn't say"], answer: "No" }
      - { kind: challenge, ja: "ミカさんは きょう いえに きません。", en: "Say politely: Mika isn't coming to the house today", combines: [wa, ni, masu-negative], mode: build, alsoAccept: ["ミカは きょう いえに きません。"] }
    reviewPool: [のむ, たべる, みる, くる, みず, ぎゅうにゅう, きょう, さんぽ]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m7-neo-r1
    role: review
    title: "Review — polite verbs"
    focus: "ます / ません across all three verb classes, all-new surfaces, no new atoms"
    introduces: []
    beats:
      - { kind: sentence, ja: "うたを ききます。", en: "Say politely: I listen to a song", exercises: [masu-present, wo], mode: build }
      - { kind: sentence, ja: "めがねを かいます。", en: "Say politely: I buy glasses", exercises: [masu-present, wo], mode: translate }
      - { kind: sentence, ja: "そこに いきません。", en: "Say politely: I'm not going there", exercises: [masu-negative, ni], mode: build }
      - { kind: sentence, ja: "いぬが きます。", en: "Say politely: The dog is coming", exercises: [masu-present, ga], mode: listening }
      - { kind: sentence, ja: "かわで あそびます。", en: "Say politely: I play at the river", exercises: [masu-present, de-action], mode: build }
      - { kind: sentence, ja: "きょうは しません。", en: "Say politely: I won't do it today", exercises: [masu-negative, wa], mode: translate }
      - { kind: particle-cloze, stem: "パーティーに ", tail: "。", answer: "いきます", options: ["いきます", "いきません", "みます"], en: "I'm going to the party. (polite)", explanation: "いく → い-き-ます." }
      - { kind: sentence, ja: "ねこを みます。", en: "Say politely: I look at the cat", exercises: [masu-present, wo], mode: build }
      - { kind: sentence, ja: "みずを のみません。", en: "Say politely: I don't drink water", exercises: [masu-negative, wo], mode: listening }
      - { kind: sentence, ja: "ともだちと いきます。", en: "Say politely: I'm going with a friend", exercises: [masu-present], mode: translate }
      - kind: dialogue
        lines:
          - { speaker: "ケン", ja: "パーティーに いく？", en: "Going to the party?" }
          - { speaker: "トム", ja: "うん、いく。", en: "Yeah, I'm going." }
        questions:
          - { q: "Why does Tom answer いく and not いきます?", options: ["Ken is a friend", "Ken is a teacher", "It's a question", "It's negative"], answer: "Ken is a friend" }
    reviewPool: [きく, かう, あそぶ, うた, ほん, いぬ, ねこ, かわ, パーティー, ともだち]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m7-neo-4
    role: teaching
    title: "です — the noun's polite finish"
    focus: "です finishes NOUNS the way だ does; です is not a coat you put on verbs"
    introduces: []
    beats:
      - { kind: rule, grammarPointId: desu-copula }
      - { kind: sentence, ja: "がくせいです。", en: "Say politely: I'm a student", exercises: [desu-copula], mode: build }
      - { kind: sentence, ja: "せんせいです。", en: "Say politely: I'm a teacher", exercises: [desu-copula], mode: build }
      - { kind: sentence, ja: "たなかさんは せんせいです。", en: "Say politely: Tanaka is a teacher", exercises: [desu-copula, wa], mode: translate, alsoAccept: ["たなかさんは せんせいだ。"] }
      - { kind: sentence, ja: "トムさんは アメリカじんです。", en: "Say politely: Tom is American", exercises: [desu-copula, wa], mode: build }
      - { kind: sentence, ja: "これは ほんです。", en: "Say politely: This is a book", exercises: [desu-copula, wa, kore-deixis], mode: listening }
      - { kind: sentence, ja: "ミカさんは にほんじんです。", en: "Say politely: Mika is Japanese", exercises: [desu-copula, wa], mode: translate }
      - { kind: sentence, ja: "それは かぎです。", en: "Say politely: That's a key", exercises: [desu-copula, wa, sore-deixis], mode: build }
      - { kind: sentence, ja: "ともだちの ぼうしです。", en: "Say politely: It's my friend's hat", exercises: [desu-copula, "no"], mode: translate }
      - kind: dialogue
        lines:
          - { speaker: "たなか", ja: "トムさんは がくせいですか。", en: "Is Tom a student?" }
          - { speaker: "ミカ", ja: "はい、がくせいです。", en: "Yes, he's a student." }
        questions:
          - { q: "What is Tom?", options: ["A student", "A teacher", "American only", "Not stated"], answer: "A student" }
      - { kind: challenge, ja: "たなかさんの いえは あそこです。", en: "Say politely: Tanaka's house is over there", combines: ["no", wa, desu-copula, location-deixis], mode: build }
    reviewPool: [がくせい, せんせい, ほん, かぎ, ぼうし, いえ, にほんじん, ともだち]

  # ═══════════════════════════════════════════════════════════════════════
