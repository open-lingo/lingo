module: m7
title: "Politeness as a layer: ます and です"
register: plain
priorNeoModules: [m3, m4, m5, m6]

# Grammar m7 EXERCISES but does not TEACH (taught m3-m6). Registry-id
# reconciliation is a separate pass; these are the IR-local ids m3-m6 use.
priorGrammarPoints: [wa, ga, wo, "no", ni, de, mo, dare, kore-deixis, sore-deixis,
                     nai-ru, nai-u, nai-irregular, aru-ga-existence, iru-animacy,
                     nai-existence, location-deixis, ni-existence, spatial-relations,
                     location-qa, de-action]

notes: |
  m7 = spine tile s07. THE REGISTER MODULE — where です/ます stop being
  recognition previews (inv 7) and become production targets for the first
  time. Everything before this is plain-only.

  Shape (inv 25): 15 lessons = 11 teaching + 3 review + 1 challenge. TWO of
  the eleven teaching lessons are KATAKANA row lessons (ア row, カ row —
  ruling 2026-07-26, KATAKANA_ROW_SCHEDULE.neoModuleIndex = 7). Those are
  symbol lessons, NOT IR beats, and are wired at module level. This IR
  therefore carries 9 teaching + 3 review + 1 challenge = 13 lessons.

  Polite-production share: m7 is EXEMPT from the plain-preferred ramp
  (≤20% m8-m11) — it is the module that teaches ます, so it necessarily
  drills polite heavily. The ramp starts at m8.

  はい is introduced HERE, not at n15/m10: polite questions arrive in this
  module and a natural polite dialogue cannot answer them without it
  (inv 33 forbids a dialogue being a word's first exposure). n15 keeps the
  yes-triple as its DEEPEN beat — register AND function (はい as aizuchi),
  which is the part that actually needs the extra module of maturity.

  Register canon used throughout: Tanaka is the TEACHER (polite target).
  Tom / Mika / Ken are students and friends (plain target). Every production
  prompt whose answer depends on register names its audience (inv 8).

grammarPoints:
  - id: masu-present
    rule: "Polite verbs are built from the i-STEM: drop the final -u to the い row, then add ます. のむ → のみ + ます. る-verbs just drop る: たべる → たべ + ます. する → します, くる → きます. The MEANING doesn't change — たべる and たべます both mean 'eat'. Only the audience changes."
    examples:
      - { ja: "たべます", en: "I eat. (polite)" }
      - { ja: "みずを のみます", en: "I drink water. (polite)" }
    antiPattern: { ja: "たべるます", en: "", why: "the る is dropped before ます — たべます, not たべるます" }
  - id: masu-negative
    rule: "The polite negative swaps ます for ません — same stem, different tail. のみます → のみません. It is the polite twin of plain ない: のまない = のみません."
    examples:
      - { ja: "のみません", en: "I don't drink. (polite)" }
      - { ja: "きょうは いきません", en: "I'm not going today. (polite)" }
    antiPattern: { ja: "のみますない", en: "", why: "ません REPLACES ます — you don't stack ない on top of it" }
  - id: desu-copula
    rule: "です finishes NOUNS politely, the way だ finishes them plainly: ねこだ → ねこです. です is NOT 'polite だ' you can bolt onto verbs — たべるです is not a sentence. Verbs get ます; nouns get です."
    examples:
      - { ja: "がくせいです", en: "I'm a student. (polite)" }
      - { ja: "たなかさんは せんせいです", en: "Tanaka is a teacher. (polite)" }
    antiPattern: { ja: "たべるです", en: "", why: "verbs take ます, not です — たべます" }
  - id: ka-question
    rule: "か turns a sentence into a question. In POLITE speech か is required — たべますか？ Plain speech usually drops it and just rises in pitch: たべる？ か after a plain sentence sounds blunt or archaic."
    examples:
      - { ja: "みずを のみますか", en: "Will you drink water? (polite)" }
      - { ja: "たなかさんは せんせいですか", en: "Is Tanaka a teacher? (polite)" }
    antiPattern: { ja: "たべるますか", en: "", why: "the stem comes before ます — たべますか" }
  - id: register-audience
    rule: "Japanese picks its form by WHO you're talking to, not by what you mean. Friends and family get plain (たべる). Teachers, strangers, and customers get polite (たべます). Same thought, two skins — you choose by audience, every sentence."
    examples:
      - { ja: "たべる", en: "I'll eat. (to a friend)" }
      - { ja: "たべます", en: "I'll eat. (to a teacher)" }

