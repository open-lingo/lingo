module: m9
title: "Numbers and first purchases"
register: plain
priorNeoModules: [m3, m4, m5, m6, m7, m8]

priorGrammarPoints: [wa-topic, ga-existence, wo-object, no-possession, ni-location, de-action, mo-also, dare, kore-sore-are-dore, kore-sore-are-dore,
                     nai-form, nai-form, nai-form, arimasu, imasu,
                     nai-existence, koko-soko-asoko, ni-location, spatial-relations,
                     location-qa, de-action,
                     masu-present, masu-negative, desu-copula, ka-question, register-audience,
                     te-form, te-kudasai]

notes: |
  m9 = spine tile n03. Numbers 1-10 + the FIRST purchase exchange. Per the
  s08 review note the old "learn every counter at once" unit is dissolved:
  ONE generic counter (〜つ) is taught here, and every other counter drips in
  later when a word calls for it (thr1 COUNTER DRIP). Do not add にん/まい/
  ほん here.

  Shape (inv 25): 15 lessons = 11 teaching + 3 review + 1 challenge. Two
  teaching slots are KATAKANA rows (ナ, ハ — neoModuleIndex 9), wired at
  module level; this IR carries 9 teaching + 3 review + 1 challenge = 13.

  SCRIPT: the ハ row lands in this module, which finally makes パン readable
  (ハ + handakuten). It is used only AFTER its row lesson, in the shop
  lessons — never before.

  HOMOGRAPH WARNING: に is already an atom (the particle). The number 2 is
  the same surface, so bare-に-as-2 is never drilled in a sentence — the
  number line is taught as a sequence and に-the-number only appears inside
  counter/price phrases where context disambiguates.

  REGISTER: plain stays the majority (ramp <=20% polite for m8-m11). The shop
  exchange is the natural place for a polite beat, so this module spends its
  polite share there — ください from m8 does the asking, いくらですか the price.

grammarPoints:
  - id: numbers-1-10
    rule: "いち に さん よん ご ろく なな はち きゅう じゅう. Four and seven have two readings each — よん/し and なな/しち. Use よん and なな: they are the ones that never collide with anything, and native speakers reach for them first when counting things."
    examples:
      - { ja: "いち に さん", en: "one, two, three" }
      - { ja: "よん ご ろく", en: "four, five, six" }
      - { ja: "なな はち きゅう じゅう", en: "seven, eight, nine, ten" }
  - id: counter-tsu
    rule: "〜つ is the ALL-PURPOSE counter for things: ひとつ ふたつ みっつ よっつ いつつ. It works for objects when you don't know the specific counter, which as a beginner is most of the time. It stops at とお (10) — past that you use the plain numbers."
    examples:
      - { ja: "ひとつ ください", en: "One, please." }
      - { ja: "ふたつ ある", en: "There are two." }
    antiPattern: { ja: "いちつ", en: "", why: "the 〜つ series uses its own readings — ひとつ, not いちつ" }
  - id: ikura-price
    rule: "いくら asks the price: いくらですか = 'how much is it?'. The answer is a number + えん. Prices are the one place a beginner needs numbers immediately, so this is where the number line gets spent."
    examples:
      - { ja: "いくらですか", en: "How much is it?" }
      - { ja: "ひゃくえんです", en: "It's a hundred yen." }

newAtoms:
  - { kana: いち, romaji: ichi, gloss: "one", imageable: false, kind: vocab }
  - { kana: さん, romaji: san, gloss: "three", imageable: false, kind: vocab }
  - { kana: よん, romaji: yon, gloss: "four", imageable: false, kind: vocab }
  - { kana: ご, romaji: go, gloss: "five", imageable: false, kind: vocab }
  - { kana: ろく, romaji: roku, gloss: "six", imageable: false, kind: vocab }
  - { kana: なな, romaji: nana, gloss: "seven", imageable: false, kind: vocab }
  - { kana: はち, romaji: hachi, gloss: "eight", imageable: false, kind: vocab }
  - { kana: きゅう, romaji: kyuu, gloss: "nine", imageable: false, kind: vocab }
  - { kana: じゅう, romaji: juu, gloss: "ten", imageable: false, kind: vocab }
  - { kana: ひとつ, romaji: hitotsu, gloss: "one thing", shortGloss: "one (thing)", imageable: false, kind: vocab }
  - { kana: ふたつ, romaji: futatsu, gloss: "two things", shortGloss: "two (things)", imageable: false, kind: vocab }
  - { kana: みっつ, romaji: mittsu, gloss: "three things", shortGloss: "three (things)", imageable: false, kind: vocab }
  - { kana: えん, romaji: en, gloss: "yen", imageable: true, kind: vocab }
  # ひゃく was used from m9-neo-4 onward while being introduced NOWHERE —
  # it reached the learner through lesson 4's reviewPool, which asserts
  # "already known". Same shape as the いくら/えん leak (inv 33).
  - { kana: ひゃく, romaji: hyaku, gloss: "hundred", imageable: false, kind: vocab }
  - { kana: いくら, romaji: ikura, gloss: "how much", imageable: false, kind: vocab }
  - { kana: かね, romaji: kane, gloss: "money", imageable: true, kind: vocab }
  - { kana: たかい, romaji: takai, gloss: "expensive, tall", shortGloss: "expensive", imageable: true, kind: vocab }
  - { kana: やすい, romaji: yasui, gloss: "cheap", imageable: true, kind: vocab }
  - { kana: うる, romaji: uru, gloss: "to sell", imageable: true, kind: verb, verbClass: u }
  - { kana: かいもの, romaji: kaimono, gloss: "shopping", imageable: true, kind: vocab }
  - { kana: パン, romaji: pan, gloss: "bread", imageable: true, kind: vocab }

lessons:
  - id: m9-neo-1
    role: teaching
    title: "One to five"
    focus: "the first half of the number line, as a sequence"
    introduces: [いち, さん, よん, ご, えん]
    beats:
      # GRAMMAR NOTE (2026-07-27 fix): a bare cardinal CANNOT quantify a noun
      # in Japanese — 「ほんが ご ある」 is not a sentence. Numbers reach nouns
      # only through a counter, so this lesson pairs them with えん (a counter
      # in its own right) and quantity waits for 〜つ in m9-neo-3. The rule
      # card enumerating 1-10 IS the debut for the numerals themselves; they
      # are `imageable: false` because their only emoji are the numeral
      # glyphs (1️⃣ serves BOTH いち and ひとつ — an image MCQ literally
      # cannot discriminate them).
      - { kind: rule, grammarPointId: numbers-1-10 }
      - { kind: sentence, ja: "いち さん よん ご", en: "one, three, four, five", exercises: [numbers-1-10], mode: build }
      - { kind: sentence, ja: "さん よん ご", en: "three, four, five", exercises: [numbers-1-10], mode: listening }
      - { kind: sentence, ja: "これは ごえんだ。", en: "This is five yen", exercises: [kore-sore-are-dore, desu-copula, numbers-1-10], mode: build }
      - { kind: sentence, ja: "えんぴつは いちえんだ。", en: "The pencil is one yen", exercises: [wa-topic, desu-copula, numbers-1-10], mode: build }
      - { kind: sentence, ja: "それは よんえんだ。", en: "That is four yen", exercises: [kore-sore-are-dore, desu-copula, numbers-1-10], mode: listening }
      - { kind: sentence, ja: "ほんは さんえんだ。", en: "The book is three yen", exercises: [wa-topic, desu-copula, numbers-1-10], mode: build }
      - { kind: challenge, ja: "ミカの ぼうしは ごえんだ。", en: "Mika's hat is five yen", combines: [no-possession, wa-topic, desu-copula, numbers-1-10], mode: build }
    reviewPool: [ほん, ひと, ねこ, いえ, みず, ともだち, きょう]

  - id: m9-neo-2
    role: teaching
    title: "Six to ten"
    focus: "the rest of the line; なな and よん over しち and し"
    introduces: [ろく, なな, はち, きゅう, じゅう]
    beats:
      - { kind: rule, grammarPointId: numbers-1-10 }
      - { kind: sentence, ja: "ろく なな はち", en: "six, seven, eight", exercises: [numbers-1-10], mode: build }
      - { kind: sentence, ja: "はち きゅう じゅう", en: "eight, nine, ten", exercises: [numbers-1-10], mode: build }
      - { kind: sentence, ja: "これは じゅうえんだ。", en: "This is ten yen", exercises: [kore-sore-are-dore, desu-copula, numbers-1-10], mode: build }
      - { kind: sentence, ja: "かさは ろくえんだ。", en: "The umbrella is six yen", exercises: [wa-topic, desu-copula, numbers-1-10], mode: build }
      - { kind: sentence, ja: "あれは はちえんだ。", en: "That over there is eight yen", exercises: [kore-sore-are-dore, desu-copula, numbers-1-10], mode: listening }
      - { kind: sentence, ja: "みずは ななえんだ。", en: "The water is seven yen", exercises: [wa-topic, desu-copula, numbers-1-10], mode: build }
      - { kind: sentence, ja: "めがねは きゅうえんだ。", en: "The glasses are nine yen", exercises: [wa-topic, desu-copula, numbers-1-10], mode: translate }
      # Shape must differ from m9-neo-1's challenge (inv 26 novelty).
      - { kind: challenge, ja: "それも じゅうえんだ。", en: "That one is ten yen too", combines: [kore-sore-are-dore, mo-also, desu-copula, numbers-1-10], mode: build }
    reviewPool: [ねこ, いぬ, ほん, ひと, いえ, ともだち, せんせい]

  - id: m9-neo-3
    role: teaching
    title: "Counting things — 〜つ"
    focus: "the all-purpose counter; its own readings, not the plain numbers"
    introduces: [ひとつ, ふたつ, みっつ]
    beats:
      # The rule card enumerates ひとつ/ふたつ/みっつ, so it IS their debut —
      # the old bare one-tile builds ("ひとつ" alone) taught nothing and
      # tripped inv 19. Every 〜つ beat now carries a real noun, which is
      # also the FIRST grammatical way this module can attach a quantity to
      # a noun (bare cardinals cannot — see m9-neo-1).
      - { kind: rule, grammarPointId: counter-tsu }
      # 〜つ counts INANIMATE things only — animals take 〜匹, people 〜人.
      # Every carrier noun here is an object for that reason.
      - { kind: sentence, ja: "ぼうしが ひとつ ある。", en: "There is one hat", exercises: [ga-existence, counter-tsu, arimasu], mode: build }
      - { kind: sentence, ja: "えんぴつが ふたつ ある。", en: "There are two pencils", exercises: [ga-existence, counter-tsu, arimasu], mode: build }
      - { kind: sentence, ja: "かさが みっつ ある。", en: "There are three umbrellas", exercises: [ga-existence, counter-tsu, arimasu], mode: listening }
      - { kind: sentence, ja: "ひとつ ください。", en: "Say politely: One, please", exercises: [counter-tsu, te-kudasai], mode: translate }
      - { kind: sentence, ja: "ふたつ ください。", en: "Say politely: Two, please", exercises: [counter-tsu, te-kudasai], mode: build }
      - { kind: sentence, ja: "ほんが ふたつ ある。", en: "There are two books", exercises: [counter-tsu, ga-existence, arimasu], mode: listening }
      - { kind: sentence, ja: "みっつ ある。", en: "There are three", exercises: [counter-tsu, arimasu], mode: build }
      - { kind: particle-cloze, stem: "ぼうしを ", tail: " ください。", answer: "ひとつ", options: ["ひとつ", "ふたつ", "みっつ"], en: "One hat, please", explanation: "ひとつ is the 〜つ form of one — the counter has its own readings." }
      - { kind: challenge, ja: "ミカの ぼうしが ふたつ ある。", en: "Mika has two hats", combines: [no-possession, ga-existence, counter-tsu, arimasu], mode: build }
    reviewPool: [ほん, ぼうし, かさ, ねこ, いえ, みず, ある]

  - id: m9-neo-r1
    role: review
    title: "Review — the number line"
    focus: "numbers and 〜つ on all-new surfaces"
    introduces: []
    beats:
      - { kind: sentence, ja: "かさが みっつ ある。", en: "There are three umbrellas", exercises: [ga-existence, counter-tsu, arimasu], mode: build }
      - { kind: sentence, ja: "ほんが ふたつ ある。", en: "There are two books", exercises: [ga-existence, counter-tsu, arimasu], mode: listening }
      - { kind: sentence, ja: "ひとつ ください。", en: "Say politely: One, please", exercises: [counter-tsu, te-kudasai], mode: translate }
      - { kind: sentence, ja: "えんぴつが ふたつ ある。", en: "There are two pencils", exercises: [ga-existence, counter-tsu, arimasu], mode: build }
      - { kind: sentence, ja: "これは ななえんだ。", en: "This is seven yen", exercises: [kore-sore-are-dore, desu-copula, numbers-1-10], mode: listening }
      - { kind: sentence, ja: "かさは ごえんです。", en: "Say politely: The umbrella is five yen", exercises: [wa-topic, desu-copula, numbers-1-10], mode: build }
      - { kind: particle-cloze, stem: "ほんが ", tail: " ある。", answer: "みっつ", options: ["みっつ", "ひとつ", "ふたつ"], en: "There are three books", explanation: "みっつ is three things." }
      - { kind: sentence, ja: "はち きゅう じゅう", en: "eight, nine, ten", exercises: [numbers-1-10], mode: build }
      - { kind: sentence, ja: "まどが ふたつ ある。", en: "There are two windows", exercises: [ga-existence, counter-tsu, arimasu], mode: listening }
      - { kind: sentence, ja: "めがねを ひとつ かって。", en: "Buy one pair of glasses", exercises: [wo-object, counter-tsu, te-form], mode: listening }
      - kind: dialogue
        lines:
          - { speaker: "ミカ", ja: "ほんが みっつ ある。", en: "There are three books." }
          - { speaker: "トム", ja: "ふたつは ミカの？", en: "Are two of them yours?" }
        questions:
          - { q: "How many books are there?", options: ["Three", "Two", "One", "Four"], answer: "Three" }
    reviewPool: [かさ, えんぴつ, まど, めがね, ほん, ねこ, いえ]

  - id: m9-neo-4
    role: teaching
    title: "Yen and how much"
    focus: "いくらですか and a number + えん; the exchange that makes numbers pay"
    introduces: [いくら, ひゃく]
    beats:
      - { kind: rule, grammarPointId: ikura-price }
      - { kind: sentence, ja: "これは いくら？", en: "How much is this?", exercises: [ikura-price, kore-sore-are-dore], mode: build }
      - { kind: sentence, ja: "これは いくらですか。", en: "Say politely: How much is this", exercises: [wa-topic, ikura-price, desu-copula, ka-question], mode: build }
      - { kind: sentence, ja: "ひゃくえんです。", en: "Say politely: It's a hundred yen", exercises: [ikura-price, desu-copula], mode: listening }
      - { kind: sentence, ja: "ほんは ごひゃくえんです。", en: "Say politely: The book is five hundred yen", exercises: [wa-topic, ikura-price, desu-copula], mode: listening }
      - { kind: sentence, ja: "ほんは いくらですか。", en: "Say politely: How much is the book", exercises: [wa-topic, ikura-price, ka-question], mode: build }
      - { kind: sentence, ja: "ぼうしは ひゃくえんです。", en: "Say politely: The hat is a hundred yen", exercises: [wa-topic, desu-copula], mode: build }
      - kind: dialogue
        lines:
          - { speaker: "トム", ja: "これは いくらですか。", en: "How much is this?" }
          - { speaker: "たなか", ja: "ひゃくえんです。", en: "It's a hundred yen." }
        questions:
          - { q: "What's the price?", options: ["100 yen", "500 yen", "10 yen", "Not stated"], answer: "100 yen" }
      - { kind: challenge, ja: "ミカの かさは いくらですか。", en: "Say politely: How much is Mika's umbrella", combines: [no-possession, wa-topic, ikura-price, ka-question], mode: build }
    reviewPool: [ほん, ぼうし, かさ, えん, これ, めがね, えんぴつ]

  - id: m9-neo-5
    role: teaching
    title: "Cheap and expensive"
    focus: "the two adjectives a shopper needs before adjectives are formally taught"
    introduces: [たかい, やすい, かね]
    beats:
      - { kind: sentence, ja: "これは たかいです。", en: "Say politely: This is expensive", exercises: [wa-topic, desu-copula], mode: translate }
      - { kind: sentence, ja: "これは やすいです。", en: "Say politely: This is cheap", exercises: [wa-topic, desu-copula], mode: build }
      - { kind: sentence, ja: "これは たかいです。", en: "Say politely: This is expensive", exercises: [wa-topic, desu-copula], mode: listening }
      - { kind: sentence, ja: "かねが ない。", en: "I have no money", exercises: [ga-existence, nai-existence], mode: build }
      - { kind: sentence, ja: "かさは やすいです。", en: "Say politely: The umbrella is cheap", exercises: [wa-topic, desu-copula], mode: build }
      - { kind: particle-cloze, stem: "ごひゃくえんは ", tail: "です。", answer: "たかい", options: ["たかい", "やすい", "かね"], en: "Five hundred yen is expensive", explanation: "たかい is expensive; やすい is cheap." }
      - { kind: challenge, ja: "ミカの めがねは たかいです。", en: "Say politely: Mika's glasses are expensive", combines: [no-possession, wa-topic, desu-copula], mode: build }
    reviewPool: [ほん, かさ, ぼうし, めがね, えん, ある, ない]

  - id: m9-neo-6
    role: teaching
    title: "Buying and selling"
    focus: "うる beside かう; かいもの as the activity"
    introduces: [うる, かいもの, パン]
    beats:
      - { kind: sentence, ja: "パンを かう。", en: "I buy bread", exercises: [wo-object], mode: translate }
      - { kind: sentence, ja: "みせで パンを うる。", en: "They sell bread at the shop", exercises: [de-action, wo-object], mode: build }
      - { kind: sentence, ja: "かいものを する。", en: "I do the shopping", exercises: [wo-object], mode: listening }
      - { kind: sentence, ja: "パンは やすいです。", en: "Say politely: The bread is cheap", exercises: [wa-topic, desu-copula], mode: build }
      - { kind: sentence, ja: "パンを ふたつ ください。", en: "Say politely: Two breads, please", exercises: [wo-object, counter-tsu, te-kudasai], mode: build }
      - kind: dialogue
        lines:
          - { speaker: "ミカ", ja: "みせで かいものを する？", en: "Doing the shopping at the store?" }
          - { speaker: "ケン", ja: "うん。パンを かう。", en: "Yeah. I'll buy bread." }
        questions:
          - { q: "What will Ken buy?", options: ["Bread", "Tea", "A book", "Nothing"], answer: "Bread" }
      - { kind: challenge, ja: "みせで パンを みっつ かってください。", en: "Say politely: Please buy three breads at the shop", combines: [de-action, wo-object, counter-tsu, te-kudasai], mode: build }
    reviewPool: [かう, する, みせ, ちゃ, ごはん, たべもの, やすい, えん]

  - id: m9-neo-r2
    role: review
    title: "Review — the shop exchange"
    focus: "price, counter and request in one place"
    introduces: []
    beats:
      - { kind: sentence, ja: "パンは いくらですか。", en: "Say politely: How much is the bread", exercises: [wa-topic, ikura-price, ka-question], mode: build }
      - { kind: sentence, ja: "みっつ ください。", en: "Say politely: Three, please", exercises: [counter-tsu, te-kudasai], mode: translate }
      - { kind: sentence, ja: "たかいです。", en: "Say politely: It's expensive", exercises: [desu-copula], mode: build }
      - { kind: sentence, ja: "かねが ない。", en: "I have no money", exercises: [ga-existence, nai-existence], mode: listening }
      - { kind: sentence, ja: "みせで ちゃを かう。", en: "I buy tea at the shop", exercises: [de-action, wo-object], mode: build }
      - { kind: sentence, ja: "ごはんは やすいです。", en: "Say politely: The rice is cheap", exercises: [wa-topic, desu-copula], mode: build }
      - { kind: particle-cloze, stem: "これは ", tail: "ですか。", answer: "いくら", options: ["いくら", "たかい", "やすい"], en: "How much is this?", explanation: "いくら asks the price; たかい/やすい answer it." }
      - { kind: sentence, ja: "パンを かいます。", en: "Say politely: I'll buy bread", exercises: [wo-object, masu-present], mode: build }
      - { kind: sentence, ja: "かいものを してください。", en: "Say politely: Please do the shopping", exercises: [wo-object, te-kudasai], mode: listening }
      - { kind: sentence, ja: "ひゃくえんです。", en: "Say politely: It's a hundred yen", exercises: [desu-copula], mode: listening }
      - kind: dialogue
        lines:
          - { speaker: "トム", ja: "パンは いくらですか。", en: "How much is the bread?" }
          - { speaker: "たなか", ja: "ひゃくえんです。やすいですよ。", en: "A hundred yen. It's cheap." }
        questions:
          - { q: "What does Tanaka say about the price?", options: ["It's cheap", "It's expensive", "It's free", "He doesn't know"], answer: "It's cheap" }
    reviewPool: [パン, ちゃ, ごはん, みせ, かね, えん, たかい, やすい, かいもの]

  - id: m9-neo-7
    role: teaching
    title: "How many do you want?"
    focus: "counting what you are buying, out loud"
    introduces: []
    beats:
      - { kind: sentence, ja: "パンを ひとつ かう。", en: "I buy one bread", exercises: [wo-object, counter-tsu], mode: build }
      - { kind: sentence, ja: "ちゃを ふたつ ください。", en: "Say politely: Two teas, please", exercises: [wo-object, counter-tsu, te-kudasai], mode: translate }
      - { kind: sentence, ja: "ぼうしを みっつ かいます。", en: "Say politely: I'll buy three hats", exercises: [wo-object, counter-tsu, masu-present], mode: build }
      - { kind: sentence, ja: "ほんを ひとつ うる。", en: "I sell one book", exercises: [wo-object, counter-tsu], mode: listening }
      - { kind: sentence, ja: "かさを ふたつ かってください。", en: "Say politely: Please buy two umbrellas", exercises: [wo-object, counter-tsu, te-kudasai], mode: build }
      - { kind: sentence, ja: "みずを ひとつ ください。", en: "Say politely: One water, please", exercises: [wo-object, counter-tsu, te-kudasai], mode: build }
      - { kind: sentence, ja: "えんぴつが みっつ ある。", en: "There are three pencils", exercises: [ga-existence, counter-tsu, arimasu], mode: listening }
      - { kind: particle-cloze, stem: "パンを ", tail: " かいます。", answer: "ふたつ", options: ["ふたつ", "ひとつ", "みっつ"], en: "I'll buy two breads", explanation: "ふたつ is two things." }
      - { kind: challenge, ja: "みせで ミカの パンを ひとつ かって。", en: "Buy one of Mika's breads at the shop", combines: [de-action, no-possession, wo-object, counter-tsu, te-form], mode: build }
    reviewPool: [パン, ちゃ, ぼうし, かさ, みず, えんぴつ, ほん, みせ]

  - id: m9-neo-8
    role: teaching
    title: "Too expensive"
    focus: "refusing a price — the other half of a real exchange"
    introduces: []
    beats:
