      - { kind: particle-cloze, stem: "あねは ", tail: "に なる。", answer: "せんせい", options: ["せんせい", "じゅぎょう", "がっこう"], en: "My older sister is going to become a teacher", explanation: "a person turns into another kind of person, not into a lesson or a building — じゅぎょう and がっこう are where a teacher works, never what she becomes." }
