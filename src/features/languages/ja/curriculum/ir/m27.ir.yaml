      - { kind: sentence, ja: "あねは いしゃに なったから びょういんで はたらくんだ。", en: "My older sister became a doctor, so she works at a hospital", exercises: [na-adj-present, ta-form, n-desu], mode: build }
      - { kind: sentence, ja: "コーヒーを のみすぎたから ばんは ちゃを のむんだ。", en: "I drank too much coffee, so I drink tea in the evening", exercises: [sugiru, kara-because, n-desu], mode: build }
      # ── Three beats REPLACED 2026-07-27 (orchestrator, after the m26 QA
      #    finding of the same class). Each duplicated a beat the learner had
      #    already worked twice: 「さむく なったんだ。」 is neo-11's and review-3's,
      #    「この くつは たかすぎるから かわないんだ。」 is neo-7's and review-2's,
      #    「ばんに たべすぎたんだ。」 is neo-6's and review-2's. Grammar tags and
