    introduces: []
    beats:
      - { kind: sentence, ja: "ねつが あるから きょうは いかないんだ。", en: "I'm not going today, because I've got a fever", exercises: [n-desu, kara-because], mode: build }
      - { kind: sentence, ja: "びょうきだから びょういんに いくんだ。", en: "I'm going to the hospital because I'm ill", exercises: [kara-because, n-desu], mode: build }
      - { kind: sentence, ja: "さかなが すきなんだ。", en: "The thing is, I like fish", exercises: [desu-copula, suki-kirai-no], mode: listening }
      - { kind: sentence, ja: "この じゅぎょうは むずかしいんだ。", en: "The thing is, this class is difficult", exercises: [n-desu, wa-topic], mode: build }
      - { kind: sentence, ja: "おかねが ないから かわないんだ。", en: "I'm not buying it, because I haven't got the money", exercises: [kara-because, nai-existence], mode: build }
      # なんです was the third option here until 2026-07-27 QA caught it: this is
      # review-1, and んです/なんです do not debut until L5, which the course order
      # delivers AFTER it. A distractor is the worst possible debut — the learner
      # meets the form first as a wrong answer. だった is taught and wrong for a
      # better reason: it is the plain past, not an explanation.
      - { kind: particle-cloze, stem: "ぼくの かさ", tail: "。", answer: "なんだ", options: ["なんだ", "んだ", "だった"], en: "Say to a friend: It's my umbrella, you see", explanation: "かさ is a noun, so な comes first — and the cue says a friend, so the ending is だ. んだ leaves the noun with no copula, and だった only says the umbrella WAS mine: it reports, where なんだ explains." }
      - { kind: sentence, ja: "つくえが おおきいから へやが せまいんだ。", en: "The room is cramped because the desk is big", exercises: [kara-because, n-desu], mode: build }
      - { kind: listening-comp, audio: "あしたは やすみなんだ。", answer: "It's a holiday tomorrow, you see", distractors: ["It was a holiday yesterday, you see", "Tomorrow is a class, you see", "It isn't a holiday tomorrow"], exercises: [desu-copula, ni-time] }
