  - id: m27-neo-challenge
    role: challenge
    title: "Challenge — the reason, the excess and the change"
    focus: "End-of-module stretch: a change, why it happened and what it is too much of"
    introduces: []
    beats:
      - { kind: sentence, ja: "ふゆに なったから ふくを かうけど たかすぎるんです。", en: "Say politely: Winter's here, so I'm buying clothes, but they're too expensive", exercises: [ta-form, sugiru, masu-present, kedo], mode: build }
