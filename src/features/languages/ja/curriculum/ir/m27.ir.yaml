      - { kind: sentence, ja: "いもうとが だんだん おおきく なったんだ。", en: "The thing is, my little sister has gradually grown", exercises: [ta-form, ku-ni-naru], mode: translate }
      - { kind: particle-cloze, stem: "だんだん さむく なったから ふゆの ふくを ", tail: "。", answer: "かうんだ", options: ["かうんだ", "かわないんだ", "たべるんだ"], en: "It's gradually got cold, so I'm buying winter clothes", explanation: "cold weather is a reason to get winter clothes, so the main clause has to be the positive. かわないんだ turns the reason against itself and たべるんだ does nothing with clothes." }
      - { kind: listening-comp, audio: "この ふくは ながすぎるから かわないんだ。", answer: "I'm not buying these clothes, because they're too long", distractors: ["I'm buying these clothes, because they're long", "I'm not buying these clothes, because they're too short", "These clothes are too long, but I'm buying them"], exercises: [i-adj-present, sugiru] }
