      - { kind: sentence, ja: "としょかんは しずかすぎるから へやで はたらくんです。", en: "Say politely: The library is too quiet, so I work in my room", exercises: [i-adj-present, masu-present, kara-because], mode: build }
      - kind: dialogue
        lines:
