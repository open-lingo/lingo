  - id: m27-neo-11
    role: teaching
    title: "「さむく なったんだ」 — reporting what has changed"
    focus: "なった is the past of なる, and a change is usually news about the past"
    introduces: [なった]
    beats:
      - { kind: rule, grammarPointId: ta-form }
      - { kind: sentence, ja: "ふゆに なったから さむく なったんだ。", en: "Winter's here, so it's got cold — that's the thing", exercises: [ta-form, ku-ni-naru, kara-because], mode: build }
      - { kind: sentence, ja: "あには げんきに なった。", en: "My older brother has got better", exercises: [ta-form, na-adj-present, family-register], mode: build }
      - { kind: sentence, ja: "かみが ながく なったんです。", en: "Say politely: The thing is, the paper's got longer", exercises: [ta-form, masu-present, ku-ni-naru], mode: build }
      - { kind: sentence, ja: "あねは せんせいに なった。", en: "My older sister became a teacher", exercises: [ta-form, na-adj-present, family-register], mode: build }
      - { kind: sentence, ja: "ふゆに なったから さむすぎるんだ。", en: "Winter's here, so it's too cold — that's the thing", exercises: [ta-form, sugiru, n-desu], mode: listening }
      - { kind: sentence, ja: "だいがくが おおきく なったから としょかんも ひろく なった。", en: "The university has got bigger, so the library has got more spacious too", exercises: [ta-form, ku-ni-naru, mo-also], mode: build }
      - { kind: sentence, ja: "えいごが よく なったけど じゅぎょうは むずかしすぎるんだ。", en: "My English has got better, but the class is too difficult — that's the thing", exercises: [ta-form, ku-ni-naru, kedo], mode: build }
      - { kind: sentence, ja: "さむく なったんだ。", en: "The thing is, it's got cold", exercises: [ta-form, ku-ni-naru], mode: translate }
      - { kind: particle-cloze, stem: "はるに なったから あたたかく ", tail: "。", answer: "なった", options: ["なった", "なる", "だった"], en: "Spring is here, so it's got warm", explanation: "the から clause is already in the past, so the change it caused has happened too. なる would put the result in front of its own cause, and だった is the past of the copula rather than of なる." }
      - { kind: listening-comp, audio: "あねは いしゃに なった。", answer: "My older sister became a doctor", distractors: ["My older sister became a teacher", "My older brother became a doctor", "My older sister is going to become a doctor"], exercises: [ta-form, na-adj-present] }
      - { kind: listening-comp, audio: "えいごが よく なったんだ。", answer: "The thing is, my English has got better", distractors: ["The thing is, my English has got worse", "The thing is, the class has got better", "My English is going to get better"], exercises: [ta-form, ku-ni-naru] }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "あには もう げんきに なったんだ。", en: "My older brother's better now." }
          - { speaker: "Tom", ja: "よかった。くすりを のんだんだ？", en: "That's good. Did he take the medicine?" }
        questions:
          - { q: "What does Mika say about her older brother?", options: ["He's better now", "He's got ill", "He became a teacher", "He's going to the hospital"], answer: "He's better now" }
      - { kind: challenge, ja: "だんだん さむく なったから ふゆの ふくを かうけど たかすぎるんだ。", en: "It's gradually got cold, so I'm buying winter clothes, but they're too expensive", combines: [ta-form, ku-ni-naru, kara-because, kedo, sugiru], mode: build }
    reviewPool: [なった, なる, ながい, げんき, せんせい, かみ, ふゆ, はる, えいご, だいがく]

