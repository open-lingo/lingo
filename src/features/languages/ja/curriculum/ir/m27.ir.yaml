notes: |
  m27 = spine tile s23, "💡 Explaining: んだ/んです, すぎる, なる". The tile's own
  line, verbatim: "んだ/んです explanatory — one item, two skins; すぎる; く/になる
  change of state." RUN-PLAN-n4's coverage ledger, row 27, owes exactly three
  ids — `n-desu`, `sugiru`, `ku-ni-naru` — and all three are TAUGHT here, on
  L1's, L6's and L9's rule cards.

  **DO NOT READ THE ARCHIVED m27.** The old-course m27 was a different module
  entirely; anything about m27 in `docs/` that predates the rewrite, and
  everything in `curriculum/_archive/`, describes content that no longer
  exists — including `COMPLEXITY_FLOORS.m27`, recalibrated below (the fourth
  cycle running to hit this).

  THE WHOLE POINT — these three shapes are what turns a learner who can state
  facts into one who can EXPLAIN. Each attaches to something the learner
  already owns, and none of them touches the word in front of it.

  1. **んだ is a whole-sentence suffix, not a verb ending.** Say the plain
     sentence you would have said anyway and put んだ after it: いく → いくんだ,
     たかい → たかいんだ, いかない → いかないんだ, のんだ → のんだんだ. Nothing
     inflects. What changes is the JOB of the sentence: it stops being a fact
     and becomes the answer to "why?" — asked or unasked.
  2. **After a NOUN or a な-adjective the copula comes first, and in front of
     ん だ turns into な**: びょうきだ → びょうきなんだ. This is the one place a
     learner reliably slips, so it gets its own lesson (L2) and its own
     antiPattern (「びょうきんだ」).
  3. **んです is the SAME ITEM in the other skin** (the tile's "one item, two
     skins"). Only the final piece changes; the clause in front of ん stays
     PLAIN in both, which is why 「いきませんです」 is not a thing. L5 is the
     register lesson and every production prompt in it carries an explicit
     cue (inv 8), graded so the other register is never accepted (inv 48).
  4. **すぎる attaches to a STEM.** Verbs give it the ます-stem the learner met
     at m19's 〜に いく (たべ, のみ, はたらき); い-adjectives drop their い; a
     な-adjective gives up nothing at all. The result is a る-verb, so the past
     is すぎた and there is never a だ on the end.
  5. **なる takes く from an い-adjective and に from everything else**, and
     that is the entire rule. It is an ordinary verb, so なった is the past —
     and a change is usually reported in the past, which is why L11 exists.

  Shape: 13 lessons = 9 teaching + 3 review + 1 challenge, reviews at the
  first/middle/last thirds, challenge lesson LAST (inv 25). NO katakana rows
  (the programme ended at m11). NO `kind: register` beats — that machinery is
  m10 + m29 only (registerScaffoldIsolation); L5's polite production is an
  ORDINARY lesson with explicit "Say politely:" cues, which is what inv 8 asks
  for and what inv 48 then grades. NO kanji beats — kanji-set-3 is m28's row.

  DEVIATIONS + DECISIONS, documented per the RUN-PLAN "decide and document" rule:

  - **NO SPINE DEVIATION.** All three of tile s23's items ship, and the
    "one item, two skins" framing is honoured literally: L1/L2 teach the plain
    skin, L5 teaches the polite one as the SAME item rather than as a second
    grammar point, and both skins are drilled against each other in review-1,
    review-2, review-3 and the challenge.
  - **SIX POINTS ARE RE-TAUGHT rather than re-assigned, and ZERO ids are
    invented (inv 42).** The row owes three ids across nine teaching lessons.
    Every remaining card is a REGISTRY point re-taught inside the new frame:
    `desu-copula` (m3 — the copula is what the な in なんだ actually IS),
    `kara-because` (m16 — から gives the reason, んだ presents the sentence AS
    the reason, and the two stack), `masu-present` (m7 — the polite skin),
    `i-adj-present` (m12 — the い that drops before すぎる),
    `na-adj-present` (m12 — な-adjectives take に before なる and give up
    nothing before すぎる), and `ta-form` (m11 — なった, the tense a change is
    actually reported in). No ledger row moves: a re-teach is not a
    re-assignment (the m16 ruling; m20 and m26 made the same call).
    Asserted against the SHIPPED registry in `m27-neo.test.ts`, with a
    non-vacuity floor on the registry size — not against a hand-copied list.
  - **TWENTY-FIVE ATOMS ARE DECLARED AND `courseAtoms.ts` IS UNTOUCHED.** Ten
    are ordinary words that already carry a row under a stale old-course tag
    (どうして, おかね, かみ, つくえ, へや, ながい, みじかい, ひろい, せまい,
    おそい) and are declared here for PROVENANCE, the m15-m26 move. なる also
    has a row (`naru`, blocked) and is declared the same way. The other
    fourteen are DERIVED FORMS with no row and no need of one — the m11/m12/
    m13/m14/m16/m24 precedent, which registered 68 inflections in IR
    `newAtoms` alone precisely because registering inflections in courseAtoms
    regresses flashcard import and `annotateJapaneseText`.
  - **REGISTERING 「んだ」 IS THE ONE GENUINELY LOAD-BEARING TOKENIZER CHANGE
    HERE, AND IT WAS DUMPED BEFORE A SENTENCE WAS WRITTEN.** m18's note names
    the fault line exactly: 「いくんだ」 and 「ごはんだ」 look alike. They do not
    collide, because the tokenizer is longest-match-first and every noun
    ending in ん is itself a longer atom — probed and confirmed:
    「ごはんだ」 → ごはん · だ, 「にほんだ」 → にほん · だ, 「ぱんだ」 → ぱん · だ,
    while 「いくんだ」 → いく · んだ and 「さむいんだ」 → さむい · んだ. The
    change is also IR-LOCAL: `newAtoms` never reaches `courseAtoms`, so the
    whole-course tokenizer is byte-identical for m3-m26 and the m16-ので
    regression class cannot arise. It DOES reach m28/m29 through
    `compile-ir.mjs`'s `priorAtoms`, so: **m28/m29 authors must not write
    「なんですか」 meaning "what is it?" — it now tokenizes as なんです · か.**
    m27 writes it nowhere, and `m27-neo.test.ts` holds that line.
  - **「なんだ」 AND 「なんです」 ARE THEIR OWN ATOMS, and they have to be.**
    な is not an atom and なん IS one (❓ "what"), so without them
    「びょうきなんだ」 would tile びょうき · なん · だ — the question word
    "what" sitting inside a statement, credited to the wrong SRS item. With
    them registered it tiles びょうき · なんだ.
  - **THE すぎる ASYMMETRY IS FORCED BY THE LEXICONS, not chosen.** A verb's
    ます-stem is a real, shared surface: `moduleCompiler.STEMS` builds it from
    VERB_ENTRIES, m19 already tiles 「たべに いく」 as たべ · に · いく, and
    「たべすぎる」 therefore tiles as たべ · すぎる with すぎる registered. A
    BARE い-adjective stem (たか, さむ) is in no lexicon in this repo — STEMS
    stores only the く-form — so 「たかすぎる」 emitted the unknown fragment
    たか and tripped `unbuildable`. Registering bare stems would have put
    non-words on tiles and in pools (inv 41's class), so the seven adjective
    forms are registered WHOLE, exactly as m12 registered たかくない /
    たかかった whole. Consequence, stated plainly: a verb + すぎる is two
    tiles and an adjective + すぎる is one.
  - **FOUR VERB STEMS ARE BANNED and the probe is why.** 「かいすぎる」 tiles
    かい · すぎる and かい is the m1 atom 貝 "shell" (the same mis-credit that
    banned m19's 「かいに いく」); 「ききすぎる」 tiles き · き · すぎる, the
    stem き colliding with 木 "tree"; 「しすぎる」 tiles し · すぎる and し is
    4️⃣; 「はなしすぎる」 tiles はなし · すぎる and はなし is a registered NOUN
    ("talk, story"). The six verbs that survive are たべる, のむ, はたらく,
    あるく, およぐ, あそぶ. 「べんきょうしすぎる」 is banned twice over:
    べんきょう is untaught AND unbuildable (べん · きょう).
  - **「なくなる」 IS BANNED.** 「おかねが なく なる」 tiles おかね · が · なく ·
    なる and なく is the registered atom 鳴く ("to chirp / roar"). The module
    says 「おかねが ない」 instead, which is what it means anyway.
  - **つよい / よわい ARE BANNED FROM なる, and they were the first two words a
    change-of-state module reached for.** Neither is in ADJ_ENTRIES, so
    neither has a く-stem in STEMS: 「つよく なる」 tiles つ · よく · なる (よく
    "often" eating the く) and 「よわく なる」 tiles よわ · く · なる and trips
    `unbuildable`. They are reinforcement targets and they stay unspent. The
    same lexicon check struck 「たのしく なる」 and 「すずしく なる」 (たのしい
    and すずしい are absent from ADJ_ENTRIES) — おもしろく なる carries that
    beat instead. はやい stays banned for m20's course-wide reason
    (`JA_PRIMARY_ATOM_BY_KANA` resolves the bare kana to `hayai-early` 早い),
    and あつい for the same class (it resolves to 暑い "hot" while the
    courseAtoms gloss reads "kind, deep, thick"), so 「あつく なる」 — which a
    seasons module wants — is not taken.
  - **EIGHT OF THE CONTEXT PACK'S REINFORCEMENT TARGETS ARE SPENT BY BEING
    REGISTERED** — おかね, つくえ, かみ, おそい, ひろい, せまい, ながい,
    みじかい — which is the only way to spend them: like m26's five, they were
    unusable precisely because no neo module had taught them, whatever the
    pack says. **もの and はいる were already taught** (both are in m27's
    computed `priorVocab`), so the brief's two named under-exposed words are
    spent as ordinary carriers: もの carries 「たかい ものは かわないんだ」 and
    はいる carries 「だいがくに はいる」. はいる is used in the NON-PAST only —
    m23's finding that 「はいった」 fragments to はい · った stands.
  - **FOUR IMAGE DEBUTS, and every glyph was checked against the module's own
    pool** (the m19/m24/m26 shared-glyph ruling): おかね 💰 is unshared,
    かみ 📄 shares only with ページ (untaught, not in this module's pool),
    ひろい 🏜️ is unshared, おそい 🐢 shares only with ゆっくりと (same). Four
    words that COULD have had a picture do not: つくえ 🪑 shares with いす, a
    MET word; へや 🚪 shares with どあ / ドア / でる / はいる / いりぐち;
    ながい and みじかい are both 📏 and both debut in the same lesson, so
    neither can own the picture. せまい is declared at L3 rather than L9 for a
    different reason: 「へやが せまいんだ」 is L3's headline から-sentence, so
    that is where the word is first USED, and an `introduces` list that
    disagrees with the sentences is a lie no compiler gate can see. なる keeps `imageable: false` for two
    reasons at once — its courseAtoms row is `blocked` ("cycle reads as
    'refresh' not 'become'"), and L9's card must NAME it.
  - **THE RULE CARD OF A LESSON THAT DEBUTS AN IMAGEABLE WORD NEVER NAMES IT**
    (the m14 trap: a `kind: rule` beat compiles to a PINNED step ahead of the
    interleaved middle and would steal the debut). L2's card avoids おかね,
    L3's avoids かみ, L9's avoids ひろい and おそい.
  - **NO PARTICLE_CLOZE ON A PARTICLE (inv 5).** m27 introduces no particle, so
    a true particle cloze would be a REVIEW use of the type. Every cloze here
    picks among CONTENT words and predicate FORMS (んだ / なんだ / だった,
    のみすぎた / のみすぎる / たべすぎた, なる / ある / はいる), and every option
    is a taught atom or a taught atom plus a taught ending (inv 40). No cloze
    frame names a character (the frames are harvested into the grammar-review
    deck, whose comprehensibility gate resolves words through `courseAtoms`
    and ミカ / トム / ケン / たなか have no rows — m22's finding) and none ends
    on a bare だ (m21's finding).
  - **NO BOUND ENDER IS A PRODUCTION TARGET.** Six of this module's atoms
    cannot stand alone as an utterance — んだ, んです, なんだ, なんです, すぎる,
    すぎた — so all six are added to `moduleCompiler.BOUND` (which filters the
    filler generator's pools) and to `BOUND_ENDERS` in
    `boundEnderProduction.test.ts` (the course-wide ratchet). This is the
    つもり / ましょう lesson applied BEFORE the defect ships rather than after.
    They are also kept out of every `reviewPool`, belt and braces. なる /
    なった / the すぎる composites are NOT bound: 「なった」 and 「たかすぎる」 are
    complete utterances.
  - **なった DEBUTS AT L11, NOT L10, and L10 is non-past throughout** — its
    card, its beats, its cloze options and its dialogue. An atom that first
    reaches the learner as a cloze DISTRACTOR is a bare debut in the one place
    vocab-provenance calls out by name, so L9's cloze offers なる / ある /
    はいる rather than なる / なった.
  - **Clause boundaries are SPACES, never 、** — `moduleCompiler.clean()`
    strips 、 with nothing in its place, so an authored comma compiles to a
    run-on build target AND a run-on TTS key.
  - **Gloss discipline (inv 17).** んだ is "the thing is …" / "… you see" /
    "it's because …" — never a bare restatement, because then the step is
    teaching nothing. すぎる is "too ~", never "very ~" (that is とても /
    ちょっと, a different claim). なる is "become / get / turn"; 「さむく なる」
    is "it gets cold" or "it'll get cold", and the RESULT reading 「さむく
    なった」 is "it's got cold". Plain non-past activity verbs gloss habitual
    or intent; only いく / くる / かえる keep the futurate "-ing".
  - **CARRIER ROTATION (inv 27).** The nine carriers the exposure audit names
    as worst over-used — みせ, ともだち, ほん, ごはん, いる, きのう, あたらしい,
    えき, かばん — carry NO sentence in this module, and neither do the five
    m26 added from the same audit (みず, かった, うみ, いたい, でんしゃ). いたい
    is the painful one here: 「あたまが いたいんだ」 is the textbook explanatory
    sentence and an explaining module reaches for it by reflex. ねつ / のど /
    びょうき / いそがしい / じかんが ない carry the reasons instead.
  - **Persona canon.** Tom = student, American, Mika's friend; Mika = student,
    Japanese; Ken = student, Japanese; Tanaka = the teacher. No 「NAMEは NOUNだ」
    assertion appears anywhere: the module explains states and changes, never
    roles. たなか appears only in the polite classroom dialogues (L5 and the
    challenge), and 「せんせいに なる」 / 「いしゃに なる」 are always said of a
    family member, never of a named character.
  - **CONNECTIVES + COMPLEXITY (inv 13).** An explanation is a reason plus a
    consequence by construction, so most production beats hang a から / けど on
    m16's connectives — which is also how an explanation is actually spoken.
    `COMPLEXITY_FLOORS.m27` was measured on the ARCHIVED module and is
    recalibrated in `moduleContentLints.ts` — RAISED, never lowered, per that
    block's own rule.

  ONE RULE CARD PER LESSON (m14's layout law): every teaching lesson carries
  exactly one, because two `kind: rule` beats compile to two PINNED, ADJACENT
  grammar_rule steps and fail the adjacency bar.

  NO CONJUGATION RAMPS. `conjugationTransform` runs on `conjugateVerb` /
  `conjugateIAdj`, and neither engine has a `sugiru` or a `naru` cell — there
  is no ChainForm/IAdjForm to name — so no `conjugation:` block is declared and
  no `verbClass` is set on any atom. The derivations are taught on the cards
  and drilled in builds instead.

grammarPoints:
  - id: n-desu
    rule: "There is a difference between stating a fact and explaining yourself, and Japanese marks it with two characters on the end. 「ねつが ある」 is a fact: I have a fever. 「ねつが あるんだ」 is the same fact offered as the REASON for something — why I am not coming, why I look like this, why you found me at home. Nothing about the sentence changes except that ending. Take the plain sentence you would have said anyway and put んだ on it: いく becomes いくんだ, たかい becomes たかいんだ. The negative and the past come along untouched — いかないんだ, のんだんだ — because んだ attaches to the finished sentence, not to the verb. That is the whole formation, and it is why this is easier than it looks. What takes practice is knowing WHEN. Use んだ when the sentence answers a question, asked or unasked: someone looks at your face and you say 「びょうきなんだ」; someone asks where you are going and you say 「びょういんに いくんだ」. Do not use it to announce a fact out of nowhere — 「あめが ふるんだ」 said to a stranger with no context sounds like the end of an argument nobody started. And one warning worth having early: a verb or an い-adjective takes ん and then だ. Never だ on its own."
    examples:
      - { ja: "ねつが あるんだ。", en: "The thing is, I've got a fever." }
      - { ja: "きょうは いかないんだ。", en: "I'm not going today, you see." }
      - { ja: "この じゅぎょうは むずかしいんだ。", en: "The thing is, this class is difficult." }
      - { ja: "あしたは いそがしいんだ。", en: "It's because I'm busy tomorrow." }
      - { ja: "どうして いかないんだ？", en: "Why aren't you going?" }
    antiPattern: { ja: "ねつが あるだ。", why: "a verb takes ん before だ — だ on its own finishes a NOUN and can never sit on a verb: ねつが あるんだ。" }

  - id: desu-copula
    rule: "When the thing you are explaining ends in a NOUN or a な-adjective, one small piece appears that catches everybody out. A noun sentence needs its copula — 「びょうきだ」, not 「びょうき」 — and in front of ん that copula changes shape: だ becomes な. So 「びょうきだ」 explaining itself is 「びょうきなんだ」. The だ has not disappeared and it has not doubled; it has changed clothes. な-adjectives behave identically, because they are nouns wearing a hat: しずかだ becomes しずかなんだ, すきだ becomes すきなんだ. And nouns of every kind take it — 「ぼくの かさなんだ」, it's my umbrella; 「あしたは やすみなんだ」, tomorrow is a holiday. Now the trap, and it is worth saying out loud. い-adjectives do NOT take な. たかい is already a whole predicate with no copula in it, so it goes straight to んだ: 「たかいんだ」, never 「たかいなんだ」. The rule of thumb is short: if you would have said だ, say な instead. If you would not have, do not add one."
    examples:
      - { ja: "びょうきなんだ。", en: "The thing is, I'm ill." }
      - { ja: "ぼくの かさなんだ。", en: "It's my umbrella, you see." }
      - { ja: "としょかんは しずかなんだ。", en: "It's because the library is quiet." }
      - { ja: "さかなが すきなんだ。", en: "The thing is, I like fish." }
      - { ja: "あしたは やすみなんだ。", en: "It's a holiday tomorrow, you see." }
    antiPattern: { ja: "びょうきんだ。", why: "a noun still needs its copula before ん, and in front of ん だ becomes な: びょうきなんだ。" }

  - id: kara-because
    rule: "から and んだ do two different jobs, and once you see the difference you will use them together constantly. から gives the reason INSIDE the sentence: 「ねつが あるから いかない」 — I have a fever, so I'm not going. んだ presents the WHOLE sentence as an explanation of something outside it. Put both in and you get the shape people actually use: 「ねつが あるから いかないんだ」. The から clause says why I'm not going; the んだ says that this is the answer to the question you were about to ask. Note where the んだ sits — on the very end, after the main clause. It never lands on the から clause in the middle. Asking is the mirror image. Put どうして at the front and keep the んだ at the back: 「どうして たべないんだ？」 That ん is what makes the question sound curious instead of blunt — a bare 「どうして たべない？」 can land like an accusation, while 「どうして たべないんだ？」 asks for the story. The answer comes straight back in the same shape, and the shortest useful answer of all is a reason with んだ on it: 「びょうきなんだ」. Three words come along to give you something to explain: へや a room, つくえ a desk, and せまい narrow, cramped — 「つくえが おおきいから へやが せまいんだ」, the desk is big, so the room is cramped."
    examples:
      - { ja: "ねつが あるから いかないんだ。", en: "I'm not going, because I've got a fever." }
      - { ja: "どうして たべないんだ？", en: "Why aren't you eating?" }
      - { ja: "びょうきだから びょういんに いくんだ。", en: "I'm going to the hospital because I'm ill." }
      - { ja: "おかねが ないから かわないんだ。", en: "I'm not buying it, because I haven't got the money." }
      - { ja: "どうして この くつを かうんだ？", en: "Why are you buying these shoes?" }
    antiPattern: { ja: "ねつが あるからんだ いかない。", why: "んだ goes on the END of the whole sentence, never on the から clause in the middle: ねつが あるから いかないんだ。" }

  - id: masu-present
    rule: "んだ and んです are ONE item in two skins. Same job, same attachment point, same な after a noun — only the last piece changes. 「いかないんだ」 to a friend; 「いかないんです」 to a teacher, a shop assistant, a doctor. Everything you learned in the last four lessons transfers whole. There are two things to get right and beginners drop one of them every time. First: the clause in FRONT of ん stays PLAIN in both skins. It is 「いかないんです」, never 「いきませんです」 — the politeness is carried once, on the very end, and the ます-form has no business in front of ん. Second: a polite QUESTION still needs か. 「どうして いかないんですか。」 Leave the か off and you have made a polite statement and left it hanging; leave the です off and you have asked a friend, not a stranger. A casual question needs neither, because its rising contour does the work: 「どうして いかない？」 The noun rule survives the change of skin intact: 「びょうきです」 explaining itself is 「びょうきなんです」, with the same な that 「びょうきなんだ」 has. This is the skin you want whenever you are explaining yourself to somebody you owe politeness to, which — outside your own friends — is nearly everybody."
    examples:
      - { ja: "どうして いかないんですか。", en: "Why aren't you going?" }
      - { ja: "ねつが あるんです。", en: "I've got a fever, you see." }
      - { ja: "びょうきなんです。", en: "The thing is, I'm ill." }
      - { ja: "きょうは じかんが ないんです。", en: "The thing is, I haven't got time today." }
      - { ja: "どうして いかないんだ？", en: "Why aren't you going? — the same question, said to a friend" }
    antiPattern: { ja: "どうして いかないんです。", why: "a polite QUESTION requires か — without it the sentence is a statement, and an unfinished one: どうして いかないんですか。" }

  - id: sugiru
    rule: "すぎる says that something went PAST the point where it should have stopped. Not a lot of it — too much of it. To build it, cut the verb back to the piece that sits in front of ます and put すぎる there instead: たべる gives たべ, のむ gives のみ, はたらく gives はたらき, あるく gives あるき. 「たべすぎる」 is eat too much. You have met that piece before: it is the same stem that carried 「たべに いく」 back in module 19, so finding it is not a new skill. すぎる is itself an ordinary る-verb, which means everything you know about る-verbs applies. The past is すぎた, and that is the form you will use most — too much is nearly always something you notice afterwards: 「たべすぎた」, I ate too much. Hang んだ on it and you have an apology ready-made: 「たべすぎたんだ」. One thing すぎる is not: it is not ちょっと and it is not よく. 「よく たべる」 says you eat a lot and means it kindly; 「たべすぎる」 says you eat more than you should and carries the regret with it. And すぎる never stands alone — there is always a stem in front of it, because on its own it names nothing."
    examples:
      - { ja: "たべすぎたんだ。", en: "The thing is, I ate too much." }
      - { ja: "コーヒーを のみすぎた。", en: "I drank too much coffee." }
      - { ja: "あには はたらきすぎるから いつも いそがしい。", en: "My older brother works too much, so he's always busy." }
      - { ja: "なつやすみに あそびすぎた。", en: "I played too much over the summer holidays." }
      - { ja: "あるきすぎたから きょうは いかないんだ。", en: "I walked too much, so I'm not going today." }
    antiPattern: { ja: "たべるすぎたんだ。", why: "すぎる attaches to the STEM — the piece that sits in front of ます — never to the whole dictionary form: たべすぎたんだ。" }

  - id: i-adj-present
    rule: "An adjective joins すぎる exactly the way a verb does: cut off the piece that ends it, and put すぎる there. For an い-adjective the piece to cut is the い. たかい gives たかすぎる, おおきい gives おおきすぎる, さむい gives さむすぎる, むずかしい gives むずかしすぎる. For a な-adjective there is nothing to cut at all, because it never had an ending — しずか goes straight to しずかすぎる. Now the part that surprises people. What comes out is a VERB, not an adjective. That means it never takes だ: 「たかすぎるだ」 is wrong for the same reason 「たべるだ」 was wrong in module 5. It also means it takes んだ directly, with no な in between: 「むずかしすぎるんだ」. 「たかすぎる」 is the single most useful sentence in a shop, and it says something 「よく たかい」 could never say. A price you merely dislike is たかい. たかすぎる is a decision about the purchase: too expensive FOR WHAT YOU WANTED TO DO. That is why すぎる so often comes with a から clause hanging off it — too expensive, so I'm not buying it."
    examples:
      - { ja: "この くつは たかすぎる。", en: "These shoes are too expensive." }
      - { ja: "この ぼうしは おおきすぎる。", en: "This hat is too big." }
      - { ja: "ふゆは さむすぎるから やまに いかない。", en: "Winter is too cold, so I don't go to the mountains." }
      - { ja: "この じゅぎょうは むずかしすぎるんだ。", en: "The thing is, this class is too difficult." }
      - { ja: "としょかんは しずかすぎる。", en: "The library is too quiet." }
    antiPattern: { ja: "この くつは たかいすぎる。", why: "an い-adjective drops its い before すぎる — the whole dictionary form never goes in front of it: この くつは たかすぎる。" }

  - id: ku-ni-naru
    rule: "なる is become, and everything interesting about it is in the piece that comes just before. For an い-adjective, swap the final い for く and put なる after it: さむい gives さむく なる, it gets cold. You have seen that く before — it is the shape an い-adjective takes whenever something follows it, which is why the negative was さむくない back in module 12. Nothing else changes, and the adjective itself is never touched again. What the sentence describes is a CHANGE, and that is the whole reason to reach for it. 「かみが みじかい」 says the paper is short. 「かみが みじかく なる」 says it is GETTING short — a different claim, and usually the more interesting one. Its opposite works the same way: ながい is long, so 「かみが ながく なる」 is the paper is getting longer. Put だんだん in front when the change is gradual: 「だんだん さむく なる」. なる is an ordinary verb, so it does everything ordinary verbs do — んだ on the end to explain yourself, から to hang a consequence off it, けど to concede one. And いい is irregular here in exactly the way it was irregular in module 12: its く-form is よく, never いく, so get better is 「よく なる」."
    examples:
      - { ja: "だんだん さむく なる。", en: "It gradually gets colder." }
      - { ja: "かみが ながく なる。", en: "The paper gets longer." }
      - { ja: "えいごが よく なる。", en: "My English gets better." }
      - { ja: "じゅぎょうが むずかしく なるから いそがしいんだ。", en: "The classes get harder, so I'm busy." }
      - { ja: "だんだん あたたかく なる。", en: "It gradually gets warmer." }
    antiPattern: { ja: "だんだん さむい なる。", why: "an い-adjective swaps its い for く in front of なる — the dictionary form never sits there: だんだん さむく なる。" }

  - id: na-adj-present
    rule: "な-adjectives and NOUNS take に in front of なる, and that is the entire difference. げんきだ gives げんきに なる, しずかだ gives しずかに なる, いしゃだ gives いしゃに なる. Think of it as one slot with two fillers: く for い-adjectives, に for everything else. There is no だ anywhere in the result, because the に is already doing that work. The noun case is how Japanese says what somebody becomes, and it is worth practising on its own: 「いしゃに なる」, become a doctor; 「せんせいに なる」, become a teacher. English hides a verb in there — become, turn into, get to be — and Japanese does not: the noun, に, なる, done. Time words take it too. 「なつに なる」 is summer comes; 「はるに なる」 is spring arrives. That is why a weather forecast will say 「あたたかく なる」 for the temperature and 「はるに なる」 for the season in the same breath — two fillers, one slot. And because すき and きらい are な-adjectives, a change of taste rides the same frame: 「さかなが すきに なる」, to come to like fish."
    examples:
      - { ja: "げんきに なる。", en: "I'll get better." }
      - { ja: "あねは いしゃに なる。", en: "My older sister is going to become a doctor." }
      - { ja: "なつに なるから やまに いく。", en: "Summer is coming, so I'm going to the mountains." }
      - { ja: "ばんは がっこうが しずかに なるんだ。", en: "The thing is, the school goes quiet in the evening." }
      - { ja: "さかなが すきに なる。", en: "I'm coming to like fish." }
    antiPattern: { ja: "げんきく なる。", why: "な-adjectives and nouns take に in front of なる, never く — く belongs to い-adjectives: げんきに なる。" }

  - id: ta-form
    rule: "The past of なる is なった, and it is the form a change is usually reported in — because a change is something you notice after it has already happened. 「さむく なった」 is it's got cold. 「げんきに なった」 is he's better now. English often reaches for a present tense here (it IS cold now, he IS well now) and Japanese reaches for the past, because the news is the change rather than the state. Pair it with んだ and you have the most useful sentence shape in this module: 「かみが ながく なったんだ」, the thing is, the paper's got longer. Note what な does and does not do. なった is a VERB, so it takes ん straight after it — なったんだ, never なったなんだ. The な in なんだ only ever follows a noun or a な-adjective, and なった is neither. Two more things worth keeping straight. なった is the past of なる and not of ある: 「あった」 is a different verb with a different job. And a から clause in front of it puts the whole change in the past too — 「ふゆに なったから さむく なった」 — which is how you tell somebody what has changed and why, in one breath."
    examples:
      - { ja: "さむく なったんだ。", en: "The thing is, it's got cold." }
      - { ja: "あには げんきに なった。", en: "My older brother has got better." }
      - { ja: "ふゆに なったから さむすぎるんだ。", en: "Winter's here, so it's too cold — that's the thing." }
      - { ja: "かみが ながく なったんです。", en: "The thing is, the paper's got longer." }
      - { ja: "あねは せんせいに なった。", en: "My older sister became a teacher." }
    antiPattern: { ja: "さむく なったなんだ。", why: "なった is a verb, so it takes ん straight after it — な belongs only after a noun or a な-adjective: さむく なったんだ。" }

newAtoms:
  # ══ L1. THE HEADLINE, and the one genuinely load-bearing tokenizer entry in
  #    this module (see the notes block: 「ごはんだ」 → ごはん · だ, unharmed,
  #    because longest-match runs first). IR-LOCAL — no courseAtoms row, the
  #    m11/m12/m13/m14/m16/m24 precedent for derived forms. A BOUND ender:
  #    added to moduleCompiler.BOUND and boundEnderProduction's BOUND_ENDERS,
  #    and kept out of every reviewPool.
  - { kana: んだ, romaji: "n da", gloss: "the thing is … (explanatory, plain)", shortGloss: "…you see", imageable: false, kind: vocab }
  # ══ L1. どうして has a courseAtoms row under a stale tag — PROVENANCE only.
  #    なんで is deliberately NOT registered: two words for "why" in one module
  #    is a vocabulary table, and どうして works in both registers.
  - { kana: どうして, romaji: doushite, gloss: "why", shortGloss: "why", imageable: false, kind: vocab }
  # ══ L2. Its own atom BY NECESSITY: な is not an atom and なん IS one (❓
  #    "what"), so without this row 「びょうきなんだ」 would tile
  #    びょうき · なん · だ and credit the question word. Bound.
  - { kana: なんだ, romaji: "na n da", gloss: "the thing is … (after a noun or な-adjective)", shortGloss: "…you see", imageable: false, kind: vocab }
  # ══ L2. 💰 is unshared in the registry. Stale tag, absent from every neo
  #    module's priorVocab — a context-pack reinforcement target (CEJC #239,
  #    seen ~1×) spent by REGISTERING it, the only way to spend one.
  - { kana: おかね, romaji: okane, gloss: "money", shortGloss: "money", kind: vocab }
  # ══ L3. 📄 shares only with ページ, which is untaught and not in this
  #    module's pool, so the picture names the answer better than any
  #    distractor it can draw.
  - { kana: かみ, romaji: kami, gloss: "paper", shortGloss: "paper", kind: vocab }
  # ══ L3. 🪑 is いす's glyph and いす is MET, so no picture (the m19/m24/m26
  #    shared-glyph ruling). Reinforcement target, seen ~1×.
  - { kana: つくえ, romaji: tsukue, gloss: "desk", shortGloss: "desk", imageable: false, kind: vocab }
  # ══ L3. 🚪 is shared five ways (どあ / ドア / でる / はいる / いりぐち), so no
  #    picture. Registered because ひろい / せまい / しずかすぎる all want a room
  #    and every alternative carrier was either fatigued or untaught.
  - { kana: へや, romaji: heya, gloss: "room", shortGloss: "room", imageable: false, kind: vocab }
  # ══ L5. The polite skins. Same necessity as なんだ, same BOUND treatment.
  - { kana: んです, romaji: "n desu", gloss: "the thing is … (explanatory, polite)", shortGloss: "…you see", imageable: false, kind: vocab }
  - { kana: なんです, romaji: "na n desu", gloss: "the thing is … (after a noun, polite)", shortGloss: "…you see", imageable: false, kind: vocab }
  # ══ L6. 「たべ」+「すぎる」 is two tiles because the ます-stem is already in
  #    moduleCompiler.STEMS (m19's 〜に いく built it). Bound: すぎる names
  #    nothing on its own.
  - { kana: すぎる, romaji: sugiru, gloss: "too much (on a stem)", shortGloss: "too much", imageable: false, kind: vocab }
  - { kana: すぎた, romaji: sugita, gloss: "too much (past, on a stem)", shortGloss: "too much", imageable: false, kind: vocab }
  # ══ L7. WHOLE, not stem + すぎる, because a bare い-adjective stem (たか, さむ)
  #    is in no lexicon in this repo — 「たかすぎる」 emitted the unknown fragment
  #    たか and tripped `unbuildable`. m12 registered たかくない / たかかった whole
  #    for the same reason. These are complete utterances, so NOT bound.
  - { kana: たかすぎる, romaji: takasugiru, gloss: "too expensive, too tall", shortGloss: "too pricey", imageable: false, kind: vocab }
  - { kana: おおきすぎる, romaji: ookisugiru, gloss: "too big", shortGloss: "too big", imageable: false, kind: vocab }
  - { kana: ちいさすぎる, romaji: chiisasugiru, gloss: "too small", shortGloss: "too small", imageable: false, kind: vocab }
  - { kana: さむすぎる, romaji: samusugiru, gloss: "too cold", shortGloss: "too cold", imageable: false, kind: vocab }
  - { kana: むずかしすぎる, romaji: muzukashisugiru, gloss: "too difficult", shortGloss: "too hard", imageable: false, kind: vocab }
  - { kana: しずかすぎる, romaji: shizukasugiru, gloss: "too quiet", shortGloss: "too quiet", imageable: false, kind: vocab }
  - { kana: ながすぎる, romaji: nagasugiru, gloss: "too long", shortGloss: "too long", imageable: false, kind: vocab }
  # ══ L9. なる HAS a courseAtoms row (`naru`) — PROVENANCE only. imageable:
  #    false twice over: the row is `blocked` ("cycle reads as 'refresh' not
  #    'become'") and L9's card must NAME it.
  - { kana: なる, romaji: naru, gloss: "to become, to get", shortGloss: "become", imageable: false, kind: vocab }
  # ══ L9. ながい and みじかい are BOTH 📏 in the registry and both debut in this
  #    lesson, so neither can own the picture. Both are reinforcement targets
  #    (seen ~2×) spent by registration.
  - { kana: ながい, romaji: nagai, gloss: "long", shortGloss: "long", imageable: false, kind: vocab }
  - { kana: みじかい, romaji: mijikai, gloss: "short (in length)", shortGloss: "short", imageable: false, kind: vocab }
  # ══ L9. 🏜️ is unshared, so ひろい debuts on a picture.
  - { kana: ひろい, romaji: hiroi, gloss: "spacious, wide", shortGloss: "spacious", kind: vocab }
  # ══ L3, NOT L9 — 「つくえが おおきいから へやが せまいんだ」 is L3's headline
  #    from-because sentence, so that is where せまい is first USED and
  #    therefore where it is declared (the guards read first-use, and an
  #    `introduces` that disagrees with the sentences is a lie the compiler
  #    cannot see). ↔️ is よこ's glyph as much as せまい's and "narrow" is not
  #    what ↔️ says, so it debuts on the build rather than on a picture.
  - { kana: せまい, romaji: semai, gloss: "narrow, cramped", shortGloss: "narrow", imageable: false, kind: vocab }
  # ══ L9. 🐢 shares only with ゆっくりと, which is untaught and not in this
  #    module's pool. Reinforcement target, CEJC #509, seen ~1×.
  - { kana: おそい, romaji: osoi, gloss: "late, slow", shortGloss: "slow", kind: vocab }
  # ══ L11. The past of なる, and the tense a change is actually reported in.
  #    IR-local; 「なった」 is a complete utterance, so not bound. It debuts HERE
  #    and not at L10 — an atom whose first appearance is a cloze distractor is
  #    the bare debut vocab-provenance exists to catch.
  - { kana: なった, romaji: natta, gloss: "became, got (become, past)", shortGloss: "became", imageable: false, kind: vocab }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m27-neo-1
    role: teaching
    title: "「ねつが あるんだ」 — saying it as an explanation"
    focus: "んだ goes on the finished plain sentence and changes its job, not its verb"
    introduces: [んだ, どうして]
    beats:
      - { kind: rule, grammarPointId: n-desu }
      - { kind: sentence, ja: "ねつが あるから きょうは いかないんだ。", en: "I'm not going today, because I've got a fever", exercises: [n-desu, kara-because, nai-form], mode: build }
      - { kind: sentence, ja: "この じゅぎょうは むずかしいんだ。", en: "The thing is, this class is difficult", exercises: [n-desu, wa-topic, i-adj-present], mode: build }
      - { kind: sentence, ja: "あしたは いそがしいんだ。", en: "It's because I'm busy tomorrow", exercises: [n-desu, wa-topic, ni-time], mode: build }
      - { kind: sentence, ja: "どうして たべないんだ？", en: "Why aren't you eating", exercises: [n-desu, dare, nai-form], mode: build }
      - { kind: sentence, ja: "くすりを のむんだ。", en: "It's because I'm taking medicine", exercises: [n-desu, wo-object, dictionary-form], mode: listening }
      - { kind: sentence, ja: "じかんが ないから ちゃを のまないんだ。", en: "I'm not drinking tea, because I haven't got time", exercises: [n-desu, kara-because, nai-existence], mode: build }
      - { kind: sentence, ja: "コーヒーを のんだんだ。", en: "The thing is, I drank the coffee", exercises: [n-desu, ta-form, wo-object], mode: build }
      - { kind: sentence, ja: "ねつが あるんだ。", en: "The thing is, I've got a fever", exercises: [n-desu], mode: translate }
      - { kind: particle-cloze, stem: "ねつが ある", tail: "。", answer: "んだ", options: ["んだ", "だ", "です"], en: "The thing is, I've got a fever", explanation: "ある is a verb, so it takes ん and then だ. Bare だ finishes a NOUN and can never sit on a verb, and です cannot sit on a plain verb either — 「あるです」 is not Japanese. The noun version, なんだ, is the next lesson's job." }
      - { kind: listening-comp, audio: "あしたは いそがしいから いかないんだ。", answer: "I'm not going, because I'm busy tomorrow", distractors: ["I'm going, because I'm free tomorrow", "I'm busy tomorrow, but I'm going", "I'm not going, because I've got a fever"], exercises: [n-desu, kara-because] }
      - { kind: listening-comp, audio: "じかんが あるから コーヒーを のむんだ。", answer: "I drink coffee, because I've got time", distractors: ["I don't drink coffee, because I haven't got time", "I drink tea, because I've got time", "I've got time, but I don't drink coffee"], exercises: [n-desu, kara-because] }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "どうして きょう だいがくに いかないんだ？", en: "Why aren't you going to the university today?" }
          - { speaker: "Tom", ja: "ねつが あるんだ。びょういんに いく。", en: "I've got a fever. I'm going to the hospital." }
        questions:
          - { q: "Where does Tom say he is going?", options: ["To the hospital", "To the university", "To the library", "To the airport"], answer: "To the hospital" }
      - { kind: challenge, ja: "びょうきだから くすりを のんだけど まだ ねつが あるんだ。", en: "I took medicine because I'm ill, but I've still got a fever", combines: [n-desu, kara-because, kedo, ta-form, mada-mou], mode: build }
    reviewPool: [どうして, ねつ, のど, くすり, じゅぎょう, ちゃ, コーヒー, びょういん, だいがく, いそがしい]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m27-neo-2
    role: teaching
    title: "「びょうきなんだ」 — nouns put な in first"
    focus: "In front of ん the copula だ becomes な; い-adjectives never take one"
    introduces: [なんだ, おかね]
    beats:
      - { kind: rule, grammarPointId: desu-copula }
      - { kind: sentence, ja: "きょうは いかない。びょうきなんだ。", en: "I'm not going today — the thing is, I'm ill", exercises: [desu-copula, n-desu, nai-form], mode: build }
      - { kind: sentence, ja: "この かさは ぼくの かさなんだ。", en: "This umbrella is my umbrella, you see", exercises: [desu-copula, no-possession, wa-topic], mode: build }
      - { kind: sentence, ja: "としょかんに いく。としょかんは しずかなんだ。", en: "I'm going to the library — the thing is, the library is quiet", exercises: [desu-copula, ni-location, na-adj-present], mode: build }
      - { kind: sentence, ja: "さかなが すきなんだ。", en: "The thing is, I like fish", exercises: [desu-copula, suki-kirai-no, ga-existence], mode: build }
      - { kind: sentence, ja: "あしたは やすみなんだ。", en: "It's a holiday tomorrow, you see", exercises: [desu-copula, wa-topic, ni-time], mode: listening }
      - { kind: sentence, ja: "おかねが ないから かわないんだ。", en: "I'm not buying it, because I haven't got the money", exercises: [desu-copula, kara-because, nai-existence], mode: build }
      - { kind: sentence, ja: "この とけいは たかいんだ。あにの とけいなんだ。", en: "This watch is expensive — it's my older brother's watch, you see", exercises: [desu-copula, n-desu, no-possession], mode: build }
      - { kind: sentence, ja: "びょうきなんだ。", en: "The thing is, I'm ill", exercises: [desu-copula], mode: translate }
      - { kind: particle-cloze, stem: "あしたは やすみ", tail: "。", answer: "なんだ", options: ["なんだ", "んだ", "だった"], en: "It's a holiday tomorrow, you see", explanation: "やすみ is a noun, so its copula comes first and turns into な. んだ would leave the noun with no copula at all, and だった puts a holiday that has not happened yet into the past." }
      - { kind: listening-comp, audio: "おかねが あるから とけいを かうんだ。", answer: "I'm buying a watch, because I've got the money", distractors: ["I'm not buying a watch, because I haven't got the money", "I'm buying glasses, because I've got the money", "I've got the money, but I'm not buying a watch"], exercises: [desu-copula, kara-because] }
      - { kind: listening-comp, audio: "あしたは やすみだから としょかんに いくんだ。", answer: "I'm going to the library, because tomorrow is a holiday", distractors: ["I'm not going to the library, because tomorrow is a holiday", "I'm going to the hospital, because tomorrow is a holiday", "Tomorrow is a holiday, but I'm not going to the library"], exercises: [desu-copula, kara-because] }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "どうして この めがねを かわないんだ？", en: "Why aren't you buying these glasses?" }
          - { speaker: "Mika", ja: "おかねが ないんだ。この めがねは あねの めがねなんだ。", en: "I haven't got the money. And these glasses are my older sister's." }
        questions:
          - { q: "Whose glasses does Mika say these are?", options: ["Her older sister's", "Her own", "Her older brother's", "She doesn't say"], answer: "Her older sister's" }
