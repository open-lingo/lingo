      - { kind: sentence, ja: "ねつが あるんだ。", en: "The thing is, I've got a fever", exercises: [n-desu], mode: translate }
      - { kind: listening-comp, audio: "この かみは ふるいから みないんだ。", answer: "I don't look at this paper because it's old", distractors: ["I look at this paper because it's old", "I don't look at this photo because it's old", "This paper is old, but I look at it"], exercises: [kara-because, n-desu] }
      - { kind: sentence, ja: "この かさは ぼくの かさなんだ。", en: "This umbrella is my umbrella, you see", exercises: [desu-copula, no-possession], mode: build }
      - { kind: sentence, ja: "じかんが ないから としょかんに いかないんだ。", en: "I'm not going to the library, because I haven't got time", exercises: [kara-because, nai-existence], mode: build }
      - kind: dialogue
