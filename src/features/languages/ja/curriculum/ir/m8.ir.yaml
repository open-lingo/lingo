      - { kind: sentence, ja: "みせは あそこに ありますか。", en: "Say politely: Is the shop over there", exercises: [wa-topic, koko-soko-asoko, ni-location, ka-question], mode: listening }
      - { kind: sentence, ja: "ミカの ちゃを のまないで。", en: "Don't drink Mika's tea", exercises: [no-possession, wo-object, nai-form], mode: build }
      - kind: dialogue
        lines:
          - { speaker: "トム", ja: "たなかさん、たべものを かってください。", en: "Tanaka, please buy some food." }
