module: m8
title: "Asking for things: て-form and ください"
register: plain
priorNeoModules: [m3, m4, m5, m6, m7]

priorGrammarPoints: [wa-topic, ga-existence, wo-object, no-possession, ni-location, de-action, mo-also, dare, kore-sore-are-dore, kore-sore-are-dore,
                     nai-form, nai-form, nai-form, arimasu, imasu,
                     nai-existence, koko-soko-asoko, ni-location, spatial-relations,
                     location-qa, de-action,
                     masu-present, masu-negative, desu-copula, ka-question, register-audience]

notes: |
  m8 = spine tile n02. て-form pulled EARLY with ください for traveler utility
  (draft-4 §"て-form pulled EARLY"); the rest of the て family (ている,
  permission/prohibition, てから) is the DEEPEN beat at n06b/m14 — do not
  teach it here.

  Shape (inv 25): 15 lessons = 11 teaching + 3 review + 1 challenge. TWO of
  the eleven teaching lessons are KATAKANA rows (サ, タ —
  KATAKANA_ROW_SCHEDULE.neoModuleIndex = 8), wired at module level, so this
  IR carries 9 teaching + 3 review + 1 challenge = 13 lessons.

  REGISTER (ramp, inv 19 / draft-4 §7b): plain is the base and stays the
  MAJORITY here — polite production is capped at ~20% for m8-m11. ください is
  a lexical request FORMULA, not the ます paradigm, so it does not count
  against that share; it is taught as a fixed chunk on top of て.

  SCRIPT CONSTRAINT: the katakana ladder has only ア/カ (m7) + サ/タ (m8) by
  the end of this module. パン needs ハ (m9), so the food set is deliberately
  hiragana-only — ごはん, ちゃ, たべもの, しょくじ, こめ. Do not reach for
  loanwords the learner cannot read yet.

  Derivation direction (draft-4, Genki order): て comes from the sound-change
  table FIRST; た reuses "the same table" at n04. Teach the table here as the
  one fact that pays twice.

grammarPoints:
  # Three lessons teach this point and each states its own rule. They shared
  # one card until 2026-07-27, so lessons 2 and 3 opened with a card about
  # lesson 1's material and the learner met the sound-change table only as a
  # clause inside it. The id stays shared: it is one grammar point to the SRS.
  - id: te-form
    variant: connector
    rule: "The て-form is the shape everything else attaches to — requests now, whole chains of actions later. る-verbs make it by swapping る for て: たべる → たべて, みる → みて. On its own it is what you say to a friend: たべて = 'eat', 'go on, eat'."
    examples:
      - { ja: "しゃしんを みて。", en: "Look at the photo." }
      - { ja: "たべて。", en: "Go on, eat." }
    antiPattern: { ja: "しゃしんを みるて。", why: "る-verbs drop る before て — みる→みて, never みるて." }
    # Ramp is pinned ahead of the middle and a transform card is not
    # intro-capable (inv 37), so every form it emits is stated above.
    conjugation: { form: te, classes: [ru] }
  # ── The sound-change table, ONE ENDING PER LESSON (Spencer 2026-08-06) ──
  # This used to be a single `sound-change` card that stated all five rows at
  # once and drilled three of them, so つ・る・ぶ・ぬ・ぐ・す were asserted and
  # never worked. Spencer: "individual teaching for every te form ending …
  # this is the most important thing to learn." Each row now owns a card, a
  # lesson slot and its own worked example, and the transform card's rule
  # table highlights the exact row being drilled (`subgroup`).
  - id: te-form
    variant: tte
    rule: "う-verbs change their last kana before て. The biggest row takes three endings at once: う・つ・る → って. かう→かって, たつ→たって, やる→やって. The kana before って never changes — only the ending does. Learn this table once and it pays twice: the past form た uses exactly the same rows."
    examples:
      - { ja: "ほんを かって。", en: "Buy the book." }
      - { ja: "ここに たって。", en: "Stand here." }
      - { ja: "きょう やって。", en: "Do it today." }
    antiPattern: { ja: "ほんを かうて。", why: "う・つ・る drop their last kana before って — かう→かって, never かうて." }
    # Ramp is pinned ahead of the middle and a transform card is not
    # intro-capable (inv 37), so every form it emits is stated above.
    conjugation: { form: te, classes: [u] }
  - id: te-form
    variant: nde
    rule: "The second row is the voiced one: む・ぶ・ぬ → んで. のむ→のんで, あそぶ→あそんで. Notice it is んで, not んて — the ん drags the ending into a voiced で. (ぬ verbs are almost extinct in modern Japanese: しぬ 'to die' is essentially the only one, and it behaves exactly like のむ — しぬ→しんで. You will not need to produce it here.)"
    examples:
      - { ja: "みずを のんで。", en: "Drink the water." }
      - { ja: "かわで あそんで。", en: "Play at the river." }
    antiPattern: { ja: "みずを のみて。", why: "のむ ends in む, so it takes the んで row — のんで, never のみて." }
    conjugation: { form: te, classes: [u] }
  - id: te-form
    variant: single-kana
    rule: "Three rows are one kana each, and each one is different: く → いて (きく→きいて); ぐ → いで — the voiced twin of いて, just like んで was of んて (いそぐ→いそいで); す → して (かす→かして). Watch かう→かって against かす→かして: same first kana, different ending, different row. The ENDING decides, never the word."
    examples:
      - { ja: "うたを きいて。", en: "Listen to the song." }
      - { ja: "いえに いそいで。", en: "Hurry home." }
      - { ja: "ほんを かして。", en: "Lend me the book." }
    antiPattern: { ja: "うたを きくて。", why: "く takes the いて row — きく→きいて, never きくて." }
    conjugation: { form: te, classes: [u] }
  - id: te-form
    variant: rebels
    rule: "Three verbs ignore the table. する → して and くる → きて are the two irregulars you already know as a pair. The third is いく: it ends in く, so the table promises いいて — but it is いって, borrowing the う・つ・る row. Memorise these three as a set."
    examples:
      - { ja: "いって。", en: "Go on, go." }
      - { ja: "これを して。", en: "Do this one." }
      - { ja: "きて。", en: "Come here." }
    antiPattern: { ja: "いいて。", why: "いく looks like a く-verb but skips the く→いて row — its て-form is いって." }
    # いく is class `u` and only breaks the ROW, so it rides here with the two
    # irregulars — the lesson's `introduces` scopes the ramp to these three.
    conjugation: { form: te, classes: [u, irregular] }
  - id: te-kudasai
    variant: polite
    rule: "て + ください = a polite request: 'please do X'. It is a fixed FORMULA — you attach ください to the て-form and nothing else changes. Drop ください and the bare て-form is the casual version friends use: みて = 'look', みてください = 'please look'."
    examples:
      - { ja: "みてください", en: "Please look." }
      - { ja: "たべてください", en: "Please eat." }
    antiPattern: { ja: "たべるください", en: "", why: "ください attaches to the て-form, not the dictionary form — たべてください" }
  # The two vocabulary lessons (L5 food, L6 shop) owned no card, so しょくじ
  # and こめ were BUILT before anything said what they meant — neither has an
  # emoji, so the compiler cannot give them a picture debut and the gloss
  # arrived a lesson late, in a review match grid (2026-07-27 gloss-debt
  # scan). Each lesson now re-teaches a prior particle point in its own
  # context (the ⟳ move) and spends the card's prose on its nouns. Examples
  # deliberately avoid ごはん/たべもの/みせ: those DO have emoji, so their
  # first appearance must stay their image MCQ (image-debut invariant).
  - id: wo-object
    variant: food
    rule: "A request needs something to request, and food is where a beginner starts. ごはん is cooked rice — and, by extension, the meal built round it. しょくじ is the meal itself, the sit-down occasion: しょくじを する is 'to have a meal'. たべもの is food in general, and ちゃ is tea. Whatever you eat, drink or ask for takes を. And to ask someone NOT to do something, you swap the て-form for the ない-form and add で: たべて → たべないで = 'don't eat it'. Same shape, opposite instruction — 「ミカの たべものを たべないで」 is 'don't eat Mika's food'."
    examples:
      - { ja: "しょくじを する。", en: "I have a meal." }
      - { ja: "ちゃを のむ。", en: "I drink tea." }
  - id: de-action
    variant: shop
    rule: "で marks WHERE an action happens, and for a beginner that is the shop: みせで かう is 'buy it at the shop'. What you buy there is こめ — uncooked rice, the bag on the shelf, not the cooked bowl on the table (that one is ごはん). Getting to the shop is still に, not で: みせに いく."
    examples:
      - { ja: "いえで たべる。", en: "I eat at home." }
      - { ja: "こめを かう。", en: "I buy rice." }
    antiPattern: { ja: "いえに たべる。", why: "に is where a thing IS; the place you do something takes で — いえで たべる." }
  - id: te-kudasai
    variant: casual
    rule: "ください is the polite half, and it detaches. みてください → みて: same verb, same て-form, and the whole difference in politeness lives in whether ください is there. Bare て for friends and family; keep ください for teachers, shopkeepers and people you have just met."
    examples:
      - { ja: "みて。", en: "Look. (to a friend)" }
      - { ja: "みてください。", en: "Please look. (polite)" }
    # antiPattern omitted (invariant 12): both forms are correct Japanese —
    # the contrast is audience, not grammar, so there is no wrong sentence to show.

newAtoms:
  # Ordered by the lesson that teaches them — L1 る, L2 って, L10 んで,
  # L11 いて/いで/して, L3 the rebels. The ramp draws in this order.
  - { kana: たべて, romaji: tabete, gloss: "eat (te-form)", imageable: false, kind: verb-form, derivedFrom: たべる, verbClass: ru }
  - { kana: みて, romaji: mite, gloss: "watch, look (te-form)", imageable: false, kind: verb-form, derivedFrom: みる, verbClass: ru }
  # ── L2 · う・つ・る → って. たつ is a NEW base verb; やる the learner already
  #    has from m5. Both are here so the row gets three worked endings, not one.
  - { kana: かって, romaji: katte, gloss: "buy (te-form)", imageable: false, kind: verb-form, derivedFrom: かう, verbClass: u }
  - { kana: たつ, romaji: tatsu, gloss: "to stand, to stand up", shortGloss: "stand", imageable: true, kind: verb, verbClass: u }
  - { kana: たって, romaji: tatte, gloss: "stand (te-form)", shortGloss: "stand (te)", imageable: false, kind: verb-form, derivedFrom: たつ, verbClass: u }
  - { kana: やって, romaji: yatte, gloss: "do (te-form)", shortGloss: "do (te)", imageable: false, kind: verb-form, derivedFrom: やる, verbClass: u }
  # ── L10 · む・ぶ・ぬ → んで.
  - { kana: のんで, romaji: nonde, gloss: "drink (te-form)", imageable: false, kind: verb-form, derivedFrom: のむ, verbClass: u }
  - { kana: あそんで, romaji: asonde, gloss: "play (te-form)", imageable: false, kind: verb-form, derivedFrom: あそぶ, verbClass: u }
  # ── L11 · く → いて, ぐ → いで, す → して. いそぐ and かす are NEW bases: they
  #    are the only way these two rows get a worked example, and both are
  #    natural requests for a ください module (いそいで / かして). Neither was
  #    taught by ANY lesson before this — they were registered-but-never-taught
  #    atoms (the B065 class), so claiming them here is a net gain.
  - { kana: きいて, romaji: kiite, gloss: "listen, ask (te-form)", imageable: false, kind: verb-form, derivedFrom: きく, verbClass: u }
  - { kana: いそぐ, romaji: isogu, gloss: "to hurry", shortGloss: "hurry", imageable: true, kind: verb, verbClass: u }
  - { kana: いそいで, romaji: isoide, gloss: "hurry (te-form)", shortGloss: "hurry (te)", imageable: false, kind: verb-form, derivedFrom: いそぐ, verbClass: u }
  - { kana: かす, romaji: kasu, gloss: "to lend", shortGloss: "lend", imageable: true, kind: verb, verbClass: u }
  - { kana: かして, romaji: kashite, gloss: "lend (te-form)", shortGloss: "lend (te)", imageable: false, kind: verb-form, derivedFrom: かす, verbClass: u }
  - { kana: いって, romaji: itte, gloss: "go, travel (te-form)", imageable: false, kind: verb-form, derivedFrom: いく, verbClass: u }
  - { kana: して, romaji: shite, gloss: "do, make (te-form)", imageable: false, kind: verb-form, derivedFrom: する, verbClass: irregular }
  - { kana: きて, romaji: kite, gloss: "come (te-form)", imageable: false, kind: verb-form, derivedFrom: くる, verbClass: irregular }
  - { kana: ください, romaji: kudasai, gloss: "please (request)", shortGloss: "please", imageable: false, kind: grammar-chunk }
  - { kana: おしえる, romaji: oshieru, gloss: "to teach, to tell", shortGloss: "teach, tell", imageable: true, kind: verb, verbClass: ru }
  - { kana: おしえて, romaji: oshiete, gloss: "teach, tell (te-form)", imageable: false, kind: verb-form, derivedFrom: おしえる, verbClass: ru }
  - { kana: ごはん, romaji: gohan, gloss: "rice, a meal", shortGloss: "rice/meal", imageable: true, kind: vocab }
  - { kana: たべもの, romaji: tabemono, gloss: "food", imageable: true, kind: vocab }
  - { kana: しょくじ, romaji: shokuji, gloss: "a meal", imageable: true, kind: vocab }
  - { kana: ちゃ, romaji: cha, gloss: "tea", imageable: false, kind: vocab }
  - { kana: こめ, romaji: kome, gloss: "rice (uncooked)", shortGloss: "rice (raw)", imageable: false, kind: vocab }
  - { kana: みせ, romaji: mise, gloss: "shop, store", shortGloss: "shop", imageable: true, kind: vocab }

lessons:
  - id: m8-neo-1
    role: teaching
    title: "The connector — て"
    focus: "る-verbs swap る for て; the form that other things attach to"
    introduces: [たべて, みて, たつ]
    beats:
      - { kind: rule, grammarPointId: te-form, variant: connector }
      - { kind: sentence, ja: "いえで たべて。", en: "Eat at home", exercises: [te-form], mode: build }
      - { kind: sentence, ja: "ねこを みて。", en: "Look at the cat", exercises: [te-form], mode: build }
      - { kind: sentence, ja: "りょうりを たべて。", en: "Eat the cuisine", exercises: [te-form, wo-object], mode: build }
      - { kind: sentence, ja: "そらを みて。", en: "Look at the sky", exercises: [te-form, wo-object], mode: translate }
      - { kind: sentence, ja: "ほんを みて。", en: "Look at the book", exercises: [te-form, wo-object], mode: listening }
      - { kind: sentence, ja: "みずを のむ。", en: "I drink water", exercises: [wo-object], mode: build }
      - { kind: sentence, ja: "ミカが たつ。", en: "Mika stands up", exercises: [ga-existence], mode: listening }
      - { kind: sentence, ja: "しゃしんを みて。", en: "Look at the photo", exercises: [te-form, wo-object], mode: build }
      - { kind: sentence, ja: "きょうは たべて。", en: "Eat today", exercises: [te-form, wa-topic], mode: build }
      - kind: dialogue
        lines:
          - { speaker: "ミカ", ja: "そらを みて。", en: "Look at the sky." }
          - { speaker: "トム", ja: "ほしだ。", en: "Stars." }
        questions:
          - { q: "What does Mika point out?", options: ["The sky", "A book", "A photo", "Food"], answer: "The sky" }
      - { kind: challenge, ja: "ミカの しゃしんを みて。", en: "Look at Mika's photo", combines: [no-possession, wo-object, te-form], mode: build }
    reviewPool: [たべる, みる, たつ, ほん, そら, しゃしん, ほし]

  - id: m8-neo-2
    role: teaching
    title: "う・つ・る → って"
    focus: "the biggest row: three endings, one result"
    introduces: [かって, たって, やって]
    beats:
      - { kind: rule, grammarPointId: te-form, variant: tte }
      - { kind: sentence, ja: "えんぴつを かって。", en: "Buy a pencil", exercises: [te-form], mode: build }
      - { kind: sentence, ja: "ここに たって。", en: "Stand here", exercises: [te-form, ni-location], mode: build }
      - { kind: sentence, ja: "きょう やって。", en: "Do it today", exercises: [te-form], mode: build }
      - { kind: sentence, ja: "ほんを かって。", en: "Buy a book", exercises: [te-form, wo-object], mode: listening }
      - { kind: sentence, ja: "そこに たって。", en: "Stand there", exercises: [te-form, ni-location], mode: translate }
      - { kind: sentence, ja: "いえで やって。", en: "Do it at home", exercises: [te-form, de-action], mode: build }
      - { kind: particle-cloze, stem: "ほんを ", tail: "。", answer: "かって", options: ["かって", "かうて", "かりて"], en: "Buy the book", explanation: "かう ends in う, so it takes the って row — かって. かうて keeps the う it is supposed to drop." }
      - kind: dialogue
        lines:
          - { speaker: "ミカ", ja: "ここに たって。", en: "Stand here." }
          - { speaker: "トム", ja: "うん。", en: "Okay." }
        questions:
          - { q: "What does Mika ask Tom to do?", options: ["Stand here", "Sit down", "Buy a book", "Go home"], answer: "Stand here" }
      - { kind: challenge, ja: "ここで ミカの ほんを かって。", en: "Buy Mika's book here", combines: [de-action, no-possession, wo-object, te-form], mode: build }
    reviewPool: [かう, たつ, やる, ほん, えんぴつ, ここ, そこ, いえ]

  - id: m8-neo-10
    role: teaching
    title: "む・ぶ・ぬ → んで"
    focus: "the voiced row — んで, never んて"
    introduces: [のんで, あそんで, いそぐ, かす]
    beats:
      - { kind: rule, grammarPointId: te-form, variant: nde }
      - { kind: sentence, ja: "いえで のんで。", en: "Drink at home", exercises: [te-form, de-action], mode: build }
      - { kind: sentence, ja: "いえで あそんで。", en: "Play at home", exercises: [te-form, de-action], mode: build }
      - { kind: sentence, ja: "みずを のんで。", en: "Drink the water", exercises: [te-form, wo-object], mode: translate }
      - { kind: sentence, ja: "かわで あそんで。", en: "Play at the river", exercises: [te-form, de-action], mode: listening }
      - { kind: sentence, ja: "ぎゅうにゅうを のんで。", en: "Drink the milk", exercises: [te-form, wo-object], mode: build }
      - { kind: sentence, ja: "ミカが いそぐ。", en: "Mika hurries", exercises: [ga-existence], mode: build }
      - { kind: sentence, ja: "ほんを かす。", en: "I lend the book", exercises: [wo-object], mode: build }
      - { kind: particle-cloze, stem: "みずを ", tail: "。", answer: "のんで", options: ["のんで", "のんて", "のみて"], en: "Drink the water", explanation: "む・ぶ・ぬ take んで — the ん voices the ending, so のんて is never right." }
      - kind: dialogue
        lines:
          - { speaker: "ケン", ja: "みずを のんで。", en: "Drink some water." }
          - { speaker: "ミカ", ja: "ありがとう。", en: "Thanks." }
        questions:
          - { q: "What does Ken offer Mika?", options: ["Water", "Milk", "Tea", "Food"], answer: "Water" }
      - { kind: challenge, ja: "ミカの いえで あそんで。", en: "Play at Mika's house", combines: [no-possession, de-action, te-form], mode: build }
    reviewPool: [のむ, あそぶ, いそぐ, かす, みず, ぎゅうにゅう, かわ, ともだち]

  - id: m8-neo-r1
    role: review
    title: "Review — the て table"
    focus: "all three classes on all-new surfaces"
    introduces: []
    beats:
      - { kind: sentence, ja: "かさを かって。", en: "Buy an umbrella", exercises: [te-form, wo-object], mode: build }
      - { kind: sentence, ja: "はなを みて。", en: "Look at the flowers", exercises: [te-form, wo-object], mode: translate }
      - { kind: sentence, ja: "でんわを かって。", en: "Buy the phone", exercises: [te-form, wo-object], mode: listening }
      - { kind: sentence, ja: "りょうりを たべて。", en: "Eat the cuisine", exercises: [te-form, wo-object], mode: build }
      - { kind: sentence, ja: "ぼうしを かって。", en: "Buy a hat", exercises: [te-form, wo-object], mode: build }
      - { kind: particle-cloze, stem: "ねこと ", tail: "。", answer: "あそんで", options: ["あそんで", "かって", "みて"], en: "Play with the cat", explanation: "あそぶ ends in ぶ, which joins む in the んで group — あそんで." }
      - { kind: sentence, ja: "まどを みて。", en: "Look at the window", exercises: [te-form, wo-object], mode: build }
      - { kind: sentence, ja: "ほしを みて。", en: "Look at the stars", exercises: [te-form, wo-object], mode: listening }
      - kind: dialogue
        lines:
          - { speaker: "トム", ja: "うみに いく？", en: "Going to the sea?" }
          - { speaker: "ケン", ja: "うん、ミカも くる。", en: "Yeah, Mika's coming too." }
        questions:
          - { q: "Who else is coming?", options: ["Mika", "Tanaka", "Nobody", "Tom's family"], answer: "Mika" }
    reviewPool: [かさ, はな, いけ, こえ, りょうり, ぼうし, まど, でんわ, ねこ]

  - id: m8-neo-11
    role: teaching
    title: "く → いて, ぐ → いで, す → して"
    focus: "the three one-kana rows; the ending decides, never the word"
    introduces: [きいて, いそいで, かして]
    beats:
      - { kind: rule, grammarPointId: te-form, variant: single-kana }
      - { kind: sentence, ja: "ともだちに きいて。", en: "Ask your friend", exercises: [te-form, ni-location], mode: build }
      - { kind: sentence, ja: "うたを きいて。", en: "Listen to the song", exercises: [te-form, wo-object], mode: build }
      - { kind: sentence, ja: "いえに いそいで。", en: "Hurry home", exercises: [te-form, ni-location], mode: build }
      - { kind: sentence, ja: "ほんを かして。", en: "Lend me the book", exercises: [te-form, wo-object], mode: translate }
      - { kind: sentence, ja: "えんぴつを かして。", en: "Lend me a pencil", exercises: [te-form, wo-object], mode: listening }
      - { kind: particle-cloze, stem: "ほんを ", tail: "。", answer: "かして", options: ["かして", "かって", "かすて"], en: "Lend me the book", explanation: "かす ends in す → して. かって is かう, a different verb on the って row — the ending decides which row you are on." }
      - kind: dialogue
        lines:
          - { speaker: "トム", ja: "えんぴつを かして。", en: "Lend me a pencil." }
          - { speaker: "ミカ", ja: "うん。", en: "Sure." }
        questions:
          - { q: "What does Tom ask for?", options: ["A pencil", "A book", "Water", "A song"], answer: "A pencil" }
      - { kind: challenge, ja: "きょうは うたを きいて。", en: "Listen to a song today", combines: [wa-topic, wo-object, te-form], mode: build }
