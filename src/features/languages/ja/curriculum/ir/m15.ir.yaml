module: m15
title: "Relative clauses + こと/の + とき"
register: plain
priorNeoModules: [m3, m4, m5, m6, m7, m8, m9, m10, m11, m12, m13, m14]

priorGrammarPoints: [wa-topic, wo-object, no-possession, ni-location, de-action, mo-also,
                     dare, kore-sore-are-dore, koko-soko-asoko, spatial-relations, location-qa,
                     nai-form, nai-existence, arimasu, imasu,
                     masu-present, masu-negative, desu-copula, ka-question,
                     te-form, te-kudasai, kudasai, te-iru, te-mo-ii, mada-mou,
                     numbers-1-10, counter-tsu, numbers-11-99, counter-ji, ni-time,
                     desu-past, masu-past,
                     i-adj-present, i-adj-negative, i-adj-past, i-adj-past-negative,
                     na-adj-present, na-adj-negative, na-adj-past,
                     v-tai, ga-hoshii, suki-kirai-no, to-and]

notes: |
  m15 = spine tile s11. RELATIVE CLAUSES + こと/の NOMINALIZERS + とき, and the
  ordering pair まえに / てから.

  Shape (inv 25): 13 lessons = 9 teaching + 3 review + 1 challenge, reviews at
  the first/middle/last thirds, challenge lesson LAST. NO katakana rows (the
  programme ended at m11). NO `kind: register` beats — that machinery is m10 +
  m29 only (registerScaffoldIsolation).

  THE WHOLE POINT — a relative clause is COMPOSITION, not a new form.

  1. **A Japanese relative clause is a sentence parked in front of a noun.**
     No relative pronoun, no "that/which/who", and NOTHING changes about the
     verb: 「ほんを みる」 + 「ひと」 → 「ほんを みる ひと」. The learner
     already owns both halves; the module teaches the JOIN. This is the single
     highest-leverage structural idea in N5 — it is what stops a learner
     speaking in short sentences — so every lesson presents it as two things
     the learner already has, put next to each other.
  2. **The clause verb goes PLAIN.** 「たべる ひと」, never 「たべます ひと」.
     ます is the politeness of the SENTENCE and can only sit on the last verb.
     This is the payoff of the course's plain-form-first spine, and it is L1's
     antiPattern.
  3. **が inside the clause, は outside it (L3).** 「わたしは ミカが かった
     ほんを みた」. は marks the topic of the whole sentence and a sentence has
     one topic, so a second は inside a clause collides with the one outside —
     which is why the L3 antiPattern is a DOUBLE-は sentence rather than a bare
     「ミカは かった ほん」. That bare shape is grammatical (ミカ can be the
     main topic), and inv 12 forbids marking correct Japanese as an error.
     m16 (s13) owns the full は-vs-が contrast beat; this module takes only the
     narrow clause-internal rule it needs.
  4. **こと names an action (L5) — it is the same shape again**, a plain clause
     in front of a noun where the noun happens to be こと "the act of". m13
     already taught 〜のが すき, so this is NAMING something the learner has
     been using: の is the spoken half, こと the written half, and こと is also
     an ordinary noun (「わからない ことが ある」, 「きらいな ことが ない」).
  5. **とき is the same shape a third time (L6/L7)** — a clause in front of the
     noun とき. A noun takes の in front of it (がくせいの とき), a な-adjective
     takes な, a verb takes nothing.
  6. **まえに / てから are the ordering pair (L9/L10/L11).** They are introduced
     PAIRWISE — まえに first, then てから, then a lesson that runs them against
     each other — never all at once. 「たべる まえに」 takes the DICTIONARY form
     whatever the tense of the sentence (the module's second big trap, and L9's
     antiPattern); 「たべてから」 takes the て-form the learner got in m8/m14.

  DEVIATIONS, documented per the RUN-PLAN "decide and document" rule:
  - **とき ships MATCHED-TENSE ONLY — the spine wins over the dispatch brief.**
    spinePlan s11 says in so many words: "とき (#62) temporal clauses — MATCHED-
    TENSE sentences only in this beat (audit: 行くとき vs 行ったとき relative-
    tense flip is a documented trap; the contrast belongs to the s22 deepen)".
    The authoring brief asked for "〜る とき = before/while, 〜た とき = after".
    That IS the relative-tense flip the spine defers, so it is NOT taught here.
    Every とき sentence in this module keeps the two halves in the same tense
    (〜る とき + non-past main clause, 〜た とき + past main clause), and the
    toki rule card states that as a learning rule rather than as a fact about
    Japanese. m22 (s22) owns the flip.
  - **No registry id exists for "relative clause" or for the こと nominalizer**,
    and inv 42 forbids inventing IR-local ids. So:
      * the relative-clause cards are `dictionary-form` (L1) and `ta-form` (L2)
        — which is exactly why the coverage ledger puts `dictionary-form` on
        m15's row even though m7 first taught the citation form: this module is
        where the plain form earns its keep;
      * the clause-internal subject card is `ga-existence` (m6's が point,
        re-taught in clause position, the same ⟳ move m14 made with `te-form`);
      * the こと card is `no-ga-suki` (m13's point). こと and の are one
        construction with two skins, and `koto-ga-aru` in the registry is the
        EXPERIENCE construction, which the ledger keeps at m23. The ledger rows
        for m11/m13 are unchanged — a re-teach is not a re-assignment.
  - **こと and とき are registered in courseAtoms** (two rows, the module's only
    registry additions). Unlike m14's conjugated surfaces, neither is derivable
    from VERB_ENTRIES, so without a row the guards' tokenizer reads them as
    untracked words and the compiler's tile bank cannot spell the sentence.
    Both are `blocked: true` — an abstract function noun has no honest emoji.
    まえ already has a row (stale `fromModule: m17`); like m13 with だいがく it
    is declared in `newAtoms` here so it gets a real teach-first debut instead
    of arriving as a word the learner is assumed to know.
  - **NO conjugation_transform ramp.** Nothing in this module is a conjugation:
    a relative clause is composition of forms the learner already has (plain
    non-past, plain past, て-form), and まえに/てから attach whole forms. A ramp
    would drill a transformation the module does not teach. Inv 37's whole
    hazard class (a ramp emitting a form its rule card never spelled out, or
    printing an untaught base) therefore cannot arise here.
  - **かく / たつ / うたう / すむ / なる / ふる / さく are NOT used**, though the
    context pack lists them as known. The pack's word list is built from
    courseAtoms attribution; the taught-set the guards use comes from prior neo
    LESSONS, and no neo module ever introduced these. `priorVocab` in the
    compiled JSON is the authority — every surface in this file was checked
    against it. Same reason した/きた are never used as the past of する/くる:
    both kana are already atoms with a DIFFERENT sense (した "below", きた
    "north"), so using them as verbs mis-credits SRS (the documented homograph
    trap).
  - **NO この/その/あの** (m17's `kono-sono-ano-dono`). They are courseAtoms, so
    the compiler treats them as "already known" and they leak silently — the
    defect m13's QA pass caught with だいがく. m13 and m14 both flagged this
    rule; m15 keeps it. Where "that X" was tempting this module reaches for a
    relative clause instead, which is the point of the module.

  PICTURE DEBUTS (inv 30/44): えいが 🎬 (L2), くつ 👞 (L3), いそがしい 😰 + カメラ
  📷 (L6), りょこう ✈️ (L7) — four words from m15's OWN registry allocation, each chosen
  because the grammar needs it rather than to decorate it: a relative clause
  wants concrete things you can have bought or seen (えいが, くつ), とき wants a
  state you can be in (いそがしい) and an event you can be before or after
  (りょこう). Each debuts in a lesson whose rule card does NOT name it —
  `requireImageFirst` scans the RAW step JSON, including `rule:` prose and
  `antiPattern`, and a rule card is pinned first, so any mention there would
  steal the picture debut (m14 learned this the hard way).

  ONE RULE CARD PER LESSON (m14's layout law, unchanged): two `kind: rule` beats
  in one lesson compile to two PINNED, ADJACENT `grammar_rule` steps and fail
  the adjacency bar. L6 (no rule) and L11 (no rule) are the module's two
  card-free teaching lessons — L7 spends とき and L11 runs まえに against てから,
  both of which are practice, not new rules.

  CLAUSE LINKING IS SPACED, NOT COMMA'D (m14's finding, still live).
  `moduleCompiler.clean()` strips 、 with nothing in its place, so an authored
  「たべる とき、みずを のむ」 compiles to the run-on target and the run-on TTS
  key. Every sentence/challenge/listening-comp beat here writes the clause
  boundary as a SPACE; only rule-card prose and dialogue lines, which render
  raw, may keep a 、.

  TOKENIZATION IS PEDAGOGY HERE (three deliberate rulings):
    - **こと is its own tile.** 「たべる ことが すきだ」 builds as
      たべる / こと / が / すき / だ, which is literally the composition the
      card describes. Registering 「たべること」 as one atom would hide it.
    - **まえに decomposes to まえ + に**, so the learner sees that まえに is the
      noun まえ plus the に they have used since m6, not an opaque particle.
    - **てから decomposes to て-form + から.** から is already a courseAtom and a
      tokenizer particle, so 「たべてから」 builds as たべて / から — the exact
      claim the te-kara card makes. This is also why から never appears as a
      free word anywhere else in the module: `kara-because` and `kara-origin`
      are m16's row, and から's only job here is the てから suffix.

  CONNECTIVES + COMPLEXITY (inv 13): this module IS the complexity engine.
  Every relative clause, every とき and every まえに/てから beat is a two-clause
  sentence, which is why GATE 7's m15 floor was recalibrated upward after
  measurement (see moduleContentLints COMPLEXITY_FLOORS).

  REINFORCEMENT (inv 27): じかん, からだ-adjacent carriers, かぜ and とりにく were
  the context pack's under-exposed targets that survive the priorVocab check;
  じかん carries three beats (「ごはんを たべる じかんが ない」,
  「じかんが ある とき」) and カメラ/きっぷ/じてんしゃ/ぼうし rotate as carriers so
  the module is not a wall of ほん and ごはん.

grammarPoints:
  - id: dictionary-form
    rule: "A relative clause in Japanese is just a sentence parked in front of a noun. There is no \"that\", no \"which\", no \"who\" — you put the whole sentence there and the noun it lands in front of is what the sentence is about. 「ほんを みる」 is a sentence; 「ほんを みる ひと」 is the person who looks at books. Nothing is added and nothing is reordered. One rule only: the verb inside the clause stays PLAIN. ます is the politeness of the whole SENTENCE, and it can only ever sit on the last verb — never inside a clause."
    examples:
      - { ja: "ほんを みる ひとが いる。", en: "There is a person who looks at books." }
      - { ja: "ちゃを のむ ひとは ミカだ。", en: "The person who drinks tea is Mika." }
      - { ja: "きっさてんで のむ ちゃが すきだ。", en: "I like the tea I drink at the coffee shop." }
      - { ja: "ごはんを たべる じかんが ない。", en: "There is no time to eat." }
      - { ja: "きっさてんで はたらく ひとと あそぶ。", en: "I hang out with the person who works at the coffee shop." }
    antiPattern: { ja: "ほんを みます ひとが いる。", why: "the verb inside a clause stays PLAIN — ます is the politeness of the whole sentence and only ever sits on the LAST verb: ほんを みる ひとが いる。" }
  - id: ta-form
    rule: "Put the clause in the past and nothing else changes — the plain past sits in front of the noun exactly where the plain non-past did. 「きのう かった ほん」 = the book I bought yesterday. Who did the buying is usually left out and the rest of the sentence makes it obvious. And there is never a の between the clause and its noun: の joins two NOUNS (ミカの ほん), never a clause to the noun it describes."
    examples:
      - { ja: "きのう かった ほんを みた。", en: "I looked at the book I bought yesterday." }
      - { ja: "あさ のんだ ちゃは おいしい。", en: "The tea I drank in the morning is delicious." }
      - { ja: "きのう いった みせは ふるい。", en: "The shop I went to yesterday is old." }
      - { ja: "きのう きいた うたが すきだ。", en: "I like the song I heard yesterday." }
      - { ja: "きのう たべた すしは たかい。", en: "The sushi I ate yesterday is expensive." }
    antiPattern: { ja: "きのう かった の ほんを みた。", why: "の joins two NOUNS — it never joins a clause to the noun it describes, so the clause sits straight in front: きのう かった ほんを みた。" }
  - id: ga-existence
    rule: "Give the clause its own subject and that subject takes が: 「ミカが かった ほん」 = the book Mika bought. The が belongs to the clause alone and never reaches outside it. は cannot go there. は marks the topic of the WHOLE sentence and a sentence gets one topic, so a は inside a clause collides with the one outside it. Rule of thumb while you learn this: outside the clause は, inside the clause が."
    examples:
      - { ja: "わたしは ミカが かった ほんを みた。", en: "I looked at the book Mika bought." }
      - { ja: "ケンが きいた うたは おもしろい。", en: "The song Ken heard is interesting." }
      - { ja: "たなかが おしえる じゅぎょうは おもしろい。", en: "The class Tanaka teaches is interesting." }
      - { ja: "ミカが かった いえは しずかだ。", en: "The house Mika bought is quiet." }
      - { ja: "わたしが かった かばんは やすい。", en: "The bag I bought is cheap." }
    antiPattern: { ja: "わたしは ミカは かった ほんを みた。", why: "one sentence, one は — the clause's own subject takes が instead: わたしは ミカが かった ほんを みた。" }
  - id: no-ga-suki
    rule: "You already turn a verb into a thing with の — 「たべるのが すきだ」. こと does the identical job: 「たべる ことが すきだ」. And it is the same shape you have been building all module — a plain clause in front of a noun — except the noun is こと, \"the act of\", so the clause becomes something you can like, hate, or make the subject of a sentence. Both are right; の is the spoken half and こと the written half. こと is also an ordinary noun meaning \"thing\" in the abstract sense: 「わからない ことが ある」 = there is something I don't understand."
    examples:
      - { ja: "うみで およぐ ことが すきだ。", en: "I like swimming in the sea." }
      - { ja: "ほんを みる ことが すきだ。", en: "I like looking at books." }
      - { ja: "あさ はたらく ことは きらいだ。", en: "I hate working in the morning." }
      - { ja: "ともだちと あそぶ ことは おもしろい。", en: "Hanging out with friends is fun." }
      - { ja: "わからない ことが ある。", en: "There is something I don't understand." }
    antiPattern: { ja: "うみで およぐが すきだ。", why: "a verb cannot be marked が on its own — こと (or の) turns it into a thing first: うみで およぐ ことが すきだ。" }
  - id: toki
    rule: "とき is just the noun \"time\", and by now you know how to describe a noun: park a clause in front of it. 「にほんに いく とき」 = the time when I go to Japan → when I go to Japan. What sits in front follows the same rules as everything else that describes a noun — a verb goes in plain, a noun takes の (がくせいの とき = when I was a student), a な-adjective takes な (げんきな とき). While you are learning it, keep the two halves in the same tense: a 〜る とき clause with a non-past sentence, a 〜た とき clause with a past one."
    examples:
      - { ja: "がくせいの とき じてんしゃを かった。", en: "When I was a student, I bought a bicycle." }
      - { ja: "ごはんを たべる とき みずを のむ。", en: "When I eat, I drink water." }
      - { ja: "きっさてんに いった とき ちゃを のんだ。", en: "When I went to the coffee shop, I drank tea." }
      - { ja: "うみに いく とき ぼうしを かう。", en: "When I go to the sea, I buy a hat." }
      - { ja: "げんきな とき うみで およぐ。", en: "When I'm well, I swim in the sea." }
    antiPattern: { ja: "がくせいだ とき じてんしゃを かった。", why: "だ never sits in front of a noun — a noun describing another noun takes の: がくせいの とき じてんしゃを かった。" }
  - id: mae-ni
    rule: "まえ means \"before\". Put a clause in front of it — the same shape as always — add に, and you have \"before doing X\". 「たべた まえに」 is never Japanese. A noun takes の, as usual: 「じゅぎょうの まえに」."
    # The inversion, the dictionary form and the reason for it were three
    # sentences of prose describing a picture. They are now the picture.
    diagram:
      kind: timeline
      early: { label: "ごはんを たべる", clock: "7:00", color: "#f97316" }
      late: { label: "だいがくに いく", clock: "9:00", color: "#14b8a6" }
      frames:
        - id: mae-ni
          connective: "まえに"
          first: { text: "だいがくに いく まえに", at: late }
          second: { text: "ごはんを たべる", at: early }
          en: "Before going to university, I eat."
          note: "The clause you hear FIRST happens SECOND. That inversion is the whole difficulty of まえに — and it is why the verb in front stays in the dictionary form: the tense is carried by the verb at the end."
    examples:
      - { ja: "だいがくに いく まえに ごはんを たべる。", en: "Before going to university, I eat." }
      - { ja: "ちゃを のむ まえに ほんを みた。", en: "Before drinking tea, I looked at a book." }
      - { ja: "きっさてんに いく まえに かばんを かった。", en: "Before going to the coffee shop, I bought a bag." }
      - { ja: "じゅぎょうの まえに ともだちと あそんだ。", en: "Before class, I hung out with a friend." }
      - { ja: "うみで およぐ まえに みずを のんだ。", en: "Before swimming in the sea, I drank water." }
    antiPattern: { ja: "だいがくに いった まえに ごはんを たべる。", why: "まえに always takes the DICTIONARY form, whatever the tense of the sentence — the verb at the end carries the tense: だいがくに いく まえに ごはんを たべる。" }
  - id: te-kara
    rule: "The other half of the pair. Take the て-form you already own, hang から on it, and you have \"after doing X\". て on its own already links actions in the order they happen; てから adds that the first is FINISHED before the second starts. The tense still lives on the last verb: 「たべてから いった」."
    # Same two events as L7, so the connective is the only variable — which is
    # what makes the pair readable. The chips ARE the contrast the prose used
    # to state, so the statement is gone.
    diagram:
      kind: timeline
      early: { label: "ごはんを たべる", clock: "7:00", color: "#f97316" }
      late: { label: "だいがくに いく", clock: "9:00", color: "#14b8a6" }
      frames:
        - id: te-kara
          connective: "てから"
          first: { text: "ごはんを たべてから", at: early }
          second: { text: "だいがくに いく", at: late }
          en: "After eating, I go to university."
          note: "てから says the two events in the order they happen, so the badges count up. The form in front is the て-form."
        - id: mae-ni
          connective: "まえに"
          first: { text: "だいがくに いく まえに", at: late }
          second: { text: "ごはんを たべる", at: early }
          en: "Before going to university, I eat."
          note: "Same two events, opposite reading order — and the form in front changes with it. まえに takes the dictionary form, てから takes the て-form."
    examples:
      - { ja: "ごはんを たべてから だいがくに いく。", en: "After eating, I go to university." }
      - { ja: "うたを きいてから ごはんを たべた。", en: "After listening to a song, I ate." }
      - { ja: "きっさてんに いってから みせに いった。", en: "After going to the coffee shop, I went to the shop." }
      - { ja: "ちゃを のんでから しゃしんを みた。", en: "After drinking tea, I looked at the photo." }
      - { ja: "めがねを かってから えきに いった。", en: "After buying glasses, I went to the station." }
    antiPattern: { ja: "ごはんを たべるてから だいがくに いく。", why: "から hangs on the て-form, not the dictionary form — たべる becomes たべて first: ごはんを たべてから だいがくに いく。" }

newAtoms:
  # ══ L2 — the first picture debut. えいが is m15's own registry allocation
  #    (courseAtoms `fromModule: m15`, emoji 🎬) and is deliberately absent
  #    from every rule card, antiPattern and rule-prose line in this file:
  #    requireImageFirst reads the RAW step JSON and rule cards are pinned
  #    first, so a mention there would steal the picture debut.
  - { kana: えいが, romaji: eiga, gloss: "movie", imageable: true, kind: vocab }
  # ══ L3
  - { kana: くつ, romaji: kutsu, gloss: "shoes", imageable: true, kind: vocab }
  # ══ L5 — こと. imageable:false: an abstract function noun has no honest
  #    emoji, so the no-ga-suki rule card IS its introduction (the same move
  #    m13 made for ほしい/すき/きらい). Registered in courseAtoms because it is
  #    derivable from nothing — see the notes block.
  - { kana: こと, romaji: koto, gloss: "thing, the act of doing", shortGloss: "thing (act of)", imageable: false, kind: vocab }
  # ══ L6 — とき, and the module's third picture debut.
  - { kana: とき, romaji: toki, gloss: "time, when", shortGloss: "time, when", imageable: false, kind: vocab }
  - { kana: いそがしい, romaji: isogashii, gloss: "busy", imageable: true, kind: vocab }
  # ══ L6 — カメラ. It already has a courseAtoms row (📷, SRS-attributed to the
  #    m11 katakana row, where the learner learns to READ it) but no lesson
  #    ever states what it MEANS, so it arrived here as an untaught carrier and
  #    the learner had to BUILD it in L7 (glossBeforeProduction). Declared new
  #    in the first lesson that uses it so it gets a real picture debut; 📷 is
  #    unique in the registry, so nothing collides.
  - { kana: カメラ, romaji: kamera, gloss: "camera", imageable: true, kind: vocab }
  # ══ L7
  - { kana: りょこう, romaji: ryokou, gloss: "trip, travel", shortGloss: "trip", imageable: true, kind: vocab }
  # ══ L9 — まえ. Already a courseAtoms row (stale `fromModule: m17`, blocked),
  #    declared here so it gets a real teach-first debut rather than being
  #    assumed known — the m13/だいがく precedent.
  - { kana: まえ, romaji: mae, gloss: "before", imageable: false, kind: vocab }
  # ── R16 teach-them wave (2026-09-02): graded here since this module shipped,
  #    but declared nowhere, so the word never reached courseAtoms' unlock path.
  #    Introduced by the PINNED rule card that already uses it — `imageable:
  #    false` because a card at step 1 pre-empts a picture debut (inv 30/44).
  - { kana: から, romaji: kara, gloss: "from (origin)", shortGloss: "from", imageable: false, kind: particle }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m15-neo-1
    role: teaching
    title: "ほんを みる ひと — a sentence in front of a noun"
    focus: "a plain clause parked in front of a noun describes it — no 'that', no 'who', and the verb does not change"
    introduces: []
    beats:
      - { kind: rule, grammarPointId: dictionary-form }
      - { kind: sentence, ja: "ほんを みる ひとが いる。", en: "There is a person who looks at books", exercises: [dictionary-form, wo-object, ga-existence], mode: build }
