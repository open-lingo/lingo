      - { kind: sentence, ja: "うみで およぐ ことが すきだ。", en: "Say to a friend: I like swimming in the sea", exercises: [no-ga-suki], mode: translate }
      - { kind: particle-cloze, stem: "うみで およぐ ", tail: " すきだ。", answer: "ことが", options: ["ことが", "ことを", "ことに"], en: "I like swimming in the sea", explanation: "こと turns the clause into a thing, and what you like takes が — the same が as ほしい and すき." }
      - { kind: listening-comp, audio: "ケンは ほんを かう ことが すきだ。", answer: "Ken likes buying books", distractors: ["Ken likes looking at books", "Ken bought a book", "Ken doesn't like books"], exercises: [no-ga-suki, wa-topic] }
