      - { kind: challenge, ja: "ミカが すきな ことは あたらしい えいがを みる ことだ。", en: "What Mika likes is watching new movies", combines: [no-ga-suki, ga-existence, na-adj-present, i-adj-present, wa-topic], mode: build }
