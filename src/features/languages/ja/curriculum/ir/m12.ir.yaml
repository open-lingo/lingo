module: m12
title: "Adjectives as mini-predicates (い + な)"
register: plain
priorNeoModules: [m3, m4, m5, m6, m7, m8, m9, m10, m11]

priorGrammarPoints: [wa-topic, ga-existence, wo-object, no-possession, ni-location, de-action, mo-also, dare, kore-sore-are-dore,
                     nai-form, arimasu, imasu,
                     nai-existence, koko-soko-asoko, spatial-relations,
                     location-qa,
                     masu-present, masu-negative, desu-copula, ka-question, register-audience,
                     te-form, te-kudasai, numbers-1-10, counter-tsu, ikura-price,
                     yes-no-register, aizuchi, chotto-softener,
                     numbers-11-99, counter-ji, ni-time, ta-form, desu-past, masu-past]

notes: |
  m12 = spine tile s09. ADJECTIVES AS MINI-PREDICATES.

  Shape (inv 25): 13 lessons = 9 teaching + 3 review + 1 challenge, reviews
  at the first/middle/last thirds, challenge lesson LAST. NO katakana rows —
  the katakana programme ended at m11 (RUN-PLAN standing decision 2); from
  here katakana is ordinary vocabulary. NO `kind: register` beats — that
  machinery belongs to m10 and m29 (registerScaffoldIsolation).

  THE WHOLE POINT (Spencer's s09 note: teach by showing, let the learner
  infer the pattern from contrasts):

  1. An い-ADJECTIVE IS A PREDICATE BY ITSELF. たかい already means
     "is-expensive". It conjugates like a verb — たかい / たかくない /
     たかかった / たかくなかった — and needs no だ for grammaticality. Four
     cells, four lessons (L1-L4), each drilled by the SAME
     conjugation_transform ramp the て/た tables use. です is the politeness
     coat bolted on top (L8) and it does NOT conjugate: たかいでした is the
     classic learner error and gets its own anti-pattern beat plus the L8
     cloze.
  2. A な-ADJECTIVE IS ESSENTIALLY A NOUN. It borrows the copula to
     predicate: しずかだ / しずかじゃない / しずかだった / しずかじゃなかった
     (L5-L7). m11 bought だ/だった; this module SPENDS them, so な-adjectives
     read as a payout, not a second system.
  3. な APPEARS ONLY PRENOMINALLY (しずかな いえ) — the one place the two
     classes visibly diverge before conjugation, and the reason for the
     name. The L5 rule card puts おおきい いえ beside げんきな ひと and its
     cloze makes the learner choose だ vs な in the predicate slot.

  TRANSFORM RAMP (inv 37 — this bit m11, do not rediscover it): the ramp is
  PINNED ahead of the interleaved middle and conjugation_transform is NOT
  intro-capable, so EVERY form the ramp can emit also appears in the
  introducing rule card's `examples:`. The compiler takes the first three
  ramp-eligible atoms of a lesson's `introduces` in `newAtoms` order, so each
  ramp lesson lists its three drilled forms FIRST, all three are spelled out
  by that lesson's rule card, and every other derived form in the lesson has
  `verbClass` deliberately omitted so it can never be picked up.

  This is the module that made `conjugation_transform` adjective-capable
  (`verbClass: "i-adj"`). The engine half already existed for the
  Conjugation Trainer — `conjugateIAdj` + `generateIAdjFormationDistractors`
  — only the lesson-side factory was verb-only.

  BASES THAT ARE ALREADY KNOWN: たかい and やすい were taught by m11 (its L6
  build and its challenge beat), so they are NOT declared as new atoms —
  they are the module's free carriers and the ramp's opening base.
  Re-declaring やすい would also re-image it, and word_image_mcq is
  first-exposure ONLY (inv 44). Same on the な side: げんき / ひま /
  だいじょうぶ / だめ / ちょっと are all prior and get reused, not re-taught.

  WHY THE RULE CARDS DUCK THE NEW IMAGEABLE WORDS: a rule card is PINNED at
  step 1, so any word in its `examples:` is pre-satisfied and its picture
  debut stops being its first appearance (inv 30/44). L1's card therefore
  runs on たかい/やすい/ちいさい/いい (no emoji between them) and L5's on
  げんき/ひま; おおきい・おいしい・あたらしい・ふるい・おもしろい・しずか・
  きれい・にぎやか・ゆうめい debut on their picture MCQs.

  DEVIATIONS FROM spinePlan s09 (documented per RUN-PLAN "decide and
  document"):
  - **なる (く/になる) is NOT here.** The spine pulls it forward to s09; the
    coverage ledger still has `ku-ni-naru` at m27. It stays at m27 for a
    mechanical reason, not a pedagogical one: the く-stem (たかく) is not a
    surface any tokenizer in this repo knows — it is absent from
    ADJ_ENTRIES' four columns and from courseAtoms, so `たかく なる` either
    trips the unbuildable gate or forces inflected stems into the atom
    registry (the exact regression m11's notes warn about). The に-side
    (しずかに なる) tokenizes cleanly today, so なる can land whole the
    moment a く-stem lexicon exists. Flagged, not forced.
  - **すき/きらい stay at m13** (the ledger's row for n05), where they pair
    with が-marked ほしい/たい instead of competing with the paradigm here.
  - **よ/ね stay at m29** — `yo-emphasis`/`ne-agreement` are ledgered there
    and s25 is the sentence-final-particle tile.
  - **すごい/こわい are cut** from the spine's high-frequency set: neither is
    in ADJ_ENTRIES, so their inflections are invisible to the real-form
    lexicon the provenance guard reads. おいしい (#95), いい and おもしろい
    carry the frequency win; adding the other two is a conjugation-table
    change, not an authoring one.
  - **どう IS here** (L9, CEJC #60) as VOCABULARY rather than a rule card —
    the registry has no grammar point for it and inv 42 forbids inventing
    one.

  CONNECTIVES (inv 13): から/ので/けど and て-linking are not taught until
  m16/m14, so this module ramps complexity by STACKING what it owns —
  possessive + prenominal adjective + predicate adjective + tense
  (きのう ミカの ふるい いえは しずかだった) — rather than by clause-linking.
  Nothing here uses そう/この/その/あの (kono-sono-ano-dono is m17) or でも.

grammarPoints:
  - id: i-adj-present
    rule: "An い-adjective is ALREADY a sentence. たかい does not mean 'expensive', it means 'is-expensive' — ほんは たかい。 is complete and there is nothing to add. Put it straight in front of a noun and it needs no glue either: ちいさい ねこ. The one thing an い-adjective never takes is だ; だ finishes NOUNS."
    examples:
      - { ja: "ほんは たかい。", en: "The book is expensive." }
      - { ja: "パンは やすい。", en: "The bread is cheap." }
      - { ja: "ねこは ちいさい。", en: "The cat is small." }
      - { ja: "ちいさい ねこ", en: "a small cat" }
      - { ja: "いい ひと", en: "a good person" }
    antiPattern: { ja: "ほんは たかいだ。", why: "たかい is already the whole predicate — an い-adjective never takes だ" }
  - id: i-adj-negative
    rule: "To say an い-adjective is NOT true, drop the final い and add くない: たかい → たかくない. The adjective conjugates on its own, exactly like a verb, and still takes no だ. One rebel: いい has a different stem — よくない, never いくない."
    examples:
      - { ja: "ほんは たかくない。", en: "The book isn't expensive." }
      - { ja: "やまは おおきくない。", en: "The mountain isn't big." }
      - { ja: "ごはんは おいしくない。", en: "The rice isn't delicious." }
      - { ja: "くるまは あたらしくない。", en: "The car isn't new." }
      - { ja: "うたは おもしろくない。", en: "The song isn't interesting." }
      - { ja: "みせは よくない。", en: "The shop isn't good." }
    antiPattern: { ja: "ほんは たかいじゃない。", why: "じゃない finishes nouns — an い-adjective drops its い for くない: たかくない" }
    # Ramp scope (inv 37): the three forms the transform can emit —
    # たかくない, おおきくない, おいしくない — are all example lines above, and
    # so are the two that carry no verbClass.
    conjugation: { form: negative, classes: [i-adj] }
  - id: i-adj-past
    rule: "The past of an い-adjective is かった: drop い, add かった. たかい → たかかった. Nouns take だった and verbs take た; an adjective makes its own past and never borrows the copula. The rebel again: いい → よかった."
    examples:
      - { ja: "ほんは たかかった。", en: "The book was expensive." }
      - { ja: "やまは おおきかった。", en: "The mountain was big." }
      - { ja: "ごはんは おいしかった。", en: "The rice was delicious." }
      - { ja: "いえは ふるかった。", en: "The house was old." }
      - { ja: "かさは やすかった。", en: "The umbrella was cheap." }
      - { ja: "きのうは よかった。", en: "Yesterday was good." }
    antiPattern: { ja: "ほんは たかいだった。", why: "だった is the NOUN past — an い-adjective drops its い for かった: たかかった" }
    conjugation: { form: past, classes: [i-adj] }
  - id: i-adj-past-negative
    rule: "The last cell stacks the two you already own: くない for 'not', かった for 'was'. Drop い, add くなかった — たかい → たかくなかった, いい → よくなかった. That closes the table: たかい・たかくない・たかかった・たかくなかった, four cells and not a だ in sight."
    examples:
      - { ja: "ほんは たかくなかった。", en: "The book wasn't expensive." }
      - { ja: "やまは おおきくなかった。", en: "The mountain wasn't big." }
      - { ja: "ごはんは おいしくなかった。", en: "The rice wasn't delicious." }
      - { ja: "うたは おもしろくなかった。", en: "The song wasn't interesting." }
      - { ja: "きのうは よくなかった。", en: "Yesterday wasn't good." }
    antiPattern: { ja: "ほんは たかくないでした。", why: "です never carries the past for an adjective — the adjective itself becomes たかくなかった" }
    conjugation: { form: past-negative, classes: [i-adj] }
  - id: na-adj-present
    rule: "A な-adjective is really a NOUN. It cannot predicate on its own, so it borrows the copula exactly like ねこだ: げんきだ. Put it in FRONT of a noun and it takes な — げんきな ひと. That な is the whole reason for the name, and it is the only place the two classes look different: an い-adjective needs nothing there (おおきい いえ)."
    examples:
      - { ja: "ミカは げんきだ。", en: "Mika is well." }
      - { ja: "きょうは ひまだ。", en: "Today is a free day." }
      - { ja: "げんきな ひと", en: "a healthy person" }
      - { ja: "おおきい いえ", en: "a big house" }
    antiPattern: { ja: "ミカは げんきな。", why: "な only appears in FRONT of a noun — standing as the predicate it is げんきだ" }
  - id: na-adj-negative
    rule: "Because a な-adjective is a noun, its negative is the NOUN negative: だ becomes じゃない. しずかだ → しずかじゃない. Nothing drops and nothing changes shape — じゃない simply replaces だ, and it does the same job on plain nouns (ねこじゃない). Never くない: that ending belongs to い-adjectives."
    examples:
      - { ja: "いえは しずかじゃない。", en: "The house isn't quiet." }
      - { ja: "はなは きれいじゃない。", en: "The flowers aren't pretty." }
      - { ja: "えきは にぎやかじゃない。", en: "The station isn't lively." }
      - { ja: "それは ねこじゃない。", en: "That isn't a cat." }
    antiPattern: { ja: "いえは しずかくない。", why: "しずか is a な-adjective — it takes じゃない; くない belongs to い-adjectives" }
  - id: na-adj-past
    rule: "Same story in the past. A な-adjective borrows the noun's copula, so it borrows だった too: しずかだった. The negative past stacks the same way — じゃない becomes じゃなかった: きれいじゃなかった. You already own both endings from ねこだった; nothing new is being learned here, only spent."
    examples:
      - { ja: "みせは しずかだった。", en: "The shop was quiet." }
      - { ja: "えきは にぎやかだった。", en: "The station was lively." }
      - { ja: "いえは きれいじゃなかった。", en: "The house wasn't clean." }
      - { ja: "きのうは ひまじゃなかった。", en: "Yesterday wasn't a free day." }
    antiPattern: { ja: "みせは しずかかった。", why: "かった is the い-adjective past — a な-adjective borrows the noun's だった" }

newAtoms:
  # ══ L1 — the い-adjective set. たかい and やすい are NOT here: m11 already
  #    taught both, and re-declaring やすい would re-image it (inv 44).
  - { kana: おおきい, romaji: ookii, gloss: "big", imageable: true, kind: vocab }
  - { kana: おいしい, romaji: oishii, gloss: "delicious", imageable: true, kind: vocab }
  - { kana: あたらしい, romaji: atarashii, gloss: "new", imageable: true, kind: vocab }
  - { kana: ふるい, romaji: furui, gloss: "old (of things)", shortGloss: "old", imageable: true, kind: vocab }
  - { kana: おもしろい, romaji: omoshiroi, gloss: "interesting", imageable: true, kind: vocab }
  # No emoji in the registry for either of these two, so both debut on the L1
  # rule card instead of a picture MCQ (inv 30 binds IMAGEABLE atoms only).
  - { kana: ちいさい, romaji: chiisai, gloss: "small", imageable: false, kind: vocab }
  - { kana: いい, romaji: ii, gloss: "good", imageable: false, kind: vocab }
  # ══ L2 — くない. Order matters: the ramp takes the FIRST THREE in-scope
  #    entries of this list, so the three drilled are the three the
  #    i-adj-negative card spells out. The rest carry no verbClass at all,
  #    which is what keeps them out of ramp material entirely.
  - { kana: たかくない, romaji: takakunai, gloss: "isn't expensive", imageable: false, kind: adj-form, derivedFrom: たかい, verbClass: i-adj }
  - { kana: おおきくない, romaji: ookikunai, gloss: "isn't big", imageable: false, kind: adj-form, derivedFrom: おおきい, verbClass: i-adj }
  - { kana: おいしくない, romaji: oishikunai, gloss: "isn't delicious", imageable: false, kind: adj-form, derivedFrom: おいしい, verbClass: i-adj }
  - { kana: あたらしくない, romaji: atarashikunai, gloss: "isn't new", imageable: false, kind: adj-form, derivedFrom: あたらしい }
  - { kana: おもしろくない, romaji: omoshirokunai, gloss: "isn't interesting", imageable: false, kind: adj-form, derivedFrom: おもしろい }
  - { kana: よくない, romaji: yokunai, gloss: "isn't good", imageable: false, kind: adj-form, derivedFrom: いい }
  # ══ L3 — かった
  - { kana: たかかった, romaji: takakatta, gloss: "was expensive", imageable: false, kind: adj-form, derivedFrom: たかい, verbClass: i-adj }
  - { kana: おおきかった, romaji: ookikatta, gloss: "was big", imageable: false, kind: adj-form, derivedFrom: おおきい, verbClass: i-adj }
  - { kana: おいしかった, romaji: oishikatta, gloss: "was delicious", imageable: false, kind: adj-form, derivedFrom: おいしい, verbClass: i-adj }
  - { kana: ふるかった, romaji: furukatta, gloss: "was old", imageable: false, kind: adj-form, derivedFrom: ふるい }
  - { kana: やすかった, romaji: yasukatta, gloss: "was cheap", imageable: false, kind: adj-form, derivedFrom: やすい }
  - { kana: おもしろかった, romaji: omoshirokatta, gloss: "was interesting", imageable: false, kind: adj-form, derivedFrom: おもしろい }
  - { kana: よかった, romaji: yokatta, gloss: "was good", imageable: false, kind: adj-form, derivedFrom: いい }
  # ══ L4 — くなかった
  - { kana: たかくなかった, romaji: takakunakatta, gloss: "wasn't expensive", imageable: false, kind: adj-form, derivedFrom: たかい, verbClass: i-adj }
  - { kana: おおきくなかった, romaji: ookikunakatta, gloss: "wasn't big", imageable: false, kind: adj-form, derivedFrom: おおきい, verbClass: i-adj }
  - { kana: おいしくなかった, romaji: oishikunakatta, gloss: "wasn't delicious", imageable: false, kind: adj-form, derivedFrom: おいしい, verbClass: i-adj }
  - { kana: おもしろくなかった, romaji: omoshirokunakatta, gloss: "wasn't interesting", imageable: false, kind: adj-form, derivedFrom: おもしろい }
  - { kana: よくなかった, romaji: yokunakatta, gloss: "wasn't good", imageable: false, kind: adj-form, derivedFrom: いい }
  # ══ L5 — the な-adjective set. げんき / ひま / だいじょうぶ / だめ are prior
  #    and carry the rule card so these four can keep their picture debuts.
  - { kana: しずか, romaji: shizuka, gloss: "quiet", imageable: true, kind: vocab }
  - { kana: きれい, romaji: kirei, gloss: "pretty, clean", shortGloss: "pretty", imageable: true, kind: vocab }
  - { kana: にぎやか, romaji: nigiyaka, gloss: "lively, bustling", shortGloss: "lively", imageable: true, kind: vocab }
  - { kana: ゆうめい, romaji: yuumei, gloss: "famous", imageable: true, kind: vocab }
  # ══ L6/L7 — the copula's other two cells. Registered in courseAtoms beside
  #    m11's だった/でした for the same mechanical reason: without them the
  #    tokenizer cannot split しずかじゃない and the tile bank cannot spell it.
  - { kana: じゃない, romaji: janai, gloss: "isn't (noun or な-adjective)", shortGloss: "isn't", imageable: false, kind: grammar-chunk }
  - { kana: じゃなかった, romaji: janakatta, gloss: "wasn't (noun or な-adjective)", shortGloss: "wasn't", imageable: false, kind: grammar-chunk }
  # ══ L9
  - { kana: どう, romaji: dou, gloss: "how, what's it like", shortGloss: "how", imageable: false, kind: vocab }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m12-neo-1
    role: teaching
    title: "たかい already says \"is\""
    focus: "an い-adjective is a complete predicate — no だ — and attaches straight onto a noun"
    introduces: [おおきい, おいしい, あたらしい, ふるい, おもしろい, ちいさい, いい]
    beats:
      - { kind: rule, grammarPointId: i-adj-present }
      - { kind: sentence, ja: "やまは おおきい。", en: "Say to a friend: The mountain is big", exercises: [wa-topic, i-adj-present], mode: build }
      - { kind: sentence, ja: "ねこは ちいさい。", en: "Say to a friend: The cat is small", exercises: [wa-topic, i-adj-present], mode: build }
      - { kind: sentence, ja: "ごはんは おいしい。", en: "Say to a friend: The rice is delicious", exercises: [wa-topic, i-adj-present], mode: build }
      - { kind: sentence, ja: "くるまは あたらしい。", en: "The car is new", exercises: [wa-topic, i-adj-present], mode: listening }
      - { kind: sentence, ja: "ほんは おもしろい。", en: "Say to a friend: The book is interesting", exercises: [wa-topic, i-adj-present], mode: build }
      - { kind: sentence, ja: "ふるい いえに いく。", en: "Say to a friend: I'm going to an old house", exercises: [i-adj-present, ni-location], mode: build }
      - { kind: sentence, ja: "いい ともだちが いる。", en: "Say to a friend: I have a good friend", exercises: [i-adj-present, ga-existence, imasu], mode: build }
      - { kind: sentence, ja: "おおきい かさを かう。", en: "Say to a friend: I'll buy a big umbrella", exercises: [i-adj-present, wo-object], mode: build }
      - { kind: particle-cloze, stem: "やまは ", tail: "。", answer: "おおきい", options: ["おおきい", "ちいさい", "おいしい"], en: "The mountain is big", explanation: "おおきい is the whole predicate — nothing goes after it and nothing goes between it and は." }
      - { kind: listening-comp, audio: "おおきい ふねが ある。", answer: "There's a big boat", distractors: ["There's a small boat", "There's a new car", "The boat is old"], exercises: [i-adj-present, ga-existence, arimasu] }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "じてんしゃは あたらしい？", en: "Is the bicycle new?" }
          - { speaker: "Tom", ja: "うん、あたらしい。ちょっと たかい。", en: "Yeah, it's new. It's a bit pricey." }
        questions:
          - { q: "What does Tom say about the bicycle?", options: ["New and a bit pricey", "Old and cheap", "New and cheap", "Old and pricey"], answer: "New and a bit pricey" }
      - { kind: challenge, ja: "ミカの あたらしい じてんしゃは おおきい。", en: "Say to a friend: Mika's new bicycle is big", combines: [no-possession, wa-topic, i-adj-present], mode: build }
    reviewPool: [やま, ねこ, ごはん, くるま, いえ, かさ, ともだち, ふね, じてんしゃ, ほん]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m12-neo-2
    role: teaching
    title: "くない — the adjective says no"
    focus: "drop い, add くない; the adjective conjugates by itself, and いい is the rebel"
    introduces: [たかくない, おおきくない, おいしくない, あたらしくない, おもしろくない, よくない]
    beats:
      - { kind: rule, grammarPointId: i-adj-negative }
      - { kind: sentence, ja: "ほんは たかくない。", en: "Say to a friend: The book isn't expensive", exercises: [wa-topic, i-adj-negative], mode: build }
      - { kind: sentence, ja: "やまは おおきくない。", en: "Say to a friend: The mountain isn't big", exercises: [wa-topic, i-adj-negative], mode: build }
      - { kind: sentence, ja: "ちゃは おいしくない。", en: "Say to a friend: The tea isn't delicious", exercises: [wa-topic, i-adj-negative], mode: build }
      - { kind: sentence, ja: "じてんしゃは あたらしくない。", en: "The bicycle isn't new", exercises: [wa-topic, i-adj-negative], mode: listening }
      - { kind: sentence, ja: "うたは おもしろくない。", en: "Say to a friend: The song isn't interesting", exercises: [wa-topic, i-adj-negative], mode: build }
      - { kind: sentence, ja: "みせは よくない。", en: "The shop isn't good", exercises: [wa-topic, i-adj-negative], mode: listening }
      - { kind: sentence, ja: "やすい かさは おおきくない。", en: "Say to a friend: The cheap umbrella isn't big", exercises: [i-adj-present, wa-topic, i-adj-negative], mode: build }
      - { kind: particle-cloze, stem: "ごはんは ", tail: "。", answer: "おいしくない", options: ["おいしくない", "おいしい", "おおきくない"], en: "The rice isn't delicious", explanation: "Drop the final い and add くない — おいしい becomes おいしくない." }
      - { kind: listening-comp, audio: "いぬは おおきくない。", answer: "The dog isn't big", distractors: ["The dog is big", "The cat isn't big", "The dog isn't new"], exercises: [wa-topic, i-adj-negative] }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "ほんは たかい？", en: "Is the book expensive?" }
          - { speaker: "Tom", ja: "ううん、たかくない。おもしろくない。", en: "Nope, it isn't expensive. It isn't interesting." }
        questions:
