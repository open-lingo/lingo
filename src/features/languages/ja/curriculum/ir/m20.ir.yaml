  - id: m20-neo-8
    role: teaching
    title: "「どっちも たかいけど」 — both are, but one is more"
    focus: "も on both halves says 'both'; けど then lets you pick the winner"
    introduces: []
    beats:
      - { kind: rule, grammarPointId: mo-also }
      - { kind: sentence, ja: "でんしゃも バスも たかいけど でんしゃの ほうが たかい。", en: "The train and the bus are both expensive, but the train is the more expensive one", exercises: [mo-also, kedo, yori-comparison], mode: build }
      - { kind: sentence, ja: "すしも とりにくも おいしいけど すしの ほうが すきだ。", en: "Sushi and chicken are both delicious, but sushi is the one I like more", exercises: [mo-also, kedo, na-adj-present], mode: build }
      - { kind: sentence, ja: "どっちも たかい。", en: "Both are expensive", exercises: [mo-also], mode: build }
      - { kind: sentence, ja: "としょかんも きっさてんも しずかだ。", en: "The library and the coffee shop are both quiet", exercises: [mo-also, na-adj-present], mode: listening }
      - { kind: sentence, ja: "えいがも おんがくも おもしろいけど えいがの ほうが すきだ。", en: "Films and music are both interesting, but films are what I like more", exercises: [mo-also, kedo, na-adj-present], mode: build }
      - { kind: sentence, ja: "この かさも あの かさも ごひゃくえんだ。", en: "This umbrella and that umbrella are both 500 yen", exercises: [mo-also, numbers-100-10000], mode: build }
      - { kind: sentence, ja: "たまごも きゅうりも やすいから みせで かう。", en: "Eggs and cucumbers are both cheap, so I'll buy them at the shop", exercises: [mo-also, kara-because, de-action], mode: build }
      - { kind: sentence, ja: "きょうも あしたも じかんが ある。", en: "I have time both today and tomorrow", exercises: [mo-also, ga-existence, arimasu], mode: build }
      - { kind: sentence, ja: "どっちも たかい。", en: "Say to a friend: Both are expensive", exercises: [mo-also], mode: translate }
      # Content-word cloze, not a particle one: も was introduced in m3, so a
      # true particle cloze on it would be a REVIEW use of the type — banned by
      # inv 5 and by particleClozePlacement's ratchet. The frame still shows
      # both も, which is the shape the lesson is about.
      - { kind: particle-cloze, stem: "でんしゃも ", tail: "も たかい。", answer: "バス", options: ["バス", "ちかてつ", "じてんしゃ"], en: "The train and the bus are both expensive", explanation: "バス is the bus — and notice も sits on BOTH halves, which is what makes it 'both … and …' rather than 'the train too'. ちかてつ is the subway and じてんしゃ a bike." }
      - { kind: listening-comp, audio: "すしも とりにくも おいしいけど すしの ほうが すきだ。", answer: "Sushi and chicken are both delicious, but sushi is the one I like more", distractors: ["Sushi and chicken are both delicious, but chicken is the one I like more", "Sushi is delicious, but chicken isn't", "Sushi and chicken are both expensive, but I like sushi more"], exercises: [mo-also, kedo] }
      - { kind: listening-comp, audio: "この かさも あの かさも ごひゃくえんだ。", answer: "This umbrella and that umbrella are both 500 yen", distractors: ["This umbrella is 500 yen, but that one isn't", "This umbrella and that umbrella are both 900 yen", "This umbrella and that bag are both 500 yen"], exercises: [mo-also, numbers-100-10000] }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "この くつと あの くつと どっちが やすい？", en: "Which is cheaper, these shoes or those shoes?" }
          - { speaker: "Tom", ja: "どっちも さんぜんえんだ。でも この くつの ほうが あたらしい。", en: "They're both 3,000 yen. But these shoes are the newer ones." }
        questions:
          - { q: "What does Tom say about the two pairs of shoes?", options: ["They cost the same", "These shoes are cheaper", "Those shoes are cheaper", "He doesn't know the price"], answer: "They cost the same" }
      - { kind: challenge, ja: "たまごも ももも ごこ あるけど ももの ほうが たまごより たかい。", en: "There are five eggs and five peaches, but peaches are more expensive than eggs", combines: [mo-also, counter-ko, kedo, yori-comparison], mode: build }
    reviewPool: [でんしゃ, バス, すし, とりにく, えいが, おんがく, かさ, くつ, たまご, じかん]

