      - { kind: sentence, ja: "すしの ほうが パンより たかいけど すしを たべる。", en: "Sushi is more expensive than bread, but I'll eat sushi", exercises: [yori-comparison, kedo, wo-object], mode: build }
      - { kind: particle-cloze, stem: "この かばんは あの かばん", tail: " おおきい。", answer: "より", options: ["より", "を", "から"], en: "This bag is bigger than that bag", explanation: "より marks the one that loses. を marks a thing you act on, and から would make the other bag a starting point." }
      - { kind: sentence, ja: "じてんしゃの ほうが くるまより やすいから じてんしゃを かう。", en: "A bike is cheaper than a car, so I'll buy a bike", exercises: [yori-comparison, kara-because, wo-object], mode: build }
      - { kind: listening-comp, audio: "としょかんは びょういんより ちかいから あるく。", answer: "The library is closer than the hospital, so I'll walk", distractors: ["The hospital is closer than the library, so I'll walk", "The library is farther than the hospital, so I'll take the bus", "The library is closer than the station, so I'll walk"], exercises: [wa-topic, kara-because] }
      - { kind: sentence, ja: "えいがと おんがくと どっちが おもしろい？", en: "Which is more interesting, films or music", exercises: [to-and], mode: build }
      - { kind: sentence, ja: "バスの ほうが やすい。", en: "Say to a friend: The bus is the cheaper one", exercises: [yori-comparison], mode: translate }
      - { kind: listening-comp, audio: "ミカの けいたいの ほうが わたしの けいたいより あたらしい。", answer: "Mika's phone is newer than mine", distractors: ["My phone is newer than Mika's", "Mika's phone is more expensive than mine", "Mika's phone is older than mine"], exercises: [yori-comparison, no-possession] }
      - { kind: sentence, ja: "だいがくは きっさてんより とおいけど あるく。", en: "The university is farther than the coffee shop, but I'll walk", exercises: [wa-topic, kedo], mode: build }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "じてんしゃと でんしゃと どっちが やすい？", en: "Which is cheaper, a bike or the train?" }
          - { speaker: "Mika", ja: "じてんしゃの ほうが やすい。でも でんしゃの ほうが すきだ。", en: "The bike is the cheaper one. But the train is the one I like more." }
        questions:
          - { q: "Which does Mika prefer?", options: ["The train", "The bike", "Neither of them", "She doesn't say"], answer: "The train" }
    reviewPool: [でんしゃ, バス, ちかてつ, えき, がっこう, としょかん, かばん, けいたい, ちかい, とおい]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m20-neo-4
    role: teaching
    title: "「さんびゃくえん」 — hundreds, and the three that change sound"
    focus: "Number + ひゃく, except 300, 600 and 800 — さんびゃく, ろっぴゃく, はっぴゃく"
    introduces: [さんびゃく, ろっぴゃく, はっぴゃく]
    beats:
      - { kind: rule, grammarPointId: numbers-100-10000 }
      - { kind: sentence, ja: "この じしょは ろっぴゃくえんだ。", en: "This dictionary is 600 yen", exercises: [numbers-100-10000, desu-copula], mode: build }
      - { kind: sentence, ja: "きっぷは はっぴゃくえんだから かわない。", en: "The ticket is 800 yen, so I won't buy it", exercises: [numbers-100-10000, kara-because, nai-form], mode: build }
      - { kind: sentence, ja: "この ぼうしは ごひゃくえんだ。", en: "This hat is 500 yen", exercises: [numbers-100-10000, desu-copula], mode: build }
      - { kind: sentence, ja: "あの かばんは さんびゃくえんだ。", en: "That bag is 300 yen", exercises: [numbers-100-10000, kono-sono-ano-dono], mode: listening }
      - { kind: sentence, ja: "この えんぴつは ひゃくえんだけど あの えんぴつは よんひゃくえんだ。", en: "This pencil is 100 yen, but that pencil is 400 yen", exercises: [numbers-100-10000, kedo], mode: build }
