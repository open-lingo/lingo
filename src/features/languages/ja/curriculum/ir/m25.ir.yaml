notes: |
  m25 = spine tile n13, "Conjecture: でしょう/だろう + weather". The tile's own
  words: "でしょう production; casual production targets でしょ(う)/かな — だろう
  is RECOGNITION + the 何だろう self-talk pattern only (audit: sentence-final
  だろう to a listener is blunt/masculine, not a neutral register twin)";
  "たぶん (#87) un-blocked as vocab; きっと drips"; "Weather/seasons domain";
  "⟳ deepen of n08's clause-embedding".

  THE WHOLE POINT — でしょう is a SENTENCE-ENDER, not a verb ending. It sits
  behind a finished plain sentence and downgrades it from a claim to an
  expectation. That is why the module can teach it in three cheap rungs
  instead of a conjugation table:

  1. **After a NOUN or a な-adjective, the だ disappears.** 「あめだ」 → 「あめ
     でしょう」. Nothing else moves.
  2. **After an い-adjective, nothing happens at all** — an い-adjective is
     already a whole sentence, so 「さむい」 → 「さむいでしょう」.
  3. **After a VERB, nothing happens either** — the dictionary form and the
     plain past both take it as they stand: 「ふるでしょう」, 「たべたでしょう」.

  One rule stated three ways, which is exactly the shape m24 used for the
  potential and m12 used for the two adjective classes.

  **THE MODULE IS DELIBERATELY NOT A CERTAINTY LADDER.** m43 (spine n4-14)
  owns that: かもしれない < でしょう/だろう < はず < にちがいない, introduced
  PAIRWISE with でしょう as the hub, and spine-n4 §1.1 files m25 as the
  DEEPEN target. So はず, かもしれない and にちがいない appear nowhere here, not
  even as recognition — pre-empting them would spend m43's contrast material
  and leave the learner with four half-taught rungs instead of one solid one.
  What m25 ships is the m25 rung and its two neighbours in REGISTER (だろう
  below, でしょ beside), plus the two adverbs that agree with it.

  **だろう IS RECOGNITION, and the ONE production carve-out is 何だろう.** The
  spine's audit note is the reason and it is a real one: sentence-final だろう
  aimed at a listener reads blunt and markedly masculine, so a course that
  teaches it as "the plain twin of でしょう" hands the learner a form that will
  make them sound rude in half the rooms they enter. But だろう after a QUESTION
  WORD is different — 「なんだろう」, 「だれだろう」 — because there is no listener:
  it is thinking out loud, and it is everywhere. So the module produces
  question-word + だろう and only ever HEARS the sentence-final kind, exactly as
  m24 produced たべられる and only heard たべれる. Machine-checked in
  `m25-neo.test.ts`.

  **かな is the casual production target the spine asks for, and it is not a
  question.** 「あした あめかな。」 is the speaker wondering at themselves; the
  listener is welcome to answer but was not asked. That distinction is the
  whole reason it sits beside でしょう rather than beside か — and it is why
  every かな gloss in this module is "I wonder …", never "Is it …?".

  **でしょ is でしょう with the tail clipped, and its rising contour is a
  different speech act.** 「あついでしょ？」 hands the thought to the listener and
  asks them to agree — "it's hot, right?" — which is the single most common
  casual use of the form. Falling でしょ is just casual 「でしょう」. The card
  states both; every GRADED でしょ surface in the module is the rising one, so
  no gloss has to carry two meanings at once.

  **⟳ THE n08 DEEPEN IS L11 AND IT IS A CONTRAST, NOT A REHASH.** 〜と おもう
  says WHOSE view it is (yours); でしょう says HOW SURE the claim is and invites
  the listener to share the judgement. The forecast says でしょう and never
  とおもう. The card's antiPattern is 「ふるでしょうと おもう」, which is wrong for
  m18's OWN reason — politeness never goes inside a quotation, the rule that
  made 「たべますと おもう」 wrong — so the deepen pays m18 back rather than
  merely citing it.

  Shape: 13 lessons = 9 teaching + 3 review + 1 challenge, reviews at the
  first/middle/last thirds, challenge lesson LAST (inv 25). NO katakana rows
  (the programme ended at m11). NO `kind: register` beats — that machinery is
  m10 + m29 only (registerScaffoldIsolation), and this module's register work
  (でしょう neutral / でしょ casual / だろう blunt) is done in card prose and
  ordinary "Say to a friend:" cues per inv 8. NO kanji beats — kanji-set-3 is
  m28's ledger row, not m25's.

  DEVIATIONS + DECISIONS, documented per the RUN-PLAN "decide and document" rule:

  - **NO SPINE DEVIATION.** Every item on tile n13 ships: でしょう production
    (L1-L3), casual でしょ (L10) and かな (L7), だろう as recognition plus the
    何だろう self-talk pattern (L9), たぶん and きっと (L6), the weather/seasons
    domain (L1-L5), and the n08 deepen (L11). The ledger row is ONE id,
    `deshou`, and it is cleared on L1's rule card.
  - **SIX GRAMMAR-POINT IDS ARE IR-LOCAL, and this is a registry HOLE rather
    than an invented vocabulary.** `n5-grammar-points.json` holds 103 points
    and exactly ONE of them is about conjecture: `deshou`. The spine splits
    that family into six teachable rungs, and inv 42 forbids inventing an id
    where the registry HAS one — it cannot require an id that does not exist.
    `deshou-adjective`, `deshou-verb`, `tabun-kitto`, `kana-wondering`,
    `darou` and `deshou-casual` are therefore declared in this IR's
    `grammarPoints[]`, the same move m24 made for the four potential-system
    points and m11 for `itsu-when`. The registry was deliberately NOT edited:
    adding shipped points with no authored pool would force new entries into
    `POOL_GAP_EXEMPTIONS`, a list whose own comment says it must shrink.
  - **TWO REGISTRY POINTS ARE RE-TAUGHT rather than re-assigned.** `ni-time`
    (m11) returns on L5 because a SEASON is a time noun and the は/に split is
    the thing a learner gets wrong about it — 「ふゆは さむい」 but 「ふゆに ゆきが
    ふる」. `to-omoimasu` (m18) returns on L11 as the spine's own ⟳ deepen beat.
    Neither ledger row moves; a re-teach is not a re-assignment (the m16
    ruling).
  - **FIVE NEW courseAtoms ROWS, every one checked against the whole live
    corpus first.** でしょう / でしょ / だろう / きっと occur in ZERO existing
    Japanese surfaces (the only でしょう hits in the repo are the hand-authored
    `ja-gpool-deshou-*` grammar-review clozes — a pool keyed to this very
    grammar point — plus English prose). **かな is the one that needed
    MEASURING rather than grepping**: the string sits inside 520 live surfaces
    — every いかない, every しずかな / にぎやかな, and さかな — so the question was
    whether the longest-match tokenizer can ever LAND on the か. It cannot:
    いかない (4) and さかな (3) are atoms that start earlier and win outright,
    and a な-adjective run tokenizes as しずか + な with the pointer already
    past the か. Verified by dumping every compiled tile in every IR module
    before and after adding the row — the diff was EMPTY, the same method m22
    used for its eleven registrations.
  - **THIRTEEN MORE ATOMS ARE DECLARED IN THIS IR ONLY** — てんき, はれ, くもり,
    あめ, ふる, あつい, すずしい, あたたかい, はる, なつ, あき, ふゆ, たぶん — because
    every one already has a courseAtoms row under a stale old-course m18/m8/m1
    tag and none of them is in any neo module's `priorVocab`. That is the
    m15-m24 provenance move: it adds nothing to the course-wide tokenizer and
    therefore cannot raise the m16-ので regression class.
  - **でしょう IS A BOUND ENDER and inv 41 is why it got checked before it got
    registered.** 「あめでしょう」 tiles as あめ + でしょう and 「さむいでしょう」 as
    さむい + でしょう — verified by dumping the compiled `tiles`, not by reading
    the tokenizer. The m24 ましょう trap (a bound suffix whose STEM is a
    registered noun — し 四, き 木, まち 町) cannot arise here, because what sits
    in front of でしょう is always a free word the learner already owns. でしょ
    (3) is safe beside でしょう (4) for the same longest-match reason いける was
    safe beside いけ.
  - **NO PAST-TENSE WEATHER VERB ANYWHERE.** 「ふった」 has no atom row and no
    lexicon here can spell it — `VERB_ENTRIES` does not carry ふる — so
    「ゆきが ふったでしょう」 tokenizes to a three-character unknown fragment and
    trips the `unbuildable` gate. The module's past-tense conjecture therefore
    rides REGISTERED past atoms only: たべた, みた, きいた, いった, だった. Every
    ない-form is likewise a registered atom (こない, いかない, わからない,
    たべない) — 「ふらない」 was authored into a first draft and rewritten out.
  - **FIVE ATOMS DEBUT ON A PICTURE and six deliberately do not**, and the
    emoji census is the reason rather than authorial taste. てんき ⛅, あめ 🌧️,
    あつい 🥵, すずしい 🍃 and はれ ☀️ each own their glyph inside this module's
    usable pool. The six that do not: **くもり ☁️ is そら's glyph** and そら is a
    MET word, **ふゆ ❄️ is ゆき's** and **はる 🌸 is はな's** — all three would
    draw a debut distractor the picture names equally well (the m19/m24
    ruling); **ふる 🌧️ is あめ's** and **あたたかい ☀️ is はれ's**, one module-new
    word each; and **なつ 🌻 / あき 🍂 are named by their own rule card** — a
    `kind: rule` beat compiles to a PINNED step ahead of the interleaved
    middle, so the seasons card would steal both debuts (the m20/m21 rule,
    m22's いたい/ねつ precedent). たぶん, きっと, かな, でしょう, でしょ and だろう
    have no referent a picture could name.
  - **NO BOUND ENDER SITS IN A `reviewPool`.** A pool entry feeds BOTH the
    closing match grid and the compiler's filler rotation, and the filler's
    third slot is a bare-word `speaking` step — so listing でしょう / でしょ /
    だろう / かな in a pool compiles to "Say: probably" with 「でしょう」 as the
    answer. For だろう that is a straight contradiction of the module's own
    card (the form is recognition except after a question word), and for the
    other three it is a bound ender torn off the sentence it exists to finish.
    m24 shipped exactly this as 「ましょう」 in its review-3 filler; m25 does not
    repeat it. The enders keep their SRS credit from the SENTENCES that carry
    them — `exercisedAtoms` resolves でしょう and だろう out of every build — so
    nothing is lost but the word card. Machine-checked in `m25-neo.test.ts`.
  - **NO PARTICLE_CLOZE ON A PARTICLE.** m25 introduces no particle, so a true
    particle cloze would be a REVIEW use of the type and inv 5 bans it. Every
    cloze here picks among CONTENT words — enders (でしょう / だった / でした),
    adjectives, verbs, adverbs and season nouns — and every option is a taught
    atom (inv 40). Frames carry no character name and never end on a bare だ
    (the m21/m22 findings): a cloze is harvested into the grammar-review deck,
    whose comprehensibility gate resolves every word through `courseAtoms`, and
    ミカ / トム / ケン / たなか have no rows.
  - **Clause boundaries are SPACES, never 、** — `moduleCompiler.clean()` strips
    、 with nothing in its place, so an authored comma compiles to a run-on
    build target AND a run-on TTS key.
  - **Gloss discipline (inv 17 + the m23 はいる incident).** でしょう is
    "probably" / "I expect" — never "will" (which claims certainty the form
    disclaims) and never "must" (which is はず, m43's rung). かな is "I wonder
    …", never "Is it …?". だろう glosses exactly as でしょう does, with the
    register noted in the English where a beat is teaching the contrast. Every
    ふる is "fall / rain / snow", never "drop". はれ is the NOUN "clear
    weather", so 「はれでしょう」 is "it'll probably be clear", not "it'll
    probably clear up" — nothing is changing state.
  - **CARRIER ROTATION (inv 27).** `node scripts/exposure-audit.mjs` names
    みせ ×259, ともだち ×243, ほん ×274, いる ×292, ごはん ×223, ください ×257,
    みず ×163, きのう ×201, あたらしい ×130, えき ×135, かった ×232, うみ ×226,
    いたい ×165, でんしゃ ×103 and きっさてん ×213 as the worst over-exposed
    carriers in the course; NONE of them carries a sentence here. A weather
    module's own gravity is あめ / さむい, which is its own kind of fatigue, so
    the conjecture beats deliberately run on non-weather carriers too — じかん,
    じゅぎょう, えいが, おんがく, しゃしん, りょこう, さんぽ, かさ, じてんしゃ, バス,
    ひこうき, ふね, くうこう, ホテル, としょかん, がっこう, だいがく, かいしゃ,
    びょういん, うち, いえ, まど, くるま, かぞく, あね, いもうと, すし, パン, おさけ,
    コーヒー, りょうり.
  - **Words the context pack lists as known but the compiler does not.** The
    pack is built from `courseAtoms` attribution and OVERSTATES. Verified
    against `priorVocab` (the compiler's truth) and either INTRODUCED here or
    AVOIDED: あめ, なつ, たぶん, ふる (all introduced), and こうえん, へや, そと,
    まち, ちかく, そば, えいご, はなし, にく, ノート, プール, ゆっくりと, あい,
    せっけん, ぴあの, ぱん, ぺん, どあ, あおい, しょうゆ, なく, おもい, いりぐち,
    へん, あまい, うるさい, あかい, いつつ, よっつ, かく, よむ, とる, うたう,
    おぼえる, でる, たつ, みがく, なる, さく, いちばん, はやい, いろ (all avoided —
    no neo module teaches them). The context pack's reinforcement-target list
    is almost entirely made of these, which is why it could not be spent.
  - **CONNECTIVES + COMPLEXITY (inv 13).** A bare conjecture is three tiles
    long — 「あめでしょう」 — which is precisely the flat texture GATE 7 exists to
    stop, and a weather module will produce nothing else if left alone. Nearly
    every production beat therefore carries a contrast or a reason on m16's
    けど / から, which is also how a forecast is actually spoken: you say what
    the morning will do in order to say what the evening will do.
  - **でしょう + から is BANNED.** 「ふるでしょうから」 is real Japanese and it is
    a different construction (a conjectured REASON), one the spine does not
    allocate here. Every から in this module hangs off a plain clause.

  ONE RULE CARD PER LESSON (m14's layout law): every teaching lesson carries
  exactly one, because two `kind: rule` beats compile to two PINNED, ADJACENT
  grammar_rule steps and fail the adjacency bar.

  NO CONJUGATION RAMPS. `conjugation:` on a grammar point compiles to
  `conjugationTransform`, whose `form` must be a `ChainForm`, and there is no
  conjecture cell in that type — nor should there be: でしょう is not a
  conjugation, it is a word that follows a finished sentence, which is the
  module's central claim. The attachment is drilled with clozes and builds.

grammarPoints:
  - id: deshou
    rule: "でしょう means probably, and it is not a verb ending — it is a word that stands BEHIND a finished sentence and changes what you are claiming with it. 「あしたは ゆきだ」 says tomorrow is snow, flatly, as a fact you are vouching for. 「あしたは ゆきでしょう。」 says you expect snow: it is how it looks from here, and you are not staking anything on it. That is the whole meaning. It is not the future — 「ゆきだ」 is already about tomorrow — and it is not obligation. Probably, I expect, I imagine. There is one mechanical thing to get right and it is the だ. A noun sentence needs だ to be a sentence at all, but でしょう does the finishing itself, so the だ goes: 「ゆきだ」 becomes 「ゆきでしょう」, never 「ゆきだでしょう」. Same for な-adjectives, which behave like nouns everywhere: 「しずかだ」 becomes 「しずかでしょう」. One more thing worth knowing before you use it. でしょう is the NEUTRAL form — it is what the weather forecast says, what a shop assistant says, what your friend says — so unlike ます it is not a politeness decision you have to make. Say it to anybody."
    examples:
      - { ja: "あしたは ゆきでしょう。", en: "It'll probably snow tomorrow." }
      - { ja: "あの ひとは せんせいでしょう。", en: "That person over there is probably a teacher." }
      - { ja: "きょうは やすみでしょう。", en: "Today's probably a day off." }
      - { ja: "これは ケンの かさでしょう。", en: "This is probably Ken's umbrella." }
      - { ja: "ミカは いま としょかんでしょう。", en: "Mika's probably at the library right now." }
    antiPattern: { ja: "あしたは ゆきだでしょう。", why: "でしょう finishes the sentence itself, so a noun drops its だ in front of it: あしたは ゆきでしょう。" }

  - id: deshou-adjective
    rule: "An い-adjective is already a whole sentence on its own — that has been true since module 12 — so でしょう attaches to it with nothing removed and nothing added. 「さむい」 becomes 「さむいでしょう」. 「おいしい」 becomes 「おいしいでしょう」. There is no い to drop, no だ to delete, no form to look up: you say the adjective and then you say でしょう. This is the easiest rung of the three and it is the one you will use most, because most of what anybody guesses about is what something is LIKE. な-adjectives go the other way and they go exactly the way nouns did in the last lesson: they need だ to be a sentence, でしょう does the finishing instead, so the だ disappears. 「しずかだ」 becomes 「しずかでしょう」, 「きれいだ」 becomes 「きれいでしょう」. So the question to ask yourself is the same one module 12 taught you: is this an い-adjective or a な-adjective? い-adjective, add でしょう. な-adjective, swap だ for でしょう. Nothing in this rule is new — only where you are pointing it."
    examples:
      - { ja: "あしたは さむいでしょう。", en: "It'll probably be cold tomorrow." }
      - { ja: "やまは とおいでしょう。", en: "The mountain's probably a long way off." }
      - { ja: "その えいがは おもしろいでしょう。", en: "That film's probably interesting." }
      - { ja: "としょかんは しずかでしょう。", en: "The library's probably quiet." }
      - { ja: "きょうは あたたかいでしょう。", en: "It's probably mild today." }
    antiPattern: { ja: "あしたは さむいだでしょう。", why: "an い-adjective is already a complete sentence and never takes だ — in front of でしょう or anywhere else: あしたは さむいでしょう。" }

  - id: deshou-verb
    rule: "The third rung is the one that looks hardest and is actually free: a plain verb takes でしょう exactly as it stands. 「ふる」 becomes 「ふるでしょう」. 「くる」 becomes 「くるでしょう」. Nothing is dropped, because a dictionary-form verb has been a complete sentence since module 5 and it never wanted a だ in the first place. The past works the same way — 「たべた」 becomes 「たべたでしょう」, they've probably eaten — and so does the negative: 「こない」 becomes 「こないでしょう」, they probably won't come. One verb is worth meeting here on its own account. ふる is what Japanese uses for anything that comes down out of the sky, and it takes the thing that falls as its subject with が: 「あめが ふる」, it rains; 「ゆきが ふる」, it snows. English needs two different verbs for those and Japanese needs one, which is why a forecast can say 「ゆきが ふるでしょう」 without ever mentioning weather. And くもり — cloud cover — is a NOUN, so it goes back to the first rung: 「あしたは くもりでしょう。」"
    examples:
      - { ja: "あした あめが ふるでしょう。", en: "It'll probably rain tomorrow." }
      - { ja: "ミカは あした じてんしゃで くるでしょう。", en: "Mika will probably come by bicycle tomorrow." }
      - { ja: "トムは もう すしを たべたでしょう。", en: "Tom's probably eaten the sushi already." }
      - { ja: "ケンは いそがしいから こないでしょう。", en: "Ken's busy, so he probably won't come." }
      - { ja: "あさは くもりでしょうけど ばんは ゆきが ふるでしょう。", en: "It'll probably be cloudy in the morning, but it'll probably snow in the evening." }
    antiPattern: { ja: "あした あめが ふるだでしょう。", why: "a verb is already a whole sentence and never takes だ — でしょう attaches to the dictionary form as it stands: あした あめが ふるでしょう。" }

  - id: ni-time
    rule: "The four seasons — はる spring, なつ summer, あき autumn, ふゆ winter — are ordinary nouns, and the particle you put on one decides what kind of sentence you are making. は TOPICS the season — you are about to say what it is LIKE: 「ふゆは さむい」, winter is cold. に says WHEN something happened or will happen: 「はるに さくらを みる」, I look at the cherry blossom in spring. That に is module 11's に and the rule has not changed a word: it goes on times you could point to on a calendar or a clock, and a season is exactly that kind of time. The trap is putting に on the first kind of sentence. 「ふゆに さむい」 is wrong, because nothing HAPPENS in it — cold is not an event, it is what winter is like, and そこ needs は. Test yourself with one question: is there a verb? If there is an event, に is available. If you are only describing the season, use は. Two small notes. なつ and なつやすみ are different words — one is the season, one is the holiday inside it. And the seasons pair naturally with everything you learned last module about comparing: 「なつは はるより あつい」."
    examples:
      - { ja: "ふゆは さむいでしょう。", en: "Winter's probably cold." }
      - { ja: "はるに やまで さくらを みる。", en: "I look at the cherry blossom on the mountain in spring." }
      - { ja: "はるは あたたかいでしょう。", en: "Spring's probably mild." }
      - { ja: "ふゆに やまで ゆきが ふるでしょう。", en: "It'll probably snow on the mountain in winter." }
      - { ja: "はるは いい てんきでしょう。", en: "The weather's probably nice in spring." }
    antiPattern: { ja: "ふゆに さむいでしょう。", why: "に marks WHEN something happens, and being cold is not an event — a season you are simply describing takes は: ふゆは さむいでしょう。" }

  - id: tabun-kitto
    rule: "Japanese likes to tell you how sure the speaker is before the sentence has finished, and it does it with an adverb at the front. たぶん is probably — it agrees with でしょう and the two travel together so often that 「たぶん あめでしょう」 sounds more natural than either half alone. きっと is the strong one: surely, definitely, I'm certain. 「きっと はれでしょう。」 The pair is worth learning together because they mark the two ends of the same scale and English blurs them — \"probably\" and \"surely\" both come out as \"I think\" half the time. Both are ADVERBS, so they take no particle at all and they sit at the FRONT, before the topic if there is one: 「たぶん あしたは あめでしょう」 or 「あしたは たぶん あめでしょう」, both fine, but never wedged in between the noun and でしょう. And they do not replace でしょう — the adverb says how sure you are, the ending says you are guessing, and a forecast wants both. One habit worth picking up now: たぶん is the single most common hedge in spoken Japanese, so if you are unsure whether to commit to something, put たぶん in front of it and you have said so."
    examples:
      - { ja: "あした たぶん あめでしょう。", en: "It'll probably rain tomorrow." }
      - { ja: "なつは きっと あついでしょう。", en: "Summer's definitely going to be hot." }
      - { ja: "ミカは たぶん こないでしょう。", en: "Mika probably won't come." }
      - { ja: "なつやすみは きっと たのしいでしょう。", en: "The summer holidays will definitely be fun." }
      - { ja: "たぶん あきは すずしいでしょう。", en: "Autumn's probably cool." }
    antiPattern: { ja: "あした あめ たぶん でしょう。", why: "たぶん is an adverb and sits in FRONT of the sentence — it can never come between the noun and でしょう: あした たぶん あめでしょう。" }

  - id: kana-wondering
    rule: "かな is what you say when you are wondering at yourself. 「あした あめかな。」 — I wonder if it'll rain tomorrow. It is built out of か, the question particle, and it keeps a little of か's shape, but it is NOT a question: nobody has been asked anything. You are turning the thought over out loud, and if the person beside you answers, that is them joining in rather than you addressing them. That is why the English is always I wonder — never Is it? Attachment is the same rule you have used all module. A noun or な-adjective drops its だ: 「あめだ」 → 「あめかな」. An い-adjective takes it as it stands: 「さむいかな」. A verb takes it as it stands: 「くるかな」. Where かな really earns its place is with a question word, because that is a wondering English has no short way to say: 「あの ひとは だれかな」 — I wonder who that is. 「じゅぎょうは なんじかな」 — I wonder what time the class is. It is casual, so keep it for friends and for yourself, and be careful of one thing: 「〜かな」 aimed straight at somebody can land as a hint that you want them to do something, which is a subtlety for later. Wonder out loud and you will always be safe."
    examples:
      - { ja: "あした あめかな。", en: "I wonder if it'll rain tomorrow." }
      - { ja: "あさは さむいかな。", en: "I wonder if it's cold in the morning." }
      - { ja: "ミカは くるかな。", en: "I wonder if Mika's coming." }
      - { ja: "あの ひとは だれかな。", en: "I wonder who that person is." }
      - { ja: "じゅぎょうは なんじかな。", en: "I wonder what time the class is." }
    antiPattern: { ja: "あした あめだかな。", why: "だ drops in front of かな exactly as it drops in front of でしょう: あした あめかな。" }

  - id: darou
    rule: "だろう is でしょう with the polite layer taken off, and this is the one place in the course where the plain form is NOT the one you produce. The reason is social rather than grammatical. Aimed at a listener, sentence-final だろう lands blunt and markedly masculine — 「あした あめだろう」 said to somebody has a flavour English can only spell as \"it'll rain, obviously\" — so a learner who reaches for it as the casual twin of でしょう will sound rude in rooms where they meant to sound relaxed. でしょう is neutral and でしょ is the casual one. Say those. You still need to UNDERSTAND だろう, because you will hear it constantly: in books, in songs, from men speaking casually, and in narration. So recognise it and let it mean exactly what でしょう means. There is ONE place you should use it, and you will use it every day. After a question word there is no listener at all — you are talking to yourself — and だろう is the natural ending for that: 「なんだろう。」 what IS that? 「だれだろう。」 who's that, I wonder? 「なんじだろう。」 what time is it, I wonder? Nobody has been addressed, so nothing can land blunt. Understand it everywhere, say it only to yourself."
    examples:
      - { ja: "これは なんだろう。", en: "What is this, I wonder?" }
      - { ja: "あの ひとは だれだろう。", en: "Who's that, I wonder?" }
      - { ja: "じゅぎょうは なんじだろう。", en: "What time's the class, I wonder?" }
      - { ja: "あした あめだろう。", en: "It'll probably rain tomorrow. — recognise it, but say あめでしょう" }
      - { ja: "あきは すずしいだろう。", en: "Autumn's probably cool. — recognise it, but say すずしいでしょう" }
    antiPattern: { ja: "これは なんだだろう。", why: "だろう already IS だ's conjecture form, so なん never keeps a だ of its own in front of it: これは なんだろう。" }

  - id: deshou-casual
    rule: "でしょ is でしょう with the tail clipped, and the shortening does what shortening always does in Japanese — it makes the sentence casual. 「あした あめでしょ。」 is 「あした あめでしょう。」 said to a friend. Attachment does not change: だ still disappears after a noun, an い-adjective still takes it bare. But でしょ has a second job that でしょう barely does, and it is the reason you will hear it forty times a day. Say it with a RISING contour and it stops being a guess and becomes an appeal: 「あついでしょ？」 — it's hot, right? You are not informing the listener and you are not really asking either; you are handing them a thought you are confident they share and inviting them to agree. English does this with a tag question — isn't it, right?, don't you think? — and Japanese does it with でしょ？. Two things follow. First, it only works when you genuinely expect agreement, so it is a warm move between friends and a pushy one with a stranger. Second, keep it out of polite conversation entirely: with a teacher or in a shop, the neutral でしょう is what you want."
    examples:
      - { ja: "あついでしょ？", en: "It's hot, right?" }
      - { ja: "その えいがは おもしろいでしょ？", en: "That film's interesting, right?" }
      - { ja: "あしたは やすみでしょ？", en: "Tomorrow's a day off, right?" }
      - { ja: "ミカは くるでしょ？", en: "Mika's coming, right?" }
      - { ja: "あした あめでしょ。", en: "It'll probably rain tomorrow. — falling, just casual でしょう" }
    antiPattern: { ja: "あついだでしょ？", why: "an い-adjective never takes だ, and でしょ attaches to it bare exactly as でしょう does: あついでしょ？" }

  - id: to-omoimasu
    rule: "You have had two ways to hedge since module 18 and it is time to say what the difference is, because English hides it. 〜と おもう says WHOSE opinion this is: yours. でしょう says HOW SURE the claim is, and it leaves the judgement open for the listener to share. 「あした あめが ふると おもう」 is my read on it. 「あした あめでしょう」 is how it looks — which is why the weather forecast says でしょう every single evening and never once says とおもう: a forecaster is not offering a personal opinion, they are reporting a likelihood. Use とおもう when the point is that it is YOUR view — 「その えいがは おもしろいと おもう」 — and でしょう when the point is that the thing is likely and anybody looking would say the same. There is a mechanical difference too, and it is a clean one to check yourself against: とおもう takes a complete plain sentence, so a noun KEEPS its だ — 「あめだと おもう」 — while でしょう does the finishing itself, so the noun LOSES it: 「あめでしょう」. Same noun, opposite treatment, because one is a quotation and the other is an ending."
    examples:
      - { ja: "あした あめが ふると おもう。", en: "I think it'll rain tomorrow." }
      - { ja: "あした あめでしょう。", en: "It'll probably rain tomorrow." }
      - { ja: "なつは あついと おもう。", en: "I think summer's hot." }
      - { ja: "ふゆは さむいでしょう。", en: "Winter's probably cold." }
      - { ja: "あしたは はれだと おもう。", en: "I think it'll be clear tomorrow." }
    antiPattern: { ja: "あした あめが ふるでしょうと おもう。", why: "でしょう is built on です and politeness never goes inside a quotation — module 18's rule, the one that made たべますと おもう wrong: あした あめが ふると おもう。" }

newAtoms:
  # ══ L1. The ender the whole module is about, plus the three weather nouns a
  #    forecast cannot be written without. でしょう was checked against the whole
  #    live corpus (ZERO Japanese surfaces contain it) before registration;
  #    てんき / はれ / あめ already have courseAtoms rows under stale m18/m1 tags
  #    and are declared here for PROVENANCE only — the m15-m24 move.
  - { kana: でしょう, romaji: deshou, gloss: "probably, I expect (conjecture)", shortGloss: "probably", imageable: false, kind: vocab }
  - { kana: てんき, romaji: tenki, gloss: "weather", shortGloss: "weather", kind: vocab }
  - { kana: はれ, romaji: hare, gloss: "clear weather, fine weather", shortGloss: "clear weather", kind: vocab }
  - { kana: あめ, romaji: ame, gloss: "rain", shortGloss: "rain", kind: vocab }
  # ══ L2. Temperature. あたたかい is imageable: false because ☀️ is はれ's glyph
  #    and はれ debuts one lesson earlier — a debut MCQ whose distractor pool
  #    holds a word the picture names equally well is the m19/m24 defect.
  - { kana: あつい, romaji: atsui, gloss: "hot", shortGloss: "hot", kind: vocab }
  - { kana: すずしい, romaji: suzushii, gloss: "cool, refreshing", shortGloss: "cool", kind: vocab }
  - { kana: あたたかい, romaji: atatakai, gloss: "warm, mild", shortGloss: "warm", imageable: false, kind: vocab }
  # ══ L3. The falling verb and the cloud noun. ふる is imageable: false because
  #    🌧️ belongs to あめ, which debuted in L1; くもり is imageable: false
  #    because ☁️ is そら's, and そら is a MET word.
  - { kana: ふる, romaji: furu, gloss: "to fall — of rain or snow", shortGloss: "to fall (rain)", imageable: false, kind: verb }
  - { kana: くもり, romaji: kumori, gloss: "cloudy weather", shortGloss: "cloudy", imageable: false, kind: vocab }
  # ══ L5. The seasons. なつ 🌻 and あき 🍂 own their glyphs, but the `ni-time`
  #    card NAMES はる and ふゆ and a rule card compiles to a PINNED step ahead of
  #    the interleaved middle — so all four are imageable: false rather than
  #    two of them silently losing a debut the compiler would have to place
  #    before a card that has already spoken. はる 🌸 is はな's glyph and ふゆ ❄️
  #    is ゆき's in any case, both MET words.
  - { kana: はる, romaji: haru, gloss: "spring (the season)", shortGloss: "spring", imageable: false, kind: vocab }
  - { kana: なつ, romaji: natsu, gloss: "summer", shortGloss: "summer", kind: vocab }
  - { kana: あき, romaji: aki, gloss: "autumn", shortGloss: "autumn", kind: vocab }
  - { kana: ふゆ, romaji: fuyu, gloss: "winter", shortGloss: "winter", imageable: false, kind: vocab }
  # ══ L6. The two certainty adverbs. たぶん already has a row (stale m18 tag,
  #    taught by no neo module); きっと had none and occurs in ZERO live
  #    surfaces, so registering it cannot re-tokenize anything.
  - { kana: たぶん, romaji: tabun, gloss: "probably, maybe", shortGloss: "probably", imageable: false, kind: vocab }
  - { kana: きっと, romaji: kitto, gloss: "surely, definitely", shortGloss: "surely", imageable: false, kind: vocab }
  # ══ L7. Wondering out loud. Two kana that sit inside 520 live surfaces —
  #    いかない, さかな, しずかな — so the row was MEASURED, not assumed: the
  #    whole-course tile dump was byte-identical before and after.
  - { kana: かな, romaji: kana, gloss: "I wonder ~ (thinking out loud)", shortGloss: "I wonder", imageable: false, kind: vocab }
  # ══ L9. RECOGNITION ONLY, except after a question word (spine n13's own
  #    carve-out: "だろう is RECOGNITION + the 何だろう self-talk pattern only").
  - { kana: だろう, romaji: darou, gloss: "probably (plain conjecture — mostly heard, not said)", shortGloss: "probably (plain)", imageable: false, kind: vocab }
  # ══ L10. The casual contraction. Safe beside でしょう for the same
  #    longest-match reason いける was safe beside いけ: 4 beats 3 at the same index.
  - { kana: でしょ, romaji: desho, gloss: "right? (casual でしょう, checking agreement)", shortGloss: "right?", imageable: false, kind: vocab }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m25-neo-1
    role: teaching
    title: "「あしたは あめでしょう」 — the ending a forecast is made of"
    focus: "でしょう after a noun: probably, and the だ that disappears"
    introduces: [てんき, はれ, あめ, でしょう]
    beats:
      - { kind: rule, grammarPointId: deshou }
      - { kind: sentence, ja: "あしたの てんきは はれでしょう。", en: "Tomorrow's weather will probably be clear", exercises: [deshou, no-possession, wa-topic], mode: build }
      - { kind: sentence, ja: "あさは あめでしょうけど ばんは はれでしょう。", en: "It'll probably rain in the morning, but the evening will probably be clear", exercises: [deshou, wa-topic, kedo], mode: build }
      - { kind: sentence, ja: "きょうは いい てんきでしょう。", en: "Today's probably nice weather", exercises: [deshou, wa-topic, i-adj-present], mode: build }
      - { kind: sentence, ja: "あの ひとは たなかせんせいでしょう。", en: "That person over there is probably Tanaka", exercises: [deshou, kono-sono-ano-dono], mode: build }
      - { kind: sentence, ja: "ミカは いま としょかんでしょう。", en: "Mika's probably at the library right now", exercises: [deshou, wa-topic], mode: listening }
      - { kind: sentence, ja: "きょうは いそがしいけど あしたは やすみでしょう。", en: "I'm busy today, but tomorrow's probably a day off", exercises: [deshou, kedo, wa-topic, i-adj-present], mode: build }
      - { kind: sentence, ja: "きょうは あめだけど あしたは ゆきでしょう。", en: "Today it's rain, but tomorrow it'll probably be snow", exercises: [deshou, wa-topic, kedo, desu-copula], mode: build }
      - { kind: sentence, ja: "あしたは あめでしょう。", en: "Tomorrow will probably be rain", exercises: [deshou], mode: translate }
      - { kind: particle-cloze, stem: "あしたの てんきは はれ", tail: "。", answer: "でしょう", options: ["でしょう", "だった", "でした"], en: "Tomorrow's weather will probably be clear", explanation: "でしょう says you EXPECT clear weather without claiming to know it. だった and でした both say it already WAS clear." }
      - { kind: listening-comp, audio: "あしたの てんきは あめでしょう。", answer: "Tomorrow's weather will probably be rain", distractors: ["Tomorrow's weather was rain", "Tomorrow's weather is definitely rain", "Today's weather is rain"], exercises: [deshou, no-possession] }
      - { kind: listening-comp, audio: "ミカは いま がっこうでしょう。", answer: "Mika's probably at school right now", distractors: ["Mika is at school right now", "Mika was at school", "Mika isn't at school right now"], exercises: [deshou, wa-topic] }
      - kind: dialogue
        lines:
          - { speaker: "Tom", ja: "あしたの てんきは？", en: "What's tomorrow's weather?" }
          - { speaker: "Mika", ja: "あめでしょう。かさを かう？", en: "Probably rain. Are you going to buy an umbrella?" }
        questions:
          - { q: "What does Mika expect tomorrow?", options: ["Rain", "Snow", "Clear weather", "She says she doesn't know"], answer: "Rain" }
      - { kind: challenge, ja: "きょうは いい てんきだけど あしたは あめでしょう。", en: "Today's nice weather, but tomorrow it'll probably rain", combines: [deshou, i-adj-present, kedo, wa-topic, desu-copula], mode: build }
    reviewPool: [ゆき, そら, かさ, やすみ, としょかん, がっこう, ばん, あさ, さむい, ほし]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m25-neo-2
    role: teaching
    title: "「さむいでしょう」 — adjectives take it bare"
    focus: "い-adjectives add でしょう unchanged; な-adjectives swap だ for it"
    introduces: [あつい, すずしい, あたたかい]
    beats:
      - { kind: rule, grammarPointId: deshou-adjective }
      - { kind: sentence, ja: "きょうは さむいけど あしたは あついでしょう。", en: "It's cold today, but tomorrow will probably be hot", exercises: [deshou-adjective, kedo, wa-topic, i-adj-present], mode: build }
      - { kind: sentence, ja: "あさは すずしいでしょうけど ばんは あついでしょう。", en: "The morning will probably be cool, but the evening will probably be hot", exercises: [deshou-adjective, kedo, wa-topic], mode: build }
      - { kind: sentence, ja: "この ホテルは たかいけど きれいでしょう。", en: "This hotel's expensive, but it's probably lovely", exercises: [deshou-adjective, na-adj-present, kedo, kono-sono-ano-dono], mode: build }
      - { kind: sentence, ja: "にほんの りょうりは おいしいでしょう。", en: "Japanese food is probably delicious", exercises: [deshou-adjective, no-possession, wa-topic], mode: build }
      - { kind: sentence, ja: "なつやすみは いそがしいけど たのしいでしょう。", en: "The summer holidays are busy, but they're probably fun", exercises: [deshou-adjective, kedo, i-adj-present], mode: listening }
      - { kind: sentence, ja: "ふるい いえは さむいでしょう。", en: "An old house is probably cold", exercises: [deshou-adjective, i-adj-present], mode: build }
      - { kind: sentence, ja: "やまは とおいけど まどから みえるでしょう。", en: "The mountain's far away, but you can probably see it from the window", exercises: [deshou-adjective, mieru-kikoeru, kedo, kara-origin], mode: build }
      - { kind: sentence, ja: "あしたは あたたかいでしょう。", en: "It'll probably be mild tomorrow", exercises: [deshou-adjective], mode: translate }
      - { kind: particle-cloze, stem: "あさは ", tail: "でしょうけど ばんは あついでしょう。", answer: "すずしい", options: ["すずしい", "あつい", "さむい"], en: "The morning will probably be cool, but the evening will probably be hot", explanation: "すずしい is the pleasant cool of an early morning. あつい is hot — the opposite half of this sentence — and さむい is properly cold." }
      - { kind: listening-comp, audio: "なつやすみは あついでしょう。", answer: "The summer holidays will probably be hot", distractors: ["The summer holidays were hot", "The summer holidays definitely won't be hot", "The summer holidays are busy"], exercises: [deshou-adjective, wa-topic] }
      - { kind: listening-comp, audio: "としょかんは しずかでしょう。", answer: "The library's probably quiet", distractors: ["The library is quiet", "The library was quiet", "The library probably isn't quiet"], exercises: [deshou-adjective, na-adj-present] }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "あしたも あついでしょう。", en: "Tomorrow will probably be hot too." }
          - { speaker: "Tom", ja: "うん。やまは すずしいでしょう。", en: "Yeah. The mountains will probably be cool, though." }
        questions:
          - { q: "What does Tom say about the mountains?", options: ["They'll probably be cool", "They'll probably be hot", "They'll probably be cold", "He has never been"], answer: "They'll probably be cool" }
      - { kind: challenge, ja: "きょうは すずしいけど なつやすみは やまも あついでしょう。", en: "It's cool today, but in the summer holidays even the mountains will probably be hot", combines: [deshou-adjective, kedo, wa-topic, mo-also, i-adj-present], mode: build }
    reviewPool: [てんき, はれ, あめ, ホテル, としょかん, りょうり, なつやすみ, いえ, やま, ゆき]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m25-neo-3
    role: teaching
    title: "「あめが ふるでしょう」 — verbs take it bare too"
    focus: "でしょう on a plain verb — dictionary, past and ない, all unchanged"
    introduces: [ふる, くもり]
    beats:
      - { kind: rule, grammarPointId: deshou-verb }
      - { kind: sentence, ja: "あしたの あさ ゆきが ふるでしょう。", en: "It'll probably snow tomorrow morning", exercises: [deshou-verb, no-possession, ga-existence], mode: build }
      - { kind: sentence, ja: "きょうは くもりだけど あした あめが ふるでしょう。", en: "It's cloudy today, but it'll probably rain tomorrow", exercises: [deshou-verb, wa-topic, kedo, desu-copula], mode: build }
      - { kind: sentence, ja: "ミカは じてんしゃで くるでしょう。", en: "Mika will probably come by bicycle", exercises: [deshou-verb, de-action, wa-topic], mode: build }
      - { kind: sentence, ja: "トムは もう すしを たべたでしょう。", en: "Tom's probably eaten the sushi already", exercises: [deshou-verb, ta-form, wo-object, mada-mou], mode: build }
      - { kind: sentence, ja: "ケンは いそがしいから こないでしょう。", en: "Ken's busy, so he probably won't come", exercises: [deshou-verb, nai-form, kara-because], mode: listening }
      - { kind: sentence, ja: "ばんは くもりでしょうけど あさは はれでしょう。", en: "The evening will probably be cloudy, but the morning will probably be clear", exercises: [deshou-verb, deshou, kedo, wa-topic], mode: build }
      - { kind: sentence, ja: "あめが ふるから ミカは かさを かうでしょう。", en: "It's going to rain, so Mika will probably buy an umbrella", exercises: [deshou-verb, ga-existence, kara-because, wo-object], mode: build }
      - { kind: sentence, ja: "あした ゆきが ふるでしょう。", en: "It'll probably snow tomorrow", exercises: [deshou-verb], mode: translate }
      - { kind: particle-cloze, stem: "あした ゆきが ", tail: "でしょう。", answer: "ふる", options: ["ふる", "くる", "みる"], en: "It'll probably snow tomorrow", explanation: "ふる is what Japanese uses for anything coming down out of the sky. くる is to come and みる is to watch." }
      - { kind: listening-comp, audio: "あした あめが ふるでしょう。", answer: "It'll probably rain tomorrow", distractors: ["It rained yesterday", "It definitely won't rain tomorrow", "It has been raining since the morning"], exercises: [deshou-verb, ga-existence] }
      - { kind: listening-comp, audio: "きょうは くもりでしょう。", answer: "It'll probably be cloudy today", distractors: ["It was cloudy today", "It's definitely cloudy today", "It probably won't be cloudy today"], exercises: [deshou, wa-topic] }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "あした ゆきが ふるでしょう。", en: "It'll probably snow tomorrow." }
          - { speaker: "Ken", ja: "ぼくは じてんしゃで こないでしょう。", en: "Then I probably won't come by bicycle." }
        questions:
          - { q: "Why won't Ken come by bicycle?", options: ["Snow is expected", "Rain is expected", "His bicycle is broken", "He is going by train"], answer: "Snow is expected" }
