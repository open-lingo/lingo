module: m14
title: "て-form II: ている + permission/prohibition"
register: plain
priorNeoModules: [m3, m4, m5, m6, m7, m8, m9, m10, m11, m12, m13]

priorGrammarPoints: [wa-topic, ga-existence, wo-object, no-possession, ni-location, de-action, mo-also,
                     dare, kore-sore-are-dore, koko-soko-asoko, spatial-relations, location-qa,
                     nai-form, nai-existence, arimasu, imasu,
                     masu-present, masu-negative, desu-copula, ka-question, te-kudasai,
                     dictionary-form, numbers-1-10, counter-tsu, numbers-11-99, counter-ji, ni-time,
                     ta-form, desu-past, masu-past,
                     i-adj-present, i-adj-negative, i-adj-past, na-adj-present, na-adj-negative,
                     v-tai, ga-hoshii, suki-kirai-no, no-ga-suki]

notes: |
  m14 = spine tile n06b. て-FORM II: ている + permission/prohibition.
  ⟳ the DEEPEN beat of n02 (m8), which taught the て table and てください and
  was told to leave the rest of the family here.

  Shape (inv 25): 13 lessons = 9 teaching + 3 review + 1 challenge, reviews at
  the first/middle/last thirds, challenge lesson LAST. NO katakana rows (the
  programme ended at m11). NO `kind: register` beats — that machinery is m10 +
  m29 only (registerScaffoldIsolation).

  THE WHOLE POINT — ている is NOT "the present continuous".

  1. **ている IS て + いる.** The learner already owns both halves: the て-form
     from m8 and いる from m6. Hung together they say "exists in the state of
     having done X". That ONE idea explains both readings the learner is about
     to meet, so the module never presents them as two facts:
       - an action still in motion → ongoing (いま たべている "is eating");
       - a change already made → the state it left (しっている "knows",
         すんでいる "lives", literally "has come to know / to move in and
         remains so").
     Every course that skips the second reading produces learners who say
     しる for "I know". L3 is that reading, taught explicitly, and the L3
     rule card is the SAME `te-iru` card as L2 — one rule, seen twice
     (m8 re-showed its `te-form` card three times for the same reason).
  2. **THE HOUSE GLOSS RULE FINALLY PAYS (inv 17).** -ing glosses belong to
     ている and ONLY ている. Plain non-past has glossed habitual/intent all
     course precisely so that this module can spend the progressive. The
     inverse half of inv 17 is live here too: RESULTATIVE ている glosses as
     SIMPLE present ("I know", "I live in Japan"), never as progressive.
  3. **PERMISSION AND PROHIBITION ARE ONE FAMILY, INTRODUCED PAIRWISE.**
     てもいい (L6) then てはいけません (L7) — the same frame with も→は and
     いい→いけません — and only after that pair is solid does ないでください
     arrive (L8). Never all three at once: the pinned sequencing rule is
     pairwise contrast on introduction, N-way only on review (R3 + the
     challenge lesson do the N-way).
  4. **THE POLITE-FORM TENSION, RESOLVED AS VOCABULARY.** てはいけません and
     ないでください are inherently polite-register forms in a plain-form-first
     course. They are taught as the FIXED EXPRESSIONS they are — the voice of
     signs, teachers and rules — with だめ (m10) as their casual echo, so the
     learner always has a plain-form way to say no. No `kind: register` beat,
     no politeness meter, no audience picture: this is not a register lesson.

  TRANSFORM RAMP (inv 37 — it bit m11, m12 AND m13, so it is scoped tightly):
  ONE ramp, on L2's `te-iru` card, `{form: te, classes: [u]}`. It re-runs the
  m8 sound-change table on three う-verbs the learner knows but has never seen
  in て-form — しる → しって (る→って), はたらく → はたらいて (く→いて),
  すむ → すんで (む→んで) — three different rows of the table, which is the
  spine's "same form, harder spends". Constraints obeyed:
    - the ramp is PINNED ahead of the interleaved middle and
      conjugation_transform is NOT intro-capable, so all three answers appear
      inside the L2 rule card's `examples:` (しっている, はたらいている,
      すんでいる contain them as substrings);
    - the ramp's BASES (しる/はたらく/すむ) are prior-neo vocabulary, so no
      new word can debut on a transform card;
    - only those three atoms carry `verbClass`. Every other derived form in
      this module omits it deliberately so it can never be picked up as ramp
      material (the compiler takes the first three eligible atoms in
      `newAtoms` order).

  ONE RULE CARD PER LESSON (layout law, learned here): two `kind: rule` beats
  in one lesson compile to two PINNED, ADJACENT `grammar_rule` steps, and the
  adjacency bar exempts only the transform ramp — so L1's て+ください rehash is
  folded into the `kudasai` card's own rule text instead of getting a second
  card. てください stays a PRIOR point (m8's `te-kudasai`), spent on beats.

  CLAUSE LINKING IS SPACED, NOT COMMA'D (L9). `moduleCompiler.clean()` strips
  、 with nothing in its place, so an authored 「たべて、だいがくに いく」
  compiles to the run-on target — and the run-on TTS key — 「たべてだいがくに
  いく」. Sentence/challenge/listening-comp beats therefore write the link as a
  SPACE (「たべて だいがくに いく」); only rule-card examples and dialogue
  lines, which render raw, keep the 、. Same trap class as the ？-stripping
  fix the m11 cycle documented: a guard that runs on cleaned text cannot see
  punctuation bugs.

  TOKENIZATION IS PEDAGOGY HERE (three rulings, all deliberate):
    - **ている is NOT registered as an atom.** 「たべている」 tokenizes to
      たべて + いる, so the build tiles literally show the composition the
      module teaches. Registering たべている would hide the pattern in one
      tile and add ~10 inflected atoms to the SRS deck for nothing.
      Same for the negative: 「たべていない」 = たべて + いない (m6's いない).
    - **てもいい / てはいけません are written with a SPACE before the last
      word** (たべても いい / たべては いけません). The tokenizer is
      longest-match over a vocabulary that contains はい "yes", so the
      spaceless 「たべてはいけません」 segments as たべて・はい・けま・せん —
      which credits せん "thousand" to SRS (the documented homograph trap)
      and leaves an unbuildable fragment. With the space each piece is its
      own tile: たべて / は / いけません.
    - **ないでください decomposes: たべない + で + ください.** The ない-form is
      already an atom (m6) and ください is already an atom (m8), so the tiles
      spell out the rule the card states. This does credit the particle で on
      those steps — a small, honest mis-credit (で is a heavily-taught
      particle that also appears in ordinary で-sentences all through the
      module), and the alternative was five per-verb 〜ないで atoms whose only
      job is to hide the composition.

  ATOMS: only ONE new courseAtoms row, いけません (see its note there — いける
  is absent from VERB_ENTRIES so nothing derives it). Everything else this
  module declares is either an existing atom or a REAL surface the conjugation
  lexicon already produces (しって/はたらいて/すんで/まって/みせて/およいで/
  しらない/およがない all derive from VERB_ENTRIES verbs), so the IR carries
  their glosses and the registry stays clean — the m12/m13 ruling, unchanged.
  One BACKFILL was unavoidable: いい, taught by m12-neo-1, existed only in
  m12's IR and was therefore invisible to this module's compiler; it is now a
  courseAtoms row tagged `fromModule: m12`.

  PICTURE DEBUTS (inv 30/44): まつ ⏳ (L1), みせる 👀 (L1), およぐ 🏊 (L5) —
  three verbs from m14's own registry allocation, each earning its place in
  the grammar rather than decorating it (まって ください is the single most
  useful request in the language; みせて ください is the second; およぐ carries
  both およいでいる and the canonical 「かわで およいでは いけません」).
  A new imageable verb can NEVER be ramp material in its own lesson: the ramp
  card prints its BASE, the ramp is pinned first, and `requireImageFirst`
  scans the raw step JSON — so the transform card would steal the picture
  debut. That is why the ramp verbs are all prior-module words. For the same
  reason no rule card in this module names まつ/みせる/およぐ (not even in the
  `rule:` prose or an antiPattern — the guard reads the raw blob, not the
  scrubbed projection).

  DEVIATIONS, documented per RUN-PLAN "decide and document":
  - **`mada-mou` MOVED m22 → m14 (ledger edited, spine wins).** spinePlan
    n06b lists "もう #31 / まだ #117 — the canonical ている spend
    (もう食べた / まだ食べていない)"; the coverage ledger had `mada-mou` on
    m22 (s17, body & health), where it is a bolt-on with no domain link.
    まだ〜ていない is not a temporal adverb fact, it is the NEGATIVE ている —
    it cannot be taught before this module and it should not be taught five
    modules after it. Ledger row edited both ways (added to m14, removed from
    m22) exactly as the ledger's own rule requires.
  - **`te-kara` STAYS on m15's row.** spinePlan n06b lists "Sequencing clauses
    with て; てから". The SEQUENCING half is taught here (L9, a second
    `te-form` card — clause linking is the て-form's other job and it is what
    buys this module its sentence-complexity ramp, inv 13). てから itself
    stays at m15, where the ledger pairs it with `mae-ni` and `toki`: "after
    doing X" and "before doing X" are one contrast and splitting them across
    two modules teaches half a pair twice. This is a REAL, deliberate split of
    a spine line — reported as such.
  - **してる is prose-only.** The spine wants the contraction as a RECOGNITION
    preview ("anime learners hear it in episode one"). It is named in the
    `te-iru` rule card's prose and appears on NO graded surface — rule prose
    is invisible to the provenance guard, which is exactly why it can never
    be an introduction and exactly why it is safe as a heads-up.
  - **かく / たつ / うたう are NOT used**, though the context pack lists them as
    known. The pack's "already knows" list is built from courseAtoms
    attribution, and those three have never been introduced by a NEO module —
    the taught-set the guards actually use comes from prior neo LESSONS. かいて
    (write) would have been the natural fourth ramp verb; it is not available.

  NO この/その/あの (m17's `kono-sono-ano-dono`). They are courseAtoms, so the
  compiler treats them as "already known" and they leak silently — the exact
  defect the m13 QA pass caught with だいがく on 2026-07-27. m13's IR flagged
  the same rule; m14 keeps it. Demonstratives here are the m4 pronouns only,
  and this module reaches for a possessive or an adjective instead
  (ミカの ほん, あたらしい きっさてん) wherever "that X" was tempting.

  CONNECTIVES (inv 13): L9's て-linking is this module's complexity engine —
  two-clause sentences with a real temporal order, which is the first time the
  course can build one. から/ので/けど land at m16.

grammarPoints:
  - id: kudasai
    rule: "ください asks for a THING. Name it, mark it with を, then say ください: みずを ください = water, please. It is polite all by itself — no です, no ます, nothing added. And you already own its partner: put a て-form in front instead of a noun and you are asking for an ACTION — ほんを みて ください = please look at the book. Same word, two jobs. The て table has not moved since m8: る-verbs swap る for て (みる → みて), う-verbs follow the sound changes (のむ → のんで, かう → かって, きく → きいて, いく → いって), and する → して, くる → きて."
    examples:
      - { ja: "みずを ください。", en: "Water, please." }
      - { ja: "コーヒーを ください。", en: "Coffee, please." }
      - { ja: "すしを ください。", en: "Sushi, please." }
      - { ja: "あたらしい かさを ください。", en: "A new umbrella, please." }
      - { ja: "ほんを みて ください。", en: "Please look at the book." }
      - { ja: "ちょっと まって ください。", en: "Please wait a moment." }
      - { ja: "しゃしんを みせて ください。", en: "Please show me the photo." }
    antiPattern: { ja: "みずが ください。", why: "ください takes を — what you are asking for is the object of the request. が would make the water the one doing the asking." }
  - id: te-iru
    rule: "Hang いる on the て-form and you get ている: たべる → たべて → たべている. It does not mean \"present tense\"; it says you EXIST IN THE STATE that the action left you in. For an action still in motion that reads as ongoing — いま ごはんを たべている = I'm eating right now. For a verb that describes a CHANGE, it reads as the state after the change: しる is the moment you find out, so しっている is \"I know\"; すんでいる is \"I live\". Only いる moves: the negative is ていない (まだ たべていない), and in fast speech people drop the い — たべてる — which you will hear everywhere even though we write the full form."
    examples:
      - { ja: "いま ごはんを たべている。", en: "I'm eating right now." }
      - { ja: "ミカは いま ほんを みている。", en: "Mika is looking at a book right now." }
      - { ja: "ともだちは かいしゃで はたらいている。", en: "My friend works at a company." }
      - { ja: "わたしは にほんに すんでいる。", en: "I live in Japan." }
      - { ja: "トムの なまえを しっている。", en: "I know Tom's name." }
      - { ja: "いま みずを のんでいない。", en: "I'm not drinking water right now." }
    antiPattern: { ja: "いま ごはんを たべるいる。", why: "いる hangs on the て-form, not the dictionary form — たべる becomes たべて first: いま ごはんを たべている。" }
    # Ramp scope (inv 37): the three answers the transform can emit — しって,
    # はたらいて, すんで — all appear inside the examples above (しっている,
    # はたらいている, すんでいる), and their bases しる/はたらく/すむ are
    # prior-neo words, so nothing debuts on a transform card.
    conjugation: { form: te, classes: [u] }
  - id: mada-mou
    rule: "もう means \"already\" and points at something finished, so it takes the past: もう たべた = I already ate. まだ means \"not yet\", and its partner is the NEGATIVE ている: まだ たべていない = I haven't eaten yet. Hold that pairing — まだ〜ていない says the door is still open, and it is what Japanese uses where English says \"haven't … yet\". まだ on its own also means \"still\": ミカは まだ えきで まっている。"
    examples:
      - { ja: "もう ごはんを たべた。", en: "I already ate." }
      - { ja: "まだ ごはんを たべていない。", en: "I haven't eaten yet." }
      - { ja: "もう しゃしんを みた。", en: "I already saw the photo." }
      - { ja: "まだ しゃしんを みていない。", en: "I haven't seen the photo yet." }
      - { ja: "ミカは まだ えきで まっている。", en: "Mika is still waiting at the station." }
    antiPattern: { ja: "もう ごはんを たべたない。", why: "た and ない never stack. The past is もう たべた; the \"not yet\" side is a different shape altogether — まだ たべていない。" }
  - id: te-mo-ii
    rule: "Put も after the て-form and finish with いい to ask whether something is allowed: ここで たべても いい？ = is it OK if I eat here? Literally \"even if I eat, it's fine\". Said flat instead of asked, it GRANTS the permission: ここで たべても いい = you may eat here. The answers are short — うん、いい for go ahead, ううん、だめ for no."
    examples:
      - { ja: "ここで たべても いい？", en: "Is it OK if I eat here?" }
      - { ja: "しゃしんを みても いい？", en: "May I look at the photo?" }
      - { ja: "うみで およいでも いい。", en: "You may swim in the sea." }
      - { ja: "ここで まっても いい？", en: "May I wait here?" }
      - { ja: "ううん、だめ。", en: "No — that's not allowed." }
    antiPattern: { ja: "ここで たべるも いい？", why: "も and いい hang off the て-form — たべる becomes たべて: ここで たべても いい？" }
  - id: te-wa-ikemasen
    rule: "Swap も for は and いい for いけません and permission becomes prohibition: ここで たべては いけません = you must not eat here. It is a fixed expression, the voice of signs, teachers and house rules, and it stays in that polite shape even in a casual conversation — you are quoting the rule, not choosing a register. Between friends the same no is just だめ: ここで たべては だめ。"
    examples:
      - { ja: "ここで たべては いけません。", en: "You must not eat here." }
      - { ja: "かわで およいでは いけません。", en: "You must not swim in the river." }
      - { ja: "じゅぎょうで けいたいを みては いけません。", en: "You must not look at your phone in class." }
      - { ja: "ここで まっては いけません。", en: "You must not wait here." }
      - { ja: "ここで たべては だめ。", en: "You can't eat here. (to a friend)" }
    antiPattern: { ja: "ここで たべるは いけません。", why: "は and いけません hang off the て-form, exactly like も and いい — たべる becomes たべて: ここで たべては いけません。" }
  - id: naide-kudasai
    rule: "To ask someone NOT to do something, start from the ない-form you already own, add で, then ください: たべる → たべない → たべないで ください = please don't eat. It is a REQUEST, softer than てはいけません, which states the law — a friend says ここで たべないで ください, a sign says ここで たべては いけません. The ない-form does all the work; nothing else changes."
    examples:
      - { ja: "ここで たべないで ください。", en: "Please don't eat here." }
      - { ja: "しゃしんを みないで ください。", en: "Please don't look at the photo." }
      - { ja: "かわで およがないで ください。", en: "Please don't swim in the river." }
      - { ja: "きょうは いかないで ください。", en: "Please don't go today." }
      - { ja: "みずを のまないで ください。", en: "Please don't drink the water." }
    antiPattern: { ja: "ここで たべない ください。", why: "で is what turns the ない-form into a request — without it the sentence just stops halfway: ここで たべないで ください。" }
  - id: te-form
    rule: "The て-form's other job is a comma. It links one action to the next in the order they happen: あさ ごはんを たべて、だいがくに いく = in the morning I eat, then go to university. Only the LAST verb carries the tense — everything before it stays in て, however long the chain gets. Same table you have used all module, longer sentences."
    examples:
      - { ja: "あさ ごはんを たべて、だいがくに いく。", en: "In the morning I eat and then go to university." }
      - { ja: "きっさてんに いって、ちゃを のんだ。", en: "I went to the coffee shop and drank tea." }
      - { ja: "みせに いって、あたらしい ふくを かった。", en: "I went to the shop and bought new clothes." }
      - { ja: "うたを きいて、ごはんを たべた。", en: "I listened to a song and then ate." }
      - { ja: "きょうは えきに いって、ともだちと あそんだ。", en: "Today I went to the station and hung out with a friend." }
    antiPattern: { ja: "あさ ごはんを たべる、だいがくに いく。", why: "a plain verb cannot hand over to the next clause — the first verb goes into the て-form: あさ ごはんを たべて、だいがくに いく。" }

newAtoms:
  # ══ THE RAMP TRIO (L2) — declared FIRST and the ONLY atoms carrying
  #    `verbClass`, so the compiler's "first three eligible" pick is exactly
  #    these three and nothing else can ride the ramp (inv 37).
  - { kana: しって, romaji: shitte, gloss: "know (te-form)", shortGloss: "know (te)", imageable: false, kind: verb-form, derivedFrom: しる, verbClass: u }
  - { kana: はたらいて, romaji: hataraite, gloss: "work (te-form)", shortGloss: "work (te)", imageable: false, kind: verb-form, derivedFrom: はたらく, verbClass: u }
  - { kana: すんで, romaji: sunde, gloss: "live in (te-form)", shortGloss: "live in (te)", imageable: false, kind: verb-form, derivedFrom: すむ, verbClass: u }
  # ══ L1 — the request lesson. まつ and みせる are PICTURE debuts; their
  #    て-forms are introduced by the te-kudasai card. No verbClass: a new
  #    imageable verb must never reach a pinned transform card (its base
  #    would print before the image MCQ).
  - { kana: まつ, romaji: matsu, gloss: "to wait", imageable: true, kind: verb, verbClass: u }
  - { kana: みせる, romaji: miseru, gloss: "to show", imageable: true, kind: verb, verbClass: ru }
  - { kana: まって, romaji: matte, gloss: "wait (te-form)", shortGloss: "wait (te)", imageable: false, kind: verb-form, derivedFrom: まつ }
  - { kana: みせて, romaji: misete, gloss: "show (te-form)", shortGloss: "show (te)", imageable: false, kind: verb-form, derivedFrom: みせる }
  # ══ L3 — the state reading needs its own negative: しらない is "I don't
  #    know", the single most-used negative in the language, and it is NOT
  #    しっていない.
  - { kana: しらない, romaji: shiranai, gloss: "don't know", imageable: false, kind: verb-form, derivedFrom: しる }
  # ══ L8 — the ない-form of L1's みせる, for ないでください.
  - { kana: みせない, romaji: misenai, gloss: "won't show / don't show", shortGloss: "don't show", imageable: false, kind: verb-form, derivedFrom: みせる }
  # ══ L4 — もう / まだ. Both are existing courseAtoms (m11 attribution) that
  #    no neo module ever introduced, so they are genuinely new to the
  #    learner and are declared here to be gated like any new word.
  - { kana: もう, romaji: mou, gloss: "already", imageable: false, kind: vocab }
  - { kana: まだ, romaji: mada, gloss: "not yet, still", shortGloss: "not yet", imageable: false, kind: vocab }
  # ══ L5 — およぐ, the third picture debut, and the verb the prohibition
  #    lesson is built on.
  - { kana: およぐ, romaji: oyogu, gloss: "to swim", imageable: true, kind: verb, verbClass: u }
  - { kana: およいで, romaji: oyoide, gloss: "swim (te-form)", shortGloss: "swim (te)", imageable: false, kind: verb-form, derivedFrom: およぐ }
  # ══ L7 / L8 — the fixed prohibition helper (the module's ONLY courseAtoms
  #    registration) and the ない-form およぐ needs for ないでください.
  - { kana: いけません, romaji: ikemasen, gloss: "must not, not allowed", shortGloss: "must not", imageable: false, kind: grammar-chunk }
  - { kana: およがない, romaji: oyoganai, gloss: "won't swim / don't swim", shortGloss: "don't swim", imageable: false, kind: verb-form, derivedFrom: およぐ }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m14-neo-1
    role: teaching
    title: "ください — please give me, please do"
    focus: "を + ください asks for a THING; a て-form + ください asks for an ACTION"
    introduces: [まつ, みせる, まって, みせて]
    beats:
      - { kind: rule, grammarPointId: kudasai }
      - { kind: sentence, ja: "みずを ください。", en: "Water, please", exercises: [kudasai, wo-object], mode: build }
      - { kind: sentence, ja: "コーヒーを ください。", en: "Coffee, please", exercises: [kudasai], mode: build }
      - { kind: sentence, ja: "あたらしい ぼうしを ください。", en: "A new hat, please", exercises: [kudasai, i-adj-present], mode: build }
      - { kind: sentence, ja: "ちょっと まって ください。", en: "Please wait a moment", exercises: [te-kudasai], mode: build }
