  - id: m39-neo-9
    role: teaching
    title: "「のに か ので か」 — telling the twins apart"
    focus: "Production lesson, particle-cloze discrimination: the swap-test for のに vs ので on matched near-pairs"
    introduces: [やむをえない]
    beats:
      - { kind: rule, grammarPointId: noni-concession, variant: discrimination }
      - { kind: sentence, ja: "あめなので いえに いる。", en: "It's raining, so I'm staying home.", exercises: [node-because], mode: build }
      - { kind: sentence, ja: "あめなのに、こうえんに いった。", en: "It was raining, and yet I went to the park.", exercises: [noni-concession], mode: build }
      - { kind: particle-cloze, stem: "じかんが ない", tail: " いった。", answer: "のに", options: ["のに", "ので", "から"], en: "I had no time, and yet I went.", explanation: "'No time' should mean NOT going — going anyway is a contradiction, so のに. ので/から would need the logic 'because I had no time, I went,' which makes no sense as a reason." }
      - { kind: particle-cloze, stem: "じかんが ない", tail: " いかなかった。", answer: "ので", options: ["ので", "のに", "けど"], en: "I had no time, so I didn't go.", explanation: "Here the second half is a plain CONSEQUENCE of the first — no time, so no going, no tension at all. ので fits cleanly. のに would need a contradiction that isn't here; けど could join the clauses too, but not with ので's careful, explaining tone." }
      - { kind: listening-comp, audio: "むりなのに、やった。", answer: "It was unreasonable, and yet I did it.", distractors: ["Because it was unreasonable, I didn't do it.", "It was reasonable, so I did it.", "It was unreasonable, so I gave up."], q: "What does this mean?" }
      - { kind: sentence, ja: "やむをえない。", en: "It can't be helped.", exercises: [nai-form], mode: build }
      - { kind: listening-comp, audio: "やむをえない。", answer: "It can't be helped.", distractors: ["It can definitely be helped.", "I don't want to help.", "It was already fixed."], q: "What does this mean?" }
      - { kind: kanji, kana: ざんねん, kanji: 残念, distractors: ["きねん", "ねんれい", "ざんぎょう"], exercises: [noni-concession] }
      - kind: dialogue
        lines:
