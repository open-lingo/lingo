  - id: m39-neo-10
    role: teaching
    title: "「つかれても、いくし」 — the errand that won't wait"
    focus: "ても and し combined in production — a plan held despite being tired, reasons piled on top; second sim runs the whole exchange"
    introduces: [しかたない]
    beats:
      - { kind: sentence, ja: "つかれても いく。", en: "Even though I'm tired, I'll go.", exercises: [temo-concession], mode: build }
      - { kind: sentence, ja: "やすいし、べんりだし、いく。", en: "It's cheap, and what's more it's convenient, so I'll go.", exercises: [shi-listing], mode: build }
      - { kind: sentence, ja: "うるさくても、いくし、のむ。", en: "Even though it's noisy, I'll go, and what's more I'll have a drink.", exercises: [temo-concession, shi-listing], mode: build }
      - { kind: sentence, ja: "しかたないよ。", en: "Oh well, can't be helped, you know.", exercises: [yo-emphasis], mode: build }
      - { kind: listening-comp, audio: "しかたないよ。", answer: "Oh well, can't be helped, you know.", distractors: ["It can definitely be helped.", "I refuse to help.", "It's already fixed."], q: "What does this mean?" }
      - { kind: particle-cloze, stem: "つかれ", tail: " いく。", answer: "ても", options: ["ても", "のに", "し"], en: "Even though I'm tired, I'll go.", explanation: "ても holds the plan steady regardless of being tired — a concession about something not yet decided. のに would need the going to have already happened and clash with the tiredness. し would just add tiredness as ANOTHER reason pointing the same way — the opposite relationship, not a concession at all." }
      - { kind: listening-comp, audio: "うるさくても、いくし、のむ。", answer: "Even though it's noisy, I'll go, and what's more I'll have a drink.", distractors: ["It's noisy, so I won't go.", "It's quiet, so I'll go and have a drink.", "It's noisy, so I'll just look, not drink."] }
      - { kind: kanji, kana: さいあく, kanji: 最悪, distractors: ["さいこう", "あくい", "さいだい"], exercises: [temo-concession] }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "つかれてない？", en: "Aren't you tired?" }
          - { speaker: "Tom", ja: "つかれても、いくよ。やすいし、べんりだし。", en: "Even though I'm tired, I'll go. It's cheap, and it's convenient." }
          - { speaker: "Mika", ja: "しかたないね、いっしょに いこう。", en: "Well, can't be helped — let's go together." }
        questions:
          - { q: "Why does Tom go even though he's tired?", options: ["It's cheap and convenient", "Mika asked him to", "He has no choice", "He forgot he was tired"], answer: "It's cheap and convenient" }
      - kind: sim
        scene: { emoji: "🏪", title: "The errand that won't wait", setting: "It's late and Ken is tired, but the shop closes soon." }
        turns:
          - npc: { speaker: "Ken", ja: "つかれてるのに、いくの？", en: "You're tired, and yet you're going?" }
            goal: "Concede you're tired, but will go anyway."
            reply: { mode: build, tiles: ["つかれても", "いく", "つかれたから", "いかない"], answer: "つかれても いく。" }
            replyGloss: "Even though I'm tired, I'll go."
            explanation: "ても holds firm regardless of being tired — the trip doesn't change. つかれたから いかない would flip the whole plan into an excuse to stay home, the opposite commitment."
          - npc: { speaker: "Ken", ja: "なんで いくの？", en: "Why are you going?" }
            goal: "List reasons: it's cheap, and what's more it's convenient."
            reply: { mode: build, tiles: ["やすいし", "べんりだし", "いく", "やすいから", "べんりだから"], answer: "やすいし、べんりだし、いく。" }
            replyGloss: "It's cheap, and what's more it's convenient, so I'll go."
            explanation: "し stacks the two reasons with 'and what's more'. やすいから/べんりだから would each give only ONE reason and stop — the pile-up feeling is exactly what し adds that から can't."
      - { kind: challenge, ja: "つかれても、やすいので、いくことに した。", en: "Even though I'm tired, since it's cheap, I decided to go.", combines: [temo-concession, node-because, koto-ni-suru], mode: build }
    reviewPool: [みせ, テスト, いえ, あめ, コンビニ, ともだち, がっこう, しごと]

