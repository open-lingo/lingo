  - { kana: いそがしくて, romaji: isogashikute, gloss: "being busy, and…", shortGloss: "busy (te)", imageable: false, kind: adjective-form, derivedFrom: いそがしい }
  - { kana: ふって, romaji: futte, gloss: "falling (rain/snow), and…", shortGloss: "fall (te)", imageable: false, kind: verb-form, derivedFrom: ふる }
  - { kana: つかれて, romaji: tsukarete, gloss: "getting tired, and…", shortGloss: "tired (te)", imageable: false, kind: verb-form, derivedFrom: つかれる }
  - { kana: うるさくて, romaji: urusakute, gloss: "being noisy, and…", shortGloss: "noisy (te)", imageable: false, kind: adjective-form, derivedFrom: うるさい }
  # ══ Plain-past forms of already-taught verbs, never conjugated to past
  # anywhere before m39 (confirmed via grep across every prior IR file) —
  # same registration requirement as the te-forms above: an unregistered
  # conjugated surface has no atom for the longest-match tokenizer to hit,
  # so it falls through to the nearest short particle (が/で) plus a
  # leftover fragment (がんばった tiled as "が"+"んばった" before this row
  # was added — caught by inspecting the compiled build_sentence tiles).
  - { kana: がんばった, romaji: ganbatta, gloss: "tried hard, did one's best (past)", shortGloss: "did my best (past)", imageable: false, kind: verb-form, derivedFrom: がんばる }
  - { kana: やった, romaji: yatta, gloss: "did (past)", shortGloss: "do (ta)", imageable: false, kind: verb-form, derivedFrom: やる }
  - { kana: おもった, romaji: omotta, gloss: "thought (past)", shortGloss: "think (past)", imageable: false, kind: verb-form, derivedFrom: おもう }
  - { kana: できた, romaji: dekita, gloss: "was able to, could do (past)", shortGloss: "able (past)", imageable: false, kind: verb-form, derivedFrom: できる }
  - { kana: つかれた, romaji: tsukareta, gloss: "got tired (past)", shortGloss: "got tired (past)", imageable: false, kind: verb-form, derivedFrom: つかれる }
  # NOTE: がんばって (te-form) was tried here to cover L3's dialogue close
  # ("そう。がんばってね。") but that's a `dialogue` beat — not an
  # intro-capable step type — so registering it here would still fail the
  # bar guard's teach-first check (a word's FIRST exposure can't be a
  # dialogue line, invariant 33). Rather than adding a second exposure just
  # to satisfy the gate, avoided the surface entirely: the dialogue line
  # now closes with わかった (taught m11, already known well before m39),
  # so no new atom is needed for this one line.

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m39-neo-1
    role: teaching
    title: "「たかいのに かった」 — spending anyway"
    focus: "のに as ので's minimal pair, introduced resolve-first: same joint, opposite job — a contradiction, not a reason"
    introduces: [ざんねん, むり]
    beats:
      - { kind: rule, grammarPointId: noni-concession, variant: intro }
      - { kind: sentence, ja: "たかいのに かった。", en: "It was expensive, and yet I bought it.", exercises: [noni-concession], mode: build }
      - { kind: sentence, ja: "がんばったのに おちた。", en: "I tried hard, and yet I failed.", exercises: [noni-concession], mode: build }
      - { kind: sentence, ja: "ざんねんだ。", en: "That's a shame.", exercises: [na-adj-present], mode: build }
      - { kind: sentence, ja: "むりなのに、やった。", en: "It was unreasonable, and yet I did it.", exercises: [noni-concession], mode: build }
      - { kind: particle-cloze, stem: "たかい", tail: " かった。", answer: "のに", options: ["のに", "ので", "から"], en: "It was expensive, and yet I bought it.", explanation: "Buying something despite the price is a CONTRADICTION — you had a reason not to, and did it anyway — so のに. ので/から would read backwards, as if the price itself were the reason FOR buying: 'because it was expensive, I bought it' makes no sense." }
      - { kind: sentence, ja: "じかんが ないのに、いった。", en: "I had no time, and yet I went.", exercises: [noni-concession, nai-existence], mode: build }
      - { kind: listening-comp, audio: "がんばったのに おちた。", answer: "I tried hard, and yet I failed.", distractors: ["I didn't try, so I failed.", "I tried hard and passed.", "I failed because I didn't try."], q: "What does this mean?", explanation: "のに carries the contradiction: trying hard should have meant passing, and it didn't." }
      - { kind: kanji, kana: むり, kanji: 無理, distractors: ["りゆう", "むいみ", "むちゃ"], exercises: [noni-concession] }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "テストは どうだった？", en: "How was the test?" }
          - { speaker: "Tom", ja: "がんばったのに おちた。", en: "I tried hard, and yet I failed." }
          - { speaker: "Ken", ja: "ざんねんだね。", en: "That's a shame." }
        questions:
          - { q: "What happened to Tom?", options: ["He tried hard but failed", "He didn't study and failed", "He passed the test", "He didn't take the test"], answer: "He tried hard but failed" }
      - { kind: challenge, ja: "むりだと おもったのに、できた。", en: "I thought it was impossible, and yet I could do it.", combines: [noni-concession, to-omoimasu, dekiru], mode: build }
    reviewPool: [テスト, じかん, とけい, ほん, がっこう, せんせい, しゅくだい, かぎ]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m39-neo-2
    role: teaching
    title: "「ねつが あるのに がっこうに いった」 — the complaint that goes anyway"
    focus: "のに pushed into its real register: complaint, reproach — every use carries emotional colour, never a flat report"
    introduces: [きたない]
    beats:
      - { kind: rule, grammarPointId: noni-concession, variant: production }
      - { kind: sentence, ja: "ねつが あるのに がっこうに いった。", en: "I had a fever, and yet I went to school.", exercises: [noni-concession], mode: build }
      - { kind: sentence, ja: "ひまなのに、いえに いる。", en: "Even though I'm free, I'm staying home.", exercises: [noni-concession], mode: build }
      - { kind: sentence, ja: "きたないのに、すきだ。", en: "It's dirty, and yet I like it.", exercises: [noni-concession], mode: build }
      - { kind: sentence, ja: "うるさいのに、がんばった。", en: "It was noisy, and yet I did my best.", exercises: [noni-concession, ta-form], mode: build }
      - { kind: particle-cloze, stem: "ねつが ある", tail: " がっこうに いった。", answer: "のに", options: ["のに", "ので", "から"], en: "I had a fever, and yet I went to school.", explanation: "のに carries the complaint — a fever is every reason to STAY home, and Tom went anyway. ので would flip the logic entirely ('because I had a fever, I went to school' makes no sense as a reason); から has the same problem." }
      - { kind: listening-comp, audio: "きたないのに、すきだ。", answer: "It's dirty, and yet I like it.", distractors: ["It's dirty, so I don't like it.", "It's clean, so I like it.", "It's dirty, so I cleaned it."], q: "What does this mean?" }
      - { kind: kanji, kana: きたない, kanji: 汚い, distractors: ["よごれる", "おせん", "きよい"], exercises: [noni-concession] }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "だいじょうぶ？ ねつが あるんでしょう？", en: "Are you okay? You have a fever, don't you?" }
          - { speaker: "Tom", ja: "うん、でも ねつが あるのに がっこうに いった。", en: "Yeah, but even though I had a fever, I went to school." }
          - { speaker: "Ken", ja: "むりしないでね。", en: "Don't overdo it, okay." }
        questions:
          - { q: "What did Tom do even though he had a fever?", options: ["He went to school", "He stayed home", "He saw a doctor", "He slept all day"], answer: "He went to school" }
      - { kind: challenge, ja: "ねつが あるのに がっこうに いったのは、むりだった。", en: "Going to school despite having a fever was unreasonable.", combines: [noni-concession, na-adj-present, ta-form], mode: build }
    reviewPool: [がっこう, へや, せんせい, ともだち, いえ, テスト, でんしゃ, ほん]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m39-neo-3
    role: teaching
    title: "「たかくても かう」 — resolve, not reason"
    focus: "〜ても: the free cousin of のに, reaching forward into what hasn't happened yet and holding regardless — first sim, a plan that survives an obstacle"
    introduces: [じゅうぶん]
    beats:
      - { kind: rule, grammarPointId: temo-concession }
      - { kind: sentence, ja: "たかくても かう。", en: "Even if it's expensive, I'll buy it.", exercises: [temo-concession], mode: build }
      - { kind: sentence, ja: "あめが ふっても いく。", en: "Even if it rains, I'll go.", exercises: [temo-concession], mode: build }
      - { kind: sentence, ja: "いそがしくても てつだう。", en: "Even though I'm busy, I'll help.", exercises: [temo-concession], mode: build }
      - { kind: sentence, ja: "じゅうぶんだ。", en: "That's enough.", exercises: [na-adj-present], mode: build }
      - { kind: particle-cloze, stem: "たかい", tail: " かう。", answer: "ても", options: ["ても", "から", "のに"], en: "Even if it's expensive, I'll buy it.", explanation: "ても reaches into something not yet decided and holds regardless — buying it whether it's expensive or not. から would make price the REASON, backwards logic. のに needs the event to have already happened and clashed (I bought it, and yet) — this hasn't happened yet." }
      - { kind: listening-comp, audio: "あめが ふっても いく。", answer: "Even if it rains, I'll go.", distractors: ["It's raining, so I won't go.", "It's raining, and yet I went.", "I'll go if it doesn't rain."], q: "What does this mean?" }
      - { kind: kanji, kana: じゅうぶん, kanji: 十分, distractors: ["じゅっぷん", "はんぶん", "たぶん"], exercises: [temo-concession] }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "あした あめかな。", en: "I wonder if it'll rain tomorrow." }
          - { speaker: "Tom", ja: "ふっても いくよ。", en: "Even if it rains, I'll go." }
          - { speaker: "Mika", ja: "そう。わかった。", en: "I see. Got it." }
        questions:
          - { q: "What will Tom do if it rains?", options: ["Go anyway", "Stay home", "Wait and see", "Ask Mika"], answer: "Go anyway" }
      - kind: sim
        scene: { emoji: "🌧️", title: "Weekend plans", setting: "Ken and Tom are planning Saturday, but rain is forecast." }
        turns:
          - npc: { speaker: "Ken", ja: "あめが ふったら、どう する？", en: "If it rains, what will you do?" }
            goal: "Concede you'll go anyway, rain or not."
            reply: { mode: build, tiles: ["あめが", "ふっても", "いく", "ふったら", "いかない"], answer: "あめが ふっても いく。" }
            replyGloss: "Even if it rains, I'll go."
            explanation: "ても holds the plan steady no matter what happens — rain or not, いく stands. ふったら いかない answers a different question entirely (IF it rains, THEN I won't go) — the opposite commitment."
          - npc: { speaker: "Ken", ja: "テストの じゅんびは？", en: "What about test prep?" }
            goal: "Concede that even though you're busy, you'll still go."
            reply: { mode: build, tiles: ["いそがしくても", "いく", "いそがしいから", "いかない"], answer: "いそがしくても いく。" }
            replyGloss: "Even though I'm busy, I'll go."
            explanation: "Same ても, same resolve — busy or not, いく doesn't change. いそがしいから いかない would turn it into an excuse to stay home, the opposite of the point."
      - { kind: challenge, ja: "あめが ふっても、かさを もっていく。", en: "Even if it rains, I'll take an umbrella.", combines: [temo-concession, te-iku-kuru-space, te-form], mode: build }
    reviewPool: [あめ, かさ, テスト, じかん, がっこう, しゅくだい, てんき, ともだち]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m39-neo-review-1
    role: review
    title: "Review — say it happened anyway"
    focus: "のに's contradiction and ても's resolve, spiraled against m16's から/ので/けど family"
    introduces: []
    beats:
      - { kind: sentence, ja: "たかいのに かった。", en: "It was expensive, and yet I bought it.", exercises: [noni-concession], mode: build }
      - { kind: sentence, ja: "あめが ふっても いく。", en: "Even if it rains, I'll go.", exercises: [temo-concession], mode: listening }
      - { kind: particle-cloze, stem: "いそがしい", tail: " いく。", answer: "けど", options: ["けど", "のに", "ても"], en: "I'm busy, but I'll go.", explanation: "けど simply joins two clauses with 'but' — neutral, nothing clashes. のに would add a complaint the sentence doesn't carry. ても needs a hypothetical, general frame ('even if'), not this flat statement." }
      - { kind: sentence, ja: "ねつが あるのに がっこうに いった。", en: "I had a fever, and yet I went to school.", exercises: [noni-concession], mode: build }
      - { kind: listening-comp, audio: "じかんが ないので いかない。", answer: "I have no time, so I'm not going.", distractors: ["I have no time, and yet I'm going.", "I have plenty of time, so I'm going.", "I have no time, but I'm going anyway."] }
      - { kind: sentence, ja: "いそがしくても てつだう。", en: "Even though I'm busy, I'll help.", exercises: [temo-concession], mode: build }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "きのう テストが あったんでしょう？", en: "You had a test yesterday, didn't you?" }
          - { speaker: "Tom", ja: "うん。ねつが あるのに がんばった。", en: "Yeah. I had a fever, and yet I did my best." }
          - { speaker: "Mika", ja: "そう。がんばったね。", en: "I see. You did your best." }
        questions:
          - { q: "What does Tom say he did despite his fever?", options: ["He did his best on the test", "He stayed home", "He went to the doctor", "He skipped the test"], answer: "He did his best on the test" }
      - { kind: sentence, ja: "ざんねんだ。", en: "That's a shame.", exercises: [na-adj-present], mode: build }
      - { kind: sentence, ja: "むりなのに、やった。", en: "It was unreasonable, and yet I did it.", exercises: [noni-concession], mode: listening }
      - { kind: sentence, ja: "じゅうぶんだ。", en: "That's enough.", exercises: [na-adj-present], mode: build }
    reviewPool: [テスト, あめ, かさ, がっこう, じかん, ともだち, へや, ほん]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m39-neo-5
    role: teaching
    title: "「がくせいでも わかる」 — even, on a noun"
    focus: "でも as ても's cousin for nouns and な-adjectives, carefully distinguished from the sentence-opening でも ('but') the course already teaches"
    introduces: [たいへん, つまらない]
    beats:
      - { kind: rule, grammarPointId: demo-concession }
      - { kind: sentence, ja: "がくせいでも わかる。", en: "Even a student understands.", exercises: [demo-concession], mode: build }
      - { kind: sentence, ja: "ひまでも いかない。", en: "Even though I'm free, I won't go.", exercises: [demo-concession], mode: build }
      - { kind: sentence, ja: "あめでも いく。", en: "Even if it's rain, I'll go.", exercises: [demo-concession], mode: build }
      - { kind: sentence, ja: "この えいがは つまらない。", en: "This movie is boring.", exercises: [i-adj-present], mode: build }
      - { kind: sentence, ja: "たいへん つかれた。", en: "I got very tired.", exercises: [ta-form], mode: build }
      - { kind: particle-cloze, stem: "がくせい", tail: " わかる。", answer: "でも", options: ["でも", "ても", "のに"], en: "Even a student understands.", explanation: "でも glues onto a NOUN the way ても glues onto a verb or い-adjective — がくせい is a noun, so でも is the only fit. ×がくせいても isn't a word. のに would need something that already happened and clashed — nothing here has happened yet." }
      - { kind: listening-comp, audio: "あめでも いく。", answer: "Even if it's raining, I'll go.", distractors: ["It's raining, so I won't go.", "If it doesn't rain, I'll go.", "It's not raining, so I'll go."] }
      - { kind: kanji, kana: たいへん, kanji: 大変, distractors: ["たいせつ", "へんか", "だいじ"], exercises: [demo-concession] }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "この えいが どう？", en: "How's this movie?" }
          - { speaker: "Mika", ja: "つまらないよ。でも みる？", en: "It's boring. But want to watch it anyway?" }
          - { speaker: "Ken", ja: "ひまでも みない。", en: "Even though I'm free, I won't watch it." }
        questions:
          - { q: "What does Ken say about watching the movie?", options: ["He won't watch even though he's free", "He'll watch because he's free", "He's too busy to watch", "He already watched it"], answer: "He won't watch even though he's free" }
      - { kind: challenge, ja: "あめでも いくから、かさを もっていく。", en: "Even if it rains I'll go, so I'll take an umbrella.", combines: [demo-concession, kara-because, te-iku-kuru-space], mode: build }
    reviewPool: [えいが, がくせい, あめ, かさ, しごと, テスト, ひま, がっこう]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m39-neo-6
    role: teaching
    title: "「だれでも わかる」 — the closed set"
    focus: "疑問詞+でも／も, five fixed phrases memorized as units — never derived, never extended"
    introduces: [とくべつ]
    beats:
      - { kind: rule, grammarPointId: demo-mo-closed-set }
      - { kind: sentence, ja: "なんでも たべる。", en: "I'll eat anything.", exercises: [demo-mo-closed-set], mode: build }
      - { kind: sentence, ja: "だれでも わかる。", en: "Anyone understands.", exercises: [demo-mo-closed-set], mode: build }
      - { kind: sentence, ja: "どこでも いい。", en: "Anywhere is fine.", exercises: [demo-mo-closed-set], mode: build }
      - { kind: sentence, ja: "だれも いない。", en: "Nobody is here.", exercises: [demo-mo-closed-set], mode: build }
      - { kind: sentence, ja: "なにも たべない。", en: "I'm not eating anything.", exercises: [demo-mo-closed-set], mode: build }
      - { kind: sentence, ja: "ここは しずかで とくべつだ。", en: "This place is quiet and special.", exercises: [na-adj-present], mode: build }
      - { kind: particle-cloze, stem: "どこ", tail: " いい。", answer: "でも", options: ["でも", "も", "ても"], en: "Anywhere is fine.", explanation: "どこでも is the fixed 'no matter where' phrase, memorized as a unit. どこも needs a NEGATIVE to mean 'nowhere' (どこも ない), which this sentence isn't. ても doesn't attach to a question word this way at all." }
      - { kind: listening-comp, audio: "だれも いない。", answer: "Nobody is here.", distractors: ["Someone is here.", "Everyone is here.", "Anyone can come."] }
      - { kind: kanji, kana: とくべつ, kanji: 特別, distractors: ["とくい", "べつに", "とくてい"], exercises: [demo-mo-closed-set] }
      - kind: dialogue
        lines:
          - { speaker: "Tanaka", ja: "きょうしつに だれか いる？", en: "Is anyone in the classroom?" }
          - { speaker: "Ken", ja: "だれも いないよ。", en: "Nobody's there." }
          - { speaker: "Tanaka", ja: "そう。しずかだね。", en: "I see. It's quiet." }
        questions:
          - { q: "Who is in the classroom?", options: ["Nobody", "Ken", "Tanaka", "Everyone"], answer: "Nobody" }
      - { kind: challenge, ja: "だれでも わかるのに、ケンは わからない。", en: "Even though anyone would understand, Ken doesn't understand.", combines: [demo-mo-closed-set, noni-concession, wa-topic], mode: build }
    reviewPool: [きょうしつ, がっこう, ともだち, へや, みせ, いえ, せんせい, ほん]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m39-neo-7
    role: teaching
    title: "「やすいし、おいしいし」 — reasons, piling up"
    focus: "〜し stacks reasons toward one conclusion — 'and what's more' — the third resident of から/ので/けど's joint, with a different job"
    introduces: [さいこう, さいあく]
    beats:
      - { kind: rule, grammarPointId: shi-listing }
      - { kind: sentence, ja: "おいしいし、やすいし、ほしい。", en: "It's tasty, and what's more it's cheap, so I want it.", exercises: [shi-listing], mode: build }
      - { kind: sentence, ja: "しずかだし、べんりだし、すきだ。", en: "It's quiet, and what's more it's convenient, so I like it.", exercises: [shi-listing], mode: build }
      - { kind: sentence, ja: "あめだし、さむいし、いえに いる。", en: "It's raining, and what's more it's cold, so I'm staying home.", exercises: [shi-listing], mode: build }
      - { kind: sentence, ja: "この みせは さいこうだ。", en: "This shop is the best.", exercises: [na-adj-present], mode: build }
      - { kind: sentence, ja: "テストは さいあくだった。", en: "The test was the worst.", exercises: [ta-form], mode: build }
      - { kind: particle-cloze, stem: "やすい", tail: "、おいしいし、かいたい。", answer: "し", options: ["し", "から", "ので"], en: "It's cheap, and what's more it's tasty, so I want to buy it.", explanation: "し piles up reasons — cheap AND tasty, all pointing the same way. から/ので each state exactly ONE reason and stop there; they can't chain a second clause the way し does without simply repeating themselves." }
      - { kind: listening-comp, audio: "しずかだし、べんりだし、すきだ。", answer: "It's quiet, and what's more it's convenient, so I like it.", distractors: ["It's quiet, but it's not convenient.", "It's convenient, but not quiet.", "It's neither quiet nor convenient."] }
      - { kind: kanji, kana: さいこう, kanji: 最高, distractors: ["さいだい", "こうこう", "さいてい"], exercises: [shi-listing] }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "この みせ どう？", en: "How's this shop?" }
          - { speaker: "Mika", ja: "やすいし、おいしいし、さいこうだよ。", en: "It's cheap, and what's more it's tasty — it's the best." }
          - { speaker: "Ken", ja: "そう、また こよう。", en: "Really — let's come again." }
        questions:
          - { q: "What does Mika say about the shop?", options: ["It's cheap and tasty", "It's expensive but tasty", "It's cheap but not tasty", "It's far away"], answer: "It's cheap and tasty" }
      - { kind: challenge, ja: "やすいし、べんりだから、かおうと おもう。", en: "It's cheap, and what's more it's convenient, so I think I'll buy it.", combines: [shi-listing, kara-because, to-omoimasu], mode: build }
    reviewPool: [みせ, テスト, いえ, あめ, ケーキ, カフェ, がっこう, しごと]

