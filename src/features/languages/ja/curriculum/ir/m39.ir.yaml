notes: |
  m39 · n4-10 — CONCESSION & REASONS (docs/spine-n4.md §n4-10,
  docs/ja-m39-brief-2026-09-10.md). Ships 12 lessons (the brief's own §1
  correction of the spine's "~11" — every N4 module m34-m38 has shipped
  exactly 12; inv 25 requires it).

  WHAT IS TAUGHT:
  1. **〜のに, concession (L1 intro, L2 production):** the minimal pair of
     m16's ので (id node-because, cited not restated). Identical joint —
     plain form, な before noun/な-adjective, never だ — but the opposite
     relationship: ので presents a reason as flat fact, のに demands the
     second half CLASH with the first, and it never leaves the room
     emotionally neutral (complaint, disappointment, reproach). L1 opens
     resolve-free (たかいのに かった); L2 pushes into explicit complaint
     register with ねつが あるのに がっこうに いった.
  2. **〜ても, concession over an action/quality (L3):** free-form since
     て(m8)+も(m3) are both owned — only the MEANING is new. Reaches
     forward into something not yet decided (or generally true) and holds
     regardless: たかくても かう. Contrasted with のに (which needs a
     done, clashing event) and から (which would make the concession
     clause a REASON, backwards).
  3. **〜でも on nouns/な-adjectives (L5):** ても's cousin for things that
     can't take a て-form — がくせいでも わかる. NOT the sentence-initial
     でも ("but", courseAtoms id "demo", blocked) — same two kana, this
     one glues onto a noun/な-adjective inside a clause instead of opening
     a new sentence. No new atom created for this でも; the existing
     "demo" atom absorbs the token match, which is correct (same word,
     related job — polysemy, not the し/四 collision class below).
  4. **疑問詞+でも／も, closed set (L6):** なんでも/だれでも/どこでも/
     だれも(〜ない)/なにも(〜ない), taught as five fixed phrases, not a
     productive rule — the module never invents どちらでも or いくらでも.
     Each tokenizes automatically from already-registered atoms (なん/
     だれ/どこ/なに + でも/も, all prior), so no new atom rows are needed
     for the set itself.
  5. **〜し, listing reasons (L7):** "and what's more" — plain form + し,
     piling up supporting reasons toward one conclusion (やすいし、
     おいしいし、かいたい), same joint as から/ので/けど but a different
     job: a PILE of reasons, not one reason or a contrast.

  THE し/四 HOMOGRAPH (brief §0, flagged as a should-fix-alongside
  engineering task): courseAtoms already registers atom id "shi" (kana し,
  kanji 四, "four", fromModule m13, blocked). 〜し-listing tokenizes as a
  bare し token immediately after the preceding predicate (no space —
  やすいし splits やすい ｜ し the same way たなかさん splits たなか ｜ さん),
  which without a fix would credit every listing-し sentence toward Track A
  FSRS state for the numeral "four". FIXED here, not deferred: added a
  second positional exception to `exercised()` in moduleCompiler.ts,
  mirroring the existing さん/三 exception exactly — a bare し immediately
  following a token ending in a plain-predicate sound (い/く/ぐ/す/つ/ぬ/ぶ/
  む/う/る/た/だ) is read as the listing suffix, never the numeral. This is
  the compiler-side mirror the brief recommends as primary, not the
  narrower "avoid the surface in the IR" fallback — the fallback isn't
  available here, since the module's whole point is authoring sentences
  where listing-し appears in beats that get exercised()'d for grammar
  credit; there is no way to teach 〜し without exposing the token. The one
  accepted tradeoff, documented at the fix site: a hypothetical future
  十四(じゅうし) sentence would also fail to credit "four" (十 ends in う,
  which matches the same guard) — an under-count on an already-blocked
  stub, traded for closing a real, high-volume false-credit path.

  VOCAB (spine must/prefer, brief §1 corrections applied — 34 is an
  aspirational ceiling, not a quota; m34-m38 shipped 14/8/15/7/12):
  5 of the spine's 16 words are ALREADY taught — ねつ(m22), いそがしい(m15),
  ひま(m9), うるさい(m28), しずか(m12) — used here as CARRIERS only, never
  re-registered. 11 genuinely new headwords: ざんねん(残念, na-adj,
  "a shame, regrettable" — the canonical complaint/regret na-adjective,
  chosen specifically so たいへん does NOT also carry that sense), むり
  (無理, na-adj, "unreasonable, no way"), じゅうぶん(十分, na-adj,
  "enough"), とくべつ(特別, na-adj, "special"), さいこう(最高, na-adj/noun,
  "the best"), さいあく(最悪, na-adj/noun, "the worst"), やむをえない
  (idiom, sidequest — no freqRank, cut first if density runs over budget),
  しかたない(idiom, sidequest — same), plus three EXISTING blocked/
  half-registered courseAtoms stub rows repointed to this module rather
  than re-created (brief §1 + §2 explicit instruction): きたない(汚い,
  "dirty", stays blocked — 🗑️ reads "garbage" not "dirty", existing note
  kept), たいへん(大変, stays the existing "very" ADVERB sense only — no
  na-adjective "big deal" sense added, per brief; used here purely as an
  intensifier), つまらない(詰まらない, "boring", stays UNBLOCKED — 🥱 yawn
  is an honest picture for boredom, existing note kept, gets its normal
  word_image_mcq debut).

  DERIVED FORMS: this module's own て-form ledger for the ても family
  (course convention since m27: a conjugated surface used anywhere needs
  its own row, no live derivation engine) — たかくて/いそがしくて/ふって/
  つかれて/うるさくて. も and でも and し all ride on ALREADY-registered
  particle/atom tokens (も, でも="demo", し="shi" per the guard above), so
  none of those need combined derived rows of their own.

  DIALOGUE_SIM ×2 (brief §4 table, exactly 2 — no kind:contrast anywhere;
  todo-transfer-diagram-rollout.md's proposed contrast beat type stays
  unshipped, per brief §6):
    - L3, weekend plans despite rain: concede a plan holds regardless of an
      obstacle (あめが ふっても いく), then regardless of being busy
      (いそがしくても いく) — ても's whole job, run twice.
    - L10, the errand that won't wait: combines ても (つかれても いく) with
      し (やすいし、べんりだし、いく) across two turns — the module's two
      newest grammars meeting inside one scene.

  L9 IS THE DISCRIMINATION LESSON, BY PARTICLE-CLOZE, NOT BY A CONTRAST
  BEAT: a third noni-concession variant ("discrimination") rule card states
  the test directly (does swapping in "even though" or "because" keep the
  sentence's logic?), then a battery of particle-cloze items pins のに
  against ので and から on matched near-pairs (あめなので いえに いる /
  あめなのに こうえんに いった; じかんが ないのに いった / じかんが ないので
  いかなかった). Every のに PRODUCTION prompt in the module carries an
  explicit emotional-colour or contradiction cue in its English gloss or
  surrounding context (a complaint, a "and yet", a clash) — never a
  register-neutral gloss — per the brief's §5 done-criterion; the bespoke
  test ratchet checks this.

  CLOSED-SET DISCIPLINE (brief §5 done-criterion, bespoke ratchet): every
  でも/も closed-set item that appears anywhere in the module is one of the
  five taught in L6 (なんでも/だれでも/どこでも/だれも/なにも) — no novel
  question-word+でも/も combination is ever generated, in a challenge beat,
  a review, or a filler distractor.

  BUILD-TILE PARTICLE SEPARATION (brief §5 self-check): checked
  lesson-authoring-guide.md §13.10's separated-tile list (は/が/を/に/で/
  の/から/か/です) against this module's needs. That list is the OLD
  hand-authored M3-M7 mechanism; m39 compiles through moduleCompiler.ts,
  whose tokenizer already splits any registered atom or particle out as
  its own tile via longest-match (confirmed against さん/です precedent).
  し, でも, の, に, も and か are ALL already independently tokenizable
  (し and でも as registered atoms; の/に/も/か as PARTICLES-array
  entries) — every particle this module needs already ships as its own
  build tile with zero code changes. No extension to any tile-separation
  list was needed or made.

  spiralWith: m16 (から/ので/けど family) — realized concretely in
  review-1/review-2/review-3's reviewPool and cloze contrasts, and named
  explicitly in L9's discrimination rule card.

  ATOM-EXPOSURE AUDIT (graded-but-never-advances-FSRS, MAX_GRADED_BUT_
  NEVER_WRITES=62): all 10 of this module's non-derived new content words
  (ざんねん, むり, じゅうぶん, たいへん, つまらない, とくべつ, さいこう,
  さいあく, やむをえない, しかたない) initially landed "stuck" — graded
  only inside the teaching lesson that introduces them. That's not a
  content bug, it's how `shouldWriteContentReviewAtom` (reviewTailSrs.ts)
  is supposed to work: D2 blocks an atom's OWN introducing module from
  writing its FSRS card, by design, so the word doesn't get marked
  "known" before the learner has left the lesson that just taught it. The
  fix is not a compiler change or a ratchet bump — `isDedicatedReviewLesson`
  writes unconditionally, independent of module, so a second graded touch
  inside one of THIS module's own review-1/2/3 lessons (not just a later
  module) already satisfies the ratchet. Added exactly one review-lesson
  sentence beat per stuck atom, each reusing the atom's own teaching-
  lesson sentence verbatim (same TTS hash, no new audio surface beyond
  what the teaching lesson already required): ざんねん/むり/じゅうぶん →
  review-1 (all three are introduced in L1/L3, before review-1 runs);
  たいへん/つまらない/とくべつ/さいこう/さいあく → review-2 (introduced in
  L5-L7, before review-2); やむをえない/しかたない → review-3 (the only
  review lesson after L9/L10, where they're introduced). This mirrors the
  pattern already used throughout review-1/2/3 for grammar-carrier
  sentences (e.g. "たかいのに かった。" is reused verbatim across review-1
  and review-3) — reviewing new module vocab a second time inside the
  module's own review tail, not just waiting on a future module, is the
  token-neutral fix.

grammarPoints:
  - id: noni-concession
    variant: intro
    rule: "のに and ので (module 16, id node-because) are built from the exact same joint — hang on the plain form, な after a noun or な-adjective, never だ — which is exactly why they're easy to mix up. ので presents a reason as simply how things are: neutral, matter-of-fact. のに presents the OPPOSITE relationship: not a reason, a CONTRADICTION, and it never leaves the room emotionally neutral. 「たかいのに かった」 isn't just 'it was expensive, and I bought it' — it carries a little shrug, almost a confession: it was expensive, and yet I bought it anyway. Whatever follows のに has to CLASH with what came before it; ので never asks that of its second half."
    examples:
      - { ja: "たかいのに かった。", en: "It was expensive, and yet I bought it." }
      - { ja: "がんばったのに おちた。", en: "I tried hard, and yet I failed." }
      - { ja: "むりなのに、やった。", en: "It was unreasonable, and yet I did it." }
      - { ja: "じかんが ないのに、いった。", en: "I had no time, and yet I went." }
    antiPattern: { ja: "たかいので かった。", why: "ので reports this as a flat, reasoned fact — nothing clashes, no shrug. のに is what carries the contradiction: it was expensive, and yet I bought it anyway: たかいのに かった。" }
  - id: noni-concession
    variant: production
    rule: "Now push のに into the register it actually lives in: complaint. Every real use of のに carries some flavor of disapproval, surprise, or reproach — you had every reason NOT to do the thing, and did it anyway, and the sentence says so. 「ねつが あるのに がっこうに いった」 isn't neutral reporting; it's the sentence a worried friend says next: you had a fever, and you WENT? That emotional colour is not optional decoration on のに — it is what のに means. A gloss that reads perfectly flat ('I had a fever and went to school') is a sign you've drifted toward ので's job, not のに's."
    examples:
      - { ja: "ねつが あるのに がっこうに いった。", en: "I had a fever, and yet I went to school." }
      - { ja: "ひまなのに、いえに いる。", en: "Even though I'm free, I'm staying home." }
      - { ja: "きたないのに、すきだ。", en: "It's dirty, and yet I like it." }
      - { ja: "うるさいのに、がんばった。", en: "It was noisy, and yet I did my best." }
    antiPattern: { ja: "ねつが あるので がっこうに いった。", why: "ので reports this as a flat, reasoned choice — no fever, no clash, nothing a worried friend would remark on. のに is what carries the 'and yet you WENT?' feeling: ねつが あるのに がっこうに いった。" }
  - id: temo-concession
    rule: "〜ても is concession over an action or a quality — 'even if / even though'. The form is already yours: て(module 8) glued to a verb or an い-adjective, plus も(module 3). たかい → たかくて → たかくても. The only new piece is the MEANING. のに reports something that already happened and already clashed — a done contradiction, always a little sour. ても reaches forward into something not yet decided, or something generally true, and holds regardless: 「たかくても かう」 = even if it's expensive, I'll buy it — resolve, not regret. 「あめが ふっても いく」 = even if it rains, I'll go. The clause after ても doesn't have to be sour at all; it can be plain determination."
    examples:
      - { ja: "たかくても かう。", en: "Even if it's expensive, I'll buy it." }
      - { ja: "あめが ふっても いく。", en: "Even if it rains, I'll go." }
      - { ja: "いそがしくても てつだう。", en: "Even though I'm busy, I'll help." }
      - { ja: "じゅうぶんだ。", en: "That's enough." }
    antiPattern: { ja: "たかいも かう。", why: "ても needs the て-form underneath it — たかい bends to たかくて first. Bare たかい plus も skips that step and isn't a word: たかくても かう。" }
  - id: demo-concession
    rule: "でも does for nouns and な-adjectives what ても does for verbs and い-adjectives: concession, 'even'. Attach で (the copula's connecting shape) plus も directly to the noun or な-adjective: 「がくせいでも わかる」 = even a student understands; 「ひまでも いかない」 = even though I'm free, I won't go. One warning, mechanical not semantic: this でも is NOT the sentence-starting でも you already know ('but', its own sentence). Same two kana, different job — that one opens a brand-new sentence; this one glues onto a word inside one clause."
    examples:
      - { ja: "がくせいでも わかる。", en: "Even a student understands." }
      - { ja: "ひまでも いかない。", en: "Even though I'm free, I won't go." }
      - { ja: "あめでも いく。", en: "Even if it's rain, I'll go." }
    antiPattern: { ja: "がくせいても わかる。", why: "ても attaches to a て-form; がくせい is a noun with no て-form to attach to at all. Nouns and な-adjectives take でも instead: がくせいでも わかる。" }
  - id: demo-mo-closed-set
    rule: "A closed set, memorized whole, not derived live: question-word + でも or + も. なんでも = anything, だれでも = anyone, どこでも = anywhere — the でも family means 'no matter which, it doesn't matter.' Flip でも to も with a NEGATIVE verb and the same question words swing to the opposite extreme: だれも いない = nobody is there (not 'anybody is there'), なにも たべない = I'm not eating anything. Ship exactly these five — なんでも/だれでも/どこでも/だれも/なにも — and no others; the course does not derive でも-mo compounds from a productive rule."
    examples:
      - { ja: "なんでも たべる。", en: "I'll eat anything." }
      - { ja: "だれでも わかる。", en: "Anyone understands." }
      - { ja: "どこでも いい。", en: "Anywhere is fine." }
      - { ja: "だれも いない。", en: "Nobody is here." }
      - { ja: "なにも たべない。", en: "I'm not eating anything." }
    antiPattern: { ja: "なにでも たべる。", why: "なに shifts to なん before でも/も in this fixed set — なんでも, not なにでも. The other four (だれでも/どこでも/だれも/なにも) keep their bare stem; なに is the one that changes shape." }
  - id: noni-concession
    variant: discrimination
    rule: "The test for telling のに and ので apart: swap in an English connector and see which one keeps the sentence's LOGIC intact. If 'because' fits, it's ので — a plain consequence, no tension. 「あめなので いえに いる」 = it's raining, so I'm staying home; nothing clashes. If 'even though' fits, it's のに — a contradiction. 「あめなのに こうえんに いった」 = it was raining, and yet I went to the park; rain and going-to-the-park don't belong together, and that clash is the whole point. Watch the SECOND half: a plain consequence of the first half is ので's job; anything that fights the first half is のに's."
    examples:
      - { ja: "あめなので いえに いる。", en: "It's raining, so I'm staying home." }
      - { ja: "あめなのに こうえんに いった。", en: "It was raining, and yet I went to the park." }
      - { ja: "じかんが ないのに いった。", en: "I had no time, and yet I went." }
      - { ja: "じかんが ないので いかなかった。", en: "I had no time, so I didn't go." }
    antiPattern: { ja: "あめなのに いえに いる。", why: "Raining and staying home aren't in conflict — that's exactly what you'd expect, a plain consequence, ので's job. のに would claim a contradiction that isn't there: あめなので いえに いる is the sentence this actually is." }
  - id: shi-listing
    rule: "〜し lists reasons the way English 'and, what's more' does: plain form plus し, piling reasons toward one conclusion, with the flavor that there's more where that came from. 「おいしいし、やすいし、ほしい」 = it's tasty, and what's more it's cheap, so I want it — two reasons stacked, then the payoff. Same joint as から/ので/けど — plain form, な after a noun or な-adjective — but a different job: not ONE reason (から/ので) and not a contrast (けど), a PILE of reasons all pointing the same direction."
    examples:
      - { ja: "おいしいし、やすいし、ほしい。", en: "It's tasty, and what's more it's cheap, so I want it." }
      - { ja: "しずかだし、べんりだし、すきだ。", en: "It's quiet, and what's more it's convenient, so I like it." }
      - { ja: "あめだし、さむいし、いえに いる。", en: "It's raining, and what's more it's cold, so I'm staying home." }
    antiPattern: { ja: "おいしいから、やすいから、ほしい。", why: "から states one reason and stops — repeating it doesn't chain the way し does. Stacking reasons with the 'and what's more' feel needs し: おいしいし、やすいし、ほしい。" }

newAtoms:
  # ══ のに itself, glued (mirrors m16's own ので atom, courseAtoms id
  # "node" — without a combined atom the longest-match tokenizer falls back
  # to greedy の + に, splitting the whole concession joint into two bare
  # particle tiles and crediting only p-no/p-ni, never the construction).
  - { kana: のに, romaji: noni, gloss: "even though, and yet (concession)", shortGloss: "and yet", imageable: false, kind: vocab }
  # ══ New headwords (na-adjectives unless noted). imageable:false — abstract
  # states/judgments with no honest single-frame picture, same ruling class
  # as m38's こわれる/ふえる/へる run.
  - { kana: ざんねん, romaji: zannen, gloss: "a shame, regrettable", shortGloss: "a shame", imageable: false, kind: adjective }
  - { kana: むり, romaji: muri, gloss: "unreasonable, no way, impossible", shortGloss: "no way", imageable: false, kind: adjective }
  - { kana: じゅうぶん, romaji: juubun, gloss: "enough, sufficient", shortGloss: "enough", imageable: false, kind: adjective }
  - { kana: とくべつ, romaji: tokubetsu, gloss: "special", shortGloss: "special", imageable: false, kind: adjective }
  - { kana: さいこう, romaji: saikou, gloss: "the best, greatest", shortGloss: "the best", imageable: false, kind: adjective }
  - { kana: さいあく, romaji: saiaku, gloss: "the worst", shortGloss: "the worst", imageable: false, kind: adjective }
  - { kana: やむをえない, romaji: yamuwoenai, gloss: "it can't be helped, unavoidable", shortGloss: "can't be helped", imageable: false, kind: adjective }
  - { kana: しかたない, romaji: shikatanai, gloss: "it can't be helped, oh well", shortGloss: "oh well", imageable: false, kind: adjective }
  # ══ Existing courseAtoms stub rows repointed to this module (brief §1/§2:
  # do not re-create — flip blocked/fromModule/introducedByLessonId in the
  # courseAtoms.ts edit, list here only so priorVocab/lesson.introduces see
  # them as m39's own, same ruling as m38's なくす "future"-tag treatment).
  - { kana: きたない, romaji: kitanai, gloss: "dirty", shortGloss: "dirty", imageable: false, kind: adjective }
  - { kana: たいへん, romaji: taihen, gloss: "very (intensifier)", shortGloss: "very", imageable: false, kind: adjective }
  - { kana: つまらない, romaji: tsumaranai, gloss: "boring", shortGloss: "boring", imageable: true, kind: adjective }
  # ══ Derived て-forms for the ても family (course convention since m27: no
  # live derivation engine, every conjugated surface used anywhere needs its
