  - id: m32-neo-11
    role: teaching
    title: "たら と と — the same two events, two different claims"
    focus: "Both forms owned, run against each other on identical content so the only variable left is what the speaker is claiming"
    introduces: []
    beats:
      # NO rule beat and NO new vocabulary. Every card in this module has
      # already been shown; what has not been done is putting the two forms on
      # the SAME sentence and making the learner choose. That is the whole
      # lesson, and a fresh rule card here would only re-explain what the
