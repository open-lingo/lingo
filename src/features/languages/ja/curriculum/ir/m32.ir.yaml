  - id: m32-neo-7
    role: teaching
    title: "「ついたら、でんわを して ください」 — what と cannot say"
    focus: "The module's payload: と's promise that the result always follows is exactly what forbids a request, an invitation or a plan after it"
    introduces: [とまる, わたったら, まがって, おして]
    beats:
      # THE CONTRAST LESSON. One new word only — the restriction is the whole
      # job here and it cannot afford to also be a vocabulary lesson.
      - { kind: rule, grammarPointId: to-conditional, variant: restriction }
      - { kind: sentence, ja: "えきに ついたら、でんわを して ください。", en: "When you get to the station, please call", exercises: [tara, te-kudasai, ni-location], mode: build }
      - { kind: sentence, ja: "ボタンを おすと、ドアが うごく。", en: "If you press the button, the door moves", exercises: [to-conditional, wo-object, ga-existence], mode: build }
      - { kind: sentence, ja: "ボタンを おすと、きかいが とまる。", en: "If you press the button, the machine stops", exercises: [to-conditional, wo-object, ga-existence], mode: build }
      - { kind: sentence, ja: "やすみに なったら、うみに いきましょう。", en: "When the holidays come, let's go to the sea", exercises: [tara, mashou, ni-time], mode: build }
      - { kind: sentence, ja: "うちに かえったら、ねる つもりだ。", en: "When I get home, I intend to sleep", exercises: [tara, tsumori-desu, ni-location], mode: build }
      # The tell, drilled directly: look at the END of the sentence.
      - { kind: particle-cloze, stem: "えきに ", tail: "、でんわを して ください。", answer: "ついたら", options: ["ついたら", "つくと", "つく"], en: "When you get to the station, please call", explanation: "the sentence ends in ください, and a request is something that might not happen — と has already promised the result ALWAYS follows, so it cannot take one. Swap to たら and the sentence is fine. This is the single most useful test in the module: read the ending first." }
      - { kind: sentence, ja: "かぎを まわすと、くるまが とまる。", en: "If you turn the key, the car stops", exercises: [to-conditional, wo-object, ga-existence], mode: build }
      - { kind: sentence, ja: "しごとが おわったら、ごはんを たべに いきましょう。", en: "When work finishes, let's go and eat", exercises: [tara, mashou, ni-iku], mode: build }
      - { kind: particle-cloze, stem: "やすみに ", tail: "、うみに いきましょう。", answer: "なったら", options: ["なったら", "なると", "なる"], en: "When the holidays come, let's go to the sea", explanation: "ましょう is an invitation, so the same test applies — と cannot promise that the holidays automatically produce a trip to the sea. たら is the form for anything the speaker is proposing rather than reporting." }
      - { kind: sentence, ja: "はるに なると、はなが さく。", en: "When spring comes, the flowers bloom", exercises: [to-conditional, ni-time], mode: build }
      - { kind: kanji, kana: でんわ, kanji: 電話, distractors: ["てんわ", "でんは", "でんき"], exercises: [to-conditional] }
      - { kind: sentence, ja: "この みちを わたったら、みぎに まがって ください。", en: "When you've crossed this road, please turn right", exercises: [tara, te-kudasai, ni-location], mode: build }
      - { kind: sentence, ja: "きかいが とまると、おとが きこえない。", en: "When the machine stops, you can't hear the sound", exercises: [to-conditional, mieru-kikoeru, nai-form], mode: translate }
      - { kind: particle-cloze, stem: "うちに ", tail: "、ねる つもりだ。", answer: "かえったら", options: ["かえったら", "かえると", "かえる"], en: "When I get home, I intend to sleep", explanation: "つもり is a plan, and a plan is the speaker's intention rather than a law of the world — so it needs たら. と would be claiming that getting home always puts this person to sleep." }
      - { kind: sentence, ja: "ふゆに なると、ゆきが ふる。", en: "When winter comes, it snows", exercises: [to-conditional, ni-time], mode: listening }
      - { kind: listening-comp, audio: "えきに ついたら、でんわを して ください。", answer: "When you get to the station, please call", distractors: ["When you get to the station, the phone rings", "When I get to the station, I'll call", "If you call, please come to the station"], exercises: [tara, te-kudasai] }
      - { kind: listening-comp, audio: "ボタンを おすと、きかいが とまる。", answer: "If you press the button, the machine stops", distractors: ["If you press the button, the machine starts", "Please press the button and stop the machine", "When the machine stopped, I pressed the button"], exercises: [to-conditional, ga-existence] }
      - kind: dialogue
        lines:
          - { speaker: "Tanaka", ja: "この おおきい ボタンは なに？", en: "What's this big button?" }
          - { speaker: "Tom", ja: "おすと、きかいが とまる。", en: "If you press it, the machine stops." }
          - { speaker: "Tanaka", ja: "しごとが おわったら、それを おす。", en: "When work finishes, you press it." }
          - { speaker: "Tom", ja: "はい。", en: "Got it." }
        questions:
          - { q: "Why does Tanaka's last sentence use たら and not と?", options: ["Because it ends in a request, and と cannot take one", "Because the work has already finished", "Because ボタン is a katakana word", "Because Tanaka is being polite to Tom"], answer: "Because it ends in a request, and と cannot take one" }
      - { kind: challenge, ja: "しごとが おわったら、きかいが とまるまで その ボタンを おして ください。", en: "When work finishes, please hold that button down until the machine stops", combines: [tara, to-conditional, te-kudasai, made-until], mode: build }
    reviewPool: [とまる, ボタン, きかい, ドア, かぎ, やすみ, うみ, しごと, えき, でんわ]

