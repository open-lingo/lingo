notes: |
  m32 = n4-03, the THIRD module of the N4 tier. `docs/spine-n4.md` §`n4-03` is
  the source of truth.

  THE PAYLOAD — たら is the hub, and と is the only thing it is contrasted with.

  1. **たら costs NOTHING to build.** It is the た-form the learner has owned
     since m11, with ら on the end. The tier's most useful conditional is also
     its cheapest, and the module opens by saying exactly that: there is no new
     conjugation to learn here, only a new place to put a form you already make.
  2. **たら covers BOTH "if" and "when", and that ambiguity is a FEATURE.**
     English forces the speaker to commit — "if it rains" vs "when it rains" —
     and Japanese does not. Teaching it as one thing is not a simplification;
     it is what the form is. Which reading the listener takes comes from whether
     the event is certain, and the sentence does not have to say.
  3. **と is たら's true minimal pair, which is why it ships here and not
     later.** Same English gloss, and the difference is mechanical rather than a
     feel: と states an INVARIABLE consequence — natural law, machines,
     directions — and its main clause therefore cannot be a request, an
     invitation, a command or an intention. ×「ボタンを おすと、おして ください」
     is broken as a shape, not as a nuance, so the pair has a drillable tell.
  4. **PAIRWISE ONLY.** ば and なら are n4-08, five modules out, and the four-way
     contrast exists ONLY in the m51 capstone. This is the RUN-PLAN standing
     decision 5 that the N5 spine made for register — pairwise on introduction,
     N-way on review — and it is why this module never mentions ば or なら, not
     even to say they exist.

  Shape: 13 lessons = 9 teaching + 3 review + 1 challenge, reviews at lessons
  4/8/12, challenge LAST (inv 25). NO katakana rows (that programme ended at
  m11), so the compiled order IS the shipped order. NO `kind: register` beats —
  that machinery is m10 + m29 only.

  DEVIATIONS + DECISIONS, per the RUN-PLAN "decide and document" rule:

  - **FOUR INVENTED GRAMMAR-POINT IDS — `tara`, `to-conditional`, `tara-dou`
    and `gurai-goro` — BECAUSE THE N4 TIER STILL HAS NO REGISTRY.** m30 recorded
    this as a tier prerequisite, m31 recorded that it had not landed, and it
    still has not: `n5-grammar-points.json` holds 103 points and not one is an
    N4 item. `to-conditional` is deliberately NOT named `to`, because `to-and`
    is a shipped N5 point for the listing particle and a learner meeting both
    ids in one course deck would be told they are the same rule.

  - **NO SCENE, and the reason is worth recording** because m32 looks like it
    wants one. A `timeline` would draw 「あめが ふったら、いえに いる」 correctly
    — ① then ② — and would teach the WRONG FACT. Order is not what separates
    たら from と; both run forward. What separates them is CONTINGENCY versus
    INVARIABILITY, and no scene in the family draws that. Inventing a sixth
    scene kind inside a module about conditionals would be carrying two axes at
    once, which is the thing this tier's sequencing exists to prevent. Recorded
    as a scene candidate for a later pass, not built here.

  - **つく IS USED ONLY IN ITS TAUGHT SENSE.** The spine's n4-03 vocab list
    names つく, and 【えきに ついたら】 is the single most canonical たら sentence in
    the language, so this module leans on it hard. That つく is 着く, "to
    arrive" 🛬, and m23 already teaches it. 点く / 付く — the light comes on — is a
    different verb wearing the same kana, and it is NOT introduced here:
    teaching a homograph split inside a module about conditionals would be
    carrying two axes at once, which is the thing this tier's sequencing exists
    to prevent. The machine sentences use うごく and とまる instead.

    **This also means m33 should NOT build its transitivity set on つく / つける.**
    The six pairs are a free choice, and the pairs whose intransitive half is
    ALREADY TAUGHT cost the learner half as much: あく / あける (あける is m14),
    はいる / いれる (はいる is m16), and とまる / とめる (とまる is adopted here).
    Recorded for m33 rather than decided here.

  - **きゅうに IS DROPPED from the allocation.** The spine lists it; the course
    teaches きゅう as 九, "nine" (9️⃣, m9). 「きゅうに とまる」 reads as "stops at
    nine o'clock" to a learner whose only きゅう is the numeral, and no amount of
    context fixes a number sitting in front of に in a course that has drilled
    に-for-time since m11. It belongs in a module that can afford to separate
    them; this one cannot.

  - **THE DIRECTIONS VOCABULARY IS ADOPTED, NOT INVENTED — and adopting it
    revives thirteen dead rows.** と-for-directions is one of the three domains
    the spine names for it, and the course had no word for road, right, left,
    straight, turn or cross. It turned out it DID: みち, みぎ, ひだり, まっすぐ,
    まがる, わたる and とまる all carry `courseAtoms` rows tagged
    `fromModule: m17`, with emoji already chosen and already vendored — and
    appear in NO lesson, in any module, anywhere. Six more (おす, ボタン,
    こうさてん, かど, さく, おわる) sat on `future`.

    Being precise about the harm, because the first draft of this note
    overstated it: these rows do NOT leak into the flashcard deck as words the
    learner never met. The m8+ module fallback in `lessonAtomIndex.ts` unlocks
    "the module's attributed atoms whose surface form appears in the lesson's
    steps", so an atom that appears in no step never matches and never unlocks.
    They are DEAD WEIGHT rather than a live bug — rows carried in the deck
    definition that no path could reach. **120 of the 961 rows are in that
    state** (12.5%; m17 alone holds 15). m32 revives thirteen of them by
    retagging `fromModule` to `m32` and actually teaching them, which is the
    あげる/m31 adoption pattern. See the orphan-row issue doc.

  - **FIFTEEN MIS-TAGGED ATOMS WERE REPAIRED WHILE ALLOCATING THIS MODULE, and
    that repair is a live-bug fix rather than housekeeping.** Two words this
    module needs — つく and ふる — turned out to be TAUGHT (m23 and m25 name them
    in `newAtoms`) while their `courseAtoms` rows still said `fromModule:
    "future"`. `future` is owned by no module, so the fallback can never reach
    those atoms: the learner is taught the word, graded on it, and it can never
    enter the review deck. That is the exact defect fixed for m30/m31 on
    2026-08-18, in the opposite direction from the dead rows above. Sweeping
    every module's `newAtoms` against the registry found **16 candidates, 15 of
    them real**: ふたつ うる (m9), きょうだい はたち (m17), ちかてつ (m19), どっち
    (m20), ひこうき つく (m23), ふる (m25), どうぶつ おもい ことば (m26), かみ つくえ
    (m27), うるさい (m28). The sixteenth, きた at m11, is a FALSE POSITIVE and
    was left alone: m11 teaches 来た, the past of くる, and the sweep matched the
    unrelated 北 "north" row by kana. Retagging changes no row and therefore
    cannot re-tokenize anything the way m16's ので did; the full suite was run
    against the change and stayed green.

  - **ぐらい and ごろ are the quantity drip's m32 allocation** (spine thr1:
    every closed-class item has exactly one owning module — ぐらい/ごろ here,
    だけ/しか m35, ほど m37, など m42). They ride L8 rather than getting a
    lesson of their own, because they are a pair of suffixes rather than a
    construction, and because the module's step budget belongs to the たら / と
    contrast.

grammarPoints:
  # NOTE ON RULE-CARD VOCABULARY. A `kind: rule` beat compiles to a PINNED
  # step, so any word a rule card names has already "appeared" before the
  # lesson's picture MCQ can run — which breaks the image-debut invariant for
  # that word (inv 30). Every card below is therefore written against words
  # that are ALREADY MET at the lesson it sits in. That is why the と-automatic
  # card argues from seasons rather than from the button and the machine it
  # actually teaches, and why the directions card uses only the four
  # direction words introduced one lesson earlier. The constraint improved the
  # cards: each one now argues from something the learner can already picture.

  - id: tara
    variant: shape
    rule: "たら is the cheapest thing in this whole level. Take the plain past — the た-form you have made since module 11 — and put ら on the end. たべた becomes たべたら, いった becomes いったら, ふった becomes ふったら. That is the entire construction: no new conjugation, nothing to memorise beyond \"the past form, plus ら\". It means \"if/when X happens\", and what follows is what happens next. The verb at the END of the sentence carries the tense, exactly as it did for まえに — たら itself never says when."
    examples:
      - { ja: "あめが ふったら、いえに いる。", en: "If it rains, I'll stay home." }
      - { ja: "えきに ついたら、でんわを かける。", en: "When I get to the station, I'll call." }
      - { ja: "ごはんを たべたら、ねる。", en: "When I've eaten, I'll sleep." }
      - { ja: "おかねが あったら、くるまを かう。", en: "If I had money, I'd buy a car." }
      - { ja: "うちに かえったら、しゅくだいを する。", en: "When I get home, I'll do my homework." }
    antiPattern: { ja: "あめが ふるたら、いえに いる。", why: "ら goes on the PAST form, never the dictionary form — ふる becomes ふった first: あめが ふったら、いえに いる。" }

  - id: tara
    variant: if-when
    rule: "English makes you choose. \"If it rains\" doubts the rain; \"when it rains\" expects it. Japanese does not make you choose, and たら is the same word for both. 「あめが ふったら」 is if-or-when, and the sentence never says which — the listener works it out from whether the thing is likely. That is not Japanese being vague. It is Japanese leaving out a distinction English is forced to carry, the same way it leaves out the difference between one book and some books. Do not go looking for a second form for \"when\"; たら is it."
    examples:
      - { ja: "はるに なったら、はなが さく。", en: "When spring comes, the flowers bloom." }
      - { ja: "あした あめが ふったら、いかない。", en: "If it rains tomorrow, I won't go." }
      - { ja: "だいがくに はいったら、にほんごを ならう。", en: "When I get into university, I'll study Japanese." }
      - { ja: "じかんが あったら、あそぶ。", en: "If I have time, I'll play." }
      - { ja: "うちに かえったら、ほんを よむ。", en: "When I get home, I'll read a book." }

  - id: tara
    variant: request
    rule: "Here is what たら can do that と cannot, and it is the practical half of this module. The second clause of a たら sentence may be anything at all — a request, an invitation, a want, a plan. 「えきに ついたら、でんわを して ください」. 「やすみに なったら、うみに いきたい」. Nothing is blocked, because たら only claims that one thing follows another and makes no claim that it always does. Whenever you are unsure which conditional to reach for, たら is the safe answer."
    examples:
      - { ja: "えきに ついたら、でんわを して ください。", en: "When you get to the station, please call." }
      - { ja: "やすみに なったら、うみに いきたい。", en: "When the holidays come, I want to go to the sea." }
      - { ja: "その ほんを よんだら、わたしに かして ください。", en: "When you've read that book, please lend it to me." }
      - { ja: "じかんが あったら、あそびに いきましょう。", en: "If you have time, let's go and hang out." }
      - { ja: "うちに かえったら、しゅくだいを して ください。", en: "When you get home, please do your homework." }

  - id: to-conditional
    variant: automatic
    rule: "と is the other conditional, and it says something stronger: EVERY TIME. Put the dictionary form in front of it and と claims the result is automatic — this is how the world works, not what you expect on this one occasion. Seasons are the clearest case: 「はるに なると、はなが さく」, and nobody has to decide whether the flowers feel like it. Anything mechanical behaves the same way, which is why you will meet と all through the sentences below on switches and engines. The form could not be simpler, because nothing changes at all: dictionary form, then と. What you are choosing when you reach for it is not a tense — it is a claim about the world."
    examples:
      - { ja: "はるに なると、はなが さく。", en: "When spring comes, the flowers bloom." }
      - { ja: "ふゆに なると、ゆきが ふる。", en: "When winter comes, it snows." }
      - { ja: "あきに なると、さむく なる。", en: "When autumn comes, it gets cold." }
      - { ja: "なつに なると、あつく なる。", en: "When summer comes, it gets hot." }
      - { ja: "はるに なると、あたたかく なる。", en: "When spring comes, it gets warm." }
    antiPattern: { ja: "はるに なったと、はなが さく。", why: "と takes the DICTIONARY form, never the past — たら is the one that takes た: はるに なると、はなが さく。" }

  - id: to-conditional
    variant: directions
    rule: "Directions are the everyday place と lives, and for the same reason as the seasons: a road does not sometimes lead to the station. 「この みちを まっすぐ いくと、えきが ある」 — go straight and the station is there, every time, for everyone. This is why you will hear と constantly the moment you ask somebody the way, and why the answer almost never comes back with たら: the person giving directions is describing the town, not guessing about you."
    examples:
      - { ja: "この みちを まっすぐ いくと、えきが ある。", en: "If you go straight along this road, the station is there." }
      - { ja: "みぎに いくと、こうえんが ある。", en: "If you go right, there's a park." }
      - { ja: "ひだりに いくと、びょういんが みえる。", en: "If you go left, you can see the hospital." }
      - { ja: "この みちを まっすぐ いくと、がっこうが ある。", en: "If you go straight along this road, there's the school." }
      - { ja: "みぎに いくと、としょかんが ある。", en: "If you go right, there's a library." }

  - id: to-conditional
    variant: restriction
    rule: "と has ONE restriction and it is the whole contrast lesson. Because と claims the result is automatic, the second half cannot be something you are asking for, suggesting, ordering or planning — those are all things that might not happen, and と has already promised that this one always does. ×「えきに つくと、でんわを して ください」 is broken as a shape. Swap in たら and it is fixed: 「えきに ついたら、でんわを して ください」. So the test is mechanical rather than a feel: look at the END of the sentence. If it is ください, ましょう, たい, つもり, or a plain command, you need たら."
    examples:
      - { ja: "えきに ついたら、でんわを して ください。", en: "When you get to the station, please call." }
      - { ja: "この ボタンを おすと、ドアが うごく。", en: "If you press this button, the door moves." }
      - { ja: "やすみに なったら、うみに いきましょう。", en: "When the holidays come, let's go to the sea." }
      - { ja: "うちに かえったら、ねる つもりだ。", en: "When I get home, I intend to sleep." }
      - { ja: "ふゆに なると、ゆきが ふる。", en: "When winter comes, it snows." }
    antiPattern: { ja: "えきに つくと、でんわを して ください。", why: "と promises the result always happens, so its second half cannot be a request — たら takes those: えきに ついたら、でんわを して ください。" }

  - id: tara-dou
    variant: suggestion
    rule: "One ready-made phrase, and it is the politest way to suggest something in the language. Hang どうですか on a たら clause and you have \"how about ~ing?\": 「いしゃに いったら どうですか」. It is softer than a suggestion because it never actually says what you should do; it asks the other person what they make of the idea. 〜たら いい is the same shape making a recommendation instead of a question — 「はやく ねたら いい」, you'd do well to sleep early. Both are just たら with something on the end, so there is nothing new to build."
    examples:
      - { ja: "いしゃに いったら どうですか。", en: "How about going to a doctor?" }
      - { ja: "ちかてつに のったら どうですか。", en: "How about taking the underground?" }
      - { ja: "はやく ねたら いい。", en: "You'd do well to sleep early." }
      - { ja: "せんせいに きいたら どうですか。", en: "How about asking the teacher?" }
      - { ja: "ちかみちを とおったら いい。", en: "You'd do well to take the shortcut." }

  - id: gurai-goro
    variant: approximation
    rule: "Two suffixes that make a number approximate, and the only thing to get right is which one takes which kind of number. ごろ goes on a POINT in time — 「さんじごろ」, around three o'clock. ぐらい goes on an AMOUNT — 「じゅっぷんぐらい」, about ten minutes; 「せんえんぐらい」, about a thousand yen. A clock time takes ごろ, a quantity takes ぐらい, and the tell is whether you could ask \"how long\" or \"how many\" about it. ごろ also replaces に when it lands on a time — 「さんじごろ いく」, not 「さんじごろに いく」."
    examples:
      - { ja: "さんじごろ うちに かえる。", en: "I'll go home around three." }
      - { ja: "えきまで じゅっぷんぐらい かかる。", en: "It takes about ten minutes to the station." }
      - { ja: "この ほんは せんえんぐらいだ。", en: "This book is about a thousand yen." }
      - { ja: "しちじごろ ごはんを たべる。", en: "I eat around seven." }
      - { ja: "ちかてつに じゅっぷんぐらい のったら、うみに つく。", en: "If you ride the underground for about ten minutes, you reach the sea." }
    antiPattern: { ja: "さんじぐらい うちに かえる。", why: "a point on the clock takes ごろ, not ぐらい — ぐらい is for amounts: さんじごろ うちに かえる。" }

newAtoms:
  # ══ R1 landing 2026-08-20: five heavily-exercised words this module GRADES
  #    but nothing ever introduced (the こうえん class — the exact leak the
  #    fromModule restamp surfaced). Declared at their first-use lessons so the
  #    compiler treats them as module-new; テレビ/ねる/つかれる own their glyphs
  #    and picture-debut, the rest are imageable:false (emoji census — owners
  #    named in their courseAtoms notes).
  - { kana: テレビ, romaji: terebi, gloss: "television", shortGloss: "TV", kind: vocab }
  - { kana: しゅくだい, romaji: shukudai, gloss: "homework", shortGloss: "homework", imageable: false, kind: vocab }
  - { kana: ねる, romaji: neru, gloss: "to go to bed, to sleep", shortGloss: "go to bed", imageable: false, kind: verb }
  - { kana: ばんごはん, romaji: bangohan, gloss: "evening meal, dinner", shortGloss: "dinner", imageable: false, kind: vocab }
  - { kana: かける, romaji: kakeru, gloss: "to call (by phone)", shortGloss: "call", imageable: false, kind: verb }
  - { kana: こうえん, romaji: kouen, gloss: "park", shortGloss: "park", imageable: false, kind: vocab }
  - { kana: とお, romaji: too, gloss: "ten (native counting)", shortGloss: "ten", imageable: false, kind: vocab }
  - { kana: つかれる, romaji: tsukareru, gloss: "to get tired", shortGloss: "get tired", kind: verb }
  # ══ L1. Six たら forms and nothing else. The module's opening claim is that
  #    たら costs nothing, so the first lesson introduces no vocabulary at all —
  #    only the forms, built from verbs the learner has owned for twenty
  #    modules. Every one is `imageable: false`: a conditional is not a picture.
  - { kana: ふったら, romaji: "futtara", gloss: "if/when it falls (fall, conditional)", shortGloss: "if it falls (fall)", imageable: false, kind: verb-form, derivedFrom: ふる, verbClass: u }
  - { kana: ついたら, romaji: "tsuitara", gloss: "if/when I arrive (arrive, conditional)", shortGloss: "if I arrive", imageable: false, kind: verb-form, derivedFrom: つく, verbClass: u }
  - { kana: たべたら, romaji: "tabetara", gloss: "if/when I eat (eat, conditional)", shortGloss: "if I eat", imageable: false, kind: verb-form, derivedFrom: たべる, verbClass: ru }
  - { kana: かえったら, romaji: "kaettara", gloss: "if/when I get home (go back, conditional)", shortGloss: "if I go back", imageable: false, kind: verb-form, derivedFrom: かえる, verbClass: u }
  - { kana: あったら, romaji: "attara", gloss: "if there is (there is, conditional)", shortGloss: "if there is", imageable: false, kind: verb-form, derivedFrom: ある, verbClass: u }
  - { kana: よんだら, romaji: "yondara", gloss: "if/when I read (read, conditional)", shortGloss: "if I read", imageable: false, kind: verb-form, derivedFrom: よむ, verbClass: u }
  # ══ L2. なったら carries the if/when lesson, because a season arriving is the
  #    clearest case in the language of an event that is certain AND still takes
  #    たら. さく is `imageable: false` — its 🌷 reads as はな, met since m1.
  - { kana: なったら, romaji: "nattara", gloss: "if/when it becomes (become, conditional)", shortGloss: "if it becomes (become)", imageable: false, kind: verb-form, derivedFrom: なる, verbClass: u }
  - { kana: はいったら, romaji: "haittara", gloss: "if/when I get in (enter, conditional)", shortGloss: "if I enter", imageable: false, kind: verb-form, derivedFrom: はいる, verbClass: u }
  - { kana: さく, romaji: "saku", gloss: "to bloom", shortGloss: "bloom", imageable: false, kind: verb, verbClass: u }
  # ══ L3. THE DIRECTION VOCABULARY DEBUTS HERE, three lessons before the と
  #    card that needs it. That is deliberate and it is forced: a rule beat
  #    compiles to a PINNED step, so the directions card at L6 could not name
  #    みち, みぎ, ひだり or まっすぐ if they debuted alongside it. Teaching the
  #    words first and the construction later is better sequencing anyway, and
  #    "when you've crossed the road, turn right" is a request — which is
  #    exactly what this lesson is about. Four arrows that mean four different
  #    things is also the best word_image_mcq set in the module: each one
  #    disambiguates the others.
  - { kana: おわる, romaji: "owaru", gloss: "to finish, to end", shortGloss: "finish", imageable: true, kind: verb, verbClass: u }
  - { kana: おわったら, romaji: "owattara", gloss: "if/when it finishes (finish, conditional)", shortGloss: "if it finishes (finish)", imageable: false, kind: verb-form, derivedFrom: おわる, verbClass: u }
  - { kana: みち, romaji: "michi", gloss: "a road, a street", shortGloss: "road", imageable: true, kind: vocab }
  - { kana: みぎ, romaji: "migi", gloss: "the right, the right-hand side", shortGloss: "right", imageable: true, kind: vocab }
  - { kana: ひだり, romaji: "hidari", gloss: "the left, the left-hand side", shortGloss: "left", imageable: true, kind: vocab }
  - { kana: まっすぐ, romaji: "massugu", gloss: "straight ahead", shortGloss: "straight", imageable: true, kind: vocab }
  # ══ L5. The machines. おす is `imageable: false` because 👆 reads as まっすぐ's
  #    ⬆️ and まっすぐ is met two lessons earlier; まわす likewise, against
  #    まがる's ↩️. ボタン, きかい, うごく and おと each own a glyph nothing else
  #    in the course uses, so four of the six debut on a picture.
  - { kana: ボタン, romaji: "botan", gloss: "a button", shortGloss: "button", imageable: true, kind: vocab }
  - { kana: おす, romaji: "osu", gloss: "to press, to push", shortGloss: "press", imageable: false, kind: verb, verbClass: u }
  - { kana: きかい, romaji: "kikai", gloss: "a machine", shortGloss: "machine", imageable: true, kind: vocab }
  - { kana: うごく, romaji: "ugoku", gloss: "to move, to run (of a machine)", shortGloss: "move", imageable: true, kind: verb, verbClass: u }
  - { kana: おと, romaji: "oto", gloss: "a sound", shortGloss: "sound", imageable: true, kind: vocab }
  - { kana: まわす, romaji: "mawasu", gloss: "to turn, to rotate", shortGloss: "turn", imageable: false, kind: verb, verbClass: u }
  - { kana: うごいて, romaji: "ugoite", gloss: "moves, and… (move, te-form)", shortGloss: "move (te)", imageable: false, kind: verb-form, derivedFrom: うごく, verbClass: u }
  # ══ L6. The rest of the street, introduced under the と card that can now
  #    name the L3 words but not these. とおる is `imageable: false` — a verb of
  #    passage has no honest glyph.
  - { kana: まがる, romaji: "magaru", gloss: "to turn, to bend", shortGloss: "turn (a corner)", imageable: true, kind: verb, verbClass: u }
  - { kana: わたる, romaji: "wataru", gloss: "to cross, to go across", shortGloss: "cross", imageable: true, kind: verb, verbClass: u }
  - { kana: こうさてん, romaji: "kousaten", gloss: "an intersection", shortGloss: "intersection", imageable: true, kind: vocab }
  - { kana: かど, romaji: "kado", gloss: "a corner", shortGloss: "corner", imageable: true, kind: vocab }
  - { kana: ちかみち, romaji: "chikamichi", gloss: "a shortcut", shortGloss: "shortcut", imageable: true, kind: vocab }
  - { kana: とおる, romaji: "tooru", gloss: "to go along, to pass through", shortGloss: "pass through", imageable: false, kind: verb, verbClass: u }
  # ══ L7. One word, because the restriction lesson's whole job is the contrast
  #    and it cannot afford to also be a vocabulary lesson.
  - { kana: とまる, romaji: "tomaru", gloss: "to stop, to come to a halt", shortGloss: "stop", imageable: true, kind: verb, verbClass: u }
  - { kana: わたったら, romaji: "watattara", gloss: "if/when you cross (cross, conditional)", shortGloss: "if you cross", imageable: false, kind: verb-form, derivedFrom: わたる, verbClass: u }
  - { kana: まがって, romaji: "magatte", gloss: "turn, and… (turn a corner, te-form)", shortGloss: "turn (te)", imageable: false, kind: verb-form, derivedFrom: まがる, verbClass: u }
  - { kana: おして, romaji: "oshite", gloss: "press, and… (press, te-form)", shortGloss: "press (te)", imageable: false, kind: verb-form, derivedFrom: おす, verbClass: u }
  # ══ L9. Six more たら forms, all built from verbs owned since m7. Nothing
  #    structural is new in that lesson — it is たら with a fixed tail — so its
  #    budget goes on the conditionals the learner will actually reach for.
  - { kana: いったら, romaji: "ittara", gloss: "if/when I go (go, conditional)", shortGloss: "if I go", imageable: false, kind: verb-form, derivedFrom: いく, verbClass: irregular }
  - { kana: のったら, romaji: "nottara", gloss: "if/when I get on (get on, conditional)", shortGloss: "if I get on", imageable: false, kind: verb-form, derivedFrom: のる, verbClass: u }
  - { kana: ねたら, romaji: "netara", gloss: "if/when I sleep (sleep, conditional)", shortGloss: "if I sleep", imageable: false, kind: verb-form, derivedFrom: ねる, verbClass: ru }
  - { kana: きいたら, romaji: "kiitara", gloss: "if/when I ask (ask, conditional)", shortGloss: "if I ask", imageable: false, kind: verb-form, derivedFrom: きく, verbClass: u }
  - { kana: とおったら, romaji: "toottara", gloss: "if/when I go along (pass through, conditional)", shortGloss: "if I pass through", imageable: false, kind: verb-form, derivedFrom: とおる, verbClass: u }
  - { kana: のんだら, romaji: "nondara", gloss: "if/when I drink (drink, conditional)", shortGloss: "if I drink", imageable: false, kind: verb-form, derivedFrom: のむ, verbClass: u }
  # ══ L10. The quantity drip's m32 allocation. Both are closed-class suffixes
  #    and neither has a referent a picture could name.
  - { kana: かかる, romaji: "kakaru", gloss: "to take (time or money)", shortGloss: "take (time)", imageable: false, kind: verb, verbClass: u }
  - { kana: ぐらい, romaji: "gurai", gloss: "about, approximately (of an amount)", shortGloss: "about", imageable: false, kind: vocab }
  - { kana: ごろ, romaji: "goro", gloss: "around (of a point in time)", shortGloss: "around", imageable: false, kind: vocab }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m32-neo-1
    role: teaching
    title: "「あめが ふったら」 — the past form, plus ら"
    focus: "たら costs nothing to build: it is the た-form the learner has owned since m11 with ら on the end"
    introduces: [ふったら, ついたら, たべたら, かえったら, あったら, よんだら, テレビ, しゅくだい, ねる, ばんごはん, かける]
    beats:
      # NO new vocabulary in this lesson, on purpose. The module's opening
      # claim is that たら is free, and a lesson that also taught six words
      # would contradict it before the learner had built a single one.
      - { kind: rule, grammarPointId: tara, variant: shape }
      - { kind: sentence, ja: "あめが ふったら、いえに いる。", en: "If it rains, I'll stay home", exercises: [tara, ta-form, ga-existence], mode: build }
      - { kind: sentence, ja: "えきに ついたら、でんわを かける。", en: "When I get to the station, I'll call", exercises: [tara, ni-location, wo-object], mode: build }
      - { kind: sentence, ja: "ごはんを たべたら、ねる。", en: "When I've eaten, I'll sleep", exercises: [tara, wo-object], mode: listening }
      - { kind: sentence, ja: "うちに かえったら、しゅくだいを する。", en: "When I get home, I'll do my homework", exercises: [tara, ni-location, wo-object], mode: build }
      - { kind: sentence, ja: "おかねが あったら、くるまを かう。", en: "If I had money, I'd buy a car", exercises: [tara, ga-existence, wo-object], mode: build }
      # The anti-pattern, drilled rather than only stated: ら lands on the PAST.
      - { kind: particle-cloze, stem: "あめが ", tail: "、いえに いる。", answer: "ふったら", options: ["ふったら", "ふる", "ついたら"], en: "If it rains, I'll stay home", explanation: "ら goes on the plain PAST, so ふる becomes ふった first and then ふったら. The bare dictionary form ふる cannot carry a condition at all, and ついたら is the right shape on the wrong verb — it is the rain that has to fall here." }
      - { kind: sentence, ja: "その ほんを よんだら、わたしに かす。", en: "When I've read that book, I'll lend it to you", exercises: [tara, wo-object, ni-recipient], mode: build }
      - { kind: sentence, ja: "じかんが あったら、あそぶ。", en: "If I have time, I'll hang out", exercises: [tara, ga-existence], mode: translate }
      - { kind: kanji, kana: えき, kanji: 駅, distractors: ["えぎ", "うま", "やく"], exercises: [tara] }
      - { kind: sentence, ja: "くうこうに ついたら、でんわを かける。", en: "When I get to the airport, I'll call", exercises: [tara, ni-location, wo-object], mode: listening }
      - { kind: sentence, ja: "ばんごはんを たべたら、テレビを みる。", en: "When I've had dinner, I'll watch television", exercises: [tara, wo-object], mode: build }
      - { kind: sentence, ja: "うちに かえったら、ほんを よむ。", en: "When I get home, I'll read a book", exercises: [tara, ni-location, wo-object], mode: translate }
      - { kind: particle-cloze, stem: "ごはんを ", tail: "、ねる。", answer: "たべたら", options: ["たべたら", "たべる", "たべたり"], en: "When I've eaten, I'll sleep", explanation: "たべる is a る-verb, so its past is たべた and the conditional is たべたら. The dictionary form たべる cannot carry a condition, and たべたり is the ~たり~たり list form from module 23 — it lines up examples, it does not set one up." }
      - { kind: sentence, ja: "あめが ふったら、いかない。", en: "If it rains, I won't go", exercises: [tara, nai-form], mode: build }
      - { kind: sentence, ja: "ほんを よんだら、しごとに いく。", en: "When I've read my book, I'll go to work", exercises: [tara, wo-object, ni-location], mode: listening }
      - { kind: listening-comp, audio: "えきに ついたら、でんわを かける。", answer: "When I get to the station, I'll call", distractors: ["When I get to the airport, I'll call", "When I called, I got to the station", "If I get to the station, I won't call"], exercises: [tara, ni-location] }
      - { kind: listening-comp, audio: "おかねが あったら、くるまを かう。", answer: "If I had money, I'd buy a car", distractors: ["I have money, so I'll buy a car", "If I had money, I'd buy a book", "If I had time, I'd buy a car"], exercises: [tara, ga-existence] }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "あした なにを する？", en: "What are you doing tomorrow?" }
          - { speaker: "Tom", ja: "あめが ふったら、いえに いる。", en: "If it rains, I'll stay home." }
          - { speaker: "Mika", ja: "じかんが あったら、あそぶ？", en: "If you've got time, want to hang out?" }
        questions:
          - { q: "What decides whether Tom stays home?", options: ["Whether it rains", "Whether Mika is free", "Whether he has money", "Whether he finishes his homework"], answer: "Whether it rains" }
      - { kind: challenge, ja: "うちに かえったら ばんごはんを たべて、しゅくだいを する。", en: "When I get home I'll have dinner and do my homework", combines: [tara, te-form, wo-object, ni-location], mode: build }
    reviewPool: [あめ, えき, でんわ, ごはん, しゅくだい, おかね, くるま, ほん, じかん, がっこう]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m32-neo-2
    role: teaching
    title: "「はるに なったら」 — if and when are the same word"
    focus: "たら does not commit to whether the event is doubtful or certain, and the learner must stop looking for a second form"
    introduces: [なったら, はいったら, さく, こうえん]
    beats:
      # Seasons first, because a season arriving is the clearest case in the
      # language of an event that is CERTAIN and still takes たら. If the
      # ambiguity were taught on あめ alone the learner would conclude たら
      # means "if".
      - { kind: rule, grammarPointId: tara, variant: if-when }
      - { kind: sentence, ja: "はるに なったら、はなが さく。", en: "When spring comes, the flowers bloom", exercises: [tara, ni-time, ga-existence], mode: build }
      - { kind: sentence, ja: "ふゆに なったら、ゆきが ふる。", en: "When winter comes, it snows", exercises: [tara, ni-time, ga-existence], mode: build }
      - { kind: sentence, ja: "あした あめが ふったら、いかない。", en: "If it rains tomorrow, I won't go", exercises: [tara, nai-form], mode: build }
      - { kind: sentence, ja: "あきに なったら、さむく なる。", en: "When autumn comes, it gets cold", exercises: [tara, ku-ni-naru, ni-time], mode: build }
      # The pair that makes the point: same form, one certain, one doubtful.
      - { kind: particle-cloze, stem: "はるに ", tail: "、はなが さく。", answer: "なったら", options: ["なったら", "なる", "なった"], en: "When spring comes, the flowers bloom", explanation: "spring is certain to come, and たら is STILL the form — Japanese does not make you pick between if and when. ら needs the past, so なる on its own will not do, and なった is that past without the ら that turns it into a condition." }
      - { kind: sentence, ja: "だいがくに はいったら、にほんごを ならう。", en: "When I get into university, I'll study Japanese", exercises: [tara, ni-location, wo-object], mode: build }
      - { kind: sentence, ja: "なつに なったら、うみに いく。", en: "When summer comes, I'll go to the sea", exercises: [tara, ni-time, ni-location], mode: listening }
      - { kind: sentence, ja: "やすみに なったら、りょこうを する。", en: "When the holidays come, I'll take a trip", exercises: [tara, ni-time, wo-object], mode: translate }
      - { kind: kanji, kana: はる, kanji: 春, distractors: ["ばる", "はろ", "しゅう"], exercises: [tara] }
      - { kind: sentence, ja: "がっこうに はいったら、ともだちが できる。", en: "When I start school, I'll make friends", exercises: [tara, dekiru, ga-existence], mode: build }
      - { kind: sentence, ja: "じかんが あったら、あそびに いく。", en: "If I have time, I'll come over", exercises: [tara, ni-iku, ga-existence], mode: build }
      - { kind: sentence, ja: "うちに かえったら、ほんを よむ。", en: "When I get home, I'll read a book", exercises: [tara, wo-object], mode: listening }
      - { kind: particle-cloze, stem: "だいがくに ", tail: "、にほんごを ならう。", answer: "はいったら", options: ["はいったら", "はいる", "かえったら"], en: "When I get into university, I'll study Japanese", explanation: "はいる is a う-verb ending in る, so its past is はいった — the same った you built for かう and まつ — and the conditional is はいったら. かえったら is built correctly but names the wrong event." }
      - { kind: sentence, ja: "ふゆに なったら、さむく なる。", en: "When winter comes, it gets cold", exercises: [tara, ku-ni-naru], mode: translate }
      - { kind: listening-comp, audio: "はるに なったら、はなが さく。", answer: "When spring comes, the flowers bloom", distractors: ["When autumn comes, the flowers bloom", "When spring comes, it snows", "If the flowers bloom, spring will come"], exercises: [tara, ni-time] }
      - { kind: listening-comp, audio: "あした あめが ふったら、いかない。", answer: "If it rains tomorrow, I won't go", distractors: ["It rained yesterday, so I didn't go", "If it rains tomorrow, I'll go", "If it snows tomorrow, I won't go"], exercises: [tara, nai-form] }
      - kind: dialogue
        lines:
          - { speaker: "Tom", ja: "はるに なったら、なにを する？", en: "What'll you do when spring comes?" }
          - { speaker: "Mika", ja: "はなが さくから、こうえんに いく。", en: "The flowers bloom, so I'll go to the park." }
          - { speaker: "Tom", ja: "あめが ふったら？", en: "And if it rains?" }
          - { speaker: "Mika", ja: "うちで ほんを よむ。", en: "I'll read at home." }
        questions:
          - { q: "Which of Mika's two plans depends on something that might not happen?", options: ["Reading at home — it depends on rain", "Going to the park — spring might not come", "Both of them", "Neither of them"], answer: "Reading at home — it depends on rain" }
      - { kind: challenge, ja: "はるに なったら はなが さくから、ともだちと こうえんに いきたい。", en: "When spring comes the flowers bloom, so I want to go to the park with a friend", combines: [tara, kara-because, v-tai, to-and], mode: build }
    reviewPool: [はる, なつ, あき, ふゆ, はな, ゆき, だいがく, やすみ, りょこう, こうえん]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m32-neo-3
    role: teaching
    title: "「ついたら、でんわを して ください」 — たら takes any ending"
    focus: "The practical half: たら's second clause may be a request, an invitation, a want or a plan — and this is the lesson that will separate it from と"
    introduces: [おわる, おわったら, みち, みぎ, ひだり, まっすぐ]
    beats:
      # The four direction words debut HERE, three lessons before the と card
      # that argues from them — see the newAtoms note. A rule beat is pinned,
      # so they could not debut on a picture in their own lesson.
      - { kind: rule, grammarPointId: tara, variant: request }
      - { kind: sentence, ja: "えきに ついたら、でんわを して ください。", en: "When you get to the station, please call", exercises: [tara, te-kudasai, wo-object], mode: build }
      - { kind: sentence, ja: "しごとが おわったら、ごはんを たべに いきましょう。", en: "When work finishes, let's go and eat", exercises: [tara, mashou, ni-iku], mode: build }
      - { kind: sentence, ja: "やすみに なったら、うみに いきたい。", en: "When the holidays come, I want to go to the sea", exercises: [tara, v-tai, ni-location], mode: build }
      - { kind: sentence, ja: "その ほんを よんだら、わたしに かして ください。", en: "When you've read that book, please lend it to me", exercises: [tara, te-kudasai, ni-recipient], mode: build }
      - { kind: sentence, ja: "この みちを まっすぐ いって ください。", en: "Please go straight along this road", exercises: [te-kudasai, wo-object], mode: build }
      - { kind: sentence, ja: "こうえんは みぎですか、ひだりですか。", en: "Is the park on the right or the left?", exercises: [ka-question, desu-copula], mode: build }
      - { kind: sentence, ja: "じかんが あったら、あそびに いきましょう。", en: "If you have time, let's go and hang out", exercises: [tara, mashou, ni-iku], mode: build }
      - { kind: particle-cloze, stem: "しごとが ", tail: "、ごはんを たべに いきましょう。", answer: "おわったら", options: ["おわったら", "おわると", "おわる"], en: "When work finishes, let's go and eat", explanation: "the second half is an invitation, and an invitation is something that might not happen — so it needs たら. と would be claiming that finishing work ALWAYS produces a meal out, which is a promise nobody can make. This is the restriction the module builds to." }
      - { kind: sentence, ja: "うちに かえったら、しゅくだいを して ください。", en: "When you get home, please do your homework", exercises: [tara, te-kudasai, wo-object], mode: build }
      - { kind: kanji, kana: しごと, kanji: 仕事, distractors: ["しごど", "しじ", "こと"], exercises: [tara] }
      - { kind: sentence, ja: "えきに ついたら、みぎに いって ください。", en: "When you get to the station, please go right", exercises: [tara, te-kudasai, ni-location], mode: build }
      - { kind: sentence, ja: "ひだりの みちを いって ください。", en: "Please take the road on the left", exercises: [te-kudasai, no-possession, wo-object], mode: translate }
      - { kind: sentence, ja: "しごとが おわったら、うちに かえる つもりだ。", en: "When work finishes, I intend to go home", exercises: [tara, tsumori-desu, ni-location], mode: listening }
      - { kind: listening-comp, audio: "えきに ついたら、でんわを して ください。", answer: "When you get to the station, please call", distractors: ["When you get to the station, I'll call you", "When you get home, please call", "If you called, you'd get to the station"], exercises: [tara, te-kudasai] }
      - { kind: listening-comp, audio: "やすみに なったら、うみに いきたい。", answer: "When the holidays come, I want to go to the sea", distractors: ["When the holidays come, I want to go to the mountains", "During the holidays I went to the sea", "When the holidays come, let's go to the sea"], exercises: [tara, v-tai] }
      - kind: dialogue
        lines:
          - { speaker: "Tanaka", ja: "えきは どこですか。", en: "Where's the station?" }
          - { speaker: "Mika", ja: "この みちを まっすぐ いって ください。", en: "Please go straight along this road." }
          - { speaker: "Tanaka", ja: "みぎですか、ひだりですか。", en: "On the right, or the left?" }
          - { speaker: "Mika", ja: "ついたら、みぎです。", en: "When you get there, it's on the right." }
        questions:
          - { q: "Where is the station?", options: ["Straight along the road, then on the right", "Straight along the road, then on the left", "Left first, then straight", "Right at this corner"], answer: "Straight along the road, then on the right" }
      - { kind: challenge, ja: "しごとが おわったら、この みちを まっすぐ いって えきで まって ください。", en: "When work finishes, please go straight along this road and wait at the station", combines: [tara, te-form, te-kudasai, de-action], mode: build }
    reviewPool: [みち, みぎ, ひだり, まっすぐ, しごと, えき, でんわ, やすみ, うみ, ちかてつ]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m32-neo-review-1
    role: review
    title: "Review — one form, three jobs"
    focus: "たら drilled across all three of its readings before と arrives to contrast with it"
    introduces: []
    beats:
      # Sits after shape (L1), if/when (L2) and request (L3), so it reviews all
      # three variants of the SAME point rather than three different points.
      # と is deliberately absent: it has not been taught yet, and a review that
      # previewed it would spoil the contrast L5-L7 is built on.
      - { kind: sentence, ja: "あめが ふったら、いえに いる。", en: "If it rains, I'll stay home", exercises: [tara, ga-existence], mode: build }
      - { kind: sentence, ja: "はるに なったら、はなが さく。", en: "When spring comes, the flowers bloom", exercises: [tara, ni-time], mode: build }
      - { kind: sentence, ja: "えきに ついたら、でんわを して ください。", en: "When you get to the station, please call", exercises: [tara, te-kudasai], mode: listening }
      - { kind: sentence, ja: "しごとが おわったら、ごはんを たべに いきましょう。", en: "When work finishes, let's go and eat", exercises: [tara, mashou], mode: build }
      - { kind: sentence, ja: "だいがくに はいったら、にほんごを ならう。", en: "When I get into university, I'll study Japanese", exercises: [tara, wo-object], mode: build }
      - { kind: particle-cloze, stem: "ごはんを ", tail: "、ねる。", answer: "たべたら", options: ["たべたら", "たべる", "たべたり"], en: "When I've eaten, I'll sleep", explanation: "ら lands on the plain past, so たべる gives たべた and then たべたら." }
