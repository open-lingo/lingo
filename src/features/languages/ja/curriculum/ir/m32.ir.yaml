  # ═══════════════════════════════════════════════════════════════════════
  - id: m32-neo-5
    role: teaching
    title: "「ボタンを おすと」 — the result that never varies"
    focus: "と's claim is stronger than たら's: not what happens this time, but what happens every time"
    introduces: [ボタン, おす, きかい, うごく, おと, まわす, うごいて, とお]
    beats:
      # The rule card argues from SEASONS, not from the button — every machine
      # word in this lesson debuts on a picture, and a pinned rule beat naming
      # them would take that debut away. The machines then carry the beats,
      # which is the right division of labour anyway: seasons make the claim
      # easy to believe, machines make it useful.
      - { kind: rule, grammarPointId: to-conditional, variant: automatic }
      - { kind: sentence, ja: "はるに なると、はなが さく。", en: "When spring comes, the flowers bloom", exercises: [to-conditional, ni-time, ga-existence], mode: build }
      - { kind: sentence, ja: "ふゆに なると、ゆきが ふる。", en: "When winter comes, it snows", exercises: [to-conditional, ni-time, ga-existence], mode: build }
      - { kind: sentence, ja: "ボタンを おすと、きかいが うごく。", en: "If you press the button, the machine starts", exercises: [to-conditional, wo-object, ga-existence], mode: build }
      - { kind: sentence, ja: "この ボタンを おすと、おとが きこえる。", en: "If you press this button, you hear a sound", exercises: [to-conditional, mieru-kikoeru, wo-object], mode: build }
      - { kind: sentence, ja: "かぎを まわすと、くるまが うごく。", en: "If you turn the key, the car starts", exercises: [to-conditional, wo-object, ga-existence], mode: build }
      # The form drill: と takes the DICTIONARY, たら took the past. This is the
      # only place the two are mechanically confusable.
      - { kind: particle-cloze, stem: "はるに ", tail: "、はなが さく。", answer: "なると", options: ["なると", "なったと", "なったら"], en: "When spring comes, the flowers bloom", explanation: "と goes on the DICTIONARY form, which is the exact mirror of たら — たら wanted the past and と wants なる. なったと borrows たら's past and pins と on it, which is not a form. なったら IS real Japanese, but it makes the weaker claim: this card is about the result that never varies, and that is what と states." }
      - { kind: sentence, ja: "あきに なると、さむく なる。", en: "When autumn comes, it gets cold", exercises: [to-conditional, ku-ni-naru], mode: build }
      - { kind: sentence, ja: "きかいが うごくと、おとが きこえる。", en: "When the machine runs, you hear a sound", exercises: [to-conditional, ga-existence, mieru-kikoeru], mode: build }
      - { kind: sentence, ja: "なつに なると、あつく なる。", en: "When summer comes, it gets hot", exercises: [to-conditional, ku-ni-naru, ni-time], mode: translate }
      - { kind: kanji, kana: くるま, kanji: 車, distractors: ["ぐるま", "くろま", "しゃりん"], exercises: [to-conditional] }
      - { kind: sentence, ja: "その ボタンを おすと、きかいが うごく。", en: "If you press that button, the machine starts", exercises: [to-conditional, wo-object], mode: listening }
      - { kind: sentence, ja: "かぎを まわすと、ドアが うごく。", en: "If you turn the key, the door moves", exercises: [to-conditional, wo-object, ga-existence], mode: build }
      - { kind: particle-cloze, stem: "ボタンを ", tail: "、きかいが うごく。", answer: "おすと", options: ["おすと", "おす", "おすから"], en: "If you press the button, the machine starts", explanation: "おす is a う-verb, so its dictionary form is おす and と attaches straight onto it. Bare おす leaves the two halves unjoined, and おすから says the machine starts BECAUSE you press — true, but it reports one occasion rather than stating how the machine works." }
      - { kind: sentence, ja: "はるに なると、あたたかく なる。", en: "When spring comes, it gets warm", exercises: [to-conditional, ku-ni-naru], mode: build }
      - { kind: listening-comp, audio: "ボタンを おすと、きかいが うごく。", answer: "If you press the button, the machine starts", distractors: ["If you press the button, the machine stops", "If you turn the key, the machine starts", "I pressed the button and the machine started"], exercises: [to-conditional, wo-object] }
      - { kind: listening-comp, audio: "ふゆに なると、ゆきが ふる。", answer: "When winter comes, it snows", distractors: ["When winter comes, it rains", "When autumn comes, it snows", "It snowed when winter came"], exercises: [to-conditional, ni-time] }
      - kind: dialogue
        lines:
          - { speaker: "Tanaka", ja: "この きかいは どう つかう？", en: "How do you use this machine?" }
          - { speaker: "Tom", ja: "この ボタンを おすと、うごく。", en: "If you press this button, it starts." }
          - { speaker: "Tanaka", ja: "おとが きこえる？", en: "Can you hear a sound?" }
          - { speaker: "Tom", ja: "うん。うごくと、おとが きこえる。", en: "Yeah. When it runs, you hear a sound." }
        questions:
          - { q: "When do you hear the sound?", options: ["Whenever the machine is running", "Only when you press the button twice", "Only in winter", "Never — it's silent"], answer: "Whenever the machine is running" }
      - { kind: challenge, ja: "その おおきい ボタンを おすと きかいが うごいて、おとが きこえる。", en: "If you press that big button the machine starts and you hear a sound", combines: [to-conditional, te-form, i-adj-present, mieru-kikoeru], mode: build }
    reviewPool: [ボタン, きかい, おと, かぎ, くるま, はる, ふゆ, なつ, あき, ゆき]

