  - id: m32-neo-6
    role: teaching
    title: "「まっすぐ いくと、えきが ある」 — asking the way"
    focus: "The everyday home of と: a road does not sometimes lead to the station, so directions almost never take たら"
    introduces: [まがる, わたる, こうさてん, かど, ちかみち, とおる]
    beats:
      # The rule card can name みち, まっすぐ, みぎ and ひだり because L3 taught
      # them — and it must not name まがる, わたる, こうさてん, かど or ちかみち,
      # which debut on pictures here.
      - { kind: rule, grammarPointId: to-conditional, variant: directions }
      - { kind: sentence, ja: "この みちを まっすぐ いくと、えきが ある。", en: "If you go straight along this road, the station is there", exercises: [to-conditional, wo-object, ga-existence], mode: build }
      - { kind: sentence, ja: "こうさてんを みぎに まがると、こうえんが ある。", en: "If you turn right at the intersection, there's a park", exercises: [to-conditional, wo-object, ni-location], mode: build }
      - { kind: sentence, ja: "その かどを ひだりに まがると、びょういんが みえる。", en: "If you turn left at that corner, you can see the hospital", exercises: [to-conditional, mieru-kikoeru, ni-location], mode: build }
      - { kind: sentence, ja: "この みちを わたると、がっこうが ある。", en: "If you cross this road, there's the school", exercises: [to-conditional, wo-object, ga-existence], mode: build }
      - { kind: sentence, ja: "ちかみちを とおると、はやく つく。", en: "If you take the shortcut, you get there quickly", exercises: [to-conditional, wo-object], mode: build }
      - { kind: sentence, ja: "こうさてんを わたると、としょかんが ある。", en: "If you cross the intersection, there's a library", exercises: [to-conditional, wo-object, ga-existence], mode: build }
      - { kind: particle-cloze, stem: "こうさてんを みぎに ", tail: "、こうえんが ある。", answer: "まがると", options: ["まがると", "まがる", "まがるから"], en: "If you turn right at the intersection, there's a park", explanation: "the park is there for everyone, every time — that is と on the dictionary form. Bare まがる leaves the halves unjoined, and まがるから would explain why rather than state what is always true." }
      - { kind: sentence, ja: "かどを まがると、みせが みえる。", en: "If you turn the corner, you can see the shop", exercises: [to-conditional, mieru-kikoeru], mode: build }
      - { kind: kanji, kana: がっこう, kanji: 学校, distractors: ["がくこう", "がっこ", "こうがく"], exercises: [to-conditional] }
      - { kind: sentence, ja: "この みちを まっすぐ いくと、うみが みえる。", en: "If you go straight along this road, you can see the sea", exercises: [to-conditional, mieru-kikoeru, wo-object], mode: listening }
      - { kind: sentence, ja: "ちかみちを とおると、はやく つく。", en: "If you take the shortcut, you get there quickly", exercises: [to-conditional, wo-object], mode: translate }
      - { kind: particle-cloze, stem: "ちかみちを ", tail: "、はやく つく。", answer: "とおると", options: ["とおると", "とおる", "とおるから"], en: "If you take the shortcut, you get there quickly", explanation: "a shortcut is shorter for everybody, so the result never varies and と is the natural form. Bare とおる leaves the halves unjoined, and とおるから explains this one journey rather than stating a fact about the route." }
      - { kind: sentence, ja: "おおきい みちを わたると、こうえんが みえる。", en: "If you cross the big road, you can see a park", exercises: [to-conditional, mieru-kikoeru, i-adj-present], mode: build }
      - { kind: listening-comp, audio: "こうさてんを みぎに まがると、こうえんが ある。", answer: "If you turn right at the intersection, there's a park", distractors: ["If you turn left at the intersection, there's a park", "If you turn right at the intersection, there's a station", "Turn right at the intersection, please"], exercises: [to-conditional, ni-location] }
      - { kind: listening-comp, audio: "ちかみちを とおると、はやく つく。", answer: "If you take the shortcut, you get there quickly", distractors: ["If you take this road, you get there quickly", "If you take the shortcut, you get tired", "I took the shortcut and got there quickly"], exercises: [to-conditional, wo-object] }
      - kind: dialogue
        lines:
          - { speaker: "Tanaka", ja: "びょういんは どこですか。", en: "Where's the hospital?" }
          - { speaker: "Mika", ja: "この みちを まっすぐ いくと、こうさてんが あります。", en: "If you go straight along this road there's an intersection." }
          - { speaker: "Mika", ja: "そこを ひだりに まがると、みぎに ありますよ。", en: "Turn left there and it's on your right." }
