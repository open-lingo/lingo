      - { kind: sentence, ja: "えきに ついたら、でんわを して ください。", en: "When you get to the station, please call", exercises: [tara, te-kudasai], mode: build }
      - { kind: particle-cloze, stem: "この みちを まっすぐ ", tail: "、えきが ある。", answer: "いくと", options: ["いくと", "いったら", "いく"], en: "If you go straight along this road, the station is there", explanation: "the station is there for everyone, every time — that is a fact about the town, so と is the natural form. いったら is not wrong here, but it claims less: it would only report what happens on this one walk." }
      - { kind: sentence, ja: "ふゆに なると、さむく なる。", en: "When winter comes, it gets cold", exercises: [to-conditional, ku-ni-naru], mode: listening }
      - { kind: sentence, ja: "ふゆに なったら、うみに いきたい。", en: "When winter comes, I want to go to the sea", exercises: [tara, v-tai], mode: translate }
