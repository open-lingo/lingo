  - id: m32-neo-9
    role: teaching
    title: "「いしゃに いったら どうですか」 — suggesting without telling"
    focus: "たら plus a ready-made ending: the politest suggestion in the language, and a recommendation that is the same shape"
    introduces: [いったら, のったら, ねたら, きいたら, とおったら, のんだら]
    beats:
      # Nothing structural is new here — it is たら with two fixed tails — so
      # the lesson spends its budget on the six conditional forms the learner
      # will actually reach for, all built from verbs owned since m7.
      - { kind: rule, grammarPointId: tara-dou, variant: suggestion }
      - { kind: sentence, ja: "いしゃに いったら どうですか。", en: "How about going to a doctor?", exercises: [tara-dou, ni-location], mode: build }
      - { kind: sentence, ja: "ちかてつに のったら どうですか。", en: "How about taking the underground?", exercises: [tara-dou, ni-location], mode: build }
      - { kind: sentence, ja: "せんせいに きいたら どうですか。", en: "How about asking the teacher?", exercises: [tara-dou, ni-recipient], mode: build }
      - { kind: sentence, ja: "くすりを のんだら どうですか。", en: "How about taking some medicine?", exercises: [tara-dou, wo-object], mode: build }
