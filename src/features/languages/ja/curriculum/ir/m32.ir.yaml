  # ═══════════════════════════════════════════════════════════════════════
  - id: m32-neo-10
    role: teaching
    title: "「さんじごろ」と「じゅっぷんぐらい」 — about, and around"
    focus: "The quantity drip's m32 pair: ごろ lands on a point in time, ぐらい on an amount, and nothing else separates them"
    introduces: [かかる, ぐらい, ごろ, つかれる]
    beats:
      # A pair of suffixes rather than a construction, so it rides one lesson
      # rather than owning a block. かかる is adopted with them because the
      # canonical ぐらい sentence cannot be written without it.
      - { kind: rule, grammarPointId: gurai-goro, variant: approximation }
      - { kind: sentence, ja: "さんじごろ うちに かえる。", en: "I'll go home around three", exercises: [gurai-goro, counter-ji], mode: build }
      - { kind: sentence, ja: "えきまで じゅっぷんぐらい かかる。", en: "It takes about ten minutes to the station", exercises: [gurai-goro, counter-fun, made-until], mode: build }
      - { kind: sentence, ja: "この ほんは せんえんぐらいだ。", en: "This book is about a thousand yen", exercises: [gurai-goro, ikura-price], mode: build }
      - { kind: sentence, ja: "しちじごろ ごはんを たべる。", en: "I eat around seven", exercises: [gurai-goro, counter-ji, wo-object], mode: listening }
      - { kind: sentence, ja: "くじごろ しごとが おわる。", en: "Work finishes around nine", exercises: [gurai-goro, counter-ji, ga-existence], mode: translate }
      - { kind: particle-cloze, stem: "さんじ", tail: " うちに かえる。", answer: "ごろ", options: ["ごろ", "ぐらい", "まで"], en: "I'll go home around three", explanation: "さんじ is a POINT on the clock, and points take ごろ. ぐらい is for amounts — じゅっぷんぐらい, about ten minutes, is a different claim entirely. The tell is whether you could ask how long about it." }
      - { kind: sentence, ja: "うちから こうえんまで ごふんぐらい かかる。", en: "It takes about five minutes from home to the park", exercises: [gurai-goro, kara-time, made-until], mode: build }
      - { kind: sentence, ja: "じゅっぷんぐらい あるくと、つかれる。", en: "If you walk for about ten minutes, you get tired", exercises: [gurai-goro, to-conditional], mode: build }
      - { kind: sentence, ja: "この くつは ごせんえんぐらいだ。", en: "These shoes are about five thousand yen", exercises: [gurai-goro, ikura-price], mode: translate }
      - { kind: particle-cloze, stem: "えきまで じゅっぷん", tail: " かかる。", answer: "ぐらい", options: ["ぐらい", "ごろ", "から"], en: "It takes about ten minutes to the station", explanation: "じゅっぷん here is a LENGTH of time, not a point on the clock — you could ask how long — so it takes ぐらい. ごろ would turn it into around ten past, which is not what the sentence is about." }
      - { kind: sentence, ja: "はちじごろ えきに ついたら、でんわを して ください。", en: "If you get to the station around eight, please call", exercises: [gurai-goro, tara, te-kudasai], mode: build }
      - { kind: kanji, kana: じかん, kanji: 時間, distractors: ["じがん", "ときま", "じっかん"], exercises: [gurai-goro] }
      - { kind: sentence, ja: "ちかみちを とおると、じゅっぷんぐらい はやい。", en: "If you take the shortcut, it's about ten minutes quicker", exercises: [gurai-goro, to-conditional], mode: build }
      - { kind: sentence, ja: "ろくじごろ うちに かえったら、ばんごはんを たべる。", en: "If I get home around six, I'll have dinner", exercises: [gurai-goro, tara, counter-ji], mode: listening }
      - { kind: listening-comp, audio: "えきまで じゅっぷんぐらい かかる。", answer: "It takes about ten minutes to the station", distractors: ["It takes about ten minutes to the park", "I'll go to the station around ten", "It takes ten minutes from the station to home"], exercises: [gurai-goro, made-until] }
      - { kind: listening-comp, audio: "さんじごろ うちに かえる。", answer: "I'll go home around three", distractors: ["I'll be home for about three hours", "I'll go home at exactly three", "I'll go home around four"], exercises: [gurai-goro, counter-ji] }
      - kind: dialogue
        lines:
          - { speaker: "Tom", ja: "えきまで どのぐらい かかる？", en: "How long does it take to the station?" }
          - { speaker: "Mika", ja: "あるくと、じゅっぷんぐらい。", en: "About ten minutes if you walk." }
          - { speaker: "Tom", ja: "ちかてつは？", en: "And the underground?" }
          - { speaker: "Mika", ja: "ごふんぐらいだよ。ろくじごろ つく。", en: "About five minutes. You'd get there around six." }
        questions:
          - { q: "Which is the length of time, and which is the point on the clock?", options: ["ごふん is the length, ろくじ is the point", "ろくじ is the length, ごふん is the point", "Both are lengths", "Both are points"], answer: "ごふん is the length, ろくじ is the point" }
