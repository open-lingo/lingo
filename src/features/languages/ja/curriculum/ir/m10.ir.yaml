module: m10
title: "Register in the wild: yes, no-possession, and softening"
register: plain
priorNeoModules: [m3, m4, m5, m6, m7, m8, m9]

priorGrammarPoints: [wa-topic, ga-existence, wo-object, no-possession, ni-location, de-action, mo-also, dare, kore-sore-are-dore, kore-sore-are-dore,
                     nai-form, nai-form, nai-form, arimasu, imasu,
                     nai-existence, koko-soko-asoko, ni-location, spatial-relations,
                     location-qa, de-action,
                     masu-present, masu-negative, desu-copula, ka-question, register-audience,
                     te-form, te-kudasai, numbers-1-10, counter-tsu, ikura-price]

notes: |
  m10 = spine tile n15, carved out of s07 in draft-3 because the register
  module was a nine-concept avalanche. This is the DEEPEN beat of s07/m7:
  three modules after the ます machinery, register becomes conversational
  reality — the words that actually carry it in speech.

  Shape (inv 25): 15 lessons = 11 teaching + 3 review + 1 challenge. Two
  teaching slots are KATAKANA rows (マ, ヤ — neoModuleIndex 10), wired at
  module level; this IR carries 9 teaching + 3 review + 1 challenge = 13.

  SPIRAL RULE (thr1): a deepen beat OPENS with a rehash of its intro beat.
  m10-neo-1 re-states the audience rule from m7 before adding anything.

  AUDIT FIX (draft-2 finding A): はい differs from うん in FUNCTION, not only
  register — はい is also aizuchi ("I'm listening"), which is the classic
  misparse. That contrast is this module's job, not m7's.

  PRONOUNS: わたし/ぼく/おれ are RECOGNITION ONLY here (audit MED — ぼく/おれ
  must stay recognition-capped). They appear in dialogue lines and meaning
  checks; no production prompt asks the learner to pick one.

  REGISTER: plain-majority still holds (ramp <=20% polite through m11).

grammarPoints:
  - id: yes-no-register
    variant: yes-no
    rule: "Japanese has three yeses and three noes, and they split by AUDIENCE. Casual: うん / ううん. Neutral-polite: ええ. Formal: はい / いいえ. うん and ううん are one sound apart — the difference is a rising ん versus a falling one, so listen for the shape, not the letters."
    examples:
      - { ja: "うん", en: "Yeah. (to a friend)" }
      - { ja: "はい", en: "Yes. (to a teacher)" }
    antiPattern: { ja: "せんせい、うん。", en: "", why: "うん to a teacher is too casual — はい or ええ" }
  - id: yes-no-register
    variant: correcting
    rule: "ううん and いいえ are one word in two registers: they answer no to a question. ちがう is not a third register of no — it is a different move. It CORRECTS: someone has said something wrong and you are telling them so. ちがう、ミカの ほんだ = 'no, it's Mika's book'. Politely it is ちがいます. Decline with いいえ; correct with ちがう."
    examples:
      - { ja: "ううん、たべない。", en: "No, I won't eat." }
      - { ja: "ちがう、ミカの ほんだ。", en: "No — it's Mika's book." }
    # antiPattern omitted (invariant 12): swapping いいえ for ちがう produces
    # grammatical Japanese that lands wrong socially, not a broken sentence.
  - id: aizuchi
    rule: "はい does not always mean 'yes'. In conversation it is also AIZUCHI — the noise a listener makes to show they're still with you, like English 'mm-hm'. So はい can mean 'I'm listening', not 'I agree'. Watch what follows it: agreement continues the thought, aizuchi just keeps the speaker going."
    examples:
      - { ja: "はい、はい。", en: "Mm-hm, go on." }
      - { ja: "はい、いきます。", en: "Yes, I'll go." }
  - id: chotto-softener
    variant: chotto
    rule: "ちょっと literally means 'a little', but its real job is SOFTENING. On its own — ちょっと… — it is a polite refusal that never says no. Japanese avoids flat rejection, so a trailing ちょっと is understood as 'that doesn't work for me'."
    examples:
      - { ja: "ちょっと、たかいです。", en: "It's a little expensive." }
      - { ja: "きょうは ちょっと。", en: "Today is… a bit difficult (trailing off = a polite no)." }
  # ── 2026-07-27 gloss-debt scan. L5-L9 are vocabulary lessons that owned no
  #    card, so だめ/けっこう/ぼく/しる/まあ/よく/こちら were all BUILT before
  #    anything stated their meaning — and every one of them is a function
  #    word with no emoji, so no picture debut can carry the gloss. Each
  #    lesson now re-teaches a point it already exercises (the ⟳ move) and
  #    spends the card's prose on its own words. Examples stay clear of any
  #    atom that HAS an emoji: for those the image MCQ must remain the
  #    first-ever appearance (image-debut invariant).
  - id: chotto-softener
    variant: maa-yoku
    rule: "Two more words do the same softening work, and both lead the sentence without a particle. まあ hedges before you commit: まあ、いく is 'well… I'll go' — a yes with a shrug in it. よく is frequency: よく たべる is 'I eat it often'. After a verb of understanding it shades into 'well' — よく わかります, 'I understand it well'."
    examples:
      - { ja: "まあ、いく。", en: "Well, I'll go." }
      - { ja: "よく たべる。", en: "I eat it often." }
    # antiPattern omitted (invariant 12): both words are adverbs that simply
    # lead the sentence — there is no wrong formation to contrast, only a
    # register/emphasis choice.
  - id: yes-no-register
    variant: declining
    rule: "Turning something down has its own two words. だめ is the blunt one — 'no good', and by extension 'not allowed': それは だめ stops a friend mid-move. けっこう is the gentle refusal you hand a host or a shop assistant; it means 'I'm fine as I am, thank you', so ちゃは けっこうです declines the tea without ever saying no. だめ forbids, けっこう declines — they are not interchangeable."
    examples:
      - { ja: "それは だめ。", en: "That's no good." }
      - { ja: "けっこうです。", en: "No thank you." }
    # antiPattern omitted (invariant 12): both sentences are correct Japanese
    # and the contrast is social, not grammatical.
  - id: register-audience
    variant: pronouns
    rule: "Even 'I' carries register. わたし is the neutral one and is safe in any company. ぼく is casual and usually male — friends and family, never a first meeting with a teacher. Most of the time Japanese drops the subject altogether: いく on its own already means 'I'm going', so reach for a pronoun only when you need the contrast."
    examples:
      - { ja: "わたしは がくせいです。", en: "I'm a student." }
      - { ja: "ぼくは いく。", en: "I'm going. (to a friend)" }
    # antiPattern omitted (invariant 12): every pronoun here is grammatical —
    # the wrong choice is a register slip, not a broken sentence.
  - id: masu-negative
    variant: shiru
    rule: "しる is 'to know' — having a fact, a place or a person in your head. The form you will reach for constantly is its NEGATIVE: しりません to a teacher or a stranger, しらない to a friend, both 'I don't know'. Politeness lives in the tail, exactly as it does for every other verb: しります / しりません."
    examples:
      - { ja: "わたしは しりません。", en: "I don't know. (polite)" }
      - { ja: "ぼくは しらない。", en: "I don't know. (to a friend)" }
    antiPattern: { ja: "わたしは しるません。", why: "ません attaches to the ます-stem, not the dictionary form — しる → しり + ません." }
  - id: kore-sore-are-dore
    variant: kochira
    rule: "こちら is the polite こ-word. これ points at a thing and ここ at a place; こちら points POLITELY — at a direction ('this way'), at a place, or at a person you are introducing. こちらは せんせいです is how you present someone. Shop staff and hosts use it constantly, so you will hear it long before you need to say it."
    examples:
      - { ja: "こちらは せんせいです。", en: "This is the teacher." }
      - { ja: "こちらです。", en: "It's this way." }
    antiPattern: { ja: "これは せんせいです。", why: "これ points at THINGS — presenting a person takes the polite こちら." }

newAtoms:
  - { kana: ううん, romaji: uun, gloss: "nope (casual no)", shortGloss: "nope", imageable: false, kind: vocab }
  - { kana: ちがう, romaji: chigau, gloss: "that's not it, wrong", shortGloss: "that's wrong", imageable: false, kind: verb, verbClass: u }
  - { kana: ちょっと, romaji: chotto, gloss: "a little, a bit", shortGloss: "a little", imageable: false, kind: vocab }
  - { kana: だめ, romaji: dame, gloss: "no good, not allowed", shortGloss: "no good", imageable: false, kind: vocab }
  - { kana: けっこう, romaji: kekkou, gloss: "no thank you, that's enough", shortGloss: "no thanks", imageable: false, kind: vocab }
  - { kana: わたし, romaji: watashi, gloss: "I, me (neutral)", shortGloss: "I (neutral)", imageable: false, kind: vocab }
  - { kana: ぼく, romaji: boku, gloss: "I, me (casual, usually male)", shortGloss: "I (casual)", imageable: false, kind: vocab }
  - { kana: こちら, romaji: kochira, gloss: "this way, this person (polite)", shortGloss: "this way", imageable: false, kind: vocab }
  - { kana: しる, romaji: shiru, gloss: "to know", imageable: false, kind: verb, verbClass: u }
  - { kana: しります, romaji: shirimasu, gloss: "know (polite)", imageable: false, kind: verb-form, derivedFrom: しる }
  - { kana: しりません, romaji: shirimasen, gloss: "don't know (polite)", imageable: false, kind: verb-form, derivedFrom: しる }
  # Four beats build 「しらない」 and it was never registered, so the tokenizer
  # shattered it into し・ら・ない and the tile bank asked the learner to
  # assemble a verb out of loose syllables. Registering the form is the fix;
  # the buildability gate now rejects single-character debris.
  - { kana: しらない, romaji: shiranai, gloss: "don't know", imageable: false, kind: verb-form, derivedFrom: しる }
  - { kana: わかります, romaji: wakarimasu, gloss: "understand (polite)", imageable: false, kind: verb-form, derivedFrom: わかる }
  - { kana: ちがいます, romaji: chigaimasu, gloss: "that's not right (polite)", imageable: false, kind: verb-form, derivedFrom: ちがう }
  - { kana: いま, romaji: ima, gloss: "now", imageable: true, kind: vocab }
  - { kana: まあ, romaji: maa, gloss: "well, sort of", shortGloss: "well…", imageable: false, kind: vocab }
  - { kana: よく, romaji: yoku, gloss: "often, well", imageable: false, kind: vocab }

lessons:
  - id: m10-neo-1
    role: teaching
    title: "Three ways to say yes"
    focus: "rehash of m7's audience rule, then the yes-triple by register"
    introduces: []
    beats:
      # REGISTER LADDER (2026-07-27). The old opener asked "Say to a teacher:
      # Yes" three times — narration the learner parses before they can start,
      # and "Say politely" had TWO right answers (はい and ええ are both
      # polite). `kind: register` replaces it: the audience is a PICTURE, the
      # prompt names only the act, and the scaffold fades stage 1 → 3.
      #
      # None of these words is new here — うん is m3, はい/ええ are m7. m10 is
      # contrast-and-choose, so a three-way set is legal on day one; the
      # research bar (teach each in context first, THEN contrast) is already
      # met. The 4th option is always the opposite POLARITY, never a 4th
      # register — a wrong-register pick and a wrong-meaning pick are
      # different errors and shouldn't be blended.
      - { kind: rule, grammarPointId: yes-no-register, variant: yes-no }
      - { kind: register, stage: 1, audience: grandmother, answer: "ええ", options: ["うん", "はい", "ええ", "ううん"], en: "Say yes.", cheatSheet: { 1: "うん", 2: "はい", 3: "ええ" }, exercises: [yes-no-register, register-audience] }
      - { kind: register, stage: 2, audience: friend, answer: "うん", options: ["うん", "はい", "ええ", "ううん"], en: "Say yes.", exercises: [yes-no-register, register-audience] }
      - { kind: sentence, ja: "うん、いく。", en: "Say to a friend: Yeah, I'll go", exercises: [yes-no-register, register-audience], mode: translate }
      - { kind: register, stage: 2, audience: teacher, answer: "はい", options: ["うん", "はい", "ええ", "ううん"], en: "Say yes.", exercises: [yes-no-register, register-audience] }
      - { kind: sentence, ja: "はい、いきます。", en: "Say to a teacher: Yes, I'll go", exercises: [yes-no-register, masu-present], mode: build }
      - { kind: sentence, ja: "ええ、ごはんを たべます。", en: "Say politely: Yes, I'll eat rice", exercises: [yes-no-register, wo-object, masu-present], mode: listening }
      - { kind: sentence, ja: "うん、たべる。", en: "Say to a friend: Yeah, I'll eat", exercises: [yes-no-register, register-audience], mode: build }
      # Stage 3: no picture, no meter — the vocative carries it, in Japanese.
      # Being CALLED is the one context where はい has a single right answer
      # (Genki 表現ノート3: ええ cannot answer a summons), which the old
      # 「せんせい、___、いきます。」 cloze could not claim.
      - { kind: register, stage: 3, audience: teacher, answer: "はい", options: ["うん", "はい", "ええ", "ううん"], en: "Answer.", frame: { before: "せんせい：「トムさん！」　" }, exercises: [yes-no-register, register-audience] }
      - { kind: challenge, ja: "はい、せんせいの いえに いきます。", en: "Say to a teacher: Yes, I'll go to the teacher's house", combines: [yes-no-register, no-possession, ni-location, masu-present], mode: build }
    reviewPool: [いく, たべる, いえ, せんせい, ともだち, きょう, ひと]

  - id: m10-neo-2
    role: teaching
    title: "Saying no — and correcting"
    # ちがう is NOT a third register of "no". ううん/いいえ are register twins
    # (casual / polite); ちがう is a different SPEECH ACT — it corrects a
    # proposition ("that's not it"), and you can use it at any politeness
    # level. The old title taught a false equivalence, and the old glosses
    # ("No, it's a cat") reinforced it.
    focus: "ううん↔いいえ as register twins; ちがう as a CORRECTION, not a third no"
    introduces: [ううん, ちがう]
    beats:
      - { kind: rule, grammarPointId: yes-no-register, variant: correcting }
      # Recognition direction (the module was 100% production). The stimulus
      # is register-neutral on purpose: if the audio carried ます the answer
      # would be derivable from ます alone and the yes-word would be decoration.
      - { kind: listening-comp, audio: "うん、いえに いく。", q: "Who is this said to?", answer: "A close friend", distractors: ["Your teacher", "Someone you just met", "A shop clerk"], explanation: "Both halves are casual — うん rather than はい, いく rather than いきます. Register rides the whole utterance, not one word.", exercises: [yes-no-register, register-audience] }
      - { kind: register, stage: 2, audience: friend, answer: "ううん", options: ["ううん", "いいえ", "うん", "はい"], en: "Say no.", exercises: [yes-no-register, register-audience] }
      - { kind: register, stage: 2, audience: teacher, answer: "いいえ", options: ["ううん", "いいえ", "うん", "はい"], en: "Say no.", exercises: [yes-no-register, register-audience] }
      - { kind: sentence, ja: "ううん、しない。", en: "Say to a friend: Nope, I won't", exercises: [yes-no-register], mode: build }
      - { kind: sentence, ja: "ちがう、ねこだ。", en: "Say to a friend: That's not it, it's a cat", exercises: [yes-no-register], mode: build }
      - { kind: sentence, ja: "ううん、いかない。", en: "Say to a friend: Nope, I'm not going", exercises: [yes-no-register, nai-form], mode: build }
      - { kind: sentence, ja: "いいえ、いきません。", en: "Say to a teacher: No, I'm not going", exercises: [yes-no-register, masu-negative], mode: translate }
      - { kind: sentence, ja: "ううん、ごはんを たべない。", en: "Say to a friend: Nope, I won't eat rice", exercises: [yes-no-register, wo-object, nai-form], mode: listening }
      - { kind: sentence, ja: "ちがう、ミカの ほんだ。", en: "Say to a friend: That's not it, it's Mika's book", exercises: [yes-no-register, no-possession], mode: build }
      - { kind: particle-cloze, stem: "", tail: "、たべない。", answer: "ううん", options: ["ううん", "うん", "はい"], en: "Nope, I won't eat", explanation: "ううん is the casual NO — うん with a longer, falling shape is the casual YES." }
      - { kind: sentence, ja: "いいえ、ちがいます。", en: "Say to a teacher: No, that's not right", exercises: [yes-no-register, masu-present], mode: build }
      - { kind: challenge, ja: "ううん、ミカの かさは ない。", en: "Say to a friend: Nope, Mika's umbrella isn't here", combines: [yes-no-register, no-possession, wa-topic, nai-existence], mode: listening }
    reviewPool: [いく, たべる, ほん, かさ, ともだち, ミカ, きょう]

  - id: m10-neo-3
    role: teaching
    title: "はい isn't always yes"
    focus: "aizuchi — はい as 'I'm listening', the classic misparse"
    introduces: []
    beats:
      - { kind: rule, grammarPointId: aizuchi }
      - { kind: sentence, ja: "はい、はい。", en: "Say politely: Mm-hm, go on", exercises: [aizuchi], mode: build }
      - { kind: sentence, ja: "はい、そうです。", en: "Say politely: Yes, that's right", exercises: [aizuchi, desu-copula], mode: build }
      - { kind: sentence, ja: "はい、わかります。", en: "Say politely: Yes, I understand", exercises: [aizuchi, masu-present], mode: build }
      - { kind: sentence, ja: "はい、みます。", en: "Say politely: Yes, I'll look", exercises: [aizuchi, masu-present], mode: translate }
      - { kind: sentence, ja: "うん、ミカの ほんだ。", en: "Say to a friend: Yeah, it's Mika's book", exercises: [yes-no-register, no-possession], mode: listening }
      - { kind: sentence, ja: "はい、みせに いきます。", en: "Say politely: Yes, I'll go to the shop", exercises: [aizuchi, ni-location, masu-present], mode: build }
      - kind: dialogue
        lines:
          - { speaker: "せんせい", ja: "みせは あそこです。", en: "The shop is over there." }
          - { speaker: "トム", ja: "はい。", en: "Mm-hm." }
          - { speaker: "せんせい", ja: "パンが やすいですよ。", en: "The bread is cheap." }
        questions:
          - { q: "What does Tom's はい mean here?", options: ["I'm listening", "I agree to buy", "No", "I'm leaving"], answer: "I'm listening" }
      - { kind: challenge, ja: "はい、ともだちの みせに いきます。", en: "Say politely: Yes, I'll go to my friend's shop", combines: [aizuchi, no-possession, ni-location, masu-present], mode: build }
    reviewPool: [みる, わかる, みせ, パン, やすい, せんせい, いえ]

  - id: m10-neo-r1
    role: review
    title: "Review — yes and no by audience"
    focus: "the six answer-words on all-new surfaces"
    introduces: []
    beats:
      - { kind: sentence, ja: "うん、かう。", en: "Say to a friend: Yeah, I'll buy it", exercises: [yes-no-register], mode: build }
      - { kind: sentence, ja: "はい、かいます。", en: "Say to a teacher: Yes, I'll buy it", exercises: [yes-no-register, masu-present], mode: translate }
      - { kind: sentence, ja: "ううん、かわない。", en: "Say to a friend: Nope, I won't buy it", exercises: [yes-no-register, nai-form], mode: build }
      - { kind: sentence, ja: "いいえ、かいものを しません。", en: "Say to a teacher: No, I won't do the shopping", exercises: [yes-no-register, wo-object, masu-negative], mode: listening }
      - { kind: sentence, ja: "ええ、ちゃを のみます。", en: "Say politely: Yes, I'll drink tea", exercises: [yes-no-register, masu-present], mode: build }
      - { kind: sentence, ja: "ちがう、ぼうしは ない。", en: "Say to a friend: No, there's no hat", exercises: [yes-no-register, wa-topic, nai-existence], mode: build }
      - { kind: particle-cloze, stem: "せんせい、", tail: "、わかります。", answer: "はい", options: ["はい", "うん", "ううん"], en: "Yes, I understand. (to a teacher)", explanation: "A teacher gets はい; うん/ううん are for friends." }
      - { kind: sentence, ja: "うん、みせに いく。", en: "Say to a friend: Yeah, I'm going to the shop", exercises: [yes-no-register, ni-location], mode: build }
      - { kind: sentence, ja: "はい、ふたつ かいます。", en: "Say politely: Yes, I'll buy two", exercises: [yes-no-register, counter-tsu, masu-present], mode: listening }
      - { kind: sentence, ja: "ううん、ちゃは のまない。", en: "Say to a friend: Nope, I don't drink tea", exercises: [yes-no-register, wa-topic, nai-form], mode: listening }
      - kind: dialogue
        lines:
          - { speaker: "ケン", ja: "パンを かう？", en: "Buying bread?" }
          - { speaker: "ミカ", ja: "ううん、ちゃを かう。", en: "Nope, I'm buying tea." }
        questions:
          - { q: "What is Mika buying?", options: ["Tea", "Bread", "Both", "Nothing"], answer: "Tea" }
    reviewPool: [かう, する, のむ, いく, ちゃ, パン, ぼうし, みせ, ふたつ]

  - id: m10-neo-4
    role: teaching
    title: "Softening with ちょっと"
    focus: "a little — and the refusal that never says no"
    introduces: [ちょっと]
    beats:
      - { kind: rule, grammarPointId: chotto-softener, variant: chotto }
      - { kind: sentence, ja: "ちょっと みる。", en: "Say to a friend: I'll take a quick look", exercises: [chotto-softener], mode: build }
      - { kind: sentence, ja: "ちょっと たかいです。", en: "Say politely: It's a little expensive", exercises: [chotto-softener, desu-copula], mode: build }
      - { kind: sentence, ja: "ちょっと やすいです。", en: "Say politely: It's a little cheap", exercises: [chotto-softener, desu-copula], mode: translate }
      - { kind: sentence, ja: "きょうは ちょっと。", en: "Say politely: Today is a bit difficult", exercises: [chotto-softener, wa-topic], mode: build }
      - { kind: sentence, ja: "ちょっと みてください。", en: "Say politely: Please take a quick look", exercises: [chotto-softener, te-kudasai], mode: build }
      - { kind: sentence, ja: "それは ちょっと ちがう。", en: "Say to a friend: That's a bit off", exercises: [kore-sore-are-dore, wa-topic, chotto-softener, yes-no-register], mode: listening }
      - { kind: particle-cloze, stem: "ごひゃくえんは ", tail: " たかいです。", answer: "ちょっと", options: ["ちょっと", "いくら", "やすい"], en: "Five hundred yen is a little expensive", explanation: "ちょっと softens the complaint — it is the polite way to push back." }
      - kind: dialogue
        lines:
          - { speaker: "トム", ja: "きょう みせに いく？", en: "Going to the shop today?" }
          - { speaker: "ミカ", ja: "きょうは ちょっと…", en: "Today is… a bit difficult." }
        questions:
          - { q: "Is Mika going?", options: ["No, politely", "Yes", "She's unsure of the time", "She'll go tomorrow"], answer: "No, politely" }
      - { kind: challenge, ja: "ちょっと たかいです。かいません。", en: "Say politely: It's a bit expensive so I won't buy it", combines: [chotto-softener, desu-copula, masu-negative], mode: build }
    reviewPool: [たかい, やすい, みる, いく, みせ, えん, きょう, ちがう]

  - id: m10-neo-5
    role: teaching
    title: "No thank you — だめ and けっこう"
    focus: "refusing without rudeness"
    introduces: [だめ, けっこう]
    beats:
      - { kind: rule, grammarPointId: yes-no-register, variant: declining }
      - { kind: sentence, ja: "それは だめ。", en: "Say to a friend: That's no good", exercises: [wa-topic], mode: build }
