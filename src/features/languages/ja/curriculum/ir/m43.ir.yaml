grammarPoints:
  - id: kamoshirenai
    rule: "かもしれない means 'might be' — a guess you are genuinely not sure about. Attach it to the plain form of what you are guessing: a verb or い-adjective in dictionary form as-is, but a noun or な-adjective DROPS its だ first — がくせいかもしれない, 'might be a student,' never がくせいだかもしれない. あめが ふるかもしれない, 'it might rain.' Casual speech often shortens this to bare かも at a sentence end, but that shortcut is not a separate word — it is か plus the も you already know, worn down by speed, and this course never registers it as its own atom. Compare でしょう, which you already own: でしょう states a fairly confident guess out loud; かもしれない admits real uncertainty, often even to yourself."
    examples:
      - { ja: "がくせいかもしれない。", en: "Might be a student." }
      - { ja: "あめが ふるかもしれない。", en: "It might rain." }
      - { ja: "たなかさんは いそがしいかもしれない。", en: "Tanaka might be busy." }
      - { ja: "もしかしたら、テストは むずかしいかもしれない。", en: "Perhaps the test might be hard." }
      - { ja: "たなかさんは くるかもしれないが、ミカは ぜったい くる。", en: "Tanaka might come, but Mika will definitely come." }
    antiPattern: { ja: "がくせいだかもしれない。", why: "Noun and な-adjective hosts DROP だ before かもしれない — がくせいかもしれない, 'might be a student.' Keeping だ borrows でしょう's own different pattern by mistake." }
  - id: hazu
    variant: intro
    rule: "はず means 'should be' — not a guess but a confident conclusion, because you have a real reason. A plain verb or い-adjective attaches straight to はず: くるはずだ, 'he should be coming' (I know his schedule). A noun needs の first: がくせいのはずだ, 'she should be a student' (I saw her ID). A な-adjective needs な first: げんきなはずだ, 'she should be fine' (I just talked to her). This is the opposite move from かもしれない, which DROPS だ for the same two hosts — はず INSERTS の or な instead. Compare でしょう: でしょう is a guess said out loud; はず claims real evidence backs the conclusion."
    examples:
      - { ja: "くるはずだ。", en: "He should be coming." }
      - { ja: "がくせいのはずだ。", en: "She should be a student." }
      - { ja: "げんきなはずだ。", en: "She should be fine." }
      - { ja: "このテストは むずかしいはずだ。", en: "This test should be hard." }
      - { ja: "やくそくが あるから、くるはずだ。", en: "Since there's a promise, he should be coming." }
    antiPattern: { ja: "がくせいだはずだ。", why: "A noun host needs の before はず, not だ — がくせいのはずだ, 'she should be a student.' だ belongs to かもしれない's opposite rule, not this one." }
  - id: hazu
    variant: spends
    rule: "Two extra shapes push はず further, both riding the same の/な/bare connector rule as before. はずだった says something SHOULD have happened, by your own evidence, but you don't yet know if it did — くるはずだったが、まだ こない, 'he was supposed to come, but he still hasn't.' はずがない flips はず into a flat denial, 'there's no way' — げんきなはずが ない, 'there's no way she's fine' (the evidence points the other way entirely)."
    examples:
      - { ja: "くるはずだったが、まだ こない。", en: "He was supposed to come, but hasn't yet." }
      - { ja: "げんきなはずが ない。", en: "There's no way she's fine." }
      - { ja: "このプレゼントが たかいはずが ない。", en: "There's no way this present is expensive." }
      - { ja: "がくせいのはずが ない。", en: "There's no way she's a student." }
      - { ja: "しっぱいするはずが ない。かならず せいこうする。", en: "There's no way it'll fail. It'll definitely succeed." }
    antiPattern: { ja: "くるはずだが、まだ こない。", why: "Reporting a broken expectation about something that already should have happened needs the past はずだった, not plain はずだ — くるはずだったが、まだ こない, 'he was supposed to come, but hasn't yet.'" }
  - id: certainty-ladder
    rule: "Four ways to guess, one ladder of how sure you sound. にちがいない sits at the top — 'must be,' near-certainty from strong evidence (you'll only ever hear this one, never build it). はず comes next — 'should be,' a confident conclusion backed by a real reason. でしょう and its casual twin だろう sit in the middle — a fair, everyday guess, said out loud (だろう also stays recognition-only). かもしれない sits at the bottom — 'might be,' genuine uncertainty, the weakest claim of the four. One test sorts them: finish 'because ~' after the guess. はず and にちがいない always survive that test — you have a real reason. でしょう often has one but doesn't have to say it. かもしれない frequently has none at all — when you DO have a concrete reason, reach up the ladder instead of underselling it."
    examples:
      - { ja: "やくそくが あるから、たなかさんは くるはずだ。", en: "Since there's a promise, Tanaka should be coming." }
      - { ja: "けっかが いいから、たなかさんは せいこうするにちがいない。", en: "Since the result is good, Tanaka must be succeeding, no doubt." }
      - { ja: "たなかさんは たぶん くるでしょう。", en: "Tanaka will probably come." }
      - { ja: "たなかさんは くるかもしれない。", en: "Tanaka might come." }
      - { ja: "しっぱいするかもしれないが、たしかに せいこうするはずだ。", en: "It might fail, but for sure it should succeed." }
    antiPattern: { ja: "やくそくが あるから、くるかもしれない。", why: "When you actually have a concrete reason — a promise — reach for はず, the evidence-backed rung: やくそくが あるから、くるはずだ. かもしれない undersells real evidence down to a bare guess; save it for when you truly have no reason at all." }
newAtoms:
  # ══ L1 (neo-1) — promises/plans domain intro, no new grammar ══
  - { kana: やくそく, kanji: 約束, romaji: yakusoku, gloss: "a promise", shortGloss: "promise", imageable: false, kind: vocab, pos: noun }
  - { kana: たしか, kanji: 確か, romaji: tashika, gloss: "for sure, if I recall correctly", shortGloss: "for sure", imageable: false, kind: vocab, pos: adverb }
  - { kana: かならず, kanji: 必ず, romaji: kanarazu, gloss: "certainly, without fail", shortGloss: "without fail", imageable: false, kind: vocab, pos: adverb }
  # ══ L2 (neo-2), id kamoshirenai — the epistemic-possibility auxiliary
  # itself, plus its sentence-opening partner and ぜったい's cash-in.
  # かもしれません is the IR-only polite derived form, Tanaka-voiced
  # recognition only. No bare かも atom, ever (see notes above).
  - { kana: もしかしたら, romaji: moshikashitara, gloss: "perhaps, possibly", shortGloss: "perhaps", imageable: false, kind: vocab, pos: adverb }
  - { kana: かもしれない, romaji: kamoshirenai, gloss: "might be, may be (epistemic possibility)", shortGloss: "might be", imageable: false, kind: vocab }
  - { kana: かもしれません, romaji: kamoshiremasen, gloss: "might be, may be (polite)", shortGloss: "might be (polite)", imageable: false, kind: verb-form, derivedFrom: かもしれない }
  # ══ L3 (neo-3), でしょう-deepen — no new grammarPointId, references
  # m25's deshou family by id. せいこう/しっぱい are the new domain nouns.
  - { kana: せいこう, kanji: 成功, romaji: seikou, gloss: "success", shortGloss: "success", imageable: false, kind: vocab, pos: noun }
  - { kana: しっぱい, kanji: 失敗, romaji: shippai, gloss: "failure", shortGloss: "failure", imageable: false, kind: vocab, pos: noun }
  # ══ L5 (neo-4), id hazu variant intro — the evidence-backed conclusion
  # marker, plus its forecast-domain carrier noun.
  - { kana: よそう, kanji: 予想, romaji: yosou, gloss: "a prediction, a forecast", shortGloss: "prediction", imageable: false, kind: vocab, pos: noun }
  - { kana: はず, romaji: hazu, gloss: "should be, expected to be (from evidence)", shortGloss: "should be", imageable: false, kind: vocab, pos: noun }
  # ══ L6 (neo-5), id hazu variant spends — はずだった/はずがない production.
  # うたがう/しんじる are the new cognition verbs, kept in bare dictionary
  # form throughout (see notes above).
  - { kana: うたがう, kanji: 疑う, romaji: utagau, gloss: "to doubt", shortGloss: "to doubt", imageable: false, kind: vocab, pos: verb, verbClass: u }
  - { kana: しんじる, kanji: 信じる, romaji: shinjiru, gloss: "to believe", shortGloss: "to believe", imageable: false, kind: vocab, pos: verb, verbClass: ru }
  - { kana: うたがわない, romaji: utagawanai, gloss: "does not doubt — negative of うたがう", shortGloss: "doesn't doubt (doubt)", imageable: false, kind: verb-form, derivedFrom: うたがう, verbClass: u }
  - { kana: しんじれば, romaji: shinjireba, gloss: "if (one) believes — conditional of しんじる", shortGloss: "if believe (believe)", imageable: false, kind: verb-form, derivedFrom: しんじる, verbClass: ru }
  - { kana: しんじよう, romaji: shinjiyou, gloss: "let's believe — volitional of しんじる", shortGloss: "let's believe (believe)", imageable: false, kind: verb-form, derivedFrom: しんじる, verbClass: ru }
  - { kana: しんじて, romaji: shinjite, gloss: "believing — te-form of しんじる", shortGloss: "believing (believe)", imageable: false, kind: verb-form, derivedFrom: しんじる, verbClass: ru }
  - { kana: おもわない, romaji: omowanai, gloss: "don't think — negative of おもう (m5)", shortGloss: "don't think (think)", imageable: false, kind: verb-form, derivedFrom: おもう, verbClass: u }
  # ══ L7 (neo-6) — domain integration + にちがいない recognition aside.
  # あんしん/しんぱい are new psychological-state na-adjectives; にちがいない
  # is registered but is NOT a grammarPointId — recognition-only by
  # structure, never appears in a build/cloze/challenge beat anywhere.
  - { kana: あんしん, kanji: 安心, romaji: anshin, gloss: "peace of mind, relief", shortGloss: "relief", imageable: false, kind: vocab, pos: adjective }
  - { kana: しんぱい, kanji: 心配, romaji: shinpai, gloss: "worry, anxiety", shortGloss: "worry", imageable: false, kind: vocab, pos: adjective }
  - { kana: にちがいない, romaji: nichigainai, gloss: "must be, no doubt (strong certainty — recognition only)", shortGloss: "must be", imageable: false, kind: vocab }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m43-neo-1
    role: teaching
    title: "「やくそくが ある」— the promises and plans domain"
    focus: "Priming vocabulary for the certainty-ladder arc — no new grammar yet, all through particles and forms you already own"
    introduces: [やくそく, たしか, かならず]
    beats:
      - { kind: sentence, ja: "たなかさんとの やくそくが ある。", en: "I have a promise with Tanaka.", exercises: [ga-existence], mode: build }
