  reviews at positions 4/8/11 — matching m41/m42's own placement).

  FRESH STATE RE-VERIFIED: ran `node scripts/authoring-context.mjs m43`
  before writing this file (saved to a scratch file, grepped repeatedly).
  m42 confirmed live in the digest with its four grammarPoints
  (sou-hearsay, tte-quotative, to-itte-ita, rashii-hearsay) and all 12
  lessons; those four ids plus the full m25 でしょう-family
  (deshou-adjective, deshou-verb, deshou-casual, darou, tabun-kitto — none
  of which any module after m25 had bothered re-carrying, m42 included)
  are appended onto this module's own priorGrammarPoints above, since
  `exercises`/`combines` validation only checks this module's own
  declared list, not any transitive inheritance.

  WHAT IS TAUGHT (four-rung certainty ladder, three genuinely new
  grammarPoints plus one review-object synthesis, never merged into one
  block table mid-course — interleave-dont-block-teach):
  1. **かもしれない (epistemic "might"), L2 id kamoshirenai:** plain
     verb/い-adjective attaches as-is; noun/な-adjective DROPS だ first
     (がくせいかもしれない, never がくせいだかもしれない). The weakest rung.
     もしかしたら pairs as its natural sentence-opener. Casual かも is
     NEVER its own atom (see below) — it decomposes into the pre-existing
     free particles か (p-ka, m3) + も (p-mo, m3).
  2. **はず (evidence-backed "should be"), L5 id hazu, variant "intro":**
     the mirror-image connector move from かもしれない — plain
     verb/い-adjective attaches as-is, but noun hosts insert の
     (がくせいのはずだ) and な-adjective hosts insert な (げんきなはずだ),
     never だ. A genuine conclusion from evidence, not a bare guess.
  3. **はずだった / はずがない, L6 id hazu, variant "spends":** a second
     `kind: rule` card sharing the hazu id but a DIFFERENT variant key
     (cardOwner is keyed `${id}/${variant}` in moduleCompiler.ts, so this
     is not a same-card-twice violation) — はずだった reports a broken
     expectation ("was supposed to, but hasn't"), はずがない flatly denies
     ("no way"). Both compose from the SAME の/な/bare connector rule as
     variant "intro", just riding two extra endings.
  4. **でしょう-deepen, L3, no new grammarPointId of its own** (references
     m25's deshou/deshou-adjective/deshou-verb/darou/tabun-kitto ids
     directly via `exercises:`/`combines:` tags on plain sentence/dialogue
     beats — never a `kind: rule` beat, since none of those ids are
     declared in THIS module's own grammarPoints[], and resolveGrammarPoint
     only searches the current module's own list). だろう stays strictly
     recognition-only throughout (Tanaka-voiced or NPC dialogue lines
     only, never a build/cloze/challenge target) — matching its own
     firm m25 framing, never promoted (brief §6, explicitly rejected).
  5. **certainty-ladder, L10 (neo-8), own new id — a REVIEW-OBJECT
     synthesis card, not new teaching** (inv 26 shape): orders all four
     rungs by strength — にちがいない (top, recognition only) > はず >
     でしょう/だろう (recognition twin) > かもしれない (bottom) — via a
     "finish 'because ~'" completion test. にちがいない is cited in this
     card's own rule prose and appears only in listening-comp/dialogue
     lines everywhere else in the module; it is NEVER its own
     grammarPointId, so there is nothing to accidentally tag onto a
     build/cloze/challenge beat — the recognition-only guarantee is
     structural, not just a discipline.

