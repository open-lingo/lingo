  かも TOKENIZER SAFETY (brief §3/§5/§6, firm rule, not re-derived here):
  かもしれない registered as ONE fused 6-kana courseAtoms.ts atom
  (courseAtoms.ts edit, id "kamoshirenai") so any full-phrase use always
