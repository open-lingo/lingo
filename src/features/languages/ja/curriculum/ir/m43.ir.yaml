  した/きた AVOIDANCE (courseAtoms.ts's own note on both, hard constraint,
  not re-derived here): neither bare atom is registered (collision with
  下/北). No sentence anywhere in this module uses した or きた, including
  inside noun+する compounds (せいこうした, しっぱいした, べんきょうした,
  やくそくした are all avoided outright) — every example stays in
  non-past/present form, or uses independently-registered past atoms
  (あった, かった) where a genuine past tense was needed. This ruled out
  several natural-sounding narrative sentences (promise-keeping in the
