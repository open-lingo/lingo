  # ═══════════════════════════════════════════════════════════════════════
  - id: m18-neo-3
    role: teaching
    title: "「こないと おもう」 — where the ない goes"
    focus: "English negates the thinking, Japanese negates the QUOTED clause — 「I don't think he's coming」 is 「こないと おもう」"
    introduces: []
    beats:
