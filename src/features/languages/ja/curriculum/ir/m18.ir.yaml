module: m18
title: "Saying & thinking: とおもう + という"
register: plain
priorNeoModules: [m3, m4, m5, m6, m7, m8, m9, m10, m11, m12, m13, m14, m15, m16, m17]

priorGrammarPoints: [wa-topic, wo-object, ni-time, de-action, mo-also, to-and,
                     koko-soko-asoko, nai-existence, arimasu, imasu, ga-existence,
                     no-possession, kore-sore-are-dore, kono-sono-ano-dono, dare,
                     masu-negative, masu-past, masu-past-negative, desu-past,
                     dictionary-form, te-form, te-iru, te-kara, mae-ni, toki,
                     i-adj-present, i-adj-negative, i-adj-past, i-adj-past-negative,
                     na-adj-present, na-adj-negative, na-adj-past,
                     v-tai, ga-hoshii, suki-kirai-no, no-ga-suki, mada-mou,
                     kara-because, node-because, kedo, kara-origin, made-until,
                     numbers-1-10, numbers-11-99, counter-ji, counter-tsu,
                     counter-mai, counter-nin, counter-sai, family-register,
