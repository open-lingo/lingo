  - id: m21-neo-7
    role: teaching
    title: "「みたり きいたり する」 — listing what you do"
    focus: "〜たり 〜たり する is や for actions: two examples out of many, finished with する"
    introduces: [たべたり, のんだり, みたり, きいたり]
    beats:
      - { kind: rule, grammarPointId: tari-tari-suru }
      - { kind: sentence, ja: "やすみは えいがを みたり おんがくを きいたり する。", en: "On my days off I do things like watch films and listen to music", exercises: [tari-tari-suru, wa-topic, wo-object], mode: build }
      - { kind: sentence, ja: "あさは パンを たべたり ちゃを のんだり する。", en: "In the mornings I do things like eat bread and drink tea", exercises: [tari-tari-suru, wo-object], mode: build }
      - { kind: sentence, ja: "きっさてんで コーヒーを のんだり ほんを みたり する。", en: "At the coffee shop I do things like drink coffee and look at a book", exercises: [tari-tari-suru, de-action], mode: build }
      - { kind: sentence, ja: "うちで すしを たべたり うたを きいたり する。", en: "At home I do things like eat sushi and listen to songs", exercises: [tari-tari-suru, de-action], mode: listening }
      - { kind: sentence, ja: "なつやすみは えいがを みたり すしを たべたり する。", en: "Over the summer holiday I do things like watch films and eat sushi", exercises: [tari-tari-suru, wa-topic], mode: build }
      - { kind: sentence, ja: "ミカの おかあさんは りょうりを たべたり ちゃを のんだり する。", en: "Mika's mother does things like eat food and drink tea", exercises: [tari-tari-suru, family-register, no-possession], mode: build }
      - { kind: sentence, ja: "きっさてんは しずかだから ほんを みたり おんがくを きいたり する。", en: "The coffee shop is quiet, so I do things like look at a book and listen to music", exercises: [tari-tari-suru, kara-because, na-adj-present], mode: build }
      - { kind: sentence, ja: "えいがを みたり おんがくを きいたり する。", en: "Say to a friend: I do things like watch films and listen to music", exercises: [tari-tari-suru], mode: translate }
      # PAST たり. する carries the tense for the whole list, and 「〜たり 〜たり
      # しました」 is the form a learner meets first in the wild — it answers "what
      # did you do at the weekend?". The prompt NAMES the register (inv 48) rather
      # than accepting both, because the plain past した is a homograph of the m17
      # atom 下 and cannot be tiled without mis-crediting SRS; polite past is the
      # only rendering this module can grade honestly, so it says so out loud.
      - { kind: sentence, ja: "やすみは えいがを みたり おんがくを きいたり しました。", en: "Say politely: On my days off I did things like watch films and listen to music", exercises: [tari-tari-suru, masu-past, wa-topic], mode: build }
      - { kind: listening-comp, audio: "あさは パンを たべたり ちゃを のんだり しました。", answer: "In the mornings I did things like eat bread and drink tea", distractors: ["In the mornings I do things like eat bread and drink tea", "In the evenings I did things like eat bread and drink tea", "In the mornings I did things like eat rice and drink tea"], exercises: [tari-tari-suru, masu-past] }
      - { kind: particle-cloze, stem: "やすみは えいがを ", tail: " おんがくを きいたり する。", answer: "みたり", options: ["みたり", "たべたり", "のんだり"], en: "On my days off I do things like watch films and listen to music", explanation: "みたり is the たり form of みる — take the plain past みた and add り. たべたり is eat and のんだり is drink." }
      - { kind: listening-comp, audio: "あさは パンを たべたり ちゃを のんだり する。", answer: "In the mornings I do things like eat bread and drink tea", distractors: ["In the mornings I eat bread and drink tea, and nothing else", "In the evenings I do things like eat bread and drink tea", "In the mornings I do things like eat rice and drink tea"], exercises: [tari-tari-suru] }
      - { kind: listening-comp, audio: "きっさてんで コーヒーを のんだり ほんを みたり する。", answer: "At the coffee shop I do things like drink coffee and look at a book", distractors: ["At the coffee shop I drink coffee and look at a book — those two things only", "At home I do things like drink coffee and look at a book", "At the coffee shop I do things like drink tea and look at a book"], exercises: [tari-tari-suru, de-action] }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "やすみは なにを する？", en: "What do you do on your days off?" }
          - { speaker: "Mika", ja: "えいがを みたり おんがくを きいたり する。", en: "I do things like watch films and listen to music." }
        questions:
          - { q: "What does Mika do on her days off?", options: ["Things like watching films and listening to music", "Only watches films", "Only listens to music", "Works at a company"], answer: "Things like watching films and listening to music" }
      - { kind: challenge, ja: "あさは ちゃを のんだり ほんを みたり するけど えいがは みない。", en: "In the mornings I do things like drink tea and look at a book, but I don't watch films", combines: [tari-tari-suru, kedo, nai-form, wa-topic], mode: build }
    reviewPool: [おかあさん, おとうさん, おにいさん, おねえさん, えいが, おんがく, やすみ, すし, パン, きっさてん]

