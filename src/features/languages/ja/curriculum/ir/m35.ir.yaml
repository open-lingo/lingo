module: m35
title: "Give & receive II: 〜てあげる/てくれる/てもらう + asking favors"
register: plain
priorNeoModules: [m3, m4, m5, m6, m7, m8, m9, m10, m11, m12, m13, m14, m15, m16, m17, m18, m19, m20, m21, m22, m23, m24, m25, m26, m27, m28, m29, m30, m31, m32, m33, m34]
priorGrammarPoints: [ka-question, no-possession, wa-topic, wo-object, ga-existence,
  ni-location, ni-time, de-action, mo-also, kara-because, node-because, kedo,
  made-until, mae-ni, te-form, te-kudasai, te-iru, te-kara, te-miru, te-oku,
  ta-form, nai-form, nai-existence, dictionary-form, masu-present, masu-negative,
  masu-past, desu-copula, i-adj-present, i-adj-past, na-adj-present, v-tai,
  to-omoimasu, toki, tsumori-desu, mashou, masenka, potential-form, dekiru,
  n-desu, hou-ga-ii, yo-emphasis, ne-agreement, register-audience, chotto-softener,
  ageru, kureru, morau, ni-recipient, kara-origin, tara, jidoushi-tadoushi,
  volitional, you-to-omou, koto-ni-suru, koto-ni-naru, family-register,
  ni-iku, counter-nin, frequency-adverbs, kono-sono-ano-dono]
notes: |
  m35 · n4-06 — GIVE & RECEIVE II (docs/spine-n4.md §m35). The spine's own
  headline: **m30's schema × m31's verbs. NO new rule — one composition,
  drilled until it is reflex.** The learner owns the て+helper slot (m30) and
  the three transfer verbs with their direction logic (m31); this module puts
  a verb of DOING in front of them and every particle rule carries over
  unchanged. That is the whole grammar. The module's job is repetition with
  the right emphases, and the emphases are:

  1. **〜てくれる FIRST and heaviest (L1)** — the ordinary way to report a
     kindness (せんせいが おしえてくれた), the highest-frequency member, and
     the one English speakers under-produce because English has no slot for
     "and it landed on me" inside the verb.
  2. **〜てあげる with its politeness trap taught AS the antiPattern (L2)** —
     offering help UPWARD with あげる sounds condescending
     (×せんせいを てつだってあげます). Textbooks skip this; we teach the
     error, and L10 supplies the correct move instead: offer with ましょうか
     (m24 machinery + m34's register work).
  3. **〜てもらう as the viewpoint flip (L3)** — "I got someone to…", the
     same event as てくれる told from the receiver's end, exactly the m31
     くれる/もらう mirror now applied to actions.
  4. **THE FAVOR-REQUEST LADDER, register-graded, introduced PAIRWISE (L5
     casual: 〜て / 〜てくれる？ / 〜てくれない？; L6 polite:
     〜てくれませんか / 〜てもらえますか, seated against m8's てください)
     and only assembled N-way in review-3** — the RUN-PLAN pairwise standing
     decision applied to the tier's first six-rung speech act.
  5. **だけ / しか〜ない (L7)** get their atoms here per the spine's limit
     drip — だけ counts what is there, しか…ない counts what is missing, and
     the favor frame gives both their natural spends (ケンだけが てつだって
     くれる / ひとりしか いない).

  DIALOGUE_SIM ×2 — this module is the step type's richest material in the
  tier, because a favor only exists as a TURN:
    - L5, casual: moving-day with Ken — asking him to carry things
      (はこんでくれない？), build replies up the casual rungs.
    - L10, polite: after class, books everywhere — OFFERING help to Tanaka
      the right way (てつだいましょうか, NOT てつだってあげます) and asking
      the polite favor (もらえますか). The politeness trap gets its lived
      contrast where L2 taught it abstractly.

  VOCAB (spine must/prefer, measured against docs/context/m35-context.md —
  none of these are taught yet): verbs てつだう・はこぶ・なおす・こまる・
  たすかる; nouns おねがい・むかえ (the noun in むかえに いく — rides m19's
  ni-iku purpose slot); particles だけ・しか. CUT from the spine's prefer
  list: つれる (its natural frame is つれていく/つれてくる, which would
  front-run m38's ていく/てくる — deferred there, noted for m38's author),
  めいわく・やくにたつ・たのみ (room); しんせつ is ALREADY TAUGHT (carrier).
  Sidequest set untouched.

  TOKENIZER HAZARDS: every て-form/derived surface used gets a verb-form
  newAtom — てつだって, はこんで, なおして, こまって + the helper-verb forms
  くれない, くれた, くれません, もらった, もらえます, あげた as used.
  EXPANSION AGENT: keep this list exactly matching the beats, as in m34.

  CLOSED-WRITING NOTE (inherited from m30, and the build-tile layer now
  guards it): every 〜てくれる/〜てあげる/〜てもらう surface is written
  CLOSED (てつだってくれる, no space before the helper). The helper stays
  kana on tiles by the auxiliary-position suppression shipped 2026-08-24.
grammarPoints:
  # RULE-CARD VOCABULARY NOTE: no card names はこぶ/なおす/むかえ before
  # their own lessons; cards argue from てつだう (L1's first new verb) and
  # from m31's プレゼント/じしょ furniture, owned for four modules.

  - id: te-kureru
    rule: "Module 30 gave you the slot: a て-form with an ordinary verb parked behind it, the pair acting as one predicate. Module 31 gave you くれる: giving that arrives at my side. Put them together — 「せんせいが おしえてくれた」 — and the sentence does two jobs at once: the teacher taught me, AND the verb itself files it as a kindness that landed on me. There is no new rule in this module. が still marks the giver, the て-verb still never moves, くれる still points inward and carries all the tense. English has no slot for this, which is why English speakers under-use it — but in Japanese, leaving くれる off a sentence like this doesn't sound neutral, it sounds like the help didn't count."
    examples:
      - { ja: "せんせいが おしえてくれた。", en: "The teacher taught me (and I'm glad of it)." }
      - { ja: "ともだちが てつだってくれる。", en: "My friend helps me out." }
      - { ja: "あねが ばんごはんを かってくれた。", en: "My older sister bought me dinner." }
    antiPattern: { ja: "せんせいが おしえてあげた。", why: "あげる points AWAY from the speaker — this says the teacher taught somebody else, as a favor from the teacher's side. Help that reached YOU takes くれる: おしえてくれた." }

  - id: te-ageru
    rule: "〜てあげる is the outward half: I do something FOR somebody. 「ともだちに ケーキを かってあげた」 — I bought my friend a cake, and the verb frames it as a favor from me. Use it freely about friends, family, children. But hear the frame: あげる bestows. Aimed UPWARD — at a teacher, a boss, a customer — 「てつだってあげます」 says \"I shall do you the favor of helping,\" and it lands as condescension, however kind you meant it. This is not a grammar error; the sentence is perfectly formed. It is a register error, which is worse, because nobody corrects it. What you say instead is coming in lesson 10: offer with ましょうか and keep あげる out of it."
    examples:
      - { ja: "ともだちに ケーキを かってあげた。", en: "I bought my friend a cake." }
      - { ja: "いもうとに えいごを おしえてあげる。", en: "I'll teach my little sister English." }
      - { ja: "ケンに じしょを かしてあげた。", en: "I lent Ken my dictionary." }
    antiPattern: { ja: "せんせいに ケーキを かってあげた。", why: "grammatically flawless, socially wrong: あげる frames the gift as a favor bestowed downward, and pointed at your teacher it condescends. Give upward without the verb of bestowing — or offer with ましょうか (lesson 10)." }

  - id: te-morau
    rule: "〜てもらう is the same event as 〜てくれる, told from the other end — module 31's mirror, now with actions in it. 「ともだちが てつだってくれた」: my friend helped me, friend as subject. 「ともだちに てつだってもらった」: I got my friend's help, ME as subject, friend marked with に. English has no verb for this flip, so read it as \"I got (someone) to…\" or \"I had (someone)…\". Why bother, when くれる already says it? Because もらう makes the RECEIVING the story — I needed help and I went and got it. くれる reports their kindness; もらう reports my solution."
    examples:
      - { ja: "ともだちに てつだってもらった。", en: "I got my friend to help me." }
      - { ja: "せんせいに おしえてもらう。", en: "I get the teacher to teach me." }
      - { ja: "あにに かばんを もってもらった。", en: "I had my brother carry my bag." }
    antiPattern: { ja: "ともだちが てつだってもらった。", why: "もらう makes the RECEIVER the subject — with ともだち marked が, this says your friend received the help, from someone unnamed. For \"my friend helped me,\" either flip the particle (ともだちに…もらった) or flip the verb (ともだちが…くれた)." }

  - id: favor-ladder
    variant: casual
    rule: "Now the asking. You have requested with 〜てください since module 8 — polite, safe, and a little stiff between friends. The casual rungs are built from くれる: 「てつだってくれる？」 asks \"will you help me?\" straight; 「てつだってくれない？」 asks it through the negative — \"won't you help me?\" — and the negative SOFTENS it, exactly the way ませんか softened invitations back in module 24. Softer through the negative: it is the same move, one register down. Between friends, 〜てくれない？ is the everyday ask. Below both sits the bare て-form — 「てつだって」 — family-close, or urgent."
    examples:
      - { ja: "ちょっと てつだってくれる？", en: "Give me a hand?" }
      - { ja: "てつだってくれない？", en: "Won't you help me out?" }
      - { ja: "まって！", en: "Wait!" }
    antiPattern: { ja: "せんせい、てつだってくれない？", why: "the くれない？ rung is friend-register — aimed at your teacher it is over-familiar. The polite rungs exist for exactly this: てつだってくれませんか." }

  - id: favor-ladder
    variant: polite
    rule: "The polite rungs, and the top of the ladder. 「てつだってくれませんか」 is くれない？ in polite dress — same negative softening, ます layer on. 「てつだってもらえますか」 climbs one higher by switching verbs: it runs on もらう in the POTENTIAL (module 24's form) — literally \"would I be able to receive your helping?\" — which asks about possibility instead of willingness, and that indirection is the politeness. Against them both sits module 8's てください, which for all its です-class dress is a DIRECTIVE — fine for a shop counter, blunt for a favor. Rule of thumb: ください tells, くれませんか asks, もらえますか asks whether asking is even possible."
    examples:
      - { ja: "すみません、てつだってくれませんか。", en: "Excuse me, could you help me?" }
      - { ja: "しゃしんを とってもらえますか。", en: "Could I get you to take a photo?" }
      - { ja: "ちょっと まってください。", en: "Please wait a moment." }
    antiPattern: { ja: "すみません、てつだってもらいませんか。", why: "the top rung runs on the POTENTIAL — もらえますか asks whether receiving your help is possible. もらいませんか drops the potential and literally invites the listener to receive something from you, the reverse of the favor you meant." }

  - id: dake
    rule: "だけ is \"just this, no more,\" and it sits directly after the thing it limits: 「ひとつだけ」 just one, 「ケンだけ」 only Ken. The machinery around it stays positive — 「ケンだけが てつだってくれた」, only Ken helped me. It stacks onto the noun BEFORE the particle where there is one: だけが, だけに. That is the whole word. Its dark twin — the one that needs a negative — is next."
    examples:
      - { ja: "ケンだけが てつだってくれた。", en: "Only Ken helped me." }
      - { ja: "ひとつだけ ください。", en: "Just one, please." }
      - { ja: "みずだけ のむ。", en: "I'll just drink water." }
    antiPattern: { ja: "ケンだけが てつだってくれない。", why: "だけ + a negative says only Ken DOESN'T help — almost the opposite of \"only Ken helps.\" For only-Ken-and-nobody-else, keep だけ positive, or reach for しか…ない, which is built for the missing-everyone-else reading." }

  - id: shika-nai
    rule: "しか is だけ's shadow: it means \"only\" too, but it REQUIRES the negative — しか…ない — and it counts what is missing rather than what is there. 「ひとりしか いない」: there is only one person, said as \"nobody beyond one.\" The feeling is scarcity: 「せんえんしか ない」 laments the mere thousand yen; 「せんえんだけ ある」 just states it. One mechanical difference to drill: しか REPLACES が and を outright (ケンしか こない, みずしか のまない) — no がしか, no をしか. When the amount feels like not-enough, Japanese reaches for しか…ない almost every time."
    examples:
      - { ja: "ケンしか てつだってくれない。", en: "Ken is the only one who'll help me." }
      - { ja: "ひとりしか いない。", en: "There's only one person." }
      - { ja: "せんえんしか ない。", en: "I've only got a thousand yen." }
    antiPattern: { ja: "ケンしか てつだってくれる。", why: "しか has no meaning without its negative — the verb must be ない-shaped: ケンしか てつだってくれない. With a positive verb, use だけ: ケンだけ(が) てつだってくれる." }

newAtoms:
  # ══ Verbs. てつだう is the module's workhorse and an image debut candidate
  #    only if an honest un-colliding emoji exists at wiring (🤝 is かりる's);
  #    はこぶ gets 📦 (a carried box IS carrying). こまる/たすかる are states
  #    no picture names honestly.
  - { kana: てつだう, romaji: tetsudau, gloss: "to help, to lend a hand", shortGloss: "help", imageable: false, kind: verb, verbClass: u }
  - { kana: はこぶ, romaji: hakobu, gloss: "to carry, to transport", shortGloss: "carry", imageable: true, kind: verb, verbClass: u }
  - { kana: なおす, romaji: naosu, gloss: "to fix, to repair", shortGloss: "fix", imageable: false, kind: verb, verbClass: u }
  - { kana: こまる, romaji: komaru, gloss: "to be stuck, to be in trouble", shortGloss: "be stuck", imageable: false, kind: verb, verbClass: u }
  - { kana: たすかる, romaji: tasukaru, gloss: "to be saved, to be a big help (it saves me)", shortGloss: "be a help", imageable: false, kind: verb, verbClass: u }
  # ══ Nouns.
  - { kana: おねがい, romaji: onegai, gloss: "a favor, a request", shortGloss: "favor", imageable: false, kind: vocab }
  - { kana: むかえ, romaji: mukae, gloss: "a pick-up — going to meet someone (むかえに いく)", shortGloss: "pick-up", imageable: false, kind: vocab }
  # ══ Particles.
  - { kana: だけ, romaji: dake, gloss: "just, only (counts what is there)", shortGloss: "just", imageable: false, kind: particle }
  - { kana: しか, romaji: shika, gloss: "only (with a negative — counts what is missing)", shortGloss: "only (+neg)", imageable: false, kind: particle }
  # ══ Derived surfaces the tokenizer needs (m33-prep §3). EXPANSION AGENT:
  #    keep this list EXACTLY matching beat usage — add くれます/あげました/
  #    もらえません etc. only if beats use them; remove any unused entry.
  - { kana: てつだって, romaji: tetsudatte, gloss: "help, and… (help, te-form)", shortGloss: "help (te)", imageable: false, kind: verb-form, derivedFrom: てつだう, verbClass: u }
  - { kana: はこんで, romaji: hakonde, gloss: "carry, and… (carry, te-form)", shortGloss: "carry (te)", imageable: false, kind: verb-form, derivedFrom: はこぶ, verbClass: u }
  - { kana: なおして, romaji: naoshite, gloss: "fix, and… (fix, te-form)", shortGloss: "fix (te)", imageable: false, kind: verb-form, derivedFrom: なおす, verbClass: u }
  - { kana: こまって, romaji: komatte, gloss: "stuck, and… (stuck, te-form)", shortGloss: "stuck (te)", imageable: false, kind: verb-form, derivedFrom: こまる, verbClass: u }
  - { kana: くれない, romaji: kurenai, gloss: "won't give me (negative of くれる)", shortGloss: "won't give me", imageable: false, kind: verb-form, derivedFrom: くれる, verbClass: ru }
  - { kana: くれた, romaji: kureta, gloss: "gave me (くれる, past)", shortGloss: "gave (give, past)", imageable: false, kind: verb-form, derivedFrom: くれる, verbClass: ru }
  - { kana: くれません, romaji: kuremasen, gloss: "won't give me (polite)", shortGloss: "won't give me (polite)", imageable: false, kind: verb-form, derivedFrom: くれる, verbClass: ru }
  - { kana: もらった, romaji: moratta, gloss: "got, received (もらう, past)", shortGloss: "got (receive, past)", imageable: false, kind: verb-form, derivedFrom: もらう, verbClass: u }
  - { kana: もらえます, romaji: moraemasu, gloss: "can receive (polite potential of もらう)", shortGloss: "can receive", imageable: false, kind: verb-form, derivedFrom: もらう, verbClass: u }
  - { kana: あげた, romaji: ageta, gloss: "gave (あげる, past)", shortGloss: "gave (give, past)", imageable: false, kind: verb-form, derivedFrom: あげる, verbClass: ru }
  - { kana: てつだいましょう, romaji: tetsudaimashou, gloss: "let me help (polite offer stem of てつだう)", shortGloss: "let me help", imageable: false, kind: verb-form, derivedFrom: てつだう, verbClass: u }
  - { kana: たすかった, romaji: tasukatta, gloss: "that saved me (たすかる, past)", shortGloss: "that helped (help)", imageable: false, kind: verb-form, derivedFrom: たすかる, verbClass: u }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m35-neo-1
    role: teaching
    title: "「おしえてくれた」 — help that lands on you"
    focus: "m30's slot with m31's くれる parked in it — the teacher taught, AND the verb files it as a kindness that reached your side"
    introduces: [てつだう, てつだって, くれた, くれない]
    beats:
      - { kind: rule, grammarPointId: te-kureru }
      - { kind: sentence, ja: "せんせいが おしえてくれた。", en: "The teacher taught me", exercises: [te-kureru, ga-existence], mode: build }
      - { kind: sentence, ja: "ともだちが てつだってくれる。", en: "My friend helps me out", exercises: [te-kureru, ga-existence], mode: build }
      - { kind: sentence, ja: "ケンを てつだう。", en: "I help Ken", exercises: [wo-object], mode: build }
      - { kind: sentence, ja: "あねが じしょを かしてくれた。", en: "My older sister lent me a dictionary", exercises: [te-kureru, wo-object], mode: build }
      - { kind: sentence, ja: "ともだちが プレゼントを かってくれた。", en: "My friend bought me a present", exercises: [te-kureru, wo-object], mode: build }
      - { kind: sentence, ja: "ケンは いそがしいから、てつだってくれない。", en: "Ken's busy, so he won't help me", exercises: [te-kureru, kara-because], mode: build }
      - { kind: particle-cloze, stem: "ともだちが ", tail: "。", answer: "てつだってくれる", options: ["てつだってくれる", "てつだってあげる", "てつだう"], en: "My friend helps me out", explanation: "help that reaches YOU takes くれる — it points inward. てつだってあげる would mean your friend is helping someone ELSE, and てつだう alone carries no direction at all." }
      - { kind: listening-comp, audio: "せんせいが おしえてくれた。", answer: "The teacher taught me", distractors: ["The teacher teaches someone else", "I taught the teacher", "The teacher usually teaches"], q: "What does this mean?", explanation: "くれる points the kindness at the speaker — the teacher's teaching landed on ME." }
      - { kind: listening-comp, audio: "ケンは いそがしいから、てつだってくれない。", answer: "Ken's busy, so he won't help me", distractors: ["Ken's busy, so he's helping me", "Ken helped me because he was free", "I'm busy, so I can't help Ken"], explanation: "くれない is くれる's negative — the help that was expected doesn't land." }
      - { kind: kanji, kana: じしょ, kanji: 辞書, distractors: ["じしょう", "でんしょ", "じしゅ"], exercises: [te-kureru] }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "ケンが てつだってくれたよ。", en: "Ken helped me out, you know." }
          - { speaker: "Tom", ja: "え、そう？", en: "Huh, really?" }
          - { speaker: "Mika", ja: "うん。じしょを かしてくれた。", en: "Yeah. He lent me a dictionary." }
        questions:
          - { q: "What did Ken do for Mika?", options: ["Lent her a dictionary", "Bought her a present", "Taught her English", "Carried her bag"], answer: "Lent her a dictionary" }
      - { kind: challenge, ja: "ケンは いそがしいけど、しゅくだいを てつだってくれた。", en: "Ken was busy, but he helped me with my homework", combines: [te-kureru, kedo, wo-object], mode: build }
    reviewPool: [せんせい, ともだち, じしょ, かさ, とけい, プレゼント, しゅくだい, えいご]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m35-neo-2
    role: teaching
    title: "「かってあげた」 — and the trap in pointing it upward"
    focus: "The outward half is easy; the register trap is the lesson — あげる bestows, and bestowing at your teacher condescends"
    introduces: [あげた]
    beats:
      - { kind: rule, grammarPointId: te-ageru }
      - { kind: sentence, ja: "ともだちに ケーキを かってあげた。", en: "I bought my friend a cake", exercises: [te-ageru, ni-recipient, wo-object], mode: build }
      - { kind: sentence, ja: "いもうとに えいごを おしえてあげる。", en: "I'll teach my little sister English", exercises: [te-ageru, ni-recipient, family-register], mode: build }
      - { kind: sentence, ja: "ケンに じしょを かしてあげた。", en: "I lent Ken my dictionary", exercises: [te-ageru, ni-recipient], mode: build }
      - { kind: sentence, ja: "おとうとに ほんを かってあげた。", en: "I bought my little brother a book", exercises: [te-ageru, ni-recipient, family-register], mode: build }
      - { kind: particle-cloze, stem: "ともだちに ケーキを ", tail: "。", answer: "かってあげた", options: ["かってあげた", "かってくれた", "かった"], en: "I bought my friend a cake", explanation: "あげる points OUTWARD — I'm doing my friend the favor. かってくれた would flip it: my friend bought ME a cake. かった alone is just the plain past, no favor framed at all." }
      - { kind: listening-comp, audio: "いもうとに えいごを おしえてあげる。", answer: "I'll teach my little sister English", distractors: ["My little sister will teach me English", "I teach English at school", "My little sister taught me English"], explanation: "あげる keeps the favor pointed at いもうと — teaching FOR her, not from her." }
      - { kind: particle-cloze, stem: "", tail: "を てつだってあげる。", answer: "いもうと", options: ["いもうと", "せんせい", "いしゃ"], en: "I'll help ___ (as a favor)", explanation: "あげる bestows, so it aims DOWNWARD or level — a little sister, a friend. せんせい and いしゃ both sit above you, and bestowing help on them condescends. Offer upward with ましょうか instead (coming in lesson 10)." }
      - { kind: kanji, kana: かぞく, kanji: 家族, distractors: ["かぞこ", "けぞく", "いえぞく"], exercises: [family-register] }
      - kind: dialogue
        lines:
          - { speaker: "Ken", ja: "いもうとの たんじょうびに なにを あげた？", en: "What did you give your sister for her birthday?" }
          - { speaker: "Tom", ja: "えいごの ほんを かってあげた。", en: "I bought her an English book." }
          - { speaker: "Ken", ja: "いいね。", en: "Nice." }
        questions:
          - { q: "What did Tom give his sister?", options: ["An English book", "A cake", "A dictionary", "A watch"], answer: "An English book" }
      - { kind: challenge, ja: "いもうとの たんじょうびだから、ケーキを かってあげた。", en: "It's my sister's birthday, so I bought her a cake", combines: [te-ageru, kara-because, wo-object], mode: build }
