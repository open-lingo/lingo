module: m11
title: "Time I: the clock, the calendar, and plain past た"
register: plain
priorNeoModules: [m3, m4, m5, m6, m7, m8, m9, m10]

priorGrammarPoints: [wa-topic, ga-existence, wo-object, no-possession, ni-location, de-action, mo-also, dare, kore-sore-are-dore,
                     nai-form, arimasu, imasu,
                     nai-existence, koko-soko-asoko, spatial-relations,
                     location-qa,
                     masu-present, masu-negative, desu-copula, ka-question, register-audience,
                     te-form, te-kudasai, numbers-1-10, counter-tsu, ikura-price,
                     yes-no-register, aizuchi, chotto-softener]

notes: |
  m11 = spine tile n04. TIME I + PLAIN PAST た.

  Shape (inv 25): 15 lessons = 11 teaching + 3 review + 1 challenge. Two
  teaching slots are KATAKANA rows (ラ, ワ — neoModuleIndex 11), wired at
  module level; this IR carries 9 teaching + 3 review + 1 challenge = 13.

  COMPOSITIONAL NUMBERS (Spencer's s10 note): 11-99 is ARITHMETIC, not
  vocabulary. じゅう+X stacks on the right, X+じゅう on the left, and the
  learner already owns every piece from m9. No new number atoms are
  declared here for 11-99 — じゅうご really is じゅう + ご, and the build
  tiles say so.

  HOMOGRAPH CARE (inherited from m9): に is the particle AND the number 2.
  にじゅう (20) is therefore never drilled — the module reaches for
  さんじゅう / よんじゅう / ごじゅう / ろくじゅう / ななじゅう instead. にじ
  (2 o'clock) survives only inside the counter-ji rule card's enumeration,
  where the run of hours disambiguates it.

  ONE FACT, SECOND PAYOUT (draft-4, thr1): た is NOT a new table. m8 bought
  the sound-change table for て; this module spends it again — swap て→た,
  で→だ. The rule card says exactly that, and the conjugation ramp drills
  the swap before any sentence work.

  ました/でした ARRIVE HERE, moved out of s07 (spine n04 note): the polite
  past is drilled BESIDE た/だった the day plain past is born, so the
  learner meets the tense once and the register twice. ませんでした and
  なかった are NOT here — they complete at s13 with the connectives.

  REGISTER: the ≤20% plain-preferred ramp (m8-m11) ends with this module,
  which necessarily carries a real polite share because it teaches the
  polite past. Plain is still the base: L1-L6 and R2 are plain-first, the
  polite spend is concentrated in L7/L8 and the mixed closers. Every
  production prompt names its AUDIENCE (inv 8) — た and ました are now
  competing answers to the same English, so the cue is load-bearing here in
  a way it was not in m9.

grammarPoints:
  - id: numbers-11-99
    rule: "Past ten, Japanese counts by ARITHMETIC. Stack a digit on the RIGHT of じゅう and you add: じゅう + ご = じゅうご (15). Stack a digit on the LEFT and you multiply: さん + じゅう = さんじゅう (30), よん + じゅう = よんじゅう (40), ご + じゅう = ごじゅう (50), なな + じゅう = ななじゅう (70). Combine both for everything in between: ろくじゅうご = 65. There is nothing new to memorise — you already know every piece."
    examples:
      - { ja: "じゅうご", en: "fifteen" }
      - { ja: "さんじゅう", en: "thirty" }
      - { ja: "ろくじゅうご", en: "sixty-five" }
    antiPattern: { ja: "いちじゅう", en: "", why: "ten on its own is just じゅう — いちじゅう is not a number" }
  - id: counter-ji
    rule: "A clock hour is the number plus 〜じ. Three readings break the pattern and are simply learned: 4 is よじ (never よんじ), 7 is しちじ (never ななじ), 9 is くじ (never きゅうじ). なんじ asks 'what time?', and はん after the hour means half past — ごじはん is 5:30."
    examples:
      - { ja: "いちじ にじ さんじ よじ", en: "one, two, three, four o'clock" }
      - { ja: "ごじ ろくじ しちじ はちじ", en: "five, six, seven, eight o'clock" }
      - { ja: "くじ じゅうじ", en: "nine, ten o'clock" }
    antiPattern: { ja: "よんじ", en: "", why: "four o'clock is よじ — よん never takes 〜じ" }
  - id: ni-time
    rule: "A point on the CLOCK takes に: さんじに いく. It is the same に you already use for a destination — Japanese treats a moment in time like a place you arrive at. Words that are not clock readings take NO に at all: きょう いく, あした いく. ごぜん (a.m.) and ごご (p.m.) sit in front of the hour: ごご さんじに."
    examples:
      - { ja: "さんじに いく。", en: "I'll go at three." }
      - { ja: "くじに たべる。", en: "I eat at nine." }
    antiPattern: { ja: "さんじ いく。", en: "", why: "a clock time needs に — さんじに いく" }
  - id: ta-form
    variant: table
    rule: "Plain past is た, and it runs on the SAME sound-change table you bought for て. Swap て for た and で for だ, and you are done. る-verbs: たべる → たべた. う-verbs: む/ぶ/ぬ → んだ (のむ → のんだ); う/つ/る → った (かう → かった); く → いた (きく → きいた); ぐ → いだ. する → した, くる → きた, and いく is the same rebel it was for て: いった. A past sentence usually opens with the time it happened: きのう is 'yesterday', so きのう のんだ is 'I drank it yesterday'."
    examples:
      - { ja: "みずを のんだ。", en: "I drank water." }
      - { ja: "ごはんを たべた。", en: "I ate rice." }
      - { ja: "うたを きいた。", en: "I listened to a song." }
      - { ja: "みせに いった。", en: "I went to the shop." }
    antiPattern: { ja: "みずを のみた。", en: "", why: "のむ ends in む, so it joins the んだ group — のんだ, not のみた" }
    # The transform ramp is scoped to ru/u: every card it can emit must also
    # appear in `examples` above, because the ramp is PINNED ahead of the
    # interleaved middle and a transform card is not intro-capable (inv 37).
    # する/くる stay in the prose and debut on L5's build beats instead.
    conjugation: { form: ta, classes: [ru, u] }
  - id: ta-form
    variant: rebels
    rule: "The same three verbs that broke the て table break this one, in the same way: する → した, くる → きた, and いく → いった, never いいた. That is the whole exception list — every other verb you know follows the rows. わかる is regular (わかった) but drill it here anyway; you will reach for it constantly."
    examples:
      - { ja: "いった。", en: "I went." }
      - { ja: "きのう した。", en: "I did it yesterday." }
    antiPattern: { ja: "いいた。", why: "いく ends in く but skips the く→いた row — its past is いった." }
  - id: desu-past
    rule: "だ has a past cell too, and it is だった: ねこだ → ねこだった. Verbs take た, nouns take だった — the same split you already know from the present, where a verb stands alone and a noun needs だ. Its polite twin is でした, which arrives beside ました."
    examples:
      - { ja: "それは ねこだった。", en: "That was a cat." }
      - { ja: "きのうは じゅぎょうだった。", en: "Yesterday was a class day." }
    antiPattern: { ja: "それは ねこた。", en: "", why: "nouns take だった — た alone is for verbs" }
  - id: masu-past
    rule: "The polite past swaps ます for ました — same stem, different tail. のみます → のみました. Nothing else moves: ました is the polite skin on the た you just learned. Plain た goes to friends; ました goes to teachers, staff and strangers."
    examples:
      - { ja: "みずを のみました。", en: "I drank water. (polite)" }
      - { ja: "ごはんを たべました。", en: "I ate rice. (polite)" }
      - { ja: "みせに いきました。", en: "I went to the shop. (polite)" }
    antiPattern: { ja: "みずを のみますた。", en: "", why: "ました REPLACES ます — you never stack た on top of it" }
    conjugation: { form: masu-past, classes: [ru, u] }
  - id: itsu-when
    rule: "いつ asks WHEN. It stands where a time word would stand and takes no particle of its own: いつ いく？ Answer with any time at all — さんじに, きょう, きのう, ごご. なんじ is the narrow version: it asks for a reading on the clock, so its answer is always an hour."
    examples:
      - { ja: "いつ いく？", en: "When are you going?" }
      - { ja: "いつ たべる？", en: "When do you eat?" }
    antiPattern: { ja: "いつに いく？", en: "", why: "いつ takes no に — the particle belongs to a clock time, not to the question word" }

newAtoms:
  # ── multiples of ten. Declared as ATOMS, not as じゅう+X tiles, for a
  #    mechanical reason worth writing down: the tokenizer is longest-match,
  #    and the hour atoms below are PREFIXES of these numbers (ごじ ⊂ ごじゅう,
  #    ろくじ ⊂ ろくじゅう, さんじ ⊂ さんじゅう). Without the longer surface in
  #    the vocabulary, ごじゅうえん tokenizes as ごじ + a garbage fragment and
  #    the tile bank cannot spell the sentence. The COMPOSITIONAL claim still
  #    holds where it matters — じゅう+X (11-19) stays two tiles, and the rule
  #    card teaches both directions.
  - { kana: さんじゅう, romaji: sanjuu, gloss: "thirty", imageable: false, kind: vocab }
  - { kana: よんじゅう, romaji: yonjuu, gloss: "forty", imageable: false, kind: vocab }
  - { kana: ごじゅう, romaji: gojuu, gloss: "fifty", imageable: false, kind: vocab }
  - { kana: ろくじゅう, romaji: rokujuu, gloss: "sixty", imageable: false, kind: vocab }
  - { kana: ななじゅう, romaji: nanajuu, gloss: "seventy", imageable: false, kind: vocab }
  # ── clock hours (counter-ji). よじ / しちじ / くじ are the irregular
  #    readings; the rest are transparent number + じ.
  - { kana: いちじ, romaji: ichiji, gloss: "one o'clock", imageable: false, kind: vocab }
  - { kana: にじ, romaji: niji, gloss: "two o'clock", imageable: false, kind: vocab }
  - { kana: さんじ, romaji: sanji, gloss: "three o'clock", imageable: false, kind: vocab }
  - { kana: よじ, romaji: yoji, gloss: "four o'clock", imageable: false, kind: vocab }
  - { kana: ごじ, romaji: goji, gloss: "five o'clock", imageable: false, kind: vocab }
  - { kana: ろくじ, romaji: rokuji, gloss: "six o'clock", imageable: false, kind: vocab }
  - { kana: しちじ, romaji: shichiji, gloss: "seven o'clock", imageable: false, kind: vocab }
  - { kana: はちじ, romaji: hachiji, gloss: "eight o'clock", imageable: false, kind: vocab }
  - { kana: くじ, romaji: kuji, gloss: "nine o'clock", imageable: false, kind: vocab }
  - { kana: じゅうじ, romaji: juuji, gloss: "ten o'clock", imageable: false, kind: vocab }
  - { kana: なんじ, romaji: nanji, gloss: "what time", imageable: false, kind: vocab }
  - { kana: はん, romaji: han, gloss: "half past (the hour)", shortGloss: "half past", imageable: false, kind: vocab }
  # ── calendar / day parts. Deliberately imageable:false — 📅 already
  #    belongs to きょう, and a clock-half is not a picture a learner can
  #    discriminate from a sunrise (inv 30 only binds IMAGEABLE atoms).
  - { kana: ごぜん, romaji: gozen, gloss: "a.m., before noon", shortGloss: "a.m.", imageable: false, kind: vocab }
  - { kana: ごご, romaji: gogo, gloss: "p.m., afternoon", shortGloss: "p.m.", imageable: false, kind: vocab }
  - { kana: あした, romaji: ashita, gloss: "tomorrow", imageable: false, kind: vocab }
  - { kana: きのう, romaji: kinou, gloss: "yesterday", imageable: false, kind: vocab }
  - { kana: いつ, romaji: itsu, gloss: "when", imageable: false, kind: vocab }
  # ── plain past た. Order matters: the conjugation ramp takes the first
  #    three of a lesson's `introduces` in THIS list's order, so each
  #    lesson's ramp opens on a different verb class.
  - { kana: たべた, romaji: tabeta, gloss: "ate (eat, past)", imageable: false, kind: verb-form, derivedFrom: たべる, verbClass: ru }
  - { kana: のんだ, romaji: nonda, gloss: "drank (drink, past)", imageable: false, kind: verb-form, derivedFrom: のむ, verbClass: u }
  - { kana: きいた, romaji: kiita, gloss: "heard (hear, past)", imageable: false, kind: verb-form, derivedFrom: きく, verbClass: u }
  - { kana: みた, romaji: mita, gloss: "watched (watch, past)", imageable: false, kind: verb-form, derivedFrom: みる, verbClass: ru }
  - { kana: かった, romaji: katta, gloss: "bought (buy, past)", imageable: false, kind: verb-form, derivedFrom: かう, verbClass: u }
  - { kana: あそんだ, romaji: asonda, gloss: "played (play, past)", imageable: false, kind: verb-form, derivedFrom: あそぶ, verbClass: u }
  - { kana: した, romaji: shita, gloss: "did (make, past)", imageable: false, kind: verb-form, derivedFrom: する, verbClass: irregular }
  - { kana: きた, romaji: kita, gloss: "came (come, past)", imageable: false, kind: verb-form, derivedFrom: くる, verbClass: irregular }
  - { kana: いった, romaji: itta, gloss: "went (travel, past)", imageable: false, kind: verb-form, derivedFrom: いく, verbClass: u }
  # verbClass deliberately omitted: わかった has no rule-card example line,
  #    so it must never be picked up as transform-ramp material.
  - { kana: わかった, romaji: wakatta, gloss: "understood (past)", imageable: false, kind: verb-form, derivedFrom: わかる }
  # ── copula past
  - { kana: だった, romaji: datta, gloss: "was, were (plain)", shortGloss: "was (plain)", imageable: false, kind: grammar-chunk }
  - { kana: でした, romaji: deshita, gloss: "was, were (polite)", shortGloss: "was (polite)", imageable: false, kind: grammar-chunk }
  # ── polite past
  - { kana: たべました, romaji: tabemashita, gloss: "ate (eat, polite past)", imageable: false, kind: verb-form, derivedFrom: たべる, verbClass: ru }
  - { kana: のみました, romaji: nomimashita, gloss: "drank (drink, polite past)", imageable: false, kind: verb-form, derivedFrom: のむ, verbClass: u }
  - { kana: いきました, romaji: ikimashita, gloss: "went (travel, polite past)", imageable: false, kind: verb-form, derivedFrom: いく, verbClass: u }
  - { kana: しました, romaji: shimashita, gloss: "did (make, polite past)", imageable: false, kind: verb-form, derivedFrom: する, verbClass: irregular }
  - { kana: かいました, romaji: kaimashita, gloss: "bought (buy, polite past)", imageable: false, kind: verb-form, derivedFrom: かう }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m11-neo-1
    role: teaching
    title: "Eleven to ninety-nine"
    focus: "numbers past ten are arithmetic on pieces the learner already owns"
    introduces: [さんじゅう, よんじゅう, ごじゅう, ろくじゅう, ななじゅう]
    beats:
      - { kind: rule, grammarPointId: numbers-11-99 }
      - { kind: sentence, ja: "ほんは じゅうごえんだ。", en: "Say to a friend: The book is fifteen yen", exercises: [wa-topic, desu-copula, numbers-11-99], mode: build }
      - { kind: sentence, ja: "かさは さんじゅうえんだ。", en: "Say to a friend: The umbrella is thirty yen", exercises: [wa-topic, desu-copula, numbers-11-99], mode: build }
      - { kind: sentence, ja: "パンは じゅうはちえんだ。", en: "The bread is eighteen yen", exercises: [wa-topic, desu-copula, numbers-11-99], mode: listening }
      - { kind: sentence, ja: "ぼうしは よんじゅうえんだ。", en: "Say to a friend: The hat is forty yen", exercises: [wa-topic, desu-copula, numbers-11-99], mode: build }
      - { kind: sentence, ja: "これは ごじゅうえんです。", en: "Say politely: This is fifty yen", exercises: [kore-sore-are-dore, desu-copula, numbers-11-99], mode: build }
      - { kind: sentence, ja: "えんぴつは じゅうきゅうえんだ。", en: "Say to a friend: The pencil is nineteen yen", exercises: [wa-topic, desu-copula, numbers-11-99], mode: translate }
      - { kind: particle-cloze, stem: "ほんは ", tail: "えんだ。", answer: "じゅうご", options: ["じゅうご", "ごじゅう", "じゅうきゅう"], en: "The book is fifteen yen", explanation: "じゅう on the left adds: じゅうご is 15. じゅう on the right multiplies: ごじゅう is 50." }
      - { kind: sentence, ja: "めがねは ななじゅうえんだ。", en: "Say to a friend: The glasses are seventy yen", exercises: [wa-topic, desu-copula, numbers-11-99], mode: build }
      - { kind: challenge, ja: "ミカの かさは ろくじゅうごえんだ。", en: "Say to a friend: Mika's umbrella is sixty-five yen", combines: [no-possession, wa-topic, desu-copula, numbers-11-99], mode: build }
    reviewPool: [ほん, かさ, パン, ぼうし, えんぴつ, めがね, えん, たかい, やすい]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m11-neo-2
    role: teaching
    title: "Telling the hour — 〜じ"
    focus: "number + じ, the three irregular readings, なんじ and はん"
    introduces: [いちじ, にじ, さんじ, よじ, ごじ, ろくじ, しちじ, はちじ, くじ, じゅうじ, なんじ, はん]
    beats:
      # The rule card ENUMERATES the hours, which is their debut (m9's
      # numbers-1-10 card works the same way). Hours are `imageable: false`
      # for the same reason the numerals were: a clock emoji cannot
      # discriminate よじ from くじ.
      - { kind: rule, grammarPointId: counter-ji }
      - { kind: sentence, ja: "いま さんじだ。", en: "Say to a friend: It's three o'clock now", exercises: [counter-ji, desu-copula], mode: build }
      - { kind: sentence, ja: "いま よじだ。", en: "Say to a friend: It's four o'clock now", exercises: [counter-ji, desu-copula], mode: build }
      - { kind: sentence, ja: "いま なんじですか。", en: "Say politely: What time is it now", exercises: [counter-ji, desu-copula, ka-question], mode: build }
      - { kind: sentence, ja: "じゅぎょうは くじだ。", en: "Say to a friend: Class is at nine", exercises: [wa-topic, counter-ji, desu-copula], mode: build }
      - { kind: sentence, ja: "いま しちじはんだ。", en: "It's half past seven now", exercises: [counter-ji, desu-copula], mode: listening }
      - { kind: sentence, ja: "とけいは じゅうじだ。", en: "Say to a friend: The clock says ten", exercises: [wa-topic, counter-ji, desu-copula], mode: build }
      - { kind: particle-cloze, stem: "いま ", tail: "だ。", answer: "よじ", options: ["よじ", "しちじ", "くじ"], en: "It's four o'clock now", explanation: "Four o'clock is よじ — the hour that refuses よん." }
      - { kind: sentence, ja: "いま ごじはんだ。", en: "Say to a friend: It's half past five now", exercises: [counter-ji, desu-copula], mode: build }
      - { kind: challenge, ja: "ミカの じゅぎょうは いちじはんだ。", en: "Say to a friend: Mika's class is at half past one", combines: [no-possession, wa-topic, counter-ji, desu-copula], mode: build }
    reviewPool: [いま, じかん, とけい, じゅぎょう, きょう, せんせい, がくせい, ほん]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m11-neo-3
    role: teaching
    title: "At three o'clock — 〜じに"
    focus: "に on a clock time; ごぜん/ごご in front of the hour; あした takes no に"
    introduces: [ごぜん, ごご, あした]
    beats:
      - { kind: rule, grammarPointId: ni-time }
      - { kind: sentence, ja: "ごご さんじに いく。", en: "Say to a friend: I'm going at three in the afternoon", exercises: [ni-time, counter-ji], mode: build }
      - { kind: sentence, ja: "ごぜん しちじに たべる。", en: "Say to a friend: I eat at seven in the morning", exercises: [ni-time, counter-ji], mode: build }
      - { kind: sentence, ja: "あした ごじに いく。", en: "Say to a friend: I'm going at five tomorrow", exercises: [ni-time, counter-ji], mode: build }
      - { kind: sentence, ja: "あした じゅぎょうが ある。", en: "Say to a friend: There's class tomorrow", exercises: [ga-existence, arimasu], mode: build }
      - { kind: sentence, ja: "ごご ろくじに ともだちと あそぶ。", en: "I'm playing with a friend at six in the afternoon", exercises: [ni-time, counter-ji], mode: listening }
      - { kind: sentence, ja: "きょう くじに みせに いく。", en: "Say to a friend: I'm going to the shop at nine today", exercises: [ni-time, counter-ji, ni-location], mode: build }
      - { kind: particle-cloze, stem: "", tail: " ごじに いく。", answer: "ごご", options: ["ごご", "ごぜん", "いま"], en: "I'm going at five in the afternoon", explanation: "ごご marks the afternoon half of the clock; ごぜん marks the morning half." }
      - { kind: sentence, ja: "ごぜん はちじに ごはんを たべる。", en: "Say to a friend: I eat rice at eight in the morning", exercises: [ni-time, counter-ji, wo-object], mode: build }
      - { kind: challenge, ja: "あした ごご よじに ミカの いえに いく。", en: "Say to a friend: I'm going to Mika's house at four tomorrow afternoon", combines: [ni-time, counter-ji, no-possession, ni-location], mode: build }
    reviewPool: [じゅぎょう, みせ, いえ, ともだち, ごはん, いま, とけい, いちじ, さんじ]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m11-neo-r1
    role: review
    title: "Review — numbers and the clock"
    focus: "11-99, the hours and 〜じに on all-new surfaces"
    introduces: []
    beats:
      - { kind: sentence, ja: "ほんは よんじゅうえんだ。", en: "Say to a friend: The book is forty yen", exercises: [wa-topic, desu-copula, numbers-11-99], mode: build }
      - { kind: sentence, ja: "いま しちじだ。", en: "Say to a friend: It's seven o'clock now", exercises: [counter-ji, desu-copula], mode: build }
      - { kind: sentence, ja: "くじに みせに いく。", en: "I'm going to the shop at nine", exercises: [ni-time, counter-ji, ni-location], mode: listening }
      - { kind: sentence, ja: "ごぜん はちじに たべる。", en: "Say to a friend: I eat at eight in the morning", exercises: [ni-time, counter-ji], mode: build }
      - { kind: sentence, ja: "じゅぎょうは ごじはんだ。", en: "Say to a friend: Class is at half past five", exercises: [wa-topic, counter-ji, desu-copula], mode: build }
