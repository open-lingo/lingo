  # Vocab pack 1 (B065/B067, 2026-07-29) — the weekday debt named in the
  # ni-time card ("a named point on the calendar takes に … those arrive
  # later"). Sits right after 〜じに so the calendar-に lands while the
  # clock-に is fresh. Ids are m11-neo-10/-11 — numbered after the module's
  # nine authored teaching slots, positioned where they teach (id ≠ position
  # is established precedent — see the m2 id landmine in CLAUDE.md).
  - id: m11-neo-10
    role: teaching
    title: "The week — 〜ようび"
    focus: "the seven day names; a NAMED day takes に like a clock time, あさって is relative and takes none"
    introduces: [げつようび, かようび, すいようび, もくようび, きんようび, どようび, にちようび, あさって]
    beats:
      - { kind: rule, grammarPointId: youbi-days }
      # Recognition-before-production (B075, learner-sim 2026-07-29 finding 2):
      # every day name gets a PURE recognition rep — a word-choice cloze
      # (meaning → pick the day, same device numbers-11-99/counter-ji use) or
      # a listening MCQ whose distractors differ ONLY on the day — authored
      # ahead of that day's build. Days can't be image-discriminated (generic
      # 📅), so recognition is text/audio shaped by design. Sentences are
      # REUSED from this lesson's own builds (≤3 exposures each, every clip
      # already in the TTS manifest — no new audio).
      - { kind: sentence, ja: "あさって みせに いく。", en: "Say to a friend: I'm going to the shop the day after tomorrow", exercises: [ni-location], mode: build }
      - { kind: particle-cloze, stem: "", tail: "に さんぽを する。", answer: "どようび", options: ["どようび", "かようび", "すいようび"], en: "I'll take a walk on Saturday", explanation: "ど is earth — どようび is Saturday. か (fire) is Tuesday and すい (water) is Wednesday." }
      - { kind: sentence, ja: "どようびに さんぽを する。", en: "Say to a friend: I'll take a walk on Saturday", exercises: [youbi-days, ni-time, wo-object], mode: build }
      - { kind: listening-comp, audio: "すいようびに かいものを する。", answer: "I'll do the shopping on Wednesday", distractors: ["I'll do the shopping on Thursday", "I'll do the shopping on Saturday", "I'll do the shopping on Tuesday"], exercises: [youbi-days, ni-time, wo-object] }
      - { kind: sentence, ja: "すいようびに かいものを する。", en: "Say to a friend: I'll do the shopping on Wednesday", exercises: [youbi-days, ni-time, wo-object], mode: build }
      - { kind: particle-cloze, stem: "", tail: "に じゅぎょうが あります。", answer: "げつようび", options: ["げつようび", "にちようび", "どようび"], en: "There's class on Monday", explanation: "げつ is the moon of つき — げつようび is Monday. にち (the sun) is Sunday and ど (earth) is Saturday." }
      - { kind: sentence, ja: "げつようびに じゅぎょうが あります。", en: "Say politely: There's class on Monday", exercises: [youbi-days, ni-time, ga-existence, arimasu], mode: build }
      - { kind: listening-comp, audio: "にちようびに うみに いく。", answer: "I'm going to the sea on Sunday", distractors: ["I'm going to the sea on Monday", "I'm going to the sea on Saturday", "I'm going to the sea on Tuesday"], exercises: [youbi-days, ni-time, ni-location] }
      - { kind: sentence, ja: "にちようびに うみに いく。", en: "Say to a friend: I'm going to the sea on Sunday", exercises: [youbi-days, ni-time, ni-location], mode: build }
      - { kind: particle-cloze, stem: "", tail: "に はたらく。", answer: "きんようび", options: ["きんようび", "もくようび", "にちようび"], en: "I work on Friday", explanation: "きん is gold — きんようび is Friday. もく (wood) is Thursday and にち (the sun) is Sunday." }
      - { kind: listening-comp, audio: "かようびに ともだちが くる。", answer: "A friend is coming on Tuesday", distractors: ["A friend is coming on Wednesday", "A friend is coming on Sunday", "A friend is coming on Friday"], exercises: [youbi-days, ni-time, ga-existence] }
      - { kind: sentence, ja: "きんようびに はたらく。", en: "Say to a friend: I work on Friday", exercises: [youbi-days, ni-time], mode: build }
      - { kind: particle-cloze, stem: "", tail: "に じゅぎょうが ある。", answer: "もくようび", options: ["もくようび", "きんようび", "げつようび"], en: "There's class on Thursday", explanation: "もく is the wood of き, the tree — もくようび is Thursday. きん (gold) is Friday and げつ (the moon of つき) is Monday." }
      - { kind: listening-comp, audio: "もくようびに うたを きく。", answer: "I listen to a song on Thursday", distractors: ["I listen to a song on Monday", "I buy a song on Thursday", "I play with a friend on Thursday"], exercises: [youbi-days, ni-time, wo-object] }
      - { kind: sentence, ja: "かようびに ともだちが くる。", en: "A friend is coming on Tuesday", exercises: [youbi-days, ni-time, ga-existence], mode: listening }
      - kind: dialogue
        lines:
          - { speaker: "Tom", ja: "どようびに なにを する？", en: "What are you doing on Saturday?" }
          - { speaker: "Mika", ja: "うみに いく。にちようびは いえに いる。", en: "I'm going to the sea. On Sunday I'll be at home." }
        questions:
          - { q: "What will Mika do on Saturday?", options: ["Go to the sea", "Stay home", "Go to a party", "Do the shopping"], answer: "Go to the sea" }
      - { kind: challenge, ja: "にちようびに ミカの いえで ごはんを たべる。", en: "Say to a friend: I'm eating at Mika's house on Sunday", combines: [youbi-days, ni-time, no-possession, de-action, wo-object], mode: build }
    reviewPool: [じゅぎょう, うみ, ともだち, かいもの, みせ, いえ, うた, ごはん]

