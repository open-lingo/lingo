      - { kind: sentence, ja: "たなかさんは げんきなようだ。", en: "Tanaka seems energetic.", exercises: [youda-direct-evidence], mode: build }
      - { kind: sentence, ja: "あの ひとは がくせいのようだ。", en: "That person seems to be a student.", exercises: [youda-direct-evidence], mode: listening }
      - { kind: listening-comp, audio: "あめが ふっているようだ。", answer: "Seems like it's raining.", distractors: ["It's definitely raining.", "It's not raining at all.", "It rained yesterday."], q: "What does this mean?" }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "たなかさん、どうしたの？", en: "Tanaka, what's wrong?" }
          - { speaker: "Ken", ja: "かぜを ひいたようだよ。", en: "Seems like he caught a cold." }
          - { speaker: "Mika", ja: "そう。この へやも さむいようだし、しんぱいだね。", en: "I see. This room seems cold too, so I'm worried." }
