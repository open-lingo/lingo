  # ═══════════════════════════════════════════════════════════════════════
  - id: m44-neo-5
    role: teaching
    title: "「かぜを ひいたみたい」— みたい, the casual twin"
    focus: "みたい is ようだ's exact casual twin — same job, but its own bare-noun rule, no の at all"
    introduces: [みたい]
    beats:
      - { kind: rule, grammarPointId: mitai-casual }
      - { kind: sentence, ja: "こどもみたいだ。", en: "Seems like a child.", exercises: [mitai-casual], mode: build }
      - { kind: sentence, ja: "かぜを ひいたみたい。", en: "Seems like he caught a cold.", exercises: [mitai-casual], mode: build }
      - { kind: sentence, ja: "たなかさんは いそがしいみたい。", en: "Tanaka seems busy.", exercises: [mitai-casual], mode: build }
      - { kind: sentence, ja: "あめが ふっているみたい。", en: "Seems like it's raining.", exercises: [mitai-casual, te-iru], mode: build }
      - { kind: sentence, ja: "がくせいみたいだね。", en: "Seems like a student, huh.", exercises: [mitai-casual], mode: listening }
      - { kind: particle-cloze, stem: "かぜを ひいた", tail: "。", answer: "みたい", options: ["みたい", "のみたい", "ようみたい"], en: "Seems like he caught a cold (casual).", explanation: "みたい attaches straight onto a plain verb, just like ようだ — but の and よう never stack onto みたい; the two twins don't share connectors, each is a complete word on its own." }
      - { kind: listening-comp, audio: "こどもみたいだ。", answer: "Seems like a child.", distractors: ["Is definitely an adult.", "Is definitely not a child.", "Was a child long ago."], q: "What does this mean?" }
      - { kind: listening-comp, audio: "たなかさんは いそがしいみたい。", answer: "Tanaka seems busy.", distractors: ["Tanaka is definitely free.", "Tanaka is definitely busy, no doubt.", "Nobody knows about Tanaka's schedule."], q: "What does this mean?" }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "たなかさん、どうしたの？", en: "Tanaka, what's wrong?" }
          - { speaker: "Ken", ja: "かぜを ひいたみたい。かおが あかいよ。", en: "Seems like he caught a cold. His face is red." }
          - { speaker: "Mika", ja: "そう。だいじょうぶかな。", en: "I see. I wonder if he's okay." }
        questions:
          - { q: "What does Ken think about Tanaka, casually?", options: ["Seems like he caught a cold", "Definitely healthy", "Already recovered", "No idea"], answer: "Seems like he caught a cold" }
      - { kind: challenge, ja: "かおが あかいから、かぜを ひいたみたい。げんきなようだ けど、しんぱいだ。", en: "Since his face is red, it seems like he caught a cold, but even though he seems energetic, I'm worried.", combines: [mitai-casual, kara-because, youda-direct-evidence, kedo], mode: build }
    reviewPool: [かぜ, あかい, げんき, しんぱい]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m44-neo-6
    role: teaching
    title: "「こおりのように つめたい」— のように, a simile of HOW"
    focus: "Nのように + verb/adjective describes HOW something is or happens, by comparison — a different job from ようだ's evidence-guess"
    introduces: [ちがい, とくちょう]
    beats:
      - { kind: rule, grammarPointId: you-ni-simile }
      - { kind: sentence, ja: "こおりのように つめたい。", en: "As cold as ice.", exercises: [you-ni-simile], mode: build }
      - { kind: sentence, ja: "ねこのように きこえる。", en: "Sounds like a cat.", exercises: [you-ni-simile], mode: build }
      - { kind: sentence, ja: "ゆめのように きれいだ。", en: "Pretty like a dream.", exercises: [you-ni-simile], mode: build }
      - { kind: sentence, ja: "こどものように あそぶ。", en: "Plays like a child.", exercises: [you-ni-simile], mode: build }
      - { kind: sentence, ja: "いぬのように はしる。", en: "Runs like a dog.", exercises: [you-ni-simile], mode: listening }
      - { kind: particle-cloze, stem: "こおり", tail: " つめたい。", answer: "のように", options: ["のように", "のような", "ように"], en: "As cold as ice.", explanation: "のように needs の before よう — simile always attaches through の onto the noun. のような is the adnominal twin (next lesson, describes a following NOUN, not an action)." }
      - { kind: listening-comp, audio: "ねこのように きこえる。", answer: "Sounds like a cat.", distractors: ["Sounds like rain.", "Sounds like nothing at all.", "Sounds like thunder."], q: "What does this mean?" }
      - { kind: listening-comp, audio: "いぬのように はしる。", answer: "Runs like a dog.", distractors: ["Walks slowly like a turtle.", "Doesn't move at all.", "Swims like a fish."], q: "What does this mean?" }
      - { kind: sentence, ja: "ちがいが わからない。", en: "I can't tell the difference.", exercises: [], mode: build }
      - { kind: sentence, ja: "いぬの とくちょうが ある。", en: "It has dog characteristics.", exercises: [ga-existence], mode: build }
      - { kind: kanji, kana: ちがい, kanji: 違い, distractors: ["ちかい", "ちいさい", "ちから"], exercises: [you-ni-simile] }
      - kind: dialogue
        lines:
          - { speaker: "Mika", ja: "この おとは ねこのように きこえるね。", en: "This sound sounds like a cat, huh." }
          - { speaker: "Ken", ja: "ほんとだ。でも、いぬの とくちょうも あるよ。", en: "True. But it also has dog characteristics." }
          - { speaker: "Mika", ja: "ちがいが よく わからないね。", en: "Hard to tell the difference, huh." }
        questions:
          - { q: "What does Mika say the sound is like?", options: ["Sounds like a cat", "Sounds like rain", "Sounds like nothing", "Sounds like thunder"], answer: "Sounds like a cat" }
      - { kind: challenge, ja: "この おとは ねこのように きこえるが、いぬの とくちょうも あるから、ちがいが わからない。", en: "This sound sounds like a cat, but since it also has dog characteristics, I can't tell the difference.", combines: [you-ni-simile, kedo, kara-because], mode: build }
    reviewPool: [ねこ, いぬ, おと, こおり]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m44-neo-7
    role: teaching
    title: "「にんぎょうのような かお」— のような + the resemblance domain"
    focus: "のような describes a NOUN by comparison to another noun; domain integration with にる/そっくり inside one dialogue_sim"
    introduces: [かがみ, にんぎょう, そっくり, にる]
    beats:
      - { kind: rule, grammarPointId: you-na-simile }
      - { kind: sentence, ja: "にんぎょうのような かお。", en: "A doll-like face.", exercises: [you-na-simile], mode: build }
      - { kind: sentence, ja: "こおりのような みず。", en: "Ice-like water.", exercises: [you-na-simile], mode: build }
      - { kind: sentence, ja: "かがみのような うみ。", en: "A mirror-like sea.", exercises: [you-na-simile], mode: build }
      - { kind: sentence, ja: "ねこのような め。", en: "Cat-like eyes.", exercises: [you-na-simile], mode: build }
      - { kind: sentence, ja: "こどものような こえ。", en: "A childlike voice.", exercises: [you-na-simile], mode: listening }
      - { kind: sentence, ja: "たなかさんは ちちに にている。", en: "Tanaka resembles his father.", exercises: [dictionary-form], mode: build }
      - { kind: sentence, ja: "ミカと いもうとは そっくりだ。", en: "Mika and her younger sister are exactly alike.", exercises: [na-adj-present], mode: build }
      - { kind: particle-cloze, stem: "にんぎょう", tail: " かお。", answer: "のような", options: ["のような", "のように", "なような"], en: "A doll-like face.", explanation: "のような modifies the NOUN that follows it (かお) — のように would instead describe a VERB or adjective's manner, and なような isn't a real connector shape at all." }
      - { kind: listening-comp, audio: "かがみのような うみ。", answer: "A mirror-like sea.", distractors: ["A stormy, rough sea.", "No sea at all.", "A frozen sea."], q: "What does this mean?" }
      - { kind: listening-comp, audio: "たなかさんは ちちに にている。", answer: "Tanaka resembles his father.", distractors: ["Tanaka doesn't resemble his father at all.", "Tanaka is his own father.", "Tanaka has never met his father."], q: "What does this mean?" }
      - { kind: listening-comp, audio: "こどもは ちちに よく にる。", answer: "Children often resemble their father.", distractors: ["Children never resemble their father.", "Children are their father's exact copy.", "Children have never met their father."], q: "What does this mean?" }
      - { kind: kanji, kana: にる, kanji: 似る, distractors: ["にぎる", "にがい", "にんぎょう"], exercises: [you-na-simile] }
      - kind: sim
        scene: { emoji: "🪞", title: "A doll that looks just like her", setting: "Ken and Mika notice a doll in a shop window that looks exactly like Mika's little sister." }
        turns:
          - npc: { speaker: "Ken", ja: "みて！この にんぎょう、いもうとさんに そっくりだね。", en: "Look! This doll looks just like your little sister." }
            goal: "Agree, and say it resembles her a lot."
            reply: { mode: build, tiles: ["ほんとだ", "たいへん", "にている", "かがみみたい", "にんぎょうだ"], answer: "ほんとだ。たいへん にている。" }
            replyGloss: "True. It resembles her a lot."
            explanation: "にる is the plain verb 'to resemble' — たいへん にている intensifies it with a word you already know, no new grammar needed."
          - npc: { speaker: "Ken", ja: "かおが にんぎょうのようだよ。", en: "Her face is doll-like." }
            goal: "Say her eyes are cat-like too."
            reply: { mode: build, tiles: ["めも", "ねこのような", "めだ", "いぬのような", "かおだ"], answer: "めも ねこのような めだ。" }
            replyGloss: "Her eyes, too, are cat-like eyes."
            explanation: "ような modifies the noun め that follows it — 'cat-like eyes,' not a cat itself."
      - { kind: listening-comp, audio: "ミカと いもうとは そっくりだ。", answer: "Mika and her sister are exactly alike.", distractors: ["Mika and her sister look nothing alike.", "Mika has no sister.", "They used to look alike but don't anymore."], q: "What does this mean?" }
      - { kind: challenge, ja: "この にんぎょうは いもうとに そっくりで、かおも ねこのような めを している。", en: "This doll looks just like my sister, and its face has cat-like eyes too.", combines: [you-na-simile, te-iru, wo-object], mode: build }
    reviewPool: [かがみ, にんぎょう, そっくり, にる]

  # ═══════════════════════════════════════════════════════════════════════
  - id: m44-neo-review-2
    role: review
    title: "Review — ようだ, みたい, and のように・のような"
    focus: "Spiral L1-L7: every construction so far, over the sensory and resemblance domains — THIS MODULE ONLY"
    introduces: []
