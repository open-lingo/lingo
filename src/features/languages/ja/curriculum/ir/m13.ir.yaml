module: m13
title: "Wanting: たい + ほしい"
register: plain
priorNeoModules: [m3, m4, m5, m6, m7, m8, m9, m10, m11, m12]

priorGrammarPoints: [wa-topic, ga-existence, no-possession, ni-location, de-action, mo-also, dare, kore-sore-are-dore,
                     nai-form, arimasu, imasu,
                     nai-existence, koko-soko-asoko, spatial-relations,
                     location-qa,
                     masu-present, masu-negative, desu-copula, ka-question,
                     te-form, te-kudasai, numbers-1-10, counter-tsu, ikura-price,
                     numbers-11-99, counter-ji, ni-time, ta-form, desu-past, masu-past,
                     dictionary-form,
                     i-adj-present, na-adj-present, na-adj-negative, na-adj-past]

notes: |
  m13 = spine tile n05. WANTING: たい + ほしい.

  Shape (inv 25): 13 lessons = 9 teaching + 3 review + 1 challenge, reviews
  at the first/middle/last thirds, challenge lesson LAST. NO katakana rows —
  the programme ended at m11 (RUN-PLAN standing decision 2). NO `kind:
  register` beats — that machinery is m10 + m29 only
  (registerScaffoldIsolation).

  THE WHOLE POINT — three facts that are ONE fact:

  1. **たい IS AN い-ADJECTIVE.** Hang it on the ます-stem and the result
     inflects with the table m12 just finished teaching: たべたい /
     たべたくない / たべたかった / たべたくなかった. This module therefore
     buys NO new conjugation machinery — it spends m12's. L2/L3/L4 each
     re-run one of m12's own rule cards (`i-adj-negative`, `i-adj-past`,
     `i-adj-past-negative`) with たい as the base, and the
     `conjugation_transform` ramp drills the cell exactly as it drilled
     たかい→たかくない. Saying "same rule, new base" out loud IS the lesson.
  2. **たい IS FOR THE SPEAKER.** Japanese does not let you assert another
     person's internal state flatly, so every たい production here is
     first-person or a question to the listener. 「トムは いきたい。」 is the
     v-tai card's antiPattern precisely because template pipelines generate
     it (spine n05's binding authoring constraint). 〜たがる is N4 (m36) and
     is NOT previewed, not even in a dialogue.
  3. **が MARKS WHAT YOU WANT.** ほしい (a NOUN's want), すき/きらい
     (な-adjectives) and たい all put が on the thing — one family, taught as
     one family. The を/が wobble under たい (「みずを のみたい」 =
     「みずが のみたい」) gets its own lesson (L5) and rides `alsoAccept` on
     every typed beat where a learner could reasonably produce either
     (max-acceptance, Spencer 2026-07-26).

  TRANSFORM RAMP (inv 37 — this bit m11 and m12, do not rediscover it): the
  ramp is PINNED ahead of the interleaved middle and conjugation_transform
  is NOT intro-capable, so EVERY form the ramp can emit also appears in the
  introducing rule card's `examples:`. The compiler takes the first three
  ramp-eligible atoms of a lesson's `introduces` in `newAtoms` order, so each
  ramp lesson lists its three drilled forms FIRST and every other derived
  form in that lesson has `verbClass` deliberately OMITTED so it can never be
  picked up. The POSITIVE たい cells (たべたい …) also carry no verbClass —
  they are the ramp's BASES, not its material, and giving them one would make
  the L2 ramp try to conjugate たべる as an い-adjective.

  NO ATOM IS REGISTERED IN courseAtoms FOR THE たい CELLS. Every one of them
  is already a REAL surface via the conjugation lexicon: `ChainForm` has
  `tai` / `tai-neg` / `tai-past` / `tai-neg-past` columns for every
  VERB_ENTRIES verb, so `getRealFormLexicon()` already tokenizes たべたくなかった
  and registering the inflections would regress flashcard import +
  annotateJapaneseText exactly the way m11's polite-past forms would have.
  This is also why the たい set is restricted to verbs that are IN
  VERB_ENTRIES — たべる/のむ/いく/みる/かう/あそぶ/する. きく, いう, おもう and
  やる are taught vocabulary but have no conjugation-table entry, so ききたい
  would be an untracked word to the provenance guard. They appear here in
  dictionary form only (きくのが すき).

  WHY THE RULE-CARD WORDS ARE `imageable: false`: a rule card is PINNED at
  step 1, so any word in its `examples:` is pre-satisfied and its picture
  debut stops being its first appearance (inv 30/44 — m12 documented this).
  ほしい, すき and きらい ARE the rule cards, so they cannot also debut on a
  word_image_mcq; they are flagged `imageable: false` and introduced by the
  card. The module still ships image debuts, from its OWN registry
  allocation: ふく (L6), なつやすみ (L7), きっさてん (L9) — none of which
  appears in any rule card.

  DEVIATIONS, documented per RUN-PLAN "decide and document":
  - **にいく is NOT here.** spinePlan n05 lists "にいく purpose-of-motion
    (stem + にいく)"; the coverage ledger assigns `ni-iku` to m19 (s15,
    motion particles). The SPINE wins over the ledger as a rule — but this
    one is blocked by tooling, not by curriculum, and for the identical
    mechanical reason m12 deferred なる: the bare ます-stem (たべ, のみ) is a
    surface NO lexicon in this repo knows. It is absent from
    `getRealFormLexicon()` (which stores whole ChainForm outputs, never
    stems) and from courseAtoms, so 「たべに いく」 either trips the
    compiler's unbuildable gate or forces stems into the atom registry — the
    exact regression m11 documented for ました. Flagged, not forced;
    `ni-iku` stays on m19's row, which already owns e-direction/made-ni and
    is where a stem lexicon can land whole. THIS IS A REAL SPINE DEVIATION,
    reported as such.
  - **ほしくない / ほしかった are NOT taught.** ほしい is not in ADJ_ENTRIES,
    so unlike たい its inflections are invisible to the real-form lexicon and
    would have to be hand-registered as atoms. The negative wish is carried
    by 〜たくない (fully lexicon-backed) and by すきじゃない; ほしい ships
    affirmative + question only. Same class of decision as m12's なる: the
    pedagogy is deferrable, the lexicon change is not this module's job.
  - **`i-adj-negative` / `i-adj-past` / `i-adj-past-negative` get a SECOND
    rule card here.** They are m12's ledger points and stay m12's; m13
    re-teaches them applied to たい because "no new machinery" is the whole
    argument, and inv 42 forbids inventing an id like `tai-negative`. The
    ledger is untouched.
  - **`wo-object` gets a second card too** (L5), because the を/が
    alternation under たい is a genuinely new wrinkle on the object marker
    and inv 42 leaves no other honest id for it.
  - **`し` (4) and `しち` (7) were marked `blocked` in courseAtoms.** Both
    are tagged `fromModule: m13` by the OLD course, but the neo course
    teaches よん and なな (m9) and never these readings. `し` is one kana, so
    `requireImageFirst`'s substring scan matched it inside したい / わたし /
    おいしい and demanded a picture debut for a word this module does not
    teach. `blocked` is exactly the "no image MCQ" flag and changes nothing
    else.

  BUILD PROMPTS ARE PLAIN ("Build: I want to eat sushi"), not
  "Say to a friend: …". A tile build cannot express the wrong register — the
  tiles decide it — so inv 8's cue would be noise, and it would leak into the
  compiler's sentence-comprehension filler as option text. The cue IS carried
  on every `mode: translate` beat, where the learner types and ます is a live
  wrong answer.

  CONNECTIVES (inv 13): から/ので/けど and て-linking land at m14/m16, so
  complexity is bought by STACKING what the module owns — possessive +
  prenominal adjective + な-adjective + location/instrument particle + the
  たい cell (きょうは ミカの ゆうめいな みせで おいしい すしが たべたい).
  Nothing here uses この/その/あの (m17), そう, or でも.

grammarPoints:
  - id: v-tai
    rule: "Take the ます-stem — what is left when you drop ます — and hang たい on it: たべます → たべたい. It says I WANT TO do this. たい speaks for the SPEAKER: いきたい is about me, and いきたい？ asks you. You never state it flat about somebody else. The thing you want can keep を or switch to が — すしを たべたい and すしが たべたい are both correct, and が puts the thing itself in the spotlight."
    examples:
      - { ja: "トムと にほんに いきたい。", en: "I want to go to Japan with Tom." }
      - { ja: "きょうは おいしい すしが たべたい。", en: "I want to eat good sushi today." }
      - { ja: "わたしは あさ みずが のみたい。", en: "I want to drink water in the morning." }
      - { ja: "ミカの あたらしい しゃしんが みたい。", en: "I want to see Mika's new photo." }
      - { ja: "あたらしい かさが かいたい。", en: "I want to buy a new umbrella." }
      - { ja: "きょうは ともだちと あそびたい。", en: "I want to hang out with a friend today." }
      - { ja: "きょうは なにが したい？", en: "What do you want to do today?" }
    antiPattern: { ja: "トムは にほんに いきたい。", why: "たい states YOUR OWN wish — Japanese will not let you assert someone else's from the outside. Ask them (いきたい？) or say it about yourself." }
    # The card that MAKES たい needs the drill as much as the three cells that
    # bend it (Spencer 2026-07-28, same gap as m7's ます). Drills たべたい /
    # のみたい / みたい — the first three in-scope entries, all stated above
    # (inv 37). No `irregular` arm: したい carries no `derivedFrom` on purpose
    # (see the atom note below), so it cannot be ramp material — and the
    # irregular STEM it would test, し-, is already drilled by m7's ます ramp.
    conjugation: { form: tai, classes: [ru, u] }
  - id: i-adj-negative
    rule: "たい ends in い, and it IS an い-adjective — so its negative is one you already own from m12. Drop the final い, add くない: たべたい → たべたくない. Nothing about the verb changes; たい does all the work, and there is still no だ anywhere. たべない says you will not eat; たべたくない says you do not WANT to."
    examples:
      - { ja: "きょうは ごはんが たべたくない。", en: "I don't want to eat today." }
      - { ja: "あさは ちゃが のみたくない。", en: "I don't want to drink tea in the morning." }
      - { ja: "きょうは みせに いきたくない。", en: "I don't want to go to the shop today." }
      - { ja: "ふるい しゃしんは みたくない。", en: "I don't want to look at old photos." }
      - { ja: "たかい かばんは かいたくない。", en: "I don't want to buy an expensive bag." }
    antiPattern: { ja: "きょうは ごはんが たべたいくない。", why: "drop the final い before くない — たべたい becomes たべたくない, never たべたいくない" }
    # Ramp scope (inv 37): the three forms the transform can emit —
    # たべたくない, のみたくない, いきたくない — are all example lines above,
    # and so are the two that carry no verbClass.
    conjugation: { form: negative, classes: [i-adj] }
  - id: i-adj-past
    rule: "The past works the same way, because it is the same い-adjective: drop い, add かった. たべたい → たべたかった, I wanted to eat. It reports a wish you HAD, so it pairs naturally with きのう. Nouns take だった and verbs take た; たい makes its own past and borrows nothing."
    examples:
      - { ja: "きのうは おいしい すしが たべたかった。", en: "I wanted to eat good sushi yesterday." }
      - { ja: "きのうは ちゃが のみたかった。", en: "I wanted to drink tea yesterday." }
      - { ja: "きのう ともだちと うみに いきたかった。", en: "I wanted to go to the sea with a friend yesterday." }
      - { ja: "あたらしい ぼうしが かいたかった。", en: "I wanted to buy a new hat." }
      - { ja: "きのうは かいものが したかった。", en: "I wanted to go shopping yesterday." }
    antiPattern: { ja: "きのうは おいしい すしが たべたいだった。", why: "だった is the NOUN past — たい makes its own past: たべたかった" }
    conjugation: { form: past, classes: [i-adj] }
  - id: i-adj-past-negative
    rule: "The last cell stacks two endings you already own: くない for not, かった for was. Drop い, add くなかった — たべたい → たべたくなかった. That closes the table: たべたい・たべたくない・たべたかった・たべたくなかった. Four cells, all adjective, not one だ among them."
    examples:
      - { ja: "きのうは ごはんが たべたくなかった。", en: "I didn't want to eat yesterday." }
      - { ja: "きのうは みせに いきたくなかった。", en: "I didn't want to go to the shop yesterday." }
      - { ja: "たかい かばんは かいたくなかった。", en: "I didn't want to buy an expensive bag." }
      - { ja: "きのうの あさは ちゃが のみたくなかった。", en: "I didn't want to drink tea yesterday morning." }
    antiPattern: { ja: "きのうは ごはんが たべたくないでした。", why: "です never carries the past for an adjective — たい itself becomes たべたくなかった" }
    conjugation: { form: past-negative, classes: [i-adj] }
  - id: wo-object
    rule: "A verb's object normally takes を, and it still can: すしを たべたい is correct. But たい is an ADJECTIVE, and what an adjective is about gets marked が — so すしが たべたい is equally correct, and it pushes the thing itself into the spotlight. Take either one. What you cannot do is drop the marker or reach for に."
    examples:
      - { ja: "きょうは おいしい すしを たべたい。", en: "I want to eat good sushi today." }
      - { ja: "きょうは おいしい すしが たべたい。", en: "I want to eat good sushi today — the sushi in the spotlight." }
      - { ja: "あたらしい じてんしゃを かいたい。", en: "I want to buy a new bicycle." }
      - { ja: "あたらしい じてんしゃが かいたい。", en: "I want to buy a new bicycle — the bicycle in the spotlight." }
      - { ja: "ミカの あたらしい しゃしんを みたい。", en: "I want to see Mika's new photo." }
    antiPattern: { ja: "きょうは おいしい すしに たべたい。", why: "に marks a destination, not the thing you want — たい takes を or が" }
  - id: ga-hoshii
    rule: "ほしい is not a verb. It is an い-adjective that hangs off a NOUN, and the thing you want is marked が: みずが ほしい. Hold that split — たい attaches to a VERB (みずが のみたい), ほしい attaches to a THING (みずが ほしい). Like たい it speaks for you, so なにが ほしい？ asks the listener and there is no flat third-person version."
    examples:
      - { ja: "わたしは あたらしい めがねが ほしい。", en: "I want new glasses." }
      - { ja: "あたらしい じてんしゃが ほしい。", en: "I want a new bicycle." }
      - { ja: "ミカの ふるい じしょが ほしい。", en: "I want Mika's old dictionary." }
      - { ja: "みずが ほしい。", en: "I want water." }
      - { ja: "みずが のみたい。", en: "I want to drink water." }
      - { ja: "なにが ほしい？", en: "What do you want?" }
    antiPattern: { ja: "わたしは あたらしい めがねを ほしい。", why: "ほしい marks what you want with が, never を — を belongs to verbs" }
  - id: suki-kirai-no
    rule: "すき and きらい are な-adjectives, not verbs. ねこが すきだ is literally cats are likeable — to me, which is exactly why the thing you like takes が, the same が as ほしい. In front of a noun they take な (すきな いろ) and they negate like any な-adjective (すきじゃない). One difference from たい: these you MAY say about other people — ミカは うたが すきだ is fine."
    examples:
      - { ja: "わたしは ちいさい ねこが すきだ。", en: "I like small cats." }
      - { ja: "ミカは あたらしい うたが すきだ。", en: "Mika likes new songs." }
      - { ja: "わたしは きゅうりが きらいだ。", en: "I don't like cucumber." }
      - { ja: "わたしの すきな いろは あかい。", en: "The colour I like is red." }
      - { ja: "とりにくは すきじゃない。", en: "I don't like chicken." }
    antiPattern: { ja: "わたしは ちいさい ねこを すきだ。", why: "すき is an adjective, not a verb — what you like is marked が" }
  - id: no-ga-suki
    rule: "To like an ACTION you first have to make it a thing. Put の straight after the plain verb and たべる becomes たべるの, the eating of it. Then it takes が like anything else you like: たべるのが すきだ. The verb stays in plain form — の does the nominalising — and きらい works identically."
    examples:
      - { ja: "わたしは ごはんを たべるのが すきだ。", en: "I like eating." }
      - { ja: "ミカは うたを うたうのが すきだ。", en: "Mika likes singing." }
      - { ja: "ともだちと あそぶのが すきだ。", en: "I like hanging out with friends." }
      - { ja: "ふるい しゃしんを みるのが すきだ。", en: "I like looking at old photos." }
      - { ja: "わたしは みせに いくのが きらいだ。", en: "I don't like going to the shop." }
    antiPattern: { ja: "わたしは ごはんを たべるが すきだ。", why: "a verb cannot be marked が on its own — の turns it into a thing first: たべるのが" }

newAtoms:
  # ══ L1 — the POSITIVE たい cell. `derivedFrom` points at the VERB (for the
  #    gloss-consistency check) and `verbClass` is deliberately ABSENT: these
  #    are the ramp's BASES, and a verbClass here would make L2's ramp try to
  #    conjugate たべる as an い-adjective.
  - { kana: たべたい, romaji: tabetai, gloss: "want to eat", imageable: false, kind: tai-form, derivedFrom: たべる, verbClass: ru }
  - { kana: のみたい, romaji: nomitai, gloss: "want to drink", imageable: false, kind: tai-form, derivedFrom: のむ, verbClass: u }
  # いきたい and したい carry NO `derivedFrom`. The gloss-consistency
  # diagnostic only compares content words of 3+ characters, and the whole
  # English content of いく ("to go") and する ("to do") is two-letter — so
  # the pair is unverifiable by machine, not wrong. Recording a base it
  # cannot check would just produce a permanent false finding. Base verbs:
  # いく and する respectively.
  - { kana: いきたい, romaji: ikitai, gloss: "want to go", imageable: false, kind: tai-form }
  - { kana: みたい, romaji: mitai, gloss: "want to watch", imageable: false, kind: tai-form, derivedFrom: みる, verbClass: ru }
  - { kana: かいたい, romaji: kaitai, gloss: "want to buy", imageable: false, kind: tai-form, derivedFrom: かう, verbClass: u }
  - { kana: したい, romaji: shitai, gloss: "want to do", imageable: false, kind: tai-form }
  - { kana: あそびたい, romaji: asobitai, gloss: "want to play", imageable: false, kind: tai-form, derivedFrom: あそぶ, verbClass: u }
  # ══ L2 — たくない. Order matters: the ramp takes the FIRST THREE in-scope
  #    entries, so the three drilled are the three the i-adj-negative card
  #    spells out. The rest carry no verbClass at all.
  - { kana: たべたくない, romaji: tabetakunai, gloss: "don't want to eat", imageable: false, kind: tai-form, derivedFrom: たべたい, verbClass: i-adj }
  - { kana: のみたくない, romaji: nomitakunai, gloss: "don't want to drink", imageable: false, kind: tai-form, derivedFrom: のみたい, verbClass: i-adj }
  - { kana: いきたくない, romaji: ikitakunai, gloss: "don't want to go", imageable: false, kind: tai-form, derivedFrom: いきたい, verbClass: i-adj }
  - { kana: みたくない, romaji: mitakunai, gloss: "don't want to watch", imageable: false, kind: tai-form, derivedFrom: みたい }
  - { kana: かいたくない, romaji: kaitakunai, gloss: "don't want to buy", imageable: false, kind: tai-form, derivedFrom: かいたい }
  # ══ L3 — たかった. The ramp trio is たべ/のみ/かい, NOT いき: "wanted to go"
  #    and "want to go" share no 3+-character content word, so the
  #    gloss-consistency diagnostic cannot verify いきたかった against its
  #    base. Same limitation as above, resolved by choosing a drilled verb
  #    whose English survives the filter (buy) rather than by bending a
  #    learner-facing gloss around a lint.
  - { kana: たべたかった, romaji: tabetakatta, gloss: "wanted to eat", imageable: false, kind: tai-form, derivedFrom: たべたい, verbClass: i-adj }
  - { kana: のみたかった, romaji: nomitakatta, gloss: "wanted to drink", imageable: false, kind: tai-form, derivedFrom: のみたい, verbClass: i-adj }
  - { kana: かいたかった, romaji: kaitakatta, gloss: "wanted to buy", imageable: false, kind: tai-form, derivedFrom: かいたい, verbClass: i-adj }
  - { kana: いきたかった, romaji: ikitakatta, gloss: "wanted to go", imageable: false, kind: tai-form }
  - { kana: したかった, romaji: shitakatta, gloss: "wanted to do", imageable: false, kind: tai-form }
  # ══ L4 — たくなかった
  - { kana: たべたくなかった, romaji: tabetakunakatta, gloss: "didn't want to eat", imageable: false, kind: tai-form, derivedFrom: たべたい, verbClass: i-adj }
  - { kana: いきたくなかった, romaji: ikitakunakatta, gloss: "didn't want to go", imageable: false, kind: tai-form, derivedFrom: いきたい, verbClass: i-adj }
  - { kana: かいたくなかった, romaji: kaitakunakatta, gloss: "didn't want to buy", imageable: false, kind: tai-form, derivedFrom: かいたい, verbClass: i-adj }
  - { kana: のみたくなかった, romaji: nomitakunakatta, gloss: "didn't want to drink", imageable: false, kind: tai-form, derivedFrom: のみたい }
  # ══ L6 — ほしい. imageable:false because the ga-hoshii card IS its
  #    introduction and a pinned rule card would steal a picture debut.
  - { kana: ほしい, romaji: hoshii, gloss: "want (a thing)", shortGloss: "want (thing)", imageable: false, kind: vocab }
  # ══ L7 — すき / きらい. Same reason as ほしい.
  - { kana: すき, romaji: suki, gloss: "likeable, like", shortGloss: "like", imageable: false, kind: vocab }
  - { kana: きらい, romaji: kirai, gloss: "disliked, dislike", shortGloss: "dislike", imageable: false, kind: vocab }
  # ══ The module's PICTURE debuts — its own registry allocation, and
  #    deliberately absent from every rule card so the MCQ stays first.
  # だいがく carries fromModule m19 in courseAtoms, but those tags are stale by
  # construction (see authoring-context.mjs) and m13 uses it as its running
  # destination example. Declaring it here gives it a real teach-first debut
  # instead of arriving as a word the learner is assumed to know.
  - { kana: だいがく, romaji: daigaku, gloss: "university", imageable: true, kind: vocab }
  - { kana: ふく, romaji: fuku, gloss: "clothes", imageable: true, kind: vocab }
  - { kana: なつやすみ, romaji: natsuyasumi, gloss: "summer holiday", shortGloss: "summer break", imageable: true, kind: vocab }
  - { kana: きっさてん, romaji: kissaten, gloss: "coffee shop", imageable: true, kind: vocab }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m13-neo-1
    role: teaching
    title: "たべたい — what I want to do"
    focus: "ます-stem + たい says what the SPEAKER wants; を or が both mark the thing"
    introduces: [たべたい, のみたい, いきたい, みたい, かいたい, したい, あそびたい]
    beats:
