  - id: m41-neo-6
    role: teaching
    title: "「ならんでいる」 「ならべてある」— the tenth pair"
    focus: "Deepen the nine known jidoushi/tadoushi pairs and add a tenth: ならぶ／ならべる, then run each face through てある"
    # じゃあ (discourse "well then…") debuts here via `listening-comp`, not
    # its later dialogue use — `courseAtoms.ts`'s pre-existing `ja--jaa` row
