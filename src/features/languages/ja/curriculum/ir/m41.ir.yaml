    beats:
      - { kind: rule, grammarPointId: transitivity-family-noticing }
      - { kind: sentence, ja: "ほんが たなに ならんでいる。", en: "The books are lined up on the shelf.", exercises: [transitivity-family-noticing], mode: build }
