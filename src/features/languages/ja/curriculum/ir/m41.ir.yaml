    # dead-attribution class as this module's own haru-stick/paatii fixes)
    # so it had in fact never been live-taught; re-stamped in courseAtoms.ts
    # to point here. Its kana field was also simplified from the broken
    # "じゃ / じゃあ" (a literal slash-and-space string that can never match
