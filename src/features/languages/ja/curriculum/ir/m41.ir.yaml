      - { kind: sentence, ja: "まどが しまっている。", en: "The window is closed.", exercises: [te-iru-resultative], mode: listening }
      - { kind: particle-cloze, stem: "ほんが たなに ", tail: "。", answer: "ならんでいる", options: ["ならんでいる", "ならべてある", "ならべている"], en: "The books are lined up on the shelf.", explanation: "ならぶ is the intransitive half — the books lining up on their own, an ongoing state described with ならんでいる. ならべてある would need someone's deliberate arranging in the picture, and ならべている is 'in the middle of arranging them' — an active, ongoing action." }
      - { kind: listening-comp, audio: "ほんが たなに ならべてある。", answer: "The books have been arranged on the shelf.", distractors: ["The books are lined up by themselves, nobody arranged them.", "I am arranging the books right now.", "The books fell off the shelf."], q: "What does this mean?" }
