notes: |
  m41 · n4-12 — TRANSITIVITY II: 〜てある + the pair families
  (docs/spine-n4.md §n4-12, docs/ja-m41-brief-2026-09-10.md). Ships 12
  lessons (inv 25: 8 teaching + 3 review + 1 challenge, challenge last).
  spiralWith: n4-04 (m33's jidoushi/tadoushi pairs) — this module is a
  deepening pass, not a fresh topic.

  WHAT IS TAUGHT:
  1. **Core construction (L2, id te-aru):** a TRANSITIVE verb's て-form +
     ある = a state somebody left on purpose. The object drops を and takes
     が: まどを あける (action) → まどが あけてある (state, left that way on
     purpose). Anchor minimal pair uses ZERO new vocabulary — まど/あける/
     あく have been known since m14/m33 — so the grammar stands on its own.
  2. **てある vs 自動詞+ている vs 他動詞+ている (L3, id
     te-aru-vs-te-iru):** three readings of the same event. まどが あいている
     (state, no agent implied, m33) / ミカが まどを あけている (ongoing
     action, agent doing it right now) / まどが あけてある (state, agent
     implied, deliberate). A single non-graded rule-card aside references
     m40's あけられる (passive) as a FOURTH, unrelated shape — never drilled,
     confirmed live via `node scripts/authoring-context.mjs m41` before
     writing it (passive-form/passive-rareru are real priorGrammarPoints).
  3. **てある vs ておく (L5, id te-oku-vs-te-aru):** both ride the same
     て-form slot (m30's helper-verb schema, "front-loaded" precisely so
     this module could teach ONE thing instead of re-deriving て+verb).
     ておく keeps AGENT framing (を stays: まどを あけておく, I'll leave it
     open); てある reframes the same fact as a property of the room (が:
     まどが あけてある). No tense distinction, purely a whose-action-is-on-
     stage distinction.
  4. **Family-noticing (L6, id transitivity-family-noticing):** m33 shipped
     NINE pairs, not six — あく/あける, しまる/しめる, はいる/いれる,
     とまる/とめる, きまる/きめる, きえる/けす, はじまる/はじめる, でる/だす,
     おちる/おとす (verified by reading m33.ir.yaml's grammarPoints in full,
     not trusting the spine's own summary). This module adds a TENTH:
     ならぶ (intransitive, "to be in a row") / ならべる (transitive, "to
     line up"), both repointed from stale courseAtoms "future" stubs
     (fromModule → "m41"). てある gives every pair member a third face:
     ほんが たなに ならんでいる (in a row, no agent) vs ほんが たなに
     ならべてある (arranged, on purpose) — the same あいている/あけてある
     relationship, one pair over.

  REJECTED: つく／つける AS A NEW PAIR (brief's carried-forward flag b,
  resolved here with certainty, not merely investigated). courseAtoms
  already reserves the kana つく for `tsuku` (着く, "to arrive", m23, LIVE,
  unblocked) and つける for `tsukeru` (付ける, "to turn on", stub,
  fromModule "future"). `atomIndex()` (moduleCompiler.ts) builds ONE merged
  entry PER KANA STRING across the whole course — first-wins over
  `JA_COURSE_ATOMS_BY_KANA`'s own last-wins Map construction — so a second
  courseAtoms row sharing kana つく (for 点く, "to turn on, of itself")
  would not create a second, disambiguable entry: appended later in
  courseAtoms.ts it would WIN the last-wins Map and silently overwrite
  `tsuku`'s (着く, arrive) gloss/emoji app-wide, corrupting an already-live,
  actively-taught m23 atom — the exact class of bug the file's own はな
  (花/鼻) comment describes as recently fixed. Unlike the exercised()
  tokenizer's existing さん/し/でも/なんで position-based guards (which
  disambiguate GRADING CREDIT after both senses already coexist in the
  atom map), this collision happens one layer earlier, at map construction,
  where no position/context exists to consult — there are two dictionary-
  form intransitive verbs in identical syntactic slots (NOUNが つく), with
  no structural tell between them. Independent confirmation: m24's own
  authors hit this exact kana collision three months earlier while
  drafting potential-form atoms and explicitly rejected it (courseAtoms.ts
  ~line 1414, "つく → つける is 付ける 'to turn on' (row exists)"). Given
  no positional fix is possible and the module's own vocab budget already
  reaches ten pairs without it, the brief's own lowest-priority-protected
  optional item is cut outright rather than shipped unsafely — coverage
  not volume.

  ALSO RESOLVED (brief §2's own instruction, now stale): the brief asks to
  hand-register ある's inflected forms (あった, etc.) as m41 newAtoms. They
  are unnecessary — あった was already registered by m38
  (ir/m38.ir.yaml, `kind: verb-form, derivedFrom: ある`) and has been live,
  known vocabulary via `priorVocab` since m38 landed. ある's present form
  has been known since m6. No ある-form registration happens in this
  module. Negation of ある (ない/ありません) is deliberately out of scope —
  neither the brief's done-criteria nor N4 scope requires it, and m30's
  own ておく module made the identical register-caution call for
  てはいけない-style negation of its own helper.

  HOMOGRAPH: はる. Three senses share the kana. `haru` (春, "spring", m25,
  blocked) is unrelated and untouched. `haru-stick` (貼る, "to stick") had
  `introducedByLessonId: "ja-m14-6-2"` — checked against `isDeadAttribution`
  (`lessonAtomIndex.ts`): ja-m14-6-2 exists ONLY in
  `curriculum/_archive/m14.ts`, not in the live `mockLessons.ts` registry,
  so `getContent("ja-m14-6-2")` returns falsy — a DEAD attribution, exactly
  m38's なくす/ぜんぶ precedent. Re-stamped `fromModule: "future" → "m41"`,
  `introducedByLessonId` repointed to this module's own first live debut
  lesson, id kept as `haru-stick` (never a third `haru*` id).

  ならぶ／ならべる repointed the same way as たのむ／よぶ in m40: both were
  genuine unallocated `fromModule: "future"` stubs (courseAtoms.ts ids
  `narabu`/`naraberu`), never taught by any live lesson — flipped to
  `fromModule: "m41"` here.

  VOCAB BUDGET: brief's ceiling was 32 (a ceiling, not a quota — same
  doctrine as m39's 34→11 and m40's 36→12). This module ships 5 brand-new
  atoms (かべ, たな, ポスター, メモ, かざる) + 3 repointed stubs
  (はる-stick, ならぶ, ならべる) = 8 atom-registry actions, all household/
  tidying register. はいち, せいとん and したく (the brief's own explicit
  first three cuts, in the brief's own stated cut-priority order) are cut
  entirely — near-synonyms of already-covered ground (かたづける/junbi/
  yotei are all carrier-only per the brief's own §1 correction) that would
  have added volume without adding a new grammatical idea.

  All new/reactivated atoms ship `blocked: true` (no image-MCQ debut,
  matching m40's own all-blocked pattern for this tier) — sidesteps any
  emoji-vendoring risk entirely; `requireImageFirst`'s check only ever
  applies to `!blocked && emoji` atoms, so this costs nothing.

grammarPoints:
  - id: te-aru
    rule: "A third helper rides the exact same て-form slot ておく (m30) and ている (m14) already use, and its meaning fuses both. てある needs a TRANSITIVE verb — one that already takes を — and when ある lands behind its て-form, two things happen together: the object drops を and takes が instead, and the sentence stops being about an action and becomes about a STATE somebody left behind on purpose. まどを あける (I open the window, an action, を) becomes まどが あけてある (the window has been left open, a state, が) — nobody is opening anything right now; somebody opened it earlier, and it is still that way because they meant it to be. Compare this to 自動詞+ている (module 33): まどが あいている also describes an open window, but says nothing about why — maybe it blew open, maybe nobody noticed. てある always implies a hand behind it, even when that hand is never named."
    examples:
      - { ja: "まどが あけてある。", en: "The window has been left open (on purpose)." }
      - { ja: "ポスターが かべに はってある。", en: "A poster has been stuck on the wall." }
      - { ja: "ほんが たなに ならべてある。", en: "The books have been arranged on the shelf." }
      - { ja: "へやが かざってある。", en: "The room has been decorated." }
    antiPattern: { ja: "まどを あけてある。", why: "てある promotes the object to が the moment the verb turns into a resultant state — を would still mark it as an action's direct object, which is exactly what てある is not: まどが あけてある。" }
  - id: te-aru-vs-te-iru
    rule: "Three shapes, one verb pair, three different pictures. 自動詞+ている (module 33) is a state with no agent named — まどが あいている, the window is open, full stop, nobody said by whom. 他動詞+ている is the SAME transitive verb doing its normal job, an action actually happening right now — ミカが まどを あけている, Mika is in the middle of opening the window; を never left. 他動詞+てある takes that same transitive verb and turns it into a state too, but a state with an agent implied — まどが あけてある, the window has been left open, and someone meant it that way. Read the particle and the verb together: が+自動詞+ている is a fact about the world; を+他動詞+ている is somebody working right now; が+他動詞+てある is somebody's earlier choice, still in effect. (A fourth shape exists too — あけられる, module 40's passive — but it answers a different question, who something happened TO, not what state a thing is in; this module never drills it.)"
    examples:
      - { ja: "まどが あいている。", en: "The window is open." }
      - { ja: "ミカが まどを あけている。", en: "Mika is opening the window." }
      - { ja: "まどが あけてある。", en: "The window has been left open (on purpose)." }
      - { ja: "ドアが しまっている。", en: "The door is closed." }
      - { ja: "ドアが しめてある。", en: "The door has been closed (on purpose)." }
    antiPattern: { ja: "まどを あいている。", why: "あいている is the intransitive half — the window doing the opening by itself — so it takes が, never を; を belongs only to the transitive pair member, あける: まどが あいている。" }
  - id: te-oku-vs-te-aru
    rule: "Two helpers, same て-form slot, and they can describe almost the same room two different ways. ておく (module 30) keeps the sentence about the AGENT: まどを あけておく, I'll leave the window open — を stays, because it's still framed as something you did or are choosing not to undo. てある drops the agent and reframes the same fact as a property of the ROOM: まどが あけてある, the window is (in the state of having been) left open — が, because now the window is being described, not your choice. Say the plan to someone BEFORE it happens and ておく is what you reach for; say the same fact to someone walking in and noticing the room and てある is what they'd say. Nothing about tense forces the choice — it's about whose action is on stage."
    examples:
      - { ja: "まどを あけておく。", en: "I'll leave the window open (in preparation)." }
      - { ja: "まどが あけてある。", en: "The window has been left open." }
      - { ja: "へやを かざっておく。", en: "I'll decorate the room in advance." }
      - { ja: "へやが かざってある。", en: "The room has been decorated." }
    antiPattern: { ja: "まどが あけておく。", why: "ておく keeps its agent framing, so its object stays を — が belongs to てある, the state-of-the-room version of the same sentence: まどを あけておく。" }
  - id: transitivity-family-noticing
    rule: "Nine pairs met since module 33, and now a tenth. ならぶ is the intransitive half — things standing in a row on their own: ほんが たなに ならんでいる, the books are lined up (on the shelf). ならべる is what somebody DOES: ほんを たなに ならべる, I line the books up. Exactly the pattern あく/あける, しまる/しめる, はいる/いれる, とまる/とめる, きまる/きめる, きえる/けす, はじまる/はじめる, でる/だす and おちる/おとす already taught: が-verb for the thing happening on its own, を-verb for somebody making it happen. What's new this module is a THIRD member many of these pairs can take — the て-form of the transitive half plus ある: ほんが たなに ならべてある isn't just books in a row, it's books somebody arranged and left that way, the same relationship as まどが あいている vs まどが あけてある, one pair over. The family keeps growing; the read never changes — find the particle, and you already know which side you're looking at."
    examples:
      - { ja: "ほんが たなに ならんでいる。", en: "The books are lined up on the shelf." }
      - { ja: "ほんを たなに ならべる。", en: "I line the books up on the shelf." }
      - { ja: "ほんが たなに ならべてある。", en: "The books have been arranged on the shelf." }
      - { ja: "でんしゃが とまる。", en: "The train stops." }
      - { ja: "くるまを とめる。", en: "I stop the car." }
    antiPattern: { ja: "ほんを たなに ならんでいる。", why: "ならぶ is the intransitive half — books lining up on their own — so it takes が, never を; を belongs to ならべる, the doing half: ほんが たなに ならんでいる。" }

newAtoms:
  # ══ L1 — new lemmas + reactivated stubs, plain-form only, no てある yet.
  - { kana: かべ, romaji: kabe, gloss: "wall", shortGloss: "wall", imageable: false, kind: vocab }
  - { kana: たな, romaji: tana, gloss: "shelf", shortGloss: "shelf", imageable: false, kind: vocab }
  - { kana: ポスター, romaji: posutaa, gloss: "poster", shortGloss: "poster", imageable: false, kind: vocab }
  - { kana: メモ, romaji: memo, gloss: "memo, note", shortGloss: "memo", imageable: false, kind: vocab }
  - { kana: はる, romaji: haru, gloss: "to stick, to paste", shortGloss: "stick", imageable: false, kind: verb, verbClass: u }
  - { kana: かざる, romaji: kazaru, gloss: "to decorate, to display", shortGloss: "decorate", imageable: false, kind: verb, verbClass: u }
  - { kana: ならべる, romaji: naraberu, gloss: "to line up, to arrange", shortGloss: "line up (arrange)", imageable: false, kind: verb, verbClass: ru }
  - { kana: ならぶ, romaji: narabu, gloss: "to line up, to be in a row", shortGloss: "line up (stand)", imageable: false, kind: verb, verbClass: u }
  # ══ L2 — て-forms of this module's own new TRANSITIVE verbs, needed for
  # てある. All hand-authored (no conjugation_transform ride), so plain form
  # (L1) and て-form (L2) landing in different lessons is a pedagogical
  # choice, not an engine requirement.
  - { kana: はって, romaji: hatte, gloss: "stuck, pasted (te-form of はる)", shortGloss: "stuck (stick)", imageable: false, kind: verb-form, derivedFrom: はる, verbClass: u }
  - { kana: かざって, romaji: kazatte, gloss: "decorated (te-form of かざる)", shortGloss: "decorated (decorate)", imageable: false, kind: verb-form, derivedFrom: かざる, verbClass: u }
  - { kana: ならべて, romaji: narabete, gloss: "lined up (te-form of ならべる)", shortGloss: "lined up (arrange)", imageable: false, kind: verb-form, derivedFrom: ならべる, verbClass: ru }
  # ══ L6 — ならぶ's own て-form, needed for the family-noticing contrast
  # (ならんでいる vs ならべてある).
  - { kana: ならんで, romaji: narande, gloss: "lined up, in a row (te-form of ならぶ)", shortGloss: "in a row (stand)", imageable: false, kind: verb-form, derivedFrom: ならぶ, verbClass: u }
  - { kana: ならべた, romaji: narabeta, gloss: "lined up, arranged (past tense of ならべる)", shortGloss: "arrange (past)", imageable: false, kind: verb-form, derivedFrom: ならべる, verbClass: ru }
  # ══ L5 — おく (m30, "to put") gets its own conjugated forms here: only its
  # dictionary form was ever registered, and ておく (do X in advance / leave
  # X in a state) rides おく's OWN past/te-form, not the preceding verb's.
  # Needed for "あけておいた" (L5) and, later, "かざっておいてから" (L9).
  - { kana: おいた, romaji: oita, gloss: "put, left in advance (past tense of おく)", shortGloss: "put (advance, past)", imageable: false, kind: verb-form, derivedFrom: おく, verbClass: u }
  # ══ L9 — おく's て-form (i-onbin く→いて, same shape as おいた's く→いた),
  # needed for the ておいてから ("do X in advance, then...") sequencing beat.
  - { kana: おいて, romaji: oite, gloss: "put, left in advance (te-form of おく)", shortGloss: "put (advance, te-form)", imageable: false, kind: verb-form, derivedFrom: おく, verbClass: u }
  # ══ L9 — とる (撮る, "to take a photo", m30) past tense, needed for the same
  # ておいてから beat's second clause (しゃしんを とった).
  - { kana: とった, romaji: totta, gloss: "took (a photo, past tense of とる)", shortGloss: "took (photo, past)", imageable: false, kind: verb-form, derivedFrom: とる, verbClass: u }
  # ══ L3 — あける (m14, "to open") past tense, needed for the "だれか あけたの？"
  # dialogue question — only the plain/te-form were ever registered.
  - { kana: あけた, romaji: aketa, gloss: "opened (past tense of あける)", shortGloss: "open (past)", imageable: false, kind: verb-form, derivedFrom: あける, verbClass: ru }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m41-neo-1
    role: teaching
    title: "「かべに ポスターが ある」— getting the room's vocabulary"
    focus: "Priming vocabulary for the てある arc — no new grammar yet, all through は/が/を you already own"
    introduces: [かべ, たな, ポスター, メモ, はる, かざる, ならべる, ならぶ, パーティー]
    beats:
      - { kind: sentence, ja: "かべに ポスターが ある。", en: "There is a poster on the wall.", exercises: [ga-existence], mode: build }
      - { kind: sentence, ja: "たなに ほんが ある。", en: "There are books on the shelf.", exercises: [ga-existence], mode: build }
      - { kind: sentence, ja: "つくえに メモが ある。", en: "There's a memo on the desk.", exercises: [ga-existence], mode: build }
      - { kind: sentence, ja: "ポスターを かべに はる。", en: "I stick a poster on the wall.", exercises: [wo-object], mode: build }
      - { kind: sentence, ja: "へやを かざる。", en: "I decorate the room.", exercises: [wo-object], mode: build }
      - { kind: sentence, ja: "ほんを たなに ならべる。", en: "I arrange the books on the shelf.", exercises: [wo-object], mode: build }
      - { kind: sentence, ja: "ほんが たなに ならぶ。", en: "The books line up on the shelf.", exercises: [ga-existence], mode: build }
      - { kind: particle-cloze, stem: "かべに ポスターが ", tail: "。", answer: "ある", options: ["ある", "いる", "ない"], en: "There is a poster on the wall.", explanation: "ポスター is a thing, not a person or animal, so its existence is ある, never いる (reserved for people/animals). ない would say there is no poster at all — the opposite of this sentence." }
      - { kind: listening-comp, audio: "たなに ほんが ある。", answer: "There are books on the shelf.", distractors: ["There is a shelf in the book.", "There is no book on the shelf.", "The shelf has a poster."], q: "What does this mean?" }
      # パーティー's debut: `listening-comp` (kind), NOT `sentence`/mode:build —
      # a `sentence` beat compiles to `build_sentence`, which collides with
      # this lesson's own trailing `challenge` sentence beat (also
      # build_sentence-shaped) in the COMPILED steps array (density
      # auto-expansion shifts raw beat order, so this only showed up by
      # inspecting LessonContent.steps directly) and trips the
      # density/variety no-adjacent-identical-type bar. `sentence`/
      # mode:listening compiles to `listening_build`, which isn't in
      # TEACH_FIRST_INTRO_TYPES (stepTaxonomy.ts) so it can't be a debut
      # step either. `listening-comp` (kind) compiles to
      # `listening_comprehension`, which is both intro-capable and a
      # distinct type from every step around it here.
      - { kind: listening-comp, audio: "あした パーティーが ある。", answer: "There's a party tomorrow.", distractors: ["There was a party yesterday.", "There's no party tomorrow.", "The party is today, not tomorrow."], q: "What does this mean?" }
      - { kind: listening-comp, audio: "ほんを たなに ならべる。", answer: "I arrange the books on the shelf.", distractors: ["The books are already on the shelf.", "I take the books off the shelf.", "I read the books on the shelf."], q: "What does this mean?" }
      # メモ and ならぶ recognition beats (recognitionExposure ratchet): both
      # are `imageable: false` (no image-MCQ debut path exists) and their
      # ONLY other graded touch in this lesson is a `build` sentence — a
      # pure-production exposure. A `listening-comp` credits the word via
      # `answer`, giving each a cheap recognition touch before the learner
      # is ever asked to produce it. Per the ratchet's own fix recipe (reuse
      # an already-authored sentence), these mirror this lesson's own
      # build-mode sentences for メモ (beat 3 above) and ならぶ (beat 7 above).
      - { kind: listening-comp, audio: "つくえに メモが ある。", answer: "There's a memo on the desk.", distractors: ["There's a memo on the wall.", "There's a book on the desk.", "There's no memo anywhere."], q: "What does this mean?" }
      - { kind: listening-comp, audio: "ほんが たなに ならぶ。", answer: "The books line up on the shelf.", distractors: ["I line the books up on the shelf.", "The books are stacked on the desk.", "There are no books on the shelf."], q: "What does this mean?" }
      - { kind: kanji, kana: はる, kanji: 貼る, distractors: ["はれる", "はなす", "はしる"], exercises: [wo-object] }
      - kind: dialogue
        lines:
