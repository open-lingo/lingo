  - { kana: しとく, romaji: "shitoku", gloss: "do it in advance (casual 〜とく)", shortGloss: "do ahead (とく)", imageable: false, kind: vocab }

lessons:
  # ═══════════════════════════════════════════════════════════════════════
  - id: m30-neo-1
    role: teaching
    title: "「たべてみる」 — eat it and see"
    focus: "A て-form can have a verb parked behind it, and that verb is where everything now happens"
    introduces: [とりあえず]
    beats:
      - { kind: rule, grammarPointId: te-miru, variant: schema }
      - { kind: sentence, ja: "この りょうりを たべてみる。", en: "I'll give this dish a try", exercises: [te-miru, wo-object, kono-sono-ano-dono], mode: build }
      - { kind: sentence, ja: "とりあえず コーヒーを のんでみる。", en: "I'll have some coffee for a start and see", exercises: [te-miru, wo-object], mode: build }
      - { kind: sentence, ja: "わからないから せんせいに きいてみる。", en: "I don't understand, so I'll ask the teacher and see", exercises: [te-miru, kara-because, ni-location], mode: build }
      - { kind: sentence, ja: "この カメラを つかってみる。", en: "I'll give this camera a try", exercises: [te-miru, wo-object, kono-sono-ano-dono], mode: build }
      - { kind: sentence, ja: "じかんが あるから としょかんに いってみる。", en: "I've got time, so I'll go to the library and see", exercises: [te-miru, kara-because, ga-existence], mode: build }
      - { kind: sentence, ja: "この おんがくを きいてみる。", en: "I'll give this music a listen", exercises: [te-miru, wo-object], mode: listening }
      - { kind: sentence, ja: "あついから かわで およいでみる。", en: "It's hot, so I'll give the river a swim", exercises: [te-miru, kara-because, de-action], mode: build }
