      - { kind: sentence, ja: "この コーヒーを のんでみる。", en: "I'll give this coffee a try", exercises: [te-miru, wo-object], mode: translate }
      - { kind: particle-cloze, stem: "わからないから せんせいに ", tail: "。", answer: "きいてみる", options: ["きいてみる", "たべてみる", "つかってみる"], en: "I don't understand, so I'll ask the teacher and see", explanation: "not understanding is a reason to ASK, so the て-form belongs to きく. たべてみる would put the teacher on a plate, and つかってみる would use them as a tool." }
      - { kind: listening-comp, audio: "とりあえず この うたを きいてみる。", answer: "I'll give this song a listen for a start", distractors: ["I'll give this song a listen tomorrow", "I'm not going to listen to this song", "I'll give this dish a try for a start"], exercises: [te-miru, wo-object] }
