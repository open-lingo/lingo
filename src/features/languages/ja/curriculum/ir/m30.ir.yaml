  # ═══════════════════════════════════════════════════════════════════════
  - id: m30-neo-2
    role: teaching
    title: "「のんでみた」 — the helper carries the tense"
    focus: "た lands on the helper, and the main verb, once it is て, never moves again"
    introduces: [さいしょ, しらべる, きめる, つづける]
    beats:
      - { kind: rule, grammarPointId: ta-form }
      - { kind: sentence, ja: "さいしょに この コーヒーを のんでみた。", en: "I gave this coffee a try first", exercises: [ta-form, te-miru, ni-time], mode: build }
      - { kind: sentence, ja: "おもしろい りょうりを たべてみた。", en: "I gave an interesting dish a try", exercises: [ta-form, te-miru, wo-object], mode: build }
      - { kind: sentence, ja: "あした えいごの ことばを しらべる。", en: "I'm looking the English words up tomorrow", exercises: [dictionary-form, no-possession, wo-object], mode: build }
