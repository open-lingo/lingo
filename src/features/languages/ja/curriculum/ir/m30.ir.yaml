      - { kind: sentence, ja: "むずかしいけど じゅぎょうを つづける。", en: "It's difficult, but I'll keep the class going", exercises: [dictionary-form, kedo, wo-object], mode: build }
      - { kind: sentence, ja: "かわで およいでみた。", en: "I gave the river a swim", exercises: [ta-form, te-miru, de-action], mode: listening }
