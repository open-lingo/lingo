      - { kind: challenge, ja: "じゅぎょうが むずかしいから さいしょに せんせいに きいてみたけど だめだった。", en: "The class is difficult, so I asked the teacher and saw first, but it was no good", combines: [ta-form, te-miru, kara-because, kedo, ga-existence], mode: build }
