        text: "sept"
        emoji: "7️⃣"
      - kind: silentLetterLit
        id: sl-sept
        writtenForm: "sept"
        graphemes: ["s", "e", "p", "t"]
        silent: [2]
        en: "seven"
        ruleNote: "The p is silent but the t is spoken: set."
      - kind: speakLit
