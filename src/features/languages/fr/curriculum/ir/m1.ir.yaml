module: m1
title: "Sons et salutations — sounds & first words"
eyebrow: "Module 1"
summary: "French ends quietly: silent finals, the social survival kit, and the numbers 0–10."
frame: none

# ─────────────────────────────────────────────────────────────────────────────
# THE MODULE'S CLAIM
#
# The learner arrives knowing zero French. m1 sells one promise: French is
# HEARABLE — words end more quietly than they are spelled (salut = sa-LU,
# deux = duh, trois = trwah), and once you EXPECT endings to fall away,
# spoken French stops being a blur. Everything else is a social survival kit
# (greet, thank, apologize, part, meet) and the numbers 0–10, chosen because
# they exercise the silent-final rule and its exceptions (cinq/six/dix/neuf
# keep a spoken final; sept drops its p but keeps its t; huit hides its h).
#
# This is the FIRST French module ever authored (2026-08-19), compiled by
# the frameless FR pipeline (scripts/compile-ir-fr.mjs). Authored to the ES
# m1 re-author's standard from step one — no debt is ever pinned for fr:
#   • zero full-sentence recognition MCQs of French the learner must produce;
#     situations are drilled by SPEAKING and BUILDING, judgment by one-word
#     English-prompted MCQs (es E1/inv 28);
#   • zero translate steps module-wide — French typing needs the AccentBar
#     layout decision (fr pin §7) and m1's «ou» sits on the ou/où F5 minimal
#     pair; the typing budget goes to speaking instead. First typed steps
#     arrive with the accentPolicy work, not before;
#   • image MCQs at first exposure only; retests via text MCQ / cloze / build;
#   • every atom debuts on an intro step type (phrase card, image MCQ, or as
#     a build target); et/ou are m1's own particles, so particle clozes on
#     them are intro-module clozes (es pin E2 carried).
#
# LADDER ORDER (fr guide §0.1 on ja §4e): m1 teaches the SILENT-FINALS rung
# with silent_letter. Liaison is DEFERRED to m2 — deliberately, not as debt:
# liaison is the re-voicing of a silent final before a vowel, so a learner
# cannot hear «les amis» re-voice an s they never knew was silent. The m1
# mastery test's silent_letter on «huit» (silent h, spoken t) hands m2 its
# opening contrast (mute h vs h aspiré, pin F3). «huit» carries
# consonantOnset: true from birth — le huit, never *l'huit — so the elision
# and liaison machinery is already right about it before m2 exists.
#
# SPEECH targets stay inside liaison-free word groups (fr guide on ja §8):
# every speaking target here either is one word or chains consonant-onset
# words, so the recognizer's written-form return cannot be marked wrong for
# a correct liaison.
# ─────────────────────────────────────────────────────────────────────────────

newAtoms:
  # ── social survival kit ──
  - { surface: "bonjour", meaningEn: "hello / good day", partOfSpeech: "other", kind: "vocab", emoji: "🙋", hint: "bohn-ZHOOR — the on is nasal, the n is not spoken" }
  - { surface: "salut", meaningEn: "hi / bye (casual)", partOfSpeech: "other", kind: "vocab", emoji: "👋", hint: "the final t is silent: sa-LU" }
  - { surface: "ça va", meaningEn: "how's it going? / it's going fine", partOfSpeech: "phrase", kind: "phrase", emoji: "💬", hint: "sa VA — the same two words ask and answer" }
  - { surface: "merci", meaningEn: "thank you", partOfSpeech: "other", kind: "vocab", emoji: "🙏", hint: "mehr-SEE" }
  - { surface: "merci beaucoup", meaningEn: "thank you very much", partOfSpeech: "phrase", kind: "phrase", emoji: "💐", hint: "beaucoup = boh-KOO — eau says oh, ou says oo, the p is silent" }
  - { surface: "s'il vous plaît", meaningEn: "please", partOfSpeech: "phrase", kind: "phrase", emoji: "🤲", hint: "seel voo PLEH — s'il is si + il squeezed into one word" }
  - { surface: "pardon", meaningEn: "excuse me / sorry", partOfSpeech: "other", kind: "vocab", emoji: "🙇", hint: "par-DOHN — nasal ending, the n is not spoken" }
  - { surface: "oui", meaningEn: "yes", partOfSpeech: "other", kind: "vocab", emoji: "✅", hint: "sounds like 'we'" }
  - { surface: "non", meaningEn: "no", partOfSpeech: "other", kind: "vocab", emoji: "❌", hint: "nohn — nasal, the n is not spoken" }
  - { surface: "au revoir", meaningEn: "goodbye", partOfSpeech: "phrase", kind: "phrase", emoji: "🚪", hint: "oh ruh-VWAR" }
  - { surface: "à bientôt", meaningEn: "see you soon", partOfSpeech: "phrase", kind: "phrase", emoji: "🔜", hint: "ah byan-TOH — en is nasal, the final t is silent" }
  - { surface: "bonsoir", meaningEn: "good evening", partOfSpeech: "other", kind: "vocab", emoji: "🌆", hint: "bohn-SWAR — oi says wah" }
  - { surface: "bonne nuit", meaningEn: "good night", partOfSpeech: "phrase", kind: "phrase", emoji: "🌙", hint: "bun NWEE — ui glides like wee, the t is silent" }
  - { surface: "enchanté", meaningEn: "nice to meet you", partOfSpeech: "other", kind: "vocab", emoji: "🤝", hint: "on-shon-TAY — both n's are nasal vowels" }
  # ── numbers 0–10 ──
  - { surface: "zéro", meaningEn: "zero", partOfSpeech: "other", kind: "vocab", emoji: "0️⃣", hint: "zay-RO" }
  - { surface: "un", meaningEn: "one", partOfSpeech: "other", kind: "vocab", emoji: "1️⃣", hint: "one nasal sound: uh(n)" }
  - { surface: "deux", meaningEn: "two", partOfSpeech: "other", kind: "vocab", emoji: "2️⃣", hint: "duh — the x is silent" }
  - { surface: "trois", meaningEn: "three", partOfSpeech: "other", kind: "vocab", emoji: "3️⃣", hint: "trwah — oi says wah, the s is silent" }
  - { surface: "quatre", meaningEn: "four", partOfSpeech: "other", kind: "vocab", emoji: "4️⃣", hint: "KAT-ruh" }
  - { surface: "cinq", meaningEn: "five", partOfSpeech: "other", kind: "vocab", emoji: "5️⃣", hint: "sank — the q IS spoken" }
  - { surface: "six", meaningEn: "six", partOfSpeech: "other", kind: "vocab", emoji: "6️⃣", hint: "seess — the final x sounds like s" }
  - { surface: "sept", meaningEn: "seven", partOfSpeech: "other", kind: "vocab", emoji: "7️⃣", hint: "set — the p is silent, the t is spoken" }
  - { surface: "huit", meaningEn: "eight", partOfSpeech: "other", kind: "vocab", emoji: "8️⃣", hint: "weet — the h is silent", consonantOnset: true }
  - { surface: "neuf", meaningEn: "nine", partOfSpeech: "other", kind: "vocab", emoji: "9️⃣", hint: "nuhf — the f is spoken" }
  - { surface: "dix", meaningEn: "ten", partOfSpeech: "other", kind: "vocab", emoji: "🔟", hint: "deess — the final x sounds like s" }
  # ── connectors (m1's own particles — intro-module clozes are legal, es E2) ──
  - { surface: "et", meaningEn: "and", partOfSpeech: "particle", kind: "particle", hint: "ay — the t never sounds, ever" }
  - { surface: "ou", meaningEn: "or", partOfSpeech: "particle", kind: "particle", hint: "oo" }

lessons:
  # ── L1 · the silent-final promise + first greetings ────────────────────────
  - n: 1
    template: free
    title: "French ends quietly — bonjour, salut"
    description: "Final letters fall away. Meet your first three phrases."
    steps:
      - kind: info
        id: info-quiet
        title: "Words end quietly"
        body: "French spells more than it speaks: most FINAL consonants are silent. «salut» (hi) sounds like sa-LU — no t. «bonjour» (hello) ends on a soft r you barely hold. Expect endings to fall away, and spoken French gets much easier to hear."
      - kind: phrase
        id: p-bonjour
        meaning: "hello / good day"
        text: "bonjour"
        emoji: "🙋"
      - kind: imageMcq
        id: img-bonjour
        target: { surface: "bonjour", meaningEn: "hello / good day", emoji: "🙋" }
        distractors:
          - { surface: "merci", emoji: "🙏" }
          - { surface: "oui", emoji: "✅" }
          - { surface: "non", emoji: "❌" }
      - kind: speakLit
        id: sp-bonjour
        fr: "bonjour"
        en: "hello / good day"
        atoms: ["bonjour"]
      - kind: phrase
        id: p-salut
        meaning: "hi / bye (casual)"
        text: "salut"
        emoji: "👋"
      - kind: silentLetterLit
        id: sl-salut
        writtenForm: "salut"
        graphemes: ["s", "a", "l", "u", "t"]
        silent: [4]
        en: "hi / bye (casual)"
        ruleNote: "Final t is almost always silent — «salut» sounds like sa-LU."
      - kind: mcq
        id: q-register
        prompt: "You walk into a bakery and greet the owner — a stranger. Which greeting fits?"
        correct: "bonjour"
        distractors: ["salut", "merci", "non"]
        why: "«bonjour» works with everyone; «salut» is for friends and people you know well."
        atoms: ["bonjour"]
      - kind: speakLit
        id: sp-salut
        fr: "salut"
        en: "hi (casual)"
        atoms: ["salut"]
      - kind: textMcq
        id: tm-bonjour
        target: "bonjour"
        distractors: ["salut", "merci", "non"]
      - kind: phrase
        id: p-cava
        meaning: "how's it going? / it's going fine"
        text: "ça va"
        emoji: "💬"
      - kind: listenCompLit
        id: lc-cava
        fr: "ça va"
        en: "how's it going? / it's fine"
        distractorsEn: ["thank you very much", "good night", "see you soon"]
        atoms: ["ça va"]
      - kind: speakLit
        id: sp-cava
        fr: "ça va ?"
        en: "how's it going?"
        atoms: ["ça va"]
      - kind: mcq
        id: q-cava-reply
        # no «ça va ?» quoted here — the correct option IS «ça va», and a
        # prompt that shows the answer grades reading, not knowledge
        prompt: "A friend greets you and asks how you're doing. Which phrase is the natural answer?"
        correct: "ça va"
        distractors: ["non", "salut", "pardon"]
        why: "«ça va» answers itself — the same two words ask the question and give the answer ('it's going fine')."
        atoms: ["ça va"]
      - kind: info
        id: win-l1
        title: "You can greet anyone"
        body: "Three phrases in: «bonjour» for everyone, «salut» for friends, «ça va ?» to keep it going. And you already know the biggest secret of French pronunciation — endings fall away."
        variant: "win"

  # ── L2 · the politeness kit ─────────────────────────────────────────────────
  - n: 2
    template: free
    title: "The politeness kit — merci, s'il vous plaît"
    description: "Please, thank you, yes and no — the words that open every door."
    steps:
      - kind: info
        id: info-politeness
        title: "Please and thank you"
        body: "«merci» = thank you; add «beaucoup» ('a lot') for warmth: «merci beaucoup». Please is a fixed phrase: «s'il vous plaît» — literally 'if it pleases you'. You'll see it shortened to SVP on signs. These are non-negotiable in France: every request carries one."
      - kind: phrase
        id: p-merci
        meaning: "thank you"
        text: "merci"
        emoji: "🙏"
      - kind: imageMcq
        id: img-merci
        target: { surface: "merci", meaningEn: "thank you", emoji: "🙏" }
        distractors:
          - { surface: "s'il vous plaît", emoji: "🤲" }
          - { surface: "oui", emoji: "✅" }
          - { surface: "non", emoji: "❌" }
      - kind: speakLit
        id: sp-merci
        fr: "merci"
        en: "thank you"
        atoms: ["merci"]
      - kind: phrase
        id: p-svp
        meaning: "please"
        text: "s'il vous plaît"
        emoji: "🤲"
      - kind: silentLetterLit
        id: sl-vous
        writtenForm: "vous"
        graphemes: ["v", "ou", "s"]
        silent: [2]
        en: "you (from «s'il vous plaît»)"
        ruleNote: "«vous» sounds like voo. Its s wakes up only before a vowel — that's liaison, coming in module 2."
      - kind: mcq
        id: q-svp
        prompt: "You're handing the waiter your order. Which phrase makes it polite?"
        correct: "s'il vous plaît"
        distractors: ["merci", "pardon", "salut"]
        why: "«s'il vous plaît» attaches to any request; «merci» comes after, when you've received it."
        atoms: ["s'il vous plaît"]
      - kind: speakLit
        id: sp-svp
        fr: "s'il vous plaît"
        en: "please"
        atoms: ["s'il vous plaît"]
      - kind: phrase
        id: p-beaucoup
        meaning: "thank you very much"
        text: "merci beaucoup"
        emoji: "💐"
      - kind: silentLetterLit
        id: sl-beaucoup
        writtenForm: "beaucoup"
        graphemes: ["b", "eau", "c", "ou", "p"]
        silent: [4]
        en: "a lot (from «merci beaucoup»)"
        ruleNote: "«eau» is ONE sound (oh) and «ou» is ONE sound (oo) — and the final p is silent: boh-KOO."
      - kind: buildLit
        id: b-mercibeaucoup
        fr: "merci beaucoup"
        en: "thank you very much"
        # tiles draw only from words already MET (pardon is L4's word — a
        # distractor tile is an exposure, and exposures debut on intro steps)
        tiles: ["bonjour", "salut"]
        atoms: ["merci beaucoup"]
      - kind: imageMcq
        id: img-oui
        target: { surface: "oui", meaningEn: "yes", emoji: "✅" }
        distractors:
          - { surface: "non", emoji: "❌" }
          - { surface: "merci", emoji: "🙏" }
          - { surface: "bonjour", emoji: "🙋" }
      - kind: speakLit
        id: sp-ouimerci
        fr: "oui merci"
        en: "yes, thank you"
        atoms: ["oui", "merci"]
      - kind: imageMcq
        id: img-non
        target: { surface: "non", meaningEn: "no", emoji: "❌" }
        distractors:
          - { surface: "oui", emoji: "✅" }
          - { surface: "s'il vous plaît", emoji: "🤲" }
          - { surface: "merci beaucoup", emoji: "💐" }
      - kind: listenBuildLit
        id: lb-nonmerci
        fr: "non merci"
        en: "no, thank you"
        tiles: ["oui", "salut"]
        atoms: ["non", "merci"]
      - kind: selfExplain
        id: se-svp
        anchorLabel: "You said: s'il vous plaît"
        anchorAudioText: "s'il vous plaît"
        question: "Why is «s'il vous plaît» the safe way to say please?"
        rule: "It's a fixed polite formula — literally 'if it pleases you' — usable with anyone, in any request."
        surface: "It's simply the French word for 'please', one word like in English."
        distractor: "Because «merci» would be rude to say to a stranger."
        ruleExplanation: "«s'il vous plaît» never changes shape and never offends — learn it as one solid block, not word by word."
      - kind: match
        id: rev-l2
        surfaces: ["bonjour", "salut", "merci", "s'il vous plaît", "oui", "non"]
      - kind: info
        id: win-l2
        title: "Doors open now"
        body: "«s'il vous plaît» in, «merci beaucoup» out — with «oui» and «non» you can already survive a French bakery."
        variant: "win"

  # ── L3 · partings & evenings ────────────────────────────────────────────────
  - n: 3
    template: free
    title: "Ways to leave — au revoir, bonsoir"
    description: "Goodbyes for any hour, and the evening's own greetings."
    steps:
      - kind: info
        id: info-evening
        title: "Ways to leave"
        body: "«au revoir» = goodbye, any time. «à bientôt» = see you soon. Evenings get their own words: «bonsoir» (good evening) when you arrive, and «bonne nuit» (good night) ONLY when someone is heading to bed."
      - kind: phrase
        id: p-aurevoir
        meaning: "goodbye"
        text: "au revoir"
        emoji: "🚪"
      - kind: imageMcq
        id: img-aurevoir
        target: { surface: "au revoir", meaningEn: "goodbye", emoji: "🚪" }
        distractors:
          - { surface: "bonjour", emoji: "🙋" }
          - { surface: "merci", emoji: "🙏" }
          - { surface: "bonne nuit", emoji: "🌙" }
      - kind: speakLit
        id: sp-aurevoir
        fr: "au revoir"
        en: "goodbye"
        atoms: ["au revoir"]
      - kind: phrase
        id: p-bonsoir
        meaning: "good evening"
        text: "bonsoir"
        emoji: "🌆"
      - kind: mcq
        id: q-bonsoir
        prompt: "It's 8 pm and you walk into the restaurant. What do you say?"
        correct: "bonsoir"
        distractors: ["bonne nuit", "bonjour", "au revoir"]
        why: "«bonsoir» greets in the evening; «bonne nuit» is only for someone going to sleep."
        atoms: ["bonsoir"]
      - kind: speakLit
        id: sp-bonsoir
        fr: "bonsoir"
        en: "good evening"
        atoms: ["bonsoir"]
      - kind: phrase
        id: p-bonnenuit
        meaning: "good night"
        text: "bonne nuit"
        emoji: "🌙"
      - kind: silentLetterLit
        id: sl-nuit
        writtenForm: "nuit"
        graphemes: ["n", "ui", "t"]
        silent: [2]
        en: "night (from «bonne nuit»)"
        ruleNote: "«ui» glides like wee; the final t is silent: nwee."
      - kind: listenCompLit
        id: lc-bonnenuit
        fr: "bonne nuit"
        en: "good night"
        distractorsEn: ["good evening", "goodbye", "see you soon"]
        atoms: ["bonne nuit"]
      - kind: phrase
        id: p-abientot
        meaning: "see you soon"
        text: "à bientôt"
        emoji: "🔜"
      - kind: silentLetterLit
        id: sl-bientot
        writtenForm: "bientôt"
        graphemes: ["b", "i", "en", "t", "ô", "t"]
        silent: [5]
        en: "soon (from «à bientôt»)"
        ruleNote: "Say byan-TOH: «en» is a nasal vowel, and the final t is silent."
      - kind: speakLit
        id: sp-abientot
        fr: "à bientôt"
        en: "see you soon"
        atoms: ["à bientôt"]
      - kind: buildLit
        id: b-aurevoirabientot
        fr: "au revoir à bientôt"
        en: "goodbye — see you soon"
        tiles: ["bonsoir", "merci"]
        atoms: ["au revoir", "à bientôt"]
      - kind: mcq
        id: q-nuit
        prompt: "Your host walks you to the guest room and switches off the hall light. Which phrase fits the moment?"
        correct: "bonne nuit"
        distractors: ["bonsoir", "au revoir", "ça va"]
        why: "«bonne nuit» is for someone about to sleep — «bonsoir» would restart the evening."
        atoms: ["bonne nuit"]
      - kind: selfExplain
        id: se-bonsoir
        anchorLabel: "You chose: bonsoir"
        anchorAudioText: "bonsoir"
        question: "Why «bonsoir» when you arrive, but «bonne nuit» at bedtime?"
        rule: "«bonsoir» opens an evening conversation; «bonne nuit» closes the day — it wishes someone sleep."
        surface: "«bonne nuit» is simply the more formal of the two evening greetings."
        distractor: "«bonsoir» is only correct after 10 pm."
        ruleExplanation: "Pick by what happens NEXT: conversation → «bonsoir», sleep → «bonne nuit»."
      - kind: match
        id: rev-l3
        surfaces: ["au revoir", "à bientôt", "bonsoir", "bonne nuit", "bonjour", "salut"]
      - kind: info
        id: win-l3
        title: "Any hour covered"
        body: "Arrive with «bonjour» or «bonsoir», leave with «au revoir» or «à bientôt», and save «bonne nuit» for the pillow."
        variant: "win"

  # ── L4 · pardon & enchanté ──────────────────────────────────────────────────
  - n: 4
    template: free
    title: "Pardon — one word, three jobs"
    description: "Apologize, squeeze past, ask again — and meet someone new."
    steps:
      - kind: info
        id: info-pardon
        title: "«pardon» opens doors"
        body: "Bumped someone? «pardon». Need to squeeze past? «pardon». Didn't catch what they said? «pardon ?» with a rising voice asks them to repeat. One word, three jobs."
      - kind: phrase
        id: p-pardon
        meaning: "excuse me / sorry"
        text: "pardon"
        emoji: "🙇"
      - kind: listenCompLit
        id: lc-pardon
        fr: "pardon"
        en: "excuse me / sorry"
        distractorsEn: ["thank you", "hello", "see you soon"]
        atoms: ["pardon"]
      - kind: speakLit
        id: sp-pardon
        fr: "pardon"
        en: "excuse me / sorry"
        atoms: ["pardon"]
      - kind: phrase
        id: p-enchante
        meaning: "nice to meet you"
        text: "enchanté"
        emoji: "🤝"
      - kind: mcq
        id: q-enchante
        prompt: "You've just been introduced to your friend's mother. What do you say?"
        correct: "enchanté"
        distractors: ["pardon", "au revoir", "non"]
        why: "«enchanté» — literally 'delighted' — is the set phrase for a first meeting."
        atoms: ["enchanté"]
      - kind: speakLit
        id: sp-enchante
        fr: "enchanté"
        en: "nice to meet you"
        atoms: ["enchanté"]
      - kind: buildLit
        id: b-bonjourenchante
        fr: "bonjour enchanté"
        en: "hello — nice to meet you"
        tiles: ["salut", "pardon"]
        atoms: ["bonjour", "enchanté"]
      - kind: mcq
        id: q-pardonuse
        prompt: "You step on a stranger's foot on the metro. What do you say?"
        correct: "pardon"
        distractors: ["enchanté", "ça va", "oui"]
        why: "«pardon» is the instant apology; «enchanté» would introduce yourself to the foot's owner."
        atoms: ["pardon"]
      - kind: listenBuildLit
        id: lb-bonsoirenchante
        fr: "bonsoir enchanté"
        en: "good evening — nice to meet you"
        tiles: ["bonjour", "salut"]
        atoms: ["bonsoir", "enchanté"]
      - kind: textMcq
        id: tm-pardon
        target: "pardon"
        distractors: ["enchanté", "merci beaucoup", "bonne nuit"]
      - kind: speakLit
        id: sp-svpreturn
        fr: "s'il vous plaît"
        en: "please"
        atoms: ["s'il vous plaît"]
      - kind: match
        id: rev-l4
        surfaces: ["pardon", "enchanté", "merci beaucoup", "ça va", "bonsoir", "s'il vous plaît"]
      - kind: info
        id: win-l4
        title: "Socially bulletproof"
        body: "Greet, thank, apologize, meet, part — the whole social loop in French, and it's only lesson four."
        variant: "win"

  # ── L5 · numbers 0–5 (un…cinq) ─────────────────────────────────────────────
  - n: 5
    template: free
    title: "Count to five — un, deux, trois"
    description: "The first numbers, and the silent-final rule at work."
    steps:
      - kind: info
        id: info-num05
        title: "Count to five"
        body: "«un, deux, trois, quatre, cinq». The endings behave exactly as promised: deux = duh (silent x), trois = trwah (silent s). But «cinq» keeps its q spoken — sank. Numbers are your market survival kit."
      - kind: phrase
        id: p-un
        meaning: "one"
        text: "un"
        emoji: "1️⃣"
      - kind: imageMcq
        id: img-un
        target: { surface: "un", meaningEn: "one", emoji: "1️⃣" }
        distractors:
          - { surface: "deux", emoji: "2️⃣" }
          - { surface: "trois", emoji: "3️⃣" }
          - { surface: "quatre", emoji: "4️⃣" }
      - kind: speakLit
        id: sp-un
