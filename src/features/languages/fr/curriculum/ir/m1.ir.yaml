    steps:
      - kind: info
        id: info-num610
        title: "Six to ten"
        body: "«six» and «dix» END in a spoken s-sound: seess, deess. «sept» drops its p but keeps its t: set. «huit» sounds like weet. «neuf» keeps its f: nuhf. And zero is «zéro» — the easiest word in the module."
      - kind: phrase
        id: p-six
        meaning: "six"
        text: "six"
        emoji: "6️⃣"
      - kind: listenCompLit
        id: lc-six
        fr: "six"
        en: "six"
        distractorsEn: ["seven", "eight", "ten"]
