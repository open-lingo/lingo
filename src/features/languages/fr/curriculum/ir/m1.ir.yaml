  # ── L7 · integration — one small conversation ──────────────────────────────
  - n: 7
    template: free
    title: "One small conversation"
    description: "Everything so far, chained into real exchanges."
    steps:
      - kind: info
        id: info-recap
        title: "One small conversation"
        body: "You can now run a real exchange: greet, ask «ça va ?», thank, count, and part. This lesson chains it all — listen for the words you know and let the silent endings wash past."
      - kind: dialogueLit
        id: dlg-soir
        lines:
          - { speaker: "Marie", text: "bonsoir !" }
          - { speaker: "Thomas", text: "bonsoir ! ça va ?" }
          - { speaker: "Marie", text: "ça va, merci. et vous ?" }
          - { speaker: "Thomas", text: "ça va, merci beaucoup." }
        questions:
          - id: "q1"
            prompt: "What time of day is it?"
            correctText: "Evening"
            distractors: ["Morning", "Midday", "Bedtime"]
          - id: "q2"
            prompt: "How is Marie doing?"
            correctText: "Fine"
            distractors: ["Badly", "She doesn't say", "She's in a hurry"]
        atoms: ["bonsoir", "ça va", "merci", "merci beaucoup"]
      - kind: clozeLit
        id: cz-et
        fr: "six et sept"
        en: "six and seven"
        blank: "et"
        options: ["et", "ou", "oui", "non"]
        why: "«et» joins ('and'); «ou» offers a choice ('or')."
        atoms: ["six", "sept"]
      - kind: speakLit
        id: sp-bonjourcava
        fr: "bonjour, ça va ?"
        en: "hello — how's it going?"
        atoms: ["bonjour", "ça va"]
      - kind: clozeLit
        id: cz-ou
        fr: "quatre ou cinq"
        en: "four or five"
        blank: "ou"
        options: ["ou", "et", "oui", "non"]
        why: "A choice between numbers wants «ou» (or), not «et» (and)."
        atoms: ["quatre", "cinq"]
      - kind: buildLit
        id: b-mercietaurevoir
        fr: "merci et au revoir"
        en: "thank you and goodbye"
        tiles: ["ou", "salut"]
        atoms: ["merci", "et", "au revoir"]
      - kind: listenCompLit
        id: lc-abientot
        fr: "à bientôt"
        en: "see you soon"
        distractorsEn: ["good night", "excuse me", "thank you"]
        atoms: ["à bientôt"]
      - kind: speakLit
        id: sp-nombres
        fr: "un deux trois quatre cinq"
        en: "one two three four five"
        atoms: ["un", "deux", "trois", "quatre", "cinq"]
      - kind: mcq
        id: q-cafe
        prompt: "The waiter sets down your coffee. You say —"
        correct: "merci"
        distractors: ["pardon", "non", "à bientôt"]
        why: "Receiving something takes «merci»; «pardon» apologizes, and «à bientôt» walks away from the coffee."
        atoms: ["merci"]
      - kind: listenBuildLit
        id: lb-neufetdix
        fr: "neuf et dix"
        en: "nine and ten"
        tiles: ["deux", "ou"]
        atoms: ["neuf", "et", "dix"]
      - kind: selfExplain
        id: se-etou
        anchorLabel: "You picked: quatre ou cinq"
        anchorAudioText: "quatre ou cinq"
        question: "When do you join with «et» and when with «ou»?"
        rule: "«et» adds ('four AND five'); «ou» chooses ('four OR five'). The two never swap jobs."
        surface: "«et» is for joining numbers and «ou» is for joining words."
        distractor: "«ou» is just the casual, spoken way of saying «et»."
        ruleExplanation: "Same as English and/or — pick by meaning, not by the words around it."
      - kind: match
        id: rev-l7
        surfaces: ["bonjour", "merci beaucoup", "pardon", "huit", "bonsoir", "à bientôt"]
      - kind: speakLit
        id: sp-close
        fr: "au revoir, à bientôt !"
        en: "goodbye — see you soon!"
        atoms: ["au revoir", "à bientôt"]
      - kind: info
        id: win-l7
        title: "The bonjour rule"
        body: "In France, «bonjour» isn't optional — walking into a shop without it reads as rude, and clerks will pointedly answer «bonjour ?» until you say it back. One word buys you goodwill everywhere. You now have that word, and twenty-six more."
        variant: "win"

