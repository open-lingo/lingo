module: m1
title: "Primeiros passos"

# PT m1 — "Primeiros passos" (first steps): ser (sou/é), ser + de/origin with
# do/da contractions, ter (tenho/tem) + um/uma gender agreement, estar
# (estou/está) vs. ser, gostar de + infinitivo. docs/pt-course-design-
# 2026-09-18.md §4 (persona: Sam, the cross-course learner name; NPC cast
# Bia/Pedro/Rafael; places Brasil, São Paulo).
#
# `frame` is deliberately absent — PT is frameless-only by design
# (compile-ir-pt.mjs's header, design doc §1 row 1); do not add
# `frame: none` (that is an ES-only field this compiler does not read) or
# `throughModule` (also ES-only, unread here).
#
# `newAtoms: []` and `lessons: []` below are the empty seed the fragment
# merge (lane PTFRAG) fills in: every `ir/m1/l*.ir.yaml` fragment's
# `lesson:` appends to `lessons`, its `atoms:` appends to `newAtoms`, in
# filename order (l1 < l2 < l3 < l4 < l5).
#
# expectedLessonCount / checkpoint — lane PTINT judgment call (2026-09-18),
# UPDATED by lane PTR1-L6 (2026-09-18) landing the real L6 zero-new-atom
# checkpoint lesson. expectedLessonCount bumped 5 -> 6 to match.
#
# checkpoint stays at 4 (NOT bumped to 6) — this is a genuine, unresolved
# structural conflict, flagged for Spencer/lead, not a silent decision:
# compile-ir-pt.mjs hard-requires `1 < ir.checkpoint < ir.lessons.length`
# (strictly INTERIOR — the same ES/FR doctrine, where checkpoint sits at
# roughly COUNT-2 with 1-2 more lessons still following it,
# fr-quality.test.ts's own `FR_M21_CHECKPOINT_INDEX = COUNT - 2` pattern).
# L6 is m1's real zero-new-atom checkpoint AND m1's last lesson — the
# compiler's OWN separate, unconditional "last lesson must end in sim" law
# (also enforced below) is what L6 actually satisfies; `ir.checkpoint`
# cannot legally point at lesson 6 of 6 at all (6 < 6 is false), so PT's
# checkpoint truly is the mastery lesson, not an ES/FR-style mid-module one
# — a shape this field was never designed for. This lane's brief asked for
# `checkpoint: 6`; setting it hard-fails compile-ir-pt.mjs's own check
# (verified), so checkpoint is left at PTINT's prior placeholder (4) rather
# than an equally-wrong new placeholder. No lesson 1-5 has zero new atoms,
# so PT_M1_CHECKPOINT_INDEX still does not mean what it means for ES/FR —
# unchanged from PTINT's finding. Resolving this needs either a compiler
# change (out of scope: "never edit the compiler") or a product decision
# that PT's checkpoint field should mean "last lesson" for this course.
expectedLessonCount: 6
checkpoint: 4

newAtoms: []
lessons: []
