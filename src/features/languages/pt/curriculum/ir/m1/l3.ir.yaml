# pt/m1/l3.ir.yaml — "Eu tenho uma família" (ter present sg.; um/uma +
# gender agreement debut). Authoring lane PTAUTH-L3, per
# docs/pt-course-design-2026-09-18.md §4 row L3.
#
# FRAGMENT FILE — scripts/compile-ir-pt.mjs does not yet read
# ir/m1/l*.ir.yaml (a separate infra lane is adding that; see the
# PTAUTH-L3 brief). This is the authoring-time source for lesson 3's
# steps; when the fragment compiler lands it should merge this file's
# `lesson` entry into m1's `ir.lessons` array (in `n` order) exactly the
# way a hand-copied entry into m1.ir.yaml would look today.
#
# Atoms: this lesson's 8 new atoms are listed below under `atoms:` for
# when the fragment compiler starts emitting atom registration from IR
# (mirroring m1.ir.yaml's top-level `newAtoms:`) — but they are ALREADY
# live today via the hand-authored `../../courseAtoms.m1-l3.ts` (imported
# by `courseAtoms.ts`), so flashcards/SRS/registry gates work now, before
# this YAML ever compiles. Keep the two in sync by hand until the fragment
# compiler is real; the field shapes below are identical either way.
#
# Cast (design doc §4): Rafael carries this lesson's sim. Gender: família/
# irmã are feminine, amigo/gato are masculine. Contractions: none in this
# lesson (do/da/no/na debut in L2, per §3) — buildLit/listenBuildLit here
# have nothing to guard.

module: m1
lesson:
  n: 3
  template: free
  title: "Eu tenho uma família"
  description: "ter — tenho/tem — and Portuguese's first gender agreement: um for masculine words, uma for feminine ones. A cat, a friend, a sister."
  steps:
    - kind: imageMcq
      id: l3-img-gato
      target: { surface: "gato", meaningEn: "cat", emoji: "🐱" }
      distractors:
        - { surface: "cachorro", emoji: "🐶" }
        - { surface: "pássaro", emoji: "🐦" }
        - { surface: "peixe", emoji: "🐟" }

    - kind: speakLit
      id: l3-sp-tenhogato
      pt: "eu tenho um gato"
      en: "I have a cat"
      atoms: ["tenho", "um", "gato"]

    - kind: info
      id: l3-info-agreement
      title: "um amigo, uma irmã"
      body: "Ter (to have): «eu tenho», «você/ele/ela tem». Palavras femininas pedem «uma»: «uma irmã», «uma família». Palavras masculinas pedem «um»: «um amigo», «um gato». ✗ «um irmã» — errado, irmã é feminina! ✓ «uma irmã». ✗ «uma amigo» — errado, amigo é masculino! ✓ «um amigo»."
      variant: grammar

    - kind: speakLit
      id: l3-sp-rafaeltem
      pt: "Rafael tem uma irmã"
      en: "Rafael has a sister"
      atoms: ["tem", "irmã"]

    - kind: agreementLit
      id: l3-agr-irmaeamigo
      en: "I have a sister and a friend"
      audioText: "eu tenho uma irmã e um amigo"
      atoms: ["irmã", "amigo"]
      segments:
        - { text: "eu tenho " }
        - { blank: { id: "a1", answer: "uma", options: ["uma", "um"] } }
        - { text: " irmã e " }
        - { blank: { id: "a2", answer: "um", options: ["um", "uma"] } }
        - { text: " amigo" }

    - kind: clozeLit
      id: l3-c-tenho
      pt: "eu tenho uma família"
      en: "I have a family"
      blank: "tenho"
      options: ["tenho", "tem"]
      atoms: ["tenho", "família"]
      why: "«eu» takes «tenho» — the I-form."

    - kind: buildLit
      id: l3-b-familiaegato
      pt: "eu tenho uma família e um gato"
      en: "I have a family and a cat"
      atoms: ["tenho", "uma", "família", "um", "gato"]
      tiles: ["tem"]

    - kind: listenBuildLit
      id: l3-lb-amigoegato
      pt: "eu tenho um amigo e um gato"
      en: "I have a friend and a cat"
      atoms: ["tenho", "um", "amigo", "gato"]
      tiles: ["tem", "uma"]

    - kind: clozeLit
      id: l3-c-tem
      pt: "Bia tem um amigo"
      en: "Bia has a friend"
      blank: "tem"
      options: ["tem", "tenho"]
      atoms: ["tem", "amigo"]
      why: "Bia isn't «eu», so «tem» — the you/he/she-form."

    - kind: listenCompLit
      id: l3-lc-rafaelamigo
      pt: "Rafael tem um amigo"
      en: "Rafael has a friend"
      atoms: ["tem", "amigo"]
      distractorsEn:
        - "Rafael has a cat."
        - "Rafael has a family."
        - "Sam has a friend."

    # Printed earlier as an L1 speakLit (design doc §4 row L1 win line) —
    # review-tail recall (§13.9 law 3), not a new atom spend.
    - kind: speakLit
      id: l3-sp-recall-l1win
      pt: "eu sou Sam, sou estudante"
      en: "I am Sam, I am a student"
      atoms: []
      cue: recall

    - kind: sim
      id: l3-sim-rafael
      scene: { emoji: "🐱", title: "Rafael e o gato dele" }
      turns:
        - id: t1
          npc:
            speaker: "Rafael"
            pt: "Eu tenho um gato. E você?"
            audioText: "eu tenho um gato. e você?"
            gloss: "I have a cat. And you?"
          goal: "Say you have a cat too."
          reply:
            mode: build
            tiles: ["eu", "tenho", "um", "gato", "tem", "uma"]
            answer: "eu tenho um gato"
          replyGloss: "I have a cat."
          explanation: "Rafael's «e você?» hands you back his own sentence shape — «eu tenho um gato»."
        - id: t2
          npc:
            speaker: "Rafael"
            pt: "Você tem uma irmã?"
            audioText: "você tem uma irmã?"
            gloss: "Do you have a sister?"
          goal: "Say yes, you have a sister."
          reply:
            mode: choice
            options:
              - { id: "right", text: "sim, eu tenho uma irmã" }
              - { id: "wrong1", text: "sim, eu tenho um irmã" }
              - { id: "wrong2", text: "sim, eu tem uma irmã" }
            correctOptionId: "right"
            audioText: "sim, eu tenho uma irmã"
          replyGloss: "Yes, I have a sister."
          explanation: "«irmã» is feminine, so «uma irmã» — and «eu» always takes «tenho», never «tem»."

    - kind: matchLit
      id: l3-match
      pairs:
        - { source: "tenho", target: "I have" }
        - { source: "tem", target: "you have / he-she has" }
        - { source: "um", target: "a (masculine)" }
        - { source: "uma", target: "a (feminine)" }
        - { source: "família", target: "family" }
        - { source: "irmã", target: "sister" }
        - { source: "amigo", target: "friend" }
        - { source: "gato", target: "cat" }

    - kind: speakLit
      id: l3-sp-win
      pt: "eu tenho um amigo e uma irmã"
      en: "I have a friend and a sister"
      atoms: ["tenho", "um", "amigo", "uma", "irmã"]

# ── atoms (documentary today; live via courseAtoms.m1-l3.ts — see header) ──
atoms:
  - { surface: "tenho", meaningEn: "I have", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "tem", meaningEn: "you have / he/she has", partOfSpeech: "verb", kind: "vocab" }
  - { surface: "um", meaningEn: "a / an (masculine, o-words)", partOfSpeech: "particle", kind: "particle" }
  - { surface: "uma", meaningEn: "a / an (feminine, a-words)", partOfSpeech: "particle", kind: "particle" }
  - { surface: "família", meaningEn: "family", partOfSpeech: "noun", kind: "vocab", gender: "f", emoji: "👪" }
  - { surface: "irmã", meaningEn: "sister", partOfSpeech: "noun", kind: "vocab", gender: "f" }
  - { surface: "amigo", meaningEn: "friend", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "🧑‍🤝‍🧑" }
  - { surface: "gato", meaningEn: "cat", partOfSpeech: "noun", kind: "vocab", gender: "m", emoji: "🐱" }
