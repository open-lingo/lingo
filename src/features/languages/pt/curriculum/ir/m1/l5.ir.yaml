# ── m1 L5 · "O que você gosta de fazer?" ──────────────────────────────────
# Lane PTAUTH-L5 (docs/pt-course-design-2026-09-18.md §4, row L5).
# Grammar point: gostar de + infinitivo; -ar/-er/-ir preview; module
# consolidation (mixes ser/estar/ter/contractions from L1–L4).
#
# FRAGMENT FILE — scripts/compile-ir-pt.mjs merges every ir/m1/l*.ir.yaml
# into ir/m1.ir.yaml in filename order: this file's `lesson:` appends to
# `ir.lessons`, its `atoms:` appends to `ir.newAtoms`. Lane PTINT
# (2026-09-18) re-keyed this file from its original draft shape (bare
# top-level n/title/description/template/steps + `newAtoms:`) to the real
# fragment schema (`atoms:` + `lesson:`, with `steps` nested under
# `lesson:`) — pure re-keying and re-indentation, no step content,
# sentence, gloss, or atom changed.
#
# Cast: Sam (learner), Bia (NPC, recurring from L1/L4). Prior atoms used
# here (read from §4 of the design doc — sibling fragments did not exist
# yet in the other PTAUTH-L* worktrees at authoring time): eu, você, sou,
# tenho, tem, um, uma, irmã, estou, está, feliz, cansado, hospital, Brasil,
# de, do, da — plus their regular gender/number counterparts (irmão) and
# ordinary Portuguese function words (e, mas, não, sim, com, ou), same
# always-allowed doctrine `es-m20-brief.md` states for Spanish.

atoms:
  - surface: "gosto"
    meaningEn: "I like"
    partOfSpeech: "verb"
    kind: "vocab"
    hint: "gostar, 1st person singular — always followed by de"
  - surface: "gosta"
    meaningEn: "you like / he or she likes"
    partOfSpeech: "verb"
    kind: "vocab"
    hint: "gostar, você/ele/ela form — always followed by de"
  - surface: "falar"
    meaningEn: "to speak, to talk"
    partOfSpeech: "verb"
    kind: "vocab"
    hint: "-ar infinitive (first of the three preview endings)"
  - surface: "comer"
    meaningEn: "to eat"
    partOfSpeech: "verb"
    kind: "vocab"
    hint: "-er infinitive (second of the three preview endings)"
  - surface: "assistir"
    meaningEn: "to watch"
    partOfSpeech: "verb"
    kind: "vocab"
    hint: "-ir infinitive (third of the three preview endings)"
  - surface: "filme"
    meaningEn: "movie, film"
    partOfSpeech: "noun"
    kind: "vocab"
    gender: "m"
    emoji: "🎬"
  - surface: "música"
    meaningEn: "music"
    partOfSpeech: "noun"
    kind: "vocab"
    gender: "f"
    emoji: "🎵"
    hint: "stress the first syllable: MÚ-si-ca"
  - surface: "pizza"
    meaningEn: "pizza"
    partOfSpeech: "noun"
    kind: "vocab"
    gender: "f"
    emoji: "🍕"

lesson:
  n: 5
  title: "O que você gosta de fazer?"
  description: "Talk about what you like to do — gostar de + infinitivo, plus a review of ser, estar, and ter."
  template: free
  steps:
    # 1 — info. Debuts gosto/gosta/comer/pizza/falar/assistir via the
    # antiPattern + example prose (an intro-capable step; filme/música are
    # deliberately withheld from this prose so their own imageMcq below is
    # each word's true first exposure).
    - kind: info
      id: info-gostar
      variant: grammar
      title: "Gostar de + verbo"
      body: >-
        To say you like DOING something, use «gostar de» + infinitive — the
        «de» never drops, even though English doesn't need an equivalent
        word there: «eu gosto de comer pizza», I like eating pizza. Drop the
        «de» and it's wrong: not «eu gosto comer pizza», but «eu gosto de
        comer pizza». Same pattern with «você»: «você gosta de comer
        pizza?», do you like eating pizza? Três infinitivos novos, one for
        each ending: «falar», to speak — «comer», to eat — «assistir», to
        watch.

    # 2 — imageMcq. filme's true debut.
    - kind: imageMcq
      id: mcq-filme
      target: { surface: "filme", meaningEn: "movie, film", emoji: "🎬" }
      distractors:
        - { surface: "gato", emoji: "🐱" }
        - { surface: "estudante", emoji: "🎓" }
        - { surface: "professor", emoji: "👨‍🏫" }

    # 3 — clozeLit. gosto answers (blank), re-spends filme + assistir.
    - kind: clozeLit
      id: cloze-gosto
      pt: "Eu gosto de assistir filme."
      en: "I like watching movies"
      blank: "gosto"
      options: ["gosto", "gosta", "tenho"]
      why: "gosto = I like (eu); gosta = you like / he or she likes"
      atoms: ["gosto", "assistir", "filme"]

    # 4 — buildLit, ≥5 tiles. -ar preview (falar) gets its first answer
    # position, gosto its second.
    - kind: buildLit
      id: build-falar
      pt: "Eu gosto de falar com você."
      en: "I like talking with you"
      tiles: ["tenho", "está"]
      atoms: ["gosto", "falar"]

    # 5 — imageMcq. música's true debut; filme (now PRIOR within this
    # lesson) joins the distractor pool.
    - kind: imageMcq
      id: mcq-musica
      target: { surface: "música", meaningEn: "music", emoji: "🎵" }
      distractors:
        - { surface: "filme", emoji: "🎬" }
        - { surface: "gato", emoji: "🐱" }
        - { surface: "estudante", emoji: "🎓" }

    # 6 — clozeLit. gosta answers (blank); gostar de + NOUN (not just
    # + infinitive) — música has no natural pairing with falar/comer/
    # assistir, so this is deliberately the noun-object form of the pattern.
    - kind: clozeLit
      id: cloze-gosta
      pt: "Bia gosta de música."
      en: "Bia likes music"
      blank: "gosta"
      options: ["gosta", "gosto", "tem"]
      why: "gostar de also takes a plain noun, not only an infinitive"
      atoms: ["gosta", "música"]

    # 7 — listenBuildLit. comer + pizza get real answer positions; gosta a
    # second one.
    - kind: listenBuildLit
      id: lb-pizza
      pt: "Sam gosta de comer pizza."
      en: "Sam likes eating pizza"
      tiles: ["assistir", "filme"]
      atoms: ["gosta", "comer", "pizza"]

    # 8 — clozeLit. falar answers (blank), contrasted against its -er/-ir
    # siblings as options — the -ar/-er/-ir preview's own retrieval moment.
    - kind: clozeLit
      id: cloze-falar
      pt: "Eu gosto de falar com Rafael."
      en: "I like talking with Rafael"
      blank: "falar"
      options: ["falar", "comer", "assistir"]
      why: "falar (-ar), comer (-er), assistir (-ir) — three endings, three new infinitives"
      atoms: ["gosto", "falar"]

    # 9 — speakLit, cued recall of L1's printed win line (§13.9 law 3 —
    # atoms: [] because these atoms belong to L1, not L5).
    - kind: speakLit
      id: sp-recall-l1
      cue: recall
      pt: "Eu sou Sam, sou estudante."
      en: "I am Sam, I'm a student"
      atoms: []

    # 10 — audioWimcq. pizza (PRIOR by now within the lesson) gets its
    # zero-reading retrieval pass.
    - kind: audioWimcq
      id: wimcq-pizza
      target: { surface: "pizza", emoji: "🍕" }
      distractors:
        - { surface: "filme", emoji: "🎬" }
        - { surface: "música", emoji: "🎵" }
        - { surface: "gato", emoji: "🐱" }

    # 11 — speakLit, cued recall of L4's printed win line.
    - kind: speakLit
      id: sp-recall-l4
      cue: recall
      pt: "Eu estou cansado, mas estou feliz."
      en: "I'm tired, but I'm happy"
      atoms: []

    # 12 — sim. Closes the consolidation: turn 1 recalls ter + um/uma + irmã
    # (L3), turn 2 recalls estar (L4, verbatim "você está bem?"), turn 3 is
    # the lesson's own gostar de + infinitivo/noun, mixing filme AND pizza.
    - kind: sim
      id: sim-bia
      scene: { emoji: "🎬", title: "Sábado com a Bia", setting: "São Paulo" }
      exposesAtoms: ["gosto", "gosta", "comer", "pizza", "assistir", "filme"]
      turns:
        - id: t1-familia
          npc:
            speaker: "Bia"
            pt: "Sam, você tem um irmão ou uma irmã?"
            gloss: "Sam, do you have a brother or a sister?"
          goal: "say you have a sister"
          reply:
            mode: build
            tiles: ["eu", "tenho", "uma", "irmã"]
            answer: "eu tenho uma irmã"
        - id: t2-estar
          npc:
            speaker: "Bia"
            pt: "Você está bem?"
            gloss: "Are you well?"
          goal: "say you're fine"
          reply:
            mode: choice
            correctOptionId: "right"
            options:
              - { id: "right", text: "Estou bem." }
              - { id: "wrong1", text: "Sou de São Paulo." }
              - { id: "wrong2", text: "Tenho um gato." }
        - id: t3-gostar
          npc:
            speaker: "Bia"
            pt: "Você gosta de assistir filme ou de comer pizza?"
            gloss: "Do you like watching movies or eating pizza?"
          goal: "say you like eating pizza"
          reply:
            mode: choice
            correctOptionId: "right"
            options:
              - { id: "right", text: "Gosto de comer pizza." }
              - { id: "wrong1", text: "Tenho um filme." }
              - { id: "wrong2", text: "Estou no hospital." }

    # 13 — matchLit, 8 pairs (≥6 floor) — every L5 atom gets one more answer
    # position, all in one closing beat.
    - kind: matchLit
      id: match
      prompt: "Match them."
      pairs:
        - { source: "gosto", target: "I like" }
        - { source: "gosta", target: "you like / he or she likes" }
        - { source: "falar", target: "to speak" }
        - { source: "comer", target: "to eat" }
        - { source: "assistir", target: "to watch" }
        - { source: "filme", target: "movie" }
        - { source: "música", target: "music" }
        - { source: "pizza", target: "pizza" }

    # 14 — speakLit, the lesson's own -sp-win.
    - kind: speakLit
      id: sp-win
      pt: "Sam gosta de comer pizza e assistir filme."
      en: "Sam likes eating pizza and watching movies"
      atoms: ["gosta", "comer", "pizza", "assistir", "filme"]
