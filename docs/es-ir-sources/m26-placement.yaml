    - id: "es-m26-scr-1"
      prompt: "'As a child, I used to live in Mexico.' — which one?"
      correct: "de niño, vivía en México"
      distractors: ["de niño, vivían en México", "de niño, viví en México", "de niño, vivíamos en México"]
