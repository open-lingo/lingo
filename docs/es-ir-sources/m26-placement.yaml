      prompt: "I always ate at home, but yesterday I ate at the restaurant."
      correct: "siempre comía en casa, pero ayer comí en el restaurante"
      distractors: ["siempre comí en casa, pero ayer comía en el restaurante", "siempre comía en casa, pero ayer come en el restaurante", "siempre comían en casa, pero ayer comí en el restaurante"]
