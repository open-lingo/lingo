  # ── L5 · «Hace frío» — el frío debuts on imageMcq, immediately contrasted
  #    against el calor (L4) via «no hace calor, hace frío» — the module's
  #    first calor/frío minimal pair. Same PRIOR «hace» idiom as L4, no new
  #    grammar. Carries one recall.
  - n: 5
    template: free
    title: "Hace frío"
    description: "«el frío» — the cold, contrasted right away with L4's «el calor»: «no hace calor, hace frío»."
    steps:
      - kind: map
        id: l5-map-hacefrio
        tokens: ["hace", "un", "poco", "de", "frío"]
        pairs:
          - { en: "it is (weather)", tokenIndex: 0 }
          - { en: "a little", tokenIndex: 1 }
          - { en: "of", tokenIndex: 3 }
          - { en: "cold", tokenIndex: 4 }
        audioText: "hace un poco de frío"
        revealNote: "«el frío» — the cold, this module's opposite of «el calor». Same PRIOR «hace»."
      - kind: imageMcq
        id: l5-im-frio
        target: { surface: "el frío", meaningEn: "the cold", emoji: "🥶" }
        distractors:
          - { surface: "el museo", emoji: "🏛️" }
          - { surface: "la escuela", emoji: "🏫" }
          - { surface: "el cine", emoji: "🎬" }
      - kind: speakLit
        id: l5-sp-nohacecalorhacefrio
        es: "no hace calor, hace frío"
        en: "It's not hot, it's cold"
        atoms: ["no", "hace", "el calor", "hace", "el frío"]
      - kind: buildLit
        id: l5-b-enmexicohacefrio
        es: "aquí también hace frío"
        en: "Here it's also cold"
        atoms: ["aquí", "también", "hace", "el frío"]
        tiles: ["estaba", "hay"]
      - kind: clozeLit
        id: l5-c-diegolegustafrio
        es: "a Diego le gusta el frío"
        en: "Diego likes the cold"
        blank: "le"
        options: ["le", "te"]
        atoms: ["le", "gusta", "el frío"]
        why: "«le» — talking about Diego (PRIOR, m13). «te» would talk to you instead."
      - kind: listenCompLit
        id: l5-lc-noquierohacefrio
        es: "no me gusta el frío, pero me gusta la nieve"
        en: "I don't like the cold, but I like the snow."
        atoms: ["no", "me gusta", "el frío", "me gusta", "la nieve"]
        distractorsEn:
          - "I like the cold, but I don't like the snow."
          - "I don't like the cold, and I don't like the snow either."
          - "I liked the cold, but I liked the snow."
      - kind: mcq
        id: l5-q-elfrio
        prompt: "Which one means 'the cold'?"
        correct: "el frío"
        distractors: ["el calor", "el sol", "la lluvia"]
        atoms: ["el frío"]
        why: "«el frío» is the cold — the opposite of L4's «el calor». «el sol»/«la lluvia» are other weather words."
      # Printed non-recall at L4 (es-m27-4-l4-sp-win).
      - kind: speakLit
        id: l5-sp-recall-l4win
        es: "hace mucho calor hoy"
        en: "It's very hot today"
        atoms: []
        cue: recall
      - kind: audioWimcq
        id: l5-ear-museo
        target: { surface: "el museo", emoji: "🏛️" }
        distractors:
          - { surface: "el cine", emoji: "🎬" }
          - { surface: "la escuela", emoji: "🏫" }
      - kind: agreementLit
        id: l5-agr-calorfrio
        en: "It's not hot, it's a little cold"
        audioText: "no hace calor, hace un poco de frío"
        atoms: ["no", "hace", "el calor", "un poco", "el frío"]
        segments:
          - { text: "no hace " }
          - { blank: { id: "p1", answer: "calor", options: ["calor", "frío"] } }
          - { text: ", hace un poco de " }
          - { blank: { id: "p2", answer: "frío", options: ["frío", "calor"] } }
      - kind: listenBuildLit
        id: l5-lb-samlegustafrio
        es: "a Sam no le gusta el frío"
        en: "Sam doesn't like the cold"
        atoms: ["le", "gusta", "el frío"]
        tiles: ["gustan", "hay"]
      - kind: textMcq
        id: l5-tm-frio
        target: "el frío"
        distractors: ["son", "muy", "hace"]
      - kind: sim
        id: l5-sim-ana-frio
        scene: { emoji: "🥶", title: "Ana talks about the cold", setting: "Ana wants to know if it's cold where you are." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Hace frío hoy?", audioText: "¿hace frío hoy?", gloss: "Is it cold today?" }
            goal: "Say no, it's not cold, it's hot."
            reply:
              mode: build
              tiles: ["no", "no", "hace", "frío", "hace", "calor", "hay"]
              answer: "no no hace frío hace calor"
            replyGloss: "No, it's not cold, it's hot."
            explanation: "«hace frío» and «hace calor» — same impersonal «hace», opposite words."
          - id: t2
            npc: { speaker: "Ana", es: "¿Te gusta el frío?", audioText: "¿te gusta el frío?", gloss: "Do you like the cold?" }
            goal: "Say no, you don't like the cold."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no, no me gusta el frío" }
                - { id: "wrong1", text: "no, no te gusta el frío" }
                - { id: "wrong2", text: "no, no me gustan el frío" }
              correctOptionId: "right"
              audioText: "no, no me gusta el frío"
            replyGloss: "No, I don't like the cold."
            explanation: "Talking about yourself: «no me gusta», not «no te gusta» (that would talk about Ana). «el frío» is one thing, so «gusta», never «gustan»."
          - id: t3
            npc: { speaker: "Ana", es: "¿Y a Diego? ¿Le gusta el frío?", audioText: "¿y a diego? ¿le gusta el frío?", gloss: "And Diego? Does he like the cold?" }
            goal: "Say yes, Diego likes the cold a lot."
            reply:
              mode: build
              tiles: ["sí", "a", "diego", "le", "gusta", "mucho", "el", "frío", "te"]
              answer: "sí a diego le gusta mucho el frío"
            replyGloss: "Yes, Diego likes the cold a lot."
            explanation: "«a Diego le gusta» — the PRIOR (m13) pattern for someone else liking something, «le» unchanged."
      - kind: matchLit
        id: l5-match
        pairs:
          - { source: "el frío", target: "the cold" }
          - { source: "el calor", target: "the heat" }
          - { source: "no hace calor", target: "it's not hot" }
          - { source: "un poco de", target: "a little" }
          - { source: "aquí", target: "here" }
          - { source: "hace", target: "it is (weather)" }
      - kind: speakLit
        id: l5-sp-win
        es: "no hace calor, hace un poco de frío"
        en: "It's not hot, it's a little cold"
        atoms: ["no", "hace", "el calor", "un poco", "el frío"]
