  # ── L2 · «No me gusta la lluvia» — la lluvia debuts on imageMcq, taught
  #    as a NOUN (not the impersonal verb «llueve» — unregistered,
  #    deliberately not manufactured; see header decision 3). Carries one
  #    recall of L1's own win line. PRIOR context: hay (m3), no (m1), me
  #    gusta/no me gusta/le gusta (m7/m12/m13).
  - n: 2
    template: free
    title: "No me gusta la lluvia"
    description: "«la lluvia» — the rain, taught as a noun with PRIOR «hay». «no me gusta la lluvia» stacks PRIOR negation onto PRIOR «me gusta»."
    steps:
      - kind: map
        id: l2-map-haylluviahoy
        tokens: ["hay", "lluvia", "hoy"]
        pairs:
          - { en: "there is", tokenIndex: 0 }
          - { en: "rain", tokenIndex: 1 }
          - { en: "today", tokenIndex: 2 }
        audioText: "hay lluvia hoy"
        revealNote: "«la lluvia» — the rain. Taught as a noun, just like «el sol»: «hay lluvia», not a special weather verb."
      - kind: imageMcq
        id: l2-im-lluvia
        target: { surface: "la lluvia", meaningEn: "the rain", emoji: "🌧️" }
        distractors:
          - { surface: "el museo", emoji: "🏛️" }
          - { surface: "el cine", emoji: "🎬" }
          - { surface: "la tienda", emoji: "🏪" }
      - kind: speakLit
        id: l2-sp-nomegustalluvia
        es: "no me gusta la lluvia"
        en: "I don't like the rain"
        atoms: ["no", "me gusta", "la lluvia"]
      - kind: buildLit
        id: l2-b-hoyhaylluvia
        es: "hoy hay mucha lluvia"
        en: "Today there's a lot of rain"
        atoms: ["hoy", "hay", "mucho", "la lluvia"]
        tiles: ["estaba", "hace"]
      - kind: clozeLit
        id: l2-c-diegonolegustalluvia
        es: "a Diego no le gusta la lluvia"
        en: "Diego doesn't like the rain"
        blank: "le"
        options: ["le", "te"]
        atoms: ["le", "gusta", "la lluvia"]
        why: "«le» — talking about Diego (PRIOR, m13). «te» would talk to you instead."
      - kind: listenCompLit
        id: l2-lc-haylluvianomegusta
        es: "hay lluvia, pero no me gusta"
        en: "It's raining, but I don't like it."
        atoms: ["hay", "la lluvia", "no", "me gusta"]
        distractorsEn:
          - "It's raining, and I like it."
          - "It's sunny, but I don't like it."
          - "It was raining, but I didn't like it."
      - kind: mcq
        id: l2-q-lalluvia
        prompt: "Which one means 'the rain'?"
        correct: "la lluvia"
        distractors: ["el sol", "la playa", "el parque"]
        atoms: ["la lluvia"]
        why: "«la lluvia» is the rain. «el sol» (PRIOR, L1) and «la playa»/«el parque» are all a different word."
      # Printed non-recall at L1 (es-m27-1-l1-sp-win).
      - kind: speakLit
        id: l2-sp-recall-l1win
        es: "hoy hay sol, y me gusta el sol"
        en: "Today it's sunny, and I like the sun"
        atoms: []
        cue: recall
      - kind: audioWimcq
        id: l2-ear-museo
        target: { surface: "el museo", emoji: "🏛️" }
        distractors:
          - { surface: "el cine", emoji: "🎬" }
          - { surface: "la tienda", emoji: "🏪" }
      - kind: agreementLit
        id: l2-agr-melegustalluvia
        en: "I don't like the rain, and Diego doesn't like it either"
        audioText: "no me gusta la lluvia, y a Diego no le gusta"
        atoms: ["me gusta", "la lluvia", "le", "gusta"]
        segments:
          - { text: "no " }
          - { blank: { id: "p1", answer: "me", options: ["me", "le"] } }
          - { text: " gusta la lluvia, y a Diego no " }
          - { blank: { id: "p2", answer: "le", options: ["le", "me"] } }
          - { text: " gusta" }
      - kind: listenBuildLit
        id: l2-lb-samnolegustalluvia
        es: "a Sam no le gusta la lluvia"
        en: "Sam doesn't like the rain"
        atoms: ["le", "gusta", "la lluvia"]
        tiles: ["gustan", "hay"]
      - kind: textMcq
        id: l2-tm-lluvia
        target: "la lluvia"
        distractors: ["hay", "muy", "son"]
      - kind: sim
        id: l2-sim-ana-lluvia
        scene: { emoji: "🌧️", title: "Ana talks about the rain", setting: "Ana wants to know what you think of the rain today." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Hay lluvia hoy?", audioText: "¿hay lluvia hoy?", gloss: "Is it raining today?" }
            goal: "Say yes, there's a lot of rain."
            reply:
              mode: build
              tiles: ["sí", "hay", "mucha", "lluvia", "sol"]
              answer: "sí hay mucha lluvia"
            replyGloss: "Yes, there's a lot of rain."
            explanation: "«hay» plus «lluvia» — impersonal, no subject to agree with."
          - id: t2
            npc: { speaker: "Ana", es: "¿Te gusta la lluvia?", audioText: "¿te gusta la lluvia?", gloss: "Do you like the rain?" }
            goal: "Say no, you don't like the rain."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no, no me gusta la lluvia" }
                - { id: "wrong1", text: "no, no te gusta la lluvia" }
                - { id: "wrong2", text: "no, no me gustan la lluvia" }
              correctOptionId: "right"
              audioText: "no, no me gusta la lluvia"
            replyGloss: "No, I don't like the rain."
            explanation: "Talking about yourself: «no me gusta», not «no te gusta» (that would talk about Ana). «la lluvia» is one thing, so «gusta», never «gustan»."
          - id: t3
            npc: { speaker: "Ana", es: "¿Y a Diego? ¿Le gusta la lluvia?", audioText: "¿y a diego? ¿le gusta la lluvia?", gloss: "And Diego? Does he like the rain?" }
            goal: "Say no, Diego doesn't like the rain either."
            reply:
              mode: build
              tiles: ["no", "a", "diego", "no", "le", "gusta", "la", "lluvia", "te"]
              answer: "no a diego no le gusta la lluvia"
            replyGloss: "No, Diego doesn't like the rain either."
            explanation: "«a Diego no le gusta» — the PRIOR (m13) pattern, negated."
      - kind: matchLit
        id: l2-match
        pairs:
          - { source: "la lluvia", target: "the rain" }
          - { source: "no me gusta", target: "I don't like" }
          - { source: "no le gusta", target: "he/she/you (usted) doesn't like" }
          - { source: "hoy", target: "today" }
          - { source: "el sol", target: "the sun" }
          - { source: "hay", target: "there is, there are" }
      - kind: speakLit
        id: l2-sp-win
        es: "hay lluvia hoy, y no me gusta la lluvia"
        en: "It's raining today, and I don't like the rain"
        atoms: ["hay", "la lluvia", "hoy", "no", "me gusta"]
