        target: { surface: "boca", meaningEn: "mouth", emoji: "👄" }
        distractors:
          - { surface: "casa", emoji: "🏠" }
          - { surface: "tienda", emoji: "🏪" }
          - { surface: "mochila", emoji: "🎒" }
      - kind: buildLit
        id: l6-b-tengounabocagrande
        es: "tengo una boca grande"
        en: "I have a big mouth"
        atoms: ["tengo", "boca", "grande"]
        tiles: ["tienes", "pequeño"]
      - kind: clozeLit
        id: l6-c-bocapequena
        es: "tiene una boca pequeña"
        en: "He/she has a small mouth"
        blank: "pequeña"
        options: ["pequeña", "pequeño"]
        atoms: ["tiene", "boca"]
        why: "«boca» is feminine, so its adjective takes -a: «pequeña», not «pequeño» — the same agreement «pierna» and «mano» take."
      - kind: listenCompLit
        id: l6-lc-tengolabocagrande
        es: "tengo la boca grande"
        en: "I have a big mouth."
        atoms: ["tengo", "boca", "grande"]
        distractorsEn:
          - "I have a small mouth."
          - "You have a big mouth."
          - "He/she has a big mouth."
      - kind: mcq
        id: l6-q-boca
        prompt: "Which one means 'I have a mouth'?"
        correct: "tengo una boca"
        distractors: ["tengo un boca", "tengo una bocas", "tengo boca"]
        atoms: ["tengo", "boca"]
        why: "«boca» is feminine — «una», not «un». Spanish never drops the article."
      - kind: buildLit
        id: l6-b-mihermanobocapequena
        es: "mi hermano tiene una boca pequeña"
        en: "My brother has a small mouth"
        atoms: ["mi", "hermano", "tiene", "boca", "pequeño"]
        tiles: ["tengo", "grande"]
