            goal: "Say yes, he has a small mouth."
            reply:
              mode: build
              tiles: ["sí", "tiene", "una", "boca", "pequeña", "grande"]
              answer: "sí tiene una boca pequeña"
            replyGloss: "Yes, he has a small mouth."
            explanation: "«tiene», third person, feminine agreement: «boca pequeña»."
