        en: "I have a big mouth, and you have a small mouth"
        audioText: "tengo una boca grande, y tienes una boca pequeña"
        atoms: ["tengo", "boca", "grande", "tienes", "pequeño"]
        segments:
          - { text: "tengo una boca " }
          - { blank: { id: "p1", answer: "grande", options: ["grande", "pequeña"] } }
          - { text: ", y tienes una boca " }
          - { blank: { id: "p2", answer: "pequeña", options: ["pequeña", "grande"] } }
      - kind: listenBuildLit
