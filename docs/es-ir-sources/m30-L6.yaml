  # ── L6 · «Tengo una boca grande» — la boca debuts on imageMcq. Regular
  #    feminine — the other noun (with «pierna», L4) flagged in the
  #    header's «verla» trap section: pre-verbal pronoun placement only,
  #    never a fused pronoun-on-verb, later (L9). PRIOR: «tengo» (m5),
  #    «grande»/«pequeño» (m6). One recall (L5's win line).
  - n: 6
    template: free
    title: "Tengo una boca grande"
    description: "«boca» — the mouth. Regular feminine, regular plural — the other feminine noun (with «pierna») that always takes a pre-verbal pronoun, never a fused one."
    steps:
      - kind: map
        id: l6-map-tengounaboca
        tokens: ["tengo", "una", "boca"]
        pairs:
          - { en: "I have", tokenIndex: 0 }
          - { en: "a", tokenIndex: 1 }
          - { en: "mouth", tokenIndex: 2 }
        audioText: "tengo una boca"
        revealNote: "«boca» — the mouth. Regular feminine, regular plural «las bocas»."
      - kind: speakLit
        id: l6-sp-recall-l5win
        es: "tengo los ojos azules"
        en: "I have blue eyes"
        atoms: []
        cue: recall
