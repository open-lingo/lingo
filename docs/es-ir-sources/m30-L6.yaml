        scene: { emoji: "👄", title: "Ana asks about your mouth", setting: "Ana is describing you for a police sketch, as a joke." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Tienes una boca grande?", audioText: "¿tienes una boca grande?", gloss: "Do you have a big mouth?" }
            goal: "Say yes, you have a big mouth."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, tengo una boca grande" }
                - { id: "wrong1", text: "sí, tengo un boca grande" }
