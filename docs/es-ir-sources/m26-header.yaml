#
# ── NO NEW EMOJI, NO NEW NOUN THIS MODULE ──────────────────────────────────
# Same precedent as m19/m21/m22/m23/m24/m25. All five new atom families are
# verb forms. Two of this module's five infinitives already carry a PRIOR
