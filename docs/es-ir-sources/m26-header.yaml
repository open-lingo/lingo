# tienda 🏪, casa 🏠, el trabajo 💼, el museo 🏛️) plus PRIOR non-emoji
# nouns (la tarea m15, el amigo, restaurante m18, padre/madre/abuela/abuelo)
# and the fixed cast.
#
# ── ACCENT: FRESH COLOUR — CYAN, VERIFIED UNUSED ────────────────────────
# Checked every `accent:` pair in `curriculum/index.ts` (grep-verified:
