  # ── L4 · «Tengo una pierna pequeña» — la pierna debuts on imageMcq.
  #    Regular feminine, regular plural — the deliberate CONTRAST against
  #    L3's masculine «brazo», same shape as L1/L2's mano/pie pair. This
  #    is one of the two feminine nouns (with «boca») flagged in the
  #    header's «verla» trap section: never fuse a pronoun onto it later
  #    (L9) — pre-verbal placement only. PRIOR: «tengo» (m5), «pequeño»
  #    (m6). One recall (L3's win line).
  - n: 4
    template: free
    title: "Tengo una pierna pequeña"
    description: "«pierna» — the leg. Regular feminine, regular plural — same shape as «mano»/«pie», opposite gender from «brazo»."
