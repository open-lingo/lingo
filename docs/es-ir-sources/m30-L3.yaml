        id: l3-q-brazo
        prompt: "Which one means 'I have an arm'?"
        correct: "tengo un brazo"
        distractors: ["tengo una brazo", "tengo un brazos", "tengo brazo"]
        atoms: ["tengo", "brazo"]
        why: "«brazo» is masculine — «un», not «una». One arm stays singular, «brazo» with no -s. And Spanish never drops the article."
