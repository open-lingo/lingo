            goal: "Say yes, she has small arms."
            reply:
              mode: build
              tiles: ["sí", "tiene", "los", "brazos", "pequeños", "grande"]
              answer: "sí tiene los brazos pequeños"
            replyGloss: "Yes, she has small arms."
            explanation: "Two arms, so the plural: «los brazos», «pequeños»."
