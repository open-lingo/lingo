  # ── L10 · MASTERY — zero new atoms, zero info cards, every step graded.
  #    Longest sim in the module (Ana asks for the whole memory, 5 turns) —
  #    per the module's law, the mastery lesson must END on the sim, so the
  #    verbatim closing win line is delivered as the sim's final (5th) turn
  #    reply, not a separate speakLit step; matchLit sits just before the
  #    sim instead of after it. ≥2 recalls (L9, L1 — full-circle back to
  #    the very first win). ≥1 PRIOR m23 connective («cuando» and
  #    «mientras», both used). ≥1 PRIOR m25 connective («porque»/«por eso»,
  #    both used). Context: all 7 weather atoms plus PRIOR
  #    vivíamos/salíamos/salías/salían (m26) and estaba/hacía (m24), all
  #    working together. NOTE: the brief's suggested win line used «un día»
  #    and «nevaba», neither confirmed PRIOR (nevaba is a manufactured
  #    weather-verb form this module deliberately never teaches, per hard
  #    rule 3) and «donde» (grep-confirmed zero hits anywhere in m1-m26).
  #    This lesson's win line substitutes the registered «aquí» for
  #    «donde» and drops «nevaba» for the registered «hacía frío» —
  #    otherwise it preserves the brief's intent (a childhood memory, the
  #    imperfect weather idiom, «por eso» causal, PRIOR m25) exactly.
  - n: 10
    template: free
    title: "De niño, hacía mucho frío aquí"
    description: "Everything from this module, one last time, fully graded — every weather word recombined, PRIOR m23/m25 connectives, all working together."
    steps:
      - kind: buildLit
        id: l10-b-deninoviviamosaquijuntos
        es: "de niños, vivíamos aquí juntos"
        en: "As children, we used to live here together"
        atoms: ["de niño", "vivíamos", "aquí", "juntos"]
        tiles: ["vivían", "vive"]
      - kind: speakLit
        id: l10-sp-siemprehaciafrio
        es: "de niño, siempre hacía mucho frío"
        en: "As a child, it was always very cold"
        atoms: ["de niño", "siempre", "hacía", "mucho", "el frío"]
      - kind: buildLit
        id: l10-b-nohaciacalorhaciafrio
        es: "no hacía calor, hacía frío"
        en: "It wasn't hot, it was cold"
        atoms: ["no", "hacía", "el calor", "hacía", "el frío"]
        tiles: ["hace", "estaba"]
      - kind: listenBuildLit
        id: l10-lb-saliamospocoporquehaciafrio
        es: "salíamos poco porque hacía frío"
        en: "We didn't go out much because it was cold"
        atoms: ["salíamos", "porque", "hacía", "el frío"]
        tiles: ["salían", "sale"]
      - kind: clozeLit
        id: l10-c-cuandohaciafrionosaliamos
        es: "cuando hacía frío, no salíamos mucho"
        en: "When it was cold, we didn't go out much"
        blank: "salíamos"
        options: ["salíamos", "salían"]
        atoms: ["cuando", "hacía", "el frío", "salíamos", "mucho"]
        why: "«nosotros» keeps «salíamos» — the accented we-form; «salían» would wrongly shift to they."
      - kind: mcq
        id: l10-q-cuando
        prompt: "Which one sets up a WHEN, not a WHY?"
        correct: "cuando"
        distractors: ["porque", "por eso", "mientras"]
        atoms: ["cuando"]
        why: "«cuando» (when) frames a moment. «porque»/«por eso» (PRIOR, m25) give a reason; «mientras» marks simultaneity, close but not the same as a single «when»."
      - kind: agreementLit
        id: l10-agr-yotusaliamos
        en: "I used to go out little, and you did too"
        audioText: "yo salía poco, y tú salías también"
        atoms: ["salía", "salías"]
        segments:
          - { text: "yo " }
          - { blank: { id: "p1", answer: "salía", options: ["salía", "salías"] } }
          - { text: " poco, y tú " }
          - { blank: { id: "p2", answer: "salías", options: ["salías", "salía"] } }
          - { text: " también" }
      # Printed non-recall at L9 (es-m27-9-l9-sp-win).
      - kind: speakLit
        id: l10-sp-recall-l9win
        es: "hoy hace sol y no hace frío, pero de niño siempre hacía mucho frío"
        en: "Today it's sunny and it's not cold, but as a child it was always very cold"
        atoms: []
        cue: recall
      - kind: textMcq
        id: l10-tm-cuando
        target: "cuando"
        distractors: ["porque", "por eso", "mientras"]
      - kind: audioWimcq
        id: l10-ear-tienda
        target: { surface: "la tienda", emoji: "🏪" }
        distractors:
          - { surface: "el museo", emoji: "🏛️" }
          - { surface: "la fiesta", emoji: "🎉" }
      - kind: buildLit
        id: l10-b-nohaciamuchosolaqui
        es: "de niño, no hacía mucho sol aquí"
        en: "As a child, it wasn't very sunny here"
        atoms: ["de niño", "no", "hacía", "mucho", "el sol", "aquí"]
        tiles: ["hace", "estaba"]
      - kind: listenBuildLit
        id: l10-lb-mientrashaciafrioestabanublado
        es: "mientras hacía frío, estaba nublado"
        en: "While it was cold, it was cloudy"
        atoms: ["mientras", "hacía", "el frío", "estaba", "nublado"]
        tiles: ["hace", "está"]
      - kind: clozeLit
        id: l10-c-todossaliancuandohaciafrio
        es: "todos salían poco cuando hacía frío"
        en: "Everyone went out little when it was cold"
        blank: "salían"
        options: ["salían", "salíamos"]
        atoms: ["todos", "salían", "cuando", "hacía", "el frío"]
        why: "«todos» takes the they-ending: «salían», never «salíamos» (we)."
      - kind: mcq
        id: l10-q-saliamosmucho
        prompt: "'We used to go out a lot' — which one?"
        correct: "salíamos mucho"
        distractors: ["salía mucho", "salíamos poco", "salían mucho"]
        atoms: ["salíamos", "mucho"]
        why: "«salíamos» (PRIOR, m26) is the accented we-form — «salía» wrongly narrows to one person, «salían» wrongly shifts to they, and «poco» is the wrong amount."
      - kind: speakLit
        id: l10-sp-tusaliaspococuandofrio
        es: "tú siempre salías poco cuando hacía frío"
        en: "You (tú) always went out little when it was cold"
        atoms: ["salías", "siempre", "cuando", "hacía", "el frío"]
      - kind: buildLit
        id: l10-b-tuviviasaquidenino
        es: "tú vivías aquí de niño"
        en: "You (tú) used to live here as a child"
        atoms: ["vivías", "aquí", "de niño"]
        tiles: ["vivía", "vive"]
      # Printed non-recall at L1 (es-m27-1-l1-sp-win).
      - kind: speakLit
        id: l10-sp-recall-l1win
        es: "hoy hay sol, y me gusta el sol"
        en: "Today it's sunny, and I like the sun"
        atoms: []
        cue: recall
      - kind: textMcq
        id: l10-tm-porque
        target: "porque"
        distractors: ["por eso", "cuando", "mientras"]
      - kind: matchLit
        id: l10-match
        pairs:
          - { source: "cuando", target: "when" }
          - { source: "mientras", target: "while" }
          - { source: "porque", target: "because" }
          - { source: "por eso", target: "that's why" }
          - { source: "vivíamos", target: "we used to live" }
          - { source: "salíamos", target: "we used to go out" }
      - kind: sim
        id: l10-sim-ana-memoria
        scene: { emoji: "🥶", title: "Ana asks for the whole memory", setting: "Ana wants to hear the whole childhood weather story, start to finish, in one telling." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Vivían todos aquí juntos de niños?", audioText: "¿vivían todos aquí juntos de niños?", gloss: "Did you all used to live here together as children?" }
            goal: "Say yes, you all lived here together."
            reply:
              mode: build
              tiles: ["sí", "vivíamos", "aquí", "juntos", "vivían"]
              answer: "sí vivíamos aquí juntos"
            replyGloss: "Yes, we used to live here together."
            explanation: "«vivíamos» — the accented we-form, answering for the whole group."
          - id: t2
            npc: { speaker: "Ana", es: "¿Siempre hacía mucho frío?", audioText: "¿siempre hacía mucho frío?", gloss: "Was it always very cold?" }
            goal: "Say yes, and it wasn't very sunny."
            reply:
              mode: build
              tiles: ["sí", "y", "no", "hacía", "mucho", "sol", "hace"]
              answer: "sí y no hacía mucho sol"
            replyGloss: "Yes, and it wasn't very sunny."
            explanation: "«hacía» keeps the same we-scene as «vivíamos» — the standing habit of the past, not «hace» (that would slip into now)."
          - id: t3
            npc: { speaker: "Ana", es: "Salían poco, entonces.", audioText: "salían poco, entonces.", gloss: "You all went out little, then." }
            goal: "Say because it was cold."
            reply:
              mode: choice
              options:
                - { id: "right", text: "porque hacía frío" }
                - { id: "wrong1", text: "por eso hacía frío" }
                - { id: "wrong2", text: "porque hace frío" }
              correctOptionId: "right"
              audioText: "porque hacía frío"
            replyGloss: "Because it was cold."
            explanation: "«porque» answers a WHY directly; «por eso» would flip the direction backwards. «hacía», not «hace» — still the past."
          - id: t4
            npc: { speaker: "Ana", es: "¿Estaba nublado mientras hacía frío?", audioText: "¿estaba nublado mientras hacía frío?", gloss: "Was it cloudy while it was cold?" }
            goal: "Say yes, it was very cloudy."
            reply:
              mode: build
              tiles: ["sí", "estaba", "muy", "nublado", "está"]
              answer: "sí estaba muy nublado"
            replyGloss: "Yes, it was very cloudy."
            explanation: "«estaba» — the imperfect (m24), the same ongoing scene as «hacía»."
          - id: t5
            npc: { speaker: "Ana", es: "Cuéntamelo todo, de principio a fin.", audioText: "cuéntamelo todo, de principio a fin.", gloss: "Tell me the whole thing, start to finish." }
            goal: "Narrate the whole memory, start to finish."
            reply:
              mode: build
              tiles: ["de", "niños", "vivíamos", "aquí", "siempre", "hacía", "mucho", "frío", "por", "eso", "salíamos", "poco", "vivían", "salían"]
              answer: "de niños vivíamos aquí siempre hacía mucho frío por eso salíamos poco"
            replyGloss: "As children, we used to live here; it was always very cold, that's why we didn't go out much."
            explanation: "The whole module in one line: «vivíamos», «hacía frío», «salíamos» — three families, one voice — closed with PRIOR «por eso» (m25) giving the result."
