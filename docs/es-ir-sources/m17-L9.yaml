  # ── L9 · «Todos los días» — ZERO new atoms. Consolidation: mixed persons,
  #    every verb, the pair in questions and answers, two sims. No card
  #    (nothing new to say). Recalls licensed by L2/L5/L6 wins. Selection
  #    runs peak at 2; cloze share 3/19.
  - n: 9
    template: free
    title: "Todos los días"
    description: "The routine, asked and answered. Ana wants the whole day from you; Diego wants to compare weekends."
    steps:
      - kind: map
        id: l9-map-todoslosdias
        tokens: ["todos", "los", "días", "me", "levanto", "temprano"]
        pairs:
          - { en: "every", tokenIndex: 0 }
          - { en: "the", tokenIndex: 1 }
          - { en: "days", tokenIndex: 2 }
          - { en: "myself", tokenIndex: 3 }
          - { en: "I get up", tokenIndex: 4 }
          - { en: "early", tokenIndex: 5 }
        audioText: "todos los días me levanto temprano"
        revealNote: "«todos los días» — every day — from module ten, up front like «siempre». The pair behind it does not change."
      - kind: speakLit
        id: l9-sp-todoslosdias
        es: "todos los días me levanto temprano"
        en: "Every day I get up early"
        atoms: ["todos los días", "levanto", "temprano"]
      - kind: clozeLit
        id: l9-c-anasedespierta
        es: "todos los días Ana se despierta tarde"
        en: "Every day Ana wakes up late"
        blank: "despierta"
        options: ["despierta", "despierto", "despertarse"]
        atoms: ["todos los días", "despierta", "tarde"]
        why: "«se» is there, so the -a ending: «despierta»."
      - kind: audioWimcq
        id: l9-ear-acostarse
        target: { surface: "acostarse", emoji: "😴" }
        distractors:
          - { surface: "levantarse", emoji: "🧍" }
          - { surface: "despertarse", emoji: "⏰" }
      - kind: buildLit
        id: l9-b-teduchasydespues
        also: ["te duchas y te levantas temprano"]
        es: "te levantas y te duchas temprano"
        en: "You get up and you shower early"
        atoms: ["levantas", "duchas", "temprano"]
        tiles: ["me", "se"]
      - kind: sim
        id: l9-sim-ana-eldia
        scene: { emoji: "📝", title: "Ana wants your whole day", setting: "Ana is writing something for class about how her friends live, and you are the friend." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Te despiertas temprano?", audioText: "¿te despiertas temprano?", gloss: "Do you wake up early?" }
            goal: "Say you always wake up early."
            reply:
              mode: build
              tiles: ["siempre", "me", "despierto", "temprano", "se", "despierta"]
              answer: "siempre me despierto temprano"
              alsoAccepted: ["me despierto temprano siempre"]
            replyGloss: "I always wake up early."
            explanation: "«siempre» outside, then «me despierto». The bank's «se despierta» is somebody else's morning."
          - id: t2
            npc: { speaker: "Ana", es: "¿Y te duchas todos los días?", audioText: "¿y te duchas todos los días?", gloss: "And do you shower every day?" }
            goal: "Say yes, you shower every day."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, me ducho todos los días" }
                - { id: "wrong1", text: "sí, te duchas todos los días" }
                - { id: "wrong2", text: "sí, ducho todos los días" }
              correctOptionId: "right"
              audioText: "sí, me ducho todos los días"
            replyGloss: "Yes, I shower every day."
            explanation: "Ana asked with «te duchas»; you answer with «me ducho». Bare «ducho» has lost its pointer."
          - id: t3
            npc: { speaker: "Ana", es: "¿Te acuestas tarde?", audioText: "¿te acuestas tarde?", gloss: "Do you go to bed late?" }
            goal: "Say no, you never go to bed late."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no, nunca me acuesto tarde" }
                - { id: "wrong1", text: "no, me nunca acuesto tarde" }
                - { id: "wrong2", text: "no, nunca se acuesta tarde" }
              correctOptionId: "right"
              audioText: "no, nunca me acuesto tarde"
            replyGloss: "No, I never go to bed late."
            explanation: "«nunca» outside the pair, «me acuesto» intact."
      # Printed non-recall at L2 (es-m17-2-l2-sp-win).
      - kind: speakLit
        id: l9-sp-recall-meduchotemprano
        es: "me ducho temprano, pero Diego se ducha tarde"
        en: "I shower early, but Diego showers late"
        atoms: []
        cue: recall
      - kind: listenCompLit
        id: l9-lc-luisnuncaselava
        es: "Luis nunca se lava los dientes temprano"
        en: "Luis never brushes his teeth early."
        atoms: ["nunca", "lava", "dientes", "temprano"]
        distractorsEn:
          - "Luis always brushes his teeth early."
          - "Luis never showers early."
          - "I never brush my teeth early."
      - kind: clozeLit
        id: l9-c-mellamosam
        es: "yo me llamo Sam"
        en: "My name is Sam"
        blank: "me"
        options: ["me", "se"]
        atoms: ["me llamo"]
        why: "«yo» and «llamo» both say I, so the pointer is «me»."
      - kind: listenBuildLit
        id: l9-lb-sequiereacostar
        es: "Ana se quiere levantar tarde hoy"
        en: "Ana wants to get up late today"
        atoms: ["quiere", "levantar", "tarde", "hoy"]
        tiles: ["me", "quiero"]
      - kind: textMcq
        id: l9-tm-lava
        target: "lava"
        distractors: ["lavo", "lavarse", "levanta"]
      - kind: speakLit
        id: l9-sp-nomequieroduchar
        es: "hoy no me quiero duchar"
        en: "Today I don't want to shower"
        atoms: ["hoy", "quiero", "duchar"]
      - kind: buildLit
        id: l9-b-miabuelaseacuesta
        es: "mi abuela se acuesta temprano todos los días"
        en: "My grandmother goes to bed early every day"
        atoms: ["abuela", "acuesta", "temprano", "todos los días"]
        tiles: ["me", "acuesto"]
      - kind: mcq
        id: l9-q-sellama
        prompt: "Which one means 'he wants to get up'?"
        correct: "se quiere levantar"
        distractors: ["quiere se levantar", "se quiere levanta", "me quiere levantar"]
        atoms: ["quiere", "levantar"]
        why: "A he: «se», in front of «quiere», the verb that carries the person; «levantar» stays bare."
      - kind: audioWimcq
        id: l9-ear-ducharse
        target: { surface: "ducharse", emoji: "🚿" }
        distractors:
          - { surface: "los dientes", emoji: "🦷" }
          - { surface: "acostarse", emoji: "😴" }
      # Printed non-recall at L5 (es-m17-5-l5-sp-win).
      - kind: speakLit
        id: l9-sp-recall-medespierto
        es: "me despierto temprano, pero no me levanto"
        en: "I wake up early, but I don't get up"
        atoms: []
        cue: recall
      - kind: clozeLit
        id: l9-c-tetelevantas
        es: "tú te levantas muy tarde"
        en: "You get up very late"
        blank: "te"
        options: ["te", "se"]
        atoms: ["levantas", "tarde"]
        why: "«tú» and «levantas» say you, so «te»."
      - kind: matchLit
        id: l9-match
        pairs:
          - { source: "todos los días", target: "every day" }
          - { source: "me despierto", target: "I wake up" }
          - { source: "te duchas", target: "you shower" }
          - { source: "se acuesta", target: "he or she goes to bed" }
          - { source: "nunca me acuesto tarde", target: "I never go to bed late" }
          - { source: "se quiere levantar", target: "he or she wants to get up" }
          - { source: "¿cómo se llama?", target: "what is his or her name?" }
      - kind: sim
        id: l9-sim-diego-findesemana
        scene: { emoji: "🌳", title: "Diego on the weekend", setting: "Diego insists weekends are for sleeping. He wants to know if you agree." }
        turns:
          - id: t1
            npc: { speaker: "Diego", es: "El sábado me levanto muy tarde. ¿Y tú?", audioText: "el sábado me levanto muy tarde. ¿y tú?", gloss: "On Saturday I get up very late. And you?" }
            goal: "Say you get up late too."
            reply:
              mode: build
              tiles: ["me", "levanto", "tarde", "también", "se", "levanta"]
              answer: "me levanto tarde también"
              alsoAccepted: ["también me levanto tarde"]
            replyGloss: "I get up late too."
            explanation: "Your Saturday: «me levanto». «también» goes outside the pair."
          - id: t2
            npc: { speaker: "Diego", es: "¿Y te duchas el sábado?", audioText: "¿y te duchas el sábado?", gloss: "And do you shower on Saturday?" }
            goal: "Say you don't want to shower on Saturday."
            reply:
              mode: choice
              options:
                - { id: "right", text: "no me quiero duchar el sábado" }
                - { id: "wrong1", text: "no quiero me duchar el sábado" }
                - { id: "wrong2", text: "no me quiero ducho el sábado" }
              correctOptionId: "right"
              audioText: "no me quiero duchar el sábado"
            replyGloss: "I don't want to shower on Saturday."
            explanation: "«no» outside, «me» in front of «quiero», «duchar» bare."
          - id: t3
            npc: { speaker: "Diego", es: "Ana se acuesta a las diez. ¿Y tú?", audioText: "ana se acuesta a las diez. ¿y tú?", gloss: "Ana goes to bed at ten. And you?" }
            goal: "Say you go to bed late."
            reply:
              mode: choice
              options:
                - { id: "right", text: "me acuesto tarde" }
                - { id: "wrong1", text: "se acuesta tarde" }
                - { id: "wrong2", text: "me acosto tarde" }
              correctOptionId: "right"
              audioText: "me acuesto tarde"
            replyGloss: "I go to bed late."
            explanation: "About yourself, with the o opened into ue: «me acuesto». «se acuesta» is Ana; «me acosto» forgot the change."

