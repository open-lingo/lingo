# Unlike m32's clothing nouns (which WERE the direct object of `comprarlo`/
# `comprarla`/`comprarlos`), none of this module's five nouns can
# grammatically fill that slot — you cannot "comprarlo" a bank, pharmacy,
# hospital, post office, or supermarket. The fused-clitic family still
# reaches this module, correctly, through `supermercado` as the shopping
# DESTINATION for an already-PRIOR object noun bought there: "necesito
# leche (m11) — voy al supermercado a comprarla." Do not force a fused
# clitic directly onto any of this module's own five atoms; that would be
# a category error the gates will not catch (the surface itself is simply
# never generated, not flagged), so this is a drafting-discipline note,
# not a gate trap.
#
# ── THE «voy a» / «necesito» / «tengo que» THREE-FRAME RECOMBINATION —
#    read before drafting any lesson ──────────────────────────────────────
# Three independently PRIOR frames reach every one of this module's five
# nouns with zero new grammar: (1) bare motion, m9 — «voy al banco» /
# «vas a la farmacia» (simplest, best for L1–L5 debuts). (2) need + go,
# m16 + m28 — «necesito ir al hospital» (uses `ir`, the bare infinitive
# m28 already registered for exactly this "modal + infinitive" slot,
# NEVER the conjugated `voy`/`va` after `necesito` — «necesito voy» is
# ungrammatical). (3) obligation + go, m33 + m28 — «tengo que ir al
# correo» (same `ir` infinitive, now after the freshest grammar this
# course has). All three frames should appear across the module (see
# lesson plan below); do not let (1) crowd out (2)/(3) — the whole point
# of placing this break immediately after m33 is to recombine it while it
# is freshest.
#
# ── ONE STRUCTURAL NOTE, NOT A NEW ATOM: «ir» after «necesito»/«tengo
#    que», never a conjugated form ────────────────────────────────────────
# `ir` (m28, bare infinitive) is the ONLY legal form after `necesito`/
# `tengo que` in this module's own sentences — `voy`/`vas` (m9) are
# CONJUGATED forms and may only follow a subject directly, never another
# verb. A learner transfer error to guard against, structurally identical
# to m33's own "dropped «que»" foil: reaching for *"necesito voy al banco"
# or *"tengo que voy a la farmacia" (conjugating the second verb instead
# of leaving it bare). This is not new content to teach from scratch —
# m14's «puedo trabajar»/«quiero trabajar» and m28's own «voy a
# trabajar» already established "the second verb never conjugates" as a
# standing course rule — but it is the natural foil for this module's own
# discrimination steps mixing `ir` in with five brand-new nouns. Include
# at least one distractor of this shape in a mixed-review step (L6 or
# L8), never as a correct answer.
#
