              options:
                - { id: "right", text: "voy al garaje" }
                - { id: "wrong1", text: "voy a el garaje" }
                - { id: "wrong2", text: "voy a la garaje" }
              correctOptionId: "right"
              audioText: "voy al garaje"
            replyGloss: "I'm going to the garage."
            explanation: "«al», not «a el» — «a» plus «el» always fuses. «garaje» is masculine."
          - id: t2
            npc: { speaker: "Miguel", es: "¿Está cerca del jardín?", audioText: "¿está cerca del jardín?", gloss: "Is it close to the garden?" }
