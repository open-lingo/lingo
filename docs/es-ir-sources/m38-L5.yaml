        scene: { emoji: "🔧", title: "Miguel needs the car", setting: "Miguel is heading out and needs his car from the garage." }
        turns:
          - id: t1
            npc: { speaker: "Miguel", es: "¿Adónde vas?", audioText: "¿adónde vas?", gloss: "Where are you going?" }
