          - { source: "voy", target: "I'm going" }
          - { source: "al", target: "to the" }
          - { source: "carro", target: "car" }
          - { source: "bicicleta", target: "bicycle" }
          - { source: "jardín", target: "garden" }
      - kind: speakLit
        id: l5-sp-win
        es: "voy al garaje por mi bicicleta"
        en: "I'm going to the garage for my bicycle"
        atoms: ["voy", "al", "garaje", "bicicleta"]
