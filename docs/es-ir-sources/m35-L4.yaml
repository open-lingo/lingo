        atoms: ["hay", "una", "farmacia", "cerca", "pero", "el", "hospital", "está", "lejos"]
      - kind: buildLit
        id: l4-b-elbancoestaalladodelafarmacia
        es: "el banco está al lado de la farmacia"
        en: "The bank is beside the pharmacy"
        atoms: ["el", "banco", "está", "al", "lado", "de", "la", "farmacia"]
        tiles: ["del", "es"]
      - kind: clozeLit
        id: l4-c-elhospitalestaalladodelcorreo
        es: "el hospital está al lado del correo"
        en: "The hospital is beside the post office"
        blank: "del"
        options: ["del", "de la"]
        atoms: ["el", "hospital", "está", "al", "lado", "correo"]
        why: "«correo» is masculine — «del» (de+el, fused). «de la» is for feminine nouns like «farmacia»."
      - kind: listenCompLit
        id: l4-lc-lafarmaciaestaalladodelhospital
        es: "la farmacia está al lado del hospital"
        en: "The pharmacy is beside the hospital."
        atoms: ["la", "farmacia", "está", "al", "lado", "hospital"]
