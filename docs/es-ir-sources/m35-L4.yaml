  # ── L4 · «La farmacia está al lado del banco» — «lado» debuts. No
  #    imageMcq — a photo of "a side" reads as arbitrary, not
  #    disambiguating (§13.1). «al lado de» is built COMPOSITIONALLY from
  #    already-free «al»/«de»/«del» (ES_FUNCTION_WORDS) + this one
  #    registered noun — NOT its own idiom-phrase atom. THE ATOMS: CREDIT
  #    TRAP: «del» is NOT a registered atom (only «de» is, m2) — never put
  #    «del» in an atoms: array, even though it's legal, scope-checked
  #    text everywhere else. Gender-article discrimination: «del» (de+el,
  #    masculine) vs «de la» (feminine, never fused) across m34's 5
  #    places. PRIOR context only: cerca/lejos/hay (this module), está/es
  #    (m4/m2), al/a/de (m9/m2), banco/farmacia/hospital/correo/
  #    supermercado (m34), necesito (m16), viejo (m6). One recall (L3's
  #    win line).
  - n: 4
    template: free
    title: "La farmacia está al lado del banco"
    description: "«lado» — side. «al lado de» = beside — «al» + «lado» + «de», all pieces you already have. «del» (de+el, masculine) vs «de la» (feminine, never fused) — the same fusion rule as «al»/«a la» (m9)."
    steps:
      - kind: map
        id: l4-map-lafarmaciaestaalladodelbanco
        tokens: ["la", "farmacia", "está", "al", "lado", "del", "banco"]
        pairs:
          - { en: "the", tokenIndex: 0 }
          - { en: "pharmacy", tokenIndex: 1 }
          - { en: "is", tokenIndex: 2 }
          - { en: "at the", tokenIndex: 3 }
          - { en: "side", tokenIndex: 4 }
          - { en: "of the", tokenIndex: 5 }
          - { en: "bank", tokenIndex: 6 }
        audioText: "la farmacia está al lado del banco"
        revealNote: "«lado» — side, a regular masculine noun. «del» = de + el, fused — «banco» is masculine, same fusion rule as «al» (m9)."
      - kind: info
        id: l4-info-lado
        title: "Lado — side"
        body: "«lado» — side, a regular masculine noun. «al lado de» = beside, built from pieces you already have: «al» + «lado» + «de». «la farmacia está al lado del banco»."
      - kind: speakLit
        id: l4-sp-recall
        es: "hay una farmacia cerca, pero el hospital está lejos"
        en: "There's a pharmacy close by, but the hospital is far"
