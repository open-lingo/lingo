        distractors: ["a lado", "en lado", "el lado"]
        atoms: ["al", "lado"]
        why: "«lado» is masculine, so it's always «al lado» — never a bare «el», never the wrong preposition."
      - kind: buildLit
        id: l4-b-elhospitalestaalladodelbancoperolafarmaciaestalejos
        es: "el hospital está al lado del banco, pero la farmacia está lejos"
        en: "The hospital is beside the bank, but the pharmacy is far"
