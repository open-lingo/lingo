        es: "voy al supermercado"
        en: "I'm going to the supermarket"
        blank: "al"
        options: ["al", "el"]
        atoms: ["voy", "supermercado"]
        why: "«supermercado» is masculine — «al» (fused «a» + «el»), never the bare «el» alone."
