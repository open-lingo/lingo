  #    mañana (m8), mercado/tienda/escuela/parque (m9), farmacia/
  #    hospital/correo (this module). One recall (L3's win line).
  - n: 4
    template: free
    title: "Necesito leche — voy al supermercado"
    description: "«supermercado» — masculine, regular, and NOT «mercado» (m9) — a different, bigger place, its own emoji. First pairing with the comprarlo-family (m29): «necesito leche — voy al supermercado a comprarla»."
    steps:
      - kind: map
        id: l4-map-voyalsupermercado
        tokens: ["voy", "al", "supermercado"]
