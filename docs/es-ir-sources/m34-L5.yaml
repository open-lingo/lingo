        id: l5-agr-correoviejofarmaciavieja
        en: "The post office is old, and the pharmacy is old too"
        audioText: "el correo es viejo, y la farmacia es vieja también"
        atoms: ["correo", "viejo", "farmacia"]
        segments:
          - { text: "el correo es " }
          - { blank: { id: "p1", answer: "viejo", options: ["viejo", "vieja"] } }
          - { text: ", y la farmacia es " }
          - { blank: { id: "p2", answer: "vieja", options: ["vieja", "viejo"] } }
      - kind: listenBuildLit
        id: l5-lb-voyalbancoperopuedoiralcorreo
        es: "voy al banco, pero puedo ir al correo mañana"
        en: "I'm going to the bank, but I can go to the post office tomorrow"
        atoms: ["voy", "al", "banco", "pero", "puedo", "ir", "correo", "mañana"]
        tiles: ["necesito", "tengo que"]
      - kind: textMcq
        id: l5-tm-farmacia
        target: "farmacia"
        distractors: ["fábrica", "familia", "farmacéutico"]
      - kind: sim
        id: l5-sim-sam-mandados
        scene: { emoji: "🚶", title: "Sam checks your errand list", setting: "Sam wants to know your plan for today." }
        turns:
          - id: t1
            npc: { speaker: "Sam", es: "¿Adónde vas hoy?", audioText: "¿adónde vas hoy?", gloss: "Where are you going today?" }
            goal: "Say you're going to the bank, then pharmacy."
            reply:
              mode: choice
              options:
                - { id: "right", text: "voy al banco, y a la farmacia" }
                - { id: "wrong1", text: "voy a la banco, y al farmacia" }
                - { id: "wrong2", text: "voy al banco, y al farmacia" }
              correctOptionId: "right"
              audioText: "voy al banco, y a la farmacia"
            replyGloss: "I'm going to the bank, and the pharmacy."
            explanation: "«banco» masculine → «al»; «farmacia» feminine → «a la» — never swapped."
          - id: t2
            npc: { speaker: "Sam", es: "¿Y necesitas ir al supermercado también?", audioText: "¿y necesitas ir al supermercado también?", gloss: "And do you need to go to the supermarket too?" }
            goal: "Say yes, you need milk."
            reply:
              mode: build
              tiles: ["sí", "necesito", "leche", "también", "voy", "tengo que"]
              answer: "sí necesito leche también"
            replyGloss: "Yes, I need milk too."
            explanation: "«necesito leche» — the reason you're headed to the supermarket."
      - kind: matchLit
        id: l5-match
        pairs:
          - { source: "banco", target: "bank" }
          - { source: "farmacia", target: "pharmacy" }
          - { source: "hospital", target: "hospital" }
          - { source: "correo", target: "post office" }
          - { source: "supermercado", target: "supermarket" }
          - { source: "al", target: "to the (masculine)" }
      - kind: speakLit
        id: l5-sp-win
        es: "voy al banco, a la farmacia, y al supermercado"
        en: "I'm going to the bank, the pharmacy, and the supermarket"
        atoms: ["voy", "al", "banco", "a", "la", "farmacia", "supermercado"]
