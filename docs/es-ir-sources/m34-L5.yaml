  # ── L5 · «Voy al banco, a la farmacia, y al supermercado» — no new
  #    atoms. Pure cumulative recombination of all five nouns debuted
  #    L1-L4, discrimination-heavy (masc «al» × banco/hospital/correo/
  #    supermercado vs fem «a la» × farmacia, tested against each
  #    other, not just against m9's old set). No info card — nothing
  #    new to teach, just density. PRIOR context only: voy/al/a (m9),
  #    necesito/necesitas (m16), ir (m28), pero/puedo (m18/m14),
  #    también (m11), mañana/hoy (m8/m9), leche (m7), y (m1), viejo
  #    (m32), all five of this module's nouns (L1-L4). One recall
  #    (L4's win line).
  - n: 5
    template: free
    title: "Voy al banco, a la farmacia, y al supermercado"
    description: "An errand-day sentence, all five places at once — pure recombination, no new words. «al» for banco/hospital/correo/supermercado (masculine), «a la» for farmacia (feminine)."
    steps:
      - kind: map
        id: l5-map-voyalbancoyalafarmacia
        tokens: ["voy", "al", "banco", "y", "a", "la", "farmacia"]
        pairs:
          - { en: "I'm going", tokenIndex: 0 }
          - { en: "to the", tokenIndex: 1 }
          - { en: "bank", tokenIndex: 2 }
          - { en: "and", tokenIndex: 3 }
          - { en: "to", tokenIndex: 4 }
          - { en: "the", tokenIndex: 5 }
          - { en: "pharmacy", tokenIndex: 6 }
        audioText: "voy al banco y a la farmacia"
        revealNote: "Cumulative recombination — «al» for masculine «banco», «a la» for feminine «farmacia» (this module, L1-L4)."
      - kind: speakLit
        id: l5-sp-recall
        es: "necesito leche — voy al supermercado a comprarla"
        en: "I need milk — I'm going to the supermarket to buy it"
        cue: recall
        atoms: ["necesito", "leche", "voy", "al", "supermercado", "a", "comprarla"]
      - kind: buildLit
        id: l5-b-voyalhospitalyalcorreo
        es: "voy al hospital y al correo hoy"
        en: "I'm going to the hospital and the post office today"
        atoms: ["voy", "al", "hospital", "y", "correo", "hoy"]
        tiles: ["necesito", "tengo que"]
      - kind: clozeLit
        id: l5-c-necesitoiralcorreo
        es: "necesito ir al correo"
        en: "I need to go to the post office"
        blank: "al"
        options: ["al", "el"]
        atoms: ["necesito", "ir", "correo"]
        why: "«correo» is masculine — «al» (fused «a» + «el»), never the bare «el» alone."
      - kind: listenCompLit
        id: l5-lc-voyalbanconecesitofarmacia
        es: "voy al banco, y necesito ir a la farmacia también"
        en: "I'm going to the bank, and I need to go to the pharmacy too."
        atoms: ["voy", "al", "banco", "y", "necesito", "ir", "a", "la", "farmacia", "también"]
        distractorsEn:
          - "I'm going to the pharmacy, and I need to go to the bank too."
          - "I'm going to the bank, and I need to go to the hospital too."
          - "I need to go to the bank, and I'm going to the pharmacy too."
      - kind: mcq
        id: l5-q-voyalhospitalyalcorreo
        prompt: "Which one correctly says 'to the post office'?"
        correct: "al correo"
        distractors: ["a la correo", "el correo", "a el correo"]
        atoms: ["al", "correo"]
        why: "«correo» is masculine — «al» (fused), never «a la», a bare «el», or the unfused «a el»."
      - kind: buildLit
        id: l5-b-necesitoiralbancoytambienvoyalsupermercado
        es: "necesito ir al banco, y también voy al supermercado"
        en: "I need to go to the bank, and I'm also going to the supermarket"
        atoms: ["necesito", "ir", "al", "banco", "y", "también", "voy", "supermercado"]
        tiles: ["puedo", "tengo que"]
      - kind: audioWimcq
        id: l5-ear-banco
        target: { surface: "banco", emoji: "🏦" }
        distractors:
          - { surface: "correo", emoji: "📮" }
          - { surface: "hospital", emoji: "🏥" }
