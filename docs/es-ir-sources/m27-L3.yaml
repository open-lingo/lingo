  # ── L3 · «Hay viento y nieve» — el viento AND la nieve debut, both on
  #    imageMcq, both taught as NOUNS with PRIOR «hay» (not «nieva» —
  #    unregistered, deliberately not manufactured). Recombines PRIOR
  #    mucho/mucha gender agreement (m13/m18: «mucha hambre») onto this
  #    module's own masculine/feminine pair. Carries one recall of L2's win
  #    line.
  - n: 3
    template: free
    title: "Hay viento y nieve"
    description: "Two new nouns at once, same PRIOR «hay» pattern: «hay mucho viento» (masculine), «hay mucha nieve» (feminine) — the same mucho/mucha agreement you already use (m13/m18)."
    steps:
      - kind: map
        id: l3-map-haymuchoviento
        tokens: ["hay", "mucho", "viento"]
        pairs:
          - { en: "there is", tokenIndex: 0 }
          - { en: "a lot of", tokenIndex: 1 }
          - { en: "wind", tokenIndex: 2 }
        audioText: "hay mucho viento"
        revealNote: "«el viento» — the wind, masculine, so «mucho viento» — the same agreement you already use (m13/m18: «mucha hambre»)."
      - kind: imageMcq
        id: l3-im-viento
        target: { surface: "el viento", meaningEn: "the wind", emoji: "💨" }
        distractors:
          - { surface: "la playa", emoji: "🏖️" }
          - { surface: "el museo", emoji: "🏛️" }
          - { surface: "la escuela", emoji: "🏫" }
      - kind: speakLit
        id: l3-sp-haymuchovientohoy
        es: "hay mucho viento hoy"
        en: "It's very windy today"
        atoms: ["hay", "mucho", "el viento", "hoy"]
      - kind: imageMcq
        id: l3-im-nieve
        target: { surface: "la nieve", meaningEn: "the snow", emoji: "❄️" }
        distractors:
          - { surface: "el parque", emoji: "🌳" }
          - { surface: "la tienda", emoji: "🏪" }
          - { surface: "el cine", emoji: "🎬" }
      - kind: buildLit
        id: l3-b-tambienhaynievemexico
        es: "también hay nieve en México"
        en: "There's also snow in Mexico"
        atoms: ["también", "hay", "la nieve", "México"]
        tiles: ["estaba", "hace"]
      - kind: clozeLit
        id: l3-c-diegolegustanieve
        es: "a Diego le gusta la nieve"
        en: "Diego likes the snow"
        blank: "le"
        options: ["le", "te"]
        atoms: ["le", "gusta", "la nieve"]
        why: "«le» — talking about Diego (PRIOR, m13). «te» would talk to you instead."
      - kind: listenCompLit
        id: l3-lc-vientoynievemucha
        es: "hay mucho viento y mucha nieve"
        en: "It's very windy and there's a lot of snow."
        atoms: ["hay", "mucho", "el viento", "mucho", "la nieve"]
        distractorsEn:
          - "There was a lot of wind and a lot of snow."
          - "It's very windy, but there's no snow."
          - "There's a little wind and a little snow."
      - kind: mcq
        id: l3-q-elviento
        prompt: "Which one means 'the wind'?"
        correct: "el viento"
        distractors: ["la nieve", "el sol", "la lluvia"]
        atoms: ["el viento"]
        why: "«el viento» is the wind. «la nieve»/«el sol»/«la lluvia» are all other weather words from this module."
      # Printed non-recall at L2 (es-m27-2-l2-sp-win).
      - kind: speakLit
        id: l3-sp-recall-l2win
        es: "hay lluvia hoy, y no me gusta la lluvia"
        en: "It's raining today, and I don't like the rain"
        atoms: []
        cue: recall
      - kind: audioWimcq
        id: l3-ear-cine
        target: { surface: "el cine", emoji: "🎬" }
        distractors:
          - { surface: "la tienda", emoji: "🏪" }
          - { surface: "el parque", emoji: "🌳" }
      - kind: agreementLit
        id: l3-agr-muchovientomuchanieve
        en: "There's a lot of wind, and there's a lot of snow"
        audioText: "hay mucho viento, y hay mucha nieve"
        atoms: ["hay", "mucho", "el viento", "la nieve"]
        segments:
          - { text: "hay " }
          - { blank: { id: "p1", answer: "mucho", options: ["mucho", "mucha"] } }
          - { text: " viento, y hay " }
          - { blank: { id: "p2", answer: "mucha", options: ["mucha", "mucho"] } }
          - { text: " nieve" }
      - kind: listenBuildLit
        id: l3-lb-samlegustanieve
        es: "a Sam le gusta la nieve"
        en: "Sam likes the snow"
        atoms: ["le", "gusta", "la nieve"]
        tiles: ["gustan", "hay"]
      - kind: textMcq
        id: l3-tm-viento
        target: "el viento"
        distractors: ["son", "muy", "hay"]
      - kind: sim
        id: l3-sim-ana-viento-nieve
        scene: { emoji: "💨", title: "Ana talks about wind and snow", setting: "Ana wants to know what the weather is like where you are." }
        turns:
          - id: t1
            npc: { speaker: "Ana", es: "¿Hay mucho viento?", audioText: "¿hay mucho viento?", gloss: "Is it very windy?" }
            goal: "Say yes, and there's snow too."
            reply:
              mode: build
              tiles: ["sí", "y", "también", "hay", "nieve", "mucha"]
              answer: "sí y también hay nieve"
            replyGloss: "Yes, and there's also snow."
            explanation: "«también» adds the second thing — «hay nieve» stays impersonal, just like «hay viento»."
          - id: t2
            npc: { speaker: "Ana", es: "¿Te gusta la nieve?", audioText: "¿te gusta la nieve?", gloss: "Do you like the snow?" }
            goal: "Say yes, you like the snow a lot."
            reply:
              mode: choice
              options:
                - { id: "right", text: "sí, me gusta mucho la nieve" }
                - { id: "wrong1", text: "sí, te gusta mucho la nieve" }
                - { id: "wrong2", text: "sí, me gustan mucho la nieve" }
              correctOptionId: "right"
              audioText: "sí, me gusta mucho la nieve"
            replyGloss: "Yes, I like the snow a lot."
            explanation: "Talking about yourself: «me gusta», not «te gusta». «la nieve» is one thing, so «gusta», never «gustan»."
          - id: t3
            npc: { speaker: "Ana", es: "¿Y a Diego? ¿Le gusta el viento?", audioText: "¿y a diego? ¿le gusta el viento?", gloss: "And Diego? Does he like the wind?" }
            goal: "Say no, Diego doesn't like the wind."
            reply:
              mode: build
              tiles: ["no", "a", "diego", "no", "le", "gusta", "el", "viento", "te"]
              answer: "no a diego no le gusta el viento"
            replyGloss: "No, Diego doesn't like the wind."
            explanation: "«a Diego no le gusta» — the PRIOR (m13) pattern, negated."
      - kind: matchLit
        id: l3-match
        pairs:
          - { source: "el viento", target: "the wind" }
          - { source: "la nieve", target: "the snow" }
          - { source: "mucho", target: "a lot (masculine)" }
          - { source: "mucha", target: "a lot (feminine)" }
          - { source: "también", target: "also, too" }
          - { source: "hay", target: "there is, there are" }
      - kind: speakLit
        id: l3-sp-win
        es: "hay mucho viento, y también hay nieve"
        en: "It's very windy, and there's also snow"
        atoms: ["hay", "mucho", "el viento", "también", "la nieve"]
