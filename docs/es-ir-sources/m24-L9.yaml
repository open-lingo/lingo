  - n: 9
    template: free
    title: "Hoy hago, pero de niño hacía"
    description: "The five families, side by side with the present tense that's already PRIOR — «hoy» pulls present, «de niño» pulls imperfect. No new grammar, just the full contrast."
    steps:
      - kind: map
        id: l9-map-hoyhagoperodeninohacia
        tokens: ["hoy", "hago", "la", "tarea,", "pero", "de niño", "hacía", "mucho", "trabajo"]
        pairs:
          - { en: "today", tokenIndex: 0 }
          - { en: "I do", tokenIndex: 1 }
          - { en: "the", tokenIndex: 2 }
          - { en: "homework,", tokenIndex: 3 }
          - { en: "but", tokenIndex: 4 }
          - { en: "as a child,", tokenIndex: 5 }
          - { en: "I used to do", tokenIndex: 6 }
          - { en: "a lot of", tokenIndex: 7 }
          - { en: "work", tokenIndex: 8 }
        audioText: "hoy hago la tarea, pero de niño hacía mucho trabajo"
        revealNote: "«hoy» pulls the present, PRIOR «hago» (m15). «de niño» pulls the imperfect, this module's «hacía». Same verb, same person — only the time marker changes the form."
      - kind: info
        id: l9-info-hoyvsdenino
        title: "Hoy vs. de niño — the whole contrast"
        body: "«hoy» + present (PRIOR «hago», «quiero», «puedo», «viene»...) is now. «de niño» + imperfect («hacía», «quería», «podía», «venía»...) is the repeated past. «hoy hago la tarea, pero de niño hacía mucho trabajo» — same verb, only the time marker changes the form."
      - kind: speakLit
        id: l9-sp-hoyestadeninoestaba
        es: "hoy está en casa, pero de niño estaba en la escuela"
        en: "Today he's at home, but as a child he was at school"
        atoms: ["está", "estaba", "casa", "escuela"]
      - kind: buildLit
        id: l9-b-hoyhacesdeninohacias
        es: "hoy haces la tarea en casa, pero de niño la hacías en la escuela"
        en: "Today you (tú) do homework at home, but as a child you did it at school"
        atoms: ["haces", "hacías", "tarea", "casa", "escuela"]
        tiles: ["hace", "hacía"]
      - kind: speakLit
        id: l9-sp-hoyquieredeninoqueria
        es: "hoy quiere ir al cine, pero de niño no quería"
        en: "Today he wants to go to the movies, but as a child he didn't"
        atoms: ["quiere", "quería", "cine"]
      - kind: clozeLit
        id: l9-c-hoypuedodeninopodia
        es: "hoy puedo venir, pero de niño no podía"
        en: "Today I can come, but as a child I couldn't"
        blank: "podía"
        options: ["podía", "podíamos", "podían"]
        atoms: ["puedo", "podía", "venir"]
        why: "«de niño» flags the past habitual, one person: «podía». «podíamos» would wrongly include others; «podían» is the wrong person too."
      - kind: listenCompLit
        id: l9-lc-hoyvienedeninonovenia
        es: "hoy viene a la escuela, pero de niño no venía"
        en: "Today he comes to school, but as a child he didn't."
        atoms: ["viene", "venía", "escuela"]
        distractorsEn:
