          - "Today he comes to school, and as a child he did too."
          - "Today they come to school, but as a child they didn't."
      - kind: mcq
        id: l9-q-hoyvsdenino
        prompt: "Which one pairs 'today' with the right tense?"
        correct: "hoy quiere ir"
        distractors: ["de niño quería ir", "de niño no quería", "hoy no quería"]
        atoms: ["quiere"]
        why: "«hoy» signals now — present «quiere». The others either use «de niño» (past) or wrongly pair «hoy» with the imperfect."
