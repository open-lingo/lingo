  found: 2026-08-09
  source: mobile-pass-2026-08-09
  detail: >
    On an iPhone SE the learner has to scroll inside a conjugation step that is
    supposed to fit. CLAUDE.md's lesson rule is that the window never scrolls
    during a lesson and the step container is the only scroll area; a step
    overflowing its OWN scroller is the failure that rule exists to prevent.
  evidence: >
    scrollHeight - clientHeight = 110px at 375x667. The short-viewport density
    block added the same day (src/index.css, `@media (max-height: 700px)`)
    moved it 112 -> 110 — that near-zero response is the tell: the height is
    structural, not padding. Every other step type answered the same block by
    16-160px. 0px at 412x915 and 430x932, so this is short phones only.
  fix: >
    Give ConjugationTransformStepView a container-relative vertical budget
    (cqh against the stage, minus `--stage-tail`) the way the MCQ grids do,
    instead of stacked fixed blocks. NOT by shrinking the tail — measured,
    that buys ~6px here and costs the dead zone everywhere (see B098).

