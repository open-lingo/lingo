- id: B058
  title: contracted paradigms outside ChainForm never kanji-fy on build tiles, so m28's verbs all fall back to kana
  status: open
  severity: major
  effort: M
  confidence: verified
  area: engine
  tags: [module/m28, step/build_sentence, system/kanji, class/paradigm-not-modelled]
  found: 2026-07-28
  source: spencer-play
  blocked_by: [B019]
  detail: >
    `inflectedTileKanjiMap` enumerates a verb's kanji surfaces by walking
    ChainForm, so any paradigm the conjugation engine does not model is
    invisible to it and its tiles stay kana. m28 IS the なきゃ module, so
    every verb tile in it loses the kanji it would carry in any other form —
    the learner's kanji exposure silently switches off for a whole module.
  evidence: >
    Probe at moduleIndex 28: のむ→飲む, のみます→飲みます, のまない→飲まない,
    のんだ→飲んだ, たべる→食べる, いく→行く, いかない→行かない — but
    のまなきゃ, のまなければ, いかなきゃ, たべなきゃ all resolve to kana.
    m28 tile set: いかなきゃ, おぼえなきゃ, かえらなきゃ, しなきゃ, たべなきゃ,
    のまなきゃ, はたらかなきゃ. A substring scan finds 169 tiles course-wide in
    なきゃ/なければ/ている/たり/すぎ/じゃない shapes (over-counted — ふたり is
    not a たり-form — but the m28 set alone is seven distinct verbs).
  fix: >
    Modelling なきゃ/なければ in the engine fixes this AND B019's drill gap
    from one change. A narrower alternative is a derivation rule in
    buildTileKanji (nai-form minus い plus きゃ) that does not touch the
    engine, but it would have to be repeated per paradigm.

