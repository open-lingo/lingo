- id: B060
  title: exposure kanji tier — 35 non-N5 glyphs added so high-frequency taught words stop rendering as kana forever
  status: fixed
  severity: major
  effort: M
  confidence: verified
  area: data
  tags: [system/kanji, class/kanji-scope, page/lesson-player]
  found: 2026-07-28
  source: spencer-play
  detail: >
    Supersedes B059's decision-needed. The eligibility gate needs EVERY
    component glyph in the catalog, so one missing character kept a taught
    word in kana at every module — 279 taught atoms had a kanji form that
    never rendered. Spencer chose the "top 20 + compounds" tranche.
  evidence: >
    Added 35 glyphs on m14-m25, marked tier "exposure" so the catalog stops
    claiming they are N5: 思 明 昨 家 / 帽 傘 達 遊 / 写 真 眼 鏡 / 切 符 映 画 /
    好 自 転 図 / 館 猫 池 喫 / 船 計 族 料 / 理 朝 痛 窓 / 辞 / 歌 / 物.
    Eligible atoms 119 → 154. Unlocks 明日, 家, 友達(m19), 時計(m20), 写真,
    眼鏡, 切符, 映画, 自転車(m22), 図書館, 家族, 料理, 買い物/食べ物/飲み物,
    今朝/毎朝, 昨日/一昨日/一昨年 and more.
  fix: >
    FIXED. Scheduling rule: every glyph unlocks at least one module AFTER the
    last of its anchor words is taught (so it never opens on a word the module
    is still introducing — the B004 complaint), which is why 物 is m25, 歌 m24
    and 朝 m21 rather than all landing at the m8 floor. A new test asserts
    that rule over the whole tier rather than spot-checking it.
    FOUR TESTS had to be updated because they used ともだち or ねこ as their
    example of "a word with no eligible kanji" — the RULE was unchanged, only
    which words are gaps, so each was re-pointed at 授業/御飯/寿司/鉛筆 rather
    than weakened. See B034.
  note: >
    Still blocked, each needing 2+ new glyphs: 御飯, 寿司, 鉛筆, 授業, 手伝う.
    かえる/帰る was NOT included — it falls just outside the top-30 on a
    dictionary-form frequency count, which undercounts verbs (かえる's family
    is 67 uses, not the 49 bare tokens). Worth revisiting on a fair metric.

- id: B061
  title: a word switching from kana to kanji happens silently — a known word's new written form deserves a teaching beat
  status: open
  severity: major
  effort: L
  confidence: verified
  area: pedagogy
  tags: [system/kanji, step/self_explanation_mcq, step/kanji_reading, class/kanji-scope]
  found: 2026-07-28
  source: spencer-play
  blocked_by: [B060]
  detail: >
    Spencer, 2026-07-28: "once we re-introduce a word with kanji (only applies
    to already known hiragana only words) we should do a mcq or some sort of
    better exposure."
    Today the kanji layer substitutes at render time: a learner who has known
    ともだち in kana since m3 simply meets 友達 one day, furigana above it, with
    no beat marking the change. The B060 exposure tier makes this much more
    frequent — 35 new glyphs, so many more words now have a switchover moment.
    The switch is the single best teachable instant for that word's written
    form and the course currently spends it on nothing.
  evidence: >
    Kanji recognition is render-time surface substitution
    (secondScript/applyKanjiSurfaces.ts, KANJI_RECOGNITION_MODULE=8) with a
    furigana window of unlock+2. The only kanji-facing step type is
    kanji_reading (35 in the course, kanji→kana recall), and it is
    "sprinkle-not-saturate" — it tests words whose kanji unlocked long ago,
    deliberately NOT at the switchover.
    MEASURED 2026-07-28: 112 switchover events (154 eligible atoms, 42 born with
    kanji), gap min 1 / median 11 / max 26 modules. 90 of the 112 are never
    graded by anything, and ZERO are graded inside the unlock window — so
    "spends it on nothing" is now a number, not an impression. The events clump:
    m22 has 18, m8 and m14 have 12 each, m24 has 9, m21 has 8, which is what
    constrains how the beat can be scheduled.
    Research pass done (3 surveys, summarized in the design doc): no surveyed
    tool stages a discrete switchover beat; furigana presence is the universal
    graded lever; learner complaints track UNPREDICTABILITY, not difficulty
    (Duolingo does what we do and that is the documented gripe); Genki's answer
    is to state the rule. Literature is thin — kanji form-binding is a distinct
    lexical event (dual-route models), self-teaching-by-exposure is established
    only for Chinese and never extended to Japanese, so active retrieval at the
    switchover is defensible by extrapolation but is NOT a Japanese-specific
    empirical result.
  fix: >
    Spencer's proposed method, in his words: "maybe we do the same process we
    did earlier where we think of good ideas to teach this, check other
    learning tools and see what they do." So: research pass first (what do
    WaniKani, Anki/Core2k, Duolingo, Bunpro, Renshuu, JPDB do at the moment a
    known word gains its written form?), then design, then a step type.
    Budget is available — see B063.

