- id: B071
  title: manualResetAt is silently dropped by the server SRS schema -- deliberate card resets die on cross-device hydration
  status: open
  severity: major
  effort: S
  confidence: verified
  area: engine
  tags: [system/srs, class/cross-repo-drift]
  found: 2026-07-29
  source: project-health-audit
  detail: >
    The client merge rule "only marked resets beat server state" requires
    SRSCardState.manualResetAt (srsSync.ts:86, grammarSync same semantics), but
    lingo-core app/srs/schemas.py SRSCardState has no such field and pydantic's
    default extra-handling drops it on push. Same-device resets work (local
    store keeps the marker); any server hydration on another device -- or after
    a local wipe -- loses it, and the unlock-seeded/learned server state wins
    over the learner's deliberate reset. Same failure family as the kanji-latch
    device-sync carryover.
  fix: >
    Add manualResetAt (str | None) to the server SRSCardState schema and
    persist/round-trip it; client-side round-trip test that a pushed reset
    marker survives a fresh hydration.
  see_also: docs/project-health-audit-2026-07-29.md

