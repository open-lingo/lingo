  detail: >
    `KANJI_ELIGIBLE_ATOMS` only admits an atom when EVERY component glyph is
    in `N5_KANJI` (113 entries) and some entry anchors that atom. 明, 帰, 薬
    and 熱 are all absent, so あした (taught m12, used constantly), かえる,
    くすり and ねつ display as kana at every module, in every form. This is
    the catalog behaving as designed — those glyphs are conventionally N4 —
    so the question is whether N5-strictness or exposure wins for a handful
    of very common taught words.
  evidence: >
    Probe at moduleIndex 28: かえる, かえります, かえらなきゃ, あした, くすり,
    ねつ all resolve to kana, while 見る/飲む/行く/食べる resolve. Catalog has
    113 characters; 明/帰/薬/熱 are not among them. Note あした's atom carries
    blocked: true, but that flag is about image MCQs and is unrelated.
  fix: >
    Spencer's call. Adding the four glyphs with a late introducedAtModule
    would let the words show kanji without claiming they are N5 — but it does
