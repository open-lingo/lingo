    `--stage-tail` is 10cqh everywhere (src/index.css). Dropping it to 4cqh
    inside the existing `@media (max-height: 700px)` block is a one-line change
    that clears four more step types on an SE — and cuts the dead zone Spencer
    asked for on exactly the phones where it is already thinnest.
    ASKED as R10 in the in-app review queue (`/ja/qa/review`).
  evidence: >
    Measured 2026-08-09 at 375x667. Density block alone rescues 2 of 8
    overflowing step types; tail+density rescues 4 (match_pairs, speaking,
    symbol_to_sound, listening_comprehension). The taper ALONE rescues 0 at
    360x640 and 2 at 375x667 — it only works as an amplifier. Dead space today:
    14.3% on a 15 Pro Max, 15.0% on a 13 mini, 12.3% at 360x640; at 4cqh the
    small phones fall to ~7.5%.
  fix: >
    One line. `--stage-tail: 4cqh` inside the existing max-height:700px block.
    The density half already shipped (4ba29d20) because it has no trade-off.
  note: >
    Spencer's stated preference is "the bottom 10% maybe 15% of the screen as
    dead space at least", which this reverses on short phones only. Left at
    10cqh rather than flipped silently. B091 is NOT waiting on this — the
    tail buys it ~6px.

