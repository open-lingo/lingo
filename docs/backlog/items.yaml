  detail: >
    The wrapper has @capacitor/app, /browser, /core, /ios — no status-bar
    plugin — so the app cannot set status-bar text style when the theme flips.
    With `viewport-fit=cover` the bar sits over app chrome, and dark-theme
    chrome under dark status-bar glyphs is the predictable failure.
  evidence: >
    package.json capacitor deps, read 2026-08-09. SUSPECTED, not verified —
    no one has photographed the status bar in both themes. Chromium cannot
    answer this; it is a device check (docs/mobile-ui-testing-2026-08-09.md § 6).
    ASKED as Q3 in the in-app review queue (`/ja/qa/review`) — a ten-second
