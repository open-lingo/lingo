- id: B035
  title: あります / ありません are required in m7 production and comprehension with no card, no gloss, and no dictionary form
  status: open
  severity: blocker
  effort: M
  confidence: verified
  area: content
  tags: [module/m7, step/build_sentence, step/listening_build, step/dialogue_listen, class/untaught-before-required]
  found: 2026-07-28
  source: audit-beginner-m1-m7
  detail: >
    The existence verb arrives fully formed and unannounced. m7 has seven rule
    cards (ます, the three classes, ません, です, か, register, さん/さま/くん/ちゃん)
    and not one of them introduces ある. The dictionary form appears nowhere in
    m1-m7.
  evidence: >
    7 uses in m7: build_sentence "There's a class today" (tiles include
    あります) and "There's no class today" (ありません); dialogue turn
    「きょう じゅぎょうが ありますか」/「いいえ、きょうは ありません」; listening_build
    「かぜが あります」; and a listening_comprehension whose distractors are
    "There's a class today" / "There's no class today", so the form must be
    understood to answer. grep 'ある' docs/learner-sim/m1..m7 = 0 hits.
  fix: >
    A rule card in m7 for ある/あります as existence, or move these beats later.
    Note ある is the classic fake る-verb — its plain negative is ない, not
    あらない — so the card has to say so or it contradicts the three-classes card.

