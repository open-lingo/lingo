- id: B016
  title: unlockModuleForType takes the MAX over a tile's grammar points, so one late point locks the whole tile
  status: open
  severity: major
  effort: M
  confidence: verified
  area: engine
  tags: [page/trainer, system/gating, class/wrong-aggregator]
  found: 2026-07-28
  source: session-note
  detail: >
    The `masu` tile carries masu-negative (m7) and masu-past-negative (m16).
    MAX means correcting masu-past-negative to its true module would lock ます
    practice out of the hub from m7 to m16 — so the json is knowingly left
    WRONG (m11) to keep the tile reachable. The data is lying to work around
    the aggregator.
  evidence: >
    n5-grammar-points.json still says masu-past-negative m11; the course
    teaches it in m16. Deliberate, documented in the conjugation-transform
    spec.
  fix: >
    Unlock per FORM rather than per tile — a tile is available when its
    EARLIEST form is taught, and the session only draws forms already taught.
    Then correct the json and delete this workaround.
  blocked_by: []

