- id: B066
  title: Side quests are inert and cannot grade anything -- prerequisite for B065(b)
  status: open
  severity: major
  effort: M
  confidence: verified
  area: engine
  tags: [system/srs, system/content]
  found: 2026-07-29
  source: claude-probe
  detail: >
    Side quests exist as map tiles and nothing else, so "put the un-drilled words
    in a side quest" cannot work until the surface is real. Three separate
    blockers, each verified by probe 2026-07-29.
  evidence: >
    1. NO ROUTING. Every ja quest in mockCourse.ts carries `comingSoon: true`, and
    both `SIDEQUEST_TO_LESSON` and `SIDEQUEST_TO_ROUTE` are empty object literals
    in LearnPage.tsx and TransitLearnPage.tsx. The quest lessons themselves were
    deleted 2026-07-16.
    2. NO SRS WRITE. A side-quest lesson id is not a dedicated review lesson, and
    the D2 gate needs `parseModuleIndex(lessonId) > 0`, so `ja-sidequest-days`
    writes nothing. Anchoring the id to a module does NOT fix it either: for
    `ja-m12-sidequest-days` + the m12 atom どようび, D2 still returns false,
    because it requires the atom's module to be STRICTLY PRIOR to the lesson's.
    A quest can only grade words from modules before its anchor.
    3. QUEST-SOURCED ATOMS ARE INVISIBLE TO REVIEWS. `getAtomsUpToModule` filters
    on live module ids, so the 10 existing `fromModule: "sidequest-survival"`
    atoms appear in 0 review pools (m30 pool = 678 atoms, none of them). Any NEW
    word authored into a quest inherits that dead end.
    Secondary: the script ladders key off parseModuleIndex too, so a non-`mN`
    lesson id renders as module 0 -- romaji on everything, no kanji substitution.
  fix: >
    Make side-quest lessons a seventh SRS write surface with an explicit anchor
    module on the LessonContent (not parsed out of the id), gate writes on "atom
    is already unlocked AND not introduced by this quest" so D6 still holds, and
    either give quest-sourced atoms a live-module anchor or teach
    getAtomsUpToModule about them. Then restore the routing maps and drop
    comingSoon per quest as its content lands.
  see_also: docs/vocab-exposure-audit-2026-07-29.md

- id: B067
  title: Vocab-pack lessons -- slot the untaught N5 clusters back into the live modules
  status: open
  severity: major
  effort: L
  confidence: verified
  area: content
  tags: [system/content, class/coverage]
  found: 2026-07-29
  source: claude-probe
  detail: >
    The content half of B065. One extra teaching lesson per module, themed to the
    module it lands in, teaching the words the rewrite has not re-taught. Order
    by visibility: m11 weekdays and m19 directions first -- a course that never
    asks 土曜日, 右 or 左 is a hole a learner notices.
  evidence: >
    Homes proposed per live-module theme in the audit doc §3: weekdays+calendar
    ~15 to m11 (Time I; m11's own IR defers calendar points -- "those arrive
    later" -- so this is that debt), directions+landmarks ~18 to m19 (Getting
    around; the m19 guard test names these exact words), family+people ~14 to m17,
    tableware+ordering ~13 to m8/m9, body+routine ~20 to m22/m14, adjectives ~12
    to m12, comparatives ~7 to m20/m26, connectives ~8 to m16, time expressions
    ~16 to m11/m23, katakana loanwords ~16 into the existing katakana row lessons,
    verbs ~18 to m24/m29. ~25 residual singletons fit no cluster.
    TTS is ALREADY DONE -- spot-checked 28 cluster words against
    src/pub/tts/manifest.json, 28/28 present from the old course's run. Registry
    rows exist too. So the cost is authoring, not pipeline.
  fix: >
    Per pack: declare the words in curriculum/ir/mN.ir.yaml (lessons + newAtoms),
    run `node scripts/compile-ir.mjs mN`, add the lesson tile to the module's
    literal lesson list in mockCourse.ts. Four constraints, each a real trap:
    (1) the atom needs a courseAtoms ROW, not an IR-only newAtoms entry -- IR-only
    atoms are invisible to the compiler's tokenizer and to SRS (see the `ii`
    backfill postmortem in courseAtoms.ts, where 「たべても いい」 tokenized to
    たべて・も・<unknown> and tripped the unbuildable gate). These words already
    have rows.
    (2) fromModule MUST be updated to the teaching module -- getAtomsUpToModule
    (the review pool) and the D2 gate both read it, so a word taught in m11 but
    still tagged m12 is excluded from m11's reviews AND never graded by D2.
    (3) unlock is automatic once a step names the atom in exercisedAtoms or a
    tile (fallbackAtomsForLesson, exact match only) -- but LEAVE
    introducedByLessonId UNSET: a static attribution suppresses the fallback
    forever, and a later rename/delete of the lesson strands the atom, which is
    exactly how B068's 234 dangling attributions happened.
    (4) relax the m19-neo guard test as its words land, or the pack fails CI.
    PROGRESS 2026-07-29 -- packs 1-2 (m11) SHIPPED: ja-m11-neo-10 "The week --
    〜ようび" (7 weekdays + あさって, youbi-days rule card extends ni-time to
    named calendar points) and ja-m11-neo-11 "This year, last year" (ことし
    きょねん せんしゅう せんげつ らいげつ まいとし おぼえる はじめて,
    time-spans rule card). All 16 registry rows re-homed fromModule -> m11;
    dead attributions ja-m25-4-2 (はじめて) / ja-m29-2-1 (おぼえる) deleted
    (MAX_DANGLING_ATTRIBUTIONS 234 -> 232). m11 R1/R3 gained coverage beats so
    the pack words get review-lesson SRS writes. Two trap-2 casualties fixed
    en route: あした re-homed m12 -> m11, かえる m14 -> m19 (+blocked, made-ni
    gate exemptions x2). Exposure ratchets 220 -> 204 / 96 -> 91;
    never-unlockable back at the 226 pin. TTS emitted+generated+verified
    (39+15 nanami clips, 2 keita dialogue lines). Packs 3-16 remain.
    PROGRESS 2026-07-29 (later) -- packs 3-4 SHIPPED. Pack 3 (m13):
    ja-m13-neo-10 "けさ -- the morning routine" (V:おきる V:あらう V:みがく
    せっけん シャワー ゆうべ けさ A:はやい早い; IR-local asa-routine card; no
    substitutions -- all 8 verified untaught), R3 extended; okiru/arau/migaku
    VERB_ENTRIES un-parked 99 -> 13 (trainer path node now drills them);
    sekken meaningEn fixed from the mislabeled "economy". Pack 4 (m14):
    ja-m14-neo-10 "ドアを あけて -- doors and lights" (V:あける V:しめる
    V:もつ V:ひく ドア でんき A:つめたい; akeru-shimeru card; no
    substitutions), R3 extended; NEW VERB_ENTRIES rows akeru/shimeru/hiku
    (m14) + motsu/tsumetai un-parked -> 14; ドア's dead ja-m6-kata
    attribution deleted. Adjacent trap-2 fixes: すき/きらい/ほしい re-homed
    to m13 (their live teaching lessons) + blocked (rule-card debuts);
    MAX_GRADED_NEVER_UNLOCKABLE 226 -> 223. Two mechanical findings for the
    remaining packs: (a) the module compiler tokenizes over atoms + stems,
    so every derived cell a pack spends must be an IR newAtom; (b) registry
