    topic; drop a leading temporal adverb's は) were both ^-anchored to the
    start of the whole string. In a two-sentence answer the second clause's
    topic sits behind a 。 where ^ cannot reach, so a learner who wrote the
    bare adverb was marked wrong. Droppability comes from opening a CLAUSE,
    not from opening the string.
  evidence: >
    m28 build 「うちに かえらなきゃ。あしたは しごとが あるんだ」 — Spencer built
    it with あした bare and was failed. 320 targets in the course are
    multi-sentence; 8 carry a clause-initial topic behind a 。.
  fix: >
    FIXED — added CLAUSE_TOPIC / CLAUSE_TEMPORAL_TOPIC (matching at string
    start OR after 。) and expanded per match, restoring the clause opener.
    Test asserts the rule for any clause, that a non-clause-opening は
    survives, and that the old leading-position behaviour still holds.

