- id: B064
  title: furigana is removed based on how well the learner knows the WORD, which says nothing about whether they can read the KANJI
  status: open
  severity: major
  effort: L
  confidence: verified
  area: engine
  tags: [system/kanji, system/srs, class/kanji-scope]
  detail: >
    SRSModality is exactly "recognition" | "production" (flashcards/data/types.ts:96)
    — there is NO orthography modality anywhere in the SRS. isMastered() returns
    true when both of those intervals clear MASTERED_INTERVAL_DAYS, i.e. it
    measures knowledge of the WORD, by sound and by meaning.
    Furigana removal is gated on precisely that: applyKanjiSurfaces.ts:205 sets
    furiganaWindowOpen from furiganaVisibleAt (window = unlock+2), and past the
    window furigana persists only until isMastered(atom).
    Consequence: for a word taught early and drilled for many modules, the atom
    is long-since mastered before its kanji ever renders, so the ONLY thing
    holding furigana up is the unlock+2 floor. ともだち is taught m3; 友達 first
    renders m19; furigana disappears at m21 — on a written form the learner has
    seen for two modules and has never once been graded on. The gate removes the
    scaffold on the basis of evidence that is irrelevant to whether the scaffold
    is still needed.
  evidence: >
    Probe over the compiled course crossed with KANJI_ELIGIBLE_ATOMS: 154
    eligible atoms, 42 born with kanji, 112 SWITCHOVER events (taught in kana,
    kanji arrives later), gap min 1 / median 11 / max 26 modules. Of those 112,
    22 are ever graded by a kanji_reading step and 0 are graded within the
    unlock window; 90 are never graded at all. The 35 kanji_reading steps sit in
    only five modules (m18, m23, m28, m29, m30-n4), which matches B063's
    independent step-mix count.
  fix: >
    Add a third SRS modality (reading) or an orthography sub-state on the card,
    graded only by kanji-facing steps, and gate furigana on THAT instead of
    isMastered(). This is WaniKani's reading/meaning split and Renshuu's
    known-kanji toggle. Needs a card-state migration (see srsMigration.ts).
    B061's teaching beat has nothing to grade into until this lands.
  found: 2026-07-28
  source: claude-probe
  see_also: docs/kanji-switchover-design-2026-07-28.md

