- id: B061
  title: a word switching from kana to kanji happens silently — a known word's new written form deserves a teaching beat
  status: open
  severity: major
  effort: L
  confidence: verified
  area: pedagogy
  tags: [system/kanji, step/self_explanation_mcq, step/kanji_reading, class/kanji-scope]
  found: 2026-07-28
  source: spencer-play
  blocked_by: [B060]
  detail: >
    Spencer, 2026-07-28: "once we re-introduce a word with kanji (only applies
    to already known hiragana only words) we should do a mcq or some sort of
    better exposure."
    Today the kanji layer substitutes at render time: a learner who has known
    ともだち in kana since m3 simply meets 友達 one day, furigana above it, with
    no beat marking the change. The B060 exposure tier makes this much more
    frequent — 35 new glyphs, so many more words now have a switchover moment.
    The switch is the single best teachable instant for that word's written
    form and the course currently spends it on nothing.
  evidence: >
    Kanji recognition is render-time surface substitution
    (secondScript/applyKanjiSurfaces.ts, KANJI_RECOGNITION_MODULE=8) with a
    furigana window of unlock+2. The only kanji-facing step type is
    kanji_reading (35 in the course, kanji→kana recall), and it is
    "sprinkle-not-saturate" — it tests words whose kanji unlocked long ago,
    deliberately NOT at the switchover.
    MEASURED 2026-07-28: 112 switchover events (154 eligible atoms, 42 born with
    kanji), gap min 1 / median 11 / max 26 modules. 90 of the 112 are never
    graded by anything, and ZERO are graded inside the unlock window — so
    "spends it on nothing" is now a number, not an impression. The events clump:
    m22 has 18, m8 and m14 have 12 each, m24 has 9, m21 has 8, which is what
    constrains how the beat can be scheduled.
    Research pass done (3 surveys, summarized in the design doc): no surveyed
    tool stages a discrete switchover beat; furigana presence is the universal
    graded lever; learner complaints track UNPREDICTABILITY, not difficulty
    (Duolingo does what we do and that is the documented gripe); Genki's answer
    is to state the rule. Literature is thin — kanji form-binding is a distinct
    lexical event (dual-route models), self-teaching-by-exposure is established
    only for Chinese and never extended to Japanese, so active retrieval at the
    switchover is defensible by extrapolation but is NOT a Japanese-specific
    empirical result.
  fix: >
    DESIGN SETTLED 2026-07-29 (Spencer): variant C, restructured to TWO steps —
    (1) an animated kana→kanji reveal, ungraded, holding its own Continue until
    the animation finishes; (2) a graded sentence question with furigana OFF on
    the switched word and four options that differ only at that word. Written up
    in docs/kanji-switchover-design-2026-07-28.md §6. Note this deliberately
    overrules the research pass's recommended order (attempt-first, reveal-as-
    feedback, §7a of the distributed spec) — Spencer's call, recorded not
    reconciled.
    What is BUILT: kanji.json (147 KanjiVG glyphs, all of N5_KANJI incl. the
    exposure tier) + KanjiStrokeDraw + six candidate animations, live at
    /ja/qa/kanji-reveal, coverage test-enforced in glyphs/data.test.ts.
    Step 2 SETTLED 2026-07-29: a kanji CLOZE on `fill_blank` (adopting the unused
    step type) — English cue + blanked sentence + four shape-matched kanji tiles,
    tile readings suppressed via the new `wordBankHideHelper`. Distractors are
    real course-registry words matched on glyph count and MAY use untaught kanji
    (Spencer: "use kanji they dont even know ... still getting good distractors if
    we can get two symbol words"); pool is 166 two-glyph / 138 one-glyph words.
    That relaxation is what makes the step viable at m8, where the
    already-taught-only pool was 0.
    WIRED IN 2026-07-29 (Spencer: "gracefully implement it in as one of the
    possible review steps ... checking for an available one to promote to kanji as
    a first step"): `buildSrsReviewLesson` now prepends up to 2 beats per dynamic
    review via `pickSwitchoverCandidates`; the `kanji_reveal` step type + view
    ship; the latch (`kanjiSwitchoverLatch`) is written on lesson COMPLETION in
    LessonPage gated on the cloze being correct; and `kanjiSurfaceLatchVisible` in
    AnnotatedText withholds an un-introduced switchover kanji so the beat is the
    learner's FIRST sight of the written form. Capacity math forced 2 beats per
    review: 66 review hosts at m8+ vs 124 switchovers, so 1/review left 58 words
    permanently in kana. SWITCHOVER_GRACE_MODULES=3 fails open so no word can be
    hidden forever. Full write-up: design doc §7.
    What REMAINS: pick one animation (7 is Spencer's, unconfirmed as final);
    promote the cloze's English cue out of `hint`; make FillBlankStepView honour
    `sentenceAnnotation` (declared but ignored);
    wire the trigger + latch into buildSrsReviewLesson (the 44 derived review
    lessons are the only per-learner host — review TAILS do not exist at m8+,
    see the distributed spec §6a) with the latch written on lesson COMPLETION,
    never at build time, because buildSrsReviewLesson is pure.
    Still open independently: the 14-day trigger reads as unfair when intervals
    oscillate; the latch is invisible and irreversible off one correct answer;
    and B064 (no orthography modality to grade into).

