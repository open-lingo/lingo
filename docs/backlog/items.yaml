- id: B068
  title: 287 words the live course teaches and grades are never UNLOCKED, so no review surface can reach them
  status: open
  severity: blocker
  effort: M
  confidence: verified
  area: engine
  tags: [system/srs, class/exposure, class/attribution]
  found: 2026-07-29
  source: claude-probe
  detail: >
    Distinct from B065 (words never taught). These ARE taught and graded, and a
    lesson grade creates their FSRS card -- but they never enter the unlock store,
    and unlock gates BOTH review surfaces: the flashcard course deck
    (buildCourseDeck(unlockedIds)) and every dynamic review pool
    (buildSrsReviewLesson filters candidates on getUnlockedAtomIds). So the card
    is created once and can never be selected again. Silent retention loss on
    core vocabulary -- ねこ, いぬ, ひと, なに, やま, あさ, さくら are all in it.
  evidence: >
    Measured 2026-07-29 by cross-tabbing taught (named by a graded step in a live
    lesson) against unlocked (returned by getAtomsForLesson for a live lesson),
    over all 917 SRS-eligible JA atoms: 488 graded by a live lesson, 208 unlocked
    by a live lesson, 287 graded-but-never-unlocked. 234 atoms carry an
    `introducedByLessonId` pointing at a lesson that no longer exists in the
    registry at all (ja-m1-l1, ja-m1-l6-ha, ja-m3-3, ja-m4-1-1); 20 more point at
    a registered but off-map lesson.
    PROOF CASE: ちち / はは are the headline words of live ja-m17-neo-1
    ("ちちと はは"), taught and graded there, but their rows say
    `fromModule: "m8", introducedByLessonId: "ja-m4-1-1"` -- a deleted lesson --
    so they are never unlocked.
    TWO INDEPENDENT CAUSES, both in fallbackAtomsForLesson (lessonAtomIndex.ts):
    it only fires when `lessonToAtoms` has no entry for the lesson, and it filters
    on `!a.introducedByLessonId && a.fromModule === <lesson's module>`. So (A) a
    dangling/off-map attribution suppresses the fallback forever, and (B) an atom
    whose legacy fromModule differs from the live module that teaches it can never
    match. The rewrite renumbered modules, so (B) is systemic.
    ALREADY KNOWN IN ONE PLACE: applyPlacement.ts ~line 147 comments "M8+ atoms
    carry module-level attribution only (no introducedByLessonId), so the
    per-lesson unlock above can't reach them -- unlock the seeded atoms directly
    or SRS review lessons will skip them", and calls unlockAtomIds(seededIds) to
    work around it. That path runs ONLY for placement-test takers. A learner who
    starts from scratch and walks the course never gets it.
    THIRD-PARTY-CONFIRMED 2026-07-29: the independent audit reproduced
    917/488/208/287 exactly, verified the unlock path (LessonPage.tsx ->
    unlockLessonAtoms -> getAtomsForLesson, unconditional on completion), and
    confirmed 208 is not a zero-fallback artifact (169 static + 39 fallback).
    One boundary: applyPlacement.ts unlockAtomIds(seededIds) is a real second
    unlock path, so "never unlocked" is exact for course-walk learners only --
    a test-out past m17 DOES unlock 右/左. Also note per B069 the dynamic
    review pool is currently unreachable anyway, so the live cost today is the
    flashcard course deck alone -- still every non-placement learner's only
    review surface for these words.
  fix: >
    Decide the source of truth for "this lesson introduces this atom" and make it
    survive renumbering. Options: (1) repoint or delete the 254 stale
    introducedByLessonId values and re-home fromModule to the live teaching
    module -- correct but touches ~500 rows; (2) let the fallback ALSO fire when a
    static attribution points at a lesson that is not on the live map (cheap,
    fixes 234 immediately, keeps the landmine for live attributions);
    (3) derive unlock from `exercisedAtoms`/tiles alone and retire the attribution
    field. Add a conformance test that every introducedByLessonId names a
    registered lesson -- that alone would have caught this.
    PROGRESS 2026-07-29: option 2 SHIPPED (lessonAtomIndex isDeadAttribution --
    an attribution the lesson registry cannot resolve is treated as unset, so
    the module fallback fires again). Measured with the new instrument in
    lessonAtomAttribution.test.ts ("attribution integrity (B068)"): 287 -> 226
    graded-but-never-unlockable (positive-controlled: neutering the fix reads
    287 exactly). Both counts are now ratcheted tests: MAX_DANGLING_ATTRIBUTIONS
    234, MAX_GRADED_NEVER_UNLOCKABLE 226. The 226 residual is cause (B) in both
    flavours (131 no attribution + 95 dead attribution; legacy fromModule names
    a module whose live lessons never surface the word) -- fixed only by
    re-homing fromModule to the live teaching module, which the vocab-pack wave
    (docs/vocab-pack-wave-plan-2026-07-29.md) does per pack; lower the ratchet
    with each pack. Registered-but-off-map attributions (20) still honored
    deliberately (deep-link completable).
  see_also: docs/vocab-exposure-audit-2026-07-29.md

