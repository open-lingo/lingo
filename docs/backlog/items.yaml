  source: learner-walk-2
  detail: >
    ともだちが きます (m7 L3), せんせいが おしえる (m8 L12), ミカの こえが わかった
    (m11 L7) all need が marking an ordinary subject. The learner has only
    been taught が for existence (ある/いる). The は/が card does not arrive
    until m16 L2 — nine modules of doing it by feel.
  evidence: >
    Three cited instances across three modules; the walker had m6's が-for-
    existence card and nothing else.
  fix: >
    Either state が-as-subject in m7 alongside the ます card, or move enough of
    m16 L2 forward. Prefer the former — m16's card is about the CONTRAST,
    which genuinely needs the maturity.

