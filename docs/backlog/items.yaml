- id: B001
  title: な-adjectives that end in い are never flagged, and m12 states two rules that make them look like contradictions
  status: open
  severity: major
  effort: S
  confidence: reported
  area: content
  tags: [module/m12, lesson/ja-m12-neo-5, lesson/ja-m12-neo-6, step/grammar_rule, class/rule-contradicts-rule]
  found: 2026-07-28
  source: learner-walk-2
  detail: >
    きれい and ゆうめい end in い and are な-adjectives. No card anywhere says
    so. m12 L1 tells the learner "an い-adjective never takes だ" and L7 tells
    them "never くない — that ending belongs to い-adjectives", so きれいだ and
    きれいじゃない read as the module breaking its own rules two lessons after
    stating them.
  evidence: >
    Walker called this the strongest finding of the walk. Both words are
    introduced in m12's な-adjective lessons with no note on the ending.
  fix: >
    One paragraph on the な-adjective card: the ending tells you nothing, the
    word does, and these two are the pair everybody trips on. Probably an
    antiPattern too (きれくない). Watch Gate 6 — antiPattern must be a minimal
    pair of examples[0].

- id: B002
  title: が as an ordinary verb's subject is required from m7 and not explained until m16
  status: open
  severity: major
  effort: M
  confidence: reported
  area: content
  tags: [module/m7, module/m8, module/m11, module/m16, lesson/ja-m7-neo-3, step/build_sentence, class/untaught-before-required]
