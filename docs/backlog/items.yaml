- id: B016
  title: unlockModuleForType takes the MAX over a tile's grammar points, so one late point locks the whole tile
  status: fixed
  severity: major
  effort: M
  confidence: verified
  area: engine
  tags: [page/trainer, system/gating, class/wrong-aggregator]
  found: 2026-07-28
  source: session-note
  detail: >
    The `masu` tile carries masu-negative (m7) and masu-past-negative (m16).
    MAX means correcting masu-past-negative to its true module would lock ます
    practice out of the hub from m7 to m16 — so the json is knowingly left
    WRONG (m11) to keep the tile reachable. The data is lying to work around
    the aggregator.
  evidence: >
    n5-grammar-points.json still says masu-past-negative m11; the course
    teaches it in m16. Deliberate, documented in the conjugation-transform
    spec.
  fix: >
    Unlock per FORM rather than per tile — a tile is available when its
    EARLIEST form is taught, and the session only draws forms already taught.
    Then correct the json and delete this workaround.
  blocked_by: []
    FIXED 2026-07-29 -- per-form gating: FORM_GATE_POINTS/formUnlockModule in
    trainerRegistry.ts (fails closed on unmapped forms), unlockModuleForType =
    MIN over the tile's forms (masu tile m11 -> m7), both session builders
    filter forms beyond the pool module, grading double-gated via
    reachedModule, dueGrammarPointCount gated the same way. Data-derived
    regression tests in trainerRegistry.test.ts + trainerSession.test.ts.
    UNBLOCKS B017 (masu-past-negative module correction -- the json
    workaround can then be deleted). Known cosmetic gap left open: hub combo
    chips (combosForSelection) can advertise a stacked form the session
    won't drill until its module.

