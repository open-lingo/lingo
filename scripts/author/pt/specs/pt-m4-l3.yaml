dialogue:
  npc: Marina
  turns:
    - npc: "Olá! Você mora aqui perto?"
      gloss: "Hi! Do you live near here?"
      goal: "Say you stay at a hotel nearby"
      options: ["Eu fico em um hotel aqui perto.", "Eu tenho uma irmã e um gato.", "Eu gosto muito de café e leite."]
      correct: 0
    - npc: "E o centro, fica perto ou longe?"
      gloss: "And downtown, is it near or far?"
      goal: "Build: say downtown is very far"
      mode: build
      tiles: ["O", "centro", "fica", "muito", "longe", "perto", "fico"]
      answer: "O centro fica muito longe"
    - npc: "Você entende português! Tem uma loja aqui perto. Você quer um café?"
      gloss: "You understand Portuguese! There's a shop nearby. Do you want a coffee?"
      goal: "Say yes to the coffee"
      options: ["Sim, eu quero um café, obrigado.", "Não, eu fico em casa amanhã.", "Eu vou para a praia amanhã."]
      correct: 0
