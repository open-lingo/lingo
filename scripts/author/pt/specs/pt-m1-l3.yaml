lesson: 3
id: pt-m1-l3
title: "Eu tenho uma família"
grammar: "ter present sg.; um/uma agreement"
infoTitle: "Ter: tenho / tem"
info: "Tenho means \"I have.\" Tem means \"you have\" or \"he/she has.\" Use um before a masculine noun and uma before a feminine noun."
allow: [e]
words:
  - { pt: tenho, en: "I have", pos: verb-form, of: ter }
  - { pt: um, en: "a / an (masculine)", pos: article, gender: m }
  - { pt: gato, en: cat, pos: noun, gender: m, emoji: "🐱" }
  - { pt: uma, en: "a / an (feminine)", pos: article, gender: f }
  - { pt: irmã, en: sister, pos: noun, gender: f, emoji: "👧" }
  - { pt: amigo, en: friend, pos: noun, gender: m, emoji: "🧑‍🤝‍🧑" }
  - { pt: família, en: family, pos: noun, gender: f, cognate: true, emoji: "👨‍👩‍👧" }
  - { pt: tem, en: "you have / he/she has", pos: verb-form, of: ter }
recall: [eu, você]
contrastSet: [[um, uma], [tenho, tem]]
contrast: [{ a: tenho, b: tem, note: "1st person vs 2nd/3rd person" }]
sentences:
  - { pt: "Eu tenho um gato.", en: "I have a cat.", roles: [build, debut], uses: [tenho, um, gato] }
  - { pt: "Eu tenho uma irmã.", en: "I have a sister.", roles: [build, debut], uses: [tenho, uma, irmã] }
  - { pt: "Eu tenho um amigo.", en: "I have a friend.", roles: [speak, debut], uses: [tenho, um, amigo] }
  - { pt: "Eu tenho uma família.", en: "I have a family.", roles: [listen, debut], uses: [tenho, uma, família] }
  - { pt: "Você tem uma irmã?", en: "Do you have a sister?", roles: [build, debut], uses: [tem, você, uma, irmã] }
  - { pt: "Você tem um gato?", en: "Do you have a cat?", roles: ["cloze:tem", listen], uses: [tem, você, um, gato] }
  - { pt: "Eu tenho uma família e um gato.", en: "I have a family and a cat.", roles: ["cloze:uma", listen], uses: [tenho, uma, família, um, gato] }
  - { pt: "Eu tenho um gato e uma irmã.", en: "I have a cat and a sister.", roles: ["cloze:um", listen], uses: [tenho, um, gato, uma, irmã] }
  - { pt: "Eu tenho um gato e um amigo.", en: "I have a cat and a friend.", roles: ["cloze:tenho", listen], uses: [tenho, um, gato, amigo] }
agreement:
  sentence: "Eu tenho um amigo e uma irmã."
  en: "I have a friend and a sister."
  blanks: [{ answer: um, options: [um, uma] }, { answer: uma, options: [um, uma] }]
dialogue:
  npc: Rafael
  turns:
    - { npc: "Eu tenho um gato. E você?", gloss: "I have a cat. And you?", goal: "Say yes, you have a sister.", options: ["Sim, eu tenho uma irmã.", "Sou professor."], correct: 0 }
win: { pt: "Eu tenho um amigo e uma irmã.", en: "I have a friend and a sister." }
