lesson: 5
id: pt-m1-l5
title: "O que você gosta de fazer?"
grammar: "gostar de + infinitivo; -ar/-er/-ir preview (falar/comer/assistir)"
infoTitle: "Gostar de + infinitivo"
info: "gostar de + infinitive = to like doing something. Eu gosto (I like); você gosta / ele gosta (you like / he likes). The infinitive never changes: falar (-ar), comer (-er), assistir (-ir) — three endings, same pattern after gostar de."
allow: [e]
words:
  - { pt: gosto, en: "I like", pos: verb-form, of: gostar }
  - { pt: gosta, en: "you like / he or she likes", pos: verb-form, of: gostar }
  - { pt: falar, en: "to speak, to talk", pos: verb, cognate: true }
  - { pt: comer, en: "to eat", pos: verb }
  - { pt: assistir, en: "to watch", pos: verb }
  - { pt: filme, en: "movie, film", pos: noun, gender: m, cognate: true, emoji: "🎬" }
  - { pt: música, en: music, pos: noun, gender: f, cognate: true, emoji: "🎵" }
  - { pt: pizza, en: pizza, pos: noun, gender: f, cognate: true, emoji: "🍕" }
contrastSet: [[gosto, gosta]]
contrast: [{ a: gosto, b: gosta, note: "1st person vs 2nd/3rd person" }]
sentences:
  - { pt: "Eu gosto de música.", en: "I like music.", roles: [debut, "cloze:gosto"], uses: [gosto, música] }
  - { pt: "Eu gosto de falar.", en: "I like talking.", roles: [debut, listen], uses: [gosto, falar] }
  - { pt: "Eu gosto de assistir filme.", en: "I like watching movies.", roles: [debut, build], uses: [assistir, filme] }
  - { pt: "Você gosta de comer pizza?", en: "Do you like eating pizza?", roles: [debut, "cloze:gosta"], uses: [gosta, comer, pizza] }
  - { pt: "Sam gosta de música.", en: "Sam likes music.", roles: [speak], uses: [gosta, música] }
  - { pt: "Eu gosto de comer pizza e assistir filme.", en: "I like eating pizza and watching a movie.", roles: [build], uses: [gosto, comer, pizza, assistir, filme] }
  - { pt: "Sam gosta de falar e assistir filme.", en: "Sam likes talking and watching a movie.", roles: [listen], uses: [gosta, falar, assistir, filme] }
  - { pt: "Sam gosta de comer pizza.", en: "Sam likes eating pizza.", roles: [build], uses: [gosta, comer, pizza] }
  - { pt: "Eu gosto de música e de falar.", en: "I like music and talking.", roles: [listen], uses: [gosto, música, falar] }
dialogue: { npc: Pedro, turns: [{ npc: "Você gosta de assistir filme?", gloss: "Do you like watching movies?", goal: "Say you like eating pizza.", options: ["Gosto de comer pizza.", "Sou professor."], correct: 0 }] }
win: { pt: "Sam gosta de comer pizza e assistir filme.", en: "Sam likes eating pizza and watching a movie." }
