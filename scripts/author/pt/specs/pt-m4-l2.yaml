  - { pt: "Esse suco é caro, mas aquele não.", en: "This juice is expensive, but that one over there isn't.", roles: ["cloze:esse", build], uses: [esse, aquele], why: "Suco is masculine and it is right here in front of us, so esse." }
  - { pt: "Essa água é para você ou aquela?", en: "Is this water for you, or that one over there?", roles: ["cloze:essa"], uses: [essa, aquela], why: "Água is feminine, so the near one is essa." }
  - { pt: "Eu quero essa pizza, por favor.", en: "I want this pizza, please.", roles: [build], uses: [essa, quero] }
  - { pt: "Você quer essa pizza aqui ou aquela ali?", en: "Do you want this pizza here or that one over there?", roles: ["cloze:aquela", build], uses: [aquela, essa, ali], why: "Pizza is feminine and that one is far off, so aquela." }
  - { pt: "Eu quero isso, não aquilo.", en: "I want this, not that one over there.", roles: ["cloze:isso", build], uses: [aquilo, isso, quero], why: "Isso points at the near thing by itself, with no noun after it." }
  - { pt: "Esse hotel aqui é caro ou aquele lá?", en: "Is this hotel here expensive, or that one over there?", roles: ["cloze:aquele"], uses: [aquele, esse, lá], why: "Hotel is masculine and far away from us, so aquele." }
  - { pt: "Quanto custa aquilo lá?", en: "How much is that thing over there?", roles: [listen], uses: [aquilo, lá, quanto] }
contrastSet: [{ set: [esse, isso], why: "Esse goes right before a noun, while isso stands on its own with no noun after it." }]
