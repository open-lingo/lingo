lesson: 1
id: pt-m1-l1
title: "Eu sou Sam"
grammar: "ser present sg. (sou/é); greetings"
infoTitle: "Ser: sou / é"
info: "Sou = I am (yourself). É = is / are, used with você, ele, ela. Ser is for who you are, not how you feel."
allow: [e]
words:
  - { pt: olá, en: hello, pos: interjection }
  - { pt: eu, en: I, pos: pronoun }
  - { pt: você, en: you, pos: pronoun }
  - { pt: sou, en: "I am", pos: verb-form, of: ser }
  - { pt: é, en: "is / are", pos: verb-form, of: ser }
  - { pt: estudante, en: student, pos: noun, gender: epicene, emoji: "🎓", cognate: true }
  - { pt: professor, en: "teacher (m)", pos: noun, gender: m, emoji: "👨‍🏫", cognate: true }
  - { pt: Brasil, en: Brazil, pos: proper-noun, cognate: true }
contrastSet: [[sou, é]]
contrast: [{ a: sou, b: é, note: "1st person (I) vs 2nd/3rd person (you/he/she)" }]
sentences:
  - { pt: "Olá! Eu sou Sam.", en: "Hello! I'm Sam.", roles: [build, debut], uses: [olá, eu, sou] }
  - { pt: "Você é estudante?", en: "Are you a student?", roles: [build, debut], uses: [você, é, estudante] }
  - { pt: "Eu sou professor.", en: "I am a teacher.", roles: [build, debut], uses: [sou, professor] }
  - { pt: "Olá, Brasil!", en: "Hello, Brazil!", roles: [build, debut, listen], uses: [olá, Brasil] }
  - { pt: "Sam é professor.", en: "Sam is a teacher.", roles: ["cloze:é"], uses: [é, professor] }
  - { pt: "Olá! Eu sou estudante.", en: "Hello! I am a student.", roles: [listen], uses: [olá, eu, sou, estudante] }
  - { pt: "Eu sou professor e você é estudante.", en: "I am a teacher and you are a student.", roles: [speak], uses: [eu, sou, professor, você, é, estudante] }
  - { pt: "Eu sou estudante, você é professor.", en: "I am a student, you are a teacher.", roles: ["cloze:sou"], uses: [sou, estudante, você, é, professor] }
dialogue:
  npc: Bia
  turns:
    - { npc: "Você é estudante?", gloss: "Are you a student?", goal: "Say yes, you are a student.", options: ["Sou, sou estudante.", "Sou professor."], correct: 0 }
win: { pt: "Eu sou Sam, sou estudante.", en: "I am Sam, I am a student." }
