contrastSet: [{ set: [meu, minha], why: "Both mean my: meu goes with masculine words like nome, and minha with feminine ones like mãe." }, { set: [esse, essa], why: "Both point at something close by: esse for masculine words, essa for feminine ones." }, { set: [fica, fico], why: "Same verb, different person: fica is for he, she or a place, and fico is for eu." }]
