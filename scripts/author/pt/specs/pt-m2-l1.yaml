lesson: 1
id: pt-m2-l1
spine: pt-m2-1

allow: [com, e, mas, muito, não, o, ou, sim, também]
sentences:
  - { pt: "Eu quero um café.", en: "I want a coffee.", roles: [build, debut], uses: [quero, café] }
  - { pt: "Você quer água?", en: "Do you want water?", roles: [debut, listen], uses: [quer, água, você] }
  - { pt: "Mais um café, por favor.", en: "One more coffee, please.", roles: [debut, speak], uses: [mais, café, "por favor"] }
  - { pt: "Obrigado, mas não quero mais café.", en: "Thank you, but I don't want more coffee.", roles: [debut], uses: [obrigado, mais, quero, café] }
  - { pt: "Muito obrigada, Bia!", en: "Thank you very much, Bia!", roles: [debut], uses: [obrigada] }
  - { pt: "Você quer mais água?", en: "Do you want more water?", roles: ["cloze:quer", speak], uses: [quer, mais, água, você], why: "The person I am talking to is você, so the verb is quer." }
  - { pt: "Eu quero comer uma pizza, por favor.", en: "I want to eat a pizza, please.", roles: ["cloze:quero"], uses: [quero, comer, "por favor"], why: "I am talking about myself, so the verb is quero." }
  - { pt: "Você quer um café ou uma água?", en: "Do you want a coffee or a water?", roles: ["cloze:um", "cloze:uma"], uses: [quer, café, água, você], why: "Café is masculine so it takes um, and água is feminine so it takes uma." }
  - { pt: "Obrigado, e mais um café, por favor.", en: "Thank you, and one more coffee, please.", roles: [build], uses: [obrigado, mais, café, "por favor"] }
  - { pt: "Obrigada, mas eu quero água, por favor.", en: "Thank you, but I want water, please.", roles: [build], uses: [obrigada, quero, água, "por favor"] }
  - { pt: "Obrigado, eu tenho água aqui.", en: "Thank you, I have water here.", roles: [listen], uses: [obrigado, tenho, água] }
  - { pt: "Obrigada, eu gosto muito de café.", en: "Thank you, I really like coffee.", roles: [listen], uses: [obrigada, gosto, café] }
contrastSet: [{ set: [quero, quer], why: "Quero is what I say about myself, and quer is for você or for another person." }]
dialogue:
  npc: Bia
  turns:
    - npc: "Olá, Sam! Você quer um café?"
      gloss: "Hi, Sam! Do you want a coffee?"
      goal: "Say you want a coffee."
      options: ["Sim, eu quero um café.", "Sim, eu tenho um gato.", "Sim, eu sou estudante aqui."]
      correct: 0
    - npc: "Você quer água também?"
      gloss: "Do you want water too?"
      goal: "Build: order a water and a coffee"
      mode: build
      tiles: ["Eu", "quero", "uma", "água", "e", "um", "café", "quer", "mais"]
      answer: "Eu quero uma água e um café"
    - npc: "O café é com você, Sam! Sim ou não?"
      gloss: "The coffee is on you, Sam! Yes or no?"
      goal: "Say yes, and order one more coffee."
      options: ["Sim! E eu quero mais um café.", "Sim! E eu quero comer uma pizza.", "Sim! E eu tenho um amigo aqui."]
      correct: 0
