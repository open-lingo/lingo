  - { pt: "Posso pagar o ônibus com dinheiro?", en: "Can I pay for the bus with cash?", roles: ["cloze:posso"], uses: [posso, pagar, ônibus, dinheiro], why: "Sam is asking about himself, so the eu form posso is the one that fits." }
  - { pt: "Você pode repetir mais devagar, por favor?", en: "Can you repeat that more slowly, please?", roles: ["cloze:pode", listen], uses: [pode, repetir, devagar], why: "The subject here is você, and você always takes pode." }
