lesson: 2
id: pt-m1-l2
title: "De onde você é?"
grammar: "ser + de (origin); do/da contractions"
infoTitle: "De onde: do / da"
info: "Use 'de' to say where someone is from. 'De' contracts with 'o' (masc.) -> 'do' and with 'a' (fem.) -> 'da': sou do Brasil, sou da França."
allow: [a, o, ou, não, e]
words:
  - { pt: de, en: "of / from", pos: particle }
  - { pt: onde, en: where, pos: adverb }
  - { pt: do, en: "from the (masc.) — de + o", pos: particle }
  - { pt: da, en: "from the (fem.) — de + a", pos: particle }
  - { pt: cidade, en: city, pos: noun, gender: f, emoji: "🏙", imageable: true }
  - { pt: país, en: country, pos: noun, gender: m, emoji: "🌍" }
  - { pt: França, en: France, pos: proper-noun, cognate: true }
  - { pt: Califórnia, en: California, pos: proper-noun, cognate: true }
recall: [sou, é, Brasil]
contrastSet: [[do, da]]
contrast: [{ a: do, b: da, note: "de+o (masc.) vs de+a (fem.) contraction" }]
sentences:
  - { pt: "De onde você é?", en: "Where are you from?", roles: [build, debut], uses: [de, onde] }
  - { pt: "Eu sou do Brasil.", en: "I am from Brazil.", roles: ["cloze:do", listen], uses: [do, Brasil] }
  - { pt: "Eu sou da França.", en: "I am from France.", roles: ["cloze:da", debut], uses: [da, França] }
  - { pt: "Onde é a França?", en: "Where is France?", roles: ["cloze:onde", listen], uses: [onde, França] }
  - { pt: "O país é o Brasil.", en: "The country is Brazil.", roles: [build, debut], uses: [país, Brasil] }
  - { pt: "A cidade não é a França.", en: "The city is not France.", roles: [build, debut], uses: [cidade, França] }
  - { pt: "A cidade não é o país.", en: "The city is not the country.", roles: ["cloze:cidade", listen], uses: [cidade, país] }
  - { pt: "Você é da Califórnia ou da França?", en: "Are you from California or from France?", roles: [speak, debut], uses: [Califórnia, de] }
  - { pt: "Eu não sou da Califórnia.", en: "I am not from California.", roles: ["cloze:da", listen], uses: [Califórnia, da] }
dialogue:
  npc: Pedro
  turns:
    - { npc: "De onde você é?", gloss: "Where are you from?", goal: "Say you are from Brazil.", options: ["Eu sou do Brasil.", "Eu sou da França."], correct: 0 }
win: { pt: "Eu sou do Brasil, e você?", en: "I am from Brazil, and you?" }
