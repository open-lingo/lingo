      gloss: "Hello, Sam! Does your mother live here?"
      goal: "Say where your mother lives"
      options: ["Não, minha mãe mora em São Paulo.", "Sim, eu tenho uma irmã em São Paulo.", "Não, eu não gosto muito de café."]
      correct: 0
    - npc: "E o seu pai? Ele mora com você?"
      gloss: "And your father? Does he live with you?"
      goal: "Build: say where your father lives"
      mode: build
      tiles: ["Meu", "pai", "mora", "em", "São", "Paulo", "minha", "sua"]
