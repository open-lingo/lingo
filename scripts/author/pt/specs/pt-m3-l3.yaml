    - npc: "Amanhã você vai de ônibus?"
      gloss: "Are you going by bus tomorrow?"
      goal: "Build: say you go by bus tomorrow"
      mode: build
      tiles: ["Vou", "de", "ônibus", "amanhã", "praia", "vamos"]
      answer: "Vou de ônibus amanhã"
    - npc: "Você vai para a praia ou para o hotel?"
      gloss: "Are you going to the beach or to the hotel?"
      goal: "Say you go to the hotel"
