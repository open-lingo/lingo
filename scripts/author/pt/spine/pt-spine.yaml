# PT course spine — machine form of docs/pt-spine-2026-09-18.md §4 (Fable, 2026-09-18).
# One entry per lesson. A lesson SPEC (scripts/author/pt/specs/pt-mN-lK.yaml) references
# `spine: pt-mN-lK` and inherits words/recall/contrast/win/scene; the writing lane
# supplies only `sentences:` and `dialogue:`. m1 is shipped and listed for recall only.
# words: pt | en | pos (noun needs gender + emoji) | rank = bank brRank | cognate: true = free win
# Toolkit support for `spine:` is lane PTTOOL4's job; until then copy the fields into the spec.
version: 2   # 2026-09-19: 8-word cap enforced (m2-2, m2-4, m3-5, m4-1 trimmed), falo → m2-5, "que horas são" chunk, "até amanhã" → m4-5, m2-6/m4-6 wins inside vocabulary, um recalled in m3-5
cast: { learner: Sam, recurring: [Bia, Pedro, Rafael], m2: "Dona Lúcia (café owner)", m3: "the bus attendant", m4: "Marina (guide)" }
