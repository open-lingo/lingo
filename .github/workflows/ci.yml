name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: unit tests
        run: npm run test:run
      - name: build
        run: npm run build
