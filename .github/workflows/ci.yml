name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # onnxruntime-node (via @huggingface/transformers) downloads CUDA binaries
  # from a Microsoft CDN in its postinstall; that fetch timed out twice on
  # 2026-09-17 and failed `npm ci`. The CPU binaries ship in the npm package
  # and nothing on CI runs the node ONNX path, so skip the download.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npx tsc --noEmit

  unit-tests:
    # Sharded 2-way (2026-09-17 project review, lane A5a —
    # docs/preflight-2026-09-17.md task 4). Local measurement on the same
    # commit found `unit tests` was 435-459s of a 593-609s `test` job
    # (73-75%) on a GitHub-hosted runner — CI's own per-step timings via
    # `gh run view --json jobs`, not the ~83s this repo sees on a fast local
    # Mac, which is why the old single-runner step felt far slower in CI
    # than `npm run preflight` does locally. `--shard` splits evenly and
    # exhaustively across the vitest `projects` config (verified locally:
    # `vitest list --shard=1/2` + `--shard=2/2` sum to the unsharded total,
    # no overlap, no gap) — the dominant stage is the one worth
    # parallelizing; typecheck/build stay single-runner since they are not.
    # UNVALIDATED AGAINST A REAL CI RUN as of this commit (lane A5a does not
    # push) — the estimate above is from the observed proportion, not a
    # measured sharded run; confirm wall time on the first real run and
    # adjust the shard count if it doesn't hold.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: emit content (gates read src/pub/content, which is generated, not tracked)
        run: npm run content:emit
      # Procedural-QA lexical sidecars (2026-09-17, lane A7f —
      # docs/procedural-qa-2026-09-17.md § Vacuity on CI): without these,
      # src/test/proceduralQa.test.ts's JA/KO questions that need JMdict or
      # the fugashi/kiwipiepy sidecars answer "n/a" for every step and the
      # ratchet passes VACUOUSLY (0 findings because 0 applicable, not
      # because content is clean) — the applicable-steps floor this lane
      # added exists specifically to turn that into a red CI run instead.
      - name: python 3.11 (for the JA/KO lexical sidecars)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: uv (cached wheel/build cache, keyed on the pin files)
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: |
            scripts/lexical/requirements-ja.txt
            scripts/lexical/requirements-ko.txt
            scripts/lexical/requirements-pt.txt
      - name: cache JMdict + Lexique lexical artifacts
        id: lexical-artifacts-cache
        uses: actions/cache@v4
        with:
          path: |
            artifacts/lexical/jmdict
            artifacts/lexical/lexique
          key: lexical-artifacts-${{ hashFiles('scripts/lexical/ja/fetch-jmdict.mjs', 'scripts/lexical/fr/fetch-lexique.mjs') }}
      - name: JA/KO/PT lexical sidecar venvs (fugashi+unidic-lite, kiwipiepy, simplemma+wordfreq — pins in scripts/lexical/requirements-*.txt)
        run: |
          set -euo pipefail
          cd scripts/lexical/ja
          uv venv .venv --python 3.11
          uv pip install --python .venv/bin/python -r ../requirements-ja.txt
          cd ../ko
          uv venv .venv --python 3.11
          uv pip install --python .venv/bin/python -r ../requirements-ko.txt
          cd ../pt
          uv venv .venv --python 3.11
          uv pip install --python .venv/bin/python -r ../requirements-pt.txt
      - name: fetch JMdict + Lexique lexical artifacts (sha256-pinned in the fetch scripts)
        if: steps.lexical-artifacts-cache.outputs.cache-hit != 'true'
        run: |
          node scripts/lexical/ja/fetch-jmdict.mjs
          node scripts/lexical/fr/fetch-lexique.mjs
      - name: unit tests (shard ${{ matrix.shard }}/2)
        run: npx vitest run --shard=${{ matrix.shard }}/2

  gates-nonempty:
    # Vacuity sweep 2026-09-17 (project review §3 "sweep for checks that
    # cannot fail", lane A5c). Lints the audited gate test files for
    # describe.each(/it.each(/for-of over a collector with no non-empty
    # floor anywhere in the file — the class P1b found live in two
    # sim-capture verdicts and this lane found in ~12 gate `it()` blocks.
    # Pure node:fs grep, no deps beyond node itself; measured ~30ms locally,
    # well under the 10s this lane was told to gate on, so it runs
    # unconditionally rather than only on a content/code diff.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: vacuity lint (gate files iterate a non-empty collection)
        run: npm run test:gates-nonempty

  build:
    needs: [typecheck, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: emit content (gates read src/pub/content, which is generated, not tracked)
        run: npm run content:emit
      - name: build
        run: npm run build

  mobile-e2e:
    # Per-push mobile check = the axe a11y gate. The full public render gate
    # (research §6) runs nightly in nightly-render-gate.yml. Runs after build (which itself needs
    # typecheck + both unit-test shards green). Without a valid Auth0
    # storageState in CI it exercises the always-green PUBLIC-route subset
    # (MOBILE_PUBLIC_ONLY=1) — overflow (1), off-right-edge (2), and render-error
    # (7) assertions hard-fail; tap-target (3) warns and cta-in-fold (4) ratchets
    # per route as the src markup lands. The authed matrix runs locally where
    # `.auth/user.json` exists.
    needs: build
    runs-on: ubuntu-latest
    env:
      MOBILE_PUBLIC_ONLY: "1"
      # The SPA's Auth0Provider throws at boot if these are unset (src/shared/
      # auth/config.ts). Public routes never invoke a real Auth0 redirect, so
      # format-valid placeholders are enough for the always-green gate. Swap for
      # repo `vars` if the authed matrix is ever run in CI.
      VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN || 'example.us.auth0.com' }}
      VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID || 'ci-placeholder' }}
      VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE || 'https://api.example.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: install playwright chromium
        run: npx playwright install --with-deps chromium
      - name: emit content (lesson routes fetch src/pub/content/v1, which is generated, not tracked)
        run: npm run content:emit
      # The 8.4-minute public render gate moved to nightly-render-gate.yml on
      # 2026-09-17 (Spencer: CI per push was 10-14 min, mostly this step). The
      # axe gate below is the per-push mobile check (~90 s).
      - name: axe a11y gate
        # 2026-09-17 accessibility audit (docs/accessibility-2026-09-17.md):
        # same job, same dev-auth-bypass server the mobile gate above already
        # starts (`a11y` project's baseURL is MOBILE_URL in playwright.config.ts,
        # independent of MOBILE_PUBLIC_ONLY — that flag only gates which
        # assertions the *mobile* specs run, not which server axe uses), so no
        # extra env beyond what's already set on this job. Four routes, zero
        # violations required (learn map, build_sentence, multiple_choice,
        # settings modal) — a regression here fails CI instead of shipping.
        run: npm run test:a11y
      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
