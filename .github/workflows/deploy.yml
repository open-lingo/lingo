name: deploy

# Builds the SPA and deploys to S3 + CloudFront on every push to main.
# Auth: GitHub OIDC -> ci-lingo-web role (no stored AWS keys). The role can
# only write to the site bucket and invalidate its distribution.
#
# Repo variables (Settings -> Secrets and variables -> Actions -> Variables):
#   VITE_API_BASE_URL       — lingo-core Lambda URL
#   VITE_OPS_API_BASE_URL   — lingo-ops Lambda URL
#   VITE_AUTH0_DOMAIN / VITE_AUTH0_CLIENT_ID / VITE_AUTH0_AUDIENCE
#   LINGO_S3_BUCKET         — target bucket name
#   LINGO_CLOUDFRONT_DIST_ID — for invalidation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required to mint the OIDC token
  contents: read

env:
  AWS_REGION: us-west-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_OPS_API_BASE_URL: ${{ vars.VITE_OPS_API_BASE_URL }}
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
        run: npm run build
      - name: upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: download bundle
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::349654078389:role/ci-lingo-web
          aws-region: ${{ env.AWS_REGION }}
      - name: sync to S3
        run: |
          # Hashed assets: cache forever (filenames change every build).
          #
          # `--exclude "tts/*"` is LOAD-BEARING, do not remove it. This sync
          # mirrors dist/ onto the bucket root with --delete, and the TTS audio
          # corpus (~14.7k mp3s under tts/) lives in the same bucket but is NOT
          # part of dist/ — it is published separately by lingo-data's
          # pipeline.tts.upload. Without this exclude, every deploy deletes the
          # entire audio corpus, and CloudFront keeps serving the stale cache
          # for a while so the breakage surfaces hours later as "some sounds
          # don't play". That happened on 2026-07-29.
          aws s3 sync dist/ "s3://${{ vars.LINGO_S3_BUCKET }}" \
            --delete \
            --exclude index.html \
            --exclude "tts/*" \
            --cache-control "public,max-age=31536000,immutable"
          # index.html: never cache — it's the pointer to the hashed assets.
          aws s3 cp dist/index.html "s3://${{ vars.LINGO_S3_BUCKET }}/index.html" \
            --cache-control "no-cache"
      - name: assert the TTS corpus survived the sync
        # Backstop for the --exclude above, and for any future tooling that
        # syncs this bucket. The audio corpus is not in dist/, so anything
        # mirroring dist/ with --delete will silently wipe it; CloudFront then
        # serves its cache for hours, so the damage is invisible at deploy time
        # and surfaces later as intermittently missing lesson audio.
        #
        # Failing here is much cheaper than discovering it from a user report:
        # re-publishing means re-uploading ~240 MB.
        run: |
          # `s3 ls --summarize` paginates for us. `list-objects-v2` with
          # --query 'length(Contents)' can report a single page, which would
          # make this guard lie once the corpus exceeds 1000 objects.
          COUNT=$(aws s3 ls "s3://${{ vars.LINGO_S3_BUCKET }}/tts/v1/" \
            --recursive --summarize 2>/dev/null \
            | awk '/Total Objects:/ {print $3}')
          COUNT=${COUNT:-0}
          echo "tts/v1 objects: $COUNT"
          if [ "$COUNT" -lt 10000 ]; then
            echo "::error::TTS audio corpus is missing or truncated ($COUNT objects under tts/v1/)."
            echo "Expected ~14.7k. Something deleted it — check for an s3 sync"
            echo "without --exclude \"tts/*\". Re-publish from lingo-data:"
            echo "  python -m pipeline.tts.upload --revision <lingo-sha>"
            exit 1
          fi

      - name: invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.LINGO_CLOUDFRONT_DIST_ID }}" \
            --paths "/index.html" "/"
      - name: verify site responds
        run: |
          sleep 10
          status=$(curl -s -o /dev/null -w "%{http_code}" https://openlingoapp.com)
          echo "Site returned HTTP $status"
          test "$status" = "200"
