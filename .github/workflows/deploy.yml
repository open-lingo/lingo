name: deploy

# Builds the SPA and deploys to S3 + CloudFront on every push to main.
# Auth: GitHub OIDC -> ci-lingo-web role (no stored AWS keys). The role can
# only write to the site bucket and invalidate its distribution.
#
# Repo variables (Settings -> Secrets and variables -> Actions -> Variables):
#   VITE_API_BASE_URL       — lingo-core Lambda URL
#   VITE_OPS_API_BASE_URL   — lingo-ops Lambda URL
#   VITE_AUTH0_DOMAIN / VITE_AUTH0_CLIENT_ID / VITE_AUTH0_AUDIENCE
#   VITE_MARKETING_ORIGIN   — marketing site origin (anon users are sent here)
#   LINGO_S3_BUCKET         — target bucket name
#   LINGO_CLOUDFRONT_DIST_ID — for invalidation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required to mint the OIDC token
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip # see ci.yml — CUDA download timed out twice on 2026-09-17
  AWS_REGION: us-west-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Gate the deploy on the same checks CI runs.
      #
      # `ci` and `deploy` both trigger on push to main, INDEPENDENTLY — so a
      # red build shipped to production anyway. That is not hypothetical: the
      # stale-lesson-id ratchet failed on main for multiple pushes while every
      # one of those commits deployed (2026-07-31).
      #
      # Done as steps in this job rather than a `workflow_run` trigger: that
      # trigger would need `ref: head_sha` handling and, misconfigured, stops
      # deploys silently. This cannot break the trigger, and it reuses the
      # checkout + npm ci already here. Cost is deploy latency — it now waits
      # for the suite. CI still runs in parallel for PR feedback.
      - name: typecheck
        run: npx tsc --noEmit
      - name: emit content (gates read src/pub/content, which is generated, not tracked)
        run: npm run content:emit
      # Procedural-QA lexical sidecars (2026-09-17, lane A7f —
      # docs/procedural-qa-2026-09-17.md § Vacuity on CI). Same rationale
      # and step shape as .github/workflows/ci.yml's `unit-tests` job —
      # without these, `npm run test:run` (which includes
      # src/test/proceduralQa.test.ts) would pass the JA/KO sidecar-backed
      # questions VACUOUSLY instead of actually grading them.
      - name: python 3.11 (for the JA/KO lexical sidecars)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: uv (cached wheel/build cache, keyed on the pin files)
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: |
            scripts/lexical/requirements-ja.txt
            scripts/lexical/requirements-ko.txt
            scripts/lexical/requirements-pt.txt
      - name: cache JMdict + Lexique lexical artifacts
        id: lexical-artifacts-cache
        uses: actions/cache@v4
        with:
          path: |
            artifacts/lexical/jmdict
            artifacts/lexical/lexique
          key: lexical-artifacts-${{ hashFiles('scripts/lexical/ja/fetch-jmdict.mjs', 'scripts/lexical/fr/fetch-lexique.mjs') }}
      - name: JA/KO/PT lexical sidecar venvs (fugashi+unidic-lite, kiwipiepy, simplemma+wordfreq — pins in scripts/lexical/requirements-*.txt)
        run: |
          set -euo pipefail
          cd scripts/lexical/ja
          uv venv .venv --python 3.11
          uv pip install --python .venv/bin/python -r ../requirements-ja.txt
          cd ../ko
          uv venv .venv --python 3.11
          uv pip install --python .venv/bin/python -r ../requirements-ko.txt
          cd ../pt
          uv venv .venv --python 3.11
          uv pip install --python .venv/bin/python -r ../requirements-pt.txt
      - name: fetch JMdict + Lexique lexical artifacts (sha256-pinned in the fetch scripts)
        if: steps.lexical-artifacts-cache.outputs.cache-hit != 'true'
        run: |
          node scripts/lexical/ja/fetch-jmdict.mjs
          node scripts/lexical/fr/fetch-lexique.mjs
      - name: unit tests
        run: npm run test:run
      - name: build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_OPS_API_BASE_URL: ${{ vars.VITE_OPS_API_BASE_URL }}
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
          VITE_MARKETING_ORIGIN: ${{ vars.VITE_MARKETING_ORIGIN }}
        run: npm run build
      - name: upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
      # Staged audio (tts-publish/README.md). The README is committed, so
      # this artifact always exists and the deploy job's download never
      # fails on an empty wave.
      - name: upload staged tts artifact
        uses: actions/upload-artifact@v4
        with:
          name: tts-publish
          path: tts-publish/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: download bundle
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: download staged tts
        uses: actions/download-artifact@v4
        with:
          name: tts-publish
          path: tts-publish/
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::349654078389:role/ci-lingo-web
          aws-region: ${{ env.AWS_REGION }}
      - name: sync to S3
        run: |
          # Hashed assets: cache forever (filenames change every build).
          #
          # `assets/` is synced SEPARATELY, WITHOUT --delete (see the "prune
          # old hashed assets" step below) — prod #86, 2026-09-14. A tab left
          # open across a deploy still references the PREVIOUS build's chunk
          # hashes (e.g. ProtectedHome-DlN-DvKc.js) for any route it hasn't
          # navigated to yet; `--delete` here removed that object the instant
          # this step ran, so the next lazy navigation in that tab fetched a
          # 403/404 that CloudFront maps to index.html with a 200 — the chunk
          # came back as 5 KB of `text/html`, which is what "Failed to fetch
          # dynamically imported module" meant. The prune step below deletes
          # orphaned hashed assets on a 7-day delay instead, which is long
          # enough that no realistically-long-open tab still needs them.
          # `content/v1/*` hashed module JSONs get the same treatment for the
          # same reason (content-as-data, 2026-09-13) — only the manifest
          # under content/v1/ is mutable/excluded here, the hashed module
          # files are not, so they were exposed to the identical bug.
          #
          # `--exclude "tts/*"` is LOAD-BEARING, do not remove it. This sync
          # mirrors dist/ onto the bucket root with --delete, and the TTS audio
          # corpus (~14.7k mp3s under tts/) lives in the same bucket but is NOT
          # part of dist/ — it is published separately by lingo-data's
          # pipeline.tts.upload. Without this exclude, every deploy deletes the
          # entire audio corpus, and CloudFront keeps serving the stale cache
          # for a while so the breakage surfaces hours later as "some sounds
          # don't play". That happened on 2026-07-29.
          aws s3 sync dist/ "s3://${{ vars.LINGO_S3_BUCKET }}" \
            --delete \
            --exclude index.html \
            --exclude sw.js \
            --exclude manifest.webmanifest \
            --exclude boot-guard.js \
            --exclude "assets/*" \
            --exclude "content/v1/*" \
            --exclude "tts/*" \
            --cache-control "public,max-age=31536000,immutable"
          # Hashed assets + hashed content JSONs: same cache-control, but no
          # --delete — see the comment above and the prune step below.
          aws s3 sync dist/assets/ "s3://${{ vars.LINGO_S3_BUCKET }}/assets/" \
            --cache-control "public,max-age=31536000,immutable"
          if [ -d dist/content/v1 ]; then
            aws s3 sync dist/content/v1/ "s3://${{ vars.LINGO_S3_BUCKET }}/content/v1/" \
              --exclude "manifest.json" \
              --cache-control "public,max-age=31536000,immutable"
          fi
          # index.html: never cache — it's the pointer to the hashed assets.
          aws s3 cp dist/index.html "s3://${{ vars.LINGO_S3_BUCKET }}/index.html" \
            --cache-control "no-cache"
          # boot-guard.js: the white-screen watchdog (src/pub/, unhashed URL,
          # loaded by index.html before the module graph). Same stable-URL
          # reason as sw.js — immutable here would pin every client to the
          # first version they ever fetched.
          aws s3 cp dist/boot-guard.js "s3://${{ vars.LINGO_S3_BUCKET }}/boot-guard.js" \
            --cache-control "no-cache"
          # sw.js: MUST revalidate. The browser re-fetches the service worker
          # on navigation to discover updates — an immutable-cached sw.js
          # pins every installed client to this build's precache forever.
          # manifest.webmanifest rides along for the same stable-URL reason.
          aws s3 cp dist/sw.js "s3://${{ vars.LINGO_S3_BUCKET }}/sw.js" \
            --cache-control "no-cache"
          # Lesson content manifest (content-as-data, 2026-09-13): the one
          # mutable file under /content/ — every module file is content-hashed
          # and immutable, the manifest names the current set. Same treatment
          # as sw.js: never cached by the browser, invalidated below.
          aws s3 cp dist/content/v1/manifest.json \
            "s3://${{ vars.LINGO_S3_BUCKET }}/content/v1/manifest.json" \
            --cache-control "no-cache" --content-type "application/json"
          aws s3 cp dist/manifest.webmanifest \
            "s3://${{ vars.LINGO_S3_BUCKET }}/manifest.webmanifest" \
            --content-type "application/manifest+json" \
            --cache-control "no-cache"

      - name: prune old hashed assets
        # `assets/` and the hashed `content/v1/` module JSONs are synced
        # above WITHOUT --delete (prod #86, 2026-09-14): a tab left open
        # across a deploy keeps referencing the PREVIOUS build's chunk
        # hashes (e.g. ProtectedHome-DlN-DvKc.js) for any route it hasn't
        # navigated to yet. Deleting them the instant a new build lands
        # broke every lazy navigation in that tab — CloudFront maps the
        # resulting 403/404 to index.html with a 200, so the missing chunk
        # comes back as 5 KB of `text/html` and every lazyRetry attempt
        # fails against it ("Failed to fetch dynamically imported module").
        #
        # They can't accumulate forever either, so this prunes on a delay
        # instead of on every deploy: an object under assets/ or
        # content/v1/ is deleted only when (a) it is NOT part of THIS
        # build's dist/ output, and (b) it is older than 7 days — long
        # enough that no realistically-long-open tab still needs it.
        # Cost math: ~33 MB of hashed assets per build x ~2 deploys/day x
        # 7 days of retention ~= 0.5 GB steady state — cents per month at
        # S3 standard pricing.
        run: |
          set -euo pipefail
          BUCKET="${{ vars.LINGO_S3_BUCKET }}"
          CUTOFF=$(date -u -d '7 days ago' +%s)

          # $1 = S3 prefix (e.g. "assets/"), $2 = matching local dist dir,
          # $3 = extended-regex of relative paths to NEVER prune (may be
          # empty) — used to keep content/v1/manifest.json out of this
          # entirely; it's mutable and already handled by its own `aws s3
          # cp ... --cache-control no-cache` step above.
          prune_prefix() {
            local prefix="$1" local_dir="$2" keep_pattern="$3"

            local current_keys
            current_keys=$(cd "$local_dir" && find . -type f | sed 's#^\./##' | sort)

            local to_delete=()
            while IFS=$'\t' read -r key last_modified; do
              [ -z "$key" ] && continue
              local rel="${key#"$prefix"}"
              if [ -n "$keep_pattern" ] && [[ "$rel" =~ $keep_pattern ]]; then
                continue
              fi
              if printf '%s\n' "$current_keys" | grep -qxF "$rel"; then
                continue # still part of this build's output
              fi
              local clean_mtime mtime
              clean_mtime=$(echo "$last_modified" | sed -E 's/\.[0-9]+\+/+/')
              mtime=$(date -u -d "$clean_mtime" +%s)
              if [ "$mtime" -lt "$CUTOFF" ]; then
                to_delete+=("$key")
              fi
            done < <(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "$prefix" \
                        --query 'Contents[].[Key,LastModified]' --output text 2>/dev/null || true)

            echo "prune $prefix: ${#to_delete[@]} object(s) older than 7 days and not in this build"
            [ "${#to_delete[@]}" -eq 0 ] && return 0

            local i=0
            while [ "$i" -lt "${#to_delete[@]}" ]; do
              local batch=("${to_delete[@]:$i:1000}")
              local objects_json
              objects_json=$(printf '%s\n' "${batch[@]}" \
                | jq -R -s -c 'split("\n") | map(select(length > 0)) | {Objects: map({Key: .}), Quiet: true}')
              aws s3api delete-objects --bucket "$BUCKET" --delete "$objects_json"
              i=$((i + 1000))
            done
          }

          prune_prefix "assets/" "dist/assets" ""
          if [ -d dist/content/v1 ]; then
            prune_prefix "content/v1/" "dist/content/v1" '^manifest\.json$'
          fi

      - name: publish staged TTS audio
        # Clips authored since the last corpus publish ride the deploy so a
        # manifest update can never land without its audio (2026-08-15: M31
        # shipped hashes whose mp3s were still local-only; every one served
        # the SPA shell as text/html). Layout: tts-publish/ja/<hash>.mp3 →
        # tts/v1/ja/<hash>.mp3. NEVER add --delete here — the live corpus
        # (~14.7k objects) is not in this directory (2026-07-29 incident).
        run: |
          aws s3 sync tts-publish/ "s3://${{ vars.LINGO_S3_BUCKET }}/tts/v1/" \
            --exclude "*" --include "*.mp3" \
            --content-type "audio/mpeg" \
            --cache-control "public,max-age=31536000,immutable"

      - name: assert the TTS corpus survived the sync
        # Backstop for the --exclude above, and for any future tooling that
        # syncs this bucket. The audio corpus is not in dist/, so anything
        # mirroring dist/ with --delete will silently wipe it; CloudFront then
        # serves its cache for hours, so the damage is invisible at deploy time
        # and surfaces later as intermittently missing lesson audio.
        #
        # Failing here is much cheaper than discovering it from a user report:
        # re-publishing means re-uploading ~240 MB.
        run: |
          # `s3 ls --summarize` paginates for us. `list-objects-v2` with
          # --query 'length(Contents)' can report a single page, which would
          # make this guard lie once the corpus exceeds 1000 objects.
          COUNT=$(aws s3 ls "s3://${{ vars.LINGO_S3_BUCKET }}/tts/v1/" \
            --recursive --summarize 2>/dev/null \
            | awk '/Total Objects:/ {print $3}')
          COUNT=${COUNT:-0}
          echo "tts/v1 objects: $COUNT"
          if [ "$COUNT" -lt 10000 ]; then
            echo "::error::TTS audio corpus is missing or truncated ($COUNT objects under tts/v1/)."
            echo "Expected ~14.7k. Something deleted it — check for an s3 sync"
            echo "without --exclude \"tts/*\". Re-publish from lingo-data:"
            echo "  python -m pipeline.tts.upload --revision <lingo-sha>"
            exit 1
          fi

      - name: invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.LINGO_CLOUDFRONT_DIST_ID }}" \
            --paths "/index.html" "/" "/sw.js" "/manifest.webmanifest" "/content/v1/manifest.json"
      - name: verify site serves THIS deploy
        # A 200 alone proves nothing — the edge happily serves a stale (or
        # older, coherent) bundle while a deploy half-lands. Assert the live
        # index.html references the same entry chunk as the dist/ we just
        # uploaded, retrying while the invalidation propagates.
        run: |
          built=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          echo "built entry: $built"
          test -n "$built"
          for i in $(seq 1 9); do
            served=$(curl -s https://app.openlingoapp.com/index.html \
              | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1) || true
            echo "attempt $i: served entry: ${served:-<none>}"
            if [ "$served" = "$built" ]; then
              status=$(curl -s -o /dev/null -w "%{http_code}" "https://app.openlingoapp.com/$built")
              echo "entry chunk fetch: HTTP $status"
              test "$status" = "200" && exit 0
            fi
            sleep 20
          done
          echo "::error::Live site never served this deploy's index.html (built $built)."
          exit 1
