name: deploy

# Placeholder web deploy. The real plan is S3 + CloudFront + WAF.
# Today: builds the SPA bundle so we catch build errors on every push,
# but doesn't upload anywhere. Replace the "deploy to S3" job body
# when the bucket + distribution land in lingo-infra.
#
# Requires org secrets when S3 upload lands:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
# Plus repo variables (set later):
#   LINGO_S3_BUCKET           — target bucket name
#   LINGO_CLOUDFRONT_DIST_ID  — for invalidation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: build
        env:
          # Wire when prod APIs are deployed:
          #   VITE_API_BASE_URL=${{ vars.LINGO_API_BASE_URL }}
          #   VITE_OPS_API_BASE_URL=${{ vars.LINGO_OPS_API_BASE_URL }}
          VITE_API_BASE_URL: ${{ vars.LINGO_API_BASE_URL }}
          VITE_OPS_API_BASE_URL: ${{ vars.LINGO_OPS_API_BASE_URL }}
        run: npm run build
      - name: upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: download bundle
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: deploy (placeholder)
        run: |
          echo "::notice::Web deploy is a placeholder pending S3 + CloudFront migration."
          echo "Bundle ready in dist/ (uploaded as artifact for inspection)."
          echo "When the bucket lands, this step becomes:"
          echo "  aws s3 sync dist/ s3://\$LINGO_S3_BUCKET --delete --cache-control 'public,max-age=31536000'"
          echo "  aws s3 cp dist/index.html s3://\$LINGO_S3_BUCKET/index.html --cache-control 'no-cache'"
          echo "  aws cloudfront create-invalidation --distribution-id \$LINGO_CLOUDFRONT_DIST_ID --paths '/index.html'"
          ls -lah dist/ | head -20
