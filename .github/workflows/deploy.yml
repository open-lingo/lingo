name: deploy

# Builds the SPA and deploys to S3 + CloudFront on every push to main.
# Auth: GitHub OIDC -> ci-lingo-web role (no stored AWS keys). The role can
# only write to the site bucket and invalidate its distribution.
#
# Repo variables (Settings -> Secrets and variables -> Actions -> Variables):
#   VITE_API_BASE_URL       — lingo-core Lambda URL
#   VITE_OPS_API_BASE_URL   — lingo-ops Lambda URL
#   VITE_AUTH0_DOMAIN / VITE_AUTH0_CLIENT_ID / VITE_AUTH0_AUDIENCE
#   LINGO_S3_BUCKET         — target bucket name
#   LINGO_CLOUDFRONT_DIST_ID — for invalidation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required to mint the OIDC token
  contents: read

env:
  AWS_REGION: us-west-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_OPS_API_BASE_URL: ${{ vars.VITE_OPS_API_BASE_URL }}
          VITE_AUTH0_DOMAIN: ${{ vars.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.VITE_AUTH0_AUDIENCE }}
        run: npm run build
      - name: upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: download bundle
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::349654078389:role/ci-lingo-web
          aws-region: ${{ env.AWS_REGION }}
      - name: sync to S3
        run: |
          # Hashed assets: cache forever (filenames change every build).
          aws s3 sync dist/ "s3://${{ vars.LINGO_S3_BUCKET }}" \
            --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          # index.html: never cache — it's the pointer to the hashed assets.
          aws s3 cp dist/index.html "s3://${{ vars.LINGO_S3_BUCKET }}/index.html" \
            --cache-control "no-cache"
      - name: invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.LINGO_CLOUDFRONT_DIST_ID }}" \
            --paths "/index.html" "/"
      - name: verify site responds
        run: |
          sleep 10
          status=$(curl -s -o /dev/null -w "%{http_code}" https://openlingoapp.com)
          echo "Site returned HTTP $status"
          test "$status" = "200"
