<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-adsense-account" content="ca-pub-2631003204942047" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Only the always-needed fonts ship up-front:
        - Instrument Sans is the default UI font (2026-08-03). Eager, not lazy:
          it is the body face on every screen, so a lazy fetch would flash the
          system stack on first paint. Same face as the marketing site, so the
          type does not change crossing from the apex into the app.
        - Noto Sans JP is required wherever kana renders (every JA lesson).
        - Noto Sans KR is required wherever Hangul renders (KO learner).
      All other fonts (Inter / Open Sans / Source Sans 3 / Nunito / Lora /
      Fraunces / Atkinson Hyperlegible) lazy-load via shared/theme/fontLoader.ts
      the first time the user picks them.
    -->
    <!--
      Weight set trimmed to 400 + 700 (was 400;500;600;700;800 per family).
      Saves 6 webfont files on every JA/KO first paint. Browser synthesizes
      intermediate weights from the loaded 700 for the rare 500/600/800 cases.
    -->
    <!--
      Loaded as a PRELOAD, not a stylesheet: a <link rel="stylesheet"> to a
      third-party host is render-blocking AND blocks every later <script>
      (including boot-guard.js) until it loads or times out. On a captive
      portal / flaky mobile link that request can hang for minutes — measured
      544 s in the headless QA harness — and the app shows pure white the whole
      time (TestFlight #64 shape). boot-guard.js flips rel→stylesheet at boot
      (both links below); a script-inserted stylesheet never blocks paint.
    -->
    <link id="lingo-fonts-latin" rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" />
    <!--
      Noto Sans JP / Noto Sans KR get their OWN link with display=OPTIONAL,
      not swap (TestFlight b13 #107, Spencer: "kanji sized up very slightly
      between switching over" on the flashcard reviewer). Root cause, measured
      via Playwright with the Google Fonts request delayed 2.5s to reproduce a
      cold/slow load: the fallback stack (Inter/ui-sans-serif/system-ui) and
      Noto Sans JP report different ascent+descent for the SAME glyphs, and a
      `ruby` element (kanji + furigana, `KanjiRuby.tsx`) sizes its box from
      those metrics directly, ignoring the parent's fixed `line-height` — so
      the box measurably grows the instant Noto Sans JP finishes loading and
      `swap` repaints it in. Measured on the ja-course tsukareru card (390×844
      Chromium, `.kanji-ruby` bounding box): 90×51.66px on the fallback →
      90×54.66px after the swap (+3px height, +5.8%) — a visible "kanji sizes
      up" jump mid-review, worse on a real device's slower/colder font fetch.
      `optional` removes the SWAP, not the font: the browser paints with
      whichever face (fallback or Noto Sans JP) is ready inside its very short
      initial block window and commits to it for that paint — no later resize.
      Noto Sans JP is still preloaded exactly as before, so on every load but
      the very first on a slow network the learner gets it immediately; a
      first-load-on-slow-network learner sees the OS's own CJK fallback
      (Hiragino/Yu Gothic/Malgun Gothic — kana/kanji/hangul still render, just
      not in Noto Sans JP) for that session, never a mid-card jump. Split into
      its own link — Google Fonts' `display` param is per-request, and
      Instrument Sans (the always-visible-immediately UI body face, see above)
      must keep `swap` so a slow fetch still resolves it rather than sticking
      on the system stack for the whole session.
    -->
    <link id="lingo-fonts-cjk" rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=optional" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="/icon.ico" />
    <!-- Home-screen install. Icons come from `scripts/generate-icons.mjs`.
         ⚠️ `start_url: "/"` is only safe because routes/MarketingRedirect.tsx
         detects standalone display and sends anonymous users to the in-app
         /login instead of the marketing origin — a cross-origin navigation
         breaks OUT of an installed app. Don't remove that branch alone.
         Both theme-color and status-bar rationale: docs/ios-wrapper-setup-2026-08-06.md -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f0e6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171310" />
    <!-- `apple-` form is deprecated but still the only one iOS honours. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Open Lingo" />
    <!-- ⚠️ `default`, not `black-translucent`: translucent puts content under
         the status bar and the safe-area insets aren't hardware-verified yet. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Open Lingo</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Classic script, before the module graph: paints a Reload fallback if
         React never mounts or later unmounts the root (blank white screen,
         TestFlight #64). See src/pub/boot-guard.js. -->
    <script src="/boot-guard.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
