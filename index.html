<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-adsense-account" content="ca-pub-2631003204942047" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Only the always-needed fonts ship up-front:
        - Default UI font is the system stack (no network, see fontLoader.ts).
        - Noto Sans JP is required wherever kana renders (every JA lesson).
        - Noto Sans KR is required wherever Hangul renders (KO learner).
      All other display fonts (Inter / Open Sans / Source Sans 3 / Nunito /
      Lora / Atkinson Hyperlegible) lazy-load via shared/theme/fontLoader.ts
      the first time the user picks them.
    -->
    <!--
      Weight set trimmed to 400 + 700 (was 400;500;600;700;800 per family).
      Saves 6 webfont files on every JA/KO first paint. Browser synthesizes
      intermediate weights from the loaded 700 for the rare 500/600/800 cases.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/icon.ico" />
    <title>Open Lingo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
